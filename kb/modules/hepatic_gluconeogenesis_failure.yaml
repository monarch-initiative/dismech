notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g. "hepatic_gluconeogenesis_failure#Failure
  of Hepatic De Novo Glucose Production").


  Curation guardrail - do NOT create a "Hepatic Gluconeogenesis Failure" Disease
  entry for this module. It factors out the shared mechanism of the gluconeogenic
  enzymopathies and moves no entity boundary; the individual enzyme deficiencies
  remain separate disease entries.


  WHERE EACH CONFORMER ATTACHES. The trigger node (Gluconeogenic Flux Block) is
  deliberately generic so that any of the four enzyme blocks attaches to it. The
  central effector (Failure of Hepatic De Novo Glucose Production) is the
  gene-agnostic convergence every conformer funnels through. Note one accuracy
  point a conformer must respect: PC, PEPCK/PCK1, and FBP1 act upstream of free
  glucose-6-phosphate, whereas G6PC blocks the terminal dephosphorylation of
  glucose-6-phosphate to glucose - so all four fail hepatic glucose production,
  but G6PC also impairs glycogenolytic glucose release, which is modelled in the
  Glycogen_Storage_Disease_Type_I entry rather than here. The substrate-backup
  reading of the lactic-acidosis branch, a disabled gluconeogenic sink that can
  no longer recycle lactate to glucose, fits the pure gluconeogenic enzymes FBP1
  and PEPCK best, with FBP1 the cleanest case. PC deficiency also produces lactic
  acidosis, but substantially through anaplerotic failure (pyruvate cannot enter
  the TCA cycle via oxaloacetate) and it can occur without hypoglycemia, so PC's
  lactic acidosis is only partly a substrate-backup phenomenon; GSD Ia (G6PC)
  lactate is driven mostly by glucose-6-phosphate shunted into glycolysis. A
  conformer should attach the substrate-accumulation branch only where its own
  biochemistry supports it.


  SUBSTRATE-ACCUMULATION SCALE. Ketosis frequently accompanies the hypoglycemia
  of the upstream enzyme blocks and is clinically useful for distinguishing them,
  but ketogenesis is a separate downstream process and is deliberately not
  modelled as a node here; a conforming entry carries it in its own
  pathophysiology if relevant.
pathophysiology:
- name: Gluconeogenic Flux Block
  description: >-
    A loss-of-function lesion in one of the rate-controlling gluconeogenic
    enzymes - pyruvate carboxylase, cytosolic phosphoenolpyruvate carboxykinase,
    fructose-1,6-bisphosphatase, or glucose-6-phosphatase - interrupts carbon
    flux through the hepatic gluconeogenic pathway. Conforming entries substitute
    the specific enzyme and its position on the pathway.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:25246452
    reference_title: "Fructose-1,6-diphosphatase deficiency: a treatable neurometabolic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "however, strictly speaking it is a defect of gluconeogenesis"
    explanation: Establishes that a gluconeogenic enzyme deficiency is, mechanistically, a block of the gluconeogenic pathway.
  - reference: PMID:28649521
    reference_title: "Pyruvate carboxylase deficiency: An underestimated cause of lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyruvate carboxylase (PC) is a biotin-containing mitochondrial enzyme that catalyzes the conversion of pyruvate to oxaloacetate, thereby being involved in gluconeogenesis"
    explanation: A worked conformer - loss of a single gluconeogenic enzyme removes a committed step of the pathway.
  downstream:
  - target: Failure of Hepatic De Novo Glucose Production
    causal_link_type: DIRECT
    description: >-
      Blocking any committed step of the pathway prevents the net synthesis of
      glucose from its precursors.
- name: Failure of Hepatic De Novo Glucose Production
  description: >-
    With any committed step blocked, the hepatocyte can no longer synthesize new
    glucose from three-carbon precursors. This is the gene-agnostic,
    rate-limiting convergence every conforming disorder funnels through, whatever
    the specific enzyme lesion. PC, PEPCK, and FBP1 fail to build free
    glucose-6-phosphate, while G6PC fails to dephosphorylate it to glucose; both
    routes abolish net de novo glucose production.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:28731034
    reference_title: Regulation of hepatic glucose metabolism in health and disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "it produces glucose during fasting and stores glucose postprandially"
    explanation: Establishes de novo glucose production as the hepatic function this node represents as failed.
  - reference: PMID:28216384
    reference_title: "Novel homozygous PCK1 mutation causing cytosolic phosphoenolpyruvate carboxykinase deficiency presenting as childhood hypoglycemia, an abnormal pattern of urine metabolites and liver dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cytosolic PEPCK deficiency should be considered in the differential diagnosis of children presenting with hypoglycemia, hepatic dysfunction"
    explanation: A worked conformer - loss of the gluconeogenic enzyme PCK1 produces hypoglycemia through failed hepatic glucose production.
  downstream:
  - target: Reduced Hepatic Glucose Output
    causal_link_type: DIRECT
    description: >-
      Glucose that is not synthesized cannot be released into the circulation.
  - target: Accumulation of Gluconeogenic Three-Carbon Substrates
    causal_link_type: DIRECT
    description: >-
      Precursors that would normally be drawn into glucose synthesis are no
      longer consumed and accumulate upstream of the block.
- name: Reduced Hepatic Glucose Output
  description: >-
    The liver fails to release glucose into the circulation during fasting.
    Hepatic gluconeogenesis is one of the fluxes summed into net hepatic glucose
    production, so losing it lowers the glucose the liver can supply once dietary
    intake stops and glycogen stores are depleted.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:28731034
    reference_title: Regulation of hepatic glucose metabolism in health and disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Net hepatic glucose production is the summation of glucose fluxes from gluconeogenesis, glycogenolysis, glycogen synthesis, glycolysis and other pathways."
    explanation: Establishes gluconeogenesis as a component of net hepatic glucose output, so its loss reduces that output.
  downstream:
  - target: Fasting Hypoglycemia
    causal_link_type: DIRECT
    description: >-
      Insufficient hepatic glucose release cannot maintain blood glucose through
      a fast.
- name: Fasting Hypoglycemia
  description: >-
    Once dietary glucose and glycogen stores are exhausted, the loss of hepatic
    glucose output causes blood glucose to fall during fasting or catabolic
    stress (fever, intercurrent illness, reduced intake).
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:25246452
    reference_title: "Fructose-1,6-diphosphatase deficiency: a treatable neurometabolic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is manifested by the appearance of hypoglycaemia, ketosis and lactic acidosis (neonatally or later during fasting or induced by fructose)"
    explanation: Documents fasting-precipitated hypoglycemia as a manifestation of a gluconeogenic enzyme block.
  - reference: PMID:27139513
    reference_title: "Tophaceous gout in a female premenopausal patient with an unexpected diagnosis of glycogen storage disease type Ia: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypoglycaemia, hypertriglyceridaemia, lactic acidosis, and hepatomegaly were noted"
    explanation: A worked G6PC conformer showing hypoglycemia alongside lactic acidosis.
  downstream:
  - target: CNS Glucose Deprivation
    causal_link_type: DIRECT
    description: >-
      Low blood glucose reduces the glucose available to the brain, which
      depends on it as its obligate fuel.
- name: Accumulation of Gluconeogenic Three-Carbon Substrates
  description: >-
    Three-carbon precursors that would normally be consumed by gluconeogenesis -
    pyruvate, lactate, alanine, and glycerol - accumulate upstream of the enzyme
    block. The accumulation is most prominent for the enzymes nearest pyruvate
    (PC, PEPCK), where the entry steps of the pathway are blocked.
  role: amplifier
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:34150393
    reference_title: A Unique Case of Pyruvate Carboxylase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated levels of pyruvate and alanine in plasma"
    explanation: Documents accumulation of the three-carbon gluconeogenic precursors upstream of a gluconeogenic enzyme block.
  - reference: PMID:28216384
    reference_title: "Novel homozygous PCK1 mutation causing cytosolic phosphoenolpyruvate carboxykinase deficiency presenting as childhood hypoglycemia, an abnormal pattern of urine metabolites and liver dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transient elevation of alanine transaminase, lactate and tricarboxylic acid cycle intermediates"
    explanation: Shows accumulation of lactate and related intermediates upstream of a gluconeogenic enzyme block.
  downstream:
  - target: Lactate Overproduction
    causal_link_type: DIRECT
    description: >-
      Accumulated pyruvate is reduced to lactate, raising blood lactate.
- name: Lactate Overproduction
  description: >-
    The accumulated pyruvate is reduced to lactate, elevating the circulating
    lactate concentration. Because the gluconeogenic sink for lactate is
    disabled, lactate generated by ongoing glycolysis is no longer recycled to
    glucose.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:25246452
    reference_title: "Fructose-1,6-diphosphatase deficiency: a treatable neurometabolic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "hypoglycaemia, ketosis and lactic acidosis"
    explanation: In FBP1 deficiency - the cleanest substrate-backup case - the disabled gluconeogenic sink leaves glycolytic lactate unrecycled, producing the lactic acidosis that marks elevated circulating lactate.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: DIRECT
    description: >-
      Elevated blood lactate lowers systemic pH.
- name: Lactic Acidosis
  description: >-
    Elevated circulating lactate produces a high-anion-gap metabolic acidosis,
    the second cardinal biochemical feature of the gluconeogenic enzymopathies
    alongside hypoglycemia. The coupling to hypoglycemia is not obligate: in PC
    deficiency severe lactic acidosis can occur with normal plasma glucose,
    because PC's lactic acidosis is substantially anaplerotic (pyruvate cannot
    enter the TCA cycle via oxaloacetate) rather than a pure substrate backup.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:28649521
    reference_title: "Pyruvate carboxylase deficiency: An underestimated cause of lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe lactic acidosis and pronounced ketonuria"
    explanation: A worked conformer presenting with lactic acidosis from a gluconeogenic enzyme block.
  - reference: PMID:28649521
    reference_title: "Pyruvate carboxylase deficiency: An underestimated cause of lactic acidosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "lactic acidosis (pH 6.98, blood lactate level 11.3 mmol/L, normal range < 2 mmol/L) associated with pronounced ketonuria but normal glucose plasma levels"
    explanation: Refutes the assumption that the module's lactic acidosis is obligately coupled to hypoglycemia - this PC-deficiency patient had severe lactic acidosis with normal plasma glucose, consistent with a substantially anaplerotic origin rather than a substrate backup behind failed glucose production.
- name: CNS Glucose Deprivation
  description: >-
    The brain depends on blood glucose as its obligate fuel, so fasting
    hypoglycemia deprives neurons of their primary energy substrate. Prolonged or
    recurrent deprivation injures the central nervous system.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: glucose metabolic process
    term:
      id: GO:0006006
      label: glucose metabolic process
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:31804789
    reference_title: "Fructose-1,6-Bisphosphatase 1 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "intellectual disability, presumably due to early and prolonged hypoglycemia"
    explanation: Links the hypoglycemia of a gluconeogenic enzyme block to central nervous system injury.
  downstream:
  - target: Neuroglycopenic Dysfunction
    causal_link_type: DIRECT
    description: >-
      Neuronal energy failure produces the acute neurological manifestations of
      hypoglycemia.
- name: Neuroglycopenic Dysfunction
  description: >-
    Neuronal energy failure from glucose deprivation produces the acute
    neuroglycopenic manifestations of the gluconeogenic enzymopathies: lethargy,
    seizures, and - in severe crises - coma.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31804789
    reference_title: "Fructose-1,6-Bisphosphatase 1 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "hypoglycemia, manifesting as respiratory distress or hyperventilation, apneic spells, seizures, and/or lethargy/coma"
    explanation: Documents the neuroglycopenic manifestations that terminate the hypoglycemia branch of the module, attributed by the source to hypoglycemia (glucose deprivation).

name: Hepatic Gluconeogenesis Failure Module
description: >-
  A conserved mechanism module representing the final common pathway by which a
  loss-of-function lesion at any one of the rate-controlling gluconeogenic
  enzymes collapses de novo glucose synthesis in the liver and produces the
  shared biochemical signature of the gluconeogenic enzymopathies: fasting
  (and catabolic-stress) hypoglycemia together with lactic acidosis. The four
  classic enzyme blocks - pyruvate carboxylase (PC), cytosolic
  phosphoenolpyruvate carboxykinase (PEPCK/PCK1), fructose-1,6-bisphosphatase
  (FBP1), and glucose-6-phosphatase (G6PC) - sit at different points of the
  pathway but converge on one gene-agnostic step: the hepatocyte can no longer
  convert three-carbon precursors into glucose and release it into the
  circulation. Two consequences fan out from that convergence. On the output
  side, failed hepatic glucose production causes fasting hypoglycemia, which
  deprives the brain of its obligate fuel and produces neuroglycopenic
  manifestations (lethargy, seizures, coma). On the substrate side, the
  three-carbon precursors that cannot be consumed by gluconeogenesis (pyruvate,
  lactate, alanine, glycerol) accumulate, driving lactate overproduction and a
  high-anion-gap lactic acidosis. Conforming disorder entries substitute the
  specific blocked enzyme and its position on the pathway while preserving this
  core chain. Key conformance target:
  `hepatic_gluconeogenesis_failure#Failure of Hepatic De Novo Glucose
  Production`.

  Real and potential conformers already in kb that a curator would wire to this
  module: Fructose-1,6-Bisphosphatase_Deficiency (FBP1, the committed
  gluconeogenic step that hydrolyses fructose-1,6-bisphosphate),
  Pyruvate_Carboxylase_Deficiency_Disease (PC, the anaplerotic
  pyruvate-to-oxaloacetate entry step), Glycogen_Storage_Disease_Type_I (G6PC,
  the terminal glucose-6-phosphate dephosphorylation shared by gluconeogenesis
  and glycogenolysis), and the cytosolic PEPCK (PCK1) entry being curated in
  parallel.

  Complementary to, and deliberately distinct from, the respiratory-chain and
  bioenergetic modules. complex_i_deficiency and mitochondrial_dysfunction also
  terminate in lactic acidosis, but by a different mechanism - failed oxidative
  ATP synthesis forcing anaerobic glycolysis - and they do not primarily impair
  de novo glucose synthesis. This module's lactic acidosis is not caused by a
  primary respiratory-chain block, but its precise origin differs by enzyme: it
  is cleanest as a true substrate backup in FBP1 (and PEPCK) deficiency, where
  the disabled gluconeogenic pathway can no longer recycle glycolytic lactate to
  glucose and FBP1 is the clearest case; in PC deficiency it is substantially
  anaplerotic, with pyruvate unable to enter the TCA cycle via oxaloacetate, and
  can occur even without hypoglycemia; and in G6PC deficiency (GSD Ia) it arises
  mostly from glucose-6-phosphate shunted into glycolysis.
  peroxisomal_metabolic_failure and congenital_disorder_of_glycosylation are
  other hepatic/metabolic modules that act on entirely different substrates and
  do not converge on hepatic glucose output. Where a conformer carries both a
  gluconeogenic block and a secondary respiratory-chain phenotype (PC deficiency
  can show secondary complex IV deficiency), it may conform to this module and a
  respiratory-chain module at different nodes.
category: Module

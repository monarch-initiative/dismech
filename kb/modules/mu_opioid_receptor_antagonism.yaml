name: Mu-Opioid Receptor Antagonism Module
description: >-
  A conserved drug-mechanism module for competitive antagonism at the mu-opioid
  receptor (MOR, OPRM1), the shared mechanism of the overdose-reversal agents
  (naloxone, nalmefene), the antagonist maintenance treatment for opioid use
  disorder (extended-release naltrexone), and the peripherally acting mu-opioid
  receptor antagonists used for opioid-induced constipation (methylnaltrexone,
  naloxegol, naldemedine). An antagonist occupies the orthosteric site without
  activating the receptor and, because the competition is surmountable in both
  directions, displaces or prevents agonist binding in proportion to the
  relative concentrations and receptor affinities of the two drugs. The
  rate-limiting step and key conformance target is the resulting loss of Gi/o
  signalling: adenylyl cyclase inhibition, GIRK current and presynaptic calcium
  channel inhibition all fall away, so the hyperpolarization and reduced
  transmitter release that is the central effector of mu_opioid_receptor_agonism
  is withdrawn and the receptor-expressing neuron returns to, or exceeds, its
  prior excitability. Four branches follow, and they are not a simple inversion
  of the agonism module's four: restoration of brainstem inspiratory rhythm
  (reversal of opioid-induced respiratory depression, limited by naloxone's
  short duration of action relative to long-acting opioids); noradrenergic
  rebound in the locus coeruleus on a background of adenylyl cyclase
  superactivation (precipitated withdrawal, a toxicity of the same drug action);
  blockade of opioid and endogenous-opioid reward signalling (relapse prevention
  in opioid use disorder, and reduced alcohol-induced reward in alcohol use
  disorder); and blockade of enteric mu-opioid receptors by an antagonist
  excluded from the brain (relief of opioid-induced constipation without loss of
  central analgesia). Drug-target pattern: a treatment points at the
  antagonist-occupancy trigger node with treatment_effect ACTIVATES, and what
  distinguishes the treatments on that one node is pharmacokinetic and
  distributional rather than pharmacodynamic - duration of receptor occupancy
  for the reversal agents against the maintenance antagonist, and
  blood-brain-barrier exclusion for the peripherally restricted agents.
  Complementary to, and deliberately not overlapping with,
  mu_opioid_receptor_agonism (the same receptor driven in the opposite
  direction; partial agonists such as buprenorphine belong there, not here) and
  addiction_cycle (which models the neurocircuitry of addiction downstream of
  mesolimbic dopamine release and carries its own opioid-antagonist treatment
  entry for alcohol use disorder and gambling disorder).
category: Module
module_categories:
- PHARMACOLOGY
- TOXICOLOGY
- NEUROSCIENCE
creation_date: "2026-10-16T00:00:00Z"
notes: >-
  This is a drug-mechanism module, not a disease. Do not create a generic
  "Opioid Antagonist Effect" or "Opioid Withdrawal" Disease entry from it. The
  disease entries are the ones that conform: Acute_Opioid_Poisoning on the
  respiratory-restoration branch, Opioid_Use_Disorder on the reward-blockade and
  precipitated-withdrawal branches, Alcohol_Use_Disorder on the
  endogenous-opioid arm of the reward branch, and any entry whose treatments
  include a peripherally acting antagonist on the enteric branch.

  SCOPE. The module covers competitive antagonism at the mu-opioid receptor
  only. Agonism at the same receptor, including the partial agonist
  buprenorphine with its respiratory ceiling, is mu_opioid_receptor_agonism; the
  decision to model the two directions as separate modules was taken because the
  consequence chains differ rather than simply inverting - precipitated
  withdrawal and renarcotization have no counterpart in the agonism module, and
  the peripherally restricted agents separate a branch that no agonist
  separates. Kappa- and delta-receptor pharmacology, the mixed
  agonist-antagonists, naloxone's non-opioid actions, and the GABAergic and
  glutamatergic physiology of spontaneous opioid withdrawal outside the
  noradrenergic arm are out of scope and stay on the disorder entries.

  INVERSE NODES. Five nodes here are the explicit inverse of a node in
  mu_opioid_receptor_agonism and say so in their own descriptions, one for one
  along the trunk and on two of the branches:

  - "Loss of Gi/o Coupling and Relief of Adenylyl Cyclase Inhibition" inverts
    "Gi/o Coupling and Adenylyl Cyclase Inhibition".
  - "GIRK Closure and Recovery of Presynaptic Calcium Current" inverts "G
    Beta-Gamma Gating of GIRK Current and Calcium Channel Inhibition", and binds
    the same two molecular-function terms with the modifiers reversed.
  - "Restored Neuronal Excitability" inverts "Neuronal Hyperpolarization and
    Reduced Neurotransmitter Release"; both are the central effector and key
    conformance target of their module.
  - "Brainstem Respiratory Rhythm Restoration" inverts "Brainstem Respiratory
    Rhythm Depression".
  - "Enteric Mu-Opioid Receptor Blockade and Restored Propulsive Motility"
    inverts "Enteric Neuron Inhibition and Slowed Propulsive Motility".

  The agonism module's trunk is three nodes and so is this one, so a conforming
  entry that models both directions should point at the matching pair at each
  step rather than reusing one node for both. The two branches with no inverse
  here are the agonism module's analgesia branch, which antagonism does not
  separately model because loss of analgesia is simply the agonism branch
  withdrawn, and its desensitization branch, which is an adaptation to continued
  agonist exposure rather than anything an antagonist produces.

  BOUNDARY WITH addiction_cycle. The reward branch here stops at blockade of the
  dopamine-reinforcement signal, which is the receptor-level pharmacology
  upstream of the addiction_cycle trigger node "Acute Mesolimbic Dopamine
  Reinforcement". That module already carries an "Opioid Receptor Antagonists"
  treatment entry pointing at its own trigger node for alcohol use disorder and
  gambling disorder; this module records why the antagonist reaches that node,
  and does not re-model incentive salience, the ventral-to-dorsal striatal
  shift, or the extended-amygdala stress systems.

  Node term-binding follows module convention (GO, CL and UBERON terms only; the
  drug identities live on the treatments' therapeutic_agent as CHEBI ids). The
  receptor gene OPRM1 is bound on the trigger node, reusing the identifier
  mu_opioid_receptor_agonism binds. Two consequence nodes carry no
  biological_processes term: GO has no process for an opioid withdrawal
  syndrome and none for drug reinforcement or relapse. Searches run against the
  configured GO source immediately before committing this file were
  `runoak -i ols:go search "withdrawal"` (no results),
  `runoak -i ols:go search "reward"` (no results) and
  `runoak -i ols:go search "drug-seeking"` (no results); the nearest hits for
  the behavioural arm, `GO:0043278` response to morphine and `GO:1990708`
  conditioned place preference, are deliberately not bound anywhere in this
  module: neither names the loss of a drug effect that the reward branch
  asserts, and the branch carries `GO:0014046` dopamine secretion plus prose
  instead. The locus coeruleus is bound with
  UBERON's own spelling, `UBERON:0002148` locus ceruleus.

  WHAT THIS MODULE DOES NOT CLAIM. The respiratory branch is reversible but the
  reversal is not durable: naloxone's duration of effect is shorter than that of
  many opioid agonists, so a single dose can be followed by renarcotization, and
  illicitly manufactured fentanyl analogs may need higher or repeated dosing.
  Nalmefene is included as a higher-affinity, longer-acting reversal agent, but
  whether that is an advantage in overdose is contested: its intranasal
  approval rests on a bridge to the injectable formulation and a
  healthy-volunteer pharmacodynamic study rather than a randomized efficacy
  trial in overdose, and two toxicology societies recommend against replacing
  naloxone with it because the longer occupancy may lengthen precipitated
  withdrawal. Both sides are recorded on its treatment entry, including a
  REFUTE item; the module itself takes no position. Precipitated withdrawal is modelled as a
  toxicity of the same receptor action, not as a separate drug effect, and the
  module makes no claim that it can be dissociated from reversal efficacy - that
  is the open knowledge gap below.
discussions:
- discussion_id: gap_separating_reversal_from_precipitated_withdrawal
  prompt: >-
    Can restoration of respiratory drive be separated from precipitated
    withdrawal at the mu-opioid receptor, given that on the mechanism as
    modelled both follow from the same loss of Gi/o signalling in different
    neuronal populations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Restored Neuronal Excitability
  - pathophysiology#Reversal of Opioid-Induced Respiratory Depression
  - pathophysiology#Precipitated Opioid Withdrawal
  rationale: >-
    The two branches share one cellular event, so the only separations the
    module can currently express are the dose titrated and the populations the
    drug reaches - which is why clinical practice titrates naloxone to
    respiratory effect rather than to full reversal. Whether a ligand or
    dosing route can restore brainstem rhythm while leaving the noradrenergic
    rebound substantially unprovoked, in a dependent patient, is unresolved and
    would need new experiments rather than further curation.
  proposed_experiments:
  - experiment_id: titration_dissociation_respiratory_versus_noradrenergic
    name: Dose-resolved comparison of respiratory recovery and noradrenergic rebound
      in opioid dependence
    description: >-
      In a dependent model carrying a defined agonist burden, measure
      inspiratory rate recovery and locus coeruleus firing or forebrain
      norepinephrine efflux against the same graded antagonist exposure, to
      establish whether the two dose-response relationships are offset or
      superimposed.
    would_support:
    - pathophysiology#Restored Neuronal Excitability
    supporting_outcome:
    - >-
      The two measures move together across the antagonist dose range, with no
      window in which respiratory rhythm recovers without noradrenergic
      rebound.
    would_refute:
    - pathophysiology#Precipitated Opioid Withdrawal
    refuting_outcome:
    - >-
      Respiratory recovery is substantially complete at exposures that leave
      noradrenergic rebound near baseline, which would make the two branches
      separable by dose rather than only by drug distribution.
pathophysiology:
- name: Competitive Mu-Opioid Receptor Antagonist Occupancy
  description: >-
    The trigger and the drug-target node, and the inverse of the agonist-binding
    trigger of mu_opioid_receptor_agonism. An antagonist - naloxone, nalmefene,
    naltrexone, or a peripherally restricted agent - occupies the orthosteric
    site of the mu-opioid receptor encoded by OPRM1 without stabilizing an
    active receptor conformation, so it displaces an agonist already bound and
    prevents further agonist binding. The competition is surmountable in both
    directions, which is the whole clinical character of the node: an agonist of
    high receptor affinity needs a higher antagonist concentration or a
    continuous infusion before reversal is achieved, and a further agonist dose
    can reclaim the receptor. Antagonists differ on this node in
    pharmacokinetics and distribution rather than in receptor mechanism - how
    long occupancy lasts, and whether the drug enters the brain at all.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: mu-opioid receptor activation by agonist
    term:
      id: GO:0004985
      label: G protein-coupled opioid receptor activity
    modifier: DECREASED
  genes:
  - preferred_term: OPRM1
    term:
      id: hgnc:8156
      label: OPRM1
  evidence:
  - reference: PMID:20010421
    reference_title: "Incidence, Reversal, and Prevention of Opioid-induced Respiratory
      Depression."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      An opioid with high receptor affinity will require greater naloxone
      concentrations and/or a continuous infusion before reversal sets in
      compared with an opioid with lower receptor affinity.
    explanation: >-
      States the competitive, affinity-dependent character of the occupancy this
      node describes: how much antagonist is needed is set by the agonist it has
      to displace. Evidence source is OTHER because this is a review article.
  - reference: PMID:29318006
    reference_title: "Naloxone dosage for opioid reversal: current evidence and clinical
      implications."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      there is a risk of inadequate response or re-narcotization after the
      administration of a single dose of naloxone in patients who have taken
      large doses or long-acting opioid formulations, as the duration of effect
      of naloxone is shorter than that of many opioid agonists
    explanation: >-
      Supports the pharmacokinetic axis on which the treatments differ at this
      node, and the surmountability that makes a single antagonist dose
      temporary. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Loss of Gi/o Coupling and Relief of Adenylyl Cyclase Inhibition
    description: >-
      An occupied but unactivated receptor no longer engages Gi/o heterotrimers,
      so the cyclase arm of agonist signalling lapses first and the channel arm
      with it.
- name: Loss of Gi/o Coupling and Relief of Adenylyl Cyclase Inhibition
  description: >-
    The first amplifier, and the inverse of "Gi/o Coupling and Adenylyl Cyclase
    Inhibition" in mu_opioid_receptor_agonism. An occupied but unactivated
    receptor no longer engages inhibitory Gi/o heterotrimers, so the G alpha-i
    subunit is not dissociated, adenylyl cyclase is released from inhibition
    and cyclic AMP recovers. The step is quantitatively competitive rather than
    all-or-none: an antagonist's potency against agonist-driven cAMP inhibition
    is measured as a concentration producing half-maximal relief, and that
    concentration rises steeply with the affinity and efficacy of the agonist it
    has to displace - the cell-level form of the surmountable competition on the
    trigger node. In a neuron adapted to chronic agonist exposure the cyclase
    this node releases has itself been compensatorily upregulated, which is why
    the withdrawal branch downstream is a rebound rather than a return.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: opioid-receptor-mediated inhibition of adenylyl cyclase
    term:
      id: GO:0031635
      label: adenylate cyclase-inhibiting opioid receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:40317337
    reference_title: "Carfentanil stabilizes \u00b5 opioid receptor conformations that
      are ultra-efficient in inhibiting cAMP, resistant to naloxone or nalmefene but
      sensitive to naltrexone."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Both antagonists revealed 10 to 100-times higher IC50-values against
      CAR-mediated cAMP inhibition compared to the other opioids
    explanation: >-
      Measures this node directly: naloxone and nalmefene are assayed by the
      concentration at which they relieve agonist-driven cAMP inhibition, and
      that concentration depends on which agonist is bound. Evidence source
      IN_VITRO (HEK-293 cells stably expressing the mu-opioid receptor).
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Today it is widely accepted that all four opioid receptor types couple to
      pertussis toxin sensitive G-proteins including Gαi, to cause inhibition of
      cAMP formation.
    explanation: >-
      States the coupling and the cyclase inhibition that this node withdraws,
      in the direction the agonism module records them. Marked INDIRECT because
      the claim here follows from removing what this sentence asserts rather
      than being asserted by it. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: GIRK Closure and Recovery of Presynaptic Calcium Current
    description: >-
      With no Gi/o activation there is no free G beta-gamma either, so the
      channel arm of agonist signalling lapses in the same step as the cyclase
      arm.
- name: GIRK Closure and Recovery of Presynaptic Calcium Current
  description: >-
    The second amplifier, and the inverse of "G Beta-Gamma Gating of GIRK
    Current and Calcium Channel Inhibition" in mu_opioid_receptor_agonism. With
    no G beta-gamma released from an activated heterotrimer, the
    G-protein-gated inwardly rectifying potassium channels close and the
    potassium conductance falls, while the direct G beta-gamma block of P/Q-,
    N- and L-type voltage-gated calcium channels is lifted and presynaptic
    calcium current recovers. The agonist-evoked outward potassium current is
    the measurable handle on this node - it reverses at the potassium
    equilibrium potential and is barium-sensitive, and an antagonist abolishes
    the physiological effect it produces within minutes. As in the agonism
    module the two halves are complementary rather than redundant: the
    potassium arm governs somatic and postsynaptic firing, the calcium arm
    governs transmitter release.
  role: amplifier
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: GIRK (Kir3) channel opening by G beta-gamma
    term:
      id: GO:0015467
      label: G-protein activated inward rectifier potassium channel activity
    modifier: DECREASED
  - preferred_term: presynaptic voltage-gated calcium channel current
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: INCREASED
  evidence:
  - reference: PMID:26175072
    reference_title: "\u03bc opioid receptor activation hyperpolarizes respiratory-controlling
      K\u00f6lliker-Fuse neurons and suppresses post-inspiratory drive."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      In voltage-clamp recordings the outward current produced by the opioid
      agonist ME was concentration dependent, reversed at the potassium
      equilibrium potential and was blocked by BaCl2
    explanation: >-
      Identifies the conductance this node closes, by the two criteria that
      establish it as a GIRK current. Evidence source IN_VITRO (voltage-clamp
      recordings in rat brainstem slices).
  - reference: PMID:26175072
    reference_title: "\u03bc opioid receptor activation hyperpolarizes respiratory-controlling
      K\u00f6lliker-Fuse neurons and suppresses post-inspiratory drive."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      resulted in robust apneusis (lengthened low amplitude inspiration due to
      loss of post-inspiratory drive) that was rapidly reversed by the opioid
      antagonist naloxone
    explanation: >-
      Shows an antagonist reversing, within minutes, the respiratory effect that
      the same study attributes to the potassium conductance quoted above, which
      is this node read out in the intact preparation. Evidence source
      MODEL_ORGANISM (in situ arterially perfused working heart-brainstem
      preparation of rat).
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Opioid receptor induced inhibition of calcium conductance is mediated by
      binding of the dissociated Gβγ subunit directly to the channel.
    explanation: >-
      States the calcium half of this node in the agonist direction, and
      attributes it to free G beta-gamma - which is exactly what antagonist
      occupancy leaves unavailable. Marked INDIRECT because the recovery claimed
      here follows from removing the mechanism this sentence describes. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Restored Neuronal Excitability
    description: >-
      A fallen potassium conductance depolarizes the neuron back towards
      threshold while recovered presynaptic calcium entry restores evoked
      transmitter release.
- name: Restored Neuronal Excitability
  description: >-
    The central effector and the key conformance target: the single
    rate-limiting cellular event of mu-opioid receptor antagonism, and the exact
    inverse of the mu_opioid_receptor_agonism central effector "Neuronal
    Hyperpolarization and Reduced Neurotransmitter Release". The
    hyperpolarization lifts, tonic firing resumes and evoked transmitter release
    returns. In an opioid-naive neuron this restores baseline excitability; in a
    neuron adapted to chronic agonist exposure, with adenylyl cyclase and cAMP
    signalling compensatorily upregulated, removal of the inhibition leaves the
    cell firing above its prior rate, which is what makes the withdrawal branch
    a rebound rather than a return. Everything below this node is the same event
    read out in a different neuronal population, and conforming entries
    substitute the population their disease concerns (pre-Botzinger complex
    rhythm-generating neurons, locus coeruleus noradrenergic neurons, mesolimbic
    GABAergic interneurons, enteric neurons) while keeping this node unchanged.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: opioid-evoked membrane hyperpolarization
    term:
      id: GO:0060081
      label: membrane hyperpolarization
    modifier: DECREASED
  - preferred_term: evoked neurotransmitter release
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: mu-opioid-receptor-expressing neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:1346804
    reference_title: Opioids excite dopamine neurons by hyperpolarization of local
      interneurons.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Experiments with agonists and antagonists selective for opioid receptor
      subtypes indicated that the hyperpolarization of secondary cells involved
      the mu-receptor.
    explanation: >-
      Receptor-subtype-selective antagonists are what established that the
      hyperpolarization carried by the agonism module's central effector is
      mu-receptor-mediated, which is the same thing as saying it is blockable at
      that receptor. Marked INDIRECT because the recordings measure the agonist
      effect and its pharmacological identity rather than a therapeutic
      reversal. Evidence source IN_VITRO (intracellular recordings in rat brain
      slices).
  - reference: PMID:26230639
    reference_title: "Direct Facilitatory Role of Paragigantocellularis Neurons in
      Opiate Withdrawal-Induced Hyperactivity of Rat Locus Coeruleus Neurons: An In
      Vitro Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      Different electrophysiological studies have reported the hyperactivity of
      LC neurons following naloxone-induced withdrawal in brain slices taken
      from chronically morphine treated rats
    explanation: >-
      Supports the second half of this node's description - that in an
      agonist-adapted neuron removal of the inhibition leaves firing above
      baseline rather than at it - at the level of recorded cellular activity.
      The sentence restates established slice electrophysiology rather than this
      paper's own paragigantocellularis result, hence quote_role BACKGROUND.
  downstream:
  - target: Brainstem Respiratory Rhythm Restoration
    description: >-
      In the brainstem inspiratory rhythm generator the same event returns
      respiratory rate towards baseline.
  - target: Locus Coeruleus Noradrenergic Rebound
    description: >-
      In locus coeruleus neurons adapted to chronic agonist exposure the same
      event releases a compensatorily upregulated cell into hyperactivity.
  - target: Blockade of Opioid Reward Signalling
    description: >-
      In the ventral tegmental area the neuron no longer hyperpolarized is a
      GABAergic interneuron, so the dopamine neuron loses its disinhibition and
      the reinforcing dopamine signal is not produced.
  - target: Enteric Mu-Opioid Receptor Blockade and Restored Propulsive Motility
    description: >-
      In enteric neurons the same event returns the neural drive to propulsive
      contraction, and is reachable by a drug that never enters the brain.
- name: Brainstem Respiratory Rhythm Restoration
  description: >-
    The therapeutic branch in overdose, and the inverse of "Brainstem
    Respiratory Rhythm Depression" in mu_opioid_receptor_agonism. Antagonist
    occupancy of mu-opioid receptors on rhythm-generating neurons of the
    pre-Botzinger complex and on the modulatory Kolliker-Fuse and parabrachial
    nuclei lifts the inhibition of the inspiratory rhythm generator, and
    respiratory rate recovers. The branch is pharmacologically unlike its
    agonism counterpart in one respect that matters clinically: recovery lasts
    only as long as antagonist occupancy exceeds what the remaining agonist can
    reclaim, so the branch has to be sustained rather than merely triggered.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: neural control of respiratory rhythm

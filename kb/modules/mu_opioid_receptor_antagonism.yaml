- name: Extended-Release Naltrexone (Antagonist Maintenance)
  description: >-
    A long-acting competitive mu-opioid receptor antagonist given as a monthly
    injection for relapse prevention in opioid use disorder, and orally or by
    injection for alcohol use disorder. It engages the same trigger node, and
    what makes it a maintenance drug is sustained occupancy over weeks: plasma
    levels above a threshold block the subjective effects of a heroin challenge,
    and as levels fall that blockade is lost. Because the drug produces
    precipitated withdrawal in anyone still physically dependent, induction
    requires a completed medical withdrawal first, which is the practical
    difficulty that distinguishes antagonist from agonist maintenance. In
    alcohol use disorder the ligand displaced is endogenous rather than
    exogenous.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
  target_mechanisms:
  - target: Competitive Mu-Opioid Receptor Antagonist Occupancy
    treatment_effect: ACTIVATES
    description: >-
      Sustained antagonist occupancy of the mu-opioid receptor over a monthly
      dosing interval, maintained above the level at which an opioid challenge
      regains its subjective effect.
  - target: Blockade of Opioid Reward Signalling
    treatment_effect: ACTIVATES
    description: >-
      Occupancy of receptors on ventral tegmental area interneurons prevents the
      disinhibition of dopamine neurons by an exogenous opioid, and prevents
      endogenous opioid peptides released by alcohol from acting at the same
      receptor.

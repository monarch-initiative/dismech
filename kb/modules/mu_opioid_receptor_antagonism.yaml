- name: Reduced Reinforcement and Relapse Prevention
  description: >-
    The therapeutic consequence in substance use disorder: use that produces no
    reward is not reinforced, so antagonist maintenance reduces relapse to
    regular opioid use and reduces heavy drinking in alcohol use disorder.
    Unlike the respiratory branch this consequence requires sustained occupancy
    over weeks to months, which is what the extended-release formulation
    supplies, and unlike agonist maintenance it confers no tolerance - so a
    lapse after antagonist levels fall carries the full overdose risk of the
    patient's former dose. The adaptations that repeated reward has already
    produced in the circuit are not reversed by blockade and are modelled in
    addiction_cycle, which carries its own antagonist treatment entry for the
    alcohol and gambling indications.

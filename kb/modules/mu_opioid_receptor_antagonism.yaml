- name: Peripherally Acting Mu-Opioid Receptor Antagonists (PAMORAs)
  description: >-
    Methylnaltrexone, naloxegol and naldemedine, antagonists designed not to
    enter the central nervous system, used for opioid-induced constipation in
    patients who need to continue opioid therapy. They engage the same receptor
    occupancy as the reversal agents but only in the periphery, so they reach
    the enteric branch of this module and not the respiratory, withdrawal or
    reward branches - laxation without loss of analgesia and without withdrawal.
    The three differ in how exclusion from the brain is achieved, a quaternary
    amine against a pegylated molecule and an efflux-transporter substrate, and
    not in receptor mechanism, which is why they share one treatment entry on
    one node.

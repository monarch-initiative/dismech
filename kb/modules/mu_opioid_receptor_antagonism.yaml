- name: Enteric Mu-Opioid Receptor Blockade and Restored Propulsive Motility
  description: >-
    The gastrointestinal branch, and the inverse of "Enteric Neuron Inhibition
    and Slowed Propulsive Motility" in mu_opioid_receptor_agonism. Mu-opioid
    receptors on enteric neurons of the myenteric and submucosal plexuses are
    peripheral, so an antagonist designed not to cross the blood-brain barrier -
    a quaternary amine such as methylnaltrexone, or a pegylated or
    efflux-substrate molecule such as naloxegol or naldemedine - occupies them
    while leaving central receptors free. The inhibition of coordinated
    propulsive contraction is relieved and motility recovers, with central
    analgesia preserved and the withdrawal branch not reached. This is the one
    branch of the module that is separable from the others by drug distribution
    rather than by dose, and it is the clearest demonstration that the module's
    branches are one receptor action in different populations.

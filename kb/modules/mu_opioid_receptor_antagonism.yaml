    explanation: >-
      States the two receptor-level properties that place this treatment on the
      same trigger node as naloxone while distinguishing it there. Evidence
      source is OTHER because a society position statement is expert consensus
      rather than a study of any of the other categories.
  - reference: PMID:38039052
    reference_title: "American College of Medical Toxicology and the American Academy
      of Clinical Toxicology position statement: nalmefene should not replace naloxone
      as the primary opioid antidote at this time."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      There is, however, evidence to suggest nalmefene may result in more
      prolonged and severe opioid withdrawal than naloxone, which could be
      harmful to patients.
    explanation: >-
      Supports this entry's recorded caveat that the longer occupancy is not a

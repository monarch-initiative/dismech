    explanation: >-
      The measured comparison behind this treatment's claim to differ from
      naloxone on the respiratory branch. Evidence source HUMAN_CLINICAL
      (open-label randomized crossover study in healthy volunteers given a
      remifentanil infusion).
  - reference: PMID:38039052
    reference_title: "American College of Medical Toxicology and the American Academy
      of Clinical Toxicology position statement: nalmefene should not replace naloxone
      as the primary opioid antidote at this time."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Nalmefene has a higher affinity for opioid receptors and a longer duration

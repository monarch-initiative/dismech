- name: Blockade of Opioid Reward Signalling
  description: >-
    The reward branch. With mu-opioid receptors on ventral tegmental area
    GABAergic interneurons occupied by an antagonist, an exogenous opioid can no
    longer hyperpolarize them, the dopamine neurons are not disinhibited, and
    the reinforcing dopamine signal that follows opioid use is not produced -
    which is read out clinically as loss of drug liking after a heroin
    challenge. The same blockade applies to the endogenous opioid arm: ethanol
    consumption releases beta-endorphin and other endogenous opioid peptides
    into the ventral striatum, and an antagonist competitively impedes their
    action at the same receptor, which is the mechanism by which naltrexone and
    nalmefene reduce alcohol-induced reward. Peripherally restricted antagonists
    do not reach this branch.

    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      there is growing evidence that higher dose or multiple administrations of
      naloxone are required to fully reverse IMF related toxicity
    explanation: >-
      Supports the dose and repeat-administration caveat for high-affinity
      synthetic agonists, the practical form the surmountable competition on the
      trigger node takes. Evidence source is OTHER because this is a review
      article.
- name: Locus Coeruleus Noradrenergic Rebound
  description: >-
    The toxicity branch, and the one with no counterpart in the agonism module.
    Locus coeruleus noradrenergic neurons are inhibited by mu-opioid receptor
    agonism and adapt to chronic exposure by upregulating adenylyl cyclase and
    cAMP signalling, so their basal drive is restored against a continuing
    agonist load. Antagonist occupancy removes the inhibition from an already
    compensated cell, and firing and norepinephrine release overshoot: an
    antagonist given to a dependent patient markedly increases norepinephrine
    release in forebrain targets, and the same agents that reduce that efflux
    reduce the behavioural signs. This branch is not reached in an opioid-naive
    patient, which is why it is a toxicity of the drug in one population rather
    than a property of the drug.

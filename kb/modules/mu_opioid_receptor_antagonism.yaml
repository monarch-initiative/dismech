      label: medulla oblongata
  evidence:
  - reference: PMID:20010421
    reference_title: "Incidence, Reversal, and Prevention of Opioid-induced Respiratory
      Depression."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The only treatment currently available to reverse opioid respiratory
      depression is by naloxone infusion.
    explanation: >-
      Establishes that antagonist occupancy is the route by which depressed
      respiratory drive is reversed, which is the claim of this branch. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Reversal of Opioid-Induced Respiratory Depression
    description: >-
      Recovered inspiratory rhythm restores ventilation and averts the apnea
      that is the mechanism of fatal overdose.
- name: Reversal of Opioid-Induced Respiratory Depression
  description: >-
    The consequence an acute opioid poisoning entry conforms to: recovery of
    respiratory drive and consciousness, and survival of an otherwise fatal
    overdose. The consequence is real at the population level - naloxone
    distribution has been followed by reduced overdose mortality - and is
    time-limited at the individual level, because antagonist occupancy decays
    faster than the agonist burden in a patient who has taken a large dose or a
    long-acting formulation. Clinical practice therefore titrates to effect and
    continues treatment by infusion, and the illicitly manufactured fentanyl
    analogs have pushed the required dose and the number of repeat
    administrations upward.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: respiratory drive
    term:
      id: GO:0043576
      label: regulation of respiratory gaseous exchange
    modifier: INCREASED
  evidence:
  - reference: PMID:29318006

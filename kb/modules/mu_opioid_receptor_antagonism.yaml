- name: Precipitated Opioid Withdrawal
  description: >-
    The toxic consequence, and the dose-limiting one for every centrally acting
    antagonist. In an opioid-dependent patient, antagonist occupancy produces
    within minutes the autonomic, gastrointestinal and affective syndrome that
    spontaneous cessation would produce over hours - yawning, rhinorrhea,
    lacrimation, abdominal cramps, restlessness and aversion - together with
    cortisol release and increased dorsal striatal dopamine release that tracks
    the severity of the subjective aversion. Clinically this is why overdose
    reversal is titrated to respiratory effect rather than to full receptor
    blockade, and why antagonist maintenance for opioid use disorder requires a
    completed medical withdrawal before induction. It is the reason the
    peripherally restricted agents exist: an antagonist that does not enter the
    brain does not reach this branch.
  role: consequence
  biological_scale: ORGANISM
  evidence:

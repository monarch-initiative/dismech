treatments:
- name: Naloxone (Short-Acting Overdose Reversal)
  description: >-
    The competitive mu-opioid receptor antagonist used to reverse
    opioid-induced respiratory depression, by injection in hospital and by
    intranasal or intramuscular take-home kits in the community. It engages the
    antagonist-occupancy trigger node of this module and therefore produces
    every branch it can reach: respiratory recovery and, in a dependent patient,
    precipitated withdrawal, from one receptor action. Its defining limitation
    is pharmacokinetic rather than pharmacodynamic - occupancy decays faster
    than the agonist burden it was given to displace, so a single dose can be
    followed by renarcotization and high-affinity synthetic agonists may need
    higher or repeated dosing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naloxone
      term:
        id: CHEBI:7459
        label: naloxone
  target_mechanisms:
  - target: Competitive Mu-Opioid Receptor Antagonist Occupancy
    treatment_effect: ACTIVATES
    description: >-
      Naloxone occupies the mu-opioid receptor without activating it, displacing
      bound agonist and withdrawing the Gi/o signalling that every branch of
      mu_opioid_receptor_agonism depends on.
  evidence:
  - reference: PMID:20010421
    reference_title: "Incidence, Reversal, and Prevention of Opioid-induced Respiratory
      Depression."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The efficacy of naloxone depends on its own pharmacological
      characteristics and on those (including receptor kinetics) of the opioid
      that needs reversal.
    explanation: >-
      Supports the design pattern this treatment encodes: the drug acts on the
      receptor-occupancy node, and its clinical effect is set by the competition
      there rather than by anything downstream. Evidence source is OTHER because
      this is a review article.
  - reference: PMID:29318006
    reference_title: "Naloxone dosage for opioid reversal: current evidence and clinical
      implications."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      To combat this mortality trend, naloxone is increasingly being utilized in
      a pre-hospital setting by emergency personnel and prescribed to laypersons
      for out-of-hospital administration.
    explanation: >-
      Establishes the clinical role this treatment occupies, including the
      community setting in which the short duration of occupancy recorded on the
      respiratory consequence node matters most. Evidence source is OTHER
      because this is a review article.
- name: Nalmefene (Longer-Acting Overdose Reversal)
  description: >-
    An opioid receptor antagonist approved as a nasal spray for emergency
    treatment of known or suspected opioid overdose, and used for the same
    purpose by injection. Mechanistically it engages the same trigger node as
    naloxone; what distinguishes it there is higher receptor affinity and a
    longer duration of action, and in a healthy-volunteer model of
    remifentanil-induced respiratory depression a faster onset of reversal.
    Whether those properties are an advantage in overdose is contested rather
    than settled, and the dispute belongs on this entry rather than on the
    module's branches: the intranasal formulation was approved without new
    clinical data and has not been studied in patients currently overdosing,
    comparative effectiveness data against naloxone are sparse, and longer
    occupancy at higher affinity may mean a more prolonged and severe
    precipitated withdrawal. Two toxicology societies therefore recommend
    against replacing naloxone with it as the primary antidote. Nalmefene's
    separate
    use in alcohol use disorder acts on the endogenous-opioid arm of the reward
    branch and is recorded with naltrexone below and in addiction_cycle.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nalmefene
      term:
        id: CHEBI:7457
        label: Nalmefene
  target_mechanisms:
  - target: Competitive Mu-Opioid Receptor Antagonist Occupancy
    treatment_effect: ACTIVATES
    description: >-
      Sustained antagonist occupancy of the mu-opioid receptor, long enough to
      outlast agonists that would reclaim the receptor from a short-acting
      antagonist.
  evidence:

name: Primary Hemostatic Plug Failure Module
description: >-
  A conserved final-common-pathway module for the inherited disorders of
  platelet function - the platelet-type bleeding disorders (the OMIM BDPLT
  series) and their acquired phenocopies. Loss or dysfunction of any one
  component of the platelet primary-hemostatic apparatus - an adhesion receptor
  (GPIb-IX-V, GPVI, integrin alpha2beta1), the aggregation receptor (integrin
  alphaIIbbeta3), an activating G-protein-coupled receptor or its downstream
  signalling machinery (P2Y12, the thromboxane A2 receptor, CalDAG-GEFI/RASGRP2,
  PKC), the secretory granules and their contents, or the procoagulant membrane
  response - interrupts one of four parallel arms that a platelet must complete
  at a site of vascular injury: it must stick, it must switch on and secrete, it
  must bind its neighbours, and it must offer a catalytic surface for thrombin
  generation. Whichever arm is broken, the arms converge on one rate-limiting
  step, failure to build a stable primary hemostatic plug, and from there on a
  single clinical output, a mucocutaneous bleeding diathesis whose severity is
  not predicted by which component was lost. This convergence is what makes the
  BDPLT series so hard to tell apart clinically and is the reason the module is
  worth factoring out: it is the shared destination, and each disorder entry
  supplies its own route to it.

  The module is the deliberate mechanistic inverse of `thrombogenesis`, which
  models pathological intravascular thrombus formation. Here the same machinery
  fails to do its physiological job. The two are complementary rather than
  overlapping, and a P2Y12 or alphaIIbbeta3 node appearing in both is not a
  contradiction: it is the same target read from opposite directions, which is
  precisely why the antithrombotic drug classes (P2Y12 inhibitors, alphaIIbbeta3
  antagonists, aspirin) phenocopy these inherited disorders.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is NOT an Xogenesis
  module - nothing pathological is formed; a normal, programmed process fails,
  so the OGMS pathological-structure anchor convention does not apply.

  SCOPE - the qualitative arm only. This module models the FUNCTIONAL failure of
  a platelet that reaches the site of injury. It deliberately does NOT model the
  quantitative arm - impaired thrombopoiesis, defective proplatelet formation,
  or accelerated clearance producing thrombocytopenia and macrothrombocytopenia.
  That is a mechanistically distinct route (megakaryocyte maturation and
  platelet biogenesis, GO:0030220 platelet formation) that happens to share many
  genes: GP1BA/GP1BB/GP9, MYH9, ACTN1, TUBB1, FLI1, GFI1B and NBEAL2 all break
  both arms at once. A disorder with a combined qualitative-plus-quantitative
  defect conforms here for the functional arm and curates its platelet-count arm
  on its own entry. Conforming to this module is not an assertion that the
  platelet count is normal.

  ARM SELECTION IS THE CURATOR'S FIRST DECISION, and the four amplifier arms are
  not interchangeable. Attach at the arm the disorder's evidence actually
  supports:
    - `#Impaired Platelet Adhesion to the Injured Vessel Wall` - GPIb-IX-V loss
      (Bernard-Soulier syndrome), GPVI deficiency, integrin alpha2beta1
      deficiency, and, from the opposite direction, the gain-of-function
      GPIbalpha of platelet-type von Willebrand disease, where excessive
      constitutive VWF capture depletes the high-molecular-weight multimers that
      adhesion depends on.
    - `#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out
      Signalling` - P2Y12 (BDPLT8), thromboxane A2 receptor (BDPLT13),
      cyclooxygenase-1 (BDPLT12) and thromboxane synthase (BDPLT14) defects,
      CalDAG-GEFI/RASGRP2 (BDPLT18), the storage pool diseases (gray platelet
      syndrome, Hermansky-Pudlak, Chediak-Higashi), Quebec platelet disorder,
      and the megakaryocyte transcription-factor disorders (FLI1, GFI1B, RUNX1)
      that reduce the platelet's secretable and receptor content wholesale.
    - `#Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation` -
      Glanzmann thrombasthenia and the leukocyte adhesion deficiency III
      (kindlin-3/FERMT3) thrombasthenia-like phenotype. Reserve this arm for a
      demonstrated failure of the final common aggregation step itself, not for
      any disorder in which aggregometry is abnormal - almost every disorder
      here has abnormal aggregometry, because every upstream arm reads out
      through it.
    - `#Impaired Platelet Procoagulant Membrane Response` - Scott syndrome
      (ANO6/TMEM16F). This arm is narrowly evidenced and should not be inferred
      from a prolonged clotting time; it needs phosphatidylserine-exposure or
      platelet-procoagulant-activity data.

  A disorder may conform at more than one arm when its evidence supports more
  than one, and a conformer need not name any arm to conform at the central
  effector. Conversely, mucocutaneous bleeding alone is NOT sufficient to infer
  conformance: coagulation-factor deficiencies (hemophilia, plasma von
  Willebrand disease), vascular and connective-tissue bleeding (hereditary
  haemorrhagic telangiectasia, Ehlers-Danlos), hyperfibrinolytic bleeding, and
  immune thrombocytopenia all produce the same clinical output without a
  platelet primary-hemostatic component being lost. Quebec platelet disorder is
  the instructive edge case - it is a platelet-type bleeding disorder whose
  proximate defect is intraplatelet alpha-granule proteolysis by overexpressed
  urokinase, so it conforms through the secretion arm and additionally carries a
  hyperfibrinolytic mechanism that this module does not model.

  Key conformance target (the rate-limiting node): `#Failure of Primary
  Hemostatic Plug Formation`.

  The treatments block is a mechanistic target pattern, not an inherited
  treatment recommendation. Recombinant activated factor VIIa is the worked
  example because it is the one agent whose mechanism is defined against this
  module's central node: it does not repair any arm, it BYPASSES the failed plug
  by driving thrombin generation on whatever activated platelet surface remains.
  Conforming disorders do not inherit it - its evidence base is Glanzmann
  thrombasthenia, and its use elsewhere in the series is extrapolation.

  Pathophysiology nodes bind GO biological processes, GO cellular components and
  CL cell types only; chemistry and disease identity are described in prose. GO
  has no `platelet adhesion` class, so the adhesion node binds the parent
  GO:0007155 cell adhesion with a specific `preferred_term`; this is a noted
  ontology gap.

  Modifier convention on the arm nodes. The arms carry the quantitative,
  PATO-bound modifier (`DECREASED`) rather than the unbound qualitative one,
  deliberately: an arm must accommodate the full range of lesions that enter it,
  including partial and hypomorphic ones, and `DECREASED` is the documented
  default. A conformer whose own lesion is qualitative should use
  `LOSS_OF_FUNCTION` on its own node - `Scott_Syndrome` does exactly that on
  GO:0017121, because biallelic ANO6 loss abolishes scrambling rather than
  reducing it. The resulting difference between that conformer and this module's
  procoagulant arm is intended, not an oversight: the module states the general
  case, the conformer states its own.
pathophysiology:
- name: Loss of a Platelet Primary-Hemostatic Component
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A component of the machinery a platelet uses to arrest bleeding becomes
    unavailable or dysfunctional: an adhesion or activation receptor, an
    intracellular signalling intermediate, a cytoskeletal or membrane-skeletal
    protein, the contents or biogenesis machinery of the secretory granules, or
    the phospholipid scramblase that builds the procoagulant surface. In the
    inherited disorders this is a germline variant; the same node accommodates
    the acquired phenocopies (an autoantibody against GPIb-IX-V or
    alphaIIbbeta3, or pharmacological blockade by an antiplatelet drug), which
    reach the identical downstream chain. Conforming disorder nodes substitute
    the specific gene and protein.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21801136
    reference_title: "Inherited platelet disorders: a clinical approach to diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defects involve deficiencies or dysfunction of platelet receptors, signaling pathways, cytoskeletal proteins, granule contents and abnormalities in procoagulant activity."
    explanation: >-
      Enumerates the component classes this trigger node abstracts over, and is
      the basis for treating them as alternative entries to one shared chain.
  downstream:
  - target: Impaired Platelet Adhesion to the Injured Vessel Wall
    causal_link_type: DIRECT
    description: >-
      When the lost component is an adhesion receptor or its ligand-binding
      function, the adhesion arm is the one interrupted.
  - target: Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling
    causal_link_type: DIRECT
    description: >-
      When the lost component is an activating receptor, a signalling
      intermediate, or granule content or biogenesis machinery.
  - target: Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation
    causal_link_type: DIRECT
    description: >-
      When the lost component is integrin alphaIIbbeta3 itself or the kindlin-3
      machinery that activates it.
  - target: Impaired Platelet Procoagulant Membrane Response
    causal_link_type: DIRECT
    description: >-
      When the lost component is the calcium-dependent phospholipid scramblase
      that externalizes phosphatidylserine.
- name: Impaired Platelet Adhesion to the Injured Vessel Wall
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    The first arm. A circulating platelet must be captured from flowing blood at
    the site of injury - tethered by GPIb-IX-V to von Willebrand factor
    immobilized on exposed subendothelium under arterial shear, then held and
    activated by GPVI and integrin alpha2beta1 engaging collagen. Loss of the
    capture step means the platelet is never recruited, so nothing downstream
    can happen however intact the rest of the machinery is. The arm can also
    fail from the opposite direction: constitutively enhanced GPIbalpha-VWF
    binding consumes the high-molecular-weight VWF multimers and the platelets
    bound to them out of the circulation, so gain of function at the receptor
    produces loss of function at the vessel wall.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet adhesion to exposed subendothelial von Willebrand factor and collagen
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormalities of pathways involving glycoprotein (GP) mediators of adhesion (Bernard-Soulier syndrome, platelet-type von Willebrand disease) and aggregation (Glanzmann thrombasthenia) are the most studied and affect the GPIb-IX-V complex and integrin αIIbβ3, respectively."
    explanation: >-
      Establishes the adhesion arm as a distinct, receptor-defined route
      separate from the aggregation arm, and names the two disorders that enter
      through it.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      A platelet that is never captured cannot contribute to the plug.
- name: Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    The second arm, and the widest. An adherent platelet must switch on: agonist
    receptors (P2Y12 for ADP, the thromboxane A2 receptor, GPVI for collagen)
    feed intracellular signalling that both releases the alpha and dense
    granules - amplifying recruitment of further platelets - and, through the
    small GTPase Rap1 acting via CalDAG-GEFI and talin/kindlin, converts
    integrin alphaIIbbeta3 from its bent resting conformation into its
    ligand-binding one. This inside-out step is what couples activation to
    aggregation, so a signalling lesion produces a functional thrombasthenia
    with a structurally normal integrin. The arm also accommodates disorders in
    which the granules themselves are absent or their contents degraded, and the
    megakaryocyte transcription-factor disorders in which the platelet is built
    short of receptors and granule cargo in the first place.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: DECREASED
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  - preferred_term: integrin inside-out activation
    term:
      id: GO:0033622
      label: integrin activation
    modifier: DECREASED
  cellular_components:
  - preferred_term: platelet alpha granule
    term:
      id: GO:0031091
      label: platelet alpha granule
  - preferred_term: platelet dense granule
    term:
      id: GO:0042827
      label: platelet dense granule
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agonist-specific deficiencies in platelet aggregation relate to mutations of primary receptors for ADP (P2Y(12)), thromboxane A(2) (TXA2R) and collagen (GPVI); however, selective abnormalities of intracellular signalling pathways remain better understood in mouse models."
    explanation: >-
      Establishes the agonist-receptor and intracellular-signalling route as a
      distinct arm, and flags that much of its intracellular half rests on
      mouse rather than human evidence.
  - reference: PMID:24958846
    reference_title: Human CalDAG-GEFI gene (RASGRP2) mutation affects platelet function and causes severe bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelets from individuals carrying the mutation present a reduced ability to activate Rap1 and to perform proper αIIbβ3 integrin inside-out signaling."
    explanation: >-
      Direct human evidence that a signalling lesion upstream of the integrin
      reproduces the aggregation failure, which is what makes this a separate
      arm rather than part of the alphaIIbbeta3 node.
  downstream:
  - target: Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation
    causal_link_type: DIRECT
    description: >-
      Inside-out signalling is the immediate upstream requirement for
      alphaIIbbeta3 to bind fibrinogen, so a signalling lesion reaches the
      aggregation node without the integrin itself being abnormal.
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of granule release also weakens the plug independently of the
      integrin - by failing to recruit and activate further platelets and by
      failing to deliver alpha-granule adhesive and procoagulant cargo.
- name: Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    The third arm, and the final common step of aggregation itself. Activated
    integrin alphaIIbbeta3 binds fibrinogen and von Willebrand factor, which
    bridge adjacent platelets into a growing aggregate. Quantitative or
    qualitative deficiency of the integrin abolishes aggregation to every
    physiological agonist, which is the laboratory signature of Glanzmann
    thrombasthenia: the platelets are present in normal number and morphology,
    they adhere, they activate, and they still cannot hold on to one another.
    Because every upstream arm reads out through aggregometry, an abnormal
    aggregation trace is not by itself evidence of conformance to this node.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: DECREASED
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular basis is linked to quantitative and/or qualitative abnormalities of alphaIIb beta3 integrin. This receptor mediates the binding of adhesive proteins that attach aggregating platelets and ensure thrombus formation at sites of injury in blood vessels."
    explanation: >-
      States the integrin's bridging role and that both quantitative and
      qualitative loss produce the aggregation failure this node represents.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Without interplatelet bridging no aggregate forms, so the plug never
      grows beyond a monolayer of adherent platelets.
- name: Impaired Platelet Procoagulant Membrane Response
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    The fourth arm, and the narrowest. A strongly activated platelet scrambles
    its plasma-membrane phospholipids, externalizing phosphatidylserine to
    create the negatively charged catalytic surface on which the tenase and
    prothrombinase complexes assemble. This is the point at which primary
    hemostasis hands off to the coagulation cascade, and losing it uncouples an
    otherwise competent platelet from local thrombin generation. Conformance
    here requires phosphatidylserine-exposure or platelet-procoagulant-activity
    evidence, not merely a laboratory clotting abnormality.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: calcium-dependent phosphatidylserine externalization
    term:
      id: GO:0017121
      label: plasma membrane phospholipid scrambling
    modifier: DECREASED
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:21107324
    reference_title: Calcium-dependent phospholipid scrambling by TMEM16F.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A patient with Scott syndrome, which results from a defect in phospholipid scrambling activity, was found to carry a mutation at a splice-acceptor site of the gene encoding TMEM16F, causing the premature termination of the protein."
    explanation: >-
      Ties the human disorder that enters through this arm to loss of the
      scramblase, establishing the arm as a genuine, separately-caused route.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Without a procoagulant surface, local thrombin generation and therefore
      fibrin consolidation of the platelet plug are impaired.
- name: Failure of Primary Hemostatic Plug Formation
  role: central_effector
  biological_scale: TISSUE
  description: >-
    The rate-limiting, disorder-agnostic node and the module's key conformance
    target. Whichever arm is interrupted, the platelet mass at the site of
    vascular injury fails to reach the size, stability, and procoagulant
    competence needed to arrest bleeding from small vessels. This is where the
    heterogeneity upstream collapses into one shared lesion, and why the
    disorders of this family cannot be told apart from the bleeding pattern
    alone.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic defects of platelet function give rise to mucocutaneous bleeding of varying severity because platelets fail to fulfil their haemostatic role after vessel injury."
    explanation: >-
      States the convergence this node represents - heterogeneous genetic
      defects producing one shared failure of the platelet's haemostatic role -
      and the causal link to the clinical consequence node.
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: >-
      The mucous membranes and skin depend most heavily on platelet-dependent
      primary hemostasis, so this is where the failure declares itself.
- name: Mucocutaneous Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The shared clinical output: easy bruising, petechiae and purpura, epistaxis,
    gingival bleeding, menorrhagia, and excessive bleeding after trauma,
    surgery, dental extraction and childbirth, with gastrointestinal haemorrhage
    and, rarely, intracranial haemorrhage at the severe end. Severity is highly
    variable within a single genotype and is not predicted by which component
    was lost, so a conforming entry should curate its own severity and
    complication profile rather than inheriting one from the module. Chronic
    blood loss commonly produces iron-deficiency anaemia.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic defects of platelet function give rise to mucocutaneous bleeding of varying severity because platelets fail to fulfil their haemostatic role after vessel injury."
    explanation: >-
      Names the clinical output and its variability in severity, which is the
      content of this node.
  - reference: PMID:21801136
    reference_title: "Inherited platelet disorders: a clinical approach to diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These disorders can be difficult to distinguish clinically as they present with the common symptom of mucocutaneous bleeding."
    explanation: >-
      Supports the convergence claim specifically - that the shared clinical
      output is what defeats clinical discrimination between members.
treatments:
- name: Recombinant Activated Factor VIIa
  description: >-
    Recombinant activated factor VIIa does not repair any arm of this module. It
    raises thrombin generation on whatever activated platelet surface is
    available, driving fibrin formation and platelet recruitment sufficiently to
    close the gap left by the failed plug - a bypass, not a correction. It is
    included as the module's mechanistic target pattern because it is defined
    against the central node rather than against any one missing protein, which
    is why it works across the family. Its evidence base is Glanzmann
    thrombasthenia, particularly in patients alloimmunized or refractory to
    platelet transfusion, where it avoids the transfusion exposure that created
    the problem. Conforming disorders do NOT inherit this as a treatment
    recommendation.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: BYPASSES
    description: >-
      Restores haemostasis at the site of injury by an alternative route -
      thrombin generation and fibrin formation - without restoring the missing
      platelet adhesion, signalling, aggregation, or procoagulant function.
    evidence:
    - reference: PMID:26001792
      reference_title: "The international, prospective Glanzmann Thrombasthenia Registry: treatment and outcomes in surgical intervention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For all patients, regardless of platelet antibody or refractoriness status, recombinant factor VIIa, administered with or without platelets (±antifibrinolytics), provided effective hemostasis with a low frequency of adverse events in surgical procedures in Glanzmann thrombasthenia patients."
      explanation: >-
        Registry evidence that the agent achieves haemostasis - the module's
        central node - in a disorder whose platelet aggregation machinery it
        does not repair.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Administration of recombinant factor VIIa is an increasingly used therapeutic alternative."
    explanation: >-
      Establishes the agent's place in management of the prototype disorder of
      this family.
discussions:
- discussion_id: gap_arm_identity_vs_bleeding_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the identity of the interrupted arm predict anything about bleeding
    severity, once the degree of residual function is accounted for?
  attaches_to:
  - pathophysiology#Mucocutaneous Bleeding Diathesis
  rationale: >-
    The module asserts convergence on a shared clinical output, and the
    literature supports that the output is clinically indistinguishable between
    members. What it does not establish is whether the arms are truly
    equivalent - whether, for instance, losing the procoagulant arm is
    systematically milder or more severe than losing adhesion at matched
    residual function. Severity is known to vary widely even within one genotype
    (Glanzmann thrombasthenia ranges from minimal bruising to fatal
    haemorrhage), which means intra-arm variance may simply swamp any inter-arm
    difference. Until this is settled, a conforming entry should not import a
    severity expectation from its arm, and the module does not supply one.
  proposed_experiments:
  - experiment_id: exp_arm_stratified_bleeding_severity
    name: Arm-stratified severity analysis in a pooled inherited platelet disorder registry
    description: >-
      Assign each genotyped registry patient to a module arm, quantify bleeding
      with a standardized bleeding-assessment tool, and test for an arm effect
      after adjusting for residual protein/function level, age, sex and
      menstrual status. A null result would strengthen the convergence claim as
      stated; a positive one would mean the module needs arm-specific
      consequence nodes rather than a single shared one.

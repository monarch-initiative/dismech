    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A prevailing hypothesis is that activity-dependent synaptic modulation is mediated by neurotrophins."
    explanation: >-
      States the BDNF-to-plasticity dependence this node rests on, and states it
      as a prevailing hypothesis rather than a settled result.
  - reference: PMID:20375082
    reference_title: "Lead exposure during synaptogenesis alters vesicular proteins and impairs vesicular release: potential role of NMDA receptor-dependent BDNF signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of vesicular release using FM 1-43 dye confirmed that Pb(2+)
      exposure impaired vesicular release and reduced the number of
      fast-releasing sites.
    explanation: >-
      A functional measurement of degraded synaptic transmission after exposure
      during the synaptogenesis window.
  downstream:
  - target: Learning and Memory Impairment
    description: >-
      Hippocampal and cortical plasticity is the substrate of declarative
      learning, so a plasticity deficit acquired during development presents as a
      cognitive deficit.
    evidence:
    - reference: PMID:16269318
      reference_title: "Lead neurotoxicity: from exposure to molecular effects."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        During the last two decades, advances in behavioral, cellular and
        molecular neuroscience have provided the necessary experimental tools to
        begin deciphering the many and complex effects of Pb(2+) on neuronal
        processes and cell types that are essential for synaptic plasticity and
        learning and memory in the mammalian brain.
      explanation: >-
        Links the plasticity substrate to the learning and memory outcome that
        terminates this module's chain.
- name: Learning and Memory Impairment
  description: >-
    The organism-level outcome: impaired learning and memory. In the
    developmental toxicant conformers this appears as a dose-dependent decrement
    in measured intellectual function in exposed children, with no identified
    threshold; in the autoimmune conformer it appears as the anterograde amnesia
    and behavioural disturbance of encephalitis, and is reversible with receptor
    recovery.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:

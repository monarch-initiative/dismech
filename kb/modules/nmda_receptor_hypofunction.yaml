name: NMDA Receptor Hypofunction Module
description: >-
  A conserved neurodevelopmental and neurotoxicological mechanism module for
  disorders in which glutamatergic signalling at NMDA receptors is *suppressed*
  rather than excessive. Diverse insults converge on reduced NMDA-receptor
  channel activity — open-channel or allosteric antagonism by an environmental
  toxicant (lead), a developmental NMDA-receptor antagonist (ethanol,
  dissociative anaesthetics), or antibody-mediated capping and internalization of
  surface receptors (anti-NMDAR encephalitis). Reduced receptor activity lowers
  NMDA-receptor-mediated calcium entry, which is the rate-limiting step and the
  key conformance target ("nmda_receptor_hypofunction#Reduced NMDA
  Receptor-Mediated Calcium Influx"); loss of that calcium signal reduces
  activity-dependent BDNF transcription and secretion, degrades activity-dependent
  synaptic plasticity, and manifests as a learning and memory deficit.
  Conforming disorder entries substitute the disorder-specific route to receptor
  hypofunction and the vulnerable neuronal population while preserving the
  conserved receptor-to-calcium-to-BDNF-to-plasticity chain. This module is the
  opposite-sign counterpart of glutamate_excitotoxicity, which models excessive
  receptor stimulation and calcium *overload*; it is distinct from
  excitatory_synapse_scaffold_disruption, where the primary lesion is a
  postsynaptic-density scaffold protein rather than receptor activity itself, and
  from epilepsy_excitation_inhibition_imbalance, which models network-level
  hypersynchrony. There is no drug-target treatment pattern at module level: the
  therapeutic handle is removal of the antagonist (chelation, abstinence,
  immunotherapy), which is disorder-specific.
category: Module
module_categories:
- NEUROSCIENCE
- DEVELOPMENTAL_BIOLOGY
- TOXICOLOGY
creation_date: "2026-08-31T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease — do NOT create an "NMDA
  Receptor Hypofunction" Disease entry. Disorder entries reference individual
  nodes via conforms_to (e.g. "nmda_receptor_hypofunction#Reduced NMDA
  Receptor-Mediated Calcium Influx"). The module was factored out of the AOP-Wiki
  mapping work in dismech#8309/#9976: AOP 12 (WPHA/WNT endorsed, "Chronic binding
  of antagonist to NMDARs during brain development leads to neurodegeneration with
  impairment in learning and memory in aging") has three Key Events — KE201
  (binding of antagonist, NMDA receptors), KE195 (inhibition, NMDARs) and KE52
  (decreased calcium influx) — plus KE381 (reduced levels of BDNF) that no
  dismech module could accept, because glutamate_excitotoxicity is built end to
  end on the opposite sign. The node names here are deliberately
  direction-explicit for the same reason. Conformance may be partial: the
  developmental toxicant conformers (lead, ethanol) carry the whole chain,
  whereas anti-NMDAR encephalitis reaches the same receptor-hypofunction and
  calcium nodes through autoantibody-mediated receptor loss in a mature brain and
  therefore conforms at the upstream nodes without the developmental BDNF arm.
  Schizophrenia is deliberately NOT wired as a conformer: its NMDA-hypofunction
  model is specific to parvalbumin interneurons and proceeds through cortical
  disinhibition, which is a different downstream chain. The generic cell type is
  glutamatergic neuron (CL:0000679); conforming entries substitute the relevant
  population (hippocampal pyramidal neuron, cortical neuron). Note the molecular
  chain below the calcium node is evidenced almost entirely in cultured rodent
  neurons and in vivo rodent models; the human evidence is epidemiological, which
  is recorded as a HUMAN_MODEL_MISMATCH discussion rather than smoothed over.
pathophysiology:
- name: NMDA Receptor Antagonism or Receptor Loss
  description: >-
    The shared initiating lesion is a reduction in the number or availability of
    functional NMDA receptors at glutamatergic synapses. Two routes converge
    here. In the toxicant and pharmacological route, a ligand blocks the receptor
    directly: Pb2+ inhibits the NMDA-receptor ion-channel complex selectively
    over AMPA and kainate receptors, ethanol antagonizes NMDA receptors during
    the synaptogenesis window, and dissociative anaesthetics act as open-channel
    blockers. In the autoimmune route, IgG against the GluN1 subunit caps and
    internalizes surface receptors without blocking the channel pore. Conforming
    entries substitute their own route; what the module asserts is only that the
    functional receptor pool is reduced.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  cellular_components:
  - preferred_term: NMDA receptor complex
    term:
      id: GO:0017146
      label: NMDA selective glutamate receptor complex
    modifier: DECREASED
  evidence:
  - reference: PMID:1689669
    reference_title: "Selective blockade of NMDA-activated channel currents may be implicated in learning deficits caused by lead."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pb2+ (2.5-50 microM) selectively inhibited N-methyl-D-aspartate
      (NMDA)-induced whole-cell and single-channel currents in a
      concentration-dependent but voltage-independent manner, without
      significantly altering currents induced by either quisqualate or kainate.
    explanation: >-
      Establishes the toxicant route to the trigger, and its selectivity for the
      NMDA receptor over the other ionotropic glutamate receptors, which is what
      makes this module narrower than a general glutamatergic-signalling module.
  - reference: PMID:2467382
    reference_title: "Ethanol inhibits NMDA-activated ion current in hippocampal neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The amplitude of the NMDA-activated current was reduced 61 percent by 50 mM
      EtOH; in contrast, this concentration of EtOH reduced the amplitude of
      current activated by the glutamate receptor agonists kainate and
      quisqualate by only 18 and 15 percent, respectively.
    explanation: >-
      A second, chemically unrelated antagonist reaching the same trigger with
      the same receptor selectivity as lead, which is what makes the node
      module-shaped rather than a detail of lead poisoning. Ethanol also
      potentiates GABA(A) receptors in parallel, so a conforming fetal alcohol
      node is partial.
  - reference: PMID:10669420
    reference_title: "Ethanol-induced apoptotic neurodegeneration and fetal alcohol syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vulnerability coincides with the period of synaptogenesis, which in humans
      extends from the sixth month of gestation to several years after birth.
    explanation: >-
      Sets the developmental window over which this trigger is damaging, which is
      why the module is scoped to developmental exposure for the toxicant
      conformers. The window is inferred from rat forebrain exposure and mapped
      onto human synaptogenesis by the authors.
  - reference: PMID:20427647
    reference_title: "Cellular and synaptic mechanisms of anti-NMDA receptor encephalitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mechanism of this decrease is selective antibody-mediated capping and
      internalization of surface NMDARs
    explanation: >-
      The autoimmune route to the same trigger: the receptor pool is depleted by
      internalization rather than by channel block, which is why this node is
      named for receptor loss as well as antagonism.
  downstream:
  - target: NMDA Receptor Hypofunction
    description: >-
      Fewer available or conductive receptors reduce NMDA-receptor-mediated
      current, whether the receptors are blocked in place or removed from the
      surface.
    evidence:
    - reference: PMID:20427647
      reference_title: "Cellular and synaptic mechanisms of anti-NMDA receptor encephalitis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        whole-cell patch-clamp recordings of miniature EPSCs in cultured rat
        hippocampal neurons showed that patients' antibodies specifically
        decreased synaptic NMDAR-mediated currents, without affecting AMPA
        receptor-mediated currents
      explanation: >-
        Directly measures the functional consequence of receptor loss as reduced
        NMDAR-mediated synaptic current, and shows the deficit is specific to
        this receptor class.
- name: NMDA Receptor Hypofunction
  description: >-
    Reduced NMDA-receptor channel activity at glutamatergic synapses — the
    functional state the two upstream routes converge on. Measured as decreased
    NMDA-evoked whole-cell and single-channel current, reduced channel opening
    frequency, or decreased NMDAR-mediated miniature EPSC amplitude. AMPA- and
    kainate-receptor-mediated transmission is characteristically spared, which
    distinguishes this node from a global loss of excitatory transmission.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:1689669
    reference_title: "Selective blockade of NMDA-activated channel currents may be implicated in learning deficits caused by lead."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The frequency of NMDA-induced channel activation was decreased by Pb2+."
    explanation: >-
      A single-channel measurement of the hypofunction state itself, independent
      of which ligand produced it.
  - reference: PMID:9872743
    reference_title: "Blockade of NMDA receptors and apoptotic neurodegeneration in the developing brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Blockade of N-methyl-D-aspartate (NMDA) glutamate receptors for only a few
      hours during late fetal or early neonatal life triggered widespread
      apoptotic neurodegeneration in the developing rat brain, suggesting that
      the excitatory neurotransmitter glutamate, acting at NMDA receptors,
      controls neuronal survival.
    explanation: >-
      Establishes that NMDA-receptor hypofunction is by itself sufficient to
      injure the developing brain, and that the developmental window is short —
      the reason this module is scoped to the suppressed direction rather than
      treated as a mild form of normal signalling.
  downstream:
  - target: Reduced NMDA Receptor-Mediated Calcium Influx
    description: >-
      The NMDA receptor is the principal activity-gated calcium-permeable
      channel at the excitatory synapse, so reduced channel activity translates
      directly into reduced calcium entry.
    evidence:
    - reference: PMID:16269318
      reference_title: "Lead neurotoxicity: from exposure to molecular effects."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Our working hypothesis is that disruption of the ontogenetically defined
        pattern of NMDAR subunit expression and NMDAR-mediated calcium signaling
        in glutamatergic synapses is a principal mechanism for Pb(2+)-induced
        deficits in synaptic plasticity and in learning and memory documented in
        animal models of Pb(2+) neurotoxicity.
      explanation: >-
        States the receptor-to-calcium-signalling step and its downstream
        plasticity and cognitive consequences as the principal mechanism. Framed
        by the authors as a working hypothesis, which is the epistemic status
        this module inherits.
- name: Reduced NMDA Receptor-Mediated Calcium Influx
  description: >-
    The rate-limiting step and key conformance target. Loss of NMDA-receptor
    conductance removes the coincidence-detected calcium transient that couples
    synaptic activity to the postsynaptic calcium-dependent signalling machinery
    (CaMKII, calcineurin, and the calcium-responsive transcriptional program).
    The node is defined by the *direction* of the change: this is the point at
    which the module is the mirror image of glutamate_excitotoxicity, where the
    same receptor produces pathological calcium overload.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: DECREASED
  locations:
  - preferred_term: hippocampal formation
    term:
      id: UBERON:0002421
      label: hippocampal formation
  evidence:
  - reference: PMID:16269318
    reference_title: "Lead neurotoxicity: from exposure to molecular effects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this review, we concentrate our efforts on the effects of Pb(2+) on
      glutamatergic synapses and specifically on the accumulating evidence that
      the N-methyl-D-aspartate type of excitatory amino acid receptor (NMDAR) is
      a direct target for Pb(2+) effects in the brain.
    explanation: >-
      Supports the NMDA receptor being the direct target through which the
      calcium signal is lost, rather than calcium handling being perturbed
      independently.
  - reference: PMID:22345308
    reference_title: "Dysregulation of BDNF-TrkB signaling in developing hippocampal neurons by Pb(2+): implications for an environmental basis of neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The effect of Pb(2+) on BDNF gene expression was associated with a specific
      decrease in calcium-sensitive exon IV transcript levels and reduced
      phosphorylation and protein expression of the transcriptional repressor
      methyl-CpG-binding protein (MeCP2).
    explanation: >-
      The transcript selectively lost is the calcium-sensitive one, which is what
      makes the reduced calcium signal — not some parallel action of the
      toxicant — the plausible cause of the downstream BDNF deficit.
  downstream:
  - target: Reduced BDNF Expression and Secretion
    description: >-
      Activity-driven calcium entry is the signal that drives BDNF transcription
      and activity-dependent secretion, so removing it lowers both.
    evidence:
    - reference: PMID:12663747
      reference_title: "BDNF and activity-dependent synaptic modulation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Data accumulated in recent years suggest that neuronal activity regulates
        the transcription of BDNF gene, the transport of BDNF mRNA and protein
        into dendrites, and the secretion of BDNF protein.
      explanation: >-
        Establishes the general activity-to-BDNF dependence that makes reduced
        synaptic calcium entry a cause of reduced BDNF rather than a correlate.
- name: Reduced BDNF Expression and Secretion
  description: >-
    Loss of the calcium-dependent transcriptional drive lowers BDNF gene and
    protein expression and reduces the extracellular mature BDNF available at the
    synapse. Transport and processing are affected alongside transcription, and
    TrkB receptor levels and autophosphorylation fall in parallel, so the deficit
    is in BDNF-TrkB signalling as a whole rather than in ligand abundance alone.
  role: effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hippocampal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  biological_processes:
  - preferred_term: BDNF gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: DECREASED
  - preferred_term: BDNF secretion
    term:
      id: GO:0046903
      label: secretion
    modifier: DECREASED
  - preferred_term: BDNF-TrkB signaling
    term:
      id: GO:0031547
      label: brain-derived neurotrophic factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:22345308
    reference_title: "Dysregulation of BDNF-TrkB signaling in developing hippocampal neurons by Pb(2+): implications for an environmental basis of neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that Pb(2+) exposure decreases BDNF gene and protein expression,
      and it may also alter the transport of BDNF vesicles to sites of release by
      altering Huntingtin phosphorylation and protein levels.
    explanation: >-
      Direct measurement of the reduced-BDNF node in hippocampal neurons exposed
      during synaptogenesis, covering both expression and delivery.
  - reference: PMID:20375082
    reference_title: "Lead exposure during synaptogenesis alters vesicular proteins and impairs vesicular release: potential role of NMDA receptor-dependent BDNF signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that NMDAR inhibition by aminophosphonovaleric acid mimics the
      presynaptic effects of Pb(2+) exposure.
    explanation: >-
      A pharmacological NMDA-receptor antagonist reproduces the deficit, which
      attributes it to receptor hypofunction itself rather than to any other
      action of lead — the key control for the upstream half of this module.
  downstream:
  - target: Impaired Activity-Dependent Synaptic Plasticity
    description: >-
      BDNF-TrkB signalling is the principal trophic mediator of activity-dependent
      synaptic strengthening, so its loss degrades plasticity.
    evidence:
    - reference: PMID:20375082
      reference_title: "Lead exposure during synaptogenesis alters vesicular proteins and impairs vesicular release: potential role of NMDA receptor-dependent BDNF signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "exogenous addition of BDNF rescued the presynaptic effects of Pb(2+)"
      explanation: >-
        A rescue experiment: restoring the lost ligand restores synaptic
        function, which is the strongest available evidence that the BDNF deficit
        is on the causal path rather than parallel to it.
- name: Impaired Activity-Dependent Synaptic Plasticity
  description: >-
    Degraded activity-dependent modification of synaptic strength and of
    presynaptic vesicular release, evidenced as impaired long-term potentiation,
    loss of vesicular-release proteins, and reduced numbers of fast-releasing
    sites. In the developmental conformers this coincides with the synaptogenesis
    window, so the deficit is built into the circuit rather than imposed on a
    mature one.
  role: effector
  biological_scale: CELLULAR

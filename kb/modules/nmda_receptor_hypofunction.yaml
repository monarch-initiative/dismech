    modifier: DECREASED
  evidence:
  - reference: PMID:16002379
    reference_title: "Low-level environmental lead exposure and children's intellectual function: an international pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After adjustment for covariates, we found an inverse relationship between
      blood lead concentration and IQ score.
    explanation: >-
      The human anchor for this node — a pooled analysis of seven longitudinal
      cohorts. Note this establishes the exposure-to-outcome association in
      humans, not the molecular chain above it.
  - reference: PMID:20427647
    reference_title: "Cellular and synaptic mechanisms of anti-NMDA receptor encephalitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The loss of this subtype of glutamate receptors eliminates NMDAR-mediated
      synaptic function, resulting in the learning, memory, and other behavioral
      deficits observed in patients with anti-NMDAR encephalitis.
    explanation: >-
      Attributes the same cognitive outcome to receptor loss in a non-toxicant,
      non-developmental setting, which is what makes the outcome node conserved
      rather than a feature of lead exposure.
discussions:
- discussion_id: nmdar_hypofunction_bdnf_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the NMDA-receptor-to-calcium-to-BDNF chain characterized in cultured
    embryonic rat hippocampal neurons and in neonatal rodents operate in the
    developing human brain, or is the human evidence compatible with a different
    mechanism linking developmental exposure to cognitive deficit?
  attaches_to:
  - "pathophysiology#Reduced BDNF Expression and Secretion"
  - "pathophysiology#Learning and Memory Impairment"
  rationale: >-
    The two ends of this module are evidenced in different systems and the middle
    is not bridged in humans. The outcome node rests on human epidemiology — a
    pooled analysis of seven longitudinal cohorts showing an inverse blood-lead
    to IQ relationship with no apparent threshold — while every step from
    receptor block through calcium entry to BDNF-TrkB signalling and vesicular
    release is measured in cultured rat hippocampal neurons or in neonatal
    rodents. The rodent work is strong on its own terms, including a rescue
    experiment in which exogenous BDNF restores the presynaptic deficit, but no
    human study measures BDNF or NMDA-receptor function in exposed children, and
    lead has well-documented parallel neuronal actions (calcium mimicry in second
    messenger signalling, protein kinase C dysregulation, oxidative stress) that
    could produce the same cognitive endpoint. The developmental window is also
    species-scaled: the synaptogenesis period that confers vulnerability spans
    days in the rat and from roughly the sixth month of gestation to several
    years after birth in humans, so exposure timing does not translate directly.
  proposed_experiments:
  - experiment_id: human_ipsc_neuron_nmdar_bdnf_chain
    name: Human iPSC-derived neuron reconstruction of the receptor-calcium-BDNF chain
    description: >-
      Expose human iPSC-derived cortical or hippocampal neurons across the in
      vitro synaptogenesis window to Pb2+ and to a selective NMDA-receptor
      antagonist, and measure NMDAR-mediated calcium transients, BDNF exon-IV
      transcript and secreted mature BDNF, and TrkB autophosphorylation. Testing
      the antagonist alongside the toxicant separates receptor hypofunction from
      lead's parallel actions in a human cellular background.
  - experiment_id: cohort_bdnf_biomarker_dose_response
    name: BDNF biomarker dose-response in an exposed paediatric cohort
    description: >-
      In an existing longitudinal childhood lead cohort with banked samples,
      test whether circulating BDNF tracks blood lead concentration and mediates
      any part of the lead-to-IQ association. A null result would not refute the
      cellular mechanism, since peripheral BDNF is an imperfect proxy for
      synaptic BDNF, but a dose-dependent association would be the first human
      measurement anywhere on the molecular chain.

  reports_on:
  - target: Pacemaker Rate Depression
    relationship: READOUT_OF
- category: Cardiovascular
  name: Ventricular Tachycardia
  description: >-
    Sustained rapid ventricular rhythm reached from triggered ectopic activity.
  phenotype_term:
    preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:19514874
    reference_title: Aconite poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The cardiovascular features include hypotension, chest pain, palpitations,
      bradycardia, sinus tachycardia, ventricular ectopics, ventricular
      tachycardia, and ventricular fibrillation.
    explanation: >-
      Clinical toxicology review; no primary experimental system. Names this

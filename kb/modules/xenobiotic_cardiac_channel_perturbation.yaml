name: Xenobiotic Cardiac Ion-Channel Perturbation Module
category: Module
creation_date: "2026-09-03T16:40:00Z"
module_categories:
- TOXICOLOGY
- PHARMACOLOGY
description: >-
  A conserved cardiac electrophysiology mechanism module for acquired arrhythmia
  and rate disturbance caused by a drug or toxin acting directly on a cardiac ion
  channel. A xenobiotic binds a channel and changes its gating -- either blocking
  it (IKr/hERG blockade by QT-prolonging drugs, L-type calcium channel blockade
  by verapamil-class agents, funny-current blockade by ivabradine) or holding it
  pathologically open (aconitine suppressing sodium channel inactivation). Either
  direction alters the affected ionic current, which alters the cardiomyocyte
  action potential; from there the chain splits into afterdepolarization-driven
  triggered activity in working myocardium and into pacemaker rate depression at
  the sinoatrial node, both converging on clinical arrhythmia. The key
  conformance target is `Altered Cardiac Action Potential`, the disorder-agnostic
  step every conformer funnels through regardless of which channel was hit or in
  which direction. This module is the acquired counterpart of
  `cardiac_ion_channel_repolarization`, which shares the same downstream chain
  but opens at a pathogenic germline variant rather than a xenobiotic; the two
  are complementary and a disorder may legitimately conform to both when a drug
  unmasks a latent channelopathy. It is distinct from
  `cardiomyopathy_maladaptive_remodeling`, which reaches heart failure through
  structural remodeling rather than through a channel gating change.
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  "Xenobiotic Cardiac Ion-Channel Perturbation" Disease entry. Disorder entries
  reference individual nodes via conforms_to, for example
  "xenobiotic_cardiac_channel_perturbation#Altered Cardiac Action Potential".
  Conforming nodes substitute the specific xenobiotic, the channel it acts on,
  and the direction of the gating change (block or persistent activation).

  Scope: the xenobiotic must act on the channel itself. A drug that causes
  arrhythmia through electrolyte disturbance, ischaemia, or structural injury
  belongs elsewhere, even when the endpoint looks the same.

  Direction is deliberately not fixed at the trigger node. Channel blockade and
  pathological channel activation are opposite gating changes that converge on
  the same altered action potential, and both are in scope; the node
  descriptions and the conforming entry carry which one applies.

  The action-potential change is likewise not fixed as prolongation. In guinea
  pig ventricular myocytes the direction depends on agent and concentration --
  low-dose verapamil prolongs APD90 while higher concentrations and nisoldipine
  shorten it (PMID:9335409) -- so the central effector is stated as an altered
  action potential rather than a prolonged one.

  Curation note: the AOP-Wiki pathways covering this mechanism (AOP 552, 555,
  560, 95) carry no literature on any of their causal relationships and have
  never been OECD reviewed, and AOP 552's bibliography contains two citations
  that do not resolve to the papers it names. Every reference here was found
  independently of those bibliographies. See dismech issues #10368 and #10773.
pathophysiology:
- name: Xenobiotic Cardiac Ion-Channel Perturbation
  description: >-
    A drug or toxin binds a cardiac ion channel and changes its gating. The
    change may be blockade, as with IKr/hERG blockade by QT-prolonging drugs,
    L-type calcium channel blockade by verapamil-class agents, or funny-current
    blockade by ivabradine; or it may be pathological activation, as with
    aconitine binding the open state of the cardiac sodium channel and
    suppressing its inactivation. This is the acquired counterpart of a germline
    channel variant and is the entry point for drug- and toxin-induced arrhythmia.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: monoatomic ion channel activity
    term:
      id: GO:0005216
      label: monoatomic ion channel activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16554806
    reference_title: hERG potassium channels and cardiac arrhythmia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Arrhythmia can also be induced by a blockage of hERG channels by a
      surprisingly diverse group of drugs.
    explanation: >-
      Review of hERG channel structure and pharmacology; no primary experimental
      system. Establishes drug blockade of a cardiac potassium channel as a
      recognized cause of acquired arrhythmia, which is the blockade direction of
      this trigger node.
  - reference: PMID:12084770
    reference_title: Current-dependent block of rabbit sino-atrial node I(f) channels by ivabradine.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Ivabradine is an open-channel blocker; however, block is exerted
      preferentially when channels deactivate on depolarization, and is relieved
      by long hyperpolarizing steps.
    explanation: >-
      Voltage-clamp recording of I(f) in isolated rabbit sino-atrial node
      myocytes. Characterizes the drug-channel interaction directly, showing a
      xenobiotic altering the gating of a cardiac pacemaker channel.
  - reference: PMID:19514874
    reference_title: Aconite poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Aconitine and mesaconitine bind with high affinity to the open state of the
      voltage-sensitive sodium channels at site 2, thereby causing a persistent
      activation of the sodium channels, which become refractory to excitation.
    explanation: >-
      Clinical toxicology review; no primary experimental system. Establishes the
      pathological-activation direction of this node, in which a toxin holds a
      cardiac sodium channel open rather than blocking it.
  - reference: PMID:9760702
    reference_title: The effects of Aconitum alkaloids on the central nervous system.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      aconitine, a highly toxic diterpenoid alkaloid which is known to suppress
      the inactivation of voltage-dependent Na+ channels by binding to neurotoxin
      binding site 2 of the alpha-subunit of the channel protein
    explanation: >-
      Review of Aconitum alkaloid effects on the central nervous system; no
      primary experimental system. The quoted statement is channel-level
      pharmacology and is not organ-specific, which is why it is usable here --
      it names the gating change, suppressed inactivation, that distinguishes
      pathological activation from blockade. For the cardiac specificity of that
      claim, see PMID:19514874 on this node, which covers excitable tissues
      including the myocardium.
  downstream:
  - target: Altered Cardiac Ionic Current
    causal_link_type: DIRECT
    description: >-
      The gating change alters the current carried by the affected channel.
- name: Altered Cardiac Ionic Current
  description: >-
    The current carried by the perturbed channel departs from normal. Blockade
    reduces peak current, as with suppression of L-type calcium current by
    verapamil or of I(f) by ivabradine; suppressed inactivation instead sustains
    an inward current beyond its normal window. Agents are frequently not
    selective for a single conductance, so the net current change may involve
    several currents at once.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: voltage-gated calcium channel activity
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: ABNORMAL
  - preferred_term: voltage-gated potassium channel activity
    term:
      id: GO:0005249
      label: voltage-gated potassium channel activity
    modifier: ABNORMAL
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9335409
    reference_title: >-
      Multiple modulations of action potential duration by different calcium
      channel blocking agents in guinea pig ventricular myocytes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Applications of Mn2+ and verapamil suppressed amplitudes of the L-type Ca2+
      current (ICa), the delayed outward K+ current (IK), and the inward
      rectifier K+ current (IK1).
    explanation: >-
      Whole-cell patch clamp in isolated guinea pig ventricular myocytes.
      Measures the current change produced by channel-blocking agents, and shows
      that a blocker may suppress several currents rather than one.
  downstream:
  - target: Altered Cardiac Action Potential
    causal_link_type: DIRECT
    description: >-
      The altered current changes the shape or timing of the action potential.
- name: Altered Cardiac Action Potential
  description: >-
    The cardiomyocyte action potential departs from its normal configuration --
    in duration, plateau amplitude, or the slope of diastolic depolarization.
    This is the key conformance target: it is where every xenobiotic entry point
    converges regardless of which channel was hit, and it is the step at which
    this module and the inherited-channelopathy module become the same chain. The
    direction of change is agent- and concentration-dependent and is not fixed
    here.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle cell action potential
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9335409
    reference_title: >-
      Multiple modulations of action potential duration by different calcium
      channel blocking agents in guinea pig ventricular myocytes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that different types of Ca2+ channel blocking agents (Mn2+,
      verapamil, and nisoldipine) diversely modulate APD because of their
      multiple modes of actions on ICa and IK.
    explanation: >-
      Whole-cell patch clamp in isolated guinea pig ventricular myocytes,
      measuring action potential duration at 90% repolarization. Supports channel
      blockade altering the action potential, and supports leaving the direction
      of change unfixed at this node.
  - reference: PMID:20167941
    reference_title: The role of the funny current in pacemaker activity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The degree of activation of the funny current determines, at the end of an
      action potential, the steepness of phase 4 depolarization; hence, the
      frequency of action potential firing.
    explanation: >-
      Review of pacemaker physiology; no primary experimental system. Supports
      the pacemaker branch of this node, in which the altered current changes the
      slope of diastolic depolarization rather than repolarization.
  downstream:
  - target: Arrhythmogenic Triggered Activity
    causal_link_type: DIRECT
    description: >-
      An altered action potential in working myocardium supports
      afterdepolarization-driven triggered activity.
  - target: Pacemaker Rate Depression
    causal_link_type: DIRECT
    description: >-
      A shallower phase 4 depolarization at the sinoatrial node slows the firing
      rate.
- name: Arrhythmogenic Triggered Activity
  description: >-
    The altered action potential permits afterdepolarizations -- early
    afterdepolarizations arising from a prolonged plateau, delayed
    afterdepolarizations from calcium overload -- which reach threshold and
    generate ectopic beats. This is the working-myocardium branch of the module.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: membrane depolarization during action potential
    term:
      id: GO:0086010
      label: membrane depolarization during action potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19514874
    reference_title: Aconite poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The electrophysiological mechanism of arrhythmia induction is triggered
      activity due to delayed after-depolarization and early after-depolarization.
    explanation: >-
      Clinical toxicology review; no primary experimental system. Names both
      afterdepolarization types as the mechanism linking a xenobiotic-perturbed
      action potential to ectopic activity.
  downstream:
  - target: Xenobiotic-Induced Cardiac Arrhythmia
    causal_link_type: DIRECT
    description: >-
      Triggered ectopic beats initiate and sustain clinical arrhythmia.
- name: Pacemaker Rate Depression
  description: >-
    Reduced pacemaker current at the sinoatrial node flattens diastolic
    depolarization and slows spontaneous firing, producing bradycardia. This is
    the pacemaker branch of the module, and is the therapeutic mechanism of
    ivabradine as well as the toxic mechanism of excessive funny-current or
    calcium-channel blockade.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: sinoatrial node pacemaker cell
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:
  - preferred_term: regulation of heart rate
    term:
      id: GO:0002027
      label: regulation of heart rate
    modifier: DECREASED
  evidence:
  - reference: PMID:20167941
    reference_title: The role of the funny current in pacemaker activity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Molecules able to bind specifically to and block f-channels can thus be
      used as pharmacological tools for heart rate reduction with little or no
      adverse cardiovascular side effects.
    explanation: >-
      Review of pacemaker physiology; no primary experimental system. Graded
      INDIRECT because it is a therapeutic-response statement: rate reduction on
      giving an f-channel blocker implies the mechanism rather than measuring it.
  - reference: PMID:12084770
    reference_title: Current-dependent block of rabbit sino-atrial node I(f) channels by ivabradine.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The use-dependence resulting from specific features of I(f) block by
      ivabradine amplifies its rate-reducing ability at high spontaneous rates
      and may be useful to clinical applications.
    explanation: >-
      Voltage-clamp recording of I(f) in isolated rabbit sino-atrial node
      myocytes. Ties the measured channel block to rate reduction, and shows the
      effect is greater at high spontaneous rates.
  downstream:
  - target: Xenobiotic-Induced Cardiac Arrhythmia
    causal_link_type: DIRECT
    description: >-
      Excessive rate depression is itself a clinical rhythm disturbance.
- name: Xenobiotic-Induced Cardiac Arrhythmia
  description: >-
    The clinical endpoint: a rhythm disturbance attributable to a drug or toxin
    acting on a cardiac ion channel. Depending on the branch reached, this
    presents as torsade de pointes and polymorphic ventricular tachycardia from
    triggered activity, or as symptomatic bradycardia and sinus arrest from rate
    depression.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19514874
    reference_title: Aconite poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The cardiovascular features include hypotension, chest pain, palpitations,
      bradycardia, sinus tachycardia, ventricular ectopics, ventricular
      tachycardia, and ventricular fibrillation.
    explanation: >-
      Clinical toxicology review; no primary experimental system. Names endpoints
      on both branches of this module -- bradycardia from the pacemaker branch,
      ventricular ectopics and tachyarrhythmia from the triggered-activity
      branch.
phenotypes:
- category: Cardiovascular
  name: Torsade de Pointes
  description: >-
    Polymorphic ventricular tachycardia arising on a prolonged action potential,
    the characteristic presentation of the triggered-activity branch.
  phenotype_term:
    preferred_term: Torsade de pointes
    term:
      id: HP:0001664
      label: Torsade de pointes
  evidence:
  - reference: PMID:25083239
    reference_title: "Drug-induced QT interval prolongation: mechanisms and clinical management."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The prolonged QT interval is both widely seen and associated with the
      potentially deadly rhythm, Torsades de Pointes (TdP).
    explanation: >-
      Review of drug-induced QT prolongation; no primary experimental system.
      Ties torsade de pointes to the prolonged action potential this module's
      triggered-activity branch produces.
  reports_on:
  - target: Arrhythmogenic Triggered Activity
    relationship: READOUT_OF
- category: Cardiovascular
  name: Bradycardia
  description: >-
    Slowed heart rate from pacemaker current suppression, the presentation of the
    rate-depression branch.
  phenotype_term:
    preferred_term: Bradycardia
    term:
      id: HP:0001662
      label: Bradycardia
  evidence:
  - reference: PMID:19514874
    reference_title: Aconite poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The cardiovascular features include hypotension, chest pain, palpitations,
      bradycardia, sinus tachycardia, ventricular ectopics, ventricular
      tachycardia, and ventricular fibrillation.
    explanation: >-
      Clinical toxicology review; no primary experimental system. Names this
      phenotype among the cardiovascular presenting features of a xenobiotic

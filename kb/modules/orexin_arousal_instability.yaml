name: Orexin Arousal Instability Module
description: >-
  A conserved sleep-wake control mechanism module representing failure of the
  hypothalamic orexin (hypocretin) system to stabilise behavioural state. Orexin
  neurons are a small, anatomically restricted population of the lateral
  hypothalamic area that project to and excite the ascending arousal nuclei
  (locus coeruleus, tuberomammillary nucleus, dorsal raphe, basal forebrain,
  ventral tegmental area) and thereby hold the sleep-wake switch in a stable
  position. When orexin signalling is lost, no single state is abolished: the
  boundaries between wake, NREM sleep, and REM sleep become porous. The chain
  runs loss of orexin signal -> reduced orexin receptor drive at arousal nuclei
  -> sleep-wake state instability (the rate-limiting, disorder-agnostic node) ->
  dissociated intrusion of REM sleep components into wakefulness -> the clinical
  syndrome of hypersomnolence with REM dissociation. Conforming disorder entries
  substitute the disorder-specific route to orexin failure: autoimmune
  destruction of orexin neurons in narcolepsy type 1, a preprohypocretin (HCRT)
  coding mutation in the rare monogenic form, a structural or infiltrative
  hypothalamic lesion in secondary narcolepsy, and receptor-side loss (HCRTR2)
  in the canine model.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "orexin_arousal_instability#Sleep-Wake State Instability", the key conformance
  target and rate-limiting step).

  WHAT CONFORMANCE REQUIRES. Entry at the trigger node requires evidence of an
  orexin-system lesion in that disorder - CSF hypocretin-1 deficiency,
  postmortem orexin neuron loss, or a causal HCRT/HCRTR variant. Hypersomnolence
  alone is NOT sufficient and must not be conformed here. This boundary is the
  main thing the module is for, and two negative cases are load-bearing:

  (1) Idiopathic hypersomnia does NOT conform. Its patients have normal CSF
  hypocretin-1 by definition, and the leading candidate mechanism runs the other
  way - a CSF substance that potentiates GABA-A signalling, i.e. excess
  somnogenic inhibition rather than deficient orexinergic excitation. An
  idiopathic hypersomnia entry may cite this module for contrast but must not
  declare conformance.

  (2) Narcolepsy type 2 (narcolepsy without cataplexy) does NOT conform at the
  trigger node. CSF hypocretin-1 is normal or intermediate in most such
  patients, and whether NT2 is even a distinct entity from idiopathic
  hypersomnia is unsettled. An NT2 entry may conform at
  #Sleep-Wake State Instability and #Dissociated Intrusion of REM Sleep
  Components into Wakefulness if it evidences sleep-onset REM periods, but the
  orexin-deficiency trigger is a claim it cannot make.

  DRUG-TARGET PATTERN - BIDIRECTIONAL, on the same amplifier node. Orexin
  receptor 2 agonists (oveporexton/TAK-861) ACTIVATE #Orexin Receptor Signalling
  Deficiency at Ascending Arousal Nuclei, restoring the missing drive; dual
  orexin receptor antagonists (suvorexant, lemborexant, daridorexant) INHIBIT
  the same node to produce sleep in insomnia. The two arms are the same
  pharmacology read in opposite directions and are the clearest demonstration
  that this node is rate-limiting for wakefulness. Neither is a treatment
  recommendation inherited by conforming disorders: a DORA is contraindicated in
  narcolepsy, and an OX2R agonist would be expected to worsen insomnia.

  SCOPE BOUNDARIES. This module covers the ORIGIN of state instability in the
  orexin system. It deliberately does NOT re-derive the pontine REM-atonia
  circuitry that executes cataplexy and REM sleep behaviour disorder - that is
  rem_sleep_atonia_control_failure, and the relationship is worth stating
  precisely: cataplexy is REM atonia machinery intruding into wakefulness, while
  REM sleep behaviour disorder is that same machinery failing during REM sleep.
  They are opposite failures of one circuit, and a narcolepsy type 1 entry that
  curates both should conform to both modules rather than blending them. The
  module is also distinct from circadian_phase_misalignment (where sleep is
  normal but mistimed) and from
  sleep_disordered_breathing_intermittent_hypoxia (where sleepiness follows
  fragmentation by respiratory events, with an intact orexin system).

  Not an Xogenesis module - a normal stabilising signal is lost, nothing
  pathological is formed.
pathophysiology:
- name: Loss of Hypothalamic Orexin (Hypocretin) Signal
  description: >-
    The shared initiating lesion is loss of the orexin peptide signal originating
    from the lateral hypothalamic area. In the common human form this is
    destruction of the orexin-producing neurons themselves: postmortem series
    show an 85-95% reduction in orexin neuron number, and the loss is
    cell-type-selective - the intermingled melanin-concentrating hormone neurons
    are spared, which excludes a nonspecific hypothalamic lesion. Because the
    population is small and unreplaced, the deficit is permanent and is
    detectable in life as low or undetectable CSF hypocretin-1.
    Conforming disorder nodes substitute the disorder-specific route to this
    lesion: immune-mediated neuron destruction (narcolepsy type 1), a
    preprohypocretin (HCRT) coding mutation impairing peptide trafficking and
    processing (the rare monogenic form), or a structural, inflammatory, or
    infiltrative hypothalamic lesion (secondary/symptomatic narcolepsy).
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: orexin (hypocretin)-producing neuron of the lateral hypothalamus
    term:
      id: CL:0011109
      label: hypocretin-secreting neuron
    modifier: DECREASED
  biological_processes:
  - preferred_term: orexin (hypocretin) neuropeptide signaling
    term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    modifier: DECREASED
  locations:
  - preferred_term: lateral hypothalamic area
    term:
      id: UBERON:0002430
      label: lateral hypothalamic area
  evidence:
  - reference: PMID:11055430
    reference_title: Reduced number of hypocretin neurons in human narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      human narcoleptics have an 85%-95% reduction in the number of Hcrt neurons
    explanation: >-
      Quantifies the trigger lesion in human postmortem hypothalamus and fixes
      its magnitude, which is why the deficit behaves as an all-or-none loss of
      signal rather than a graded reduction.
  - reference: PMID:11055430
    reference_title: Reduced number of hypocretin neurons in human narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Melanin-concentrating hormone (MCH) neurons, which are intermixed with Hcrt
      cells in the normal brain, are not reduced in number, indicating that cell
      loss is relatively specific for Hcrt neurons
    explanation: >-
      Establishes cell-type selectivity, which is what makes this a defined
      module trigger rather than a generic hypothalamic injury; a conforming
      disorder claiming this node should be able to show comparable specificity.
  - reference: PMID:10973318
    reference_title: A mutation in a case of early onset narcolepsy and a generalized absence of hypocretin peptides in human narcoleptic brains.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One Hcrt mutation, impairing peptide trafficking and processing, was found
      in a single case with early onset narcolepsy.
    explanation: >-
      Documents the monogenic substitution at this node - a peptide-side coding
      lesion producing the same loss of signal as neuronal destruction, which is
      the evidence that the trigger is the signal rather than the cell.
  - reference: PMID:10615891
    reference_title: Hypocretin (orexin) deficiency in human narcolepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypocretin was undetectable in seven out of nine people with narcolepsy,
      indicating abnormal hypocretin transmission.
    explanation: >-
      Shows the trigger is measurable in living patients as CSF peptide
      deficiency, which is the operational test a conforming disorder entry uses
      to claim this node.
  downstream:
  - target: Orexin Receptor Signalling Deficiency at Ascending Arousal Nuclei
    description: >-
      Loss of the orexin peptide removes the ligand for OX1R and OX2R on the
      ascending arousal nuclei that orexin neurons innervate.
    causal_link_type: DIRECT

- name: Orexin Receptor Signalling Deficiency at Ascending Arousal Nuclei
  description: >-
    Orexin neurons project widely to the monoaminergic and cholinergic arousal
    nuclei and excite them through OX1R and OX2R. Loss of that excitatory drive -
    whether from absent ligand (the human disease) or absent receptor (the canine
    model) - produces the same phenotype, which localises the rate-limiting step
    to receptor-level signalling rather than to the peptide or the neuron. OX2R
    carries most of the wake-stabilising signal, which is why the receptor
    subtype rather than the cell is the drug target.
  role: amplifier
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: orexin receptor activity
    term:
      id: GO:0016499
      label: orexin receptor activity
    modifier: DECREASED
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  evidence:
  - reference: PMID:10458611
    reference_title: The sleep disorder canine narcolepsy is caused by a mutation in the hypocretin (orexin) receptor 2 gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      canine narcolepsy is caused by disruption of the hypocretin (orexin)
      receptor 2 gene (Hcrtr2)
    explanation: >-
      Receptor-side loss reproduces the full syndrome, which is the evidence that
      this node - not the peptide or the neuron - is where the causal chain is
      rate-limited, and is why the module places the drug target here.
  - reference: PMID:10481909
    reference_title: "Narcolepsy in orexin knockout mice: molecular genetics of sleep regulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      orexin knockout mice exhibit a phenotype strikingly similar to human
      narcolepsy patients
    explanation: >-
      Ligand-side genetic loss converges on the same phenotype as receptor-side
      loss, closing the ligand-receptor argument for this node.
  - reference: PMID:40367374
    reference_title: "Oveporexton, an Oral Orexin Receptor 2-Selective Agonist, in Narcolepsy Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Narcolepsy type 1 is a disorder of hypersomnolence caused by a loss of
      orexin neurons, which results in low orexin levels in the brain.
    explanation: >-
      States the receptor-level deficit that the OX2R agonist arm of the drug
      pattern is designed to reverse.
  downstream:
  - target: Sleep-Wake State Instability
    description: >-
      Without orexinergic excitation the arousal nuclei can no longer be held
      above the threshold that keeps the sleep-wake switch in a stable position,
      so the switch flips at inappropriate times in both directions.
    causal_link_type: DIRECT

- name: Sleep-Wake State Instability
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target.
    Loss of orexinergic stabilisation does not abolish any single behavioural
    state; it makes every state transition too easy. Wakefulness fragments into
    involuntary sleep episodes, and nocturnal sleep fragments into frequent
    awakenings - which is why patients are both excessively sleepy by day and
    poor sleepers by night, an apparent paradox that this node explains and that
    a purely "insufficient wake drive" model does not. A conforming disorder node
    should evidence instability in both directions, not only daytime sleepiness.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sleep-wake cycle state transition
    term:
      id: GO:0022410
      label: circadian sleep/wake cycle process
    modifier: ABNORMAL
  - preferred_term: regulation of the sleep-wake cycle
    term:
      id: GO:0042749
      label: regulation of circadian sleep/wake cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:10481909
    reference_title: "Narcolepsy in orexin knockout mice: molecular genetics of sleep regulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that orexin regulates sleep/wakefulness states
    explanation: >-
      Names the function lost at this node - regulation of state rather than
      production of wakefulness - which is the distinction the module turns on.
  - reference: PMID:10458611
    reference_title: The sleep disorder canine narcolepsy is caused by a mutation in the hypocretin (orexin) receptor 2 gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It is characterized by daytime sleepiness, cataplexy, and striking
      transitions from wakefulness into rapid eye movement (REM) sleep.
    explanation: >-
      Describes the instability phenotype as abrupt inappropriate state
      transitions, which is the readout a conforming node needs.
  downstream:
  - target: Dissociated Intrusion of REM Sleep Components into Wakefulness
    description: >-
      An unstable switch permits REM sleep to be entered directly from
      wakefulness and permits individual REM components to appear in isolation,
      dissociated from the rest of the state.
    causal_link_type: DIRECT

- name: Dissociated Intrusion of REM Sleep Components into Wakefulness
  description: >-
    REM sleep is normally an all-or-none package: EEG desynchronisation, rapid
    eye movements, dreaming, and skeletal muscle atonia arrive together. State
    instability lets the package come apart, so single components appear at the
    wrong time and without the others. Muscle atonia intruding into full
    wakefulness is cataplexy; atonia persisting into waking consciousness at a
    state boundary is sleep paralysis; dream imagery without sleep is hypnagogic
    hallucination; and the whole state entered directly from wake is a
    sleep-onset REM period. This node is what distinguishes orexin-driven
    hypersomnolence from every other cause of sleepiness, and is the diagnostic
    signature a conforming entry should evidence.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: REM sleep
    term:
      id: GO:0042747
      label: circadian sleep/wake cycle, REM sleep
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10458611
    reference_title: The sleep disorder canine narcolepsy is caused by a mutation in the hypocretin (orexin) receptor 2 gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This result identifies hypocretins as major sleep-modulating
      neurotransmitters
    explanation: >-
      Places the REM-dissociation phenotype downstream of hypocretin
      neurotransmission rather than treating it as an independent finding.
  - reference: PMID:10481909
    reference_title: "Narcolepsy in orexin knockout mice: molecular genetics of sleep regulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a disorder characterized primarily by rapid eye movement (REM) sleep
      dysregulation
    explanation: >-
      Identifies REM dysregulation as the defining downstream consequence of
      orexin loss, which is what this node models.
  downstream:
  - target: Hypersomnolence with REM Dissociation Syndrome
    description: >-
      The combination of an unstable switch and dissociated REM components
      produces the clinical syndrome.
    causal_link_type: DIRECT

- name: Hypersomnolence with REM Dissociation Syndrome
  description: >-
    The clinical endpoint: irrepressible daytime sleepiness with short sleep
    latency and sleep-onset REM periods, together with some combination of
    cataplexy, sleep paralysis, hypnagogic hallucination, and fragmented
    nocturnal sleep. The syndrome is lifelong and non-progressive, because the
    trigger lesion is a completed loss rather than an ongoing degeneration - a
    prognostic point conforming entries should preserve.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12374492
    reference_title: The role of cerebrospinal fluid hypocretin measurement in the diagnosis of narcolepsy and other hypersomnias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Narcolepsy-cataplexy with hypocretin deficiency is a genuine disease entity.
    explanation: >-
      Establishes that the hypocretin-deficient syndrome is a distinct entity
      rather than a severity band of hypersomnolence generally, which is the
      claim the conformance boundary in the module notes rests on.
  - reference: PMID:12374492
    reference_title: The role of cerebrospinal fluid hypocretin measurement in the diagnosis of narcolepsy and other hypersomnias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Healthy controls and subjects with other sleep disorders all had normal levels.
    explanation: >-
      Supports the negative boundary stated in the notes: other sleep disorders,
      including other hypersomnias, do not share this trigger and must not
      conform to it.
treatments:
- name: Orexin Receptor 2-Selective Agonist (Oveporexton)
  description: >-
    Oveporexton (TAK-861) is an oral small-molecule agonist selective for the
    orexin receptor 2. It supplies the missing receptor-level drive directly,
    bypassing the irreversibly lost orexin neurons, and is the positive arm of
    this module's bidirectional drug-target pattern. In a phase 2 trial in
    narcolepsy type 1 it improved objective wakefulness, subjective sleepiness,
    and cataplexy rate together - which is mechanistically informative, because a
    single receptor-level intervention correcting all three confirms that they
    share one upstream node. This is a mechanism pattern, not a treatment
    recommendation inherited by conforming disorders; a disorder without an
    orexin-signalling deficit has no reason to respond.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Orexin Receptor Signalling Deficiency at Ascending Arousal Nuclei
    treatment_effect: ACTIVATES
    description: >-
      Selective OX2R agonism restores excitatory drive to the ascending arousal
      nuclei, re-stabilising the sleep-wake switch downstream.
  evidence:
  - reference: PMID:40367374
    reference_title: "Oveporexton, an Oral Orexin Receptor 2-Selective Agonist, in Narcolepsy Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this phase 2 trial involving participants with narcolepsy type 1,
      oveporexton significantly improved measures of wakefulness, sleepiness, and
      cataplexy over a period of 8 weeks.
    explanation: >-
      Human evidence that pharmacological agonism at the amplifier node reverses
      the downstream syndrome, validating the node as the rate-limiting target.
- name: Dual Orexin Receptor Antagonist (Suvorexant)
  description: >-
    The negative arm of the same drug-target pattern, and the reason the module's
    amplifier node is best understood as a rheostat rather than a switch.
    Suvorexant and the other dual orexin receptor antagonists block OX1R and OX2R
    to reduce arousal drive and produce sleep in insomnia - pharmacologically
    inducing, in a controlled and reversible way, the same receptor-level deficit
    that the trigger node produces permanently. Curated here for mechanistic
    symmetry only: a DORA is contraindicated in narcolepsy, and conforming
    disorders do not inherit it as a treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: suvorexant
      term:
        id: CHEBI:82698
        label: suvorexant
  target_mechanisms:
  - target: Orexin Receptor Signalling Deficiency at Ascending Arousal Nuclei
    treatment_effect: INHIBITS
    description: >-
      Dual OX1R/OX2R blockade lowers orexinergic arousal drive, deliberately
      shifting the same node in the direction the disease trigger shifts it.
  evidence:
  - reference: PMID:26937493
    reference_title: "Suvorexant: efficacy and safety profile of a dual orexin receptor antagonist in treating insomnia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They target cerebral orexin receptors which, when activated, contribute to
      arousal and wakefulness.
    explanation: >-
      States the receptor-level mechanism being blocked, establishing that the
      hypnotic effect and the narcoleptic phenotype act on the same node in
      opposite directions.
discussions:
- discussion_id: gap_tonic_vs_patterned_ox2r_agonism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does restoring orexin receptor signalling pharmacologically reproduce
    physiological orexin function, or only its wake-promoting arm?
  attaches_to:
  - pathophysiology#Orexin Receptor Signalling Deficiency at Ascending Arousal Nuclei
  rationale: >-
    Endogenous orexin neurons fire in a state- and context-dependent pattern and
    also carry autonomic, feeding, and reward-related signals. A continuously
    present oral agonist supplies tonic rather than patterned drive, and the
    commonest adverse events reported in the phase 2 trial - insomnia, urinary
    urgency, and urinary frequency - are plausibly the signature of that
    mismatch rather than off-target toxicity. Whether tonic OX2R agonism restores
    the module's central_effector node (state stability) or merely raises wake
    drive is unresolved, and it matters: the two predict different long-term
    effects on nocturnal sleep architecture.
  proposed_experiments:
  - experiment_id: exp_psg_architecture_ox2r_agonist
    name: Polysomnographic architecture under sustained OX2R agonism
    description: >-
      Full-night polysomnography before and during long-term OX2R agonist
      treatment in narcolepsy type 1, scoring state-transition frequency and
      nocturnal sleep fragmentation rather than only daytime sleep latency. If
      the agonist restores state stability, transition frequency should fall in
      both directions; if it only adds wake drive, nocturnal fragmentation
      should persist or worsen.

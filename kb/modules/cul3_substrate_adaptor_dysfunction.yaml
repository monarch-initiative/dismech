name: CUL3 Substrate Adaptor Dysfunction Module
description: >-
  A conserved mechanism module for disorders caused by a defect in a cullin-3
  RING ubiquitin ligase complex. CRL3 degrades its targets through an
  interchangeable BTB-domain substrate adaptor that recognises the substrate
  and presents it to CUL3 for ubiquitination, so the same scaffold is
  repurposed across tissues by swapping the adaptor: LZTR1 for RAS GTPases,
  KLHL24 for keratin-14 and desmin, gigaxonin for neuronal intermediate
  filaments, KEAP1 for NRF2, SPOP and KLHL20 for their own substrate sets.
  A variant in CUL3 itself, or in any one adaptor, mis-sets the degradation
  rate of that adaptor's substrate, and the disease is whatever happens when
  that one protein is present at the wrong level in the tissue that depends
  on it. The chain the module factors out is therefore
  adaptor-or-scaffold lesion, mis-set CRL3 ubiquitination of one substrate,
  substrate dosage error, tissue-restricted consequence. Conforming entries
  substitute the adaptor, the substrate, the direction of the dosage error,
  and the tissue. Key conformance target:
  `cul3_substrate_adaptor_dysfunction#Mis-Set CRL3 Ubiquitination of the
  Adaptor's Substrate`. Deliberately complementary to
  `loss_of_proteostasis`, the aging-hallmark module for global proteostatic
  decline, where this module is one ligase complex losing one substrate;
  to `er_protein_storage_disease`, where the defect is in the substrate's own
  folding rather than in its disposal; and to the oncogenic pathway modules a
  conformer may also need, since an adaptor lesion that stabilises an
  oncoprotein acts through them.
category: Module
module_categories:
- METABOLISM
- NEUROSCIENCE
creation_date: "2026-10-08T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "cul3_substrate_adaptor_dysfunction#Mis-Set CRL3 Ubiquitination of the
  Adaptor's Substrate").

  Scope decision - why this and not a ubiquitination module. A census of the
  corpus found protein ubiquitination bound on 39 pathophysiology nodes with
  no module covering any of them, but those nodes span unrelated E3 ligases,
  deubiquitinases and proteasome subunits with no shared rate-limiting step,
  which is the heterogeneous case the create-module bar excludes. The CRL3
  adaptor family is the coherent slice: one scaffold, one interchangeable
  adaptor position, one measurable step, and nine entries in the corpus
  already describing it in those terms.

  Direction of the dosage error is a substitution, not a split. Most lesions
  reduce degradation and the substrate accumulates (CUL3 haploinsufficiency
  and 4E-BP1, LZTR1 loss and RAS, gigaxonin loss and intermediate
  filaments). KLHL24 is the instructive opposite: a start-codon variant
  produces a stabilised adaptor that degrades keratin-14 and desmin
  excessively, so the substrate is depleted rather than accumulated. SPOP
  variants in the corpus are curated in both directions. The central node is
  therefore named for the ubiquitination being mis-set rather than reduced,
  and a conforming entry says which way.

  What is NOT in scope. A defect in the substrate's own folding or assembly
  belongs elsewhere even when CRL3 clears the misfolded protein. The
  neoplastic consequences of an adaptor lesion that stabilises an oncoprotein
  run through the cancer pathway modules, and a conformer should conform to
  those as well rather than treating this module as the whole mechanism;
  KEAP1-NRF2 in particular already appears in the corpus under the
  oncometabolite module, and that anchor is not displaced by this one. Other
  cullin scaffolds (CUL1/SCF, CUL4-DDB1) use different adaptor families and
  are out of scope; GO's SCF-dependent term is deliberately not used here for
  that reason.

  Adaptor and substrate substitutions seen in the corpus: LZTR1 with RAS
  GTPases (Noonan syndrome, Schwannomatosis, Schwannoma), KLHL24 with desmin
  and keratin-14 (KLHL24-Related_Hypertrophic_Cardiomyopathy), gigaxonin with
  neuronal intermediate filaments (Giant_Axonal_Neuropathy_1), CUL3 itself
  with 4E-BP1 (Neurodevelopmental_Disorder_With_or_Without_Autism_or_Seizures),
  SPOP (SPOP-Related_Neurodevelopmental_Disorder), RCBTB1
  (RCBTB1-Related_Retinopathy), KLHL40, KLHL41 and KBTBD13 with sarcomeric
  substrates (Nemaline_Myopathy), and RHOBTB2
  (RHOBTB2-Related_Developmental_and_Epileptic_Encephalopathy).

  Curation guardrail - do NOT create a "CRL3-opathy" or "cullin-3 disorder"
  Disease entry for this module. These are distinct named diseases with their
  own MONDO terms, and the family concept belongs in a Grouping if anywhere.
pathophysiology:
- name: CUL3 Scaffold or BTB Substrate Adaptor Lesion
  description: >-
    A variant disables, destabilises or abnormally stabilises either the CUL3
    scaffold or one of the BTB-domain adaptors that recruit substrates to it.
    Adaptor variants cluster in the substrate-binding surface, which is what
    makes them substrate-specific rather than globally proteostatic: the rest
    of the CRL3 repertoire continues to work. Conforming entries substitute
    the gene and say whether function is lost or abnormally gained.
  role: trigger
  molecular_functions:
  - preferred_term: ubiquitin-like ligase-substrate adaptor activity
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    modifier: ABNORMAL
  - preferred_term: ubiquitin protein ligase binding
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29128526
    reference_title: Functional analysis of Cullin 3 E3 ligases in tumorigenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The substrate adaptors of CRL3 typically contain a BTB domain that mediates the interaction between Cullin 3 and target substrates to promote their ubiquitination and subsequent degradation."
    explanation: Defines the adaptor position this trigger node describes and its role between scaffold and substrate.
  - reference: PMID:38490062
    reference_title: "Targeting kelch-like (KLHL) proteins: achievements, challenges and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mounting evidence indicates that mutations or abnormal expression of KLHLs are associated with various human diseases."
    explanation: Establishes adaptor variants as a recognised disease mechanism across the family, which is the premise of the module.
  - reference: PMID:36214804
    reference_title: "De novo missense variants in the E3 ubiquitin ligase adaptor KLHL20 cause a developmental disorder with intellectual disability, epilepsy, and autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recurrent missense and the 3 other missense variants all clustered in the Kelch-type β-propeller domain of the KLHL20 protein, which shapes the substrate binding surface."
    explanation: Shows adaptor variants clustering in the substrate-binding surface, which is why the consequence is substrate-specific rather than global.
  - reference: PMID:39301775
    reference_title: Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assembled a cohort of 37 individuals with heterozygous CUL3 variants presenting a syndromic NDD characterized by intellectual disability with or without autistic features."
    explanation: The scaffold branch of this node, where the lesion is in CUL3 itself rather than in an adaptor.
  downstream:
  - target: Mis-Set CRL3 Ubiquitination of the Adaptor's Substrate
    causal_link_type: DIRECT
    description: >-
      Whether the lesion is in the scaffold or the adaptor, the ubiquitination
      of that adaptor's substrate is no longer set correctly.
- name: Mis-Set CRL3 Ubiquitination of the Adaptor's Substrate
  description: >-
    Polyubiquitination of the affected adaptor's substrate departs from its
    normal rate, usually downwards when the adaptor or scaffold is lost and
    upwards when a variant adaptor is abnormally stabilised. This is the
    rate-limiting step every conforming disorder funnels through, and the one
    an in-cell ubiquitination or substrate-turnover assay measures directly; a
    conforming entry names the substrate and the direction here.
  role: central_effector
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31337872
    reference_title: LZTR1 facilitates polyubiquitination and degradation of RAS-GTPases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrate that LZTR1 facilitates the polyubiquitination and degradation of RAS via the ubiquitin-proteasome pathway, leading to the inhibition of the RAS/MAPK signaling."
    explanation: The step this node represents, measured for one adaptor and its substrate.
  - reference: PMID:39301775
    reference_title: Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CUL3 LoF variants in patients may affect protein stability leading to perturbations in protein homeostasis, as evidenced by decreased ubiquitin-protein conjugates in vitro."
    explanation: The same node measured as reduced ubiquitin conjugates in patient-derived cells, for the scaffold branch.
  - reference: PMID:34292882
    reference_title: Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In skin, KLHL24-ΔN28 leads to gain of function, excessively targeting intermediate filament keratin-14 for proteasomal degradation, ultimately causing epidermolysis bullosa simplex (EBS)."
    explanation: The opposite direction at the same node, where a stabilised adaptor over-ubiquitinates its substrate, which is why the node is named mis-set rather than reduced.
  downstream:
  - target: Substrate Dosage Error
    causal_link_type: DIRECT
    description: >-
      Mis-set ubiquitination changes the steady-state level of that one
      substrate.
- name: Substrate Dosage Error
  description: >-
    The adaptor's substrate is present at the wrong level: accumulated when
    degradation fails, depleted when it is excessive. Because each adaptor
    serves a distinct substrate, this node is where the disorders diverge
    while sharing everything upstream, and it is where a conforming entry
    names its protein. The error is in dosage rather than in the substrate's
    structure, which is what distinguishes these diseases from the
    corresponding structural-variant disorders of the same protein.
  role: effector
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39301775
    reference_title: Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, we show that 4E-BP1 (EIF4EBP1), a prominent substrate of CUL3, fails to be targeted for proteasomal degradation in patient-derived cells."
    explanation: A named substrate accumulating in patient cells, which is the accumulation direction of this node.
  - reference: PMID:34292882
    reference_title: Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ten-fold lower desmin protein levels were observed in patient-derived dyn-EHTs"
    explanation: The depletion direction, quantified for the same node in patient-derived tissue.
  - reference: PMID:31337872
    reference_title: LZTR1 facilitates polyubiquitination and degradation of RAS-GTPases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The polyubiquitination and degradation of RAS was also observed in cells expressing MRAS, HRAS, NRAS, and KRAS as well as oncogenic RAS mutants and inhibited the activation of ERK1/2 and cell growth."
    explanation: Establishes that the substrate level at this node controls downstream signalling, which is how the dosage error becomes a disease.
  downstream:
  - target: Tissue-Restricted Consequence of the Substrate Error
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Which tissue declares the disease depends on where that substrate is
      load-bearing, and the intermediate steps are substrate-specific.
- name: Tissue-Restricted Consequence of the Substrate Error
  description: >-
    The disease appears in the tissue that depends most on the affected
    substrate, despite CRL3 operating everywhere: RAS-MAPK overactivation in
    Noonan syndrome and schwannoma predisposition for LZTR1, intermediate
    filament loss in skin and myocardium for KLHL24, axonal intermediate
    filament accumulation for gigaxonin, cortical and synaptic development for
    CUL3 and KLHL20, sarcomere maintenance for the nemaline adaptors.
    Conforming entries substitute the tissue and its phenotype.
  role: consequence
  biological_processes:
  - preferred_term: ubiquitin-dependent protein catabolic process
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29128526
    reference_title: Functional analysis of Cullin 3 E3 ligases in tumorigenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the extensively studied CRL3-based E3 ligases, the role of the adaptor protein SPOP (speckle type BTB/POZ protein) in tumorigenesis appears to be tissue or cellular context dependent."
    explanation: States the tissue dependence this node records, for the adaptor where it is best documented.
  - reference: PMID:34292882
    reference_title: Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of these EBS-patients are also diagnosed with dilated cardiomyopathy (DCM), but the pathological mechanism in the heart is unknown."
    explanation: One adaptor lesion producing disease in two tissues through the homologous substrate in each, which is this node's claim.
  - reference: PMID:36214804
    reference_title: "De novo missense variants in the E3 ubiquitin ligase adaptor KLHL20 cause a developmental disorder with intellectual disability, epilepsy, and autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied 14 patients with de novo missense variants in KLHL20, delineating a genetic syndrome with patients having mild to severe intellectual disability, febrile seizures or epilepsy, autism spectrum disorder, hyperactivity, and subtle dysmorphic facial features."
    explanation: The neurodevelopmental tissue restriction for one adaptor, in a cohort.
discussions:
- discussion_id: gap_crl3_adaptor_tissue_restriction
  prompt: >-
    Why does loss of one CRL3 adaptor, in a complex expressed throughout the
    body, produce disease confined to one tissue, and what decides which
    tissue that is when the same adaptor serves homologous substrates in
    several?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Tissue-Restricted Consequence of the Substrate Error
  rationale: >-
    The terminal node records the tissue restriction and does not derive it.
    The KLHL24 case makes the gap concrete: the same start-codon variant
    depletes keratin-14 in skin and desmin in myocardium, and the paper
    reporting the cardiac phenotype states that the mechanism in the heart was
    unknown. Candidate explanations are the tissue's expression level of the
    substrate, the availability of a redundant adaptor, and the substrate's
    structural load in that tissue; none has been discriminated. A conforming
    entry should record its tissue and phenotype as observations, not infer
    them from the adaptor.
  evidence:
  - reference: PMID:34292882
    reference_title: Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of these EBS-patients are also diagnosed with dilated cardiomyopathy (DCM), but the pathological mechanism in the heart is unknown."
    explanation: States the gap for the clearest two-tissue case in the family.
  - reference: PMID:29128526
    reference_title: Functional analysis of Cullin 3 E3 ligases in tumorigenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The biological implications of CRL3 adaptor proteins have been well described where they have been found to play a role as either an oncogene, tumor suppressor, or can mediate either of these effects in a context-dependent manner."
    explanation: Records that even the direction of an adaptor's effect is context-dependent, which is the same gap at the level of consequence.

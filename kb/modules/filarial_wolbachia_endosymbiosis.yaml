name: Filarial Wolbachia Endosymbiosis Module
description: >-
  A conserved mechanism module for the obligate alpha-proteobacterial
  endosymbiont Wolbachia of filarial nematodes, which is both a driver of
  inflammatory pathology and the therapeutic target that makes an antibiotic a
  macrofilaricide. The chain runs: obligate endosymbiosis required for larval
  development, embryogenesis and adult-worm viability, through release of
  Wolbachia and its lipoproteins when worms or microfilariae die, to
  TLR2/6-dependent innate immune activation (the key conformance target), then
  neutrophil recruitment and granulocyte-driven inflammation, and finally
  Wolbachia-dependent inflammatory tissue pathology at the site the parasite
  occupies. A sixth node carries the therapeutic corollary: depleting Wolbachia
  sterilises the female worm and kills adults, which is why a six-to-eight-week
  doxycycline course acts where microfilaricides do not, and the doxycycline
  treatment's target_mechanisms points back at the endosymbiosis node it
  inhibits. The module is complementary to
  intracellular_pathogen_persistence, which explains why a tetracycline reaches
  an intracellular bacterium at all: this module says what that bacterium is
  doing inside a nematode and why removing it treats the worm's host. It is
  distinct from the antibacterial target modules (ribosome, cell wall), which
  describe the drug's molecular target rather than the symbiosis being
  dissolved. Worked conformers: Onchocerciasis and Lymphatic filariasis.
category: Module
module_categories:
- INFECTIOUS_DISEASE
- IMMUNOLOGY
- PHARMACOLOGY
creation_date: "2026-11-14T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease: do NOT create a "Wolbachia
  infection" or "filarial endosymbiosis" Disease entry. Conforming filarial
  disorder entries reference nodes via conforms_to (for example
  "filarial_wolbachia_endosymbiosis#TLR2/6-Dependent Innate Immune Activation
  by Wolbachia Lipoprotein"), and their anti-Wolbachia treatments point at the
  endosymbiosis node via target_mechanisms. Key conformance target:
  "TLR2/6-Dependent Innate Immune Activation by Wolbachia Lipoprotein", the
  disorder-agnostic step every conformer funnels through; a conforming node
  substitutes the organism (Onchocerca volvulus, Wuchereria bancrofti, Brugia
  malayi, Brugia timori) and the tissue the inflammation lands in (cornea and
  skin for onchocerciasis, lymphatic vessels and scrotum for lymphatic
  filariasis). Scope caveat: not every filarial nematode carries Wolbachia.
  Loa loa and Mansonella ozzardi lack the symbiont, so a Loa loa entry must not
  conform to this module, and the absence is the reason doxycycline is proposed
  for onchocerciasis in Loa-co-endemic areas rather than a microfilaricide.
  Evidence caveat: the TLR and neutrophil steps rest on murine corneal-injection
  models and human in vitro neutrophil work, while the human in vivo evidence is
  largely the response to Wolbachia depletion plus post-treatment reaction
  correlates; grade accordingly and do not restate a mouse result as a human
  one. Historical correction worth knowing when reading the older literature:
  the 2002 murine river-blindness study attributed the Wolbachia-driven corneal
  response to TLR4, and later work with single-receptor knockouts found TLR2
  (with TLR6) essential and TLR4 dispensable. The module follows the later
  finding; cite the 2002 paper for Wolbachia being the inflammatory agent, not
  for the receptor.
pathophysiology:
- name: Obligate Wolbachia Endosymbiosis in Filarial Nematodes
  description: >-
    Most pathogenic filarial nematodes harbour Wolbachia, a maternally
    transmitted alpha-proteobacterial endosymbiont present in the hypodermal
    chord of all larval and adult stages and in the female reproductive tract.
    The dependency is obligate rather than incidental: the bacterium is required
    for larval development, for embryogenesis in the adult female, and for
    adult-worm viability. This is the node that makes an antibacterial drug an
    antifilarial one, and it is also the upstream supply of the bacterial
    products that drive the inflammatory arm of the module.
  role: trigger
  biological_processes:
  - preferred_term: obligate endosymbiosis with Wolbachia
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Release of Wolbachia and Wolbachia Lipoprotein on Filarial Death
    causal_link_type: DIRECT
    description: >-
      Because the symbiont is carried inside every parasite stage, death or
      degeneration of the worm or its microfilariae is what exposes the host to
      bacterial products.
  - target: Wolbachia Depletion Sterilises and Kills the Adult Worm
    causal_link_type: DIRECT
    description: >-
      The same dependency read the other way round: removing the symbiont
      removes the parasite's capacity to reproduce and survive.
  evidence:
  - reference: PMID:15964448
    reference_title: "Macrofilaricidal activity after doxycycline treatment of Wuchereria bancrofti: a double-blind, randomised placebo-controlled trial."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Wolbachia endosymbionts of filarial nematodes are vital for larval
      development and adult-worm fertility and viability.
    explanation: >-
      States this node's claim, that the endosymbiosis is obligate across the
      parasite life cycle. Taken from the trial's background paragraph rather
      than from its own results, hence quote_role BACKGROUND.
  - reference: PMID:17875630
    reference_title: "Toll-like receptor 2 regulates CXC chemokine production and neutrophil recruitment to the cornea in Onchocerca volvulus/Wolbachia-induced keratitis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      are present in the hypodermis of all larval and adult filarial stages and
      in the uterus of adult female worms
    explanation: >-
      Supports where in the parasite the symbiont sits, which is what makes
      worm death the release event modelled downstream. Graded OTHER with
      quote_role BACKGROUND because the sentence is the paper's summary of prior
      descriptive work rather than a result of its own experiments.
- name: Release of Wolbachia and Wolbachia Lipoprotein on Filarial Death
  description: >-
    Degenerating microfilariae and dying adult worms release Wolbachia and
    Wolbachia-derived products into host tissue and blood. In treated patients
    this is measurable as circulating Wolbachia DNA whose level tracks both
    tumour necrosis factor alpha and the severity of the post-treatment
    reaction, so the release is not merely a histological observation but the
    proximate cause of a clinical syndrome. The same release is what drives
    tissue-level inflammation at the sites microfilariae reach.
  role: amplifier
  biological_processes:
  - preferred_term: release of Wolbachia products into host tissue
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: TLR2/6-Dependent Innate Immune Activation by Wolbachia Lipoprotein
    causal_link_type: DIRECT
    description: >-
      Released lipoprotein is the ligand that engages the host innate immune
      receptors in the next node.
  evidence:
  - reference: PMID:11920298
    reference_title: "Bacterial endosymbionts of Onchocerca volvulus in the pathogenesis of posttreatment reactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the ivermectin group, there was a significant correlation between
      levels of bacterial DNA and serum tumor necrosis factor-alpha
    explanation: >-
      Human post-treatment samples link the quantity of released Wolbachia to a
      systemic inflammatory cytokine, which is the measurable form of this
      node's claim.
  - reference: PMID:11920298
    reference_title: "Bacterial endosymbionts of Onchocerca volvulus in the pathogenesis of posttreatment reactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support a role for Wolbachia products in mediating the
      inflammatory responses seen following treatment of onchocerciasis
    explanation: >-
      The authors' own conclusion that the released bacterial products, rather
      than the dying parasite alone, mediate the inflammatory response.
- name: TLR2/6-Dependent Innate Immune Activation by Wolbachia Lipoprotein
  description: >-
    The diacylated N-terminal lipopeptide of the Wolbachia
    peptidoglycan-associated lipoprotein is the dominant inflammatory ligand in
    filarial extracts, and it signals through the Toll-like receptor 2/6
    heterodimer.
    Inflammation induced by filarial worm extract depends on TLR2 and TLR6, and
    removing Wolbachia, or removing the lipid or protein moiety, abolishes the
    activity; in the corneal model TLR2 is essential while TLR4 and TLR9 are
    not. Beyond the acute innate response, the same lipoprotein drives
    interferon-gamma-dependent CD4 T cell polarisation and antibody class
    switching, so the symbiont shapes the adaptive response as well. This is
    the module's rate-limiting, disorder-agnostic step and the key conformance
    target.
  role: central_effector
  biological_processes:
  - preferred_term: TLR2/6 signaling by Wolbachia lipoprotein
    term:
      id: GO:0034134
      label: toll-like receptor 2 signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:19458089
    reference_title: "Wolbachia lipoprotein stimulates innate and adaptive immunity through Toll-like receptors 2 and 6 to induce disease manifestations of filariasis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Inflammation induced by Brugia malayi female worm extract (BMFE) is
      dependent on Toll-like receptors 2 and 6 (TLR2/6) with only a partial
      requirement for TLR1.
    explanation: >-
      Identifies the receptor pair this node is built on, in a filarial extract
      system.
  - reference: PMID:19458089
    reference_title: "Wolbachia lipoprotein stimulates innate and adaptive immunity through Toll-like receptors 2 and 6 to induce disease manifestations of filariasis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Removal of Wolbachia, lipids, or proteins eliminates all inflammatory activity."
    explanation: >-
      The subtractive experiment that attributes the inflammatory activity to a
      Wolbachia lipoprotein rather than to nematode antigen, which is what makes
      this a Wolbachia node and not a generic helminth-inflammation node.
  - reference: PMID:17875630
    reference_title: "Toll-like receptor 2 regulates CXC chemokine production and neutrophil recruitment to the cornea in Onchocerca volvulus/Wolbachia-induced keratitis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found an essential role for TLR2, but not TLR4 or TLR9, in neutrophil
      recruitment to the cornea and development of corneal haze.
    explanation: >-
      Single-receptor knockouts in the murine Onchocerca corneal model place the
      requirement on TLR2 and exclude TLR4 and TLR9. This is the result that
      supersedes the earlier TLR4 attribution, and it is a mouse experiment, so
      it is graded MODEL_ORGANISM.
- name: Neutrophil Recruitment and Granulocyte-Driven Tissue Inflammation
  description: >-
    TLR2 engagement on resident bone-marrow-derived and stromal cells drives CXC
    chemokine production and recruits neutrophils, which are the earliest and
    most abundant infiltrate around dying microfilariae and around adult worms
    in nodules. The recruited neutrophils are activated rather than merely
    present: Wolbachia and its lipopeptide induce neutrophil extracellular trap
    formation in human neutrophils and in human onchocercal nodules, and that
    trap formation is absent from nodules of patients whose Wolbachia has been
    depleted by doxycycline.
  role: effector
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: granulocyte activation
    term:
      id: GO:0036230
      label: granulocyte activation
    modifier: INCREASED
  downstream:
  - target: Wolbachia-Dependent Inflammatory Tissue Pathology at the Site of Filarial Residence
    causal_link_type: DIRECT
    description: >-
      Sustained granulocyte influx and activation is what converts a parasite
      burden into the tissue lesion the patient presents with.
  evidence:
  - reference: PMID:17875630
    reference_title: "Toll-like receptor 2 regulates CXC chemokine production and neutrophil recruitment to the cornea in Onchocerca volvulus/Wolbachia-induced keratitis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TLR2 expression was also essential for CXC chemokine production by
      resident cells in the cornea, including corneal fibroblasts, and for
      neutrophil activation.
    explanation: >-
      Supplies the chemokine step between receptor engagement and neutrophil
      arrival, in the murine corneal model.
  - reference: PMID:27752109
    reference_title: "Wolbachia endosymbionts induce neutrophil extracellular trap formation in human onchocerciasis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extracellular NETs and neutrophils were visualised around O. volvulus in
      nodules excised from untreated patients but not in nodules from patients
      treated with the anti-Wolbachia drug, doxycycline.
    explanation: >-
      Human nodule histology from a placebo-controlled trial, showing the
      granulocyte response and its dependence on the symbiont being present.
  - reference: PMID:27752109
    reference_title: "Wolbachia endosymbionts induce neutrophil extracellular trap formation in human onchocerciasis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Whole Wolbachia or microspheres coated with a synthetic Wolbachia
      lipopeptide (WoLP) of the major nematode Wolbachia TLR2/6 ligand,
      peptidoglycan associated lipoprotein, induced NETosis in human neutrophils
      in vitro.
    explanation: >-
      Attributes the neutrophil effector response to the same TLR2/6 lipoprotein
      ligand as the upstream node, in human cells.
- name: Wolbachia-Dependent Inflammatory Tissue Pathology at the Site of Filarial Residence
  description: >-
    The module's consequence is chronic inflammatory damage to whichever tissue
    the parasite and its progeny occupy, with the symbiont rather than the
    nematode as the dominant inflammatory agent. In the murine river-blindness
    model the corneal response to filarial extract is attributable to Wolbachia;
    in human lymphatic filariasis, depleting Wolbachia lowers the lymphangiogenic
    mediators VEGF-C and sVEGFR-3 and improves lymphatic vessel dilation and
    lymphoedema stage, which is the drug-response form of the same claim.
    Conforming entries substitute their own organ: sclerosing keratitis and
    onchocercal dermatitis for Onchocerca volvulus, lymphatic vessel dysfunction
    and lymphoedema for the lymphatic filariae.
  role: consequence
  biological_processes:
  - preferred_term: chronic inflammatory response
    term:
      id: GO:0002544
      label: chronic inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:11884755
    reference_title: "The role of endosymbiotic Wolbachia bacteria in the pathogenesis of river blindness."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we demonstrated that the predominant inflammatory response in the cornea
      was due to species of endosymbiotic Wolbachia bacteria
    explanation: >-
      Establishes the symbiont, not the nematode antigen, as the dominant driver
      of the tissue lesion. Cited for that attribution only; the same paper's
      TLR4 dependency was superseded by the TLR2 knockout work above.
  - reference: PMID:17044733
    reference_title: "Doxycycline reduces plasma VEGF-C/sVEGFR-3 and improves pathology in lymphatic filariasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean dilation of supratesticular lymphatic vessels in
      doxycycline-treated patients was reduced significantly at 24 mo, whereas
      there was no improvement in the placebo group.
    explanation: >-
      Placebo-controlled human evidence that the tissue pathology is
      Wolbachia-dependent, reached through the response to depleting the
      symbiont rather than by measuring the inflammatory mechanism directly,
      hence INDIRECT.
- name: Wolbachia Depletion Sterilises and Kills the Adult Worm
  description: >-
    Clearing the endosymbiont with a tetracycline removes what the parasite
    depends on, and does so in a defined order: Wolbachia is progressively
    depleted from adults and microfilariae over months, embryogenesis stops,
    microfilarial output declines, and a substantial proportion of adult female
    worms are found dead. That is macrofilaricidal and long-lasting activity,
    which neither ivermectin nor diethylcarbamazine delivers, and it is the
    therapeutic vulnerability this module exists to make explicit. The cost is a
    six-to-eight-week individual course rather than a single mass-administered
    dose.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:12706439
    reference_title: "Doxycycline in the treatment of human onchocerciasis: Kinetics of Wolbachia endobacteria reduction and of inhibition of embryogenesis in female Onchocerca worms."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      progressive depletion of Wolbachia from adult worms and microfilariae by
      doxycycline over a period of 6 months
    explanation: >-
      Nodule histology and PCR in treated patients establish that the drug
      depletes the symbiont in the parasite, which is the step the rest of the
      therapeutic claim rests on.
  - reference: PMID:17999080
    reference_title: "Wolbachia endobacteria depletion by doxycycline as antifilarial therapy has macrofilaricidal activity in onchocerciasis: a randomized placebo-controlled study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 6-week treatment was macrofilaricidal, with >60% of the female worms
      found dead
    explanation: >-
      Randomised placebo-controlled evidence that depletion kills adult worms,
      which is the distinguishing feature of anti-Wolbachia therapy.
  - reference: PMID:15964448
    reference_title: "Macrofilaricidal activity after doxycycline treatment of Wuchereria bancrofti: a double-blind, randomised placebo-controlled trial."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An 8-week course of doxycycline is a safe and well-tolerated treatment for
      lymphatic filariasis with significant activity against adult worms and
      microfilaraemia.
    explanation: >-
      Shows the same vulnerability in a lymphatic filarial species, which is
      what makes this a module rather than a feature of one disease.
treatments:
  - name: Anti-Wolbachia doxycycline therapy
    description: >-
      A six-to-eight-week course of doxycycline (100-200 mg/day) depletes the
      obligate Wolbachia endosymbiont, sterilising female worms and killing
      adults. It is an individual-patient regimen rather than a mass-drug
      administration tool, and its place in practice is set by that: it is used
      where a macrofilaricide is needed, where ivermectin resistance is a
      concern, and where Loa loa co-endemicity makes microfilaricidal treatment
      hazardous. It is contraindicated in pregnancy and young children.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
      - preferred_term: doxycycline
        term:
          id: CHEBI:50845
          label: doxycycline
    target_mechanisms:
    - target: Obligate Wolbachia Endosymbiosis in Filarial Nematodes
      treatment_effect: INHIBITS
      description: >-
        Doxycycline acts on the bacterial endosymbiont rather than on the
        nematode, dissolving the dependency the parasite's development,
        fertility and viability rest on.
    evidence:
    - reference: PMID:17999080
      reference_title: "Wolbachia endobacteria depletion by doxycycline as antifilarial therapy has macrofilaricidal activity in onchocerciasis: a randomized placebo-controlled study."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Administration of doxycycline resulted in endobacteria depletion and female worm sterilization."
      explanation: >-
        Randomised placebo-controlled evidence for the drug's effect on the
        endosymbiosis node it targets.
    - reference: PMID:17999080
      reference_title: "Wolbachia endobacteria depletion by doxycycline as antifilarial therapy has macrofilaricidal activity in onchocerciasis: a randomized placebo-controlled study."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Doxycycline may be developed as second-line drug for onchocerciasis, to
        be administered in areas without transmission, in foci with IVM
        resistance and in areas with Loa co-infections.
      explanation: >-
        The authors' own statement of where this regimen belongs in practice,
        which is what the treatment description reports.
discussions:
- discussion_id: gap_wolbachia_inflammation_in_chronic_human_pathology
  prompt: >-
    How much of the established chronic human pathology of filarial disease is
    driven by Wolbachia-dependent inflammation, as opposed to being initiated by
    it and then sustained by host remodelling that antibiotic treatment can no
    longer reverse?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Wolbachia-Dependent Inflammatory Tissue Pathology at the Site of Filarial Residence
  rationale: >-
    The inflammatory arm of this module is strongest where the readout is acute:
    murine corneal injection, in vitro neutrophil activation, and the human
    post-treatment reaction, all of which measure a response to Wolbachia
    arriving or being released. The chronic lesions that define the diseases —
    sclerosing keratitis, onchocercal dermatitis, lymphoedema and elephantiasis
    — develop over years, and the human evidence that they are
    Wolbachia-dependent is a treatment response, which improves lymphatic
    dilation and lymphoedema stage without establishing how much of the
    established lesion is reversible. The practical consequence for a conforming
    entry is that it may cite this module for the mechanism that initiates its
    tissue pathology, but should not infer that depleting Wolbachia reverses an
    established structural lesion.
  evidence:
  - reference: PMID:17044733
    reference_title: "Doxycycline reduces plasma VEGF-C/sVEGFR-3 and improves pathology in lymphatic filariasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a chemotherapeutic principle that directly induces a halt or improvement
      in the progression of the morbidity in already infected individuals would
      constitute a major lead
    explanation: >-
      States the field's own framing of the open question this gap records, that
      halting established morbidity is a sought-after and not an assumed
      property of antifilarial treatment. Quoted from the paper's framing of its
      aim rather than from its results, so it bears on the gap indirectly.

name: Conserved Photoaging (UV-Induced Skin Damage) Module
description: >-
  Conserved extrinsic skin-aging pathway by which chronic ultraviolet (chiefly
  UVB) exposure drives dermal matrix destruction and visible photoaging: UV
  irradiation and photo-oxidative injury (DNA damage, reactive oxygen species,
  ligand-independent growth-factor and cytokine-receptor activation) leads to
  MAP-kinase-driven activation of the AP-1 (c-Jun/c-Fos) and NF-kB transcription
  factors, which induce matrix metalloproteinases (collagenase MMP-1, stromelysin
  MMP-3, gelatinase MMP-9) and pro-inflammatory mediators (IL-1, IL-6, IL-8,
  COX-2/PTGS2), producing degradation of the dermal collagen and elastin
  extracellular matrix and, cumulatively, photoaging (wrinkling, laxity, solar
  elastosis). The deliberate extrinsic-aging complement of the intrinsic
  senescence and inflammaging modules.
category: Module
creation_date: "2026-08-23T00:00:00Z"
notes: >-
  Conserved mechanism, one rate-limiting hub. The key conformance target is the
  central_effector node "MAPK Signaling and AP-1/NF-kB Transcriptional
  Activation": every route from a UV/oxidative insult to matrix destruction
  funnels through MAP-kinase-driven AP-1 (and NF-kB) transcriptional activation.
  Conforming entries substitute the tissue- and stimulus-specific detail while
  keeping this spine: the UV waveband and dose (UVB vs UVA vs solar-simulated),
  the dominant reactive species, the specific MMPs induced (MMP-1 collagenase,
  MMP-3 stromelysin, MMP-9 gelatinase), and the inflammatory mediators (IL-1,
  IL-6, CXCL8/IL-8, PTGS2/COX-2). Not modeled here and left to the conforming
  entry or a sibling module: UV mutagenesis and photocarcinogenesis (a distinct
  DNA-damage/oncogenesis output), melanogenesis and dyspigmentation, and the
  intrinsic (chronological) aging arm, which converges on the same AP-1/MMP
  effector but is driven by senescence and inflammaging rather than UV
  (see the cellular_senescence and inflammaging modules). Chemistry (ROS, retinoids)
  is described in prose per module convention; a treatment therapeutic_agent
  carries the CHEBI id. Not an Xogenesis module: the terminal output is
  destruction and disorganization of a normal matrix, not formation of a discrete
  pathological structure (actinic/solar elastosis, an accumulation of abnormal
  elastotic material, is the closest structural correlate and is described in
  prose at the consequence node rather than anchored as Xogenesis).
pathophysiology:
- name: UVB Irradiation and Photo-oxidative Injury
  description: >-
    Ultraviolet irradiation (chiefly UVB) absorbed by skin chromophores inflicts
    direct DNA photodamage and generates reactive oxygen species, and acts as a
    broad ligand-independent activator of keratinocyte and dermal-cell growth-factor
    and cytokine receptors. This photo-oxidative injury is the initiating insult of
    extrinsic skin aging.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: Dermal Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: Response to UV
    term:
      id: GO:0009411
      label: response to UV
  - preferred_term: Reactive Oxygen Species Generation
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  - preferred_term: Cellular Response to Oxidative Stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:36499128
    reference_title: "2-O-beta-d-Glucopyranosyl-4,6-dihydroxybenzaldehyde Isolated from Morus alba (Mulberry) Fruits Suppresses Damage by Regulating Oxidative and Inflammatory Responses in TNF-alpha-Induced Human Dermal Fibroblasts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UV radiation stimulates DNA damage, reactive oxygen species (ROS) generation, and pro-inflammatory cytokine production"
    explanation: >-
      States the initiating photo-oxidative injury of this node: UV drives DNA
      damage, ROS generation, and pro-inflammatory cytokine production.
  - reference: PMID:12437452
    reference_title: "Mechanisms of photoaging and chronological skin aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary environmental factor that causes human skin aging is UV irradiation from the sun."
    explanation: >-
      Establishes UV irradiation as the primary extrinsic driver of skin aging,
      the trigger of this pathway.
  downstream:
  - target: MAPK Signaling and AP-1/NF-kB Transcriptional Activation
    description: >-
      Photo-oxidative injury and receptor activation transduce into MAP-kinase
      signaling that activates the AP-1 and NF-kB transcription factors.
- name: MAPK Signaling and AP-1/NF-kB Transcriptional Activation
  description: >-
    UV-activated cell-surface receptors and reactive oxygen species drive
    MAP-kinase cascades (p38, ERK, JNK) that converge on the nucleus to induce
    c-Jun, which heterodimerizes with c-Fos to form the AP-1 transcription factor,
    and to activate NF-kB. This transcriptional hub is the disorder-agnostic,
    rate-limiting step that couples the UV/oxidative insult to matrix-degrading and
    inflammatory gene expression.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: MAPK Cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  - preferred_term: NF-kappaB Signaling Activation
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:9732061
    reference_title: "Molecular mechanisms of photoaging and its prevention by retinoic acid: ultraviolet irradiation induces MAP kinase signal transduction cascades that induce Ap-1-regulated matrix metalloproteinases that degrade human skin in vivo."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ultraviolet irradiation activates growth factor and cytokine receptors on keratinocytes and dermal cells, resulting in downstream signal transduction through activation of MAP kinase pathways"
    explanation: >-
      Describes UV-driven ligand-independent receptor activation feeding MAP-kinase
      pathways, the upstream half of this hub.
  - reference: PMID:9732061
    reference_title: "Molecular mechanisms of photoaging and its prevention by retinoic acid: ultraviolet irradiation induces MAP kinase signal transduction cascades that induce Ap-1-regulated matrix metalloproteinases that degrade human skin in vivo."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These signaling pathways converge in the nucleus of cells to induce c-Jun, which heterodimerizes with constitutively expressed c-Fos to form activated complexes of the transcription factor AP-1."
    explanation: >-
      Establishes the AP-1 (c-Jun/c-Fos) transcription factor as the convergent
      output of UV-activated MAP-kinase signaling.
  downstream:
  - target: MMP Upregulation and Inflammatory Mediator Induction
    description: >-
      AP-1 and NF-kB induce transcription of matrix metalloproteinases and
      pro-inflammatory mediators.
- name: MMP Upregulation and Inflammatory Mediator Induction
  description: >-
    Activated AP-1 and NF-kB induce the matrix metalloproteinases (collagenase
    MMP-1, stromelysin MMP-3, 92 kDa gelatinase MMP-9) and pro-inflammatory
    mediators (IL-1, IL-6, CXCL8/IL-8, COX-2/PTGS2), the effectors that dismantle
    the dermal matrix and sustain a low-grade inflammatory microenvironment.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Dermal Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: Collagen Catabolic Process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:9732061
    reference_title: "Molecular mechanisms of photoaging and its prevention by retinoic acid: ultraviolet irradiation induces MAP kinase signal transduction cascades that induce Ap-1-regulated matrix metalloproteinases that degrade human skin in vivo."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AP-1 induces expression of matrix metalloproteinases collagenase, 92 kDa gelatinase, and stromelysin, which degrade collagen and other proteins that comprise the dermal extracellular matrix"
    explanation: >-
      Identifies the AP-1-induced MMPs (collagenase, gelatinase, stromelysin) as
      the effectors that degrade the dermal matrix.
  - reference: PMID:12208239
    reference_title: "UV-light-induced signal cascades and skin aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among genes whose expression is regulated by AP-1 are several matrix-metalloproteinase (MMP) family members and type I procollagen."
    explanation: >-
      Confirms AP-1 as the transcriptional regulator of multiple MMP family members
      in the UV response.
  downstream:
  - target: Dermal ECM (Collagen and Elastin) Degradation
    description: >-
      MMP activity degrades the collagen and elastin of the dermal extracellular
      matrix.
- name: Dermal ECM (Collagen and Elastin) Degradation
  description: >-
    MMP-mediated proteolysis, together with reduced procollagen synthesis
    (compounded by UV inhibition of TGF-beta signaling), fragments and depletes the
    dermal collagen and elastin extracellular matrix. Repeated cycles of degradation
    and imperfect repair accumulate as disorganized matrix, including the abnormal
    elastotic material of solar (actinic) elastosis.
  role: effector
  biological_scale: TISSUE
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  biological_processes:
  - preferred_term: Extracellular Matrix Disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  - preferred_term: Collagen Catabolic Process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:12208239
    reference_title: "UV-light-induced signal cascades and skin aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "skin aging is associated with increased AP-1 activity, increased MMP expression, impaired TGF-beta signaling, enhanced collagen degradation, and decreased collagen synthesis"
    explanation: >-
      Ties AP-1/MMP activation and impaired TGF-beta signaling to enhanced collagen
      degradation with decreased synthesis, the net matrix loss modeled here.
  - reference: PMID:25561721
    reference_title: "Natural and sun-induced aging of human skin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The dermal collagenous extracellular matrix, which comprises the bulk of skin and confers strength and resiliency, undergoes gradual fragmentation, which deleteriously impacts skin mechanical properties and dermal cell functions."
    explanation: >-
      Documents fragmentation of the dermal collagenous ECM and its functional
      consequences, the structural core of photoaging.
  downstream:
  - target: Photoaging
    description: >-
      Cumulative dermal matrix loss and disorganization manifests as clinical
      photoaging.
- name: Photoaging
  description: >-
    The cumulative clinical outcome: wrinkling, laxity, roughness, dyspigmentation,
    and solar elastosis of chronically sun-exposed skin. Photoaging is a cumulative
    process whose severity tracks lifetime UV dose and skin pigmentation, distinct
    from the passage-of-time-dependent intrinsic aging with which it shares the
    downstream AP-1/MMP effector.
  role: consequence
  biological_scale: TISSUE
  evidence:
  - reference: PMID:12437452
    reference_title: "Mechanisms of photoaging and chronological skin aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This sun-induced skin aging (photoaging), like chronological aging, is a cumulative process."
    explanation: >-
      Defines photoaging as the cumulative sun-induced skin-aging endpoint of this
      pathway.
  - reference: PMID:9732061
    reference_title: "Molecular mechanisms of photoaging and its prevention by retinoic acid: ultraviolet irradiation induces MAP kinase signal transduction cascades that induce Ap-1-regulated matrix metalloproteinases that degrade human skin in vivo."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "leading to accumulation of solar scarring, and ultimately visible photoaging"
    explanation: >-
      Frames repeated dermal degradation and imperfect repair as accumulating into
      visible photoaging.
treatments:
- name: Topical retinoid (tretinoin / all-trans retinoic acid)
  description: >-
    All-trans retinoic acid opposes the UV response upstream of matrix
    destruction by inhibiting UV-induced c-Jun and thereby AP-1-driven MMP
    induction, the peer-reviewed drug-target pattern for this module. Acts on the
    central AP-1/NF-kB node rather than the UV insult itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tretinoin
      term:
        id: CHEBI:15367
        label: all-trans-retinoic acid
  target_mechanisms:
  - target: MAPK Signaling and AP-1/NF-kB Transcriptional Activation
    treatment_effect: INHIBITS
    description: >-
      Retinoic acid inhibits UV induction of c-Jun, blunting AP-1 activation and
      the ensuing MMP upregulation.
  evidence:
  - reference: PMID:9732061
    reference_title: "Molecular mechanisms of photoaging and its prevention by retinoic acid: ultraviolet irradiation induces MAP kinase signal transduction cascades that induce Ap-1-regulated matrix metalloproteinases that degrade human skin in vivo."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All-trans retinoic acid acts to inhibit induction of c-Jun protein by ultraviolet irradiation, thereby preventing increased matrix metalloproteinases and ensuing dermal damage."
    explanation: >-
      Directly supports retinoic acid as an inhibitor of the UV/c-Jun/AP-1 to MMP
      arm, the drug-target pattern for this module.
- name: Topical sunscreen (photoprotection)
  description: >-
    Topical broad-spectrum sunscreen blocks UV from reaching skin chromophores,
    acting at the trigger node to prevent the initiating photo-oxidative injury.
    The primary evidenced-here demonstration is in the ex vivo human skin model
    below; the citation is a preprint.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: topical photoprotection (sunscreen)
  target_mechanisms:
  - target: UVB Irradiation and Photo-oxidative Injury
    treatment_effect: INHIBITS
    description: >-
      Sunscreen attenuates UV reaching the tissue, mitigating UVB-induced injury
      and the downstream inflammatory and remodeling response.
  evidence:
  - reference: DOI:10.64898/2026.04.30.721933
    reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UVB exposure triggered coordinated stress and inflammatory responses that were partially mitigated using topical sunscreen"
    explanation: >-
      In the ex vivo human skin platform, topically applied sunscreen mitigated the
      UVB-induced stress and inflammatory response. Source is a preprint.
experimental_models:
- name: Outer Biosciences long-term ex vivo human skin platform (UVB photodamage arm)
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: skin
    term:

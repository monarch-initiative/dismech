      label: keratinocyte
  - preferred_term: Dermal Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: >-
    Primary full-thickness human skin explants (8 mm biopsies) from surgical
    excision of healthy donors
  culture_system: >-
    Air-liquid interface culture of native full-thickness skin on a 3D-printed
    high-porosity gyroid insert; UVB delivered at 300 mJ/cm2 over a 3-day study
    with or without topically applied sunscreen
  conditions:
  - UVB irradiation (300 mJ/cm2)
  - UVB plus topical sunscreen (SPF 50) pre-treatment
  publication: DOI:10.64898/2026.04.30.721933
  notes: >-
    Source is a bioRxiv preprint (DOI:10.64898/2026.04.30.721933), not yet
    peer-reviewed. Evidence snippets quote the cached abstract; figure-level
    detail is summarized in prose.
  description: >-
    An ex vivo human skin platform used to model UVB photodamage and topical
    photoprotection within preserved tissue architecture. UVB (300 mJ/cm2) induced
    epidermal and dermal pathology (parakeratosis, dyskeratosis, collagen bundle
    fragmentation), raised lactate dehydrogenase release and IL-8 secretion, and
    activated inflammatory, stress, and remodeling programs (TNF-alpha/NF-kB, UV
    response, IL6/JAK/STAT3) with induction of IL1A, IL1B, CXCL8, PTGS2, and MMP1.
    Topically applied sunscreen substantially mitigated these responses.
  modeled_mechanisms:
  - target: UVB Irradiation and Photo-oxidative Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      UVB delivered to native full-thickness human skin reproduces the initiating
      photo-oxidative injury: cytotoxicity (LDH release) and coordinated stress and
      inflammatory activation with UVB-typical histopathology.
    limitations: >-
      A single acute UVB dose over three days models the initiating injury rather
      than the cumulative, years-long UV exposure that produces clinical
      photoaging; healthy-donor tissue with only resident immune cells and no
      circulating-immune recruitment or vascular perfusion.
    readouts:
    - name: Cytotoxicity (LDH release) and IL-8 secretion
      target: UVB Irradiation and Photo-oxidative Injury
      direction: INCREASED
      interpretation: >-
        UVB significantly increased LDH release (cytotoxicity) and IL-8 secretion in
        the basal medium.
      evidence:
      - reference: DOI:10.64898/2026.04.30.721933
        reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "UVB exposure triggered coordinated stress and inflammatory responses that were partially mitigated using topical sunscreen"
        explanation: >-
          UVB triggered the coordinated stress and inflammatory response measured by
          the cytotoxicity and cytokine readouts.
    evidence:
    - reference: DOI:10.64898/2026.04.30.721933

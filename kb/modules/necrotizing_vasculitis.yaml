  evidence:
  - reference: PMID:35254509
    reference_title: "Mechanisms of vascular damage in ANCA vasculitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ANCA trigger neutrophil activation leading to vascular damage in ANCA
      vasculitis. However, decades of study have determined that neutrophil
      activation alone is not sufficient to cause disease. Inflammatory stimuli
      are drivers of ANCA autoantigen expression and ANCA production.
    explanation: >-
      States the trigger this node models for the pauci-immune route - ANCA
      binding to neutrophils in a permissive inflammatory milieu - and the
      qualifier that makes the milieu part of the trigger rather than incidental.
      Evidence source is OTHER because this is an authoritative review.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among systemic diseases, the most frequently associated with LCV are
      ANCA-associated vasculitides, connective tissue diseases, cryoglobulinemic
      vasculitis, IgA vasculitis (formerly known as Henoch-Schonlein purpura) and
      hypocomplementemic urticarial vasculitis (HUV).
    explanation: >-
      Covers the immune-complex route into this node, establishing that the same
      neutrophilic fibrinoid-necrotic lesion is reached from cryoglobulinaemic,
      IgA and connective-tissue-disease stimuli as well as from ANCA.
  downstream:
  - target: Complement C5a Amplification and Neutrophil Recruitment
    causal_link_type: DIRECT
    description: >-
      Factors released by the ANCA-activated neutrophil at the wall activate the
      alternative complement pathway, initiating the amplification loop.
    evidence:
    - reference: PMID:17200182
      reference_title: "Alternative complement pathway in the pathogenesis of disease mediated by anti-neutrophil cytoplasmic autoantibodies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Incubation of MPO-ANCA or PR3-ANCA IgG with human neutrophils caused
        release of factors that activated complement.
      explanation: >-
        Sources the edge itself rather than either node: stimulation of
        neutrophils by ANCA is what generates the complement-activating factors,
        so the trigger step causes the amplifier step.
- name: Complement C5a Amplification and Neutrophil Recruitment
  description: >-
    Complement is engaged in the vessel wall and generates the anaphylatoxin C5a.
    C5a acting through the neutrophil C5a receptor (C5aR1) both chemoattracts
    further neutrophils to the segment and primes them for a stronger response to
    the same stimulus, so a local activation event becomes a self-sustaining
    inflammatory amplification loop confined to the vessel wall. This is the step
    that converts a focal, potentially self-limited insult into destructive
    disease.

    The ENTRY ROUTE into complement differs between the two arms and is the one
    place where conformers should not copy this node verbatim. In the
    pauci-immune ANCA-associated forms the route is the ALTERNATIVE pathway:
    factors released by the ANCA-activated neutrophil trigger it, and factor B
    and C5 knockout mice develop no disease while C4 knockouts (classical and
    lectin pathways) develop disease comparable to wild type - so the requirement
    is specifically alternative-pathway. In the immune-complex forms (IgA
    vasculitis, cryoglobulinaemic vasculitis, cutaneous leukocytoclastic
    angiitis, rheumatoid vasculitis) deposited complexes engage the CLASSICAL
    pathway instead, which is why hypocomplementaemia with low C4 is a marker
    there and not in the pauci-immune forms. What is shared - and what this node
    is named for - is the convergent output: C5a acting on neutrophil C5aR1. The
    node therefore binds the parent process GO:0006956 complement activation
    alongside the alternative pathway, and a conformer in the immune-complex arm
    should substitute the classical pathway and cite its own complement evidence
    rather than inheriting the anti-MPO mouse citations below.

    Note on the key conformance target: the deep-research report for this module
    recommended designating THIS node the required hub, on the grounds that it
    carries the strongest causal evidence (an interventional RCT plus knockouts).
    The central effector was chosen instead, deliberately, because the key
    conformance target should be the step that is most disorder-agnostic rather
    than the step that is best evidenced - and this node is the one place the
    module admits its members diverge, since the entry route into complement
    differs by arm and the RCT evidence covers only the ANCA arm. The evidential
    strength is real, and is why the drug-target pattern hangs here.

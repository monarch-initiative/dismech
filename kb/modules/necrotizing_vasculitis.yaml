  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the inflammatory infiltrate is composed of neutrophils with fibrinoid
      necrosis and disintegration of nuclei into fragments ("leukocytoclasia")
    explanation: >-
      Defines the lesion this node models - neutrophilic infiltrate plus fibrinoid
      necrosis plus leukocytoclasia - as the histopathologic diagnostic finding.
  - reference: PMID:35254509
    reference_title: "Mechanisms of vascular damage in ANCA vasculitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This cascade of events perpetuates a vicious cycle of further inflammatory
      cell recruitment and activation, culminating in tissue necrosis.
    explanation: >-
      Places the necrosis at the end of the recruitment-and-activation cascade the
      upstream nodes model, which is the ordering this module asserts.
      Evidence source is OTHER because this is an authoritative review.
  downstream:
  - target: Luminal Compromise and Downstream Tissue Infarction
    causal_link_type: DIRECT
- name: Luminal Compromise and Downstream Tissue Infarction
  description: >-
    A wall that has become fibrinoid-necrotic can no longer do either of its
    jobs. It is thrombogenic, so the lumen occludes; it is mechanically weak, so
    it dilates into a microaneurysm or ruptures and bleeds; and inflammatory
    healing narrows it by fibrosis. The result is ischaemic and haemorrhagic
    injury to whatever the vessel supplied, and this is where the members diverge
    most visibly even though the lesion is the same: necrotizing crescentic
    glomerulonephritis and alveolar capillaritis with pulmonary haemorrhage in
    the ANCA-associated small-vessel forms, palpable purpura where dermal
    postcapillary venules are involved, mononeuritis multiplex from vasa
    nervorum occlusion, and mesenteric or renal microaneurysm with organ
    infarction in medium-vessel polyarteritis nodosa. Untreated, this node is
    what makes necrotizing vasculitis organ- and life-threatening, and it is the
    reason the shared therapeutic consequence across the group is prompt
    induction immunosuppression.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32855422
    reference_title: "ANCA-associated vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although any tissue can be involved in AAV, the upper and lower respiratory
      tract and kidneys are most commonly and severely affected.
    explanation: >-
      Supports the organ-pattern half of this node for the ANCA-associated
      members: the same mural lesion expresses itself as severe injury in the
      territories the affected vessels supply.
  - reference: PMID:29078325
    reference_title: "Necroptosis controls NET generation and mediates complement activation, endothelial damage, and autoimmune vasculitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ANCA activates neutrophils and activated neutrophils damage the
      endothelium, leading to vascular inflammation and necrosis.
    explanation: >-
      Carries the ordering this node depends on - endothelial damage by activated
      neutrophils is what produces the vascular necrosis whose consequences are
      modelled here. Evidence source is OTHER because the sentence is the paper's
      framing of established mechanism rather than its own result.
discussions:
- discussion_id: nv_c5a_dependence_untested_in_immune_complex_arm
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the C5a-C5aR1 amplification step actually required in the immune-complex
    vasculitides, as it is demonstrably required in the ANCA-associated ones, or
    do the two arms converge on the shared lesion through partly distinct
    effector programs?
  attaches_to:
  - "pathophysiology#Complement C5a Amplification and Neutrophil Recruitment"
  rationale: >-
    This module places all eight members on one chain through the amplifier node,
    but the evidence behind that node is asymmetric and the asymmetry is not
    incidental. The pauci-immune arm has genetic dissection (factor B and C5
    knockouts protected, C4 knockouts not), a compartment-specific bone-marrow
    C5aR requirement, and an interventional RCT. The immune-complex arm rests on
    histopathology and review-level statements that deposited complexes activate
    complement and recruit neutrophils, with no branch-specific complement
    blockade trial. The two arms also enter complement by different routes -
    alternative versus classical - so convergence on an identical C5a-dependent
    step is a plausible inference from the shared lesion rather than a
    demonstrated fact. This matters practically: it determines whether avacopan,
    the node-specific agent modelled in this module, should be expected to work
    in cryoglobulinaemic or IgA vasculitis at all, and it is the single
    assumption most likely to be wrong in the module as curated.
  proposed_experiments:
  - experiment_id: nv_c5ar1_blockade_immune_complex_vasculitis
    name: C5aR1 blockade in biopsy-proven immune-complex small-vessel vasculitis
    description: >-
      A randomized trial of a C5aR1 antagonist against standard induction in
      biopsy-proven immune-complex necrotizing vasculitis (IgA vasculitis with
      nephritis, or cryoglobulinaemic vasculitis with the antigenic drive
      already treated), with paired pre- and post-treatment biopsies read for
      intramural neutrophil density and fibrinoid necrosis.
    would_support:
    - "pathophysiology#Complement C5a Amplification and Neutrophil Recruitment"
    supporting_outcome:
    - >-
      Reduced intramural neutrophil density and reduced fibrinoid necrosis on
      the post-treatment biopsy, with clinical remission rates comparable to
      those seen with C5aR1 blockade in the ANCA-associated arm.
    would_refute:
    - "pathophysiology#Complement C5a Amplification and Neutrophil Recruitment"
    refuting_outcome:
    - >-
      No reduction in intramural neutrophil density or fibrinoid necrosis
      despite adequate receptor occupancy, which would mean the immune-complex
      arm reaches the shared lesion without passing through a C5aR1-dependent
      step and that the two arms should be modelled as separate amplifiers.
treatments:
- name: C5a Receptor Antagonist Therapy
  description: >-
    Avacopan is an oral small-molecule antagonist of C5aR1, the receptor through
    which C5a recruits and primes neutrophils in the amplification loop. It is
    the node-specific agent for this module: rather than suppressing immunity
    broadly, it interrupts the single amplifier step that the complement-knockout
    and C5aR-deficient-marrow experiments identified as required. In the ADVOCATE
    trial in GPA and MPA it was non-inferior to a prednisone taper for remission
    at week 26 and superior for sustained remission at week 52, on a background
    of rituximab or cyclophosphamide - so it substitutes for glucocorticoid
    exposure rather than for induction immunosuppression. This is the
    drug-target design pattern conforming disorders should copy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: avacopan
      term:
        id: NCIT:C174788
        label: Avacopan
  target_mechanisms:
  - target: Complement C5a Amplification and Neutrophil Recruitment
    treatment_effect: INHIBITS
    description: >-
      Blocking C5aR1 on neutrophils removes the priming and chemotactic arm of
      the complement amplification loop inside the vessel wall.
  evidence:
  - reference: PMID:33596356
    reference_title: "Avacopan for the Treatment of ANCA-Associated Vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The C5a receptor inhibitor avacopan is being studied for the treatment of
      antineutrophil cytoplasmic antibody (ANCA)-associated vasculitis.
    explanation: >-
      Identifies the drug's molecular target as the C5a receptor, which is the
      node this treatment acts on.
  - reference: PMID:33596356
    reference_title: "Avacopan for the Treatment of ANCA-Associated Vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      avacopan was noninferior but not superior to prednisone taper with respect
      to remission at week 26 and was superior to prednisone taper with respect
      to sustained remission at week 52.
    explanation: >-
      The randomized-trial result that validates this node pharmacologically in
      humans, and the basis for the description's claim that avacopan spares
      glucocorticoid rather than replacing induction therapy.
- name: Anti-CD20 B Cell Depletion
  description: >-
    Rituximab depletes CD20-positive B cells and so removes the supply of the
    autoantibody that constitutes the trigger stimulus in the ANCA-associated
    members. It acts one step upstream of the module's key conformance target -
    it does not touch the intramural degranulation directly, but starves the
    trigger node of ANCA. In the RAVE trial it was non-inferior to
    cyclophosphamide for induction of remission and more effective in relapsing
    disease. Conforming disorders in the immune-complex arm should not copy this
    treatment uncritically: where the antigenic drive is exogenous (hepatitis C
    in cryoglobulinaemic vasculitis) the first-line logic is to remove the
    antigen, not the B cell.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Vessel Wall Immune Stimulus Deposition and Endothelial Activation
    treatment_effect: INHIBITS
    description: >-
      B cell depletion removes the source of the ANCA that converts a primed
      neutrophil into an activated one at the vessel wall.
  evidence:
  - reference: PMID:20647199
    reference_title: "Rituximab versus cyclophosphamide for ANCA-associated vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rituximab therapy was not inferior to daily cyclophosphamide treatment for
      induction of remission in severe ANCA-associated vasculitis and may be
      superior in relapsing disease.
    explanation: >-
      The randomized-trial result supporting B cell depletion as induction therapy
      acting on the autoantibody supply to the trigger node.

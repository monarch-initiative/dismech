  evidence:
  - reference: PMID:27536680
    reference_title: "Overview of the Pathogenesis of ANCA-Associated Vasculitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Activated neutrophils adhere to and penetrate vessel walls, and they
      release toxic oxygen radicals and destructive enzymes that cause apoptosis
      and necrosis of the neutrophils as well as of the adjacent vessel wall
      cells and matrix.
    explanation: >-
      The defining statement of this node: leukocytes that have entered the wall
      degranulate there, and their oxidants and enzymes are what kill the mural
      cells and matrix. Evidence source is OTHER because this is a review
      synthesizing the effector step.
  - reference: PMID:19448636
    reference_title: "Netting neutrophils in autoimmune small-vessel vasculitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      chromatin fibers, so-called neutrophil extracellular traps (NETs), are
      released by ANCA-stimulated neutrophils and contain the targeted
      autoantigens proteinase-3 (PR3) and myeloperoxidase (MPO)
    explanation: >-
      Grounds the NET arm of this node and the feed-forward loop it creates: the
      traps extruded during intramural degranulation carry the very autoantigens
      that drive the trigger step. Evidence source is IN_VITRO because this
      particular result was obtained by priming isolated neutrophils and
      incubating them with purified IgG.
  - reference: PMID:19448636
    reference_title: "Netting neutrophils in autoimmune small-vessel vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deposition of NETs in inflamed kidneys and circulating MPO-DNA complexes
      suggest that NET formation triggers vasculitis
    explanation: >-
      The human arm of the same study, kept as a separate item because it is a
      different kind of evidence: NETs are found in patient tissue, not only in
      stimulated cell culture.
  - reference: PMID:28537941
    reference_title: "Pathophysiology of ANCA-associated Vasculitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Activated neutrophils attach to and transmigrate through endothelium and
      accumulate within the vessel wall. These neutrophils degranulate and
      produce reactive oxygen radicals and ultimately die, causing tissue injury.
    explanation: >-
      States the location requirement that defines this node - the neutrophils
      degranulate after accumulating WITHIN the vessel wall, not in the lumen.
      Evidence source is OTHER because this is a pathophysiology review.
  downstream:
  - target: Complement C5a Amplification and Neutrophil Recruitment
    causal_link_type: DIRECT
    description: >-
      The feed-forward arm. NETs extruded during intramural degranulation are
      themselves a scaffold for alternative-pathway complement activation, so
      this node re-enters the amplifier rather than only feeding forward. The
      chain is therefore a loop at this point, not a straight line.
    evidence:
    - reference: PMID:29078325
      reference_title: "Necroptosis controls NET generation and mediates complement activation, endothelial damage, and autoimmune vasculitis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We observed that NETs provided a scaffold for AP activation that in turn
        contributed to EC damage.
      explanation: >-
        Sources this specific edge: the NETs produced at this node activate the
        alternative pathway, which is the amplifier node, closing the loop.
  - target: Fibrinoid Necrosis of the Vessel Wall
    causal_link_type: DIRECT
    description: >-
      The oxidants and proteases released inside the wall are the proximate cause
      of mural cell death and matrix destruction.
    evidence:
    - reference: PMID:27536680
      reference_title: "Overview of the Pathogenesis of ANCA-Associated Vasculitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        they release toxic oxygen radicals and destructive enzymes that cause
        apoptosis and necrosis of the neutrophils as well as of the adjacent
        vessel wall cells and matrix
      explanation: >-
        Sources the causal step from degranulation to death of the wall cells and
        matrix, rather than either node on its own.
    - reference: PMID:28537941
      reference_title: "Pathophysiology of ANCA-associated Vasculitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Endothelial injury results in leakage of serum proteins and coagulation
        factors causing fibrinoid necrosis.
      explanation: >-
        Names the specific step that makes the necrosis "fibrinoid": leukocyte
        injury to the endothelium lets serum proteins and coagulation factors
        insudate into the wall. Evidence source is OTHER because this is a
        pathophysiology review.
    - reference: PMID:29078325
      reference_title: "Necroptosis controls NET generation and mediates complement activation, endothelial damage, and autoimmune vasculitis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        NETs from ANCA-stimulated neutrophils caused endothelial cell (EC)
        damage in vitro.
      explanation: >-
        Supplies the NET-specific half of this edge: material released at the
        degranulation node is directly cytotoxic to the endothelium whose death
        begins the fibrinoid lesion.
- name: Fibrinoid Necrosis of the Vessel Wall
  description: >-
    The defining histopathologic lesion. Endothelial and vascular smooth muscle
    cells die, the internal elastic lamina and mural extracellular matrix are
    degraded, and the loss of endothelial barrier integrity lets plasma proteins
    - fibrinogen above all - insudate into the necrotic wall, where they
    polymerize to give the smudgy, brightly eosinophilic "fibrinoid" appearance.
    The infiltrating neutrophils themselves die in place and fragment, scattering
    nuclear debris ("nuclear dust", leukocytoclasia) through the wall. This is
    the lesion HP:6000253 Necrotizing vasculitis names and the finding that makes
    a biopsy report read "necrotizing vasculitis" without naming a disease; it is
    also the reason the Necrotizing Vasculitides Grouping is anchored on
    histopathology rather than aetiology. Conformers differ in calibre and site,
    not in the character of the lesion.

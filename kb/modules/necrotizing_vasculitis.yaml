  evidence:
  - reference: PMID:17200182
    reference_title: "Alternative complement pathway in the pathogenesis of disease mediated by anti-neutrophil cytoplasmic autoantibodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After injection of anti-MPO IgG, C4-/- mice developed disease comparable
      with wild-type disease; however, C5-/- and factor B-/- mice developed no
      disease.
    explanation: >-
      Genetic dissection placing the requirement on the alternative pathway and
      C5 rather than the classical/lectin pathways, which is what this node
      asserts. Evidence source is MODEL_ORGANISM because the dissection used
      complement-knockout mice.
  - reference: PMID:19073822
    reference_title: "C5a receptor mediates neutrophil activation and ANCA-induced glomerulonephritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All mice that received wild-type marrow (six of six) but only one of eight
      mice that received C5aR-deficient marrow developed NCGN (P < 0.05).
    explanation: >-
      Isolates the receptor arm of the amplification loop to the leukocyte
      compartment: bone-marrow C5aR is required for necrotizing crescentic
      glomerulonephritis to develop. Evidence source is MODEL_ORGANISM because
      this is a murine bone-marrow-transplant experiment.
  - reference: PMID:19073822
    reference_title: "C5a receptor mediates neutrophil activation and ANCA-induced glomerulonephritis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This conditioned serum primed neutrophils for ANCA-induced respiratory
      burst; neutrophil C5aR blockade abrogated this priming, but C3aR blockade
      did not.
    explanation: >-
      Establishes the priming half of the loop and its specificity for C5aR over
      C3aR. Split from the item above because the claim is carried by a
      cell-based experiment rather than the mouse experiment.
  - reference: PMID:32602136
    reference_title: "Systemic complement activation in anti-neutrophil cytoplasmic antibody-associated vasculitis and necrotizing glomerulonephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum levels of all complement components were significantly increased in
      patients, compared to controls; C5a: 19.9(0.02-48) vs 9.06(2.1-16.3)pg/mL,
      P = .002
    explanation: >-
      The human counterpart of the mouse experiments above: patients show
      elevated circulating C5a at diagnosis, so the amplification loop this node
      models is active in human disease and not only in the transfer models.
  downstream:
  - target: Intramural Leukocyte Degranulation and Oxidative Burst
    causal_link_type: DIRECT
    description: >-
      The recruited, C5a-primed neutrophils that have entered the wall are the
      cells that then degranulate within it.
    evidence:
    - reference: PMID:25003769
      reference_title: "Pathogenesis of antineutrophil cytoplasmic autoantibody-mediated disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        activation of the alternative complement pathway, which sets in motion an
        inflammatory amplification loop in the vessel wall that attracts and
        activates neutrophils with resultant respiratory burst, degranulation,
        extrusion of neutrophil extracellular traps, apoptosis and necrosis
      explanation: >-
        States the edge directly: the complement amplification loop is what
        attracts and activates the neutrophils whose respiratory burst and
        degranulation constitute the next node. Evidence source is OTHER because
        this is an authoritative review synthesizing the pathogenic sequence.
- name: Intramural Leukocyte Degranulation and Oxidative Burst
  description: >-
    The key conformance target and the rate-limiting, disorder-agnostic step.
    Leukocytes that have adhered to and penetrated the vessel wall discharge
    their cytotoxic contents inside it: a respiratory burst generating reactive
    oxygen species, degranulation releasing serine proteases (proteinase 3,
    elastase, cathepsin G) and myeloperoxidase, and extrusion of neutrophil
    extracellular traps that both damage the wall and re-present MPO and PR3 to
    the immune system, closing a feed-forward loop back to the trigger. The
    effector leukocyte is the neutrophil in every member; EGPA adds the
    eosinophil, whose granule proteins contribute to the same intramural
    cytotoxicity. What defines this node is location, not cell identity - the
    same degranulation occurring in the lumen or the interstitium does not
    produce vasculitis. Mechanistically every member of the group passes through
    this step - it is what the Necrotizing Vasculitides Grouping asserts in its
    second membership criterion.

    That mechanistic claim is not yet matched by the wiring, and the gap is in
    the disorder entries rather than in the module. Only four of the eight
    members currently declare conformance here, because most of the others carry
    a single bundled node fusing this step with its neighbour: IgA vasculitis's
    "Leukocytoclastic Vasculitis in Skin and Systemic Organs" and Cryoglobulinemic
    Vasculitis's "Immune-complex small-vessel vascular injury" each describe
    neutrophil degranulation AND the resulting fibrinoid necrosis in one node, so
    they are wired to the effector, the more specific of the two claims they
    make. Splitting those bundled nodes - and giving Primary Polyarteritis Nodosa
    an intramural-injury node at all - is the follow-up that would let this node
    carry all eight; it is deliberately left out of the module's own PR rather
    than done as a drive-by restructuring of eight other curations.

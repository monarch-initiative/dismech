name: Necrotizing Vasculitis Module
description: >-
  A conserved pathophysiology module for the leukocyte-mediated destruction of
  the blood-vessel wall that produces fibrinoid necrosis - the lesion whose
  biopsy report reads "necrotizing vasculitis" and which recurs across the
  ANCA-associated vasculitides (granulomatosis with polyangiitis, microscopic
  polyangiitis, eosinophilic granulomatosis with polyangiitis), the medium-vessel
  necrotizing arteritis of polyarteritis nodosa, the immune-complex small-vessel
  vasculitides (IgA vasculitis, cryoglobulinaemic vasculitis, cutaneous
  leukocytoclastic angiitis), and secondary forms such as rheumatoid vasculitis.
  The chain is: an immune stimulus is localized to the vessel wall and activates
  the endothelium (ANCA bound to primed neutrophils in the pauci-immune forms,
  deposited immune complexes in the immune-complex forms) -> complement is
  activated through the alternative pathway and the C5a-C5aR1 axis recruits and
  primes further neutrophils, an amplification loop inside the wall ->
  intramural leukocytes undergo respiratory burst, degranulation and NET
  extrusion (the KEY CONFORMANCE TARGET, "necrotizing_vasculitis#Intramural
  Leukocyte Degranulation and Oxidative Burst", the disorder-agnostic
  rate-limiting step every member mechanistically passes through) -> oxidants
  and serine proteases kill endothelial and mural smooth muscle cells and destroy the
  matrix, plasma fibrin insudates, and the wall becomes fibrinoid-necrotic with
  leukocytoclasia -> the damaged segment thromboses, ruptures or aneurysmally
  dilates, causing downstream infarction and haemorrhage. The drug-target
  pattern is anchored on the amplifier node: avacopan, an oral C5aR1 antagonist,
  is the node-specific agent (ADVOCATE), with rituximab acting one step upstream
  on the autoantibody supply. Complementary to, not overlapping with, the
  sibling modules: complement_dysregulation covers loss of negative regulation
  of the alternative pathway itself (aHUS/C3G-type injury) rather than
  leukocyte-mediated mural destruction; granuloma_formation covers the separate
  extravascular granulomatous arm that GPA and EGPA carry alongside this
  vasculitic one; thrombogenesis covers luminal clot formation on an intact
  wall. Conformers substitute the disease-specific stimulus at the trigger node
  and the disease-specific organ pattern at the consequence node while keeping
  the amplifier and central effector intact - "intact" meaning the C5a-C5aR1
  output and the intramural degranulation step, not the complement entry route,
  which is the alternative pathway in the pauci-immune arm and the classical
  pathway in the immune-complex arm (see the amplifier node).
category: Module
module_categories:
- IMMUNOLOGY
- PHARMACOLOGY
creation_date: "2026-09-03T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease. Do NOT create a "Necrotizing
  Vasculitis" Disease entry - MONDO:0800113 is definitionally a class over other
  diseases and is already modelled in dismech as the Grouping
  kb/groupings/Necrotizing_Vasculitides.yaml (issue #8754, PR #8860). This
  module supplies the shared effector mechanism that the Grouping asserts in
  prose in its second membership criterion but could not encode as a
  machine-checkable leaf, because no single shared GO process was annotated
  across the members. Disorder entries reach it via conforms_to (for example,
  "necrotizing_vasculitis#Fibrinoid Necrosis of the Vessel Wall").

  Xogenesis anchor, with a caveat. The terminal output is not a new discrete
  structure but a canonical one made pathological, so the process genus is
  OGMS:0000061 pathological bodily process, sub-typed as OGMS:0000080
  pathological transformation (the vessel wall becomes pathological), at site
  UBERON:0035965 wall of blood vessel. The species term MPATH:9 fibrinoid necrosis sits
  in MPATH's *process* branch (under MPATH:596 pathological process /
  MPATH:597 cell and tissue damage process), NOT in the MPATH:603 pathological
  anatomical entity subtree that the Xogenesis convention normally draws from,
  and there is no MPATH continuant for "fibrinoid-necrotic vessel wall". That is
  recorded here as an OBO gap rather than papered over by binding a continuant
  term that does not mean this. SNOMED CT "Morphologically abnormal structure"
  (49755003) is a census/gap guide only and is not bound. No CURIE in this
  stanza is bound in a term slot; the nodes bind GO, CL and UBERON only.

  Key disease-specific substitutions at the trigger node: GPA and MPA substitute
  PR3-ANCA and MPO-ANCA bound to cytokine-primed neutrophils, with GPA carrying
  an additional extravascular granulomatous arm that belongs to
  granuloma_formation, not here; EGPA substitutes a Th2/eosinophil-dominant
  milieu in which ANCA is present in only a minority (its eosinophil arm is
  discussed under the exclusions below, and CL:0000771 is deliberately NOT bound
  at the central effector: the available sources call eosinophils a hallmark and
  a main effector of organ damage in EGPA without placing their degranulation
  inside the vessel wall, which is the one thing that node is defined by);
  polyarteritis nodosa substitutes an ANCA-negative medium-artery lesion whose
  consequence node is microaneurysm and infarction rather than
  glomerulonephritis; IgA vasculitis substitutes galactose-deficient IgA1
  immune complexes; cryoglobulinaemic vasculitis substitutes cold-precipitable
  immunoglobulin complexes, usually HCV-driven; cutaneous leukocytoclastic
  angiitis substitutes a drug or infectious hapten with the consequence node
  restricted to dermal postcapillary venules; rheumatoid vasculitis substitutes
  rheumatoid-factor-containing complexes in long-standing seropositive RA.

  A note on Primary Polyarteritis Nodosa before the exclusions, because the two
  look similar and are not. PAN is wired here at the effector and consequence
  nodes only: its dismech entry has no neutrophil or complement node to wire
  further upstream, and its own cited evidence says the pathogenesis of
  idiopathic PAN remains enigmatic. That is a NOT-YET-CURATED mechanism, not a
  different one - the Chapel Hill definition of PAN is necrotizing arteritis
  with mural leukocyte infiltration, so it belongs on this chain and the missing
  upstream nodes are a curation gap to close. The exclusions below are the
  opposite case: diseases whose effector is KNOWN and is not this one. Reaching
  the lesion is not what qualifies a conformer; having no contrary mechanism yet
  is not the same as having a contrary one.

  DO NOT conform these, even though they reach a necrotizing lesion. The
  boundary is the C5a/neutrophil hub, not the lesion. (a) Deficiency of
  Adenosine Deaminase 2 (kb/disorders/Deficiency_of_Adenosine_Deaminase_2.yaml)
  is a monogenic medium-vessel necrotizing vasculitis, but ADA2 loss skews
  macrophages to a pro-inflammatory M1 subset and the disease responds to
  TNF-alpha inhibition rather than to complement- or neutrophil-directed
  therapy, so it reaches the terminal nodes by a different effector and is
  deliberately not wired here. (b) Lymphocyte-dominant vasculitides, where the
  effector is lymphocytic or direct viral endothelial injury, are out of scope
  even when fibrinoid necrosis is present. (c) Angiotensin- and pressure-driven
  fibrinoid vasculopathy (malignant hypertension) and thrombotic
  microangiopathy are haemodynamic or thrombotic, not leukocyte-and-complement
  mediated, and are out of scope - the Necrotizing Vasculitides Grouping makes
  the same exclusion. (d) In EGPA, wire the NEUTROPHIL node to the central
  effector; the eosinophil-infiltrative arm (cardiomyopathy, neuropathy) runs
  to its own consequences and is an adjunct sub-branch, not a replacement for
  the hub, so the eosinophil node is left unwired.

  Scope caveat: the strongest experimental evidence for the amplifier node
  (complement knockout and C5aR-deficient bone marrow protecting mice from
  anti-MPO glomerulonephritis) comes from the ANCA arm. The immune-complex
  members are placed on the same chain on histopathologic and clinical grounds -
  the same neutrophil-with-fibrinoid-necrosis lesion, the same C5a-generating
  complement activation - and a conformer in that arm should cite its own
  complement evidence rather than inheriting the ANCA-model citations. Modules
  bind GO and CL terms only, with UBERON locations; no CHEBI or MONDO bindings
  in nodes, except in the treatments block where the therapeutic agent carries
  an ontology identifier per the treatment schema.
pathophysiology:
- name: Vessel Wall Immune Stimulus Deposition and Endothelial Activation
  description: >-
    The proximal trigger is the localization of an immune stimulus to the wall of
    a small or medium vessel together with activation of the overlying
    endothelium. Two upstream routes converge here and are mutually exclusive in
    any one disease. In the pauci-immune route, a cytokine-primed neutrophil
    translocates its granule autoantigens (proteinase 3, myeloperoxidase) to the
    cell surface where circulating ANCA can bind them, engaging Fc-gamma
    receptors and converting a circulating cell into an adherent, activated one
    at the vessel wall. In the immune-complex route, preformed or in-situ immune
    complexes (galactose-deficient IgA1 in IgA vasculitis, cold-precipitable
    cryoglobulins in cryoglobulinaemic vasculitis, rheumatoid-factor complexes in
    rheumatoid vasculitis, drug- or infection-driven complexes in cutaneous
    leukocytoclastic angiitis) deposit in the wall. Either way the endothelium
    upregulates adhesion molecules and the vessel becomes a site of leukocyte
    arrest. The requirement for a priming inflammatory milieu is why neutrophil
    activation alone is not sufficient and why infection so often precedes onset.
  role: trigger
  biological_scale: MOLECULAR
  locations:
  - preferred_term: wall of blood vessel
    term:
      id: UBERON:0035965
      label: wall of blood vessel
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:

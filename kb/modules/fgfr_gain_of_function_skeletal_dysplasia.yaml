  evidence:
  - reference: PMID:9042914
    reference_title: "A unique point mutation in the fibroblast growth factor receptor 3 gene (FGFR3) defines a new craniosynostosis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present 61 individuals from 20 unrelated families where
      coronal synostosis is due to an amino acid substitution (Pro250Arg)
      that results from a single point mutation in the fibroblast growth
      factor receptor 3 gene on chromosome 4p.
    explanation: >-
      Demonstrates that a recurrent activating FGFR3 allele causes coronal
      craniosynostosis, the prototypical suture-fusion outcome of the module.
  - reference: PMID:7719344
    reference_title: "Apert syndrome results from localized mutations of FGFR2 and is allelic with Crouzon syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified specific missense substitutions involving adjacent amino acids
      (Ser252Trp and Pro253Arg) in the linker between the second and third extracellular
      immunoglobulin (Ig) domains of fibroblast growth factor receptor 2 (FGFR2) in all
      40 unrelated cases of Apert syndrome studied.
    explanation: >-
      Establishes the recurrent activating FGFR2 linker alleles underlying Apert
      syndrome craniosynostosis, the FGFR2 instance of the suture-fusion arm.

- name: CNP-NPR2 Counter-Regulation and FGFR-Pathway Antagonist Therapy
  description: >-
    C-type natriuretic peptide (CNP) signaling through NPR-B (NPR2) physiologically
    antagonizes FGFR3-MAPK activity in growth-plate chondrocytes by inhibiting the
    MAPK pathway downstream of the receptor. This counter-regulatory branch is the
    mechanistic rationale for CNP-analog therapy (vosoritide) and other
    FGFR-pathway antagonists that target the conserved MAPK effector axis to
    restore endochondral bone growth.
  role: therapeutic_vulnerability
  cell_types:
  - preferred_term: Growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: receptor guanylyl cyclase signaling pathway
    term:
      id: GO:0007168
      label: receptor guanylyl cyclase signaling pathway
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: DECREASED
  evidence:
  - reference: PMID:14702637
    reference_title: "Overexpression of CNP in chondrocytes rescues achondroplasia through a MAPK-dependent pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CNP prevented the shortening of achondroplastic bones by correcting the decreased extracellular matrix synthesis in the growth plate through inhibition of the MAPK pathway of FGF signaling.
    explanation: >-
      Establishes that CNP antagonizes FGFR3-MAPK signaling in the growth plate,
      the counter-regulatory and therapeutic rationale (vosoritide) for the module.

treatments:
- name: Direct FGFR kinase inhibition (small-molecule tyrosine kinase inhibitors)
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The receptor-directed therapeutic arm of the module, and the mechanistic
    complement of the CNP-NPR2 node: rather than recruiting a parallel pathway
    that brakes MAPK downstream of the receptor, an ATP-competitive small-molecule
    inhibitor blocks the mutant receptor's kinase output itself. Two agents define
    the arm and differ in selectivity, which is the axis conforming disorders
    should preserve. Infigratinib is a pan-FGFR1-3 inhibitor repurposed from
    oncology at roughly a hundredth of the oncology dose; it met its primary
    endpoint in phase 3 in p.Gly380Arg achondroplasia (+1.74 cm/year annualized
    height velocity over placebo at 52 weeks). TYRA-300 is FGFR3-selective,
    designed to avoid FGFR1/2/4 toxicity, and has preclinical activity in mouse
    models of both achondroplasia and hypochondroplasia. Two limits belong with
    this arm wherever it is reused: (1) allele-specificity is not established —
    the achondroplasia p.Gly380Arg result does not transfer to the
    hypochondroplasia p.Asn540Lys allele, whose sensitivity to infigratinib is
    actively disputed (see gap_fgfr_tki_selectivity_and_allele_specificity); and
    (2) pan-FGFR inhibition has documented off-target skeletal effects, so a
    conforming disorder must not curate "FGFR TKI" as a generic safe therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infigratinib
      term:
        id: CHEBI:63451
        label: BGJ-398
  target_mechanisms:
  - target: Constitutive FGFR Activation
    treatment_effect: INHIBITS
    description: >-
      An ATP-competitive inhibitor occupies the receptor kinase domain, reducing
      the signal output of the constitutively active receptor at its source
      rather than opposing it downstream.
    evidence:
    - reference: PMID:42370681
      reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Infigratinib, an oral FGFR1-3 tyrosine kinase inhibitor, down-regulates key pathways in the pathogenesis of achondroplasia."
      explanation: States the receptor-directed mechanism for the pan-FGFR agent.
    - reference: PMID:40178985
      reference_title: "TYRA-300, an FGFR3-selective inhibitor, promotes bone growth in two FGFR3-driven models of chondrodysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TYRA-300, a potent and selective FGFR3 inhibitor, was evaluated in 3 genetic contexts: wild-type mice, the Fgfr3Y367C/+ mouse model of ACH, and the Fgfr3N534K/+ mouse model of HCH."
      explanation: >-
        Establishes the paralog-selective member of the same arm, which is what
        makes selectivity a curatable axis rather than a footnote.
  evidence:
  - reference: PMID:42370681
    reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children with achondroplasia, treatment with once-daily oral infigratinib for 52 weeks resulted in a significantly greater increase from baseline in the annualized height velocity than placebo."
    explanation: >-
      The first randomized phase 3 evidence that inhibiting the receptor directly
      alters growth in an FGFR-related skeletal dysplasia.
  - reference: PMID:40178985
    reference_title: "TYRA-300, an FGFR3-selective inhibitor, promotes bone growth in two FGFR3-driven models of chondrodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In each model, TYRA-300 treatment increased nasoanal length and tibia and femur length."
    explanation: Preclinical efficacy of the FGFR3-selective agent across both ACH and HCH models.
  - reference: PMID:40178985
    reference_title: "TYRA-300, an FGFR3-selective inhibitor, promotes bone growth in two FGFR3-driven models of chondrodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TYRA-300 significantly improved the size and shape of the skull and foramen magnum in Fgfr3Y367C/+ mice."
    explanation: >-
      Notable because foramen magnum stenosis is the complication that drives
      early mortality risk, and it is not a growth-velocity endpoint.
  - reference: PMID:41641077
    reference_title: "Inhibition of FGFR signaling with infigratinib improves linear bone growth in the female Aga2/+ mouse model of osteogenesis imperfecta."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these data establish FGFR as a therapeutic target for short stature in osteogenesis imperfecta and identify potential negative effects of pan-FGFR inhibition, particularly in the male skeleton."
    explanation: >-
      Records the off-target skeletal liability of pan-FGFR inhibition, the
      safety argument for paralog-selective agents.

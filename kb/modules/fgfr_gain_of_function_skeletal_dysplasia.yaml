- name: Premature Suture Fusion and Craniosynostosis
  conforms_to: "cranial_suture_premature_fusion#Premature Cranial Suture Fusion and Craniosynostosis"
  description: >-
    Excess osteogenic differentiation within cranial sutures causes premature
    bony fusion, most characteristically of the coronal suture, distorting
    cranial growth and producing the craniosynostosis phenotypes of the FGFR
    syndromes (Muenke, Crouzon, Apert, Pfeiffer, Jackson-Weiss). This is the FGFR
    instance of the pathway-agnostic premature-suture-fusion endpoint shared
    across the FGFR, BMP (SMAD6), and TWIST1 craniosynostosis routes.
  role: consequence

name: FGFR Gain-of-Function Skeletal Dysplasia Module
description: >-
  A conserved developmental mechanism module for the germline FGFR
  gain-of-function skeletal dysplasias and craniosynostosis syndromes. A
  recurrent activating mutation in a fibroblast growth factor receptor (most
  commonly FGFR3, less often FGFR2 or FGFR1) produces a constitutively active
  or ligand-hypersensitive receptor. The resulting sustained MAPK/ERK and STAT
  signaling acts in two skeletogenic compartments: in growth-plate chondrocytes
  it drives premature exit from proliferation and dysregulated chondrocyte
  differentiation, impairing endochondral ossification and producing
  chondrodysplasia; in cranial suture mesenchyme it accelerates osteoblast
  differentiation and matrix mineralization, producing premature suture fusion
  and craniosynostosis. The physiological CNP-NPR2 pathway antagonizes
  FGFR3-MAPK signaling and provides the therapeutic rationale for CNP-analog
  and FGFR-pathway antagonist therapy.
category: Module
creation_date: "2026-05-30T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (for example,
  "fgfr_gain_of_function_skeletal_dysplasia#Sustained MAPK/STAT Signaling").
  The module is genotype-driven and intended for the germline FGFR gain-of-function
  spectrum: chondrodysplasias (Achondroplasia, Hypochondroplasia, Thanatophoric
  Dysplasia types 1 and 2, SADDAN) and craniosynostosis syndromes (Muenke,
  Crouzon, Crouzon with acanthosis nigricans, Apert, Pfeiffer, Jackson-Weiss).
  It complements the somatic, cancer-oriented rtk_grb2_signaling_adaptation
  module on the developmental side: both converge on RTK-driven RAS-MAPK output,
  but this module captures germline FGFR alleles acting in chondrocytes and
  cranial sutures rather than acquired RTK lesions in tumors. Conforming
  disorder nodes substitute the specific receptor (FGFR1/2/3), the recurrent
  allele, and the affected skeletogenic compartment (growth plate vs cranial
  suture) while preserving the conserved MAPK/STAT effector axis.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_fgfr_mapk_stat_model
  hypothesis_label: Canonical FGFR Gain-of-Function MAPK/STAT Model
  status: CANONICAL
  description: >-
    An activating germline FGFR mutation produces a constitutively active or
    ligand-hypersensitive receptor that sustains MAPK/ERK and STAT signaling.
    In growth-plate chondrocytes this dysregulates chondrocyte differentiation
    and impairs endochondral ossification; in cranial suture mesenchyme it
    accelerates osteoblast differentiation and causes premature suture fusion.
  evidence:
  - reference: PMID:14871928
    reference_title: "Constitutive activation of MEK1 in chondrocytes causes Stat1-independent achondroplasia-like dwarfism and rescues the Fgfr3-deficient mouse phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These observations suggest a model in which Fgfr3 signaling inhibits bone
      growth by inhibiting chondrocyte differentiation through the MAPK pathway
      and by inhibiting chondrocyte proliferation through Stat1.
    explanation: >-
      Establishes the canonical dual-effector model in which FGFR signaling acts
      through MAPK and STAT1 to control chondrocyte behavior and bone growth.
- hypothesis_group_id: fgfr_activation_mechanism_heterogeneity
  hypothesis_label: FGFR Activation-Mechanism Heterogeneity Model
  status: ALTERNATIVE
  description: >-
    Different FGFR alleles engage the same downstream MAPK/STAT axis but activate
    the receptor by distinct biophysical mechanisms: linker-region substitutions
    (Apert FGFR2 S252W/P253R, Muenke FGFR3 P250R) increase FGF-ligand affinity and
    specificity, whereas transmembrane and extracellular-cysteine substitutions
    (achondroplasia, thanatophoric dysplasia) confer ligand-independent
    constitutive activation. The degree of constitutive activation is proposed to
    scale with phenotypic severity across the FGFR3 dysplasia family.
  evidence:
  - reference: PMID:10696568
    reference_title: "The molecular and genetic basis of fibroblast growth factor receptor 3 disorders: the achondroplasia family of skeletal dysplasias, Muenke craniosynostosis, and Crouzon syndrome with acanthosis nigricans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent evidence suggests that the phenotypic differences may be due to
      specific alleles with varying degrees of ligand-independent activation,
      allowing the receptor to be constitutively active.
    explanation: >-
      Supports allele-specific, ligand-independent constitutive activation as the
      basis for phenotypic variation across the FGFR3 dysplasia spectrum.
  - reference: PMID:11390973
    reference_title: "Structural basis for fibroblast growth factor receptor 2 activation in Apert syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These structures demonstrate that both mutations introduce additional
      interactions between FGFR2 and FGF2, thereby augmenting FGFR2-FGF2 affinity.
    explanation: >-
      Provides the contrasting ligand-affinity activation mechanism for the
      Apert linker-region FGFR2 alleles, distinct from ligand-independent
      constitutive activation.
discussions:
- discussion_id: gap_fgfr_compartment_branch_dominance
  prompt: >-
    Why do some activating FGFR alleles predominantly cause chondrodysplasia
    (growth-plate phenotype) while homologous alleles in a different receptor
    predominantly cause craniosynostosis (cranial-suture phenotype), and does
    the relative dominance of the MAPK versus STAT branch differ between these
    two skeletogenic compartments?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Growth-Plate Chondrocyte Dysregulation
  - pathophysiology#Cranial Suture Osteogenic Acceleration
  rationale: >-
    The same FGFR-MAPK/STAT axis produces opposite tissue outcomes (impaired
    endochondral ossification versus accelerated intramembranous ossification).
    Conforming disorder entries will need tissue- and allele-specific evidence to
    determine whether compartment specificity reflects receptor expression,
    ligand availability, or branch-specific signaling thresholds.
- discussion_id: gap_fgfr_tki_selectivity_and_allele_specificity
  prompt: >-
    Does inhibiting the FGFR kinase directly work across the whole allelic series,
    or is efficacy allele-specific — and does pan-FGFR1-3 inhibition carry skeletal
    liabilities that a paralog-selective FGFR3 inhibitor would avoid?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Constitutive FGFR Activation
  - pathophysiology#Sustained MAPK/STAT Signaling
  rationale: >-
    Direct receptor inhibition became a clinical reality in 2026 with the phase 3
    infigratinib result in achondroplasia, and the module now carries it as a
    therapeutic arm. But that result is for one allele — FGFR3 p.Gly380Arg, a
    transmembrane substitution — and the module's own alternative hypothesis
    (fgfr_activation_mechanism_heterogeneity) says the alleles activate the
    receptor by different biophysical mechanisms. There is therefore no ground for
    assuming a TKI is equally effective against a linker-region allele (Apert
    FGFR2 p.Ser252Trp, Muenke FGFR3 p.Pro250Arg, which act by raising ligand
    affinity), an extracellular-cysteine allele (thanatophoric dysplasia type 1),
    or the kinase-domain p.Asn540Lys of hypochondroplasia — where potency is
    actively disputed in the 2026 literature. A second, independent question is
    selectivity: infigratinib inhibits FGFR1, FGFR2 and FGFR3, and pan-FGFR
    inhibition in a mouse model reduced male trabecular bone parameters and bone
    strength, whereas the FGFR3-selective TYRA-300 was designed specifically to
    avoid FGFR1/2/4 engagement. Whether the reported benefit and the reported
    liability are separable is unresolved, and it matters most for the
    craniosynostosis arm, where the causal receptor is FGFR1 or FGFR2 and a
    "selective FGFR3" agent would be the wrong drug entirely. No conforming
    disorder should curate FGFR TKI therapy as a class effect.
  evidence:
  - reference: PMID:41641077
    reference_title: "Inhibition of FGFR signaling with infigratinib improves linear bone growth in the female Aga2/+ mouse model of osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these data establish FGFR as a therapeutic target for short stature in osteogenesis imperfecta and identify potential negative effects of pan-FGFR inhibition, particularly in the male skeleton."
    explanation: The off-target skeletal liability of pan-FGFR inhibition.
  - reference: PMID:41593746
    reference_title: 'Response to letter to the editor for "Infigratinib low dose therapy is an effective strategy to treat hypochondroplasia".'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In these condition-relevant models, our findings markedly differ from those reported by Ursachi et al. The poor sensitivity of infigratinib to the N540K variant of FGFR3 observed in these other studies is likely due to the specific cell system and receptor construct employed."
    explanation: >-
      Documents the unresolved allele-specific potency dispute for the
      hypochondroplasia p.Asn540Lys allele.
  proposed_experiments:
  - experiment_id: exp_tki_potency_across_fgfr_allelic_series
    name: Uniform potency panel across the FGFR allelic series
    description: >-
      Measure infigratinib and TYRA-300 potency against untagged full-length
      FGFR1/2/3 carrying each of the module's representative alleles
      (transmembrane, extracellular-cysteine, Ig-II/III linker, kinase-domain) in
      one chondrogenic and one suture-mesenchyme cell system, so that
      allele-specific efficacy is measured rather than inferred from one trial.
  - experiment_id: exp_selective_vs_pan_fgfr_skeletal_safety
    name: Selective versus pan-FGFR inhibition skeletal safety comparison
    description: >-
      Compare growth benefit against trabecular bone parameters, cortical
      strength, and sex-specific effects for a pan-FGFR1-3 inhibitor and an
      FGFR3-selective inhibitor in the same mouse model at matched growth effect,
      to test whether the benefit and the bone liability are separable.
- discussion_id: gap_suture_stem_cell_niche_vs_receptor_lesion
  prompt: >-
    Is craniosynostosis in this module driven by the activating FGFR lesion acting
    cell-autonomously in suture mesenchyme, or by loss of the suture stem cell
    niche maintained through crosstalk with adjacent tissues (dura mater,
    Wnt signaling), and could that niche be a therapeutic target independent of
    the receptor?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cranial Suture Osteogenic Acceleration
  - pathophysiology#Premature Suture Fusion and Craniosynostosis
  rationale: >-
    The module currently models the suture arm as a straight line from receptor to
    accelerated osteogenic differentiation to fusion. Three 2026 lines of work
    complicate that. A spatiotemporal single-cell atlas resolved suture stem cell
    dynamics in craniosynostosis, making the suture stem cell population, rather
    than the osteoblast, the candidate unit of pathology. FGFR2 signaling in the
    dura mater was shown to act on suture mesenchyme through a temporally
    regulated retinoic-acid axis to *prevent* fusion — an instructive signal from
    an adjacent tissue, which the module's cell-autonomous framing does not
    represent. And Fgfr3-Wnt crosstalk was implicated in maintaining suture
    integrity, connecting the module's FGFR3 suture members (Muenke,
    Crouzon-with-acanthosis-nigricans) to a second pathway. If the operative lesion
    is niche failure rather than receptor output alone, the craniosynostosis arm
    has a therapeutic target that receptor inhibition would miss — which matters
    because surgery is currently the only treatment any craniosynostosis member of
    this group carries. All three findings are mouse work; no human suture tissue
    data confirm them.
  evidence:
  - reference: PMID:42071254
    reference_title: "Spatiotemporal single-cell atlas of suture stem cell dynamics in craniosynostosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The atlas reveals stage-specific remodeling of SuSC niches and a shift of SuSC spatial associations toward osteogenic mesenchyme in craniosynostosis."
    explanation: >-
      Relocates the lesion from the osteoblast to the suture stem cell niche in
      an FGFR2 Crouzon mouse, which the module's current node chain does not
      represent.
  - reference: PMID:42071254
    reference_title: "Spatiotemporal single-cell atlas of suture stem cell dynamics in craniosynostosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spatial communication analyses implicated signals from suture meningeal fibroblasts and immune cells that converge on SuSC fate."
    explanation: >-
      Non-cell-autonomous signals converging on suture stem cell fate — the
      adjacent-tissue arm the module's cell-autonomous framing omits.
  - reference: PMID:42604930
    reference_title: "Temporally regulated FGFR2-retinoic acid signaling mediates dura mater-suture mesenchyme interactions to prevent craniosynostosis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Significantly, genetic restoration of retinoic acid signaling rescues craniosynostosis in Fgfr2IIIc mutant mice, confirming retinoic acid signaling as a key downstream effector of FGFR2 signaling."
    explanation: >-
      A rescue experiment identifying a downstream effector distinct from the
      module's MAPK/STAT axis, and therefore a candidate therapeutic target that
      receptor inhibition would not be needed to reach.
  - reference: PMID:42604930
    reference_title: "Temporally regulated FGFR2-retinoic acid signaling mediates dura mater-suture mesenchyme interactions to prevent craniosynostosis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, restoration of suture patency alone rescues neurocognitive dysfunctions in Fgfr2IIIc mutant mice despite Fgfr2 mutation in the brain, demonstrating that the neurocognitive impairments primarily arise from cranial structural constraints and elevated intracranial pressure rather than intrinsic neural defects."
    explanation: >-
      Bears directly on how conforming disorders should model neurocognitive
      features: as a consequence of the skull, not of receptor signaling in the
      brain.
  - reference: PMID:42527406
    reference_title: "Fgfr3-Wnt signaling crosstalk is involved in maintaining cranial suture integrity."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, these findings position Fgfr3 as a central regulator of cranial suture formation and homeostasis, acting through intricate cross-talk between the FGF, canonical Wnt, and possibly BMP signaling pathways."
    explanation: >-
      Marked PARTIAL because this is an fgfr3 loss-of-function zebrafish model,
      the mechanistic inverse of the module's gain-of-function trigger: it
      establishes that FGFR3 and Wnt interact in suture homeostasis, but does not
      itself show that the GOF alleles act through Wnt.
  - reference: PMID:42527406
    reference_title: "Fgfr3-Wnt signaling crosstalk is involved in maintaining cranial suture integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, despite these findings, Fgfr3 mouse models with GoF or LoF mutations have failed to fully recapitulate these cranial phenotypes, posing a significant challenge in deciphering the precise role of FGFR3 in cranial suture formation and maintenance."
    explanation: >-
      States the model-fidelity problem underlying this gap: the FGFR3 suture
      phenotype has no fully recapitulating mouse model in either direction.
  proposed_experiments:
  - experiment_id: exp_human_suture_single_cell_fgfr_syndromes
    name: Single-cell profiling of human syndromic suture tissue
    description: >-
      Profile suture tissue removed at cranial vault surgery from FGFR1/2/3
      craniosynostosis patients and from non-syndromic controls, testing whether
      the suture stem cell depletion and dura-derived signaling axes described in
      mice are present in the human lesion.
- discussion_id: gap_germline_vs_somatic_fgfr_oncogenicity
  prompt: >-
    Why does a constitutional activating mutation in FGFR1, FGFR2 or FGFR3 — genes
    that are established oncogenes, and whose identical substitutions drive tumours
    when they arise somatically — produce a skeletal dysplasia rather than a strong
    cancer predisposition syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Constitutive FGFR Activation
  - pathophysiology#Sustained MAPK/STAT Signaling
  rationale: >-
    Every member of this module carries, in every cell, an activating mutation in a
    receptor tyrosine kinase that is a bona fide cancer driver: the Apert FGFR2
    p.Ser252Trp substitution is enriched somatically in endometrial carcinoma,
    FGFR3 activation drives urothelial carcinoma, and FGFR1 fusions drive
    glioneuronal tumours. On a simple oncogene-dosage model these disorders should
    be cancer predisposition syndromes. A 53-year follow-up of 24 Apert patients
    found they are not — half were alive and cancer-free at study end, and the
    authors conclude there is no high risk of particular tumour types. The proposed
    explanation is that a mutant cell surrounded by identically mutant neighbours
    has a different signalling relationship than a somatic mutant clone in
    wild-type tissue, i.e. that oncogenicity here is a property of the clone's
    *context* rather than of the allele. That is a hypothesis, not a demonstrated
    mechanism, and it has not been tested in the FGFR1 or FGFR3 members at all.
    Resolving it matters practically as well as conceptually: it determines whether
    these patients need tumour surveillance, and it bears on whether chronic FGFR
    kinase inhibition — now a phase 3 therapy in achondroplasia — is modifying a
    cancer risk in either direction.
  evidence:
  - reference: PMID:42082645
    reference_title: "Long-term survival without high cancer risk in a cohort of 24 patients with Apert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Apert syndrome, caused by heterozygous germline mutations in the fibroblast growth factor receptor type 2 gene (FGFR2), the question of prognosis is particularly pertinent because FGFR2 is a known cancer driver gene (oncogene) and the identical mutations, when arising somatically, are enriched in specific tumours, notably endometrial carcinoma."
    explanation: States the paradox precisely — same allele, oncogenic somatically, not so germline.
  - reference: PMID:42082645
    reference_title: "Long-term survival without high cancer risk in a cohort of 24 patients with Apert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that Apert syndrome is not, in many affected individuals, associated either with substantial shortening of lifespan, or with a high risk of developing particular types of cancer."
    explanation: The empirical observation the gap has to explain.
  - reference: PMID:42082645
    reference_title: "Long-term survival without high cancer risk in a cohort of 24 patients with Apert syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Explanation of the lack of strong cancer predisposition, despite the oncogenic nature of the FGFR2 mutations, may lie in the different signalling relationship that a mutant cell has with its neighbours when the mutation is present constitutionally, compared to occurrence as a somatic change."
    explanation: >-
      The authors' own proposed mechanism, offered as a hypothesis — marked PARTIAL
      because the study measures outcome, not signalling.
  proposed_experiments:
  - experiment_id: exp_mosaic_vs_constitutional_fgfr_clone_behaviour
    name: Clone behaviour of FGFR-mutant cells in mutant versus wild-type surroundings
    description: >-
      Compare proliferation, clonal expansion and transformation of cells carrying
      the same activating FGFR allele when surrounded by identically mutant cells
      versus when introduced as a minority clone into wild-type tissue, directly
      testing the neighbour-context explanation rather than inferring it from
      epidemiology.
  - experiment_id: exp_cancer_incidence_fgfr1_fgfr3_skeletal_cohorts
    name: Cancer incidence in FGFR1- and FGFR3-related skeletal dysplasia cohorts
    description: >-
      Registry-linked cancer incidence in achondroplasia, hypochondroplasia,
      Muenke and osteoglophonic dysplasia cohorts, since the reassuring evidence is
      currently confined to FGFR2/Apert and the paralogs drive different tumour
      types.
pathophysiology:
- name: Constitutive FGFR Activation
  description: >-
    A recurrent activating germline mutation in a fibroblast growth factor
    receptor (FGFR3 most commonly, FGFR2 or FGFR1 less often) produces a
    constitutively active or ligand-hypersensitive receptor. Transmembrane and
    extracellular-cysteine substitutions enable ligand-independent dimerization
    and constitutive kinase activity, whereas Ig-II/III linker substitutions
    increase FGF-ligand affinity and alter specificity.
  role: trigger
  genes:
  - preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
    modifier: INCREASED
  - preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
    modifier: INCREASED
  - preferred_term: FGFR1
    term:
      id: hgnc:3688
      label: FGFR1
    modifier: INCREASED
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:8845844
    reference_title: "Missense FGFR3 mutations create cysteine residues in thanatophoric dwarfism type I (TD1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two novel missense mutations (Y373C and G370C) were detected in 8/26 and 1/26 TD1 cases
      respectively. Both mutations created cysteine residues in the juxta
      extramembrane domain of the receptor.
    explanation: >-
      Demonstrates the cysteine-creating FGFR3 alleles that enable aberrant
      disulfide-mediated dimerization and ligand-independent constitutive
      activation in thanatophoric dysplasia.
  - reference: PMID:11390973
    reference_title: "Structural basis for fibroblast growth factor receptor 2 activation in Apert syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These structures demonstrate that both mutations introduce additional
      interactions between FGFR2 and FGF2, thereby augmenting FGFR2-FGF2 affinity.
    explanation: >-
      Provides the structural basis for the alternative, ligand-affinity mode of
      FGFR activation seen in the Apert linker-region alleles.
  - reference: PMID:10696568
    reference_title: "The molecular and genetic basis of fibroblast growth factor receptor 3 disorders: the achondroplasia family of skeletal dysplasias, Muenke craniosynostosis, and Crouzon syndrome with acanthosis nigricans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent evidence suggests that the phenotypic differences may be due to
      specific alleles with varying degrees of ligand-independent activation,
      allowing the receptor to be constitutively active.
    explanation: >-
      Supports the shared theme of activating FGFR alleles conferring constitutive
      receptor activity across the dysplasia family.
  downstream:
  - target: Sustained MAPK/STAT Signaling
    description: >-
      Constitutively active FGFR drives sustained downstream MAPK/ERK and STAT
      signaling.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fgfr_mapk_stat_model
    - fgfr_activation_mechanism_heterogeneity

- name: Sustained MAPK/STAT Signaling
  description: >-
    Constitutive FGFR activity sustains MAPK/ERK cascade and STAT (notably STAT1)
    signaling in skeletogenic cells. ERK activation is accelerated and can become
    ligand-independent, and STAT signaling is constitutively engaged. This shared
    effector axis couples the activating receptor to compartment-specific
    transcriptional programs in chondrocytes and suture mesenchyme.
  role: central_effector
  biological_processes:
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  - preferred_term: cell surface receptor signaling pathway via STAT
    term:
      id: GO:0097696
      label: cell surface receptor signaling pathway via STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:9582336
    reference_title: "Fibroblast growth factor receptor 3 mutations promote apoptosis but do not alter chondrocyte proliferation in thanatophoric dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Early ERKs activation
      following FGF 9 supplementation was observed in TD chondrocytes (2 min) as
      compared with controls (5 min) but no signal was detected in the absence of
      ligand.
    explanation: >-
      Shows accelerated ERK/MAPK activation in chondrocytes carrying activating
      FGFR3 mutations, supporting sustained MAPK signaling downstream of the
      receptor.
  - reference: PMID:9582336
    reference_title: "Fibroblast growth factor receptor 3 mutations promote apoptosis but do not alter chondrocyte proliferation in thanatophoric dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ligand-independent activation of the STAT signaling pathway
      was demonstrated in cultured TD cells
    explanation: >-
      Directly supports constitutive STAT signaling as part of the conserved
      effector axis downstream of activating FGFR3 mutations.
  - reference: PMID:14751560
    reference_title: "Overexpression of FGFR3, Stat1, Stat5 and p21Cip1 correlates with phenotypic severity and defective chondrocyte differentiation in FGFR3-related chondrodysplasias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results indicate that FGFR3 mutations in the prenatal period upregulate FGFR3 and Stat-p21Cip1 expression, thus inducing premature exit of proliferative cells from the cell cycle and their differentiation into prehypertrophic chondrocytes.
    explanation: >-
      Links FGFR3-driven STAT/p21 signaling to premature cell-cycle exit and
      dysregulated chondrocyte differentiation in human fetal growth plate.
  downstream:
  - target: Growth-Plate Chondrocyte Dysregulation
    description: >-
      In growth-plate chondrocytes, sustained MAPK/STAT signaling dysregulates
      proliferation and differentiation.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fgfr_mapk_stat_model
  - target: Cranial Suture Osteogenic Acceleration
    description: >-
      In cranial suture mesenchyme, sustained MAPK/ERK signaling accelerates
      osteoblast differentiation.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_fgfr_mapk_stat_model

- name: Growth-Plate Chondrocyte Dysregulation
  description: >-
    In the growth plate, sustained FGFR-MAPK/STAT signaling drives premature exit
    of proliferative chondrocytes from the cell cycle and dysregulated
    differentiation. MAPK signaling inhibits hypertrophic differentiation and
    bone growth, while STAT1 suppresses chondrocyte proliferation, together
    distorting the orderly proliferation-to-hypertrophy program of the growth
    plate.

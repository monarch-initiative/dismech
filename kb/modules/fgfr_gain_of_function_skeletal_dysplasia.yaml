      phenotypic severity, the hallmark of impaired endochondral ossification.
  - reference: PMID:18923003
    reference_title: "FGFR3 promotes synchondrosis closure and fusion of ossification centers through the MAPK pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      premature synchondrosis closure in the spine and cranial base in human cases of homozygous achondroplasia and thanatophoric dysplasia
    explanation: >-
      Human evidence for premature synchondrosis closure in the spine and cranial
      base across FGFR3 dysplasias, a consequence of impaired endochondral
      ossification.
  - reference: PMID:18923003
    reference_title: "FGFR3 promotes synchondrosis closure and fusion of ossification centers through the MAPK pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Chondrocyte-specific activation of Fgfr3 in mice induced premature synchondrosis closure and enhanced osteoblast differentiation around synchondroses.
    explanation: >-

  description: >-
    In cranial suture mesenchyme, activated FGFR signaling acting through the
    ERK1/2 cascade accelerates osteoblast differentiation and matrix
    mineralization. Excess osteogenic activity within the suture promotes early
    bony bridging across the suture. This is the FGFR-MAPK (pro-osteogenic-drive)
    instance of the pathway-agnostic cranial-suture osteogenic-acceleration
    endpoint shared with the BMP-disinhibition (SMAD6) and boundary/niche-loss
    (TWIST1) craniosynostosis routes.

  evidence:
  - reference: PMID:31408430
    reference_title: "Emerging mechanisms of drug-induced phospholipidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Drug-induced phospholipidosis is a lysosomal storage disorder
      characterized by excessive accumulation of phospholipids.
    explanation: >-
      Defines the lesion at this node as a lysosomal storage disorder of
      excessive phospholipid accumulation.
  - reference: PMID:16774494
    reference_title: "Drug-induced phospholipidosis: issues and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The principal characteristics of this condition include the reversible
      accumulation of polar phospholipids in association with the development of
      unicentric or multicentric lamellated bodies within cells.
    explanation: >-
      Names the accumulation of polar phospholipids as the principal
      characteristic of the condition, with the lamellated bodies it leads to.
  downstream:
  - target: Lamellar (Zebra) Body Formation
- name: Lamellar (Zebra) Body Formation
  description: >-
    The stored phospholipid condenses into concentrically layered multilamellar
    inclusion bodies - the lamellar or "zebra" bodies seen by electron
    microscopy that are the diagnostic hallmark of phospholipidosis and are
    histologically indistinguishable from the inclusions of Fabry disease. These
    inclusions are the terminal lesion of the module. Whether their presence is
    injurious to the hepatocyte or an adaptive, reversible sequestration of the
    drug-lipid complex is unresolved (see the discussion), so the chain stops at
    the lesion and does not assert hepatocyte death.
  role: consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: lipid storage
    term:

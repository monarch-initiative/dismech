    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:31408430
    reference_title: "Emerging mechanisms of drug-induced phospholipidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      triggering a progressive lipid storage and the formation of inactive
      lamellar bodies.
    explanation: >-
      States that the progressive lipid storage culminates in the formation of
      lamellar bodies, the terminal lesion of this node.
  - reference: PMID:38804381
    reference_title: "Double Hit of Hydroxichloroquine and Amiodarone Induced Renal Phospholipidosis in a Patient with Monoclonal Gammopathy and Sclerodermiform Syndrome: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      excessive intracellular accumulation of phospholipids and the appearance
      of zebra bodies or lamellar bodies
    explanation: >-
      Names the zebra / lamellar bodies that form from the accumulated
      phospholipid as the defining ultrastructural finding.
discussions:
- discussion_id: gap_phospholipidosis_adaptive_vs_toxic
  prompt: >-
    Is the lamellar-body phospholipidosis state an injurious lesion, or an
    adaptive and reversible sequestration response that is a biomarker of drug
    exposure rather than of toxicity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lamellar (Zebra) Body Formation
  rationale: >-
    The module terminates at the lamellar-body lesion and deliberately asserts
    no downstream hepatocyte-death node, because the toxicological significance
    of phospholipidosis is unsettled. Mechanism reviews report that the
    functional consequences of the condition are not well understood and that
    the prevailing view treats it as an adaptive response rather than a
    toxicological manifestation, while regulators continue to screen for it. A
    conforming entry should therefore record phospholipidosis as an observation
    on this node, and justify any claim that it causes organ injury in that
    disorder with disorder-specific evidence rather than inheriting it from the
    module.
  evidence:
  - reference: PMID:16774494
    reference_title: "Drug-induced phospholipidosis: issues and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The functional consequences of the presence of this condition on cellular
      or tissue function are not well understood.
    explanation: >-
      States directly that the functional consequences of phospholipidosis are
      not well understood, which is the open question of this gap.
  - reference: PMID:16774494
    reference_title: "Drug-induced phospholipidosis: issues and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The general consensus is that the condition is an adaptive response rather
      than a toxicological manifestation; however, additional studies to examine
      this question are needed.
    explanation: >-
      Records the prevailing adaptive-response reading, the reason the chain
      stops at the lesion rather than asserting cell death.
experimental_models:
- name: High-content screening of carboxylic-acid lipid accumulation in human hepatocytes
  description: >-
    High-content screening assay in human liver cells (HepG2) exposed to a panel
    of 24 structurally related carboxylic acids, measuring their ability to cause
    accumulation of fatty acids and phospholipids. The screen resolved two
    distinct lipid-accumulation patterns - a fatty-acid (steatosis) pattern and a
    phospholipid (phospholipidosis) pattern - with different structural drivers,
    the result that establishes phospholipidosis as separable from steatosis
    rather than one lumped lipid-accumulation endpoint. It is a non-animal New
    Approach Methodology: the phospholipid-accumulation arm reads out the lesion
    this module's Intralysosomal Phospholipid Accumulation node names. The
    fatty-acid-accumulation arm of the same screen maps instead to the
    hepatic_steatosis_lipotoxicity module and is not linked here.
  experimental_model_type: CELL_LINE
  namo_type: namo:CellLineModel
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: HepG2 hepatocyte-like cell
    term:
      id: CL:0000182
      label: hepatocyte
  conditions:
  - carboxylic-acid-induced hepatic lipid accumulation
  - discrimination of fatty-acid (steatosis) versus phospholipid (phospholipidosis) accumulation patterns
  cell_source: HepG2 human hepatoblastoma cell line
  culture_system: High-content screening (HCS) assay of fluorescently detected lipid accumulation
  publication: PMID:38428665
  modeled_mechanisms:
  - target: Intralysosomal Phospholipid Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The screen induces and quantifies the phospholipid-accumulation pattern
      that defines phospholipidosis, giving the accumulation node a measured
      in-vitro readout. It recapitulates the accumulation phenotype but not the
      upstream lysosomal-catabolism mechanism, and the carboxylic-acid trigger is
      not the canonical cationic amphiphilic route.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The canonical trigger of the module is lysosomal entrapment of a
        cationic amphiphilic drug. The screen's compounds are anionic carboxylic
        acids that interfere with fatty-acid metabolism, so the accumulation is
        reached without the protonatable amine head group and the lysosomal
        catabolism block the trigger and central-effector nodes describe; the
        screen reports the accumulation phenotype, not that lysosomal mechanism.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        A HepG2 monoculture lacks the non-parenchymal cells, bile-canalicular
        architecture, and chronic exposure window of the intact liver, so it
        reports a short-term cellular accumulation readout rather than the
        tissue-level lesion with lamellar-body ultrastructure.
    limitations: >-
      HepG2 is a transformed hepatoblastoma line with limited drug-metabolising
      competence; the assay reads a fluorescent lipid-accumulation signal, not
      the lamellar-body ultrastructure or lysosomal localisation, and the
      carboxylic-acid route differs from the canonical cationic amphiphilic
      mechanism of the module.
    readouts:
    - name: Hepatocyte phospholipid accumulation (phospholipidosis pattern)
      target: Intralysosomal Phospholipid Accumulation
      direction: INCREASED
      interpretation: >-
        The phospholipid-accumulation arm of the two-pattern HCS result, the
        in-vitro correlate of the accumulation node.
      evidence:
      - reference: PMID:38428665
        reference_title: "Uncovering the toxicity mechanisms of a series of carboxylic acids in liver cells through computational and experimental approaches."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          This study investigates the toxic behaviour of 24 structurally related
          carboxylic acids in hepatocytes, specifically their ability to cause
          accumulation of fatty acids and phospholipids.
        explanation: >-
          Reports that the screen measured the hepatocyte phospholipid
          accumulation that is this readout.
  evidence:
  - reference: PMID:38428665
    reference_title: "Uncovering the toxicity mechanisms of a series of carboxylic acids in liver cells through computational and experimental approaches."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using high-content screening (HCS) assays, we identified two distinct
      lipid accumulation patterns.
    explanation: >-
      Establishes that the high-content screen resolved two separable lipid
      accumulation patterns, the finding that makes phospholipidosis distinct
      from steatosis and the reason this model informs the accumulation node.
  notes: >-
    The two distinct patterns - fatty-acid (steatosis) and phospholipid
    (phospholipidosis) - are the paper's central result and the reason the
    screen is linked to this module rather than only to
    hepatic_steatosis_lipotoxicity. Only the phospholipid arm is linked here;
    the fatty-acid arm belongs to the steatosis module.
computational_models:
- name: SAR/QSAR models of carboxylic-acid hepatic lipid accumulation
  description: >-
    Structure-activity relationship (SAR) and quantitative structure-activity
    relationship (QSAR) models built on the high-content-screening results to
    identify the molecular substructures and descriptors that drive each lipid
    accumulation pattern, with physicochemical properties correlated to
    accumulation and two external datasets used to probe the applicability
    domain. The models predict the accumulation phenotype from chemical
    structure - for example implicating the presence of nitrogen and the
    arrangement of substitutions along the carbon chain - rather than observing
    the lysosomal mechanism, so they give a structure-based predictor of the
    phospholipidosis readout.
  model_type: MACHINE_LEARNING
  publication: PMID:38428665
  modeled_mechanisms:
  - target: Intralysosomal Phospholipid Accumulation
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Gives the accumulation node a structure-based predicted readout: a QSAR
      descriptor value standing in for the measured hepatocyte phospholipid
      load, trained on the HCS data.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's variable is a molecular descriptor or substructure of the
        compound; the node's quantity is the measured phospholipid load in the
        hepatocyte. The descriptor stands in for the lipid measurement rather
        than being it.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model operates on molecular-scale structural descriptors and infers
        the cellular-scale accumulation phenotype of the node, an upward
        extrapolation across one biological scale.
    - divergence_type: CALIBRATION_PROVENANCE
      materiality: QUALIFYING
      description: >-
        The models are trained and calibrated on the 24-compound carboxylic-acid
        HCS set; applicability to other chemical classes is bounded by the
        descriptor-distribution analysis in two external datasets and is not
        established outside that domain.
    limitations: >-
      The model operates at the molecular (structural-descriptor) scale and
      infers the cellular accumulation phenotype, so a link to the cellular
      accumulation node is an upward extrapolation; it predicts rather than
      measures the lipid load, and is calibrated on a narrow carboxylic-acid
      training set whose applicability domain is only partially characterised.
    evidence:
    - reference: PMID:38428665
      reference_title: "Uncovering the toxicity mechanisms of a series of carboxylic acids in liver cells through computational and experimental approaches."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        we developed structure-activity relationship (SAR) and quantitative
        structure-activity relationship (QSAR) models to determine relevant
        molecular substructures and descriptors contributing to these adverse
        effects.
      explanation: >-
        Establishes the SAR/QSAR models as structure-based predictors of the
        lipid-accumulation effect, the basis for linking them to the
        accumulation node.
  notes: >-
    Linked as the computational, structure-based counterpart of the HCS screen
    on the same node: the QSAR predicts the accumulation phenotype the HCS
    measures, which is why it carries a PROXY_QUANTITY divergence.

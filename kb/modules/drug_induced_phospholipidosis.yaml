name: Drug-Induced Phospholipidosis Module
description: >-
  A conserved drug-toxicity module representing the intracellular accumulation of
  phospholipids that defines phospholipidosis, a lipid-storage lesion distinct
  from triglyceride steatosis. The canonical trigger is a cationic amphiphilic
  drug (CAD) that is protonated and trapped in the acidic lysosome, where it
  compensates the negative surface charge of intralysosomal vesicles, releases
  and inactivates the phospholipases that normally degrade membrane
  phospholipids, and so attenuates lysosomal phospholipid catabolism. Undegraded
  phospholipids accumulate within lysosomes and condense into the multilamellar
  "zebra" or lamellar inclusion bodies that are the diagnostic hallmark. The
  rate-limiting, disorder-agnostic step - and the key conformance target - is
  impaired lysosomal phospholipid catabolism; a conforming entry substitutes its
  culprit agent and the organ affected (hepatocyte here, but also pneumocyte,
  renal tubular epithelium, cardiomyocyte, and neuron) while preserving the
  catabolism-to-lamellar-body chain. This module is the lipid-accumulation
  sibling of hepatic_steatosis_lipotoxicity: both end in intracellular lipid
  overload, but steatosis is cytoplasmic triglyceride in lipid droplets driven
  by an imbalance of fatty-acid synthesis and disposal, whereas phospholipidosis
  is intralysosomal phospholipid driven by blocked catabolism. The two are
  separable high-content-screening patterns with different structural drivers,
  and collapsing them loses that distinction. It is also the acquired,
  drug-induced counterpart of lysosomal_substrate_accumulation: both share the
  deficiency-to-intralysosomal-storage core, but there the phospholipase loss is
  a functional one imposed by a trapped drug rather than the inherited hydrolase
  deficiency of a lysosomal storage disease, so the module is created separately
  rather than as a conformer of it. Whether the lamellar-body state is
  itself injurious or an adaptive sequestration response is unresolved (see the
  discussion), so the chain terminates at the lesion rather than asserting a
  downstream cell-death consequence.
category: Module
module_categories:
- TOXICOLOGY
- PHARMACOLOGY
creation_date: "2026-11-13T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  "Phospholipidosis" Disease entry; a drug or disorder that manifests
  phospholipidosis references the relevant node via conforms_to (e.g.
  "drug_induced_phospholipidosis#Impaired Lysosomal Phospholipid Catabolism").
  Candidate conformers are the classic CAD toxicities - amiodarone, chloroquine
  and hydroxychloroquine, azithromycin and other macrolides, ciprofloxacin,
  fluoxetine - none of which has a dismech entry yet; the module is created
  ahead of its conformers, as the carboxylic-acid NAM screen below is the
  motivating evidence rather than a disorder entry.

  Scope and the CAD boundary. The node chain is the canonical cationic
  amphiphilic (lysosomotropic) mechanism, which is the best-understood route and
  the one the mechanism reviews describe. Not every phospholipid-accumulation
  phenotype arrives through lysosomal CAD trapping: anionic carboxylic acids
  interfere with fatty-acid metabolism and can produce a phospholipid as well as
  a fatty-acid accumulation pattern (PMID:38428665), reaching the accumulation
  node without the protonatable amine head group that defines a CAD. That is a
  genuine alternative initiating insult, recorded on the experimental-model link
  as a divergence rather than folded into the trigger node, so the canonical
  chain stays mechanistically honest.

  Organ-specific cell-type substitution: the nodes fix hepatocyte (CL:0000182)
  because the motivating screen is hepatic, but phospholipidosis is a
  multi-organ lesion and a conforming pulmonary, renal, cardiac, or neuronal
  entry substitutes its own epithelial or parenchymal cell type while keeping
  the lysosome (GO:0005764) compartment and the phospholipid-catabolism step.

  Ontology anchor for the terminal lesion: the lamellar / zebra body is a
  pathological intracellular inclusion (process genus OGMS:0000061 pathological
  bodily process, by OGMS:0000081 pathological derivation, producing an
  OGMS:0000078 pathological anatomical structure). MPATH has no class for a
  multilamellar phospholipid inclusion body, so no MPATH species term is bound
  and the node binds the lysosome cellular component and a lipid-storage process
  instead; this OBO gap is noted rather than papered over with an approximate
  term.
pathophysiology:
- name: Hepatocyte Lysosomal Entrapment of a Cationic Amphiphilic Drug
  description: >-
    A cationic amphiphilic drug has a hydrophilic amine head group that becomes
    protonated and positively charged in the acidic endolysosomal compartment,
    so the drug is trapped in the lysosome (lysosomotropism). There it inserts
    into and interferes with the negatively charged intralysosomal vesicles that
    serve as the platforms for lysosomal lipid degradation. This drug-trapping
    step is the canonical initiating insult of phospholipidosis.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
    modifier: INCREASED
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:31408430
    reference_title: "Emerging mechanisms of drug-induced phospholipidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As cationic amphiphiles, they are trapped in lysosomes, where they
      interfere with negatively charged intralysosomal vesicles, the major
      platforms of cellular sphingolipid degradation.
    explanation: >-
      States the lysosomal entrapment of the cationic amphiphilic drug and its
      interference with intralysosomal vesicles that is the trigger of this node.
  - reference: PMID:31408430
    reference_title: "Emerging mechanisms of drug-induced phospholipidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These drugs have a hydrophilic amine head group that can be protonated in
      the endolysosomal compartment.
    explanation: >-
      Identifies the protonatable amine head group as the structural feature
      that makes a cationic amphiphilic drug lysosomotropic.
  downstream:
  - target: Impaired Lysosomal Phospholipid Catabolism
- name: Impaired Lysosomal Phospholipid Catabolism
  description: >-
    The trapped cationic amphiphile compensates the negative surface charge of
    the intralysosomal vesicles to which the degradative phospholipases are
    electrostatically bound, so the enzymes are released from the vesicle
    surface and proteolytically degraded. The result is attenuation of the main
    lysosomal mechanism of phospholipid degradation. This loss of catabolic
    capacity - not an increase in phospholipid synthesis - is the rate-limiting,
    disorder-agnostic step that every phospholipidosis conformer funnels
    through, and is the key conformance target of the module.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: phospholipid catabolic process
    term:
      id: GO:0009395
      label: phospholipid catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:31408430
    reference_title: "Emerging mechanisms of drug-induced phospholipidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Model experiments suggest that progressively accumulating cationic
      amphiphilic drugs inserting into the vesicle membrane with their
      hydrophobic molecular moieties disturb and attenuate the main mechanism of
      lipid degradation as discussed here.
    explanation: >-
      States that the drug attenuates the main lysosomal lipid-degradation
      mechanism, the impaired-catabolism step this node names.
  - reference: PMID:31408430
    reference_title: "Emerging mechanisms of drug-induced phospholipidosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      By compensating the negative surface charge, cationic enzymes are released
      from the surface of vesicles and proteolytically degraded, triggering a
      progressive lipid storage and the formation of inactive lamellar bodies.
    explanation: >-
      Gives the mechanism of lost catabolic capacity: the phospholipases are
      released and degraded, so phospholipids are no longer broken down.
  downstream:
  - target: Intralysosomal Phospholipid Accumulation
- name: Intralysosomal Phospholipid Accumulation
  description: >-
    With lysosomal phospholipid catabolism blocked, polar phospholipids
    delivered to the lysosome by autophagy and endocytosis are no longer
    degraded and accumulate within the compartment. Drug-induced phospholipidosis
    is, at this step, a lysosomal storage disorder of phospholipid: an excess of
    stored phospholipid that is the measurable readout of the lesion and the
    phenotype a high-content screen detects. The accumulation is reached by the
    canonical CAD route here, but the same phospholipid-overload phenotype can be
    produced by non-CAD agents that interfere with fatty-acid metabolism.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: lipid storage
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  - preferred_term: phospholipid metabolic process
    term:

- name: Distal Myofiber Degeneration
  description: >-
    Skeletal muscle consequence arm, the one GNE myopathy runs. Hyposialylated
    myofibers degenerate progressively in adulthood with a characteristically
    distal, quadriceps-sparing distribution, producing muscle weakness and
    atrophy. Muscle free sialic acid is severely depleted in affected people
    while total muscle sialic acid falls much less, and normal quadriceps itself
    has a lower sialic acid requirement than other muscles - a candidate
    explanation for the sparing. Mouse work indicates that myofiber loss of the
    enzyme is not by itself sufficient to produce the pathology, so a
    non-myofiber contribution is likely.

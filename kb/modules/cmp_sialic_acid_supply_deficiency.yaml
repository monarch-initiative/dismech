  evidence:
  - reference: PMID:28267778
    reference_title: "Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy and in a mouse model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results show that serum and muscle free SA is severely reduced in
      GNEM, which is consistent with the biochemical defect in SA synthesis
      associated with GNE mutations.
    explanation: >-
      Measures free sialic acid directly in patient serum and muscle biopsies
      and finds it severely reduced, showing that loss of GNE function lowers
      the output of the cytosolic synthesis arm. HUMAN_CLINICAL because the
      measurements were made on a patient cohort; the same paper also reports a
      corroborating mouse model.
  - reference: PMID:31121216
    reference_title: "Activity of N-acylneuraminate-9-phosphatase (NANP) is not essential for de novo sialic acid biosynthesis."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      In agreement with normal cell surface sialylation, CMP-sialic acid levels
      in NANP KO were comparable to WT cells, even though sialic acid
      9-phosphate, the substrate of NANP accumulated.
    explanation: >-
      Recorded as REFUTE against treating the NANP phosphatase as a lesion site
      in this trigger: knocking NANP out leaves the donor pool and surface
      sialylation normal while its substrate accumulates, which is why the
      module carries that step in prose only. IN_VITRO because the knockouts
      were made in two cell lines.
  - reference: PMID:11929971
    reference_title: "Sialylation is essential for early development in mice."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      inactivation of the UDP-GlcNAc 2-epimerase by gene targeting causes early
      embryonic lethality in mice
    explanation: >-
      Complete loss of the committed step is embryonic lethal, which bounds this
      trigger to hypomorphic alleles in human disease and is why residual flux,
      rather than which step failed, sets severity. Directness is INDIRECT
      because the bound on human alleles is inferred from a mouse null.
      MODEL_ORGANISM because this is a mouse knockout.
  - reference: PMID:27213289
    reference_title: "NANS-mediated synthesis of sialic acid is required for brain and skeletal development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient body fluids showed an elevation in N-acetyl-D-mannosamine levels,
      and patient-derived fibroblasts had reduced NANS activity and were unable
      to incorporate sialic acid precursors into sialylated glycoproteins.
    explanation: >-
      Shows that biallelic NANS variants block the synthase step: the substrate
      upstream of the block (ManNAc) accumulates in body fluids and patient
      cells cannot route precursor into sialylated glycoproteins. The
      fibroblast measurements are patient-derived, so the source is recorded
      as human clinical material.

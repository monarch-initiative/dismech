      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        patient-derived fibroblasts had reduced NANS activity and were unable
        to incorporate sialic acid precursors into sialylated glycoproteins
      explanation: >-
        Failure to incorporate precursor into sialylated glycoproteins shows
        that a cytosolic synthesis block starves the downstream activation and
        transfer steps of donor, which is the edge to the central node. The
        CMP-sialic acid pool itself was not measured, so the edge rests on the
        sialylation readout.
- name: Nuclear Sialic Acid Activation Block
  description: >-
    Trigger for CMAS deficiency. CMP-sialic acid synthetase (CMAS) is a nuclear
    enzyme that condenses free sialic acid with CTP to form CMP-sialic acid, the
    only form of sialic acid that the Golgi sialyltransferases can use. Loss or
    mislocalization of CMAS activity leaves the free sialic acid pool intact but
    fails to activate it, so the donor is never made. A lesion here lies
    downstream of where oral ManNAc or sialic acid enters the pathway, which is
    why supplementation that helps the cytosolic arm cannot rescue this one.
  role: trigger
  biological_scale: MOLECULAR
  cellular_components:

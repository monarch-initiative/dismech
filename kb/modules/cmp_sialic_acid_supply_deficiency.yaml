discussions:
- discussion_id: controversy_platelet_production_versus_clearance
  prompt: >-
    Does donor shortage lower the platelet count by shortening platelet
    survival alone, or does it also impair platelet production in the
    megakaryocyte?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Accelerated Clearance of Hyposialylated Platelets
  - pathophysiology#Glycoprotein Hyposialylation
  rationale: >-
    Two lines of evidence disagree, and the module currently models only the
    clearance limb. A conditional mouse with the transporter deleted in the
    megakaryocyte-platelet lineage showed both arms: fewer bone-marrow
    megakaryocytes with impaired maturation, and increased hepatic removal of
    desialylated platelets. A recent human series reached the opposite
    conclusion on the production side: despite a profound sialylation defect
    demonstrated by lectin flow cytometry, cultured patient megakaryocytes
    differentiated, matured and shed proplatelets normally, and produced normal
    numbers of normal-sized platelets in a three-dimensional marrow model. The
    discrepancy is not obviously an artifact of either system. It could reflect
    species difference, the difference between complete loss of the transporter
    and hypomorphic GNE variants with residual flux, or the difference between
    marrow in vivo and megakaryocytes cultured in sialic-acid-containing medium
    that can be salvaged. The resolution matters therapeutically: the human
    series reports durable responses to a thrombopoietin mimetic, which is a
    production-side intervention, in a mechanism modelled here as pure
    accelerated clearance.
  evidence:
  - reference: PMID:32303557
    reference_title: "Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The number of bone marrow megakaryocytes in Plt Slc35a1-/- mice was
      reduced, and megakaryocyte maturation was also impaired.
    explanation: >-
      The mouse side of the disagreement: lineage-restricted loss of the donor
      transporter reduced megakaryocyte number and impaired maturation, a
      production defect in addition to clearance. MODEL_ORGANISM because this is
      a mouse knockout result.
  - reference: PMID:42600696
    reference_title: "Characterization of a series of patients with GNE-related thrombocytopenia: insights into pathogenesis, diagnosis, and treatment."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The profound megakaryocyte sialylation defect induced by GNE variants
      does not affect platelet biogenesis.
    explanation: >-
      The human side of the disagreement, cutting against a production defect:
      patient megakaryocytes with a demonstrated sialylation defect made
      platelets normally. Recorded as REFUTE because it contradicts the
      production limb that the mouse study supports. HUMAN_CLINICAL because the
      cells came from affected individuals.
  proposed_experiments:
  - experiment_id: exp_platelet_kinetics_versus_biogenesis
    name: Paired platelet survival and production measurement in GNE-related thrombocytopenia
    description: >-
      Measure platelet lifespan and platelet production rate in the same
      affected individuals, so that the two candidate mechanisms are assessed
      against each other rather than in separate systems. Pair autologous
      labelled-platelet survival with a marrow-side production readout
      (reticulated platelet fraction and thrombopoietin level) before and
      during thrombopoietin-mimetic therapy, and in parallel culture each
      participant's megakaryocytes with and without sialic acid in the medium
      to test whether normal in vitro biogenesis depends on salvage from the
      medium.
    experiment_design: HUMAN_OBSERVATIONAL
    would_support:
    - pathophysiology#Accelerated Clearance of Hyposialylated Platelets
    supporting_outcome:
    - >-
        Platelet lifespan is markedly shortened while production rate is normal or
        raised, and patient megakaryocytes make platelets normally even in
        sialic-acid-free medium, which would confirm clearance as the sole limb.
    refuting_outcome:
    - >-
        Production rate is low for the degree of thrombocytopenia, or in vitro
        biogenesis fails once sialic acid is withdrawn from the medium, which
        would mean the module needs a megakaryocytopoiesis node alongside the
        clearance one.
- discussion_id: gap_critical_muscle_sialoproteins_unidentified
  prompt: >-
    Which muscle sialoproteins must lose their sialic acid caps for a myofiber
    to degenerate, and why is the quadriceps spared?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distal Myofiber Degeneration
  - pathophysiology#Glycoprotein Hyposialylation
  rationale: >-
    The quantitative picture in patient muscle is odd in a way the module
    records but cannot yet explain. Free sialic acid in affected muscle is down
    by 72 to 85 per cent, but total muscle sialic acid is reduced much less and
    inconsistently between muscles, so the fiber as a whole is not grossly
    undersialylated. The authors infer a small subset of critical sialylation
    targets. No such target has been established: alpha-dystroglycan, NCAM and
    several sarcolemmal glycoproteins have all been proposed without a
    consensus. The regional pattern adds a second unexplained observation,
    since the clinically spared quadriceps normally carries less free and total
    sialic acid than the affected gastrocnemius, which inverts the naive
    expectation that the tissue most dependent on sialic acid should fail first.
    Until a critical client is identified, the edge from glycoprotein
    hyposialylation to myofiber degeneration stays marked as having unknown
    intermediates, and no claim is made about which protein carries the
    mechanism.
  evidence:
  - reference: PMID:28267778
    reference_title: "Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy and in a mouse model."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differences in mean total SA levels in muscle from patients compared with
      normal controls were less distinct and more variable between different
      muscles, suggesting a small subset of sialylation targets could be
      responsible for the pathogenesis of GNEM.
    explanation: >-
      States the gap precisely: total muscle sialic acid is only modestly and
      variably reduced, so the authors infer an unidentified small subset of
      critical targets. HUMAN_CLINICAL because the measurements are from
      patient muscle biopsies.
  proposed_experiments:
  - experiment_id: exp_muscle_sialoproteome_quadriceps_versus_gastrocnemius
    name: Comparative muscle sialoproteomics across spared and affected muscles
    description: >-
      Quantify site-specific sialylation stoichiometry, not just total sialic
      acid, in paired quadriceps and gastrocnemius biopsies from affected
      individuals and controls, using enrichment of sialylated glycopeptides
      with isotopic labelling. Rank glycoproteins by the difference in
      occupancy between affected and spared muscle, then test the top-ranked
      candidates functionally by restoring sialylation of individual clients in
      patient-derived myotubes.
    experiment_design: TARGETED_PERTURBATION
    would_support:
    - pathophysiology#Glycoprotein Hyposialylation
    supporting_outcome:
    - >-
        A small set of glycoproteins loses sialic acid occupancy specifically in
        affected muscle while the bulk sialoproteome is near-normal, and
        restoring one of them rescues a myotube phenotype.
    refuting_outcome:
    - >-
        Occupancy falls uniformly across the sialoproteome in both muscles, which
        would mean the distal and quadriceps-sparing distribution is set by
        something other than which clients lose their caps.
- discussion_id: mismatch_kidney_arm_mouse_versus_human
  prompt: >-
    Does the podocyte arm that dominates the mouse models operate in humans, or
    is it a species-specific and developmentally restricted phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Podocyte Hyposialylation Injury
  rationale: >-
    The kidney is the most striking consequence in the animal models and a
    minor feature in people. In the Gne M712T knock-in mouse the muscle
    phenotype is absent at birth and the animals die of glomerular disease with
    proteinuria, hematuria and foot-process effacement; an independent mouse
    carrying a mislocalized CMAS enzyme dies of kidney failure within 72 hours
    with absent slit diaphragms. Yet adult GNE myopathy is a muscle disease
    without clinically significant renal involvement, and proteinuria in
    SLC35A1-CDG is a reported but not dominant feature. The most plausible
    reconciliation is developmental timing. Both mouse phenotypes arise during
    podocyte maturation, when sialylation of nephrin and podocalyxin is needed
    to build the foot processes, whereas human disease from hypomorphic alleles
    manifests after that window has closed. That reading is an inference, not a
    finding: the alternative, that mouse podocytes depend more heavily on de
    novo synthesis than human podocytes do, has not been excluded. The authors
    of the CMAS study say explicitly that whether altered sialylation impairs
    nephrin function in human disease requires further study. The module
    therefore keeps the arm, labelled as demonstrated in model organisms, and
    does not assert it as a human mechanism.
  evidence:
  - reference: PMID:22745475
    reference_title: "Deficits in sialylation impair podocyte maturation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whether altered sialylation impairs nephrin function in human disease
      requires further study.
    explanation: >-
      The authors of the mouse study state the translational question
      themselves, which is exactly the mismatch recorded here. No quote_role
      is recorded because the sentence is the paper's own closing caveat rather
      than a result or a restatement of established work. MODEL_ORGANISM
      because the finding being extrapolated from is the Cmas-nls mouse.
  - reference: PMID:17549255
    reference_title: "Mutation in the key enzyme of sialic acid biosynthesis causes severe glomerular proteinuria and is rescued by N-acetylmannosamine."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At P2, significantly decreased Gne-epimerase activity was observed in
      Gne(M712T/M712T) muscle, but no myopathic features were apparent. Rather,
      homozygous mutant mice had glomerular hematuria, proteinuria, and
      podocytopathy.
    explanation: >-
      Documents the inversion at the heart of the mismatch: the mouse carrying
      the human myopathy allele has the enzymatic defect in muscle but presents
      with kidney disease rather than myopathy. MODEL_ORGANISM because this is
      the knock-in mouse phenotype.
  proposed_experiments:
  - experiment_id: exp_human_podocyte_sialylation_dependence
    name: Donor-shortage sensitivity of human podocyte maturation in vitro
    description: >-
      Differentiate human induced pluripotent stem cells carrying engineered
      GNE, NANS, CMAS or SLC35A1 loss-of-function alleles into podocytes and
      kidney organoids, and measure sialylation occupancy of podocalyxin and
      nephrin, slit-diaphragm formation and foot-process architecture across
      the maturation window, with and without ManNAc or sialic acid in the
      medium. Compare the dependence directly against mouse podocytes
      differentiated in the same conditions.
    experiment_design: TARGETED_PERTURBATION
    would_support:
    - pathophysiology#Podocyte Hyposialylation Injury
    supporting_outcome:
    - >-
        Human podocytes fail to sialylate nephrin and podocalyxin and fail to
        form slit diaphragms during maturation when donor supply is lost, to a
        degree comparable with mouse podocytes, which would make the arm a human
        mechanism gated by developmental window rather than a species artifact.
    refuting_outcome:
    - >-
        Human podocytes mature normally under the same donor shortage that
        disrupts mouse podocytes, which would mark the arm as species-specific
        and restrict it in the module to model-organism scope.
- discussion_id: interpretation_normal_plasma_sialylation_pitfall
  prompt: >-
    How should a normal serum transferrin glycoform profile be interpreted in
    someone suspected of a sialic acid supply defect?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Glycoprotein Hyposialylation
  - pathophysiology#Reduced Golgi CMP-Sialic Acid Availability
  rationale: >-
    The standard first-line screen for a congenital disorder of glycosylation
    is the serum transferrin glycoform profile, and in this module's disorders
    it can be clean while tissue sialylation is seriously impaired. Plasma
    protein sialylation was reported as normal in the NANS cohort in spite of
    enzyme deficiency, and serum transferrin sialylation showed no clear
    alteration in the GNE-related thrombocytopenia series even though lectin
    flow cytometry on the same patients' platelets demonstrated a profound
    defect. SLC35A1-CDG behaves differently and does show a type II transferrin
    pattern, which is why it was recognized as a CDG at all. The practical
    reading is that a supply-chain defect is detected in the tissue that
    depends on de novo synthesis, not in hepatically secreted plasma protein:
    liver sialylation appears to be buffered, plausibly by salvage of sialic
    acid from glycoconjugate turnover and diet. A negative transferrin screen
    therefore does not exclude this mechanism, and the test that does bear on it
    is a tissue or cell-surface sialylation readout, such as platelet lectin
    binding or sarcolemmal staining. This is an interpretation of existing
    results rather than a gap: the measurements agree with each other, what is
    at issue is what a normal screen licenses a clinician to conclude.
  evidence:
  - reference: PMID:27213289
    reference_title: "NANS-mediated synthesis of sialic acid is required for brain and skeletal development."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal sialylation of plasma proteins was observed in spite of NANS
      deficiency.
    explanation: >-
      Direct statement of the pitfall in a synthase-step disorder: the plasma
      readout is normal while the enzyme is deficient. HUMAN_CLINICAL because
      the plasma came from affected individuals.
  - reference: PMID:42600696
    reference_title: "Characterization of a series of patients with GNE-related thrombocytopenia: insights into pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sialylation of serum transferrin showed no clear alterations.
    explanation: >-
      Confirms the same pitfall in the GNE arm, in patients whose platelet
      lectin binding in the same study showed a profound sialylation defect,
      and supports a cell-surface assay as the informative test.
      HUMAN_CLINICAL because both assays were run on patient samples.
- discussion_id: gap_supplementation_below_the_block
  prompt: >-
    Can precursor or end-product supplementation help a lesion at the
    activation (CMAS) or Golgi import (SLC35A1) step, where it enters the
    pathway above the block?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nuclear Sialic Acid Activation Block
  - pathophysiology#Golgi CMP-Sialic Acid Import Block
  rationale: >-
    The module's drug-target pattern is explicitly compartment-dependent and
    the prediction it makes has not been tested. ManNAc and sialic acid both
    enter the cytosolic arm, so they can raise the free sialic acid pool and, in
    GNE myopathy, measurably raise sarcolemmal sialylation. A CMAS lesion
    cannot use a larger free pool it is unable to activate, and an SLC35A1
    lesion cannot use a larger cytosolic CMP-sialic acid pool it is unable to
    import, so on mechanism grounds neither supplement should work there.
    No report was found either way: the trials and the rescue experiments are
    all in GNE or NANS disease, and no treated CMAS or SLC35A1 case was
    located. The gap is worth
    recording because these are the disorders with the most severe
    neurodevelopmental presentations and therefore the strongest pressure to
    try an available oral sugar. Two caveats would keep the question open even
    if the prediction holds. Residual transporter activity is partial in some
    SLC35A1 alleles, where one patient's variant retained about half of normal
    transport, so mass action on a partly functional transporter is not
    obviously futile. And the central node can in principle be fed by routes
    this module does not represent, such as salvage of sialic acid released by
    glycoconjugate turnover.
  evidence:
  - reference: PMID:34257421
    reference_title: "Safety and efficacy of N-acetylmannosamine (ManNAc) in patients with GNE myopathy: an open-label phase 2 study."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ManNAc showed long-term safety, biochemical efficacy consistent with the
      intended mechanism of action, and preliminary evidence clinical efficacy
      in patients with GNE myopathy.
    explanation: >-
      Establishes that supplementation is on-mechanism for a cytosolic block,
      which is what makes its untested status for the activation and import
      steps a gap rather than an idle question. Directness is INDIRECT because
      the trial speaks to the GNE arm and the claim at issue concerns the other
      two triggers.
  - reference: PMID:23873973
    reference_title: "Intellectual disability and bleeding diathesis due to deficient CMP--sialic acid transport."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional analysis of mutant SLC35A1 showed normal Golgi localization
      but 50% reduction in transport activity of CMP-sialic acid in vitro.
    explanation: >-
      Documents the partial residual transport that keeps the question open:
      an allele retaining half of normal activity is not obviously beyond the
      reach of raising substrate supply. Directness is INDIRECT because the
      measurement is of transport activity, not of any response to treatment.
  proposed_experiments:
  - experiment_id: exp_precursor_rescue_across_the_three_steps
    name: Isogenic precursor-rescue panel across the cytosolic, activation and import steps
    description: >-
      In one isogenic human cell background, engineer matched hypomorphic and
      null alleles of GNE, NANS, CMAS and SLC35A1, then measure the
      CMP-sialic acid pool and cell-surface sialylation after ManNAc or sialic
      acid supplementation across a dose range. Include alleles with graded
      residual transporter activity to test whether mass action rescues a
      partly functional SLC35A1, and repeat under conditions that suppress
      salvage from glycoconjugate turnover.
    experiment_design: TARGETED_PERTURBATION
    would_support:
    - pathophysiology#Cytosolic De Novo Sialic Acid Synthesis Block
    supporting_outcome:
    - >-
        Supplementation restores the donor pool and surface sialylation in the
        GNE and NANS lines only, confirming that the compartment of the lesion
        decides whether the bypass is available.
    refuting_outcome:
    - >-
        Supplementation also restores surface sialylation in the CMAS or
        hypomorphic SLC35A1 lines, which would mean the module's
        compartment-dependent treatment logic is wrong or incomplete and that an
        unmodelled route feeds the central node.
- discussion_id: controversy_biochemical_versus_clinical_efficacy
  prompt: >-
    Why does refilling the donor pool work biochemically and still fail to
    change the clinical course, and what would make the mechanism treatable?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Golgi CMP-Sialic Acid Availability
  - pathophysiology#Distal Myofiber Degeneration
  - pathophysiology#Growth Plate Chondrocyte Dysfunction
  rationale: >-
    The module's treatments block asserts an effect on the donor-supply node,
    and that assertion is well supported: oral ManNAc raises plasma sialic acid
    and sarcolemmal sialylation in people with GNE myopathy. The clinical
    results do not follow. A placebo-controlled phase 3 trial of
    extended-release aceneuramic acid in GNE myopathy showed no benefit on
    upper-extremity strength or on any key secondary endpoint, and an
    open-label study of oral sialic acid in NANS-CDG found no significant
    improvement in the patients treated after birth. Three readings compete.
    The timing reading is that the damage is largely done before treatment
    starts, which the NANS study's single prenatally treated patient weakly
    supports and which fits a growth-plate and brain arm that runs during
    development. The target reading is that raising the bulk donor pool does
    not restore sialylation of whichever specific clients carry the mechanism,
    which connects directly to the unidentified critical muscle sialoproteins
    discussed above. The outcome-measure reading is that strength over 48 weeks
    in a slowly progressive myopathy may be underpowered to show a real effect.
    The module deliberately does not choose between them: the treatments block
    claims donor supply, which is measured, and this discussion records that
    clinical benefit is not established for any conformer.
  evidence:
  - reference: PMID:31036580
    reference_title: "A phase 3 randomized study evaluating sialic acid extended-release for GNE myopathy."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ace-ER was not superior to placebo in improving muscle strength and
      function in patients with GNE myopathy.
    explanation: >-
      Recorded as REFUTE against clinical benefit of end-product replacement in
      the muscle arm: a randomized class I trial found no advantage over
      placebo. It does not refute the biochemical mechanism, which a separate
      trial measured. HUMAN_CLINICAL because this is a phase 3 trial.
  - reference: PMID:37340906
    reference_title: "Oral sialic acid supplementation in NANS-CDG: Results of a single center, open-label, observational pilot study."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In postnatally treated patients, there was no significant improvement.
    explanation: >-
      The same dissociation in the synthase-step disorder: supplementation was
      tolerated but postnatal treatment produced no significant clinical
      improvement, which is why the timing reading is live. HUMAN_CLINICAL
      because this is an in-human observational study.
  - reference: PMID:34257421
    reference_title: "Safety and efficacy of N-acetylmannosamine (ManNAc) in patients with GNE myopathy: an open-label phase 2 study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased plasma Neu5Ac (+2,159 nmol/L, p < 0.0001) and sarcolemmal
      sialylation (p = 0.0090) were observed at day 90 compared to baseline.
    explanation: >-
      The other side of the dissociation: supplementation demonstrably reaches
      and corrects the biochemical target, so the negative controlled trial is
      not a failure to engage the mechanism. HUMAN_CLINICAL because the
      measurements are from a phase 2 trial in patients.
  proposed_experiments:
  - experiment_id: exp_timing_of_supplementation_in_a_developmental_arm
    name: Developmental-window test of supplementation in the growth-plate and brain arms
    description: >-
      In a model organism carrying a synthase-step or epimerase-step lesion,
      start sialic acid or ManNAc supplementation at a graded series of
      developmental timepoints, from before organogenesis to after the growth
      plate closes, and read out growth-plate architecture, long-bone length,
      brain sialoglycan content and behaviour, with the donor pool measured in
      each tissue at each timepoint. The comparison of interest is not treated
      versus untreated but early versus late treatment at matched exposure.
    experiment_design: TARGETED_PERTURBATION
    would_support:
    - pathophysiology#Growth Plate Chondrocyte Dysfunction
    supporting_outcome:
    - >-
      Benefit falls off sharply with the age at which treatment starts while
      the donor pool rises equally at every age, which would mean the arms are
      developmentally gated and the clinical failures reflect late treatment
      rather than a wrong target.
    refuting_outcome:
    - >-
      Benefit is absent at every starting age despite a corrected donor pool,
      which would favour the target reading instead, that bulk donor supply
      does not reach the clients carrying the mechanism.
- discussion_id: todo_split_brain_arm_developmental_versus_progressive
  prompt: >-
    Should the brain arm be split into a prenatal neurogenesis failure and a
    postnatal progressive deterioration, which are currently carried by one
    node?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Brain Development
  rationale: >-
    One node is doing two jobs. The experimental evidence for this arm is
    developmental: a synthase-step lesion in human cortical organoids abolishes
    protein polysialylation and impairs expansion of neural progenitors, and
    heterozygous mice show impaired cortical neurogenesis. The clinical
    evidence includes something the developmental reading does not cover, since
    some affected individuals deteriorate after a period of stability. A
    developmental failure finished before birth and an ongoing degenerative
    process are different mechanistic claims, and the therapeutic signal
    depends on telling them apart: the only hint of benefit from
    supplementation in NANS-CDG came in a prenatally treated patient. Splitting
    the node would let a conformer attach whichever arm it shows, but it would
    also change anchors that conforming entries already point at, so the split
    has not been made here. The work is to check the existing conformers,
    decide the two node names, and move the evidence items to the arm each one
    actually speaks to.
  evidence:
  - reference: PMID:38000033
    reference_title: "Neurodevelopmental defects in human cortical organoids with N-acetylneuraminic acid synthase mutation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      NANS mutation dysregulated neural migration and differentiation,
      disturbed synapse formation, and weakened neuronal activity.
    explanation: >-
      The developmental half of the case for splitting: the measured phenotypes
      are migration, differentiation and synapse formation, all prenatal
      processes. IN_VITRO because these were measured in human cortical
      organoids.
  - reference: PMID:37340906
    reference_title: "Oral sialic acid supplementation in NANS-CDG: Results of a single center, open-label, observational pilot study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some patients suffer progressive intellectual neurologic deterioration
      (PIND), emphasizing the need for a therapy.
    explanation: >-
      The progressive half: part of the clinical burden is deterioration after
      birth, which a purely developmental node cannot represent. Recorded as
      BACKGROUND because the sentence frames the study rather than reporting
      its result, and HUMAN_CLINICAL because the claim is about patients.

      snippet: >-
        an increased number of desialylated platelets was cleared by Küpffer
        cells in the liver
      explanation: >-
        Loss of the donor transporter in the megakaryocyte-platelet lineage
        leaves platelets desialylated and they are removed by hepatic
        macrophages, the edge from glycoprotein hyposialylation to accelerated
        clearance. MODEL_ORGANISM because the clearance was observed in
        lineage-restricted Slc35a1 knockout mice.
  - target: Podocyte Hyposialylation Injury
    causal_link_type: DIRECT
    evidence:

- name: Ganglioside Sialylation Deficit
  description: >-
    Second of the two parallel molecular effectors, and the glycolipid
    counterpart of glycoprotein hyposialylation. The same Golgi
    sialyltransferases and the same donor build gangliosides, the sialylated
    glycosphingolipids that dominate the neuronal surface. A donor shortage
    therefore limits ganglioside synthesis alongside protein sialylation, which
    matters disproportionately in the nervous system because gangliosides are
    the most abundant neuronal sialoglycans and support axon-myelin
    interactions, axon stability and nerve-cell excitability.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:

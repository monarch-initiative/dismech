treatments:
- name: Precursor Supplementation with N-Acetylmannosamine (ManNAc)
  description: >-
    Oral ManNAc is the module's drug-target pattern for a block in the
    cytosolic arm. ManNAc is the intermediate that GNE's epimerase domain
    produces, so feeding it re-enters the pathway below the commonest site of
    the lesion; in the absence of ManNAc kinase activity it can still be
    phosphorylated by GlcNAc kinase, bypassing the kinase domain as well. By
    restoring free sialic acid it refills the central donor node rather than
    treating a downstream tissue phenotype. The same logic predicts its limits:
    because it enters above the activation and import steps, it is not expected
    to help a CMAS or SLC35A1 lesion, and that prediction has not been tested
    in those disorders.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetyl-D-mannosamine
      term:
        id: CHEBI:63153
        label: N-acetyl-D-mannosamine
  target_mechanisms:
  - target: Cytosolic De Novo Sialic Acid Synthesis Block
    treatment_effect: BYPASSES
    description: >-
      ManNAc enters the pathway downstream of the epimerase step and can be
      phosphorylated without GNE kinase activity, so it routes around a
      cytosolic block rather than correcting the enzyme.
  - target: Reduced Golgi CMP-Sialic Acid Availability
    treatment_effect: ACTIVATES
    description: >-
      Restoring flux through the cytosolic arm raises the free sialic acid pool
      available for activation and import, increasing donor supply at the
      module's central node; sarcolemmal sialylation rises accordingly.
  evidence:
  - reference: PMID:34257421
    reference_title: "Safety and efficacy of N-acetylmannosamine (ManNAc) in patients with GNE myopathy: an open-label phase 2 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased plasma Neu5Ac (+2,159 nmol/L, p < 0.0001) and sarcolemmal
      sialylation (p = 0.0090) were observed at day 90 compared to baseline.
    explanation: >-
      Oral ManNAc raised both the circulating sialic acid pool and sialylation
      of the muscle membrane in patients, which is the on-mechanism readout
      that this treatment acts on the donor-supply node. HUMAN_CLINICAL because
      this is a phase 2 trial in people with GNE myopathy.
  - reference: PMID:17549255
    reference_title: "Mutation in the key enzyme of sialic acid biosynthesis causes severe glomerular proteinuria and is rescued by N-acetylmannosamine."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Survivors exhibited improved renal histology, increased sialylation of
      podocalyxin, and increased Gne/Mnk protein expression and Gne-epimerase
      activities.
    explanation: >-
      In the mouse model, ManNAc rescued survival and improved the kidney arm
      with a measured increase in sialylation of the relevant client protein,
      showing the bypass reaches the tissue consequence. MODEL_ORGANISM because
      the rescue was in Gne M712T knock-in mice.
- name: Sialic Acid (Neu5Ac) Replacement
  description: >-
    Oral sialic acid supplies the pathway's end product directly, entering below
    every cytosolic enzymatic step. It raises the free pool that feeds
    activation and import, so like ManNAc it acts on the module's central node
    and only for lesions upstream of CMAS. Extended-release aceneuramic acid
    was taken into a placebo-controlled phase 3 trial in GNE myopathy and did
    not improve muscle strength, and an open-label study of oral sialic acid in
    NANS-CDG found no significant improvement in patients treated postnatally;
    the same rationale nevertheless rescues the skeletal phenotype of a model
    organism. The mechanism claim recorded in target_mechanisms is donor
    supply, not clinical benefit, and the gap between the two is weighed in the
    discussion below.

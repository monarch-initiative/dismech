    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Gangliosides, sialylated glycosphingolipids, are the most abundant
      sialoglycans of nerve cells.
    explanation: >-
      Establishes gangliosides as the dominant sialoglycan class of neurons,
      which is why a donor shortage has a glycolipid arm and why that arm is
      weighted toward the nervous system. OTHER because this is a review.

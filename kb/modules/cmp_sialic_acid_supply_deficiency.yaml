name: CMP-Sialic Acid Supply Deficiency Module
description: >-
  A conserved pathophysiology module for the inborn errors of the de novo
  sialic acid supply chain. The sialyltransferases of the Golgi lumen draw on a
  single activated donor, CMP-sialic acid (CMP-Neu5Ac), which is made by a
  linear pathway split across three compartments: in the cytosol, GNE
  (UDP-GlcNAc 2-epimerase/ManNAc kinase) and NANS (sialic acid 9-phosphate
  synthase) convert UDP-GlcNAc into sialic acid 9-phosphate, which a
  phosphatase step attributed to NANP - dispensable in knockout cells, so
  carried in prose and not as a lesion site - releases as free sialic acid; in
  the nucleus, CMAS activates it to CMP-sialic acid;
  and the SLC35A1 antiporter imports the donor into the Golgi lumen. Loss of
  function at any one of these steps converges on reduced CMP-sialic acid
  availability in the Golgi lumen, the key conformance target
  ("Reduced Golgi CMP-Sialic Acid Availability"). Donor shortage then causes two
  parallel molecular lesions, hyposialylation of glycoproteins and a deficit in
  ganglioside sialylation, which surface as tissue-specific consequences that
  depend on which step fails and how severe the residual flux is: distal
  myofiber degeneration (GNE myopathy), accelerated clearance of hyposialylated
  platelets (GNE-related thrombocytopenia, SLC35A1-CDG), podocyte injury
  (shown in Gne and Cmas mouse models), impaired brain development (NANS,
  CMAS and SLC35A1 deficiency), and defective growth-plate skeletal growth
  (NANS spondyloepimetaphyseal dysplasia). Drug-target pattern: oral
  N-acetylmannosamine (ManNAc) or sialic acid supplementation BYPASSES a block
  in the cytosolic synthesis step and ACTIVATES the central donor-supply node;
  it cannot bypass a CMAS or SLC35A1 lesion, which sits downstream of where the
  supplements enter, and donor-pool correction has so far not translated into
  clinical benefit (see discussions). Complementary to congenital_disorder_of_glycosylation,
  which models assembly and processing of the N-glycan itself (ER
  lipid-linked oligosaccharide assembly, Golgi branching and COG trafficking)
  and has no sialic acid supply arm: this module supplies the upstream
  donor-substrate limb that feeds the terminal capping step of both N- and
  O-glycans and of gangliosides. SLC35A1-CDG, a CDG type II by its defining
  publication, conforms to both modules.
category: Module
module_categories:
- METABOLISM
creation_date: "2026-11-12T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (for example
  "cmp_sialic_acid_supply_deficiency#Reduced Golgi CMP-Sialic Acid
  Availability"). The single best key conformance target is the central
  "Reduced Golgi CMP-Sialic Acid Availability" node, the one state every
  conformer shares whichever enzyme or transporter fails. Each conformer enters
  through exactly one of three sibling trigger nodes, chosen by the compartment
  of its lesion. GNE and NANS deficiency route through "Cytosolic De
  Novo Sialic Acid Synthesis Block"; CMAS deficiency routes through "Nuclear
  Sialic Acid Activation Block"; SLC35A1-CDG routes through "Golgi CMP-Sialic
  Acid Import Block". The triggers are kept separate rather than merged because
  the compartment decides whether ManNAc or sialic acid supplementation can
  work. Conformers substitute their own lesion at the trigger and then conform
  to whichever of the central and effector nodes they actually model, attaching
  only the tissue arms their disease shows; an entry that has no separate
  donor-pool node of its own (GNE_Myopathy, whose equivalent node is the free
  sialic acid pool upstream of activation) conforms at the trigger and the
  effectors instead of the central node. Worked conformers are GNE_Myopathy (cytosolic arm,
  muscle consequence) and SLC35A1-Congenital_Disorder_of_Glycosylation (Golgi
  import arm, platelet and brain consequences). NANS-related
  spondyloepimetaphyseal dysplasia (Genevieve type) is an intended conformer
  through the cytosolic arm and the growth-plate and brain consequences. The
  NANP phosphatase step is deliberately not a lesion site in this module: no
  human NANP deficiency disorder has been established, and knockout of NANP
  leaves CMP-sialic acid levels and surface sialylation normal while its
  substrate accumulates, so an alternative phosphatase appears to bypass it.
  Do not add a NANP binding or route a conformer through it without evidence
  that overturns that result. The tissue arms are siblings
  under the effector nodes, not a sequence; which arm a disorder shows depends
  on the step, on residual flux, and on tissue-specific reliance on de novo
  synthesis versus salvage of sialic acid from glycoconjugate turnover and
  diet. NOT conformers - do not declare conforms_to from these. Sialuria is a
  GNE allosteric gain-of-function disorder in which loss of CMP-sialic acid
  feedback inhibition causes overproduction and cytoplasmic accumulation of
  free sialic acid, the opposite direction of flux. The sialidoses (NEU1),
  galactosialidosis (CTSA), and free sialic acid storage disease (Salla
  disease and infantile free sialic acid storage disease, SLC17A5) are
  lysosomal catabolic or efflux defects with storage of sialylated material or
  free sialic acid, not shortage of the biosynthetic donor. GNE-related
  thrombocytopenia without myopathy is a phenotype of the same cytosolic arm
  and would conform at the platelet consequence. Modules bind GO, CL and UBERON
  terms only and do not use chemical (CHEBI) or disease (MONDO) term bindings
  in nodes; sialic acid and CMP-sialic acid are described in prose. The
  central node binds the Golgi lumen as its compartment and
  GO:0046381 CMP-N-acetylneuraminate metabolic process as its process, since GO
  has no term for a donor-substrate pool as such; a conformer that binds no
  process there is still conforming, and the edges carry the check. The exception to the
  no-CHEBI rule is the treatments block, whose therapeutic agents carry CHEBI
  identifiers per the treatment schema.
pathophysiology:
- name: Cytosolic De Novo Sialic Acid Synthesis Block
  description: >-
    Trigger for the GNE and NANS disorders. In the cytosol, the
    bifunctional GNE enzyme epimerizes UDP-GlcNAc to N-acetylmannosamine
    (ManNAc) and phosphorylates it to ManNAc 6-phosphate, the rate-limiting and
    feedback-regulated committed step. NANS condenses ManNAc 6-phosphate with
    phosphoenolpyruvate to sialic acid 9-phosphate, and a phosphatase step
    attributed to NANP releases free sialic acid (Neu5Ac). Biallelic
    hypomorphic variants in GNE or NANS reduce flux through this arm and lower
    the free sialic acid pool, and complete loss of the epimerase is embryonic
    lethal in mice, so every human lesion here retains partial activity; the phosphatase step is not modelled as a lesion
    site, because knocking out NANP leaves CMP-sialic acid and cell-surface
    sialylation intact, implying an alternative phosphatase. Because exogenous
    ManNAc enters at the kinase step (and can be phosphorylated by GlcNAc
    kinase) and exogenous sialic acid enters below the phosphatase step, this
    is the only trigger that supplementation can bypass.

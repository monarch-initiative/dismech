    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that this defect is a new type of congenital disorder of
      glycosylation (CDG) of type IIf affecting the transport of CMP-sialic
      acid into the Golgi apparatus.
    explanation: >-
      Identifies biallelic inactivation of the CMP-sialic acid transporter in a
      patient as a congenital disorder of glycosylation acting on transport of
      the donor into the Golgi, which is this trigger. HUMAN_CLINICAL because
      the patient's two alleles were tested by complementation of Lec2 cells.
  - reference: PMID:23873973
    reference_title: "Intellectual disability and bleeding diathesis due to deficient CMP--sialic acid transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional analysis of mutant SLC35A1 showed normal Golgi localization
      but 50% reduction in transport activity of CMP-sialic acid in vitro.
    explanation: >-
      Shows that a patient's SLC35A1 missense variant halves donor transport
      activity while the transporter still reaches the Golgi, establishing
      reduced import rather than mislocalization as the lesion. HUMAN_CLINICAL
      because the variant came from an affected individual whose glycosylation
      was characterized biochemically.
  downstream:
  - target: Reduced Golgi CMP-Sialic Acid Availability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28856833
      reference_title: "Encephalopathy caused by novel mutations in the CMP-sialic acid transporter, SLC35A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Direct measurement of CMP-sialic acid transport into the Golgi showed a
        substantial decrease in overall rate of transport.
      explanation: >-
        Direct measurement in patient cells shows that the mutant transporter
        substantially lowers the rate at which the donor enters the Golgi, the
        edge from this trigger to the central node. HUMAN_CLINICAL because
        transport was measured in the patient's own primary fibroblasts.
- name: Reduced Golgi CMP-Sialic Acid Availability
  description: >-
    The rate-limiting central effector and the key conformance target. All three
    triggers converge here: whether the defect is in making free sialic acid, in
    activating it to CMP-sialic acid, or in carrying the donor across the Golgi
    membrane, the result is the same single state - too little CMP-sialic acid
    in the Golgi lumen for the resident sialyltransferases to work at normal
    rate. Because this one donor serves every sialyltransferase, the shortage is
    not restricted to one client or one glycan class, and the degree of shortage
    rather than the identity of the failed step sets how severe the downstream
    hyposialylation is.
  role: central_effector
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Golgi lumen
    term:
      id: GO:0005796
      label: Golgi lumen
  biological_processes:
  - preferred_term: CMP-sialic acid metabolism
    term:

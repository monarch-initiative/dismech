- name: Podocyte Hyposialylation Injury
  description: >-
    Kidney consequence arm: structural failure of the maturing glomerular
    filtration barrier. That barrier depends on densely sialylated podocyte
    surface proteins - podocalyxin and nephrin - whose negative charge keeps the
    foot processes apart and the slit diaphragm organized, so donor shortage
    during podocyte maturation leaves the foot processes effaced and the slit
    diaphragms absent. The resulting proteinuria and hematuria are phenotypes of
    the conforming entries, not part of this node. Two independent mouse models,
    one at the cytosolic step and one at the activation step, produce this arm;
    in humans proteinuria is reported in SLC35A1-CDG but kidney disease is not a
    feature of adult GNE myopathy, so the arm appears to be developmentally
    timed - see the discussion below.

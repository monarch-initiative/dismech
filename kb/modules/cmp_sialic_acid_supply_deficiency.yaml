    term:
      id: GO:0008781
      label: N-acylneuraminate cytidylyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: CMP-sialic acid biosynthesis
    term:
      id: GO:0006055
      label: CMP-N-acetylneuraminate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:31495922
    reference_title: "A homozygous mutation in CMAS causes autosomal recessive intellectual disability in a Kazakh family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Conservation analysis, structural prediction, and enzyme activity
      experiments demonstrated that (p.Arg188His) influences protein
      dimerization and alters CMAS enzyme activity.
    explanation: >-
      Establishes that a biallelic CMAS missense variant found in affected
      humans changes the enzyme's dimerization and activity, which is the
      activation-step lesion this trigger represents. IN_VITRO because the
      quoted claim rests on enzyme-activity and structural experiments, even
      though the variant itself came from an affected consanguineous
      pedigree.
  - reference: PMID:22745475
    reference_title: "Deficits in sialylation impair podocyte maturation."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      The synthesis of sialoglycoconjugates, which form the outermost
      structures of animal cells, requires CMP-sialic acid, which is a product
      of the nuclear enzyme CMAS.
    explanation: >-
      States the pathway logic this trigger encodes: sialoglycoconjugate
      synthesis depends on CMP-sialic acid, and CMAS is the nuclear enzyme that
      makes it. Recorded as OTHER with quote_role BACKGROUND because the
      sentence states the established pathway rather than the paper's own
      knock-in mouse result.
  downstream:
  - target: Reduced Golgi CMP-Sialic Acid Availability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22745475
      reference_title: "Deficits in sialylation impair podocyte maturation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a critical shortage of CMP-sialic acid prevented sialylation of nephrin
        and podocalyxin in the maturing podocyte
      explanation: >-
        Mislocalizing CMAS produced a critical shortage of CMP-sialic acid that
        blocked sialylation of specific client glycoproteins, which is exactly
        this edge from the activation block to the central donor-availability
        node. MODEL_ORGANISM because the shortage was demonstrated in the
        Cmas-nls knock-in mouse.
- name: Golgi CMP-Sialic Acid Import Block
  description: >-
    Trigger for SLC35A1-CDG. CMP-sialic acid is made outside the Golgi and must
    be carried across the Golgi membrane by the SLC35A1 antiporter before any
    sialyltransferase can use it. Loss-of-function or reduced-activity variants
    in SLC35A1 leave synthesis of the donor intact but strand it in the cytosol,
    so the luminal donor concentration falls. Like the CMAS lesion, and unlike
    the cytosolic one, this block cannot be bypassed by feeding precursor
    sugars.

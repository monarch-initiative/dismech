      deletion did, so the muscle arm of this module is not a purely
      cell-autonomous myofiber event. MODEL_ORGANISM because the comparison
      used tissue-specific inducible deletion in mice.
- name: Accelerated Clearance of Hyposialylated Platelets
  description: >-
    Platelet consequence arm, the one GNE-related thrombocytopenia and the
    macrothrombocytopenia of SLC35A1-CDG run through. This node is the hepatic
    removal event itself: platelets whose surface glycoproteins have lost their
    terminal sialic acid are recognized by lectin receptors on liver
    macrophages and cleared from the circulation early. The resulting low
    platelet count and bleeding are phenotypes of the conforming disorders
    rather than part of this node, and whether platelet production is also
    impaired is contested - see the discussion below.

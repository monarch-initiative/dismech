    reference_title: "Deficits in sialylation impair podocyte maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a critical shortage of CMP-sialic acid prevented sialylation of nephrin
      and podocalyxin in the maturing podocyte where it is required during the
      formation of foot processes
    explanation: >-
      Names the shortage of CMP-sialic acid itself as the state that blocks
      sialylation of client glycoproteins, which is what this central node
      asserts. MODEL_ORGANISM because the shortage and its consequences were
      shown in the Cmas-nls knock-in mouse.
  - reference: PMID:28856833
    reference_title: "Encephalopathy caused by novel mutations in the CMP-sialic acid transporter, SLC35A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient primary fibroblasts and serum showed a considerable decrease in
      the amount of N- and O-glycans terminating in sialic acid.
    explanation: >-
      Shows that when donor delivery to the Golgi is reduced, both N- and
      O-glycans lose their terminal sialic acid, confirming the donor pool as
      a single shared bottleneck rather than a client-specific one.
      HUMAN_CLINICAL because the glycans were profiled in patient fibroblasts
      and serum.
  downstream:
  - target: Glycoprotein Hyposialylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23873973
      reference_title: "Intellectual disability and bleeding diathesis due to deficient CMP--sialic acid transport."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We performed biochemical analysis and found combined N- and O-glycosylation
        abnormalities and specific reduction in sialylation in this patient.
      explanation: >-
        A donor-supply defect produced a specific reduction in sialylation
        across both N- and O-linked glycans in the patient, the edge from the
        donor pool to glycoprotein hyposialylation. HUMAN_CLINICAL because the
        glycosylation assays were run on patient material.
  - target: Ganglioside Sialylation Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Gangliosides are built by the same CMP-sialic-acid-dependent
      sialyltransferases acting on glycosphingolipid rather than glycoprotein
      acceptors, so donor shortage is expected to limit them in parallel. The
      step is well established in biochemistry but has not been measured
      directly in patients with a supply-chain defect, hence the provisional
      confidence.
    evidence:
    - reference: PMID:32303557
      reference_title: "Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: >-
        Sialic acid is a common terminal residue of glycans on proteins and
        acidic sphingolipids such as gangliosides and has important biological
        functions.
      explanation: >-
        Establishes that the same terminal sialic acid residue caps both
        protein glycans and gangliosides, which is why one donor pool
        constrains both arms. Recorded as OTHER with quote_role BACKGROUND
        because the sentence is the paper's framing of established glycobiology,
        not its own mouse result.
- name: Glycoprotein Hyposialylation
  description: >-
    First of the two parallel molecular effectors. With the donor pool
    depleted, N- and O-glycans of secreted and membrane glycoproteins are
    assembled but left without their terminal sialic acid caps. The defect is
    general across clients, but its functional cost is not: it falls hardest on
    heavily sialylated proteins whose negative charge or sialic-acid-dependent
    recognition is load-bearing, such as podocalyxin and nephrin in the
    podocyte, platelet surface glycoproteins, and the sialyl-Lewis-x determinant
    on leukocytes. Plasma protein sialylation can look normal even when tissue
    sialylation is impaired, which is a documented diagnostic pitfall.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Protein sialylation
    term:
      id: GO:1990743
      label: protein sialylation
    modifier: DECREASED
  evidence:
  - reference: PMID:28856833
    reference_title: "Encephalopathy caused by novel mutations in the CMP-sialic acid transporter, SLC35A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient primary fibroblasts and serum showed a considerable decrease in
      the amount of N- and O-glycans terminating in sialic acid.
    explanation: >-
      Documents the effector state itself in patient material: both N- and
      O-glycans are short of their terminal sialic acid when donor supply
      fails. HUMAN_CLINICAL because the glycan profiling was done on the
      patient's fibroblasts and serum.
  - reference: PMID:27213289
    reference_title: "NANS-mediated synthesis of sialic acid is required for brain and skeletal development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal sialylation of plasma proteins was observed in spite of NANS
      deficiency.
    explanation: >-
      Records the diagnostic pitfall stated in this node's description: a
      supply-chain defect can leave plasma glycoprotein sialylation normal, so
      a normal transferrin glycoform profile does not exclude the mechanism.
      HUMAN_CLINICAL because plasma from the affected individuals was analyzed.
  downstream:
  - target: Distal Myofiber Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Which sialoproteins must lose their caps for a myofiber to degenerate is
      not established; total muscle sialic acid is only modestly reduced while
      free sialic acid is severely reduced, pointing at a small subset of
      critical targets rather than global undersialylation of the fiber.
    evidence:
    - reference: PMID:28267778
      reference_title: "Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy and in a mouse model."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        suggesting a small subset of sialylation targets could be responsible
        for the pathogenesis of GNEM
      explanation: >-
        The authors infer from the discrepancy between free and total muscle
        sialic acid that a restricted set of sialylation targets carries the
        myopathic mechanism, which is why this edge is marked provisional with
        unknown intermediates. HUMAN_CLINICAL because the inference rests on
        patient muscle biopsies.
  - target: Accelerated Clearance of Hyposialylated Platelets
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32303557
      reference_title: "Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver."
      supports: SUPPORT

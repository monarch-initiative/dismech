name: Growth Plate Chondrocyte Failure Module
description: >-
  A conserved mechanism module for the skeletal dysplasias that shorten bone by
  disrupting the growth plate itself. The physis runs one stereotyped program -
  resting chondrocytes enter a proliferative zone and divide into longitudinal
  columns, pass through prehypertrophy into hypertrophy, secrete the matrix
  that is then mineralized and replaced by bone - and a lesion in any of its
  three inputs derails it: the cartilage matrix the columns sit in (COL2A1,
  COL11A2, COL10A1, ACAN, SLC26A2, CHST3, B3GAT3), the transcriptional and
  secreted-signal network that times the zones (SOX9, RUNX2, IHH, BMP, CNP
  and NPR2, PTH1R), or the chondrocyte's own biosynthetic and signalling
  capacity (RMRP, TRPV4, PRKG2). Whichever input fails, the growth plate
  loses zonal organisation, longitudinal growth slows, and the result is
  disproportionate short stature with the metaphyseal, epiphyseal or vertebral
  signature of the particular lesion. Conforming entries substitute the gene,
  which of the three inputs it belongs to, and the zone where the program
  stalls. Key conformance target:
  `growth_plate_chondrocyte_failure#Loss of Growth Plate Zonal Organisation`.
  Deliberately complementary to `fgfr_gain_of_function_skeletal_dysplasia`,
  which is one signalling lesion (FGFR3 gain of function) modelled in its own
  right and whose conformers should stay there; to
  `defective_skeletal_mineralization`, which models failure to mineralize an
  intact hypertrophic matrix (rickets) rather than failure to build the zones;
  to `osteoarthritis_cartilage_degradation`, which is articular and
  degradative rather than growth-plate and developmental; to
  `limb_digit_patterning_serial_homology`, where the lesion is in limb
  patterning upstream of any growth plate; and to `mps_gag_storage`, which
  reaches the same chondrocyte through lysosomal storage.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
creation_date: "2026-10-08T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "growth_plate_chondrocyte_failure#Loss of Growth Plate Zonal
  Organisation").

  Scope decision - three input classes, one trigger node. A structural
  collagen, a sulfate transporter, a transcription factor and a
  ribonucleoprotein have nothing in common molecularly, but each is read out
  as the same thing on a growth-plate histological section: zones that have
  lost their column architecture and their orderly progression into
  hypertrophy. That shared, measurable step is the module bar, and it is why
  the trigger node names the input class as a substitution rather than
  splitting into three modules.

  What is NOT in scope. FGFR3 gain of function already has its own module and
  its conformers (Achondroplasia, Thanatophoric_Dysplasia,
  Hypochondroplasia) belong there: that module models the signalling lesion
  and its own downstream chain, and double-anchoring those entries here would
  claim the generic chain adds something it does not. Rickets and
  hypophosphatasia conform to defective_skeletal_mineralization - the
  hypertrophic zone expands there because the matrix cannot mineralize, which
  is the step after this module's terminal node, and two entries
  (Autosomal_Recessive_Hypophosphatemic_Rickets_1,
  Vitamin_D-Dependent_Rickets_Type_3) already carry that anchor on a node
  named for the same zone. Limb and digit patterning defects (the
  brachydactylies, Du Pan, Grebe) are upstream of the growth plate and
  conform to limb_digit_patterning_serial_homology. Osteogenesis imperfecta is
  a bone-matrix disease, not a physeal one. Heterotopic ossification
  (fibrodysplasia ossificans progressiva) forms cartilage and bone outside
  the skeleton and is a different mechanism entirely.

  Zone substitutions for the central node: proliferative-zone collapse with
  short columns (ACAN, COL2A1, RMRP), prehypertrophic or hypertrophic arrest
  (PRKG2, NPR2, Odontochondrodysplasia, Achondrogenesis_Type_IA), accelerated
  or premature hypertrophy (PTH1R in Blomstrand chondrodysplasia), and
  terminal-zone or matrix-remodelling failure (COL10A1, CCN2). Which zone an
  entry names is the most informative thing it can record here, and the
  reason the central node is the key conformance target rather than the
  trigger.

  Curation guardrail - do NOT create a "Skeletal Dysplasia" or
  "Chondrodysplasia" Disease entry for this module. The skeletal dysplasias
  are a large nosology (the ISDS groups) of distinct named entities, each
  with its own MONDO term and entry; the family concept belongs in a
  Grouping, and several ISDS-group groupings already exist.
pathophysiology:
- name: Cartilage Matrix, Signalling or Chondrocyte Biosynthetic Lesion
  description: >-
    A pathogenic variant disables one of the three inputs the growth-plate
    program depends on: a structural or sulfated component of the cartilage
    extracellular matrix, a transcription factor or secreted signal that times
    the zones, or the chondrocyte's own biosynthetic machinery. Conforming
    entries substitute the gene and say which input class it belongs to, since
    the downstream chain is shared and the input is what distinguishes the
    disease.
  role: trigger
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: cartilage development
    term:
      id: GO:0051216
      label: cartilage development
    modifier: DECREASED
  - preferred_term: proteoglycan biosynthetic process
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:21642379
    reference_title: "The skeleton: a multi-functional complex organ: the growth plate chondrocyte and endochondral ossification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The behaviour of growth plate chondrocytes is tightly regulated at all stages of endochondral ossification by a complex network of interactions between circulating hormones (including GH and thyroid hormone), locally produced growth factors (including Indian hedgehog, WNTs, bone morphogenetic proteins and fibroblast growth factors) and the components of the ECM secreted by the chondrocytes (including collagens, proteoglycans, thrombospondins and matrilins)."
    explanation: Enumerates the input classes this trigger node spans - hormones and secreted signals, and the matrix components themselves.
  - reference: PMID:8157027
    reference_title: "The type II collagenopathies: a spectrum of chondrodysplasias."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Clinical entities caused by mutations in the COL2A1 gene coding for type II collagen comprise achondrogenesis II, hypochondrogenesis, spondyloepiphyseal dysplasia congenita, Kniest dysplasia, Stickler arthroophthalmopathy and mild dominant spondyloarthropathy."
    explanation: The matrix-collagen input, with the spectrum of entities one gene produces.
  - reference: PMID:9822202
    reference_title: "Proteoglycan sulfation in cartilage and cell cultures from patients with sulfate transporter chondrodysplasias: relationship to clinical severity and indications on the role of intracellular sulfate production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The amount of non-sulfated disaccharide was elevated in patients' samples (controls, 5.5%+/-2.8 (n=10); patients, 11% to 77%), the highest amount being present in ACG1B patients, indicating that undersulfation of chondroitin sulfate proteoglycans occurs in cartilage in vivo and is correlated with the clinical severity."
    explanation: The matrix-sulfation input, measured in patient cartilage and graded against severity.
  - reference: PMID:11207361
    reference_title: "Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe numerous mutations in the untranslated RMRP gene that cosegregate with the CHH phenotype."
    explanation: The chondrocyte-biosynthetic input, where the lesion is in a housekeeping ribonucleoprotein rather than in cartilage-specific machinery.
  - reference: PMID:26249260
    reference_title: A mutation in TRPV4 results in altered chondrocyte calcium signaling in severe metatropic dysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Heterozygous mutations of this channel cause a variety of channelopathies, including metatropic dysplasia (MD)."
    explanation: >-
      The chondrocyte-intrinsic signalling input: a cation channel required for
      cartilage whose heterozygous variants cause a skeletal dysplasia. The
      paper's own calcium measurements in patient chondrocytes are quoted in
      the Metatropic_Dysplasia entry rather than here, because the bracketed
      ion notation cannot be reproduced as an exact snippet.
  downstream:
  - target: Loss of Growth Plate Zonal Organisation
    causal_link_type: DIRECT
    description: >-
      Whichever input fails, the stereotyped progression through the
      proliferative and hypertrophic zones is disrupted.
- name: Loss of Growth Plate Zonal Organisation
  description: >-
    The physis loses the architecture that makes it a growth engine: resting,
    proliferative, prehypertrophic, hypertrophic and terminal zones in order,
    with proliferating chondrocytes stacked in longitudinal columns. Columns
    shorten or disorganise, and the progression into hypertrophy arrests,
    accelerates, or stalls at the terminal step, depending on the lesion. This
    is the rate-limiting step every conforming disorder funnels through, and
    the one a growth-plate histological section reads directly; a conforming
    entry should name the zone where its program stalls.
  role: central_effector
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: DECREASED
  - preferred_term: chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  - preferred_term: chondrocyte proliferation
    term:
      id: GO:0035988
      label: chondrocyte proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:32953135
    reference_title: "The growth plate: a physiologic overview."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In a coordinated stepwise process, the chondrocytes pass through the stages of resting phase, proliferative phase, prehypertrophic phase, hypertrophic phase, and terminal phase."
    explanation: Names the zones whose order and progression this node represents, and against which a conforming entry says where its program stalls.
  - reference: PMID:32953135
    reference_title: "The growth plate: a physiologic overview."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the resting phase, the cells are relatively inactive in terms of mitosis and express Col2a1 genes which encode type II collagen, whereas in the proliferation phase, the chondrocytes rapidly divide and highly express Col2a1 and Acan, the gene encoding the proteoglycan aggrecan."
    explanation: Ties two of this module's commonest lesion genes to the specific zones they are expressed in, which is why a COL2A1 or ACAN lesion disorganises the proliferative zone.
  - reference: PMID:21865749
    reference_title: Chondrocyte proliferation and differentiation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The coordinated proliferation and differentiation of chondrocytes ensures the continuous elongation of the epiphyseal growth plates."
    explanation: States the dependency that makes disorganisation at this node reduce growth at the next.
  downstream:
  - target: Reduced Longitudinal Bone Growth
    causal_link_type: DIRECT
    description: >-
      Longitudinal growth is the product of column proliferation and
      hypertrophic cell enlargement, both of which this node disrupts.
- name: Reduced Longitudinal Bone Growth
  description: >-
    Endochondral longitudinal growth slows because its two engines, column
    proliferation and the volume increase of hypertrophic chondrocytes, are
    both impaired, and the cartilage template is replaced by bone on a
    disordered schedule. Conforming entries substitute the skeletal
    distribution, which is what distinguishes the entities clinically:
    metaphyseal, epiphyseal, spondylo-, rhizomelic or acromesomelic.
  role: effector
  biological_processes:
  - preferred_term: cartilage development involved in endochondral bone morphogenesis
    term:
      id: GO:0060351
      label: cartilage development involved in endochondral bone morphogenesis
    modifier: DECREASED
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21642379
    reference_title: "The skeleton: a multi-functional complex organ: the growth plate chondrocyte and endochondral ossification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Chondrocytes play a central role in this process, contributing to longitudinal growth through a combination of proliferation, extracellular matrix (ECM) secretion and hypertrophy."
    explanation: Names the three contributions to longitudinal growth that the upstream node disrupts.
  - reference: PMID:21865749
    reference_title: Chondrocyte proliferation and differentiation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "During this process, a cartilage template is formed in which chondrocytes proliferate and differentiate into hypertrophic chondrocytes and are gradually replaced by bone."
    explanation: The template-to-bone replacement whose schedule this node describes as disordered.
  - reference: PMID:32953135
    reference_title: "The growth plate: a physiologic overview."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The growth plate, also known as the physis, is the cartilaginous portion at the ends of long bones where longitudinal growth of the bone takes place."
    explanation: Establishes the physis as the site of longitudinal growth, so its disorganisation is sufficient for growth failure.
  downstream:
  - target: Disproportionate Short Stature and Skeletal Dysplasia
    causal_link_type: DIRECT
    description: >-
      Growth failure confined to endochondral bone produces short stature out
      of proportion to the axial or membranous skeleton.
- name: Disproportionate Short Stature and Skeletal Dysplasia
  description: >-
    The clinical outcome: short stature that is disproportionate because only
    endochondral growth is affected, with the radiographic signature of the
    lesion's distribution, and the secondary joint consequences of a
    malformed epiphysis - early-onset osteoarthritis, joint laxity or
    contracture, and in the vertebral forms kyphoscoliosis and thoracic
    insufficiency. Severity runs from perinatal lethality (achondrogenesis) to
    mild adult short stature with premature arthritis, tracking the residual
    function of the lesioned input.
  role: consequence
  biological_processes:
  - preferred_term: growth plate cartilage development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: DECREASED
  evidence:
  - reference: PMID:9822202
    reference_title: "Proteoglycan sulfation in cartilage and cell cultures from patients with sulfate transporter chondrodysplasias: relationship to clinical severity and indications on the role of intracellular sulfate production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the diastrophic dysplasia sulfate transporter (DTDST) gene have been associated with a family of chondrodysplasias that includes diastrophic dysplasia (DTD), atelosteogenesis type 2 (AO2) and the lethal condition achondrogenesis type 1B (ACG1B)."
    explanation: One input lesion producing a severity spectrum from viable dysplasia to lethal, which is the gradient this node describes.
  - reference: PMID:8157027
    reference_title: "The type II collagenopathies: a spectrum of chondrodysplasias."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The wide range of clinical manifestations is not well understood but characterization of the basic defect may provide clues to establish specific genotype-phenotype correlations."
    explanation: Records that the mapping from input lesion to clinical form is not resolved, which is why this node describes a distribution rather than deriving one.
  - reference: PMID:11207361
    reference_title: "Mutations in the RNA component of RNase MRP cause a pleiotropic human disease, cartilage-hair hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with manifestations including short stature, defective cellular immunity, and predisposition to several cancers"
    explanation: Short stature as the skeletal component of a pleiotropic entry, where the non-skeletal features sit outside this module and belong to the entry's own nodes.
discussions:
- discussion_id: gap_growth_plate_input_to_skeletal_distribution
  prompt: >-
    Why does the skeletal distribution differ so sharply between lesions that
    converge on the same disorganised growth plate - metaphyseal for COL10A1,
    spondylo-epiphyseal for COL2A1, acromesomelic for NPR2 - and why does one
    gene such as COL2A1 produce entities from perinatally lethal
    achondrogenesis to mild adult spondyloarthropathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disproportionate Short Stature and Skeletal Dysplasia
  rationale: >-
    The terminal node of this module names the skeletal distribution as a
    substitution instead of deriving it, because the field does not derive it
    either: the type II collagenopathy review states in as many words that the
    range of manifestations is not well understood. Candidate explanations -
    regional differences in which zone a growth plate depends on most,
    differences in residual function between allele classes, and
    segment-specific expression of the lesioned gene - are not discriminated.
    A conforming entry should record its distribution and severity as observed
    facts with their own evidence, not infer them from the shared chain.
  evidence:
  - reference: PMID:8157027
    reference_title: "The type II collagenopathies: a spectrum of chondrodysplasias."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mutations are expressed in the heterozygous state, and inheritance of type II collagenopathies is autosomal dominant."
    explanation: Establishes that one gene and one inheritance mode underlie the whole spectrum, so the distribution is not explained by the gene alone.
  - reference: PMID:9822202
    reference_title: "Proteoglycan sulfation in cartilage and cell cultures from patients with sulfate transporter chondrodysplasias: relationship to clinical severity and indications on the role of intracellular sulfate production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a correlation between the nature of the mutations and the clinical phenotype, but our understanding of the pathophysiology of the disorder, which involves defective sulfation of cartilage proteoglycans, is far from complete."
    explanation: "States the same gap for the sulfation input: allele severity correlates, but the mechanism connecting it to the clinical form is not established."

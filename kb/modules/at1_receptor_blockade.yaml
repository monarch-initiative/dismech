name: Angiotensin II Type 1 Receptor Blockade Module
description: 'The conserved pharmacological cascade an angiotensin receptor blocker produces: an
  AT1-selective antagonist occupies AGTR1 (trigger), which removes AT1-mediated vasoconstrictor and
  mitogenic signalling (central effector, the key conformance target), and from there into four
  parallel arms - reduced arteriolar vasoconstriction, reduced aldosterone-driven sodium retention,
  reduced intraglomerular pressure with less proteinuria, and the two adverse arms of hyperkalaemia
  and fetal renal tubular dysgenesis. The consequences are lower arterial pressure and slowed
  progression of chronic kidney disease, and the module keeps those two separate on purpose because
  the renal benefit is reported to exceed what the pressure change explains. Carries the drug-target
  pattern for AT1 blockers and for the angiotensin receptor-neprilysin inhibitor, whose neprilysin
  half is deliberately out of scope. Complementary to beta_adrenergic_receptor_blockade, which
  removes a different neurohormonal arm of the same diseases through a different receptor, and to
  cardiomyopathy_maladaptive_remodeling, which models the remodelling this module acts to prevent
  rather than duplicating it. Key conformance target: at1_receptor_blockade#Loss of AT1-Mediated
  Vasoconstrictor and Mitogenic Signalling.'
category: Module
module_categories:
- PHARMACOLOGY
creation_date: '2026-10-22T00:00:00Z'
notes: 'This is a mechanism module, not a specific disease. Do NOT create an "AT1 Receptor Blockade"
  Disease entry. Disorder entries reference individual nodes via conforms_to, for example
  "at1_receptor_blockade#Angiotensin II Type 1 Receptor Antagonist Occupancy".


  Scope, and three things this module deliberately does not claim. First, an ACE inhibitor is not
  an AT1 blocker: it acts upstream by reducing angiotensin II generation and converges on the same
  effector arms without ever occupying the receptor, so an entry whose only RAS drug is an ACE
  inhibitor should conform at the central effector rather than at the trigger. Second, losartan is
  used in Marfan syndrome and the Loeys-Dietz spectrum for attenuation of TGF-beta signalling in
  the aortic wall, which is a different downstream claim from anything modelled here; an aortopathy
  entry should not conform to this module on the strength of carrying losartan. Third, the Gq and
  phospholipase C step between receptor occupancy and the haemodynamic arms is real but is not
  modelled as its own node: the sources cited here establish receptor occupancy and the downstream
  effects without a citable step in between, and a curator who finds one should add the node rather
  than inferring it.


  The two arms the module keeps apart are the point of its shape. Lower arterial pressure and
  slowed renal progression both follow from the same receptor action, but RENAAL reports the renal
  benefit as exceeding what the blood-pressure change accounts for, so collapsing them into one
  outcome node would assert that the kidney protection is a pressure effect.


  Within-class differences are recorded on the trigger node and are not modelled as separate nodes:
  the agents differ severalfold in receptor affinity and in how slowly they leave the receptor, and
  an entry that depends on that distinction should say so in its own prose.


  Sparsentan, a dual endothelin type A and AT1 antagonist used in IgA nephropathy and focal
  segmental glomerulosclerosis, engages this module''s trigger with a second target this module
  does not carry. An entry curating it should conform here for the AT1 half and describe the
  endothelin half separately.'
pathophysiology:
- name: Angiotensin II Type 1 Receptor Antagonist Occupancy
  description: 'An AT1-selective antagonist occupies AGTR1 and prevents angiotensin II from
    activating it. The selectivity is the distinctive feature: AT2 receptors are left free to be
    stimulated by the angiotensin II that accumulates, which is what separates this drug class
    mechanistically from inhibition of angiotensin II generation. The agents are not
    interchangeable at the receptor - they differ severalfold in binding affinity and in
    dissociation rate, with candesartan at one end and losartan at the other.'
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: angiotensin type I receptor activity
    term:
      id: GO:0001596
      label: angiotensin type I receptor activity
    modifier: DECREASED
  genes:
  - &id001
    preferred_term: AGTR1
    term:
      id: hgnc:336
      label: AGTR1
  evidence:
  - reference: PMID:11683476
    reference_title: Pharmacology of AT1-receptor blockers.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Because all major deleterious effects of angiotensin II are produced via binding to
      AT1-receptors, selective blockade of this receptor subtype should confer haemodynamic
      benefits, while allowing stimulation of the potentially beneficial effects mediated by
      AT2-receptors.
    explanation: Sources this node's distinctive claim - that the antagonism is subtype-selective
      and leaves AT2 signalling available. Note the quoted sentence states the rationale for the
      class ("should confer"), not a measured outcome; the outcome arms below carry their own
      evidence.
  - reference: PMID:11683476
    reference_title: Pharmacology of AT1-receptor blockers.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Candesartan is also released from the receptor more slowly than other available
      AT1-receptor blockers, with a half-life of approximately 152 min for the receptor-blocker
      complex, compared with 31 min for EXP-3 174, 17 min for irbesartan and 5 min for losartan.
    explanation: Sources the within-class heterogeneity the description records, which is why the
      module treats receptor occupancy as one node rather than asserting that every agent occupies
      the receptor equivalently.
  downstream:
  - target: Loss of AT1-Mediated Vasoconstrictor and Mitogenic Signalling
    description: Occupancy of the receptor removes the signal it would otherwise transduce.
  - target: Fetal Renal Tubular Dysgenesis and Hypocalvaria
    description: In a pregnancy exposed in the second or third trimester, the same receptor
      blockade acts on a kidney that needs angiotensin II signalling to develop. Attached to
      receptor occupancy rather than below the haemodynamic arms because the fetal injury is
      developmental, not a consequence of the adult pressure response.
- name: Loss of AT1-Mediated Vasoconstrictor and Mitogenic Signalling
  description: 'The disorder-agnostic, rate-limiting step, and the key conformance target. AT1 is a
    G-protein-coupled receptor whose activation drives both vasoconstrictor and mitogenic
    programmes; with the receptor occupied, both are withdrawn at once. Every arm below is a
    consequence of this one step, which is why a conforming entry that carries any RAS blocker
    should anchor here even when its own prose names only one of the arms.'
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: angiotensin-activated signaling pathway
    term:
      id: GO:0038166
      label: angiotensin-activated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:37455034
    reference_title: Nonatherosclerotic Renovascular Hypertension.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Angiotensin receptor type 1 is a G-protein-coupled receptor that activates
      vasoconstrictor and mitogenic signaling pathways resulting in peripheral arteriolar
      vasoconstriction and increased renal tubular reabsorption of sodium and water which promotes
      intravascular volume expansion.
    explanation: Sources what AT1 signalling does, which is what blockade withdraws. Graded
      INDIRECT because the quoted sentence describes the agonist pathway rather than the effect of
      an antagonist on it; the step from one to the other is the inference this node rests on.
  downstream:
  - target: Reduced Arteriolar Vasoconstriction
    description: The vasoconstrictor programme is withdrawn.
  - target: Reduced Aldosterone-Driven Sodium Retention
    description: The adrenal arm of the same signal is withdrawn.
  - target: Reduced Intraglomerular Pressure and Proteinuria
    description: Efferent arteriolar tone falls, lowering filtration pressure.
  - target: Hyperkalaemia on Renin-Angiotensin System Blockade
    description: The same loss of aldosterone drive that reduces sodium retention also reduces
      potassium excretion.
- name: Reduced Arteriolar Vasoconstriction
  description: Peripheral arteriolar smooth muscle loses the dominant vasoconstrictor input, and
    resistance falls. This is the arm that acts fastest and the one a hypertension entry will
    usually have modelled already, often as a vascular-resistance node with no receptor above it.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: vascular associated smooth muscle contraction
    term:
      id: GO:0014829
      label: vascular associated smooth muscle contraction
    modifier: DECREASED
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:37455034
    reference_title: Nonatherosclerotic Renovascular Hypertension.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: a potent vasopressor and the primary effector of renin-induced hypertension
    explanation: Establishes that angiotensin II is the dominant vasoconstrictor input this arm
      removes. INDIRECT for the same reason as the node above - the source describes the agonist.
  downstream:
  - target: Lower Arterial Blood Pressure
    description: Falling systemic vascular resistance lowers arterial pressure.
- name: Reduced Aldosterone-Driven Sodium Retention
  description: Angiotensin II is the principal stimulus to adrenal aldosterone release, and
    aldosterone in turn drives distal tubular sodium reabsorption. Blockade withdraws that stimulus,
    so sodium and water retention fall and intravascular volume contracts. The arm is listed
    separately from vasoconstriction because its time course is slower and because it is the arm
    that produces the hyperkalaemia below.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: renin-angiotensin regulation of aldosterone production
    term:
      id: GO:0002018
      label: renin-angiotensin regulation of aldosterone production
    modifier: DECREASED
  - preferred_term: renal sodium ion absorption
    term:
      id: GO:0070294
      label: renal sodium ion absorption
    modifier: DECREASED
  locations:
  - preferred_term: zona glomerulosa of adrenal gland
    term:
      id: UBERON:0002053
      label: zona glomerulosa of adrenal gland
  evidence:
  - reference: PMID:37455034
    reference_title: Nonatherosclerotic Renovascular Hypertension.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Angiotensin II stimulates the adrenal cortical release of aldosterone, which promotes
      renal tubular sodium reabsorption, resulting in volume expansion.
    explanation: Sources the adrenal-to-tubule sequence this arm withdraws. INDIRECT because the
      source states the agonist pathway, not the antagonist's effect on it.
  downstream:
  - target: Lower Arterial Blood Pressure
    description: Volume contraction contributes to the pressure fall.
- name: Reduced Intraglomerular Pressure and Proteinuria
  description: 'Blockade lowers filtration pressure across the glomerular capillary, and the
    measurable consequence is a fall in protein excretion - about a third in the type 2 diabetic
    nephropathy trial. This arm is the reason the module''s renal consequence is kept separate from
    its pressure consequence. The node is bound at the efferent arteriole because that is where the
    standard account places the pressure change, but note that the cited evidence here measures the
    protein excretion rather than the arteriolar step: a source for the preferential efferent
    constriction would strengthen the location binding.'
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: renal filtration
    term:
      id: GO:0097205
      label: renal filtration
    modifier: DECREASED
  locations:
  - preferred_term: renal efferent arteriole
    term:
      id: UBERON:0004640
      label: renal efferent arteriole
  evidence:
  - reference: PMID:11565518
    reference_title: Effects of losartan on renal and cardiovascular outcomes in patients with type
      2 diabetes and nephropathy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The level of proteinuria declined by 35 percent with losartan (P<0.001 for the
      comparison with placebo).
    explanation: Measures this arm's output directly in a randomised trial of an AT1 blocker.
  downstream:
  - target: Slowed Progression of Chronic Kidney Disease
    description: Lower filtration pressure and less protein traffic slow nephron loss.
- name: Lower Arterial Blood Pressure
  description: The haemodynamic consequence the hypertension indication rests on, reached by the
    vasoconstrictor and volume arms together. The magnitude available from placebo-controlled
    trials is a class-agnostic one and the module does not assert an AT1-blocker-specific figure.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: regulation of blood pressure
    term:
      id: GO:0008217
      label: regulation of blood pressure
    modifier: DECREASED
  evidence:
  - reference: PMID:37455034
    reference_title: Nonatherosclerotic Renovascular Hypertension.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: All of these mechanisms coalesce to increase arterial pressure by way of arteriolar
      constriction, enhanced cardiac output, and the retention of sodium and water.
    explanation: Sources the convergence of the two arms above onto arterial pressure. INDIRECT -
      the source states how the agonist raises pressure, from which the antagonist's effect
      follows.
  - reference: PMID:40885583
    reference_title: 'Blood pressure-lowering efficacy of antihypertensive drugs and their
      combinations: a systematic review and meta-analysis of randomised, double-blind,
      placebo-controlled trials.'
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: On average, monotherapy at standard dose reduced systolic blood pressure by 8·7 mm Hg
      (95% CI 8·2-9·2), and each doubling in dose conferred an additional 1·5 mm Hg (1·2-1·7)
      reduction.
    explanation: Bounds the magnitude of this node. Graded INDIRECT because the figure is pooled
      across the five major antihypertensive classes rather than specific to angiotensin receptor
      blockers; the same analysis reports considerable variation between and within classes, so it
      is a scale for this node, not an AT1-blocker estimate.
- name: Slowed Progression of Chronic Kidney Disease
  description: 'The renal outcome, and the one the module separates from blood pressure on the
    strength of the trial''s own reading: the benefit was reported as larger than the pressure
    change accounts for. Note what the same trial did not show - no effect on death - which is why
    this node claims renal progression and not survival.'
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:11565518
    reference_title: Effects of losartan on renal and cardiovascular outcomes in patients with type
      2 diabetes and nephropathy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Losartan reduced the incidence of a doubling of the serum creatinine concentration
      (risk reduction, 25 percent; P=0.006) and end-stage renal disease (risk reduction, 28
      percent; P=0.002) but had no effect on the rate of death.
    explanation: Sources this node's claim and its limit in one sentence - renal progression slowed,
      mortality unchanged.
  - reference: PMID:11565518
    reference_title: Effects of losartan on renal and cardiovascular outcomes in patients with type
      2 diabetes and nephropathy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The benefit exceeded that attributable to changes in blood pressure.
    explanation: The reason this node is not drawn below Lower Arterial Blood Pressure. The trial
      reports the renal benefit as larger than the pressure change explains, so the module routes
      it through the intraglomerular arm instead.
- name: Hyperkalaemia on Renin-Angiotensin System Blockade
  description: 'The class''s characteristic dose-limiting laboratory adverse effect, and the usual
    reason the drug is stopped: with aldosterone drive withdrawn, distal potassium secretion falls.
    It is recorded here as an arm of the same signal that produces the therapeutic sodium effect,
    not as an unrelated toxicity. Stopping the drug for it carries its own risk, which is why the
    node is a dose-limiting effect rather than a reason to discontinue.'
  role: adverse_effect
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: renal potassium excretion
    term:
      id: GO:0036359
      label: renal potassium excretion
    modifier: DECREASED
  evidence:
  - reference: PMID:35085685
    reference_title: 'Hyperkalemia-Related Discontinuation of Renin-Angiotensin-Aldosterone System
      Inhibitors and Clinical Outcomes in CKD: A Population-Based Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Renin-angiotensin-aldosterone system (RAAS) inhibitors are evidence-based therapies
      that slow the progression of chronic kidney disease (CKD) but can cause hyperkalemia.
    explanation: Sources the adverse effect. The sentence sits in the paper's rationale rather than
      among its own results, hence BACKGROUND; it reports the human clinical fact, hence
      HUMAN_CLINICAL.
  - reference: PMID:35085685
    reference_title: 'Hyperkalemia-Related Discontinuation of Renin-Angiotensin-Aldosterone System
      Inhibitors and Clinical Outcomes in CKD: A Population-Based Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: RAAS inhibitor discontinuation is associated with higher mortality and CV events
      compared with continuation among patients with hyperkalemia and CKD.
    explanation: Bounds the node. The adverse effect is real, but this cohort's own finding is that
      stopping the drug because of it is associated with worse outcomes - which is why the node is
      framed as dose-limiting rather than as grounds for withdrawal.
- name: Fetal Renal Tubular Dysgenesis and Hypocalvaria
  description: Angiotensin II signalling through AT1 is required for normal kidney development, so
    blockade in the second or third trimester produces an acquired phenocopy of genetic renal
    tubular dysgenesis, with reduced proximal tubules and defective skull ossification. This is the
    arm that makes the class contraindicated in pregnancy, and it is developmental rather than
    haemodynamic, which is why it hangs off receptor occupancy.
  role: adverse_effect
  biological_scale: ORGANISM
  molecular_functions:
  - preferred_term: angiotensin type I receptor activity
    term:
      id: GO:0001596
      label: angiotensin type I receptor activity
    modifier: DECREASED
  genes:
  - *id001
  evidence:
  - reference: PMID:34082612
    reference_title: Quantifying Proximal Collecting Tubule Deficiency in Angiotensin-Converting
      Enzyme Inhibitor and Angiotensin II Receptor Blocker Fetopathy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: AA fetopathy phenotype is similar to renal tubular dysgenesis including reduced
      proximal convoluted tubules (PCTs).
    explanation: Sources the fetal phenotype, quantified against the genetic form of renal tubular
      dysgenesis.
  - reference: PMID:34082612
    reference_title: Quantifying Proximal Collecting Tubule Deficiency in Angiotensin-Converting
      Enzyme Inhibitor and Angiotensin II Receptor Blocker Fetopathy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Among other AA fetopathy findings, 1 case demonstrated unilateral renal vein thrombosis
      and 4 had hypocalvaria.
    explanation: Sources the second half of this node's name. The skull ossification defect was
      previously asserted in the node name with only the tubular half cited.
treatments:
- name: Angiotensin II Receptor Blocker Therapy
  description: The AT1-selective antagonists used across hypertension, heart failure, diabetic and
    non-diabetic proteinuric kidney disease. Listed as one treatment because they share the
    receptor action; the agents differ in affinity and dissociation rate, as the trigger node
    records.

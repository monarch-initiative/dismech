name: Nociceptor Sodium Channel Excitability Module
description: >-
  A conserved bidirectional channelopathy module for the Mendelian disorders of
  pain sensation caused by variants in the nociceptor-enriched voltage-gated
  sodium channels (SCN9A/Nav1.7, SCN10A/Nav1.8, SCN11A/Nav1.9). A single gene can
  produce opposite clinical extremes: loss of Nav1.7 function abolishes pain
  entirely (congenital insensitivity to pain), while gain of Nav1.7 function
  causes some of the most severe pain syndromes described (inherited
  erythromelalgia, paroxysmal extreme pain disorder, a large minority of
  idiopathic small-fibre neuropathy). Both arms converge on one rate-limiting
  node — the nociceptor's sodium-current-dependent action-potential threshold and
  firing — which is this module's key conformance target. The module exists
  precisely because the mapping from biophysical direction to clinical direction
  is not monotonic: a gain-of-function SCN11A variant that holds nociceptors
  depolarized *blocks* action potential generation and causes pain insensitivity,
  and the specific biophysical defect (hyperpolarized activation versus impaired
  fast inactivation) rather than the gene predicts both the syndrome and the drug
  response.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is the peripheral
  sensory counterpart of `cardiac_ion_channel_repolarization`, and is
  deliberately scoped to the channel-intrinsic arm of hereditary pain disorders.
  It is NOT a duplicate of `peripheral_axonal_degeneration`: in the canonical
  conformers the nociceptor is electrically abnormal but structurally intact, and
  no axon degenerates. The exception is the small-fibre-neuropathy branch, where
  sustained Nav1.7 hyperexcitability is associated with distal small-fibre
  degeneration; an entry curating that branch should conform to both modules.
  The developmental route to pain insensitivity — NTRK1/NGF trophic failure and
  PRDM12 nociceptor specification, which cause loss of the nociceptors
  themselves rather than of their excitability — is mechanistically distinct and
  deliberately OUT of scope; a disease such as congenital insensitivity to pain
  with anhidrosis conforms only through its channelopathy nodes, if it has any.

  Disorder-specific substitutions at the trigger node: biallelic SCN9A nonsense
  variants (autosomal recessive congenital insensitivity to pain); SCN9A missense
  variants shifting activation to more negative potentials (inherited
  erythromelalgia); SCN9A missense variants impairing fast inactivation and
  producing persistent current (paroxysmal extreme pain disorder); SCN9A
  gain-of-function variants of intermediate severity (idiopathic small-fibre
  neuropathy); SCN11A/Nav1.9 gain-of-function (either familial episodic pain or,
  when the resting depolarization is large enough to inactivate the
  action-potential machinery, congenital pain insensitivity); SCN10A/Nav1.8
  gain-of-function (painful small-fibre neuropathy).

  The two directional branches are NOT interchangeable conformance targets. A
  conforming entry attaches to the branch its evidence actually supports, and to
  the shared `#Nociceptor Action Potential Threshold and Firing` node only when
  the entry evidences an effect on nociceptor firing itself rather than merely
  carrying a variant in one of these genes. Curating a channel variant with no
  demonstrated effect on nociceptor excitability does not conform.

  Not an Xogenesis module: nothing pathological is formed; the terminal output
  is altered function of an intact cell.
pathophysiology:
- name: Nociceptor Voltage-Gated Sodium Channel Variant
  description: >-
    A germline variant in one of the three voltage-gated sodium channel
    alpha-subunits whose expression is concentrated in nociceptive
    dorsal-root-ganglion and trigeminal neurons: SCN9A (Nav1.7), SCN10A (Nav1.8)
    or SCN11A (Nav1.9). Their restricted expression is what makes these channels
    a non-redundant, dose-sensitive control point for pain rather than a general
    determinant of excitability, and it is why the resulting syndromes are
    sensory-selective and — for Nav1.7 loss — otherwise silent.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:17167479
    reference_title: "An SCN9A channelopathy causes congenital inability to experience pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This region contains the gene SCN9A, encoding the alpha-subunit of the
      voltage-gated sodium channel, Na(v)1.7, which is strongly expressed in
      nociceptive neurons.
    explanation: >-
      Establishes the trigger gene and the nociceptor-restricted expression that
      makes this module sensory-selective.
  - reference: PMID:24036948
    reference_title: "A de novo gain-of-function mutation in SCN11A causes loss of pain perception."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCN11A encodes Nav1.9, a voltage-gated sodium ion channel that is primarily
      expressed in nociceptors
    explanation: >-
      Establishes the second trigger gene of the module and the same
      nociceptor-restricted expression pattern.
  downstream:
  - target: Loss of Nociceptor Sodium Current
    description: >-
      Nonsense or otherwise inactivating variants remove the channel's
      contribution to the nociceptor sodium current.
  - target: Enhanced or Persistent Nociceptor Sodium Current
    description: >-
      Missense variants that shift activation negative or impair fast
      inactivation increase current at or near resting potential.

- name: Loss of Nociceptor Sodium Current
  description: >-
    The loss-of-function branch. Truncating or otherwise inactivating variants
    abolish the channel's current, removing the subthreshold amplification that
    normally lets a receptor potential reach action-potential threshold. Because
    the channel is non-redundant in nociceptors, no other sodium channel
    compensates, and the deficit is specific to pain signalling.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:17167479
    reference_title: "An SCN9A channelopathy causes congenital inability to experience pain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cells expressing mutant Na(v)1.7, the currents were no greater than
      background.
    explanation: >-
      Direct electrophysiological demonstration of the loss-of-function branch:
      the mutant channel carries no measurable current.
  downstream:
  - target: Nociceptor Action Potential Threshold and Firing
    description: >-
      Without the amplifying sodium current the nociceptor cannot reach firing
      threshold.

- name: Enhanced or Persistent Nociceptor Sodium Current
  description: >-
    The gain-of-function branch, which splits by biophysical mechanism — a
    distinction that predicts both the clinical syndrome and the drug response,
    and that conformers must preserve rather than collapsing into a generic
    "gain of function". Variants shifting voltage-dependence of activation to
    more negative potentials open the channel to ordinary warmth-level
    depolarizations (the inherited erythromelalgia mechanism). Variants impairing
    fast inactivation leave a persistent, non-inactivating sodium current (the
    paroxysmal extreme pain disorder mechanism). A third pattern, excessive
    channel activity at resting voltage, produces sustained depolarization rather
    than enhanced firing and is routed separately below.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis in vitro of three of these mutant Na(v)1.7 channels
      revealed a reduction in fast inactivation, leading to persistent sodium
      current.
    explanation: >-
      Establishes the persistent-current mechanism of this branch.
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Other mutations in SCN9A associated with more negative activation
      thresholds are known to cause primary erythermalgia (PE).
    explanation: >-
      Establishes the hyperpolarized-activation mechanism as the distinct second
      route into this branch, in the same allelic series.
  downstream:
  - target: Nociceptor Action Potential Threshold and Firing
    description: >-
      Increased sodium current at and near rest lowers the threshold for
      action-potential generation.
  - target: Sustained Nociceptor Depolarization and Conduction Block
    description: >-
      When the excess current is active at resting voltage rather than during the
      upstroke, the nociceptor depolarizes instead of firing more.

- name: Sustained Nociceptor Depolarization and Conduction Block
  description: >-
    The module's counterintuitive crossing branch, and the reason it is curated
    bidirectionally rather than as two separate one-way modules. A
    gain-of-function variant whose excess activity falls at resting membrane
    potential holds the nociceptor tonically depolarized. That sustained
    depolarization inactivates the action-potential machinery, so the cell can no
    longer fire or transmit — a biophysical gain producing a clinical loss. It is
    the mechanism by which SCN11A gain-of-function causes congenital pain
    insensitivity, and it means the sign of the channel defect cannot be inferred
    from the patient's phenotype or vice versa.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  biological_processes:
  - preferred_term: membrane depolarization during action potential
    term:
      id: GO:0086010
      label: membrane depolarization during action potential
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:24036948
    reference_title: "A de novo gain-of-function mutation in SCN11A causes loss of pain perception."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutant Nav1.9 channels displayed excessive activity at resting voltages,
      causing sustained depolarization of nociceptors, impaired generation of
      action potentials and aberrant synaptic transmission.
    explanation: >-
      Directly documents the crossing branch: excess channel activity at rest
      impairs rather than enhances action-potential generation.
  downstream:
  - target: Nociceptor Action Potential Threshold and Firing
    description: >-
      Depolarization block removes the nociceptor's ability to generate and
      propagate action potentials.

- name: Nociceptor Action Potential Threshold and Firing
  description: >-
    The rate-limiting, disorder-agnostic node of this module and its key
    conformance target. Every arm — loss of current, enhanced or persistent
    current, and depolarization block — converges here, on whether and how
    readily the nociceptor generates and propagates action potentials in response
    to a stimulus. Shifted downward, the neuron fires spontaneously and to
    innocuous stimuli; abolished, noxious stimuli produce no signal at all. The
    clinical phenotype is read off the direction and magnitude of the shift at
    this node, not off the direction of the underlying channel defect.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  biological_processes:
  - preferred_term: action potential
    term:
      id: GO:0001508
      label: action potential
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:17167479
    reference_title: "An SCN9A channelopathy causes congenital inability to experience pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that SCN9A is an essential and non-redundant requirement
      for nociception in humans.
    explanation: >-
      Establishes this node as non-redundant and rate-limiting: nociception in
      humans depends on it and nothing substitutes for it.
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PEPD and PE are allelic variants with distinct underlying biophysical
      mechanisms and represent a separate class of peripheral neuronal sodium
      channelopathy.
    explanation: >-
      Supports treating these disorders as one mechanistic class defined at this
      node while keeping their biophysical routes into it distinct.
  downstream:
  - target: Nociceptor Hyperexcitability and Ectopic Firing
    description: >-
      A lowered threshold produces spontaneous and stimulus-evoked overfiring.
  - target: Failure of Nociceptive Signal Transduction
    description: >-
      An abolished or blocked action potential leaves noxious stimuli
      unsignalled.

- name: Nociceptor Hyperexcitability and Ectopic Firing
  description: >-
    Nociceptors fire spontaneously and in response to stimuli that would not
    normally be painful, so that ordinary warmth, exercise, or defecation
    triggers a barrage of nociceptive input. Conforming entries substitute the
    disorder-specific trigger and territory: heat-provoked, cooling-relieved
    distal extremity flares in inherited erythromelalgia; paroxysms in rectal,
    ocular and submandibular territory in paroxysmal extreme pain disorder;
    distal burning pain with autonomic complaints in small-fibre neuropathy.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  biological_processes:
  - preferred_term: sensory perception of pain
    term:
      id: GO:0019233
      label: sensory perception of pain
    modifier: INCREASED
  evidence:
  - reference: PMID:14985375
    reference_title: "Mutations in SCN9A, encoding a sodium channel alpha subunit, in patients with primary erythermalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCN9A, encoding a voltage-gated sodium channel alpha subunit predominantly
      expressed in sensory and sympathetic neurones, may play an important role
      in nociception and vasomotor regulation.
    explanation: >-
      Links the channel to the sensory and sympathetic output of this node in the
      erythromelalgia conformer, including the vasomotor component that makes
      that syndrome neurovascular rather than purely sensory.
  - reference: PMID:22641108
    reference_title: "Small-fibre neuropathies--advances in diagnosis, pathophysiology and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Gain-of-function variants in the Na(v)1.7 sodium channel have recently been
      found in nearly 30% of patients with idiopathic SFN
    explanation: >-
      Establishes that this branch accounts for a substantial share of an
      apparently idiopathic painful neuropathy, extending the module beyond the
      rare Mendelian syndromes. Evidence source is OTHER because this is a
      review.

- name: Failure of Nociceptive Signal Transduction
  description: >-
    No nociceptive signal reaches the spinal cord, whether because the
    amplifying current is absent or because the neuron is held in depolarization
    block. The nociceptors themselves are present and structurally normal —
    which is what distinguishes this node from the developmental
    NGF-TRKA/PRDM12 route to pain insensitivity, where the neurons are lost.
    Other sensory modalities and autonomic function are spared, so the deficit
    is a selective, complete and painless anaesthesia to noxious stimuli, with
    injury, mutilation and unrecognized fracture as its consequences.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sensory perception of pain
    term:
      id: GO:0019233
      label: sensory perception of pain
    modifier: DECREASED
  evidence:
  - reference: PMID:17167479
    reference_title: "An SCN9A channelopathy causes congenital inability to experience pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complete inability to sense pain in an otherwise healthy individual is
      a very rare phenotype.
    explanation: >-
      States the terminal phenotype of this branch and its selectivity: pain
      alone is lost, in an otherwise healthy individual.
  - reference: PMID:24036948
    reference_title: "A de novo gain-of-function mutation in SCN11A causes loss of pain perception."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a specific de novo missense mutation in SCN11A in individuals
      with the congenital inability to experience pain who suffer from recurrent
      tissue damage and severe mutilations.
    explanation: >-
      Documents the same terminal phenotype reached through the depolarization
      block branch, and its injury consequences.

treatments:
- name: Carbamazepine (persistent-current-selective sodium channel blockade)
  description: >-
    Carbamazepine blocks the persistent sodium current produced by
    inactivation-impaired Nav1.7 variants, and is effective in paroxysmal extreme
    pain disorder. It is the module's drug-target pattern and is deliberately
    branch-specific: it does not correct the hyperpolarized activation threshold
    of the erythromelalgia variants and is not effective in that syndrome. A
    conforming disorder inherits this pattern only if its own variants act
    through the persistent-current mechanism; the pattern is a mechanistic
    illustration, not a treatment recommendation transferable across the module.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_mechanisms:
  - target: Enhanced or Persistent Nociceptor Sodium Current
    treatment_effect: INHIBITS
    description: >-
      Selective block of the non-inactivating component of the mutant sodium
      current, restoring normal inactivation behaviour at the amplifier node.
    evidence:
    - reference: PMID:17145499
      reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Carbamazepine, a drug that is effective in PEPD, but not PE, showed
        selective block of persistent current associated with PEPD mutants, but
        did not affect the negative activation threshold of a PE mutant.
      explanation: >-
        Shows the drug acting on one biophysical sub-mechanism of this node and
        not the other, and ties that selectivity directly to the differing
        clinical response.

discussions:
- discussion_id: nav17_analgesic_translation_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Nociceptor Action Potential Threshold and Firing"
  prompt: >-
    Does pharmacological blockade of Nav1.7 in adults reproduce the profound,
    selective analgesia of congenital Nav1.7 loss of function?
  rationale: >-
    The human genetics at this node are as clean as pain biology gets — biallelic
    SCN9A loss of function abolishes pain with no other neurological deficit —
    and that result has driven two decades of selective Nav1.7 blocker
    development. Repeated clinical programmes have nonetheless failed to
    reproduce the genetic phenotype pharmacologically. Whether the gap reflects
    incomplete channel occupancy, a developmental component of the congenital
    phenotype that acute blockade cannot recapitulate, or a contribution from
    opioid-peptide upregulation that accompanies lifelong Nav1.7 loss is
    unresolved. Curators should not treat the genetic evidence at this node as
    evidence that Nav1.7 blockade is an effective analgesic strategy.
  proposed_experiments:
  - experiment_id: nav17_occupancy_analgesia_study
    name: Target-occupancy-anchored trial of selective Nav1.7 blockade
    description: >-
      A human study pairing a validated measure of Nav1.7 target occupancy with
      quantitative sensory testing, to establish whether the failures to date
      reflect insufficient occupancy or a genuine dissociation between congenital
      loss and acute pharmacological block.

name: Hedgehog Pathway Activation Module
description: >-
  A conserved oncogenic mechanism module representing ligand-independent,
  constitutive activation of Hedgehog (Hh) signaling. Across Hedgehog-driven
  neoplasms, a genetic lesion removes the pathway's tonic restraint and locks
  the SMO-GLI axis in the "on" state: either loss-of-function of a negative
  regulator (the tumor suppressors PTCH1, PTCH2, or SUFU) or gain-of-function
  of the positive transducer SMO. Both gene-level directions converge on the
  same net effect - constitutive Smoothened activity and constitutive GLI
  transcriptional output - which drives Hedgehog-dependent proliferation and
  tumorigenesis. This module captures the shared causal chain and defines the
  mechanism-of-action pattern for SMO inhibitors (vismodegib, sonidegib):
  conforming disorder nodes declare conformance via conforms_to, and their
  SMO-inhibitor treatments link back through target_mechanisms to the
  "Constitutive Smoothened Activity" node they inhibit.

  This is deliberately the GAIN-of-pathway-activity arm of Hedgehog biology.
  It is the mechanistic INVERSE of the developmental Hedgehog LOSS-of-function
  disorders (holoprosencephaly, GLI3-repressor syndromes, and the ciliary
  transduction failures), where reduced Hh signal output causes malformation
  rather than cancer. Those loss-of-signal disorders are modeled separately
  (see ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction and
  limb_digit_patterning_serial_homology); this module intentionally does NOT
  fold the two opposite directions into one effect-reversing chain, mirroring
  the deliberate split between cellular_senescence and
  senescence_tumor_suppression.
category: Module
creation_date: "2026-07-06T01:54:06Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "hedgehog_pathway_activation#Constitutive Smoothened Activity"). Key
  conformance / treatment target: "Constitutive Smoothened Activity" - the
  node bound by the approved SMO antagonists. The "Constitutive GLI
  Transcriptional Output" node is the SMO-independent convergence point:
  SUFU loss and GLI2 amplification activate the pathway downstream of SMO,
  which is why SUFU-driven disease and acquired SMO-inhibitor resistance
  bypass the drug target. Worked conformers: Basal_Cell_Carcinoma (PTCH1
  loss / SMO gain-of-function), Gorlin_Syndrome and its
  PTCH1-related / SUFU-related NBCCS entries, and
  Medulloblastoma_SHH_Activated. GENE-LEVEL DIRECTION: annotate
  tumor-suppressor lesions (PTCH1/PTCH2/SUFU) as LOSS_OF_FUNCTION and SMO
  lesions as GAIN_OF_FUNCTION on the conforming disorder node's
  genetic_context.functional_impact_category; the PATHWAY-LEVEL direction is
  activation in every case.
pathophysiology:
- name: Loss of Hedgehog Pathway Negative Regulation
  description: >-
    In the resting state, the transmembrane receptor PTCH1 (and its paralog
    PTCH2) tonically suppresses Smoothened (SMO), and SUFU sequesters GLI
    transcription factors in the cytoplasm. Constitutive Hedgehog activation
    begins when this restraint is removed by one of two mechanistically opposite
    but convergent lesions: loss-of-function of a negative regulator
    (biallelic/Knudson two-hit inactivation of the tumor suppressors PTCH1,
    PTCH2, or SUFU) OR gain-of-function of the positive transducer SMO
    (activating mutation). Conforming disorder nodes substitute the
    tumor-type-specific driver and record the gene-level direction
    (functional_impact_category = LOSS_OF_FUNCTION for PTCH1/PTCH2/SUFU,
    GAIN_OF_FUNCTION for SMO); either way the net pathway-level consequence is
    activation.
  role: trigger
  biological_processes:
  - preferred_term: negative regulation of smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0045879
      label: negative regulation of smoothened signaling pathway
  evidence:
  - reference: PMID:37947611
    reference_title: "Signaling Pathways and Therapeutic Strategies in Advanced Basal Cell Carcinoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Approximately, 85% of sporadic BCCs carry mutations in Hedgehog pathway genes, especially in PTCH, SUFU and SMO genes, which lead to the aberrant activation of GLI transcriptional factors, typically silent in cells of adult individuals."
    explanation: >-
      Establishes that PTCH, SUFU, and SMO lesions are the recurrent upstream
      events that release Hedgehog pathway restraint and drive aberrant GLI
      activation across Hedgehog-driven tumors. Evidence source is OTHER because
      this is a review article.
  downstream:
  - target: Constitutive Smoothened Activity
    description: >-
      Loss of PTCH-mediated inhibition (or an activating SMO mutation) releases
      Smoothened into a constitutively active state at the primary cilium. The
      SUFU-loss branch bypasses this node and activates GLI directly downstream.
    causal_link_type: DIRECT
  - target: Constitutive GLI Transcriptional Output
    description: >-
      SUFU loss acts downstream of SMO, directly derepressing GLI and activating
      the pathway independently of Smoothened.
    causal_link_type: DIRECT
- name: Constitutive Smoothened Activity
  description: >-
    Freed from PTCH restraint (or rendered constitutively active by mutation),
    SMO accumulates in the primary ciliary membrane and transduces Hedgehog
    signal ligand-independently. This SMO-active state is the direct molecular
    target of the approved Hedgehog-pathway inhibitors vismodegib and sonidegib,
    which bind SMO and restore its inhibited conformation. Lesions acting
    downstream of SMO (SUFU loss, GLI2 amplification) leave this node bypassed
    and predict limited SMO-inhibitor efficacy.
  role: central_effector
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:22670904
    reference_title: "Inhibiting the hedgehog pathway in patients with the basal-cell nevus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysregulated hedgehog signaling is the pivotal molecular abnormality underlying basal-cell carcinomas. Vismodegib is a new orally administered hedgehog-pathway inhibitor that produces objective responses in locally advanced and metastatic basal-cell carcinomas."
    explanation: >-
      Identifies dysregulated Hedgehog signaling (acting at SMO) as the pivotal
      molecular abnormality and establishes SMO as the druggable point of
      intervention targeted by vismodegib.
  downstream:
  - target: Constitutive GLI Transcriptional Output
    description: >-
      Constitutively active SMO drives nuclear accumulation of GLI1/GLI2 and
      loss of the GLI3 repressor, activating Hedgehog target transcription.
    causal_link_type: DIRECT
- name: Constitutive GLI Transcriptional Output
  description: >-
    Both PTCH loss (via SMO derepression) and SUFU loss (via direct release of
    GLI sequestration), as well as GLI2 amplification, converge on constitutive
    nuclear GLI1/GLI2 activity. GLI transcriptionally activates pro-proliferative
    and pro-survival targets (CCND1, MYCN, BCL2) and drives a positive-feedback
    loop by inducing PTCH1 and GLI1. Because this node sits below the SMO drug
    target, it is the SMO-independent convergence point that underlies both
    SUFU-driven disease and acquired resistance to SMO inhibitors, motivating
    direct GLI-directed strategies.
  role: effector
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:35489737
    reference_title: "Molecular Stratification of Medulloblastoma: Clinical Outcomes and Therapeutic Interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SHH tumors contain mutations and alterations in GLI1, GLI2, SUFU, and PTCH1 genes, which constitutively activate the SHH pathway."
    explanation: >-
      Confirms that GLI1/GLI2/SUFU/PTCH1 lesions converge on constitutive GLI
      transcriptional activation as the shared molecular endpoint of Hedgehog
      pathway activation.
  - reference: PMID:31036756
    reference_title: "Genomic testing, tumor microenvironment and targeted therapy of Hedgehog-related human cancers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Resistance to SMO inhibitors is caused by acquired SMO mutations, SUFU deletions, GLI2 amplification, other by-passing mechanisms of GLI activation and WNT/β-catenin signaling activation."
    explanation: >-
      Documents the downstream-of-SMO bypass mechanisms (SUFU deletion, GLI2
      amplification) that sustain constitutive GLI output despite SMO blockade,
      supporting this node as the SMO-independent convergence point. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Hedgehog-Driven Proliferation and Tumorigenesis
    description: >-
      GLI target-gene transcription drives cell-cycle entry and sustained
      proliferation of the Hedgehog-responsive cell of origin.
    causal_link_type: DIRECT
- name: Hedgehog-Driven Proliferation and Tumorigenesis
  description: >-
    Constitutive GLI activity reactivates a developmental Hedgehog proliferative
    program in the tissue's Hedgehog-responsive progenitor (e.g., epidermal basal
    cells in basal cell carcinoma, cerebellar granule neuron precursors in
    SHH-activated medulloblastoma), producing unchecked proliferation and tumor
    formation. Conforming disorder nodes substitute the tumor-type-specific cell
    of origin.
  role: consequence
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:10027293
    reference_title: "Control of neuronal precursor proliferation in the cerebellum by Sonic Hedgehog."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment of GCPs with Shh prevents differentiation and induces a potent, long-lasting proliferative response."
    explanation: >-
      Foundational evidence that Hedgehog signaling drives a potent proliferative
      response in a Hedgehog-responsive progenitor, the developmental program
      hijacked by constitutive pathway activation in Hedgehog-driven tumors.
      Evidence source is MODEL_ORGANISM (mouse cerebellar granule cell
      precursors).
treatments:
- name: SMO Inhibitor (Vismodegib / Sonidegib)
  description: >-
    Small-molecule Smoothened antagonists that bind SMO and restore its
    inhibited conformation, blocking constitutive Hedgehog pathway output. This
    is the shared mechanism-of-action pattern for Hedgehog-driven tumors whose
    activating lesion lies at or upstream of SMO (PTCH loss, activating SMO
    mutation). Efficacy is limited where the lesion is downstream of SMO (SUFU
    loss, GLI2 amplification) or where resistance mutations bypass the drug
    target.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Constitutive Smoothened Activity
    treatment_effect: INHIBITS
    description: >-
      Vismodegib and sonidegib bind SMO and restore its inhibited conformation,
      abrogating constitutive Smoothened activity and downstream GLI output in
      PTCH-driven and SMO-mutant Hedgehog disease.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: vismodegib
      term:
        id: CHEBI:66903
        label: vismodegib
    - preferred_term: sonidegib
      term:
        id: CHEBI:90863
        label: sonidegib
  evidence:
  - reference: PMID:22670904
    reference_title: "Inhibiting the hedgehog pathway in patients with the basal-cell nevus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vismodegib reduces the basal-cell carcinoma tumor burden and blocks growth of new basal-cell carcinomas in patients with the basal-cell nevus syndrome."
    explanation: >-
      Randomized controlled trial evidence that SMO inhibition reduces
      Hedgehog-driven tumor burden, establishing the SMO-antagonist
      mechanism-of-action pattern this module defines.

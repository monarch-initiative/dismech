name: Xenobiotic Oxidative Phosphorylation Blockade Module
category: Module
creation_date: "2026-10-08T00:00:00Z"
module_categories:
- TOXICOLOGY
- PHARMACOLOGY
- METABOLISM
description: >-
  A conserved bioenergetic mechanism module for acute chemical poisoning of
  mitochondrial ATP synthesis, the pathway classically called histotoxic hypoxia
  or cellular asphyxia. A xenobiotic blocks a step that oxidative
  phosphorylation requires, and the entry point varies: inhibition of the
  terminal oxidase (cyanide and carbon monoxide at cytochrome c oxidase, formate
  from methanol or formaldehyde at the same site), inhibition of an upstream
  respiratory complex (diglycolic acid from diethylene glycol at complex II), or
  arrest of mitochondrial translation so that chain subunits are not replaced
  (chloramphenicol at the mitochondrial ribosome). Whichever step is hit, the
  cell can no longer phosphorylate ADP even though oxygen continues to arrive,
  so the chain converges on ATP depletion with oxygen delivery intact. From
  there it splits three ways: a compensatory shift to anaerobic glycolysis that
  produces lactic acidosis with a raised anion gap, secondary mitochondrial
  oxidative stress, and energy failure of the tissues with the highest oxidative
  demand, the brain and the myocardium. The two branches reconverge on necrosis
  of deep grey matter and of myocardium. The key conformance target is `Cellular
  ATP Depletion despite Preserved Oxygen Delivery`, the disorder-agnostic
  rate-limiting step every conformer funnels through regardless of which
  respiratory step the agent hit. The drug-target pattern is antidotal: an
  antidote that scavenges or displaces the inhibitor acts on the trigger node
  rather than on any downstream consequence, which is why hydroxocobalamin and
  high-concentration oxygen are modelled here with `treatment_effect: INHIBITS`
  against the trigger. This module is the acquired, chemically initiated
  counterpart of `complex_i_deficiency` and `complex_iv_assembly_deficiency`,
  which reach a bioenergetic deficit through a germline assembly or subunit
  defect, and it is distinct from `mitochondrial_dysfunction`, which is the
  aging hallmark of progressive mtDNA damage and failing mitophagy rather than
  an acute block of an otherwise intact chain. It is complementary to
  `glutamate_excitotoxicity`, which takes over downstream of cerebral energy
  failure, and to the organ-scoped `drug_induced_nephrotoxicity` and
  `drug_induced_liver_injury`; a conforming entry may legitimately declare this
  module alongside any of those.
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  "Xenobiotic Oxidative Phosphorylation Blockade" Disease entry. Disorder
  entries reference individual nodes via conforms_to, for example
  "xenobiotic_oxidative_phosphorylation_blockade#Cellular ATP Depletion despite
  Preserved Oxygen Delivery". Conforming nodes substitute the specific
  xenobiotic, the respiratory step it blocks, and the tissue in which the
  bioenergetic failure is expressed.

  Scope: the agent must act on mitochondrial ATP synthesis itself. A poison that
  starves tissue of oxygen before it reaches the mitochondrion belongs
  elsewhere, even though the endpoint looks the same. Carbon monoxide is the
  instructive case, because it does both: carboxyhemoglobin formation impairs
  oxygen delivery, which is a separate upstream mechanism, while a distinct and
  separately measured fraction of its toxicity is direct inhibition of
  cytochrome c oxidase. Only the latter arm is in scope here, so the carbon
  monoxide entry conforms at the respiratory-inhibition node and keeps its
  oxygen-delivery nodes outside this module.

  The blocked step is deliberately not fixed at the trigger node. Terminal
  oxidase inhibition, inhibition of an upstream complex, and arrest of
  mitochondrial protein synthesis are different lesions that converge on the
  same ATP deficit, and all three are in scope; the node descriptions and the
  conforming entry carry which one applies. Uncoupling is a fourth recognized
  route into the same deficit and is named in the general pharmacology cited at
  the trigger node, but no dismech entry currently models an uncoupler as its
  primary mechanism, so no conformer exercises that arm yet.

  The phrase "despite Preserved Oxygen Delivery" in the central effector names
  the feature that distinguishes this pathway from ischaemic or hypoxaemic
  energy failure, and it is a statement about the mechanism rather than a
  promise about any individual patient. A poisoned patient may be
  simultaneously hypotensive or hypoxaemic from another cause, and in carbon
  monoxide poisoning impaired delivery genuinely coexists. Read the node as
  asserting that a block of the respiratory chain is sufficient to produce the
  ATP deficit without any reduction in oxygen supply.

  Lactate is placed as an amplifier rather than a bare readout because the
  acidosis feeds back on the mechanism. The methanol observational series cited
  there reports formate rising well before lactate and describes the result as a
  self-enhancing acidotic circle, so the glycolytic shift is modelled as acting
  on, and not merely reporting, the downstream tissue injury.

  Curation note: this module was factored out of six independently curated
  entries that had each written a near-identical chain, found by reading
  pathophysiology node chains rather than by shared ontology terms, which for
  this mechanism are too generic to cluster on. See dismech issue for the
  toxicology module gap analysis.
pathophysiology:
- name: Xenobiotic Blockade of Mitochondrial Respiration
  description: >-
    A drug or toxin blocks a step that oxidative phosphorylation requires. The
    lesion may be inhibition of the terminal oxidase, as with cyanide, carbon
    monoxide, or the formate generated from methanol and from formaldehyde, all
    of which act at cytochrome c oxidase; inhibition of an upstream respiratory
    complex, as with the diglycolic acid generated from diethylene glycol at
    complex II; or arrest of mitochondrial translation so that short-lived
    respiratory-chain subunits are not replaced, as with chloramphenicol at the
    mitochondrial ribosome. These are chemically unrelated lesions at different
    points of the same pathway, and the module treats them as alternative
    entry points rather than as separate mechanisms.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
    modifier: DECREASED
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16863431
    reference_title: Drug-induced mitochondrial toxicity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Drugs that injure mitochondria usually do so by inhibiting respiratory
      complexes of the electron chain; inhibiting or uncoupling oxidative
      phosphorylation; inducing mitochondrial oxidative stress; or inhibiting
      DNA replication, transcription or translation.
    explanation: >-
      Review of drug-induced mitochondrial toxicity; no primary experimental
      system. Establishes that chemically distinct agents enter the same
      bioenergetic pathway at several different steps, which is the claim this
      trigger node makes in treating terminal-oxidase inhibition, upstream
      complex inhibition, and translational arrest as alternative entry points.
  - reference: PMID:17906319
    reference_title: "Interaction of cyanide and nitric oxide with cytochrome c oxidase: implications for acute cyanide toxicity."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Acute cyanide toxicity is attributed to inhibition of cytochrome c oxidase
      (CcOX), the oxygen-reducing component of mitochondrial electron transport
    explanation: >-
      Isolated mitochondria and cell-based measurements of cytochrome c oxidase
      activity. Documents the terminal-oxidase arm of this node, in which the
      agent inhibits the oxygen-reducing step of the respiratory chain directly.
  - reference: PMID:9584335
    reference_title: Mitochondrial cytochrome c oxidase inhibition during acute carbon monoxide poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cytochrome c oxidase (complex IV) activity showed a 76% inhibition
      compared to controls during acute poisoning
    explanation: >-
      Complex IV activity assayed in patients during and after acute poisoning.
      Shows terminal-oxidase inhibition as a measured finding in poisoned
      humans, not only in isolated preparations, and quantifies the degree of
      blockade at this node.
  - reference: PMID:27002734
    reference_title: Diglycolic acid, the toxic metabolite of diethylene glycol, chelates calcium and produces renal mitochondrial dysfunction in vitro.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      DGA inhibited Complex II activity without altering Complex I, III or IV
      activities.
    explanation: >-
      Respiratory complex activities assayed in human proximal tubule cells.
      Documents the upstream-complex arm of this node and shows the blockade can
      be selective for a single complex well before the terminal oxidase, which
      is why the node is not written as oxidase inhibition alone.
  - reference: PMID:23118672
    reference_title: "Chloramphenicol toxicity revisited: a 12-year-old patient with a brain abscess."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      This binding inhibits the mitochondrial enzyme peptidyl transferase, which
      is necessary for peptide bond formation.
    explanation: >-
      Case report with review; the quoted statement is the mechanistic review
      component rather than a measurement in the patient. Documents the
      translational-arrest arm of this node, in which the agent does not bind a
      respiratory complex at all but stops the mitochondrion replacing its
      subunits.
  downstream:
  - target: Cellular ATP Depletion despite Preserved Oxygen Delivery
    causal_link_type: DIRECT
    description: >-
      Blocking any required step of oxidative phosphorylation stops ADP being
      phosphorylated, so cellular ATP falls while oxygen supply is unchanged.
- name: Cellular ATP Depletion despite Preserved Oxygen Delivery
  description: >-
    With a required step of the respiratory chain blocked, the cell cannot
    phosphorylate ADP even though oxygen continues to reach the mitochondrion.
    This is the rate-limiting, disorder-agnostic step of the module and the key
    conformance target: every conforming entry funnels through it whichever
    respiratory step its agent hit. The preserved oxygen supply is what
    separates this pathway from ischaemic and hypoxaemic energy failure, and it
    is the reason poisoned tissue can be bioenergetically starved while arterial
    oxygenation looks adequate.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: ATP biosynthetic process
    term:
      id: GO:0006754
      label: ATP biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:25692407
    reference_title: Protection from cyanide-induced brain injury by the Nrf2 transcriptional activator carnosic acid.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      cyanide inhibits cytochrome c oxidase, thus blocking electron transport in
      the mitochondrial respiratory chain and disrupting oxidative
      phosphorylation
    explanation: >-
      Rodent neuroprotection study; the quoted sentence is the mechanistic
      framing rather than a result of the experiments reported. States the step
      from a blocked chain to disrupted oxidative phosphorylation, which is the
      transition this node represents.
  - reference: PMID:37465777
    reference_title: Cyanide Poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      it blocks the cells from utilizing oxygen by binding to the cytochrome
      oxidase in the mitochondria
    explanation: >-
      Clinical toxicology review; no primary experimental system. Supports the
      defining feature of this node, that the defect is an inability to use
      oxygen rather than a shortage of it, which is what distinguishes this
      pathway from ischaemic energy failure.
  - reference: PMID:21856646
    reference_title: Diglycolic acid is the nephrotoxic metabolite in diethylene glycol poisoning inducing necrosis in human proximal tubule cells in vitro.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      DGA induced necrosis, not apoptosis, as corroborated by severe depletion
      of cellular adenosine triphosphate levels.
    explanation: >-
      Human proximal tubule cells in culture with direct ATP measurement.
      Measures the ATP deficit this node asserts and ties it to necrotic rather
      than apoptotic death, which is the mode of death an acute energy failure
      produces.
  - reference: PMID:36754214
    reference_title: Diglycolic acid inhibits succinate dehydrogenase activity, depletes mitochondrial membrane potential, and induces inflammation in an SH-SY5Y neuroblastoma model of neurotoxicity in vitro.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      complex II inhibition leading to mitochondrial depolarization, and
      subsequent ATP depletion
    explanation: >-
      Neuronal cell line with complex II activity, membrane potential, and ATP
      all measured in the same system. Traces the whole trigger-to-central-effector
      transition in one experiment, which is why it is cited at both nodes.
  - reference: PMID:41602900
    reference_title: "Chloramphenicol-induced gray baby syndrome: case report and review of current literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Chloramphenicol overdose inhibits mitochondrial protein synthesis, which
      disrupts oxidative phosphorylation and causes cellular necrosis.
    explanation: >-
      Case report with literature review; the quoted sentence is the review
      component. Shows that the translational-arrest entry point reaches the
      same disrupted oxidative phosphorylation as the direct chain inhibitors,
      which is what makes this node the shared convergence step.
  downstream:
  - target: Anaerobic Glycolytic Shift with Lactic Acidosis
    causal_link_type: DIRECT
    description: >-
      Deprived of oxidative ATP, the cell meets its demand by glycolysis, which
      regenerates NAD+ by reducing pyruvate to lactate.
  - target: Secondary Mitochondrial Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      A blocked chain with a collapsing membrane potential leaks reactive oxygen
      species, adding an oxidative insult to the energy deficit.
  - target: Energy Failure of High Oxidative-Demand Tissue
    causal_link_type: DIRECT
    description: >-
      Tissues that cannot meet their ATP demand glycolytically fail first, which
      selects the brain and the myocardium.
- name: Anaerobic Glycolytic Shift with Lactic Acidosis
  description: >-
    Unable to phosphorylate ADP oxidatively, cells raise glycolytic flux and
    regenerate NAD+ by reducing pyruvate to lactate. Lactate accumulates and
    produces a metabolic acidosis with a raised anion gap, which is the
    laboratory signature of this pathway and a widely used severity marker. The
    acidosis is modelled as an amplifier rather than as a bare readout because
    the fall in pH worsens the toxicity that produced it, a feedback described
    in methanol poisoning as a self-enhancing acidotic circle.
  role: amplifier
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: INCREASED
  evidence:
  - reference: PMID:29923671
    reference_title: "The Hypothesis of Circulus Hypoxicus and Its Clinical Relevance in Patients With Methanol Poisoning - An Observational Study of 35 Patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      most likely caused by formate inhibition of mitochondrial respiration
      (type B lactacidosis)
    explanation: >-
      Observational study of 35 poisoned patients with serial formate, lactate,
      and blood gas measurements. Attributes the rising lactate to inhibition of
      mitochondrial respiration rather than to circulatory failure, which is
      precisely the causal direction this node asserts.
  - reference: PMID:29923671
    reference_title: "The Hypothesis of Circulus Hypoxicus and Its Clinical Relevance in Patients With Methanol Poisoning - An Observational Study of 35 Patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-lactate and S-formate correlated better with the increased base deficit
      and anion gap than did S-formate alone.
    explanation: >-
      Same patient series. Ties the accumulating lactate specifically to the
      raised anion gap, which is the laboratory signature this node is written
      around, and shows lactate contributes to it beyond the toxic acid itself.
  - reference: PMID:12352039
    reference_title: Value of lactic acidosis in the assessment of the severity of acute cyanide poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was a significant correlation between plasma lactate and blood
      cyanide concentrations
    explanation: >-
      Clinical series correlating plasma lactate with measured blood toxin
      concentration. Shows the glycolytic shift scales with the dose of the
      respiratory inhibitor, supporting lactate as a readout of the blockade
      rather than an incidental finding.
  - reference: PMID:8989894
    reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated plasma lactate, associated with cardiovascular collapse, should
      suggest cyanide intoxication.
    explanation: >-
      Clinical review of the poisoning syndrome. Records the lactate rise and
      circulatory failure as the recognized bedside presentation of this
      pathway, linking this amplifier node to the downstream tissue failure.
  - reference: PMID:27180631
    reference_title: Approach to the Treatment of Methanol Intoxication.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Its adverse effects are due primarily to the impact of its major
      metabolite formic acid and lactic acid resulting from cellular hypoxia.
    explanation: >-
      Clinical review; no primary experimental system. Graded INDIRECT because
      the quoted sentence attributes harm to the two acids together without
      separating the glycolytic contribution, so it supports this node by
      inference from the combined claim rather than asserting it alone.
  downstream:
  - target: Energy Failure of High Oxidative-Demand Tissue
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic acidosis depresses myocardial contractility and vascular tone and
      increases the intracellular delivery of diffusible toxic acids, worsening
      the energy failure that produced it.
- name: Secondary Mitochondrial Oxidative Stress
  description: >-
    A blocked respiratory chain with a falling membrane potential leaks reactive
    oxygen species, so an oxidative insult is superimposed on the energy
    deficit. This arm explains injury that continues, and in some agents
    worsens, after the inhibitor itself has been cleared, and it is the step at
    which lipid peroxidation and the delayed inflammatory component of these
    poisonings are generated.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:26386112
    reference_title: Drug-induced mitochondrial dysfunction and cardiotoxicity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The final phase of mitochondrial dysfunction induces loss of mitochondrial
      membrane potential and an increase in mitochondrial oxidative/nitrative
      stress, eventually culminating into cell death.
    explanation: >-
      Review of drug-induced mitochondrial cardiotoxicity; no primary
      experimental system. States the sequence this node represents, from lost
      membrane potential to mitochondrial oxidative stress to cell death, as a
      general consequence of chemically impaired mitochondrial function.
  - reference: PMID:24773392
    reference_title: "The role of reactive oxygen species and oxidative stress in carbon monoxide toxicity: an in-depth analysis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      the oxidative injury induced by reactive oxygen species, free radicals,
      and neuronal nitric oxide
    explanation: >-
      Review of oxidative mechanisms in one exemplar poisoning; no primary
      experimental system. Supports treating reactive oxygen species as a
      substantive injury arm in its own right rather than as a by-product, which
      is why this is modelled as an amplifier node and not a readout.
  downstream:
  - target: Selective Deep Grey Matter and Myocardial Necrosis
    causal_link_type: DIRECT
    description: >-
      Oxidative injury adds to the bioenergetic lesion in the same vulnerable
      tissue, and accounts for injury progressing after the inhibitor is cleared.
- name: Energy Failure of High Oxidative-Demand Tissue
  description: >-
    Tissues differ in how much of their ATP demand they can meet
    glycolytically, so a uniform systemic block of oxidative phosphorylation
    produces a strikingly selective injury. The myocardium and the brain, which
    combine high continuous ATP demand with little anaerobic reserve, fail
    first; within the brain the deep grey nuclei are the most vulnerable.
    Conforming entries substitute the organ in which their agent's failure is
    clinically expressed.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:27753502
    reference_title: "Carbon Monoxide Poisoning: Pathogenesis, Management, and Future Directions of Therapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      cellular mitochondrial respiration, cellular energy utilization,
      inflammation, and free radical generation, especially in the brain and
      heart
    explanation: >-
      Review of the poisoning's pathogenesis; no primary experimental system.
      Names the two organs this node selects and attributes their involvement to
      impaired mitochondrial respiration and energy utilization, which is the
      organ-selection claim the node makes.
  - reference: PMID:26386112
    reference_title: Drug-induced mitochondrial dysfunction and cardiotoxicity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      deterioration in mitochondrial function eventually leads to cardiomyocyte
      and endothelial cell death and consequent cardiovascular dysfunction
    explanation: >-
      Review of drug-induced mitochondrial cardiotoxicity; no primary
      experimental system. Supports the myocardial arm of this node, from
      impaired mitochondrial function to cardiomyocyte death to circulatory
      failure.
  downstream:
  - target: Selective Deep Grey Matter and Myocardial Necrosis
    causal_link_type: DIRECT
    description: >-
      Sustained failure to meet ATP demand kills the most vulnerable tissue,
      producing necrosis rather than the reversible dysfunction of a brief block.
- name: Selective Deep Grey Matter and Myocardial Necrosis
  description: >-
    The outcome of the module: necrosis concentrated in the deep grey nuclei of
    the brain and in the myocardium, with the remainder of the organ relatively
    spared. In survivors the pallidal and putaminal lesions underlie the delayed
    movement disorders and neuropsychiatric sequelae that follow these
    poisonings by days to weeks, while myocardial involvement presents acutely
    as circulatory failure. The anatomical pattern is the fingerprint of this
    mechanism, and it is shared across chemically unrelated agents, which is the
    strongest single argument that they are one pathway.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  locations:
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:12223384
    reference_title: MR changes after acute cyanide intoxication.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The toxicity of cyanide causes damage, primarily to the basal ganglia
    explanation: >-
      Serial MR imaging after a documented human poisoning. Establishes the
      anatomical selectivity this node asserts for a terminal-oxidase inhibitor.
  - reference: PMID:36377024
    reference_title: Importance of Susceptibility-weighted-imaging in Methanol Toxicity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haemorrhagic necrosis of bilateral basal ganglia, particularly of the
      putamen, is one of the distinctive features of this entity.
    explanation: >-
      Human imaging report. Shows the same deep grey matter necrosis after a
      chemically unrelated agent whose inhibitor is a generated metabolite,
      which is the cross-agent convergence that justifies this shared node.
  - reference: PMID:26563790
    reference_title: Carbon monoxide intoxication.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      abnormalities in the globus pallidus are most commonly seen on MRI
      following CO exposure
    explanation: >-
      Clinical review of imaging findings; no primary experimental system. Adds
      a third unrelated agent with the same deep grey matter target, and names
      the specific nucleus most often affected.
  - reference: PMID:16863431
    reference_title: Drug-induced mitochondrial toxicity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Disruption of mitochondrial function by drugs can result in cell death by
      necrosis or can signal cell death by apoptosis
    explanation: >-
      Review of drug-induced mitochondrial toxicity; no primary experimental
      system. Graded INDIRECT because it establishes necrosis as the general
      outcome of chemically disrupted mitochondrial function without addressing
      the anatomical selectivity that this node is mainly about.
treatments:
- name: Antidotal Scavenging of the Respiratory-Chain Inhibitor (Hydroxocobalamin)
  description: >-
    Hydroxocobalamin binds cyanide directly, forming cyanocobalamin, and so
    lowers the concentration of free inhibitor available to cytochrome c
    oxidase. It is included here because it is the clearest worked example of
    this module's drug-target design pattern: an effective antidote acts on the
    trigger node, removing or displacing the inhibitor, rather than on any
    downstream consequence. Treating the acidosis or supporting the circulation
    addresses a consequence and does not restore oxidative phosphorylation.
    Conforming entries substitute their own agent at the same point in the
    chain, for example high-concentration oxygen displacing carbon monoxide from
    cytochrome c oxidase, or fomepizole preventing generation of the inhibitory
    metabolite in the first place.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Xenobiotic Blockade of Mitochondrial Respiration
    treatment_effect: INHIBITS
    description: >-
      Scavenging free inhibitor relieves the blockade at its source, which is
      the only point in this chain at which oxidative phosphorylation can be
      restored rather than compensated.
    evidence:
    - reference: PMID:8989894
      reference_title: "Acute cyanide poisoning: clinical spectrum, diagnosis, and treatment."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hydroxocobalamin is an attractive antidote due to its rapid cyanide
        binding and its lack of serious side-effects
      explanation: >-
        Clinical review of the poisoning and its antidotes. States the mechanism
        of action as direct binding of the inhibitor, which is what makes this a
        trigger-node intervention rather than supportive care.
  evidence:
  - reference: PMID:17543660
    reference_title: Hydroxocobalamin for severe acute cyanide poisoning by ingestion or inhalation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      That 71% of patients survived after treatment with hydroxocobalamin
      suggests that hydroxocobalamin as first-line antidotal therapy is
      effective and safe in acute cyanide poisoning.
    explanation: >-
      Clinical case series of severe poisonings treated with the antidote.
      Supports clinical efficacy of the trigger-node intervention, as distinct
      from the mechanistic claim carried on the target_mechanisms link.

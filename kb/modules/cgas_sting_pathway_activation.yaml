      The Syn-STING vaccine elicits robust adaptive responses and Th1-biased T
      cell immunity.
    explanation: >-
      Confirms the Th1 rather than Th2 polarization of the adaptive response
      generated through this arm, which is the property that makes STING
      attractive as a cancer vaccine adjuvant. Evidence source is
      MODEL_ORGANISM (mouse vaccination and tumor models).

- name: Chronic Type I Interferon-Driven Tissue Inflammation
  description: >-
    When the central effector runs constitutively rather than transiently,
    sustained type I interferon and interferon-stimulated gene expression become
    the disease. The clinical expression is organ-specific and set by which
    tissues signal: small-vessel and acral vasculopathy with endothelial
    activation and apoptosis, interstitial lung disease and pulmonary fibrosis,
    inflammatory arthritis, and, where the brain is involved, a calcifying
    encephalopathy with leukodystrophy. The shared laboratory readout is a
    peripheral blood interferon signature, which is necessary but not sufficient
    to place a disorder in this module.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:25029335
    reference_title: "Activated STING in a vascular and pulmonary syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STING-associated vasculopathy with onset in infancy (SAVI) is an
      autoinflammatory disease caused by gain-of-function mutations in TMEM173.
    explanation: >-
      Establishes a human disease whose entire phenotype is produced by
      constitutive activity of this axis. Evidence source is HUMAN_CLINICAL (six
      patients with clinical, immunologic and genetic characterization).
  - reference: PMID:32725128
    reference_title: "Mutations in COPA lead to abnormal trafficking of STING to the Golgi and interferon signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed elevated levels of ISGs and IFN-α in blood of symptomatic COPA
      patients.
    explanation: >-
      Confirms the interferon-driven inflammatory phenotype in patients whose
      lesion is in STING trafficking rather than in STING itself. Evidence
      source is HUMAN_CLINICAL (symptomatic patient blood).
  - reference: PMID:26223655
    reference_title: "Cutting Edge: cGAS Is Required for Lethal Autoimmune Disease in the Trex1-Deficient Mouse Model of Aicardi-Goutières Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Trex1 (-/-) mice develop lethal, IFN-driven autoimmune disease that is
      dependent on activation of the ISD pathway
    explanation: >-
      Shows that the chronic inflammatory outcome is pathway-dependent and not
      merely correlated with it. Evidence source is MODEL_ORGANISM (Trex1-null
      mice).

- name: Signal-Strength-Dependent Lymphocyte Apoptosis and Regulatory B Cell Induction
  description: >-
    STING is expressed as widely in lymphocytes as in myeloid cells, and in T
    cells the response is intensified: strong agonist exposure induces a
    distinct transcriptional program ending in apoptosis rather than activation.
    In B cells, agonist exposure drives differentiation of IL-35-producing and
    IL-10-producing regulatory B cells through an IRF3-dependent but type I
    interferon-independent route, which suppresses natural killer cell
    proliferation and blunts the antitumor response the therapy was intended to
    produce. This arm is why systemic, unrestricted STING agonism is
    self-limiting, and it is the mechanistic content behind the failure of
    agonist monotherapy in trials; it is not a route to disease in the
    interferonopathies, where cell-intrinsic constitutive signalling has a
    different tissue distribution.
  role: counter_regulatory
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: regulatory B cell
    term:
      id: CL:0000969
      label: regulatory B cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28874664
    reference_title: "Signalling strength determines proapoptotic functions of STING."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that T cells exhibit an intensified STING response, which
      leads to the expression of a distinct set of genes and results in the
      induction of apoptosis.
    explanation: >-
      Establishes the cell-type-dependent bifurcation of the same signal into
      activation or apoptosis, which is the mechanistic basis for this node.
      Evidence source is MODEL_ORGANISM (mouse primary and leukaemic T cells).
  - reference: PMID:36198789
    reference_title: "STING-induced regulatory B cells compromise NK function in cancer immunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the administration of five distinct STING agonists,
      including cGAMP, results in an expansion of human and mouse interleukin
      (IL)-35+ regulatory B cells in pancreatic cancer.
    explanation: >-
      Documents the regulatory B cell arm as a general consequence of agonist
      exposure rather than a property of one compound. Evidence source is
      MODEL_ORGANISM (preclinical cancer models with human and mouse B cells).
  - reference: PMID:36198789
    reference_title: "STING-induced regulatory B cells compromise NK function in cancer immunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings reveal an intrinsic barrier to systemic STING agonist
      monotherapy and provide a combinatorial strategy to overcome
      immunosuppression in tumours.
    explanation: >-
      States the therapeutic consequence this node exists to record: the
      counter-regulatory arm is intrinsic to systemic agonism, not an avoidable
      side effect of a particular agent. Evidence source is MODEL_ORGANISM.
  downstream:
  - target: Attenuated Antigen Expression and Blunted Adaptive Response
    causal_link_type: DIRECT
    description: >-
      Loss of responding lymphocytes and expansion of regulatory B cells
      subtract directly from the adaptive response the adjuvant was meant to
      generate.

- name: Suppression of Cap-Dependent mRNA Translation
  description: >-
    STING activation restrains cap-dependent protein synthesis at the level of
    translation initiation, by at least two routes: an interferon-dependent
    route requiring IFNAR1 and IRF9, in which interferon-stimulated gene
    products drive dephosphorylation of 4E-BP1 and so prevent eIF4F assembly and
    ribosomal loading; and a non-canonical route in which STING at the
    endoplasmic reticulum directly activates PERK, which phosphorylates
    eIF2-alpha, ahead of and independently of TBK1-IRF3. The effect is
    physiologic in antiviral defence, where it restricts production of viral
    proteins, and adverse in mRNA vaccination, where the antigen is itself an
    exogenous transcript that must be translated: a codelivered agonist
    therefore suppresses the antigen it is meant to adjuvant. Timing rather than
    dose is the operative variable, since translation is spared while the
    interferon response has not yet been induced.
  role: counter_regulatory
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: negative regulation of translational initiation
    term:
      id: GO:0045947
      label: negative regulation of translational initiation
    modifier: INCREASED
  evidence:
  - reference: PMID:29440426
    reference_title: "STING-dependent translation inhibition restricts RNA virus replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using vesicular stomatitis virus as a model, we identified a requirement
      of STING to inhibit translation during infection and upon transfection of
      synthetic RLR ligands. This inhibition occurs at the level of translation
      initiation and restricts the production of viral and host proteins.
    explanation: >-
      Establishes translational suppression as a genuine STING effector function
      acting at initiation, and shows it is separable from interferon
      transcription. Evidence source is IN_VITRO (infection and transfection of
      knockout cell lines).
  - reference: PMID:35501370
    reference_title: "A non-canonical cGAS-STING-PERK pathway facilitates the translational program critical for senescence and organ fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we identify the STING-PKR-like endoplasmic reticulum kinase
      (PERK)-eIF2α pathway, a previously unknown cGAS-STING mechanism, enabling
      an innate immunity control of cap-dependent messenger RNA translation.
    explanation: >-
      Documents the second, interferon-independent route to the same outcome,
      which matters because blocking interferon signalling does not necessarily
      restore translation. Evidence source is IN_VITRO.
  - reference: PMID:42618806
    reference_title: "Enhanced antitumor immunity of mRNA vaccines by bioorthogonal-like delayed activation of exogeneous STING."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The development of cGAS-STING (stimulator of interferon genes) agonists as
      mRNA vaccine adjuvants has been hampered by widespread STING expression
      and by the observation that codelivered STING agonists suppress antigen
      mRNA translation.
    explanation: >-
      States the applied consequence of this node for mRNA vaccine adjuvant
      design, which is the reason it is modelled separately from the lymphocyte
      arm. Evidence source is MODEL_ORGANISM (mouse and humanized STING mouse
      studies).
  downstream:
  - target: Attenuated Antigen Expression and Blunted Adaptive Response
    causal_link_type: DIRECT
    description: >-
      Reduced translation of the antigen-encoding transcript lowers the amount
      of antigen available for presentation.

- name: Attenuated Antigen Expression and Blunted Adaptive Response
  description: >-
    The two counter-regulatory arms converge: less antigen is made, and fewer
    lymphocytes survive to respond to it, so an agonist added to an mRNA or
    peptide vaccine can reduce rather than increase antigen-specific T cell
    output. This node is what a delivery strategy has to defeat, and it is
    defeated by separation in time and in space rather than by lowering the
    dose: releasing the agonist only after antigen has been translated, and
    confining pathway activation to antigen-presenting cells. It has no
    counterpart in the interferonopathies and should not be conformed to by a
    genetic disease entry.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: negative regulation of adaptive immune response
    term:
      id: GO:0002820
      label: negative regulation of adaptive immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:42618806
    reference_title: "Enhanced antitumor immunity of mRNA vaccines by bioorthogonal-like delayed activation of exogeneous STING."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intratumoral or subcutaneous LNPs are preferentially internalized by
      myeloid cells, preserving antigen expression fidelity, achieving localized
      STING activation in antigen-presenting cells and preventing systemic
      regulatory B cell differentiation and immunocyte apoptosis.
    explanation: >-
      Names both arms this node converges - antigen expression fidelity, and
      systemic regulatory B cell differentiation with immunocyte apoptosis - but
      states them as harms a spatially confined delivery strategy averts, not as
      a measured deficit in an unmodified agonist-adjuvanted vaccine. PARTIAL
      because the attenuated adaptive output is therefore inferred from what the
      strategy has to prevent rather than measured directly; the abstract's
      directly measured translational-suppression sentence is cited on
      Suppression of Cap-Dependent mRNA Translation instead. Evidence source is
      MODEL_ORGANISM.
treatments:
- name: STING Agonist Immunoadjuvant Therapy
  description: >-
    Pharmacologic agonists occupy the STING ligand-binding domain and switch the
    axis on deliberately, either intratumorally as an in situ vaccine or
    codelivered with a defined antigen as a vaccine adjuvant. Cyclic
    dinucleotides (2'3'-cGAMP and synthetic derivatives) and non-nucleotide
    agonists (MSA-2 for human STING, the flavonoid DMXAA for mouse STING) are
    the two chemotypes. This is the module's agonist drug-target pattern; it is
    a design pattern, not a treatment recommendation, and conforming disorder
    entries do not inherit it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 2'3'-cGAMP
      term:
        id: CHEBI:75947
        label: 2'-3'-cGAMP
    - preferred_term: MSA-2 (non-nucleotide human STING agonist)
      term:
        id: NCIT:C176586
        label: STING Agonist
    - preferred_term: DMXAA (vadimezan)
      term:
        id: CHEBI:75934
        label: vadimezan
  notes: >-
    MSA-2, the compound both evidence items on this treatment actually report,
    has no CHEBI or NCIT term of its own, so it is recorded against the NCIT
    drug-class term STING Agonist (NCIT:C176586) with the specific compound
    named in preferred_term. DMXAA (vadimezan) is retained because the module's
    HUMAN_MODEL_MISMATCH discussion is about it, but it is mouse-STING-selective
    and must not be read as the human-active agent; 2'3'-cGAMP is the endogenous
    cyclic-dinucleotide chemotype.
  target_mechanisms:
  - target: STING Oligomerization and ER-to-Golgi Translocation
    treatment_effect: ACTIVATES
    description: >-
      Agonists bind the STING ligand-binding domain directly, bypassing cGAS and
      driving the oligomerization and export step that licenses downstream
      signalling.
    evidence:
    - reference: PMID:32820094
      reference_title: "An orally available non-nucleotide STING agonist with antitumor activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Experimental and theoretical analyses showed that MSA-2 exists as
        interconverting monomers and dimers in solution, but only dimers bind
        and activate STING.
      explanation: >-
        Establishes direct binding to and activation of STING as the mechanism
        of a non-nucleotide agonist. Evidence source is MODEL_ORGANISM
        (syngeneic mouse tumor models with biochemical characterization).
  evidence:
  - reference: PMID:32820094
    reference_title: "An orally available non-nucleotide STING agonist with antitumor activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In syngeneic mouse tumor models, subcutaneous and oral MSA-2 regimens were
      well tolerated and stimulated interferon-β secretion in tumors, induced
      tumor regression with durable antitumor immunity, and synergized with
      anti-PD-1 therapy.
    explanation: >-
      Documents that agonist exposure produces the intended interferon and
      antitumor output in vivo. Evidence source is MODEL_ORGANISM.
- name: Janus Kinase Inhibition
  description: >-
    JAK1/JAK2 inhibitors (baricitinib, ruxolitinib) do not act on STING. They
    block signalling through the type I interferon receptor downstream of it,
    and so attenuate the chronic inflammatory consequence arm while leaving the
    constitutively active receptor in place. This is the clinically established
    treatment pattern for the STING-driven interferonopathies, and the
    therapeutic asymmetry is deliberate: no approved agent corrects the upstream
    lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baricitinib
      term:
        id: CHEBI:95341
        label: baricitinib
  target_mechanisms:
  - target: Chronic Type I Interferon-Driven Tissue Inflammation
    treatment_effect: INHIBITS
    description: >-
      JAK inhibition blocks interferon receptor signal transduction, reducing
      STAT1 phosphorylation and interferon-stimulated gene expression downstream
      of the constitutively active receptor.
    evidence:
    - reference: PMID:25029335
      reference_title: "Activated STING in a vascular and pulmonary syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Constitutive up-regulation of phosphorylated STAT1 in patients'
        lymphocytes was reduced by JAK inhibitors.
      explanation: >-
        Demonstrates that the downstream node, not the upstream lesion, is what
        JAK inhibition addresses in patient cells. Evidence source is
        HUMAN_CLINICAL (lymphocytes from affected children).
  evidence:
  - reference: PMID:25029335
    reference_title: "Activated STING in a vascular and pulmonary syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutant STING leads to increased phosphorylation of signal transducer and
      activator of transcription 1 (STAT1), so we tested the effect of Janus
      kinase (JAK) inhibitors on STAT1 phosphorylation in lymphocytes from the
      affected children and controls.
    explanation: >-
      Records the rationale for targeting the interferon receptor arm in a
      disease whose lesion is upstream of it. Evidence source is HUMAN_CLINICAL.
discussions:
- discussion_id: human_model_mismatch_sting_agonist_species_specificity
  prompt: >-
    How much of the preclinical STING agonist adjuvant literature transfers to
    humans, given that the most widely used tool agonist activates mouse STING
    but not human STING?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#STING Oligomerization and ER-to-Golgi Translocation
  - pathophysiology#Th1-Polarized T Cell Priming and Antitumor Immunity
  rationale: >-
    DMXAA, the flavonoid agonist behind a large fraction of the preclinical
    STING adjuvant and in situ vaccine literature, engages mouse STING and not
    the human receptor, and its failure in phase III lung cancer trials
    preceded rather than followed that discovery. Work in this area therefore
    depends on constructions that do not exist in patients: humanized STING
    mice, mouse STING delivered as an mRNA transgene into a human-STING
    background, or engineered human STING variants such as
    S162A/G230I/Q266I selected precisely for the DMXAA responsiveness wild-type
    human STING lacks. Each is a legitimate experimental device and each puts a
    species barrier between the result and a human claim. The mismatch is not
    about effect size, because it is not the potency of the response that
    differs but whether the compound engages the receptor at all. Curators
    should record the agonist chemotype and the receptor species when citing
    this arm, and should not carry a DMXAA-based efficacy result into a human
    disease entry as though it were a general property of STING agonism. The
    non-nucleotide human agonists (MSA-2) and the cyclic dinucleotides do not
    have this problem, which is why they, not DMXAA, are the appropriate
    citation for a human-directed claim.
  proposed_experiments:
  - experiment_id: exp_sting_agonist_human_apc_restricted_activation
    name: Cell-restricted STING activation in primary human antigen-presenting cells
    description: >-
      Compare interferon-stimulated gene induction, CD86 and MHC class II
      upregulation and cross-presentation capacity in sorted primary human
      conventional dendritic cells, monocyte-derived macrophages, T cells and B
      cells exposed to a human-active agonist delivered free versus delivered in
      a myeloid-tropic particle, to test whether the cell-restriction that
      produces the therapeutic window in mouse models is reproducible on the
      human receptor.
  - experiment_id: exp_sting_agonist_human_tissue_explant_response
    name: Agonist response in human tumor and adjacent normal tissue explants
    description: >-
      Treat paired fresh human tumor and adjacent normal tissue sections with a
      human-active agonist and read out interferon-stimulated gene, CXCL9,
      CXCL10 and CCL5 induction alongside lymphocyte viability, to establish
      whether the productive and counter-regulatory arms separate in human
      tissue as they do in mouse.
- discussion_id: knowledge_gap_sting_signal_strength_threshold
  prompt: >-
    What magnitude and duration of STING signalling separates the
    immunostimulatory arm from the lymphocyte-apoptotic, regulatory B cell and
    translation-suppressing arms, and is there a measurable biomarker of that
    threshold?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TBK1-IRF3 Activation and Type I Interferon Induction
  - pathophysiology#Signal-Strength-Dependent Lymphocyte Apoptosis and Regulatory B Cell Induction
  - pathophysiology#Suppression of Cap-Dependent mRNA Translation
  rationale: >-
    The whole branch structure of this module rests on the claim that intensity
    and chronicity determine whether the pathway protects or harms, but that
    claim is currently qualitative. No validated threshold exists in any units a
    curator or a trial could use, and the available readouts do not resolve it:
    a peripheral blood interferon signature is a composite score that saturates,
    phospho-TBK1 by flow cytometry is a snapshot of a transient event that is
    then reversed by autophagic degradation of STING itself, and neither is
    measured per cell type in the tissue where the decision is being made. This
    matters in both directions. On the therapeutic side it is why agonist dose
    optimization has been empirical and why monotherapy trials failed without a
    prospective way to tell an immunostimulatory exposure from an
    immunosuppressive one. On the disease side it is why it remains unclear
    whether the milder STING1 gain-of-function alleles sit below a threshold or
    on a continuum with the severe ones. Until this is resolved, the productive
    and counter-regulatory arms of this module should be curated as separate
    claims with their own evidence, and a disorder entry should not infer one
    from the other.
  proposed_experiments:
  - experiment_id: exp_sting_dose_duration_response_surface
    name: Dose-by-duration response surface for the divergent STING outcomes
    description: >-
      In a single system with controlled agonist exposure, measure across a
      dose-by-duration grid the four divergent outputs together - interferon-beta
      output, antigen-presenting cell maturation, lymphocyte apoptosis and
      regulatory B cell induction, and cap-dependent translation of a reporter
      transcript - to determine whether the arms separate at distinct thresholds
      or track one another.
  - experiment_id: exp_sting_per_cell_signalling_biomarker
    name: Per-cell-type signalling readout as a candidate threshold biomarker
    description: >-
      Establish whether a per-cell-type measure of pathway engagement, such as
      phospho-TBK1 and phospho-IRF3 by mass cytometry in matched blood and
      tissue, predicts which arm dominates, benchmarked against the composite
      interferon signature score that is currently used as a surrogate.

  evidence:
  - reference: PMID:33833439
    reference_title: "The cGAS-STING pathway as a therapeutic target in inflammatory diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Underlying this broad involvement of the cGAS-STING pathway is its capacity
      to sense and regulate the cellular response towards microbial and
      host-derived DNAs, which serve as ubiquitous danger-associated molecules.
    explanation: >-
      Establishes that the sensing step is agnostic to the origin of the DNA,
      which is what allows one module trigger to cover pathogen, tumor and self
      DNA routes. Evidence source is OTHER because this is a review.
  - reference: PMID:26223655
    reference_title: "Cutting Edge: cGAS Is Required for Lethal Autoimmune Disease in the Trex1-Deficient Mouse Model of Aicardi-Goutières Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we show that Trex1 (-/-) mice lacking cGAS are completely
      protected from lethality, exhibit dramatically reduced tissue
      inflammation, and fail to develop autoantibodies.
    explanation: >-
      Genetic epistasis placing cGAS upstream of the disease in the Trex1-null
      model of Aicardi-Goutieres syndrome, establishing that undegraded self DNA
      drives the pathway through this node rather than through a parallel
      sensor. Evidence source is MODEL_ORGANISM (Trex1-null mice).
  downstream:
  - target: STING Oligomerization and ER-to-Golgi Translocation
    causal_link_type: DIRECT
    description: >-
      cGAMP binds the STING ligand-binding domain at the endoplasmic reticulum
      membrane, driving the conformational change and oligomerization that
      license export.

- name: STING Oligomerization and ER-to-Golgi Translocation
  description: >-
    Ligand-bound STING dimers undergo conformational rearrangement, oligomerize
    side by side, and are exported from the endoplasmic reticulum in COPII
    vesicles through the ER-Golgi intermediate compartment to the Golgi, where
    downstream kinase recruitment occurs. Trafficking is the regulated,
    rate-setting step of the axis rather than a passive relocation: at steady
    state STING is continuously retrieved from the Golgi to the ER by COPI
    vesicles, so signalling reflects the balance between anterograde export and
    retrograde retrieval. This is the node at which two of the three monogenic
    interferonopathies place their lesion, and the node at which every
    pharmacologic agonist acts. Substitutions: ligand-independent STING1
    gain-of-function variants (SAVI); failed COPI-dependent retrieval with
    accumulation of ER-resident STING at the Golgi (COPA syndrome);
    cyclic dinucleotide agonists such as 2'3'-cGAMP and non-nucleotide agonists
    such as MSA-2 (human) or DMXAA (mouse) occupying the ligand-binding domain.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: INCREASED
  - preferred_term: positive regulation of cGAS/STING signaling pathway
    term:
      id: GO:0141111
      label: positive regulation of cGAS/STING signaling pathway
    modifier: INCREASED
  cellular_components:
  - preferred_term: STING complex
    term:
      id: GO:1990231
      label: STING complex
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:33833439
    reference_title: "The cGAS-STING pathway as a therapeutic target in inflammatory diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      trafficking of STING is facilitated by the canonical ER-to-Golgi transport
      machinery composed of coatomer protein complex II (COPII) vesicles,
      relying on the GTPase SAR1A and the COPII complex components, including
      SEC24C as well as the ARF-GTPase ARF1
    explanation: >-
      Names the export machinery that makes trafficking a discrete, druggable
      and genetically breakable step rather than an assumed consequence of
      ligand binding. Evidence source is OTHER because this is a review.
  - reference: PMID:32725128
    reference_title: "Mutations in COPA lead to abnormal trafficking of STING to the Golgi and interferon signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We detected an interaction between COPA and STING, and mutant COPA was
      associated with an accumulation of ER-resident STING at the Golgi.
    explanation: >-
      Shows a human disease gene acting on this node specifically, by failing to
      return STING from the Golgi rather than by increasing ligand. Evidence
      source is IN_VITRO (overexpression and silencing in cell lines).
  - reference: PMID:25029335
    reference_title: "Activated STING in a vascular and pulmonary syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated transcription of IFNB1 and other gene targets of STING in
      peripheral-blood mononuclear cells from the patients indicated
      constitutive activation of the pathway that cannot be further up-regulated
      with stimulation.
    explanation: >-
      Establishes the ligand-independent entry route: in SAVI the receptor is
      already maximally on, so the pathway cannot be driven higher by adding
      ligand. Evidence source is HUMAN_CLINICAL (patient cells).
  downstream:
  - target: TBK1-IRF3 Activation and Type I Interferon Induction
    causal_link_type: DIRECT
    description: >-
      Oligomerized STING at the ERGIC and Golgi recruits TBK1 through its
      C-terminal tail, the obligatory step for downstream transcription factor
      activation.
  - target: Suppression of Cap-Dependent mRNA Translation
    causal_link_type: DIRECT
    description: >-
      The non-canonical arm: ER-resident STING activates PERK directly, which
      phosphorylates eIF2-alpha and blocks translation initiation ahead of and
      independently of TBK1-IRF3. Drawn from this node rather than from
      TBK1-IRF3 so the interferon-independent route is not modelled as a
      consequence of the step it bypasses; the interferon-dependent
      IFNAR1/IRF9/4E-BP1 route retains its edge from TBK1-IRF3 Activation.

- name: TBK1-IRF3 Activation and Type I Interferon Induction
  description: >-
    STING recruits TANK-binding kinase 1 to its C-terminal tail; TBK1
    autophosphorylates, phosphorylates STING at Ser366 (Ser365 in mouse), and
    phosphorylates the recruited interferon regulatory factor 3, which dimerizes
    and translocates to the nucleus to drive transcription of type I interferons
    and other inflammatory mediators. This is the disorder-agnostic,
    rate-limiting node of the module and the key conformance target: every
    route into the pathway, genetic or pharmacologic, converges here, and
    downstream biology is a function of how strong and how sustained this signal
    is rather than of how it was initiated. TBK1 recruitment also activates
    NF-kB independently of interferon induction, so loss of the IRF3 arm alone
    does not abolish STING-dependent antiviral and antitumor immunity.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: INCREASED
  - preferred_term: positive regulation of interferon-beta production
    term:
      id: GO:0032728
      label: positive regulation of interferon-beta production
    modifier: INCREASED
  evidence:
  - reference: PMID:33785602
    reference_title: "TBK1 recruitment to STING activates both IRF3 and NF-κB that mediate immune defense against tumors and viral infections."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that STING can function independently of type I
      interferons and autophagy, and that TBK1 recruitment to STING is essential
      for antiviral and antitumor immunity.
    explanation: >-
      Separates the TBK1 recruitment step, which is indispensable, from the IRF3
      and interferon arm, which is not, using point-mutant mouse strains that
      break one without the other. This is why the node is named for TBK1
      recruitment and not for interferon alone. Evidence source is
      MODEL_ORGANISM (S365A, L373A and delta-CTT knock-in mice).
  - reference: PMID:33833439
    reference_title: "The cGAS-STING pathway as a therapeutic target in inflammatory diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The parameters that dictate host-protective versus pathogenic activity are
      still being unfolded, but it appears that the intensity and chronicity of
      cGAS-STING signalling are major determinants in most cases.
    explanation: >-
      States the signal-strength principle on which this module's branch
      structure rests: the same node yields protective immunity or disease
      depending on magnitude and duration. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Interferon-Stimulated Gene Expression and Antigen-Presenting Cell Maturation
    causal_link_type: DIRECT
    description: >-
      Secreted type I interferon acts on the interferon receptor to induce
      interferon-stimulated genes and mature antigen-presenting cells.
  - target: Chronic Type I Interferon-Driven Tissue Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      When the signal is constitutive rather than transient, sustained
      interferon output becomes the driver of tissue injury.
  - target: Signal-Strength-Dependent Lymphocyte Apoptosis and Regulatory B Cell Induction
    causal_link_type: DIRECT
    description: >-
      Intense STING signalling in lymphocytes, which express the receptor as
      readily as myeloid cells do, engages a distinct proapoptotic and
      regulatory transcriptional program.
  - target: Suppression of Cap-Dependent mRNA Translation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Interferon-stimulated gene products and a parallel STING-PERK arm converge
      on translation initiation factors to restrain cap-dependent protein
      synthesis.

- name: Interferon-Stimulated Gene Expression and Antigen-Presenting Cell Maturation
  description: >-
    Autocrine and paracrine type I interferon induces interferon-stimulated
    genes and matures dendritic cells and macrophages: costimulatory CD86 and
    MHC class II are upregulated, cross-presentation of acquired antigen
    improves, and CXCL9, CXCL10 and CCL5 are secreted, recruiting effector T
    cells and further dendritic cells into the tissue. This is the arm the
    adjuvant and immunotherapy literature is built on, and it is myeloid-cell
    centred: the therapeutic effect tracks with activation in antigen-presenting
    cells rather than with total pathway activation across all cell types.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: conventional dendritic cell
    term:

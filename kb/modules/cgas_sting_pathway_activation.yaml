  - preferred_term: antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
    modifier: INCREASED
  evidence:
  - reference: PMID:25959818
    reference_title: "Direct Activation of STING in the Tumor Microenvironment Leads to Potent and Systemic Tumor Regression and Immunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spontaneous tumor-initiated T cell priming is dependent on IFN-β
      production by tumor-resident dendritic cells.
    explanation: >-
      Places dendritic-cell interferon production between pathway activation and
      T cell priming, which is the causal content of this node. Evidence source
      is MODEL_ORGANISM (syngeneic mouse tumor models).
  - reference: PMID:42618806
    reference_title: "Enhanced antitumor immunity of mRNA vaccines by bioorthogonal-like delayed activation of exogeneous STING."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intratumoral or subcutaneous LNPs are preferentially internalized by
      myeloid cells, preserving antigen expression fidelity, achieving localized
      STING activation in antigen-presenting cells and preventing systemic
      regulatory B cell differentiation and immunocyte apoptosis.
    explanation: >-
      Demonstrates that restricting activation to antigen-presenting cells is
      what separates the productive arm of this node from the counter-regulatory
      arms below. Evidence source is MODEL_ORGANISM (humanized STING mouse
      models).
  downstream:
  - target: Th1-Polarized T Cell Priming and Antitumor Immunity
    causal_link_type: DIRECT
    description: >-
      Matured antigen-presenting cells cross-prime antigen-specific CD8+ T cells
      and polarize CD4+ helper responses toward Th1.

- name: Th1-Polarized T Cell Priming and Antitumor Immunity
  description: >-
    Cross-primed antigen-specific CD8+ cytotoxic T cells and Th1-polarized CD4+
    helper cells expand, infiltrate tumor tissue, and mediate regression, with
    immunologic memory sufficient to reject rechallenge and, after local
    administration, untreated distant lesions. This is the outcome that
    motivates STING agonists as vaccine adjuvants and as intratumoral in situ
    vaccines, and it is the arm a cancer entry conforms to. It is the
    therapeutic mirror image of the chronic inflammation arm, not a different
    pathway.
  role: consequence

name: cGAS-STING Pathway Activation Module
description: >-
  A conserved mechanism module for activation of the cGAS-STING cytosolic DNA
  sensing axis, the pathway that couples detection of mislocalized
  double-stranded DNA to TBK1-IRF3 signalling and type I interferon induction.
  The same molecular chain is reached from opposite directions by disease and by
  therapy. In the type I interferonopathies it runs constitutively because a
  brake has failed: gain-of-function STING1 variants activate the receptor
  without ligand (SAVI), COPI retrieval of STING from the Golgi fails (COPA
  syndrome), or a cytosolic nuclease no longer clears self DNA so cGAS is
  chronically engaged (Aicardi-Goutieres syndrome). In cancer immunotherapy and
  vaccine adjuvant design the same node is deliberately switched on with cyclic
  dinucleotide or non-nucleotide agonists to mature antigen-presenting cells and
  prime Th1-polarized antitumor T cells. The module therefore carries a single
  rate-limiting central effector with two divergent consequence arms, plus two
  counter-regulatory arms that constrain the therapeutic route: a
  signal-strength-dependent lymphocyte apoptosis and regulatory B cell program,
  and interferon-driven suppression of cap-dependent mRNA translation. Disorder
  entries declare conformance on their own pathophysiology nodes, substituting
  the disorder-specific route into the pathway while preserving the conserved
  sensing, trafficking and TBK1-IRF3 chain.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g. "cgas_sting_pathway_activation#TBK1-IRF3
  Activation and Type I Interferon Induction"). Key disorder-specific
  substitutions at the entry nodes are: cytosolic nuclease loss (TREX1,
  RNASEH2A/B/C, SAMHD1) in Aicardi-Goutieres syndrome; ligand-independent
  STING1 gain-of-function variants in SAVI; failed Golgi-to-ER retrieval of
  STING in COPA syndrome; tumor-derived and micronuclear DNA taken up by
  antigen-presenting cells in cancer immunosurveillance; and pharmacologic
  agonists, which bypass cGAS entirely and enter at the STING node.

  Scope boundaries. This module is the DNA-sensing arm specifically, and is
  deliberately narrower than `innate_antiviral_interferon_response`, which
  covers pattern-recognition receptor sensing and the JAK-STAT interferon
  response generally; a viral entry may conform to both, at different nodes.
  What is proprietary to this module is the trafficking step, which is where
  two of the three interferonopathies place their lesion, and the
  signal-strength bifurcation, which is why the same node is a drug target in
  two opposite directions. It is not an Xogenesis module: nothing pathological
  is formed, a signalling pathway runs when and where it should not.

  A conforming node must evidence STING-dependence, not merely an interferon
  signature. A raised interferon score is the shared readout of every type I
  interferonopathy, including the RNA-sensing (MDA5/IFIH1) and
  proteasome-associated ones that do not run through this pathway at all, so
  the signature alone does not establish conformance. Conversely, the NF-kB arm
  that TBK1 recruitment also switches on is interferon-independent (PMID:33785602)
  and is not modelled as a separate node here; an entry whose evidence is
  specifically for that arm should say so in prose rather than conforming to
  the interferon node.
pathophysiology:
- name: Cytosolic DNA Accumulation and cGAS-Dependent cGAMP Synthesis
  description: >-
    Double-stranded DNA reaching the cytosol, from any source, is bound by cyclic
    GMP-AMP synthase (cGAS), which on binding assembles into higher-order
    cGAS-DNA complexes and synthesizes the second messenger 2'3'-cGAMP. Because
    cGAS recognizes DNA as such rather than any pathogen-specific feature, the
    ligand may be microbial, tumor-derived, mitochondrial, micronuclear, or
    retroelement-derived self DNA; the safeguard against spurious self
    activation is nucleic acid compartmentalization plus continuous cytosolic
    nuclease clearance, not ligand discrimination. Disorder-specific
    substitutions at this node: loss of TREX1, RNASEH2A/B/C or SAMHD1 in
    Aicardi-Goutieres syndrome; mitochondrial DNA release under cellular stress;
    micronuclei generated by chromosomal instability in cancer; tumor DNA taken
    up by tumor-resident dendritic cells. Pharmacologic STING agonists do not
    act here at all, and instead bypass this node.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: 2',3'-cyclic GMP-AMP synthase activity
    term:
      id: GO:0061501
      label: 2',3'-cyclic GMP-AMP synthase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: cGAS/STING signaling pathway
    term:
      id: GO:0140896
      label: cGAS/STING signaling pathway
    modifier: INCREASED
  cellular_components:

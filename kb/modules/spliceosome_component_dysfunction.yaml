name: Spliceosome Component Dysfunction Module
description: >-
  A conserved mechanism module for spliceosomopathies: germline variants in a
  core RNA or protein component of the major or minor spliceosome reduce or
  alter spliceosome function, which mis-splices a sensitive subset of
  transcripts rather than all of them. Cells with high splicing demand at a
  critical stage (cranial neural crest progenitors, photoreceptors and retinal
  pigment epithelium, developing neurons) then fail or die, giving
  tissue-restricted craniofacial, retinal or neurodevelopmental disease from a
  ubiquitous machine. The key conformance target is "Mis-Splicing of a
  Sensitive Transcript Subset". A conforming entry substitutes its gene (for
  example SF3B4, EFTUD2, SNRPB, TXNL4A, PRPF31, RNU4-2, RNU5B-1, RNU4ATAC), the
  affected cell type and the splicing signature reported for it. The module is
  complementary to antisense_oligonucleotide_therapy, which covers mis-splicing
  of one transcript caused by a variant in that transcript and its correction
  by a splice-switching drug; this module covers defects in the splicing
  machinery itself.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
- NEUROSCIENCE
creation_date: "2026-10-25T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease, and conformance is node-level
  consistency rather than inheritance.
  Scope: germline variants in genes encoding spliceosomal snRNAs or core
  spliceosome proteins. Exclude variants that mis-splice only their own
  transcript, which belong on that gene's entry and, where a splice-switching
  drug exists, under antisense_oligonucleotide_therapy. Exclude somatic
  splicing-factor mutations in myeloid neoplasms (SF3B1, SRSF2, U2AF1, ZRSR2),
  which are change-of-function clonal drivers with a different downstream
  chain. Exclude defects in snRNP assembly upstream of the spliceosome, such as
  SMN deficiency in spinal muscular atrophy, unless the entry argues that the
  splicing step is its operative mechanism.
  Two classes of trigger are covered and conforming entries should say which
  applies. Most protein-gene disorders are haploinsufficient (SF3B4, EFTUD2,
  TXNL4A, PRPF31). Dominant snRNA variants (RNU4-2, RNU5B-1) cluster in a few
  nucleotides of one structural element and may act by altered function or
  dominant-negative effect rather than by loss; whether they are degraded by
  snRNA quality control is an open question recorded on those entries.
  The p53 node is a branch, not a step every conformer must have. It is
  established for EFTUD2 in neural crest, where Mdm2 exon skipping raises P53,
  but deleting Trp53 in those cells did not rescue craniofacial development, so
  p53 activation is a contributor rather than the whole explanation. Retinal
  conformers such as PRPF31 retinopathy go from mis-splicing to photoreceptor
  and RPE dysfunction without it.
  Which transcripts in a given cell type explain the phenotype is not settled
  for most conformers and should be cited per entry, never inherited from this
  module.
pathophysiology:
- name: Germline Spliceosome Component Variant
  description: >-
    A germline variant reduces the dosage of, or alters the sequence of, an RNA
    or protein component of the major or minor spliceosome.
  role: trigger
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: spliceosomal complex
    term:
      id: GO:0005681
      label: spliceosomal complex
  evidence:
  - reference: PMID:42293743
    reference_title: "Neurodegenerative spliceosomopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Spliceosomal syndromes are a group of disorders caused by pathogenic variants in core spliceosomal RNAs or proteins, leading to defective pre-mRNA splicing and tissue-specific disease vulnerability."
    explanation: Defines the disease class and its trigger.
  - reference: PMID:35893124
    reference_title: "The Core Splicing Factors EFTUD2, SNRPB and TXNL4A Are Essential for Neural Crest and Craniofacial Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Genetic variants affecting the function of several core splicing factors, namely SF3B4, SF3B2, EFTUD2, SNRPB and TXNL4A, are responsible for MFD in five related but distinct syndromes"
    explanation: Names the core splicing-factor genes behind the craniofacial spliceosomopathies.
  downstream:
  - target: Mis-Splicing of a Sensitive Transcript Subset
    causal_link_type: DIRECT
- name: Mis-Splicing of a Sensitive Transcript Subset
  description: >-
    Reduced or altered spliceosome function changes the splicing of a subset of
    transcripts, most often as increased exon skipping or shifted alternative
    splice-site use, rather than abolishing splicing globally. The affected set
    differs by gene, variant and cell type.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40126363
    reference_title: "Deletion of sf3b4 causes splicing defects and gene dysregulation that disrupt craniofacial development and survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Temporal RNA-sequencing analyses of mutant embryos identified an increase in exon-skipping events, followed by important transcriptional changes associated with an enrichment for terms consistent with defects in NC cell migration and survival."
    explanation: Exon skipping precedes the transcriptional changes in the sf3b4 mutant frog.
  - reference: PMID:30315276
    reference_title: "Disrupted alternative splicing for genes implicated in splicing and ciliogenesis causes PRPF31 retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we generate transcriptome profiles from RP11 (PRPF31-mutated) patient-derived retinal organoids and retinal pigment epithelium (RPE), as well as Prpf31+/- mouse tissues, which revealed that disrupted alternative splicing occurred for specific splicing programmes."
    explanation: In PRPF31 retinopathy the defect is in specific splicing programmes, not all splicing.
  downstream:
  - target: P53 Activation via MDM2 Exon Skipping
    causal_link_type: DIRECT
  - target: Failure of Splicing-Sensitive Cell Populations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: P53 Activation via MDM2 Exon Skipping
  description: >-
    In neural crest, skipping of MDM2 exon 3 lowers functional MDM2, raising
    nuclear P53 and P53 target expression and increasing cell death. Shown for
    EFTUD2; deleting Trp53 reduces apoptosis without rescuing craniofacial
    development, so this is a contributing branch.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: P53-mediated intrinsic apoptosis
    term:
      id: GO:0072332
      label: intrinsic apoptotic signaling pathway by p53 class mediator
    modifier: INCREASED
  evidence:
  - reference: PMID:33601405
    reference_title: "Mutation in Eftud2 causes craniofacial defects in mice via mis-splicing of Mdm2 and increased P53."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNAseq analysis of embryonic heads revealed a significant increase in exon skipping and increased levels of an alternatively spliced Mdm2 transcript lacking exon 3."
    explanation: Identifies the Mdm2 exon-skipping event in Eftud2 mutant neural crest.
  - reference: PMID:33601405
    reference_title: "Mutation in Eftud2 causes craniofacial defects in mice via mis-splicing of Mdm2 and increased P53."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, we found increased nuclear P53, higher expression of P53-target genes and increased cell death."
    explanation: Links the mis-splicing to P53 activation and cell death.
  - reference: PMID:36012294
    reference_title: "Craniofacial Defects in Embryos with Homozygous Deletion of Eftud2 in Their Neural Crest Cells Are Not Rescued by Trp53 Deletion."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "brain and craniofacial development, and survival were not improved in double mutant embryos"
    explanation: >-
      Refutes P53 activation as the sole cause of the craniofacial defect:
      removing Trp53 in neural crest did not rescue development.
  downstream:
  - target: Failure of Splicing-Sensitive Cell Populations
    causal_link_type: DIRECT
- name: Failure of Splicing-Sensitive Cell Populations
  description: >-
    Cells with high splicing demand at a critical stage fail or die. In the
    craniofacial spliceosomopathies this is early depletion of cranial neural
    crest progenitors; in PRPF31 retinopathy it is retinal pigment epithelium
    dysfunction and rod photoreceptor death. A conforming entry substitutes its
    own cell type.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:35893124
    reference_title: "The Core Splicing Factors EFTUD2, SNRPB and TXNL4A Are Essential for Neural Crest and Craniofacial Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Animal models of NRS and MFDM indicate that MFD results from an early depletion of neural crest progenitors through a mechanism that involves apoptosis."
    explanation: Neural crest progenitor loss is the craniofacial instance of this node.
  - reference: PMID:35974011
    reference_title: "Modeling PRPF31 retinitis pigmentosa using retinal pigment epithelium and organoids combined with gene augmentation rescue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRPF31-mutated retinal organoids recapitulate the human RP phenotype, with a rod photoreceptor cell death followed by a loss of cones."
    explanation: Rod photoreceptor death is the retinal instance of this node.
  downstream:
  - target: Tissue-Restricted Disease from a Ubiquitous Machine
    causal_link_type: DIRECT
- name: Tissue-Restricted Disease from a Ubiquitous Machine
  description: >-
    The clinical phenotype is confined to the tissues whose precursor cells
    failed: facial dysostosis, retinal degeneration, or neurodevelopmental
    disease, despite the spliceosome working in every cell.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:41081049
    reference_title: "Modeling craniofacial spliceosomopathies: a pathway toward deciphering disease mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "An outstanding question in the field is how mutations in the ubiquitously expressed spliceosome lead to such cell- and tissue-specific disorders."
    explanation: States the tissue-specificity of the outcome and that its cause is open.
  - reference: PMID:42293743
    reference_title: "Neurodegenerative spliceosomopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although the spliceosome is ubiquitously expressed, its dysfunction preferentially affects highly splicing-dependent tissues such as the retina and the nervous system."
    explanation: Names retina and nervous system as the preferentially affected tissues.
discussions:
- discussion_id: spliceosomopathy_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Splicing-Sensitive Cell Populations
  prompt: >-
    Why does a defect in the ubiquitous spliceosome fail only certain cell
    types, and differently by gene?
  rationale: >-
    Craniofacial spliceosomopathies hit cranial neural crest, PRPF-gene
    disorders hit the retina, and snRNA-gene disorders hit the developing brain.
    Candidate explanations include higher splicing demand at a critical
    developmental window, dosage thresholds that only some cells cross, and
    cell-type-specific sensitive transcripts such as MDM2 in neural crest. The
    Trp53 non-rescue in Eftud2 neural crest shows the known stress pathway is
    not sufficient, and no study has compared the same spliceosome defect
    across cell types side by side.
  evidence:
  - reference: PMID:41081049
    reference_title: "Modeling craniofacial spliceosomopathies: a pathway toward deciphering disease mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "An outstanding question in the field is how mutations in the ubiquitously expressed spliceosome lead to such cell- and tissue-specific disorders."
    explanation: The field states the question as open.

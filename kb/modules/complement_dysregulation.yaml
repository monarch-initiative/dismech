name: Complement Dysregulation Module
description: >-
  A conserved pathophysiology module representing loss of negative control over
  the complement alternative pathway and the terminal-pathway injury it
  produces. Complement is continuously active at low level ("tick-over") and is
  held in check only by dedicated regulators; when that restraint fails -
  through germline loss-of-function in fluid-phase or membrane-bound regulators
  (CFH, CFI, CD46/MCP, THBD), gain-of-function in the effectors themselves (C3,
  CFB), somatic loss of the GPI anchor that presents CD55 and CD59 on the cell
  surface (PIGA), or acquired autoantibodies that stabilise the convertases
  (C3 nephritic factor, anti-factor-H) - the C3 convertase amplification loop
  runs unopposed on host surfaces. Amplified C3b deposition builds the C5
  convertase, and terminal-pathway assembly liberates the anaphylatoxin C5a and
  the lytic C5b-9 membrane attack complex. Host cells are then injured by a
  mechanism that is independent of which regulator failed upstream: erythrocyte
  lysis, endothelial activation with platelet deposition and thrombotic
  microangiopathy, C5a-driven neutrophil chemotaxis, and post-synaptic membrane
  destruction at the neuromuscular junction. Conforming disorder nodes
  substitute the disease-specific regulatory lesion at the trigger node and the
  disease-specific injured cell at the effector node while preserving the
  conserved amplification, terminal-pathway, and injury chain. Carries the
  terminal-complement-inhibitor drug pattern: anti-C5 monoclonal antibodies
  (eculizumab, ravulizumab) use `target_mechanisms` with INHIBITS against the
  central effector node, which is what makes that node the rate-limiting step
  worth conforming to. Key conformance target:
  `complement_dysregulation#C5 Convertase Activation and Terminal Pathway Assembly`.
  Deliberately scoped to the alternative-pathway amplification loop, which is
  the conserved and druggable core. Classical- and lectin-pathway-initiated
  disease (immune-complex glomerulonephritis, antibody-mediated rejection,
  anti-AChR myasthenia gravis) has no regulator lesion, so it does **not**
  conform at the trigger node: it enters downstream, at whichever node its own
  curated content actually models - the amplification node when the disease is
  curated at the level of convertase activity, or the terminal node when the
  curated content runs through to membrane-attack-complex formation, as
  anti-AChR myasthenia gravis does. Complementary to, and distinct from,
  `molecular_mimicry_autoimmunity` (which models how an autoantibody comes to
  exist, not what its complement-fixing effector arm then does),
  `hemolytic_anemia_erythrocyte_destruction` (the broader red-cell-destruction
  module, of which complement-mediated intravascular haemolysis is one
  conforming route), and `thrombogenesis` (the coagulation lesion downstream of
  the endothelial injury modelled here, not the complement chain itself).
category: Module
creation_date: "2026-08-18T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "complement_dysregulation#C5 Convertase Activation and Terminal Pathway Assembly").
  The module defines the expected pathophysiology structure; conforming nodes in
  disorder files should include the corresponding cell types, biological
  processes, and causal edges, specialized to their disease context. Key
  disease-specific substitutions at the trigger node: atypical haemolytic
  uraemic syndrome substitutes germline loss of fluid-phase or membrane
  regulators (CFH, CFI, CD46) or gain-of-function C3/CFB variants; paroxysmal
  nocturnal haemoglobinuria substitutes somatic PIGA mutation with consequent
  absence of GPI-anchored CD55 and CD59; C3 glomerulopathy substitutes acquired
  convertase-stabilising autoantibodies. Anti-AChR myasthenia gravis is **not**
  a trigger-node conformer - it has no regulator lesion, and its autoantibody
  initiates the classical pathway - so it attaches at the terminal node, whose
  `GO:0001905` / `GO:0005579` binding its own curated node carries.
  Substitutions at the
  effector node follow the injured cell: erythrocyte (PNH), glomerular
  endothelium (aHUS, C3G), post-synaptic muscle membrane (MG). Complement
  component chemistry and the individual complement proteins are described in
  prose only; modules bind GO and CL terms only and do not use chemical (CHEBI)
  or protein term bindings.
pathophysiology:
- name: Loss of Complement Regulatory Control
  description: >-
    The complement alternative pathway is constitutively active at a low level
    and is restrained, rather than switched on, by a dedicated set of regulators
    acting both in the fluid phase (factor H, factor I) and on host membranes
    (CD46/MCP, CD55, CD59, thrombomodulin). Disease begins when that restraint is
    lost. The lesion may be a germline loss-of-function variant in a regulator, a
    gain-of-function variant in C3 or factor B that renders the convertase
    resistant to regulation, somatic loss of the GPI anchor that displays CD55
    and CD59 on the cell surface, or an acquired autoantibody that stabilises the
    convertase or neutralises factor H. These are mechanistically distinct
    lesions with one shared consequence, and it is that shared consequence, not
    the lesion, that the rest of this chain models.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Regulation of Complement Activation
    term:
      id: GO:0030449
      label: regulation of complement activation
    modifier: DECREASED
  evidence:
  - reference: PMID:36683290
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetically-determined or acquired dysregulation of the complement is
      frequently identified in patients with aHUS, pregnancy-related hemolytic
      uremic syndrome (HUS), and severe hypertension-associated HUS.
    explanation: >-
      Establishes that the upstream lesion is dysregulation of complement, and
      that it may be either genetically determined or acquired - the two
      alternative trigger routes this node models. Evidence source is OTHER
      because this is a review.
  - reference: PMID:25237200
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The absence of two glycosylphosphatidylinositol (GPI)-anchored proteins,
      CD55 and CD59, leads to uncontrolled complement activation that accounts
      for hemolysis and other PNH manifestations.
    explanation: >-
      Supports loss of membrane-bound complement regulators (CD55, CD59) as a
      trigger lesion producing uncontrolled complement activation, the
      substitution a conforming paroxysmal nocturnal haemoglobinuria node makes
      at this node. Evidence source is OTHER because this is a review.
  - reference: PMID:30692664
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disease is driven by acquired factors in most patients - namely,
      autoantibodies that target the C3 or C5 convertases. These autoantibodies
      drive complement dysregulation by increasing the half-life of these vital
      but normally short-lived enzymes.
    explanation: >-
      Supports the acquired autoantibody route to loss of regulatory control,
      and specifies the mechanism (convertase stabilisation), the substitution a
      conforming C3 glomerulopathy node makes. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Unrestrained Alternative Pathway Amplification

- name: Unrestrained Alternative Pathway Amplification
  description: >-
    Freed from regulation, the alternative pathway C3 convertase (C3bBb) runs as
    a positive-feedback amplification loop: each C3b generated recruits factor B
    to form further convertase, depositing more C3b on the surface. Because the
    loop is self-amplifying, a modest failure of restraint produces a large,
    sustained increase in surface-bound C3b rather than a proportionate one.
    This node is also the point of entry for classical- and lectin-pathway
    initiated disease, in which an immune complex or a carbohydrate ligand
    supplies the initiating C3b that the alternative pathway then amplifies.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Complement Activation, Alternative Pathway
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:36683290
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overactivation of the complement alternative pathway drives the
      pathogenesis of primary atypical hemolytic uremic syndrome (aHUS).
    explanation: >-
      Establishes overactivation of the alternative pathway as the driving
      amplification step downstream of lost regulation. Evidence source is OTHER
      because this is a review.
  - reference: PMID:26082779
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The subsequent cascade of enzymatic reactions is tightly regulated to
      assure that complement is activated only at specific locations requiring
      defense against pathogens, thus avoiding host tissue damage.
    explanation: >-
      States the regulated-cascade principle whose failure defines this node:
      regulation exists to confine complement activation and thereby avoid host
      tissue damage, so loss of it produces host injury. Evidence source is
      OTHER because this is a review.
  - reference: PMID:30692664
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dysregulation of the complement alternative pathway is fundamental to the
      manifestations of C3 glomerulopathy, although terminal pathway
      dysregulation is also common.
    explanation: >-
      Confirms alternative-pathway dysregulation as the fundamental amplifying
      mechanism in a second, independent conforming disease, and links it
      onward to terminal-pathway dysregulation. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: C5 Convertase Activation and Terminal Pathway Assembly

- name: C5 Convertase Activation and Terminal Pathway Assembly
  description: >-
    Dense C3b deposition converts the C3 convertase into a C5 convertase, which
    cleaves C5 into C5a and C5b. C5a is a potent anaphylatoxin and neutrophil
    chemoattractant; C5b nucleates the sequential assembly of C6, C7, C8 and
    multiple C9 molecules into the lytic C5b-9 membrane attack complex in the
    target membrane. This is the disorder-agnostic, rate-limiting step of the
    module: every conforming disease funnels through it regardless of which
    regulator failed upstream, and it is the step at which terminal complement
    inhibitors act. It is therefore the key conformance target.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Activation of Membrane Attack Complex
    term:
      id: GO:0001905
      label: activation of membrane attack complex
    modifier: INCREASED
  cellular_components:
  - preferred_term: Membrane Attack Complex
    term:
      id: GO:0005579
      label: membrane attack complex
  evidence:
  - reference: PMID:29266249
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complement plays an important role in innate and antibody-mediated
      immunity, and activation and amplification of complement results in the
      formation of membrane attack complexes (MACs), lipophilic proteins that
      damage cell membranes.
    explanation: >-
      States the conserved terminal step this node models - activation and
      amplification culminating in membrane attack complex formation that
      damages cell membranes. Evidence source is OTHER because this is a review
      spanning animal-model and patient data.
  - reference: PMID:29266249
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies in animals lacking specific complement proteins have confirmed
      that MAC formation is required to induce experimental autoimmune MG (EAMG)
      and NMJ damage.
    explanation: >-
      Genetic dissection in animals establishes MAC formation as required for
      injury, supporting this node as the rate-limiting step rather than an
      incidental correlate. Evidence source is MODEL_ORGANISM because the
      requirement was demonstrated in complement-deficient animals.
  - reference: PMID:16990386
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We tested the safety and efficacy of eculizumab, a humanized monoclonal
      antibody against terminal complement protein C5 that inhibits terminal
      complement activation, in patients with paroxysmal nocturnal hemoglobinuria
      (PNH).
    explanation: >-
      Identifies C5 and terminal complement activation as the druggable step,
      supporting this node as the drug-target anchor for the module's
      target_mechanisms pattern. Evidence source is HUMAN_CLINICAL because this
      is a randomized controlled trial in patients.
  downstream:
  - target: Complement-Mediated Cell Injury and Endothelial Activation

- name: Complement-Mediated Cell Injury and Endothelial Activation
  description: >-
    Terminal complement injures whichever host surface has lost its protection.
    On erythrocytes, C5b-9 pores cause intravascular haemolysis. On endothelium,
    sublytic MAC deposition and C5a signalling produce endothelial activation,
    loss of thromboresistance, platelet deposition and a thrombotic
    microangiopathy. C5a additionally recruits and activates neutrophils,
    amplifying local injury. At the neuromuscular junction, MAC destroys the
    post-synaptic membrane and its acetylcholine receptors. Conforming disorder
    nodes substitute the disease-specific target cell here while preserving the
    complement-dependent cytotoxicity mechanism.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: Erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: Complement-Dependent Cytotoxicity
    term:
      id: GO:0097278
      label: complement-dependent cytotoxicity
    modifier: INCREASED
  evidence:
  - reference: PMID:25237200
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Paroxysmal nocturnal hemoglobinuria (PNH) is a rare bone marrow failure
      disorder that manifests with hemolytic anemia, thrombosis, and peripheral
      blood cytopenias.
    explanation: >-
      Documents the erythrocyte-injury and thrombotic manifestations produced
      when terminal complement acts on unprotected host cells, the red-cell
      substitution at this node. Evidence source is OTHER because this is a
      review.
  - reference: PMID:29266249
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with anti-AChR+ MG have autoantibodies and MACs present at NMJs.
      Damaged NMJs are associated with more severe disease, fewer AChRs, and
      MACs in synaptic debris.
    explanation: >-
      Human tissue evidence that MAC deposition co-localises with the damaged
      target structure and tracks with severity, supporting complement-mediated
      injury of the disease-specific target cell. Evidence source is
      HUMAN_CLINICAL because these are observations in patients.
  downstream:
  - target: Complement-Mediated Tissue Injury Syndrome

- name: Complement-Mediated Tissue Injury Syndrome
  description: >-
    The clinical syndrome produced by the conserved chain, expressed in the
    organ whose cells were injured: thrombotic microangiopathy with
    microangiopathic haemolytic anaemia, thrombocytopenia and acute kidney
    injury in atypical haemolytic uraemic syndrome; intravascular haemolysis
    with anaemia and thrombosis in paroxysmal nocturnal haemoglobinuria;
    glomerulonephritis with prominent C3 deposition in C3 glomerulopathy;
    fatigable weakness from neuromuscular transmission failure in generalised
    myasthenia gravis. Response to terminal complement blockade across these
    otherwise unrelated presentations is the clearest evidence that they share
    the chain modelled here.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:23738544
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atypical hemolytic-uremic syndrome is a genetic, life-threatening, chronic
      disease of complement-mediated thrombotic microangiopathy.
    explanation: >-
      Names the thrombotic-microangiopathy syndrome as the clinical consequence
      of complement-mediated injury. Evidence source is HUMAN_CLINICAL because
      this is a prospective trial report in patients.
  - reference: PMID:30692664
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The C3 glomerulopathies are a group of rare kidney diseases characterized
      by complement dysregulation occurring in the fluid phase and in the
      glomerular microenvironment, which results in prominent complement C3
      deposition in kidney biopsy samples.
    explanation: >-
      Documents the renal syndrome and its defining histological consequence
      (C3 deposition) as the organ-specific expression of this chain. Evidence
      source is OTHER because this is a review.
treatments:
- name: Terminal Complement Inhibition (Eculizumab)
  description: >-
    Anti-C5 monoclonal antibodies bind complement component C5 and prevent its
    cleavage into C5a and C5b, blocking both anaphylatoxin generation and
    assembly of the C5b-9 membrane attack complex while leaving upstream C3
    functions - opsonisation and immune-complex clearance - intact. Eculizumab
    is the first-in-class agent; ravulizumab is the long-acting successor.
    Because the block is at the shared terminal step rather than at any
    disease-specific upstream lesion, one agent treats mechanistically distinct
    conforming disorders, which is the therapeutic expression of this module.
    Terminal blockade abolishes serum bactericidal activity against Neisseria,
    so meningococcal vaccination and prophylaxis are mandatory. Represents the
    terminal-complement-inhibitor drug-target design pattern for conforming
    disorders.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eculizumab
      term:
        id: NCIT:C48386
        label: Eculizumab
    - preferred_term: ravulizumab
      term:
        id: NCIT:C124657
        label: Ravulizumab
  target_mechanisms:
  - target: C5 Convertase Activation and Terminal Pathway Assembly
    treatment_effect: INHIBITS
    description: >-
      Anti-C5 antibodies prevent cleavage of C5, blocking generation of C5a and
      assembly of the membrane attack complex, and so interrupt the module at
      its rate-limiting central effector node.
  evidence:
  - reference: PMID:16990386
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eculizumab reduced intravascular hemolysis, as shown by the 85.8% lower
      median area under the curve for lactate dehydrogenase plotted against time
      (in days) in the eculizumab group, as compared with the placebo group
    explanation: >-
      Placebo-controlled evidence that blocking C5 reduces the downstream
      complement-mediated injury, validating the drug target at the central
      effector node. Evidence source is HUMAN_CLINICAL because this is a phase 3
      randomized trial.
  - reference: PMID:36683290
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      C5 blockade therapy has revolutionized the management of aHUS patients,
      resulting in a halving of the subpopulation under chronic dialysis over
      the course of a few years.
    explanation: >-
      Confirms the same C5-directed intervention transforms outcomes in a second
      conforming disorder, supporting the shared terminal step as the correct
      drug target across the module. Evidence source is OTHER because this is a
      review.
  - reference: PMID:29266249
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Eculizumab is a humanized monoclonal antibody that inhibits cleavage of
      complement protein C5, preventing MAC formation.
    explanation: >-
      States the drug mechanism precisely as modelled by the target_mechanisms
      edge - inhibition of C5 cleavage preventing MAC formation. Evidence source
      is OTHER because the sentence states a drug's molecular mechanism in a
      review, not a clinical observation.
  - reference: PMID:29266249
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eculizumab treatment improved symptoms compared with placebo in a phase II
      study in patients with refractory gMG.
    explanation: >-
      Supplies the clinical arm of the same target_mechanisms claim - blocking
      C5 at this node produces symptomatic benefit in patients. Evidence source
      is HUMAN_CLINICAL because this reports a placebo-controlled trial result
      in patients.

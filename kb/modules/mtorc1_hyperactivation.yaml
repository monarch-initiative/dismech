  - reference: PMID:27494029
    reference_title: "Whole Exome Sequencing Identifies TSC1/TSC2 Biallelic Loss as the Primary and Sufficient Driver Event for Renal Angiomyolipoma Development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty of 32 (62%) samples showed copy neutral LOH (CN-LOH) in TSC2 or
      TSC1 with at least 8 different LOH regions, and 30 of 32 (94%) had
      biallelic loss of either TSC2 or TSC1.
    explanation: >-
      Direct human evidence that TSC lesions are biallelically null at the
      TSC locus, the second-hit mechanism in its canonical disease.
  - reference: PMID:29708508
    reference_title: "Second-hit mosaic mutation in mTORC1 repressor DEPDC5 causes focal cortical dysplasia-associated epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a biallelic 2-hit - brain somatic and germline - mutational mechanism
      in DEPDC5 causes focal epilepsy with FCD
    explanation: >-
      The same two-hit architecture on the GATOR1 branch, with the second hit
      restricted to the dysplastic brain tissue.
  - reference: PMID:10823953
    reference_title: "Mutations in the tuberous sclerosis complex gene TSC2 are a cause of sporadic pulmonary lymphangioleiomyomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that somatic mutations in the TSC2 gene occur in
      the angiomyolipomas and pulmonary LAM cells of women with sporadic LAM,
      strongly supporting a direct role of TSC2 in the pathogenesis of this
      disease.
    explanation: >-
      In sporadic lymphangioleiomyomatosis both hits are somatic, showing the
      lesion-restricted biallelic loss does not need a germline first hit.
  downstream:
  - target: Constitutive mTORC1 Hyperactivation
    description: >-
      Biallelic loss in the lesion removes the brake entirely in those cells.
- name: Constitutive mTORC1 Hyperactivation
  description: >-
    The rate-limiting, disorder-agnostic step and the key conformance target.
    With the regulator gone, mTORC1 stays active at the lysosomal surface
    regardless of amino-acid, glucose or growth-factor supply, read out as
    persistently phosphorylated S6K and ribosomal protein S6 even under
    starvation. Every branch of the trigger node converges here, and the
    rapalogs act here.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:39334956
    reference_title: "Therapeutic Approaches to Tuberous Sclerosis Complex: From Available Therapies to Promising Drug Targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in TSC1 and TSC2 lead to mTORC1 hyperactivation,
      producing benign tumours in multiple organs, including the brain and
      kidneys, and drug-resistant epilepsy, a typical sign of TSC.
    explanation: >-
      States the central effector for the TSC branch and ties it to the
      module's terminal lesions.
  - reference: PMID:30093711
    reference_title: "The landscape of epilepsy-related GATOR1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenic molecular mechanism linked to GATOR1 haploinsufficiency
      is a hyperactivation of mTORC1 pathway
    explanation: >-
      The GATOR1 branch converges on the same effector.
  - reference: PMID:31430354
    reference_title: "Constitutive activation of mTORC1 signaling induced by biallelic loss-of-function mutations in SZT2 underlies a discernible neurodevelopmental disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Increased phosphorylation of S6 kinase and S6 was identified in
      patient-derived cell lines under amino acid-starved condition,
      suggestive of constitutive hyperactivation of mTORC1 signaling.
    explanation: >-
      Demonstrates the defining property of the node, signalling that persists
      under nutrient starvation, on the SZT2 branch.
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice that lack SZT2, mTORC1 signalling is increased in several
      tissues, including in neurons in the brain.
    explanation: >-
      In vivo confirmation that loss of the lysosomal anchor raises mTORC1
      signalling, including in the cell type where the epileptogenic lesions
      form.
  - reference: PMID:18184959
    reference_title: "Sirolimus for angiomyolipoma in tuberous sclerosis complex or lymphangioleiomyomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Angiomyolipomas in patients with the tuberous sclerosis complex or
      sporadic lymphangioleiomyomatosis are associated with mutations in
      tuberous sclerosis genes resulting in constitutive activation of the
      mammalian target of rapamycin (mTOR).
    explanation: >-
      Links the lesion-level mutation to constitutive mTOR activation in both
      the germline and sporadic forms of the TSC branch.
  - reference: PMID:19541609
    reference_title: "mTOR and HIF-1alpha-mediated tumor metabolism in an LKB1 mouse model of Peutz-Jeghers syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, we demonstrate that polyps from human Peutz-Jeghers
      patients similarly exhibit up-regulated mTORC1 signaling, HIF-1alpha,
      and GLUT1 levels.
    explanation: >-
      The STK11 branch converges on the same effector in human lesion
      tissue.
  downstream:
  - target: Translation and Anabolic Cell Growth Upregulation
    description: >-
      Unrestrained mTORC1 phosphorylates S6K and 4E-BP, driving protein and
      lipid synthesis and cell growth.
  - target: Autophagy Suppression
    description: >-
      Persistent mTORC1 activity holds the autophagy-initiating kinase ULK1
      in its inhibited state.
- name: Translation and Anabolic Cell Growth Upregulation
  description: >-
    Constitutive mTORC1 output is anabolic: phosphorylation of S6 kinase and
    the 4E-BP translational repressors raises cap-dependent translation and
    ribosome biogenesis, and the lipid-synthetic program is engaged, so cells
    enlarge and proliferate. In the brain this produces the cytomegalic,
    dysmorphic neurons and balloon cells of focal cortical dysplasia; in other
    organs the enlarged, proliferating cells of the hamartoma.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: translation

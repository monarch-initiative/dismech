      label: negative regulation of TORC1 signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:39596632
    reference_title: "Molecular and Functional Assessment of TSC1 and TSC2 in Individuals with Tuberous Sclerosis Complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TSC1 and TSC2 encode the core components of the TSC1/2 complex (TSC1/2),
      a negative regulator of the mechanistic target of rapamycin (MTOR)
      complex 1 (TORC1).
    explanation: >-
      Establishes the TSC complex as an mTORC1 negative regulator, the branch
      lost in tuberous sclerosis complex and lymphangioleiomyomatosis.
  - reference: PMID:29708508
    reference_title: "Second-hit mosaic mutation in mTORC1 repressor DEPDC5 causes focal cortical dysplasia-associated epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DEP domain-containing 5 protein (DEPDC5) is a repressor of the recently
      recognized amino acid-sensing branch of the mTORC1 pathway
    explanation: >-
      Places DEPDC5, and so the GATOR1 complex, on the amino-acid sensing arm
      as a second, independent brake on mTORC1.
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      is required for amino acid or glucose deprivation to inhibit mTORC1 in
      cultured human cells
    explanation: >-
      Shows that the KICSTOR complex, of which SZT2 is a component, is needed
      for nutrient deprivation to inhibit mTORC1, so SZT2 loss removes the
      same brake GATOR1 loss does.
  - reference: PMID:18781191
    reference_title: "PTEN hamartoma tumor syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTEN is located on chromosome 10q22-23 and negatively regulates the
      prosurvival PI3K/Akt/mTOR pathway through its lipid phosphatase
      activity. Loss of PTEN activates this pathway and leads to increased
      cellular growth, migration, proliferation, and survival.
    explanation: >-
      Supports the PTEN branch: a lipid-phosphatase brake on the PI3K-AKT
      input whose loss activates mTOR signalling.
  - reference: PMID:14976552
    reference_title: "LKB1 is a master kinase that activates 13 kinases of the AMPK subfamily, including MARK/PAR-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We recently demonstrated that the LKB1 tumour suppressor kinase, in
      complex with the pseudokinase STRAD and the scaffolding protein MO25,
      phosphorylates and activates AMP-activated protein kinase (AMPK)
    explanation: >-
      The STK11/LKB1 branch: LKB1 is the upstream activator of AMPK, so its
      loss silences the energy-stress brake on mTORC1.
  - reference: PMID:15261145
    reference_title: "The LKB1 tumor suppressor negatively regulates mTOR signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      LKB1 is required for repression of mTOR under low ATP conditions in
      cultured cells in an AMPK- and TSC2-dependent manner, and that Lkb1
      null MEFs and the hamartomatous gastrointestinal polyps from Lkb1
      mutant mice show elevated signaling downstream of mTOR
    explanation: >-
      Shows that the STK11/LKB1 brake acts through AMPK and TSC2, placing it
      on the same path as the TSC branch, and that its loss produces the
      module's hamartomatous lesion.
  downstream:
  - target: Somatic Second-Hit Biallelic Inactivation in the Lesion
    description: >-
      A heterozygous germline loss is completed by a somatic second hit in
      the cells that form the lesion.
  - target: Constitutive mTORC1 Hyperactivation
    description: >-
      Loss of the regulator, whether haploinsufficient or biallelic, releases
      mTORC1 from nutrient and growth-factor control.
- name: Somatic Second-Hit Biallelic Inactivation in the Lesion
  description: >-
    In the germline syndromes the heterozygous first hit is typically
    completed in the lesion by a somatic second hit at the same locus (loss
    of heterozygosity, a second point variant, or a brain-restricted mosaic
    variant), so that the hamartoma or dysplastic focus is biallelically
    null while the surrounding tissue is not. In sporadic disease both hits
    are somatic. This two-hit step is why lesions are focal and multifocal
    rather than diffuse.

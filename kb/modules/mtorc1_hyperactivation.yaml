name: mTORC1 Hyperactivation (mTORopathy) Module
description: >-
  A conserved mechanism module for the mTORopathies: disorders in which
  germline or somatic loss of an upstream negative regulator of mechanistic
  target of rapamycin complex 1 (mTORC1) releases the complex from
  nutrient- and growth-factor-dependent control. The causal chain is loss of
  the brake (the TSC1/TSC2 complex upstream of Rheb; the GATOR1 complex
  DEPDC5/NPRL2/NPRL3 and its lysosomal anchor KICSTOR/SZT2 on the amino-acid
  sensing arm; PTEN on the PI3K-AKT input; or STK11/LKB1, whose loss removes
  the AMPK-dependent activation of TSC2 so that energy stress no longer
  restrains the complex), often completed by a somatic second hit in the
  lesion, leading to constitutive, nutrient-insensitive
  mTORC1 signalling, which drives S6K/4E-BP-dependent translation and
  anabolic cell growth and suppresses ULK1-initiated autophagy, producing
  hamartomatous overgrowth and dysplastic, epileptogenic lesions. The key
  conformance target is "Constitutive mTORC1 Hyperactivation", which is also
  the node the rapalogs (sirolimus, everolimus) act on; the treatment block
  records that drug-target pattern. This module is complementary to its
  siblings rather than overlapping them: deregulated_nutrient_sensing models
  physiological sensors chronically engaged with age (an aging hallmark, no
  lesion), pi3k_akt_mtor_cortical_overgrowth models gain-of-function
  PIK3CA/AKT3/MTOR variants in neural progenitors specifically,
  il11_erk_ampk_mtor_aging models a cytokine-driven ERK-AMPK-mTORC1 axis,
  and mtor_androgen_deprivation_resistance models feedback mTORC1 activation
  under AR blockade. Somatic-cancer PI3K/AKT/mTOR activation nodes belong to
  the hallmark module sustaining_proliferative_signaling, not here.
  Conforming disorder nodes substitute the disorder-specific regulator lost
  (TSC1/TSC2 in tuberous sclerosis complex and lymphangioleiomyomatosis;
  DEPDC5, NPRL2 or NPRL3 in the GATOR1 focal epilepsies; SZT2 in SZT2-related
  developmental and epileptic encephalopathy; PTEN in the PTEN hamartoma
  tumour syndromes; STK11 in Peutz-Jeghers syndrome) and the organ in which
  the lesion forms, while keeping
  the conserved hyperactivation-to-growth-to-lesion skeleton.
category: Module
module_categories:
- NEUROSCIENCE
- ONCOLOGY
creation_date: "2026-10-12T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease; do not create an "mTORopathy"
  Disease entry. Disorder entries reference nodes via conforms_to, for
  example "mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation".
  The trigger node is written as one node with three regulator branches
  because every branch converges on the same rate-limiting step; a
  conforming node names only the regulator its disease loses. The
  second-hit node is optional for conformers: it is the established
  mechanism in tuberous sclerosis complex, sporadic
  lymphangioleiomyomatosis and DEPDC5-related focal cortical dysplasia, but
  SZT2-related disease is biallelic germline and some PTEN hamartomas form
  on haploinsufficiency alone, so those entries conform to the trigger and
  central-effector nodes without it. A trigger node that is also a germline
  first hit conforms to both modules by listing both references: the PTEN
  germline-loss trigger nodes in PTEN_Hamartoma_Tumor_Syndrome,
  Cowden_Syndrome and Bannayan-Riley-Ruvalcaba_Syndrome conform to
  germline_two_hit_tumor_predisposition and to this module's trigger node
  together. Autophagy suppression is deliberately
  left as a terminal effector with no edge into lesion formation: in TSC
  the residual autophagy that persists is itself required for tumour growth
  (PMID:21746920), so the module does not assert that low autophagy causes
  the lesion. Disorders whose mTORC1 signalling is reduced rather than
  released (POLR-related leukodystrophy, Roberts syndrome, several
  immunodeficiencies) are a different mechanism and do not conform here.
  Xogenesis anchor: the terminal output is a hamartoma (MPATH:74), an
  OGMS:0000078 pathological anatomical structure produced by an
  OGMS:0000081 pathological derivation; process genus OGMS:0000061. The
  site is disorder-specific (UBERON term on the conforming node) because
  the same lesion forms in brain, kidney, skin, lung and gut. The anchor is
  prose only: no descriptor slot admits an MPATH or OGMS term.
pathophysiology:
- name: Loss of an Upstream mTORC1 Negative Regulator
  description: >-
    The conserved initiating lesion is loss of function of one of the
    proteins that hold mTORC1 in check. Three branches converge: the
    TSC1/TSC2 complex, whose GAP activity toward Rheb is lost in tuberous
    sclerosis complex and lymphangioleiomyomatosis; the GATOR1 complex
    (DEPDC5, NPRL2, NPRL3), the GAP toward the Rag GTPases on the amino-acid
    sensing arm, together with KICSTOR/SZT2, which anchors GATOR1 to the
    lysosome; PTEN, whose lipid phosphatase restrains the PI3K-AKT input to
    the TSC complex; and STK11/LKB1, the kinase that activates AMPK, which in
    turn phosphorylates TSC2 and Raptor to repress mTORC1 under energy
    stress, so STK11 loss removes that restraint in Peutz-Jeghers syndrome.
    Each is a tumour-suppressor-type brake, so loss rather than gain of the
    gene product releases the pathway.

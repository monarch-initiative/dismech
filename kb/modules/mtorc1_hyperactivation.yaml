    reference_title: "Second-hit mosaic mutation in mTORC1 repressor DEPDC5 causes focal cortical dysplasia-associated epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we detected increased phosphorylation levels of the ribosomal protein
      S6, a well-known readout of mTORC1 activity
    explanation: >-
      The translational readout of the effector measured in human lesion
      tissue.
  - reference: PMID:27226234
    reference_title: "Tuberous sclerosis complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mechanistic target of rapamycin (mTOR) signalling pathway, which in
      turn plays a pivotal part in regulating cell growth, proliferation,
      autophagy and protein and lipid synthesis
    explanation: >-
      Names the anabolic outputs of mTOR signalling that this node and the
      autophagy node divide between them.
  - reference: PMID:18781191
    reference_title: "PTEN hamartoma tumor syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss of PTEN activates this pathway and leads to increased cellular
      growth, migration, proliferation, and survival.
    explanation: >-
      The same growth and proliferation output on the PTEN branch.
  downstream:
  - target: Hamartomatous Overgrowth and Dysplastic Lesion Formation
    description: >-
      Enlarged, proliferating, biallelically null cells accumulate into a
      focal lesion.
- name: Autophagy Suppression
  description: >-
    mTORC1 is a direct inhibitor of autophagy: under nutrient sufficiency it
    phosphorylates ULK1 and blocks its activation by AMPK, and when mTORC1 is
    constitutively active that block persists regardless of nutrient state.
    In TSC lesions the autophagy substrate p62/SQSTM1 accumulates as a
    consequence. The residual autophagy that remains is nonetheless required
    for tumour growth, so this node is an effector of the hyperactive state
    and is not drawn as a cause of the lesion.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:21258367
    reference_title: "AMPK and mTOR regulate autophagy through direct phosphorylation of Ulk1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Under nutrient sufficiency, high mTOR activity prevents Ulk1 activation
      by phosphorylating Ulk1 Ser 757 and disrupting the interaction between
      Ulk1 and AMPK.
    explanation: >-
      The molecular mechanism by which active mTORC1 suppresses autophagy
      initiation.
  - reference: PMID:21746920
    reference_title: "Tumorigenesis in tuberous sclerosis complex is autophagy and p62/sequestosome 1 (SQSTM1)-dependent."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TSC-associated tumors exhibit hyperactivation of mammalian target of
      rapamycin complex 1 (mTORC1), a direct inhibitor of autophagy.
    explanation: >-
      States, as the paper's framing of the human disease, that the lesions
      of the canonical mTORopathy carry hyperactive mTORC1 and that mTORC1
      directly inhibits autophagy.
  - reference: PMID:21746920
    reference_title: "Tumorigenesis in tuberous sclerosis complex is autophagy and p62/sequestosome 1 (SQSTM1)-dependent."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the autophagy substrate that accumulates in TSC tumors as a consequence
      of low autophagy levels
    explanation: >-
      p62/SQSTM1 accumulation in Tsc2-null tumours is the in vivo readout of
      suppressed autophagy in the lesion.
- name: Hamartomatous Overgrowth and Dysplastic Lesion Formation
  description: >-
    The terminal output is a focal, benign, disorganised overgrowth of the
    tissue in which the second hit occurred: cortical tubers and focal
    cortical dysplasia in brain, subependymal giant cell astrocytoma, renal
    angiomyolipoma, cardiac rhabdomyoma, facial angiofibroma,
    lymphangioleiomyomatosis in lung, and the mucocutaneous and visceral
    hamartomas of the PTEN syndromes. Brain lesions are intrinsically
    epileptogenic. Conforming nodes name the organ-specific lesion and bind
    its UBERON site.
  role: consequence
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:27226234
    reference_title: "Tuberous sclerosis complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Major features of the disease include tumours of the brain, skin,
      heart, lungs and kidneys, seizures and TSC-associated neuropsychiatric
      disorders, which can include autism spectrum disorder and cognitive
      disability.
    explanation: >-
      The multi-organ hamartoma spectrum of the canonical mTORopathy.
  - reference: PMID:18781191
    reference_title: "PTEN hamartoma tumor syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These syndromes are driven by cellular overgrowth, leading to benign
      hamartomas in virtually any organ.
    explanation: >-
      The same hamartomatous output on the PTEN branch, showing the lesion
      type is conserved across regulators.
  - reference: PMID:30093711
    reference_title: "The landscape of epilepsy-related GATOR1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GATOR1 seizure phenotype consisted mostly in focal seizures (e.g.,
      hypermotor or frontal lobe seizures in 50%), with a mean age at onset of
      4.4 years, often sleep-related and drug-resistant (54%), and associated
      with focal cortical dysplasia (20%)
    explanation: >-
      On the GATOR1 branch the lesion is focal cortical dysplasia and the
      clinical consequence is drug-resistant focal epilepsy.
treatments:
- name: "Allosteric mTORC1 Inhibition (Rapalogs: Sirolimus, Everolimus)"
  description: >-
    Sirolimus (rapamycin) and everolimus bind FKBP12 and allosterically
    inhibit mTORC1, partially restoring the brake the disease has lost. This
    is the drug-target pattern for conforming disorders: everolimus is
    approved for TSC-associated subependymal giant cell astrocytoma, renal
    angiomyolipoma and seizures, sirolimus for lymphangioleiomyomatosis, and
    both are under evaluation for the GATOR1 focal epilepsies and the PTEN
    hamartoma syndromes. The inhibition is cytostatic, so lesions regrow on
    withdrawal; conforming entries record the indication and evidence
    specific to their disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  target_mechanisms:
  - target: Constitutive mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Allosteric mTORC1 inhibition acts directly on the central effector,
      downstream of whichever regulator the disease has lost, which is why one
      drug class serves every branch of the module.
  evidence:
  - reference: PMID:32222129
    reference_title: "Tuberous sclerosis: a review of the past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subependymal giant cell astrocytomas, renal angiomyolipomas, and
      epilepsy are the three FDA-approved indications in relation to TSC for
      the use of everolimus, which is a first generation mTOR inhibitor.
    explanation: >-
      The approved indications on the TSC branch.
  - reference: PMID:21410393
    reference_title: "Efficacy and safety of sirolimus in lymphangioleiomyomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with LAM, sirolimus stabilized lung function, reduced serum
      VEGF-D levels, and was associated with a reduction in symptoms and
      improvement in quality of life.
    explanation: >-
      Randomised-trial evidence that mTORC1 inhibition modifies disease on
      the sporadic TSC2 branch.
  - reference: PMID:30093711
    reference_title: "The landscape of epilepsy-related GATOR1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently available mTORC1 inhibitors, such as rapamycin, represent
      promising drugs in the treatment of focal epilepsies
    explanation: >-
      The same drug-target pattern proposed for the GATOR1 branch, where it
      is not yet an approved indication.

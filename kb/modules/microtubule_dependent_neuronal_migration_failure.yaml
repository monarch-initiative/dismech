- discussion_id: gap_tubulin_isotype_specificity_of_migration_lesions
  prompt: >-
    Why do lesions in different tubulin isotype genes, all converging on this
    module, produce characteristically different cortical malformation patterns
    - TUBA1A lissencephaly, TUBB2A/TUBB2B polymicrogyria-like dysgyria, TUBB3
    axon-guidance disease, TUBB microcephaly?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Microtubule Apparatus Perturbation
  - pathophysiology#Microtubule-Based Neuronal Motility Failure
  rationale: >-
    The Tubulinopathies grouping keeps its members as separate Disease entries on
    the premise that tubulin isotypes differ in expression timing and binding
    partners, so an equivalent lesion in a different isotype yields a different
    malformation. That premise is the load-bearing justification for the split,
    and until recently it was asserted rather than evidenced. Two independent
    lines of 2026 work now supply the two halves of a mechanism. First,
    composition: spatially resolved atlases show tubulin isotype transcripts are
    not interchangeable across cell states, ranging from broadly expressed
    (TUBA1A, TUBA1B) to cell-type-restricted, with TUBB3 and TUBG1 enriched in
    particular lineages. Second, consequence: the isotype-specific C-terminal
    tails differentially engage motor proteins, with TUBB2A, TUBB2B and TUBB2C
    altering the conformational motions of the dynein microtubule-binding and
    stalk domains. Together these predict that which isotype is mutated
    determines both WHERE and WHEN the lesion is felt and WHICH motor-dependent
    step degrades. What is still missing is the direct test: no study has taken
    one substitution to an equivalent structural position across several isotypes
    in a common cellular background and measured the divergence. Until that
    exists, isotype specificity remains a well-motivated model rather than a
    demonstrated explanation, and curators should not attribute a member's
    distinctive malformation pattern to its isotype as though the causal chain
    were established.
  evidence:
  - reference: PMID:42275208
    reference_title: A spatial and temporal atlas of tubulin isotype gene expression during vertebrate embryonic development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Integration of publicly available single-cell RNA sequencing datasets
      reveals diverse patterns of tubulin gene expression, ranging from broadly
      expressed isotypes (TUBA1A and TUBA1B) to more cell-type-restricted
      transcripts (TUBAL3 and TUBB4B).
    explanation: >-
      Evidences the expression-timing half of the isotype-specificity model:
      tubulin isotypes are differentially, not uniformly, deployed across cell
      states in the developing embryo.
  - reference: PMID:42275208
    reference_title: A spatial and temporal atlas of tubulin isotype gene expression during vertebrate embryonic development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These transcript patterns provide a map of tubulin gene expression, but
      additional studies are needed to determine how they relate to microtubule
      composition.
    explanation: >-
      The authors' own caveat, and the reason this is recorded as a knowledge
      gap: transcript maps are not yet protein-level microtubule composition.
  - reference: PMID:42179625
    reference_title: Investigating the Function of C-Terminal Tails of Human Tubulin Isotypes in the Motility Regulation of Cytoplasmic Dynein.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Among these isotypes, TUBB2A, TUBB2B, and TUBB2C were found to affect
      conformational motions of the dynein's microtubule-binding domain (MTBD)
      and stalk domain.
    explanation: >-
      Evidences the binding-partner half of the model: isotype-specific
      C-terminal tails differentially engage the dynein motor, the same motor
      whose impairment is the resolved mechanism for TUBA1A Arg402 disease.
  - reference: PMID:42179625
    reference_title: Investigating the Function of C-Terminal Tails of Human Tubulin Isotypes in the Motility Regulation of Cytoplasmic Dynein.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Isolating specific tubulin isotypes experimentally is challenging due to
      their high sequence similarity and complex interactions with other
      microtubule-associated proteins.
    explanation: >-
      States why the direct experimental test is still missing, and why this
      evidence is in silico rather than measured.

pathophysiology:
- name: Microtubule Apparatus Perturbation
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variation perturbs the microtubule apparatus used by developing
    neurons and neural progenitors. Representative mechanisms include defective
    DCX-mediated microtubule stabilization, impaired alpha/beta-tubulin
    heterodimer formation or MAP binding, gamma-tubulin nucleation defects,
    altered dynein microtubule binding, and kinesin ATPase/folding defects.

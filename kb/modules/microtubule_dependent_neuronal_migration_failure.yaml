      and maintenance in mammals.
    explanation: >-
      Supports the optional projection-wiring branch of the microtubule module.
treatments:
- name: CRISPRa beta-tubulin isotype compensation
  description: >-
    A mutation-independent, preclinical strategy. Rather than correcting each
    patient variant, CRISPR-Cas9 transcriptional activation (CRISPRa) is used to
    upregulate a NON-mutated beta-tubulin isotype, raising the pool of
    functional tubulin available to the cell and restoring the microtubule
    network. Reported readouts include restoration of the microtubule network
    and of primary cilium formation. The rationale is the shape of this module
    itself: tubulinopathy-causing variants are scattered across several distinct
    tubulin genes and hundreds of positions, which defeats per-variant editing,
    so the intervention targets the shared downstream state at this node
    instead. This is PRECLINICAL cell-based work - no animal efficacy, no
    tolerability data, and no clinical trial - and must not be curated on a
    disorder entry as an available therapy.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Microtubule Apparatus Perturbation
    treatment_effect: RESTORES
    description: >-
      Increasing the abundance of a wild-type beta-tubulin isotype restores the
      microtubule network downstream of the mutant subunit, acting on the
      perturbed microtubule apparatus rather than on the causal allele.
    evidence:
    - reference: PMID:42589608
      reference_title: "Restoring the Balance: CRISPRa-Driven β-Tubulin Compensation as a Strategy for Tubulinopathy Treatment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we describe the development of a mutation-independent treatment
        strategy based on the upregulation of non-mutated beta-tubulin isotype
        protein using CRISPR-Cas9 activation.
      explanation: >-
        States the mechanism of action - transcriptional upregulation of an
        unaffected isotype - and that it is deliberately mutation-independent.
    - reference: PMID:42589608
      reference_title: "Restoring the Balance: CRISPRa-Driven β-Tubulin Compensation as a Strategy for Tubulinopathy Treatment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        By increasing the expression of various beta-tubulin proteins, we
        demonstrate a restoration of the microtubule network and primary cilia
        formation.
      explanation: >-
        Reports the measured effect on this node - restoration of the
        microtubule network - plus rescue of the ciliogenesis branch.
  evidence:
  - reference: PMID:42589608
    reference_title: "Restoring the Balance: CRISPRa-Driven β-Tubulin Compensation as a Strategy for Tubulinopathy Treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in tubulin genes can lead to tubulinopathies, a class of rare
      genetic neurodevelopmental disorders characterized by a range of brain
      malformations and other clinical features.
    explanation: >-
      Frames the intervention as addressed to the tubulinopathies as a class,
      which is why it is curated at module level rather than on one disorder.
  notes: >-
    Preclinical cell-based only as of 2026-08. Curated on the module because it
    is mutation-independent by design; a conforming disorder entry should
    reference it here rather than duplicating it as an available treatment.

experimental_models:
- name: Human iPSC-derived cerebral organoid migration model
  description: >-
    Human pluripotent-stem-cell-derived three-dimensional cerebral or cortical
    organoids used to model lissencephaly and microcephaly mechanisms, including
    live assays of neuronal migration, neuroepithelial apoptosis, cleavage
    orientation, and outer-radial-glial mitotic behavior.
  experimental_model_type: ORGANOID
  namo_type: namo:Organoid
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: migrating cortical neuron
    term:
      id: CL:0000540
      label: neuron
  conditions:
  - lissencephaly
  - microcephaly
  - cortical neuronal migration defect
  cell_source: Human embryonic stem cells, patient-derived iPSCs, or isogenic engineered iPSCs
  culture_system: Three-dimensional cerebral/cortical organoid culture with live imaging and single-cell profiling
  publication: PMID:28111201
  modeled_mechanisms:
  - target: Microtubule Apparatus Perturbation
    description: >-
      Assays whether variant effects on microtubule-linked mitotic behavior,
      radial-glial organization, or organoid growth are conserved in a human
      cortical model.
    evidence:
    - reference: PMID:28111201
      reference_title: "Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also identified a mitotic defect in outer radial glia
      explanation: >-
        Shows that human organoids can reveal a radial-glial mitotic branch that
        is difficult to model in lissencephalic rodents.
  - target: Microtubule-Based Neuronal Motility Failure
    description: >-
      Supports live or endpoint assays of cortical neuron migration from
      organoids and rescue by isogenic correction.
    evidence:
    - reference: PMID:28111201
      reference_title: "Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Defective radial migration of cortical neurons is a well-established
        developmental phenotype in lissencephaly
      explanation: >-
        Supports the organoid migration assay as directly relevant to the module
        central effector.
  findings:
  - statement: >-
      Patient-derived MDS cerebral organoids show a migration defect that can be
      rescued by correction of the causal chromosomal deletion.
    evidence:
    - reference: PMID:28111201
      reference_title: "Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We saw a cell migration defect that was rescued when we corrected the
        MDS causative chromosomal deletion
      explanation: >-
        Supports organoid-based perturbation and rescue as a useful human
        non-animal model for lissencephaly migration mechanisms.
  - statement: >-
      Human cerebral organoid cortical cells can recapitulate fetal-neocortex
      gene-expression programs relevant to cortical development.
    evidence:
    - reference: PMID:26644564
      reference_title: "Human cerebral organoids recapitulate gene expression programs of fetal neocortex development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        these organoid cortical cells use gene expression programs remarkably
        similar to those of the fetal tissue to organize into cerebral
        cortex-like regions.
      explanation: >-
        Supports the human cortical organoid model as a non-animal model for
        developmental cortical mechanisms.
computational_models:
- name: Microtubule-Dependent Radial Neuronal Migration Agent-Based Model
  description: >-
    A one-dimensional, stochastic agent-based model of radial migration along a
    cortical column, in which six birth cohorts of neurons move from the
    ventricular zone through the intermediate zone to a cortical plate that
    grows inside-out as they settle. Authored in this repository rather than
    curated from a publication: each of its five rules transcribes a node or
    causal edge of this module (an apparatus perturbation that is
    cell-autonomous, slows nucleokinesis and can arrest a neuron in the
    intermediate zone, scored as dyslamination and ectopia when the
    developmental window closes), and the spec records per rule which curated
    edge it encodes and which choices the edge did not itself make. The one
    rule with no curated source, inside-out settling, is the null model of
    normal lamination the module's failure claims presuppose, and is labelled
    as a background assumption. The curated intervention is encoded as a
    swept fraction of the perturbation removed. The model asserts no biology
    of its own and nothing in it is fitted to data: every rate is a
    placeholder chosen so that the wild-type scenario completes migration
    inside the window, so the results are orderings of regimes, never
    quantities.
  model_type: AGENT_BASED
  model_id: neuronal_migration_abm
  model_format: Agent-based rule specification (YAML)
  model_software: Python (standard library and PyYAML)
  variables:
  - name: perturbation
    description: >-
      Degree of microtubule-apparatus disruption in an affected neuron, 0 to 1.
      The scalar input the module's trigger node becomes; it is not a measured
      quantity of any gene.
    unit: dimensionless
  - name: affected_fraction
    description: >-
      Fraction of neurons carrying the perturbation. 1 for a constitutional
      variant; below 1 for a defect present in only some neurons, representable
      because the curated evidence states the defect is cell-autonomous.
    unit: dimensionless
  - name: cortical_plate_fraction
    description: Fraction of neurons settled in the cortical plate when the developmental window closes.
    unit: dimensionless
  - name: lamination_fidelity
    description: >-
      Fraction of settled neuron pairs from different birth cohorts whose depth
      order matches birth order. 1 is perfect inside-out lamination, 0.5 is no
      relation between birth order and depth.
    unit: dimensionless
  - name: band_score
    description: >-
      Among arrested affected neurons, the fraction lying within five depth
      units of their median depth; high when they form a band rather than a
      diffuse scatter.
    unit: dimensionless
  findings:
  - statement: >-
      Uniform slowing of every neuron, the reading of the module's central edge
      with no arrest, preserves inside-out lamination until the perturbation
      is strong enough to strand the latest-born cohorts outside the window.
    supporting_text: >-
      In the perturbation sweep without arrest, every neuron still settles and
      the lamination fidelity stays above 0.97 up to a perturbation of 0.3;
      beyond that the plate fraction falls cohort by cohort from the
      latest-born down (in the delayed_migration scenario, at 0.5, the first
      two cohorts settle completely, the third 99% and the last 9%), and
      fidelity falls only because slower migration
      spreads each cohort's arrival times until cohorts interleave. What the
      encoded chain produces is therefore a thin cortex missing its
      superficial layers, with delayed neurons caught beneath earlier-born
      ones. It does not produce the thickened, poorly laminated plate the
      dyslamination node describes, because nothing in the module says how
      a slowed neuron interacts with neurons already settled. That is a gap in
      the curated chain the model makes visible, not a prediction about the
      malformation.
  - statement: >-
      Arrest, not slowing, is what puts neurons in the intermediate zone, and
      with every neuron affected the arrested cells scatter rather than band.
    supporting_text: >-
      With arrest switched on, the arrested fraction rises with the
      perturbation while the in-transit fraction stays small until the
      perturbation is severe, so ectopia in the intermediate zone is the
      arrest rule's signature. The band score of those arrested cells stays
      between 0.19 and 0.31 across the constitutional sweep up to a
      perturbation of 0.7: neurons arrest wherever the per-step hazard
      catches them, which is spread over the whole zone. At 0.8 and above the
      score rises again for a reason that is not a band: almost no neuron
      moves before the hazard catches it, so the arrested cells pile up near
      their birth position. A constitutional perturbation never classifies as
      a band in this model, both because of the low score and because the
      classifier requires an unaffected cortex laminated above the band.
  - statement: >-
      A heterotopic band beneath a normally laminated cortex emerges only when
      the perturbation is present in a fraction of neurons, and then at every
      fraction from 0.1 to 0.9.
    supporting_text: >-
      In the affected-fraction sweep at a severe perturbation, the unaffected
      neurons build a plate with lamination fidelity above 0.999 at every
      fraction, the affected neurons arrest in a band with a band score of
      0.63 to 0.73, and the pattern classifies as band heterotopia from 0.1 to
      0.9. This follows from a single curated fact, that the migration defect
      is cell-autonomous (PMID:9697693 on the motility node), plus the model's
      arrest rule; no rule refers to the fraction. The band's depth is an
      artefact of the encoding rather than a result: severely perturbed
      neurons barely move before the hazard catches them, so the band sits
      just above the ventricular zone (median depth 15 to 16 of a 60-unit
      migration), which is not where a subcortical band lies.
  - statement: >-
      The curated intervention rescues migration monotonically in the model,
      but that is an implication of the RESTORES edge, not a reported result.
    supporting_text: >-
      Removing 60% of a severe perturbation moves the outcome from complete
      migration failure to a 71% plate with fidelity 0.98, and full removal
      restores the wild-type pattern. The cited work (PMID:42589608) measures
      restoration of the microtubule network and primary cilia in cells and
      reports nothing about migration, so the sweep says what the curated
      edge implies if restoring the apparatus restores motility in
      proportion, and the rescue fraction is a swept value with no
      measurement behind it.
  modeled_mechanisms:
  - target: Microtubule Apparatus Perturbation
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The node is the model's input: a scalar in 0 to 1 that every rule reads
      through the effective perturbation of each affected neuron. The model
      does not represent the apparatus itself.
    limitations: >-
      No microtubule, motor, MAP or tubulin isotype is represented; the node's
      DYSREGULATED microtubule cytoskeleton organization is a single number
      whose only meaning is how much it slows and arrests an agent. The
      module's list of nine genes has no counterpart, so the model cannot
      distinguish one tubulinopathy from another.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        A scalar perturbation strength stands in for the state of the
        microtubule apparatus. The curated node describes qualitatively
        different lesions (nucleation defects, heterodimer formation, MAP
        binding, dynein binding, kinesin ATPase) that the model collapses
        into one degree of slowing.
    - divergence_type: CALIBRATION_PROVENANCE
      materiality: QUALIFYING
      description: >-
        Nothing is calibrated. No rate, threshold or window length is fitted
        to any dataset; the scenario values are placeholders chosen around a
        wild-type run that completes migration.
  - target: Microtubule-Based Neuronal Motility Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reproduced as two per-agent rules read off the node: a per-step
      probability of nucleokinesis that falls linearly with the effective
      perturbation (the node's DECREASED neuron migration), and a per-step
      hazard of permanent arrest inside the intermediate zone (the node's
      "arrested cells in intermediate/subventricular regions"). The two are
      swept separately so delayed and arrested migration can be told apart.
    limitations: >-
      One-dimensional and cell-autonomous. Radial glia are the axis rather
      than agents; leading-process stabilization, centrosome-nucleus coupling
      and the multipolar, locomotion and terminal-translocation phases the
      node names are collapsed into a single step probability. Linear
      dependence on the perturbation is the least-committed monotone choice,
      not a curated one.
    divergences:
    - divergence_type: STRUCTURAL_IDEALIZATION
      materiality: QUALIFYING
      description: >-
        Migration is a biased random walk along one axis with a constant
        step. Nucleokinesis in the cited sources is a saltatory, phase-
        dependent movement with a leading process, and the node's several
        failure modes (delay, arrest, abnormal positioning) are here two
        parameters.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The radial-glial scaffold the curated node names as the substrate of
        locomotion is not in the model, so neither is any defect of the
        scaffold itself; the module's own notes route pial and radial-glial
        endfoot failure to other modules, and the model inherits that
        boundary.
    - divergence_type: CALIBRATION_PROVENANCE
      materiality: QUALIFYING
      description: >-
        The base motility, arrest hazard and cohort timing are placeholders
        and no in-utero electroporation or organoid migration measurement is
        used to set them, so the perturbation at which a regime changes is
        not a prediction.
    readouts:
    - name: Mean arrival delay from birth to settling
      target: Microtubule-Based Neuronal Motility Failure
      direction: INCREASED
      interpretation: >-
        Rises monotonically with the perturbation in both sweeps, from 76
        steps at wild type to over 200 where any neuron still settles.
    - name: Fraction of neurons arrested in the intermediate zone
      target: Microtubule-Based Neuronal Motility Failure
      direction: INCREASED
      interpretation: >-
        Zero without the arrest rule at any perturbation; with it, rises with
        the perturbation and is the only route by which neurons end in the
        intermediate zone rather than merely late.
  - target: Cortical Dyslamination and Neuronal Ectopia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Scored rather than simulated: when the developmental window closes, the
      settled neurons' depth order is compared with their birth order and the
      unsettled neurons are counted as ectopic by zone. The band score asks
      whether arrested affected neurons cluster in depth.
    limitations: >-
      The tissue-level outcome is inferred from cell positions on one axis,
      so no gyral pattern, plate thickness beyond a count, or cortical
      layering beyond rank order is represented. The window length is
      unfitted and decides how much delay counts as ectopia. The model cannot
      produce a thickened, poorly laminated plate, because the module curates
      no interaction between a delayed neuron and neurons already settled.
    divergences:
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model observes cell positions and settle order; dyslamination,
        heterotopia and lissencephaly are tissue-scale outcomes it reaches
        by scoring those positions against fixed thresholds stated in the
        results file, not by simulating tissue.
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        The lissencephalic plate the node describes is thick and
        poorly laminated. The model has no rule by which a delayed neuron
        fails to pass earlier-born neurons or by which the plate thickens,
        so for that specific histology the model is a placeholder: its only
        dyslamination is cohort interleaving from arrival-time spread, plus
        stranded late cohorts. Ectopia and a mosaic band are the outcomes it
        can represent.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        Scoring at one fixed window end; the module says the outcome depends
        on the developmental window, and a longer window would reclassify
        delayed neurons as settled.
    readouts:
    - name: Lamination fidelity across the perturbation sweep
      target: Cortical Dyslamination and Neuronal Ectopia
      direction: DECREASED
      interpretation: >-
        Falls from 1.0 at wild type as slowed cohorts interleave, and is
        undefined once no neuron settles.
    - name: Band score in the mosaic scenarios
      target: Cortical Dyslamination and Neuronal Ectopia
      direction: INCREASED
      interpretation: >-
        Between 0.63 and 0.73 whenever a fraction of neurons carries a severe
        perturbation and the rest build a normal plate above them, against
        0.19 to 0.31 when every neuron is affected at perturbations up to 0.7.
  notes: >-
    Spec models/neuronal_migration_abm.yaml, runner
    models/neuronal_migration_abm.py, committed results
    models/neuronal_migration_abm.results.json. Regenerate with `uv run python
    models/neuronal_migration_abm.py`; `--check` fails if the committed results
    are stale and `--print` shows the summary. The runner is deterministic
    (every draw comes from a string-seeded random.Random), uses only the
    standard library and PyYAML, and finishes in about two seconds. NOT wired
    to dismech-perturb and deliberately given no
    models/neuronal_migration_abm.config.yaml: that runner executes SBML
    through tellurium and cannot run an agent-based simulation, so the model is
    correctly reported as not runnable in-repo by the models browser. The
    spec's rules are written in the shape of a PhysiCell cell-behaviour rule
    (cell type, signal, direction, behaviour) so they could be ported to that
    engine; no PhysiCell rules file is committed because the half-max and Hill
    parameters such a file requires would have to be invented. The axon
    guidance branch of this module is outside the model on purpose. The four
    biological_scale tags on this module's pathophysiology nodes were added
    with the model so that the model-scale audit can compare the model's
    CELLULAR observations with each target.

name: Deregulated Nutrient Sensing Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed deregulated nutrient sensing: the age-associated shift of the
  nutrient- and growth-sensing network toward persistent anabolic signaling.
  In a state of nutrient/growth-factor surplus, the anabolic sensors - the
  somatotroph GH/IGF-1 axis and the mechanistic target of rapamycin complex 1
  (mTORC1), which senses amino-acid and nutrient abundance - are chronically
  engaged, while the catabolic, low-energy sensors (AMP-activated protein
  kinase, AMPK, and the NAD+-dependent sirtuins, plus the amino-acid-scarcity
  sensor GCN2 and its FGF21 endocrine output) are relatively attenuated.
  mTORC1 hyperactivation biases the cell toward growth and biosynthesis and
  suppresses macroautophagy, so the age-associated accumulation of damaged
  proteins and organelles is no longer efficiently cleared; the net result is
  accelerated cellular aging and age-related tissue decline. This is the
  conserved node that dietary restriction and the geroprotector drugs
  (rapamycin, metformin) act upon: down-shifting anabolic nutrient signaling
  extends lifespan and healthspan across model organisms. Individual disorder
  entries declare conformance via conforms_to on their pathophysiology nodes,
  substituting the tissue- or disease-specific driver (e.g. constitutive
  mTORC1 activation from PI3K-AKT-TSC pathway lesions, or an accelerated-aging
  progeroid context) while preserving the conserved anabolic-signaling ->
  autophagy-suppression -> tissue-decline chain.
category: Module
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "deregulated_nutrient_sensing#mTORC1 Hyperactivation"). Conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their disease context. The module is
  intentionally kept lean: it captures the conserved anabolic-vs-catabolic
  nutrient-sensing imbalance, its convergence on autophagy suppression, and
  the geroprotector drug-target pattern (rapamycin and metformin both restrain
  the anabolic mTORC1 node via target_mechanisms; dietary protein/amino-acid
  restriction is the non-pharmacological arm of the same pattern), but
  deliberately does NOT embed disease-specific or contested downstream theories
  (e.g. tissue-specific
  mTOR-driven pathologies, or the antagonistic-pleiotropy debate on whether
  mTOR inhibition trades growth for longevity). Such specific or
  context-dependent claims belong on the relevant disorder or
  comorbidity/trajectory entry, which may conforms_to or reference this module.
  Complements the cellular_senescence module (another antagonistic hallmark of
  aging): deregulated nutrient sensing is one of several senescence-inducing
  stresses, and both converge on age-related tissue dysfunction. Key
  conformance target: "deregulated_nutrient_sensing#mTORC1 Hyperactivation".
  The module models TWO catabolic sensing arms that nutrient surplus leaves
  attenuated, and they are not interchangeable: AMPK/sirtuins sense energy
  (low ATP/high AMP, NAD+), while GCN2 senses amino-acid scarcity via uncharged
  tRNAs. The distinction matters because dietary protein and amino-acid
  restriction acts through the GCN2 arm - and its FGF21 endocrine output -
  rather than through energy restriction, which is why protein restriction
  extends lifespan without reducing calorie intake. A disorder conforming only
  to the mTORC1 node should not be assumed to engage the GCN2/FGF21 arm.
  Two cautions on the amino-acid arm, both carried as open discussions rather
  than settled model content. First, individual amino acids are NOT
  interchangeable: isoleucine or valine restriction each extends mouse lifespan
  on its own, while leucine restriction - the strongest mTORC1 activator of the
  three branched-chain amino acids - does not improve metabolic health, so a
  conforming entry should name the amino acid it means. Second, the evidence is
  split across the chain: the proximal FGF21/energy-expenditure response is now
  shown directly in humans, but the lifespan benefit is rodent-only and
  repeatedly male-biased, and no long-term human data exist in the older adults
  for whom higher protein intake is clinically recommended.
pathophysiology:
- name: Nutrient Surplus and Anabolic Signaling
  description: >-
    A sustained state of nutrient and growth-factor abundance keeps the
    anabolic arm of the nutrient-sensing network engaged: the somatotroph
    GH/IGF-1 axis and amino-acid/nutrient sensing upstream of mTORC1. Because
    reducing the activity of these nutrient-sensing pathways (by dietary
    restriction, mutation, or chemical inhibitors) extends lifespan and lowers
    age-related disease, their chronic engagement is the initiating driver of
    the deregulated-nutrient-sensing hallmark.
  role: trigger
  biological_processes:
  - preferred_term: Cellular Response to Nutrient Levels
    term:
      id: GO:0031669
      label: cellular response to nutrient levels
    modifier: INCREASED
  - preferred_term: Insulin-Like Growth Factor Receptor Signaling
    term:
      id: GO:0048009
      label: insulin-like growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20395504
    reference_title: "Extending healthy life span--from yeast to humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When the food intake of organisms such as yeast and rodents is reduced
      (dietary restriction), they live longer than organisms fed a normal diet.
      A similar effect is seen when the activity of nutrient-sensing pathways is
      reduced by mutations or chemical inhibitors.
    explanation: >-
      Establishes that the activity of nutrient-sensing pathways is the lever on
      lifespan - reducing it extends life - so their chronic engagement in
      nutrient surplus is the initiating driver modeled here. Evidence source is
      OTHER because this is a review.
  - reference: PMID:23746838
    reference_title: "The hallmarks of aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These hallmarks are: genomic instability, telomere attrition, epigenetic
      alterations, loss of proteostasis, deregulated nutrient sensing,
      mitochondrial dysfunction, cellular senescence, stem cell exhaustion, and
      altered intercellular communication.
    explanation: >-
      Enumerates deregulated nutrient sensing as one of the conserved hallmarks
      of aging, framing this module. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: mTORC1 Hyperactivation
  - target: AMPK and Sirtuin Catabolic-Sensing Attenuation
  - target: GCN2 Amino-Acid-Scarcity Sensing Attenuation

- name: mTORC1 Hyperactivation
  description: >-
    Persistent nutrient and growth-factor input drives chronic activation of
    mTOR complex 1 (mTORC1), the master anabolic sensor that couples nutrient
    availability to cell growth, protein translation, and biosynthesis. Because
    inhibition of the mTOR pathway extends lifespan across model organisms and
    protects against a growing list of age-related pathologies, its
    age-associated hyperactivation is the central effector of this hallmark and
    the node targeted by rapamycin and (indirectly, via AMPK) metformin. This is
    the conserved central node that disease-specific mTOR-activating lesions
    converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: TORC1 Signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:23325216
    reference_title: "mTOR is a key modulator of ageing and age-related disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A leading target for such interventions is the nutrient response pathway
      defined by the mechanistic target of rapamycin (mTOR). Inhibition of this
      pathway extends lifespan in model organisms and confers protection against
      a growing list of age-related pathologies.
    explanation: >-
      Establishes the mTOR nutrient-response pathway as the leading modifiable
      aging target and its inhibition as protective, supporting mTORC1
      hyperactivation as the central effector node. Evidence source is OTHER
      because this is a review.
  - reference: PMID:27304501
    reference_title: "The Mechanistic Target of Rapamycin: The Grand ConducTOR of Metabolism and Aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it is now clear that mTOR functions as a central coordinator of organismal
      metabolism in response to both environmental and hormonal signals
    explanation: >-
      Characterizes mTOR as the central coordinator of metabolism in response to
      nutrient and hormonal cues, supporting its role as the hub of the
      nutrient-sensing hallmark. Evidence source is OTHER because this is a
      review.
  - reference: PMID:42320027
    reference_title: "Cell-based screen identifies translation state modulators that extend lifespan in Drosophila melanogaster and Caenorhabditis elegans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A pilot screen identified compounds that preferentially increased the
      expression of mRNAs with short 5'-UTRs relative to those with long
      5'-UTRs, and these hits were enriched for known lifespan-extending agents,
      such as curcumin and rapamycin.
    explanation: >-
      Identifies the translational output of this node - 4E-BP/eIF4E-dependent,
      5'-UTR-length-selective translation - as a shared signature of
      lifespan-extending compounds, recovered by an unbiased cell-based screen
      rather than assumed. Supports translational control as the functional
      readout of mTORC1 activity that geroprotectors act through. Evidence
      source is IN_VITRO because the screen is a cell-based reporter assay; the
      paper's accompanying lifespan work in Drosophila and C. elegans is
      separate.
  downstream:
  - target: Autophagy Suppression and Anabolic Bias
  - target: Accelerated Cellular Aging and Age-Related Tissue Decline

- name: AMPK and Sirtuin Catabolic-Sensing Attenuation
  description: >-
    In parallel with anabolic hyperactivation, the catabolic low-energy sensors
    that oppose mTORC1 - AMP-activated protein kinase (AMPK, which senses a low
    energy/high-AMP state) and the NAD+-dependent sirtuins - are relatively
    attenuated in the nutrient-replete aging state. These sensors normally drive
    the protective, pro-longevity response to nutrient scarcity (the mechanism
    engaged by dietary restriction, Sirtuin 1 activation, and metformin), so
    their reduced activity reinforces the anabolic bias and its downstream
    consequences.
  role: effector
  biological_processes:
  - preferred_term: Cellular Response to Starvation
    term:
      id: GO:0009267
      label: cellular response to starvation
    modifier: DECREASED
  - preferred_term: Energy Homeostasis
    term:
      id: GO:0097009
      label: energy homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21884931
    reference_title: "Autophagy and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      its inhibition compromises the longevity-promoting effects of caloric
      restriction, Sirtuin 1 activation, inhibition of insulin/insulin growth
      factor signaling, or the administration of rapamycin, resveratrol, or
      spermidine
    explanation: >-
      Groups caloric restriction, Sirtuin 1 activation, and reduced
      insulin/IGF signaling as the conserved longevity-promoting arm opposed to
      anabolic nutrient signaling, supporting the catabolic-sensing node whose
      attenuation is modeled here. Evidence source is OTHER because this is a
      review.
  - reference: PMID:20395504
    reference_title: "Extending healthy life span--from yeast to humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In rodents, both dietary restriction and decreased nutrient-sensing
      pathway activity can lower the incidence of age-related loss of function
      and disease, including tumors and neurodegeneration.
    explanation: >-
      Shows that engaging the catabolic/low-nutrient response (dietary
      restriction) lowers age-related disease, so its attenuation in the
      nutrient-replete state is pathogenic. Evidence source is OTHER because
      this is a review.
  - reference: PMID:41432067
    reference_title: "Computer prediction and genetic analysis identifies retinoic acid modulation as a driver of conserved longevity pathways in genetically diverse Caenorhabditis nematodes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to FOXO/DAF-16, the Akt-phosphorylation targeted Nrf2 homolog
      SKN-1 and heat shock transcription factor 1 homolog HSF-1, along with the
      conserved catalytic subunit of the energy sensor AMPK AAK-2, are required
      for atRA-induced lifespan extension.
    explanation: >-
      Genetic epistasis establishing that the AMPK catalytic subunit is
      required for a pharmacological longevity effect, not merely correlated
      with it - loss of function at aak-2 abolishes the lifespan extension.
      This is the strongest available evidence class for the causal role of
      catabolic nutrient sensing modeled in this node, since it tests necessity
      rather than association. Note the same paper finds aak-2 accounts for only
      about a quarter of the compound's transcriptional response, so the
      requirement is not purely transcriptional. Evidence source is
      MODEL_ORGANISM (Caenorhabditis mutant strains).
  downstream:
  - target: Autophagy Suppression and Anabolic Bias
  - target: Accelerated Cellular Aging and Age-Related Tissue Decline

- name: GCN2 Amino-Acid-Scarcity Sensing Attenuation
  description: >-
    The second catabolic sensing arm, sensing amino-acid rather than energy
    scarcity. GCN2 (general control nonderepressible 2) is the conserved
    stress-responsive kinase activated by the uncharged tRNAs that accumulate
    when amino acids are limiting; activated GCN2 phosphorylates eIF2-alpha,
    repressing global translation while selectively increasing translation of
    ATF4, and it additionally restrains TORC1 directly. Because this sensor is
    engaged only by amino-acid scarcity, a protein- and amino-acid-replete state
    leaves the GCN2-eIF2-alpha-ATF4 integrated stress response unmobilized:
    translation is not restrained, ATF4 target genes are not induced, and the
    GCN2-mediated brake on TORC1 is absent. Engaging this arm is what dietary
    protein and amino-acid restriction does, and GCN2 is required for the
    lifespan extension those diets produce - so its quiescence in nutrient
    surplus is the amino-acid-sensing counterpart of AMPK/sirtuin attenuation.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: GCN2-Mediated Signaling
    term:
      id: GO:0140469
      label: GCN2-mediated signaling
    modifier: DECREASED
  - preferred_term: Cellular Response to Amino Acid Starvation
    term:
      id: GO:0034198
      label: cellular response to amino acid starvation
    modifier: DECREASED
  - preferred_term: Integrated Stress Response Signaling
    term:
      id: GO:0140467
      label: integrated stress response signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:7623840
    reference_title: "The histidyl-tRNA synthetase-related sequence in the eIF-2 alpha protein kinase GCN2 interacts with tRNA and is required for activation in response to starvation for different amino acids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cells containing a defective aminoacyl-tRNA synthetase also stimulated GCN2
      phosphorylation of eIF-2 in the absence of amino acid starvation,
      indicating that uncharged tRNA levels are the most direct regulator of GCN2
      kinase.
    explanation: >-
      Identifies uncharged tRNA as the direct activating ligand of GCN2,
      establishing GCN2 as the amino-acid-scarcity sensor that stays quiescent
      when amino acids are abundant. Evidence source is IN_VITRO (biochemical and
      genetic analysis in cultured budding yeast).
  - reference: PMID:11106749
    reference_title: "Regulated translation initiation controls stress-induced gene expression in mammalian cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When activated by their cognate upstream stress signals, the mammalian eIF2
      kinases PERK and GCN2 repress translation of most mRNAs but selectively
      increase translation of Activating Transcription Factor 4 (ATF4)
    explanation: >-
      Establishes the mammalian GCN2-eIF2-alpha-ATF4 output - global translational
      repression with selective ATF4 induction - that is the protective response
      not mobilized in the amino-acid-replete state modeled here. Evidence source
      is IN_VITRO (targeted mutations in cultured murine cells).
  - reference: PMID:27979906
    reference_title: "4E-BP is a target of the GCN2-ATF4 pathway during Drosophila development and aging."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that GCN2 and its downstream transcription factor, ATF4,
      mediate 4E-BP induction, and GCN2 is required for lifespan extension in
      response to dietary restriction of amino acids.
    explanation: >-
      Shows GCN2 is required for the lifespan extension produced by amino-acid
      restriction, establishing that engagement of this sensing arm - and hence
      its attenuation in nutrient surplus - is causally tied to longevity.
      Evidence source is MODEL_ORGANISM (Drosophila melanogaster).
  - reference: PMID:30117416
    reference_title: "Ssd1 and Gcn2 suppress global translation efficiency in replicatively aged yeast while their activation extends lifespan."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      tRNA overexpression activated Gcn2 in young cells and extended lifespan in
      a manner dependent on Gcn4.
    explanation: >-
      Direct activation of Gcn2 extends replicative lifespan, showing that the
      engaged state of this sensor is pro-longevity and its attenuation is the
      pathogenic direction. Evidence source is IN_VITRO (replicative lifespan in
      cultured budding yeast).
  - reference: PMID:28057755
    reference_title: "General Control Nonderepressible 2 (GCN2) Kinase Inhibits Target of Rapamycin Complex 1 in Response to Amino Acid Starvation in Saccharomyces cerevisiae."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the absence of Gcn2, TORC1 signaling activity increases and becomes
      unresponsive to amino acid starvation.
    explanation: >-
      Demonstrates that loss of GCN2 input raises TORC1 signaling and uncouples it
      from amino-acid status, supporting the causal edge from attenuated GCN2
      sensing to mTORC1 hyperactivation. Evidence source is IN_VITRO (biochemistry
      in cultured budding yeast).
  downstream:
  - target: mTORC1 Hyperactivation
  - target: Attenuated FGF21 Endocrine Starvation Response
  - target: Autophagy Suppression and Anabolic Bias

- name: Attenuated FGF21 Endocrine Starvation Response
  description: >-
    The organism-level endocrine output of the amino-acid-sensing arm. FGF21 is a
    hepatokine induced by amino-acid scarcity downstream of GCN2/ATF4 acting on
    amino-acid response elements in the FGF21 promoter; once secreted it drives
    the systemic adaptive starvation response (increased energy expenditure,
    improved insulin sensitivity, restrained somatic growth via the GH/IGF-1
    axis). In a protein-replete state this signal stays low. The node is included
    because FGF21 is not merely correlative: it is required for dietary protein
    restriction to extend lifespan, and raising it alone is sufficient to extend
    lifespan - making the attenuated FGF21 signal an independent endocrine route
    from deregulated amino-acid sensing to age-related decline, parallel to the
    cell-autonomous mTORC1/autophagy route. The dependence on GCN2 is partial and
    time-limited rather than absolute: Gcn2-null mice recover low-protein-induced
    FGF21 after roughly two weeks on diet, so GCN2-independent routes to FGF21
    induction operate on longer timescales and this node should not be curated as
    strictly GCN2-gated.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Fibroblast Growth Factor Receptor Signaling
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: DECREASED
  - preferred_term: Response to Starvation
    term:
      id: GO:0042594
      label: response to starvation
    modifier: DECREASED
  evidence:
  - reference: PMID:27396336
    reference_title: "Metabolic Responses to Dietary Protein Restriction Require an Increase in FGF21 that Is Delayed by the Absence of GCN2."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data indicate that FGF21 is essential for the metabolic response to
      protein restriction but that GCN2 is only transiently required for
      LP-induced FGF21.
    explanation: >-
      Supports the FGF21 endocrine arm as essential, but only partially supports
      the upstream GCN2 -> FGF21 edge: Gcn2 KO mice initially phenocopy Fgf21 KO
      yet recover LP-induced hepatic Fgf21 expression and circulating FGF21 after
      roughly 14 days on diet, so GCN2 is transiently rather than permanently
      required and GCN2-independent routes to FGF21 induction operate on longer
      timescales. Evidence source is MODEL_ORGANISM (Fgf21 and Gcn2 knockout
      mice).
  - reference: PMID:35393401
    reference_title: "FGF21 is required for protein restriction to extend lifespan and improve metabolic health in male mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data demonstrate that protein restriction in aging male mice exerts
      marked beneficial effects on lifespan and metabolic health and that a single
      metabolic hormone, FGF21, is essential for the anti-aging effect of this
      dietary intervention.
    explanation: >-
      Shows FGF21 is necessary for protein restriction to extend lifespan, so
      failure to induce it in a protein-replete state is a mechanistically
      required step toward age-related decline. Evidence source is MODEL_ORGANISM
      (Fgf21 knockout vs wildtype male mice).
  - reference: PMID:23066506
    reference_title: "The starvation hormone, fibroblast growth factor-21, extends lifespan in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that transgenic overexpression of FGF21 markedly extends
      lifespan in mice without reducing food intake or affecting markers of NAD+
      metabolism or AMP kinase and mTOR signaling.
    explanation: >-
      Elevated FGF21 alone is sufficient to extend lifespan, and does so without
      engaging AMPK or mTOR - establishing this endocrine arm as an independent
      route rather than a readout of the mTORC1 node. Evidence source is
      MODEL_ORGANISM (FGF21-transgenic mice).
  - reference: PMID:40050437
    reference_title: "Dietary protein restriction elevates FGF21 levels and energy requirements to maintain body weight in lean men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also show that fasting plasma FGF21 levels increase during protein
      restriction.
    explanation: >-
      The human arm of this node: in a controlled eucaloric dietary intervention
      in healthy lean men, restricting protein to the minimum requirement raised
      fasting plasma FGF21, showing the amino-acid-scarcity-to-FGF21 coupling is
      not mouse-specific. Note this establishes the proximal endocrine response
      only - no human lifespan claim follows from it. Evidence source is
      HUMAN_CLINICAL.
  - reference: PMID:40050437
    reference_title: "Dietary protein restriction elevates FGF21 levels and energy requirements to maintain body weight in lean men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show in lean, healthy men that a protein-restricted diet meeting
      the minimum protein requirements for 5 weeks necessitates an increase in
      energy intake to uphold body weight, regardless of whether proteins are
      replaced with fats or carbohydrates.
    explanation: >-
      Demonstrates the functional consequence of the induced FGF21 signal in
      humans - a raised energy requirement to hold weight steady, the systemic
      adaptive starvation response this node describes - and that it is driven by
      protein content rather than by which macronutrient replaces it. Evidence
      source is HUMAN_CLINICAL.
  downstream:
  - target: Accelerated Cellular Aging and Age-Related Tissue Decline

- name: Autophagy Suppression and Anabolic Bias
  description: >-
    Active mTORC1 suppresses macroautophagy, while attenuated AMPK/sirtuin
    signaling fails to induce it. Autophagy is the cytoplasmic recycling process
    that clears damaged organelles and proteins; its induction by starvation or
    genetic inactivation of nutrient signaling counteracts the age-associated
    accumulation of cellular damage. When nutrient signaling holds autophagy
    suppressed, this quality-control capacity is lost and damaged components
    accumulate - the amplifying step that links deregulated nutrient sensing to
    tissue decline.
  role: amplifier
  biological_processes:
  - preferred_term: Negative Regulation of Macroautophagy
    term:
      id: GO:0016242
      label: negative regulation of macroautophagy
    modifier: INCREASED
  - preferred_term: Autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:25654554
    reference_title: "Essential role for autophagy in life span extension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both starvation and the genetic inactivation of nutrient signaling
      converge on the induction of autophagy, a cytoplasmic recycling process
      that counteracts the age-associated accumulation of damaged organelles and
      proteins as it improves the metabolic fitness of cells.
    explanation: >-
      Establishes that inactivating nutrient signaling induces autophagy, which
      clears age-associated damage; conversely, active nutrient signaling
      suppresses autophagy, the mechanism modeled in this node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:21884931
    reference_title: "Autophagy and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      normal and pathological aging are often associated with a reduced
      autophagic potential
    explanation: >-
      Documents reduced autophagic potential as a feature of aging, supporting
      autophagy suppression as an amplifying step. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Accelerated Cellular Aging and Age-Related Tissue Decline

- name: Accelerated Cellular Aging and Age-Related Tissue Decline
  description: >-
    The sustained anabolic bias, attenuated stress-responsive catabolic
    signaling, and suppressed autophagy converge on accelerated cellular aging:
    accumulation of damaged macromolecules and organelles, loss of proteostatic
    and metabolic fitness, and declining tissue function. This is the conserved
    consequence by which deregulated nutrient sensing contributes causally to
    age-related pathology; the specific organ or disease phenotype is supplied
    by the conforming disorder. It is the outcome that geroprotector
    interventions (dietary restriction, rapamycin, metformin) are intended to
    delay.
  role: consequence
  evidence:
  - reference: PMID:23746838
    reference_title: "The hallmarks of aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This deterioration is the primary risk factor for major human pathologies,
      including cancer, diabetes, cardiovascular disorders, and neurodegenerative
      diseases.
    explanation: >-
      States that age-associated deterioration is the primary risk factor for
      the major age-related diseases, the consequence arm modeled here. Evidence
      source is OTHER because this is a review.
  - reference: PMID:20395504
    reference_title: "Extending healthy life span--from yeast to humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In rodents, both dietary restriction and decreased nutrient-sensing
      pathway activity can lower the incidence of age-related loss of function
      and disease, including tumors and neurodegeneration.
    explanation: >-
      Demonstrates that down-shifting nutrient signaling reduces age-related loss
      of function and disease, establishing the causal link from the pathway to
      this outcome node. Evidence source is OTHER because this is a review.
  - reference: PMID:22587563
    reference_title: "Rapamycin slows aging in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report here that many forms of age-dependent change, including
      alterations in heart, liver, adrenal glands, endometrium, and tendon, as
      well as age-dependent decline in spontaneous activity, occur more slowly
      in rapamycin-treated mice, suggesting strongly that rapamycin retards
      multiple aspects of aging in mice, in addition to any beneficial effects
      it may have on neoplastic disease.
    explanation: >-
      Directly addresses the alternative reading of rapamycin's lifespan effect,
      that it merely suppresses lethal neoplasia rather than slowing aging: the
      multi-tissue histopathology shows age-dependent change is retarded across
      heart, liver, adrenal, endometrium and tendon. This is what licenses the
      node's claim that mTOR inhibition delays tissue-level aging broadly rather
      than acting on one disease. The same study reports harms (increased
      testicular degeneration and cataracts), so this is not evidence of uniform
      benefit. Evidence source is MODEL_ORGANISM (UM-HET3 mice, NIA
      Interventions Testing Program).
treatments:
- name: Rapamycin (mTOR Inhibition)
  description: >-
    Rapamycin (sirolimus) is a small-molecule inhibitor of mTORC1 that, by
    binding FKBP12, decreases mTOR complex 1 activity. It is the prototypical
    geroprotector: pharmacologic inhibition of the anabolic nutrient-sensing hub
    extends lifespan in model organisms including mice, even when started late in
    life. Represents the anabolic-node inhibition drug-target design pattern for
    conforming disorders.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Rapamycin directly inhibits mTORC1, down-shifting the anabolic
      nutrient-sensing hub and relieving its suppression of autophagy.
  evidence:
  - reference: PMID:19587680
    reference_title: "Rapamycin fed late in life extends lifespan in genetically heterogeneous mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we report that rapamycin, an inhibitor of the mTOR pathway, extends
      median and maximal lifespan of both male and female mice when fed
      beginning at 600 days of age.
    explanation: >-
      Genetically heterogeneous mice fed rapamycin late in life show extended
      lifespan, validating pharmacologic mTORC1 inhibition as a geroprotector.
      Evidence source is MODEL_ORGANISM (mouse lifespan study).
  - reference: PMID:23325216
    reference_title: "mTOR is a key modulator of ageing and age-related disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inhibition of this pathway extends lifespan in model organisms and confers
      protection against a growing list of age-related pathologies.
    explanation: >-
      Establishes mTOR-pathway inhibition as lifespan-extending and protective
      against age-related disease, the rationale for the rapamycin target.
      Evidence source is OTHER because this is a review.
  - reference: PMID:24341993
    reference_title: "Rapamycin-mediated lifespan increase in mice is dose and sex dependent and metabolically distinct from dietary restriction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Some of the endocrine and metabolic changes seen in diet-restricted mice
      are not seen in mice exposed to rapamycin, and the pattern of expression
      of hepatic genes involved in xenobiotic metabolism is also quite distinct
      in rapamycin-treated and diet-restricted mice, suggesting that these two
      interventions for extending mouse lifespan differ in many respects.
    explanation: >-
      Separates pharmacologic mTORC1 inhibition from dietary restriction on a
      molecular readout (hepatic xenobiotic-metabolism gene expression) rather
      than by assertion. Relevant to this module because rapamycin is often
      described as a dietary-restriction mimetic; this evidence constrains that
      framing and argues the two act through at least partly distinct routes to
      a shared endpoint. The same study also finds the lifespan effect is dose-
      and sex-dependent, tracking sex differences in drug blood levels. Evidence
      source is MODEL_ORGANISM (UM-HET3 mice).
- name: Metformin (AMPK-Mediated Nutrient-Signaling Restraint)
  description: >-
    Metformin is a biguanide that activates AMPK and acts as a
    caloric-restriction mimetic, indirectly restraining anabolic mTORC1
    signaling and re-engaging the catabolic, autophagy-permissive state. It has
    demonstrated protective effects against several age-related diseases in
    humans and is the agent of the TAME (Targeting Aging with Metformin) trial,
    the flagship test of a geroprotector for healthy aging.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Metformin activates AMPK, which indirectly restrains mTORC1 and re-engages
      the catabolic, autophagy-permissive low-energy response, opposing the
      anabolic bias of the deregulated nutrient-sensing state.
  evidence:
  - reference: PMID:27304507
    reference_title: "Metformin as a Tool to Target Aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Metformin, which has demonstrated protective effects against several
      age-related diseases in humans, will be tested in the TAME (Targeting Aging
      with Metformin) trial, as the initial step in the development of
      increasingly effective next-generation drugs.
    explanation: >-
      Documents metformin's protective effects against age-related disease and
      its role as the flagship geroprotector in the TAME trial, supporting it as
      a nutrient-sensing-directed intervention. Evidence source is OTHER because
      this is a review.
- name: Dietary Protein and Amino-Acid Restriction
  description: >-
    Lowering total dietary protein - or restricting specific essential amino
    acids (methionine, isoleucine, valine) - while still meeting nutritional
    needs. This is the non-pharmacological arm of the same design pattern:
    instead of inhibiting the anabolic node with a drug, it removes the
    amino-acid input that drives it and simultaneously engages the GCN2
    amino-acid-scarcity sensor that a protein-replete state leaves quiescent.
    It is distinct from calorie restriction - the benefit tracks the
    macronutrient ratio rather than energy intake, and calorie restriction
    achieved with high-protein diets does not extend lifespan.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Nutrient Surplus and Anabolic Signaling
    treatment_effect: INHIBITS
    description: >-
      Restricting dietary protein removes the amino-acid input that sustains the
      anabolic arm of the nutrient-sensing network, lowering signaling into
      mTORC1.
  - target: GCN2 Amino-Acid-Scarcity Sensing Attenuation
    treatment_effect: INHIBITS
    description: >-
      Amino-acid restriction reverses the attenuation of this node by causing
      uncharged tRNAs to accumulate, which activates GCN2 and re-engages the
      eIF2-alpha/ATF4 integrated stress response and its downstream FGF21
      induction.
  evidence:
  - reference: PMID:24606899
    reference_title: "The ratio of macronutrients, not caloric intake, dictates cardiometabolic health, aging, and longevity in ad libitum-fed mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Longevity and health were optimized when protein was replaced with
      carbohydrate to limit compensatory feeding for protein and suppress protein
      intake.
    explanation: >-
      Establishes low protein intake, not reduced calories, as the dietary lever
      on longevity, and links the effect to hepatic mTOR activation - the
      anabolic node this intervention targets. Evidence source is MODEL_ORGANISM
      (mice fed one of 25 ad libitum diets).
  - reference: PMID:35393401
    reference_title: "FGF21 is required for protein restriction to extend lifespan and improve metabolic health in male mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we demonstrate that protein restriction increases lifespan, reduces
      frailty, lowers body weight and adiposity, improves physical performance,
      improves glucose tolerance, and alters various metabolic markers within the
      serum, liver, and adipose tissue of wildtype male mice.
    explanation: >-
      Documents the lifespan and healthspan benefit of dietary protein
      restriction itself, the outcome this intervention is intended to produce.
      Evidence source is MODEL_ORGANISM (wildtype male mice).
  - reference: PMID:37939658
    reference_title: "Dietary restriction of isoleucine increases healthspan and lifespan of genetically heterogeneous mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      IleR reduces frailty and extends the lifespan of male and female mice, but
      to a greater degree in males.
    explanation: >-
      Narrows the intervention from whole-protein restriction to a single amino
      acid: restricting isoleucine alone extends lifespan in genetically
      heterogeneous mice. Also the first of the sex-dimorphism findings this
      treatment must carry - the benefit is larger in males. Evidence source is
      MODEL_ORGANISM (UM-HET3 mice of both sexes).
  - reference: PMID:42498891
    reference_title: "Lifelong restriction of dietary valine has sex-specific benefits for health and lifespan in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we find that valine restriction (Val-R) improves metabolic health in
      C57BL/6J mice, promotes leanness and glycemic control across ages, and
      reduces frailty, cancer prevalence and senescent cell burden in both sexes
      while increasing median male lifespan by 23%.
    explanation: >-
      A second single amino acid sufficient on its own, with the lifespan benefit
      again restricted to males. The reduced senescent cell burden is the
      structural link to the cellular_senescence module - this intervention
      lowers the senescent-cell load, not only the anabolic signal. Evidence
      source is MODEL_ORGANISM (C57BL/6J mice of both sexes).
  - reference: PMID:41817439
    reference_title: "Restriction of Individual Branched-Chain Amino Acids has Distinct Effects on the Development and Progression of Alzheimer's Disease in 3xTg Mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Restriction of either isoleucine or valine, but not leucine, improved
      metabolic health.
    explanation: >-
      Recorded as PARTIAL because it qualifies rather than simply supports the
      intervention as named: the three branched-chain amino acids are NOT
      interchangeable, and restricting leucine - the most potent mTORC1 activator
      of the three - did not improve metabolic health. A curator must not treat
      "amino-acid restriction" as a single substitutable manipulation. Evidence
      source is MODEL_ORGANISM (3xTg Alzheimer-model mice of both sexes).
discussions:
- discussion_id: knowledge_gap_which_amino_acid_is_the_signal
  prompt: >-
    Which dietary amino acid restriction actually drives the benefit, and by what
    sensor - is the GCN2/FGF21 arm modelled here the route for all of them, or
    does each amino acid act through a partly distinct mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#GCN2 Amino-Acid-Scarcity Sensing Attenuation
  - pathophysiology#Attenuated FGF21 Endocrine Starvation Response
  rationale: >-
    This module's treatment node names "dietary protein and amino-acid
    restriction" as one intervention acting on one sensing arm, and that framing
    is now known to be under-specified. Restriction of isoleucine alone, or of
    valine alone, is each sufficient to extend mouse lifespan, yet restricting
    leucine - the strongest mTORC1 activator of the three branched-chain amino
    acids, and therefore the one the anabolic-signalling model predicts should
    matter most - did not improve metabolic health. Methionine restriction is a
    third, chemically unrelated route. If a single upstream sensor explained all
    of these, the amino acids should be broadly substitutable, and they are not.
    The unresolved question is whether GCN2/FGF21 is the common trunk with
    amino-acid-specific branches downstream, or whether isoleucine, valine and
    methionine each engage largely separate mechanisms that this module currently
    collapses into one node. Until that is settled, a conforming entry should
    name the specific amino acid it means rather than asserting generic
    amino-acid restriction.
  proposed_experiments:
  - experiment_id: exp_gcn2_dependence_per_amino_acid
    name: GCN2-dependence of single-amino-acid restriction benefits
    description: >-
      Repeat isoleucine-, valine- and methionine-restriction in Gcn2-null versus
      wildtype mice, reading out hepatic FGF21 induction, energy expenditure and
      healthspan measures, to test whether the three routes share the GCN2 sensor
      or diverge upstream of it.
  - experiment_id: exp_fgf21_dependence_per_amino_acid
    name: FGF21-dependence of single-amino-acid restriction benefits
    description: >-
      The same three restrictions in Fgf21-null versus wildtype mice, to
      establish which of them require the endocrine arm - the manipulation that
      showed whole-protein restriction depends on FGF21.
- discussion_id: human_model_mismatch_amino_acid_restriction_lifespan
  prompt: >-
    Human evidence now supports the proximal FGF21 and energy-expenditure
    response to protein restriction, but does the mouse lifespan benefit - which
    is largely male-specific - translate to humans at all?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Attenuated FGF21 Endocrine Starvation Response
  - pathophysiology#Accelerated Cellular Aging and Age-Related Tissue Decline
  rationale: >-
    The two ends of this chain are not equally evidenced in humans, and the gap
    between them is where over-claiming happens. The proximal end now has direct
    human support: a controlled eucaloric intervention in healthy lean men raised
    fasting FGF21 and the energy intake needed to hold weight steady, and
    improved insulin sensitivity. The distal end - that this delays ageing - rests
    entirely on rodents, and there the benefit is repeatedly sex-dimorphic:
    isoleucine restriction extends lifespan more in males, and valine restriction
    raises median male lifespan by 23% without a female lifespan benefit. Three
    things therefore do not follow from the human data and must not be curated as
    if they did: that protein restriction extends human lifespan; that a benefit
    shown in young lean men generalises to older adults, women, or people with
    metabolic disease; or that a 5-week study speaks to lifelong exposure. The
    countervailing clinical concern - that reduced protein intake accelerates
    sarcopenia and frailty in the elderly, which is why higher intakes are
    recommended above age 65 - is exactly the population in which no long-term
    human data exist. Note the human study preserved lean body mass over 5 weeks,
    but only in young men, and only when energy intake was raised to hold weight
    constant.
  proposed_experiments:
  - experiment_id: exp_human_protein_restriction_older_adults
    name: Protein restriction in older adults with body-composition endpoints
    description: >-
      A controlled protein-restriction trial in adults over 65 of both sexes,
      powered on lean mass, grip strength and physical performance alongside
      FGF21 and insulin sensitivity, to test directly whether the metabolic
      benefit and the sarcopenia risk can be separated in the population where
      the recommendation conflict actually bites.
  - experiment_id: exp_human_sex_stratified_amino_acid_restriction
    name: Sex-stratified single-amino-acid restriction in humans
    description: >-
      Isoleucine- or valine-restricted eucaloric diets in men and women with
      matched designs, reading out FGF21, energy expenditure and insulin
      sensitivity, to establish whether the male-biased response seen in mice is
      present in humans or is a rodent-specific feature.
mechanistic_hypotheses:
- hypothesis_group_id: sex_dimorphic_geroprotector_exposure
  hypothesis_label: Pharmacokinetic (Drug-Exposure) Model of Sex-Dimorphic Geroprotector Response
  status: EMERGING
  description: >-
    The most reproducible single finding of the NIA Interventions Testing
    Program across two decades is that most lifespan-extending compounds work
    preferentially in one sex, usually males. This hypothesis holds that the
    dimorphism is pharmacokinetic - that males and females achieve different
    effective drug exposures, so the aging substrate itself responds equally and
    the apparent sex difference is a dosing artifact. The competing reading,
    which this module does not currently model as a separate group, is
    pharmacodynamic: that the nutrient-sensing network is differently wired or
    differently rate-limiting for lifespan in the two sexes, so matched exposure
    would still produce divergent outcomes. The two make an experimentally
    separable prediction - under the pharmacokinetic model, dose-matching to
    equal blood levels should abolish the sex difference.
  evidence:
  - reference: PMID:38753230
    reference_title: "Lifespan effects in male UM-HET3 mice treated with sodium thiosulfate, 16-hydroxyestriol, and late-start canagliflozin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that blood levels of Cana were approximately 20-fold higher in
      aged females than in young males, suggesting a possible mechanism for the
      sex-specific disparities in its effects.
    explanation: >-
      Direct pharmacokinetic support: a 20-fold exposure difference between aged
      females and young males accompanies canagliflozin's male-restricted
      lifespan benefit and female-specific late-life harm.
  - reference: PMID:24341993
    reference_title: "Rapamycin-mediated lifespan increase in mice is dose and sex dependent and metabolically distinct from dietary restriction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rapamycin increased lifespan more in females than in males at each dose
      evaluated, perhaps reflecting sexual dimorphism in blood levels of this
      drug.
    explanation: >-
      Support from within this module's own drug, and in the opposite direction
      to most ITP compounds: rapamycin is the female-favouring exception, and
      the investigators again attribute the dimorphism to differing blood
      levels. That the model must accommodate a reversal of direction is part of
      what makes it worth testing.
  - reference: PMID:24245565
    reference_title: "Acarbose, 17-α-estradiol, and nordihydroguaiaretic acid extend mouse lifespan preferentially in males."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Females did not show a lifespan benefit from NDGA, even at a dose that
      produced blood levels similar to those in males, which did show a strong
      lifespan benefit.
    explanation: >-
      The decisive counter-experiment. Dose-matching to equal blood levels is
      exactly the manipulation the pharmacokinetic model predicts should abolish
      the sex difference, and it did not - implicating a pharmacodynamic
      difference in the aging substrate instead. Recorded as REFUTE because it
      falsifies the model's central prediction for at least one compound.
  notes: >-
    Scope caveat a curator must carry forward: this module is an imperfect home
    for the hypothesis. The ITP male bias spans compounds that act well outside
    nutrient sensing (17-alpha-estradiol, nordihydroguaiaretic acid), so the
    phenomenon is broader than the mechanism modeled here; the hypothesis is
    filed on this module because rapamycin, acarbose, canagliflozin and
    metformin are the compounds it can be tested against structurally. Note also
    that the SUPPORT and REFUTE evidence come from the same program and are
    genuinely in tension - the pharmacokinetic model may hold for some compounds
    (canagliflozin, rapamycin) and fail for others (NDGA), in which case the
    single-model framing is itself wrong and should be split.
- hypothesis_group_id: rapamycin_distinct_from_dietary_restriction
  hypothesis_label: Rapamycin Extends Lifespan by a Route Distinct from Dietary Restriction
  status: EMERGING
  description: >-
    Rapamycin is routinely described as a dietary-restriction mimetic, on the
    reasoning that both down-shift anabolic nutrient signaling and both extend
    lifespan. This hypothesis holds that the shared endpoint conceals distinct
    routes - that pharmacologic mTORC1 inhibition and dietary restriction
    produce materially different endocrine, metabolic and hepatic
    transcriptional states, and therefore converge on longevity without being
    the same intervention. The distinction matters for this module because it
    determines whether mTORC1 hyperactivation is the single hub through which
    the whole hallmark acts, or one of several partly independent routes to the
    same consequence node.
  evidence:
  - reference: PMID:24341993
    reference_title: "Rapamycin-mediated lifespan increase in mice is dose and sex dependent and metabolically distinct from dietary restriction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Some of the endocrine and metabolic changes seen in diet-restricted mice
      are not seen in mice exposed to rapamycin, and the pattern of expression
      of hepatic genes involved in xenobiotic metabolism is also quite distinct
      in rapamycin-treated and diet-restricted mice, suggesting that these two
      interventions for extending mouse lifespan differ in many respects.
    explanation: >-
      Molecular rather than inferential separation of the two interventions:
      endocrine and metabolic changes diverge, and hepatic xenobiotic-metabolism
      expression is distinct. This is the primary evidence the hypothesis rests
      on.
  notes: >-
    The module currently takes no position on this question - the mTORC1 node
    describes rapamycin as targeting the anabolic hub without asserting
    equivalence to dietary restriction, and the AMPK node cites a review that
    groups caloric restriction, sirtuin activation and rapamycin together as one
    longevity-promoting arm. Those two framings are in mild tension and this
    hypothesis names it. A single study comparing two interventions in one
    tissue is thin support for a claim this load-bearing; the hypothesis is
    declared EMERGING to mark it as open rather than resolved.

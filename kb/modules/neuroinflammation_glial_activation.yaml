name: Neuroinflammation and Glial Activation Module
description: >-
  A conserved pathophysiology module representing reactive microglial and
  astrocytic activation - the process AOP-Wiki's Key Event 188 ("brain
  inflammation") models as a single innate-immune convergence point with two
  cell-type components - as a shared final-common step across neurodegenerative
  and neuroinflammatory disease. A danger signal reaching the CNS parenchyma
  (an aggregated misfolded protein such as amyloid-beta, tau, alpha-synuclein,
  mutant SOD1, or TDP-43; a pathogen-associated molecular pattern; or another
  sterile damage signal) is sensed by pattern-recognition receptors (toll-like
  receptors, NOD-like receptors, RAGE, purinergic receptors) expressed on
  microglia and astrocytes, priming an NF-kappaB-dependent transcriptional
  response. Primed glia convert to a reactive state - the key conformance
  target of this module - in which microglia and astrocytes reciprocally
  activate one another (activated microglia secreting IL-1 alpha, TNF, and C1q
  drive astrocytes into a reactive, neurotoxic phenotype) and both cell types
  release proinflammatory cytokines and chemokines (IL-1 beta, IL-6, TNF-alpha).
  Sustained release of these mediators causes bystander injury and death of
  neighbouring neurons and oligodendrocytes, and, in disorders where the
  originating danger signal is itself pathogenic (e.g. amyloid-beta), can
  reciprocally amplify the trigger. This module is deliberately narrow and
  complementary to four neighbouring modules rather than overlapping them.
  It is upstream of and distinct from nlrp3_inflammasome_activation: glial
  danger-signal sensing and priming here can license the NLRP3 machinery that
  module owns end-to-end (assembly, caspase-1 activation, IL-1 output), but
  this module stops at cytokine release from a reactive glial cell and does
  not re-derive inflammasome assembly. It is distinct from cellular_senescence
  and inflammaging: reactive glial activation, as modelled here, is an acute or
  subacute response to an injury or pathology signal, not the replicative or
  DNA-damage-driven cell-cycle arrest that defines cellular senescence, and a
  chronically activated or senescent glial population - and the chronic sterile
  inflammatory secretome such a population would sustain - is a further,
  later state that this module does not model and does not claim (see notes).
  It does not re-derive glutamate_excitotoxicity's astrocytic
  glutamate-clearance node: impaired glutamate buffering by reactive astrocytes
  is a distinct downstream consequence curated in that module, not here.
category: Module
module_categories:
- NEUROSCIENCE
- IMMUNOLOGY
creation_date: "2026-09-15T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference the central node via conforms_to (e.g.,
  "neuroinflammation_glial_activation#Reactive Microglial and Astrocytic
  Activation"). The module was created to close AOP-Wiki gap KE 188 ("brain
  inflammation") per dismech issue #10368: around 20 disorder entries and 4
  modules (glaucoma_optic_neuropathy, mps_gag_storage, glymphatic_dysfunction,
  lysosomal_substrate_accumulation) carry a neuroinflammation node fused into a
  disorder- or module-specific composite name, but until now no standalone
  module node existed for microglial and astrocytic activation on its own, so
  nothing could conform to it and the same process was re-derived in each
  entry. AOP-Wiki's own Event Components for KE 188 list two rows - "brain
  inflammation -> microglial cell -> pathological" and "brain inflammation ->
  astrocyte -> pathological" - i.e. AOP-Wiki itself treats microglial and
  astrocytic activation as one Key Event with two cell-type components, not two
  separate events, which is why this module's central_effector node binds both
  CL:0000129 (microglial cell) and CL:0000127 (astrocyte) on a single node
  rather than splitting them.

  Governance decision recorded here (dismech issue #6189, item 3 of the
  autophagy_senescence_inflammasome_axis reconciliation). A 2026-07-30
  curation-scanner comment on #6189 identified a "glial-mediation gap" and
  posed it as an open question: should a senescent or reactive glial cell be
  modelled as a new node, or handled by substituting glial cell_types on an
  existing cellular_senescence conformance in CNS disorder entries, with a
  tentative (unexecuted) guess toward the latter? This module decides that
  question in favour of a new, standalone module, for three reasons. First,
  AOP-Wiki treats brain inflammation (KE 188) as its own Key Event, not as a
  cellular-senescence Key Event or a component of one - the two are indexed and
  evidenced separately in the adverse outcome pathway literature this module
  draws on, which is the strongest single argument for not routing this
  mechanism through cellular_senescence's conformance surface. Second, and
  consistent with that framing, Escartin et al. (PMID:33589835), the field's
  own consensus nomenclature paper, explicitly cautions against extending the
  concept of senescence to astrocytes, because the core definition of
  senescence - irreversible cell-cycle arrest in a proliferative cell - does
  not straightforwardly apply to astrocytes, which are largely post-mitotic in
  healthy tissue; reactive astrogliosis and microglial activation are their own
  molecularly defined programs, not an instance of the arrest-and-SASP program
  cellular_senescence models. Third, mechanically, several of the disorder
  entries this module was built to conform (Huntington_Disease, Pick_Disease,
  Alzheimer_Disease) already carry a bare, standalone "Neuroinflammation"
  pathophysiology node with real cell-type bindings and evidence; conforming
  those nodes directly, rather than asking curators to first reclassify them as
  cellular_senescence conformers with substituted glial cell types, is the
  lower-friction and more mechanistically honest wiring.

  What this module explicitly does NOT claim, and where the next boundary
  sits. The chain modelled here ends at cytokine/chemokine release and
  bystander injury from an acutely or subacutely activated glial cell. Whether,
  and under what conditions, a persistently reactive microglion or astrocyte
  additionally senesces - acquiring a senescence-associated secretory phenotype
  in the cellular_senescence or inflammaging sense, on top of or instead of the
  acute reactive program modelled here - is a live and unresolved question in
  the glial-senescence literature and is NOT decided by this module. A
  conforming disorder entry whose evidence supports that further transition
  should curate a distinct node conforming to cellular_senescence or
  inflammaging's SASP/accumulation nodes as well, substituting the glial cell
  type there, rather than treating conformance to this module as satisfying
  that separate claim. This module also does not model the specific
  disorder-level hypothesis that reactive glia and their trigger form a
  self-sustaining feedback cycle (the "self-sustaining cycle" claim raised in
  #6189's original ASI-axis proposal) as a settled mechanism; where an entry's
  own evidence supports a reciprocal edge (for example, Alzheimer_Disease
  already curates microglial ASC specks reinforcing amyloid-beta aggregation,
  PMID:29293211, as a downstream edge with hypothesis_groups), that belongs on
  the disorder entry's own pathograph and mechanistic_hypotheses, not folded
  into this module's causal chain.

  Relationship to nlrp3_inflammasome_activation. That module's "Priming Signal
  and NLRP3 Transcriptional Upregulation" node and this module's amplifier node
  both describe pattern-recognition-receptor-driven NF-kappaB priming, but at
  different resolutions: nlrp3_inflammasome_activation's priming node is scoped
  to what licenses the NLRP3 sensor itself (NLRP3 and pro-IL-1 beta
  transcription), while this module's amplifier node is the broader glial
  danger-signal-sensing step that precedes any specific inflammasome. A
  conforming disorder entry whose evidence traces all the way to an assembled,
  caspase-1-activating NLRP3 complex should additionally conform the relevant
  downstream node to nlrp3_inflammasome_activation's central_effector node
  rather than treating this module's effector (cytokine release) node as
  satisfying that separate, more specific claim; this module does not
  re-derive inflammasome assembly, caspase-1 cleavage, or gasdermin D
  pyroptosis.

  Relationship to glutamate_excitotoxicity. That module's trigger node,
  "Excessive Glutamatergic Stimulation and Impaired Glutamate Clearance",
  already owns astrocytic failure to clear synaptic glutamate as a distinct
  mechanistic claim. A conforming entry whose evidence includes reactive
  astrocytes losing glutamate-buffering capacity (for example, Pick_Disease's
  own Neuroinflammation node already describes "reduced astrocytic
  glutamate-cycling markers") should curate that as a separate downstream edge
  or a separate conforming node against glutamate_excitotoxicity, not inside
  this module's chain.

  Modules bind GO and CL terms only; the identity of the disorder-specific
  danger signal (a particular aggregated protein, pathogen, or xenobiotic) is
  described in prose rather than bound to a CHEBI or MONDO term.

  Worked conformers: Huntington_Disease, Pick_Disease, and Alzheimer_Disease
  each already carried a bare, standalone "Neuroinflammation" pathophysiology
  node with real microglia/astrocyte cell-type bindings and PMID-cited
  evidence before this module existed; all three now conform their node to
  this module's central_effector node. Pick_Disease's own node and evidence
  describe astrocyte-dominant reactivity with "remarkably little activation of
  microglia" relative to Alzheimer disease; this still satisfies the node,
  whose criterion is a reactive microglial and/or astrocytic state, not both
  in equal measure, but is recorded here so the conformance does not read as a
  mismatch to a reader who has not read Pick_Disease's own text. Other
  disorder entries carrying a
  similar bare Neuroinflammation node (Bipolar_Disorder,
  Major_Depressive_Disorder, Parkinsons_Disease,
  Gerstmann-Straussler-Scheinker_Syndrome, Long_COVID,
  Amyotrophic_Lateral_Sclerosis, Gaucher_Disease, Multiple_System_Atrophy,
  Fibromyalgia) are natural further conformers and are deliberately left
  unwired here; wiring them is future curation, not a defect of this module.
  The 6 existing module-level composite neuroinflammation nodes identified in
  issue #10368 (glaucoma_optic_neuropathy#Optic Nerve Degeneration and
  Neuroinflammation, mps_gag_storage#Heparan Sulfate-Driven Neuroinflammation,
  glymphatic_dysfunction#Neuroinflammation and Progressive Neurodegeneration,
  lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and
  Neuroinflammation) are also left untouched: retargeting an existing
  module-to-module conformance pattern is a further governance question this
  module does not decide unilaterally.

  This module does not carry a treatments block. Microglial-modulating
  candidates such as minocycline are described in the review literature
  surveyed here only as a named example of a neuroprotective-polarization
  candidate, with no robust clinical-outcome evidence in the diseases surveyed
  for this module; the drug-target pattern is deliberately deferred rather than
  forced onto weak evidence.
pathophysiology:
- name: Danger Signal Release into the CNS Parenchyma
  description: >-
    An aggregated misfolded protein (amyloid-beta, tau, alpha-synuclein, mutant
    SOD1, TDP-43, or another disease-specific species), a pathogen-associated
    molecular pattern, or another sterile damage signal is released into the
    extracellular CNS space, most often from an injured or diseased neuron.
    This node is deliberately generic and disorder-agnostic: its only claim is
    that a danger signal reaches surrounding glia, and conforming disorder
    entries substitute their own specific trigger in prose rather than a bound
    ontology term, since no single CHEBI or MONDO binding could represent the
    heterogeneous set of proteins, pathogens, and xenobiotics that converge on
    this step.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33239064
    reference_title: "Neuroinflammation in neurodegenerative disorders: the roles of microglia and astrocytes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The release of aggregated pathogenic proteins such as amyloid-β, tau,
      α-synuclein, mSOD1, and TDP-43, into the extracellular space drives the
      changes of microglia and astrocytes into their pro-inflammatory
      phenotypes.
    explanation: >-
      Names the heterogeneous set of aggregated pathogenic proteins that
      converge on this trigger node across multiple neurodegenerative
      diseases, and states that their release is what drives the downstream
      glial phenotype change. Evidence source is OTHER because this is a
      narrative review.
  downstream:
  - target: Glial Pattern-Recognition Receptor Priming and Danger-Signal Sensing
- name: Glial Pattern-Recognition Receptor Priming and Danger-Signal Sensing
  description: >-
    Microglia and astrocytes express pattern-recognition receptors, including
    toll-like receptors, NOD-like receptors, RAGE, and purinergic receptors,
    that detect the danger signal released at the trigger node. Receptor
    engagement drives NF-kappaB-dependent transcriptional priming of the glial
    cell, upregulating the machinery for the reactive state and for cytokine
    production. This priming step is the generic glial danger-sensing event;
    where the disorder-specific evidence traces all the way to an assembled
    NLRP3 inflammasome, a conforming entry should additionally conform the
    relevant node to nlrp3_inflammasome_activation's own, more specific priming
    and assembly nodes rather than treating this node as satisfying that
    narrower claim.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: Toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: INCREASED
  - preferred_term: NF-κB signaling
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:33239064
    reference_title: "Neuroinflammation in neurodegenerative disorders: the roles of microglia and astrocytes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      protecting against injurious stimuli, including pathogen-associated
      molecular patterns (PAMPs) and damage-associated molecular patterns
      (DAMPs). Cellular receptors such as toll-like receptors (TLRs), nuclear
      oligomerization domain-like receptors, and viral receptors are expressed
      on microglia, and can recognize PAMPs and DAMPs
    explanation: >-
      Establishes the pattern-recognition receptor repertoire (TLRs, NOD-like
      receptors, viral receptors) expressed on microglia and their role in
      sensing PAMPs and DAMPs, the mechanistic basis of this node. Evidence
      source is OTHER because this is a narrative review.
  - reference: PMID:25792098
    reference_title: "Neuroinflammation in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Misfolded and aggregated proteins bind to pattern recognition receptors
      on microglia and astroglia
    explanation: >-
      Extends receptor-mediated danger-signal sensing to astroglia as well as
      microglia, supporting both cell types being bound on this node. Evidence
      source is OTHER because this is a narrative review.
  downstream:
  - target: Reactive Microglial and Astrocytic Activation
- name: Reactive Microglial and Astrocytic Activation
  description: >-
    The rate-limiting, disorder-agnostic step and the key conformance target
    of this module, corresponding to AOP-Wiki Key Event 188 ("brain
    inflammation"), whose own Event Components list microglial and astrocytic
    activation as the two cell-type components of a single Key Event rather
    than two separate ones. Primed microglia convert to a classically activated,
    neuroinflammatory state and, by secreting IL-1 alpha, TNF, and C1q, drive
    neighbouring astrocytes into a reactive state; astrocytes reciprocally
    signal back to microglia. This is a molecularly defined activation program
    distinct from cellular senescence: it is an acute or subacute response to
    an injury or pathology signal, not the replicative or DNA-damage-driven
    cell-cycle arrest that defines the senescence program modelled in
    cellular_senescence, and glia are largely post-mitotic in healthy tissue in
    any case. A conforming entry satisfies this node if its evidence places an
    activated, reactive microglial and/or astrocytic state in the causal chain;
    typical measurement handles reported in the literature include GFAP
    upregulation for reactive astrocytes and CD11b/Iba1 upregulation or
    morphological transformation for activated microglia, though this module
    does not bind an assay term for either (OBI assay grounding is not
    currently supported for dismech term validation).
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: Neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
    modifier: INCREASED
  - preferred_term: Microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: Astrocyte activation
    term:
      id: GO:0048143
      label: astrocyte activation
    modifier: INCREASED
  evidence:
  - reference: PMID:28099414
    reference_title: "Neurotoxic reactive astrocytes are induced by activated microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that a subtype of reactive astrocytes, which we termed A1,
      is induced by classically activated neuroinflammatory microglia.
    explanation: >-
      Establishes that activated microglia drive a defined reactive-astrocyte
      state (the A1 phenotype), the microglia-to-astrocyte half of this
      node's claim. Evidence source is IN_VITRO because this snippet's own
      sufficiency demonstration used purified, cultured astrocytes exposed to
      microglial cytokines; the same paper separately establishes necessity
      of microglia in vivo (see the MODEL_ORGANISM item below), which this
      IN_VITRO-graded snippet does not itself report.
  - reference: PMID:28099414
    reference_title: "Neurotoxic reactive astrocytes are induced by activated microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      activated microglia induce A1 astrocytes by secreting Il-1α, TNF and
      C1q, and that these cytokines together are necessary and sufficient to
      induce A1 astrocytes.
    explanation: >-
      Identifies the specific microglial-secreted factors (IL-1 alpha, TNF,
      C1q) that are sufficient to convert cultured astrocytes into the A1
      reactive state, shown by adding the recombinant cytokines to purified
      astrocyte cultures. Evidence source is IN_VITRO for this sufficiency
      demonstration; the paper's "necessary" claim for the same factors rests
      on a separate in vivo triple-knockout experiment (see the
      MODEL_ORGANISM item below), not on this cultured-cell result.
  - reference: PMID:28099414
    reference_title: "Neurotoxic reactive astrocytes are induced by activated microglia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings show reactive microglia are required to induce A1
      reactive astrocytes in vivo.
    explanation: >-
      Established using Csf1r-/- knockout mice that lack microglia: astrocytes
      purified from these mice failed to mount an A1 response after systemic
      LPS challenge, whereas wild-type littermates responded normally. This is
      the in vivo necessity half of the microglia-to-astrocyte causal claim,
      complementing the in vitro sufficiency evidence above. Evidence source
      is MODEL_ORGANISM because this is a mouse knockout experiment.
  - reference: PMID:28099414
    reference_title: "Neurotoxic reactive astrocytes are induced by activated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A1 astrocytes are abundant in various human neurodegenerative diseases
      including Alzheimer's, Huntington's and Parkinson's disease, amyotrophic
      lateral sclerosis and multiple sclerosis.
    explanation: >-
      Establishes that this reactive-astrocyte state is a recurrent feature
      across multiple human neurodegenerative diseases, including two of this
      module's three worked conformers (Alzheimer_Disease, Huntington_Disease),
      supporting reuse via conformance rather than re-derivation. Evidence
      source is HUMAN_CLINICAL because this reports the state in post-mortem
      human tissue.
  - reference: PMID:33239064
    reference_title: "Neuroinflammation in neurodegenerative disorders: the roles of microglia and astrocytes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Inflammatory mediators secreted by pro-inflammatory microglia, such as
      IL-1α, IL-1β, TNF-α, and C1q, may activate pro-inflammatory astrocytes
      and induce a secondary inflammatory response
    explanation: >-
      Independent review-level corroboration of the microglia-to-astrocyte
      activation link curated at this node. Evidence source is OTHER because
      this is a narrative review.
  - reference: PMID:33589835
    reference_title: "Reactive astrocyte nomenclature, definitions, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We suggest 'reactive astrogliosis' to define the process whereby, in
      response to pathology, astrocytes engage in molecularly defined programs
      involving changes in transcriptional regulation, as well as biochemical,
      morphological, metabolic, and physiological remodeling, which ultimately
      result in gain of new function(s) or loss or upregulation of homeostatic
      ones.
    explanation: >-
      The field's consensus nomenclature definition of the reactive-astrocyte
      state this node models, cited to ground the state as a defined program
      rather than a vague descriptive label. Evidence source is OTHER because
      this is a consensus review.
  - reference: PMID:33589835
    reference_title: "Reactive astrocyte nomenclature, definitions, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      we suggest caution about extending the concept of senescence to
      astrocytes based upon the expression of cell senescence marker p16INK4A,
      increased β-galactosidase activity, and secretion of cytokines93,
      because the core definition of senescence (that is, irreversible
      cell-cycle arrest in proliferative cells) may not apply to astrocytes,
      which are essentially post-mitotic cells that rarely divide in healthy
      tissue.
    explanation: >-
      Direct support for this module's scoping decision to model reactive
      glial activation as its own mechanism rather than as an instance of
      cellular_senescence: the field's own consensus paper cautions against
      conflating a reactive astrocyte with a senescent one. Evidence source is
      OTHER because this is a consensus review.
  downstream:
  - target: Proinflammatory Cytokine and Chemokine Release
- name: Proinflammatory Cytokine and Chemokine Release
  description: >-
    Reactive microglia and astrocytes secrete a proinflammatory cytokine and
    chemokine program, including IL-1 beta, IL-6, and TNF-alpha, that recruits
    additional immune cells and propagates the inflammatory signal through the
    surrounding parenchyma. This is the pathway's principal secreted output and
    the step most directly targeted by cytokine-neutralizing or
    microglia-modulating candidate therapies discussed in the literature
    surveyed for this module.
  role: effector
  biological_scale: CELLULAR
  cell_types:

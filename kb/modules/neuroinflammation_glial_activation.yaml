  evidence:
  - reference: PMID:33239064
    reference_title: "Neuroinflammation in neurodegenerative disorders: the roles of microglia and astrocytes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In response to such stimuli, microglia produce proinflammatory
      cytokines, such as tumor necrosis factor (TNF)-α, interleukin (IL)-1β,
      IL-16 and chemokines, including the C-C motif chemokine ligand 2 (CCL2)
      and IL-18, to recruit additional cells and remove pathological agents
    explanation: >-
      Names the specific proinflammatory cytokines and chemokines released by
      activated microglia and their stated recruitment function, the
      microglial half of this node's output. Evidence source is OTHER because
      this is a narrative review.
  - reference: PMID:33239064
    reference_title: "Neuroinflammation in neurodegenerative disorders: the roles of microglia and astrocytes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pro-inflammatory reactive astrocytes upregulate several genes (e.g.,
      complement cascade genes) and induce pro-inflammatory factors (e.g.,
      IL-1β, TNF-α, and NO), which are known to have harmful functions
    explanation: >-
      Names the same effector output from the astrocyte side, completing the
      cell-type coverage of this node. Evidence source is OTHER because this
      is a narrative review.
  downstream:
  - target: Bystander Neuronal and Oligodendroglial Injury
- name: Bystander Neuronal and Oligodendroglial Injury
  description: >-
    Sustained proinflammatory mediator release from reactive glia injures
    neighbouring, non-glial cells: reactive astrocytes lose their normal
    supportive functions (promoting neuronal survival, outgrowth,
    synaptogenesis, and phagocytosis) and, together with the surrounding
    cytokine milieu, cause the death of nearby neurons and oligodendrocytes.
    This is the conserved tissue-level consequence that conforming disorders
    specialize to their affected neuronal population; the specific downstream
    neurodegenerative phenotype (striatal medium spiny neuron loss, cortical
    pyramidal neuron loss, dopaminergic neuron loss) is supplied by the
    conforming entry.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: Cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:28099414
    reference_title: "Neurotoxic reactive astrocytes are induced by activated microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A1 astrocytes lose the ability to promote neuronal survival, outgrowth,
      synaptogenesis and phagocytosis, and induce the death of neurons and
      oligodendrocytes.
    explanation: >-
      Directly states the loss-of-support and gain-of-toxic-function that
      defines this consequence node, and names both cell types this node
      binds. Evidence source is IN_VITRO because the neuronal and
      oligodendrocyte death assays were performed in co-culture.
  - reference: PMID:33239064
    reference_title: "Neuroinflammation in neurodegenerative disorders: the roles of microglia and astrocytes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      although neuroinflammation is a neuroprotective mechanism, sustained
      neuroinflammation can induce neurotoxicity and is related to
      neurodegeneration
    explanation: >-
      States the conditional causal claim this node makes: neuroinflammation
      is protective when transient, and becomes neurotoxic when sustained.
      Evidence source is OTHER because this is a narrative review.
  - reference: PMID:35978311
    reference_title: "Astrocytic and microglial cells as the modulators of neuroinflammation in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      chronic or uncontrolled inflammatory responses may lead to various
      neurodegenerative diseases, including Alzheimer's disease (AD),
      Parkinson's disease (PD), amyotrophic lateral sclerosis, and multiple
      sclerosis.
    explanation: >-
      Supports the generality of this consequence across multiple
      neurodegenerative diseases, including Alzheimer_Disease, one of this
      module's worked conformers. Evidence source is OTHER because this is a
      narrative review.
discussions:
- discussion_id: open_glial_activation_vs_glial_senescence_boundary
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Reactive Microglial and Astrocytic Activation
  prompt: >-
    Under what conditions, and by what evidence, does a persistently reactive
    microglial or astrocytic population additionally transition into a
    senescent glial state, and should a conforming disorder entry then curate
    a second, separate node conforming to cellular_senescence or inflammaging
    rather than treating conformance to this module as covering that claim?
  rationale: >-
    This is the governance question raised as item 3 of the #6189
    reconciliation ("glial-mediation gap") and decided here in favour of a
    standalone module rather than substituting glial cell types on an existing
    cellular_senescence conformance, for the reasons recorded in this module's
    notes. That decision resolves where the acute reactive-activation program
    modelled here sits relative to cellular_senescence, but it does not
    resolve the further, genuinely open question of whether and when a
    chronically activated glial cell also senesces. Escartin et al.
    (PMID:33589835) explicitly flag this as unsettled, cautioning that the
    core definition of senescence may not straightforwardly apply to
    largely post-mitotic astrocytes, while also acknowledging that markers
    such as p16INK4A and beta-galactosidase activity have been reported in
    astrocytes in some contexts. Until this is resolved in the primary
    literature, a conforming disorder entry should curate only what its own
    evidence supports: conformance to this module's central_effector node for
    an acute or subacute reactive state, and a separate, additional
    conformance to cellular_senescence or inflammaging only where the entry's
    own evidence specifically supports a senescence-associated secretory
    phenotype or a senescence marker in the glial population, not as an
    automatic extension of the first.
  proposed_experiments:
  - experiment_id: exp_glial_senescence_marker_timecourse
    name: Longitudinal marker time-course from acute glial reactivity to a candidate senescent state
    description: >-
      In a chronic model already showing sustained microglial and astrocytic
      activation (for example, a long-duration proteinopathy model), track
      canonical reactivity markers (GFAP, Iba1/CD11b) alongside canonical
      senescence markers (p16INK4a, senescence-associated beta-galactosidase,
      a SASP cytokine panel) in the same glial population over time. A cohort
      in which reactivity markers plateau while senescence markers rise later
      would support a genuine acute-to-senescent transition and justify a
      dual-conformance pattern; a cohort in which both marker sets rise and
      fall together would suggest the two programs are not clearly separable
      in that model and the distinction should not be over-applied.

  rationale: >-
    This module represents recurring routes, not universal ones. Comparative
    evidence remains insufficient to assign the same causal weight or sequence
    to each route across all hemorrhagic fever viruses, which is why the four
    hemostatic routes are drawn in parallel from the trigger rather than
    ordered. Resolving this would say which of the four a conforming entry
    should be expected to declare, and would turn the module's parallel arms
    into a sequenced chain.
  evidence:

- name: Decreased Coagulation Factor Production
  description: >-
    Reduced production of coagulation factors is the second hemostatic route
    and is separable from consumption: a factor deficit arising from impaired
    synthesis, typically in the setting of hepatic involvement, is not the same
    lesion as one arising from consumption at sites of activation.

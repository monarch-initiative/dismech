name: Viral Hemorrhagic Fever Syndrome Module
description: >-
  A conserved pathophysiology module representing the acute vascular and
  hemostatic syndrome that hemorrhagic fever viruses produce in common,
  independently of which virus is responsible. The module is the
  organism-independent final common pathway of the viral hemorrhagic fevers:
  filoviruses (Ebola, Marburg), arenaviruses (Lassa), nairoviruses
  (Crimean-Congo), phenuiviruses (Rift Valley fever), flaviviruses (dengue,
  yellow fever) and hantaviruses are unrelated organisms with different
  reservoirs, vectors, receptors and therapies, but the severe disease they
  cause converges on one lesion. After early failure of antiviral immunity the
  virus reaches high titre and reaches the vascular and mononuclear phagocyte
  compartments; from there the chain runs along two arms. The vascular arm is
  endothelial activation and damage, which degrades barrier integrity and
  raises vascular permeability, expressed clinically as capillary leak and,
  when plasma loss is severe enough, shock. The hemostatic arm is the four
  routes to bleeding that the literature distinguishes - a consumptive
  coagulopathy, decreased coagulation factor production, reduced platelet
  number, and platelet dysfunction - which together produce coagulopathy,
  thrombocytopenia and hemorrhage. Conforming disorder nodes substitute the
  agent, its entry receptor and its organ emphasis while preserving that
  chain. Key conformance target:
  `viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability` - the node
  every hemorrhagic fever funnels through and the lesion that defines severe
  disease; it is what `Ebola_Virus_Disease_EVD`, `Dengue` and
  `Hantavirus_Hemorrhagic_Fever_with_Renal_Syndrome` each declare. The module
  is deliberately scoped to the acquired vascular-plus-hemostatic lesion of
  high-titre viral infection, so that it stays complementary to, rather than
  overlapping with, its neighbours. **It carries no cytokine node, on
  purpose.** The host cytokine response is real in severe hemorrhagic fever and
  is modelled by two existing neighbours rather than duplicated here:
  `cytokine_storm_hyperinflammation` models the *generation* of an acute storm -
  an overwhelming trigger driving a self-amplifying myeloid cytokine loop that
  reaches capillary leak and shock through cytokine output rather than through
  direct infection of the vasculature, and carries no bleeding arm at all - and
  `il6_hypercytokinemia` models the ligand arm downstream of the cytokine
  itself, gp130 engagement and JAK-STAT3 activation in responder cells. A
  conforming entry whose own chain includes a cytokine step should declare that
  node against one of those two and this module's vascular node separately,
  which is what `Hantavirus_Hemorrhagic_Fever_with_Renal_Syndrome` is positioned
  for: its IL-6 trans-signaling node belongs to the cytokine modules and its
  permeability node to this one. The early antiviral-immunity failure and viral
  interferon antagonism upstream of the trigger belong to
  `innate_antiviral_interferon_response`; the congenital loss of a platelet
  component is `primary_hemostatic_plug_failure`, where the platelet defect is
  inherited rather than consumed; and occlusive fibrin-platelet thrombus
  formation is `thrombogenesis`, the opposite clinical direction from the
  bleeding this module ends in. A severe case may conform to this module and to
  any of those in parallel; that is expected and is not double-modelling.
category: Module
module_categories:
- INFECTIOUS_DISEASE
- IMMUNOLOGY
creation_date: "2026-09-17T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  `Viral_Hemorrhagic_Fever` Disease entry: the organ syndrome spans unrelated
  organisms, so under the infectious disease granularity ladder (design
  decisions section 3e, rules R4 and R24) the shared mechanism is this module
  and the membership is the `Viral_Hemorrhagic_Fevers` grouping. This module
  and that grouping together replace the former umbrella entry, which was the
  one instance the granularity checker reported as DOUBLE_MODELLED.

  Disorder entries reference individual nodes via conforms_to (for example,
  "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability"). Key
  disease-specific substitutions at the trigger node: Ebola virus disease
  substitutes filovirus entry via endocytosis and NPC1, with macrophage and
  dendritic cell infection early; hemorrhagic fever with renal syndrome
  substitutes beta3 integrin-mediated, noncytopathic hantavirus infection of
  microvascular endothelium, with the permeability lesion driven by VEGF and
  bradykinin rather than by cytolysis; severe dengue substitutes secondary
  heterotypic infection with antibody-dependent enhancement, and the leak is
  brief and self-limiting rather than progressive. The organ emphasis
  substitutes too - renal for hantavirus, hepatic for yellow fever and Ebola -
  and is a property of the conforming entry, not of this module.

  The module is deliberately two-armed rather than funnelled through a single
  hemostatic umbrella node. An earlier review of the former umbrella entry
  (PR dismech#8243) removed exactly such a parent node, on the ground that the
  directionality of umbrella-to-route edges was not supported by the cited
  sources, and atomized the four bleeding routes instead. That judgement is
  preserved here: the four hemostatic routes descend directly from the trigger,
  because the source states that both direct viral infection of host cells and
  the host response contribute to hemostatic dysregulation without ranking or
  sequencing the routes. The same review removed a bundled
  shock-and-organ-dysfunction node, so this module ends in individual phenotype
  readouts rather than in one composite consequence node.

  There is no treatments block, and its absence is the finding rather than a
  gap. No therapy acts on this shared mechanism: supportive care is the
  cornerstone of management for most hemorrhagic fevers precisely because
  pathogen-targeted therapy is agent-specific (ribavirin for Lassa fever,
  monoclonal antibodies for Ebola virus disease, vaccines for a selected few).
  Those belong on the member disorder entries, and the cross-group statement of
  that asymmetry is recorded in the `Viral_Hemorrhagic_Fevers` grouping.

  Modules bind GO and CL terms only and do not use chemical (CHEBI) or disease
  (MONDO) term bindings; the phenotypes block binds HP terms, following the
  precedent of `myelosuppression` and `drug_induced_liver_injury`, because the
  clinical readouts are what make this a hemorrhagic *fever* module rather than
  a generic endothelial one.
pathophysiology:
- name: High Viremia and Vascular Target Infection
  description: >-
    The shared upstream state of the syndrome. Early failure of antiviral
    immunity lets the virus reach high titre, and the circulating virus reaches
    the vascular endothelium and the mononuclear phagocyte compartment. What is
    conserved across agents is not the receptor, the entry route or the tissue
    tropism - those differ - but that a high systemic viral burden is presented
    to the vasculature and to myeloid cells. Conforming entries substitute
    their own agent, receptor and entry mechanism here.
  role: trigger
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: mononuclear phagocyte
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  downstream:
  - target: Endothelial Activation and Damage
    description: >-
      High-titre infection reaches the vasculature and acts on endothelial
      cells, which is the entry point of the vascular arm of the syndrome.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38749416
      reference_title: "Vascular dysfunction in hemorrhagic viral fevers: opportunities for organotypic modeling."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Named after their common symptom hemorrhage, these viruses induce significant vascular dysfunction by affecting endothelial cells, altering immunity, and disrupting the clotting system.
      explanation: The review attributes the vascular dysfunction of these viruses to their effect on endothelial cells, which is the edge asserted here.
  - target: Consumptive Coagulopathy
    description: >-
      Direct viral infection of host cells and the host response to the virus
      both contribute to hemostatic dysregulation, of which consumption of
      coagulation components is one of the four routes the literature
      distinguishes.
    causal_link_type: DIRECT
    evidence: &vhf_module_infection_to_hemostasis_evidence
    - reference: PMID:41410052
      reference_title: Potential Mechanisms Underlying Bleeding During Infection With Hemorrhagic Fever Viruses.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Both direct effects from viral infection of host cells and indirect effects caused by the host response to the virus contribute to dysregulation of the hemostatic system.
      explanation: >-
        The review states that viral infection of host cells and the host
        response to it both dysregulate the hemostatic system, which is the
        link from the trigger node to each hemostatic route. It does not rank
        or sequence the routes, so the four are drawn in parallel.
    - reference: PMID:41410052
      reference_title: Potential Mechanisms Underlying Bleeding During Infection With Hemorrhagic Fever Viruses.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Herein, we discuss the potential mechanisms leading to bleeding during VHF, which include a consumptive coagulopathy, decreased coagulation factor production, thrombocytopenia and platelet dysfunction, and endothelial cell activation and damage, resulting in increased vascular permeability.
      explanation: The same review enumerates the four hemostatic routes that this edge and its three siblings lead to.
  - target: Decreased Coagulation Factor Production
    description: >-
      Reduced coagulation factor availability is a second route from the same
      viral and host-response effects on the hemostatic system.
    causal_link_type: DIRECT
    evidence: *vhf_module_infection_to_hemostasis_evidence
  - target: Reduced Platelet Number
    description: >-
      Loss of circulating platelets is a third route from the same viral and
      host-response effects on the hemostatic system.
    causal_link_type: DIRECT
    evidence: *vhf_module_infection_to_hemostasis_evidence
  - target: Platelet Dysfunction
    description: >-
      Impaired platelet function is a fourth route from the same viral and
      host-response effects on the hemostatic system, separable from platelet
      loss because a normal count does not exclude it.
    causal_link_type: DIRECT
    evidence: *vhf_module_infection_to_hemostasis_evidence
  evidence:
  - reference: PMID:41734218
    reference_title: "[Viral hemorrhagic fevers: Pathogenesis, epidemiology and clinical manifestations]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their pathogenesis is characterized by early failure of antiviral immunity, high viremia, endothelial dysfunction, capillary leak, and coagulopathy.
    explanation: This places early failure of antiviral immunity and high viremia at the head of the shared pathogenetic sequence, which is what this trigger node represents.
  - reference: PMID:38749416
    reference_title: "Vascular dysfunction in hemorrhagic viral fevers: opportunities for organotypic modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Named after their common symptom hemorrhage, these viruses induce significant vascular dysfunction by affecting endothelial cells, altering immunity, and disrupting the clotting system.
    explanation: This supports the vascular and myeloid compartments as the targets on which these viruses act, and names the endothelial, immune and clotting arms that the module then follows.
- name: Endothelial Activation and Damage
  description: >-
    Activation or damage of the vascular endothelium is the recurring vascular
    lesion of the hemorrhagic fevers. Its proximate drivers vary among agents -
    direct cytopathic infection, noncytopathic infection with junctional
    destabilisation, cytotoxic T cell attack on antigen-presenting endothelium,
    or host mediators acting on an uninfected endothelium - and a conforming
    entry substitutes its own. What is conserved is that the endothelium stops
    behaving as an intact barrier.
  role: amplifier
  biological_scale: CELLULAR
  downstream:
  - target: Increased Vascular Permeability
    description: Endothelial activation and damage disrupt barrier integrity and increase vascular permeability.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41410052
      reference_title: Potential Mechanisms Underlying Bleeding During Infection With Hemorrhagic Fever Viruses.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Herein, we discuss the potential mechanisms leading to bleeding during VHF, which include a consumptive coagulopathy, decreased coagulation factor production, thrombocytopenia and platelet dysfunction, and endothelial cell activation and damage, resulting in increased vascular permeability.
      explanation: The review directly states that endothelial cell activation and damage result in increased vascular permeability.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: endothelial cell activation
    modifier: INCREASED
    term:
      id: GO:0042118
      label: endothelial cell activation
  evidence:
  - reference: PMID:38749416
    reference_title: "Vascular dysfunction in hemorrhagic viral fevers: opportunities for organotypic modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Named after their common symptom hemorrhage, these viruses induce significant vascular dysfunction by affecting endothelial cells, altering immunity, and disrupting the clotting system.
    explanation: This supports endothelial involvement, immune alteration, clotting disruption, and vascular dysfunction as shared hemorrhagic fever mechanisms.
  - reference: PMID:41410052
    reference_title: Potential Mechanisms Underlying Bleeding During Infection With Hemorrhagic Fever Viruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Herein, we discuss the potential mechanisms leading to bleeding during VHF, which include a consumptive coagulopathy, decreased coagulation factor production, thrombocytopenia and platelet dysfunction, and endothelial cell activation and damage, resulting in increased vascular permeability.
    explanation: This supports endothelial activation and damage, and the increased vascular permeability that follows, as mechanisms linked to hemorrhagic fever bleeding.
- name: Increased Vascular Permeability
  description: >-
    The rate-limiting lesion of the syndrome and the module's key conformance
    target. A microvascular endothelium that no longer restrains solute and
    plasma movement permits plasma leakage and intravascular volume loss. Every
    hemorrhagic fever funnels through this node; what differs by agent is its
    tempo and its severity, not whether it occurs. Conforming entries name the
    mechanism that produces it in their disease - VEGF-driven VE-cadherin
    destabilisation, bradykinin release, or direct cytopathic loss of the
    barrier.
  role: central_effector
  biological_scale: TISSUE
  downstream:
  - target: Capillary leak
    description: Increased vascular permeability is expressed clinically as capillary leak.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41734218
      reference_title: "[Viral hemorrhagic fevers: Pathogenesis, epidemiology and clinical manifestations]."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Their pathogenesis is characterized by early failure of antiviral immunity, high viremia, endothelial dysfunction, capillary leak, and coagulopathy.
      explanation: This supports capillary leak as the clinical expression of the permeability abnormality this node represents.
  - target: Shock
    description: Severe plasma leakage contributes to shock through intravascular volume depletion and hypotension.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - intravascular volume depletion and hypotension
    evidence:
    - reference: PMID:30507366
      reference_title: "Beyond thrombocytopaenia, haemorrhage and shock: the expanded dengue syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dengue infection classically presents with fever, thrombocytopaenia, and varying degrees of plasma leakage, giving rise to shock.
      explanation: >-
        This states the leakage-to-shock route directly, in dengue. The quoted
        source is dengue-specific, so the edge records a route that the module
        asserts is available to every conforming disease without asserting that
        it is equally prominent in each; how far a given agent drives it is a
        property of the conforming entry.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: ABNORMAL
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:41734218
    reference_title: "[Viral hemorrhagic fevers: Pathogenesis, epidemiology and clinical manifestations]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their pathogenesis is characterized by early failure of antiviral immunity, high viremia, endothelial dysfunction, capillary leak, and coagulopathy.
    explanation: This names capillary leak as a distinct recurring feature of hemorrhagic fever pathogenesis, alongside the endothelial dysfunction upstream of it.
  - reference: PMID:41410052
    reference_title: Potential Mechanisms Underlying Bleeding During Infection With Hemorrhagic Fever Viruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Herein, we discuss the potential mechanisms leading to bleeding during VHF, which include a consumptive coagulopathy, decreased coagulation factor production, thrombocytopenia and platelet dysfunction, and endothelial cell activation and damage, resulting in increased vascular permeability.
    explanation: The review directly links endothelial activation and damage to the increased vascular permeability this node represents.
- name: Consumptive Coagulopathy
  description: >-
    Consumption of coagulation components is the first of the four hemostatic
    routes to bleeding. It is one potential route rather than a universal one:
    it is not asserted to occur in every hemorrhagic fever or to carry equal
    weight across agents.
  role: effector
  biological_scale: ORGANISM
  downstream:
  - target: Hemorrhage
    description: Consumption of coagulation components contributes to hemorrhagic manifestations.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

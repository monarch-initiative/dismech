- discussion_id: vhf_human_vascular_model_fidelity
  prompt: >-
    How faithfully do animal, conventional two-dimensional culture, and
    emerging microphysiological models reproduce human hemorrhagic fever
    vascular dynamics across different agents?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Endothelial Activation and Damage
  - pathophysiology#Increased Vascular Permeability
  rationale: >-
    Existing animal and cell-culture systems have produced the mechanistic
    insight this module rests on, but a vascular-model review specifically
    questions their fidelity to human in-vivo dynamics and presents
    microphysiological systems as promising rather than validated
    replacements. The module's two vascular nodes are therefore supported by
    evidence whose translational validity to human disease is itself the open
    question.
  evidence:
  - reference: PMID:38749416
    reference_title: "Vascular dysfunction in hemorrhagic viral fevers: opportunities for organotypic modeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While animal models and traditional 2D cell cultures have contributed insight into the mechanisms by which these pathogens affect the vasculature, these models fall short in replicatingin vivohuman vascular dynamics.
    explanation: The review directly states the translational limitation of the existing model systems behind these nodes.

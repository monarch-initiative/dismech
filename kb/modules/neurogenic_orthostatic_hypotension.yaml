name: Neurogenic Orthostatic Hypotension Module
description: >-
  A conserved mechanism module for neurogenic orthostatic hypotension (nOH), the
  failure of the sympathetic baroreflex to constrict blood vessels when a person
  stands up. Normally, unloading of arterial baroreceptors on standing increases
  sympathetic efferent traffic, which releases norepinephrine from postganglionic
  noradrenergic terminals onto vascular alpha-1 adrenoceptors and maintains blood
  pressure. Four lesion sites interrupt this pathway: (a) central or preganglionic
  baroreflex efferent neurons (multiple system atrophy), with postganglionic
  neurons largely spared; (b) transmission in the autonomic ganglia (autoimmune
  autonomic ganglionopathy); (c) the postganglionic noradrenergic neurons
  themselves (pure autonomic failure, Parkinson disease, dementia with Lewy
  bodies); (d) norepinephrine synthesis inside intact neurons (dopamine
  beta-hydroxylase deficiency, CYB561 deficiency). All four converge on the key
  conformance target, deficient norepinephrine release at the sympathetic
  neurovascular junction on standing. That deficit causes failure of
  baroreflex-mediated vasoconstriction and an orthostatic fall in blood pressure
  with cerebral and muscle hypoperfusion. Side branches are adrenoceptor
  denervation supersensitivity (postganglionic lesions), and neurogenic supine
  hypertension with nocturnal pressure natriuresis, which depletes intravascular
  volume overnight and worsens morning orthostatic hypotension. The module's
  drug-target pattern is that the lesion site determines which pressor
  strategy can work. Midodrine (an alpha-1 agonist) and droxidopa (a
  norepinephrine precursor converted by aromatic L-amino acid decarboxylase)
  bypass the missing neurotransmitter and work at every lesion site, better
  still where receptors are supersensitive. Atomoxetine (norepinephrine
  transporter blockade) and pyridostigmine (ganglionic acetylcholinesterase
  inhibition) amplify residual sympathetic traffic, so they need surviving
  efferent fibres and work best in central lesions. Fludrocortisone expands
  intravascular volume independently of the lesion. This module covers the
  autonomic failure itself; it does not cover alpha-synuclein aggregation, which
  is the loss_of_proteostasis module's subject, nor reflex (vasovagal) syncope or
  postural orthostatic tachycardia syndrome, in which the sympathetic efferent
  pathway is intact.
category: Module
module_categories:
- NEUROSCIENCE
- PHARMACOLOGY
creation_date: "2026-11-05T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease. A conforming entry declares the
  lesion-site node that applies to it (one of the four branch nodes) and conforms
  its own norepinephrine-release, vasoconstriction and hypoperfusion nodes to the
  shared chain. Pure autonomic failure, Parkinson disease and dementia with Lewy
  bodies conform at Postganglionic Noradrenergic Denervation and usually also at
  Adrenoceptor Denervation Supersensitivity. Multiple system atrophy conforms at
  Central Baroreflex Efferent Pathway Degeneration. Autoimmune autonomic
  ganglionopathy conforms at Ganglionic Cholinergic Transmission Failure.
  Dopamine beta-hydroxylase deficiency and CYB561 deficiency conform at
  Noradrenaline Synthesis Failure. Conformance means the shared chain plus at
  least one lesion-site branch, not exactly one, because branches overlap: a
  minority of multiple system atrophy patients have postganglionic denervation as
  well, and spinal preganglionic (intermediolateral nucleus) neuron loss also
  occurs in Parkinson disease and dementia with Lewy bodies. Plasma norepinephrine measured supine is the usual readout separating the
  central branch (normal) from the postganglionic branch (low). Do not create a
  disorder entry named for neurogenic orthostatic hypotension; it is a syndrome
  of the conforming diseases.
pathophysiology:
- name: Central Baroreflex Efferent Pathway Degeneration
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Lesion-site branch (a). Degeneration of central autonomic neurons that carry
    baroreflex efferent drive, including brainstem and spinal preganglionic
    sympathetic neurons, while the postganglionic noradrenergic neurons and their
    vascular terminals are largely preserved. Plasma norepinephrine is usually
    normal, and residual peripheral sympathetic tone remains available to drugs
    that amplify it.
  cell_types:
  - preferred_term: autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  locations:
  - preferred_term: intermediolateral nucleus
    term:
      id: UBERON:0002175
      label: intermediolateral nucleus
  biological_processes:
  - preferred_term: carotid sinus baroreceptor feedback regulation of blood pressure
    modifier: DECREASED
    term:
      id: GO:0001978
      label: regulation of systemic arterial blood pressure by carotid sinus baroreceptor feedback
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients with MSA, cardiovascular autonomic dysfunction is caused by degeneration of CNS neurons involved in baroreflex control, while only a minority (< 30%) of patients has degeneration of post-ganglionic sympathetic nerves."
    explanation: >-
      Places the multiple system atrophy lesion in central baroreflex neurons with
      postganglionic sympathetic nerves spared in most patients.
  - reference: PMID:27061071
    reference_title: "Reduction of Small Fibers of Thoracic Ventral Roots and Neurons of Intermediolateral Nucleus in Parkinson Disease and Dementia with Lewy Bodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of intermediolateral nucleus (IML) neurons is considered to play a major role in orthostatic hypotension (OH) of multiple system atrophy (MSA)."
    explanation: >-
      Names the spinal preganglionic lesion behind orthostatic hypotension in
      MSA. The same autopsy study finds this loss in Parkinson disease and
      dementia with Lewy bodies too, which is why branches can co-occur.
  downstream:
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    description: >-
      Without central efferent drive, intact postganglionic terminals are not
      activated on standing and release too little norepinephrine.
- name: Ganglionic Cholinergic Transmission Failure
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Lesion-site branch (b). Failure of nicotinic cholinergic transmission from
    preganglionic to postganglionic neurons in the autonomic ganglia, as when
    autoantibodies against the ganglionic acetylcholine receptor reduce its
    current. Both neurons survive, so the deficit is in transmission.
  locations:
  - preferred_term: autonomic ganglion
    term:
      id: UBERON:0001805
      label: autonomic ganglion
  biological_processes:
  - preferred_term: ganglionic cholinergic synaptic transmission
    modifier: DECREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  evidence:
  - reference: PMID:18951069
    reference_title: "Autonomic ganglia, acetylcholine receptor antibodies, and autoimmune ganglionopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AAG is an antibody-mediated neurological disorder. Antibodies from patients with AAG inhibit ganglionic AChR currents and impair transmission in autonomic ganglia."
    explanation: >-
      Establishes impaired ganglionic transmission as the lesion in autoimmune
      autonomic ganglionopathy.
  downstream:
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    description: >-
      Postganglionic noradrenergic neurons receive too little drive to release
      norepinephrine on standing.
- name: Postganglionic Noradrenergic Denervation
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Lesion-site branch (c). Loss of postganglionic sympathetic noradrenergic
    neurons and their vascular and cardiac terminals, with low plasma
    norepinephrine. This is the lesion in the Lewy body disorders.
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:3000002
      label: sympathetic noradrenergic neuron
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients with LB disorders, cardiovascular dysautonomia is predominantly due to degeneration of post-ganglionic sympathetic neurons."
    explanation: >-
      Places the Lewy body disorder lesion in the postganglionic sympathetic
      neurons.
  - reference: PMID:12707437
    reference_title: "Plasma levels of catechols and metanephrines in neurogenic orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PAF group had low NE, DHPG, NMN, EPI, and MN levels, the group with MSA + NOH had generally normal levels"
    explanation: >-
      Plasma catechols separate the postganglionic branch (low in pure autonomic
      failure) from the central branch (normal in multiple system atrophy).
  downstream:
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    description: >-
      The terminals that would release norepinephrine onto vessels are lost.
  - target: Adrenoceptor Denervation Supersensitivity
    description: >-
      Chronic loss of neurotransmitter release upregulates vascular adrenoceptor
      responsiveness.
- name: Noradrenaline Synthesis Failure
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Lesion-site branch (d). Intact sympathetic neurons cannot convert dopamine to
    norepinephrine, because dopamine beta-hydroxylase is absent or because its
    ascorbate-regenerating electron donor in the secretory vesicle is missing.
  biological_processes:
  - preferred_term: norepinephrine biosynthesis
    modifier: DECREASED
    term:
      id: GO:0042421
      label: norepinephrine biosynthetic process
  evidence:
  - reference: PMID:1677640
    reference_title: "Dopamine beta-hydroxylase deficiency. A genetic disorder of cardiovascular regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dopamine beta-hydroxylase (DBH) deficiency is a genetic disorder in which affected patients cannot synthesize norepinephrine, epinephrine, and octopamine in either the central nervous system or the peripheral autonomic neurons."
    explanation: >-
      Shows the synthesis branch: neurons are present but cannot make
      norepinephrine.
  - reference: PMID:31822578
    reference_title: "Congenital absence of norepinephrine due to CYB561 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cytochrome b561 (CYB561) generates ascorbic acid, a cofactor in the enzymatic conversion of dopamine to norepinephrine by dopamine"
    explanation: >-
      CYB561 loss blocks the same dopamine-to-norepinephrine step as DBH
      deficiency, by removing the enzyme's cofactor.
  - reference: PMID:27148966
    reference_title: "Human Bacterial Artificial Chromosome (BAC) Transgenesis Fully Rescues Noradrenergic Function in Dopamine β-Hydroxylase Knockout Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DBH deficiency prevents NE production and causes sympathetic failure, hypotension and ptosis in humans and mice"
    explanation: >-
      The Dbh knockout mouse reproduces the human synthesis-failure phenotype.
  downstream:
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    description: >-
      Neurons fire but release little or no norepinephrine.
- name: Deficient Norepinephrine Release at the Neurovascular Junction
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Key conformance target. Too little norepinephrine reaches vascular
    adrenoceptors when baroreceptors are unloaded on standing, whatever the
    upstream lesion. Whether residual release survives depends on the branch,
    and that decides whether drugs that amplify residual sympathetic tone can
    work.
  cell_types:
  - preferred_term: sympathetic noradrenergic neuron
    term:
      id: CL:3000002
      label: sympathetic noradrenergic neuron
  biological_processes:
  - preferred_term: norepinephrine secretion
    modifier: DECREASED
    term:
      id: GO:0048243
      label: norepinephrine secretion
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Normally, unloading of the baroreceptors by standing up triggers norepinephrine release from sympathetic post-ganglionic nerves causing vasoconstriction, which maintains BP in the standing position. This compensatory vasoconstriction is absent or attenuated in patients with synucleinopathies resulting in nOH."
    explanation: >-
      States the shared step: norepinephrine release on standing is what
      maintains blood pressure, and its loss produces nOH.
  - reference: PMID:30571543
    reference_title: "Synergistic Pressor Effect of Atomoxetine and Pyridostigmine in Patients With Neurogenic Orthostatic Hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autonomic failure are characterized by disabling orthostatic hypotension because of impaired sympathetic activity, but even severely affected patients have residual sympathetic tone which can be harnessed for their treatment."
    explanation: >-
      Supports that release is reduced rather than abolished, leaving residual
      tone for drugs to amplify.
  - reference: PMID:28702747
    reference_title: "Management of Supine Hypertension Complicating Neurogenic Orthostatic Hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "are characterized by defective norepinephrine release from sympathetic terminals upon standing, resulting in impaired vasoconstriction"
    explanation: >-
      States the shared step across the nOH disorders.
  - reference: PMID:26373628
    reference_title: "Neurogenic orthostatic hypotension: roles of norepinephrine deficiency in its causes, its treatment, and future research directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Norepinephrine deficiency in NOH can arise peripherally, due to cardiovascular sympathetic denervation (as in pure autonomic failure, Parkinson's disease, and a variety of neuropathies), or centrally, due to a failure of viscerosensory signals to generate adequate sympathetic traffic to intact sympathetic nerve endings (as in multiple system atrophy)"
    explanation: >-
      Peripheral and central lesions both end in a norepinephrine deficit at
      the vascular terminal.
  downstream:
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    description: >-
      Without norepinephrine on vascular alpha-1 adrenoceptors, arterioles and
      veins do not constrict on standing.
- name: Adrenoceptor Denervation Supersensitivity
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Side branch of postganglionic lesions. Denervated vascular adrenoceptors
    respond more strongly to exogenous agonists and to norepinephrine made from
    droxidopa, which is why low plasma norepinephrine predicts a larger pressor
    response to those drugs.
  biological_processes:
  - preferred_term: adrenergic receptor signaling
    modifier: INCREASED
    term:
      id: GO:0071875
      label: adrenergic receptor signaling pathway
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These responses can be explained by denervation supersensitivity of adrenergic receptors."
    explanation: >-
      Attributes the larger pressor response seen with low norepinephrine to
      receptor supersensitivity.
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Conversely, lower supine plasma norepinephrine levels appear to predict a greater symptomatic and pressor response to droxidopa, an oral norepinephrine synthetic precursor."
    explanation: >-
      Low plasma norepinephrine, the marker of postganglionic loss, predicts a
      larger droxidopa response.
  - reference: PMID:32979782
    reference_title: "Pharmacologic treatment of orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Denervation hypersensitivity and impairment of baroreflex buffering makes these patients sensitive to small doses of pressor agents."
    explanation: >-
      Independent statement that denervation hypersensitivity increases
      sensitivity to pressor agents.
  - reference: PMID:8089252
    reference_title: "Manipulation of norepinephrine metabolism with yohimbine in the treatment of autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This increased responsiveness can be explained by sensitization of adrenergic receptors, analogous to denervation supersensitivity, and by the lack of autonomic reflexes that would normally buffer any increase in blood pressure."
    explanation: >-
      Patients with severe sympathetic deprivation respond strongly to a small
      pressor stimulus, attributed to receptor sensitization and absent
      baroreflex buffering.
- name: Failure of Baroreflex-Mediated Vasoconstriction
  role: effector
  biological_scale: TISSUE
  description: >-
    Arterial and venous constriction does not increase on standing, so
    peripheral resistance and venous return fall and blood pools in the legs and
    splanchnic bed.
  biological_processes:
  - preferred_term: baroreflex arterial vasoconstriction
    modifier: DECREASED
    term:
      id: GO:0001987
      label: vasoconstriction of artery involved in baroreceptor response to lowering of systemic arterial blood pressure
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This results in impaired norepinephrine release and defective vasoconstriction upon standing causing the BP to fall (i.e., nOH)."
    explanation: >-
      Connects impaired norepinephrine release to defective vasoconstriction and
      the fall in blood pressure.
  downstream:
  - target: Orthostatic Fall in Blood Pressure with Cerebral Hypoperfusion
    description: >-
      Lost vasoconstriction lets blood pressure fall on standing.
- name: Orthostatic Fall in Blood Pressure with Cerebral Hypoperfusion
  role: consequence
  biological_scale: ORGANISM
  description: >-
    A sustained fall in blood pressure on standing that underperfuses brain and
    muscle, causing lightheadedness, blurred vision, coat-hanger pain, fatigue,
    syncope and falls.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "nOH results in acute morbidity like syncope and falls whereas nSH causes end-target organ damage over time."
    explanation: >-
      Names the acute consequences of nOH and distinguishes them from the
      long-term harm of supine hypertension.
- name: Neurogenic Supine Hypertension and Nocturnal Pressure Natriuresis
  role: amplifier
  biological_scale: ORGANISM
  description: >-
    Side branch. About half of patients have high blood pressure when lying down.
    In multiple system atrophy, residual sympathetic tone may contribute; in the
    Lewy body disorders the cause is not established. Overnight supine
    hypertension drives pressure natriuresis and nocturia, depleting
    intravascular volume and worsening orthostatic hypotension the next morning.
    Raising blood pressure to treat nOH worsens supine hypertension, and lowering
    it does the reverse.
  biological_processes:
  - preferred_term: pressure natriuresis
    modifier: INCREASED
    term:
      id: GO:0035819
      label: positive regulation of renal sodium excretion by pressure natriuresis
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients with MSA, residual sympathetic neurovascular tone may contribute to SH. In contrast, SH in patients with LB disorders has a mechanism other than increased sympathetic outflows, yet to be fully identified."
    explanation: >-
      Gives the branch-specific mechanism of supine hypertension and records
      that it is unknown in the Lewy body disorders.
  - reference: PMID:11927799
    reference_title: "Diagnosis and treatment of supine hypertension in autonomic failure patients with orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "about one half of these patients also suffer from supine hypertension, which induces pressure natriuresis, worsening orthostatic hypotension"
    explanation: >-
      Links supine hypertension to pressure natriuresis and worse orthostatic
      hypotension.
  downstream:
  - target: Orthostatic Fall in Blood Pressure with Cerebral Hypoperfusion
    description: >-
      Overnight volume loss lowers morning standing blood pressure.
treatments:
- name: Midodrine
  description: >-
    Oral alpha-1 adrenoceptor agonist that constricts vessels directly, without
    needing norepinephrine release, so it works at every lesion site. It raises
    supine as well as standing blood pressure and should not be taken within 3-4
    hours of bedtime.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: midodrine
      term:
        id: CHEBI:6933
        label: midodrine
  target_mechanisms:
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    treatment_effect: BYPASSES
    description: >-
      Acts on the vascular receptor downstream of the missing neurotransmitter.
  - target: Failure of Baroreflex-Mediated Vasoconstriction
    treatment_effect: RESTORES
    description: >-
      Restores vasoconstriction pharmacologically, enhanced where adrenoceptors
      are supersensitive.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "adrenoceptor agonist that induces vasoconstriction and increases BP"
    explanation: >-
      States the mechanism: direct adrenoceptor agonism causing vasoconstriction.
  - reference: PMID:28794253
    reference_title: "Efficacy of single or combined midodrine and pyridostigmine in orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Midodrine was better than pyridostigmine at improving OH-related symptoms."
    explanation: >-
      Randomized open-label comparison over 3 months; the direct agonist
      improved symptoms more than the residual-tone amplifier.
  - reference: PMID:32979782
    reference_title: "Pharmacologic treatment of orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "with peripheral noradrenergic degeneration (pure autonomic failure, Parkinson's disease) and low plasma norepinephrine, tend to respond better to \"norepinephrine replacers\" (midodrine and droxidopa)"
    explanation: >-
      Postganglionic lesions with low norepinephrine respond better to drugs
      that replace the transmitter, midodrine and droxidopa.
- name: Droxidopa
  description: >-
    Oral synthetic amino acid converted to norepinephrine by aromatic L-amino
    acid decarboxylase, including outside noradrenergic terminals, so it
    replaces the missing transmitter at every lesion site, including when
    dopamine beta-hydroxylase is absent. High-dose carbidopa blocks the
    conversion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: droxidopa
      term:
        id: CHEBI:31524
        label: droxidopa
  target_mechanisms:
  - target: Noradrenaline Synthesis Failure
    treatment_effect: BYPASSES
    description: >-
      Produces norepinephrine without dopamine beta-hydroxylase.
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    treatment_effect: BYPASSES
    description: >-
      Supplies norepinephrine independently of neuronal release; the response is
      larger where adrenoceptors are supersensitive.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Droxidopa is decarboxylated to norepinephrine by the enzyme aromatic amino-acid decarboxylase (AAAD) the same enzyme the converts L-dopa to dopamine."
    explanation: >-
      States the conversion step that lets droxidopa bypass both synthesis and
      release defects.
- name: Atomoxetine
  description: >-
    Norepinephrine transporter inhibitor that raises synaptic norepinephrine
    from surviving terminals. It needs residual sympathetic release, so it is
    expected to work best in central lesions with spared postganglionic fibres
    and normal or high plasma norepinephrine, and poorly after postganglionic
    denervation. Combined with pyridostigmine it has a synergistic pressor effect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atomoxetine
      term:
        id: CHEBI:127342
        label: atomoxetine
  target_mechanisms:
  - target: Deficient Norepinephrine Release at the Neurovascular Junction
    treatment_effect: MODULATES
    description: >-
      Prolongs the action of whatever norepinephrine is still released; cannot
      act where terminals are lost.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, patients with low plasma norepinephrine levels (usually LB disorders) may benefit more from droxidopa and midodrine, whereas patients with normal or high plasma norepinephrine levels (usually MSA) may potentially benefit more from NET inhibitors (Figure 1)."
    explanation: >-
      States the lesion-site rule for choosing between residual-tone amplifiers
      and drugs that bypass the deficit.
  - reference: PMID:30571543
    reference_title: "Synergistic Pressor Effect of Atomoxetine and Pyridostigmine in Patients With Neurogenic Orthostatic Hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the combination pyridostigmine and atomoxetine had a synergistic effect on seated BP which was associated with improvement in orthostatic tolerance and symptoms"
    explanation: >-
      Single-blind crossover in 12 patients with severe autonomic failure:
      neither drug alone raised blood pressure, but the combination did.
  - reference: PMID:32979782
    reference_title: "Pharmacologic treatment of orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "patients with relatively preserved \"sympathetic reserve\", i.e., those with impaired central autonomic pathways but spared peripheral noradrenergic fibers (multiple system atrophy) and normal or slightly reduced plasma norepinephrine, tend to respond better to \"norepinephrine enhancers\" (pyridostigmine, atomoxetine, and yohimbine)"
    explanation: >-
      States the reserve-dependent rule: enhancers suit central lesions with
      spared peripheral fibres.
  - reference: PMID:36647224
    reference_title: "Effects of Atomoxetine for the Treatment of Neurogenic Orthostatic Hypotension in Patients With Alpha-synucleinopathies: A Systematic Review of Randomized Controlled Trials and a Focus-Group Discussion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Its effects were pronounced in cases with central autonomic failure, including multiple-system atrophy (MSA)."
    explanation: >-
      Systematic review of the randomized trials finds the largest atomoxetine
      effect in central autonomic failure, as the lesion-site rule predicts.
  - reference: PMID:39294522
    reference_title: "Atomoxetine on neurogenic orthostatic hypotension: a randomized, double-blind, placebo-controlled crossover trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We found no differences in the OHQ composite score between atomoxetine and placebo at 2 weeks (-0.3 ± 1.7 versus -0.4 ± 1.5; P = 0.806) and 4 weeks (-0.6 ± 2.4 versus -0.5 ± 1.6; P = 0.251)."
    explanation: >-
      Over four weeks atomoxetine did not improve orthostatic symptoms more than
      placebo, so the acute pressor effect has not been shown to give sustained
      symptomatic benefit.
- name: Pyridostigmine
  description: >-
    Acetylcholinesterase inhibitor that enhances nicotinic transmission in the
    autonomic ganglia, increasing sympathetic outflow mainly when upright, so it
    raises standing blood pressure with little effect on supine pressure. Its
    effect is modest and depends on residual preganglionic traffic.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  target_mechanisms:
  - target: Ganglionic Cholinergic Transmission Failure
    treatment_effect: MODULATES
    description: >-
      Raises acetylcholine at the ganglionic synapse, partly overcoming reduced
      transmission.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pyridostigmine, a cholinesterase inhibitor, potentiates cholinergic neurotransmission in sympathetic and parasympathetic autonomic ganglia."
    explanation: >-
      States the ganglionic site of action.
  - reference: PMID:16476804
    reference_title: "Pyridostigmine treatment trial in neurogenic orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyridostigmine significantly improves standing BP in patients with OH without worsening supine hypertension."
    explanation: >-
      Double-blind crossover trial in 58 patients showing the upright-selective
      effect expected from amplifying baroreflex-driven traffic.
- name: Fludrocortisone
  description: >-
    Synthetic mineralocorticoid that expands intravascular volume through renal
    sodium and water retention and enhances pressor responsiveness to
    catecholamines. It acts independently of the lesion site and worsens supine
    hypertension, hypokalemia and edema.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fludrocortisone
      term:
        id: CHEBI:50885
        label: fludrocortisone
  target_mechanisms:
  - target: Orthostatic Fall in Blood Pressure with Cerebral Hypoperfusion
    treatment_effect: INHIBITS
    description: >-
      Expanded plasma volume raises standing blood pressure without restoring
      sympathetic function.
  - target: Neurogenic Supine Hypertension and Nocturnal Pressure Natriuresis
    treatment_effect: MODULATES
    description: >-
      Raises supine blood pressure too, so it can worsen this branch.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It increases renal sodium and water re-absorption, thus expanding intravascular volume, and also enhances the pressor responsiveness to endogenous catecholamine and pressor drugs."
    explanation: >-
      States both mechanisms of fludrocortisone.
- name: Head-Up Tilt Sleeping
  description: >-
    Sleeping with the head and torso raised 30-45 degrees lowers nocturnal
    supine blood pressure, reducing overnight natriuresis and nocturia, and so
    improves morning orthostatic hypotension.
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Neurogenic Supine Hypertension and Nocturnal Pressure Natriuresis
    treatment_effect: INHIBITS
    description: >-
      Lowers overnight blood pressure and the pressure natriuresis it drives.
  evidence:
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, lowering BP during the night reduces the exaggerated nocturia and natriuresis of these patients, therefore reducing the overnight volume depletion, and improving OH in the morning."
    explanation: >-
      Links lowering nocturnal blood pressure to less natriuresis and better
      morning orthostatic tolerance.
- name: Bedtime Short-Acting Antihypertensive
  description: >-
    For severe nocturnal supine hypertension that persists after head-up tilt, a
    short-acting antihypertensive taken at bedtime only, such as a transdermal
    nitroglycerin patch removed in the morning. A long-acting agent carries its
    depressor effect into the morning and worsens orthostatic hypotension.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nitroglycerin
      term:
        id: CHEBI:28787
        label: nitroglycerin
  target_mechanisms:
  - target: Neurogenic Supine Hypertension and Nocturnal Pressure Natriuresis
    treatment_effect: INHIBITS
    description: >-
      Lowers overnight supine blood pressure.
  evidence:
  - reference: PMID:9890307
    reference_title: "Contrasting effects of vasodilators on blood pressure and sodium balance in the hypertension of autonomic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is concluded that nifedipine and transdermal nitroglycerin are effective in controlling supine hypertension in patients with autonomic failure. However, nifedipine has a prolonged depressor effect and worsens orthostatic hypotension in the morning."
    explanation: >-
      Both vasodilators lowered nocturnal blood pressure; only the longer-acting
      nifedipine worsened morning orthostatic hypotension.
  - reference: PMID:29508455
    reference_title: "Treatment of autonomic dysfunction in Parkinson disease and other synucleinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Short-acting antihypertensives should be administered at bedtime only, not during daytime hours."
    explanation: >-
      States the bedtime-only rule for treating supine hypertension.
discussions:
- discussion_id: supine_hypertension_mechanism_in_postganglionic_failure
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Neurogenic Supine Hypertension and Nocturnal Pressure Natriuresis
  prompt: >-
    What raises supine blood pressure in pure autonomic failure and the other
    postganglionic disorders, where sympathetic terminals are lost?
  rationale: >-
    In multiple system atrophy, residual sympathetic tone is a plausible driver
    of supine hypertension. That explanation is not available in pure autonomic
    failure, where vascular resistance is high despite very low plasma
    norepinephrine and renin activity. Until the driver is known, this side
    branch has no upstream node for the postganglionic disorders, and treatment
    of supine hypertension there cannot be tied to a mechanism.
  evidence:
  - reference: PMID:11927799
    reference_title: "Diagnosis and treatment of supine hypertension in autonomic failure patients with orthostatic hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but the cause is not known in patients with pure autonomic failure, who have increased vascular resistance despite very low levels or plasma norepinephrine and renin activity"
    explanation: >-
      States that the cause of supine hypertension in pure autonomic failure is
      unknown.

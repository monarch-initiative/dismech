name: Neuromuscular Transmission Failure Module
description: >-
  A conserved mechanism module for failure of transmission at the motor endplate,
  the synapse between the motor nerve terminal and the skeletal muscle fibre. The
  module is organised around the safety factor of neuromuscular transmission: in
  health the endplate potential evoked by a nerve impulse is several times larger
  than the depolarization needed to open the postsynaptic Nav1.4 channels and fire
  a muscle action potential, so every nerve impulse produces a muscle impulse. A
  lesion of any endplate component — presynaptic (acetylcholine synthesis, vesicle
  filling, quantal release), synaptic basal lamina (endplate acetylcholinesterase,
  laminin, collagen Q), or postsynaptic (acetylcholine receptor density and
  kinetics, receptor clustering, endplate geometry, endplate sodium channels) —
  narrows that margin. Once the margin is lost, transmission fails intermittently
  and stochastically at individual endplates, and the fraction of blocked endplates
  rises with sustained or repetitive activity. The clinical read-out is fatigable,
  fluctuating weakness with a decremental compound-muscle-action-potential response
  to repetitive nerve stimulation. Three etiologic classes converge on this single
  chain: genetic (the congenital myasthenic syndromes), autoimmune (myasthenia
  gravis, Lambert-Eaton myasthenic syndrome), and toxin-mediated (botulism).
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disease-specific endplate lesion and the
  vulnerable muscle groups while preserving the conserved
  lesion → reduced endplate potential → lost safety factor → transmission block →
  fatigable weakness chain.
category: Module
creation_date: "2026-08-28T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries should
  reference individual nodes via conforms_to using
  "neuromuscular_transmission_failure#<Node Name>"; the key conformance target is
  "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular
  Transmission", the disorder-agnostic rate-limiting step that every conformer
  funnels through regardless of whether the endplate lesion is genetic, autoimmune,
  or toxic. The two nodes upstream of it are deliberately a parallel pair rather
  than a chain — "Reduced Quantal Acetylcholine Release" is the presynaptic arm and
  "Reduced Postsynaptic Endplate Response to Acetylcholine" the postsynaptic arm —
  because which one a disorder engages is exactly the discriminating fact
  (Lambert-Eaton and botulism are presynaptic; acetylcholine-receptor myasthenia
  gravis and most congenital myasthenic syndromes are postsynaptic; endplate
  acetylcholinesterase deficiency and the glycosylation congenital myasthenic
  syndromes engage both). A conforming entry is expected to declare only the arm it
  actually uses. The generic cell types are motor neuron (CL:0000100) and skeletal
  muscle fibre (CL:0008002); conforming entries substitute the disease-relevant
  populations (cholinergic neuron for botulism, which also strikes autonomic
  cholinergic synapses outside the neuromuscular junction).

  Boundaries with neighbouring modules. This module is deliberately complementary
  to — not a duplicate of — synaptic_vesicle_cycle, which models the release
  machinery itself (docking, priming, SNARE-mediated fusion, endocytic recycling)
  across all synapse types and is the right home for the presynaptic congenital
  myasthenic syndromes caused by vesicle-cycle genes such as UNC13A, SNAP25, SYT2
  and VAMP1. A presynaptic conformer may legitimately declare conformance to both:
  synaptic_vesicle_cycle for the lesion in the release machine, this module for the
  endplate-specific consequence of that lesion on the safety factor. The module also
  does not model the muscle fibre's own excitability once the action potential has
  been generated — that is the skeletal-muscle channelopathy territory proposed as a
  separate trunk in issue #9005 — nor the motor neuron degeneration and
  reinnervation that follow chronic denervation.

  Scope caveat worth carrying into conformers: the safety factor is not uniform
  across muscles. Ruff (PMID:22102453) explicitly excepts extraocular, middle ear,
  and some facial and pharyngeal muscles from the "slave synapse" description that
  holds for extremity and axial fibres, which is part of why ocular and bulbar
  muscles are preferentially affected in myasthenia gravis and botulism. Selective
  vulnerability is listed in #9005 as a domain-wide unexplained problem; this module
  records the non-uniformity rather than asserting a mechanism for it.

  Module evidence is drawn from the primary safety-factor literature
  (PMID:11275359, PMID:22102453, PMID:18632162) plus review-level anchors for each
  etiologic arm that are already curated and cached in the conforming disorder
  entries. It is illustrative of the abstracted pattern rather than an exhaustive
  citation set. Created for the Tier-1 neuromuscular module layer requested in
  issue #9005.
pathophysiology:
- name: Endplate Component Lesion
  description: >-
    The proximal lesion: loss, blockade, or kinetic alteration of a protein that
    the motor endplate depends on for reliable transmission. The lesion may sit at
    any of three locations. Presynaptic — acetylcholine synthesis (CHAT), vesicular
    loading, or the release apparatus, including the P/Q-type voltage-gated calcium
    channels that couple the nerve terminal action potential to release and the
    SNARE proteins cleaved by botulinum neurotoxin. Synaptic basal lamina — endplate
    acetylcholinesterase and its collagenic tail (COLQ), laminin beta-2 (LAMB2).
    Postsynaptic — the muscle nicotinic acetylcholine receptor subunits (CHRNA1,
    CHRNB1, CHRND, CHRNE), the clustering pathway that builds and maintains the
    endplate (AGRN, MUSK, LRP4, RAPSN, DOK7), the glycosylation enzymes those
    proteins depend on (GFPT1, DPAGT1, ALG2, ALG14), and the endplate Nav1.4
    channels (SCN4A). Conforming entries substitute their specific lesion and its
    etiologic class: germline variant, autoantibody, or toxin.
  role: trigger
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: ABNORMAL
  examples:
  - CHAT
  - COLQ
  - CHRNE
  - RAPSN
  - DOK7
  - GFPT1
  - SCN4A
  - acetylcholine receptor autoantibody
  - MuSK autoantibody
  - P/Q-type voltage-gated calcium channel autoantibody
  - botulinum neurotoxin
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most CMS stem from molecular defects in the muscle nicotinic acetylcholine
      receptor, but they can also be caused by mutations in presynaptic proteins,
      mutations in proteins associated with the synaptic basal lamina, defects in
      endplate development and maintenance, or defects in protein glycosylation.
    explanation: >-
      Enumerates the presynaptic, synaptic-basal-lamina and postsynaptic locations
      of the endplate lesion, which is the partition this trigger node abstracts.
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myasthenia gravis is an autoimmune disease that is characterised by muscle
      weakness and fatigue, is B-cell mediated, and is associated with antibodies
      directed against the acetylcholine receptor, muscle-specific kinase (MUSK),
      lipoprotein-related protein 4 (LRP4), or agrin in the postsynaptic membrane at
      the neuromuscular junction.
    explanation: >-
      Establishes the autoimmune arm of the trigger: autoantibodies against
      postsynaptic endplate proteins are an alternative route to the same lesion.
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P/Q-type voltage-gated calcium channels (VGCCs) localized in the presynaptic
      motor nerve terminal and in the autonomic nervous system are targeted by
      antibodies in LEMS patients
    explanation: >-
      Establishes the presynaptic autoimmune arm of the trigger, in which the
      targeted endplate component is the calcium channel that gates release.
  - reference: PMID:8331029
    reference_title: "Botulinum toxin A inhibits acetylcholine release from cultured neurons in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Clostridium botulinum type toxin A (BoTx) blocks stimulus-induced acetylcholine
      (ACh) release from presynaptic nerve terminals at peripheral neuromuscular
      junctions.
    explanation: >-
      Establishes the toxin arm of the trigger: an exogenous protease reaching the
      same presynaptic component produces the same endplate lesion.
  downstream:
  - target: Reduced Quantal Acetylcholine Release
    description: >-
      A presynaptic lesion — acetylcholine synthesis or vesicular loading, calcium
      entry, or the release machinery — lowers the number or content of quanta
      released per nerve impulse.
  - target: Reduced Postsynaptic Endplate Response to Acetylcholine
    description: >-
      A postsynaptic or synaptic-basal-lamina lesion lowers the depolarization each
      released quantum produces, by reducing receptor number, altering channel
      kinetics, or simplifying endplate geometry.
- name: Reduced Quantal Acetylcholine Release
  description: >-
    The presynaptic arm. The endplate potential amplitude is the product of the
    number of quanta released per nerve impulse and the depolarization each quantum
    produces; this node covers reduction of the first term. Quantal content falls
    when acetylcholine cannot be resynthesised or repackaged fast enough to keep up
    with activity (choline acetyltransferase deficiency, vesicular loading defects),
    when the presynaptic calcium signal that triggers release is reduced (loss of
    active-zone P/Q-type calcium channels), or when the release machinery itself is
    disabled (SNARE proteolysis by botulinum neurotoxin). Because the presynaptic
    terminal can be modulated on a moment-to-moment basis, this arm is the one that
    facilitates: brief maximal exercise or high-frequency stimulation transiently
    raises quantal content, which is why the Lambert-Eaton compound muscle action
    potential increments and the myasthenia gravis one does not.
  role: amplifier
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: acetylcholine secretion, neurotransmission
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
    modifier: DECREASED
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amplitude of the EPP is a function of the number of acetylcholine (ACh)
      molecules per synaptic vesicle, the number of synaptic vesicles released by
      nerve impulse, and the efficacy of the released quanta.
    explanation: >-
      Identifies quantal number and vesicular acetylcholine content as the
      presynaptic determinants of endplate potential amplitude, the quantity this
      node reduces.
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of decrement and increment upon repetitive nerve stimulation is
      also a highly sensitive diagnostic test
    explanation: >-
      The post-exercise increment is the electrophysiological signature of a
      presynaptic release deficit that can be transiently overcome, distinguishing
      this arm from the postsynaptic one.
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The characteristic flaccid paralysis results from blocking acetylcholine
      transmission across the neuromuscular junction by inhibition of acetylcholine
      release from the presynaptic motor neuron terminal
    explanation: >-
      Shows the toxin route to the same presynaptic node, with paralysis attributed
      specifically to blocked acetylcholine release.
  downstream:
  - target: Loss of the Safety Factor of Neuromuscular Transmission
    description: >-
      Fewer or less-filled quanta per impulse lower the endplate potential amplitude
      towards the muscle action potential threshold.
- name: Reduced Postsynaptic Endplate Response to Acetylcholine
  description: >-
    The postsynaptic arm, covering the second term of the endplate potential: the
    depolarization produced per released quantum. It falls when acetylcholine
    receptors are lost from the junctional folds (complement-mediated lysis and
    antigenic modulation in acetylcholine-receptor myasthenia gravis; low-expressor
    receptor-subunit variants in congenital myasthenic syndromes), when receptor
    channel kinetics are abnormally fast so the synaptic current decays before
    threshold is reached (fast-channel syndromes), when clustering and maintenance of
    the endplate fail so the postsynaptic region is simplified and small (RAPSN,
    DOK7, MUSK, and the glycosylation syndromes), or when the endplate Nav1.4
    channels that convert the endplate potential into an action potential are lost
    or inexcitable. In myasthenia gravis the last two act together: the same
    complement-mediated destruction of junctional folds removes both receptors and
    sodium channels, so the endplate potential shrinks while the threshold it must
    reach rises.
  role: amplifier
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: acetylcholine receptor signaling pathway
    term:
      id: GO:0095500
      label: acetylcholine receptor signaling pathway
    modifier: DECREASED
  - preferred_term: excitatory postsynaptic potential
    term:
      id: GO:0060079
      label: excitatory postsynaptic potential
    modifier: DECREASED
  evidence:
  - reference: PMID:18632162
    reference_title: "How myasthenia gravis alters the safety factor for neuromuscular transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In intercostal nerve-muscle preparations from MG patients, we found that
      endplate AChR loss decreases the size of the endplate potential, and endplate
      Na(+) channel loss increases the threshold depolarization needed to produce a
      muscle action potential.
    explanation: >-
      Direct human endplate recordings showing both postsynaptic contributions this
      node models: a smaller endplate potential and a raised action-potential
      threshold.
  - reference: PMID:18632162
    reference_title: "How myasthenia gravis alters the safety factor for neuromuscular transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postsynaptic AChRs and voltage-gated Na(+) channels are both lost from the
      neuromuscular junction in MG.
    explanation: >-
      Establishes that the two postsynaptic determinants are lost together, which is
      why the autoimmune conformers engage this node on both counts.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital myasthenic syndromes (CMS) are a heterogeneous group of disorders
      characterized by impaired neuromuscular signal transmission due to germline
      pathogenic variants in genes expressed at the neuromuscular junction (NMJ).
    explanation: >-
      Establishes the genetic route into the same postsynaptic node, where the
      receptor and clustering genes are the largest class.
  downstream:
  - target: Loss of the Safety Factor of Neuromuscular Transmission
    description: >-
      A smaller endplate potential, a faster-decaying synaptic current, or a raised
      action-potential threshold all narrow the margin between the endplate potential
      and the depolarization needed to fire the fibre.
- name: Loss of the Safety Factor of Neuromuscular Transmission
  description: >-
    The central integrating step and the key conformance target. In health the
    endplate potential overshoots the depolarization needed to open the postsynaptic
    Nav1.4 channels by a factor of roughly three to five in adult mammals, so
    transmission is reliable under physiological stress. The safety factor is that
    excess, and it is a single scalar into which every upstream lesion feeds: quantal
    content, vesicular acetylcholine content, endplate acetylcholinesterase activity,
    receptor density and kinetics, endplate geometry, and sodium-channel density all
    enter it. This is what makes the module a module — a genetic receptor-subunit
    variant, a complement-fixing autoantibody, an anti-calcium-channel antibody and a
    clostridial protease are mechanistically unrelated up to this point and
    indistinguishable after it. Conforming entries substitute their own route into
    this node and inherit everything downstream of it.
  role: central_effector
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:11275359
    reference_title: "Safety factor at the neuromuscular junction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is a result of the amount of transmitter released per nerve impulse being
      greater than that required to trigger an action potential in the muscle fibre.
      The safety factor is a measure of this excess of released transmitter.
    explanation: >-
      Defines the safety factor as the excess of released transmitter over the
      trigger threshold, which is the quantity this node models the loss of.
  - reference: PMID:11275359
    reference_title: "Safety factor at the neuromuscular junction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In normal adult mammals, the safety factor is generally 3-5.
    explanation: >-
      Gives the normal margin, which is what the disease lesions in this module
      erode.
  - reference: PMID:11275359
    reference_title: "Safety factor at the neuromuscular junction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thus, both acquired autoimmune and inherited congenital diseases of the
      neuromuscular junction (NMJ) can significantly reduce, or even transiently
      increase, safety factor.
    explanation: >-
      States the convergence claim on which the module rests: autoimmune and
      congenital endplate diseases act on the same scalar.
  - reference: PMID:22102453
    reference_title: "Endplate contributions to the safety factor for neuromuscular transmission."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The SF depends on the amount of transmitter released, AChR density, EAP, and
      the effectiveness of the EPP in stimulating the Na(+) channels that trigger the
      AP.
    explanation: >-
      Enumerates the pre- and postsynaptic determinants that feed this node,
      justifying the two parallel upstream arms.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The safety margin of neuromuscular transmission (NMT) is a function of the
      difference between the depolarization caused by the EP potential (EPP) and the
      depolarization required to activate the voltage gated Nav1.4 channels deployed
      on the postsynaptic membrane.
    explanation: >-
      Gives the quantitative definition of the margin in terms of endplate potential
      versus Nav1.4 activation threshold.
  downstream:
  - target: Intermittent Endplate Transmission Block
    description: >-
      Once the endplate potential no longer reliably exceeds threshold, individual
      nerve impulses begin to fail to produce a muscle action potential.
- name: Intermittent Endplate Transmission Block
  description: >-
    The functional consequence. Transmission does not fail all-or-none across the
    muscle; it fails stochastically at individual endplates, and the blocked fraction
    grows as activity continues, because normal short-term synaptic depression
    reduces quantal content over the first few impulses of a train and there is no
    longer any margin to absorb it. This is what the standard diagnostic tests
    measure: a decremental compound muscle action potential on low-frequency
    repetitive nerve stimulation, and increased jitter and frank blocking on
    single-fibre electromyography. The node is deliberately separate from the safety
    factor node above it because it is where the disorder-specific distribution
    enters — which muscles block first, and under what activity pattern, differs
    between the conformers and is not a property of the safety factor itself.
  role: effector
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: synaptic transmission, cholinergic
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
    modifier: DECREASED
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurement of compound muscle action potentials elicited by repetitive nerve
      stimulation is required to diagnose CMS.
    explanation: >-
      Identifies the repetitive-nerve-stimulation response as the measurement that
      detects this node, and as diagnostically required across the congenital arm.
  - reference: PMID:37239850
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the phenotypic presentation of these disorders is diverse, the unifying
      feature is a pathomechanism that disrupts neuromuscular transmission.
    explanation: >-
      States the convergence at the level of disrupted transmission while noting that
      the clinical presentation stays disorder-specific, which is the division of
      labour between this node and the conforming entries.
  downstream:
  - target: Fatigable Muscle Weakness
    description: >-
      Loss of a growing fraction of muscle fibres from the activated pool during
      sustained or repeated contraction produces weakness that worsens with use.
- name: Fatigable Muscle Weakness
  description: >-
    The convergent clinical endpoint: weakness that fluctuates and worsens with
    sustained or repeated activity, and recovers with rest, because the fraction of
    endplates in block rises and falls with the activity history. Distribution,
    tempo, and severity are disorder-specific and stay on the conforming entries —
    ocular and bulbar onset with fatigable ptosis and diplopia in myasthenia gravis,
    proximal lower-limb weakness with hyporeflexia and autonomic involvement in
    Lambert-Eaton myasthenic syndrome, descending flaccid paralysis after cranial
    nerve palsies in botulism, and neonatal hypotonia, feeding difficulty or episodic
    apnoea in the congenital myasthenic syndromes. When enough endplates block
    simultaneously in the diaphragm and accessory muscles the endpoint is
    neuromuscular respiratory failure, which is the shared cause of death across all
    three etiologic arms.
  role: consequence
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle contraction
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myasthenia gravis is an autoimmune disease that is characterised by muscle
      weakness and fatigue, is B-cell mediated, and is associated with antibodies
      directed against the acetylcholine receptor, muscle-specific kinase (MUSK),
      lipoprotein-related protein 4 (LRP4), or agrin in the postsynaptic membrane at
      the neuromuscular junction.
    explanation: >-
      Anchors the fatigable-weakness endpoint for the autoimmune postsynaptic arm.
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lambert-Eaton myasthenic syndrome (LEMS) is a rare autoimmune disease
      characterized by proximal muscle weakness, loss of tendon reflexes, and
      autonomic dysfunction
    explanation: >-
      Anchors the endpoint for the presynaptic autoimmune arm and records its
      distinct distribution, including the autonomic involvement that follows from
      the same lesion at non-neuromuscular cholinergic synapses.
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Botulism is a rare, neurotoxin-mediated, life-threatening disease characterized
      by flaccid descending paralysis that begins with cranial nerve palsies and
      might progress to extremity weakness and respiratory failure.
    explanation: >-
      Anchors the endpoint for the toxin arm, including the respiratory failure that
      is the shared terminal risk across the module.
treatments:
- name: Acetylcholinesterase Inhibitor Therapy
  description: >-
    The canonical symptomatic treatment for endplate transmission failure and the
    module's core drug-target pattern. Inhibiting endplate acetylcholinesterase
    prolongs the dwell time of released acetylcholine in the synaptic cleft so that
    each quantum activates more receptors, raising endplate potential amplitude and
    restoring the safety factor without touching the underlying lesion. It is
    therefore effective across etiologically unrelated conformers — acquired
    autoimmune and inherited congenital alike — which is itself evidence for the
    convergence this module asserts. The important exception, and the reason this is
    a target-mechanism annotation rather than a blanket recommendation, is that
    conformers whose lesion is a depolarization block or an endplate myopathy
    (slow-channel syndrome, endplate acetylcholinesterase deficiency, DOK7 and
    LAMB2 congenital myasthenic syndromes) are worsened by it; a conforming entry
    must record its own direction of effect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  target_mechanisms:
  - target: Loss of the Safety Factor of Neuromuscular Transmission
    treatment_effect: RESTORES
    description: >-
      Prolonging acetylcholine dwell time increases the number of receptors activated
      per quantum and hence the endplate potential amplitude, widening the margin
      over the muscle action-potential threshold.
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alone, and especially in combination, they increase the amplitude of the EP
      potential and thereby the safety margin of neuromuscular transmission.
    explanation: >-
      States the mechanism of action of this treatment class in exactly the terms of
      the target node: it raises endplate potential amplitude and thereby the safety
      margin.
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyridostigmine is the preferred symptomatic treatment, and for patients who do
      not adequately respond to symptomatic therapy, corticosteroids, azathioprine,
      and thymectomy are first-line immunosuppressive treatments.
    explanation: >-
      Establishes pyridostigmine as the standard symptomatic therapy in the
      autoimmune conformer, distinct from the immunosuppression aimed at the lesion.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cholinesterase inhibitors are effective in most groups of CMS, but are
      contraindicated in some groups of CMS.
    explanation: >-
      Graded PARTIAL because it supports the treatment pattern across the congenital
      arm while establishing the contraindicated subset, which is the caveat this
      treatment block records.
- name: Presynaptic Potassium Channel Blockade (3,4-Diaminopyridine)
  description: >-
    The presynaptic counterpart of the acetylcholinesterase-inhibitor pattern.
    Blocking presynaptic voltage-gated potassium channels prolongs the nerve terminal
    action potential, increasing calcium entry and therefore the number of quanta
    released per impulse. It acts on the presynaptic arm rather than the postsynaptic
    one, which is why it is the mainstay in Lambert-Eaton myasthenic syndrome and an
    adjunct in the presynaptic and receptor-deficiency congenital myasthenic
    syndromes, and why it can be combined with an acetylcholinesterase inhibitor to
    act on both terms of the endplate potential at once.

discussions:
- discussion_id: nmj_safety_factor_selective_vulnerability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the safety factor not uniform across muscles, and what determines which
    muscle groups lose it first in a given endplate disease?
  attaches_to:
  - pathophysiology#Intermittent Endplate Transmission Block
  rationale: >-
    The module treats the safety factor as one scalar, which is what licenses the
    convergence claim, but the muscles that block first differ systematically between
    conformers — ocular and bulbar in myasthenia gravis and botulism, proximal lower
    limb in Lambert-Eaton myasthenic syndrome — and Ruff (PMID:22102453) explicitly
    excepts extraocular, middle ear, and some facial and pharyngeal muscles from the
    reliable "slave synapse" description that holds elsewhere. Candidate
    contributors include baseline differences in endplate geometry, receptor subunit
    composition, fibre type, firing rate, and the extent of the junctional folds, but
    no single account predicts the observed distributions across all three etiologic
    arms. This is the module-level instance of the domain-wide selective-vulnerability
    gap recorded in issue #9005, and it is a genuine absence of evidence rather than
    a model-fidelity problem, so it is a KNOWLEDGE_GAP rather than a
    HUMAN_MODEL_MISMATCH.

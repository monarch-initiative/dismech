name: Bacterial DNA Topoisomerase Inhibition Module
description: >-
  A conserved antibacterial drug-mechanism module representing the bacterial type
  II topoisomerases — DNA gyrase (GyrA/GyrB) and topoisomerase IV (ParC/ParE) —
  that manage chromosomal supercoiling and decatenation during replication.
  Fluoroquinolones (ciprofloxacin, levofloxacin, moxifloxacin) are the major drug
  class acting here: they trap the enzyme-DNA cleavage complex, converting the
  topoisomerase into a DNA-damaging agent that generates double-strand breaks and
  is bactericidal. Because gyrase and topoisomerase IV are bacterial enzymes
  distinct from human topoisomerases, fluoroquinolones are selectively toxic.
  This module defines the mechanism-of-action design pattern for
  fluoroquinolone treatments: conforming entries link a treatment to the gyrase/
  topoisomerase target via target_mechanisms. It also encodes the
  quinolone-resistance-determining-region (QRDR) mutation and efflux resistance
  that gate fluoroquinolone use. The chain runs target -> chromosome
  fragmentation -> resistance: the trapped complex on its own only blocks
  replication, and a separate, concentration-dependent release of the broken
  ends is what makes the class bactericidal, so an entry modelling
  fluoroquinolone failure should say which of the two steps was not reached.
category: Module
module_categories:
- PHARMACOLOGY
- INFECTIOUS_DISEASE
creation_date: "2026-06-20T00:00:00Z"
notes: >-
  Antibacterial drug-mechanism module, not a specific disease. Disorder entries
  reference nodes via conforms_to (e.g.,
  "bacterial_dna_topoisomerase_inhibition#DNA Gyrase and Topoisomerase IV
  (Fluoroquinolone Target)"), and their fluoroquinolone treatments point at that
  node via target_mechanisms. Key conformance / treatment target: "DNA Gyrase and
  Topoisomerase IV (Fluoroquinolone Target)". Nodes are druggable steps, not
  individual drugs.
pathophysiology:
- name: DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)
  description: >-
    Bacterial DNA gyrase and topoisomerase IV break, pass, and reseal duplex DNA
    to manage supercoiling and decatenate replicated chromosomes. Fluoroquinolones
    bind the enzyme-DNA complex via a water-metal-ion bridge, block strand-passage
    catalysis, and stabilize the cleavage complex; release of the broken DNA
    underlies their bactericidal activity. Quinolones are the only current class
    that directly inhibits bacterial DNA synthesis, and their bacterial type II
    topoisomerase targets are distinct from human topoisomerases, giving
    selectivity.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: DNA Topological Change
    term:
      id: GO:0006265
      label: DNA topological change
  evidence:
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Quinolones dually target DNA gyrase and topoisomerase IV binding to
      specific domains and conformations so as to block DNA strand passage
      catalysis and stabilize DNA-enzyme complexes that block the DNA replication
      apparatus and generate double breaks in DNA that underlie their bactericidal
      activity.
    explanation: >-
      Review establishing DNA gyrase and topoisomerase IV as the dual
      fluoroquinolone target and the cleavage-complex mechanism this node
      represents. Evidence source is OTHER as this is a review article.
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Quinolone antimicrobials are widely used in clinical medicine and are the
      only current class of agents that directly inhibit bacterial DNA synthesis.
    explanation: >-
      Establishes fluoroquinolones as the agents that directly inhibit bacterial
      DNA synthesis at this target. Evidence source is OTHER as this is a review.
  downstream:
  - target: Chromosome Fragmentation and Quinolone-Mediated Killing
    description: >-
      Trapping the enzyme on DNA converts the topoisomerase into a source of
      protein-constrained double-strand breaks; releasing those ends is the step
      that makes the drug bactericidal rather than merely growth-arresting.
  - target: Fluoroquinolone Target Resistance
    description: >-
      QRDR mutations and efflux protect the topoisomerase target, escaping
      fluoroquinolone action.

- name: Chromosome Fragmentation and Quinolone-Mediated Killing
  description: >-
    The trapped enzyme-DNA cleavage complex is initially reversible, and at low
    drug concentrations its only consequence is a block on replication and
    growth, which is bacteriostatic. Killing requires a further step: release of
    the broken DNA ends from topoisomerase-mediated constraint, giving
    irreversible chromosome fragmentation. Two routes lead there, one requiring
    ongoing protein synthesis and one not, which is why nalidixic acid and the
    fluoroquinolones differ in their lethality against the same target. The
    resulting DNA ends also induce the SOS response and drive energetically
    expensive repair; a downstream metabolic shift and reactive-oxygen
    accumulation amplify the damage after the drug is removed. This node is the
    reason a fluoroquinolone is dosed to a concentration above the one that
    merely stops growth.
  role: consequence
  biological_processes:
  - preferred_term: Chromosome fragmentation and bacterial death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  - preferred_term: SOS DNA damage response
    term:
      id: GO:0009432
      label: SOS response
    modifier: INCREASED
  evidence:
  - reference: PMID:16803589
    reference_title: "Lethal fragmentation of bacterial chromosomes mediated by DNA gyrase and quinolones."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Both lethal processes correlated with irreversible chromosome
      fragmentation, detected by sedimentation and viscosity of DNA from
      quinolone-treated cells.
    explanation: >-
      Measures the step this node asserts: quinolone killing tracks irreversible
      chromosome fragmentation rather than the reversible trapped complex alone.
      Graded IN_VITRO as the work is in bacterial culture and on purified
      nucleoids.
  - reference: PMID:16803589
    reference_title: "Lethal fragmentation of bacterial chromosomes mediated by DNA gyrase and quinolones."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      When DNA gyrase is trapped on bacterial chromosomes by quinolone
      antibacterials, reversible complexes form that contain DNA ends constrained
      by protein.
    explanation: >-
      States why the upstream node is not yet lethal: the ends exist but are held
      by protein, so this node's release step is the one that kills.
  - reference: PMID:33081547
    reference_title: "Bacterial death from treatment with fluoroquinolones and other lethal stressors."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Quinolones trap topoisomerases on DNA in reversible complexes that block
      DNA replication and bacterial growth.
    explanation: >-
      Supports the bacteriostatic arm of this node, which is what the trapped
      complex achieves on its own. Graded OTHER as this is a review.
  - reference: PMID:33081547
    reference_title: "Bacterial death from treatment with fluoroquinolones and other lethal stressors."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At elevated drug concentrations, DNA ends are released from
      topoisomerase-mediated constraint, leading to the idea that death arises
      from chromosome fragmentation.
    explanation: >-
      States the concentration dependence that separates the bacteriostatic and
      bactericidal arms of this node. Graded OTHER as this is a review.
  downstream:
  - target: Fluoroquinolone Target Resistance
    description: >-
      A protected target never reaches the cleavage-complex step, so neither the
      growth block nor the fragmentation is achieved.

- name: Fluoroquinolone Target Resistance
  description: >-
    Resistance to fluoroquinolones arises predominantly from mutations in the
    quinolone-resistance-determining region (QRDR) of the GyrA and ParC subunits
    that lower drug-target affinity, from increased efflux-pump expression, and
    from acquired plasmid-mediated quinolone-resistance genes. High-level
    resistance is common in some pathogens (e.g. typhoidal Salmonella), which is
    why fluoroquinolones must be susceptibility-guided rather than assumed
    effective.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mechanisms of resistance include mutational alterations in drug target
      affinity and efflux pump expression and acquisition of resistance-conferring
      genes.
    explanation: >-
      Enumerates the fluoroquinolone resistance mechanisms encoded here (target
      mutation, efflux, acquired genes). Evidence source is OTHER as this is a
      review article.

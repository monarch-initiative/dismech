- name: Cytoprotective Antioxidant Response
  description: >-
    The conserved downstream consequence: detoxification of reactive species and
    restoration of redox homeostasis that protects the cell from oxidative and
    electrophilic injury. Direction is carried by the modifier a conformer sets,
    not by the node name — a blunted-NRF2 conformer binds this DECREASED (the
    cell is left vulnerable), a constitutively active conformer binds it
    INCREASED (which in tumor cells can confer a survival and chemoresistance
    advantage). The module's scope stops here; autophagy, proliferation and
    apoptosis are out of scope.

name: KEAP1-NRF2-ARE Signaling Module
description: >-
  A conserved mechanism module for the KEAP1-NRF2-ARE cytoprotective antioxidant
  response and its dysregulation. Under basal conditions the sensor protein
  KEAP1 serves as the substrate adaptor of a CUL3 RING ubiquitin ligase that
  constitutively ubiquitinates the transcription factor NRF2 (NFE2L2) and
  targets it for proteasomal degradation, keeping nuclear NRF2 low.
  Electrophiles and oxidants covalently modify reactive cysteines on KEAP1 (or,
  non-canonically, p62/SQSTM1 sequesters KEAP1), which impairs NRF2
  ubiquitination; NRF2 then accumulates, enters the nucleus, heterodimerizes
  with a small MAF protein, and transactivates a battery of antioxidant response
  element (ARE) genes — among them SRXN1, NQO1, HMOX1, and the
  glutamate-cysteine ligase subunits GCLC/GCLM — whose products restore redox
  balance and confer cytoprotection. The rate-limiting, conserved step every
  conformer funnels through is NRF2-driven ARE transcription (the key
  conformance target). One module spans both directions of dysregulation:
  diseases where the response is blunted (loss of NRF2 signaling) and diseases
  where it is constitutively ON (KEAP1/NFE2L2 loss-of-KEAP1-function, or
  fumarate succination of KEAP1), distinguished by the modifier a conformer sets
  on the central node rather than by a separate module. Complementary to
  oncometabolite_dioxygenase_inhibition (which covers only the
  fumarate-succination route to NRF2 activation, as one chemically specific
  branch) and to cul3_substrate_adaptor_dysfunction (which covers CRL3 adaptor
  swapping in general, of which KEAP1 is one adaptor); this module is the
  antioxidant-response pathway itself, in both directions, independent of what
  perturbs it. Key conformance target:
  "keap1_nrf2_are_signaling#NRF2 Transcriptional Activation of ARE Genes".
category: Module
module_categories:
- TOXICOLOGY
- PHARMACOLOGY
creation_date: "2026-11-07T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease — do NOT create a
  KEAP1-NRF2-ARE Disease entry. Disorder entries reference individual nodes via
  conforms_to, setting the modifier on the central node by direction: a
  blunted-response conformer binds it DECREASED, a constitutively-active one
  INCREASED. Candidate conformers (direction in parentheses): hypoactive —
  Cockayne_Syndrome, PARK7-Related_Early-Onset_Parkinson_Disease,
  Pachyonychia_Congenita, RCBTB1-Related_Retinopathy,
  SQSTM1-Related_Childhood-Onset_Neurodegeneration,
  SQSTM1-related_Multisystem_Proteinopathy,
  Multiple_Mitochondrial_Dysfunctions_Syndrome_9B; constitutively active —
  Hepatoblastoma, Hereditary_Leiomyomatosis_and_Renal_Cell_Cancer (which also
  conforms to oncometabolite_dioxygenase_inhibition for the fumarate route), and
  the KEAP1/NFE2L2-driver cancers (Non-Small_Cell_Lung_Cancer,
  KRAS_G12C_Mutant_NSCLC, Esophageal_Carcinoma,
  Large_Cell_Neuroendocrine_Carcinoma). The non-canonical p62/SQSTM1
  KEAP1-sequestration route is the entry point for the two SQSTM1 conformers and
  is modeled at the trigger node rather than as a separate node. Autophagy,
  proliferation and apoptosis are named in the seed abstract (PMID:40972999) as
  context-specific ARE-regulated processes; they are deliberately out of this
  module's scope, which stops at the redox-homeostasis consequence. SRXN1 is
  hgnc:16132 (confirmed by lookup, 2026-11-07). Seeded from issue #16807;
  cross-checked against deep-research runs.
pathophysiology:
- name: KEAP1 Sensor Cysteine Modification
  description: >-
    The initiating step. Reactive cysteine thiols on the cytoplasmic sensor
    KEAP1 are covalently modified by an electrophile or oxidant — the seed
    paper's soft electrophiles sulforaphane, andrographolide, ethacrynic acid
    and CDDO-methyl are archetypes — or KEAP1's repressor function is lost by
    mutation, or (in the fumarate-driven case) fumarate succinates KEAP1
    cysteines. A non-canonical route substitutes p62/SQSTM1 sequestration of
    KEAP1 for direct cysteine modification. KEAP1 is upstream of NRF2; this node
    is the sensor, not a target.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KEAP1
    term:
      id: hgnc:23177
      label: KEAP1
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:27497696
    reference_title: "Keap1, the cysteine-based mammalian intracellular sensor for electrophiles and oxidants."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Keap1 is equipped with reactive cysteine residues that act as sensors for
      endogenously produced and exogenously encountered small molecules (termed
      inducers), which have a characteristic chemical signature, reactivity with
      sulfhydryl groups.
    explanation: >-
      Establishes KEAP1 as the cysteine-based sensor that detects electrophiles
      and oxidants — the trigger this node represents.
  downstream:
  - target: NRF2 Escape from KEAP1-CUL3 Degradation
    description: >-
      Modification of KEAP1's sensor cysteines, or loss of its function, stops it
      presenting NRF2 to the CUL3 ligase.
- name: NRF2 Escape from KEAP1-CUL3 Degradation
  description: >-
    With KEAP1 disabled, the CUL3 RING ubiquitin ligase for which KEAP1 is the
    substrate adaptor no longer ubiquitinates NRF2, so NRF2 escapes proteasomal
    degradation, accumulates, and translocates to the nucleus. In
    loss-of-NRF2-signaling diseases this step is impaired upstream (NRF2 never
    accumulates); in KEAP1/NFE2L2-mutant and fumarate-driven diseases it is
    constitutive (NRF2 accumulates regardless of stress).
  role: amplifier
  biological_scale: MOLECULAR

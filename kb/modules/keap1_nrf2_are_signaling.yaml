computational_models:
- name: Semi-mechanistic NRF2-SRXN1 dynamic model
  description: >-
    A semi-mechanistic mathematical model, fitted with a nonlinear mixed-effect
    approach with partially hierarchical parameters, of NRF2 and SRXN1 protein
    expression over time in HepG2 cells exposed, singly or repeatedly, to the
    NRF2-activating soft electrophiles sulforaphane, andrographolide, ethacrynic
    acid and CDDO-methyl across a wide concentration range. It reproduces the
    observed dynamics and concludes that NRF2 abundance alone does not set its
    transcription-factor activity — a cofactor or post-translational
    modification is required, in a time-, compound- and exposure-specific way.
  model_type: KINETIC
  publication: PMID:40972999
  modeled_mechanisms:
  - target: NRF2 Transcriptional Activation of ARE Genes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The model fits the NRF2-to-SRXN1 induction dynamics and requires an
      inferred cofactor/modification term to do so, directly informing this
      node's claim that NRF2 activity is gated beyond its abundance.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The required cofactor or post-translational modification enters the model
        only as an inferred lumped parameter, not as an explicit molecular
        species; the model demonstrates that something is needed without
        identifying or representing it mechanistically.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is fitted entirely to one immortalized human hepatoblastoma
        cell line (HepG2) under defined electrophile exposures, so its parameters
        are not established for other cell types or for the diverse perturbations
        the module's conformers represent.
    readouts:
    - name: SRXN1 protein expression time course
      target: NRF2 Transcriptional Activation of ARE Genes
      direction: INCREASED
      interpretation: >-
        SRXN1 protein is the measured output the model uses to infer NRF2
        transcription-factor activity over time.
      evidence:
      - reference: PMID:40972999
        reference_title: Deciphering the quantitative relationship between NRF2 and SRXN1 through semi-mechanistic computational modeling.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          time course experimental data of NRF2 and SRXN1 protein expression in
          HepG2 cells following single or repeated exposure to NRF2 activating
          soft electrophiles
        explanation: >-
          Identifies NRF2 and SRXN1 protein expression time courses as the
          measured readout behind the model.
    limitations: >-
      The model is calibrated to a single hepatoblastoma cell line and lumps the
      required cofactor/modification into an inferred term, so it establishes
      that NRF2 activity is gated beyond abundance without identifying the gating
      factor or showing the result generalizes.
    evidence:
    - reference: PMID:40972999
      reference_title: Deciphering the quantitative relationship between NRF2 and SRXN1 through semi-mechanistic computational modeling.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: >-
        Our analysis highlights that NRF2 requires a cofactor or post-translational
        modification to regulate its activity as a transcription factor
      explanation: >-
        The model's central inference is exactly the claim of the node it links
        to, which is why it is cited as informative for that node.
  evidence:
  - reference: PMID:40972999
    reference_title: Deciphering the quantitative relationship between NRF2 and SRXN1 through semi-mechanistic computational modeling.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We developed a semi-mechanistic mathematical model based on time course
      experimental data of NRF2 and SRXN1 protein expression in HepG2 cells
    explanation: Describes the model.

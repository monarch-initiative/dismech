- name: NRF2 Transcriptional Activation of ARE Genes
  description: >-
    The rate-limiting, conserved step and key conformance target. Nuclear NRF2
    heterodimerizes with a small MAF protein and transactivates antioxidant
    response element (ARE) genes. The seed paper's central finding is that NRF2
    protein level alone does not account for target-gene induction — a cofactor
    or post-translational modification is required, and the quantitative
    relationship is time-, compound- and exposure-scenario specific. Conformers
    set this node's modifier by direction: DECREASED where the response is
    blunted, INCREASED where NRF2 is constitutively active.

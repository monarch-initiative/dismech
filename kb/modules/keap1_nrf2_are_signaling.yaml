- name: ARE Target Gene Products Restore Redox Balance
  description: >-
    The ARE regulon — SRXN1 (the seed paper's readout gene), NQO1, HMOX1, and the
    glutamate-cysteine ligase subunits GCLC/GCLM, among others — detoxifies
    reactive species and reduces oxidized protein thiols. SRXN1 specifically
    re-reduces hyperoxidized peroxiredoxins. The quantity and timing of these
    products is what the upstream node ultimately controls.

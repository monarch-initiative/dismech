name: Phototransduction Cascade Dysfunction Module
description: >-
  A conserved pathophysiology module representing the photoreceptor-intrinsic
  failure of the phototransduction cascade - the cGMP-based signalling pathway
  that converts absorbed photons into a graded change in outer-segment membrane
  potential. Mutations in cascade components acting at either end of the cycle
  converge on one rate-limiting defect: the photoreceptor can no longer generate
  a normal light response, or can no longer terminate one on the normal
  timescale. The activation arm (visual pigment, transducin subunits, PDE6
  catalytic and inhibitory subunits, CNG channel subunits, guanylate cyclase and
  its GCAP regulators) fails to open or close the cGMP-gated conductance
  appropriately; the shutoff arm (rhodopsin kinase GRK1, arrestin-1 SAG, the
  RGS9-1/R9AP GTPase-accelerating complex) fails to quench an activated cascade,
  leaving the cell light-adapted long after the stimulus ends. Either way, the
  outer segment loses control of its cGMP and Ca2+ set point, the photoreceptor
  contribution to the electroretinogram collapses, and the clinical picture is
  congenital, characteristically non-progressive visual dysfunction - night
  blindness when rods carry the lesion, photophobia, nystagmus, reduced acuity
  and colour vision loss when cones do. When the lesion parks cGMP and Ca2+ at
  chronically toxic levels rather than merely silencing the response, the same
  cascade defect hands off to progressive photoreceptor death, which is modelled
  by the photoreceptor_degeneration module rather than re-derived here.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response
  Generation or Timely Recovery"). Gene-class substitutions a conforming trigger
  node makes: cone-cascade loss of function (CNGA3, CNGB3, GNAT2, PDE6C, PDE6H)
  in achromatopsia; cone opsin loss (OPN1LW/OPN1MW locus) in blue cone
  monochromacy; rod-cascade loss or gain of function (RHO, GNAT1, PDE6B, GNB3,
  GUCY2D/GUCA1A) in the Riggs form of congenital stationary night blindness;
  and shutoff-arm loss of function (GRK1, SAG in Oguchi disease; RGS9, RGS9BP in
  bradyopsia).

  SCOPE - what this module deliberately does NOT cover. The Schubert-Bornschein
  forms of congenital stationary night blindness (NYX, GRM6, TRPM1, GPR179,
  LRIT3, CACNA1F) are a defect of glutamatergic signal TRANSMISSION from an
  intact photoreceptor to the ON-bipolar cell, not of the phototransduction
  cascade inside the photoreceptor. Their ERG signature is the reciprocal one -
  a preserved a-wave with a selectively reduced b-wave - and they are a distinct
  mechanism that must not be wired to these nodes. A CSNB entry covering both
  forms should conform only for its Riggs arm. Likewise, this module models the
  SIGNALLING defect; regeneration of the 11-cis-retinal chromophore that the
  cascade consumes is the retinoid_visual_cycle_disruption module, and
  photoreceptor cell death downstream of chronic cGMP/Ca2+ toxicity is
  photoreceptor_degeneration. A disorder may conform to more than one of the
  three in parallel, and several do.
pathophysiology:
- name: Phototransduction Cascade Component Defect
  description: >-
    The initiating lesion is a variant in a gene encoding a component of the
    photoreceptor phototransduction cascade. The affected protein may sit on the
    activation limb - the visual pigment itself, the transducin alpha/beta
    subunits, the PDE6 catalytic or inhibitory gamma subunit, either subunit of
    the cyclic-nucleotide-gated channel, or retinal guanylate cyclase and its
    calcium-sensing GCAP regulators - or on the shutoff limb, which quenches the
    activated cascade. The lesion is expressed cell-autonomously in rods, in
    cones, or in both, and this determines which half of the clinical picture
    dominates.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: Phototransduction
    term:
      id: GO:0007602
      label: phototransduction
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  evidence:
  - reference: PMID:37372476
    reference_title: "Molecular and Clinical Characterization of CNGA3 and CNGB3 Genes in Brazilian Patients Affected with Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in six genes encoding proteins composing the cone
      phototransduction cascade (CNGA3, CNGB3, PDE6C, PDE6H, GNAT2) and of the
      unfolded protein response (ATF6) have been related to ACHM cases
    explanation: >-
      Establishes the cone arm of the trigger: achromatopsia is caused by
      variants in genes whose products compose the cone phototransduction
      cascade, i.e. the cascade itself is the shared lesion rather than any one
      protein.
  - reference: PMID:27063057
    reference_title: "Biallelic Mutations in GNB3 Cause a Unique Form of Autosomal-Recessive Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Riggs CSNB demonstrates selective rod photoreceptor dysfunction and occurs
      due to mutations in genes encoding proteins involved in rod
      phototransduction cascade
    explanation: >-
      Establishes the rod arm of the same trigger, and names the clinical
      subtype (Riggs) that isolates a photoreceptor-intrinsic cascade lesion
      from the bipolar-transmission forms excluded from this module.
  downstream:
  - target: Loss of Outer-Segment cGMP and Calcium Set-Point Control
    causal_link_type: DIRECT

- name: Loss of Outer-Segment cGMP and Calcium Set-Point Control
  description: >-
    Phototransduction works by holding cGMP - and through the cGMP-gated
    conductance, Ca2+ - at a set point that light transiently lowers. The
    concentration is the running balance of synthesis by guanylate cyclase
    against hydrolysis by PDE6, with Ca2+ feeding back on the cyclase through
    GCAPs. A cascade lesion breaks that balance in a direction set by the gene:
    a null CNG channel or PDE6 activator leaves the conductance shut and Ca2+
    chronically low; loss of PDE6 activity, or constitutive cyclase activation,
    leaves cGMP and Ca2+ chronically high; a shutoff-arm lesion leaves the
    hydrolytic arm running after the light is gone. This is the amplification
    step that converts a molecular defect into a cell-wide loss of signalling
    competence.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: cGMP metabolic process in the outer segment
    term:
      id: GO:0046068
      label: cGMP metabolic process
    modifier: ABNORMAL
  - preferred_term: Calcium ion transmembrane transport through the cGMP-gated channel
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  evidence:
  - reference: PMID:33860373
    reference_title: "Photoreceptor phosphodiesterase (PDE6): activation and inactivation mechanisms during visual transduction in rods and cones."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      cGMP metabolism in the signal-transducing photoreceptor outer segment
      reflects the balance of cGMP synthesis (catalyzed by guanylyl cyclase) and
      degradation (catalyzed by the photoreceptor phosphodiesterase, PDE6).
    explanation: >-
      States the synthesis-versus-hydrolysis balance that this node asserts is
      lost when a cascade component fails. Evidence source is OTHER because this
      is a structural and enzymological review.
  - reference: PMID:39215566
    reference_title: "Promotion of endoplasmic reticulum retrotranslocation by overexpression of E3 ubiquitin-protein ligase synoviolin 1 reduces endoplasmic reticulum stress and preserves cone photoreceptors in cyclic nucleotide-gated channel deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cone photoreceptor cyclic nucleotide-gated (CNG) channels play an
      essential role in phototransduction and cellular Ca2+ homeostasis.
    explanation: >-
      Links the cascade component to the calcium arm of the set point
      specifically, supporting the coupling this node asserts between the
      cGMP-gated conductance and outer-segment Ca2+.
  downstream:
  - target: Failure of Photoreceptor Light-Response Generation or Timely Recovery
    causal_link_type: DIRECT

- name: Failure of Photoreceptor Light-Response Generation or Timely Recovery
  description: >-
    The rate-limiting, disorder-agnostic node. Normal vision requires that a
    photon-triggered fall in cGMP close the outer-segment conductance and
    hyperpolarize the cell, and that the cascade then be quenched so the cell
    recovers its dark current and can respond again. A cascade lesion abolishes
    one or the other. Activation-arm defects mean the light response is never
    generated - the cell is electrically silent to light. Shutoff-arm defects
    mean the response is generated but not terminated, so the photoreceptor
    stays desensitized and dark adaptation takes hours rather than minutes; the
    dark-adapted state is eventually reached, which is why these patients are
    night-blind rather than blind. Every conforming disorder funnels through
    this node, and it is the module's key conformance target.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Maintenance of photoreceptor membrane potential by opsin-mediated signalling
    term:
      id: GO:0016058
      label: maintenance of membrane potential in photoreceptor cell by rhodopsin mediated signaling
    modifier: ABNORMAL
  - preferred_term: Detection of light stimulus involved in visual perception
    term:
      id: GO:0050908
      label: detection of light stimulus involved in visual perception
    modifier: DECREASED
  - preferred_term: Regulation of opsin-mediated signalling pathway (cascade shutoff)
    term:
      id: GO:0022400
      label: regulation of opsin-mediated signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33860373
    reference_title: "Photoreceptor phosphodiesterase (PDE6): activation and inactivation mechanisms during visual transduction in rods and cones."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Upon light stimulation, rapid activation of PDE6 by the heterotrimeric
      G-protein (transducin) triggers a dramatic drop in cGMP levels that lead
      to cell hyperpolarization.
    explanation: >-
      States the normal light-response generation step whose failure defines the
      activation arm of this node. Evidence source is OTHER because this is a
      review.
  - reference: PMID:39906762
    reference_title: "Grk1 Missense Mutations in Type II Oguchi Disease: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Oguchi disease is a rare form of congenital stationary night blindness
      resulting from arrestin-1 (SAG) or rhodopsin kinase (GRK1) loss-of-function
      mutations.
    explanation: >-
      Establishes the shutoff arm of this node as a distinct route to the same
      rate-limiting failure: the two Oguchi genes are the kinase and the
      arrestin that quench an activated cascade. Evidence source is OTHER
      because this is a literature review.
  - reference: PMID:39906762
    reference_title: "Grk1 Missense Mutations in Type II Oguchi Disease: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unlike other congenital nyctalopias, patients with Oguchi disease can reach
      the dark-adapted state, albeit only after several hours of sustained
      darkness exposure.
    explanation: >-
      Substantiates the specific claim this node makes about the shutoff arm -
      recovery is delayed rather than abolished - which is what separates a
      quench defect from an activation defect clinically.
  downstream:
  - target: Collapse of the Photoreceptor-Derived Electroretinogram Response
    causal_link_type: DIRECT

- name: Collapse of the Photoreceptor-Derived Electroretinogram Response
  description: >-
    Because the a-wave of the full-field electroretinogram is the summed
    photoreceptor light response, a cascade lesion is directly readable as loss
    of the a-wave generated by the affected cell class, with the b-wave reduced
    secondarily because the bipolar cells downstream have nothing to be driven
    by. In the rod-cascade (Riggs) case the scotopic a-wave is lost and the
    b-wave is small; in the cone-cascade case the photopic and flicker responses
    are extinguished while scotopic responses are preserved. This is the
    module's objective effector-level readout and is what distinguishes a
    photoreceptor-intrinsic cascade defect from the reciprocal
    photoreceptor-to-bipolar transmission defect, where the a-wave is preserved
    and the b-wave is selectively lost.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: Dark adaptation
    term:
      id: GO:1990603
      label: dark adaptation
    modifier: ABNORMAL
  - preferred_term: Detection of light stimulus
    term:
      id: GO:0009583
      label: detection of light stimulus
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:29850563
    reference_title: "A Novel Heterozygous Missense Mutation in GNAT1 Leads to Autosomal Dominant Riggs Type of Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant congenital stationary night blindness (adCSNB) is rare
      and results from altered phototransduction giving a Riggs type of
      electroretinogram (ERG) with loss of the rod a-wave and small b-waves.
    explanation: >-
      Directly ties altered phototransduction to the a-wave-dominant ERG
      signature this node asserts, including the secondary reduction of the
      b-wave.
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While the Riggs form represents a dysfunction of the rods, a signal
      transmission defect from photoreceptors to bipolar cell is described in
      patients with the more frequently occurring Schubert-Bornschein form.
    explanation: >-
      Supports the discriminating claim in this node's description, and is the
      citation behind the module's scope note excluding the
      photoreceptor-to-bipolar transmission forms. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Congenital Non-Progressive Photoreceptor Dysfunction
    causal_link_type: DIRECT
  - target: cGMP and Calcium Overload Handoff to Photoreceptor Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Congenital Non-Progressive Photoreceptor Dysfunction
  description: >-
    The characteristic clinical outcome: visual dysfunction that is present from
    birth or early infancy and, in the pure signalling forms, remains essentially
    stationary over decades. Which symptoms dominate is set by which
    photoreceptor class carries the lesion. A rod-cascade defect gives night
    blindness with normal daytime acuity and a normal fundus. A cone-cascade
    defect gives poor visual acuity, nystagmus, photophobia and loss of colour
    discrimination in all axes, with preserved scotopic vision. Stationarity is
    the point of contrast with the degenerative retinopathies: the cell is
    silenced, not lost.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:39273686
    reference_title: "Gene Therapy for Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The condition presents at birth or early infancy with poor visual acuity,
      nystagmus, photophobia, and colour vision loss in all axes.
    explanation: >-
      Supports the cone-cascade half of this consequence node, including its
      congenital onset. Evidence source is OTHER because this is a review.
  - reference: PMID:27063057
    reference_title: "Biallelic Mutations in GNB3 Cause a Unique Form of Autosomal-Recessive Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      night blindness is the only symptom and eye examination is otherwise
      normal
    explanation: >-
      Supports the rod-cascade half: an isolated rod cascade lesion presents as
      night blindness alone with an unremarkable fundus, which is the
      stationarity claim this node makes.

- name: cGMP and Calcium Overload Handoff to Photoreceptor Degeneration
  description: >-
    A conditional branch, not an obligatory step. When the cascade lesion leaves
    cGMP and Ca2+ chronically elevated rather than merely abolishing the light
    response - loss of PDE6 hydrolytic activity being the archetype - the same
    second messengers that carry the signal become cytotoxic, and the disorder is
    a progressive retinal degeneration rather than a stationary dysfunction.
    Cone CNG channel deficiency reaches the same endpoint by a different route,
    through calcium dysregulation, ER stress and apoptosis. This node exists to
    mark the seam: the cell-death programme itself is modelled by the
    photoreceptor_degeneration module and is not re-derived here, and a disorder
    that crosses this branch should declare conformance to both modules.
  role: consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: cGMP biosynthetic process
    term:
      id: GO:0006182
      label: cGMP biosynthetic process
    modifier: INCREASED
  - preferred_term: Photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:20950332
    reference_title: "shRNA knockdown of guanylate cyclase 2e or cyclic nucleotide gated channel alpha 1 increases photoreceptor survival in a cGMP phosphodiesterase mouse model of retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      photoreceptor death is preceded by abnormally high cGMP and Ca(2+) levels,
      likely because of continued synthesis of cGMP by guanylate cyclases and
      unregulated influx of Ca(2+) to toxic levels through CNG channels
    explanation: >-
      Establishes the conditional branch: in a PDE6-deficient model it is the
      chronically elevated cGMP and Ca2+ - the same messengers the cascade uses -
      that precede photoreceptor death, which is why only some cascade lesions
      degenerate.
  - reference: PMID:39215566
    reference_title: "Promotion of endoplasmic reticulum retrotranslocation by overexpression of E3 ubiquitin-protein ligase synoviolin 1 reduces endoplasmic reticulum stress and preserves cone photoreceptors in cyclic nucleotide-gated channel deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cone death in CNG channel-deficient retinas involves endoplasmic reticulum
      (ER) stress-associated apoptosis, dysregulation of cellular/ER Ca2+
      homeostasis, impaired protein folding/processing, and impaired
      ER-associated degradation (ERAD).
    explanation: >-
      Documents the second route across this branch - calcium dysregulation and
      ER stress in cone CNG channel deficiency - showing the handoff is not
      confined to the PDE6/cGMP archetype.

treatments:
- name: AAV-Mediated Phototransduction Gene Supplementation
  description: >-
    Subretinal delivery of a functional copy of the mutated cascade gene by
    adeno-associated virus, aimed at restoring the missing component so the
    photoreceptor can generate or terminate a light response again. This is the
    module's canonical drug-target pattern and it targets the rate-limiting node
    directly. It is furthest advanced for the cone CNG channel subunits in
    achromatopsia, where several phase I/II trials are registered; it is a
    mechanism pattern here, not a treatment recommendation, and conforming
    disorders do not inherit it.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Failure of Photoreceptor Light-Response Generation or Timely Recovery
    treatment_effect: RESTORES
    description: >-
      Supplying the wild-type cascade subunit is intended to restore the
      photoreceptor's ability to generate a normal light response, acting on the
      module's rate-limiting node rather than on any downstream consequence.
    evidence:
    - reference: PMID:39273686
      reference_title: "Gene Therapy for Achromatopsia."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        There are currently five gene therapy clinical trials registered for
        human patients at the phase I/II stage and for CNGA3 or CNGB3 causing
        achromatopsia.
      explanation: >-
        Documents that gene supplementation for the cascade component is in
        human trials for this mechanism. Marked PARTIAL because the same review
        states there is no approved therapy, so this establishes the target
        pattern rather than demonstrated clinical benefit.
  evidence:
  - reference: PMID:39273686
    reference_title: "Gene Therapy for Achromatopsia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      There is no FDA-approved treatment for achromatopsia; however, studies have
      reported several preclinical gene therapies with anatomical and functional
      improvements reported in vivo.
    explanation: >-
      States the current status honestly: preclinical anatomical and functional
      rescue, no approved therapy. Evidence source is OTHER because this is a
      review summarizing preclinical and trial evidence.

discussions:
- discussion_id: cascade_lesion_stationary_versus_degenerative
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which cascade lesions cross the branch from stationary dysfunction to
    progressive photoreceptor degeneration, and can that be predicted from the
    direction in which the lesion moves the outer-segment cGMP set point?
  attaches_to:
  - "pathophysiology#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  rationale: >-
    The same gene can produce either outcome. GNAT1 variants have been reported
    in both autosomal dominant and autosomal recessive congenital stationary
    night blindness and in autosomal recessive rod-cone dystrophy, and CNGA3 and
    CNGB3 variants cause both stationary achromatopsia and progressive cone
    dystrophy. If the stationary-versus-degenerative split tracked cleanly with
    whether the lesion raises or lowers cGMP, prognosis would be predictable from
    genotype; the reported allelic overlap suggests it does not, and the
    determinants are unresolved. This matters directly for conformance, because
    it decides whether an entry should wire to this module alone or also to
    photoreceptor_degeneration.
  proposed_experiments:
  - experiment_id: cascade_setpoint_progression_cohort
    name: Genotype-stratified longitudinal outer-retinal imaging in cascade-gene cohorts
    description: >-
      Follow patients grouped by whether their cascade variant is predicted to
      raise or lower steady-state cGMP, with serial optical coherence tomography
      of the ellipsoid zone and serial electroretinography, to test whether
      set-point direction predicts progression rather than stationarity.

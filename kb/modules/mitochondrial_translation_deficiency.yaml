name: Mitochondrial Translation Deficiency Module
description: >-
  A conserved mechanism module for combined oxidative phosphorylation
  deficiency caused by failure of the mitochondrial protein-synthesis
  apparatus. The thirteen OXPHOS subunits encoded by mtDNA are made on a
  dedicated mitochondrial ribosome, so a lesion anywhere in that machinery -
  a mitoribosomal protein (MRPS22, MRPL44), a translation factor (GFM1, TSFM,
  TUFM), a mitochondrial tRNA or rRNA (MT-TL1, MT-TK, MT-TE, MT-RNR1), a tRNA
  modifying enzyme (MTO1, GTPBP3, TRMU, PUS1), an aminoacyl-tRNA synthetase
  (RARS2, DARS2, FARS2, YARS2, IARS2), or a drug that binds the mitoribosome
  (chloramphenicol, aminoglycosides) - converges on one rate-limiting step:
  the mtDNA-encoded subunits are not synthesized. Complexes I, III, IV and V
  all lose subunits at once, oxidative ATP synthesis fails, the cell shifts to
  anaerobic glycolysis with lactic acidosis, and the energy deficit surfaces
  in whichever high-demand tissue the particular lesion spares least - heart
  (MRPL44, TSFM, MTO1), liver (GFM1, TRMU), brain and basal ganglia (GTPBP3),
  cochlea (MT-RNR1 with aminoglycosides), or cerebellum (RARS2). Conforming
  entries substitute the gene, the translation sub-step it breaks, and the
  organ tropism. Key conformance target:
  `mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded
  OXPHOS Subunits`. Deliberately complementary to `complex_i_deficiency` and
  `complex_iv_assembly_deficiency`, which model an isolated single-complex
  lesion in a nuclear or mtDNA structural subunit or assembly factor; a
  translation defect sits one step upstream and takes out every complex
  carrying an mtDNA-encoded subunit. Also distinct from
  `mitochondrial_dysfunction`, the aging-hallmark module for acquired
  bioenergetic decline, and from `metabolic_intoxication_decompensation`,
  which models small-molecule intoxication rather than energy failure.
category: Module
module_categories:
- METABOLISM
- TOXICOLOGY
creation_date: "2026-10-08T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded
  OXPHOS Subunits").

  Scope decision - every lesion class that stops the mitoribosome making
  protein is one trigger node. The machinery has four gene classes with no
  shared sequence or structure (ribosomal proteins, translation factors, tRNA
  and rRNA genes plus their modifying enzymes, and aminoacyl-tRNA
  synthetases), but they converge on a single measurable step, an in-organello
  translation assay showing reduced synthesis of the mtDNA-encoded
  polypeptides, which is the module bar. The pharmacological branch is kept
  in the same trigger node because chloramphenicol and aminoglycosides act on
  the same ribosome: Chloramphenicol_Toxicity and
  Aminoglycoside-Induced_Hearing_Loss carry the identical central node and
  are the reason this module is tagged TOXICOLOGY.

  What is NOT in scope. An isolated single-complex deficiency from a
  structural-subunit or assembly-factor variant belongs to
  complex_i_deficiency or complex_iv_assembly_deficiency, not here, even when
  the gene is an mtDNA gene (MT-ND1 is a complex I subunit, not a translation
  component). A translation activator restricted to one mRNA (TACO1 for
  MT-CO1, which conforms to the complex IV module) is likewise a
  single-complex lesion. mtDNA depletion syndromes reduce the template, not
  the ribosome, and are a different module. Large single mtDNA deletions
  (Kearns-Sayre, Pearson) remove tRNA genes and so do produce a translation
  defect; those entries currently conform to mitochondrial_dysfunction, and
  conforming them here as well is a defensible follow-up not made in the
  creating PR.

  Sub-step substitutions for the trigger node: mitoribosome assembly
  (MRPS22, MRPL44, MRPS16, MRPL3); elongation (GFM1, TSFM, TUFM); tRNA
  modification (MTO1, GTPBP3, TRMU, PUS1, TRIT1, NSUN3); tRNA aminoacylation
  (RARS2, DARS2, FARS2, YARS2, IARS2, AARS2, EARS2); the mt-tRNA and mt-rRNA
  genes themselves (MT-TL1, MT-TK, MT-TE, MT-RNR1); and pharmacological
  inhibition of the mitoribosome.

  Tissue specificity is the open question. The same TSFM allele produced
  encephalomyopathy in one patient and hypertrophic cardiomyopathy in another
  (PMID:17033963), and the aminoacyl-tRNA synthetase reviews cited on the
  terminal node make the point that a shared biochemical role does not
  predict a shared organ. The terminal node therefore names the tropism
  classes and leaves the explanation to the KNOWLEDGE_GAP discussion below
  rather than asserting one.

  Curation guardrail - do NOT create a "Combined Oxidative Phosphorylation
  Deficiency" Disease entry for this module. The COXPD number series raises
  the same per-number versus grouped nosology question that issue #9864
  records for the MC1DN series, and this module takes no position on it: it
  factors out the shared mechanism and moves no entity boundary. A Grouping
  over this module, mirroring the complex IV precedent, is the natural
  follow-up once that question is settled.
pathophysiology:
- name: Mitochondrial Translation Machinery Lesion
  description: >-
    A pathogenic variant in a mitoribosomal protein, a mitochondrial
    translation factor, a mitochondrial tRNA or rRNA gene, a tRNA-modifying
    enzyme, or a mitochondrial aminoacyl-tRNA synthetase, or a drug that binds
    the mitoribosome, disables one step of the protein-synthesis apparatus
    that makes the thirteen mtDNA-encoded OXPHOS subunits. Conforming entries
    substitute the gene and the sub-step (ribosome assembly, elongation, tRNA
    modification, aminoacylation, or the RNA gene itself).
  role: trigger
  biological_processes:
  - preferred_term: mitochondrial ribosome assembly
    term:
      id: GO:0061668
      label: mitochondrial ribosome assembly
    modifier: DECREASED
  - preferred_term: mitochondrial translational elongation
    term:
      id: GO:0070125
      label: mitochondrial translational elongation
    modifier: DECREASED
  - preferred_term: tRNA wobble uridine modification
    term:
      id: GO:0002098
      label: tRNA wobble uridine modification
    modifier: DECREASED
  - preferred_term: tRNA aminoacylation for protein translation
    term:
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
    modifier: DECREASED
  evidence:
  - reference: PMID:33426504
    reference_title: "Mitochondrial translation defects and human disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Here, we review several classes of disease resulting from defective mitochondrial translation including disorders with mitochondrial tRNA mutations, mitochondrial aminoacyl-tRNA synthetase disorders, mitochondrial rRNA mutations, and mitochondrial ribosomal protein disorders."
    explanation: Enumerates the lesion classes this trigger node spans.
  - reference: PMID:15537906
    reference_title: "Mutant mitochondrial elongation factor G1 and combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped the defective gene to a region on chromosome 3q containing elongation factor G1 (EFG1), which encodes a mitochondrial translation factor."
    explanation: The elongation-factor branch; the first nuclear-encoded translation-factor lesion found.
  - reference: PMID:21189481
    reference_title: "Mutation in mitochondrial ribosomal protein MRPS22 leads to Cornelia de Lange-like phenotype, brain abnormalities and hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping and sequence analysis of candidate genes revealed a homozygous mutation in MRPS22, a gene encoding a mitochondrial ribosomal small subunit protein."
    explanation: The mitoribosomal-protein branch.
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified mutations in the TRMU gene, which encodes a mitochondria-specific tRNA-modifying enzyme, tRNA 5-methylaminomethyl-2-thiouridylate methyltransferase. Accordingly, the 2-thiouridylation levels of the mitochondrial tRNAs were markedly reduced."
    explanation: The tRNA-modification branch, with the modification loss measured in patient tRNA.
  - reference: PMID:28716624
    reference_title: "Recent Advances in Mitochondrial Aminoacyl-tRNA Synthetases and Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The nucleus-encoded mitochondrial aminoacyl-tRNA synthetases (mt-aaRSs) are key components of the mitochondrial translation apparatus."
    explanation: Places the aminoacyl-tRNA synthetases inside the apparatus this node describes.
  downstream:
  - target: Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits
    causal_link_type: DIRECT
    description: >-
      Whichever component is lost, the mitoribosome cannot complete synthesis
      of the mtDNA-encoded polypeptides.
- name: Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits
  description: >-
    The thirteen respiratory-chain subunits encoded by mtDNA are translated
    only on the mitochondrial ribosome, so the upstream lesion reduces their
    synthesis across the board. This is the rate-limiting step every
    conforming disorder funnels through and the one an in-organello
    translation assay measures directly.
  role: central_effector
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The 13 polypeptides encoded in mitochondrial DNA (mtDNA) are synthesized in the mitochondrial matrix on a dedicated protein-translation apparatus that resembles that found in prokaryotes."
    explanation: States the dependency that makes this the convergence point - the mtDNA-encoded subunits have no other route to synthesis.
  - reference: PMID:21189481
    reference_title: "Mutation in mitochondrial ribosomal protein MRPS22 leads to Cornelia de Lange-like phenotype, brain abnormalities and hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of mitochondrial protein synthesis revealed a marked impairment in mitochondrial translation."
    explanation: The direct measurement of this node in patient fibroblasts for a mitoribosomal lesion.
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in GTPBP3 are associated with a severe mitochondrial translation defect, consistent with the predicted function of the protein in catalyzing the formation of 5-taurinomethyluridine (τm(5)U) in the anticodon wobble position of five mitochondrial tRNAs."
    explanation: The same node reached from a tRNA-modification lesion.
  - reference: PMID:15537906
    reference_title: "Mutant mitochondrial elongation factor G1 and combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated two siblings with a severe defect in mitochondrial translation, reduced levels of oxidative phosphorylation complexes containing mitochondrial DNA (mtDNA)-encoded subunits, and progressive hepatoencephalopathy."
    explanation: The same node reached from an elongation-factor lesion, with the downstream subunit loss already visible.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      Complexes I, III, IV and V each contain mtDNA-encoded subunits and
      cannot assemble to normal levels without them.
- name: Combined Respiratory Chain Complex Deficiency
  description: >-
    Loss of the mtDNA-encoded subunits reduces assembled complexes I, III, IV
    and V together, the biochemical signature that distinguishes a
    translation defect from an isolated single-complex lesion. Oxidative
    phosphorylation and ATP synthesis fall in proportion. Complex II, which is
    entirely nuclear-encoded, is spared.
  role: effector
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the amounts of assembled complexes I, IV, and V were reduced by 35%-91% compared with the amounts in controls"
    explanation: Quantifies the multi-complex loss in patient fibroblasts.
  - reference: PMID:21189481
    reference_title: "Mutation in mitochondrial ribosomal protein MRPS22 leads to Cornelia de Lange-like phenotype, brain abnormalities and hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The combination of deficiencies suggested a primary defect associated with the synthesis of mitochondrially encoded OXPHOS subunits."
    explanation: Shows the combined pattern being read, correctly, as the signature of a translation defect.
  - reference: PMID:23315540
    reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein MRPL44 to underlie mitochondrial infantile cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of respiratory chain enzymes revealed a combined deficiency of complexes I and IV in the heart and skeletal muscle."
    explanation: The combined deficiency measured in affected patient tissue.
  downstream:
  - target: Lactic Acidosis and Metabolic Decompensation
    causal_link_type: DIRECT
    description: >-
      Failure of oxidative ATP synthesis forces a shift to anaerobic
      glycolysis.
  - target: Tissue-Selective Energy Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The bioenergetic deficit is most damaging in tissues with high
      oxidative demand, and which tissue depends on the upstream lesion.
- name: Lactic Acidosis and Metabolic Decompensation
  description: >-
    The shift to anaerobic glycolysis raises pyruvate-to-lactate conversion,
    elevating blood and cerebrospinal-fluid lactate; intercurrent illness or
    the neonatal period can precipitate acute decompensation, including the
    reversible acute liver failure of TRMU deficiency.
  role: consequence
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All case subjects presented with lactic acidosis and nine developed hypertrophic cardiomyopathy."
    explanation: Lactic acidosis as a universal finding across the GTPBP3 cohort.
  - reference: PMID:19732863
    reference_title: "Acute infantile liver failure due to mutations in the TRMU gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on 13 unrelated infants who presented with acute liver failure and lactic acidemia with normal mtDNA content."
    explanation: Lactic acidemia with an acute decompensation, in a translation defect with intact mtDNA.
- name: Tissue-Selective Energy Failure
  description: >-
    The energy deficit surfaces in high-demand tissues, but which one depends
    on the lesion: hypertrophic cardiomyopathy (MRPL44, TSFM, MTO1, GTPBP3),
    hepatoencephalopathy or acute liver failure (GFM1, TRMU), Leigh-like
    basal-ganglia disease (GTPBP3), leukoencephalopathy (DARS2), pontocerebellar
    hypoplasia (RARS2), sideroblastic anemia with myopathy (YARS2, PUS1), or
    cochlear hair-cell loss (MT-RNR1 with aminoglycosides). Conforming
    entries substitute the dominant tissue and its cell types.
  role: consequence
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:33426504
    reference_title: "Mitochondrial translation defects and human disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Defects in mitochondrial translation are known to cause a wide variety of clinical disease in humans with high-energy consuming organs generally most prominently affected."
    explanation: The high-demand-tissue rule that this terminal node states.
  - reference: PMID:23315540
    reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein MRPL44 to underlie mitochondrial infantile cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that mitochondrial ribosomal subunit defects can generate tissue-specific manifestations, such as cardiomyopathy."
    explanation: A worked case of the tissue selectivity, here cardiac.
  - reference: PMID:28716624
    reference_title: "Recent Advances in Mitochondrial Aminoacyl-tRNA Synthetases and Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in these enzymes predominantly affect the central nervous system (CNS) but also target other organs."
    explanation: The neural tropism of the synthetase branch.
  - reference: PMID:30647134
    reference_title: "When a common biological role does not imply common disease outcomes: Disparate pathology linked to human mitochondrial aminoacyl-tRNA synthetases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Even among cases where a common physiological system is affected, phenotypes, severity, and age of onset varies depending on which mt-aaRS is mutated."
    explanation: Records that the tissue selectivity is not predicted by the shared biochemical lesion, which is why this node names classes rather than one organ.
discussions:
- discussion_id: gap_mitochondrial_translation_tissue_selectivity
  prompt: >-
    Why do lesions in a ubiquitously required apparatus, which all reduce
    synthesis of the same thirteen polypeptides, produce organ-restricted and
    gene-specific disease - cardiomyopathy for one mitoribosomal protein,
    liver failure for one tRNA-modifying enzyme, leukoencephalopathy for one
    synthetase - and why can one allele produce different organ involvement
    in different patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Tissue-Selective Energy Failure
  rationale: >-
    The terminal node of this module names tropism classes instead of a
    mechanism because the field has none. The same TSFM allele produced
    encephalomyopathy in one patient and hypertrophic cardiomyopathy in
    another, and two reviews of the aminoacyl-tRNA synthetases independently
    conclude that the shared biochemical role does not predict the organ.
    Candidate explanations in the literature - tissue differences in the
    residual activity needed, in the demand for a particular tRNA, in
    compensatory import of cytosolic synthetases, or in modifier alleles -
    have not been discriminated. Until one is, a conforming entry should
    record its organ tropism as an observation on this node, not derive it.
  evidence:
  - reference: PMID:17033963
    reference_title: "Distinct clinical phenotypes associated with a mutation in the mitochondrial translation elongation factor EFTs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that the same mutation is associated with distinct clinical phenotypes suggests the presence of genetic modifiers of the mitochondrial translation apparatus."
    explanation: One allele, two organ presentations, with modifiers proposed but not identified.
  - reference: PMID:30647134
    reference_title: "When a common biological role does not imply common disease outcomes: Disparate pathology linked to human mitochondrial aminoacyl-tRNA synthetases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most surprising has been the wide-ranging presentation of clinical manifestations in patients with mt-aaRS mutations, despite the enzymes' common biochemical role."
    explanation: States the gap as the field's own open question.

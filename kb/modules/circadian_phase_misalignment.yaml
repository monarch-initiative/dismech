name: Circadian Phase Misalignment Module
description: >-
  A conserved chronobiological mechanism module representing the circadian
  rhythm sleep-wake disorders. The defining lesion is not an inability to sleep
  but an inability to sleep at the required time: the endogenous circadian
  pacemaker in the suprachiasmatic nucleus runs at a phase, or a period, that
  the person's imposed schedule does not match. Two non-interchangeable entry
  arms converge on that misalignment - an intrinsic clock lesion (a coding or
  phosphorylation-site variant in a core clock component such as PER2, CSNK1D,
  or CRY1 that shortens or lengthens the endogenous period) and an entrainment
  input lesion (loss of the melanopsin-mediated retinal light signal in total
  blindness, or a light-dark cycle that shifts faster than the pacemaker can
  follow, as in transmeridian travel and shift work). Downstream the chain is
  shared: shifted or free-running phase -> misalignment between endogenous phase
  and the imposed sleep-wake schedule -> sleep attempted at an adverse circadian
  phase -> the clinical syndrome of insomnia at the scheduled bed time and
  sleepiness at the scheduled wake time.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "circadian_phase_misalignment#Misalignment Between Endogenous Circadian Phase
  and the Imposed Sleep-Wake Schedule", the key conformance target and
  rate-limiting step).

  ARM SELECTION IS THE CURATOR'S FIRST DECISION, and the two arms are not
  interchangeable. Enter at #Intrinsic Core Clock Period or Phase Lesion only
  when the endogenous oscillator itself is altered - familial advanced sleep
  phase syndrome (PER2 S662G, CSNK1D T44A), familial delayed sleep phase
  disorder (CRY1 gain-of-function). Enter at #Loss or Mistiming of Photic
  Entrainment Input when the oscillator is normal and the light signal that
  should reset it is absent or arriving at the wrong time - non-24-hour
  sleep-wake rhythm disorder in total blindness, jet lag disorder, shift work
  disorder. A disorder may legitimately carry both (evening light exposure
  reinforcing an already-delayed phase in delayed sleep phase syndrome), but the
  arms should be curated as separate nodes, not merged.

  WHAT DOES NOT CONFORM. Misalignment is a claim about the relationship between
  an internal phase and an external schedule; a sleep complaint alone does not
  establish it. Chronic insomnia disorder, where hyperarousal prevents sleep at
  any phase, does not conform, and the discriminator is diagnostic rather than
  theoretical: in a circadian disorder, sleep is normal in structure and
  duration when the person is allowed to sleep at their own phase. Shortened or
  fragmented sleep with a normal, entrained phase belongs elsewhere. Advanced or
  delayed sleep timing that is a preference rather than a disorder is likewise
  out of scope - the module models the pathological case in which the phase
  cannot be moved to meet the schedule.

  DRUG-TARGET PATTERN. Melatonin receptor agonists (tasimelteon, melatonin)
  ACTIVATE #Shifted or Free-Running Endogenous Circadian Phase, supplying at a
  fixed clock time the phase-setting signal that light normally provides. The
  cleanest demonstration is in totally blind patients with non-24-hour
  sleep-wake rhythm disorder, where the photic route is absent altogether and a
  timed melatonin-receptor signal entrains the pacemaker on its own - and where
  withdrawal of the drug loses entrainment again, which is the evidence that the
  agonist substitutes for the missing input rather than curing the lesion.
  Appropriately timed bright light acts on the same node through the intact
  photic route, and is the corresponding non-pharmacological intervention.

  SCOPE BOUNDARIES. Distinct from orexin_arousal_instability (state
  instability at any time of day, with a normal clock) and from
  sleep_disordered_breathing_intermittent_hypoxia (sleep is correctly timed but
  destroyed by respiratory events). It is also distinct from
  glymphatic_dysfunction, which is gated by sleep state rather than by circadian
  phase and models a clearance consequence rather than a timing lesion.

  Not an Xogenesis module - a timing relationship fails, nothing pathological is
  formed.
pathophysiology:
- name: Intrinsic Core Clock Period or Phase Lesion
  description: >-
    First of two entry arms. The circadian pacemaker is a cell-autonomous
    transcription-translation negative feedback loop: CLOCK-BMAL1 drives
    expression of PER and CRY, whose protein products feed back to inhibit their
    own activators, with the loop's period set largely by the rate at which PER
    is phosphorylated and degraded. A variant that changes either the
    phosphorylation substrate (PER2 S662G, which is hypophosphorylated by casein
    kinase I), the kinase (CSNK1D T44A), or the repressor's affinity for its
    activators (a gain-of-function CRY1 variant) alters the endogenous period
    and therefore the phase at which the oscillator stabilises under a 24-hour
    light-dark cycle. A shortened period advances phase; a lengthened period
    delays it. Conforming disorder nodes substitute the disorder-specific clock
    gene and the direction of the period change.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: circadian regulation of gene expression
    term:
      id: GO:0032922
      label: circadian regulation of gene expression
    modifier: ABNORMAL
  locations:
  - preferred_term: suprachiasmatic nucleus
    term:
      id: UBERON:0002034
      label: suprachiasmatic nucleus
  evidence:
  - reference: PMID:34657394
    reference_title: Mammalian circadian networks mediated by the suprachiasmatic nucleus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The circadian clock is an endogenous oscillator that generates daily
      rhythms in metabolism and physiology in almost all cells via a conserved
      transcriptional-translational negative feedback loop.
    explanation: >-
      Establishes the molecular substrate this node is a lesion in, and its
      cell-autonomous nature, which is why a single coding variant can reset
      whole-organism timing.
  - reference: PMID:11232563
    reference_title: An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals have a serine to glycine mutation within the casein
      kinase Iepsilon (CKIepsilon) binding region of hPER2, which causes
      hypophosphorylation by CKIepsilon in vitro.
    explanation: >-
      The canonical advance-direction substitution at this node: a
      phosphorylation-site lesion in a core clock protein, with the biochemical
      consequence shown directly.
  - reference: PMID:11232563
    reference_title: An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a variant in human sleep behavior can be attributed to a missense mutation
      in a clock component, hPER2, which alters the circadian period
    explanation: >-
      States the causal step this node encodes - variant to altered period -
      which is what a conforming disorder must evidence to enter through this
      arm rather than the entrainment arm.
  - reference: PMID:15800623
    reference_title: Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here the identification of a missense mutation (T44A) in the
      human CKIdelta gene, which results in FASPS. This mutant kinase has
      decreased enzymatic activity in vitro.
    explanation: >-
      A kinase-side substitution producing the same advanced phenotype as the
      substrate-side PER2 lesion, showing the node is the phosphorylation step
      rather than any one protein.
  - reference: PMID:28388406
    reference_title: Mutation of the Human Circadian Clock Gene CRY1 in Familial Delayed Sleep Phase Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This gain-of-function CRY1 variant causes reduced expression of key
      transcriptional targets and lengthens the period of circadian molecular
      rhythms, providing a mechanistic link to DSPD symptoms.
    explanation: >-
      The delay-direction substitution, and the clearest statement that period
      length is the mechanistic quantity linking a clock variant to a sleep-phase
      phenotype.
  downstream:
  - target: Shifted or Free-Running Endogenous Circadian Phase
    description: >-
      An altered endogenous period causes the pacemaker to stabilise at an
      abnormally early or late phase relative to the 24-hour day.
    causal_link_type: DIRECT

- name: Loss or Mistiming of Photic Entrainment Input
  description: >-
    Second, mechanistically distinct entry arm, in which the oscillator is
    intact but the signal that should set it is absent or arriving at the wrong
    phase. Photoentrainment does not use the image-forming visual pathway:
    melanopsin-expressing intrinsically photosensitive retinal ganglion cells
    project directly to the suprachiasmatic nucleus, and rods and cones are not
    required. This anatomy explains a clinically important dissociation - a
    person with no conscious light perception but a surviving ipRGC pathway can
    still entrain, while total loss of the eyes or of the retinohypothalamic
    projection removes entrainment entirely and the pacemaker free-runs at its
    own period. Conforming disorder nodes substitute the disorder-specific
    input lesion: absent light input (total blindness), abruptly shifted input
    (transmeridian travel), or chronically inverted input (night shift work).
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: melanopsin-expressing intrinsically photosensitive retinal ganglion cell
    term:
      id: CL:0020014
      label: intrinsically photosensitive retinal ganglion cell
  biological_processes:
  - preferred_term: entrainment of the circadian clock by photoperiod
    term:
      id: GO:0043153
      label: entrainment of circadian clock by photoperiod
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:11834834
    reference_title: "Melanopsin-containing retinal ganglion cells: architecture, projections, and intrinsic photosensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The primary circadian pacemaker, in the suprachiasmatic nucleus (SCN) of
      the mammalian brain, is photoentrained by light signals from the eyes
      through the retinohypothalamic tract. Retinal rod and cone cells are not
      required for photoentrainment.
    explanation: >-
      Identifies the entrainment pathway that is lost at this node and
      establishes that it is separable from image-forming vision, which is the
      basis for the dissociation the node description turns on.
  - reference: PMID:11834834
    reference_title: "Melanopsin-containing retinal ganglion cells: architecture, projections, and intrinsic photosensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      melanopsin is most likely the visual pigment of phototransducing RGCs that
      set the circadian clock and initiate other non-image-forming visual
      functions
    explanation: >-
      Names the photopigment and cell type mediating the input, which is what
      makes the arm mechanistically specific rather than a general statement
      about light.
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most totally blind people have non-24-hour sleep-wake disorder (non-24), a
      rare circadian rhythm disorder caused by an inability of light to reset
      their circadian pacemaker.
    explanation: >-
      The human worked case of this arm: loss of the photic input alone, with an
      intact oscillator, is sufficient to produce a circadian sleep-wake
      disorder.
  downstream:
  - target: Shifted or Free-Running Endogenous Circadian Phase
    description: >-
      Without a correctly timed resetting signal the pacemaker either drifts at
      its own non-24-hour period or remains at a phase set by the previous
      light-dark cycle.
    causal_link_type: DIRECT

- name: Shifted or Free-Running Endogenous Circadian Phase
  description: >-
    Both arms converge here. The suprachiasmatic pacemaker holds a phase - as
    read out by the dim-light melatonin onset, the core body temperature minimum,
    and the timing of the endogenous sleep propensity window - that is
    abnormally advanced, abnormally delayed, or not stably locked to 24 hours at
    all. The distinction between a shifted and a free-running phase matters for
    prognosis and for treatment timing: a shifted phase is stable and can be
    treated at a fixed clock hour, whereas a free-running phase drifts through
    all clock times and produces cyclically recurring symptoms.
  role: amplifier
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: circadian rhythm
    term:
      id: GO:0007623
      label: circadian rhythm
    modifier: ABNORMAL
  locations:
  - preferred_term: suprachiasmatic nucleus
    term:
      id: UBERON:0002034
      label: suprachiasmatic nucleus
  evidence:
  - reference: PMID:11232563
    reference_title: An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      affected individuals are "morning larks" with a 4-hour advance of the
      sleep, temperature, and melatonin rhythms
    explanation: >-
      Shows that the shift is a property of the pacemaker rather than of sleep
      behaviour: temperature and melatonin rhythms move together with sleep,
      which is what this node asserts.
  - reference: PMID:34657394
    reference_title: Mammalian circadian networks mediated by the suprachiasmatic nucleus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The SCN receives photic information from the environment and conveys this
      to other parts of the brain and body to synchronize all circadian clocks.
    explanation: >-
      Establishes the SCN as the phase-setting hub whose output timing this node
      describes, and why a single pacemaker shift moves peripheral rhythms too.
  downstream:
  - target: Misalignment Between Endogenous Circadian Phase and the Imposed Sleep-Wake Schedule
    description: >-
      An abnormal or drifting endogenous phase can no longer coincide with the
      sleep-wake schedule the person is required to keep.
    causal_link_type: DIRECT

- name: Misalignment Between Endogenous Circadian Phase and the Imposed Sleep-Wake Schedule
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target.
    Misalignment is a relation, not a state of the clock alone: it requires both
    an endogenous phase and an externally imposed schedule that disagree. This is
    what makes the circadian disorders unusual - the same pacemaker phase is
    pathological or benign depending only on what the person is required to do,
    which is why an extreme evening chronotype with a permissive schedule is not
    a patient and the same physiology with a 07:00 start is. A conforming
    disorder node should name both halves of the relation.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: entrainment of circadian clock
    term:
      id: GO:0009649
      label: entrainment of circadian clock
    modifier: DECREASED
  - preferred_term: regulation of the circadian sleep/wake cycle
    term:
      id: GO:0042749
      label: regulation of circadian sleep/wake cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28388406
    reference_title: Mutation of the Human Circadian Clock Gene CRY1 in Familial Delayed Sleep Phase Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This system is altered in delayed sleep phase disorder (DSPD), a common
      form of insomnia in which sleep episodes are shifted to later times
      misaligned with the societal norm.
    explanation: >-
      States the relation this node models explicitly - sleep episodes shifted
      relative to an external norm - rather than an abnormality of sleep itself.
  - reference: PMID:23385698
    reference_title: Circadian rhythm abnormalities.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CRSDs result from a misalignment between the timing of the circadian
      rhythm and the external environment (eg, jet lag and shift work) or a
      dysfunction of the circadian clock or its afferent and efferent pathways
      (eg, delayed sleep-phase, advanced sleep-phase, non-24-hour, and irregular
      sleep-wake rhythm disorders).
    explanation: >-
      States the module's central claim in the clinical literature's own terms,
      and names both entry arms as the two routes to the same misalignment,
      which is the arm-selection rule recorded in the module notes.
  downstream:
  - target: Sleep Attempted at an Adverse Circadian Phase
    description: >-
      When the required sleep opportunity falls outside the endogenous sleep
      propensity window, sleep is attempted against an active circadian wake
      signal.
    causal_link_type: DIRECT

- name: Sleep Attempted at an Adverse Circadian Phase
  description: >-
    The physiological expression of misalignment. Sleep initiated during the
    circadian wake-maintenance zone is delayed in onset and shortened; wake
    required near the core body temperature minimum is accompanied by maximal
    sleepiness and impaired performance. The resulting sleep is curtailed rather
    than structurally abnormal, which is the diagnostic hallmark distinguishing
    this module from primary insomnia: released from the schedule, the same
    person sleeps normally at their own phase.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: circadian sleep/wake cycle, sleep
    term:
      id: GO:0050802
      label: circadian sleep/wake cycle, sleep
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28388406
    reference_title: Mutation of the Human Circadian Clock Gene CRY1 in Familial Delayed Sleep Phase Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reverse phenotyping of unrelated families corroborates late and/or
      fragmented sleep patterns in carriers
    explanation: >-
      Documents the sleep-level consequence - late and fragmented sleep - in
      carriers of a defined clock lesion, connecting the molecular arm to this
      node.
  downstream:
  - target: Circadian Sleep-Wake Disorder Syndrome
    description: >-
      Chronically sleeping at an adverse phase produces the presenting clinical
      syndrome.
    causal_link_type: DIRECT

- name: Circadian Sleep-Wake Disorder Syndrome
  description: >-
    The clinical endpoint: insomnia at the scheduled bed time, excessive
    sleepiness at the scheduled wake time, and impaired daytime function, with
    the specific complaint determined by the direction of the misalignment.
    Advanced phase presents as early-morning awakening and evening sleepiness;
    delayed phase as sleep-onset insomnia and severe morning sleep inertia; a
    free-running phase as symptoms that cycle in and out over weeks as the
    endogenous phase drifts through the imposed schedule. Conforming entries
    should preserve that the pattern of symptoms, not their severity, identifies
    the underlying misalignment.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The planned step-down primary endpoint assessed the proportion of patients
      who had a clinical response (entrainment at month 1 or month 7 plus
      clinical improvement, measured by the Non-24 Clinical Response Scale).
    explanation: >-
      Shows the clinical syndrome is treated as a distinct outcome from
      entrainment itself, which is why the module keeps them as separate nodes.
  - reference: PMID:19255424
    reference_title: Adverse metabolic and cardiovascular consequences of circadian misalignment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circadian misalignment, when subjects ate and slept approximately 12 h out
      of phase from their habitual times, systematically decreased leptin (-17%,
      P < 0.001), increased glucose (+6%, P < 0.001) despite increased insulin
      (+22%, P = 0.006), completely reversed the daily cortisol rhythm (P <
      0.001), increased mean arterial pressure (+3%, P = 0.001), and reduced
      sleep efficiency (-20%, P < 0.002).
    explanation: >-
      Forced-desynchrony evidence that misalignment itself, imposed
      experimentally with sleep loss controlled, produces cardiometabolic
      derangement - which is why this consequence node extends beyond the sleep
      complaint and why the module treats misalignment rather than sleep loss as
      the causal quantity.
treatments:
- name: Melatonin Receptor Agonist (Tasimelteon)
  description: >-
    Tasimelteon is a dual MT1/MT2 melatonin receptor agonist given at a fixed
    clock time. It acts on the suprachiasmatic pacemaker to supply the
    phase-setting signal that light normally provides, and is this module's
    drug-target pattern for the phase node. The demonstration in totally blind
    patients with non-24-hour sleep-wake rhythm disorder is unusually clean
    because the competing photic input is absent: a timed receptor signal alone
    entrains the free-running pacemaker. It is a substitution therapy, not a
    correction of the underlying lesion - withdrawal loses entrainment again -
    and conforming disorders do not inherit it as a treatment recommendation,
    since the correct timing and even the correct direction of a melatonin dose
    differ between an advanced and a delayed phase.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tasimelteon
      term:
        id: CHEBI:79042
        label: tasimelteon
  target_mechanisms:
  - target: Shifted or Free-Running Endogenous Circadian Phase
    treatment_effect: ACTIVATES
    description: >-
      Timed MT1/MT2 agonism at the suprachiasmatic nucleus resets and holds the
      endogenous phase, entraining a free-running pacemaker to 24 hours.
  evidence:
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once-daily tasimelteon can entrain totally blind people with non-24;
      however, continued tasimelteon treatment is necessary to maintain these
      improvements.
    explanation: >-
      Randomised human evidence that a melatonin-receptor signal acts on the
      phase node, and that its effect is substitutive rather than curative -
      both claims the module's drug pattern makes.
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circadian entrainment occurred in eight (20%) of 40 patients in the
      tasimelteon group compared with one (3%) of 38 patients in the placebo
      group at month 1
    explanation: >-
      Quantifies the effect and is deliberately cited as PARTIAL: entrainment at
      month 1 was achieved in a minority of treated patients, so the node is
      druggable but far from reliably correctable, and a conforming entry should
      not overstate response rates.
discussions:
- discussion_id: gap_phase_marker_vs_schedule_measurement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is a single dim-light melatonin onset an adequate measurement of the
    misalignment this module makes rate-limiting?
  attaches_to:
  - pathophysiology#Misalignment Between Endogenous Circadian Phase and the Imposed Sleep-Wake Schedule
  rationale: >-
    The central node is a relation between an internal phase and an imposed
    schedule, but in practice almost all clinical and research characterisation
    measures only the internal half, usually as a single dim-light melatonin
    onset. That leaves the relation inferred rather than measured, and it makes
    two clinically different situations - a pacemaker that cannot be shifted, and
    one that could be shifted but is being held in place by the patient's own
    light exposure and schedule - indistinguishable on the standard workup. It
    matters therapeutically, because only the second is expected to respond to
    behavioural light and schedule management.
  proposed_experiments:
  - experiment_id: exp_paired_phase_and_schedule_actigraphy
    name: Paired circadian phase and imposed-schedule assessment
    description: >-
      Serial dim-light melatonin onset measurement paired with continuous
      actigraphy, light exposure dosimetry, and a recorded obligate schedule in
      patients with delayed and advanced sleep phase disorders, quantifying
      misalignment as the phase difference rather than as the phase alone, and
      testing whether that difference predicts response to timed light better
      than the phase marker does.

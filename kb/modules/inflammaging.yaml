name: Inflammaging Module
description: >-
  A conserved mechanism module for the intertwined hallmarks of aging
  (Lopez-Otin et al.) termed altered intercellular communication and chronic
  inflammation - together the phenomenon of "inflammaging": the chronic,
  low-grade, sterile systemic inflammation that develops with age in the absence
  of overt infection. Multiple age-associated stimuli converge to sustain it -
  the senescence-associated secretory phenotype (SASP), damage-associated
  molecular patterns from dysfunctional mitochondria, NLRP3 inflammasome
  activation, increased gut permeability and microbiota shifts, central obesity,
  immune dysregulation, and chronic infections. The resulting persistent
  cytokine milieu, propagated systemically through altered intercellular
  communication, is a highly significant risk factor for morbidity and mortality
  because most age-related diseases share an inflammatory pathogenesis.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disease-specific inflammatory driver
  and target tissue while preserving the conserved stimulus ->
  chronic-sterile-inflammation -> systemic-propagation -> age-related-morbidity
  chain.
category: Module
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "inflammaging#Chronic Low-Grade Sterile Inflammation"). Conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their disease context. The module captures the
  conserved inflammaging chain and its role as a shared risk substrate for
  age-related disease; it deliberately does NOT re-derive the SASP (see
  cellular_senescence) or adjudicate which upstream source dominates in a given
  disease. It is the systemic-inflammation convergence point downstream of
  cellular_senescence and mitochondrial_dysfunction. Key conformance target:
  "inflammaging#Chronic Low-Grade Sterile Inflammation".

  Two naked mole-rat models are attached under animal_models: the species itself
  as a comparative negative model for the outcome node, and the nmrHas2
  transgenic mouse, which exports the naked mole-rat hyaluronan adaptation into
  a short-lived mammal and is the one intervention arm this module carries for
  the chain as a whole. Neither is a disease model, and conforming disorder
  entries do NOT inherit those links; the transfer question is recorded as a
  HUMAN_MODEL_MISMATCH discussion.
pathophysiology:
- name: Age-Associated Inflammatory Stimuli
  description: >-
    A diverse set of age-accumulating stimuli feed sterile inflammation:
    senescent-cell SASP, damage-associated molecular patterns from
    dysfunctional mitochondria, NLRP3 inflammasome activation, increased gut
    permeability and microbiota changes, central obesity, immune-cell
    dysregulation, and chronic infections. Regardless of the dominant source,
    these converge to drive a persistent inflammatory response.
  role: trigger
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:30065258
    reference_title: "Inflammageing: chronic inflammation in ageing, cardiovascular disease, and frailty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Potential mechanisms of inflammageing include genetic susceptibility,
      central obesity, increased gut permeability, changes to microbiota
      composition, cellular senescence, NLRP3 inflammasome activation, oxidative
      stress caused by dysfunctional mitochondria, immune cell dysregulation, and
      chronic infections.
    explanation: >-
      Enumerates the conserved set of age-associated stimuli that drive
      inflammaging, the trigger modeled here. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Chronic Low-Grade Sterile Inflammation
- name: Chronic Low-Grade Sterile Inflammation
  description: >-
    The persistent stimuli establish a chronic, low-grade, sterile inflammatory
    state - elevated circulating inflammatory mediators without overt infection.
    This is the defining central effector of inflammaging and the conserved node
    that disease-specific inflammatory drivers converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Cytokine Production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  evidence:
  - reference: PMID:24833586
    reference_title: "Chronic inflammation (inflammaging) and its potential contribution to age-associated diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human aging is characterized by a chronic, low-grade inflammation, and
      this phenomenon has been termed as "inflammaging."
    explanation: >-
      Defines inflammaging as the chronic low-grade inflammation of human aging,
      the central effector modeled here. Evidence source is OTHER because this is
      a review.
  - reference: PMID:30065258
    reference_title: "Inflammageing: chronic inflammation in ageing, cardiovascular disease, and frailty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most older individuals develop inflammageing, a condition characterized by
      elevated levels of blood inflammatory markers that carries high
      susceptibility to chronic morbidity, disability, frailty, and premature
      death.
    explanation: >-
      Characterizes inflammaging by elevated blood inflammatory markers and its
      link to morbidity, supporting this node. Evidence source is OTHER because
      this is a review.
  - reference: PMID:32877690
    reference_title: "Alpha-Ketoglutarate, an Endogenous Metabolite, Extends Lifespan and Compresses Morbidity in Aging Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that CaAKG promotes a longer, healthier life associated with a
      decrease in levels of systemic inflammatory cytokines. We propose that
      induction of IL-10 by dietary AKG suppresses chronic inflammation, leading
      to health benefits.
    explanation: >-
      Interventional support for this node running in the protective direction:
      lowering systemic inflammatory cytokines in aging mice compressed
      morbidity and extended lifespan, which is the causal prediction the
      inflammaging chain makes. Note the paper frames the IL-10 route as a
      proposal ("We propose"), so it is cited here for the cytokine-reduction
      and healthspan observation, not as a settled IL-10 mechanism. Evidence
      source is MODEL_ORGANISM (C57BL/6 mice).
  downstream:
  - target: Systemic Propagation via Altered Intercellular Communication
- name: Systemic Propagation via Altered Intercellular Communication
  description: >-
    The inflammatory state is propagated beyond its cells of origin through
    altered intercellular communication - circulating cytokines, chemokines, and
    other mediators acting at a distance. This systemic cytokine signaling is the
    amplifying step that converts local inflammatory sources into a body-wide
    aging phenotype, and is itself one of the enumerated hallmarks of aging.
  role: amplifier
  biological_processes:
  - preferred_term: Cytokine-Mediated Signaling
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:36599349
    reference_title: "Hallmarks of aging: An expanding universe."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose the following twelve hallmarks of aging: genomic instability,
      telomere attrition, epigenetic alterations, loss of proteostasis, disabled
      macroautophagy, deregulated nutrient-sensing, mitochondrial dysfunction,
      cellular senescence, stem cell exhaustion, altered intercellular
      communication, chronic inflammation, and dysbiosis.
    explanation: >-
      Enumerates altered intercellular communication and chronic inflammation as
      hallmarks of aging, framing this systemic-propagation node. Evidence source
      is OTHER because this is a review.
  downstream:
  - target: Age-Related Morbidity and Mortality
- name: Age-Related Morbidity and Mortality
  description: >-
    Sustained systemic inflammation is a shared pathogenic substrate for the
    major age-related diseases - cardiovascular disease, chronic kidney disease,
    diabetes, cancer, dementia, sarcopenia, and frailty - and a significant risk
    factor for morbidity and mortality in older people. This is the conserved
    consequence of inflammaging; the specific disease phenotype is supplied by
    the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:24833586
    reference_title: "Chronic inflammation (inflammaging) and its potential contribution to age-associated diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inflammaging is a highly significant risk factor for both morbidity and
      mortality in the elderly people, as most if not all age-related diseases
      share an inflammatory pathogenesis.
    explanation: >-
      States that inflammaging is a major morbidity/mortality risk factor and
      that age-related diseases share inflammatory pathogenesis, the consequence
      modeled here. Evidence source is OTHER because this is a review.
  - reference: PMID:30065258
    reference_title: "Inflammageing: chronic inflammation in ageing, cardiovascular disease, and frailty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inflammageing is a risk factor for cardiovascular diseases (CVDs), and
      clinical trials suggest that this association is causal.
    explanation: >-
      Provides evidence that inflammaging is a causal risk factor for
      cardiovascular disease, supporting this outcome node. Evidence source is
      OTHER because this is a review.
animal_models:
- name: nmrHas2 transgenic mouse (naked mole-rat Has2 overexpression)
  species: Mouse
  genotype: Transgenic overexpression of naked mole-rat hyaluronic acid synthase 2 (nmrHas2)
  publication: PMID:37612507
  description: >-
    A transfer experiment rather than a disease model: the naked mole-rat Has2
    gene was put into the mouse to ask whether the abundant high-molecular-mass
    hyaluronan associated with that species' cancer resistance and longevity
    carries a benefit into a short-lived mammal. It does. The most prominent
    change in these mice was attenuated inflammation across multiple tissues,
    alongside lower spontaneous and induced cancer incidence, extended lifespan
    and improved healthspan, which makes this the one intervention arm this
    module has for the inflammaging chain as a whole.
  modeled_mechanisms:
  - target: Chronic Low-Grade Sterile Inflammation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Raising tissue hyaluronan attenuates the central effector state of this
      module across multiple tissues, through direct immunoregulatory effects on
      immune cells, protection from oxidative stress, and improved gut barrier
      function during ageing - the last of which also acts on this module's
      upstream stimulus node.
    limitations: >-
      The manipulation is transgenic overexpression in mouse, so the effect size
      does not transfer directly to a physiological human range, and no human
      intervention data exist. The authors state the benefit is conferred by
      high-molecular-mass hyaluronan rather than by the naked mole-rat gene
      specifically, so this link supports hyaluronan as the effector and not the
      species' gene as such. Attenuated inflammation was measured
      transcriptionally across tissues; which of the three proposed routes
      dominates in which tissue is not resolved.
    readouts:
    - name: Tissue inflammation during ageing
      target: Chronic Low-Grade Sterile Inflammation
      direction: DECREASED
      interpretation: >-
        Reduction of the chronic sterile inflammatory state is the readout that
        grounds the rescue claim on this node.
      evidence:
      - reference: PMID:37612507
        reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The most notable change observed in nmrHas2 mice was attenuated
          inflammation across multiple tissues.
        explanation: >-
          The measured effect on the state this node describes.
    evidence:
    - reference: PMID:37612507
      reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        HMM-HA reduced inflammation through several pathways, including a direct
        immunoregulatory effect on immune cells, protection from oxidative
        stress and improved gut barrier function during ageing.
      explanation: >-
        Names the routes by which the intervention acts on this node, including
        the gut-barrier route that feeds this module's upstream stimulus node.
  - target: Age-Related Morbidity and Mortality
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The consequence node moves with the inflammatory state: nmrHas2 mice had
      lower spontaneous and induced cancer incidence, extended lifespan and
      improved healthspan, and their transcriptome shifted towards that of
      longer-lived species.
    limitations: >-
      Lifespan and cancer are the outcome measures; the causal path from
      attenuated inflammation to those outcomes is inferred from their
      co-occurrence in the same animals rather than isolated by blocking the
      inflammatory arm. Hyaluronan acts on cancer resistance directly in this
      species' biology, so part of the survival benefit may bypass this
      module's chain entirely.
    readouts:
    - name: Lifespan
      target: Age-Related Morbidity and Mortality
      direction: INCREASED
      interpretation: >-
        Longer life in the intervention arm than in wild-type littermates. The
        comparator is a normal mouse rather than a diseased one, so this is an
        extension past the baseline, not a return to it.
      evidence:
      - reference: PMID:37612507
        reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          nmrHas2 mice showed an increase in hyaluronan levels in several
          tissues, and a lower incidence of spontaneous and induced cancer,
          extended lifespan and improved healthspan.
        explanation: >-
          Reports the lifespan extension in the transgenic arm.
    - name: Spontaneous and induced cancer incidence
      target: Age-Related Morbidity and Mortality
      direction: DECREASED
      interpretation: >-
        Lower tumour incidence is the morbidity half of this node's outcome, and
        moves in the opposite direction to lifespan, which is why it is a
        separate readout.
      evidence:
      - reference: PMID:37612507
        reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          nmrHas2 mice showed an increase in hyaluronan levels in several
          tissues, and a lower incidence of spontaneous and induced cancer,
          extended lifespan and improved healthspan.
        explanation: >-
          Reports the reduction in spontaneous and induced tumour incidence.
- name: Naked mole-rat (Heterocephalus glaber) comparative longevity model
  species: Naked mole-rat
  genotype: Wild type
  publication: PMID:29364116
  description: >-
    The source species for the transfer experiment above, curated here as the
    comparative negative model: a mammal in which the outcome node of this
    module is not reached over a lifespan above 30 years. Its abundant
    high-molecular-mass hyaluronan, over five times larger than the human or
    mouse polymer, is the specific adaptation that the nmrHas2 mouse tests.
  modeled_mechanisms:
  - target: Age-Related Morbidity and Mortality
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Age-related morbidity and mortality, the conserved consequence of this
      module, are not observed: the age-specific hazard of death does not rise
      with age and fecundity is retained until death.
    limitations: >-
      The evidence is demographic and organism-level, from captive-colony
      records, and does not measure circulating inflammatory mediators across
      the naked mole-rat lifespan - so this species is not shown to lack
      inflammaging itself, only the morbidity endpoint this module attributes
      to it. The hyaluronan adaptation is a plausible but not established
      explanation for that endpoint, and the cited hyaluronan work characterises
      cancer resistance rather than age-related inflammation.
    evidence:
    - reference: PMID:29364116
      reference_title: Naked Mole-Rat mortality rates defy gompertzian laws by not increasing with age.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This absence of hazard increase with age, in defiance of Gompertz's law,
        uniquely identifies the naked mole-rat as a non-aging mammal
      explanation: >-
        The demographic result establishing that this module's outcome node is
        not reached in this species.
    - reference: PMID:23783513
      reference_title: High-molecular-mass hyaluronan mediates the cancer resistance of the naked mole rat.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that naked mole-rat fibroblasts secrete extremely
        high-molecular-mass hyaluronan (HA), which is over five times larger
        than human or mouse HA.
      explanation: >-
        Characterises the species adaptation that the nmrHas2 transfer model
        above exports into the mouse.
discussions:
- discussion_id: human_model_mismatch_nmrhas2_hyaluronan_transfer
  prompt: >-
    The nmrHas2 mouse shows that naked mole-rat hyaluronan attenuates
    inflammaging and extends lifespan in a second species. Does that indicate a
    route that could be engaged in humans, or a result that depends on
    transgenic overexpression in the mouse?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic Low-Grade Sterile Inflammation
  - pathophysiology#Age-Related Morbidity and Mortality
  rationale: >-
    This is the most direct intervention evidence attached to this module and
    also the easiest to over-read. The manipulation is transgenic
    overexpression of a foreign synthase, producing tissue hyaluronan levels
    that no dietary or pharmacological route reproduces, so the effect size is
    not a guide to what a human intervention would achieve. The authors
    themselves attribute the benefit to high-molecular-mass hyaluronan rather
    than to the naked mole-rat gene, which is the useful part of the finding -
    the effector is a polymer, not a species' allele - but it also means the
    result does not license reading nmrHas2 as a druggable target.

    Two further gaps sit between this model and human aging. Hyaluronan is
    already in wide clinical use as viscosupplementation and as a dermal
    filler, at routes and doses that do not produce sustained systemic
    high-molecular-mass tissue hyaluronan, so existing human exposure is not
    evidence about this mechanism either way. And part of the survival benefit
    in these mice ran through cancer resistance, which in the source species is
    a direct effect of the polymer on transformation rather than a consequence
    of reduced inflammation, so the lifespan result cannot be attributed to
    this module's chain without isolating the inflammatory arm.
  proposed_experiments:
  - experiment_id: exp_hyaluronan_size_human_tissue_ageing_series
    name: Hyaluronan polymer size in human tissue across age
    description: >-
      Measure hyaluronan molecular mass and abundance in matched human tissues
      across an ageing series, alongside markers of chronic sterile
      inflammation, to establish whether the polymer this model manipulates
      varies in humans in a direction that could matter.
    would_support:
    - pathophysiology#Chronic Low-Grade Sterile Inflammation
    supporting_outcome:
    - >-
      Falling high-molecular-mass hyaluronan with age, tracking rising
      inflammatory markers, would make the mouse result relevant to a real
      human trajectory.
    refuting_outcome:
    - >-
      Stable polymer size across human age would indicate the mouse
      manipulation has no human counterpart to restore.
  - experiment_id: exp_nmrhas2_inflammation_arm_isolation
    name: Isolate the inflammatory arm of the nmrHas2 lifespan benefit
    description: >-
      Repeat the nmrHas2 lifespan experiment while blocking the inflammatory
      arm, or in a tumour-resistant background, to test whether the survival
      benefit still requires attenuated inflammation once cancer incidence is
      controlled for.
    would_support:
    - pathophysiology#Age-Related Morbidity and Mortality
    supporting_outcome:
    - >-
      Loss of the lifespan benefit when the inflammatory arm is blocked
      would place the effect on this module's chain.
    refuting_outcome:
    - >-
      A preserved lifespan benefit with inflammation unchanged would show
      the effect runs mainly through cancer resistance, outside this module.
computational_models:
- name: EpInflammAge Epigenetic-Inflammatory Clock
  description: >-
    Deep-learning model that predicts inflammatory-protein levels from DNA
    methylation and composes them into an age estimate, joining the epigenetic and
    inflammatory axes of ageing in a single predictor rather than treating them as
    separate biomarker families. Reported to associate with age-related disease
    states.
  model_type: MACHINE_LEARNING
  publication: PMID:40650062
  modeled_mechanisms:
  - target: Chronic Low-Grade Sterile Inflammation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Gives the module's central effector node a quantitative human readout that does
      not require direct cytokine assay.
  - target: Age-Related Morbidity and Mortality
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Relates the composite inflammatory-epigenetic state to age-associated disease.
    limitations: >-
      Predictive and correlational: it estimates inflammatory burden from methylation
      rather than measuring it, and asserts no mechanism connecting the two.
  notes: >-
    Because it derives inflammation from methylation, it is a shared readout with
    epigenetic_alterations and should not be treated as independent confirmation of
    either module.
- name: Lewkiewicz2019 Naive T Cell Population and Diversity Aging Model
  description: >-
    Mechanistic mathematical model of T cell population dynamics at the immunoclonal
    subpopulation level, formulated to give quantitative estimates of receptor
    diversity that full-organism experiments cannot measure directly. Diversity is
    defined in several ways according to the number of cells in a given immunoclone.
    The model attributes the age-related fall in diversity primarily to diminished
    thymic output of new T cells and the resulting loss of small immunoclones.
  model_type: KINETIC
  repository_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000824
  model_id: BIOMD0000000824
  model_format: SBML
  publication: PMID:31201663
  modeled_mechanisms:
  - target: Age-Related Morbidity and Mortality
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models the loss of naive T cell receptor diversity that underlies
      age-associated susceptibility to novel infections and poor vaccine response.
    limitations: >-
      Captures the adaptive-immune (immunosenescence) arm of immune ageing, not the
      sterile inflammatory arm this module centres on. The two co-occur and are
      often conflated, but this model asserts nothing about the inflammatory
      mediators in the module's other nodes.
  notes: >-
    Included deliberately as the adaptive-immune counterpart: immunosenescence and
    inflammaging are distinct processes, and keeping the model's scope explicit
    prevents the module absorbing evidence that belongs to the other.

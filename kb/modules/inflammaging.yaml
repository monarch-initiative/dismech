name: Inflammaging Module
description: >-
  A conserved mechanism module for the intertwined hallmarks of aging
  (Lopez-Otin et al.) termed altered intercellular communication and chronic
  inflammation - together the phenomenon of "inflammaging": the chronic,
  low-grade, sterile systemic inflammation that develops with age in the absence
  of overt infection. Multiple age-associated stimuli converge to sustain it -
  the senescence-associated secretory phenotype (SASP), damage-associated
  molecular patterns from dysfunctional mitochondria, NLRP3 inflammasome
  activation, increased gut permeability and microbiota shifts, central obesity,
  immune dysregulation, and chronic infections. The resulting persistent
  cytokine milieu, propagated systemically through altered intercellular
  communication, is a highly significant risk factor for morbidity and mortality
  because most age-related diseases share an inflammatory pathogenesis.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disease-specific inflammatory driver
  and target tissue while preserving the conserved stimulus ->
  chronic-sterile-inflammation -> systemic-propagation -> age-related-morbidity
  chain.
category: Module
module_categories:
- IMMUNOLOGY
- AGING
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "inflammaging#Chronic Low-Grade Sterile Inflammation"). Conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their disease context. The module captures the
  conserved inflammaging chain and its role as a shared risk substrate for
  age-related disease; it deliberately does NOT re-derive the SASP (see
  cellular_senescence) or adjudicate which upstream source dominates in a given
  disease. It is the systemic-inflammation convergence point downstream of
  cellular_senescence and mitochondrial_dysfunction. Key conformance target:
  "inflammaging#Chronic Low-Grade Sterile Inflammation".

  Two naked mole-rat models are attached under animal_models: the species itself
  as a comparative negative model for the outcome node, and the nmrHas2
  transgenic mouse, which exports the naked mole-rat hyaluronan adaptation into
  a short-lived mammal and is the one intervention arm this module carries for
  the chain as a whole. Neither is a disease model, and conforming disorder
  entries do NOT inherit those links; the transfer question is recorded as a
  HUMAN_MODEL_MISMATCH discussion.
pathophysiology:
- name: Age-Associated Inflammatory Stimuli
  description: >-
    A diverse set of age-accumulating stimuli feed sterile inflammation:
    senescent-cell SASP, damage-associated molecular patterns from
    dysfunctional mitochondria, NLRP3 inflammasome activation, increased gut
    permeability and microbiota changes, central obesity, immune-cell
    dysregulation, and chronic infections. Regardless of the dominant source,
    these converge to drive a persistent inflammatory response.
  role: trigger
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:30065258
    reference_title: "Inflammageing: chronic inflammation in ageing, cardiovascular disease, and frailty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Potential mechanisms of inflammageing include genetic susceptibility,
      central obesity, increased gut permeability, changes to microbiota
      composition, cellular senescence, NLRP3 inflammasome activation, oxidative
      stress caused by dysfunctional mitochondria, immune cell dysregulation, and
      chronic infections.
    explanation: >-
      Enumerates the conserved set of age-associated stimuli that drive
      inflammaging, the trigger modeled here. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Chronic Low-Grade Sterile Inflammation
- name: Chronic Low-Grade Sterile Inflammation
  description: >-
    The persistent stimuli establish a chronic, low-grade, sterile inflammatory
    state - elevated circulating inflammatory mediators without overt infection.
    This is the defining central effector of inflammaging and the conserved node
    that disease-specific inflammatory drivers converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Cytokine Production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  evidence:
  - reference: PMID:24833586
    reference_title: "Chronic inflammation (inflammaging) and its potential contribution to age-associated diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human aging is characterized by a chronic, low-grade inflammation, and
      this phenomenon has been termed as "inflammaging."
    explanation: >-
      Defines inflammaging as the chronic low-grade inflammation of human aging,
      the central effector modeled here. Evidence source is OTHER because this is
      a review.
  - reference: PMID:30065258
    reference_title: "Inflammageing: chronic inflammation in ageing, cardiovascular disease, and frailty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most older individuals develop inflammageing, a condition characterized by
      elevated levels of blood inflammatory markers that carries high
      susceptibility to chronic morbidity, disability, frailty, and premature
      death.
    explanation: >-
      Characterizes inflammaging by elevated blood inflammatory markers and its
      link to morbidity, supporting this node. Evidence source is OTHER because
      this is a review.
  - reference: PMID:32877690
    reference_title: "Alpha-Ketoglutarate, an Endogenous Metabolite, Extends Lifespan and Compresses Morbidity in Aging Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that CaAKG promotes a longer, healthier life associated with a
      decrease in levels of systemic inflammatory cytokines. We propose that
      induction of IL-10 by dietary AKG suppresses chronic inflammation, leading
      to health benefits.
    explanation: >-
      Interventional support for this node running in the protective direction:
      lowering systemic inflammatory cytokines in aging mice compressed
      morbidity and extended lifespan, which is the causal prediction the
      inflammaging chain makes. Note the paper frames the IL-10 route as a
      proposal ("We propose"), so it is cited here for the cytokine-reduction
      and healthspan observation, not as a settled IL-10 mechanism. Evidence
      source is MODEL_ORGANISM (C57BL/6 mice).
  downstream:
  - target: Systemic Propagation via Altered Intercellular Communication
- name: Systemic Propagation via Altered Intercellular Communication
  description: >-
    The inflammatory state is propagated beyond its cells of origin through
    altered intercellular communication - circulating cytokines, chemokines, and
    other mediators acting at a distance. This systemic cytokine signaling is the
    amplifying step that converts local inflammatory sources into a body-wide
    aging phenotype, and is itself one of the enumerated hallmarks of aging.
  role: amplifier
  biological_processes:
  - preferred_term: Cytokine-Mediated Signaling
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:36599349
    reference_title: "Hallmarks of aging: An expanding universe."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose the following twelve hallmarks of aging: genomic instability,
      telomere attrition, epigenetic alterations, loss of proteostasis, disabled
      macroautophagy, deregulated nutrient-sensing, mitochondrial dysfunction,
      cellular senescence, stem cell exhaustion, altered intercellular
      communication, chronic inflammation, and dysbiosis.
    explanation: >-
      Enumerates altered intercellular communication and chronic inflammation as
      hallmarks of aging, framing this systemic-propagation node. Evidence source
      is OTHER because this is a review.
  downstream:
  - target: Age-Related Morbidity and Mortality
- name: Age-Related Morbidity and Mortality
  description: >-
    Sustained systemic inflammation is a shared pathogenic substrate for the
    major age-related diseases - cardiovascular disease, chronic kidney disease,
    diabetes, cancer, dementia, sarcopenia, and frailty - and a significant risk
    factor for morbidity and mortality in older people. This is the conserved
    consequence of inflammaging; the specific disease phenotype is supplied by
    the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:24833586
    reference_title: "Chronic inflammation (inflammaging) and its potential contribution to age-associated diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inflammaging is a highly significant risk factor for both morbidity and
      mortality in the elderly people, as most if not all age-related diseases
      share an inflammatory pathogenesis.
    explanation: >-
      States that inflammaging is a major morbidity/mortality risk factor and
      that age-related diseases share inflammatory pathogenesis, the consequence
      modeled here. Evidence source is OTHER because this is a review.
  - reference: PMID:30065258
    reference_title: "Inflammageing: chronic inflammation in ageing, cardiovascular disease, and frailty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inflammageing is a risk factor for cardiovascular diseases (CVDs), and
      clinical trials suggest that this association is causal.
    explanation: >-
      Provides evidence that inflammaging is a causal risk factor for
      cardiovascular disease, supporting this outcome node. Evidence source is
      OTHER because this is a review.
biochemical:
- name: Circulating interleukin-6
  presence: INCREASED
  biomarker_term:
    preferred_term: Interleukin-6
    term:
      id: NCIT:C20451
      label: Interleukin-6
  notes: >-
    IL-6 is the most consistently reported circulating readout of inflammaging.
    Unlike an acute-phase response, the age-associated elevation is modest and
    sustained, which is why it is informative as a graded population-level
    measure rather than as a diagnostic threshold in an individual.
  evidence:
  - reference: PMID:10335721
    reference_title: "Associations of elevated interleukin-6 and C-reactive protein levels with mortality in the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Higher circulating levels of interleukin-6 and C-reactive protein were
      associated with mortality in this population-based sample of healthy older
      persons.
    explanation: >-
      Prospective population cohort of nondisabled older adults establishing that
      circulating IL-6 tracks the inflammatory burden this module models.
  readouts:
  - target: Chronic Low-Grade Sterile Inflammation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Circulating IL-6 reports the chronic low-grade inflammatory state itself
      rather than any single upstream stimulus feeding it.
    evidence:
    - reference: PMID:24470107
      reference_title: "Circulating mitochondrial DNA increases with age and is a familiar trait: Implications for \"inflamm-aging\"."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The subjects with the highest mtDNA plasma levels had the highest amounts
        of TNF-α, IL-6, RANTES, and IL-1ra; the subjects with the lowest mtDNA
        levels had the lowest levels of the same cytokines.
      explanation: >-
        IL-6 rises in step with circulating DAMP burden, supporting it as a
        readout of the sterile inflammatory state rather than an isolated analyte.
  - target: Age-Related Morbidity and Mortality
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Elevated IL-6 predicts all-cause mortality in older adults independently of
      age, sex, BMI, smoking, diabetes and prior cardiovascular disease.
    evidence:
    - reference: PMID:10335721
      reference_title: "Associations of elevated interleukin-6 and C-reactive protein levels with mortality in the elderly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Higher interleukin-6 levels were associated with a twofold greater risk of
        death [relative risk (RR) for the highest quartile (> or = 3.19 pg/mL)
        compared with the lowest quartile of 1.9 [95% confidence interval, CI, 1.2
        to 3.1]).
      explanation: >-
        Quantified prospective mortality association supporting a prognostic
        readout against the module's outcome node.
- name: High-sensitivity C-reactive protein
  presence: INCREASED
  biomarker_term:
    preferred_term: high-sensitivity C-reactive protein
    term:
      id: NCIT:C60651
      label: C-Reactive Protein
  notes: >-
    CRP is the downstream hepatic acute-phase product of IL-6 signalling, so it is
    a partially redundant readout of the same axis rather than an independent one.
    Its value in this module is practical: the high-sensitivity assay is already
    standardized and widely available, which is exactly the affordability and
    availability criterion the Biomarkers of Aging Consortium raises for
    translation. Measuring IL-6 and CRP together stratifies risk better than
    either alone.
  evidence:
  - reference: PMID:10335721
    reference_title: "Associations of elevated interleukin-6 and C-reactive protein levels with mortality in the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Subjects with elevation of both interleukin-6 and C-reactive protein levels
      were 2.6 times more likely (CI, 1.6 to 4.3) to die during follow-up than
      those with low levels of both measurements.
    explanation: >-
      Joint elevation of CRP and IL-6 carries greater mortality risk than either
      alone, supporting CRP as a complementary readout of the same axis.
  readouts:
  - target: Age-Related Morbidity and Mortality
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Elevated hsCRP predicts all-cause mortality in older adults; combined with
      IL-6 it identifies a higher-risk stratum than either marker alone.
    evidence:
    - reference: PMID:10335721
      reference_title: "Associations of elevated interleukin-6 and C-reactive protein levels with mortality in the elderly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Higher C-reactive protein levels (> or = 2.78 mg/L) were also associated
        with increased risk (RR = 1.6; CI, 1.0 to 2.6).
      explanation: >-
        Quantified prospective mortality association for CRP against the module's
        outcome node.
- name: Circulating tumour necrosis factor
  presence: INCREASED
  biomarker_term:
    preferred_term: tumour necrosis factor alpha
    term:
      id: NCIT:C20535
      label: Tumor Necrosis Factor
  notes: >-
    TNF-alpha is part of the canonical inflammaging cytokine panel and is one of
    the 14 biomarkers in the 2025 Delphi expert consensus, but the human evidence
    curated here is co-elevation with circulating DAMP burden rather than an
    independent prospective outcome association, so that readout is graded
    INDIRECT. Mouse interventional evidence is stronger than the human
    associational evidence for this marker: blocking TNF-alpha signalling partially
    rescues premature aging driven by T-cell mitochondrial failure. That asymmetry
    is itself informative and is why both are curated. A human prospective source
    should still be added before TNF-alpha is treated as independently prognostic,
    and note that the consensus panel did not agree it predicts biological age
    better than chronological age. Note also that the TAME Biomarkers Workgroup
    selected TNF-alpha receptor I or II rather than TNF-alpha itself for its trial
    panel; the soluble receptors are the more stable analytes, and a future
    refinement of this entry should curate sTNFR-I/II alongside or in place of the
    ligand.
  evidence:
  - reference: PMID:24470107
    reference_title: "Circulating mitochondrial DNA increases with age and is a familiar trait: Implications for \"inflamm-aging\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The subjects with the highest mtDNA plasma levels had the highest amounts of
      TNF-α, IL-6, RANTES, and IL-1ra; the subjects with the lowest mtDNA
      levels had the lowest levels of the same cytokines.
    explanation: >-
      Establishes TNF-alpha co-elevation with DAMP burden in a 90+ cohort. The
      claim that TNF-alpha reports the inflammaging state follows by an inference
      step from this stratified comparison, hence INDIRECT.
  readouts:
  - target: Chronic Low-Grade Sterile Inflammation
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      TNF-alpha rises with circulating DAMP burden in the very old, tracking the
      sterile inflammatory state.
    evidence:
    - reference: PMID:24470107
      reference_title: "Circulating mitochondrial DNA increases with age and is a familiar trait: Implications for \"inflamm-aging\"."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro stimulation of monocytes with mtDNA concentrations similar to the
        highest levels observed in vivo resulted in an increased production of
        TNF-α, suggesting that mtDNA can modulate the production of
        proinflammatory cytokines.
      explanation: >-
        Monocyte stimulation shows the DAMP-to-TNF step directly, grounding the
        correlation in a mechanism rather than association alone.
    - reference: PMID:32439659
      reference_title: "T cells with dysfunctional mitochondria induce multimorbidity and premature senescence."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Blocking tumor necrosis factor-α signaling or preventing senescence with
        nicotinamide adenine dinucleotide precursors partially rescues premature
        aging in mice with Tfam-deficient T cells.
      explanation: >-
        Interventional mouse evidence that TNF-alpha signalling is not merely
        correlated with the inflammaging state but contributes causally to its
        aging phenotype, since blocking it partially rescues.
    - reference: PMID:30151729
      reference_title: "A framework for selection of blood-based biomarkers for geroscience-guided clinical trials: report from the TAME Biomarkers Workgroup."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Application of these selection criteria to the current literature resulted
        in a short list of blood-based biomarkers proposed for TAME: IL-6,
        TNFα-receptor I or II, CRP, GDF15, insulin, IGF1, cystatin C, NT-proBNP,
        and hemoglobin A1c.
      explanation: >-
        Places TNF-receptor signalling on the panel selected for a geroscience
        trial. Note the panel names the receptors rather than the ligand curated
        here, which is the refinement recorded in this entry's notes.
- name: Circulating cell-free mitochondrial DNA
  presence: INCREASED
  biomarker_term:
    preferred_term: circulating cell-free mitochondrial DNA
    term:
      id: NCIT:C28512
      label: Mitochondrial DNA
  notes: >-
    NCIT has no term for the circulating cell-free mitochondrial DNA analyte.
    NCIT:C128274 (Circulating Cell-Free DNA) captures the compartment but not the
    molecule, and NCIT:C28512 captures the molecule but not the compartment; the
    molecule is the more important axis here, so the compartment is carried in
    preferred_term. cf-mtDNA is unusual in being both a stimulus and a readout:
    it is a DAMP that drives the inflammatory state it also reports on, which is
    why it is linked to the stimulus node rather than to the inflammation node.
  evidence:
  - reference: PMID:24470107
    reference_title: "Circulating mitochondrial DNA increases with age and is a familiar trait: Implications for \"inflamm-aging\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Our findings therefore show that circulating mtDNA increases with age, and
      can significantly contribute to the maintenance of the low-grade, chronic
      inflammation observed in elderly people.
    explanation: >-
      Establishes the age-associated rise in cf-mtDNA and its contribution to the
      chronic inflammatory state this module models.
  readouts:
  - target: Age-Associated Inflammatory Stimuli
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Plasma cf-mtDNA quantifies the circulating DAMP burden that constitutes one
      of the endogenous (self) stimuli sustaining inflammaging.
    evidence:
    - reference: PMID:24470107
      reference_title: "Circulating mitochondrial DNA increases with age and is a familiar trait: Implications for \"inflamm-aging\"."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        mtDNA plasma levels increased gradually after the fifth decade of life.
      explanation: >-
        Graded age-associated rise supports cf-mtDNA as a quantitative readout of
        accumulating endogenous DAMP stimulus.
- name: Agalactosylated IgG N-glycans (IgG-G0)
  presence: INCREASED
  biomarker_term:
    preferred_term: agalactosylated IgG N-glycan profile (IgG-G0)
    term:
      id: NCIT:C128469
      label: Glycan Profile
  notes: >-
    The N-glycome is the biomarker class in the Franceschi framework that most
    clearly satisfies AFAR's cross-species applicability criterion: agalactosylated
    structures are reported in healthy old people, centenarians and their
    offspring, and in calorie-restricted mice. Like cf-mtDNA it is both marker and
    mechanism, since IgG-G0 is itself pro-inflammatory.
  evidence:
  - reference: PMID:22353383
    reference_title: "N-glycomic biomarkers of biological aging and longevity: a link with inflammaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The age-related accumulation of IgG-G0 can contribute to inflammaging, the
      low-grade pro-inflammatory status that characterizes elderly, by creating a
      vicious loop in which inflammation is responsible for the production of
      aberrantly glycosylated IgG which, in turn, would activate the immune
      system, exacerbating inflammation.
    explanation: >-
      States the age-related accumulation of IgG-G0 and its feed-forward
      contribution to the inflammatory state modeled here.
  readouts:
  - target: Chronic Low-Grade Sterile Inflammation
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: CANDIDATE_SURROGATE
    interpretation: >-
      IgG-G0 abundance tracks the chronic inflammatory state and has been proposed
      as a measure of biological as opposed to chronological age. Recorded as a
      candidate surrogate because no qualification for that use exists.
    evidence:
    - reference: PMID:22353383
      reference_title: "N-glycomic biomarkers of biological aging and longevity: a link with inflammaging."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, altered N-glycans are both powerful markers of aging and possible
        contributors to its pathogenesis.
      explanation: >-
        Supports treating the N-glycan shift as a marker of aging while flagging
        that its contribution to pathogenesis is not separable from its use as a
        readout.
animal_models:
- name: nmrHas2 transgenic mouse (naked mole-rat Has2 overexpression)
  species: Mouse
  genotype: Transgenic overexpression of naked mole-rat hyaluronic acid synthase 2 (nmrHas2)
  publication: PMID:37612507
  description: >-
    A transfer experiment rather than a disease model: the naked mole-rat Has2
    gene was put into the mouse to ask whether the abundant high-molecular-mass
    hyaluronan associated with that species' cancer resistance and longevity
    carries a benefit into a short-lived mammal. It does. The most prominent
    change in these mice was attenuated inflammation across multiple tissues,
    alongside lower spontaneous and induced cancer incidence, extended lifespan
    and improved healthspan, which makes this the one intervention arm this
    module has for the inflammaging chain as a whole.
  modeled_mechanisms:
  - target: Chronic Low-Grade Sterile Inflammation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Raising tissue hyaluronan attenuates the central effector state of this
      module across multiple tissues, through direct immunoregulatory effects on
      immune cells, protection from oxidative stress, and improved gut barrier
      function during ageing - the last of which also acts on this module's
      upstream stimulus node.
    limitations: >-
      The manipulation is transgenic overexpression in mouse, so the effect size
      does not transfer directly to a physiological human range, and no human
      intervention data exist. The authors state the benefit is conferred by
      high-molecular-mass hyaluronan rather than by the naked mole-rat gene
      specifically, so this link supports hyaluronan as the effector and not the
      species' gene as such. Attenuated inflammation was measured
      transcriptionally across tissues; which of the three proposed routes
      dominates in which tissue is not resolved.
    readouts:
    - name: Tissue inflammation during ageing
      target: Chronic Low-Grade Sterile Inflammation
      direction: DECREASED
      interpretation: >-
        Reduction of the chronic sterile inflammatory state is the readout that
        grounds the rescue claim on this node.
      evidence:
      - reference: PMID:37612507
        reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The most notable change observed in nmrHas2 mice was attenuated
          inflammation across multiple tissues.
        explanation: >-
          The measured effect on the state this node describes.
    evidence:
    - reference: PMID:37612507
      reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        HMM-HA reduced inflammation through several pathways, including a direct
        immunoregulatory effect on immune cells, protection from oxidative
        stress and improved gut barrier function during ageing.
      explanation: >-
        Names the routes by which the intervention acts on this node, including
        the gut-barrier route that feeds this module's upstream stimulus node.
  - target: Age-Related Morbidity and Mortality
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The consequence node moves with the inflammatory state: nmrHas2 mice had
      lower spontaneous and induced cancer incidence, extended lifespan and
      improved healthspan, and their transcriptome shifted towards that of
      longer-lived species.
    limitations: >-
      Lifespan and cancer are the outcome measures; the causal path from
      attenuated inflammation to those outcomes is inferred from their
      co-occurrence in the same animals rather than isolated by blocking the
      inflammatory arm. Hyaluronan acts on cancer resistance directly in this
      species' biology, so part of the survival benefit may bypass this
      module's chain entirely.
    readouts:
    - name: Lifespan
      target: Age-Related Morbidity and Mortality
      direction: INCREASED
      interpretation: >-
        Longer life in the intervention arm than in wild-type littermates. The
        comparator is a normal mouse rather than a diseased one, so this is an
        extension past the baseline, not a return to it.
      evidence:
      - reference: PMID:37612507
        reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          nmrHas2 mice showed an increase in hyaluronan levels in several
          tissues, and a lower incidence of spontaneous and induced cancer,
          extended lifespan and improved healthspan.
        explanation: >-
          Reports the lifespan extension in the transgenic arm.
    - name: Spontaneous and induced cancer incidence
      target: Age-Related Morbidity and Mortality
      direction: DECREASED
      interpretation: >-
        Lower tumour incidence is the morbidity half of this node's outcome, and
        moves in the opposite direction to lifespan, which is why it is a
        separate readout.
      evidence:
      - reference: PMID:37612507
        reference_title: Increased hyaluronan by naked mole-rat Has2 improves healthspan in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          nmrHas2 mice showed an increase in hyaluronan levels in several
          tissues, and a lower incidence of spontaneous and induced cancer,
          extended lifespan and improved healthspan.
        explanation: >-
          Reports the reduction in spontaneous and induced tumour incidence.
- name: Naked mole-rat (Heterocephalus glaber) comparative longevity model
  species: Naked mole-rat
  genotype: Wild type
  publication: PMID:29364116
  description: >-
    The source species for the transfer experiment above, curated here as the
    comparative negative model: a mammal in which the outcome node of this
    module is not reached over a lifespan above 30 years. Its abundant
    high-molecular-mass hyaluronan, over five times larger than the human or
    mouse polymer, is the specific adaptation that the nmrHas2 mouse tests.
  modeled_mechanisms:
  - target: Age-Related Morbidity and Mortality
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Age-related morbidity and mortality, the conserved consequence of this
      module, are not observed: the age-specific hazard of death does not rise
      with age and fecundity is retained until death.
    limitations: >-
      The evidence is demographic and organism-level, from captive-colony
      records, and does not measure circulating inflammatory mediators across
      the naked mole-rat lifespan - so this species is not shown to lack
      inflammaging itself, only the morbidity endpoint this module attributes
      to it. The hyaluronan adaptation is a plausible but not established
      explanation for that endpoint, and the cited hyaluronan work characterises
      cancer resistance rather than age-related inflammation.
    evidence:
    - reference: PMID:29364116
      reference_title: Naked Mole-Rat mortality rates defy gompertzian laws by not increasing with age.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This absence of hazard increase with age, in defiance of Gompertz's law,
        uniquely identifies the naked mole-rat as a non-aging mammal
      explanation: >-
        The demographic result establishing that this module's outcome node is
        not reached in this species.
    - reference: PMID:23783513
      reference_title: High-molecular-mass hyaluronan mediates the cancer resistance of the naked mole rat.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that naked mole-rat fibroblasts secrete extremely
        high-molecular-mass hyaluronan (HA), which is over five times larger
        than human or mouse HA.
      explanation: >-
        Characterises the species adaptation that the nmrHas2 transfer model
        above exports into the mouse.
discussions:
- discussion_id: human_model_mismatch_nmrhas2_hyaluronan_transfer
  prompt: >-
    The nmrHas2 mouse shows that naked mole-rat hyaluronan attenuates
    inflammaging and extends lifespan in a second species. Does that indicate a
    route that could be engaged in humans, or a result that depends on
    transgenic overexpression in the mouse?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic Low-Grade Sterile Inflammation
  - pathophysiology#Age-Related Morbidity and Mortality
  rationale: >-
    This is the most direct intervention evidence attached to this module and
    also the easiest to over-read. The manipulation is transgenic
    overexpression of a foreign synthase, producing tissue hyaluronan levels
    that no dietary or pharmacological route reproduces, so the effect size is
    not a guide to what a human intervention would achieve. The authors
    themselves attribute the benefit to high-molecular-mass hyaluronan rather
    than to the naked mole-rat gene, which is the useful part of the finding -
    the effector is a polymer, not a species' allele - but it also means the
    result does not license reading nmrHas2 as a druggable target.

    Two further gaps sit between this model and human aging. Hyaluronan is
    already in wide clinical use as viscosupplementation and as a dermal
    filler, at routes and doses that do not produce sustained systemic
    high-molecular-mass tissue hyaluronan, so existing human exposure is not
    evidence about this mechanism either way. And part of the survival benefit
    in these mice ran through cancer resistance, which in the source species is
    a direct effect of the polymer on transformation rather than a consequence
    of reduced inflammation, so the lifespan result cannot be attributed to
    this module's chain without isolating the inflammatory arm.
  proposed_experiments:
  - experiment_id: exp_hyaluronan_size_human_tissue_ageing_series
    name: Hyaluronan polymer size in human tissue across age
    description: >-
      Measure hyaluronan molecular mass and abundance in matched human tissues
      across an ageing series, alongside markers of chronic sterile
      inflammation, to establish whether the polymer this model manipulates
      varies in humans in a direction that could matter.
    would_support:
    - pathophysiology#Chronic Low-Grade Sterile Inflammation
    supporting_outcome:
    - >-
      Falling high-molecular-mass hyaluronan with age, tracking rising
      inflammatory markers, would make the mouse result relevant to a real
      human trajectory.
    refuting_outcome:
    - >-
      Stable polymer size across human age would indicate the mouse
      manipulation has no human counterpart to restore.
  - experiment_id: exp_nmrhas2_inflammation_arm_isolation
    name: Isolate the inflammatory arm of the nmrHas2 lifespan benefit
    description: >-
      Repeat the nmrHas2 lifespan experiment while blocking the inflammatory
      arm, or in a tumour-resistant background, to test whether the survival
      benefit still requires attenuated inflammation once cancer incidence is
      controlled for.
    would_support:
    - pathophysiology#Age-Related Morbidity and Mortality
    supporting_outcome:
    - >-
      Loss of the lifespan benefit when the inflammatory arm is blocked
      would place the effect on this module's chain.
    refuting_outcome:
    - >-
      A preserved lifespan benefit with inflammation unchanged would show
      the effect runs mainly through cancer resistance, outside this module.
- discussion_id: knowledge_gap_inflammatory_markers_vs_chronological_age
  prompt: >-
    Do circulating inflammatory markers report biological age, or do they only
    track chronological age and disease burden?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#High-sensitivity C-reactive protein
  - biochemical#Circulating tumour necrosis factor
  - pathophysiology#Chronic Low-Grade Sterile Inflammation
  rationale: >-
    This gap is deliberately attached to markers this module already curates,
    because it qualifies them rather than opposing them. The 2025 Delphi expert
    consensus recommends hsCRP and IL-6 as biomarkers of aging for intervention
    studies, yet hsCRP and TNF-alpha specifically failed to reach agreement that
    they predict biological age better than chronological age does. That is a
    narrower and more useful statement than "these markers are unvalidated": they
    are accepted as measures of the inflammatory state, and unresolved as measures
    of the rate of aging. A curator reading the readouts in this module should
    therefore treat the PROGNOSTIC links as claims about mortality risk in older
    adults, which is what the cited cohort evidence supports, and not as claims
    that the marker measures biological age. Resolving this needs longitudinal
    designs in which chronological age is held constant, not further
    cross-sectional association studies.
  evidence:
  - reference: PMID:39708300
    reference_title: "An Expert Consensus Statement on Biomarkers of Aging for Use in Intervention Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Four biomarkers (hsCRP, TNF-α, HbA1c, and blood pressure) did not meet the
      agreement threshold for predicting biological age better than chronological
      age
    explanation: >-
      Directly states the unresolved question for two of the markers curated in
      this module. Evidence source is OTHER because this is an expert consensus
      exercise rather than primary data.
  - reference: PMID:39708300
    reference_title: "An Expert Consensus Statement on Biomarkers of Aging for Use in Intervention Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There was less agreement on the recommended biomarkers with regards to
      clinical validation, sensitivity, and specificity compared with mechanistic
      validation
    explanation: >-
      Generalizes the gap: these markers are better supported as reflections of
      mechanism than as clinically validated measures, which is the distinction
      this module's endpoint_context values are trying to keep visible.
  notes: >-
    Relevant to any disease entry that conforms to this module and wants to use an
    inflammatory marker as an aging readout rather than a disease-activity readout.
- discussion_id: knowledge_gap_composite_vs_single_inflammaging_markers
  prompt: >-
    Which combination of markers best captures the inflammaging state, given that
    no single circulating analyte is expected to?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#
  - pathophysiology#Chronic Low-Grade Sterile Inflammation
  rationale: >-
    The module curates five markers as separate objects because that is what the
    schema represents well, but the field's own position is that composites
    outperform single analytes and that the right composite is unknown. The
    consensus statement labels this a research priority in as many words. This
    matters structurally for dismech and not only scientifically: a composite index
    is a model over features, not an analyte, so it does not fit the Biochemical
    class cleanly, and the same question arises for epigenetic clocks. The
    representation question is recorded in the decision register as "Computed indices
    and composite endpoints in aging biology" (docs/explanation/design-decisions.md
    section 12); consult it before proposing a schema change here. The gap is
    attached to the whole biochemical section rather than to any one marker because
    it is about the set.
  evidence:
  - reference: PMID:39708300
    reference_title: "An Expert Consensus Statement on Biomarkers of Aging for Use in Intervention Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the panel agreed that composite biomarkers are preferred over single
      biomarkers
    explanation: >-
      Establishes the field's preference for composites over the single-analyte
      representation this module currently uses.
  - reference: PMID:39708300
    reference_title: "An Expert Consensus Statement on Biomarkers of Aging for Use in Intervention Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is no existing consensus on the best combination of biomarkers to
      fully capture biological aging
    explanation: >-
      States the gap explicitly, and the same sentence calls addressing it a future
      research priority.
- discussion_id: knowledge_gap_marker_or_driver_cfmtdna_iggg0
  prompt: >-
    For cf-mtDNA and agalactosylated IgG, can the marker be separated from the
    mechanism it reports on, and does that matter for their use as endpoints?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Circulating cell-free mitochondrial DNA
  - biochemical#Agalactosylated IgG N-glycans (IgG-G0)
  - pathophysiology#Age-Associated Inflammatory Stimuli
  rationale: >-
    Both markers are curated here with READOUT_OF or CORRELATES_WITH links, which
    deliberately assert observation rather than causation. But both are also
    pro-inflammatory in their own right: cf-mtDNA is a DAMP sensed by TLR9, NLRP3
    and cGAS-STING, and IgG-G0 activates complement and Fc-gamma receptors. The
    open question is not whether they are markers, which is established, but what
    follows for their use as endpoints. If a marker is part of the mechanism, an
    intervention that lowers it may be acting on the disease process or may be
    acting only on the assay, and the two cannot be told apart by the marker
    moving. This is the specific form the general surrogate-endpoint problem takes
    in inflammaging, and it is why both are recorded as MONITORING or
    CANDIDATE_SURROGATE rather than as validated surrogates.
  evidence:
  - reference: PMID:22353383
    reference_title: "N-glycomic biomarkers of biological aging and longevity: a link with inflammaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, altered N-glycans are both powerful markers of aging and possible
      contributors to its pathogenesis.
    explanation: >-
      States the dual marker-and-mechanism status for the N-glycome in one
      sentence; the same duality is documented for cf-mtDNA in PMID:24470107.
  notes: >-
    Bears on the cross-species question too. A marker that is also a mechanism can
    show human-mouse concordance because the mechanism is conserved rather than
    because the marker is a shared clock, so such concordance is weaker evidence of
    translatability than it appears.
- discussion_id: knowledge_gap_surrogate_for_which_geroscience_endpoint
  prompt: >-
    Which clinical endpoint are inflammaging biomarkers candidate surrogates for,
    and does any of them predict that endpoint well enough to shorten a trial?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#
  - pathophysiology#Age-Related Morbidity and Mortality
  rationale: >-
    A surrogate is only a surrogate for something. The markers in this module carry
    MONITORING and CANDIDATE_SURROGATE contexts, but dismech has no representation
    of the clinical endpoints they would stand in for, so the CANDIDATE_SURROGATE
    label currently points nowhere. The geroscience field has converged on three
    endpoint families, each with a flagship trial: disability-free survival, the
    composite of death, dementia and persistent physical disability used as the
    ASPREE primary endpoint; multimorbidity, the accumulation of new age-related
    diseases, which is the TAME design; and the deficit-accumulation frailty index,
    operationalized as a 36-item index in SPRINT and used in Look AHEAD. The TAME
    Biomarkers Workgroup states the purpose plainly, that biomarkers exist to show
    an intervention is engaging aging biology before enough clinical events accrue
    to power the trial, and its proposed panel overlaps this module directly at
    IL-6, CRP and the TNF receptors. What is not established is the step that makes
    a surrogate legitimate: that a treatment-induced change in the marker predicts
    a change in the endpoint. None of these markers has been qualified for that,
    and the FDA surrogate endpoint table curated in kb/surrogate_endpoints/ contains
    no aging row against which regulatory_endpoint_refs could be set.
  evidence:
  - reference: PMID:30151729
    reference_title: "A framework for selection of blood-based biomarkers for geroscience-guided clinical trials: report from the TAME Biomarkers Workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Application of these selection criteria to the current literature resulted in
      a short list of blood-based biomarkers proposed for TAME: IL-6, TNFα-receptor
      I or II, CRP, GDF15, insulin, IGF1, cystatin C, NT-proBNP, and hemoglobin
      A1c.
    explanation: >-
      Names the panel selected for a geroscience trial designed against a
      multimorbidity endpoint, three of which are curated in this module.
  - reference: PMID:30151729
    reference_title: "A framework for selection of blood-based biomarkers for geroscience-guided clinical trials: report from the TAME Biomarkers Workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This work also revealed the scarcity of well-vetted biomarkers for human
      studies that reflect underlying biologic aging hallmarks
    explanation: >-
      States the gap in the exact terms dismech models it, namely biomarkers tied
      to aging hallmarks, which is what a hallmark module's biochemical block is.
  - reference: PMID:30221596
    reference_title: "Effect of Aspirin on Disability-free Survival in the Healthy Elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary end point was disability-free survival, which was defined as
      survival free from dementia or persistent physical disability.
    explanation: >-
      Defines the disability-free survival composite endpoint as operationalized in
      a large randomized geroscience-relevant trial.
  - reference: PMID:26755682
    reference_title: "Characterizing Frailty Status in the Systolic Blood Pressure Intervention Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We constructed a 36-item frailty index (FI) in 9,306 SPRINT participants
    explanation: >-
      Shows the deficit-accumulation frailty index operationalized at scale inside a
      randomized trial, establishing the third endpoint family as measurable rather
      than merely proposed.
  notes: >-
    Worth reading alongside the composite-biomarker gap. Both are consequences of
    the same structural absence: dismech represents mechanisms and analytes well,
    and represents neither composite indices nor clinical outcome assessments.

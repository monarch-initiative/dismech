name: Granuloma Formation Module
description: >-
  A conserved pathophysiology module representing the formation of a granuloma,
  the organized macrophage-rich structure that recurs across mycobacterial
  infection (tuberculosis, leprosy), fungal infection, sarcoidosis, Crohn
  disease, berylliosis, and foreign-body reactions. A persistent particulate
  stimulus - an infectious or non-infectious particle that an individual
  macrophage cannot eradicate - drives sustained recruitment and Th1/TNF-driven
  activation of macrophages. Activated macrophages then undergo the defining
  transformations of the granulomatous response: they differentiate into
  epithelioid cells and fuse into multinucleated giant cells, assembling into a
  compact, organized aggregate walled by a lymphocyte cuff and, in some
  diseases, developing central caseating necrosis. The mature granuloma is a
  double-edged structure: it sequesters and contains the offending stimulus, but
  when the stimulus persists it drives chronic tissue destruction, cavitation,
  and fibrosis. The module captures the shared core across infectious and
  non-infectious granulomatous diseases. Conforming disorder nodes substitute
  the disease-specific stimulus (M. tuberculosis, M. leprae, fungal antigen,
  unknown sarcoid antigen, beryllium, suture/foreign material) while preserving
  the persistent-stimulus -> macrophage activation -> epithelioid/giant-cell
  transformation -> organized granuloma -> containment-versus-destruction causal
  chain.
category: Module
creation_date: "2026-07-14T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is a pathological
  structure-formation ("Xogenesis") module. Xogenesis anchor: the terminal
  output is a granuloma (MPATH:847), an OGMS:0000078 pathological anatomical
  structure produced by an OGMS:0000081 pathological derivation (a new formation
  assembled from recruited and transformed cells); process genus OGMS:0000061
  pathological bodily process. SNOMED "Morphologically abnormal structure"
  (49755003) is used only as an external census/gap guide and is not bound here.
  Disorder entries reference individual nodes via conforms_to (for example,
  "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell
  Formation"). The module defines the expected pathophysiology structure;
  conforming nodes in disorder files should include the corresponding cell
  types, biological processes, and causal edges, specialized to their disease
  context. Key disease-specific substitutions: tuberculosis substitutes M.
  tuberculosis as the persistent stimulus with caseating necrosis and cavitation
  at the effector node; sarcoidosis substitutes an unknown antigen with
  non-caseating granulomas; foreign-body granulomas substitute inert particulate
  material and typically lack the Th1 adaptive arm. Modules bind GO and CL terms
  only and do not use chemical (CHEBI) or disease (MONDO) term bindings, except
  in the treatments block where the therapeutic agent carries an ontology
  identifier per the treatment schema.
pathophysiology:
- name: Persistent Indigestible Stimulus
  description: >-
    The proximal trigger of the granulomatous response is a persistent
    particulate stimulus - an infectious organism, microbial component, or inert
    foreign material - that resists elimination by an individual macrophage.
    Because the stimulus cannot be cleared by ordinary phagocytosis, it provokes
    a sustained, chronic macrophage response rather than resolving acute
    inflammation. The specific stimulus differs by disorder but the shared
    feature is its indigestibility and persistence.
  role: trigger
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: chronic inflammatory response
    term:
      id: GO:0002544
      label: chronic inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:29400999
    reference_title: "The Formation and Function of Granulomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These evolutionarily ancient structures form in response to persistent
      particulate stimuli-infectious or noninfectious-that individual
      macrophages cannot eradicate.
    explanation: >-
      Directly identifies a persistent particulate stimulus that individual
      macrophages cannot eradicate as the trigger of granuloma formation.
      Evidence source is OTHER because this is an authoritative review (Annual
      Review of Immunology).
  - reference: PMID:27692093
    reference_title: "Multinucleated giant cell cytokine expression in pulmonary granulomas of cattle experimentally infected with Mycobacterium bovis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Granulomas represent a distinct host response to chronic antigenic
      stimuli, such as foreign bodies, certain bacterial components, or
      persistent pathogens such as M. bovis.
    explanation: >-
      Establishes chronic/persistent antigenic stimuli (foreign bodies,
      bacterial components, persistent pathogens) as the host-response trigger
      for granulomas. Evidence source is MODEL_ORGANISM because the study
      examined M. bovis-infected cattle.
  downstream:
  - target: Th1 and TNF-Driven Macrophage Recruitment and Activation
- name: Th1 and TNF-Driven Macrophage Recruitment and Activation
  description: >-
    Failure to clear the stimulus drives sustained recruitment of monocytes and
    Th1 (and Th17) lymphocytes that, through interferon-gamma and tumor necrosis
    factor (TNF), classically activate macrophages at the site. TNF is a
    non-redundant amplifier: it is required to initiate and organize the
    granulomatous response, which is why its pharmacological neutralization
    dissolves granulomas and reactivates latent tuberculosis. This activated,
    cytokine-rich milieu is the amplifying step that licenses the downstream
    macrophage transformations.
  role: amplifier
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: INCREASED
  evidence:
  - reference: PMID:32122794
    reference_title: "Sarcoidosis and the mTOR, Rac1, and Autophagy Triad."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      granulomas: a compact collection of macrophages that have differentiated
      into epithelioid cells and which are associated with T helper (Th)1 and
      Th17 cells.
    explanation: >-
      Links granuloma macrophages to Th1/Th17 adaptive immunity, supporting the
      T-cell-driven macrophage-activation amplifier. Evidence source is OTHER
      because this is a review.
  - reference: PMID:18524936
    reference_title: "A role for tumour necrosis factor-alpha, complement C5 and interleukin-6 in the initiation and development of the mycobacterial cord factor trehalose 6,6'-dimycolate induced granulomatous response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TNF-alpha is critical for initiation of the granulomatous response, C5a is
      necessary for formation of cohesive granulomas, and IL-6 plays a key role
      in the granuloma maintenance response to mycobacterial TDM.
    explanation: >-
      Demonstrates that TNF-alpha is critical for initiating the granulomatous
      response, establishing TNF as the non-redundant amplifier of this module.
      Evidence source is MODEL_ORGANISM because the roles were dissected in
      cytokine-knockout mice.
  downstream:
  - target: Epithelioid Transformation and Multinucleated Giant Cell Formation
- name: Epithelioid Transformation and Multinucleated Giant Cell Formation
  description: >-
    The rate-limiting central effector of granuloma formation. In the activated
    milieu, macrophages undergo the defining morphological transformations of
    the granulomatous response: they differentiate into tightly interdigitated
    epithelioid cells and fuse with one another into multinucleated giant cells.
    These transformations, together with continued recruitment, convert a diffuse
    macrophage infiltrate into the organized cellular core of a granuloma. This
    is the disorder-agnostic step that distinguishes a granuloma from ordinary
    chronic inflammation and is the key conformance target of the module.
  role: central_effector
  cell_types:
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Macrophage Fusion into Multinucleated Giant Cells
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
    modifier: INCREASED
  evidence:
  - reference: PMID:27692093
    reference_title: "Multinucleated giant cell cytokine expression in pulmonary granulomas of cattle experimentally infected with Mycobacterium bovis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Multinucleated giant cells are formed by the fusion of multiple
      macrophages
    explanation: >-
      Directly identifies multinucleated giant-cell formation by macrophage
      fusion, the defining transformation of this central effector. Evidence
      source is MODEL_ORGANISM because it was observed in M. bovis-infected
      cattle granulomas.
  - reference: PMID:34745105
    reference_title: "Targeting Molecular Inflammatory Pathways in Granuloma as Host-Directed Therapies for Tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the mononuclear inflammatory cell infiltrates which form the central
      structure of granulomas undergo cellular changes to form epithelioid
      cells, multinucleated giant cells and foamy macrophages.
    explanation: >-
      Documents the macrophage transformations into epithelioid cells,
      multinucleated giant cells, and foamy macrophages that form the central
      granuloma structure. Evidence source is OTHER because this is a review.
  - reference: PMID:29400999
    reference_title: "The Formation and Function of Granulomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the granulomatous response unfolds in a stepwise program characterized by
      a series of macrophage activations and transformations that in turn
      recruit additional cells and produce structural changes.
    explanation: >-
      Frames the granulomatous response as a stepwise program of macrophage
      activations and transformations, the central-effector logic of this
      module. Evidence source is OTHER because this is a review.
  downstream:
  - target: Organized Granuloma Assembly
- name: Organized Granuloma Assembly
  description: >-
    The transformed macrophages assemble into a compact, organized aggregate -
    an epithelioid/giant-cell core cuffed by lymphocytes and, in some diseases,
    surrounded by fibroblasts. In diseases such as tuberculosis the center of the
    granuloma undergoes caseating necrosis and can cavitate; in sarcoidosis the
    granuloma is characteristically non-caseating. This organized structure is
    the mature granuloma, the pathological anatomical entity that the module
    produces.
  role: effector
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:29400999
    reference_title: "The Formation and Function of Granulomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Granulomas are organized aggregates of macrophages, often with
      characteristic morphological changes, and other immune cells.
    explanation: >-
      Defines the granuloma as an organized aggregate of macrophages with
      characteristic morphological changes and other immune cells, the effector
      structure of this module. Evidence source is OTHER because this is a
      review.
  - reference: PMID:34745105
    reference_title: "Targeting Molecular Inflammatory Pathways in Granuloma as Host-Directed Therapies for Tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The development of cavities is likely to enhance inter-host transmission
      and caseum could facilitate the dissemination of Mtb to other organs
      inducing disease progression.
    explanation: >-
      Documents caseation and cavitation of the mature granuloma in
      tuberculosis, the disease-specific elaboration of the organized-granuloma
      effector. Evidence source is OTHER because this is a review.
  downstream:
  - target: Tissue Containment versus Destruction and Fibrosis
- name: Tissue Containment versus Destruction and Fibrosis
  description: >-
    The clinical end state of the module is double-edged. On the protective side,
    the granuloma sequesters and contains the offending stimulus, limiting its
    spread. On the pathological side, when the stimulus persists the granuloma
    drives chronic host tissue destruction, necrosis, cavitation, and fibrotic
    scarring, which underlies the organ damage of tuberculosis, sarcoidosis, and
    other granulomatous diseases. Whether containment or destruction dominates
    is the consequence of the conserved granuloma-formation chain.
  role: consequence
  evidence:
  - reference: PMID:29400999
    reference_title: "The Formation and Function of Granulomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Granulomas evolved as protective responses to destroy or sequester
      particles but are frequently pathological in the context of foreign
      bodies, infections, and inflammatory diseases.
    explanation: >-
      Establishes the dual protective/pathological nature of granulomas, the
      consequence node of this module. Evidence source is OTHER because this is
      a review.
  - reference: PMID:34745105
    reference_title: "Targeting Molecular Inflammatory Pathways in Granuloma as Host-Directed Therapies for Tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This complex granulomatous host response can be modulated by Mtb to induce
      pathological changes damaging host lung tissues
    explanation: >-
      Documents that the granulomatous response can produce pathological
      tissue-damaging changes, the destructive arm of this consequence node.
      Evidence source is OTHER because this is a review.
treatments:
- name: TNF Inhibitor Therapy
  description: >-
    TNF-neutralizing biologics (e.g., infliximab, adalimumab) are used to treat
    non-infectious granulomatous diseases such as Crohn disease and refractory
    sarcoidosis. Because TNF is required to initiate and maintain the granuloma,
    its blockade impairs granuloma integrity - therapeutic when the granulomatous
    inflammation is sterile, but dangerous in latent infection, where it
    dissolves protective granulomas and reactivates tuberculosis (a class boxed
    warning). Represents the granuloma-formation drug-target design pattern for
    conforming disorders, acting on the TNF-driven macrophage-activation node
    rather than on the mature structure.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-TNF monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Th1 and TNF-Driven Macrophage Recruitment and Activation
    treatment_effect: INHIBITS
    description: >-
      TNF neutralization removes the non-redundant amplifier of the granulomatous
      response, impairing granuloma initiation and maintenance.
  evidence:
  - reference: PMID:18524936
    reference_title: "A role for tumour necrosis factor-alpha, complement C5 and interleukin-6 in the initiation and development of the mycobacterial cord factor trehalose 6,6'-dimycolate induced granulomatous response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TNF-alpha is critical for initiation of the granulomatous response, C5a is
      necessary for formation of cohesive granulomas, and IL-6 plays a key role
      in the granuloma maintenance response to mycobacterial TDM.
    explanation: >-
      Establishes TNF-alpha as critical for granuloma initiation, providing the
      target rationale for TNF-inhibitor therapy. Evidence source is
      MODEL_ORGANISM because the roles were dissected in cytokine-knockout mice.
  - reference: PMID:22379032
    reference_title: "Differential risk of tuberculosis reactivation among anti-TNF therapies is due to drug binding kinetics and permeability."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      drug binding to membrane-bound TNF critically impairs granuloma function
    explanation: >-
      A computational granuloma model shows that anti-TNF drug binding impairs
      granuloma function, confirming the TNF node as the drug target. Evidence
      source is COMPUTATIONAL because the finding is from an in silico model.

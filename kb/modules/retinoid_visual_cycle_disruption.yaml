name: Retinoid Visual Cycle Disruption Module
description: >-
  A conserved pathophysiology module for the inherited retinal diseases whose
  primary lesion lies in the retinoid (visual) cycle - the enzymatic relay
  running between the photoreceptor outer segment and the retinal pigment
  epithelium that regenerates the 11-cis-retinal chromophore consumed every time
  a photon is absorbed. Phototransduction spends chromophore; this cycle
  resupplies it, and clears the all-trans-retinal released when it is spent.
  A defect anywhere in the relay produces one rate-limiting state with two
  components that different genes weight differently: too little 11-cis-retinal
  reaching the opsins, and too much reactive retinoid intermediate left behind.
  The chromophore-supply arm (RPE65, LRAT, RDH5, RLBP1, RBP4/STRA6 retinol
  delivery) starves the pigment, leaving apo-opsin and profound rod insensitivity
  or, in the milder isomerase-independent steps, merely a dark adaptation that
  takes hours. The clearance arm (ABCA4, and the RDH8/RDH12 dehydrogenases) lets
  all-trans-retinal condense with phosphatidylethanolamine into bisretinoids such
  as A2E, which accumulate as retinal pigment epithelium lipofuscin and poison
  the cell that photoreceptors depend on. Both arms end in photoreceptor and RPE
  degeneration, which this module hands off to photoreceptor_degeneration rather
  than re-deriving.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "retinoid_visual_cycle_disruption#Chromophore Insufficiency and Retinoid
  Intermediate Accumulation"). Gene substitutions a conforming trigger node
  makes: RPE65 (all-trans-retinyl ester isomerohydrolase) and LRAT (retinol
  esterification) in Leber congenital amaurosis and early-onset severe retinal
  dystrophy; RDH5 (11-cis-retinol dehydrogenase) in fundus albipunctatus; RLBP1
  (CRALBP) in retinitis punctata albescens and Bothnia dystrophy; ABCA4
  (outer-segment flippase clearing N-retinylidene-PE) in Stargardt disease and
  ABCA4 retinopathy; RDH12 in early-onset severe retinal dystrophy; and STRA6 /
  RBP4 where the lesion is upstream retinol delivery to the RPE rather than the
  cycle itself.

  Which arm a conformer enters through matters and should be stated explicitly,
  because the two arms take OPPOSITE therapeutic directions. A
  chromophore-supply lesion is treated by restoring flux - RPE65 gene
  replacement, or artificial 9-cis-retinoid chromophore. A clearance lesion is
  treated by SLOWING flux - visual-cycle modulators and deuterated vitamin A
  reduce the substrate available to form bisretinoid. Wiring a Stargardt entry to
  an RPE65-style restorative treatment pattern, or vice versa, inverts the
  mechanism. The module's treatments block therefore carries both, each pinned to
  its own arm, and neither is inherited by conformers.

  SCOPE. This module covers chromophore regeneration and retinoid clearance. The
  cGMP signalling cascade that consumes the chromophore is
  phototransduction_cascade_dysfunction; the photoreceptor death programme
  downstream of either arm is photoreceptor_degeneration. Disorders commonly
  conform to two of the three in parallel.
pathophysiology:
- name: Visual Cycle Enzyme or Transporter Defect
  description: >-
    The initiating lesion is a variant in a gene encoding a component of the
    retinoid cycle. The affected protein may sit on the regeneration relay -
    LRAT esterifying all-trans-retinol, RPE65 isomerohydrolysing the ester to
    11-cis-retinol, RDH5 oxidising it to 11-cis-retinal, CRALBP chaperoning
    cis-retinoids between those steps - or on the clearance side, where ABCA4
    flips N-retinylidene-phosphatidylethanolamine out of the disc lumen and the
    retinol dehydrogenases reduce free all-trans-retinal. A lesion upstream of
    the eye entirely, in retinol delivery to the RPE, enters the same chain.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Retinoid metabolic process
    term:
      id: GO:0001523
      label: retinoid metabolic process
    modifier: ABNORMAL
  - preferred_term: Retinol metabolic process
    term:
      id: GO:0042572
      label: retinol metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23857173
    reference_title: "Vitamin A derivatives as treatment options for retinal degenerative diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Retina specific proteins carry out the majority of the visual cycle, and
      any significant interruption in this sequence of reactions is capable of
      causing varying degrees of blindness.
    explanation: >-
      States the module's premise directly: the cycle is executed by a defined
      set of retina-specific proteins, and a lesion in any of them is sufficient
      to cause visual loss. Evidence source is OTHER because this is a review.
  - reference: PMID:23857173
    reference_title: "Vitamin A derivatives as treatment options for retinal degenerative diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Deleterious mutations in these genes are identified in human retinal
      diseases that cause blindness, such as Leber congenital amaurosis (LCA)
      and retinitis pigmentosa (RP).
    explanation: >-
      Names LRAT and RPE65 specifically as the human disease genes behind the
      chromophore-supply arm of this trigger. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Impaired Retinoid Flux Between Photoreceptor and Retinal Pigment Epithelium
    causal_link_type: DIRECT

- name: Impaired Retinoid Flux Between Photoreceptor and Retinal Pigment Epithelium
  description: >-
    The visual cycle is a two-compartment relay: bleached all-trans-retinal
    leaves the photoreceptor outer segment, is processed through the retinal
    pigment epithelium, and returns as 11-cis-retinal to recombine with opsin.
    A defective step stalls that traffic. Substrate backs up behind the block -
    retinyl esters in LRAT-competent RPE65 deficiency, cis-retinoids in RDH5
    deficiency - and product falls short downstream. Because the relay crosses a
    cell boundary, the consequences are shared between two cell types that neither
    can escape: the photoreceptor is starved of chromophore while the RPE is left
    holding the intermediates.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:

    term:
      id: GO:0042574
      label: retinal metabolic process
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  locations:
  - preferred_term: pigmented layer of retina
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  evidence:
  - reference: PMID:23857173
    reference_title: "Vitamin A derivatives as treatment options for retinal degenerative diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A series of enzymatic reactions, located in both the photoreceptor outer
      segment and the retinal pigment epithelium, transform retinol into the
      visual chromophore 11-cis-retinal, regenerating visual pigments.
    explanation: >-
      Establishes the two-compartment relay whose interruption this node models,
      and locates the steps in the outer segment and the RPE as the description
      asserts. Evidence source is OTHER because this is a review.
  - reference: PMID:11418621
    reference_title: "Characterization of a dehydrogenase activity responsible for oxidation of 11-cis-retinol in the retinal pigment epithelium of mice with a disrupted RDH5 gene. A model for the human hereditary disease fundus albipunctatus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lack of 11-cis-RDH leads to an accumulation of cis-retinoids, particularly
      13-cis-isomers.
    explanation: >-
      Demonstrates the substrate backup this node asserts: removing one relay
      enzyme causes the retinoids upstream of it to accumulate in the RPE.
  downstream:
  - target: Chromophore Insufficiency and Retinoid Intermediate Accumulation
    causal_link_type: DIRECT

- name: Chromophore Insufficiency and Retinoid Intermediate Accumulation
  description: >-
    The rate-limiting, disorder-agnostic node, and the module's key conformance
    target. Every conforming disorder arrives at some mix of two deficits.
    Too little 11-cis-retinal reaches the opsins, so visual pigment cannot be
    regenerated at the rate light bleaches it - severe and constant when the
    isomerohydrolase step is lost, mild and unmasked only by a bright bleach
    when a redundant dehydrogenase step is lost. And too much reactive retinoid
    is left in the system, because all-trans-retinal that is neither reduced nor
    flipped out of the disc lumen condenses with phosphatidylethanolamine into
    bisretinoids. Which component dominates is set by where in the relay the
    lesion sits, and it is the reason two disorders in this module can look
    clinically opposite while sharing a mechanism.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Retinal (retinaldehyde) metabolic process
    term:
      id: GO:0042574
      label: retinal metabolic process
    modifier: ABNORMAL
  - preferred_term: Absorption of visible light by regenerated visual pigment
    term:
      id: GO:0016038
      label: absorption of visible light
    modifier: DECREASED
  evidence:
  - reference: PMID:11418621
    reference_title: "Characterization of a dehydrogenase activity responsible for oxidation of 11-cis-retinol in the retinal pigment epithelium of mice with a disrupted RDH5 gene. A model for the human hereditary disease fundus albipunctatus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the vertebrate retina, the final step of visual chromophore production
      is the oxidation of 11-cis-retinol to 11-cis-retinal.
    explanation: >-
      Identifies the chromophore whose supply this node asserts is the
      rate-limiting quantity, and the terminal step at which supply can fail.
  - reference: PMID:18048336
    reference_title: "Redundant and unique roles of retinol dehydrogenases in the mouse retina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results suggest that RDH8 and RDH12 are dispensable in support of the
      visual cycle but appear to be key components in clearance of free
      all-trans-retinal, thereby preventing A2E accumulation and photoreceptor
      cell death.
    explanation: >-
      Separates the node's two components experimentally: the same enzymes are
      dispensable for chromophore supply yet essential for clearance, which is
      why this module treats supply and clearance as two weights on one state
      rather than two mechanisms.
  downstream:
  - target: RPE Lipofuscin Loading and Retinal Pigment Epithelium Dysfunction
    causal_link_type: DIRECT
  - target: Delayed Dark Adaptation and Night Blindness
    causal_link_type: DIRECT

- name: RPE Lipofuscin Loading and Retinal Pigment Epithelium Dysfunction
  description: >-
    Bisretinoids formed from uncleared all-trans-retinal are transferred to the
    retinal pigment epithelium with each day's phagocytosed outer-segment discs.
    Being neither degradable nor exportable, they accumulate in RPE lysosomes as
    autofluorescent lipofuscin, whose photooxidation products damage the cell.
    A failing RPE then withdraws the phagocytic, metabolic and retinoid support
    that overlying photoreceptors cannot survive without, which is why a
    clearance-arm defect expressed in one cell type kills the other.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: Retinoid metabolic process
    term:
      id: GO:0001523
      label: retinoid metabolic process
    modifier: ABNORMAL
  locations:
  - preferred_term: pigmented layer of retina
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  evidence:
  - reference: PMID:42240816
    reference_title: "Update on the Management of ABCA4 Retinopathy (Stargardt Disease)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biallelic pathogenic variants in the ABCA4 gene cause impaired clearance of
      retinoid byproducts, leading to toxic bisretinoid accumulation, retinal
      pigment epithelium dysfunction, and progressive photoreceptor degeneration.
    explanation: >-
      States this node's whole causal sequence for the archetypal clearance-arm
      disorder: failed retinoid clearance, bisretinoid accumulation, RPE
      dysfunction, and photoreceptor loss. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Progressive Photoreceptor and Retinal Pigment Epithelium Degeneration
    causal_link_type: DIRECT

- name: Delayed Dark Adaptation and Night Blindness
  description: >-
    The direct functional consequence of chromophore insufficiency, and the
    module's most sensitive early readout. Recovering sensitivity after a bleach
    requires resynthesised 11-cis-retinal, so a stalled cycle is measured as
    prolonged dark adaptation before any structural change is visible. Severity
    scales with where the block sits: a redundant step such as RDH5 gives a
    strikingly mild, essentially stationary night blindness with a normal
    daytime retina, whereas loss of the isomerohydrolase gives severe congenital
    visual impairment. Rods are affected first and most because their pigment
    demand is highest, but cone dark adaptation is delayed as well.
  role: effector
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: Dark adaptation
    term:
      id: GO:1990603
      label: dark adaptation
    modifier: ABNORMAL
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:11418621
    reference_title: "Characterization of a dehydrogenase activity responsible for oxidation of 11-cis-retinol in the retinal pigment epithelium of mice with a disrupted RDH5 gene. A model for the human hereditary disease fundus albipunctatus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In humans, mutations in this gene are associated with fundus albipunctatus,
      a disease expressed by delayed dark adaptation of both cones and rods.
    explanation: >-
      Ties a specific relay-enzyme lesion to delayed dark adaptation in humans,
      and supports the claim that both photoreceptor classes are affected rather
      than rods alone.
  - reference: PMID:22736946
    reference_title: "Novel mutations in RDH5 cause fundus albipunctatus in two consanguineous Pakistani families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fundus albipunctatus (FA), a rare form of congenital stationary night
      blindness that is characterized by the presence of white dots in the
      midperiphery of the retina and delayed dark adaptation
    explanation: >-
      Supports the mild, stationary end of the severity range this node asserts:
      a redundant-step visual-cycle lesion presenting as congenital stationary
      night blindness with delayed dark adaptation.

- name: Progressive Photoreceptor and Retinal Pigment Epithelium Degeneration
  description: >-
    The terminal consequence, reached from either arm. Chromophore starvation
    leaves opsin unliganded, which is itself destabilising, and bisretinoid
    loading poisons the supporting epithelium; both routes end in loss of
    photoreceptors and of the RPE beneath them, with the atrophy distributed
    according to the lesion - macular in ABCA4 retinopathy, widespread in
    RPE65-associated disease. This node marks the seam to
    photoreceptor_degeneration, which models the death programme itself; it is
    not re-derived here, and a degenerating conformer should declare conformance
    to both modules.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:

    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:18048336
    reference_title: "Redundant and unique roles of retinol dehydrogenases in the mouse retina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Three-month-old Rdh8(-/-)Rdh12(-/-) mice characteristically displayed a
      slowly progressing rod-cone dystrophy accompanied by accumulation of
      N-retinylidene-N-retinylethanolamine (A2E), a toxic substance known to
      contribute to retinal degeneration.
    explanation: >-
      Shows the clearance arm reaching this terminal node in vivo, with the
      bisretinoid species named and progressive rod-cone dystrophy as the
      outcome.
  - reference: PMID:42240816
    reference_title: "Update on the Management of ABCA4 Retinopathy (Stargardt Disease)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ABCA4-associated retinopathies (Stargardt disease) are the most common
      inherited macular dystrophy and a leading cause of early onset central
      vision loss.
    explanation: >-
      Establishes the macular distribution and clinical weight of this endpoint
      for the archetypal clearance-arm disorder. Evidence source is OTHER because
      this is a review.

treatments:
- name: RPE65 Gene Replacement (Voretigene Neparvovec)
  description: >-
    Subretinal AAV2 delivery of human RPE65 to the retinal pigment epithelium,
    restoring isomerohydrolase activity and with it 11-cis-retinal supply. This
    is the drug-target pattern for the CHROMOPHORE-SUPPLY arm only: it works by
    increasing retinoid flux through the cycle, which is exactly the wrong
    direction for a clearance-arm disorder. It is a mechanism pattern here, not a
    treatment recommendation, and conforming disorders do not inherit it.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Chromophore Insufficiency and Retinoid Intermediate Accumulation
    treatment_effect: RESTORES
    description: >-
      Restoring RPE65 isomerohydrolase activity re-establishes 11-cis-retinal
      supply, acting on the supply component of the module's rate-limiting node.
    evidence:
    - reference: PMID:28712537
      reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Voretigene neparvovec gene replacement improved functional vision in
        RPE65-mediated inherited retinal dystrophy previously medically
        untreatable.
      explanation: >-
        Randomised phase 3 evidence that restoring the missing cycle enzyme
        improves function, establishing this node as a validated therapeutic
        target on the supply arm.
  evidence:
  - reference: PMID:28712537
    reference_title: "Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      13 (65%) of 20 intervention participants, but no control participants,
      passed MLMT at the lowest luminance level tested (1 lux), demonstrating
      maximum possible improvement.
    explanation: >-
      Quantifies the effect in the pivotal randomised trial: the primary
      functional-vision endpoint reached its ceiling in most treated
      participants and in no controls.

- name: Visual Cycle Modulation for the Retinoid Clearance Arm
  description: >-
    The mechanistic inverse of gene replacement. Where the lesion is failure to
    clear retinoid byproducts, the therapeutic aim is to REDUCE flux through the
    cycle so less all-trans-retinal is available to form bisretinoid - visual
    cycle modulators, deuterated vitamin A analogues, and retinol-binding-protein
    antagonists all act this way. Recorded here so the module carries both
    directions explicitly and a conformer cannot pick up the wrong one; it is a
    mechanism pattern, not a treatment recommendation, and no agent in this class
    is approved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Chromophore Insufficiency and Retinoid Intermediate Accumulation
    treatment_effect: INHIBITS
    description: >-
      Slowing retinoid turnover lowers the pool of free all-trans-retinal
      available for bisretinoid condensation, acting on the accumulation
      component of the same rate-limiting node that gene replacement acts on
      from the opposite direction.
    evidence:
    - reference: PMID:42240816
      reference_title: "Update on the Management of ABCA4 Retinopathy (Stargardt Disease)."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Disease-modifying strategies under active investigation include
        visual-cycle modulation, deuterated vitamin A analogs, retinol-binding
        protein antagonists, gene augmentation and editing approaches, antisense
        oligonucleotides, and cell-based regenerative therapies.
      explanation: >-
        Names the flux-reducing strategies that define this arm's drug-target
        pattern. Marked PARTIAL because the same review describes them as under
        investigation rather than established.
  evidence:
  - reference: PMID:42240816
    reference_title: "Update on the Management of ABCA4 Retinopathy (Stargardt Disease)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Current management remains supportive and includes low-vision
      rehabilitation and counseling.
    explanation: >-
      States the honest current position for the clearance arm - no
      disease-modifying therapy is established - so this pattern is recorded as
      a mechanism target and not as care guidance.

discussions:
- discussion_id: visual_cycle_arm_severity_determinants
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does an equivalent-looking block in the retinoid relay produce stationary
    night blindness at one step and severe congenital blindness at another, and
    is enzymatic redundancy sufficient to explain the difference?
  attaches_to:
  - "pathophysiology#Chromophore Insufficiency and Retinoid Intermediate Accumulation"
  - "pathophysiology#Delayed Dark Adaptation and Night Blindness"
  rationale: >-
    Loss of RDH5 gives fundus albipunctatus, a mild stationary night blindness
    with preserved daytime vision, whereas loss of RPE65 gives Leber congenital
    amaurosis. Mouse work shows retinol dehydrogenases compensate for each other
    such that even triple knockouts still regenerate chromophore, which suggests
    redundancy explains the mild end. But it does not follow that redundancy
    explains the whole severity range, and the RDH8/RDH12 result shows the same
    enzymes are non-redundant for clearance while redundant for supply. Without
    resolving this, a conformer cannot predict from its lesion whether it should
    also wire to photoreceptor_degeneration.
  proposed_experiments:
  - experiment_id: visual_cycle_flux_severity_series
    name: Quantitative retinoid flux measurement across a graded allelic series
    description: >-
      Measure chromophore regeneration rate and free all-trans-retinal pool size
      in patient-derived RPE/photoreceptor co-culture across lesions at
      successive relay steps, testing whether steady-state flux deficit rather
      than the identity of the blocked step predicts clinical severity and
      whether the disorder degenerates.

name: Pleuropneumonia and Parapneumonic Empyema Formation Module
description: >-
  Conserved mechanism for pleuropneumonia and the parapneumonic effusion and
  empyema that follow pneumonia. The chain runs: pneumonic inflammation next to
  the pleura; mesothelial activation and raised pleural permeability (exudative
  stage); a procoagulant, low-fibrinolysis shift that deposits fibrin and
  loculates the fluid (the key conformance target); fibrin and purulent fluid
  accumulation (empyema); and organisation into a fibrous pleural peel. The
  cascade is shared across pneumonias of unrelated organisms, so disorder
  entries substitute the organism and conform to the shared nodes. Complements
  fibrotic_response (its organising node conforms there) and is distinct from
  tuberculous and malignant pleural disease.
category: Module
module_categories:
- INFECTIOUS_DISEASE
creation_date: "2026-10-03T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease. Do NOT create a Pleuropneumonia or
  Empyema Disease entry; MONDO:0001940 (pleuropneumonia) is an organism-agnostic
  organ syndrome, so per design decision 3e/R4 it is a module, not a disorder.
  Modules bind GO and CL terms only (plus UBERON locations); organism, chemistry
  and disease identity are described in prose. The key conformance target is
  "Intrapleural Procoagulant Shift with Suppressed Fibrinolysis". Out of scope:
  tuberculous pleurisy (granulomatous, mechanistically distinct), malignant
  effusion, and post-surgical/traumatic empyema (they share late stages but not
  the pneumonic trigger). Xogenesis anchor: the terminal output is an empyema
  (MPATH:609), an OGMS:0000079 portion of pathological body substance arising by
  OGMS:0000081 pathological derivation; process genus OGMS:0000061 pathological
  bodily process. SNOMED "Morphologically abnormal structure" (49755003) is an
  external census guide only and is not bound here. "Pleuropneumonia" is also a
  veterinary term (e.g. Actinobacillus pleuropneumoniae in pigs, equine
  pleuropneumonia); those animal syndromes are out of scope as conformance
  targets, though animal-model evidence can still support the human nodes with
  evidence_source: MODEL_ORGANISM.
pathophysiology:
- name: Pneumonic Parenchymal Inflammation Adjacent to the Pleura
  role: trigger
  biological_scale: TISSUE
  description: >-
    The trigger is an acute pneumonic inflammatory process in lung parenchyma
    that lies against the visceral pleura. Proinflammatory signalling at this
    front (IL-8, TNF-alpha) extends to the pleural surface. Conforming entries
    substitute the organism driving the pneumonia.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The inflammatory process of the pulmonary parenchyma extends to the visceral pleura causing changes to the mesothelial cells lining the pleura, allowing increased fluid movement."
    explanation: States that parenchymal pneumonic inflammation extends to the visceral pleura, the module's initiating step.
  - reference: PMID:42454209
    reference_title: "Role of Thoracic Ultrasound in the Management of Parapneumonic Effusion According to the Proposed Algorithm/Classification in Pediatric Pneumonia: A Single Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Ultrasound revealed pulmonary consolidation in all cases."
    explanation: In a parapneumonic-effusion cohort every case had adjacent pulmonary consolidation, supporting the pneumonic parenchymal process as the substrate.
  downstream:
  - target: Visceral Pleural Mesothelial Activation and Barrier Injury
    causal_link_type: DIRECT
- name: Visceral Pleural Mesothelial Activation and Barrier Injury
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Pleural mesothelial cells exposed to bacteria or bacterial products release
    angiogenic and inflammatory mediators (VEGF, IL-8) and lose monolayer
    barrier integrity. VEGF raises pleural vascular and mesothelial
    permeability, opening the route for protein-rich fluid into the pleural
    space.
  cell_types:
  - preferred_term: mesothelial cell of visceral pleura
    term:
      id: CL:1000493
      label: mesothelial cell of visceral pleura
  biological_processes:
  - preferred_term: positive regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
  locations:
  - preferred_term: visceral pleura
    term:
      id: UBERON:0002401
      label: visceral pleura
  evidence:
  - reference: PMID:23308155
    reference_title: "Clinical importance of angiogenic cytokines, fibrinolytic activity and effusion size in parapneumonic effusions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "Exposure of pleural mesothelial cells to bacteria or lipopolysaccharide may increase release of angiogenic factors, including vascular endothelial growth factor (VEGF) and interleukin (IL)-8, induce vascular hyperpermeability and pleural fluid production, activate coagulation cascade, and repress fibrinolytic activity within the pleural cavity"
    explanation: Directly states mesothelial exposure to bacteria raises permeability and fluid production and shifts the pleural coagulation/fibrinolysis balance.
  - reference: PMID:11404254
    reference_title: "Bacterial induction of pleural mesothelial monolayer barrier dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Our results suggest that bacterial pathogens induce VEGF release in mesothelial cells and alter mesothelial permeability, leading to protein exudation in empyema."
    explanation: In a mesothelial monolayer model, bacterial infection raises VEGF and permeability, the mechanism of barrier injury at this node.
  downstream:
  - target: Exudative Parapneumonic Effusion
    causal_link_type: DIRECT
  - target: Intrapleural Procoagulant Shift with Suppressed Fibrinolysis
    causal_link_type: DIRECT
- name: Exudative Parapneumonic Effusion
  role: effector
  biological_scale: ORGANISM
  description: >-
    Raised permeability lets protein-rich fluid and inflammatory cells pour into
    the pleural space (stage I). The fluid is clear, free-flowing and sterile,
    with normal pH and glucose. Many such effusions resolve with antibiotics
    alone; progression depends on the downstream fibrin and invasion steps.
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "In the early exudative stage there is a rapid outpouring of fluid and inflammatory cells into the pleural space due to increased capillary microvascular permeability."
    explanation: Defines the exudative (stage I) effusion as a permeability-driven outpouring of fluid and cells.
  - reference: PMID:10413724
    reference_title: "Vascular endothelial growth factor (VEGF) in inflammatory and malignant pleural effusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "VEGF levels are raised in the majority of exudative effusions, implying a pathogenic role for this molecule in the development of pleural effusions."
    explanation: Human pleural-fluid study linking raised VEGF to formation of exudative effusions, the mediator named at the upstream node.
  downstream:
  - target: Bacterial Pleural Invasion and Purulent Progression
    causal_link_type: DIRECT
- name: Intrapleural Procoagulant Shift with Suppressed Fibrinolysis
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The rate-limiting, disorder-agnostic step every conformer funnels through.
    Within the effusion, coagulation is activated while fibrinolysis is
    suppressed, chiefly by elevated plasminogen activator inhibitor-1 (PAI-1)
    against relatively reduced tissue plasminogen activator (tPA). The resulting
    PAI-1/tPA imbalance drives fibrin formation and is the target of intrapleural
    fibrinolytic therapy.
  biological_processes:
  - preferred_term: negative regulation of fibrinolysis
    modifier: INCREASED
    term:
      id: GO:0051918
      label: negative regulation of fibrinolysis
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:23308155
    reference_title: "Clinical importance of angiogenic cytokines, fibrinolytic activity and effusion size in parapneumonic effusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "An imbalance between PAI-1 and tissue type plasminogen activator (tPA) may elicit fibrin formation and subsequent pleural fluid loculation and fibrosis"
    explanation: States that the PAI-1/tPA imbalance at this node drives the downstream fibrin, loculation and fibrosis.
  - reference: PMID:29345198
    reference_title: "Fibrin turnover and pleural organization: bench to bedside."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Loculation is promoted and then potentiated by inhibition of local fibrinolysis, in large part by elaboration of elevated levels of PAI-1."
    explanation: Identifies suppressed local fibrinolysis via elevated PAI-1 as the driver of loculation, the central effector claim.
  downstream:
  - target: Fibrin Deposition and Loculation
    causal_link_type: DIRECT
- name: Fibrin Deposition and Loculation
  role: effector
  biological_scale: ORGANISM
  description: >-
    With fibrinolysis suppressed, fibrin clots and membranes are laid down
    across the pleural space, dividing the effusion into isolated loculi
    (stage II). Septation traps fluid that can no longer be drained by a single
    tube, which is why loculated collections are the ones that fail simple
    drainage.
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    modifier: INCREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "This next stage is characterized by deposition of fibrin clots and fibrin membranes in the pleural space, leading to loculations and isolated collections of fluid."
    explanation: Defines the fibrinopurulent stage as fibrin deposition producing loculated fluid collections.
  - reference: PMID:29345198
    reference_title: "Fibrin turnover and pleural organization: bench to bedside."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Pleural injury proceeds through a phase of acute inflammation followed by organization, a process that involves the deposition of intrapleural fibrin and its remodeling."
    explanation: Places intrapleural fibrin deposition on the path from acute inflammation to organisation.
  downstream:
  - target: Empyema (Pleural Pus Accumulation)
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Organizing Pleural Peel and Mesothelial-Mesenchymal Transition
    causal_link_type: DIRECT
- name: Bacterial Pleural Invasion and Purulent Progression
  role: effector
  biological_scale: ORGANISM
  description: >-
    Bacteria cross from the parenchyma into the pleural fluid, driving neutrophil
    influx and phagocytosis. Neutrophil metabolism and bacterial killing acidify
    the fluid and consume glucose (low pH, low glucose, high LDH), marking the
    complicated parapneumonic effusion. Pleural-fluid profiling shows severe
    effusions are enriched for neutrophil-driven inflammatory programmes.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The combination of bacterial invasion and increased inflammatory response leads to increased lactic acid and carbon dioxide production, resulting in a fall in pleural fluid pH, increased glucose metabolism and a rise in LDH, consistent with “complicated” parapneumonic effusion."
    explanation: Links bacterial invasion and neutrophilic inflammation to the pH/glucose/LDH changes defining a complicated effusion.
  - reference: PMID:42277830
    reference_title: "Identifying molecular signatures of parapneumonic effusion reveals HMGB2 as the disease progression biomarker."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Upregulated gene signatures associated with disease progression in severe PPE were enriched in neutrophil degranulation, glycolysis/gluconeogenesis, HIF-1 signaling, and inflammatory response pathways."
    explanation: Pleural-fluid transcriptomics shows severe effusion progression is driven by neutrophil-degranulation and inflammatory programmes.
  - reference: PMID:16840746
    reference_title: "The bacteriology of pleural infection by genetic and standard methods and its mortality significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Approximately 50% of community-acquired infections were streptococcal, and 20% included anaerobic bacteria."
    explanation: Shows pleural infection is caused by a diverse set of organisms, supporting the module's organism-agnostic scope at the invasion step.
  downstream:
  - target: Empyema (Pleural Pus Accumulation)
    causal_link_type: DIRECT
- name: Empyema (Pleural Pus Accumulation)
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The terminal fluid state: frank pus in the pleural space, defined by pus or
    bacteria in the pleural cavity. It is the fibrinopurulent process carried to
    its endpoint, and pleural-fluid profiling shows the empyema stage is
    enriched for the most intense neutrophil-driven, pro-inflammatory programmes,
    including neutrophil extracellular trap formation. This is the Xogenesis
    output of the module (see notes).
  biological_processes:
  - preferred_term: neutrophil extracellular trap formation
    modifier: INCREASED
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Empyema is defined by the presence of bacteria or pus in the pleural space."
    explanation: Gives the defining criterion of empyema, the module's terminal structure.
  - reference: PMID:42277830
    reference_title: "Identifying molecular signatures of parapneumonic effusion reveals HMGB2 as the disease progression biomarker."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Patients with empyema exhibited significant enrichment of pathways in relation to IFN signaling, cytokine storm, pyroptosis, cachexia, and neutrophil extracellular trap formation, suggesting an amplified inflammatory and immunopathological response at the advanced stage of PPE"
    explanation: Shows the empyema stage carries the most amplified neutrophil-driven inflammatory programmes, including NET formation, grounding the DNase arm of intrapleural therapy.
  downstream:
  - target: Organizing Pleural Peel and Mesothelial-Mesenchymal Transition
    causal_link_type: DIRECT
- name: Organizing Pleural Peel and Mesothelial-Mesenchymal Transition
  role: consequence
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >-
    If the purulent, fibrin-laden fluid is not cleared, the pleura organises
    (stage III). Pleural mesothelial cells undergo mesothelial-mesenchymal
    transition into matrix-producing myofibroblasts, and fibroblasts invade and
    lay down collagen, forming a thick fibrous peel that can encase the lung
    ("trapped lung"). This node specialises the generic fibrotic_response
    mesenchymal-activation step to the pleural mesothelium.
  notes: >-
    GO:0001837 epithelial to mesenchymal transition is used as an approximation
    for mesothelial-mesenchymal transition (MesoMT); a GO search for a
    mesothelial-specific term returned only an obsolete developmental-signalling
    class (GO:0061142), so no better-fitting term exists.
  cell_types:
  - preferred_term: mesothelial cell of visceral pleura
    term:
      id: CL:1000493
      label: mesothelial cell of visceral pleura
  - preferred_term: myofibroblast cell
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: visceral pleura
    term:
      id: UBERON:0002401
      label: visceral pleura
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "This final stage is characterized by fibroblasts that proliferate and invade the pleural fluid from both the visceral and parietal pleura, forming a thick pleural peel."
    explanation: Defines the organising stage as fibroblast proliferation forming a pleural peel.
  - reference: PMID:29345198
    reference_title: "Fibrin turnover and pleural organization: bench to bedside."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Through a process termed mesomesenchymal transition (MesoMT), mesothelial cells become matrix producing myofibroblasts."
    explanation: Names mesothelial-mesenchymal transition into myofibroblasts as the cellular basis of pleural organisation.
  - reference: PMID:29073967
    reference_title: "Inhibition of Glycogen Synthase Kinase 3β Blocks Mesomesenchymal Transition and Attenuates Streptococcus pneumonia-Mediated Pleural Injury in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Pleural thickening was also notably reduced in 9ING41-treated mice"
    explanation: In a mouse Streptococcus pneumoniae empyema model, blocking MesoMT (GSK-3beta inhibitor 9ING41) reduced pleural thickening, supporting MesoMT as the driver of the pleural peel.
treatments:
- name: Intrapleural Fibrinolytic and DNase Therapy (tPA plus DNase)
  description: >-
    Combined intrapleural tissue plasminogen activator (tPA, alteplase) and human
    recombinant DNase (dornase alfa) is the drug-target design for this module,
    and the benefit requires both arms. tPA restores local fibrinolysis against
    the suppressed, PAI-1-dominated state at the central-effector node, dissolving
    fibrin septations; DNase degrades the extracellular DNA (neutrophil
    extracellular traps) that makes empyema pus viscous, acting on the downstream
    empyema node. In the MIST2 randomized trial the combination lowered
    radiographic pleural opacity and surgical referral, whereas tPA alone (the
    procoagulant-node arm) and DNase alone did not, which is why both nodes are
    targeted together rather than either alone.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alteplase (tissue plasminogen activator)
      term:
        id: NCIT:C39607
        label: Alteplase
    - preferred_term: dornase alfa (recombinant human DNase)
      term:
        id: NCIT:C81664
        label: Dornase Alfa
  target_mechanisms:
  - target: Intrapleural Procoagulant Shift with Suppressed Fibrinolysis
    treatment_effect: INHIBITS
    description: >-
      The tPA arm restores fibrinolysis against the PAI-1-dominated procoagulant
      state, breaking down the fibrin that loculates the effusion.
  - target: Empyema (Pleural Pus Accumulation)
    treatment_effect: INHIBITS
    description: >-
      The DNase arm degrades the extracellular DNA (neutrophil extracellular
      traps) that makes empyema pus viscous, easing drainage.
  evidence:
  - reference: PMID:21830966
    reference_title: "Intrapleural use of tissue plasminogen activator and DNase in pleural infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The frequency of surgical referral at 3 months was lower in the t-PA-DNase group than in the placebo group"
    explanation: The MIST2 randomized trial shows combined intrapleural tPA-DNase reduced surgical referral, validating the two-arm design.
- name: Intrapleural Fibrinolytic Monotherapy
  description: >-
    An intrapleural fibrinolytic agent given alone, without DNase. The MIST1
    randomized trial of intrapleural streptokinase found no reduction in death or
    need for surgery, so fibrinolytic monotherapy is not effective and is the
    negative counterpoint to the two-arm tPA-DNase design above.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: streptokinase
      term:
        id: NCIT:C152436
        label: Streptokinase
  target_mechanisms:
  - target: Intrapleural Procoagulant Shift with Suppressed Fibrinolysis
    treatment_effect: INHIBITS
    description: >-
      A fibrinolytic alone is intended to restore pleural fibrinolysis, but in
      MIST1 this did not translate into clinical benefit.
  evidence:
  - reference: PMID:15745977
    reference_title: "U.K. Controlled trial of intrapleural streptokinase for pleural infection."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "there was no significant difference between the groups in the proportion of patients who died or needed surgery"
    explanation: >-
      MIST1 refutes intrapleural fibrinolytic monotherapy; streptokinase alone
      gave no reduction in death or need for surgery.

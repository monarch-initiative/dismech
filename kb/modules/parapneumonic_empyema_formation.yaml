name: Pleuropneumonia and Parapneumonic Empyema Formation Module
description: >-
  A conserved pathophysiology module for pleuropneumonia: the extension of
  pneumonic inflammation from the lung parenchyma to the adjacent visceral
  pleura, producing a parapneumonic effusion that can progress through an
  exudative stage, a fibrinopurulent stage with fibrin deposition and
  loculation, and an organizing stage with pleural peel formation, culminating
  in empyema (pus in the pleural space). The cascade is shared across
  pneumonias caused by unrelated organisms.
category: Module
creation_date: "2026-10-03T00:00:00Z"
pathophysiology:
- name: Pneumonic Parenchymal Inflammation Adjacent to the Pleura
  role: trigger

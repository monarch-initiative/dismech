name: REM Sleep Atonia Control Failure Module
description: >-
  A conserved brainstem-circuit mechanism module for failure of the skeletal
  muscle atonia that normally accompanies REM sleep. REM sleep is generated by a
  mutually inhibitory pontine flip-flop switch, and the REM-on side contains two
  anatomically separate glutamatergic output populations: one ascending to the
  basal forebrain, which produces the EEG features of REM sleep, and one
  descending from the sublaterodorsal nucleus to ventromedial medullary and
  spinal inhibitory premotor neurons, which produces atonia. Because the two
  outputs are independent, they can fail independently - and that dissociability
  is the anatomical fact this module exists to record. Degeneration or lesion of
  the descending limb leaves REM sleep otherwise intact while removing its
  paralysis, so motor programmes generated during dreaming reach the muscles:
  REM sleep without atonia, then dream enactment, then injury. In older adults
  the commonest cause of that degeneration is an evolving synucleinopathy, which
  makes the syndrome a prodromal marker as well as a parasomnia.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "rem_sleep_atonia_control_failure#Failure of REM Sleep Skeletal Muscle Atonia",
  the key conformance target and rate-limiting step).

  WHAT CONFORMANCE REQUIRES. Polysomnographically demonstrated REM sleep without
  atonia is the entry requirement, and it is a specific measurement - excess
  tonic or phasic chin (with or without limb) electromyographic activity scored
  during REM sleep. Nocturnal motor behaviour alone does not qualify and must
  not be conformed here, because the differential is exactly what this module
  distinguishes: NREM parasomnias (sleepwalking, confusional arousals) arise
  from incomplete arousal out of slow-wave sleep with atonia never having been
  engaged, and nocturnal frontal-lobe/sleep-related hypermotor seizures are
  epileptic. Both produce complex nocturnal movement with a fully intact
  atonia circuit.

  THE OPPOSITE FAILURE OF THE SAME CIRCUIT. Cataplexy is this machinery
  intruding into wakefulness; REM sleep behaviour disorder is the same machinery
  failing during REM sleep. Narcolepsy type 1 has both, which is not a paradox
  but a consequence of losing the orexinergic input that holds the switch
  stable. A narcolepsy entry curating both should conform to this module for the
  atonia failure and to orexin_arousal_instability for the state instability,
  rather than blending them - the modules make different claims and are
  separately falsifiable.

  TWO AETIOLOGICAL ROUTES, ONE MECHANISM. The degenerative route
  (alpha-synuclein pathology reaching the pontine atonia circuit, ahead of the
  nigrostriatal and cortical involvement that defines the overt disease) and the
  pharmacological route (serotonergic and noradrenergic antidepressants, which
  unmask or induce REM sleep without atonia) converge on the same central node.
  A conforming entry should say which it evidences, because only the first
  carries prodromal significance.

  TREATMENT PATTERN IS SYMPTOMATIC, AND SAYING SO IS THE POINT. Clonazepam and
  melatonin act on the effector node - they suppress the behaviours and reduce
  injury - and do not act on the trigger. Nothing available modifies the
  underlying degeneration, and a conforming entry must not present behavioural
  control as disease modification. The AASM recommendations for both agents are
  CONDITIONAL, not strong.

  SCOPE BOUNDARIES. Distinct from parkinsonism_dopaminergic_degeneration, which
  models the nigrostriatal arm of the same underlying synucleinopathy at a
  different site and a later stage; an entry may conform to both, and their
  temporal separation is the clinically useful part. Not an Xogenesis module - a
  normal inhibitory process fails, nothing pathological is formed (the
  alpha-synuclein aggregate itself belongs to amyloidogenesis and the
  synucleinopathy entries).
pathophysiology:
- name: Lesion of the Pontine REM-Atonia Generator
  description: >-
    The trigger is loss of function of the REM-on glutamatergic neurons of the
    sublaterodorsal nucleus (the rodent term; subcoeruleus in cat, and the
    homologous region in humans) or of their descending projection. Human
    evidence comes from the small number of cases in which structural brainstem
    lesions produce the syndrome, and consistently implicates the dorsal midbrain
    and pons. In the far commoner age-related form the lesion is degenerative
    rather than structural: alpha-synuclein pathology involving the pontine
    tegmentum, at a Braak stage that precedes nigral and cortical involvement.
    Conforming disorder nodes substitute the disorder-specific lesion - evolving
    synucleinopathy, a structural pontine lesion (stroke, demyelination, tumour),
    the orexin-deficiency-associated instability of narcolepsy type 1, or
    antidepressant exposure.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: glutamatergic REM-on neuron of the sublaterodorsal nucleus
    term:
      id: CL:0000540
      label: neuron
    modifier: DECREASED
  locations:
  - preferred_term: sublaterodorsal nucleus
    term:
      id: UBERON:8440035
      label: sublaterodorsal nucleus
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  evidence:
  - reference: PMID:17412731
    reference_title: Pathophysiology of REM sleep behaviour disorder and relevance to neurodegenerative disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The structure in man analogous to the subcoeruleus region in cat and
      sublaterodorsal nucleus in rat is proposed as the nucleus (and its
      associated efferent and afferent pathways) crucial to RBD pathophysiology.
    explanation: >-
      Localises the trigger lesion to a specific brainstem nucleus and its
      pathways, which is what makes this a defined module rather than a general
      brainstem claim.
  - reference: PMID:17412731
    reference_title: Pathophysiology of REM sleep behaviour disorder and relevance to neurodegenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging data from the few published human cases with RBD associated
      with structural lesions in the brainstem are presented, in which the dorsal
      midbrain and pons are implicated.
    explanation: >-
      The human lesion evidence for this node, and the reason the animal
      circuitry is taken to translate: a discrete structural lesion at the
      homologous site reproduces the syndrome.
  downstream:
  - target: Loss of Descending Glutamatergic Drive to Inhibitory Premotor Neurons
    description: >-
      Loss of the REM-on population removes the excitatory drive its descending
      axons carry to medullary and spinal inhibitory premotor neurons.
    causal_link_type: DIRECT

- name: Loss of Descending Glutamatergic Drive to Inhibitory Premotor Neurons
  description: >-
    Atonia is not a passive withdrawal of excitation but an active inhibition:
    the descending glutamatergic limb excites glycinergic and GABAergic premotor
    neurons in the ventromedial medulla and spinal cord, which hyperpolarise
    skeletal motor neurons. Losing the drive therefore releases motor neurons
    from an inhibition that should be present, rather than merely failing to
    quiet them. This node is where the module's central anatomical claim sits:
    this descending pathway is separate from the ascending pathway that generates
    the EEG features of REM sleep, so it can be lost while REM sleep itself
    continues normally.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: DECREASED
  - preferred_term: inhibitory regulation of skeletal motor neuron output
    term:
      id: GO:0006937
      label: regulation of muscle contraction
    modifier: DECREASED
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  evidence:
  - reference: PMID:17884926
    reference_title: "The pontine REM switch: past and present."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the REM-on area are two populations of glutamatergic neurons, the first
      of which projects to the basal forebrain and regulates EEG components of
      REM sleep and the second of which projects to the ventromedial medulla and
      spinal cord and regulates atonia during REM sleep.
    explanation: >-
      The anatomical basis of the whole module: two separate output populations,
      one for EEG and one for atonia, which is what permits atonia to fail in
      isolation.
  - reference: PMID:17884926
    reference_title: "The pontine REM switch: past and present."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings demonstrating independent pathways mediating atonia and the
      EEG components of REM provide a basis for their occasional dissociation in
      pathological states, e.g. REM sleep behaviour disorder.
    explanation: >-
      States the dissociation explicitly and names this disorder as its
      pathological instance, which is the claim the module's central node
      encodes.
  downstream:
  - target: Failure of REM Sleep Skeletal Muscle Atonia
    description: >-
      Without descending excitation of the inhibitory premotor pool, skeletal
      motor neurons are not hyperpolarised during REM sleep and muscle tone
      persists.
    causal_link_type: DIRECT

- name: Failure of REM Sleep Skeletal Muscle Atonia
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target,
    measurable as REM sleep without atonia: excess tonic or phasic
    electromyographic activity during scored REM sleep. It is a graded and
    quantifiable trait rather than a binary one, which matters clinically -
    quantified atonia loss is itself a predictor of progression in the
    degenerative form. Crucially, this node is separable from the clinical
    behaviours below it: REM sleep without atonia can be present without dream
    enactment, and a conforming entry should say which of the two it is
    evidencing, since only the electrophysiological finding is required for
    conformance.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: REM sleep
    term:
      id: GO:0042747
      label: circadian sleep/wake cycle, REM sleep
    modifier: ABNORMAL
  - preferred_term: skeletal muscle contraction during REM sleep
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: INCREASED
  evidence:
  - reference: PMID:30166532
    reference_title: REM sleep behaviour disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rapid eye movement (REM) sleep behaviour disorder (RBD) is a parasomnia
      that is characterized by loss of muscle atonia during REM sleep (known as
      REM sleep without atonia, or RSWA) and abnormal behaviours occurring during
      REM sleep, often as dream enactments that can cause injury.
    explanation: >-
      Defines the node and its polysomnographic name, and separates the
      electrophysiological finding from the behavioural one, which is the
      distinction the node description requires conformers to keep.
  - reference: PMID:30166532
    reference_title: REM sleep behaviour disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A clinical history of dream enactment or complex motor behaviours together
      with the presence of muscle activity during REM sleep confirmed by video
      polysomnography are mandatory for a definite RBD diagnosis.
    explanation: >-
      Establishes the measurement standard for this node - scored muscle
      activity during REM sleep on video polysomnography - which is what a
      conforming entry must be able to cite.
  downstream:
  - target: Motor Enactment of Dream Content During REM Sleep
    description: >-
      With motor neurons no longer inhibited, the motor programmes generated
      during REM dreaming are executed rather than suppressed.
    causal_link_type: DIRECT

- name: Motor Enactment of Dream Content During REM Sleep
  description: >-
    Released motor output takes the form of behaviour matched to dream content
    rather than random movement, which is the observation that ties the node to
    REM physiology rather than to a nonspecific motor release. Because REM dream
    content in this population is disproportionately confrontational, the
    behaviours are frequently violent - punching, kicking, leaping from bed - and
    the injury risk falls on both patient and bed partner. Movements are not
    preceded by the confusional arousal typical of an NREM parasomnia, and
    patients wake alert with dream recall, which is the bedside discriminator.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: muscle contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: INCREASED
  evidence:
  - reference: PMID:17412731
    reference_title: Pathophysiology of REM sleep behaviour disorder and relevance to neurodegenerative disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      REM sleep behaviour disorder (RBD) is a parasomnia characterized by the
      loss of normal skeletal muscle atonia during REM sleep with prominent motor
      activity accompanying dreaming.
    explanation: >-
      Links the released motor activity specifically to dreaming, which is what
      makes this node an enactment of REM content rather than a generic motor
      release.
  downstream:
  - target: Injury Risk and Prodromal Neurodegeneration
    description: >-
      Enacted behaviour causes injury; and where the trigger lesion is
      degenerative, the same pathology progresses to involve nigral and cortical
      structures.
    causal_link_type: DIRECT

- name: Injury Risk and Prodromal Neurodegeneration
  description: >-
    Two consequences that must be kept apart. The first is immediate and
    mechanical: sleep-related injury to patient and bed partner, which is what
    treatment addresses. The second follows only from the degenerative route and
    is of a different kind - the pontine lesion is an early stage of a
    synucleinopathy whose later stages are Parkinson disease, dementia with Lewy
    bodies, or multiple system atrophy, so the parasomnia is a prodromal marker
    with a long lead time. Conversion is high but neither immediate nor
    universal, and the numbers matter: roughly 6% per year, with about
    three-quarters converting over twelve years. A conforming entry whose trigger
    is pharmacological or lesional should NOT inherit this second consequence.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30789229
    reference_title: "Risk and predictors of dementia and parkinsonism in idiopathic REM sleep behaviour disorder: a multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall conversion rate from iRBD to an overt neurodegenerative
      syndrome was 6.3% per year, with 73.5% converting after 12-year follow-up.
    explanation: >-
      Quantifies the prodromal consequence in a 1280-patient multicentre cohort,
      which is what allows the module to state the risk as a rate rather than as
      an association.
  - reference: PMID:30789229
    reference_title: "Risk and predictors of dementia and parkinsonism in idiopathic REM sleep behaviour disorder: a multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic REM sleep behaviour disorder (iRBD) is a powerful early sign of
      Parkinson's disease, dementia with Lewy bodies, and multiple system
      atrophy.
    explanation: >-
      Names the three destination diseases, which is what makes this node the
      link between the module and the synucleinopathy entries.
  - reference: PMID:30789229
    reference_title: "Risk and predictors of dementia and parkinsonism in idiopathic REM sleep behaviour disorder: a multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      colour vision abnormalities (HR = 1.69), constipation (HR = 1.67), REM
      atonia loss (HR = 1.54), and age (HR = 1.54)
    explanation: >-
      Cited for the finding that quantified atonia loss is itself among the
      significant predictors of phenoconversion, which is the evidence that the
      module's central node is graded rather than binary and carries prognostic
      information.
treatments:
- name: Clonazepam
  description: >-
    A benzodiazepine used at low dose to suppress the enacted behaviours. It acts
    on the effector node, reducing the motor output and injury risk without
    restoring atonia at the central node and without touching the trigger lesion.
    The AASM recommendation is conditional rather than strong, and the mechanism
    of benefit in this indication remains incompletely explained - it reduces
    behaviours more reliably than it normalises REM electromyographic activity.
    Conforming disorders do not inherit it as a recommendation, and it is
    explicitly not disease-modifying.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clonazepam
      term:
        id: CHEBI:3756
        label: clonazepam
  target_mechanisms:
  - target: Motor Enactment of Dream Content During REM Sleep
    treatment_effect: INHIBITS
    description: >-
      Suppresses the released motor behaviours, reducing injury, without acting
      on the upstream atonia-generating circuit.
  evidence:
  - reference: PMID:36515157
    reference_title: "Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The AASM suggests that clinicians use clonazepam (vs no treatment) for the
      treatment of isolated RBD in adults. (CONDITIONAL).
    explanation: >-
      Cited as PARTIAL because the guideline's own strength assignment is
      conditional: the agent is recommended, but on evidence the task force
      graded as not warranting a strong recommendation.
- name: Immediate-Release Melatonin
  description: >-
    Melatonin at bedtime is the alternative symptomatic agent, generally
    preferred where sedation, falls, or cognitive impairment make a
    benzodiazepine unattractive - a relevant consideration precisely because so
    many of these patients are in a neurodegenerative prodrome. Like clonazepam
    it acts on the behavioural effector node, and its AASM recommendation is
    likewise conditional. Note that the melatonin here is a hypnotic dose acting
    on the behaviours, mechanistically distinct from the low, timed, phase-shifting
    dose used in circadian_phase_misalignment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: melatonin
      term:
        id: CHEBI:16796
        label: melatonin
  target_mechanisms:
  - target: Motor Enactment of Dream Content During REM Sleep
    treatment_effect: INHIBITS
    description: >-
      Reduces the frequency and intensity of enacted behaviours; not shown to
      restore REM atonia or to alter the underlying degeneration.
  evidence:
  - reference: PMID:36515157
    reference_title: "Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The AASM suggests that clinicians use immediate-release melatonin (vs no
      treatment) for the treatment of isolated RBD in adults. (CONDITIONAL).
    explanation: >-
      Cited as PARTIAL for the same reason as clonazepam - a conditional
      recommendation - so that a conforming entry cannot present either agent as
      established therapy.
discussions:
- discussion_id: gap_rswa_severity_versus_prodromal_stage
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the degree of REM sleep without atonia measure the extent of the
    pontine lesion, or the stage of the wider synucleinopathy?
  attaches_to:
  - pathophysiology#Failure of REM Sleep Skeletal Muscle Atonia
  - pathophysiology#Injury Risk and Prodromal Neurodegeneration
  rationale: >-
    Quantified atonia loss predicts phenoconversion, but the module's own
    anatomy offers two incompatible readings of why. If it measures the local
    pontine lesion, it should saturate once that nucleus is lost and stop
    tracking progression elsewhere; if it indexes the overall synuclein burden,
    it should keep rising as pathology spreads rostrally. The two predict
    different things about its value as a trial stratification and
    progression marker, and current cohorts have not separated them because
    atonia loss is almost always measured cross-sectionally at enrolment.
  proposed_experiments:
  - experiment_id: exp_serial_rswa_quantification_vs_dat
    name: Serial atonia quantification against independent progression markers
    description: >-
      Annual quantitative scoring of tonic and phasic REM electromyographic
      activity in an isolated REM sleep behaviour disorder cohort, paired with
      serial dopamine-transporter imaging and olfactory and autonomic testing,
      to determine whether atonia loss plateaus while the other markers continue
      to decline (local-lesion model) or continues to track them (global-burden
      model).
- discussion_id: gap_antidepressant_induced_rswa_significance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is antidepressant-associated REM sleep without atonia an independent
    pharmacological effect, or unmasking of an existing prodromal lesion?
  attaches_to:
  - pathophysiology#Lesion of the Pontine REM-Atonia Generator
  rationale: >-
    The module treats the pharmacological and degenerative routes to the trigger
    node as distinct, and instructs that only the degenerative one carries
    prodromal significance. That instruction is only safe if the two routes are
    genuinely separable. Serotonergic and noradrenergic antidepressants
    demonstrably increase REM electromyographic activity, but patients who
    develop the syndrome on antidepressants also convert to synucleinopathy at
    rates above the background, which is compatible with the drug lowering the
    threshold for a lesion that was already present. Until this is resolved,
    curators should record antidepressant exposure rather than treating it as an
    explanation that excludes the degenerative route.
  proposed_experiments:
  - experiment_id: exp_antidepressant_rswa_withdrawal_cohort
    name: Prospective follow-up of antidepressant-associated atonia loss
    description: >-
      Follow patients who develop REM sleep without atonia on antidepressant
      treatment through supervised drug withdrawal, scoring atonia before and
      after, and continue prospective surveillance for phenoconversion in those
      whose atonia normalises versus those in whom it persists.

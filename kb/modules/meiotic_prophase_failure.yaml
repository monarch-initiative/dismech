name: Meiotic Prophase Failure Module
description: >-
  A conserved mechanism module for inherited gametogenic failure caused by
  disruption of meiotic prophase I chromosome synapsis and recombination. In
  affected germ cells, programmed meiotic chromosome events fail at homolog
  pairing, synaptonemal complex assembly, homologous-recombination repair of
  DNA double-strand breaks, or pachytene checkpoint resolution. The shared path
  is meiotic arrest with germ-cell apoptosis, producing sex-dimorphic clinical
  outcomes: ovarian follicle depletion and primary ovarian insufficiency in
  46,XX individuals, and spermatogenic arrest with non-obstructive azoospermia
  or Sertoli-cell-only syndrome in 46,XY individuals. This module is intended
  for meiotic genes such as SYCE1, MCM8, MCM9, STAG3, HFM1, MSH4, MSH5, DMC1,
  and SYCP3. It intentionally excludes upstream gonadal organogenesis and
  steroidogenic transcription-factor disorders such as NR5A1, WT1, SOX9, SRY,
  FOXL2, and DHH.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
creation_date: "2026-05-28T02:00:27Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries should
  reference individual nodes via conforms_to using
  "meiotic_prophase_failure#<Node Name>". The module covers genes that
  disrupt meiotic prophase after gonadal organogenesis has occurred,
  including the meiosis-specific cohesin STAG3 and the crossover factor
  TEX11. Somatic DNA-repair and cancer-predisposition
  branches are gene-specific, especially for MCM8 and MCM9, and should not be
  required for every conforming disorder.
pathophysiology:
- name: Meiotic Prophase I Entry and Homolog Pairing
  description: >-
    Germ cells enter the meiotic cell cycle and initiate prophase I chromosome
    pairing. This node captures the shared upstream context for module genes:
    the gonad is present, germ cells enter meiosis, and homologous chromosomes
    must pair before synapsis and recombination can be completed.
  role: trigger
  cell_types:
  - preferred_term: germ cell
    term:
      id: CL:0000586
      label: germ cell
  biological_processes:
  - preferred_term: meiotic cell cycle
    term:
      id: GO:0051321
      label: meiotic cell cycle
  - preferred_term: homologous chromosome pairing at meiosis
    term:
      id: GO:0007129
      label: homologous chromosome pairing at meiosis
  examples:
  - STAG3
  evidence:
  - reference: PMID:24597867
    reference_title: "Mutant cohesin in premature ovarian failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Female mice devoid of Stag3 are sterile, and their fetal oocytes are arrested at early prophase I, leading to oocyte depletion at 1 week of age."
    explanation: Loss of the meiosis-specific cohesin arrests germ cells at the entry and pairing stage this node represents, before synapsis can complete.
  - reference: PMID:24597867
    reference_title: "Mutant cohesin in premature ovarian failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous 1-bp deletion inducing a frameshift mutation in STAG3 on chromosome 7. STAG3 encodes a meiosis-specific subunit of the cohesin ring, which ensures correct sister chromatid cohesion."
    explanation: Places a human gametogenic-failure gene at the axis-formation step upstream of synapsis.
  - reference: PMID:25062452
    reference_title: "Exome sequencing reveals SYCE1 mutation associated with autosomal recessive primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Genes involved in essential steps in chromosome synapsis and recombination during meiosis, such as synaptonemal complex central element 1 (SYCE1), have been shown to cause POI in animal models."
    explanation: Frames synapsis and recombination as the shared essential steps the module's two central nodes branch into.
  downstream:
  - target: Synaptonemal Complex Assembly
  - target: Homologous Recombination Repair of Meiotic DNA Breaks

- name: Synaptonemal Complex Assembly
  description: >-
    Synaptonemal complex components assemble between paired homologous
    chromosomes during meiotic prophase I. Disruption of central or lateral
    element proteins such as SYCE1 or SYCP3 produces asynapsis or unstable
    synapsis, preventing normal progression through pachytene.
  role: central_effector
  cell_types:
  - preferred_term: germ cell
    term:
      id: CL:0000586
      label: germ cell
  biological_processes:
  - preferred_term: synaptonemal complex assembly
    term:
      id: GO:0007130
      label: synaptonemal complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:25062452
    reference_title: "Exome sequencing reveals SYCE1 mutation associated with autosomal recessive primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonsense homozygous mutation (c.613C>T) was identified in the SYCE1 gene in both affected sisters. The parents and three brothers were heterozygous for the mutation, and an unaffected sister did not carry the mutation."
    explanation: A central-element gene lesion segregating with primary ovarian insufficiency, the first human SYCE1 case.
  - reference: PMID:14643120
    reference_title: "Azoospermia in patients heterozygous for a mutation in SYCP3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant protein showed greatly reduced interaction with the wild-type protein in vitro and interfered with SYCP3 fibre formation in cultured cells."
    explanation: Shows a lateral-element variant disrupting synaptonemal complex assembly itself, by dominant-negative interference.
  examples:
  - SYCE1
  - SYCP3
  - TEX12
  downstream:
  - target: Pachytene Checkpoint Arrest and Germ Cell Apoptosis

- name: Homologous Recombination Repair of Meiotic DNA Breaks
  description: >-
    Programmed and repair-associated DNA breaks in meiotic prophase require
    homologous-recombination machinery to complete chromosome pairing,
    crossover formation, and genome integrity surveillance. Disruption of
    repair factors such as MCM8, MCM9, DMC1, HFM1, MSH4, or MSH5 leaves
    meiotic DNA damage unresolved and blocks normal pachytene progression.
  role: central_effector
  cell_types:
  - preferred_term: germ cell
    term:
      id: CL:0000586
      label: germ cell
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  - preferred_term: DNA double-strand break processing
    term:
      id: GO:0000729
      label: DNA double-strand break processing
    modifier: DECREASED
  evidence:
  - reference: PMID:25437880
    reference_title: "Exome sequencing reveals MCM8 mutation underlies ovarian failure and chromosomal instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared with fibroblasts from unaffected daughters, chromosomal break repair was deficient in fibroblasts from the affected individuals, likely due to inhibited recruitment of MCM8 p.P149R to sites of DNA damage."
    explanation: Measured homologous-recombination repair deficiency for an MCM8 allele causing ovarian failure.
  - reference: PMID:25480036
    reference_title: "MCM9 mutations are associated with ovarian failure, short stature, and chromosomal instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Repair of chromosome breaks was impaired in lymphocytes from affected, but not unaffected, females in both families, consistent with MCM9 function in homologous recombination."
    explanation: The same repair deficiency for MCM9, confirming the branch is gene-general.
  - reference: PMID:28541421
    reference_title: "A homozygous donor splice-site mutation in the meiotic gene MSH4 causes primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the protein level, the mutation p.Ile743_Lys785del is predicted to lead to the ablation of the highly conserved Walker B motif of the ATP-binding domain, thus inactivating MSH4."
    explanation: A MutS-homolog crossover-factor lesion in primary ovarian insufficiency.
  - reference: PMID:29331980
    reference_title: "DMC1 mutation that causes human non-obstructive azoospermia and premature ovarian insufficiency identified by whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel homozygous missense mutation (NM_007068.3: c.106G>A, p.Asp36Asn) in DMC1, which cosegregated with NOA and POI phenotypes in this family."
    explanation: The meiosis-specific recombinase, with one allele producing both sex-dimorphic outcomes of the module.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This loss, which was identical in 2 patients with azoospermia, predicts a deletion of 79 amino acids within the meiosis-specific sporulation domain SPO22."
    explanation: An X-linked crossover-pathway gene whose loss produces the spermatogenic arm of the module.
  examples:
  - MCM8
  - MCM9
  - DMC1
  - HFM1
  - MSH4
  - MSH5
  - TEX11
  downstream:
  - target: Pachytene Checkpoint Arrest and Germ Cell Apoptosis
  - target: Somatic DNA Repair Deficiency and Cancer Predisposition

- name: Pachytene Checkpoint Arrest and Germ Cell Apoptosis
  description: >-
    Failed synapsis or unresolved meiotic recombination activates pachytene
    checkpoint signaling. Instead of completing meiotic prophase and producing
    functional gametes, affected germ cells arrest and are eliminated by
    apoptosis.
  role: consequence
  cell_types:
  - preferred_term: germ cell
    term:
      id: CL:0000586
      label: germ cell
  biological_processes:
  - preferred_term: meiotic recombination checkpoint signaling
    term:
      id: GO:0051598
      label: meiotic recombination checkpoint signaling
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:22530760
    reference_title: "HORMAD1-dependent checkpoint/surveillance mechanism eliminates asynaptic oocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Meiotic pachytene checkpoints monitor the failure of homologous recombination and synapsis to ensure faithful chromosome segregation during gamete formation."
    explanation: Defines the checkpoint this node represents and the two failures that trigger it.
  - reference: PMID:22530760
    reference_title: "HORMAD1-dependent checkpoint/surveillance mechanism eliminates asynaptic oocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We here report that mouse HORMAD1 is required for a meiotic prophase checkpoint that eliminates asynaptic oocytes."
    explanation: Shows that asynaptic oocytes are actively eliminated by a checkpoint rather than lost passively.
  - reference: PMID:9500548
    reference_title: "The meiotic checkpoint monitoring synapsis eliminates spermatocytes via p53-independent apoptosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, the apoptotic elimination of spermatocytes with synaptic errors proved to be p53-independent."
    explanation: The spermatocyte arm of the same checkpoint, eliminating cells with synaptic errors by apoptosis.
  downstream:
  - target: Ovarian Follicle Depletion and Primary Ovarian Insufficiency
  - target: Spermatogenic Arrest and Non-Obstructive Azoospermia

- name: Ovarian Follicle Depletion and Primary Ovarian Insufficiency
  description: >-
    In 46,XX individuals, loss of oocytes during fetal or early postnatal
    meiotic progression depletes the ovarian follicle pool. The clinical
    manifestation is primary ovarian insufficiency, ovarian dysgenesis, primary
    amenorrhea, or hypergonadotropic hypogonadism depending on ascertainment
    and residual ovarian reserve.
  role: consequence
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: female gamete generation
    term:
      id: GO:0007292
      label: female gamete generation
    modifier: DECREASED
  evidence:
  - reference: PMID:25062452
    reference_title: "Exome sequencing reveals SYCE1 mutation associated with autosomal recessive primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Primary ovarian insufficiency (POI) is caused by ovarian follicle depletion or follicle dysfunction. The phenotypic spectrum ranges from absence of pubertal maturation to early menopause."
    explanation: Defines the clinical outcome and its spectrum.
  - reference: PMID:25480036
    reference_title: "MCM9 mutations are associated with ovarian failure, short stature, and chromosomal instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preferential sensitivity of germline meiosis to MCM9 functional deficiency and compromised DNA repair in the somatic component most likely account for the ovarian failure and short stature."
    explanation: Attributes the ovarian failure to the germline meiotic sensitivity this module models, separating it from the somatic branch.
  - reference: PMID:25437880
    reference_title: "Exome sequencing reveals MCM8 mutation underlies ovarian failure and chromosomal instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we studied 3 sisters with primary amenorrhea, hypothyroidism, and hypergonadotropic hypogonadism."
    explanation: Primary amenorrhea with hypergonadotropic hypogonadism as the presenting form of the ovarian outcome.

- name: Spermatogenic Arrest and Non-Obstructive Azoospermia
  description: >-
    In 46,XY individuals, meiotic prophase failure in spermatocytes produces
    spermatogenic arrest, often observed clinically as non-obstructive
    azoospermia, maturation arrest, or Sertoli-cell-only syndrome after germ
    cell depletion.
  role: consequence
  cell_types:
  - preferred_term: spermatocyte
    term:
      id: CL:0000017
      label: spermatocyte
  biological_processes:
  - preferred_term: male gamete generation
    term:
      id: GO:0048232
      label: male gamete generation
    modifier: DECREASED
  evidence:
  - reference: PMID:14643120
    reference_title: "Azoospermia in patients heterozygous for a mutation in SYCP3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "A null mutation of Sycp3 in mice causes azoospermia with meiotic arrest."
    explanation: Synaptonemal-complex loss producing spermatogenic arrest in the mouse model that motivated the human study.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations, which occurred in 7 of 289 men with azoospermia (2.4%), were absent in 384 controls with normal sperm concentrations (P=0.003)."
    explanation: Case-control evidence that a meiotic crossover gene explains a measurable share of non-obstructive azoospermia.
  - reference: PMID:29331980
    reference_title: "DMC1 mutation that causes human non-obstructive azoospermia and premature ovarian insufficiency identified by whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological analysis demonstrated a lack of spermatozoa in the male patient's seminiferous tubules."
    explanation: The testicular histology of the spermatogenic arm.

- name: Somatic DNA Repair Deficiency and Cancer Predisposition
  description: >-
    A gene-specific branch for module genes that also function in mitotic or
    somatic DNA repair. MCM8 and MCM9 are the main current examples: biallelic
    variants may combine meiotic prophase failure with germ-cell tumors or
    gastrointestinal polyposis and early-onset malignancy. This branch should be
    used only when gene-specific evidence supports a somatic cancer phenotype.
  role: gene_specific_consequence
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  evidence:
  - reference: PMID:40684266
    reference_title: "Clinical syndromes linked to biallelic germline variants in MCM8 and MCM9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCM8 and MCM9 are newly proposed cancer predisposition genes, linked to polyposis and early-onset cancer, in addition to their previously established association with hypogonadism."
    explanation: States the gene-specific somatic branch this node carries.
  - reference: PMID:40684266
    reference_title: "Clinical syndromes linked to biallelic germline variants in MCM8 and MCM9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we documented polyposis, gastric cancer, and early-onset colorectal cancer (CRC) in MCM9 carriers but not in MCM8 carriers"
    explanation: "Separates the two genes within the branch: the polyposis and gastrointestinal cancer signal is MCM9-specific."
  - reference: PMID:25480036
    reference_title: "MCM9 mutations are associated with ovarian failure, short stature, and chromosomal instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal-recessive variants in MCM9 cause a genomic-instability syndrome associated with hypergonadotropic hypogonadism and short stature."
    explanation: The somatic genomic-instability component recognised in the first MCM9 report.
  examples:
  - MCM8
  - MCM9

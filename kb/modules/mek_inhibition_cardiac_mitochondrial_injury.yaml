mechanistic_hypotheses:
- hypothesis_group_id: mekcard_mitochondrial_stat3_model
  hypothesis_label: MEK-ERK-STAT3 Mitochondrial Bioenergetic Injury Model
  status: CANONICAL
  description: >-
    The default model for this module. MEK inhibition abrogates ERK1/2
    activation, which removes serine-727 phosphorylation of STAT3 and with it
    the mitochondrial STAT3 pool that supports electron transport complex I and
    II activity. The resulting respiratory lesion depletes oxidative capacity in
    cardiomyocytes and produces a reversible contractile deficit. Supported by a
    phosphomimetic rescue in cardiomyocytes and by the matching complex I and II
    defect in cardiac Stat3-null mice. The model is explicitly incomplete: the
    reduction in complex III and IV activity is not explained by the STAT3 arm,
    and the authors note that ERK1/2 has over 100 downstream targets.
  evidence:
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Introduction of a phosphomimetic STAT3-S727 construct rescued the
      cardiomyocyte mitochondrial injury, the first demonstration that this
      MEK-ERK-STAT3 pathway regulates oxidative metabolism in the heart.
    explanation: The rescue result the canonical model rests on.
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Our findings suggest that Trm may compromise mitochondrial function
      through multiple mechanisms rather than one discrete pathway
    explanation: The authors' own statement that this model is not exclusive,
      recorded so the module does not overclaim it.
- hypothesis_group_id: mekcard_identity_maturation_destabilization
  hypothesis_label: Cardiomyocyte Identity and Maturation-State Destabilization
    Model
  status: EMERGING
  description: >-
    Proposed arm orthogonal to the bioenergetic model. ERK1/2 activity actively
    maintains the ventricular gene programme in differentiated cardiomyocytes,
    so MEK inhibition may injure the heart by letting cell identity and
    maturation state drift, not only by starving it of ATP. The zebrafish result
    is a direct pharmacological MEK-inhibition finding - ectopic atrial and
    reduced ventricular gene expression in already-differentiated ventricular
    cardiomyocytes - and the mammalian developmental counterpart is that reduced
    upstream MAPK input shifts the proliferation-to-maturation switch and ends
    in dilated cardiomyopathy. Two reasons to take it seriously rather than
    filing it as developmental biology. First, it predicts a different
    phenotype from the bioenergetic arm: a drift in cell state would not
    necessarily reverse on withdrawal the way an energetic deficit does, so it
    is a candidate explanation for any persistent component of the clinical
    picture. Second, it makes the paediatric exposure a distinct question, since
    MEK inhibitors are now given to children for neurofibromatosis type 1 during
    and after the window when this signalling is load-bearing. What is needed is
    chamber-identity and maturation-marker readouts in a mammalian heart exposed
    to a clinical MEK inhibitor; the originating cardiotoxicity study ran bulk
    cardiac RNA-seq but did not examine them, and its one adjacent finding -
    cardiomyocyte atrophy rather than hypertrophy - is consistent with a change
    in cell state and unexplained by the respiratory lesion.
  evidence:
  - reference: PMID:38293792
    reference_title: The MEK-ERK signaling pathway promotes maintenance of
      cardiac chamber identity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Together, our data reveal chamber-specific roles of MEK-ERK
      signaling in the maintenance of ventricular and atrial identities.
    explanation: The paper's own summary of the identity-maintenance role this
      hypothesis extends to drug exposure.
  - reference: PMID:42053511
    reference_title: B-Raf is required for normal murine cardiac development and
      function.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Histology revealed increased cardiomyocyte volume in KO hearts by 3d
      and elevated markers of hypertrophy and maturation by 8d
    explanation: Shows reduced MAPK input alters maturation state measurably,
      which is the readout class this hypothesis says is missing from the
      cardiotoxicity literature.
- hypothesis_group_id: mekcard_neutrophil_amplification
  hypothesis_label: Neutrophil-Mediated Amplification Model
  status: EMERGING
  description: >-
    Proposed arm, untested for MEK inhibition. The cGAS-STING output recorded in
    this module - IL-1beta, IL-6, TNF-alpha, CXCL10, IL-17 and NLRP3
    inflammasome assembly - is a neutrophil-recruiting and neutrophil-activating
    profile, and in anthracycline cardiotoxicity neutrophil influx and
    neutrophil elastase are causal for contractile dysfunction rather than
    merely correlated. If the arm operates here it would make the
    neutrophil-to-lymphocyte ratio a candidate risk marker for MEK-inhibitor
    cardiotoxicity, which matters because every conventional baseline predictor
    has failed in this setting. Two things are needed before any of this is a
    finding: a study that types the myocardial infiltrate in a
    MEK-inhibitor-exposed heart, and a cohort that tests the
    neutrophil-to-lymphocyte ratio against incident cancer therapy-related
    cardiac dysfunction on a MEK inhibitor. Neither exists.
  evidence:
  - reference: PMID:39936506
    reference_title: Multifaceted roles of neutrophils in cardiac disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: One study in breast cancer patients treated with anthracyclines
      found a NLR >= 2.6 during anthracycline treatment was associated with a
      fourfold increased risk of developing left ventricular dysfunction;
      incremental increases of 1-point NLR added an additional 15% risk
    explanation: The precedent for a neutrophil-derived risk marker in
      cancer-therapy cardiotoxicity, which is what this hypothesis proposes
      testing for MEK inhibitors.
  - reference: PMID:39936506
    reference_title: Multifaceted roles of neutrophils in cardiac disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In general, higher NLR ratios are associated with a more severe
      phenotype across most types of cardiac disease highlighted in this review.
    explanation: Supports the generality of the marker across cardiac disease,
      while leaving the MEK-inhibitor case untested.

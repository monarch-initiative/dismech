- TOXICOLOGY
- PHARMACOLOGY
- ONCOLOGY
creation_date: '2026-10-23T00:00:00Z'
notes: >-
  This is a mechanism module, not a disease. Disorder entries reference
  individual nodes via conforms_to (for example
  "mek_inhibition_cardiac_mitochondrial_injury#Cardiac Mitochondrial Respiratory
  Chain Failure"). Do NOT create a separate "MEK Inhibitor Cardiotoxicity"
  module for a second MEK inhibitor: the originating study found the NF-kB arm
  in selumetinib-treated cardiomyocytes as well, and the clinical literature
  treats the effect as a class effect, so additional agents are conformers
  rather than new modules.

  Scope caveat on cell identity. All mechanistic nodes here are cardiomyocyte
  nodes, because the mitochondrial work was done in isolated cardiac
  mitochondria, neonatal rat ventricular myocytes and human iPSC-derived
  cardiomyocytes. The innate immune readouts in the originating study were
  whole-heart lysate, whole-left-ventricle immunohistochemistry and serum
  measurements, and no leukocyte population was typed, sorted or counted. The
  module therefore does not assert which cells make the cytokines. The
  neutrophil arm is carried as an EMERGING mechanistic hypothesis
  (mekcard_neutrophil_amplification) rather than as an established node, and the
  unidentified cellular source is recorded as a KNOWLEDGE_GAP discussion. Do not
  promote either to an asserted claim without a study that types the infiltrate
  in a MEK-inhibitor-exposed heart.

  Species and sex caveat: the in vivo model is female FVB mice at 3 mg/kg per
  day by gavage. No male animals were studied, and the human exposure is a
  2 mg daily oral dose, so the dose-exposure relationship is not matched.

  Two hypothesis-group nodes are carried for their groups only and are NOT
  established for MEK inhibition: Sterile Neutrophilic Cardiac Inflammation
  (mekcard_neutrophil_amplification) and Cardiomyocyte Identity and
  Maturation-State Destabilization
  (mekcard_identity_maturation_destabilization). The second rests on a
  zebrafish pharmacological result and a mouse B-Raf deletion, neither in a
  mammalian heart exposed to a clinical MEK inhibitor. A conforming disorder
  entry should carry the mitochondrial chain and leave both of these alone
  unless it has disease-specific evidence.

  Directionality caveat: the same bioenergetic lesion was found in some but not
  all cancer cell lines, and in a BRAF V600E-mutant melanoma line maximal
  respiratory capacity rose rather than fell. Cardiac injury and antitumour
  effect may therefore be partly the same lesion read in two tissues, which is
  why a cardioprotective strategy aimed at the respiratory complexes is recorded
  as a knowledge gap rather than as a treatment.

  No ERK1/2, MEK1/2 or STAT3 phosphosite has an ontology term for the
  modification itself, so phosphorylation state is carried in node prose and in
  the gene descriptors while the GO bindings name the pathway and the process
  whose activity changes.
pathophysiology:
- name: MEK1/2 Allosteric Inhibition and ERK1/2 Abrogation
  description: >-
    An allosteric MEK1/2 inhibitor occupies the kinase and prevents
    phosphorylation of ERK1 and ERK2, the exclusive immediate downstream targets
    of MEK1. In the heart this is on-target rather than off-target action: the
    MEK-ERK axis promotes cardiomyocyte survival after injury, so the same
    inhibition that blocks proliferative signalling in tumour cells removes a
    cardioprotective signal in cardiomyocytes. Abrogation is potent and
    persistent rather than partial or transient, which distinguishes this
    trigger from a reversible competitive blockade.

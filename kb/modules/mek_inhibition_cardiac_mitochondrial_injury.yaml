- name: Cardiomyocyte Identity and Maturation-State Destabilization
  description: >-
    Hypothesised second arm, carried for the
    mekcard_identity_maturation_destabilization hypothesis group only. MEK-ERK
    signalling does not merely support a differentiated cardiomyocyte's
    housekeeping; it actively reinforces which kind of cardiomyocyte the cell
    is. In zebrafish, MEK1/2-ERK1/2 acts downstream of FGF and upstream of Nkx
    factors to maintain ventricular identity, and pharmacological MEK inhibition
    produces ectopic atrial gene expression with reduced ventricular gene
    expression in cells that had already differentiated. Separately, the
    developing mammalian heart is sensitive to loss of upstream MAPK input:
    cardiomyocyte-relevant B-Raf deletion lowers phosphorylated ERK1/2, shifts
    the proliferation-to-maturation switch, and produces dilated cardiomyopathy
    in adulthood. Both results concern the cardiomyocyte's differentiation state
    rather than its energetics, which makes this arm orthogonal to the
    mitochondrial one rather than a restatement of it. Neither has been tested
    under a clinical MEK inhibitor in a mammalian heart, so the node must not be
    asserted by a conforming entry. The one adjacent observation in the
    originating study is that cardiomyocyte cross-sectional area and indexed
    heart weight fell rather than rose, which is a change in cell state and is
    unexplained by the respiratory lesion - but chamber identity and maturation
    markers were not examined there.

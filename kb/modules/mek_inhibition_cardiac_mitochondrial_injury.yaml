        direction rather than by association.
- name: Cardiac Mitochondrial Respiratory Chain Failure
  description: >-
    Oxidative phosphorylation falls in cardiomyocyte mitochondria, with the
    lesion localised to the respiratory complexes themselves rather than to a
    loss of mitochondrial mass alone. Isolated cardiac mitochondria show reduced
    NADH-supported (complex I) and succinate-supported (complex II) oxidative
    capacity after correction for mitochondrial protein content, and separately
    reduced complex III and complex IV activity. Mitochondrial abundance also
    falls, so both capacity per mitochondrion and mitochondrial number
    contribute. Ultrastructure shows cristae linearisation and electron-dense
    inclusions without fibrosis. This is the key conformance target: the
    rate-limiting, agent-agnostic step that every conforming entry funnels
    through, and the node a conformer should name if it names only one.
  role: central_effector
  biological_scale: CELLULAR
  cell_types: *cardiomyocyte
  cellular_components:

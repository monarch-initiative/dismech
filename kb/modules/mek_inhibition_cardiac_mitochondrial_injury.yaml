- name: cGAS-STING Innate Immune Activation
  description: >-
    Mitochondrial DNA sensing activates cGAS-STING-TBK1 and its canonical
    transcriptional effectors STAT1, STAT3 and NF-kB, raising interferon and
    chemokine transcripts in the heart and IL-1beta, IL-6 and TNF-alpha in
    tissue and serum, with NLRP3 inflammasome specks appearing in the left
    ventricle. The whole arm is time-dependent and exposure-coupled: nothing is
    detectable at 3 days, it is marked at 14 days, and it resolves completely
    after a 14-day washout. NF-kB activation was also seen in cardiomyocytes
    treated with a second MEK inhibitor, which is the main evidence that the
    immune arm is a class effect rather than a trametinib idiosyncrasy. Which
    cells produce the cytokines was not determined - see the module notes and
    the KNOWLEDGE_GAP discussion.

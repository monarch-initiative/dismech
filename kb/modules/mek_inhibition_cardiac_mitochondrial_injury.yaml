        explanation: Reports the multiplex serum measurement behind this readout.
  evidence:
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Our cardiac phenotype very closely resembled the human condition
      with a relatively mild and completely reversible decrease in contractile
      function
    explanation: The authors' own assessment of model fidelity to the human
      phenotype, which is the claim that licenses treating this model as
      informative for the module.
experimental_models:
- name: Neonatal rat ventricular myocytes exposed to trametinib
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Rattus norvegicus
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  description: >-
    Primary ventricular myocytes from 1- to 2-day-old Sprague-Dawley rat pups,
    serum-starved and exposed to trametinib at 10 or 100 nM, with citrate
    synthase activity, Seahorse oxygen consumption, mitochondrial membrane
    potential, mitochondrial DNA release and mitochondrial STAT3 immunoblotting
    as readouts, and a mitochondrially targeted phosphomimetic STAT3-S727D
    rescue arm.
  modeled_mechanisms:
  - target: Loss of Mitochondrial STAT3 Serine-727 Phosphorylation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Isolates the amplifier node in a pure cardiomyocyte population and tests
      it causally with the phosphomimetic rescue, which no in vivo arm does.
    limitations: >-
      Neonatal rodent myocytes are glycolytic relative to adult myocardium and
      are not electrically loaded, so the bioenergetic baseline against which
      the lesion is measured differs from an adult working heart. The rescue
      construct is supraphysiological and constitutively active.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Neonatal rat rather than human adult cardiomyocyte. The STAT3-S727
        dependence is conserved in the human iPSC-derived system, which is why
        this divergence qualifies rather than invalidates.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Isolated myocytes contain no endothelium, fibroblasts or resident immune
        cells, so the innate immune arm of the module cannot be observed in this
        system at all - only the cardiomyocyte contribution to mitochondrial DNA
        release.
    readouts:
    - name: Mitochondrial STAT3 and phospho-STAT3-S727 abundance
      target: Loss of Mitochondrial STAT3 Serine-727 Phosphorylation
      direction: DECREASED
      interpretation: Direct measurement of the amplifier node in isolated
        cardiomyocyte mitochondria.
      evidence:
      - reference: PMID:42430470
        reference_title: The MEK inhibitor trametinib incurs mitochondrial injury
          and induces innate immune responses in the mouse heart.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: We found that Trm (10 nM) exposure reduced the presence of total
          STAT3 and almost completely eliminated phospho-STAT3 (pSTAT3)-S727 in
          NRVM mitochondria
        explanation: Reports the immunoblot behind this readout.
- name: Human iPSC-derived cardiomyocytes exposed to trametinib
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  description: >-
    Human induced pluripotent stem cell-derived cardiomyocytes differentiated by
    a small-molecule protocol and exposed to trametinib at 10 or 100 nM, with
    oxygen consumption, mitochondrial hydrogen peroxide and mitochondrial
    superoxide as readouts.
  modeled_mechanisms:
  - target: Cardiac Mitochondrial Respiratory Chain Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The only human cardiomyocyte system in the chain, establishing that the
      respiratory lesion is not a rodent-specific effect.
    limitations: >-
      iPSC-derived cardiomyocytes are immature, with fetal-like metabolism that
      relies less on oxidative phosphorylation than adult myocardium, so they
      may understate or overstate the functional cost of a respiratory lesion.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Metabolic immaturity means the substrate preference and oxidative
        reserve of the adult human heart are outside the model. The claim that
        the lesion occurs in human cardiomyocytes holds; its functional
        magnitude in adult myocardium does not follow.
discussions:
- discussion_id: mekcard_mechanism_does_not_predict_patient_risk
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Cardiac Mitochondrial Respiratory Chain Failure
  - pathophysiology#Reversible Cardiac Hypocontractility
  prompt: >-
    Why does a mechanism this well resolved in the mouse predict nothing about
    which patient will develop cancer therapy-related cardiac dysfunction on a
    MEK inhibitor?
  rationale: >-
    The mismatch is not that the model fails to reproduce the phenotype - it
    reproduces it unusually well, with the same mild, early, reversible systolic
    deficit. The mismatch is that the model is uniform and the patients are not.
    Every published attempt to find a baseline clinical predictor in patients
    has failed: a prospective cohort found no association between
    cardiovascular-magnetic-resonance myocardial or perfusion characteristics
    and incident dysfunction, a retrospective cohort found baseline ejection
    fraction and global longitudinal strain no different between those who
    developed moderate dysfunction and those who did not and concluded the
    guideline risk tool has limited utility here, a trametinib monotherapy trial
    found no baseline parameter could predict it, and a paediatric cohort found
    no clinical or demographic difference between affected and unaffected
    patients. What those tools measure is cardiac reserve, imported from
    anthracycline cardio-oncology. What the mechanism says is at risk is
    mitochondrial oxidative reserve and the innate immune response to
    mitochondrial damage, and no study has measured either at baseline against
    outcome. The candidate measurables the mechanism implies are all unused:
    circulating cell-free mitochondrial DNA, which this module shows rises in
    patients on drug; interferon tone or prior inflammatory burden, since the
    STING arm makes susceptibility time-varying rather than fixed; the
    neutrophil-to-lymphocyte ratio, which predicts cardiotoxicity for
    anthracyclines, trastuzumab and immune checkpoint inhibitors but has never
    been tested here; and cardiac high-energy phosphate reserve.
  proposed_experiments:
  - experiment_id: mekcard_baseline_reserve_prediction_cohort
    name: Baseline mitochondrial and inflammatory reserve against incident CTRCD
      on a MEK inhibitor
    description: >-
      Prospective cohort of patients starting a MEK inhibitor, with baseline
      circulating cell-free mitochondrial DNA, neutrophil-to-lymphocyte ratio,
      an interferon-stimulated gene score and serial echocardiography to
      International Cardio-Oncology Society criteria, testing each against
      incident cancer therapy-related cardiac dysfunction. Powered as a
      prediction study rather than an association study, and reported against
      the European Society of Cardiology baseline risk tool so that incremental
      value over cardiac reserve is measurable.
    would_support:
    - pathophysiology#Mitochondrial DAMP Release
    - pathophysiology#cGAS-STING Innate Immune Activation
    supporting_outcome:
    - >-
        One or more of the mechanism-derived baseline measures stratifies incident
        cancer therapy-related cardiac dysfunction with incremental value over the
        guideline risk tool, and the stratification follows the direction the
        mechanism predicts.
    refuting_outcome:
    - >-
        None of the mechanism-derived measures stratifies outcome better than the
        existing risk tool, indicating that interindividual susceptibility is set
        by something outside the mitochondrial and innate immune arms this module
        describes.
  - experiment_id: mekcard_immune_cell_type_attribution
    name: Cell-type attribution of the cardiac innate immune response
    description: >-
      Single-cell or spatial transcriptomic and flow-cytometric
      characterisation of the myocardial immune compartment in
      MEK-inhibitor-exposed hearts at 3 and 14 days and after washout, typing
      and counting neutrophils, monocytes, macrophages and resident populations,
      and identifying which cells carry cGAS-STING activation and which produce
      IL-1beta, IL-6 and TNF-alpha.
    would_support:
    - pathophysiology#Sterile Neutrophilic Cardiac Inflammation
    supporting_outcome:
    - >-
        A defined leukocyte population is recruited to or activated within the
        exposed myocardium on the same timescale as the cytokine rise, and carries
        a measurable share of the cytokine output.
    refuting_outcome:
    - >-
        The cytokine output is cardiomyocyte-intrinsic with no leukocyte
        recruitment or activation, which would retire the neutrophil amplification
        hypothesis and confine the immune arm to the cardiomyocyte itself.
- discussion_id: mekcard_immune_cell_source_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#cGAS-STING Innate Immune Activation
  - pathophysiology#Sterile Neutrophilic Cardiac Inflammation
  prompt: >-
    Which cells in the MEK-inhibitor-exposed heart sense the released
    mitochondrial DNA, and which produce the cytokines?
  rationale: >-
    The innate immune arm of this module is established by whole-heart lysate
    immunoblotting, whole-left-ventricle immunohistochemistry, bulk transcript
    measurement and serum cytokine multiplexing. None of those methods
    attributes a signal to a cell type, and the heart is a pluricellular organ -
    a point the originating study makes itself when it moves to isolated
    cardiomyocytes for the mitochondrial work. So the module can say that
    cGAS-STING is activated and that IL-1beta, IL-6 and TNF-alpha rise, and
    cannot say whether that happens in cardiomyocytes, in resident immune cells,
    or in a recruited infiltrate. This matters for more than completeness: a
    cardiomyocyte-intrinsic response and a recruited-neutrophil response imply
    different interventions and different biomarkers, and the
    neutrophil-to-lymphocyte ratio is only a candidate risk marker here if the
    second is true.
- discussion_id: mekcard_paediatric_developmental_window
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cardiomyocyte Identity and Maturation-State Destabilization
  - pathophysiology#Reversible Cardiac Hypocontractility
  prompt: >-
    Does MEK inhibition during the proliferation-to-maturation window leave a
    lasting cardiac consequence that adult exposure does not?
  rationale: >-
    MEK inhibitors are now given to children, principally selumetinib for
    neurofibromatosis type 1 plexiform neurofibroma and trametinib for
    paediatric glioma, often for years. The murine neonatal heart passes through
    a proliferative-to-terminal-differentiation switch complete by about two
    weeks of age, and reducing upstream MAPK input across that window shifts the
    switch, raises maturation and hypertrophy markers, and ends in dilated
    cardiomyopathy in adulthood - a different and non-reversing phenotype from
    the mild reversible deficit this module's consequence node describes.
    Meanwhile the one paediatric cohort in the clinical literature was
    reassuring but short: a median twelve months of follow-up, dysfunction that
    resolved off therapy, and no evidence of permanent dysfunction, which is
    evidence about the drug-exposure period rather than about adult outcomes in
    someone treated as a child. Nothing has followed a paediatric MEK-inhibitor
    cohort into adulthood, and no study has examined chamber-identity or
    maturation markers in any mammalian heart exposed to a clinical MEK
    inhibitor. So the question is open in the direction that matters: the
    reassurance is about reversibility during treatment, and the mechanistic
    concern is about a developmental trajectory that only becomes visible
    decades later.
  evidence:
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There was no evidence of permanent cardiac dysfunction.
    explanation: The reassuring paediatric finding, which bounds the question
      rather than answering it, since follow-up did not extend into adulthood.
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Further evaluation in larger prospective trials is needed.
    explanation: The authors' own statement that the paediatric question is not
      settled by their cohort.
  - reference: PMID:42053511
    reference_title: B-Raf is required for normal murine cardiac development and
      function.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The earliest signs of altered myocardium via echocardiographs were
      detected by 3 mo.
    explanation: The latency between the developmental insult and its detectable
      consequence, which is why a twelve-month paediatric cohort cannot exclude
      it.
- discussion_id: mekcard_cardiac_versus_antitumour_separability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cardiac Mitochondrial Respiratory Chain Failure
  prompt: >-
    Is the cardiac mitochondrial lesion separable from the antitumour effect, or
    would protecting the heart cost efficacy?
  rationale: >-
    The same bioenergetic lesion appears in cancer cells, and it is cell-type
    dependent rather than universal: trametinib suppressed basal and maximal
    respiration and oxidative phosphorylation kinetics in two acute myeloid
    leukaemia lines, and in a BRAF V600E-mutant melanoma line it lowered basal
    respiration but raised maximal respiratory capacity and left oxidative
    phosphorylation kinetics unchanged. Introducing BRAF V600E into a wild-type
    line did not alter the susceptibility, so the determinant is cell lineage
    rather than the driver mutation. If part of the drug's antitumour activity
    runs through the respiratory complexes, then cardiac risk and tumour
    response are correlated outcomes of one mechanism rather than independent
    safety and efficacy axes, and a cardioprotective strategy aimed at the
    respiratory complexes could blunt efficacy in exactly the tumours where that
    arm is working. Nothing yet establishes whether the two can be separated,
    which is why this module records no cardioprotective treatment.
  proposed_experiments:
  - experiment_id: mekcard_tumour_bearing_rescue_coprimary
    name: Tumour-bearing model with concurrent cardiac and antitumour endpoints
      under mitochondrial rescue
    description: >-
      MEK-inhibitor treatment of tumour-bearing animals carrying a
      cardiomyocyte-restricted mitochondrial STAT3-S727 phosphomimetic or
      STING-pathway interruption, with tumour growth and contractile function as
      co-primary endpoints, so that cardiac rescue and antitumour efficacy are
      read in the same animal rather than inferred across experiments. A
      cardiomyocyte-restricted intervention is the design that distinguishes
      "the two arms are separable" from "the rescue protects the tumour too".
    would_support:
    - pathophysiology#Cardiac Mitochondrial Respiratory Chain Failure
    supporting_outcome:
    - >-
        Cardiomyocyte-restricted rescue preserves contractile function without
        reducing antitumour efficacy, establishing the two arms as separable and
        making cardioprotection a tractable goal.
    refuting_outcome:
    - >-
        Rescue preserves contractile function at the cost of antitumour efficacy,
        or systemic rescue protects the tumour, indicating that the cardiac lesion
        cannot be targeted without weighing the loss of efficacy.

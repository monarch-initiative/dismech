- name: Mitochondrial DAMP Release
  description: >-
    Mitochondrial damage-associated molecular patterns, including mitochondrial
    DNA, are released from injured cardiomyocytes. The signal is measurable in
    cardiomyocyte culture medium, in mouse serum, and in the serum of patients
    receiving the drug, which is what makes this node the one point in the chain
    with a direct human correlate. In women with triple-negative breast cancer
    given the drug for one week, circulating mitochondrial DNA rose 4.8-fold in
    aggregate across three mitochondrial genes; the tissue of origin of that
    circulating signal was not established, so it supports the node without
    localising it to the heart. Mitochondrial DNA abundance in heart tissue
    falls at the same time, consistent with depletion of mitochondria rather
    than with proliferation of them.
  role: effector
  biological_scale: CELLULAR
  cell_types: *cardiomyocyte
  cellular_components:
  - preferred_term: cardiac mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  notes: >-
    No GO biological-process term is bound here because none names the release
    of mitochondrial DNA or other mitochondrial DAMPs from a cell. Searched
    ols:go for l~mitochondrial DNA (returns only replication, catabolism and
    metabolic-process regulation terms), l~release of cytochrome c (returns
    GO:0001836 release of cytochrome c from mitochondria and its regulation
    terms, a different cargo), l~mitochondrial outer membrane permeabilization
    (GO:0097345) and l~mitochondrial membrane permeability (GO:0035794 and
    siblings). The permeabilization and permeability terms are the mechanistic
    prerequisite for release rather than the release itself, and neither
    membrane permeabilization nor pore formation was measured in the originating
    study, so binding one would assert a step the evidence does not reach. The
    node therefore carries only its cellular component and the quantity stays in
    prose and in the readouts.

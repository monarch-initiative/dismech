    snippet: ERK1/2 also protects against multiple types of cardiac insult in
      mouse models.
    explanation: Supports reading the trigger as removal of a cardioprotective
      signal, which is why an on-target inhibition injures the heart.
  downstream:
  - target: Cardiomyocyte Identity and Maturation-State Destabilization
    causal_link_type: DIRECT
    hypothesis_groups:
    - mekcard_identity_maturation_destabilization
    description: >-
      Proposed second arm, parallel to the bioenergetic one. ERK1/2 activity
      actively reinforces the ventricular gene programme in cardiomyocytes that
      are already differentiated, so abrogating it can let that programme drift
      rather than only impairing energetics. Demonstrated for pharmacological
      MEK inhibition in zebrafish; untested in a mammalian MEK-inhibitor
      cardiotoxicity model.
    evidence:
    - reference: PMID:38293792
      reference_title: The MEK-ERK signaling pathway promotes maintenance of
        cardiac chamber identity.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Inhibition of MEK signaling, like inhibition of FGF signaling,
        results in ectopic atrial gene expression and reduced ventricular gene
        expression in ventricular cardiomyocytes.
      explanation: Pharmacological MEK inhibition itself, rather than a genetic
        lesion, destabilises the ventricular programme in differentiated
        cardiomyocytes.
  - target: Loss of Mitochondrial STAT3 Serine-727 Phosphorylation
    causal_link_type: DIRECT
    description: >-
      ERK-dependent phosphorylation of STAT3 at serine-727 is lost when ERK1/2
      activation is abrogated, and serine-727 phosphorylation is required for
      STAT3 to localise to mitochondria.
    evidence:
    - reference: PMID:42430470
      reference_title: The MEK inhibitor trametinib incurs mitochondrial injury
        and induces innate immune responses in the mouse heart.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Here, we found that MEK inhibition abrogated the phosphorylation of
        STAT3 at S727 and prevented the translocation of STAT3 to mitochondria in
        cardiomyocytes.
      explanation: States the trigger-to-amplifier link directly, in
        cardiomyocytes.
- name: Loss of Mitochondrial STAT3 Serine-727 Phosphorylation
  description: >-
    STAT3 is present in cardiac mitochondria, where it associates with electron
    transport chain complex I and is required for normal complex I and II
    activity. This mitochondrial role is distinct from, and does not depend on,
    STAT3 acting as a nuclear transcription factor. MEK inhibition removes
    serine-727 phosphorylation and with it mitochondrial STAT3, leaving the
    respiratory complexes without a cofactor they need. The change is
    compartment-specific and can run opposite to the whole-tissue signal: total
    cardiac STAT3 and proinflammatory tyrosine-705 phosphorylation rose in whole
    heart lysates while mitochondrial STAT3 and serine-727 phosphorylation were
    almost eliminated, so a whole-lysate blot alone would read this node
    backwards.

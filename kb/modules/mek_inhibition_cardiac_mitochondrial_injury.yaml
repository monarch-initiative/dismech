    Left ventricular systolic function falls early, by a modest amount, and
    recovers when the drug is withdrawn. In mice, fractional shortening fell
    within one week and returned to baseline within one week of withdrawal, with
    congestive organ weights that resolved over the same period, and without
    fibrosis or hypertrophy; cardiomyocyte cross-sectional area fell rather than
    rose, so the consequence is atrophic rather than hypertrophic remodeling.
    The clinical counterpart is cancer therapy-related cardiac dysfunction that
    is usually mild, appears within weeks to months, and is at least partially
    reversible. The reversibility and the exposure-coupling are the signature
    that distinguishes this consequence from an accumulating, dose-indexed
    cardiomyopathy.

name: MEK Inhibition Cardiac Mitochondrial Injury Module
description: >-
  A conserved drug-toxicity module for the cardiomyocyte injury caused by
  pharmacological MEK1/2 inhibition. Allosteric MEK inhibition abrogates ERK1/2
  activation and, through loss of ERK-dependent STAT3 serine-727 phosphorylation,
  strips STAT3 from cardiac mitochondria; mitochondrial STAT3 is required for
  normal electron transport system complex I and II activity, so its loss
  produces a bioenergetic lesion at the respiratory complexes
  (GO:0006119 oxidative phosphorylation, DECREASED) - the key conformance target
  and the rate-limiting step every conformer funnels through. The injured
  mitochondria release damage-associated molecular patterns including
  mitochondrial DNA, which activate cGAS-STING and its canonical STAT1/STAT3/
  NF-kB effectors and raise IL-1beta, IL-6 and TNF-alpha, amplifying a
  contractile deficit that is mild, early and reversible on drug withdrawal.
  A phosphomimetic mitochondrially targeted STAT3-S727D construct rescues the
  respiratory lesion and a STING antagonist partially rescues contractility,
  so the two arms are separable experimentally. Conforming disorder entries
  substitute the specific MEK inhibitor and clinical setting (trametinib in
  BRAF V600-mutant melanoma, selumetinib in NF1 plexiform neurofibroma,
  cobimetinib, binimetinib) while preserving the
  ERK-abrogation -> mitochondrial STAT3 loss -> respiratory failure ->
  mtDAMP release -> innate immune activation -> reversible hypocontractility
  chain, and must not assert either hypothesis-group node (the neutrophil arm
  or the identity/maturation arm) without evidence in that disease.
  Complementary to, and not a duplicate of,
  cardiomyopathy_maladaptive_remodeling: that module describes the chronic
  hypertrophic/fibrotic remodeling response to a sustained insult, whereas this
  one describes an acute, exposure-coupled, non-fibrotic bioenergetic lesion
  that resolves when the drug stops. It is also distinct from
  anthracycline-centred toxicity mechanisms, which begin at TOP2B-associated
  DNA injury rather than at a kinase signalling blockade.
category: Module

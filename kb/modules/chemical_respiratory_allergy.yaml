      epithelium, and endothelial activation with increased ICAM-1 surface
      expression. The model observes isolated cells, so its scale equals the
      node's cellular scale rather than extrapolating up to it.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The cells are cultured in isolation, so the model omits the multicellular
        airway tissue context and the mucus barrier present in the companion

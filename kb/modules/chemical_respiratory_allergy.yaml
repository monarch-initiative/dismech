discussions:
- discussion_id: gap_mucin_toxicodynamic_target_cra
  prompt: >-
    Is direct binding of a low-molecular-weight sensitizer to secreted airway
    mucin a general toxicodynamic initiating step in chemical respiratory
    allergy, and does dismech need a node shape for a chemical binding an
    extracellular secreted protein upstream of any cell?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Covalent Protein Haptenation by a Low Molecular Weight Sensitizer
  rationale: >-
    The companion monoculture study (PMID:38360295) also ran a cell-free assay of
    whether these sensitizers form a complex with mucin, the main secreted mucus
    protein, as a toxicodynamic target upstream of any cell. Some sensitizers did
    bind mucin, but the complex formation was not a common feature across chemical
    classes, so it is not a general initiating step and is recorded here as a
    negative, chemical-class-dependent result rather than asserted as a pathograph
    edge. dismech models haptenation of airway proteins as the molecular
    initiating event, but it has no node shape for a chemical binding a secreted
    extracellular protein with no cell involved, which is why this mucin
    interaction has no pathograph node even though the trigger node names secreted
    mucins among its carrier proteins.
  evidence:
  - reference: PMID:38360295
    reference_title: "Identification of toxicity-induced biomarkers in human non-immune airway cells exposed to respiratory sensitizers: A mechanistic approach."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      some of the sensitizers evaluated interact with mucin, the main protein
      mucus component
    explanation: >-
      Establishes that a subset of the sensitizers does form a toxicant-mucin
      complex, the positive half of the toxicodynamic finding.
  - reference: PMID:38360295
    reference_title: "Identification of toxicity-induced biomarkers in human non-immune airway cells exposed to respiratory sensitizers: A mechanistic approach."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the toxicant-mucin complex formation does not seem to be a common feature
      of different chemical classes of allergens
    explanation: >-
      The negative result this gap records: mucin binding is chemical-class
      dependent, so it is not a general toxicodynamic initiating step.

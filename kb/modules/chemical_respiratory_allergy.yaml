name: Chemical Respiratory Allergy Module
description: >-
  The conserved pathophysiology of chemical respiratory allergy (respiratory
  sensitization) induced by low molecular weight chemical sensitizers —
  diisocyanates (TDI, MDI, HDI), acid anhydrides (trimellitic and maleic
  anhydride), reactive dyes, persulfate salts and chloramine-T — presenting
  clinically as occupational asthma and rhinitis. The chain is: covalent
  haptenation of airway proteins by a reactive electrophile; airway epithelial
  danger signal release; dendritic cell activation with Th2-polarizing antigen
  presentation; hapten-specific T cell activation and Th2 polarization; and
  airway hyperresponsiveness with variable airflow limitation on re-exposure.
  Key conformance target is `chemical_respiratory_allergy#Dendritic Cell
  Activation and Th2-Polarizing Antigen Presentation` — the rate-limiting step
  at which an irritant response becomes a sensitizing one, and the step every
  conforming entry must funnel through. Conforming entries substitute the
  culprit chemical class and the affected airway compartment. The module is
  structured on AOP-Wiki AOP 39 (covalent protein binding leading to an
  increased allergic respiratory hypersensitivity response), whose five key
  events it follows one for one. It therefore shares its molecular initiating
  event — covalent protein binding — with the skin sensitization AOP 40 mapped
  in `projects/AOP_40_SKIN_SENSITIZATION.md`, and diverges downstream in the
  tissue compartment, the cytokine polarization and the clinical outcome: the
  cutaneous branch ends in allergic contact dermatitis, this one in asthma.
  That divergence is evidential and not merely anatomical — the reference
  respiratory allergen trimellitic anhydride elicits a Th2 cytokine
  fingerprint where the reference contact allergen dinitrochlorobenzene
  elicits the converse Th1 one, and respiratory sensitizers induce the
  Th2-polarizing ligand OX40L on dendritic cells where skin sensitizers do
  not. It
  is complementary to, and must not be confused with,
  `inhaled_irritant_airway_injury`, which models non-immune chemical injury of
  the same epithelium with no hapten-specific adaptive arm —
  the two can run in the same airway from the same exposure, and only this one
  confers specific memory. `epithelial_barrier_dysfunction` covers the
  allergic type 2 barrier hypothesis as an intrinsic junctional or
  differentiation defect and is a different claim from chemical haptenation.
category: Module
module_categories:
- IMMUNOLOGY
- TOXICOLOGY
creation_date: "2026-11-09T00:00:00Z"
notes: >-
  Scope. The module covers low molecular weight *chemical* sensitizers acting
  through protein haptenation. High molecular weight protein allergens (flour,
  enzymes, latex) cause occupational asthma through conventional IgE-mediated
  sensitization without a haptenation step and are out of scope; so is reactive
  airways dysfunction syndrome, which follows a single high-dose irritant
  exposure with no latency and no specific immune memory. Do NOT create a
  `Chemical Respiratory Allergy` Disease entry — the clinical entity is
  occupational asthma, and this is the mechanism it conforms to.

  Specific IgE is not required and is deliberately absent from the chain. For
  many low molecular weight agents, and for diisocyanates in particular,
  sensitized workers do not carry detectable specific IgE, so an IgE node
  would exclude the commonest case. The adaptive arm is modelled as
  hapten-specific T cell activation with Th2 polarization, which both the
  IgE-positive and IgE-negative presentations share.

  Ontology gap at the trigger node. GO has no class for haptenation or for
  xenobiotic-protein adduct formation, so that node binds no
  `biological_processes` term. Searched OLS (`ontology=go`) for `haptenation`,
  which returns only `CHEBI:59174 hapten`, a chemical entity rather than a
  process; `protein adduct formation`, which returns nothing; `covalent protein
  binding`, which returns only lipoprotein-particle binding terms; and
  `xenobiotic conjugation`, which returns no process class.
  `GO:0008213 protein alkylation` exists but denotes enzymatic alkylation as a
  regulated post-translational modification, not electrophilic adduction of a
  protein by an inhaled xenobiotic, so binding it would assert the wrong
  mechanism. The chemistry is described in prose instead, per the module
  convention that nodes bind GO and CL only.

  Evidence shape. The upstream chemistry is in vitro (MDI-albumin adduct
  characterization), the epithelial and dendritic cell nodes come from human
  airway cell NAMs curated from the Toxicology NAMs special issue
  (`projects/NAMS_SPECIAL_ISSUE.md`), the T cell node rests on a mouse model,
  and the clinical outcome on a human review. No single system spans the chain,
  which is the state of the field rather than a gap in curation: there is still
  no validated test method for respiratory sensitization.
pathophysiology:
- name: Covalent Protein Haptenation by a Low Molecular Weight Sensitizer
  description: >-
    The molecular initiating event. A reactive electrophilic chemical —
    characteristically a di-functional isocyanate or an acid anhydride — binds
    nucleophilic residues on airway proteins, forming a hapten-protein adduct
    that the immune system can recognize as neoantigen. Di-functional agents
    cross-link protein, so the adduct population is heterogeneous in both the
    number of groups bound and the degree of intra- and intermolecular
    cross-linking, and that heterogeneity is dose-dependent. Carrier proteins
    include serum albumin and, in the airway, secreted mucins and epithelial
    surface proteins. This node is the chemistry, not the immune response.
  role: trigger
  biological_scale: MOLECULAR
  locations:
  - preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  evidence:
  - reference: PMID:23743149
    reference_title: Characterization of methylene diphenyl diisocyanate-haptenated human serum albumin and hemoglobin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      demonstrating increases in both number and complexity of conjugates
      formed with increasing MDI concentrations
    explanation: >-
      Measures covalent adduct formation between a diisocyanate and human
      protein directly, and shows it is concentration-dependent — the
      haptenation chemistry this node represents.
  downstream:
  - target: Airway Epithelial Danger Signal Release
    description: >-
      Haptenated protein and the reactive chemistry that produced it perturb
      the airway epithelium, which responds with danger signals.
  - target: Dendritic Cell Activation and Th2-Polarizing Antigen Presentation
    description: >-
      The hapten-protein adduct is itself the antigen dendritic cells take up
      and present, so haptenation also feeds the dendritic cell node directly,
      without passing through the epithelial response.
- name: Airway Epithelial Danger Signal Release
  description: >-
    The haptenated and chemically stressed airway epithelium releases
    pro-inflammatory mediators — IL-8, IL-6 and IL-1beta — together with
    reactive oxygen species, and shows functional change including loss of MUC1
    and apoptosis. Fibroblasts and endothelium in the same tissue respond in
    parallel, the endothelium by upregulating adhesion molecules that recruit
    further cells. This is the innate signal that licenses dendritic cell
    maturation; on its own it is indistinguishable from an irritant response,
    which is why it is an amplifier here and not the decisive step.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  - preferred_term: lung fibroblast
    term:
      id: CL:0002553
      label: fibroblast of lung
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cytokine production involved in inflammatory response
    term:
      id: GO:0002534
      label: cytokine production involved in inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:38360295
    reference_title: "Identification of toxicity-induced biomarkers in human non-immune airway cells exposed to respiratory sensitizers: A mechanistic approach."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      sensitizers promoted an increase in IL-8, IL-6, and IL-1β production in
      the evaluated cell types
    explanation: >-
      Measures the three danger-signal cytokines of this node across bronchial
      epithelial, lung fibroblast and endothelial cells — the three cell types
      bound here.
  - reference: PMID:38369009
    reference_title: Characterization and applicability of a novel physiologically relevant 3D-tetraculture bronchial model for in vitro assessment of respiratory sensitization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      MA aerosol exposure triggered an increased IL-8 and IL-6 production,
      reactive oxygen species (ROS) formation, and apoptosis of epithelial
      cells
    explanation: >-
      Reproduces the same mediator release in a reconstructed 3D bronchial
      tissue, and adds the reactive oxygen species and apoptotic components of
      this node.
  downstream:
  - target: Dendritic Cell Activation and Th2-Polarizing Antigen Presentation
    description: >-
      Epithelial danger signals provide the maturation context without which
      antigen uptake would be tolerogenic rather than sensitizing.
- name: Dendritic Cell Activation and Th2-Polarizing Antigen Presentation
  description: >-
    The decisive, rate-limiting step and the key conformance target. Airway
    dendritic cells take up the hapten-protein adduct, mature — upregulating
    maturation markers such as CD83 and costimulatory molecules — and present
    the neoantigen to naive T cells in a Th2-polarizing context. The sensitizer
    drives this maturation itself, through reactive oxygen species generation
    and ERK-dependent signalling, and not only through the epithelial danger
    signals upstream. Whether a reactive inhaled chemical is a sensitizer or
    merely an irritant is settled here: without dendritic cell maturation and
    antigen presentation the chain stops, and the exposure produces injury
    without specific memory.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: dendritic cell differentiation
    term:
      id: GO:0097028
      label: dendritic cell differentiation
    modifier: INCREASED
  - preferred_term: antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
    modifier: INCREASED
  evidence:
  - reference: PMID:24742817
    reference_title: Respiratory sensitizer hexamethylene diisocyanate inhibits SOD 1 and induces ERK-dependent detoxifying and maturation pathways in dendritic-like cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "and CD83 (P < 0.05), a DC maturation marker"
    explanation: >-
      Shows a respiratory sensitizer inducing a dendritic cell maturation
      marker directly in dendritic-like cells, which is the maturation this
      node asserts.
  - reference: PMID:38369009
    reference_title: Characterization and applicability of a novel physiologically relevant 3D-tetraculture bronchial model for in vitro assessment of respiratory sensitization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      correlating with dendritic cell activation within the co-culture model
      after MA exposure
    explanation: >-
      Places dendritic cell activation inside a reconstructed airway tissue
      after sensitizer exposure, rather than in isolated cells.
  - reference: PMID:28824649
    reference_title: Prediction of Chemical Respiratory and Contact Sensitizers by OX40L Expression in Dendritic Cells Using a Novel 3D Coculture System.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      OX40L expression in DCs was most consistently and significantly enhanced
      by respiratory sensitizers as compared to that by skin sensitizers
    explanation: >-
      Supports the Th2-polarizing character of this node specifically: OX40L is
      a Th2-polarizing costimulatory ligand, and its induction discriminates
      respiratory from contact sensitizers at the dendritic cell step, which is
      why this module and the skin sensitization branch diverge here.
  downstream:
  - target: Hapten-Specific T Cell Activation and Th2 Polarization
    description: >-
      Presentation of the hapten-protein neoantigen by matured dendritic cells
      expands hapten-specific T cells.
- name: Hapten-Specific T Cell Activation and Th2 Polarization
  description: >-
    Hapten-specific T cells proliferate and polarize toward a type 2 profile,
    with IL-4, IL-5 and IL-13 production, loss of the counter-regulatory Th1
    interferon-gamma signal, and eosinophil recruitment to the conducting
    airways. This is where specific immunological memory is established, and so
    where latency and the requirement for re-exposure come from. Specific IgE
    may follow but frequently does not with low molecular weight agents, so it
    is not part of the chain.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T cell proliferation
    term:
      id: GO:0042098
      label: T cell proliferation
    modifier: INCREASED
  - preferred_term: T-helper 2 cell differentiation
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:16271432
    reference_title: TDI can induce respiratory allergy with Th2-dominated response in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      skin application followed by tracheal instillations of TDI led to local
      and systemic Th2-dominated immune responses
    explanation: >-
      Demonstrates that a diisocyanate sensitizer produces the Th2-dominated
      response this node asserts, with the airway eosinophilia and cytokine
      shift that accompany it.
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Workers with occupational asthma secondary to low molecular weight agents
      may not have elevated specific IgE levels
    explanation: >-
      Supports modelling the adaptive arm as a T cell response rather than an
      IgE one: specific IgE is frequently absent in exactly the agent class
      this module covers.
  - reference: PMID:12419703
    reference_title: "Cytokine fingerprinting of chemical allergens: species comparisons and statistical analyses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      TMA-activated LNC isolated from BALB/c mice or BN rats elaborated high
      levels of the Th2-type cytokines interleukin (IL)-10 and IL-13, but
      relatively little of the Th1-type cytokines IL-12 or interferon gamma
    explanation: >-
      Establishes the type 2 polarization of this node against a contact
      allergen comparator in the same assay, which is the evidential basis for
      separating this module from the skin sensitization branch rather than
      treating the two as one chain.
  downstream:
  - target: Airway Hyperresponsiveness and Variable Airflow Limitation
    description: >-
      On re-exposure, the established hapten-specific response drives airway
      inflammation, bronchoconstriction and hyperresponsiveness.
- name: Airway Hyperresponsiveness and Variable Airflow Limitation
  description: >-
    The adverse outcome. A sensitized worker re-exposed at work develops airway
    smooth muscle contraction, airway hyperresponsiveness and variable airflow
    limitation — clinically, occupational asthma, with or without rhinitis, and
    characteristically with a work-related temporal pattern. Removal from
    exposure does not reliably resolve it, so the node represents a persistent
    state and not a transient response.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
    modifier: INCREASED
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Low molecular weight isocyanates are the most common compounds that cause
      occupational asthma
    explanation: >-
      Establishes the clinical outcome of this chain in humans, and that the
      agent class the module is built around is its leading cause.
experimental_models:
- name: Compartment-resolved human airway monocultures (BEAS-2B, MRC-5, EA.hy926)
  description: >-
    Three human respiratory-tract cell lines cultured separately — bronchial
    epithelial (BEAS-2B), lung fibroblast (MRC-5) and endothelial (EA.hy926) —
    each exposed to low-molecular-weight respiratory sensitizers to read out the
    compartment-specific danger signals of chemical respiratory allergy. The
    panel resolves which cell type produces which mediator: pro-inflammatory
    cytokines across all three compartments, loss of the MUC1 barrier protein in
    the bronchial epithelium, and adhesion-molecule upregulation on the
    endothelium. It is the cellular-scale counterpart of the companion
    reconstructed-tissue tetraculture (PMID:38369009); because the cells are
    cultured in isolation, its scale matches this node's cellular scale exactly
    and no upward-extrapolation caveat is required, but it cannot see the
    cross-compartment amplification or the mucosal barrier that the tissue model
    adds.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  - preferred_term: lung fibroblast
    term:
      id: CL:0002553
      label: fibroblast of lung
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  conditions:
  - chemical respiratory allergy
  - respiratory sensitization
  - low-molecular-weight sensitizer exposure
  cell_source: >-
    Three immortalized human cell lines, cultured as separate monocultures
    rather than co-cultured: bronchial epithelial (BEAS-2B), lung fibroblast
    (MRC-5) and endothelial (EA.hy926). The same three non-immune lines are the
    non-immune compartments of the companion tetraculture (PMID:38369009).
  culture_system: Separate two-dimensional monocultures of each cell line
  publication: PMID:38360295
  modeled_mechanisms:
  - target: Airway Epithelial Danger Signal Release
    relationship: RECAPITULATES

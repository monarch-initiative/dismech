name: Schwann Cell Myelin Maintenance Module
description: >-
  A conserved module for the demyelinating arm of hereditary peripheral
  neuropathy: the Schwann-cell-intrinsic failure to build and maintain compact
  peripheral myelin. A myelin gene dosage or structural lesion (PMP22
  duplication or deletion, MPZ missense, GJB1/connexin-32 loss, EGR2
  transcription-factor variants, and the recessive Schwann-cell trafficking
  genes of CMT4) perturbs the Schwann cell myelination program and overwhelms
  its secretory quality control, producing proteostatic stress and
  mistrafficking of myelin membrane proteins. The result is dysmyelination and
  segmental demyelination of peripheral nerve, with a characteristic remodeling
  signature on biopsy (tomacula where dosage is reduced, onion bulbs where
  cycles of de- and remyelination recur), electrophysiological conduction
  slowing and conduction block, and eventual secondary axonal loss, which is
  what actually tracks clinical disability. Disorder entries declare conformance
  on their pathophysiology nodes and substitute the disorder-specific lesion.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is deliberately the
  Schwann-cell-intrinsic *complement* of `peripheral_axonal_degeneration`, not a
  duplicate of it: that module models the axon-centred final common pathway
  shared by metabolic, toxic, inflammatory and axonal-genetic neuropathy, and
  bundles demyelination into a single node; this module unpacks the glial arm
  that the demyelinating hereditary neuropathies actually funnel through, where
  the primary lesion is in the Schwann cell and the axon is injured only
  secondarily. A demyelinating disorder normally conforms to BOTH — to this
  module for the myelin lesion and to
  `peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination`
  for the shared downstream axonal course.

  A note on trigger granularity: the five lesion classes could each have been a
  separate trigger node. They are deliberately kept as one because the module's
  claim is about where they converge, not about how they differ, and because a
  conforming entry names its own gene and mechanism in its node text. If a future
  conformer needs to distinguish the trafficking arm downstream — for instance to
  model myelin outfoldings as a distinct remodeling signature — that argues for
  extending the remodeling branch rather than splitting this node.

  Disorder-specific substitutions at the trigger node: PMP22 duplication
  (CMT1A) and PMP22 deletion (HNPP) are reciprocal dosage lesions of the same
  gene; MPZ missense variants (CMT1B) act by protein misfolding and ER
  retention; GJB1/connexin-32 variants (CMT1X) remove the reflexive gap
  junctions of non-compact myelin; EGR2/KROX20 variants disable the
  transcriptional myelination program (congenital hypomyelinating neuropathy,
  Dejerine-Sottas); the recessive CMT4 genes (MTMR2, SBF2, SH3TC2, NDRG1, PRX,
  FIG4, GDAP1) disrupt Schwann cell membrane trafficking and phosphoinositide
  handling. Conformers should specialize the remodeling branch to the signature
  their disorder actually shows — tomacula for the PMP22-haploinsufficiency and
  MPZ-related tomaculous neuropathies, onion bulbs for the hypertrophic
  de-remyelinating forms, myelin outfoldings for the MTMR2/SBF2 forms.

  Cell-type convention: nodes bind the generic CL:0002573 Schwann cell, which is
  what the existing conformers use. A conforming entry may specialize to
  CL:0000218 myelinating Schwann cell where its evidence is specific to the
  myelinating lineage; the module deliberately does not bind the narrower term,
  so that conformance runs generic-to-specific rather than the reverse.

  Not an Xogenesis module: the terminal output is failure of a normal
  developmental and homeostatic process (myelination), not the formation of a
  pathological material anatomical entity. The tomacula/onion-bulb node is a
  reactive remodeling of existing myelin, not a derived pathological structure,
  and is deliberately curated as a branch rather than as the module's terminus.

  Scope boundary: acquired demyelinating neuropathy (CIDP, Guillain-Barre) is
  out of scope here — the primary lesion there is immune attack on myelin from
  outside the Schwann cell, which is modelled by
  `molecular_mimicry_autoimmunity` plus `peripheral_axonal_degeneration`.
  Central (oligodendrocyte) hypomyelination is likewise out of scope; this
  module is peripheral-nerve-specific.
pathophysiology:
- name: Myelin Gene Dosage or Structural Lesion in Schwann Cells
  description: >-
    A germline lesion in a gene the Schwann cell needs to build compact myelin.
    Five lesion classes enter here, and they are not variations on one theme —
    they are distinct cell-biological failures that converge on the same
    downstream node:

    (1) gene dosage — PMP22 duplication in CMT1A and the reciprocal PMP22
    deletion in HNPP; (2) a misfolding-prone missense change in a myelin
    structural protein — MPZ in CMT1B; (3) loss of a non-compact myelin
    gap-junction channel — GJB1/connexin-32 in CMT1X; (4) loss of the
    transcription factor driving the myelination program itself — EGR2/KROX20;
    and (5) disrupted Schwann cell membrane trafficking and phosphoinositide
    handling — the recessive CMT4 genes MTMR2, SBF2, SH3TC2, NDRG1, PRX and
    FIG4.

    Class (5) was added after review: three CMT4 nodes were attaching to this
    node while its enumeration covered only the first four, so the module
    documented a narrower trigger than it was actually receiving. All five act
    cell-autonomously in the Schwann cell rather than in the axon, which is the
    property that makes them one trigger rather than five.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: myelination in peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:1677316
    reference_title: "DNA duplication associated with Charcot-Marie-Tooth disease type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA markers within this interval revealed a duplication that is completely
      linked and associated with CMT1A.
    explanation: >-
      Establishes the archetypal trigger lesion of this module, a gene-dosage
      duplication segregating with the most common demyelinating hereditary
      neuropathy.
  - reference: PMID:8422677
    reference_title: "DNA deletion associated with hereditary neuropathy with liability to pressure palsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and includes the gene for peripheral myelin protein 22 (PMP-22),
      suggesting that underexpression of PMP-22 may cause HNPP.
    explanation: >-
      Shows the reciprocal dosage lesion at the same locus, establishing that
      both over- and under-expression of a myelin gene enter this module at the
      trigger node.
  - reference: PMID:10369870
    reference_title: "Functional consequences of mutations in the early growth response 2 gene (EGR2) correlate with severity of human myelinopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in the human EGR2 gene have recently been associated with the
      inherited peripheral neuropathies Charcot-Marie-Tooth type 1,
      Dejerine-Sottas syndrome and congenital hypomyelinating neuropathy.
    explanation: >-
      Establishes an alternative trigger class, loss of the transcriptional
      myelination program, converging on the same Schwann cell myelination
      failure.
  - reference: PMID:31586623
    reference_title: "Regulating PMP22 expression as a dosage sensitive neuropathy gene."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PMP22 gene is highly induced in Schwann cells during development,
      although its precise role in myelin formation and homeostasis is still
      under active investigation.
    explanation: >-
      Establishes that the archetypal trigger gene is a Schwann-cell-expressed,
      developmentally induced gene, which is why a dosage change in it acts
      cell-autonomously in this lineage. Cited only for that expression claim:
      the same sentence records that PMP22's precise mechanistic role remains
      under investigation, and this module does not assert one. Evidence source
      is OTHER because this is a review.
  downstream:
  - target: Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking
    description: >-
      Excess, misfolded, or mislocalized myelin protein overwhelms the Schwann
      cell secretory pathway.
  - target: Dysmyelination and Segmental Demyelination of Peripheral Nerve
    description: >-
      Loss of the transcriptional or structural program can compromise myelin
      directly, without requiring an intervening proteostatic-stress step.

- name: Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking
  description: >-
    Overexpressed, misfolded, or mistrafficked myelin membrane protein
    accumulates in the Schwann cell endoplasmic reticulum and Golgi, exceeds the
    degradative capacity of the secretory quality-control system, and activates
    the unfolded protein response. The protein never reaches its destination in
    the myelin membrane, so the same lesion causes both a toxic gain (ER
    burden and a chronic UPR that suppresses myelination) and a loss (absence of
    the protein from compact or non-compact myelin).
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  evidence:
  - reference: PMID:35501630
    reference_title: "Treatment with IFB-088 Improves Neuropathy in CMT1A and CMT1B Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Altered proteostasis, ER stress and activation of the UPR have been
      demonstrated in mice carrying Pmp22 mutations.
    explanation: >-
      Establishes that the proteostatic-stress amplifier is shared by the PMP22
      and MPZ trigger arms rather than being specific to one gene.
  - reference: PMID:29462293
    reference_title: "Intrathecal gene therapy in mouse models expressing CMT1X mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All three mutants were localized in the perinuclear compartment of
      myelinating Schwann cells consistent with retention in the ER (T55I) or
      Golgi (R75W, N175D) and loss of physiological expression in the
      non-compact myelin.
    explanation: >-
      Shows the mistrafficking half of this node for the connexin-32 arm: the
      mutant protein is retained in the secretory pathway and is absent from the
      myelin compartment where it is needed.
  downstream:
  - target: Dysmyelination and Segmental Demyelination of Peripheral Nerve
    description: >-
      Sustained ER stress and failed delivery of myelin proteins block
      myelination and destabilize existing internodes.

- name: Dysmyelination and Segmental Demyelination of Peripheral Nerve
  description: >-
    The rate-limiting, disorder-agnostic step of this module and its key
    conformance target. Peripheral nerve fibers are inadequately myelinated from
    the outset (dysmyelination/hypomyelination) and lose myelin segmentally
    thereafter, with internodal myelin thinned, unstable, or absent. This is the
    lesion every demyelinating hereditary neuropathy converges on, whatever its
    trigger gene, and it is what distinguishes this module from primarily axonal
    neuropathy.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: peripheral nervous system myelin maintenance
    term:
      id: GO:0032287
      label: peripheral nervous system myelin maintenance
    modifier: DECREASED
  - preferred_term: myelin assembly
    term:
      id: GO:0032288
      label: myelin assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: myelin sheath
    term:
      id: GO:0043209
      label: myelin sheath
    modifier: ABNORMAL
  locations:
  - preferred_term: peripheral nerve
    term:
      id: UBERON:0001021
      label: nerve
  evidence:
  - reference: PMID:21252112
    reference_title: "Inherited demyelinating neuropathies with micromutations of peripheral myelin protein 22 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Charcot-Marie-Tooth disease type 1A is a hypertrophic de-remyelinating
      neuropathy manifesting with peroneal muscular atrophy and uniform, marked,
      slowing of nerve conduction velocities.
    explanation: >-
      Characterizes the central effector directly: repeated de- and
      remyelination of peripheral nerve as the defining lesion of the
      prototypical conformer.
  downstream:
  - target: Tomaculous and Onion-Bulb Myelin Remodeling
    description: >-
      Cycles of demyelination and attempted repair leave a characteristic
      structural signature on nerve biopsy.
  - target: Nerve Conduction Slowing and Conduction Block
    description: >-
      Loss of internodal myelin degrades saltatory conduction along the fiber.

- name: Tomaculous and Onion-Bulb Myelin Remodeling
  description: >-
    The histopathological signature of chronic Schwann cell myelin failure, and
    a branch of the module rather than a step on its causal spine: conformers
    reach the conduction and axonal-loss nodes whether or not they show this
    remodeling. Reduced PMP22 dosage yields focal sausage-like myelin thickenings
    (tomacula) at paranodes; repeated cycles of demyelination and remyelination
    yield concentric Schwann cell process wrapping (onion bulbs) and clinically
    palpable hypertrophic nerves. Which signature predominates is
    disorder-specific and is one of the substitutions a conforming entry makes.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: paranode region of axon
    term:
      id: GO:0033270
      label: paranode region of axon
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21252112
    reference_title: "Inherited demyelinating neuropathies with micromutations of peripheral myelin protein 22 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary neuropathy with liability to pressure palsies is a recurrent
      focal neuropathy with sausage-like myelin thickening (tomacula) and
      non-uniform nerve conduction velocity changes.
    explanation: >-
      Establishes the tomaculous arm of this remodeling node and ties it to the
      reduced-dosage trigger.
  - reference: PMID:34996390
    reference_title: "Coexistence of Charcot-Marie-Tooth 1A and nondystrophic myotonia due to PMP22 duplication and SCN4A pathogenic variants: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sural nerve biopsies revealed a chronic demyelinating and remyelinating
      process with onion bulb formations in the proband.
    explanation: >-
      Documents the onion-bulb arm of this node in a genetically confirmed
      PMP22-duplication patient, tying the remodeling directly to the repeated
      demyelination-remyelination cycles and to a trigger lesion inside this
      module's scope.

- name: Nerve Conduction Slowing and Conduction Block
  description: >-
    Loss and thinning of internodal myelin degrades saltatory conduction,
    slowing motor and sensory conduction velocity and, where demyelination is
    focal, producing frank conduction block across the affected segment. The
    pattern is diagnostically informative and disorder-specific: uniform,
    diffuse slowing in the PMP22-duplication forms; non-uniform, asymmetric
    slowing in the connexin-32 and reduced-dosage forms, where it can mimic
    acquired inflammatory neuropathy.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: transmission of nerve impulse
    term:
      id: GO:0019226
      label: transmission of nerve impulse
    modifier: DECREASED
  evidence:
  - reference: PMID:16775364
    reference_title: "Clinical and electrophysiological aspects of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nerve conduction slowing is uniform and diffuse in the most common CMT1A
      associated with the 17p12 duplication, whereas it is often asymmetric and
      nonhomogeneous in CMTX
    explanation: >-
      Establishes conduction slowing as the shared electrophysiological output
      of this module while recording the disorder-specific pattern conformers
      substitute. Evidence source is OTHER because this is a review.
  - reference: PMID:10869062
    reference_title: "Neurological dysfunction and axonal degeneration in Charcot-Marie-Tooth disease type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with CMT1A typically have slowed nerve conduction velocities
      (NCVs), reduced compound motor and sensory nerve action potentials (CMAPs
      and SNAPs), distal weakness, sensory loss and decreased reflexes.
    explanation: >-
      Documents the conduction abnormality alongside the reduced response
      amplitudes that mark the transition to the axonal-loss node.
  downstream:
  - target: Secondary Axonal Loss and Length-Dependent Deficit
    description: >-
      Chronically demyelinated axons lose trophic support from their Schwann
      cells and degenerate.

- name: Secondary Axonal Loss and Length-Dependent Deficit
  description: >-
    The clinical terminus of the module, and the point at which it hands off to
    `peripheral_axonal_degeneration`. Chronically demyelinated axons lose the
    trophic and metabolic support their Schwann cells normally provide and
    degenerate in a length-dependent manner, producing distal weakness, wasting,
    sensory loss and areflexia. The mechanistically important asymmetry, and one
    conformers must preserve, is that disability tracks this secondary axonal
    loss rather than the conduction slowing that precedes it — which is why
    therapies aimed only at conduction velocity have not translated.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  biological_processes:
  - preferred_term: neuron remodeling
    term:
      id: GO:0016322
      label: neuron remodeling
    modifier: INCREASED
  evidence:
  - reference: PMID:10869062
    reference_title: "Neurological dysfunction and axonal degeneration in Charcot-Marie-Tooth disease type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these data strongly support the hypothesis that neurological dysfunction
      and clinical disability in CMT1A are caused by loss or damage to large
      calibre motor and sensory axons.
    explanation: >-
      Directly supports the claim that disability is driven by the secondary
      axonal loss rather than by demyelination itself, the asymmetry this node
      encodes.
  - reference: PMID:16775364
    reference_title: "Clinical and electrophysiological aspects of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations of genes involved in different functions eventually lead to a
      length-dependent axonal degeneration, which is the likely basis of the
      distal predominance of the CMT phenotype.
    explanation: >-
      Establishes the length-dependent distribution of the terminal deficit and
      the hand-off to the shared axonal-degeneration pathway. Evidence source is
      OTHER because this is a review.

treatments:
- name: Unfolded Protein Response Modulation (IFB-088 / Sephin1 / icerguestat)
  description: >-
    An investigational small-molecule modulator of the integrated stress
    response that prolongs eIF2-alpha phosphorylation, reducing the load of
    newly synthesized protein entering the Schwann cell endoplasmic reticulum so
    that quality control can cope with the misfolded myelin protein and
    myelination can proceed. It improved motor function, neurophysiology,
    myelin thickness and UPR markers in mouse models of both the MPZ and the
    PMP22 trigger arms. This is the module's drug-target pattern, not a
    treatment recommendation, and conforming disorder entries do not inherit it:
    the evidence is mouse-only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking
    treatment_effect: INHIBITS
    description: >-
      Reducing the flux of nascent protein into the ER relieves the proteostatic
      burden at the amplifier node and allows myelination to resume.
    evidence:
    - reference: PMID:35501630
      reference_title: "Treatment with IFB-088 Improves Neuropathy in CMT1A and CMT1B Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Myelination, as demonstrated by g-ratios and myelin thickness, improved
        in CMT1B and CMT1A mice and markers of UPR activation returned towards
        wild-type values.
      explanation: >-
        Shows that acting on the proteostatic-stress node restores the
        downstream myelination phenotype in models of two different trigger
        genes.
  evidence:
  - reference: PMID:35501630
    reference_title: "Treatment with IFB-088 Improves Neuropathy in CMT1A and CMT1B Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we administered Sephin1/IFB-088/icerguestat, a UPR modulator which showed
      efficacy in the MpzS63del model of CMT1B, to heterozygous MpzR98C and
      C3-PMP22 mice.
    explanation: >-
      Names the agent, its mechanism class, and the three mouse models it was
      tested in, establishing what this treatment entry describes and the
      species boundary of the evidence.

discussions:
- discussion_id: schwann_upr_mouse_only
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - "pathophysiology#Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking"
  prompt: >-
    Does relieving Schwann cell ER stress improve myelination and disability in
    human demyelinating CMT, or is the UPR-modulation result confined to
    transgenic mouse models?
  rationale: >-
    The whole proteostatic-stress arm of this module, and the drug-target
    pattern attached to it, rests on transgenic mouse models (MpzS63del,
    MpzR98C/+, C3-PMP22) in which the mutant transgene is expressed at levels
    that may not match the human heterozygous state. Human demyelinating CMT
    disability is driven by secondary axonal loss accumulated over decades,
    which a mouse study running months cannot reproduce; a myelin-thickness
    (g-ratio) rescue in mouse is therefore not evidence of a disability benefit
    in patients. Conformers must not curate UPR modulation as an effective human
    treatment on the strength of this module.
  proposed_experiments:
  - experiment_id: upr_modulation_cmt1b_trial
    name: Controlled trial of UPR modulation in genetically defined CMT1B
    description: >-
      A randomized trial in MPZ-variant CMT1B powered on a validated clinical
      outcome (CMT Neuropathy Score) rather than on nerve conduction velocity,
      with paired nerve imaging or biopsy where feasible to test whether the
      mouse myelin-thickness rescue occurs in human nerve.

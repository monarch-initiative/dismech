name: Viral Protease Inhibition Module
description: >-
  A conserved antiviral drug-mechanism pattern centered on virus-encoded
  protease-dependent polyprotein processing. Many RNA viruses and retroviruses
  synthesize polyprotein precursors whose products become functional only after
  proteolytic cleavage. The shared trunk is polyprotein synthesis followed by
  cleavage by a virus-encoded protease. Its productive output is
  virus-family-specific: SARS-CoV-2 Mpro and HCV NS3/4A release nonstructural
  replicase proteins needed for replication-complex formation and viral RNA
  replication, whereas HIV protease cleavage of Gag and Gag-Pol drives
  structural virion maturation. Protease inhibitors act at the shared
  processing node, but the downstream antiviral phenotype must follow the
  applicable branch: loss of replicase function for SARS-CoV-2 and HCV, or
  production of immature non-infectious particles for HIV. Resistance caused by
  viral protease substitutions is an adaptive-escape branch. Pharmacokinetic
  enhancement with a host CYP3A inhibitor is regimen context, not viral
  resistance and not a second viral-protease target.
category: Module
creation_date: "2026-06-24T00:00:00Z"
notes: >-
  This pathogen-process-centric module models biological steps rather than
  individual drugs. Disorder nodes reference exact anchors with conforms_to,
  and protease-inhibitor treatments point to the conforming virus-specific
  processing node with target_mechanisms. Key conformance / treatment target:
  "Virus-Encoded Protease-Dependent Polyprotein Processing". The two outputs
  are deliberately distinct. COVID-19 and Acute_Hepatitis_C_Virus_Infection
  conform through "Replication-Complex Formation and Viral RNA Replication";
  an HIV conformer would instead use "Protease-Driven Structural Virion
  Maturation" and may continue to "Production of Immature, Non-Infectious
  Virions". As a high-precision operational curation boundary, a qualifying
  branch must model synthesis of a viral polyprotein precursor, cleavage at
  defined junctions by a virus-encoded protease, and exactly the applicable
  productive output: nonstructural replicase function and viral RNA replication,
  or Gag/Gag-Pol structural maturation. Conformance to the central
  virus-encoded processing node is mandatory. Protease-resistance and
  immature-particle nodes are optional, context-specific extensions and are not
  sufficient by themselves. Host-protease entry or priming (including TMPRSS2
  and furin), host CYP3A boosting, protease-mediated immune evasion without the
  polyprotein-processing trunk, replication or viremia alone, immature particles
  alone, and non-protease antiviral targets do not qualify. Ritonavir is itself
  an HIV protease inhibitor, but in modern regimens it is used almost
  exclusively as a pharmacokinetic enhancer. In nirmatrelvir/ritonavir it
  inhibits host CYP3A rather than the viral protease;
  that boosting role is therefore described separately from viral target
  inhibition and resistance. See projects/ANTIVIRAL.md.
pathophysiology:
- name: Synthesis of the Viral Polyprotein Precursor
  description: >-
    The viral genome is expressed as one or more polyprotein precursors. These
    precursors contain structural proteins, replicative enzymes, or both, and
    must be cleaved into individual functional products. Examples include HIV
    Gag and Gag-Pol, the HCV polyprotein, and the SARS-CoV-2 replicase
    polyproteins pp1a and pp1ab.
  role: trigger
  biological_processes:
  - preferred_term: Viral Gene Expression
    term:
      id: GO:0019080
      label: viral gene expression
  evidence:
  - reference: PMID:32858867
    reference_title: "HIV-1 Maturation: Lessons Learned from Inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the Gag and GagPol polyproteins are translated
    explanation: >-
      This HIV-1 maturation review establishes synthesis of Gag and Gag-Pol as
      the upstream source of protease substrates.
  - reference: PMID:35380892
    reference_title: "Structural basis for replicase polyprotein cleavage and substrate specificity of main protease from SARS-CoV-2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After viral entry, two overlapping polyproteins, pp1a (490 kDa) and pp1ab
      (794 kDa), are translated by the translational machinery of the host.
    explanation: >-
      The SARS-CoV-2 structural study identifies translation of pp1a and pp1ab
      as the precursor-producing step upstream of Mpro processing.
  - reference: PMID:22558217
    reference_title: "New details of HCV NS3/4A proteinase functionality revealed by a high-throughput cleavage assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The hepatitis C virus (HCV) genome encodes a long polyprotein, which is
      processed by host cell and viral proteases to the individual structural
      and non-structural (NS) proteins.
    explanation: >-
      The primary HCV cleavage-assay study establishes the long polyprotein
      precursor and its subsequent proteolytic processing.
  downstream:
  - target: Virus-Encoded Protease-Dependent Polyprotein Processing
    description: >-
      A virus-encoded protease cleaves the synthesized precursor at defined
      junctions to release functional viral proteins.

- name: Virus-Encoded Protease-Dependent Polyprotein Processing
  description: >-
    A virus-encoded peptidase cleaves the polyprotein precursor at defined
    sites. This shared druggable step is instantiated by HIV protease cleavage
    of Gag and Gag-Pol, HCV NS3/4A cleavage within the nonstructural region, and
    SARS-CoV-2 Mpro (3CLpro/nsp5) cleavage of pp1a and pp1ab. Active-site or
    substrate-cleft protease inhibitors prevent the applicable cleavage events.
    The products and downstream phenotype are branch-specific rather than
    interchangeable across these virus families.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Viral Protein Processing
    term:
      id: GO:0019082
      label: viral protein processing
  molecular_functions:
  - preferred_term: Peptidase Activity
    term:
      id: GO:0008233
      label: peptidase activity
  evidence:
  - reference: PMID:32858867
    reference_title: "HIV-1 Maturation: Lessons Learned from Inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      proteolytic processing of the Gag polyprotein by the viral protease
    explanation: >-
      The HIV-1 review supports protease-dependent Gag processing in the
      structural-maturation branch.
  - reference: PMID:35380892
    reference_title: "Structural basis for replicase polyprotein cleavage and substrate specificity of main protease from SARS-CoV-2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mpro of SARS-CoV-2 digests replicase polyproteins, releasing the
      nonstructural proteins (nsps)
    explanation: >-
      The SARS-CoV-2 structural study directly supports Mpro-dependent release
      of replicase nonstructural proteins.
  - reference: PMID:22558217
    reference_title: "New details of HCV NS3/4A proteinase functionality revealed by a high-throughput cleavage assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NS3/4A cleaves the polyprotein sequence at four specific regions.
    explanation: >-
      The primary HCV cleavage-assay study directly supports NS3/4A-dependent
      polyprotein processing.
  downstream:
  - target: Replication-Complex Formation and Viral RNA Replication
    description: >-
      In SARS-CoV-2 and HCV, processing releases nonstructural proteins required
      for replication-complex function and viral RNA replication.
  - target: Protease-Driven Structural Virion Maturation
    description: >-
      In HIV, Gag and Gag-Pol processing drives structural conversion of the
      nascent particle into a mature infectious virion.
  - target: Protease-Inhibitor Resistance
    description: >-
      Under inhibitor selection, protease substitutions that reduce drug
      binding while retaining sufficient processing activity can be enriched.

- name: Replication-Complex Formation and Viral RNA Replication
  description: >-
    In the replicase branch, proteolytic processing releases viral
    nonstructural proteins that form or support the replication machinery.
    SARS-CoV-2 pp1a/pp1ab processing releases products including the RNA
    polymerase and helicase, and HCV NS3/4A processing of the nonstructural
    region is essential for viral replication. Inhibition of the upstream
    protease prevents this functional replicase output; it is not represented
    as production of an immature particle.
  role: effector
  biological_processes:
  - preferred_term: Viral RNA Genome Replication
    term:
      id: GO:0039694
      label: viral RNA genome replication
  evidence:
  - reference: PMID:35380892
    reference_title: "Structural basis for replicase polyprotein cleavage and substrate specificity of main protease from SARS-CoV-2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      replicase polyproteins essential for viral replication and transcription
    explanation: >-
      The SARS-CoV-2 study links the Mpro-processed replicase polyproteins to
      viral replication and transcription.
  - reference: PMID:22558217
    reference_title: "New details of HCV NS3/4A proteinase functionality revealed by a high-throughput cleavage assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NS3/4A is essential for viral replication and has been considered an
      attractive drug target.
    explanation: >-
      The HCV cleavage-assay study links NS3/4A processing to viral replication
      and identifies the protease as a drug target.

- name: Protease-Driven Structural Virion Maturation
  description: >-
    In the structural-maturation branch exemplified by HIV-1, protease-mediated
    Gag and Gag-Pol cleavage reorganizes the immature particle and produces the
    mature capsid and other functional virion components. This branch is not
    used for SARS-CoV-2 Mpro or HCV NS3/4A conformances.
  role: effector
  biological_processes:
  - preferred_term: Virion Assembly
    term:
      id: GO:0019068
      label: virion assembly
  evidence:
  - reference: PMID:32858867
    reference_title: "HIV-1 Maturation: Lessons Learned from Inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the conversion of an immature, noninfectious particle to a mature
      infectious virion
    explanation: >-
      The HIV-1 review supports the protease-dependent immature-to-mature virion
      transition.
  - reference: PMID:32858867
    reference_title: "HIV-1 Maturation: Lessons Learned from Inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the assembly of the mature conical capsid from fully processed capsid
      protein
    explanation: >-
      The HIV-1 review directly describes structural capsid maturation after
      proteolytic processing.
  downstream:
  - target: Production of Immature, Non-Infectious Virions
    description: >-
      When structural Gag/Gag-Pol processing is inhibited, released HIV
      particles retain an immature, non-infectious phenotype.

- name: Production of Immature, Non-Infectious Virions
  description: >-
    In the HIV structural-maturation branch, inhibiting viral protease prevents
    complete Gag and Gag-Pol cleavage. Particles can be released but retain
    immature architecture and are non-infectious. This consequence is scoped
    to the structural branch and is not asserted as the phenotype of HCV
    NS3/4A or SARS-CoV-2 Mpro inhibition.
  role: consequence
  biological_processes:
  - preferred_term: Negative Regulation of Viral Process
    term:
      id: GO:0048525
      label: negative regulation of viral process
  evidence:
  - reference: PMID:32858867
    reference_title: "HIV-1 Maturation: Lessons Learned from Inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      blocking the proteolytic cleavage of the Gag and GagPol polyprotein
      precursors, resulting in a defect in virus particle maturation
    explanation: >-
      The HIV-1 review directly supports defective particle maturation after
      protease inhibition.

- name: Protease-Inhibitor Resistance
  description: >-
    Viral proteases can acquire substitutions that reduce inhibitor affinity
    while preserving enough catalytic activity for polyprotein processing. HCV
    NS3/4A resistance-associated substitutions at positions including R155,
    A156, and D168 illustrate this adaptive escape. Host-drug metabolism and
    pharmacokinetic boosting are intentionally excluded from this node:
    ritonavir or cobicistat enhancement changes inhibitor exposure, whereas
    resistance is a heritable viral target change selected under drug pressure.
  role: adaptive_escape
  evidence:
  - reference: PMID:35993498
    reference_title: "Interdisciplinary in silico studies to understand in-depth molecular level mechanism of drug resistance involving NS3-4A protease of HCV."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      three single amino acid residues (R155, A156 and D168) are notable for
      their presence in clinical isolates
    explanation: >-
      The computational HCV study identifies signature NS3/4A resistance
      positions observed in clinical isolates.
  - reference: PMID:35993498
    reference_title: "Interdisciplinary in silico studies to understand in-depth molecular level mechanism of drug resistance involving NS3-4A protease of HCV."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      the error-prone viral RNA polymerase causes the emergence of resistance
    explanation: >-
      The study supports the mutation supply from which protease-inhibitor
      resistance variants can be selected.

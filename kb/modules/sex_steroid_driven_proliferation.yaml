name: Sex-Steroid-Driven Tissue Proliferation Module
description: >-
  A conserved pathological module representing sustained nuclear sex-steroid
  receptor signalling driving proliferation of a hormone-responsive target
  tissue. Prolonged ligand availability, whether endogenous (ovulatory cycling,
  peripheral aromatisation in adipose tissue, an oestrogen-secreting tumour) or
  exogenous (unopposed oestrogen therapy, a SERM acting as a partial agonist),
  hyperactivates the receptor, sustains mitogenic transcription, and expands the
  target-cell population. The usual endpoint is a benign hormone-dependent
  proliferative lesion; malignant progression requires somatic driver
  alterations selected on that expanded substrate and is the exception rather
  than the rule. The module captures the shared core across endometrium, breast
  and myometrium. Conforming disorder entries substitute the tissue-specific
  receptor, cell type and lesion while preserving the causal chain.
category: Module
creation_date: "2026-08-28T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (for example
  "sex_steroid_driven_proliferation#Nuclear Steroid Receptor Hyperactivation").

  Key tissue-specific substitutions. Endometrium: oestrogen receptor signalling
  (GO:0030520) unopposed by progesterone, in glandular endometrial epithelium
  (CL:0002656), giving endometrial hyperplasia. Breast epithelium: oestrogen
  receptor alpha signalling in luminal epithelium, giving an ER-positive
  proliferative lesion or carcinoma. Breast stroma: stromal oestrogen signalling
  with extracellular matrix organisation (GO:0030198), giving a biphasic
  fibroepithelial lesion. Myometrium: progesterone receptor signalling
  (GO:0050847) in myometrial cells (CL:0002366), giving a leiomyoma; note this
  conformer runs on progesterone rather than oestrogen, which is why the
  amplifier node is written at the nuclear-receptor level rather than as an
  oestrogen-specific step.

  The trigger node is normally realised at the disorder level in the
  environmental block rather than as a conforming pathophysiology node, because
  the exposures that drive it (obesity, unopposed oestrogen therapy, tamoxifen,
  nulliparity, ovulatory cycling) are curated as Environmental entries with
  influences_mechanisms edges pointing at the conformer's amplifier node.

  Not curated as an Xogenesis module. The terminal output is heterogeneous in
  form across conformers - a diffuse hyperplastic tissue state in endometrium
  (MPATH:134 hyperplasia) but a discrete benign neoplasm in myometrium and
  breast stroma (MPATH:218 neoplasm) - so no single pathological-anatomical-entity
  anchor fits the module, and none is asserted.

  The distinction between this module and sustaining_proliferative_signaling is
  deliberate. That module covers oncogenic growth-signal lesions and
  constitutive, ligand-independent pathway activation. Here the receptor and its
  pathway are intact and behaving normally; what is abnormal is the duration and
  opposition of physiological ligand exposure. A conformer whose receptor has
  become ligand-independent (for example an ESR1 mutation driving endocrine
  resistance) has left this module and belongs to that one.
pathophysiology:
- name: Sustained Sex-Steroid Ligand Exposure
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Prolonged availability of oestrogen or progesterone at the target tissue,
    without the counter-regulatory signal that normally limits it. The source
    varies by disorder - repeated ovulatory cycling, peripheral aromatisation of
    androgens in adipose tissue, an oestrogen-secreting tumour, exogenous
    unopposed oestrogen, or a selective oestrogen receptor modulator acting as a
    partial agonist at this particular tissue - but the downstream response
    converges on receptor hyperactivation.
  biological_processes:
  - preferred_term: regulation of hormone levels
    term:
      id: GO:0010817
      label: regulation of hormone levels
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40214304
    reference_title: "UTERINE FIBROIDS."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "During each ovulatory cycle, the myometrium responds to the ovarian steroids, estradiol, and progesterone, via increased tissue stem cell proliferation to prepare for impending pregnancy, during which a somatic mutation may arise to initiate a tumor."
    explanation: >-
      Describes repeated physiological steroid exposure driving a proliferative
      response in the target tissue, and the somatic mutation arising on that
      proliferative substrate. Evidence source is OTHER because this is a
      Physiological Reviews synthesis spanning human, animal and in vitro work.
  downstream:
  - target: Nuclear Steroid Receptor Hyperactivation
    causal_link_type: DIRECT
    description: Sustained ligand availability drives sustained receptor occupancy in the target tissue.

- name: Nuclear Steroid Receptor Hyperactivation
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Intracellular steroid hormone receptor signalling running above its normal
    level and for longer than its normal interval. The receptor itself is intact
    and ligand-dependent; what is abnormal is the duration of activation and the
    absence of the opposing signal - progesterone in the endometrium, the
    luteal-phase and post-menopausal fall in ovarian output elsewhere. Which
    receptor carries the signal is the main tissue-specific substitution:
    oestrogen receptor in endometrium and breast, progesterone receptor in
    myometrium.
  biological_processes:
  - preferred_term: nuclear receptor-mediated steroid hormone signaling pathway
    term:
      id: GO:0030518
      label: nuclear receptor-mediated steroid hormone signaling pathway
    modifier: INCREASED
  - preferred_term: estrogen receptor signaling pathway
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
    modifier: INCREASED
  - preferred_term: progesterone receptor signaling pathway
    term:
      id: GO:0050847
      label: progesterone receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:41549581
    reference_title: "Targeting Estrogen Pathways in Breast Cancer: A Review of Current Therapies and Emerging Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At the heart of this subtype is the estrogen signaling pathway, especially the estrogen receptor alpha (ERα), which plays a major role in the development, growth, and response to these cancers."
    explanation: >-
      Places receptor-level oestrogen signalling at the centre of the
      hormone-dependent breast phenotype, supporting this node as the amplifier
      in the breast conformer. Evidence source is OTHER because this is a
      narrative review spanning mechanism and therapeutics.
  - reference: PMID:21802066
    reference_title: "Understanding obesity and endometrial cancer risk: opportunities for prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conditions that are accompanied by prolonged progesterone deficiencies therefore promote endometrial proliferation and increase the risk of endometrial hyperplasia and its progression to endometrial cancer"
    explanation: >-
      Establishes that it is the loss of progesterone opposition, not oestrogen
      alone, that makes the signal pathological in the endometrial conformer -
      the "unopposed" half of this node.
  downstream:
  - target: Sustained Mitogenic Transcriptional Output
    causal_link_type: DIRECT
    description: The activated receptor acts as a transcription factor at its target promoters.

- name: Sustained Mitogenic Transcriptional Output
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The ligand-bound receptor drives transcription of growth and cell-cycle genes
    for longer than the physiological interval. This is the rate-limiting,
    tissue-agnostic step every conformer funnels through, and the intended key
    conformance target: upstream the ligand source differs by disorder and
    downstream the lesion differs by tissue, but the mitogenic transcriptional
    programme is the shared core.
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    modifier: INCREASED
  evidence:
  - reference: PMID:15369453
    reference_title: "Loss of ERbeta expression as a common step in estrogen-dependent tumor progression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Estrogen induction of cell proliferation is a crucial step in carcinogenesis of gynecologic target tissues, and the mitogenic effects of estrogen in these tissues (such as breast, endometrium and ovary) are well documented both in vitro and in vivo."
    explanation: >-
      States the conserved mitogenic step across multiple hormone-responsive
      target tissues, which is what makes this a module node rather than a
      disorder-specific one. Evidence source is OTHER because the review
      explicitly synthesises in vitro and in vivo evidence.
  downstream:
  - target: Target-Cell Population Expansion
    causal_link_type: DIRECT
    description: Sustained mitogenic transcription drives cell-cycle entry in the responsive population.

- name: Target-Cell Population Expansion
  role: effector
  biological_scale: CELLULAR
  description: >-
    The hormone-responsive cell population enlarges. Which population expands is
    the second major tissue-specific substitution - glandular endometrial
    epithelium, breast luminal epithelium, breast stroma, or myometrial smooth
    muscle - and in the stromal and myometrial conformers the expansion is
    accompanied by disordered extracellular matrix deposition (GO:0030198) that
    gives the resulting lesion its texture.
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:15369453
    reference_title: "Loss of ERbeta expression as a common step in estrogen-dependent tumor progression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the mitogenic effects of estrogen in these tissues (such as breast, endometrium and ovary) are well documented both in vitro and in vivo"
    explanation: >-
      Supports proliferation of the target-tissue cell population as the measured
      consequence of the hormonal signal, across more than one tissue.
  downstream:
  - target: Benign Hormone-Dependent Proliferative Lesion
    causal_link_type: DIRECT
    description: Continued expansion produces a clinically detectable proliferative lesion.

- name: Benign Hormone-Dependent Proliferative Lesion
  role: consequence
  biological_scale: TISSUE
  description: >-
    A benign proliferative lesion of the target tissue - endometrial hyperplasia,
    an endometrial polyp, a fibroadenoma, a leiomyoma. This is the usual endpoint
    of the module and the reason a hormone-responsive tissue finding is more
    often benign than malignant. The lesion is nonetheless an expanded substrate
    in which somatic driver alterations can subsequently be selected, so it is
    also the point at which conforming malignant entries branch away into their
    own driver nodes. Curators should not read the presence of this node in a
    cancer entry as implying that progression is the expected course.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:32648824
    reference_title: "Removal of uterine polyps: clinical management and surgical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In asymptomatic women, the risk of malignancy is low, and there are no known benefits of polyp removal in the prevention of malignant transformation."
    explanation: >-
      Supports the benign lesion usually remaining benign, which is the claim
      that distinguishes this consequence node from a precursor node on an
      obligate path to malignancy.
  - reference: PMID:37832697
    reference_title: "Post-Menopausal Bleeding: Role of Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common etiology of PMB is vaginal or endometrial atrophy and endometrial polyps, while endometrial hyperplasia and carcinoma account for less than 10% of PMB."
    explanation: >-
      Quantifies the benign preponderance in the endometrial conformer, where
      benign lesions outnumber hyperplasia and carcinoma among women presenting
      with the cardinal symptom.
treatments:
- name: Steroid Hormone Axis Suppression
  description: >-
    Lowering ligand availability or blocking the receptor - aromatase inhibition,
    GnRH agonist or antagonist therapy, or a receptor antagonist - acts on the
    amplifier node rather than on the downstream lesion. This is the module's
    drug-target design pattern: because the lesion is hormone-dependent,
    withdrawing the signal shrinks it, and the effect is typically reversible on
    withdrawal, which is itself evidence that the amplifier is the operative node.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Nuclear Steroid Receptor Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Removing ligand or blocking the receptor suppresses the amplifier node and
      with it the mitogenic transcriptional output downstream.
  evidence:
  - reference: PMID:40214304
    reference_title: "UTERINE FIBROIDS."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Suppression of estrogen or progesterone production and progesterone antagonists have been used for temporary shrinkage of these tumors and symptom relief."
    explanation: >-
      Suppressing steroid production or antagonising the receptor shrinks the
      lesion, validating the amplifier node as the therapeutic target and showing
      the dependence is ongoing rather than historical.
- name: Progestin Opposition of the Target Tissue
  description: >-
    Supplying the counter-regulatory signal the module lacks, rather than
    removing the driving one. In the endometrium local progestin delivery
    restores the opposition whose absence defines the amplifier node, and largely
    prevents the benign lesion from forming. Its efficacy is the cleanest
    evidence that the endometrial conformer runs through an opposable
    oestrogen-receptor route.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levonorgestrel
      term:
        id: CHEBI:6443
        label: levonorgestrel
  target_mechanisms:
  - target: Benign Hormone-Dependent Proliferative Lesion
    treatment_effect: INHIBITS
    description: >-
      Restoring progestin opposition prevents formation of the benign
      proliferative lesion that is this module's usual endpoint.
  evidence:
  - reference: PMID:25423691
    reference_title: "The role of levonorgestrel-releasing intrauterine system for endometrial protection in women with breast cancer taking tamoxifen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of LNG-IUS reduced the incidence of endometrial hyperplasia (OR = 0.13, 95% CI 0.03-0.58, p = 0.007)."
    explanation: >-
      Local progestin largely abolishes the hyperplasia that unopposed
      oestrogenic signalling produces, supporting opposition as an effective
      intervention on this module's consequence node.

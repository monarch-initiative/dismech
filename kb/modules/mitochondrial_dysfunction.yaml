name: Mitochondrial Dysfunction Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed mitochondrial dysfunction: the age-associated decline of mitochondrial
  quality and bioenergetic capacity and its downstream consequences. Because
  mitochondria convert dietary calories into ATP by oxidative phosphorylation
  while generating reactive oxygen species (ROS) as a by-product, and because
  mitochondrial DNA (mtDNA) is present in many copies and encodes essential
  respiratory-chain subunits, post-mitotic tissues accumulate somatic mtDNA
  mutations and respiratory-chain dysfunction with age. Declining bioenergetics
  and rising oxidative stress are incompletely counteracted because mitophagy
  (autophagic clearance of damaged mitochondria) also wanes, so dysfunctional,
  ROS-producing, pro-inflammatory mitochondria accumulate. Mitochondrial
  dysfunction feeds several other hallmarks - cellular senescence, chronic
  inflammation, and the decline in stem-cell activity - and converges on
  age-related tissue dysfunction. Individual disorder entries declare
  conformance via conforms_to on their pathophysiology nodes, substituting the
  disease-specific lesion (e.g. primary mtDNA/nuclear respiratory-chain defects
  in mitochondrial disease, or secondary mitochondrial injury in
  neurodegeneration and metabolic disease) while preserving the conserved
  damage -> bioenergetic-decline/ROS -> impaired-clearance -> tissue-decline
  chain. A pharmacological arm is curated alongside the chain, because the
  central question this module raises - whether age-related bioenergetic
  decline is a reversible regulatory state or only the readout of accumulated
  damage - has been tested directly: the cardiolipin-binding peptide
  elamipretide (SS-31) reverses the bioenergetic, redox, proton-leak, and
  organ-function phenotypes in naturally aged mice without increasing
  mitochondrial content, while the one randomized human test produced target
  engagement without functional benefit.
category: Module
module_categories:
- METABOLISM
- AGING
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress").
  Conforming nodes in disorder files should include the corresponding
  biological processes and causal edges, specialized to their disease context.
  The module is intentionally kept lean and deliberately does NOT adjudicate the
  contested mitochondrial free-radical theory of aging or embed disease-specific
  mtDNA lesions; such claims belong on the relevant disorder entry. Complements
  cellular_senescence and inflammaging (mitochondrial dysfunction is an upstream
  driver of both) and deregulated_nutrient_sensing (mitophagy is an autophagic
  quality-control arm). Key conformance target:
  "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress".

  A naked mole-rat (Heterocephalus glaber) comparative negative model is
  attached under animal_models, and is this module's clearest counterexample to
  a simple oxidative-damage-to-aging chain: the oxidative arm of the central
  effector node is exaggerated relative to the mouse while the age-related
  tissue-dysfunction consequence is never reached. It is a species comparison,
  not a disease model, and conforming disorder entries do NOT inherit those
  links.

  The module also carries a pharmacological-probe arm - elamipretide (SS-31)
  under treatments, the naturally aged wild-type mouse under animal_models, and
  the elamipretide_aging_translation_gap discussion. That arm exists to record
  which of these nodes have been shown to be reversible and in what system; it
  is not an endorsement of the drug, and a conforming disorder entry should
  substitute its own disease-specific target node rather than copy the module
  targets.
pathophysiology:
- name: Mitochondrial Damage and mtDNA Mutation
  description: >-
    With age, post-mitotic tissues accumulate somatic mitochondrial DNA (mtDNA)
    mutations and respiratory-chain damage. Because mtDNA encodes essential
    subunits of the oxidative-phosphorylation machinery and exists in many
    copies per cell, this heritable mitochondrial damage is the initiating
    lesion that compromises energy production.
  role: trigger
  biological_processes:
  - preferred_term: Aerobic Respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:23454757
    reference_title: "The role of mitochondria in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Somatic mitochondrial DNA (mtDNA) mutations and respiratory chain
      dysfunction accompany normal aging
    explanation: >-
      Establishes accumulation of somatic mtDNA mutations and respiratory-chain
      dysfunction with normal aging, the initiating lesion of this module.
      Evidence source is OTHER because this is a review.
  - reference: PMID:16285865
    reference_title: "A mitochondrial paradigm of metabolic and degenerative diseases, aging, and cancer: a dawn for evolutionary medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      I propose that the delayed-onset and progressive course of the age-related
      diseases results from the accumulation of somatic mutations in the mtDNAs
      of post-mitotic tissues.
    explanation: >-
      Proposes accumulation of somatic mtDNA mutations in post-mitotic tissues as
      the basis of age-related disease, supporting this trigger node. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Bioenergetic Decline and Oxidative Stress
- name: Bioenergetic Decline and Oxidative Stress
  description: >-
    Damaged mitochondria produce less ATP by oxidative phosphorylation while
    generating more reactive oxygen species (ROS) as a toxic by-product. This
    fall in mitochondrial quality and activity - correlated with the development
    of a wide range of age-related diseases - is the central effector state that
    disease-specific mitochondrial lesions converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Oxidative Phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: Reactive Oxygen Species Metabolism
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:26942670
    reference_title: "The Mitochondrial Basis of Aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A decline in mitochondrial quality and activity has been associated with
      normal aging and correlated with the development of a wide range of
      age-related diseases.
    explanation: >-
      Establishes the decline in mitochondrial quality/activity as an aging
      correlate and driver of age-related disease, the central effector modeled
      here. Evidence source is OTHER because this is a review.
  - reference: PMID:16285865
    reference_title: "A mitochondrial paradigm of metabolic and degenerative diseases, aging, and cancer: a dawn for evolutionary medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since the mitochondria use oxidative phosphorylation (OXPHOS) to convert
      dietary calories into usable energy, generating reactive oxygen species
      (ROS) as a toxic by-product
    explanation: >-
      Describes oxidative phosphorylation and ROS generation, the bioenergetic
      and oxidative-stress axes of this node. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Impaired Mitophagy and Quality Control
  - target: Mitochondrial Contribution to Senescence and Inflammation
- name: Impaired Mitophagy and Quality Control
  description: >-
    Autophagic turnover specific for mitochondria (mitophagy) normally
    eliminates dysfunctional or damaged mitochondria, counteracting
    degeneration and dampening inflammation. When mitophagy and general
    autophagy decline with age, damaged mitochondria are not cleared and
    accumulate, amplifying bioenergetic failure and pro-inflammatory,
    pro-apoptotic signaling.
  role: amplifier
  biological_processes:
  - preferred_term: Mitophagy
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    modifier: DECREASED
  evidence:
  - reference: PMID:21868666
    reference_title: "Mitochondria and the autophagy-inflammation-cell death axis in organismal aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autophagic turnover of cellular constituents, be it general or specific
      for mitochondria (mitophagy), eliminates dysfunctional or damaged
      mitochondria, thus counteracting degeneration, dampening inflammation, and
      preventing unwarranted cell loss.
    explanation: >-
      Establishes mitophagy as the quality-control mechanism whose decline
      permits accumulation of damaged mitochondria, the amplifying step modeled
      here. Evidence source is OTHER because this is a review.
  downstream:
  - target: Age-Related Tissue Dysfunction
- name: Mitochondrial Contribution to Senescence and Inflammation
  description: >-
    Beyond energy failure, dysfunctional mitochondria drive other aging
    hallmarks: they contribute to cellular senescence, chronic inflammation
    (via pro-inflammatory signaling), and the age-dependent decline in
    stem-cell activity. This node is the conserved interface at which
    mitochondrial dysfunction feeds the senescence and inflammaging modules.
  role: amplifier
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26942670
    reference_title: "The Mitochondrial Basis of Aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we discuss how mitochondria contribute to specific aspects of the aging
      process, including cellular senescence, chronic inflammation, and the
      age-dependent decline in stem cell activity
    explanation: >-
      Establishes that mitochondria contribute to senescence, chronic
      inflammation, and stem-cell decline, the cross-hallmark interface modeled
      here. Evidence source is OTHER because this is a review.
  - reference: PMID:21868666
    reference_title: "Mitochondria and the autophagy-inflammation-cell death axis in organismal aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, mitochondria have an important role in pro-inflammatory
      signaling.
    explanation: >-
      States the role of mitochondria in pro-inflammatory signaling, linking this
      node to inflammaging. Evidence source is OTHER because this is a review.
  downstream:
  - target: Age-Related Tissue Dysfunction
- name: Age-Related Tissue Dysfunction
  description: >-
    The combination of bioenergetic decline, oxidative stress, insufficient
    mitochondrial clearance, and mitochondria-driven senescence and inflammation
    degrades tissue function. This is the conserved consequence by which
    mitochondrial dysfunction contributes causally to age-related pathology; the
    specific organ or disease phenotype is supplied by the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:23454757
    reference_title: "The role of mitochondria in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      accumulating evidence has suggested a causative link between mitochondrial
      dysfunction and major phenotypes associated with aging
    explanation: >-
      States a causative link between mitochondrial dysfunction and aging
      phenotypes, the consequence arm modeled here. Evidence source is OTHER
      because this is a review.
  - reference: PMID:21868666
    reference_title: "Mitochondria and the autophagy-inflammation-cell death axis in organismal aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a combination of mitochondrial dysfunction and insufficient autophagy may
      contribute to multiple aging-associated pathologies
    explanation: >-
      Concludes that mitochondrial dysfunction with insufficient autophagy drives
      multiple aging pathologies, supporting this outcome node. Evidence source
      is OTHER because this is a review.
biochemical:
- name: Serum growth differentiation factor 15
  presence: INCREASED
  biomarker_term:
    preferred_term: growth differentiation factor 15 measurement
    term:
      id: NCIT:C181406
      label: Growth Differentiation Factor 15 Measurement
  notes: >-
    GDF-15 is the mitochondrial marker with the strongest claim on this module: it
    is one of the 14 biomarkers in the 2025 Delphi expert consensus on biomarkers
    of aging, and independently a validated serum marker of primary mitochondrial
    disease. Its weakness is specificity rather than sensitivity, since it rises in
    a wide range of non-mitochondrial conditions, so it is better used as a graded
    monitoring readout than as a diagnostic discriminator. GDF-15 is on the TAME
    Biomarkers Workgroup panel as well as the 2025 Delphi consensus list, making it
    one of the few markers in this KB endorsed both for aging intervention trials
    and for mitochondrial disease.
  evidence:
  - reference: PMID:25446397
    reference_title: "GDF15 is a novel biomarker to evaluate efficacy of pyruvate therapy for mitochondrial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      serum GDF15 levels were significantly higher in patients with mitochondrial
      diseases than in those with other diseases
    explanation: >-
      Establishes elevated serum GDF-15 as a marker of mitochondrial dysfunction in
      patients.
  - reference: PMID:39708300
    reference_title: "An Expert Consensus Statement on Biomarkers of Aging for Use in Intervention Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There was moderate to high consensus (70%–98% agreement) on 14 biomarkers
      (IGF-1, growth GDF-15, hsCRP, IL-6, muscle mass, muscle strength, hand grip
      strength, Timed-Up-and-Go, gait speed, standing balance test, frailty index,
      cognitive health, blood pressure, DNA methylation/epigenetic clocks)
    explanation: >-
      Places GDF-15 among the consensus biomarkers of aging for intervention
      studies, which is what licenses its use in an aging-hallmark module rather
      than only in primary mitochondrial disease entries.
  - reference: PMID:30151729
    reference_title: "A framework for selection of blood-based biomarkers for geroscience-guided clinical trials: report from the TAME Biomarkers Workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Application of these selection criteria to the current literature resulted in
      a short list of blood-based biomarkers proposed for TAME: IL-6, TNFα-receptor
      I or II, CRP, GDF15, insulin, IGF1, cystatin C, NT-proBNP, and hemoglobin
      A1c.
    explanation: >-
      Independently selects GDF-15 for a geroscience trial panel, corroborating its
      use here as an aging readout rather than only a mitochondrial disease marker.
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, GDF15 was increased also in a wide range of nonmitochondrial
      conditions.
    explanation: >-
      Refutes any reading of GDF-15 as specific to mitochondrial dysfunction. Kept
      as a separate REFUTE item rather than folded into the supporting evidence,
      because it cuts the other way on specificity.
  readouts:
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Serum GDF-15 rises as part of the integrated stress response to bioenergetic
      failure, reporting the metabolic consequence of mitochondrial damage rather
      than the damage itself.
    evidence:
    - reference: PMID:25446397
      reference_title: "GDF15 is a novel biomarker to evaluate efficacy of pyruvate therapy for mitochondrial diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that expression and secretion of growth differentiation factor 15
        (GDF15) were increased in 2SD cells treated with lactate
      explanation: >-
        Cybrid cells carrying a MELAS mutation increase GDF15 secretion under
        lactate load, linking the marker to the bioenergetic state directly.
- name: Serum fibroblast growth factor 21
  presence: INCREASED
  biomarker_term:
    preferred_term: fibroblast growth factor 21 measurement
    term:
      id: NCIT:C112280
      label: Fibroblast Growth Factor 21 Measurement
  notes: >-
    FGF-21 is more specific than GDF-15 but narrower: it reports defects of
    mitochondrial translation and mtDNA maintenance, and is only weakly induced by
    structural respiratory-chain subunit or assembly-factor defects. A normal
    FGF-21 therefore does not exclude mitochondrial disease. Note the scope limit
    for this module: FGF-21 is validated in primary mitochondrial myopathy, not in
    age-related mitochondrial decline, and the discussions block records that gap
    rather than assuming the extension holds.
  evidence:
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We report that S-FGF21 consistently increases in primary mitochondrial
      myopathy, especially in patients with mitochondrial translation defects or
      mitochondrial DNA (mtDNA) deletions
    explanation: >-
      Establishes serum FGF-21 as a marker of mitochondrial translation and mtDNA
      maintenance defects in patients.
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, patients and mice with structural respiratory chain subunit or
      assembly factor defects showed low induction
    explanation: >-
      Refutes FGF-21 as a general readout of mitochondrial dysfunction. The same
      study reports this in both patients and mice, so the limitation is not a
      species artefact.
  readouts:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated serum FGF-21 reports mtDNA deletion and translation-defect lesions
      specifically. Because induction is lesion-type dependent, a normal value is
      uninformative rather than reassuring.
    evidence:
    - reference: PMID:27794108
      reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This is corroborated in mice (mtDNA deletions 1,163 vs 379 pg/mL, p <
        0.0001).
      explanation: >-
        The human association is reproduced in mouse models of mtDNA deletion,
        making FGF-21 one of the few markers in this module with direct
        cross-species concordance on the same lesion.
- name: Blood mitochondrial DNA copy number
  presence: DECREASED
  biomarker_term:
    preferred_term: mitochondrial DNA copy number
    term:
      id: NCIT:C28512
      label: Mitochondrial DNA
  notes: >-
    mtDNA copy number is measurable from ordinary blood-derived DNA, which makes it
    the cheapest marker in this module and the one most likely to already exist in
    a legacy cohort. Its interpretation is the difficulty: copy number is regulated
    tissue-specifically and is not a direct measure of mitochondrial function, so
    the blood value is a proxy for a proxy. Direction is inverted relative to the
    other markers here, since lower copy number marks the worse state.
  evidence:
  - reference: PMID:32988399
    reference_title: "Mitochondrial DNA copy number can influence mortality and cardiovascular disease via methylation of nuclear DNA CpGs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mitochondrial DNA copy number (mtDNA-CN) has been associated with a variety
      of aging-related diseases, including all-cause mortality.
    explanation: >-
      Establishes the association between mtDNA copy number and aging-related
      outcomes across large population cohorts.
  readouts:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: >-
      Reduced blood mtDNA copy number tracks accumulated mitochondrial damage.
      CORRELATES_WITH rather than READOUT_OF because copy number is not a direct
      measure of mitochondrial function.
    evidence:
    - reference: PMID:32988399
      reference_title: "Mitochondrial DNA copy number can influence mortality and cardiovascular disease via methylation of nuclear DNA CpGs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        mtDNA-CN estimates can be derived from DNA isolated from blood and is
        therefore a relatively easily attainable biomarker of mitochondrial
        function.
      explanation: >-
        States both the accessibility that makes this marker practical and, in the
        same sentence, that it is an indirect measure.
treatments:
- name: Elamipretide (SS-31)
  description: >-
    Elamipretide (SS-31, MTP-131) is a synthetic aromatic-cationic tetrapeptide
    that concentrates in the inner mitochondrial membrane independently of
    membrane potential and binds cardiolipin. Occupying cardiolipin preserves
    cristae structure and the organization of the respiratory complexes into
    supercomplexes, keeps the cardiolipin-cytochrome c interaction from
    converting cytochrome c into a peroxidase, and reduces the age-associated
    proton leak attributed to ANT1 - raising ATP output and lowering
    mitochondrial reactive oxygen species without increasing mitochondrial
    content. It is curated here as the reference pharmacological probe of this
    module rather than as an established anti-aging therapy. Because it acts on
    the regulatory redox and structural state of mitochondria that already
    exist, and not on accumulated mtDNA lesions, a benefit from elamipretide is
    evidence that the central-effector node is reversible in situ; it is
    deliberately NOT linked to "Mitochondrial Damage and mtDNA Mutation" for
    that reason. Whether the rodent effect translates to human aging is
    unsettled - see the elamipretide_aging_translation_gap discussion. A
    conforming disorder entry that curates elamipretide should substitute its
    own disease-specific target node (as Barth_Syndrome does, targeting the
    cardiolipin remodeling defect) rather than copying these module targets.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: elamipretide
      term:
        id: CHEBI:233331
        label: elamipretide
  target_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    treatment_effect: INHIBITS
    description: >-
      Binding cardiolipin protects cristae architecture and respiratory
      supercomplex organization and blocks the peroxidase conversion of
      cytochrome c, so oxidative phosphorylation recovers while mitochondrial
      ROS production falls. In aged muscle the recovery of ATPmax, P/O coupling
      and PCr/ATP occurs within an hour of a single dose and without any change
      in mitochondrial content, which places the drug's action on the
      regulatory state of existing mitochondria rather than on mitochondrial
      biogenesis or the repair of damaged organelles.
    evidence:
    - reference: PMID:24117165
      reference_title: "First-in-class cardiolipin-protective compound as a therapeutic agent to restore mitochondrial bioenergetics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        By interacting with cardiolipin, SS-31 prevents cardiolipin from
        converting cytochrome c into a peroxidase while protecting its electron
        carrying function. As a result, SS-31 protects the structure of
        mitochondrial cristae and promotes oxidative phosphorylation.
      explanation: >-
        States the molecular mechanism by which the drug acts on this node -
        cardiolipin binding protecting cristae and promoting oxidative
        phosphorylation. Evidence source is OTHER because this is a review.
    - reference: PMID:32554501
      reference_title: "Mitochondrial protein interaction landscape of SS-31."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The SS-31-interacting proteins, all known cardiolipin binders, fall into
        two groups, those involved in ATP production through the oxidative
        phosphorylation pathway and those involved in 2-oxoglutarate metabolic
        processes.
      explanation: >-
        Cross-linking mass spectrometry in isolated mitochondria shows the drug's
        protein interactors are cardiolipin-binding oxidative-phosphorylation
        machinery, tying target engagement to the bioenergetic arm of this node.
    - reference: PMID:23692570
      reference_title: "Mitochondrial-targeted peptide rapidly improves mitochondrial energetics and skeletal muscle performance in aged mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Age-related declines in resting and maximal mitochondrial ATP
        production, coupling of oxidative phosphorylation (P/O), and cell energy
        state (PCr/ATP) were rapidly reversed after SS-31 treatment, while SS-31
        had no observable effect on young muscle.
      explanation: >-
        Direct demonstration that the drug reverses the bioenergetic decline
        modeled by this node in aged animals. The absence of any effect in young
        muscle is what makes it a probe of the aging state rather than a general
        mitochondrial stimulant.
    - reference: PMID:33319746
      reference_title: "Reduction of elevated proton leak rejuvenates mitochondria in the aged cardiomyocyte."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the tetra-peptide SS-31 prevents age-related excess proton entry,
        decreases the mitochondrial flash activity and mitochondrial
        permeability transition pore opening, rejuvenates mitochondrial function
        by direct association with ANT1 and the mitochondrial ATP synthasome,
        and leads to substantial reversal of diastolic dysfunction
      explanation: >-
        Identifies proton leak through ANT1 as a distinct bioenergetic lesion of
        aging that this drug corrects, adding a coupling-efficiency arm to this
        node alongside ROS.
    - reference: PMID:34264994
      reference_title: "In vivo mitochondrial ATP production is improved in older adult skeletal muscle after a single dose of elamipretide in a randomized trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A single ELAM dose elevated mitochondrial energetic capacity in vivo
        relative to placebo
      explanation: >-
        The one randomized human test of this node's reversibility in ordinary
        aging: a single infusion raised in vivo mitochondrial capacity in older
        adults selected for poor mitochondrial function.
  - target: Age-Related Tissue Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Correcting the bioenergetic and redox state of aged mitochondria improves
      organ-level function that had already declined - diastolic function in the
      aged heart, glomerular architecture in the aged kidney, and fatigue
      resistance and endurance in aged skeletal muscle. Treatment begun in
      late life is sufficient, so this is reversal of an established phenotype
      rather than prevention.
    evidence:
    - reference: PMID:32648542
      reference_title: "Late-life restoration of mitochondrial function reverses cardiac dysfunction in old mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that pre-existing cardiac aging phenotypes can
        be reversed by targeting mitochondrial dysfunction and implicate
        mitochondrial energetics and redox signaling as therapeutic targets for
        cardiac aging.
      explanation: >-
        States the central claim this link makes - an established age-related
        organ phenotype is reversed by acting on the upstream mitochondrial node.
    - reference: PMID:28063595
      reference_title: "The mitochondrial-targeted peptide, SS-31, improves glomerular architecture in mice of advanced age."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SS-31 treatment improved age-related mitochondrial morphology and
        glomerulosclerosis.
      explanation: >-
        Extends the same reversal to a second organ, showing the link is not
        heart-specific. Treatment started at 24 months, after the lesion was
        established.
    - reference: PMID:30597195
      reference_title: "Improving mitochondrial function with SS-31 reverses age-related redox stress and improves exercise tolerance in aged mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Treatment with SS-31 restores redox homeostasis, improves mitochondrial
        quality, and increases exercise tolerance without an increase in
        mitochondrial content.
      explanation: >-
        The skeletal-muscle arm of the same claim, and the sentence that ties the
        functional gain explicitly to redox and quality rather than to
        mitochondrial biogenesis.
    - reference: PMID:34264994
      reference_title: "In vivo mitochondrial ATP production is improved in older adult skeletal muscle after a single dose of elamipretide in a randomized trial."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Despite the increase in ATPmax there was no significant effect of
        treatment on fatigue resistance in the FDI.
      explanation: >-
        Refutes this link in humans at the dose and duration tested: the same
        trial that showed target engagement on the bioenergetic node found no
        functional benefit, so the mechanism-to-tissue-function step is not
        established in human aging. Recorded here rather than omitted because it
        is the main counterweight to the rodent evidence above.
  - target: Mitochondrial Contribution to Senescence and Inflammation
    treatment_effect: INHIBITS
    description: >-
      Because mitochondrial damage is upstream of senescence, correcting it
      pharmacologically in old animals lowers senescence markers. The evidence
      for this link is from a single tissue - the aged mouse glomerulus, where a
      late-life course of SS-31 lowered p16 and senescence-associated
      beta-galactosidase - so it is narrower than the other two links here and
      should be read as kidney-specific until a second tissue is curated. Within
      that scope it is the drug-side counterpart of the module's claim that this
      node is driven by, rather than merely correlated with, mitochondrial
      dysfunction, and it differs from a senolytic, which removes senescent cells
      that have already formed.
    evidence:
    - reference: PMID:28063595
      reference_title: "The mitochondrial-targeted peptide, SS-31, improves glomerular architecture in mice of advanced age."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This systemic pharmacological intervention in old-aged animals limits
        glomerulosclerosis and senescence, reduces parietal epithelial cell
        activation, and improves podocyte and endothelial cell integrity.
      explanation: >-
        A mitochondria-directed drug given in late life reduces senescence in the
        aged glomerulus, supporting a causal direction from the mitochondrial
        nodes to this one.
  notes: >-
    Not approved for any aging indication. Elamipretide's only approved use is
    in Barth syndrome; its phase-3 trial in primary mitochondrial myopathy
    (MMPOWER-3) missed both primary endpoints. Those results are curated on the
    relevant disorder entries and summarized in the discussion attached to this
    treatment; they are recorded here so the module is not read as asserting
    clinical efficacy in aging.
- name: Methylene Blue (Alternative Electron Carrier)
  description: >-
    Methylene blue is a redox-cycling compound that can accept electrons from
    NADH and donate them to cytochrome c, bypassing damaged proximal
    respiratory-chain complexes. Its effect on reactive oxygen species is
    substrate-dependent rather than uniformly antioxidant - it lowers H2O2
    production with complex II substrate but raises it with complex I substrates
    - so it is curated here as modulating, not simply correcting, the
    bioenergetic and oxidative node. Ranked joint third of nine (9/12) by
    Kulkarni et al.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylene blue
      term:
        id: CHEBI:6872
        label: methylene blue
  target_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    treatment_effect: MODULATES
    description: >-
      Methylene blue raises mitochondrial oxygen consumption with both complex I
      and complex II substrates, but its effect on reactive oxygen species runs
      in opposite directions depending on the substrate, so the net effect on
      this node is directionally mixed.
  evidence:
  - reference: PMID:28738167
    reference_title: Methylene blue improves mitochondrial respiration and decreases oxidative stress in a substrate-dependent manner in diabetic rat hearts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, in cardiac mitochondria isolated from diabetic and
      nondiabetic rat hearts, methylene blue improved respiratory function and
      elicited a dichotomic, substrate-dependent effect on ROS production.
    explanation: >-
      Supports the respiratory-function benefit while establishing that the
      reactive-oxygen-species effect is not unidirectional, which is why this
      link is curated as MODULATES rather than RESTORES. Marked INDIRECT because
      the measurement is made in isolated mitochondria from a metabolic-disease
      model, streptozotocin-diabetic rats and their non-diabetic controls, not in
      aged animals; applying it to the age-associated bioenergetic decline this
      node models is an inference step. Evidence source is IN_VITRO (mitochondria
      isolated from rat hearts and assayed by high-resolution respirometry).
  - reference: PMID:28738167
    reference_title: Methylene blue improves mitochondrial respiration and decreases oxidative stress in a substrate-dependent manner in diabetic rat hearts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, methylene blue elicited a significant increase in H2O2
      release in the presence of complex I substrates (glutamate and malate), but
      had an opposite effect in mitochondria energized with complex II substrate
      (succinate).
    explanation: >-
      Gives the specific measurement behind the mixed direction, recording that
      methylene blue increases rather than decreases H2O2 with complex I
      substrates. Retained as a separate item so the unfavorable half of the
      result is visible in the entry rather than folded into a summary. Marked
      INDIRECT for the same reason as the item above: the substrate dependence is
      characterized in isolated rat heart mitochondria, not in an aging model.
      Evidence source is IN_VITRO (isolated rat heart mitochondria).
- name: Metformin (Mitochondrial Bioenergetic Restoration)
  description: >-
    Metformin normalizes mitochondrial bioenergetics in cells from older human
    donors, in which respiratory capacity is impaired and associated with redox
    imbalance. In the aged-T-cell system its mitochondrial and autophagic actions
    were found to run largely in parallel rather than one through the other,
    which is why this module and the disabled-macroautophagy module each carry
    the treatment separately.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    treatment_effect: RESTORES
    description: >-
      Metformin improves mitochondrial bioenergetics in cells from older donors
      that show a measured bioenergetic defect relative to younger donors,
      recovering function toward the younger-donor baseline.
  evidence:
  - reference: PMID:32402267
    reference_title: Metformin Enhances Autophagy and Normalizes Mitochondrial Function to Alleviate Aging-Associated Inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      T cells from older compared to younger subjects also had defects in
      autophagy and mitochondrial bioenergetics that associate with redox
      imbalance.
    explanation: >-
      Documents the age-associated bioenergetic defect coupled to redox
      imbalance, which is precisely the state this node models. Evidence source
      is IN_VITRO (human CD4+ T cells assayed ex vivo).
  - reference: PMID:32402267
    reference_title: Metformin Enhances Autophagy and Normalizes Mitochondrial Function to Alleviate Aging-Associated Inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that metformin improves autophagy and mitochondrial function
      largely in parallel to ameliorate a newly defined inflammaging profile that
      echoes inflammation in diabetes.
    explanation: >-
      States the mitochondrial effect claimed on this node, and records that it
      is largely parallel to rather than downstream of the autophagy effect -
      the reason the drug is curated against both hallmarks independently.
      Evidence source is IN_VITRO (human CD4+ T cells treated ex vivo).
animal_models:
- name: Naked mole-rat (Heterocephalus glaber) comparative longevity model
  species: Naked mole-rat
  genotype: Wild type
  publication: PMID:17054663
  description: >-
    Comparative negative model, and the clearest counterexample this module
    has to a simple oxidative-damage-to-aging chain. The naked mole-rat lives
    in a more pro-oxidative cellular environment than the mouse and carries
    more accrued oxidative damage to lipids, DNA and protein, yet reaches none
    of the age-related tissue dysfunction this chain terminates in over a
    lifespan above 30 years. It is curated here to mark where the chain is
    broken in a naturally long-lived mammal, not as a model of a disease.
  modeled_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The oxidative-stress arm of this node is present and, relative to the
      mouse, exaggerated: lower reduced glutathione and a lower GSH/GSSG ratio,
      about tenfold higher in vivo lipid peroxidation, and higher accrued
      oxidative damage to lipids, DNA and protein.
    limitations: >-
      Only the oxidative arm is recapitulated. This node also asserts falling
      ATP output by oxidative phosphorylation, and the cited comparison does
      not measure respiration, ATP production or mitochondrial content. The
      oxidative state is also present in young naked mole-rats rather than
      developing with age, so it is a species baseline and not the
      age-progressive decline the node describes. All measurements are
      cross-species against mice at matched physiological ages.
    readouts:
    - name: Glutathione redox status
      target: Bioenergetic Decline and Oxidative Stress
      direction: DECREASED
      interpretation: >-
        Poorer antioxidant buffering than the short-lived comparator, so the
        oxidative arm of this node is not avoided by this species.
      evidence:
      - reference: PMID:17054663
        reference_title: "High oxidative damage levels in the longest-living rodent, the naked mole-rat."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Significantly lower GSH and GSH/GSSG in mole-rats indicate poorer
          antioxidant capacity and a surprisingly more pro-oxidative cellular
          environment
        explanation: >-
          The redox measurement behind this readout.
    - name: Accrued oxidative damage to lipids, DNA and protein
      target: Bioenergetic Decline and Oxidative Stress
      direction: INCREASED
      interpretation: >-
        The downstream macromolecular damage attributed to this node is present
        at higher levels than in the mouse.
      evidence:
      - reference: PMID:17054663
        reference_title: "High oxidative damage levels in the longest-living rodent, the naked mole-rat."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          mole-rats exhibit greater levels of accrued oxidative damage to lipids
          (twofold), DNA (approximately two to eight times) and proteins (1.5 to
          2-fold) than physiologically age-matched mice
        explanation: >-
          Quantifies the damage burden in each macromolecular class.
  - target: Age-Related Tissue Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      With the oxidative input present and elevated, the consequence node is
      still not reached: the naked mole-rat shows no age-related increase in
      mortality and only delayed or attenuated age-associated physiological
      decline. The dissociation is the reason the source authors conclude that
      something other than attenuated oxidative stress explains this species'
      longevity.
    limitations: >-
      The supporting argument is organism-level and demographic, from captive
      colony records, so it establishes that age-related mortality is absent
      rather than that mitochondria-driven tissue dysfunction specifically is
      absent. It also does not tell this module which node is broken: a species
      that tolerates oxidative damage without aging may be protecting the
      proteome, the genome, or mitochondrial quality control, and the
      proteostasis and genomic-instability modules carry competing candidates
      for the same phenotype. Naked mole-rat mitophagy has not been measured
      across the lifespan.
    evidence:
    - reference: PMID:17054663
      reference_title: "High oxidative damage levels in the longest-living rodent, the naked mole-rat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        our findings strongly suggest that mechanisms other than attenuated
        oxidative stress explain the impressive longevity of this species
      explanation: >-
        The authors' own conclusion that the oxidative arm of this chain does
        not account for the outcome node in this species.
    - reference: PMID:29364116
      reference_title: Naked Mole-Rat mortality rates defy gompertzian laws by not increasing with age.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the age-specific hazard of mortality did not increase with age, even at
        ages 25-fold past their time to reproductive maturity
      explanation: >-
        The demographic measurement establishing that the consequence node is
        not reached.
- name: Aging turquoise killifish mitochondria (Nothobranchius furzeri)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Young versus old fish assayed in skeletal muscle, brain, liver, skin, and
    dorsal fin, with the complete mitochondrial genome sequenced for this study.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:21624037
  description: >-
    Hartmann and colleagues asked whether the shortest-lived vertebrate held in
    captivity shows the mitochondrial changes canonically attributed to aging.
    Mitochondrial DNA copy number, biogenesis-factor expression, respiratory chain
    complex content, and respiration all decline with age, but the large-scale
    mtDNA deletions expected from the mutation-accumulation account were not
    detectable. The model therefore separates the module's copy-number and
    bioenergetic facets from its somatic-mutation facet.
  modeled_mechanisms:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mitochondrial genome content falls with age across five tissues, together
      with downregulation of the factors that maintain and replicate it. The
      deletion burden that the node's mutation half predicts was, however, not
      detectable in this species.
    limitations: >-
      The absence of detectable deletions is a limit-of-detection result at the
      assay sensitivity used, not proof that none accumulate, and the compressed
      killifish lifespan may simply be too short for clonal deletion expansion.
      Point mutations and heteroplasmy were not quantified. Copy-number loss and
      mutation load are separate mechanisms and this model supports only the
      former, so it should not be cited for mtDNA mutation accumulation.
    readouts:
    - name: Mitochondrial DNA copy number across tissues
      target: Mitochondrial Damage and mtDNA Mutation
      description: >-
        mtDNA copy number in skeletal muscle, brain, liver, skin, and dorsal fin of
        young versus old fish.
      direction: DECREASED
      interpretation: >-
        A consistent multi-tissue decline is the direct measurement supporting the
        genome-content half of this node.
      evidence:
      - reference: PMID:21624037
        reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, mtDNA copy number significantly decreased with age in skeletal muscle, brain, liver, skin and dorsal fin."
        explanation: Reports the copy-number measurement and the tissues in which it was made.
    - name: Large-scale mtDNA deletion burden
      target: Mitochondrial Damage and mtDNA Mutation
      description: >-
        Screen for age-related large-scale deletions in the sequenced killifish
        mitochondrial genome.
      direction: UNCHANGED
      interpretation: >-
        No detectable deletion accumulation, which is a genuine negative result
        against the mutation half of this node in this species.
      evidence:
      - reference: PMID:21624037
        reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "Large-scale mtDNA deletions have been frequently described to accumulate in other organisms with age, but there was no evidence for the presence of detectable age-related mtDNA deletions in N. furzeri."
        explanation: States the negative deletion result explicitly against the expectation from other organisms.
    - name: Expression of mtDNA maintenance and biogenesis factors
      target: Mitochondrial Damage and mtDNA Mutation
      description: >-
        Transcript levels of the mitochondrial biogenesis coactivator and the mtDNA
        binding factors Tfam and mtSsbp in young versus old fish.
      direction: DECREASED
      interpretation: >-
        Coordinated downregulation of the maintenance machinery is the mechanistic
        correlate of the copy-number loss rather than an independent finding.
      evidence:
      - reference: PMID:21624037
        reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "and expression of Tfam and mtSsbp both encoding mtDNA binding factors was downregulated with age"
        explanation: Reports the maintenance-factor measurement underlying this readout.
    evidence:
    - reference: PMID:21624037
      reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, mtDNA copy number significantly decreased with age in skeletal muscle, brain, liver, skin and dorsal fin."
      explanation: >-
        Supports treating this model as informative for the genome-content facet of
        the node, while the deletion readout records where it fails.
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Respiratory chain complex content and mitochondrial respiration both fall in
      aged killifish, giving the module's bioenergetic node a direct functional
      measurement rather than an expression proxy.
    limitations: >-
      Functional respirometry was performed in skeletal muscle only, so the
      bioenergetic claim is not established for the other tissues in which copy
      number falls. Reactive oxygen species production and oxidative damage markers
      were not measured, so the oxidative-stress half of this node is not covered
      by this model as curated here.
    readouts:
    - name: Respiratory chain complex III and IV content in skeletal muscle
      target: Bioenergetic Decline and Oxidative Stress
      description: >-
        Content of respiratory chain complexes in skeletal muscle of old versus
        young fish.
      direction: DECREASED
      interpretation: >-
        Loss of complex content is the structural basis of the respiration defect
        measured in the same tissue.
      evidence:
      - reference: PMID:21624037
        reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The investigation of possible changes in mitochondrial function revealed that the content of respiratory chain complexes III and IV was reduced in skeletal muscle with age."
        explanation: Reports the complex-content measurement behind this readout.
    - name: ADP-stimulated and succinate-dependent respiration
      target: Bioenergetic Decline and Oxidative Stress
      description: >-
        Respirometry on mitochondria isolated from old versus young fish.
      direction: DECREASED
      interpretation: >-
        A functional respiration deficit is the most direct available evidence for
        the bioenergetic node in this model.
      evidence:
      - reference: PMID:21624037
        reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, ADP-stimulated and succinate-dependent respiration was decreased in mitochondria of old fish."
        explanation: Reports the respirometry measurement behind this readout.
    evidence:
    - reference: PMID:21624037
      reference_title: Mitochondrial DNA copy number and function decrease with age in the short-lived fish Nothobranchius furzeri.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, ADP-stimulated and succinate-dependent respiration was decreased in mitochondria of old fish."
      explanation: >-
        Supports treating this model as informative for the bioenergetic node on the
        strength of a direct functional assay.
  notes: >-
    Curated as part of a tranche adding turquoise killifish models across the
    hallmarks-of-aging modules. The deletion-burden readout is the point of
    interest: the canonical mtDNA mutation-accumulation account does not reproduce
    in the shortest-lived vertebrate model, while copy-number and bioenergetic
    decline do.
- name: Naturally aged wild-type mouse
  species: Mouse
  genotype: Wild-type (C57BL/6 and C57BL/6Nia), studied at 24-27 months against 5-6-month young adults
  publication: PMID:23692570
  description: >-
    Chronologically aged, genetically unmodified mice are the system in which
    most of this module's nodes were measured and in which they have been
    pharmacologically reversed. There is no engineered lesion: the phenotype is
    whatever normal aging produces by 24-27 months, which one of the studies
    below equates to a human of about 79 years. The model is curated here
    because the module's central claim - that age-related bioenergetic decline
    is a reversible regulatory state rather than only accumulated damage -
    rests almost entirely on measurements made in it.
  modeled_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Aged mice reproduce the full node: reduced in vivo ATP production and
      oxidative-phosphorylation coupling, a more oxidized glutathione and
      protein-thiol redox state, increased mitochondrial ROS, and an increased
      proton leak. Each of these has been measured directly and each is
      corrected by elamipretide.
    limitations: >-
      Fidelity is MODERATE rather than HIGH because the in vivo deficits are
      not reproduced ex vivo - respiration in permeabilized fibers from the same
      aged muscles is not different from young, so the phenotype depends on the
      intact cellular environment and does not transfer to isolated
      mitochondria. Mouse lifespan compresses the exposure history of human
      aging, cohorts are typically single-sex, and the mtDNA mutation burden of
      an inbred laboratory mouse is not that of an outbred human.
    readouts:
    - name: In vivo mitochondrial phosphorylation capacity (ATPmax) and P/O coupling in skeletal muscle
      target: Bioenergetic Decline and Oxidative Stress
      description: >-
        Combined optical and 31P magnetic resonance spectroscopy of hindlimb
        muscle in the intact animal.
      direction: DECREASED
      interpretation: >-
        The quantitative form of the node's bioenergetic arm, measured without
        removing mitochondria from their cellular context.
      biological_processes:
      - preferred_term: Oxidative Phosphorylation
        term:
          id: GO:0006119
          label: oxidative phosphorylation
        modifier: DECREASED
      evidence:
      - reference: PMID:23692570
        reference_title: "Mitochondrial-targeted peptide rapidly improves mitochondrial energetics and skeletal muscle performance in aged mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In vivo P/O ratio and mitochondrial phosphorylation capacity (ATPmax)
          were significantly depressed in old vs. young adult mice.
        explanation: >-
          Reports the age effect on both measures that ground this readout.
    - name: In vivo ATPmax and P/O coupling after elamipretide treatment
      target: Bioenergetic Decline and Oxidative Stress
      description: >-
        The same spectroscopic measures repeated after 8 weeks of 3 mg/kg/day
        SS-31 in aged mice.
      direction: RESTORED
      interpretation: >-
        Pharmacological reversal of the node in the model, and the basis for
        treating the age-related deficit as regulatory rather than structural.
      evidence:
      - reference: PMID:30597195
        reference_title: "Improving mitochondrial function with SS-31 reverses age-related redox stress and improves exercise tolerance in aged mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          SS-31 reversed age-related decline in maximum mitochondrial ATP
          production (ATPmax) and coupling of oxidative phosphorylation (P/O).
        explanation: >-
          Reports the restoration of both measures after chronic treatment.
    - name: Mitochondrial proton leak in cardiomyocytes
      target: Bioenergetic Decline and Oxidative Stress
      description: >-
        Direct measurement of proton entry in cardiomyocytes from naturally
        aging mice and rats, localized to ANT1.
      direction: INCREASED
      interpretation: >-
        Establishes a coupling-efficiency lesion distinct from ROS production
        within this node.
      evidence:
      - reference: PMID:33319746
        reference_title: "Reduction of elevated proton leak rejuvenates mitochondria in the aged cardiomyocyte."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using the model of naturally aging mice and rats, we show direct
          evidence of increased proton leak in the aged heart mitochondria.
        explanation: >-
          Reports the measurement, in the naturally aged model, that grounds this
          readout.
    - name: Cysteine S-glutathionylation of the cardiac proteome
      target: Bioenergetic Decline and Oxidative Stress
      description: >-
        Shotgun redox proteomics of mouse hearts, comparing 24-month with
        5-6-month animals before and after 8 weeks of elamipretide.
      direction: RESTORED
      interpretation: >-
        A proteome-wide molecular correlate of the node's oxidative-stress arm,
        and the most specific evidence that the drug shifts redox state rather
        than only functional output.
      evidence:
      - reference: PMID:34480713
        reference_title: "Elamipretide (SS-31) treatment attenuates age-associated post-translational modifications of heart proteins."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This shift in the oxidation state of the proteome was almost
          completely reversed by 8 weeks of treatment with elamipretide.
        explanation: >-
          Reports the reversal of the age-associated thiol oxidation that grounds
          this readout.
    evidence:
    - reference: PMID:30597195
      reference_title: "Improving mitochondrial function with SS-31 reverses age-related redox stress and improves exercise tolerance in aged mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The glutathione redox status was more reduced and thiol redox proteomics
        indicated a robust reversal of cysteine S-glutathionylation
        post-translational modifications across the skeletal muscle proteome.
      explanation: >-
        Supports treating the aged mouse as informative for this node: the
        oxidative shift the node posits is present, measurable across the
        proteome, and reversible.
  - target: Age-Related Tissue Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same animals show the organ-level consequence arm - diastolic
      dysfunction, glomerulosclerosis, and loss of endurance and fatigue
      resistance - and each improves when the upstream mitochondrial node is
      treated in late life.
    limitations: >-
      The organ phenotypes are those of a short-lived quadruped: murine cardiac
      aging is dominated by diastolic dysfunction without the atherosclerotic
      and hypertensive comorbidity that shapes human cardiac aging, and murine
      sarcopenia is not the human syndrome. The functional gains are also
      regimen-dependent - intermittent rather than continuous dosing preserved
      exercise tolerance and left ventricular mass but did not reproduce the
      renal benefit.
    readouts:
    - name: Left ventricular diastolic function in old mice
      target: Age-Related Tissue Dysfunction
      description: >-
        Echocardiographic diastolic function after 8 weeks of SS-31 begun in old
        age.
      direction: RESTORED
      interpretation: >-
        The organ-level endpoint most consistently reversed by acting on the
        upstream mitochondrial nodes.
      evidence:
      - reference: PMID:32648542
        reference_title: "Late-life restoration of mitochondrial function reverses cardiac dysfunction in old mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We show here that 8-week treatment of old mice with the mitochondrial
          targeted peptide SS-31 (elamipretide) can substantially reverse this
          deficit.
        explanation: >-
          Reports the reversal of the diastolic deficit that grounds this
          readout.
    - name: Treadmill endurance capacity in aged mice
      target: Age-Related Tissue Dysfunction
      description: >-
        Forced treadmill running to exhaustion after 8 weeks of treatment,
        compared with both pretreatment and untreated aged controls.
      direction: RESTORED
      interpretation: >-
        Whole-animal function, the least reducible of the readouts and the one
        whose human counterpart has not reproduced.
      evidence:
      - reference: PMID:30597195
        reference_title: "Improving mitochondrial function with SS-31 reverses age-related redox stress and improves exercise tolerance in aged mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This contributed to a significant increase in treadmill endurance
          compared to both pretreatment and untreated control values.
        explanation: >-
          Reports the endurance measurement that grounds this readout.
    - name: Glomerulosclerosis and glomerular mitochondrial morphology
      target: Age-Related Tissue Dysfunction
      description: >-
        Light and transmission electron microscopy of glomeruli in mice
        randomized at 24 months to 8 weeks of SS-31 or saline.
      direction: RESTORED
      interpretation: >-
        A structural, non-functional readout of the consequence node in a second
        organ.
      evidence:
      - reference: PMID:28063595
        reference_title: "The mitochondrial-targeted peptide, SS-31, improves glomerular architecture in mice of advanced age."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          SS-31 treatment improved age-related mitochondrial morphology and
          glomerulosclerosis.
        explanation: >-
          Reports the histological improvement that grounds this readout.
    evidence:
    - reference: PMID:36840897
      reference_title: "Intermittent treatment with elamipretide preserves exercise tolerance in aged female mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that intermittent treatment with elamipretide for 8 months
        preserved exercise tolerance and left ventricular mass in mice with
        modest protection of diastolic function and skeletal muscle force
        production but did not affect kidney function as previously reported
        using continuous treatment.
      explanation: >-
        Supports the model as informative for this node while bounding it: the
        organ-level benefits are real but regimen-dependent, and the renal arm
        did not survive intermittent dosing.
discussions:
- discussion_id: knowledge_gap_mito_markers_disease_vs_age_related_decline
  prompt: >-
    Do serum markers validated in primary mitochondrial disease also report the
    milder, diffuse mitochondrial decline of normal aging?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Serum fibroblast growth factor 21
  - biochemical#Serum growth differentiation factor 15
  - pathophysiology#Bioenergetic Decline and Oxidative Stress
  rationale: >-
    This is the central scope question for this module's biomarkers and it is
    currently answered only for GDF-15. FGF-21 and GDF-15 were both validated
    against primary mitochondrial disease, where a single severe lesion produces a
    large signal in a young or middle-aged patient. The aging hallmark this module
    models is different in kind: a diffuse, gradual accumulation of damage across
    tissues, producing a much smaller expected effect against a background that
    also drifts with age. GDF-15 has independent support as an aging biomarker
    through the 2025 Delphi consensus, so the extension is licensed for it. FGF-21
    has no such support here, so its curation is scoped to the lesion types the
    validation study covers, and it should not be read as a general readout of
    age-related mitochondrial decline until a cohort study establishes that. The
    generalizable point for curators is that a marker's validation population is
    part of its meaning, and moving it from a disease entry into a hallmark module
    is a claim that needs its own evidence.
  evidence:
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-FGF21 is a specific biomarker for muscle-manifesting defects of
      mitochondrial translation, including mitochondrial transfer-RNA mutations and
      primary and secondary mtDNA deletions, the most common causes of
      mitochondrial disease.
    explanation: >-
      The study's own conclusion scopes FGF-21 to specific lesion types in primary
      mitochondrial disease, which is narrower than the age-related decline this
      module models.
  notes: >-
    The same question applies to any disease-derived marker imported into an
    aging-hallmark module, so this gap is worth checking before adding markers to
    the remaining hallmark modules.
- discussion_id: elamipretide_aging_translation_gap
  prompt: >-
    Does the reversal of mitochondrial and organ-level aging phenotypes that
    elamipretide produces in aged rodents occur in human aging, given that the
    only randomized human test showed target engagement on the bioenergetic node
    without any functional benefit?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Bioenergetic Decline and Oxidative Stress
  - pathophysiology#Age-Related Tissue Dysfunction
  - treatments#Elamipretide (SS-31)
  - animal_models#Naturally aged wild-type mouse
  rationale: >-
    In aged mice the chain from drug to mitochondrial state to organ function is
    complete and reproducible across three organs and several laboratories. In
    humans only the first half has been observed. A randomized crossover trial
    in 39 older adults selected for poor mitochondrial function found a single
    infusion raised in vivo ATPmax but left fatigue resistance unchanged, and
    the phase-3 MMPOWER-3 trial in primary mitochondrial myopathy - a disease
    population, not an aging one, but the largest test of the drug's functional
    effect - missed both of its primary endpoints. The mismatch is specifically
    at the "Bioenergetic Decline and Oxidative Stress" to "Age-Related Tissue
    Dysfunction" edge, not at target engagement, which makes it a translational
    validity question rather than a pharmacology one. Candidate explanations
    are not mutually exclusive: single-dose exposure in humans against 8 weeks
    to 8 months in mice; a human muscle endpoint (first dorsal interosseous
    fatigue) less energetically limited than murine treadmill endurance; or a
    genuine species difference in how much of human age-related functional loss
    is downstream of reversible mitochondrial regulation as opposed to
    structural damage, denervation, and sarcopenic fiber loss. Until a
    chronic-dosing human trial with a functional endpoint is reported, module
    conformers should treat the rodent reversal as evidence about mechanism
    and not as evidence of a treatable human phenotype.
  proposed_experiments:
  - experiment_id: elam_chronic_dosing_older_adults
    name: Chronic elamipretide dosing in older adults with a matched-modality functional endpoint
    description: >-
      A randomized, placebo-controlled trial of at least 8 weeks of daily
      subcutaneous elamipretide in older adults preselected for low in vivo
      ATPmax, pairing serial 31P magnetic resonance spectroscopy with a
      whole-body endurance endpoint of the same character as murine treadmill
      running rather than a small-muscle fatigue protocol. Duration and endpoint
      are chosen to remove the two design differences that most plausibly
      explain the negative single-dose result.
    decision_criterion: >-
      A treatment effect on the endurance endpoint in participants who also show
      a sustained ATPmax increase would support the mechanism-to-function edge in
      humans. A sustained ATPmax increase with no functional effect would refute
      it, and would localize the species difference to the consequence arm rather
      than to drug exposure.
    would_support:
    - pathophysiology#Age-Related Tissue Dysfunction
    - treatments#Elamipretide (SS-31)
    would_refute:
    - treatments#Elamipretide (SS-31)
    - pathophysiology#Age-Related Tissue Dysfunction
    supporting_outcome:
    - >-
      Endurance capacity improves against placebo in the subgroup with a
      sustained rise in in vivo mitochondrial capacity.
    refuting_outcome:
    - >-
      In vivo mitochondrial capacity rises and is sustained through the dosing
      period while endurance capacity is unchanged from placebo.
  evidence:
  - reference: PMID:34264994
    reference_title: "In vivo mitochondrial ATP production is improved in older adult skeletal muscle after a single dose of elamipretide in a randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first dorsal interosseous (FDI) muscle was studied in 39 healthy older
      adult subjects (60 to 85 yrs of age; 46% female) who were enrolled based on
      the presence of poorly functioning mitochondria.
    explanation: >-
      Establishes that the human test was done in the intended population -
      older adults with demonstrably poor mitochondrial function - so the
      negative functional result is not explained by an unselected cohort.
  - reference: PMID:37268435
    reference_title: "Efficacy and Safety of Elamipretide in Individuals With Primary Mitochondrial Myopathy: The MMPOWER-3 Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study did not meet its primary endpoints assessing changes in the 6MWT
      and PMMSA total fatigue score (TFS).
    explanation: >-
      The largest randomized test of a functional benefit from this drug in any
      human population was negative. Supports the existence of the mismatch this
      discussion records; note the population is a genetic myopathy, not aging,
      so it bounds rather than settles the aging question.
computational_models:
- name: Kowald-Kirkwood Transcription-Based mtDNA Deletion Selection Model
  description: >-
    Stochastic simulation of mitochondrial DNA populations within a cell, testing
    candidate explanations for why deletion-bearing mtDNA molecules clonally expand
    to take over a cell during ageing. The model supports a transcription-linked
    selection advantage: deleted genomes, being shorter and less transcribed, incur
    less transcription-associated degradation and so replicate to dominance.
  model_type: AGENT_BASED
  publication: PMID:24569805
  modeled_mechanisms:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models clonal expansion of deletion mutants as the outcome of a replicative
      selection advantage rather than random drift alone.
  notes: >-
    Explains why a rare somatic mtDNA deletion becomes cell-wide, which is the step
    that converts a stochastic mutation into the focal respiratory-deficient cells
    seen in aged tissue.
- name: Resolving the Clonal Expansion of mtDNA Deletions
  description: >-
    Systematic comparison of the competing mechanistic hypotheses for mtDNA deletion
    clonal expansion - random drift, replicative advantage of shorter genomes,
    selection through impaired mitophagy - evaluated against the constraint that the
    expansion must complete within a mammalian lifespan.
  model_type: AGENT_BASED
  publication: PMID:29495484
  modeled_mechanisms:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Discriminates among candidate expansion mechanisms using lifespan-scale
      timing as the discriminating constraint.
  - target: Impaired Mitophagy and Quality Control
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Evaluates selective-mitophagy failure as one candidate route to expansion.
    limitations: >-
      Mitophagy enters as an alternative selection hypothesis under test, not as a
      mechanistically resolved quality-control pathway.
- name: Sizek2023 MiDAS Boolean Model
  description: >-
    Boolean regulatory network model of mitochondrial dynamics coupled to cell-cycle
    control and apoptosis, capturing hyper-fusion at the G1/S boundary and fission
    in mitosis. It offers a mechanistic hypothesis, with testable predictions, for
    Mitochondrial Dysfunction-Associated Senescence (MiDAS) - the state in which
    reactive oxygen species and an energy deficit push a cell into senescence with an
    altered secretome and chronic oxidative stress, and examines NAD+ as an
    intervention point.
  model_type: BOOLEAN_NETWORK
  repository_url: https://www.ebi.ac.uk/biomodels/MODEL2312140001
  model_id: MODEL2312140001
  model_format: SBML-qual
  publication: PMID:39163758
  modeled_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Couples low NAD+/NADH and reduced ATP output to ROS production as a single
      regulatory state rather than as independent readouts.
  - target: Mitochondrial Contribution to Senescence and Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Distinguishes MiDAS from deep senescence by secretome state, and predicts
      NAD+ repletion as the lever that separates them.
    limitations: >-
      Boolean formalism yields qualitative state transitions without rates or
      concentrations, and the MiDAS mechanism is offered as a hypothesis with
      testable predictions rather than as a validated pathway.
  notes: >-
    The explicit bridge from this module into cellular_senescence - a mitochondrial
    state, not a DNA-damage state, determines which senescent secretome results.
    The "Sizek2023" label follows the BioModels record name, which encodes the 2023
    deposit; the paper itself (PMID:39163758) published in 2024. Encoded with the
    SBML qual package, so a plain SBML reader will not load it.
- name: Kowald-Kirkwood Network Theory of Ageing Model
  description: >-
    Integrated model treating ageing as the interaction of defective mitochondria,
    aberrant proteins, free radicals, and scavenger systems, rather than as any one
    of these damage processes acting alone. An early attempt to make the
    interdependence of the damage pathways quantitative.
  model_type: KINETIC
  publication: PMID:8649456
  modeled_mechanisms:
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Places mitochondrial free-radical production inside a feedback network with
      protein damage and scavenging capacity.
  - target: Age-Related Tissue Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Derives an organism-level ageing trajectory from the coupled damage processes.
    limitations: >-
      A 1996 synthesis predating most of the molecular detail in this module; its
      value is the coupling structure it proposes, not its parameterization.
  notes: >-
    Historically the origin of the "damage processes interact" framing that the
    hallmarks-of-aging modules now represent as separate but cross-linked entries.

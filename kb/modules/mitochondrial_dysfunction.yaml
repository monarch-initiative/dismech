name: Mitochondrial Dysfunction Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed mitochondrial dysfunction: the age-associated decline of mitochondrial
  quality and bioenergetic capacity and its downstream consequences. Because
  mitochondria convert dietary calories into ATP by oxidative phosphorylation
  while generating reactive oxygen species (ROS) as a by-product, and because
  mitochondrial DNA (mtDNA) is present in many copies and encodes essential
  respiratory-chain subunits, post-mitotic tissues accumulate somatic mtDNA
  mutations and respiratory-chain dysfunction with age. Declining bioenergetics
  and rising oxidative stress are incompletely counteracted because mitophagy
  (autophagic clearance of damaged mitochondria) also wanes, so dysfunctional,
  ROS-producing, pro-inflammatory mitochondria accumulate. Mitochondrial
  dysfunction feeds several other hallmarks - cellular senescence, chronic
  inflammation, and the decline in stem-cell activity - and converges on
  age-related tissue dysfunction. Individual disorder entries declare
  conformance via conforms_to on their pathophysiology nodes, substituting the
  disease-specific lesion (e.g. primary mtDNA/nuclear respiratory-chain defects
  in mitochondrial disease, or secondary mitochondrial injury in
  neurodegeneration and metabolic disease) while preserving the conserved
  damage -> bioenergetic-decline/ROS -> impaired-clearance -> tissue-decline
  chain.
category: Module
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress").
  Conforming nodes in disorder files should include the corresponding
  biological processes and causal edges, specialized to their disease context.
  The module is intentionally kept lean and deliberately does NOT adjudicate the
  contested mitochondrial free-radical theory of aging or embed disease-specific
  mtDNA lesions; such claims belong on the relevant disorder entry. Complements
  cellular_senescence and inflammaging (mitochondrial dysfunction is an upstream
  driver of both) and deregulated_nutrient_sensing (mitophagy is an autophagic
  quality-control arm). Key conformance target:
  "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress".
pathophysiology:
- name: Mitochondrial Damage and mtDNA Mutation
  description: >-
    With age, post-mitotic tissues accumulate somatic mitochondrial DNA (mtDNA)
    mutations and respiratory-chain damage. Because mtDNA encodes essential
    subunits of the oxidative-phosphorylation machinery and exists in many
    copies per cell, this heritable mitochondrial damage is the initiating
    lesion that compromises energy production.
  role: trigger
  biological_processes:
  - preferred_term: Aerobic Respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:23454757
    reference_title: "The role of mitochondria in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Somatic mitochondrial DNA (mtDNA) mutations and respiratory chain
      dysfunction accompany normal aging
    explanation: >-
      Establishes accumulation of somatic mtDNA mutations and respiratory-chain
      dysfunction with normal aging, the initiating lesion of this module.
      Evidence source is OTHER because this is a review.
  - reference: PMID:16285865
    reference_title: "A mitochondrial paradigm of metabolic and degenerative diseases, aging, and cancer: a dawn for evolutionary medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      I propose that the delayed-onset and progressive course of the age-related
      diseases results from the accumulation of somatic mutations in the mtDNAs
      of post-mitotic tissues.
    explanation: >-
      Proposes accumulation of somatic mtDNA mutations in post-mitotic tissues as
      the basis of age-related disease, supporting this trigger node. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Bioenergetic Decline and Oxidative Stress
- name: Bioenergetic Decline and Oxidative Stress
  description: >-
    Damaged mitochondria produce less ATP by oxidative phosphorylation while
    generating more reactive oxygen species (ROS) as a toxic by-product. This
    fall in mitochondrial quality and activity - correlated with the development
    of a wide range of age-related diseases - is the central effector state that
    disease-specific mitochondrial lesions converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Oxidative Phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: Reactive Oxygen Species Metabolism
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:26942670
    reference_title: "The Mitochondrial Basis of Aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A decline in mitochondrial quality and activity has been associated with
      normal aging and correlated with the development of a wide range of
      age-related diseases.
    explanation: >-
      Establishes the decline in mitochondrial quality/activity as an aging
      correlate and driver of age-related disease, the central effector modeled
      here. Evidence source is OTHER because this is a review.
  - reference: PMID:16285865
    reference_title: "A mitochondrial paradigm of metabolic and degenerative diseases, aging, and cancer: a dawn for evolutionary medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since the mitochondria use oxidative phosphorylation (OXPHOS) to convert
      dietary calories into usable energy, generating reactive oxygen species
      (ROS) as a toxic by-product
    explanation: >-
      Describes oxidative phosphorylation and ROS generation, the bioenergetic
      and oxidative-stress axes of this node. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Impaired Mitophagy and Quality Control
  - target: Mitochondrial Contribution to Senescence and Inflammation
- name: Impaired Mitophagy and Quality Control
  description: >-
    Autophagic turnover specific for mitochondria (mitophagy) normally
    eliminates dysfunctional or damaged mitochondria, counteracting
    degeneration and dampening inflammation. When mitophagy and general
    autophagy decline with age, damaged mitochondria are not cleared and
    accumulate, amplifying bioenergetic failure and pro-inflammatory,
    pro-apoptotic signaling.
  role: amplifier
  biological_processes:
  - preferred_term: Mitophagy
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    modifier: DECREASED
  evidence:
  - reference: PMID:21868666
    reference_title: "Mitochondria and the autophagy-inflammation-cell death axis in organismal aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autophagic turnover of cellular constituents, be it general or specific
      for mitochondria (mitophagy), eliminates dysfunctional or damaged
      mitochondria, thus counteracting degeneration, dampening inflammation, and
      preventing unwarranted cell loss.
    explanation: >-
      Establishes mitophagy as the quality-control mechanism whose decline
      permits accumulation of damaged mitochondria, the amplifying step modeled
      here. Evidence source is OTHER because this is a review.
  downstream:
  - target: Age-Related Tissue Dysfunction
- name: Mitochondrial Contribution to Senescence and Inflammation
  description: >-
    Beyond energy failure, dysfunctional mitochondria drive other aging
    hallmarks: they contribute to cellular senescence, chronic inflammation
    (via pro-inflammatory signaling), and the age-dependent decline in
    stem-cell activity. This node is the conserved interface at which
    mitochondrial dysfunction feeds the senescence and inflammaging modules.
  role: amplifier
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26942670
    reference_title: "The Mitochondrial Basis of Aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we discuss how mitochondria contribute to specific aspects of the aging
      process, including cellular senescence, chronic inflammation, and the
      age-dependent decline in stem cell activity
    explanation: >-
      Establishes that mitochondria contribute to senescence, chronic
      inflammation, and stem-cell decline, the cross-hallmark interface modeled
      here. Evidence source is OTHER because this is a review.
  - reference: PMID:21868666
    reference_title: "Mitochondria and the autophagy-inflammation-cell death axis in organismal aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, mitochondria have an important role in pro-inflammatory
      signaling.
    explanation: >-
      States the role of mitochondria in pro-inflammatory signaling, linking this
      node to inflammaging. Evidence source is OTHER because this is a review.
  downstream:
  - target: Age-Related Tissue Dysfunction
- name: Age-Related Tissue Dysfunction
  description: >-
    The combination of bioenergetic decline, oxidative stress, insufficient
    mitochondrial clearance, and mitochondria-driven senescence and inflammation
    degrades tissue function. This is the conserved consequence by which
    mitochondrial dysfunction contributes causally to age-related pathology; the
    specific organ or disease phenotype is supplied by the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:23454757
    reference_title: "The role of mitochondria in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      accumulating evidence has suggested a causative link between mitochondrial
      dysfunction and major phenotypes associated with aging
    explanation: >-
      States a causative link between mitochondrial dysfunction and aging
      phenotypes, the consequence arm modeled here. Evidence source is OTHER
      because this is a review.
  - reference: PMID:21868666
    reference_title: "Mitochondria and the autophagy-inflammation-cell death axis in organismal aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a combination of mitochondrial dysfunction and insufficient autophagy may
      contribute to multiple aging-associated pathologies
    explanation: >-
      Concludes that mitochondrial dysfunction with insufficient autophagy drives
      multiple aging pathologies, supporting this outcome node. Evidence source
      is OTHER because this is a review.
biochemical:
- name: Serum growth differentiation factor 15
  presence: INCREASED
  biomarker_term:
    preferred_term: growth differentiation factor 15 measurement
    term:
      id: NCIT:C181406
      label: Growth Differentiation Factor 15 Measurement
  notes: >-
    GDF-15 is the mitochondrial marker with the strongest claim on this module: it
    is one of the 14 biomarkers in the 2025 Delphi expert consensus on biomarkers
    of aging, and independently a validated serum marker of primary mitochondrial
    disease. Its weakness is specificity rather than sensitivity, since it rises in
    a wide range of non-mitochondrial conditions, so it is better used as a graded
    monitoring readout than as a diagnostic discriminator. GDF-15 is on the TAME
    Biomarkers Workgroup panel as well as the 2025 Delphi consensus list, making it
    one of the few markers in this KB endorsed both for aging intervention trials
    and for mitochondrial disease.
  evidence:
  - reference: PMID:25446397
    reference_title: "GDF15 is a novel biomarker to evaluate efficacy of pyruvate therapy for mitochondrial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      serum GDF15 levels were significantly higher in patients with mitochondrial
      diseases than in those with other diseases
    explanation: >-
      Establishes elevated serum GDF-15 as a marker of mitochondrial dysfunction in
      patients.
  - reference: PMID:39708300
    reference_title: "An Expert Consensus Statement on Biomarkers of Aging for Use in Intervention Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There was moderate to high consensus (70%–98% agreement) on 14 biomarkers
      (IGF-1, growth GDF-15, hsCRP, IL-6, muscle mass, muscle strength, hand grip
      strength, Timed-Up-and-Go, gait speed, standing balance test, frailty index,
      cognitive health, blood pressure, DNA methylation/epigenetic clocks)
    explanation: >-
      Places GDF-15 among the consensus biomarkers of aging for intervention
      studies, which is what licenses its use in an aging-hallmark module rather
      than only in primary mitochondrial disease entries.
  - reference: PMID:30151729
    reference_title: "A framework for selection of blood-based biomarkers for geroscience-guided clinical trials: report from the TAME Biomarkers Workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Application of these selection criteria to the current literature resulted in
      a short list of blood-based biomarkers proposed for TAME: IL-6, TNFα-receptor
      I or II, CRP, GDF15, insulin, IGF1, cystatin C, NT-proBNP, and hemoglobin
      A1c.
    explanation: >-
      Independently selects GDF-15 for a geroscience trial panel, corroborating its
      use here as an aging readout rather than only a mitochondrial disease marker.
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, GDF15 was increased also in a wide range of nonmitochondrial
      conditions.
    explanation: >-
      Refutes any reading of GDF-15 as specific to mitochondrial dysfunction. Kept
      as a separate REFUTE item rather than folded into the supporting evidence,
      because it cuts the other way on specificity.
  readouts:
  - target: Bioenergetic Decline and Oxidative Stress
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Serum GDF-15 rises as part of the integrated stress response to bioenergetic
      failure, reporting the metabolic consequence of mitochondrial damage rather
      than the damage itself.
    evidence:
    - reference: PMID:25446397
      reference_title: "GDF15 is a novel biomarker to evaluate efficacy of pyruvate therapy for mitochondrial diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that expression and secretion of growth differentiation factor 15
        (GDF15) were increased in 2SD cells treated with lactate
      explanation: >-
        Cybrid cells carrying a MELAS mutation increase GDF15 secretion under
        lactate load, linking the marker to the bioenergetic state directly.
- name: Serum fibroblast growth factor 21
  presence: INCREASED
  biomarker_term:
    preferred_term: fibroblast growth factor 21 measurement
    term:
      id: NCIT:C112280
      label: Fibroblast Growth Factor 21 Measurement
  notes: >-
    FGF-21 is more specific than GDF-15 but narrower: it reports defects of
    mitochondrial translation and mtDNA maintenance, and is only weakly induced by
    structural respiratory-chain subunit or assembly-factor defects. A normal
    FGF-21 therefore does not exclude mitochondrial disease. Note the scope limit
    for this module: FGF-21 is validated in primary mitochondrial myopathy, not in
    age-related mitochondrial decline, and the discussions block records that gap
    rather than assuming the extension holds.
  evidence:
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We report that S-FGF21 consistently increases in primary mitochondrial
      myopathy, especially in patients with mitochondrial translation defects or
      mitochondrial DNA (mtDNA) deletions
    explanation: >-
      Establishes serum FGF-21 as a marker of mitochondrial translation and mtDNA
      maintenance defects in patients.
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, patients and mice with structural respiratory chain subunit or
      assembly factor defects showed low induction
    explanation: >-
      Refutes FGF-21 as a general readout of mitochondrial dysfunction. The same
      study reports this in both patients and mice, so the limitation is not a
      species artefact.
  readouts:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated serum FGF-21 reports mtDNA deletion and translation-defect lesions
      specifically. Because induction is lesion-type dependent, a normal value is
      uninformative rather than reassuring.
    evidence:
    - reference: PMID:27794108
      reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This is corroborated in mice (mtDNA deletions 1,163 vs 379 pg/mL, p <
        0.0001).
      explanation: >-
        The human association is reproduced in mouse models of mtDNA deletion,
        making FGF-21 one of the few markers in this module with direct
        cross-species concordance on the same lesion.
- name: Blood mitochondrial DNA copy number
  presence: DECREASED
  biomarker_term:
    preferred_term: mitochondrial DNA copy number
    term:
      id: NCIT:C28512
      label: Mitochondrial DNA
  notes: >-
    mtDNA copy number is measurable from ordinary blood-derived DNA, which makes it
    the cheapest marker in this module and the one most likely to already exist in
    a legacy cohort. Its interpretation is the difficulty: copy number is regulated
    tissue-specifically and is not a direct measure of mitochondrial function, so
    the blood value is a proxy for a proxy. Direction is inverted relative to the
    other markers here, since lower copy number marks the worse state.
  evidence:
  - reference: PMID:32988399
    reference_title: "Mitochondrial DNA copy number can influence mortality and cardiovascular disease via methylation of nuclear DNA CpGs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mitochondrial DNA copy number (mtDNA-CN) has been associated with a variety
      of aging-related diseases, including all-cause mortality.
    explanation: >-
      Establishes the association between mtDNA copy number and aging-related
      outcomes across large population cohorts.
  readouts:
  - target: Mitochondrial Damage and mtDNA Mutation
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: >-
      Reduced blood mtDNA copy number tracks accumulated mitochondrial damage.
      CORRELATES_WITH rather than READOUT_OF because copy number is not a direct
      measure of mitochondrial function.
    evidence:
    - reference: PMID:32988399
      reference_title: "Mitochondrial DNA copy number can influence mortality and cardiovascular disease via methylation of nuclear DNA CpGs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        mtDNA-CN estimates can be derived from DNA isolated from blood and is
        therefore a relatively easily attainable biomarker of mitochondrial
        function.
      explanation: >-
        States both the accessibility that makes this marker practical and, in the
        same sentence, that it is an indirect measure.
discussions:
- discussion_id: knowledge_gap_mito_markers_disease_vs_age_related_decline
  prompt: >-
    Do serum markers validated in primary mitochondrial disease also report the
    milder, diffuse mitochondrial decline of normal aging?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Serum fibroblast growth factor 21
  - biochemical#Serum growth differentiation factor 15
  - pathophysiology#Bioenergetic Decline and Oxidative Stress
  rationale: >-
    This is the central scope question for this module's biomarkers and it is
    currently answered only for GDF-15. FGF-21 and GDF-15 were both validated
    against primary mitochondrial disease, where a single severe lesion produces a
    large signal in a young or middle-aged patient. The aging hallmark this module
    models is different in kind: a diffuse, gradual accumulation of damage across
    tissues, producing a much smaller expected effect against a background that
    also drifts with age. GDF-15 has independent support as an aging biomarker
    through the 2025 Delphi consensus, so the extension is licensed for it. FGF-21
    has no such support here, so its curation is scoped to the lesion types the
    validation study covers, and it should not be read as a general readout of
    age-related mitochondrial decline until a cohort study establishes that. The
    generalizable point for curators is that a marker's validation population is
    part of its meaning, and moving it from a disease entry into a hallmark module
    is a claim that needs its own evidence.
  evidence:
  - reference: PMID:27794108
    reference_title: "FGF21 is a biomarker for mitochondrial translation and mtDNA maintenance disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-FGF21 is a specific biomarker for muscle-manifesting defects of
      mitochondrial translation, including mitochondrial transfer-RNA mutations and
      primary and secondary mtDNA deletions, the most common causes of
      mitochondrial disease.
    explanation: >-
      The study's own conclusion scopes FGF-21 to specific lesion types in primary
      mitochondrial disease, which is narrower than the age-related decline this
      module models.
  notes: >-
    The same question applies to any disease-derived marker imported into an
    aging-hallmark module, so this gap is worth checking before adding markers to
    the remaining hallmark modules.

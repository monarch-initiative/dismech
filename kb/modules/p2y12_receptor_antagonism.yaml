name: P2Y12 Receptor Antagonism Module
description: 'Pharmacological blockade of the P2Y12 ADP receptor on the platelet, and the antithrombotic
  chain it drives. An antagonist occupies the receptor and prevents ADP from binding; the receptor is
  Gi-coupled, so blockade removes its inhibition of adenylate cyclase and the cyclic AMP brake on the
  platelet is restored; ADP-induced platelet activation is suppressed, aggregation falls, and arterial
  thrombosis is prevented at the cost of bleeding. The key conformance target is the central effector,
  "Suppression of ADP-Induced Platelet Activation". A disease entry that models the drug rather than the
  mechanism should instead conform at the trigger, "P2Y12 Antagonist Occupancy of the Platelet ADP Receptor".
  The module is scoped to the P2Y12 receptor and not to antiplatelet therapy in general: aspirin acts
  on cyclooxygenase and the glycoprotein IIb/IIIa antagonists on the fibrinogen receptor, neither of which
  is a G protein-coupled receptor, so neither belongs here. P2Y1 is a separate receptor on the same cell,
  Gq-coupled rather than Gi-coupled, and would be its own module. It is deliberately not scoped to an
  indication: its conformers are whichever diseases are treated by blocking this receptor, which here
  span coronary, carotid and cerebral small-vessel arterial disease.'
category: Module
module_categories:
- PHARMACOLOGY
creation_date: '2026-10-29T13:45:00Z'
notes: 'The receptor term here is specific where the calcium-sensing module had to settle for a generic
  one. GO:0001621 G protein-coupled ADP receptor activity names exactly what P2RY12 does, so the trigger
  binds it rather than the generic GO:0004930, and the gene binding (hgnc:18124) is corroboration rather
  than the only thing carrying the receptor identity. That is a difference in ontology coverage between
  receptors, not a claim that this one is better understood. The transducer step is sourced rather than
  assumed, and the sourcing is uneven in a way worth stating. That P2Y12 signals through Gi in human platelets
  is quoted from a study of platelet P2Y12 pharmacology, but that sentence is the authors restating their
  own earlier work, so it is graded BACKGROUND. The step from Gi to adenylate cyclase and cyclic AMP is
  quoted from a different paper whose subject is three natural products rather than a licensed antagonist,
  and whose cells are transfected HEK293 lines; it is cited for the pathway it maps and graded INDIRECT,
  not for its headline. The node does carry one direct measurement of its own quantity: basal cyclic AMP
  rises in human platelets when the receptor is blocked by selatogrel. That agent is investigational,
  so no cited abstract here measures the rise under a licensed P2Y12 inhibitor, and the node asserts the
  loss of the inhibition rather than a figure for it. The trigger is written for the class and not for
  one drug. Its own evidence quotes a paper on selatogrel, an investigational antagonist, because that
  paper''s result names ticagrelor and elinogrel in the same sentence; what that sentence establishes
  is stabilization of the inactive Gi/o heterotrimer in cells with recombinant P2Y12, and only selatogrel
  is shown by cocrystal to stabilize the inactive receptor itself, so the trigger node is not written
  as a receptor-conformation claim for the class; the treatment block binds clopidogrel and ticagrelor,
  which are the two agents conformers in this knowledge base actually use. The irreversible thienopyridines
  and the reversible agents are not distinguished as separate nodes, because no conformer here turns on
  that difference and no abstract cited establishes a distinct downstream chain for it. Bleeding is modelled
  as a consequence arm rather than an adverse-effect aside, for the same reason hypocalcaemia is in casr_positive_allosteric_modulation:
  it is the same mechanism read at the organism scale, since a platelet that cannot be activated by ADP
  also cannot seal an injury. The cited source is a surgical trial whose premise is that patients still
  on ticagrelor bleed severely, which is the clearest statement of the risk in the sources gathered here
  rather than a quantified population rate. Three conformers are wired, all at the trigger: CADASIL_Type_1,
  Carotid_Stenosis and Coronary_Artery_Disease. Six further entries name a P2Y12 antagonist and are not
  wired, and the reasons divide into three kinds. Peripheral_Artery_Disease binds the generic NCIT:C1327
  Antiplatelet Agent, which covers aspirin as well, so wiring it would assert P2Y12 action for a cyclooxygenase
  inhibitor; that is the same defect as the generic Bronchodilator binding that blocked Chronic_Obstructive_Pulmonary_Disease
  from the beta2 module until it was split. Carotid_Artery_Occlusion names clopidogrel in its treatment
  prose but binds only acetylsalicylic acid, so the agent would have to be bound before the treatment
  could be routed. Grange_syndrome, Kawasaki_Disease and Renal_Artery_Obstruction bind no agent at all
  on the relevant treatment, and Secondary_Erythromelalgia names ticlopidine only as one of the platelet
  inhibitors that failed to relieve its pain, inside a quoted result, so it is not treated with the class
  at all. What the six have in common, and the reason none is wired, is that no treatment in any of them
  binds a P2Y12 antagonist as therapeutic_agent. A bundled treatment is not itself an obstacle: CADASIL_Type_1
  and Carotid_Stenosis both pair the antagonist with aspirin, and Carotid_Stenosis adds atorvastatin,
  but all bind their components as separate agents, so each receptor can take its own link.'
pathophysiology:
- name: P2Y12 Antagonist Occupancy of the Platelet ADP Receptor
  role: trigger
  biological_scale: MOLECULAR
  description: A P2Y12 antagonist occupies the ADP receptor on the platelet surface and prevents adenosine
    diphosphate from binding it. The receptor is a G protein-coupled receptor, which is what places this
    module in the GPCR drug-mechanism family.
  molecular_functions:
  - preferred_term: P2Y12 ADP receptor activity
    modifier: DECREASED
    term:
      id: GO:0001621
      label: G protein-coupled ADP receptor activity
  cell_types: &id001
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  genes:
  - preferred_term: P2RY12
    term:
      id: hgnc:18124
      label: P2RY12
  evidence:
  - reference: PMID:36306820
    reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
      by inducing the inactive receptor conformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Selatogrel is a potent inhibitor of adenosine diphosphate (ADP) binding to the P2Y12 receptor,
      preventing platelet activation
    explanation: States the receptor-level action this node represents, blocking ADP binding at P2Y12.
      It is the abstract's framing line for selatogrel's established action, before the paper's own results.
  - reference: PMID:36306820
    reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
      by inducing the inactive receptor conformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: selatogrel, ticagrelor, and elinogrel were shown to stabilize the inactive form of the Gαi/o-Gβγ
      complex in cells with recombinant expression of the P2Y12 receptor
    explanation: Names ticagrelor, one of the two agents the conformers use, among the antagonists shown
      to hold the receptor's Gi/o heterotrimer in its inactive form. The measurement is in cells with
      recombinant P2Y12, not in platelets.
  downstream:
  - target: Loss of Gi-Mediated Adenylate Cyclase Inhibition
    causal_link_type: DIRECT
    description: Blocking the receptor removes the Gi-mediated signalling it would otherwise initiate.
      The cited sentence establishes the coupling in human platelets rather than measuring the blocked
      state.
    evidence:
    - reference: PMID:36306820
      reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
        by inducing the inactive receptor conformation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: the P2Y12 receptor constitutively activates Gi- and Go-protein-mediated signaling in human
        platelets
      explanation: Establishes that this receptor signals through Gi in human platelets, which is the
        coupling this edge interrupts.
- name: Loss of Gi-Mediated Adenylate Cyclase Inhibition
  role: amplifier
  biological_scale: MOLECULAR
  description: With the receptor blocked, its Gi-mediated inhibition of adenylate cyclase is lifted and
    the cyclic AMP brake on platelet activation is restored. No cited abstract here measures cyclic AMP
    rising in platelets under a licensed antagonist, so this node asserts the loss of the inhibition rather
    than a quantified rise; see the module notes.
  biological_processes:
  - preferred_term: Gi-mediated inhibition of adenylate cyclase
    modifier: DECREASED
    term:
      id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  cell_types: *id001
  evidence:
  - reference: PMID:39563013
    reference_title: Selective Inhibition of P2Y(1) and P2Y(12) Receptor Signal Pathways in Platelet Aggregation
      in Transgenic Cell Lines and Rats by Potassium 2-(1-Hydroxypentyl)-Benzoate, Puerarin and Salvianolic
      Acid B.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: salvianolic acid B inhibited platelet aggregation via targeting at P2Y12 receptor and via
      Gi-AC-cAMP signal pathway
    explanation: Maps the P2Y12 pathway as Gi to adenylate cyclase to cyclic AMP, which is the chain this
      node sits on. Cited for the pathway, not for its subject compound; see the module notes on why it
      is graded indirect.
  - reference: PMID:36306820
    reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
      by inducing the inactive receptor conformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: selatogrel increased basal cAMP levels in human platelets, confirming inverse agonism on
      the endogenous human platelet P2Y12 receptor
    explanation: 'Measures the node''s own quantity in human platelets: basal cAMP rises when the receptor
      is blocked, which is the loss of Gi-mediated adenylate cyclase inhibition. The agent is selatogrel,
      which is investigational rather than licensed.'
  downstream:
  - target: Suppression of ADP-Induced Platelet Activation
    causal_link_type: DIRECT
    description: Restoring the cyclic AMP brake leaves the platelet unresponsive to ADP.
    evidence:
    - reference: PMID:36306820
      reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
        by inducing the inactive receptor conformation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: Selatogrel is a potent inhibitor of adenosine diphosphate (ADP) binding to the P2Y12 receptor,
        preventing platelet activation
      explanation: Carries receptor blockade through to the suppression of platelet activation. The sentence
        names no step between the two, so it supports this edge by inference rather than by stating the
        cyclic-AMP link itself.
- name: Suppression of ADP-Induced Platelet Activation
  role: central_effector
  biological_scale: CELLULAR
  description: 'The platelet no longer activates in response to ADP. This is the key conformance target:
    the rate-limiting step every conformer funnels through, whatever arterial bed is at risk.'
  biological_processes:
  - preferred_term: platelet activation
    modifier: DECREASED
    term:
      id: GO:0030168
      label: platelet activation
  cell_types: *id001
  evidence:
  - reference: PMID:36306820
    reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
      by inducing the inactive receptor conformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Selatogrel is a potent inhibitor of adenosine diphosphate (ADP) binding to the P2Y12 receptor,
      preventing platelet activation
    explanation: Names the suppressed platelet activation and the receptor blockade that produces it,
      which is exactly this node.
  downstream:
  - target: Reduced Platelet Aggregation and Arterial Thrombosis
    causal_link_type: DIRECT
    description: A platelet that does not activate does not aggregate, and the arterial thrombus does
      not form.
    evidence:
    - reference: PMID:42810452
      reference_title: 'Personalised antiplatelet therapy during elective percutaneous coronary intervention
        in patients with chronic coronary syndrome: An international journal of cardiology expert consensus
        statement.'
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: BACKGROUND
      snippet: Oral P2Y12 inhibitors represent the mainstay therapy for the prevention of thrombotic complications
        in patients undergoing percutaneous coronary intervention
      explanation: States that blocking this receptor prevents thrombotic complications, which is the
        step this edge asserts.
  - target: Bleeding
    causal_link_type: DIRECT
    description: 'The same suppression read at the organism scale: a platelet that cannot be activated
      by ADP also cannot seal an injury.'
    evidence:
    - reference: PMID:41581856
      reference_title: Randomized, sham-controlled trial of intraoperative ticagrelor removal to reduce
        perioperative bleeding.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: BACKGROUND
      snippet: Patients on ticagrelor who are undergoing cardiac surgery before completing guideline-recommended
        washout are at high risk for severe bleeding
      explanation: States the bleeding risk that follows from active P2Y12 blockade, which is what this
        edge carries.
- name: Reduced Platelet Aggregation and Arterial Thrombosis
  role: consequence
  biological_scale: ORGANISM
  description: Platelet aggregation falls and the arterial thrombotic events the disease is at risk of
    are prevented. This is the therapeutic endpoint the drug class is given for.
  biological_processes:
  - preferred_term: platelet aggregation
    modifier: DECREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  evidence:
  - reference: PMID:42810452
    reference_title: 'Personalised antiplatelet therapy during elective percutaneous coronary intervention
      in patients with chronic coronary syndrome: An international journal of cardiology expert consensus
      statement.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Oral P2Y12 inhibitors represent the mainstay therapy for the prevention of thrombotic complications
      in patients undergoing percutaneous coronary intervention
    explanation: Names the prevention of thrombotic complications that this node represents, in the setting
      where the class is most used.
- name: Bleeding
  role: consequence
  biological_scale: ORGANISM
  description: 'Haemostasis is impaired and bleeding risk rises. This node is the dose-limiting edge of
    the mechanism rather than a claim about any particular rate: the cited source is a surgical trial
    whose premise is that patients still on ticagrelor bleed severely, not a population estimate.'
  evidence:
  - reference: PMID:41581856
    reference_title: Randomized, sham-controlled trial of intraoperative ticagrelor removal to reduce
      perioperative bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Patients on ticagrelor who are undergoing cardiac surgery before completing guideline-recommended
      washout are at high risk for severe bleeding
    explanation: States the severe bleeding risk in patients with active P2Y12 blockade, which is this
      node.
treatments:
- name: P2Y12 Inhibitor Therapy
  description: An antagonist of the platelet P2Y12 ADP receptor, given to suppress ADP-induced platelet
    activation. Clopidogrel is the irreversible thienopyridine prodrug and ticagrelor a reversible agent;
    both are in use among this module's conformers.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clopidogrel
      term:
        id: CHEBI:37941
        label: clopidogrel
    - preferred_term: ticagrelor
      term:
        id: CHEBI:68558
        label: ticagrelor
  target_mechanisms:
  - target: P2Y12 Antagonist Occupancy of the Platelet ADP Receptor
    treatment_effect: ACTIVATES
    description: The drug is what occupies the receptor, so it acts at the module trigger. Its relation
      to the nodes below is prevention of thrombosis rather than causation, so no downstream edge is asserted
      from the treatment.
    evidence:
    - reference: PMID:36306820
      reference_title: Inverse agonist efficacy of selatogrel blunts constitutive P2Y12 receptor signaling
        by inducing the inactive receptor conformation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: selatogrel, ticagrelor, and elinogrel were shown to stabilize the inactive form of the
        Gαi/o-Gβγ complex in cells with recombinant expression of the P2Y12 receptor
      explanation: The treatment's own agents include ticagrelor, named in the quoted result among the
        antagonists that stabilize the receptor's Gi/o heterotrimer in its inactive form.

name: Hyperammonemic Encephalopathy Module
category: Module
creation_date: "2026-11-09T19:52:27Z"
module_categories:
- METABOLISM
- NEUROSCIENCE
description: >-
  Conserved final-common pathway by which a block in nitrogen disposal raises
  systemic ammonia and injures the brain: a urea cycle enzyme or transporter
  deficiency (or another cause of impaired ureagenesis) lets ammonia accumulate,
  astrocytes detoxify it by condensing glutamate and ammonia into glutamine via
  glutamine synthetase, and the resulting osmotic glutamine load swells
  astrocytes, producing cerebral edema, raised intracranial pressure and
  encephalopathy. The key conformance target is the central effector,
  "Astrocytic Glutamine Accumulation and Osmotic Swelling" — the
  disorder-agnostic, rate-limiting step every conformer funnels through,
  whatever the upstream enzyme. Conforming urea cycle entries substitute their
  specific deficient enzyme or transporter at the trigger node (OTC, CPS1, ASS1,
  ASL, ARG1, NAGS, SLC25A15, SLC25A13) while sharing the ammonia -> glutamine ->
  astrocyte-swelling -> edema -> encephalopathy chain. Complementary to, and not
  overlapping with, metabolic_intoxication_decompensation (which models the
  generic catabolic crisis shared by organic acidemias and MSUD as well as urea
  cycle disorders, not the ammonia-specific astrocyte axis) and
  glutamate_excitotoxicity (a receptor-mediated neuronal death pathway, distinct
  from the osmotic astrocyte mechanism modelled here).
notes: >-
  This is a mechanism module, not a disease: do NOT create a "Hyperammonemic
  Encephalopathy" Disease entry. Disorder entries reference individual nodes via
  conforms_to (e.g. "hyperammonemic_encephalopathy#Astrocytic Glutamine
  Accumulation and Osmotic Swelling"), substituting the disorder-specific
  deficient urea cycle enzyme or transporter at the trigger node while preserving
  the shared downstream chain. Existing conformers to wire include
  Ornithine_Carbamoyltransferase_Deficiency, Carbamoyl_Phosphate_Synthetase_I_Deficiency,
  Citrullinemia_Type_I, Argininosuccinic_Aciduria, Arginase_Deficiency,
  N-Acetylglutamate_Synthase_Deficiency and
  Hyperornithinemia_Hyperammonemia_Homocitrullinuria_Syndrome.
  Scope and evidence caveat: the downstream ammonia -> glutamine ->
  astrocyte-swelling -> cerebral-edema axis was worked out largely in hepatic
  encephalopathy and acute liver failure models, where the same final common
  pathway operates; the inherited urea cycle disorders share this downstream
  mechanism but reach it through a genetic ureagenesis block rather than
  portosystemic shunting. The mechanistic nodes therefore carry hepatic
  encephalopathy evidence, and the trigger and consequence carry the urea cycle
  disorder guideline. Arginase deficiency is the partial exception among urea
  cycle disorders, presenting with progressive spastic diplegia more than acute
  hyperammonemic crises, so it conforms at the trigger node with that caveat
  recorded in its own entry. Nodes bind GO and CL terms only; the nitrogenous
  chemistry (ammonia, glutamate, glutamine) is described in prose per the module
  schema convention.
pathophysiology:
- name: Urea Cycle Enzyme or Transporter Deficiency
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A deficiency of a urea cycle enzyme or mitochondrial transporter impairs
    hepatic conversion of waste nitrogen to urea. Conforming entries substitute
    the specific defect (carbamoyl phosphate synthetase 1, ornithine
    transcarbamylase, argininosuccinate synthetase, argininosuccinate lyase,
    arginase, N-acetylglutamate synthase, or the ornithine/citrulline
    transporters).
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: urea cycle
    modifier: DECREASED
    term:
      id: GO:0000050
      label: urea cycle
  evidence:
  - reference: PMID:30982989
    reference_title: "Suggested guidelines for the diagnosis and management of urea cycle disorders: First revision."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      With 1:35 000 estimated incidence, UCDs cause hyperammonemia of neonatal
      (~50%) or late onset that can lead to intellectual disability or death
    explanation: Links the urea cycle defect class to hyperammonemia and its clinical outcome.
  downstream:
  - target: Systemic Hyperammonemia
    causal_link_type: DIRECT
    description: Failure of ureagenesis lets waste nitrogen accumulate as ammonia.
    evidence:
    - reference: PMID:30982989
      reference_title: "Suggested guidelines for the diagnosis and management of urea cycle disorders: First revision."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: UCDs cause hyperammonemia of neonatal
      explanation: The defect produces hyperammonemia.
- name: Systemic Hyperammonemia
  role: amplifier
  biological_scale: ORGANISM
  description: >-
    Ammonia, normally cleared as urea, accumulates in blood and crosses into the
    brain, where it is the major neurotoxin and the astrocyte is its principal
    target.
  biological_processes:
  - preferred_term: ammonium homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0097272
      label: ammonium homeostasis
  evidence:
  - reference: PMID:17006913
    reference_title: "Glutamine: a Trojan horse in ammonia neurotoxicity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it is well recognized that ammonia is a major factor in its pathogenesis,
      and that the astrocyte represents a major target of its CNS toxicity
    explanation: Establishes ammonia as the neurotoxin acting on astrocytes.
  downstream:
  - target: Astrocytic Glutamine Accumulation and Osmotic Swelling
    causal_link_type: DIRECT
    description: Astrocytes condense ammonia with glutamate into glutamine, the detoxification step that becomes toxic at load.
    evidence:
    - reference: PMID:17006913
      reference_title: "Glutamine: a Trojan horse in ammonia neurotoxicity."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        the conversion of glutamate to glutamine, catalyzed by glutamine
        synthetase, a cytoplasmic enzyme largely localized to astrocytes in
        brain, represented the principal means of cerebral ammonia
        detoxification
      explanation: The astrocyte glutamine-synthetase step through which ammonia is handled.
- name: Astrocytic Glutamine Accumulation and Osmotic Swelling
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Glutamine synthetase, an astrocytic enzyme, condenses ammonia and glutamate
    into glutamine. At elevated ammonia the glutamine load becomes osmotically
    and metabolically noxious: glutamine enters mitochondria and is hydrolysed
    back to ammonia, generating reactive oxygen species and the mitochondrial
    permeability transition (the "Trojan horse" mechanism), and the astrocyte
    swells. This is the rate-limiting, disorder-agnostic step and the key
    conformance target.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  molecular_functions:
  - preferred_term: glutamine synthetase activity
    modifier: INCREASED
    term:
      id: GO:0004356
      label: glutamine synthetase activity
  biological_processes:
  - preferred_term: L-glutamine biosynthetic process
    modifier: INCREASED
    term:
      id: GO:1901704
      label: L-glutamine biosynthetic process
  - preferred_term: cell volume homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0006884
      label: cell volume homeostasis
  evidence:
  - reference: PMID:17006913
    reference_title: "Glutamine: a Trojan horse in ammonia neurotoxicity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ammonia evokes oxidative/nitrosative stress, mitochondrial abnormalities
      (the mitochondrial permeability transition, MPT) and astrocyte swelling, a
      major component of the brain edema associated with fulminant hepatic
      failure
    explanation: Astrocyte swelling via the glutamine/mitochondrial mechanism.
  - reference: PMID:20654582
    reference_title: "Glutamine as a mediator of ammonia neurotoxicity: A critical appraisal."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      astrocytes swell subsequent to Gln transport into mitochondria and its
      degradation back to ammonia, which then generates reactive oxygen species
      and the mitochondrial permeability transition
    explanation: The Trojan-horse sequence producing astrocyte swelling.
  downstream:
  - target: Cerebral Edema and Raised Intracranial Pressure
    causal_link_type: DIRECT
    description: Astrocyte swelling is the cellular basis of the brain edema; inhibiting glutamine synthesis reverses it.
    evidence:
    - reference: PMID:20654582
      reference_title: "Glutamine as a mediator of ammonia neurotoxicity: A critical appraisal."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        a GS inhibitor, methionine sulfoximine (MSO), reversed a spectrum of
        manifestations of ammonia toxicity, including brain edema and increased
        intracranial pressure
      explanation: Blocking the glutamine step reverses the edema, establishing the causal link.
- name: Cerebral Edema and Raised Intracranial Pressure
  role: effector
  biological_scale: TISSUE
  description: >-
    Cytotoxic (astrocytic) brain edema raises intracranial pressure; it is the
    tissue-level consequence of the astrocyte swelling and the proximate threat
    in acute hyperammonemic crises.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  evidence:
  - reference: PMID:22285152
    reference_title: Glutamine in the pathogenesis of acute hepatic encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mechanisms by which glutamine contributes to astrocyte swelling/brain
      edema associated with acute liver failure (ALF) will also be described.
    explanation: Ties astrocyte swelling to the brain edema at tissue scale.
  downstream:
  - target: Hyperammonemic Encephalopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17006913
      reference_title: "Glutamine: a Trojan horse in ammonia neurotoxicity."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: astrocyte swelling, a major component of the brain edema associated with fulminant hepatic failure
      explanation: Edema is the substrate of the encephalopathy.
- name: Hyperammonemic Encephalopathy
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical outcome: acute encephalopathy (lethargy, vomiting, cerebral
    edema, coma) in crises, and, with repeated or sustained exposure,
    intellectual disability or death. In the inherited urea cycle disorders this
    is reached through a genetic ureagenesis block rather than liver failure.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30982989
    reference_title: "Suggested guidelines for the diagnosis and management of urea cycle disorders: First revision."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: hyperammonemia of neonatal (~50%) or late onset that can lead to intellectual disability or death
    explanation: The clinical endpoint of the pathway in urea cycle disorders.

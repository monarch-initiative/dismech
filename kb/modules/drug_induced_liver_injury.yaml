      label: hepatocyte
  - preferred_term: Kupffer cell
    term:
      id: CL:0000091
      label: Kupffer cell
  - preferred_term: liver sinusoidal endothelial cell
    term:
      id: CL:1000398
      label: endothelial cell of hepatic sinusoid
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  conditions:
  - drug-induced liver injury
  - blinded hepatotoxic versus non-toxic drug benchmarking
  - drug concentration- and time-dependent hepatotoxicity
  cell_source: >-
    Primary human hepatocytes from multiple donors co-cultured with human liver
    sinusoidal endothelial cells, Kupffer cells, and stellate cells
  culture_system: Microfluidic dual-channel liver organ-chip under continuous perfusion
  publication: PMID:36473994
  modeled_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    description: >-
      Mitochondrial injury is imaged directly in the chip as loss of TMRM
      accumulation in hepatocytes exposed to hepatotoxicants.
  - target: Hepatocyte Cell Death
    description: >-
      Hepatocyte toxicity is quantified by loss of albumin synthesis, ALT release,
      morphological injury scoring, and caspase 3/7 apoptosis imaging.
  - target: Liver Injury and Acute Liver Failure
    description: >-
      Provides a human, non-animal prediction of clinical drug-induced liver
      injury liability across a blinded benchmark drug set.
  findings:
  - statement: >-
      The human Liver-Chip predicted drug-induced liver injury across a blinded
      27-drug benchmark set with 87% sensitivity and 100% specificity.
    evidence:
    - reference: PMID:36473994
      reference_title: "Performance assessment and economic analysis of a human Liver-Chip for predictive toxicology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we show that the Liver-Chip met the qualification guidelines across a
        blinded set of 27 known hepatotoxic and non-toxic drugs with a
        sensitivity of 87% and a specificity of 100%
      explanation: >-
        Quantifies the predictive performance of this human non-animal model for
        drug-induced liver injury, the outcome of the whole module cascade.
  - statement: >-
      All seven toxic drugs reduced albumin production or increased ALT or
      injury-morphology scores at clinically bracketed concentration multiples.
    evidence:
    - reference: PMID:36473994
      reference_title: "Performance assessment and economic analysis of a human Liver-Chip for predictive toxicology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Importantly, all 7 of the toxic drugs reduced albumin production or
        resulted in an increase in ALT protein or injury morphology scores at
        lower multiples of the free human C max
      explanation: >-
        Provides a concrete DILI-specific result across the toxic benchmark set,
        replacing the prior general background statement about organ-chip
        technology.
  evidence:
  - reference: PMID:36473994
    reference_title: "Performance assessment and economic analysis of a human Liver-Chip for predictive toxicology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that the Liver-Chip met the qualification guidelines across a
      blinded set of 27 known hepatotoxic and non-toxic drugs with a sensitivity
      of 87% and a specificity of 100%
    explanation: >-
      Supports the Liver-Chip as a qualified human experimental model for
      predictive hepatotoxicology.
  notes: >-
    Ingber (Wyss Institute) is a co-author; this is the systematic qualification
    study for the liver organ-chip platform highlighted in the NAMeRS 2026 summit
    multi-organ-chip case study.

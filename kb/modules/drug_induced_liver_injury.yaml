    evidence_source: OTHER
    snippet: >-
      The fundamental process in DILI is the death of hepatocytes (in some
      circumstances, cholangiocytes or endothelial cells) in the background or
      recruitment of inflammation.
    explanation: >-
      States that hepatocyte death in DILI occurs against a background of, or with
      recruitment of, inflammation — the amplification step of this module.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:24099014
    reference_title: "Mechanisms of drug-induced liver injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      how a drug or its metabolites initiate and propagate cell death within the
      liver with the assistance of surrounding immune cells
    explanation: >-
      Frames immune cells as propagators of drug-induced hepatocyte death,
      supporting the inflammatory amplification node. Evidence source is OTHER
      because this is a review article.
  - reference: PMID:41001778
    reference_title: "Autologous Organoid-T Cell Co-Culture Platform for Modeling of Immune-Mediated Drug-Induced Liver Injury."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The system captures hallmark features of adaptive immune-mediated
      hepatotoxicity, including secretion of tumor necrosis factor-alpha and
      Granzyme B, and cytokeratin-18 release from injured hepatocytes.
    explanation: >-
      New Approach Methodology (NAM) evidence: an HLA-genotyped human liver
      organoid co-cultured with autologous CD8-positive T cells reconstitutes the
      adaptive, HLA-restricted arm of this amplifier node in a purely human
      system — cytotoxic mediator secretion (TNF-alpha, granzyme B) with
      cytokeratin-18 release marking hepatocyte injury. Evidence source is
      IN_VITRO because the finding comes from an iPSC-derived organoid-T cell
      co-culture.
  - reference: PMID:41001778
    reference_title: "Autologous Organoid-T Cell Co-Culture Platform for Modeling of Immune-Mediated Drug-Induced Liver Injury."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the platform models clinically relevant iDILI caused by flucloxacillin in
      HLA-B*57:01 carriers
    explanation: >-
      Supports the HLA-restricted, idiosyncratic branch of this node with a
      specific drug-HLA pair (flucloxacillin/HLA-B*57:01), showing that host
      class-I genotype gates the immune-mediated amplification of hepatocellular
      injury. Evidence source is IN_VITRO because the finding comes from a human
      organoid-T cell co-culture platform.
  downstream:

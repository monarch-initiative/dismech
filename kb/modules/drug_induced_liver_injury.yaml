    reference_title: "Recommendations for the use of the acetaminophen hepatotoxicity model for mechanistic studies and how to avoid common pitfalls."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the critical roles of drug metabolism, mitochondrial dysfunction, necrotic
      cell death, autophagy and the sterile inflammatory response
    explanation: >-
      Names necrotic cell death (alongside mitochondrial dysfunction and
      inflammation) as a critical mechanism of hepatotoxicity, supporting the
      necrosis/apoptosis effector captured here. Evidence source is OTHER because
      this is a review article.
  - reference: PMID:39529647
    reference_title: "A High-Throughput Microphysiological Liver Chip System to Model Drug-Induced Liver Injury Using Human Liver Organoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unlike traditional models requiring millimolar drug concentrations to
      detect hepatotoxicity, this platform showed increased sensitivity for
      acetaminophen and fialuridine at micromolar concentrations.
    explanation: >-
      New Approach Methodology (NAM) evidence: iPSC-derived human liver organoids
      maintained on a microfluidic chip reproduce hepatocyte injury from the
      archetypal reactive-metabolite hepatotoxicant acetaminophen (and from
      fialuridine) at clinically relevant micromolar exposures, giving
      human-cell-based support for this module's central hepatocyte-death effector
      step. Evidence source is IN_VITRO because the finding comes from an
      iPSC-derived liver organoid chip culture.
  - reference: PMID:36473994
    reference_title: "Performance assessment and economic analysis of a human Liver-Chip for predictive toxicology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that a decrease of albumin production was the most sensitive
      marker of hepatocyte toxicity in the Liver-Chip
    explanation: >-
      New Approach Methodology (NAM) evidence: loss of hepatocyte synthetic
      function (albumin production) tracked drug-induced hepatocyte toxicity in a
      human Liver-Chip across a blinded hepatotoxic/non-toxic drug set,
      supporting hepatocyte death/dysfunction as the conserved central effector
      of this module in a human non-animal system. Evidence source is IN_VITRO
      because the readout comes from a microfluidic human liver organ-chip.
  downstream:
  - target: Sterile and Immune-Mediated Inflammatory Amplification
    description: >-
      Hepatocyte death releases damage-associated signals that recruit and
      activate inflammatory cells.
  - target: Liver Injury and Acute Liver Failure
    description: >-
      Loss of hepatocyte mass produces clinically apparent liver injury.
- name: Sterile and Immune-Mediated Inflammatory Amplification
  description: >-
    Dying hepatocytes release damage-associated molecular patterns that drive a
    sterile inflammatory response; in idiosyncratic DILI, innate and adaptive
    immune activation (death-ligand signaling, HLA-restricted responses) further
    propagates injury. Inflammation amplifies and extends the hepatocellular
    death initiated upstream.

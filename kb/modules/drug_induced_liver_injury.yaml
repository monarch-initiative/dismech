experimental_models:
- name: Human quad-culture Liver-Chip (Emulate/Wyss) for predictive hepatotoxicology
  description: >-
    Microfluidic dual-channel human Liver-Chip populated with primary hepatocytes
    plus the three non-parenchymal liver cell types (liver sinusoidal endothelial
    cells, Kupffer cells, stellate cells) under continuous flow. A non-animal New
    Approach Methodology qualified against Innovation and Quality consortium
    criteria on a blinded benchmark drug set, with albumin synthesis, ALT release,
    morphological injury scoring, caspase 3/7 and TMRM mitochondrial imaging as
    readouts of the conserved DILI cascade.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:

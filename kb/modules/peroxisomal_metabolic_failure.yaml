name: Peroxisomal Metabolic Failure Module
description: >-
  A conserved module representing the final common pathway of the peroxisomal
  disorders, spanning both the peroxisome biogenesis disorders (in which the
  organelle itself cannot be assembled or cannot import its matrix enzymes) and
  the single-enzyme or single-transporter defects (in which the organelle is
  intact but one of its pathways is broken). Either lesion disables the two
  metabolic functions peroxisomes uniquely perform: beta-oxidation of
  very-long-chain and branched-chain fatty acids together with alpha-oxidation of
  phytanic acid, and the first, committed steps of ether-phospholipid
  (plasmalogen) synthesis. The result is a characteristic two-sided biochemical
  lesion - toxic accumulation of substrates that cannot be degraded, alongside
  deficiency of a product that cannot be made - which in the biogenesis disorders
  occurs together and in the single-enzyme disorders occurs in isolation. Because
  plasmalogens are the most abundant ether phospholipids of myelin and because
  the accumulating fatty acids are membrane-disruptive and pro-oxidant, the
  downstream injury falls hardest on the myelinating and membrane-rich tissues:
  brain white matter, retina, and peripheral nerve, alongside liver, adrenal
  cortex, kidney, and bone. Individual disorder entries declare conformance via
  conforms_to on their pathophysiology nodes, substituting the disorder-specific
  peroxisomal lesion while preserving the conserved causal chain.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g., "peroxisomal_metabolic_failure#Toxic
  Fatty-Acid Accumulation with Ether-Lipid Deficiency").


  THE TWO ARMS ARE NOT INTERCHANGEABLE, AND A CONFORMER MUST SAY WHICH IT ENTERS
  BY. The generalized biogenesis arm (PEX1, PEX6, PEX26 and the other ZSD-PEX
  genes; Zellweger spectrum disorder) knocks out every peroxisomal pathway at
  once, so accumulation and deficiency co-occur. The selective arms do not:
  - PEX7 (rhizomelic chondrodysplasia punctata type 1) fails only the PTS2 import
    route, so plasmalogen synthesis and phytanic acid alpha-oxidation fail while
    PTS1-dependent VLCFA beta-oxidation is preserved - VLCFAs are normal in RCDP.
  - GNPAT and AGPS (RCDP types 2 and 3) fail plasmalogen synthesis alone, with no
    fatty-acid accumulation at all.
  - ABCD1 (X-linked adrenoleukodystrophy) fails only VLCFA import for
    beta-oxidation; plasmalogens are secondarily, not primarily, reduced.
  - PHYH (adult Refsum disease) fails only phytanic acid alpha-oxidation.
  A conforming entry should therefore attach at the specific sub-branch its
  biochemistry supports and must NOT inherit the full two-sided lesion of the
  biogenesis arm. Curating normal-range analytes as accumulated is the single
  most likely error when conforming to this module.


  RELATIONSHIP TO cns_myelin_failure. Plasmalogen deficiency causes generalized
  CNS hypomyelination progressing to demyelination, and oligodendrocytes require
  plasmalogens to ensheath and initiate membrane wrapping; VLCFA accumulation in
  X-ALD produces loss of myelin and oligodendrocytes. The peroxisomal
  leukodystrophies are therefore genuine conformers of BOTH modules, at different
  nodes: this module explains how the toxic substrate arises and the ether lipid
  is lost, and cns_myelin_failure explains what that does to the oligodendrocyte
  lineage and the sheath. This module deliberately stops at the neural-membrane
  and redox lesion and does not re-derive the myelin chain.


  RELATIONSHIP TO lysosomal_substrate_accumulation. The two are structurally
  parallel - an organelle-localized degradative failure producing substrate
  accumulation - but they are different organelles with different substrates and
  are not interchangeable. Do not route a peroxisomal disorder through the
  lysosomal module.


  NEURONAL MIGRATION IS A BIOGENESIS-ARM FEATURE ONLY. The severe biogenesis
  disorders carry congenital neuronal migration defects, which are a
  developmental malformation established in utero, not a consequence of
  postnatal substrate accumulation. Milder ZSD phenotypes do not have congenital
  malformations at all. A conformer should curate migration defects on its own
  node and may cross-reference microtubule_dependent_neuronal_migration_failure;
  this module records the association without claiming the postnatal metabolic
  chain produces it.
pathophysiology:
- name: Peroxisomal Biogenesis or Enzyme Defect
  description: >-
    A heritable lesion disables peroxisomal function, by one of two routes. In
    the peroxisome biogenesis disorders, mutation of a PEX gene impairs membrane
    assembly, import of peroxisomal matrix proteins, or division of the
    organelle, so that peroxisomal enzymes are not delivered to a functional
    compartment. In the single-enzyme and single-transporter defects the
    organelle is assembled normally but one pathway within it - a transporter
    such as ABCD1, an alpha-oxidation enzyme such as PHYH, or an ether-lipid
    synthase such as GNPAT or AGPS - is lost. Which route the lesion takes
    determines how much of the downstream biochemistry is affected, and
    conforming entries must specialize this node accordingly.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: peroxisome organization
    term:
      id: GO:0007031
      label: peroxisome organization
    modifier: DECREASED
  - preferred_term: protein import into peroxisome matrix
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
    modifier: DECREASED
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  evidence:
  - reference: PMID:33417206
    reference_title: Peroxisome Biogenesis Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impaired peroxisome biogenesis, including defects of membrane assembly,
      import of peroxisomal matrix proteins, and division of peroxisome, causes
      peroxisome biogenesis disorders (PBDs).
    explanation: >-
      Enumerates the three failure modes that constitute the biogenesis arm of
      this trigger node. Evidence source is OTHER because this is a review of
      peroxisome biology and the PBD complementation groups.
  - reference: PMID:26750748
    reference_title: "Peroxisome biogenesis disorders in the Zellweger spectrum: An overview of current diagnosis, clinical manifestations, and treatment guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Peroxisome biogenesis disorders in the Zellweger spectrum (PBD-ZSD) are a
      heterogeneous group of genetic disorders caused by mutations in PEX genes
      responsible for normal peroxisome assembly and functions.
    explanation: >-
      Identifies the PEX genes as the lesion of the biogenesis arm and the
      Zellweger spectrum as its clinical expression. Evidence source is OTHER
      because this is a diagnosis and treatment guideline overview.
  downstream:
  - target: Failure of Peroxisomal Fatty-Acid Oxidation and Ether-Lipid Synthesis
    description: >-
      Loss of the organelle or of one of its enzymes disables the metabolic
      pathways it uniquely carries.

- name: Failure of Peroxisomal Fatty-Acid Oxidation and Ether-Lipid Synthesis
  description: >-
    The two metabolic functions peroxisomes uniquely perform fail. On the
    catabolic side, beta-oxidation of very-long-chain and branched-chain fatty
    acids and alpha-oxidation of phytanic acid can no longer proceed; on the
    anabolic side, the first committed steps of ether-linked
    glycerophospholipid synthesis, which are peroxisomal, can no longer produce
    plasmalogens. In the biogenesis disorders both sides fail together. In the
    selective disorders only one does, and which one is the biochemical signature
    that distinguishes them.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: very long-chain fatty acid catabolic process
    term:
      id: GO:0042760
      label: very long-chain fatty acid catabolic process
    modifier: DECREASED
  - preferred_term: fatty acid alpha-oxidation
    term:
      id: GO:0001561
      label: fatty acid alpha-oxidation
    modifier: DECREASED
  - preferred_term: ether lipid biosynthetic process
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  evidence:
  - reference: PMID:33417206
    reference_title: Peroxisome Biogenesis Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Peroxisomes are presented in all eukaryotic cells and play essential roles
      in many of lipid metabolic pathways, including β-oxidation of fatty acids
      and synthesis of ether-linked glycerophospholipids, such as plasmalogens.
    explanation: >-
      Names the two peroxisomal functions whose loss defines this node - fatty
      acid beta-oxidation and ether-lipid (plasmalogen) synthesis. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Toxic Fatty-Acid Accumulation with Ether-Lipid Deficiency
    description: >-
      Undegraded substrate accumulates while the unmade product falls.

- name: Toxic Fatty-Acid Accumulation with Ether-Lipid Deficiency
  description: >-
    The rate-limiting, disorder-agnostic convergence point of the module and its
    key conformance target. The metabolic block produces a characteristic
    two-sided lesion: substrates that cannot be degraded accumulate in plasma and
    tissue (very-long-chain fatty acids in the biogenesis disorders and in
    X-linked adrenoleukodystrophy, phytanic acid in Refsum disease and in the
    PTS2-import disorders), while plasmalogens that cannot be synthesized fall.
    In cerebral adrenoleukodystrophy both sides are measurable in the same brain
    white matter, and the plasmalogen loss there tracks with oxidative stress
    rather than being independent of it. Conforming entries must specialize this
    node to the analytes their own disorder actually perturbs, and must not
    assert accumulation of a substrate their disorder leaves in the normal range.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: very long-chain fatty acid catabolic process
    term:
      id: GO:0042760
      label: very long-chain fatty acid catabolic process
    modifier: DECREASED
  - preferred_term: ether lipid biosynthetic process
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:18540993
    reference_title: Plasmalogen deficiency in cerebral adrenoleukodystrophy and its modulation by lovastatin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In brain white matter of cALD patients, we observed not only increased
      levels of very long chain fatty acid but also reduced levels of
      plasmenylethanolamine (PlsEtn) and increased levels of reactive oxygen
      species (ROS).
    explanation: >-
      Demonstrates the two-sided lesion of this node - accumulation and
      deficiency together - measured directly in human cerebral
      adrenoleukodystrophy white matter. Evidence source is HUMAN_CLINICAL
      because the measurements are made in patient brain tissue.
  - reference: PMID:18540993
    reference_title: Plasmalogen deficiency in cerebral adrenoleukodystrophy and its modulation by lovastatin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cerebral adrenoleukodystrophy (cALD), an accumulation of very long chain
      fatty acids stems from a defect of the peroxisomal ALD protein (ALDP) and
      results in the loss of myelin/oligodendrocytes, induction of inflammatory
      disease and mental deterioration.
    explanation: >-
      A worked instance of the selective transporter arm - an ABCD1 defect
      producing VLCFA accumulation - and its stated consequence for
      oligodendrocytes, which is the edge this module draws to the neural
      membrane node and onward to cns_myelin_failure.
  downstream:
  - target: Neural Membrane and Redox Dysfunction
    description: >-
      Loss of the most abundant ether phospholipid of myelin, plus accumulation
      of membrane-disruptive pro-oxidant fatty acids, damages membrane-rich
      neural tissue.

- name: Neural Membrane and Redox Dysfunction
  description: >-
    The biochemical lesion becomes a cellular one in the tissues whose function
    depends most on membrane lipid composition. Plasmalogens are the most
    abundant form of ether phospholipids in myelin, and oligodendrocytes require
    them intrinsically in order to ensheath an axon and initiate membrane
    wrapping; their loss produces generalized CNS hypomyelination that evolves
    into progressive demyelination with astrocytosis and white-matter-selective
    microgliosis. In parallel, accumulated very-long-chain fatty acids drive
    reactive oxygen species production and lipid peroxidation, with reactive
    lipid aldehydes and oxidized proteins detectable throughout the affected
    brain rather than only within plaques. Retina, peripheral nerve, adrenal
    cortex, liver, and kidney are affected alongside white matter.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:30667116
    reference_title: Leukodystrophy caused by plasmalogen deficiency rescued by glyceryl 1-myristyl ether treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We unraveled that the lack of plasmalogens causes a generalized
      hypomyelination in several CNS regions including the optic nerve, corpus
      callosum and spinal cord. The defect in myelin content evolved to a
      progressive demyelination concomitant with generalized astrocytosis and
      white matter-selective microgliosis.
    explanation: >-
      Establishes that the ether-lipid deficiency arm alone is sufficient to
      cause CNS hypomyelination progressing to demyelination, which is the
      handoff from this module to cns_myelin_failure. Evidence source is
      MODEL_ORGANISM because the work is done in Gnpat-knockout mice.
  - reference: PMID:30667116
    reference_title: Leukodystrophy caused by plasmalogen deficiency rescued by glyceryl 1-myristyl ether treatment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using in vitro myelination assays, we unraveled that the intrinsic capacity
      of oligodendrocytes to ensheath and initiate membrane wrapping requires
      plasmalogens.
    explanation: >-
      Gives the cell-intrinsic mechanism - plasmalogens are required for the
      oligodendrocyte's own wrapping capacity - rather than leaving the
      hypomyelination as an unexplained association. Evidence source is IN_VITRO
      because the claim rests on cell-based myelination assays.
  - reference: PMID:18540993
    reference_title: Plasmalogen deficiency in cerebral adrenoleukodystrophy and its modulation by lovastatin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The reduction in PlsEtn was related to oxidative stress, as supported by
      increased levels of reactive lipid aldehydes (4-hydroxynonenal and
      acrolein) and deleterious oxidized proteins (protein carbonyl) in all areas
      of the cALD brain.
    explanation: >-
      Supports the redox half of this node in human tissue and the statement that
      the oxidative lesion is not confined to demyelinated plaques.
  downstream:
  - target: Multisystem Peroxisomal Disease
    description: >-
      Injury to membrane-rich and myelinating tissues manifests as the
      characteristic multisystem clinical spectrum.

- name: Multisystem Peroxisomal Disease
  description: >-
    The clinical endpoint of the module: a phenotypic continuum, not a single
    syndrome. At the severe end, affected newborns are hypotonic, feed poorly,
    and carry congenital malformations - neuronal migration defects with
    neonatal-onset seizures, renal cysts, and chondrodysplasia punctata - with
    severe liver disease and death usually within the first year. At the milder
    end there are no congenital malformations at all, and the disease is instead
    a progressive peroxisomal dysfunction expressed as retinal dystrophy and
    sensorineural hearing loss, ataxia, polyneuropathy and leukodystrophy, liver
    dysfunction, adrenal insufficiency, and renal oxalate stones, with intellect
    that can be normal. The single-enzyme disorders occupy their own narrower
    slices of this range. Conforming entries specialize this node to their own
    position on the spectrum; the module deliberately asserts no uniform severity
    or age of onset.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected newborns are hypotonic and feed poorly. They have distinctive
      facies, congenital malformations (neuronal migration defects associated
      with neonatal-onset seizures, renal cysts, and bony stippling
    explanation: >-
      States the severe-end phenotype of this node, including the congenital
      neuronal migration defect that the module notes flag as a biogenesis-arm
      feature rather than a downstream metabolic consequence. Evidence source is
      HUMAN_CLINICAL because GeneReviews summarizes the observed patient
      phenotype.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital
      malformations, but rather progressive peroxisome dysfunction variably
      manifest as sensory loss (secondary to retinal dystrophy and sensorineural
      hearing loss), neurologic involvement (ataxia, polyneuropathy, and
      leukodystrophy), liver dysfunction, adrenal insufficiency, and renal
      oxalate stones.
    explanation: >-
      States the mild-end phenotype and the explicit absence of congenital
      malformations there, which is why this node is written as a continuum
      rather than a fixed syndrome.
  - reference: PMID:26750748
    reference_title: "Peroxisome biogenesis disorders in the Zellweger spectrum: An overview of current diagnosis, clinical manifestations, and treatment guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The extreme variability in disease manifestation ranging from onset of
      profound neurologic symptoms in newborns to progressive degenerative
      disease in adults presents practical challenges in disease diagnosis and
      medical management.
    explanation: >-
      Independent support for the width of the clinical range this node spans,
      from neonatal to adult onset, which is the reason the module fixes no age
      of onset.

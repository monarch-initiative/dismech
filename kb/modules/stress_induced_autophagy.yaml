name: Stress-Induced Autophagy Module
description: >-
  A conserved mechanism module for stress-induced (adaptive) autophagy: the
  upregulation of macroautophagic flux as a cytoprotective response to cellular
  stress, together with its maladaptive failure modes. Diverse stresses -
  nutrient or growth-factor deprivation, hypoxia, reactive oxygen species, and
  proteotoxic or organelle damage - are sensed through mTORC1 inhibition and
  AMPK activation converging on ULK1 (Cellular Stress Sensing) -> increased
  autophagosome formation and autophagic flux (Stress-Induced Autophagy
  Induction, the key conformance target) -> clearance of damaged components and
  metabolic recycling that restores homeostasis and promotes survival
  (Cytoprotective Clearance and Adaptation); when the stress is excessive or
  sustained, the same induced autophagy becomes deleterious and can contribute
  to autophagy-dependent cell death (Maladaptive Autophagy and
  Autophagy-Dependent Cell Death). This module is the INCREASED-autophagy
  complement of the decline-oriented modules: disabled_macroautophagy models the
  aging loss of autophagy machinery, loss_of_proteostasis models autophagy as
  one DECREASED aggregate-clearance arm, deregulated_nutrient_sensing models
  mTORC1-driven autophagy suppression, and mitochondrial_dysfunction models
  decreased mitophagy. Use this module only when the measured or modeled
  direction is an INDUCTION of autophagy, and route decline or suppression
  claims to those sibling modules. Conforming entries substitute the disease- or
  toxicant-specific stressor while preserving the stress-sensing -> induction ->
  adaptation/maladaptation chain. Key conformance target:
  "stress_induced_autophagy#Stress-Induced Autophagy Induction".
category: Module
module_categories:
- METABOLISM
creation_date: "2026-11-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  "Stress-Induced Autophagy" Disease entry. Disorder, module, and model records
  reference individual nodes via conforms_to or modeled_mechanisms (e.g.
  "stress_induced_autophagy#Stress-Induced Autophagy Induction"). Direction is
  load-bearing: this module models autophagy being turned UP (INCREASED). A node
  where autophagy is reduced, disabled, or suppressed belongs to
  disabled_macroautophagy, loss_of_proteostasis, deregulated_nutrient_sensing,
  or mitochondrial_dysfunction (mitophagy), not here - the two directions are
  opposite claims and must not be conflated on one anchor. Key conformance
  target: "stress_induced_autophagy#Stress-Induced Autophagy Induction". The
  maladaptive arm (Maladaptive Autophagy and Autophagy-Dependent Cell Death) is
  context-dependent: link a conformer to it only when the source shows the
  autophagic machinery is required for the cell death, not merely present during
  it (Denton and Kumar, PMID:30568239).
pathophysiology:
- name: Cellular Stress Sensing
  description: >-
    Diverse forms of cellular stress - nutrient or growth-factor deprivation,
    hypoxia, reactive oxygen species, DNA damage, protein aggregates, and
    damaged organelles - are sensed by the nutrient- and energy-sensing
    network. Under stress, mTOR complex 1 (mTORC1) signalling falls and the
    energy sensor AMPK is activated; both converge on ULK1, the kinase that initiates autophagy. This de-repression of the autophagy machinery is the
    initiating step of the adaptive response and the point at which autophagy is
    integrated with the wider cellular stress response.
  role: trigger
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TOR Signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: DECREASED
  - preferred_term: Cellular Response to Stress
    term:
      id: GO:0033554
      label: cellular response to stress
    modifier: INCREASED
  evidence:
  - reference: PMID:20965422
    reference_title: "Autophagy and the integrated stress response."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      autophagy is a cell biological process that is a central component of the
      integrated stress response.
    explanation: >-
      Establishes autophagy as a central component of the integrated stress
      response, the stress-sensing step modeled here. Evidence source is OTHER
      because this is a review.
  - reference: PMID:21258367
    reference_title: "AMPK and mTOR regulate autophagy through direct phosphorylation of Ulk1."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: >-
      Conversely, autophagy is inhibited by the mammalian target of rapamycin
      (mTOR), a central cell-growth regulator that integrates growth factor and
      nutrient signals.
    explanation: >-
      States that mTOR (mTORC1) represses autophagy and integrates
      growth-factor and nutrient signals, so its stress-induced inhibition is
      what releases autophagy here (TOR signaling DECREASED). Quoted from the
      abstract's background framing of an in vitro study; evidence source OTHER
      for the general mechanism it restates.
  downstream:
  - target: Stress-Induced Autophagy Induction
- name: Stress-Induced Autophagy Induction
  description: >-
    Release of the ULK1 complex drives increased autophagosome formation and a
    rise in macroautophagic flux above the basal rate. This stress-induced
    upregulation of autophagy is the conserved, disorder-agnostic effector state
    of the module - the central node every conformer funnels through, and the
    direction (INCREASED) that distinguishes this module from the sibling
    modules that model autophagy decline. The disease- or toxicant-specific stressor that
    raises flux is supplied by the conforming entry.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: INCREASED
  - preferred_term: Positive Regulation of Autophagy
    term:
      id: GO:0010508
      label: positive regulation of autophagy
    modifier: INCREASED
  evidence:
  - reference: PMID:20965422
    reference_title: "Autophagy and the integrated stress response."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This pathway can be stimulated by multiple forms of cellular stress,
      including nutrient or growth factor deprivation, hypoxia, reactive oxygen
      species, DNA damage, protein aggregates, damaged organelles, or
      intracellular pathogens.
    explanation: >-
      Lists the multiple forms of cellular stress that stimulate (induce)
      autophagy, the increased-flux effector modeled here. Evidence source is
      OTHER because this is a review.
  - reference: PMID:21258367
    reference_title: "AMPK and mTOR regulate autophagy through direct phosphorylation of Ulk1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Under glucose starvation, AMPK promotes autophagy by directly activating
      Ulk1 through phosphorylation of Ser 317 and Ser 777.
    explanation: >-
      Shows AMPK directly activating the autophagy-initiating kinase Ulk1 under
      energy stress, the induction mechanism modeled here. Evidence source is
      IN_VITRO (cell and biochemical assays).
  downstream:
  - target: Cytoprotective Clearance and Adaptation
  - target: Maladaptive Autophagy and Autophagy-Dependent Cell Death
- name: Cytoprotective Clearance and Adaptation
  description: >-
    Induced autophagy sequesters and degrades damaged proteins and organelles
    and recycles their constituents into building blocks and energy, restoring
    proteostasis and metabolic homeostasis and allowing the cell to survive the
    insult. This is the adaptive, cytoprotective outcome of stress-induced
    autophagy - the arm that defends the cell against the stressor.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: INCREASED
  evidence:
  - reference: PMID:22078875
    reference_title: "Autophagy: renovation of cells and tissues."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      autophagy serves as a dynamic recycling system that produces new building
      blocks and energy for cellular renovation and homeostasis
    explanation: >-
      Describes autophagy as a recycling system producing building blocks and
      energy for homeostasis, the metabolic-adaptation function modeled here.
      Evidence source is OTHER because this is a review.
  - reference: PMID:24366339
    reference_title: "The machinery of macroautophagy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      autophagy plays a critical role in cytoprotection by preventing the
      accumulation of toxic proteins
    explanation: >-
      States autophagy's cytoprotective role in preventing toxic-protein
      accumulation, the protective clearance modeled here. Evidence source is
      OTHER because this is a review.
  - reference: PMID:18191218
    reference_title: "Autophagy in the pathogenesis of disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autophagy principally serves an adaptive role to protect organisms against
      diverse pathologies, including infections, cancer, neurodegeneration,
      aging, and heart disease.
    explanation: >-
      States that autophagy principally serves an adaptive, protective role
      across diverse pathologies, the cytoprotective outcome modeled here.
      Evidence source is OTHER because this is a review.
- name: Maladaptive Autophagy and Autophagy-Dependent Cell Death
  description: >-
    When the stress is excessive or sustained, or the autophagic response is
    dysregulated, stress-induced autophagy can become deleterious rather than
    protective - including contributing to autophagy-dependent cell death, a
    demise that has a strict requirement for the autophagic machinery. This is
    the maladaptive failure arm of the module, the counterpart to the
    cytoprotective arm; whether a given conformer reaches it depends on context
    and must be shown, not assumed.
  role: consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Autophagic Cell Death
    term:
      id: GO:0048102
      label: autophagic cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:18191218
    reference_title: "Autophagy in the pathogenesis of disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in certain experimental disease settings, the self-cannibalistic or,
      paradoxically, even the prosurvival functions of autophagy may be
      deleterious.
    explanation: >-
      States that in some disease settings autophagy's functions may be
      deleterious rather than protective, the maladaptive arm modeled here.
      Evidence source is OTHER because this is a review.
  - reference: PMID:30568239
    reference_title: "Autophagy-dependent cell death."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although autophagy often accompanies cell death following many toxic
      insults, the requirement of autophagic machinery for cell death execution,
      as established through specific genetic or chemical inhibition of the
      process, is highly contextual.
    explanation: >-
      Establishes autophagy-dependent cell death as contextual - accompanying
      death after toxic insults but required only in some settings - the
      caveated maladaptive outcome modeled here. Evidence source is OTHER
      because this is a review.
experimental_models:
- name: Mammalian neuronal cell model for AOP key-event screening of current-use
    pesticides
  description: >-
    A mammalian neuronal cell model used by Hirano et al. to screen 10 current-use
    pesticides (4 neonicotinoids, 4 pyrethroids, 2 phenylpyrazoles), singly and in
    pairs, against adverse-outcome-pathway key events for neurotoxicity. Autophagy
    activity is the readout for the autophagic key event, and the paper reports an
    increase in it under pesticide exposure - the induction direction this module
    models, which is why the arm attaches here and not to the decline-oriented
    autophagy modules. The abstract does not name the cell line or species, so the
    record is abstract-only and the system is recorded at the "mammalian neuronal
    cell model" level the paper's own abstract uses.
  experimental_model_type: CELL_LINE
  namo_type: namo:TwoDCellCulture
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  conditions:
  - combined (pairwise) exposure to current-use pesticides
  - neonicotinoid, pyrethroid and phenylpyrazole exposure
  cell_source: Mammalian neuronal cell model (cell line and species not named in the
    abstract)
  culture_system: In vitro mammalian neuronal cell culture
  publication: PMID:38040083
  modeled_mechanisms:
  - target: Stress-Induced Autophagy Induction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Several pyrethroids and phenylpyrazoles increased autophagy activity in the
      neuronal cell model, the increased-flux key event this node describes
      (GO:0016236 macroautophagy, INCREASED). The model reproduces stress-induced
      autophagy induction under acute toxicant exposure; it is the direction-correct
      anchor for the autophagy key event, which is why it was left unlinked to the
      decline-oriented autophagy modules.
    limitations: >-
      A single in-vitro mammalian neuronal cell model observing only the cellular
      key event (autophagy activity). It cannot observe the nervous-system adverse
      outcome (neurotoxicity) the AOP targets, so the link is to the cellular key
      event alone and not to any organism-level outcome. The record is
      abstract-only, so no per-pesticide or quantitative autophagy-activity value is
      quotable, and the cell line and species are not named.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The model measures bulk autophagy activity at a single point. The upstream
        signalling the node attributes the induction to (mTORC1 inhibition,
        AMPK and ULK1) and the downstream fate of the induced autophagy - whether it
        is the cytoprotective adaptation arm or the maladaptive cell-death arm - are
        outside what this flux readout observes, so the model cannot say which
        outcome the increase serves.
    readouts:
    - name: Autophagy activity under pesticide exposure
      target: Stress-Induced Autophagy Induction
      direction: INCREASED
      interpretation: >-
        Increased autophagy activity across several pyrethroids and phenylpyrazoles
        is the model's index of stress-induced autophagy induction.
      evidence:
      - reference: PMID:38040083
        reference_title: An adverse outcome pathway-based approach to assess the
          neurotoxicity by combined exposure to current-use pesticides.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        snippet: several pyrethroids and phenylpyrazoles partly shared the effects
          on several common KEs, including decreases in mitochondrial membrane
          potential and proteasome activity and increases in autophagy activity
        explanation: >-
          Reports the increased autophagy activity in the neuronal cell model behind
          this readout.
    evidence:
    - reference: PMID:38040083
      reference_title: An adverse outcome pathway-based approach to assess the
        neurotoxicity by combined exposure to current-use pesticides.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: several pyrethroids and phenylpyrazoles partly shared the effects on
        several common KEs, including decreases in mitochondrial membrane potential
        and proteasome activity and increases in autophagy activity
      explanation: >-
        Supports treating the neuronal cell model as partially informative for the
        stress-induced-autophagy-induction node: it measures the increased autophagy
        activity key event under pesticide exposure.
  notes: >-
    Abstract-only record; the full text was not retrievable in the curation
    environment, so snippets quote the abstract and the cell line and species are
    not named. This is the autophagy arm of PMID:38040083 that issue #18240 asked
    to home: the paper reports an INCREASE in autophagy activity, so it anchors to
    this induction module rather than to disabled_macroautophagy or
    loss_of_proteostasis, whose autophagy arms are DECREASED. The same model is
    recorded against the mitochondrial and proteasome key events in
    mitochondrial_dysfunction and loss_of_proteostasis. The pyrethroid + fipronil
    synergy is recorded in the inventory (open question 9, dismech#16885), not as a
    model link.

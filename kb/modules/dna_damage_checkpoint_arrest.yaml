name: DNA Damage Checkpoint Arrest Module
description: >-
  A conserved mechanism module for DNA-damage-checkpoint-enforced cell-cycle
  arrest of proliferating progenitor cells, in which the pathology comes from
  the arrest itself rather than from any failure of the checkpoint. The chain is
  trigger (DNA damage or replication stress in a proliferating progenitor
  population) to amplifier (ATM-CHK2 and ATR-CHK1 checkpoint signal
  transduction, both converging on CDC25) to central_effector
  (checkpoint-enforced arrest of the progenitor, through p53-p21 inhibition of
  the G1/S cyclin-dependent kinases and through CHK1-CDC25C inactivation of
  cyclin B-CDK1 at G2/M; the key conformance target and the disorder-agnostic
  rate-limiting step) to effector (progenitor attrition, as sustained arrest,
  impaired self-renewal, premature differentiation and apoptosis of arrested
  cells remove cells from the compartment) to consequence (hypoplasia or
  functional failure of the tissue that depends on that compartment, the worked
  instance being the haematopoietic compartment). Two worked disease settings
  give the two arms of the central effector: Fanconi anaemia, where a
  constitutional DNA repair defect leaves replication stress unresolved and an
  exacerbated p53-p21 response imposes a G0/G1 arrest on haematopoietic stem
  and progenitor cells before clinical marrow failure, and parvovirus B19
  infection of erythroid progenitors, where the viral NS1 protein activates ATR
  and the ATR-CHK1-CDC25C-CDK1 route imposes a G2-phase arrest. The
  distinguishing claim, and the reason this is not a restatement of a sibling
  module, is that the checkpoint machinery here is intact and actively
  signalling. That makes the module complementary to, and not overlapping with,
  several neighbours. cellular_senescence and senescence_tumor_suppression model
  a permanent senescent arrest with p16INK4a-Rb engagement and a secretory
  phenotype, where this module models the reversible checkpoint arrest that
  precedes any such commitment; telomere_attrition and genomic_instability_aging
  model the progressive accumulation of the damage and of maintenance failure
  that can feed this module's trigger, not the arrest it enforces;
  genome_instability_mutation and evading_growth_suppressors are the
  cancer-facing mirror image, in which the p53 and ATM/ATR checkpoint barriers
  are lost and proliferation continues in the presence of damage;
  nucleotide_excision_repair_deficiency models the loss of one repair pathway and
  its mutagenic and transcription-stress effectors rather than the checkpoint
  response to persistent lesions; stem_cell_exhaustion is the integrative
  downstream hallmark of a depleted stem compartment, of which this module is one
  specific route; and pol1_nucleolar_stress_neural_crest_apoptosis reaches p53
  through nucleolar and ribosomal stress with no DNA lesion at all. A conforming
  entry substitutes its own lesion at the trigger, its own progenitor population
  throughout, and its own dependent tissue at the consequence.
category: Module
module_categories:
- INFECTIOUS_DISEASE
creation_date: "2026-10-16T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a "DNA damage
  checkpoint arrest" or "checkpoint-mediated progenitor failure" Disease entry;
  disorder entries reference individual nodes via conforms_to, for example
  "dna_damage_checkpoint_arrest#Checkpoint-Enforced Arrest of the Progenitor".
  Modules bind GO and CL terms only, so the genes and viral proteins named here
  are in prose and belong in the conforming entry's genetic section or its
  infectious_agent block.

  Where the conformance boundary runs. A conformer must match at the
  central_effector: an intact checkpoint that is signalling and holding the
  progenitor out of cycle. Two kinds of entry fail that test and should not be
  given conforms_to here. An entry whose checkpoint is lost or bypassed belongs
  with evading_growth_suppressors or genome_instability_mutation, because its
  pathology is proliferation despite damage rather than arrest because of it. An
  entry whose arrested cells have committed to a permanent senescent program,
  with p16INK4a-Rb engagement or a senescence-associated secretory phenotype,
  belongs with cellular_senescence; this module stops at the reversible arrest,
  and the committed state is a different claim. The relationship is sequential
  rather than exclusive, so an entry may legitimately conform to this module at
  the arrest and to cellular_senescence at a downstream node, but it should not
  conform to both at the same node.

  Reversibility is asserted at the module's own scale and is not a claim that
  every arrested progenitor recovers. The cited support is that checkpoint
  arrest is actively reversed by dedicated phosphatases, differently in G1 and
  in G2, which is what makes this a regulated hold rather than a terminal state.
  What converts a protective hold into progenitor loss is that it is sustained in
  a compartment whose job is to divide, which is the effector node, and the
  cited routes out of the compartment are apoptosis of arrested cells, premature
  terminal differentiation, and loss of clonogenic capacity. Do not read the
  effector as a claim that apoptosis is the sole or dominant route; which route
  dominates differs between the two worked settings.

  Term-binding notes for conformers. The progenitor nodes bind the generic
  CL:0011026 progenitor cell throughout, because the module is
  compartment-agnostic; a conforming node substitutes its own population
  (CL:0000037 hematopoietic stem cell or CL:0000038 erythroid progenitor cell in
  the two worked settings). The consequence node binds hemopoiesis and bone
  marrow as the worked instance rather than as a scope restriction, and a
  conforming entry in another organ substitutes its own process and site there.
  No GO term exists for replication stress or for cell-cycle arrest as such:
  searching "l~replication stress" and "l~cell cycle arrest" against ols:go
  returns only organism- or stimulus-specific classes (for example GO:0036227
  mitotic G2 cell cycle arrest in response to glucose starvation, GO:0000751
  mitotic cell cycle G1 arrest in response to pheromone), none of which applies,
  so the trigger carries GO:0006260 DNA replication with modifier DECREASED and
  the arrest is expressed through the two checkpoint-signalling classes plus
  GO:0045786 negative regulation of cell cycle. Likewise ATM, ATR, CHK1, CHK2
  and CDC25 are gene products with no GO process class of their own, so the
  amplifier binds the checkpoint-signalling and protein-phosphorylation classes
  and names the kinases in prose.

  Module category. Only INFECTIOUS_DISEASE is tagged, because the parvovirus B19
  arm is evidenced inside the module and an infectious-disease curator would find
  it relevant. The other worked setting, Fanconi anaemia, is an inherited marrow
  failure syndrome with no matching value in ModuleCategoryEnum, and AGING,
  ONCOLOGY and TOXICOLOGY were all left off deliberately: this module's claim is
  an intact checkpoint, which is the opposite of the oncology framing, and no
  aging or genotoxic-therapy evidence is cited here. Adding a pill the module's
  own evidence does not support would be worse than leaving it off.
pathophysiology:
- name: DNA Damage and Replication Stress in a Proliferating Progenitor
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion, which is a load of DNA damage or of stalled and
    collapsed replication forks arising in a cell population that is actively
    dividing. Damage is continuous and ordinarily resolved, so what matters at
    this node is that the load exceeds what the cell's repair capacity clears
    within the division cycle, leaving unresolved lesions and persistent
    replication stress for the checkpoint to sense. The load may be endogenous
    and unresolved because repair is constitutionally defective, as in Fanconi
    anaemia, or it may be imposed from outside the cell, as by a viral protein
    that provokes a DNA damage response in the progenitor it infects. The node
    is deliberately agnostic about the source: a conforming entry substitutes its
    own lesion here, and the rest of the chain is unchanged.
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: DECREASED
  cell_types:
  - preferred_term: proliferating progenitor cell
    term:
      id: CL:0011026
      label: progenitor cell
  evidence:
  - reference: PMID:20965415
    reference_title: "The DNA damage response: making it safe to play with knives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Damage to our genetic material is an ongoing threat to both our ability to
      faithfully transmit genetic information to our offspring as well as our own
      survival.
    explanation: >-
      Establishes that the damage load at this node is a continuous condition of
      every dividing cell rather than an exceptional event, which is why the
      module's trigger is a question of unresolved load and not of damage
      occurring at all.
  - reference: PMID:22683204
    reference_title: Bone marrow failure in Fanconi anemia is triggered by an exacerbated p53/p21 DNA damage response that impairs hematopoietic stem and progenitor cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we found that FA patients exhibit a profound defect in hematopoietic
      stem and progenitor cells (HSPCs) that is present before the onset of
      clinical BMF.
    explanation: >-
      Locates the defect in the progenitor compartment itself, and before the
      clinical tissue failure, which is the ordering this module's chain asserts.
  - reference: PMID:32412895
    reference_title: New Insights of Human Parvovirus B19 in Modulating Erythroid Progenitor Cell Differentiation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The nonstructural protein NS1 is considered to be the major pathogenic
      factor, which has been shown to inhibit the differentiation and maturation
      of EPCs through inducing viral DNA damage responses and cell cycle arrest.
    explanation: >-
      The second worked route into this node, in which the damage response is
      provoked in the progenitor by a viral protein rather than by a repair
      defect, and reaches the same arrest.
  downstream:
  - target: ATM-CHK2 and ATR-CHK1 Checkpoint Signal Transduction
    causal_link_type: DIRECT
    description: >-
      Unresolved lesions and stalled forks are the substrate the checkpoint
      sensors detect, and detection is what activates the transducing kinases.
    evidence:
    - reference: PMID:16314342
      reference_title: DNA damage checkpoints in mammals.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        These checkpoints engage damage sensor proteins, such as the
        Rad9-Rad1-Hus1 (9-1-1) complex, and the Rad17-RFC complex, in the
        detection of DNA damage and transduction of signals to ATM, ATR, Chk1 and
        Chk2 kinases.
      explanation: >-
        States the sensor-to-transducer step that this edge is, naming the
        kinases the downstream node is built on.
- name: ATM-CHK2 and ATR-CHK1 Checkpoint Signal Transduction
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The transduction layer that converts a local lesion into a cell-wide
    decision, and the reason this module has an amplifier between its trigger and
    its effector. Apical kinases activated at the lesion phosphorylate effector
    kinases, which then act on substrates throughout the nucleus, so a small
    number of lesions can hold an entire cell out of cycle. The two branches are
    lesion-selective, with ATM-CHK2 responding chiefly to double-strand breaks
    and ATR-CHK1 to single-stranded and bulky lesions and to replication stress,
    which is why a conforming entry's lesion type predicts which branch
    dominates without changing the node. Both branches converge on the same
    target, the CDC25 phosphatases, and both also act on p53, so the convergence
    rather than the branching is what makes this layer disorder-agnostic.
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
    modifier: INCREASED
  - preferred_term: DNA replication checkpoint signaling
    term:
      id: GO:0000076
      label: DNA replication checkpoint signaling
    modifier: INCREASED
  - preferred_term: signal transduction in response to DNA damage
    term:
      id: GO:0042770
      label: signal transduction in response to DNA damage
    modifier: INCREASED
  - preferred_term: checkpoint kinase substrate phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: INCREASED
  cell_types:
  - preferred_term: proliferating progenitor cell
    term:
      id: CL:0011026
      label: progenitor cell
  evidence:
  - reference: PMID:19230643
    reference_title: "Kinases that control the cell cycle in response to DNA damage: Chk1, Chk2, and MK2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The ATM/Chk2 module is activated after DNA double strand breaks and the
      ATR/Chk1 pathway responds primarily to DNA single strand breaks or bulky
      lesions.
    explanation: >-
      The lesion selectivity of the two branches, which is what lets a conforming
      entry predict its dominant branch from its own lesion type.
  - reference: PMID:19230643
    reference_title: "Kinases that control the cell cycle in response to DNA damage: Chk1, Chk2, and MK2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In response to DNA damage eukaryotic cells activate cell cycle checkpoints
      -- complex kinase signaling networks that prevent further progression
      through the cell cycle.
    explanation: >-
      Characterises this layer as a kinase signalling network whose output is
      blocked cell-cycle progression, which is the amplification this node
      records.
  downstream:
  - target: Checkpoint-Enforced Arrest of the Progenitor
    causal_link_type: DIRECT
    description: >-
      The effector kinases inactivate the CDC25 phosphatases and stabilise p53,
      and both routes end in inhibited cyclin-dependent kinases, which is the
      arrest.
    evidence:
    - reference: PMID:19230643
      reference_title: "Kinases that control the cell cycle in response to DNA damage: Chk1, Chk2, and MK2."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Both pathways converge on Cdc25, a positive regulator of cell cycle
        progression, which is inhibited by Chk1-mediated or Chk2-mediated
        phosphorylation.
      explanation: >-
        The convergence of the two branches on one target, which is why the
        downstream node is a single conformance target rather than two.
    - reference: PMID:16314342
      reference_title: DNA damage checkpoints in mammals.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Chk1 and Chk2 kinases regulate Cdc25, Wee1 and p53 that ultimately
        inactivate cyclin-dependent kinases (Cdks) which inhibit cell-cycle
        progression.
      explanation: >-
        Completes the edge through to cyclin-dependent kinase inhibition, which
        is the molecular content of the arrest node.
- name: Checkpoint-Enforced Arrest of the Progenitor
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The key conformance target, and the disorder-agnostic rate-limiting step. The
    checkpoint holds the progenitor out of cycle at one or both of two
    transitions. At G1/S, p53 stabilised by the apical kinases transactivates
    p21, whose cyclin-dependent kinase inhibitor activity blocks entry into S
    phase. At G2/M, CHK1 phosphorylates CDC25C, which can no longer activate the
    cyclin B-CDK1 complex, so mitosis is not entered. Which transition dominates
    is a property of the conforming disorder and not of the module: Fanconi
    anaemia progenitors are held in G0/G1 by an exacerbated p53-p21 response,
    while parvovirus-B19-infected erythroid progenitors are held at G2 by the
    ATR-CHK1-CDC25C-CDK1 route, and B19 in fact imposes arrest at both. The
    arrest is a regulated hold rather than a terminal state, which is the claim
    that separates this module from cellular_senescence and
    senescence_tumor_suppression: dedicated phosphatases reverse it and restart
    the cycle, and they are different phosphatases in G1 and in G2, so recovery
    is actively implemented at each transition rather than being the mere decay
    of a signal. Nothing is pathological at this node yet, which is the point;
    the pathology is what happens when the hold is sustained in a compartment
    that has to divide.
  biological_processes:
  - preferred_term: mitotic G1 DNA damage checkpoint signaling
    term:
      id: GO:0031571
      label: mitotic G1 DNA damage checkpoint signaling
    modifier: INCREASED
  - preferred_term: mitotic G2 DNA damage checkpoint signaling
    term:
      id: GO:0007095
      label: mitotic G2 DNA damage checkpoint signaling
    modifier: INCREASED
  - preferred_term: p53-mediated DNA damage response signalling
    term:
      id: GO:0030330
      label: DNA damage response, signal transduction by p53 class mediator
    modifier: INCREASED
  - preferred_term: negative regulation of cell cycle
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
    modifier: INCREASED
  molecular_functions:
  - preferred_term: p21-mediated cyclin-dependent kinase inhibition
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: INCREASED
  cell_types:
  - preferred_term: proliferating progenitor cell
    term:
      id: CL:0011026
      label: progenitor cell
  evidence:
  - reference: PMID:22683204
    reference_title: Bone marrow failure in Fanconi anemia is triggered by an exacerbated p53/p21 DNA damage response that impairs hematopoietic stem and progenitor cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In response to replicative stress and unresolved DNA damage, p53 is
      hyperactivated in FA cells and triggers a late p21(Cdkn1a)-dependent G0/G1
      cell-cycle arrest.
    explanation: >-
      The G1/S arm stated directly in FA cells, naming the p53-p21
      route this node binds.
  - reference: PMID:28264028
    reference_title: Parvovirus B19 NS1 protein induces cell cycle arrest at G2-phase by activating the ATR-CDC25C-CDK1 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, we found that the ATR-CHK1-CDC25C-CDK1 pathway was activated
      during B19V infection of EPCs, and that ATR activation played an important
      role in B19V infection-induced G2-phase arrest.
    explanation: >-
      The G2/M arm in a primary human progenitor, naming the CHK1-CDC25C route
      this node binds.
  - reference: PMID:28264028
    reference_title: Parvovirus B19 NS1 protein induces cell cycle arrest at G2-phase by activating the ATR-CDC25C-CDK1 pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Activated ATR phosphorylated CDC25C at serine 216, which in turn
      inactivated the cyclin B/CDK1 complex without affecting nuclear import of
      the complex.
    explanation: >-
      The molecular step that makes the G2/M arm an arrest rather than a delay,
      and the counterpart of p21 inhibiting the G1/S kinases.
  - reference: PMID:24711418
    reference_title: Distinct phosphatases antagonize the p53 response in different phases of the cell cycle.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show, in contrast, that reversal of DNA damage responses (DDRs)
      and recovery are fundamentally different in G1 and G2 phases of the cell
      cycle.
    explanation: >-
      Supports the reversibility that distinguishes this node from a senescent
      arrest, and shows the reversal is implemented separately at the two
      transitions this node spans.
  - reference: PMID:24711418
    reference_title: Distinct phosphatases antagonize the p53 response in different phases of the cell cycle.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Instead, we identify phosphoprotein phosphatase 4 catalytic subunit (PP4)
      to be specifically required for cell cycle restart after DNA damage in G1.
    explanation: >-
      A dedicated factor is required to restart the cycle, which is what makes
      the arrest an actively maintained hold rather than a terminal state.
  - reference: PMID:14625883
    reference_title: Parvovirus B19 and the pathogenesis of anaemia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In addition, B19 infection induces cell cycle arrests at the G(1) and G(2) phases.
    explanation: >-
      Shows one disorder engaging both transitions, which is why the node is a
      single arrest target spanning G1/S and G2/M rather than two targets.
  downstream:
  - target: Progenitor Compartment Attrition
    causal_link_type: DIRECT
    description: >-
      An arrest sustained in a compartment whose function is to divide removes
      cells from it, whether by killing the arrested cell, by pushing it to
      differentiate, or simply by holding it out of cycle.
    evidence:
    - reference: PMID:22683204
      reference_title: Bone marrow failure in Fanconi anemia is triggered by an exacerbated p53/p21 DNA damage response that impairs hematopoietic stem and progenitor cells.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Taken together, our results identify an exacerbated p53/p21
        "physiological" response to cellular stress and DNA damage accumulation
        as a central mechanism for progressive HSPC elimination in FA patients
      explanation: >-
        The authors' own identification of the arrest response as the mechanism
        of progenitor loss, which is the claim this edge makes. Graded OTHER
        because the sentence it is taken from spans the study's patient,
        in vitro and in vivo arms together.
    - reference: PMID:19230643
      reference_title: "Kinases that control the cell cycle in response to DNA damage: Chk1, Chk2, and MK2."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        If the extent of damage exceeds repair capacity, additional signaling
        cascades are activated to ensure elimination of these damaged cells.
      explanation: >-
        The general rule behind this edge, that a checkpoint response which
        cannot be resolved escalates to removal of the cell.
- name: Progenitor Compartment Attrition
  role: effector
  biological_scale: CELLULAR
  description: >-
    The step at which a protective response becomes a lesion in its own right.
    Cells leave the progenitor compartment by three documented routes, and which
    one dominates differs between settings rather than being fixed by the module.
    Arrested cells die, which is the route that dominates in parvovirus B19
    infection of erythroid progenitors. Arrested cells are driven prematurely
    into terminal differentiation, consuming the progenitor instead of
    replenishing it, which is what a p53-p21-activated Fanconi-anaemia-deficient
    progenitor does. And cells that neither die nor differentiate are still out of
    cycle, so self-renewal and clonogenic output fall with no cell loss at all.
    The compartment therefore shrinks in cell number, in proliferative capacity,
    or in both, and the common currency is that fewer progenitors remain capable
    of producing mature progeny. That the arrest response is the cause and not a
    bystander is shown by rescue: removing p53 restores progenitor function across
    several Fanconi anaemia models.
  biological_processes:
  - preferred_term: apoptosis of arrested progenitor cells
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: DECREASED
  - preferred_term: progenitor cell proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  cell_types:
  - preferred_term: proliferating progenitor cell
    term:
      id: CL:0011026
      label: progenitor cell
  evidence:
  - reference: PMID:14625883
    reference_title: Parvovirus B19 and the pathogenesis of anaemia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      B19-infected erythroid-lineage cells show apoptotic features, which are
      thought to be induced by the non-structural protein, NS1, of B19.
    explanation: >-
      The apoptotic route out of the compartment in the viral setting, which is
      one of the three routes this node records.
  - reference: PMID:33002135
    reference_title: An induced pluripotent stem cell model of Fanconi anemia reveals mechanisms of p53-driven progenitor cell differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      FANCA-deficient human HPCs underwent accelerated terminal differentiation
      driven by activation of p53/p21.
    explanation: >-
      The premature-differentiation route, and the evidence that it is driven by
      the same p53-p21 arrest response rather than by a separate lesion.
  - reference: PMID:22683204
    reference_title: Bone marrow failure in Fanconi anemia is triggered by an exacerbated p53/p21 DNA damage response that impairs hematopoietic stem and progenitor cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Knockdown of p53 rescued the HSPC defects observed in several in vitro and
      in vivo models, including human FA or FA-like cells.
    explanation: >-
      The rescue that establishes the arrest response as causal for the
      attrition rather than coincident with it. Graded OTHER because the quoted
      sentence covers in vitro and in vivo models together.
  downstream:
  - target: Hypoplasia or Functional Failure of the Dependent Tissue
    causal_link_type: DIRECT
    description: >-
      A tissue that depends on continuous output from the progenitor compartment
      fails when that output falls, whether gradually as the pool is consumed or
      abruptly when demand is high.
    evidence:
    - reference: PMID:22683204
      reference_title: Bone marrow failure in Fanconi anemia is triggered by an exacerbated p53/p21 DNA damage response that impairs hematopoietic stem and progenitor cells.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        FA patients undergo progressive bone marrow failure (BMF) during
        childhood, which frequently requires allogeneic hematopoietic stem cell
        transplantation.
      explanation: >-
        The tissue-level outcome of progressive progenitor attrition in the
        inherited setting, and the clinical endpoint this edge terminates at.
    - reference: PMID:14625883
      reference_title: Parvovirus B19 and the pathogenesis of anaemia.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Human parvovirus B19 (B19) infection causes human bone marrow failure, by
        affecting erythroid-lineage cells which are well-known target cells for
        B19.
      explanation: >-
        The same tissue-level outcome reached through the viral route, and
        attributed explicitly to the progenitor population rather than to the
        mature compartment.
- name: Hypoplasia or Functional Failure of the Dependent Tissue
  role: consequence
  biological_scale: TISSUE
  description: >-
    The clinical endpoint, which is a tissue that can no longer replace its own
    mature cells. The worked instance is the haematopoietic compartment, where
    attrition of stem and progenitor cells presents as a hypocellular marrow and
    falling peripheral counts, progressively in an inherited repair defect and
    abruptly as an aplastic crisis when an acute insult meets a short red-cell
    lifespan. The severity of the tissue failure is set by two things the module
    itself does not fix: how dependent the tissue is on continuous progenitor
    output, and how much reserve the compartment had. That is why the same
    checkpoint arrest is clinically silent in one tissue and catastrophic in
    another, and why a conforming entry substitutes its own tissue, its own
    process and its own anatomical site at this node rather than inheriting the
    haematopoietic ones bound here.
  biological_processes:
  - preferred_term: hemopoiesis
    term:
      id: GO:0030097
      label: hemopoiesis
    modifier: DECREASED
  cell_types:
  - preferred_term: erythroid lineage cell
    term:
      id: CL:0000764
      label: erythroid lineage cell
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:22770237

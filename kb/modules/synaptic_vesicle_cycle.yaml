name: Synaptic Vesicle Cycle Module
description: >-
  A conserved presynaptic mechanism module representing the synaptic vesicle
  cycle — the trafficking cycle by which neurons load, dock, prime, fuse, and
  recycle synaptic vesicles to release neurotransmitter. Neurotransmitter release
  is mediated by Ca2+-triggered exocytosis of synaptic vesicles at the presynaptic
  active zone, followed by endocytosis and recycling that regenerates release-ready
  vesicles. Diverse monogenic lesions disrupt distinct steps of this shared cycle:
  docking/priming (Munc18-1/STXBP1, Munc13/UNC13A, RIM/RIMS1), Ca2+-triggered
  SNARE-mediated fusion (SNAP-25, syntaxin-1B, synaptobrevin-2/VAMP2, the Ca2+
  sensor synaptotagmin-1, and complexin), and vesicle endocytosis/recycling
  (dynamin-1/DNM1, synaptojanin-1/SYNJ1, clathrin/AP-2). Because these proteins act
  in a single integrated release machine, their loss converges on reduced or
  dysregulated neurotransmitter release and impaired synaptic transmission, which
  manifests clinically as developmental and epileptic encephalopathy, presynaptic
  congenital myasthenic syndrome, and/or movement disorder. Individual disorder
  entries declare conformance via conforms_to on their pathophysiology nodes,
  substituting the disorder-specific vesicle-cycle protein and vulnerable synapse
  population while preserving the conserved load-dock-prime-fuse-recycle chain.
category: Module
creation_date: "2026-07-06T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries should
  reference individual nodes via conforms_to using
  "synaptic_vesicle_cycle#<Node Name>"; the key conformance target is
  "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle
  Fusion", the central integrating step of the release machine. The generic cell
  type is neuron (CL:0000540); conforming entries substitute the disease-relevant
  subtype (e.g. cortical glutamatergic neuron, GABAergic interneuron, spinal motor
  neuron at the neuromuscular junction). This module is deliberately presynaptic
  and complementary to — not a duplicate of — the postsynaptic
  excitatory_synapse_scaffold_disruption module (PSD scaffold genes such as SHANK3
  and SYNGAP1), the network-level epilepsy_excitation_inhibition_imbalance module
  (which models hyper-synchronous firing rather than the presynaptic release
  lesion), and the glutamate_excitotoxicity module (receptor-overactivation cell
  death). The clinical convergence (which specific DEE syndrome, presynaptic
  myasthenia, or movement disorder results) is disorder-specific and stays on the
  conforming disorder entries. Module evidence reuses PMIDs that are curated and
  cached in the conforming disorder entries and in the foundational
  synaptic-vesicle-cycle and SNAREopathy literature; it is illustrative of the
  abstracted pattern rather than an exhaustive citation set. Worked conformers
  span the cycle's arms: SYN1-related disorder (vesicle clustering / reserve pool),
  STXBP1 encephalopathy and UNC13A congenital NDD (docking/priming),
  SYT1-associated neurodevelopmental disorder / Baker-Gordon syndrome (the
  calcium-sensor arm) with the three core SNARE-subunit disorders SNAP25 and STX1B
  (t-SNAREs) and VAMP2 (v-SNARE) and the SNARE-regulator/fusion-clamp disorder
  CPLX1, and DNM1 encephalopathy (the endocytosis/recycling arm). These are collected as
  the Synaptic_Vesicle_Cycle_Disorders grouping.
pathophysiology:
- name: Synaptic Vesicle Cycle Protein Deficiency
  description: >-
    The proximal molecular lesion: loss of function or dysregulation of a
    presynaptic protein that acts at one of the steps of the synaptic vesicle
    cycle (neurotransmitter loading, vesicle clustering, docking, priming,
    Ca2+-triggered fusion, or endocytic recycling). Because these proteins operate
    as a single integrated release machine, a defect in any one component reduces
    or dysregulates neurotransmitter release. Conforming entries substitute the
    disease gene and the specific cycle step it disrupts.
  role: trigger
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synaptic vesicle cycle
    term:
      id: GO:0099504
      label: synaptic vesicle cycle
    modifier: ABNORMAL
  examples:
  - STXBP1
  - UNC13A
  - SNAP25
  - STX1B
  - VAMP2
  - SYT1
  - DNM1
  - SYNJ1
  - RIMS1
  - SLC18A3
  evidence:
  - reference: PMID:15217342
    reference_title: "The synaptic vesicle cycle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To support rapid and repeated rounds of release, synaptic vesicles undergo a
      trafficking cycle.
    explanation: >-
      Establishes the synaptic vesicle trafficking cycle as the conserved
      presynaptic process whose component proteins are the substrate of this
      module.
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human pathogenic mutations have now been reported for all eight core
      components, but patients are diagnosed with very different neurodevelopmental
      syndromes.
    explanation: >-
      Documents that pathogenic mutations across the core release machinery cause a
      family of neurodevelopmental disorders, the disease scope of this module.
  - reference: PMID:25262651
    reference_title: "De novo mutations in synaptic transmission genes including DNM1 cause epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, 75% of mutations in these probands are predicted to disrupt a
      protein involved in regulating synaptic transmission
    explanation: >-
      A large epileptic-encephalopathy cohort finds that most causal de novo
      mutations disrupt synaptic-transmission proteins, supporting the presynaptic
      release machinery as a convergent disease pathway.
  downstream:
  - target: Impaired Vesicle Docking and Priming
    description: >-
      Loss of a docking/priming factor (Munc18-1, Munc13, RIM) prevents assembly
      of release-ready vesicles at the active zone.
  - target: Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
    description: >-
      Loss of a SNARE, the Ca2+ sensor, or its regulators directly impairs the
      membrane-fusion step.
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    description: >-
      Loss of an endocytic factor (dynamin-1, synaptojanin-1) impairs retrieval
      and regeneration of release-ready vesicles.
- name: Impaired Vesicle Docking and Priming
  description: >-
    Synaptic vesicles are tethered at the presynaptic active zone and rendered
    fusion-competent (primed) by a dedicated set of proteins — the Sec1/Munc18
    protein Munc18-1 (STXBP1), the priming factor Munc13 (UNC13A), and the
    active-zone scaffold RIM (RIMS1). Munc18-1 chaperones syntaxin-1 and templates
    SNARE-complex assembly, so its loss abolishes neurotransmitter secretion.
    Failure of docking/priming depletes the readily releasable vesicle pool and
    reduces release probability upstream of fusion.
  role: upstream
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synaptic vesicle priming
    term:
      id: GO:0016082
      label: synaptic vesicle priming
    modifier: DECREASED
  evidence:
  - reference: PMID:15217342
    reference_title: "The synaptic vesicle cycle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recycling then leads to the docking and priming of the vesicles for another
      round of exo- and endocytosis.
    explanation: >-
      Establishes docking and priming as the vesicle-cycle step that generates
      fusion-competent vesicles, the process disrupted at this node.
  - reference: PMID:10657302
    reference_title: "Synaptic assembly of the brain in the absence of neurotransmitter secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of a single protein, Munc18-1, in mice leads to a complete loss of
      neurotransmitter secretion from synaptic vesicles throughout development.
    explanation: >-
      The Munc18-1 (STXBP1) null mouse shows that loss of this docking/priming
      protein abolishes neurotransmitter secretion, the mechanistic anchor of the
      node.
  downstream:
  - target: Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
    description: >-
      Without docked, primed vesicles and correctly chaperoned syntaxin-1, the
      SNARE-mediated fusion step cannot proceed.
- name: Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
  description: >-
    The central integrating step: an action-potential-evoked Ca2+ influx is sensed
    by the vesicular Ca2+ sensor synaptotagmin-1, which triggers zippering of the
    neuronal SNARE complex (SNAP-25 with syntaxin-1B on the plasma membrane and
    synaptobrevin-2/VAMP2 on the vesicle), clamped and synchronized by complexin,
    to fuse the vesicle with the presynaptic membrane and release neurotransmitter.
    These components form a single integrated fusion machine, so a mutation in any
    one impairs evoked release. This is the key conformance target: disorders
    substitute their specific fusion-machinery gene while sharing this
    Ca2+-triggered SNARE-fusion lesion.
  role: central_effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: calcium-dependent activation of synaptic vesicle fusion
    term:
      id: GO:0099502
      label: calcium-dependent activation of synaptic vesicle fusion
    modifier: DECREASED
  - preferred_term: synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neuronal SNAREs and their key regulators together drive synaptic vesicle
      exocytosis and synaptic transmission as a single integrated membrane fusion
      machine.
    explanation: >-
      Directly frames the SNARE complex and its regulators as one integrated fusion
      machine, the central effector this node models.
  - reference: PMID:15217342
    reference_title: "The synaptic vesicle cycle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The focal point of the vesicle cycle is Ca2+-triggered exocytosis that is
      followed by different routes of endocytosis and recycling.
    explanation: >-
      Identifies Ca2+-triggered exocytosis as the focal point of the cycle, the
      step disrupted at this key conformance node.
  - reference: PMID:15217342
    reference_title: "The synaptic vesicle cycle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      insight into how Munc18-1 collaborates with SNARE proteins in fusion, how the
      vesicular Ca2+ sensor synaptotagmin 1 triggers fast release
    explanation: >-
      Names the SNARE proteins, Munc18-1, and the Ca2+ sensor synaptotagmin-1 as
      the collaborating machinery of fast Ca2+-triggered fusion.
  downstream:
  - target: Neurotransmitter Release Failure and Synaptic Transmission Deficit
    description: >-
      Failed or dysregulated Ca2+-triggered fusion reduces evoked neurotransmitter
      release and impairs synaptic transmission.
- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  description: >-
    After exocytosis, vesicle membrane and proteins are retrieved by endocytosis
    and recycled to regenerate release-ready vesicles, sustaining transmission
    during repeated firing. Dynamin-1 (DNM1) mediates the fission of endocytosing
    vesicles and synaptojanin-1 (SYNJ1) the phosphoinositide-dependent uncoating
    step. Failure of endocytic recycling depletes the recycling vesicle pool and
    causes activity-dependent synaptic-transmission failure, feeding back on the
    fusion step by starving it of vesicles.
  role: upstream
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synaptic vesicle endocytosis
    term:
      id: GO:0048488
      label: synaptic vesicle endocytosis
    modifier: DECREASED
  examples:
  - DNM1
  - SYNJ1
  evidence:
  - reference: PMID:15217342
    reference_title: "The synaptic vesicle cycle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The focal point of the vesicle cycle is Ca2+-triggered exocytosis that is
      followed by different routes of endocytosis and recycling.
    explanation: >-
      Establishes endocytosis and recycling as the vesicle-cycle steps that
      regenerate release-ready vesicles, the process disrupted at this node.
  - reference: PMID:25262651
    reference_title: "De novo mutations in synaptic transmission genes including DNM1 cause epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We bring statistical evidence that mutations in DNM1 cause epileptic
      encephalopathy
    explanation: >-
      Establishes DNM1 (dynamin-1, the vesicle-endocytosis fission GTPase) as a
      cause of epileptic encephalopathy, anchoring the endocytosis/recycling node
      to human disease.
  downstream:
  - target: Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
    description: >-
      Depletion of the recycling vesicle pool starves the fusion step of
      release-ready vesicles during sustained activity.
  - target: Neurotransmitter Release Failure and Synaptic Transmission Deficit
    description: >-
      Failure to regenerate vesicles causes activity-dependent synaptic
      transmission failure.
- name: Neurotransmitter Release Failure and Synaptic Transmission Deficit
  description: >-
    The convergent endpoint: reduced or dysregulated Ca2+-evoked neurotransmitter
    release impairs chemical synaptic transmission across the affected synapse
    population. Depending on the neurons involved this manifests as a
    developmental and epileptic encephalopathy (cortical excitatory/inhibitory
    imbalance), a presynaptic congenital myasthenic syndrome (motor-nerve-terminal
    transmission failure at the neuromuscular junction), and/or a movement
    disorder. This is the shared clinical-mechanistic endpoint; the specific
    syndrome is disorder-specific and stays on the conforming disorder entries.
  role: effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neurotransmitter secretion
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: DECREASED
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10657302
    reference_title: "Synaptic assembly of the brain in the absence of neurotransmitter secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of a single protein, Munc18-1, in mice leads to a complete loss of
      neurotransmitter secretion from synaptic vesicles throughout development.
    explanation: >-
      Demonstrates that loss of a single vesicle-cycle protein produces the
      convergent endpoint of failed neurotransmitter secretion.
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We argue that disease severity generally scales with functional redundancy
    explanation: >-
      Explains why the shared release-failure endpoint yields graded clinical
      severity across the different vesicle-cycle genes, supporting a common
      convergent mechanism with disorder-specific manifestations.

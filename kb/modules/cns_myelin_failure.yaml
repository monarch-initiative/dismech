  evidence:
  - reference: PMID:28638987
    reference_title: "Leukodystrophies: a proposed classification system based on pathological changes and pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Categories in this classification are the myelin disorders due to a primary
      defect in oligodendrocytes or myelin (hypomyelinating and demyelinating
      leukodystrophies, leukodystrophies with myelin vacuolization)
    explanation: >-
      Names the three morphological forms this node asserts - hypomyelination,
      demyelination, and myelin vacuolization - as the subcategories of the
      myelin-disorder group. Cited here for the outcome forms; the same sentence
      is cited on the trigger node for the pathogenetic category it defines.
      Evidence source is OTHER because this is a classification review.
  - reference: PMID:25649058
    reference_title: Case definition and classification of leukodystrophies and leukoencephalopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mildly hypo-, iso- or hyperintense T1 signal relative to the cortex may be
      consistent with a hypomyelinating leukodystrophy. Demyelinating
      leukodystrophy leads to significantly hypointense T1 signal.
    explanation: >-
      Supports the module's insistence that hypomyelination and demyelination are
      distinguishable forms of this node rather than interchangeable words, and
      gives the radiological criterion conforming entries should use to say which
      form they mean.
  downstream:
  - target: Loss of Oligodendroglial Support for the Axon
    description: >-
      A deficient sheath removes both the insulating structure and the
      oligodendroglial metabolic support that travels with it.

- name: Loss of Oligodendroglial Support for the Axon
  description: >-
    Myelin is not only insulation. Oligodendrocytes maintain the long-term
    integrity of the axons they ensheath through a metabolic route that is
    independent of myelination itself: they perform aerobic glycolysis and
    deliver lactate and pyruvate to the axon through monocarboxylate transporter
    1, on which myelinated axons draw when energy-deprived. Loss or dysfunction
    of the oligodendrocyte therefore withdraws trophic and metabolic support from
    the axon at the same time as it withdraws saltatory conduction, and
    experimental disruption of the transporter alone is sufficient to damage
    axons and kill neurons. This node is why leukodystrophy is a
    neurodegenerative and not merely a conduction disease.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: monocarboxylic acid transport
    term:
      id: GO:0015718
      label: monocarboxylic acid transport
    modifier: DECREASED
  - preferred_term: axon ensheathment
    term:
      id: GO:0008366
      label: axon ensheathment
    modifier: DECREASED
  evidence:
  - reference: PMID:22801498
    reference_title: Oligodendroglia metabolically support axons and contribute to neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Oligodendroglia support axon survival and function through mechanisms
      independent of myelination, and their dysfunction leads to axon
      degeneration in several diseases.
    explanation: >-
      States the claim of this node directly - oligodendroglial support of the
      axon is separable from myelination, and its failure causes axon
      degeneration. Evidence source is MODEL_ORGANISM because the supporting
      experiments are animal and cell-culture disruption models.
  - reference: PMID:22801498
    reference_title: Oligodendroglia metabolically support axons and contribute to neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the most abundant lactate transporter in the central
      nervous system, monocarboxylate transporter 1 (MCT1, also known as
      SLC16A1), is highly enriched within oligodendroglia and that disruption of
      this transporter produces axon damage and neuron loss in animal and cell
      culture models.
    explanation: >-
      Identifies the molecular route of the support - oligodendroglial MCT1
      lactate transport - and shows that disrupting it alone is sufficient to
      damage axons, establishing sufficiency rather than mere association.
  - reference: PMID:22622581
    reference_title: Glycolytic oligodendrocytes maintain myelin and long-term axonal integrity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This indicates that aerobic glycolysis products derived from
      oligodendrocytes are rapidly metabolized within white matter tracts.
    explanation: >-
      Supplies the complementary in vivo evidence that oligodendrocyte-derived
      glycolytic products are consumed within white matter tracts, i.e. that the
      coupling this node depends on is real in the intact CNS. Evidence source is
      MODEL_ORGANISM because the work is done in conditional mutant mice.
  downstream:
  - target: Axonal Degeneration and Progressive White Matter Dysfunction
    description: >-
      An axon deprived of both insulation and metabolic support degenerates.

- name: Axonal Degeneration and Progressive White Matter Dysfunction
  description: >-
    The clinical endpoint of the module. Axons within the affected tracts
    degenerate, and the selective, usually progressive white-matter disease that
    results produces the motor, cognitive, and visual deterioration characteristic
    of the leukodystrophies. Onset may be at any age from prenatal life to
    senescence, the course is mostly progressive though it may be static or even
    improving, and progressive forms are often fatal with no curative treatment
    known. Conforming entries specialize this node with their disorder-specific
    tract distribution and clinical tempo; the module deliberately does not
    assert a single age of onset or rate of decline.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: neuron projection maintenance
    term:
      id: GO:1990535
      label: neuron projection maintenance
    modifier: DECREASED
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  evidence:
  - reference: PMID:28638987
    reference_title: "Leukodystrophies: a proposed classification system based on pathological changes and pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Leukodystrophies are genetically determined disorders characterized by the
      selective involvement of the central nervous system white matter. Onset may
      be at any age, from prenatal life to senescence.
    explanation: >-
      Establishes the selective white-matter involvement that defines this
      endpoint and the wide onset range that is why the module does not fix an
      age of onset. Evidence source is OTHER because this is a classification
      review.
  - reference: PMID:28638987
    reference_title: "Leukodystrophies: a proposed classification system based on pathological changes and pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical course is mostly progressive, but may also be static or even
      improving with time. Progressive leukodystrophies are often fatal, and no
      curative treatment is known.
    explanation: >-
      Supports the qualified statement of tempo in this node - mostly but not
      invariably progressive - and the absence of curative therapy that motivates
      the substrate-reduction and cell-replacement strategies conforming entries
      curate.
  - reference: PMID:21068833
    reference_title: Myelination and support of axonal integrity by glia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Glial cells that myelinate axons were found to have a dual role by also
      supporting the long-term integrity of those axons. This function may be
      independent of myelin itself. Myelin abnormalities cause a number of
      neurological diseases
    explanation: >-
      Links the preceding support-failure node to this degenerative endpoint and
      states that myelin abnormalities are a cause of neurological disease.
      Evidence source is OTHER because this is a review.

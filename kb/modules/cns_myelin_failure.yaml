    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:30980503
    reference_title: Microglia damage precedes major myelin breakdown in X-linked adrenoleukodystrophy and metachromatic leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The immune-phenotype of microglia was altered already early in lesion
      evolution, and microglia loss preceded full-blown myelin degeneration both
      in X-ALD and MLD.
    explanation: >-
      Establishes the causal ordering that justifies placing this node upstream
      of the sheath defect rather than downstream of it. Evidence source is
      HUMAN_CLINICAL because the observation is made in human autopsy material
      from X-ALD and MLD patients.
  - reference: PMID:30980503
    reference_title: Microglia damage precedes major myelin breakdown in X-linked adrenoleukodystrophy and metachromatic leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, the present study shows an early and severe damage to microglia
      in the pathogenesis of X-ALD and MLD. This hints at a central
      pathophysiologic role of these cells in the diseases and provides evidence
      for an ongoing transfer of toxic substrates primarily enriched in
      myelinating cells to microglia.
    explanation: >-
      Supplies the mechanism by which the trigger lesion reaches microglia -
      transfer of the toxic substrate from myelinating cells - which is the edge
      this module draws from the trigger node to this one.
  - reference: PMID:34282843
    reference_title: "The multicellular interplay of microglia in health and disease: lessons from leukodystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The frequent connection of microglia to leukodystrophies, genetic disorders
      of the white matter, has highlighted their involvement in the maintenance
      of white matter integrity.
    explanation: >-
      Generalizes the microglial contribution beyond the two disorders of the
      autopsy study to the leukodystrophies as a class. Evidence source is OTHER
      because this is a review.
  - reference: PMID:30667116
    reference_title: Leukodystrophy caused by plasmalogen deficiency rescued by glyceryl 1-myristyl ether treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The defect in myelin content evolved to a progressive demyelination
      concomitant with generalized astrocytosis and white matter-selective
      microgliosis.
    explanation: >-
      Supports the reactive-astrogliosis half of this node, which the microglial
      autopsy studies do not address, and shows that both glial reactions
      accompany the evolving myelin lesion. Evidence source is MODEL_ORGANISM
      because the observation is in Gnpat-knockout mice.
  downstream:
  - target: Deficient or Unstable CNS Myelin Sheath
    description: >-
      Loss of the microglial population that maintains white matter integrity
      compounds the oligodendrocyte-intrinsic sheath defect.

- name: Deficient or Unstable CNS Myelin Sheath
  description: >-
    The rate-limiting, disorder-agnostic convergence point of the module and its
    key conformance target. Whatever the upstream lesion, the shared outcome is a
    CNS myelin sheath that is inadequate in amount, in composition, or in
    stability. It takes three morphological forms, which are the three myelin
    subcategories of the leukodystrophy classification and which conforming
    entries should name explicitly: hypomyelination, in which myelin is never
    adequately deposited; demyelination, in which a normally formed sheath is
    subsequently destroyed; and myelin vacuolization, in which the sheath is
    present but split by intramyelinic oedema. The distinction is prognostically
    and radiologically real - hypomyelinating disease shows only mildly abnormal
    T1 signal, demyelinating disease markedly hypointense T1 - but it is a
    difference in the route to the node, not a difference in the node itself.
  role: central_effector
  biological_scale: TISSUE

  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: DECREASED
  - preferred_term: oligodendrocyte apoptotic process
    term:
      id: GO:0097252
      label: oligodendrocyte apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:23438514
    reference_title: "Role of endogenous psychosine accumulation in oligodendrocyte differentiation and survival: implication for Krabbe disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we report that accumulation of endogenous psychosine under
      GALC deficient Krabbe conditions impedes OL differentiation process both by
      decreasing the expression of myelin lipids and protein and by inducing the
      cell death of maturating OLs.
    explanation: >-
      Demonstrates both routes of this node in one disorder - a toxic substrate
      arising from the trigger lesion arrests oligodendrocyte differentiation and
      also kills maturating oligodendrocytes. Evidence source is IN_VITRO because
      the differentiation and survival experiments are cell-culture based.
  - reference: PMID:15627202
    reference_title: "PLP1-related inherited dysmyelinating disorders: Pelizaeus-Merzbacher disease and spastic paraplegia type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent discoveries include complex mutational mechanisms and associated
      disease phenotypes, novel cellular pathways that lead to the degeneration
      of oligodendrocytes, and genomic architectural features that result in
      unique chromosomal rearrangements.
    explanation: >-
      Confirms that in the PLP1 disorders the mutational lesion acts through
      cellular pathways whose endpoint is oligodendrocyte degeneration, the
      death route of this node. Evidence source is OTHER because this is a
      review across human and animal-model studies.
  downstream:
  - target: Deficient or Unstable CNS Myelin Sheath
    description: >-
      Failure of the lineage to differentiate leaves myelin unformed;
      death of myelinating cells leaves formed myelin unmaintained.

- name: Microglial Injury and Reactive Gliosis
  description: >-
    Microglia are not passive spectators of the myelin lesion. In the
    lipid-degradation leukodystrophies, toxic substrate enriched in myelinating
    cells is transferred to microglia, whose immune phenotype is altered early
    and which are then lost by programmed cell death - and in both X-linked
    adrenoleukodystrophy and metachromatic leukodystrophy this microglial loss
    precedes full-blown myelin breakdown rather than following it. Reactive
    astrogliosis accompanies the process. This node is therefore positioned as a
    parallel amplifier feeding the sheath defect, not as a downstream reaction to
    it, and it is the mechanistic rationale for the efficacy of
    microglia-replenishing haematopoietic cell transplantation in these
    disorders.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:

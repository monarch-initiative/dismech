name: CNS Oligodendrocyte and Myelin Failure Module
description: >-
  A conserved central-nervous-system myelin module representing the final common
  pathway shared by the leukodystrophies whose primary defect lies in the
  oligodendrocyte or in the myelin sheath itself. A genetic lesion in a myelin
  structural protein, in oligodendrocyte-essential biogenesis or transcription
  machinery, or in a lipid-degradation pathway whose toxic substrate is enriched
  in myelinating cells, injures the oligodendrocyte lineage; the lineage then
  either arrests before terminal differentiation or dies after myelinating, and
  toxic substrate transferred to microglia drives an early microglial injury and
  reactive gliosis that compounds the insult. Both routes converge on a deficient
  or unstable CNS myelin sheath - hypomyelination (myelin never adequately laid
  down), demyelination (myelin formed and then lost), or myelin vacuolization.
  Loss of the sheath removes not only saltatory conduction but the metabolic and
  trophic support that oligodendroglia supply to the axons they ensheath, and the
  result is axonal degeneration with progressive white matter dysfunction. The
  module captures the core shared by the hypomyelinating leukodystrophies
  (PLP1/Pelizaeus-Merzbacher, POLR3-related, and their allelic relatives) and the
  demyelinating leukodystrophies (metachromatic leukodystrophy, Krabbe disease,
  X-linked adrenoleukodystrophy). Individual disorder entries declare conformance
  via conforms_to on their pathophysiology nodes, substituting the
  disorder-specific molecular lesion while preserving the conserved
  oligodendrocyte-centered causal chain.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g., "cns_myelin_failure#Deficient or
  Unstable CNS Myelin Sheath").


  SCOPE - this is the myelin-disorder arm only, and the boundary matters. Van der
  Knaap and Bugiani (PMID:28638987) partition the leukodystrophies into five
  pathogenetic categories: myelin disorders due to a primary defect in
  oligodendrocytes or myelin; astrocytopathies; leuko-axonopathies;
  microgliopathies; and leuko-vasculopathies. Only the first is this module. The
  same review stresses that "only few leukodystrophies are due to mutations in
  myelin- or oligodendrocyte-specific genes", so a white-matter disease is NOT a
  conformer merely because it has white-matter signal change on MRI. Alexander
  disease (GFAP astrocytopathy) and vanishing white matter disease (eIF2B
  astrocytopathy) are the canonical near-misses: their primary lesion is in the
  astrocyte, and they should NOT declare conformance at the trigger or
  oligodendrocyte nodes. A disease may still conform at the downstream
  "Deficient or Unstable CNS Myelin Sheath" node when its myelin loss is
  separately evidenced - node-level conformance is the unit, not the whole chain.
  Likewise, acquired demyelination (multiple sclerosis, MOGAD, ADEM, osmotic
  demyelination) is out of scope for the trigger node, which is a heritable
  lesion; those diseases carry their own immune or osmotic trigger.


  PERIPHERAL NERVE IS A DIFFERENT MODULE. Several conformers (metachromatic
  leukodystrophy, Krabbe disease, PLP1-null Pelizaeus-Merzbacher) also have
  Schwann-cell demyelinating neuropathy. That arm belongs to
  peripheral_axonal_degeneration, whose "Distal Axonal Degeneration and
  Demyelination" node covers PNS myelin; do not route a peripheral neuropathy
  node here. A disorder with both arms conforms to both modules at different
  nodes.


  Key disorder-specific substitutions for the trigger node: a myelin structural
  protein (PLP1 point mutation, duplication, or null allele in
  Pelizaeus-Merzbacher disease; GJC2 in hypomyelinating leukodystrophy 2) in the
  primary hypomyelinating disorders; an oligodendrocyte-essential
  transcription/biogenesis machinery (RNA polymerase III subunits POLR3A/POLR3B
  in POLR-related leukodystrophy, PYCR2, TUBB4A) in the POLR-type and allied
  hypomyelinating leukodystrophies; and a lipid-degradation enzyme whose
  undegraded substrate is enriched in myelinating cells (arylsulfatase A and
  sulfatide in metachromatic leukodystrophy; galactocerebrosidase and psychosine
  in Krabbe disease; ABCD1 and very-long-chain fatty acids in X-linked
  adrenoleukodystrophy; aspartoacylase and N-acetylaspartate in Canavan disease)
  in the demyelinating and vacuolating disorders. The oligodendrocyte
  (CL:0000128) and its precursor (CL:0002453) are the shared vulnerable cell
  types across all conforming disorders.


  RELATIONSHIP TO lysosomal_substrate_accumulation. Metachromatic leukodystrophy
  and Krabbe disease already conform to that module for the enzyme-deficiency and
  substrate-accumulation steps. That is correct and should be kept: the lysosomal
  module explains how the toxic substrate arises, and this module explains what
  that substrate does to the oligodendrocyte lineage and the sheath. The two are
  complementary and a conformer declares both, at different nodes; this module
  does not re-derive the lysosomal chain.
pathophysiology:
- name: Oligodendrocyte-Lineage or Myelin-Membrane Insult
  description: >-
    A heritable lesion acts primarily on the oligodendrocyte or on the myelin
    membrane it produces. The molecular lesion is heterogeneous across disorders
    - a mutated myelin structural protein that misfolds or is expressed at the
    wrong dosage, a defect in transcriptional or biosynthetic machinery on which
    the oligodendrocyte lineage is disproportionately dependent, or a defect in
    lipid degradation whose undegraded substrate is concentrated in myelinating
    cells - but all converge on a stressed oligodendrocyte lineage. This is the
    defining entry criterion of the module: a disease whose primary lesion is in
    the astrocyte, the axon, the microglial cell, or the vessel wall enters the
    white-matter cascade elsewhere and is not a conformer here.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  cellular_components:
  - preferred_term: myelin sheath
    term:
      id: GO:0043209
      label: myelin sheath
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  evidence:
  - reference: PMID:28638987
    reference_title: "Leukodystrophies: a proposed classification system based on pathological changes and pathogenetic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Categories in this classification are the myelin disorders due to a primary
      defect in oligodendrocytes or myelin (hypomyelinating and demyelinating
      leukodystrophies, leukodystrophies with myelin vacuolization);
      astrocytopathies; leuko-axonopathies; microgliopathies; and
      leuko-vasculopathies.
    explanation: >-
      Establishes "a primary defect in oligodendrocytes or myelin" as a distinct
      pathogenetic category of leukodystrophy, which is exactly the trigger state
      this module models, and names the four sibling categories that are
      deliberately excluded from it. Evidence source is OTHER because this is a
      classification review synthesizing neuropathology across many disorders.
  - reference: PMID:15627202
    reference_title: "PLP1-related inherited dysmyelinating disorders: Pelizaeus-Merzbacher disease and spastic paraplegia type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both PMD and SPG2 are caused by mutations in the proteolipid protein 1
      (PLP1) gene, which encodes a major component of CNS myelin proteins.
    explanation: >-
      A worked instance of the trigger node in its myelin-structural-protein
      form: the lesion is in a gene encoding a major constituent of the CNS
      myelin membrane itself. Evidence source is OTHER because this is a review
      of PLP1 mutational mechanisms.
  downstream:
  - target: Oligodendrocyte Differentiation Arrest and Death
    description: >-
      The primary lesion is delivered to the oligodendrocyte lineage, which
      responds by failing to complete terminal differentiation or by dying after
      myelination.
  - target: Microglial Injury and Reactive Gliosis
    causal_link_type: DIRECT
    description: >-
      In the lipid-degradation disorders, toxic substrate enriched in myelinating
      cells is transferred to microglia, injuring them early in lesion evolution.

- name: Oligodendrocyte Differentiation Arrest and Death
  description: >-
    The injured oligodendrocyte lineage takes one of two routes, and which route
    dominates is what separates hypomyelination from demyelination downstream.
    Oligodendrocyte precursors may arrest before terminal differentiation, so
    that myelin is never adequately laid down; or mature, already-myelinating
    oligodendrocytes may undergo apoptotic or other regulated cell death, so that
    myelin formed normally is subsequently lost. Both routes may operate in the
    same disorder, as they do in Krabbe disease, where accumulating psychosine
    simultaneously impedes differentiation and kills maturating oligodendrocytes.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte

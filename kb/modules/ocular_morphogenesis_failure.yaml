name: Ocular Morphogenesis Failure Module
description: >-
  A conserved developmental module for the anophthalmia-microphthalmia-coloboma
  (A/M/C) spectrum. Heterogeneous lesions in eye-field specification and optic
  vesicle patterning — including SOX2/OTX2/PAX6/RAX/MAB21L2 dosage, retinoid,
  WNT/FZD5, and bidirectional Hedgehog-pathway perturbation — converge on
  abnormal optic-cup and globe morphogenesis. Optic-cup invagination precedes
  closure of the embryonic optic fissure: severe early morphogenesis failure
  produces anophthalmia or microphthalmia, while failure of the later
  optic-fissure closure step produces coloboma. The well-characterized
  Hedgehog arm includes
  a proximal optic-stalk PAX2-domain expansion at the expense of the distal
  PAX6 retinal domain. Conforming disorders substitute their specific upstream
  lesion while preserving the applicable developmental step. This module is
  restricted to neural eye-field/optic-vesicle/optic-cup morphogenesis. The
  surface-ectoderm/lens-placode arm is deliberately out of scope: FOXE3-related
  lens induction failure can secondarily reduce globe size, but it does not
  traverse the optic-stalk boundary or optic-fissure chain and therefore is not
  a conformer. Chorioretinal lacunae in Aicardi syndrome and adult Refsum
  retinal degeneration are likewise not instances of this module. The broad
  mesoectodermal-development node in focal dermal hypoplasia and the broad
  aneuploidy-consequence node in mosaic variegated aneuploidy do not resolve an
  ocular morphogenesis step, so their downstream phenotype mentions are not
  wired as conformers.
category: Module
creation_date: "2026-08-08T18:54:23Z"
notes: >-
  This is a mechanism module, not a disease. The key conformance target is
  "ocular_morphogenesis_failure#Disrupted Optic Cup and Globe Morphogenesis".
  The trigger is sign-agnostic (`modifier: ABNORMAL`): disorder-specific
  Hedgehog nodes may specialize the perturbation to INCREASED (SOX11 loss or
  PTCH1 loss) or DECREASED (SHH/GLI loss). The optic-stalk/optic-cup boundary
  shift is the experimentally resolved Hedgehog route; other drivers may join
  at the downstream optic-cup/globe or fissure-closure nodes rather than claim
  that exact intermediate. The central node has two outcome routes on purpose:
  early globe morphogenesis failure directly yields anophthalmia or
  microphthalmia, whereas the correctly ordered later fissure-closure arm yields
  coloboma. Open GitHub issue 3974 means Pathophysiology currently
  has no HP/MONDO binding slots. To avoid a synthetic shadow node or a schema
  exception, the consequence node points to three top-level HP-bound phenotypes;
  MONDO:0016764 is recorded as a close mapping because its exact synonym is
  "microphthalmia-anophthalmia-coloboma spectrum", while its preferred label is
  narrower (isolated disease) than this mechanism, which also recurs in
  syndromic disorders. Wave-2 phenotype-only entries remain unwired until
  GitHub issue 3974
  is resolved.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0016764
      label: isolated anophthalmia-microphthalmia syndrome
    mapping_predicate: skos:closeMatch
    mapping_source: Manual curation for GitHub issue 7779
    mapping_justification: >-
      MONDO:0016764 carries the exact synonym
      "microphthalmia-anophthalmia-coloboma spectrum", but its preferred label
      and definition are restricted to isolated disease. The module spans the
      same malformation spectrum across isolated and syndromic disorders, so a
      close mapping is accurate and an exact mapping would overstate identity.
pathophysiology:
- name: Eye Field Specification and Optic Vesicle Patterning Perturbation
  description: >-
    The initiating lesion changes the dosage, timing, or spatial activity of a
    conserved early-eye regulator. The substitutable driver may be a
    transcription factor or enhancer (SOX2, OTX2, PAX6, RAX, MAB21L2), the
    STRA6/RARB/ALDH1A3 retinoid axis, WNT/FZD5 signaling, or Hedgehog signaling.
    Hedgehog is explicitly bidirectional: either excess or deficient pathway
    output can disrupt eye-field separation and optic-vesicle patterning, so the
    generic module records abnormal rather than increased or decreased activity.
  role: trigger
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: camera-type eye development
    term:
      id: GO:0043010
      label: camera-type eye development
    modifier: ABNORMAL
  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  evidence:
  - reference: PMID:25010521
    reference_title: "Sox11 is required to maintain proper levels of Hedgehog signaling during vertebrate ocular morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that the transcription factor Sox11 is required to maintain
      specific levels of Hedgehog signaling during ocular development.
    explanation: >-
      Zebrafish perturbation establishes the dosage-sensitive Hedgehog arm and
      supports an ABNORMAL, rather than direction-specific, module trigger.
  - reference: PMID:39503780
    reference_title: "Homozygosity for a hypomorphic mutation in frizzled class receptor 5 causes syndromic ocular coloboma with microcornea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the Wnt receptor FZD5, which is expressed throughout eye
      development, have been linked to both isolated and complex forms of
      coloboma.
    explanation: >-
      Human FZD5 disease provides a distinct WNT-pathway substitution at the
      generic early-eye-patterning trigger.
  - reference: PMID:31816153
    reference_title: "High-throughput custom capture sequencing identifies novel mutations in coloboma-associated genes: Mutation in DNA-binding domain of retinoic acid receptor beta affects nuclear localization causing ocular coloboma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies revealed lower steady-state protein levels, reduced
      transcriptional activity, and incomplete nuclear localization of the
      mutant RARB protein compared with wild-type.
    explanation: >-
      Functional characterization of a pathogenic RARB variant provides the
      retinoid-signaling substitution at the same generic trigger.
  downstream:
  - target: Optic Stalk–Optic Cup Proximodistal Boundary Shift
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In the experimentally resolved Hedgehog arm, disturbed early patterning
      shifts proximal optic-stalk identity into distal retinal territory.

- name: Optic Stalk–Optic Cup Proximodistal Boundary Shift
  description: >-
    Abnormal proximal-distal patterning expands PAX2-positive optic-stalk tissue
    at the expense of the distal PAX6-positive optic-vesicle/retinal domain. In
    the Patched1-deficient model, the ectopic stalk extends into the retina and
    physically prevents the opposing fissure margins from meeting. This node is
    the resolved Hedgehog intermediate; non-Hedgehog conformers should normally
    join the module at a downstream node rather than assert this boundary shift.
  role: amplifier
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal progenitor cell
    term:
      id: CL:0002672
      label: retinal progenitor cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: camera-type eye morphogenesis
    term:
      id: GO:0048593
      label: camera-type eye morphogenesis
    modifier: ABNORMAL
  locations:
  - preferred_term: optic cup
    term:
      id: UBERON:0003072
      label: optic cup
  evidence:
  - reference: PMID:18479681
    reference_title: "Zebrafish blowout provides genetic evidence for Patched1-mediated negative regulation of Hedgehog signaling within the proximal optic vesicle of the vertebrate eye."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The expression domain of the proximal optic vesicle marker pax2a is
      expanded in blowout at the expense of the distal optic vesicle marker
      pax6, suggesting that the initial patterning of the optic vesicle into
      proximal and distal territories is disrupted in blowout.
    explanation: >-
      The Patched1-deficient zebrafish model directly resolves the PAX2/PAX6
      proximodistal boundary shift represented by this intermediate.
  downstream:
  - target: Disrupted Optic Cup and Globe Morphogenesis
    causal_link_type: DIRECT
    description: >-
      Misallocated optic-stalk and retinal territories disrupt the geometry of
      the developing optic cup and its fissure-bearing ventral margin.

- name: Disrupted Optic Cup and Globe Morphogenesis
  description: >-
    Early-eye regulatory failure impairs optic-vesicle outgrowth, optic-cup
    invagination, tissue growth, and spatial patterning. Severe failure can
    prevent formation of the globe (anophthalmia); partial growth failure
    produces a small globe (microphthalmia). Because the ventral fissure is
    created during optic-cup invagination, the same upstream morphogenetic
    disturbance can also predispose its margins to fail to appose and fuse.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal progenitor cell
    term:
      id: CL:0002672
      label: retinal progenitor cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: eye morphogenesis
    term:
      id: GO:0048592
      label: eye morphogenesis
    modifier: ABNORMAL
  - preferred_term: camera-type eye morphogenesis
    term:
      id: GO:0048593
      label: camera-type eye morphogenesis
    modifier: ABNORMAL
  locations:
  - preferred_term: optic cup
    term:
      id: UBERON:0003072
      label: optic cup
  evidence:
  - reference: PMID:39455595
    reference_title: "Deletion upstream of MAB21L2 highlights the importance of evolutionarily conserved non-coding sequences for eye development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Modelling of the deletion results in transient small lens and coloboma as
      well as midbrain anomalies in zebrafish, and microphthalmia and coloboma
      in Xenopus tropicalis.
    explanation: >-
      Cross-species modeling of a human upstream MAB21L2 regulatory deletion
      links disrupted early-eye regulation to reduced globe size and coloboma.
  - reference: PMID:25010521
    reference_title: "Sox11 is required to maintain proper levels of Hedgehog signaling during vertebrate ocular morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, decreased gene dosage from a segmental deletion encompassing
      the SOX11 locus resulted in microphthalmia and related ocular phenotypes.
    explanation: >-
      Human SOX11 dosage loss provides a second upstream substitution that
      converges on reduced globe morphogenesis.
  downstream:
  - target: Failure of Optic Fissure Closure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Optic-cup invagination and ventral patterning occur before fissure
      apposition and fusion; disturbed cup geometry can therefore compromise the
      later closure step.
  - target: Anophthalmia–Microphthalmia–Coloboma Spectrum Outcome
    causal_link_type: DIRECT
    description: >-
      Severe or partial early globe morphogenesis failure supplies the
      anophthalmia and microphthalmia arms of the terminal spectrum directly.

- name: Failure of Optic Fissure Closure
  description: >-
    After optic-cup invagination creates the ventral optic fissure, its opposing
    margins must appose, remove intervening basement membrane, and fuse. Failure
    or delay of this later step leaves an inferonasal gap affecting iris,
    ciliary body, retina/choroid, or optic nerve and produces ocular coloboma.
    This node is downstream of optic-cup morphogenesis; it is not modeled as the
    cause of anophthalmia or microphthalmia.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal progenitor cell
    term:
      id: CL:0002672
      label: retinal progenitor cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: closure of optic fissure
    term:
      id: GO:0061386
      label: closure of optic fissure
    modifier: DECREASED
  locations:
  - preferred_term: optic fissure
    term:
      id: UBERON:0005412
      label: optic fissure
  evidence:
  - reference: PMID:39503780
    reference_title: "Homozygosity for a hypomorphic mutation in frizzled class receptor 5 causes syndromic ocular coloboma with microcornea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ocular coloboma (OC) is a congenital disorder caused by the incomplete
      closure of the embryonic ocular fissure.
    explanation: >-
      Defines coloboma as the outcome of incomplete embryonic fissure closure.
  - reference: PMID:24412933
    reference_title: "Mutation of SALL2 causes recessive ocular coloboma in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of Sall2-deficient mouse embryos revealed delayed apposition of
      the optic fissure margins and the persistence of an anterior retinal
      coloboma phenotype after birth.
    explanation: >-
      A loss-of-function model directly links delayed fissure-margin apposition
      to persistent retinal coloboma.
  downstream:
  - target: Anophthalmia–Microphthalmia–Coloboma Spectrum Outcome
    causal_link_type: DIRECT
    description: >-
      Fissure non-closure supplies the coloboma arm of the terminal spectrum.

- name: Anophthalmia–Microphthalmia–Coloboma Spectrum Outcome
  description: >-
    The convergent developmental outcome is a severity spectrum comprising
    absent globe formation (anophthalmia), reduced globe size (microphthalmia),
    and/or a persistent tissue cleft (coloboma). The three can occur alone or in
    combination because early globe-growth failure and later fissure-closure
    failure are related but separable outputs of disturbed ocular morphogenesis.
  role: consequence
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: camera-type eye morphogenesis
    term:
      id: GO:0048593
      label: camera-type eye morphogenesis
    modifier: ABNORMAL
  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  evidence:
  - reference: PMID:39455595
    reference_title: "Deletion upstream of MAB21L2 highlights the importance of evolutionarily conserved non-coding sequences for eye development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anophthalmia, microphthalmia and coloboma (AMC) comprise a spectrum of
      developmental eye disorders, accounting for approximately 20% of
      childhood visual impairment.
    explanation: >-
      Names the three malformations as a single developmental spectrum and
      anchors the consequence node.
  downstream:
  - target: Anophthalmia
    causal_link_type: DIRECT
  - target: Microphthalmia
    causal_link_type: DIRECT
  - target: Coloboma
    causal_link_type: DIRECT


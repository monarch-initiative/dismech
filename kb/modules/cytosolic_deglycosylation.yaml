name: Cytosolic Deglycosylation Module
description: >-
  A conserved module for the congenital disorders of deglycosylation (CDDG) -
  the small family of inborn errors that break the cytosolic, post-ER handling
  of glycans that have already been synthesized. Where the congenital disorders
  of glycosylation fail to put glycans on, these disorders fail to take them
  off and clear them. Two enzymes act in sequence on one substrate pool:
  cytosolic peptide:N-glycanase (NGLY1/PNGase) releases the N-glycan from a
  misfolded glycoprotein that has been retrotranslocated out of the ER for
  proteasomal degradation, and cytosolic alpha-mannosidase (MAN2C1) trims the
  free oligosaccharide that release - and ordinary glycoprotein turnover -
  generates. Loss of either produces a shared lesion, dysregulation of the
  cytosolic free-oligosaccharide pool, and a shared clinical shape, a
  multisystem neurodevelopmental disorder with structural brain involvement.
  The NGLY1 arm carries a second, mechanistically distinct output that the
  MAN2C1 arm does not: deglycosylation of the transcription factor NFE2L1/Nrf1
  is not a degradative step but an activating sequence edit, converting
  glycosylated asparagine to aspartate, and its loss disables the proteasome
  bounce-back response. Deglycosylation in this module is therefore both a
  disposal route and a signal.
category: Module
creation_date: "2026-08-20T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "cytosolic_deglycosylation#Cytosolic Glycan Catabolite Dysregulation").

  Key conformance target: the central_effector node "Cytosolic Glycan Catabolite
  Dysregulation" - the one lesion both known CDDG genes converge on regardless
  of which enzyme is lost, and named for the catabolite pool rather than for
  free oligosaccharides alone so that both arms can attach honestly. Conforming entries substitute the disorder-specific
  enzyme (NGLY1 peptide:N-glycanase, MAN2C1 cytosolic alpha-mannosidase) and,
  where the arm applies, route through the enzyme-specific upstream node:
  "Impaired Cytosolic Deglycosylation of Retrotranslocated Glycoproteins" for
  NGLY1, which is a claim about ERAD substrate handling that a MAN2C1 conformer
  must not make.

  "Loss of Deglycosylation-Dependent Substrate Activation" is deliberately an
  NGLY1-only branch and is NOT part of the shared chain. It captures the
  sequence-editing function - Asn-to-Asp conversion of NFE2L1/Nrf1 - which has
  no MAN2C1 counterpart, since trimming a released oligosaccharide edits no
  protein. A conformer should attach here only with direct evidence of a
  deglycosylation-dependent activation step, not on the strength of a
  proteasome or oxidative-stress phenotype alone, which many unrelated
  disorders produce.

  Boundary. This module is the deliberate complement of
  congenital_disorder_of_glycosylation, which models failure of N-glycan
  synthesis and attachment; nothing conforms to both for the same node. It is
  also distinct from lysosomal_substrate_accumulation - that module's substrate
  builds up inside the lysosome behind a deficient acid hydrolase, whereas the
  free oligosaccharides here accumulate in the cytosol and the pathway is
  explicitly non-lysosomal glycan degradation. It is not loss_of_proteostasis
  either: the ERAD and proteasome involvement in the NGLY1 arm is a specific
  enzymatic step and a specific transcriptional response, not a generalized
  collapse of degradative capacity.

  Modules bind GO and CL terms only and do not use CHEBI or gene bindings; the
  free oligosaccharide is therefore described in prose rather than bound to a
  CHEBI class. This is not an Xogenesis module - nothing pathological is
  formed, a normal catabolic route fails.

  ENGASE is the module's built-in therapeutic hypothesis and its clearest open
  question. Cytoplasmic endo-beta-N-acetylglucosaminidase is a second
  de-N-glycosylating enzyme that leaves a single GlcNAc on the asparagine, and
  deleting it partially rescues the embryonic lethality of Ngly1-null mice.
  Whether an ENGASE inhibitor would help a human patient is untested, and the
  rescue is recorded here as a mechanistic finding rather than as a treatment.
pathophysiology:
- name: Cytosolic Deglycosylation Enzyme Deficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic loss-of-function variants abolish or markedly reduce one of the
    cytosolic enzymes that dispose of already-synthesized glycans:
    peptide:N-glycanase, which hydrolyses the glycan-asparagine bond on
    retrotranslocated glycoproteins, or cytosolic alpha-mannosidase, which
    trims the resulting free oligosaccharides. Conforming disorder nodes
    substitute the specific enzyme and its molecular function.
  biological_processes:
  - preferred_term: protein deglycosylation
    modifier: DECREASED
    term:
      id: GO:0006517
      label: protein deglycosylation
  molecular_functions:
  - preferred_term: peptide-N4-(N-acetyl-beta-glucosaminyl)asparagine amidase activity
    modifier: DECREASED
    term:
      id: GO:0000224
      label: peptide-N4-(N-acetyl-beta-glucosaminyl)asparagine amidase activity
  - preferred_term: alpha-mannosidase activity
    modifier: DECREASED
    term:
      id: GO:0004559
      label: alpha-mannosidase activity
  evidence:
  - reference: PMID:41917400
    reference_title: "Cytosolic Peptide: N-Glycanase (NGLY1)-from Basic Biology to Genetic Disorder, NGLY1 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The cytosolic peptide:N-glycanase (PNGase, NGLY1 in mammals) is an enzyme
      that removes N-glycans from misfolded glycoproteins.
    explanation: >-
      Defines the peptide:N-glycanase arm of the enzyme deficiency this trigger
      node represents.
  - reference: PMID:35045343
    reference_title: "Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The catabolism of fOSs has been linked to the activity of a specific
      cytosolic mannosidase, MAN2C1
    explanation: >-
      Defines the cytosolic alpha-mannosidase arm of the same trigger node.
  downstream:
  - target: Impaired Cytosolic Deglycosylation of Retrotranslocated Glycoproteins
    description: >-
      The peptide:N-glycanase arm. Loss of the amidase leaves N-glycans
      attached to glycoproteins that have already been pulled out of the ER for
      degradation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25900930
      reference_title: "A congenital disorder of deglycosylation: Biochemical characterization of N-glycanase 1 deficiency in patient fibroblasts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        N-Glycanase 1, encoded by NGLY1, catalyzes the deglycosylation of
        misfolded N-linked glycoproteins retrotranslocated into the cytosol.
      explanation: >-
        States the reaction and the substrate class that this edge removes.
  - target: Cytosolic Glycan Catabolite Dysregulation
    description: >-
      Both arms reach the shared lesion: the cytosolic alpha-mannosidase arm
      directly, by failing to trim free oligosaccharides, and the
      peptide:N-glycanase arm by changing which species enter the pool and by
      what route.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35045343
      reference_title: "Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        MAN2C1 variants lead to accumulation and delay in the processing of fOSs
        in proband-derived cells.
      explanation: >-
        Direct measurement of the free-oligosaccharide lesion in patient cells.
- name: Impaired Cytosolic Deglycosylation of Retrotranslocated Glycoproteins
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    The peptide:N-glycanase-specific arm. Misfolded N-linked glycoproteins are
    retrotranslocated from the ER into the cytosol for proteasomal degradation,
    and normally lose their bulky N-glycan first. Without that step the ERAD
    route is perturbed, and a second cytosolic de-N-glycosylating enzyme,
    ENGASE, acts on the same substrates instead, leaving a single GlcNAc on the
    asparagine. A MAN2C1-type conformer must not attach here - it makes a claim
    about glycoprotein substrate handling, not about free-oligosaccharide
    trimming.
  biological_processes:
  - preferred_term: ERAD pathway
    modifier: ABNORMAL
    term:
      id: GO:0036503
      label: ERAD pathway
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: ABNORMAL
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:24651605
    reference_title: "Mutations in NGLY1 cause an inherited disorder of the endoplasmic reticulum-associated degradation pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The endoplasmic reticulum-associated degradation pathway is responsible
      for the translocation of misfolded proteins across the endoplasmic
      reticulum membrane into the cytosol for subsequent degradation by the
      proteasome.
    explanation: >-
      Places the deglycosylation step inside the ERAD-proteasome route this
      node represents.
  - reference: PMID:28426790
    reference_title: "Lethality of mice bearing a knockout of the Ngly1-gene is partially rescued by the additional deletion of the Engase gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the additional deletion of the gene encoding endo-β-N-acetylglucosaminidase
      (Engase), which is another de-N-glycosylating enzyme but leaves a single
      GlcNAc at glycosylated Asn residues, resulted in the partial rescue of the
      lethality of the Ngly1-deficient mice
    explanation: >-
      Establishes the competing ENGASE route on the same substrates, and that
      removing it is protective - the genetic evidence that the damage is done
      by what happens to undeglycosylated substrates, not merely by their
      persistence.
  downstream:
  - target: Loss of Deglycosylation-Dependent Substrate Activation
    description: >-
      A subset of peptide:N-glycanase substrates are not being disposed of but
      edited: deglycosylation converts glycosylated asparagine to aspartate and
      thereby activates them.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41468431
      reference_title: "NFE2L1/Nrf1 forms a coactivator complex post-peptide:N-glycanase-mediated sequence editing and mitigates proteasome dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        N-glycosylated proteins undergo protein sequence editing by
        peptide:N-glycanase (NGLY1)-mediated conversion of N-glycosylated
        asparagine residues to aspartic acid.
      explanation: >-
        Defines the sequence-editing reaction that distinguishes this branch
        from ordinary degradative deglycosylation.
  - target: Cytosolic Glycan Catabolite Dysregulation
    description: >-
      Glycans released from ERAD substrates are a principal source of the
      cytosolic free-oligosaccharide pool, so a block at this step changes both
      the flux into the pool and the species it contains.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41917400
      reference_title: "Cytosolic Peptide: N-Glycanase (NGLY1)-from Basic Biology to Genetic Disorder, NGLY1 Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        NGLY1 contributes to cytosolic glycan degradation (non-lysosomal glycan
        degradation)
      explanation: >-
        Places peptide:N-glycanase in the same cytosolic glycan-degradation
        route as the free-oligosaccharide pool, and names it as non-lysosomal.
- name: Cytosolic Glycan Catabolite Dysregulation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target:
    the products of cytosolic, non-lysosomal glycan degradation are wrong -
    accumulating, processed too slowly, or of the wrong species. The two arms
    reach it with different catabolites, which conforming entries substitute.
    Loss of cytosolic alpha-mannosidase leaves free oligosaccharides
    unprocessed and accumulating. Loss of peptide:N-glycanase diverts
    glycoprotein disposal down the ENGase route and leaves
    GlcNAc-asparagine (GNA) accumulating instead, measurable in patient plasma,
    urine, and dried blood spots. Naming the node for the catabolite pool
    rather than for free oligosaccharides specifically is deliberate: a
    conformer should not have to claim free-oligosaccharide accumulation to
    attach here when its evidenced catabolite is a glycoasparagine.
  biological_processes:
  - preferred_term: oligosaccharide catabolic process
    modifier: DECREASED
    term:
      id: GO:0009313
      label: oligosaccharide catabolic process
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35045343
    reference_title: "Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MAN2C1 variants lead to accumulation and delay in the processing of fOSs
      in proband-derived cells.
    explanation: >-
      The defining measurement of this node, made in patient-derived cells.
  - reference: PMID:31311714
    reference_title: "Aspartylglycosamine is a biomarker for NGLY1-CDDG, a congenital disorder of deglycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified aspartylglycosamine as the only significantly increased
      compound
    explanation: >-
      The peptide:N-glycanase arm's counterpart measurement: an accumulating
      glycan-asparagine catabolite detectable in patient samples, which is why
      this node is named for catabolites rather than for free oligosaccharides
      alone.
  downstream:
  - target: Neurodevelopmental and Multisystem Dysfunction
    description: >-
      The link from the cytosolic biochemical lesion to the clinical phenotype
      is asserted from co-occurrence in the same patients, not demonstrated.
      Conforming entries should preserve the weak causal typing rather than
      upgrading it.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35045343
      reference_title: "Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental disorder."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These individuals exhibit dysmorphic facial features, congenital anomalies
        such as tongue hamartoma, variable degrees of intellectual disability, and
        brain anomalies including polymicrogyria, interhemispheric cysts,
        hypothalamic hamartoma, callosal anomalies, and hypoplasia of brainstem
        and cerebellar vermis.
      explanation: >-
        Establishes the phenotype in the same individuals in whom the
        biochemical lesion was measured, without establishing that one causes
        the other.
- name: Loss of Deglycosylation-Dependent Substrate Activation
  biological_scale: CELLULAR
  role: effector
  description: >-
    An NGLY1-only branch, not part of the shared chain. Peptide:N-glycanase
    activates the ER-associated transcription factor NFE2L1/Nrf1 by editing its
    sequence - glycosylated asparagines are converted to aspartate - and only
    the edited protein assembles the coactivator complex that drives proteasome
    subunit gene expression. Without the edit, the cell cannot mount the
    proteasome bounce-back response when the proteasome is compromised. Nrf
    proteins are the only transcription factors known to be activated this way,
    so this is a narrow but mechanistically specific branch. Attach a conformer
    here only with direct evidence of the activation step, not on the strength
    of a downstream proteasome or oxidative-stress phenotype.
  biological_processes:
  - preferred_term: proteasome assembly
    modifier: DECREASED
    term:
      id: GO:0043248
      label: proteasome assembly
  - preferred_term: response to oxidative stress
    modifier: ABNORMAL
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:41468431
    reference_title: "NFE2L1/Nrf1 forms a coactivator complex post-peptide:N-glycanase-mediated sequence editing and mitigates proteasome dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we demonstrated that sequence editing of the ninth N-glycosylation
      site (Asn574) in human Nrf1 is required for proteasome gene expression in
      HeLa cells.
    explanation: >-
      Pins the requirement to a specific edited residue and a specific
      transcriptional output.
  - reference: PMID:41468431
    reference_title: "NFE2L1/Nrf1 forms a coactivator complex post-peptide:N-glycanase-mediated sequence editing and mitigates proteasome dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Editing of Asn574 is essential for interaction with host cell factor C1
      and O-GlcNAc transferase, which is required for Nrf1 chromatin binding and
      sufficient proteasome expression.
    explanation: >-
      Gives the molecular route from the edit to the transcriptional output.
  - reference: PMID:41917400
    reference_title: "Cytosolic Peptide: N-Glycanase (NGLY1)-from Basic Biology to Genetic Disorder, NGLY1 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NGLY1 is also responsible for the activation of a transcription factor,
      NFE2L1, which participates in several stress responses, including
      regulation of proteasome subunit expression and oxidative stress.
    explanation: >-
      Independent review statement of the activation function and its two
      stress-response outputs.
  downstream:
  - target: Neurodevelopmental and Multisystem Dysfunction
    description: >-
      A candidate route from the sequence-editing defect to the clinical
      phenotype. It is a hypothesis: no reported work connects failed Nrf1
      activation to any specific feature of human disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Neurodevelopmental and Multisystem Dysfunction
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The shared clinical shape of the congenital disorders of deglycosylation: a
    multisystem neurodevelopmental disorder with global developmental delay and
    intellectual disability, dysmorphic features, and structural brain
    anomalies. Conforming disorder entries substitute their own specific
    features - a hyperkinetic movement disorder, alacrima, transaminase
    elevation and peripheral neuropathy in the peptide:N-glycanase arm;
    polymicrogyria, tongue hamartoma and posterior-fossa hypoplasia in the
    alpha-mannosidase arm - which are not shared and should not be inherited
    from this node.
  evidence:
  - reference: PMID:24651605
    reference_title: "Mutations in NGLY1 cause an inherited disorder of the endoplasmic reticulum-associated degradation pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGLY1 deficiency is a novel autosomal recessive disorder of the
      endoplasmic reticulum-associated degradation pathway associated with
      neurological dysfunction, abnormal tear production, and liver disease.
    explanation: >-
      The multisystem shape of the peptide:N-glycanase arm.
  - reference: PMID:35045343
    reference_title: "Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      variable degrees of intellectual disability
    explanation: >-
      The shared neurodevelopmental component in the alpha-mannosidase arm.
discussions:
- discussion_id: gap_cddg_free_oligosaccharide_toxicity
  prompt: >-
    Is the dysregulated cytosolic free-oligosaccharide pool itself pathogenic,
    or is it a marker of the disposal route that is actually failing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cytosolic Glycan Catabolite Dysregulation
  - pathophysiology#Neurodevelopmental and Multisystem Dysfunction
  rationale: >-
    The module's central effector is the one lesion both CDDG genes share, and
    it is measurable in patient cells, which is why it is the conformance
    target. It is not thereby shown to be toxic. No dose-response between
    free-oligosaccharide burden and clinical severity has been reported in
    either disorder, the measurements are made in fibroblasts and
    haploid-cell-line models rather than in the neural tissue where the
    phenotype falls, and the edge from this node to the clinical consequence is
    typed INDIRECT_UNKNOWN_INTERMEDIATES in both conformers for that reason.
    The alternative reading - that the pool is an accessible readout of a
    failing route whose real damage lies elsewhere, for instance in
    undeglycosylated ERAD substrates or in unactivated Nrf1 - is equally
    consistent with everything published.
  proposed_experiments:
  - experiment_id: exp_cddg_fos_burden_versus_severity
    name: Free-oligosaccharide burden against clinical severity across both CDDG genes
    description: >-
      Quantify cytosolic free-oligosaccharide species in patient-derived cells
      across the NGLY1 and MAN2C1 allelic spectra and test whether burden
      predicts severity within each gene. A within-gene dose-response would
      support toxicity; a flat relationship in the presence of graded clinical
      severity would argue the pool is a marker.
  - experiment_id: exp_cddg_pool_manipulation_without_enzyme_restoration
    name: Manipulate the pool without restoring the enzyme
    description: >-
      In NGLY1- and MAN2C1-deficient neural models, lower the
      free-oligosaccharide burden by an independent route - for example by
      limiting flux into the pool - while leaving the deficient enzyme absent,
      and ask whether cellular phenotypes improve. Improvement would establish
      the pool as pathogenic in its own right rather than as a readout.
- discussion_id: gap_cddg_engase_inhibition_therapeutic
  prompt: >-
    Would inhibiting ENGASE benefit human NGLY1 deficiency, as deleting it
    benefits Ngly1-null mice?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cytosolic Deglycosylation of Retrotranslocated Glycoproteins
  rationale: >-
    Deleting Engase partially rescues the embryonic lethality of Ngly1-null
    mice on a C57BL/6 background and strongly suppresses the phenotype of
    viable mixed-background animals, which is the strongest genetic evidence
    anywhere in this module about what the damaging event actually is. The
    translational gap is real in both directions. Human NGLY1 deficiency is not
    embryonically lethal, so the phenotype being rescued in mouse is not the
    phenotype a patient has; genetic background alone partially rescues the
    mouse lethality, which means the rescue is measured against a
    strain-specific severity that has no human analogue; and germline deletion
    from conception is not the same intervention as pharmacological inhibition
    started after diagnosis. No ENGASE inhibitor has been tested in a patient.
  proposed_experiments:
  - experiment_id: exp_engase_inhibition_postnatal_rodent
    name: Postnatal ENGASE inhibition in a viable Ngly1-deficient rodent
    description: >-
      Test pharmacological or conditional ENGASE suppression started after
      birth in a viable Ngly1-deficient rat or mixed-background mouse, scoring
      the motor, neuropathological, and survival endpoints that the untreated
      animals are known to develop. Rescue of a postnatal, progressive
      phenotype would be far more translatable than rescue of embryonic
      lethality.
  - experiment_id: exp_engase_substrate_signature_human_cells
    name: ENGASE-dependent substrate signature in patient cells
    description: >-
      Determine whether NGLY1-deficient human cells accumulate the
      single-GlcNAc-bearing proteins that ENGASE activity predicts, and whether
      lowering ENGASE reduces them. Absence of the signature in human cells
      would indicate the mouse rescue does not transfer.

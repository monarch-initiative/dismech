name: Dopamine D2 Receptor Antagonism Module
description: 'The conserved pharmacological cascade a D2/D3 receptor antagonist produces, organised
  around the fact that distinguishes this drug class from the other receptor-blockade modules: the
  therapeutic and the adverse arms are separated by how much of the same receptor is occupied, not
  by which receptor is hit. An antipsychotic occupies striatal D2/3 (trigger), which removes
  D2-mediated Gi/Go inhibition of adenylyl cyclase (central effector, the key conformance target),
  and above an occupancy threshold that produces antipsychotic response; higher occupancy than that
  makes extrapyramidal effects more likely without further benefit, which is the therapeutic window.
  Two further arms do not sit on the striatal threshold at all - suppression of emesis through D2
  receptors in the vomiting circuit, and loss of lactotroph D2 restraint of prolactin in the
  anterior pituitary, which lies outside the blood-brain barrier and so is reached at drug
  concentrations the striatal figure does not predict. Carries the drug-target pattern for typical
  and atypical antipsychotics and for the D2-antagonist antiemetics. Complementary to
  parkinsonism_dopaminergic_degeneration, which models the loss of dopaminergic neurons rather than
  the blockade of their receptors, and to addiction_cycle, which uses the same circuitry for a
  different purpose. Key conformance target: d2_receptor_antagonism#Loss of D2-Mediated Gi/Go
  Inhibition of Adenylyl Cyclase. Note that an entry whose node represents the drug''s receptor
  occupancy rather than the mechanism itself anchors at the trigger instead, which is what the four
  conformers wired alongside this module do; the two are different claims, not a disagreement.'
category: Module
module_categories:
- PHARMACOLOGY
- NEUROSCIENCE
creation_date: '2026-10-23T00:00:00Z'
notes: 'This is a mechanism module, not a specific disease. Do NOT create a "D2 Receptor Antagonism"
  Disease entry. Disorder entries reference individual nodes via conforms_to, for example
  "d2_receptor_antagonism#D2/3 Receptor Antagonist Occupancy".


  The drug acts downstream of the lesion, and that is worth stating because it is unusual among
  these modules. The cited imaging review places striatal D2/3 blockade "downstream of the likely
  principal dopaminergic pathophysiology in schizophrenia", which is presynaptic. So a conforming
  psychosis entry keeps its own dopamine-dysregulation node as the disease mechanism and conforms
  here for the drug''s site of action; the two are not the same claim, and the module does not
  assert that D2 blockade corrects the presynaptic abnormality.


  Three things the module declines to model. First, a mesolimbic-versus-nigrostriatal split between
  the therapeutic and motor arms: it is the standard account, but no sentence in the cited sources
  supports it, which is why both arms hang off striatal occupancy and are separated by degree
  rather than by territory. A curator who finds a citable source should add the territories. Second,
  tardive dyskinesia, which is a distinct late syndrome whose mechanism the literature does not
  settle - the one review read for this module calls the dopamine-hypersensitivity account no
  longer viable - so it would be a new module rather than another arm here. Third, the non-D2
  pharmacology every atypical antipsychotic also carries (5-HT2A, H1, muscarinic, alpha-1): a
  conforming entry should conform here for the D2 half and describe the rest separately, as the
  AT1 module asks of sparsentan.


  The antiemetic arm is the one with the thinnest evidence. The source establishes that D2
  receptors are implicated in the vomiting act; the step from that to an antagonist suppressing
  emesis is an inference, and the node''s evidence is graded accordingly. The obvious conformer is
  Chemotherapy_Induced_Nausea_and_Vomiting, but it carries no D2-antagonist treatment today, so
  wiring it would mean adding a treatment rather than wiring an existing one.'
pathophysiology:
- name: D2/3 Receptor Antagonist Occupancy
  description: 'An antipsychotic or a D2-antagonist antiemetic occupies striatal D2 and D3 receptors.
    This is the one action every licensed drug in the class shares, and it is where conformance
    belongs: the agents differ widely in everything else they bind, and in how much of the receptor
    they occupy at a clinical dose.'
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: dopamine neurotransmitter receptor activity, coupled via Gi/Go
    term:
      id: GO:0001591
      label: dopamine neurotransmitter receptor activity, coupled via Gi/Go
    modifier: DECREASED
  genes:
  - &id001
    preferred_term: DRD2
    term:
      id: hgnc:3023
      label: DRD2
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  evidence:
  - reference: PMID:19689327
    reference_title: 'Mechanisms underlying psychosis and antipsychotic treatment response in
      schizophrenia: insights from PET and SPECT imaging.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: These studies show that all currently licensed antipsychotic drugs block striatal D2/3
      receptors in vivo- a site downstream of the likely principal dopaminergic pathophysiology in
      schizophrenia
    explanation: Sources both halves of this node - that the whole class shares this receptor
      action, and that the action sits downstream of the presynaptic abnormality a conforming
      psychosis entry models separately.
  downstream:
  - target: Loss of D2-Mediated Gi/Go Inhibition of Adenylyl Cyclase
    description: Occupancy removes the signal the receptor would otherwise transduce.
  - target: Loss of Lactotroph D2 Restraint of Prolactin Secretion
    description: The same drug reaches D2 receptors on anterior pituitary lactotrophs. Attached here
      rather than below the striatal arms because the pituitary sits outside the blood-brain barrier
      and is reached at concentrations the striatal occupancy figure does not predict.
- name: Loss of D2-Mediated Gi/Go Inhibition of Adenylyl Cyclase
  description: 'The disorder-agnostic, rate-limiting step, and the key conformance target. D2 is a
    Gi/Go-coupled receptor whose activation lowers cyclase activity; with the receptor occupied that
    restraint is withdrawn. Every striatal arm below follows from this one step, which is why a
    conforming entry carrying any antipsychotic should anchor at or above here even when its own
    prose names only one effect.'
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: adenylate cyclase-inhibiting dopamine receptor signaling pathway
    term:
      id: GO:0007195
      label: adenylate cyclase-inhibiting dopamine receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:19689327
    reference_title: 'Mechanisms underlying psychosis and antipsychotic treatment response in
      schizophrenia: insights from PET and SPECT imaging.'
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: D2/3 occupancy above a threshold is required for antipsychotic treatment response
    explanation: The quoted sentence establishes that the clinical effect tracks receptor occupancy,
      from which this node's transduction step follows. Graded INDIRECT because the source measures
      occupancy and response rather than the cyclase step between them; the Gi/Go coupling itself is
      asserted here on the GO term's own definition, not on this source.
  downstream:
  - target: Antipsychotic Response Above an Occupancy Threshold
    description: Withdrawal of D2 signalling at the therapeutic end of the window.
  - target: Extrapyramidal Motor Effects at Higher Occupancy
    description: The same withdrawal, further along the occupancy range.
  - target: Suppression of Emesis
    description: D2 receptors in the vomiting circuit are blocked by the same drug.
- name: Antipsychotic Response Above an Occupancy Threshold
  description: 'The therapeutic consequence, and the reason the module is organised by degree of
    occupancy: response requires occupancy above a threshold, and the source is explicit that
    blockade is necessary without being sufficient. The node therefore claims a dose-dependent
    antipsychotic effect, not that D2 blockade explains recovery.'
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:19689327
    reference_title: 'Mechanisms underlying psychosis and antipsychotic treatment response in
      schizophrenia: insights from PET and SPECT imaging.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Adequate D2/3 blockade by antipsychotic drugs is necessary but not always sufficient
      for antipsychotic response.
    explanation: Sources this node's claim and its limit in one sentence. Quoted deliberately in
      preference to the bare threshold statement, because it is the half a reader is likely to
      forget.
- name: Extrapyramidal Motor Effects at Higher Occupancy
  description: 'The dose-limiting adverse arm, and the upper edge of the therapeutic window. It is
    the same receptor action as the therapeutic arm, occurring at higher occupancy, which is why the
    module separates the two by degree rather than placing them on different receptors or different
    territories. The source''s point is comparative: above the window, side effects become more
    likely without further clinical gain.'
  role: adverse_effect
  biological_scale: ORGANISM
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  evidence:
  - reference: PMID:19689327
    reference_title: 'Mechanisms underlying psychosis and antipsychotic treatment response in
      schizophrenia: insights from PET and SPECT imaging.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: However, adverse events, such as extra-pyramidal side-effects or hyperprolactinemia,
      become much more likely at higher occupancy levels, which indicates there is an optimal
      'therapeutic window' for D2/3 occupancy, and questions the use of high doses of antipsychotic
      treatment in clinical practice and trials.
    explanation: Sources the occupancy dependence of this arm and the therapeutic window the module
      is built around. The same sentence names hyperprolactinaemia, which the prolactin node below
      qualifies with its own source.
- name: Loss of Lactotroph D2 Restraint of Prolactin Secretion
  description: 'Prolactin release from anterior pituitary lactotrophs is held down by dopamine
    acting at D2, so blockade raises it. The arm hangs off receptor occupancy rather than below the
    striatal steps for a reason the cited study makes precisely: the anterior pituitary is outside
    the blood-brain barrier, and for the antipsychotics that P-glycoprotein pumps out of the brain
    the drug concentration there is higher than in brain, so prolactin rises more than the striatal
    occupancy figure would predict. That is also why the module does not treat prolactin as simply
    another point on the occupancy curve.'
  role: adverse_effect
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: prolactin secretion
    term:
      id: GO:0070459
      label: prolactin secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: mammotroph
    term:
      id: CL:0002311
      label: mammotroph
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  genes:
  - *id001
  evidence:
  - reference: PMID:31106995
    reference_title: Prolactin Elevations and Permeability Glycoprotein.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Risperidone, paliperidone, and amisulpride are associated with higher prolactin levels
      than would be anticipated from striatal dopamine receptor occupancy studies.
    explanation: Sources the claim that this arm is not predicted by striatal occupancy, which is
      why it is modelled separately rather than as another threshold on the same curve.
  - reference: PMID:31106995
    reference_title: Prolactin Elevations and Permeability Glycoprotein.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: P-gp has high affinity to all these antipsychotics and selectively removes them from
      the brain and concentrates them in the blood draining the hypothalamus, allowing greater
      dopamine receptor blockade in the cells in the anterior pituitary that produce prolactin.
    explanation: Sources the mechanism behind the dissociation - the pituitary's position outside
      the barrier plus efflux from brain - and the cell type this node binds.
- name: Suppression of Emesis
  description: 'The second therapeutic indication of the class, and the reason a D2 antagonist
    appears in entries that have nothing to do with psychosis. The evidence here is the module''s
    weakest: the cited review establishes that D2 receptors participate in the vomiting act, and the
    step from that to an antagonist suppressing emesis is an inference this node makes explicit
    rather than hiding. No node is bound to a vomiting-centre anatomical site, because the source
    quoted here names the receptor among several without localising the D2 component.'
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:37584820
    reference_title: 'A re-consideration of neural/receptor mechanisms in chemotherapy-induced
      nausea and vomiting: current scenario and future perspective.'
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Likewise, Dopamine type 2 (D2) receptors, dopamine neurotransmitter, Muscarinic
      receptors (M3), GLP1 receptors, and histaminergic receptors (H1) are also implicated in the
      vomiting act as well.
    explanation: Establishes that D2 receptors participate in emesis, which is what blockade acts
      on. Graded INDIRECT because the source describes the receptor's role in vomiting rather than
      an antagonist's effect on it.

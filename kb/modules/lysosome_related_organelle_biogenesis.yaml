    term:
      id: GO:0060155
      label: platelet dense granule organization
    modifier: ABNORMAL
  - preferred_term: regulated exocytosis
    term:
      id: GO:0045055
      label: regulated exocytosis
    modifier: DECREASED
  cellular_components:
  - preferred_term: platelet dense granule
    term:
      id: GO:0042827
      label: platelet dense granule
  evidence:
  - reference: PMID:38774881
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations to the LYST gene result in Chédiak-Higashi syndrome, an autosomal recessive immunodeficiency characterized by defective granule exocytosis, cytotoxicity
    explanation: >-
      Documents the cytotoxic-granule arm reached through the LYST route.
  - reference: PMID:33841163
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hermansky-Pudlak Syndrome (HPS) is a rare, genetic, multisystem disorder characterized by oculocutaneous albinism (OCA), bleeding diathesis, immunodeficiency, granulomatous colitis, and pulmonary fibrosis.
    explanation: >-
      Documents the breadth of the parallel arm in one disorder - bleeding,
      immunodeficiency and pulmonary fibrosis alongside the pigmentary defect.
  downstream:
  - target: Hypopigmentation with Syndrome-Specific Extracutaneous Disease
    description: >-
      Non-melanosomal organelle failure supplies the extracutaneous half of the
      syndrome.

- name: Hypopigmentation with Syndrome-Specific Extracutaneous Disease
  description: >-
    The organ-level endpoint, and the reason these disorders present as
    syndromes rather than as isolated pigmentary anomalies: hypopigmentation of
    skin, hair and eye combined with an extracutaneous complication whose
    identity depends on which other LROs were lost. The pigmentary sign is the
    diagnostic clue; the extracutaneous arm carries the morbidity and mortality,
    so recognizing the hypopigmentation is what triggers the surveillance that
    matters.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: pigmentation
    term:
      id: GO:0043473
      label: pigmentation
    modifier: DECREASED
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:33536261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hermansky-Pudlak syndrome (HPS), a rare autosomal recessive disorder characterised by abnormal biogenesis of lysosome-related organelles, manifests with oculocutaneous albinism and excessive bleeding of variable severity.
    explanation: >-
      Documents the paired pigmentary-plus-extracutaneous endpoint and names the
      LRO biogenesis defect as its cause.
  - reference: PMID:8896560
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chediak-Higashi syndrome (CHS) is a rare, autosomal recessive disorder characterized by hypopigmentation, severe immunologic deficiency with neutropenia and lack of natural killer (NK) cells, a bleeding tendency and neurologic abnormalities. Most patients die in childhood.
    explanation: >-
      Documents the same paired endpoint through a different component, and
      establishes that the extracutaneous arm rather than the pigmentary one
      carries the mortality.

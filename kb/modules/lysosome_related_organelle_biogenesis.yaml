name: Lysosome-Related Organelle Biogenesis and Transport Module
description: >-
  A conserved organelle-trafficking module for the pigmentary-plus-systemic
  genodermatoses. Melanosomes, platelet dense granules, cytotoxic lymphocyte
  granules and alveolar type II lamellar bodies are all lysosome-related
  organelles (LROs) - functionally unrelated secretory compartments built by one
  shared machinery. Loss of any component of that machinery interrupts the
  melanosome life cycle at whichever step the component serves: cargo delivery
  during biogenesis, control of organelle size and fission, or capture and
  positioning at the melanocyte periphery. All three routes converge on a single
  rate-limiting failure - functional melanosomes are not delivered to
  keratinocytes - so pigment is made but never dispersed, and the skin is
  hypopigmented while the melanocyte is not. Because the same machinery serves
  the other LROs, a parallel arm produces the syndrome-defining extracutaneous
  disease: bleeding from absent platelet dense granules, haemophagocytic
  lymphohistiocytosis from failed cytotoxic granule exocytosis, pulmonary
  fibrosis from lamellar body dysfunction. Which extracutaneous organs are hit
  depends on which LROs the lost component serves, which is why one mechanism
  produces several clinically distinct syndromes.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a shared mechanism module, not a disease.

  Disorder-specific substitutions at the trigger node, grouped by which step of
  the melanosome life cycle the lost component serves:

  1. Cargo delivery during biogenesis - the BLOC-1, BLOC-2 and BLOC-3 complexes
     and adaptor protein complex AP-3 (Hermansky-Pudlak syndrome, HPS1-HPS11).
     Melanogenic enzymes and structural cargo are not routed into the maturing
     melanosome, so the organelle forms but is not properly loaded.
  2. Organelle size and fission control - LYST (Chediak-Higashi syndrome). The
     giant inclusion bodies that are the diagnostic hallmark are LROs that have
     failed to be resolved into normal-sized organelles, and cargo is
     mis-sorted into them.
  3. Peripheral capture and positioning - the RAB27A-melanophilin-myosin Va
     tripartite complex (Griscelli syndrome types 2, 3 and 1 respectively).
     The melanosome is built and pigmented normally but is never tethered at
     the dendrite tip for transfer.

  Curate the specific step; do not describe all three as "defective melanosome
  biogenesis", which is true only of the first.

  **Critical negative boundary: oculocutaneous albinism does NOT conform.** In
  OCA the lesion is in melanin *synthesis* (TYR, TYRP1, OCA2, SLC45A2) - the
  melanosome and its trafficking machinery are intact and the organelle is
  simply empty. Here the opposite holds: pigment is synthesized and retained, so
  affected melanocytes are *more* densely pigmented than normal while the skin
  is less so. That inversion, visible on skin histology as melanin-distended
  melanocytes beside melanin-free keratinocytes, is the single most useful
  discriminator and the reason this module and the albinism mechanism must not
  be merged. A disorder whose hypopigmentation comes from absent melanin
  synthesis does not conform no matter how similar the clinical picture.

  Distinct from `lysosomal_substrate_accumulation`. That module models the
  conventional lysosome failing to degrade what it receives; this one models
  specialized lysosome-*related* organelles failing to be built, sized, or
  positioned. A conforming entry here has no storage material and no hydrolase
  deficiency.

  Not an Xogenesis module: the terminal output is the failure of a normal
  delivery process, not the formation of a pathological anatomical entity. The
  Chediak-Higashi giant granule is the one arguable exception - it is a new,
  pathological structure - but it is an intermediate in this chain rather than
  its endpoint, and it is a malformed normal organelle rather than a derived
  new formation, so no anchor stanza is asserted.

  Conformance requires evidencing a trafficking or biogenesis lesion in the LRO
  machinery. Hypopigmentation alone, or expression of an LRO gene in melanocytes,
  is not sufficient.

  **Attachment points differ, and the difference is informative.** Only the
  Griscelli route conforms at the central effector, because only there is the
  melanosome fully built and pigmented and simply never delivered. In
  Hermansky-Pudlak syndrome the melanosome *is* transferred - it is merely
  under-loaded, so melanin production itself is reduced - and the entry
  therefore conforms at the trigger, the melanosome arm and the other-LRO arm
  but NOT at the delivery node. Chediak-Higashi sits between the two: its giant
  melanosomes are abnormally distributed and transfer poorly, and its entry
  attaches at the melanosome arm. Do not "tidy" these into uniform conformance
  at the central effector; the disagreement is a real statement about where each
  disorder's pigmentary failure lies, and flattening it would assert something
  the evidence does not support.
pathophysiology:
- name: Loss of a Lysosome-Related Organelle Biogenesis or Trafficking Component
  description: >-
    A component of the machinery that builds, sizes, or positions
    lysosome-related organelles is lost. The machinery is shared across
    organelles that have nothing functionally in common, so which organelles
    fail depends on which component is lost - some components serve every LRO,
    others only one.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: vesicle-mediated transport
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: ABNORMAL
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:18544035
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The biogenesis of LROs employs a common machinery, and genetic defects in this machinery can affect all LROs or only an individual LRO, resulting in a variety of clinical features.
    explanation: >-
      States the module's organizing claim exactly: one shared machinery, and the
      clinical variety follows from which LROs a given defect reaches.
  - reference: PMID:35129281
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Compelling evidences have shown that HPS protein-associated complexes (HPACs) function in cargo transport, cargo recycling, and cargo removal to maintain LRO homeostasis.
    explanation: >-
      Documents the cargo-delivery arm of the machinery, the step lost in the
      Hermansky-Pudlak route into this module.
  downstream:
  - target: Interrupted Melanosome Maturation or Peripheral Positioning
    description: >-
      The melanosome arm: the melanosome life cycle is interrupted at whichever
      step the lost component serves.
  - target: Failure of Other Lysosome-Related Organelles Sharing the Machinery
    description: >-
      The parallel arm: organelles other than the melanosome that depend on the
      same component fail alongside it.

- name: Interrupted Melanosome Maturation or Peripheral Positioning
  description: >-
    The melanosome fails at one of three steps. Its melanogenic and structural
    cargo is not routed in, so the organelle is built but not loaded; or its
    size and fission are uncontrolled, so it enlarges into a giant granule with
    mis-sorted contents; or it matures normally but is never captured at the
    dendrite tip, because the RAB27A-melanophilin-myosin Va complex that
    tethers it to peripheral actin is broken. The three are not
    interchangeable, and a conforming entry should name which one it has.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: melanosome organization
    term:
      id: GO:0032438
      label: melanosome organization
    modifier: ABNORMAL
  - preferred_term: melanosome transport
    term:
      id: GO:0032402
      label: melanosome transport
    modifier: DECREASED
  cellular_components:
  - preferred_term: melanosome
    term:
      id: GO:0042470
      label: melanosome
  evidence:
  - reference: PMID:8896560
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CHS hallmark is the occurrence of giant inclusion bodies and organelles in a variety of cell types, and protein sorting defects into these organelles.
    explanation: >-
      Documents the size-and-sorting route: LROs that fail to be resolved into
      normal-sized organelles, with cargo mis-sorted into them.
  - reference: PMID:14756517
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once synthesized in the cell body of the epidermal melanocyte, pigmented melanosomes are translocated down the dendrites and captured at the dendritic tips via various cytoskeletal elements. Molecules recently identified that participate in this process consist of Rab27a, myosin-Va and melanophilin.
    explanation: >-
      Documents the peripheral-capture route and names the tripartite complex
      whose loss defines the Griscelli entry into this module.
  downstream:
  - target: Failed Delivery of Functional Melanosomes to Keratinocytes
    description: >-
      A melanosome that is unloaded, malformed, or unpositioned cannot be
      transferred to the keratinocyte.

- name: Failed Delivery of Functional Melanosomes to Keratinocytes
  description: >-
    Functional, pigment-bearing melanosomes are not transferred from the
    melanocyte to surrounding keratinocytes. This is the rate-limiting,
    disorder-agnostic node of the module: all three upstream routes converge
    here, and conformance should be declared against it. Because skin and hair
    are almost entirely keratinocyte, visible pigmentation depends on this
    transfer and not on melanin synthesis alone - which is why the disorders in
    this module are hypopigmented despite making normal or excess pigment.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: melanosome transport
    term:
      id: GO:0032402
      label: melanosome transport
    modifier: DECREASED
  - preferred_term: pigmentation
    term:
      id: GO:0043473
      label: pigmentation
    modifier: DECREASED
  evidence:
  - reference: PMID:24662021
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This latter process is absolutely required for visible pigmentation and effective photo-protection because it serves to disperse the pigment in skin and hair.
    explanation: >-
      Establishes that transfer to keratinocytes, not melanin synthesis, is what
      makes pigmentation visible - the reason this node is the module's
      rate-limiting step.
  - reference: PMID:17483661
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The melanocytes were large and distended with a large volume of melanin (Figure 2). The adjacent keratinocytes were completely devoid of melanin.
    explanation: >-
      Demonstrates this node in patient skin, and demonstrates the inversion that
      separates the module from albinism: pigment is made and retained rather
      than absent.
  downstream:
  - target: Hypopigmentation with Syndrome-Specific Extracutaneous Disease
    description: >-
      Skin and hair receiving no melanosomes are hypopigmented and
      photounprotected.

- name: Failure of Other Lysosome-Related Organelles Sharing the Machinery
  description: >-
    Organelles unrelated to pigmentation but built by the same machinery fail in
    parallel with the melanosome. Platelet dense granules are absent or reduced,
    giving a bleeding diathesis; cytotoxic granules of T and NK cells cannot be
    formed or released, giving impaired cytotoxicity and a predisposition to
    haemophagocytic lymphohistiocytosis; alveolar type II lamellar bodies
    malfunction, giving pulmonary fibrosis. Which of these occurs is set by
    which organelles the lost component serves, and it is this arm - not the
    pigmentary one - that determines prognosis.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: cytotoxic T cell
    term:
      id: CL:0000910
      label: cytotoxic T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell

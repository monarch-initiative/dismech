name: IL-11 ERK-AMPK-mTORC1 Ageing Module
description: >-
  A conserved pro-inflammatory-cytokine driver of mammalian ageing. With age,
  the IL-6-family cytokine IL-11 is progressively upregulated across cell types
  and tissues (an alarmin-type response) and signals through IL11RA1-gp130 to
  drive a coupled ERK-p90RSK / LKB1-AMPK-inactivation / mTORC1 signalling module.
  Sustained activation of this ERK-AMPK-mTORC1 axis promotes cellular senescence
  and a mTORC1/ERK-dependent senescence-associated secretory phenotype (SASP),
  metabolic decline (loss of AMPK-dependent metabolic flexibility, age-repressed
  white-adipose-tissue beiging, hepatic lipid accumulation, sarcopenia) and
  tissue fibrosis - together driving organismal frailty, multimorbidity,
  age-related cancer and shortened lifespan. Genetic (Il11 or Il11ra1 deletion)
  or pharmacological (anti-IL-11 neutralizing antibody) inhibition reverses these
  pathologies and extends healthspan and lifespan in mice. This module isolates
  the IL-11-specific druggable arm of inflammaging: it is a specific driver that
  feeds the source-agnostic inflammaging chain (see inflammaging) and the
  senescence programme (see cellular_senescence), which it does not re-derive.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disease-specific IL-11-expressing cell
  type and target tissue while preserving the conserved
  IL-11-upregulation -> receptor-signalling -> ERK-AMPK-mTORC1-axis ->
  senescence/metabolic-decline -> frailty/lifespan chain.
category: Module
creation_date: "2026-08-16T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "il11_erk_ampk_mtor_aging#ERK-AMPK-mTORC1 Axis Dysregulation"). Conforming
  nodes in disorder files should include the corresponding biological processes
  and causal edges, specialized to their disease context (substituting the
  IL-11-expressing parenchymal cell type - hepatocyte, adipocyte, myocyte,
  fibroblast - and target tissue). The key conformance target is the
  central_effector "ERK-AMPK-mTORC1 Axis Dysregulation": the disorder-agnostic,
  rate-limiting integrating node that couples ERK-p90RSK activation, LKB1-AMPK
  inactivation and mTORC1-p70S6K-S6RP activation. Conformance-attachment
  guidance: attach a disorder node at the amplifier "IL-11 Receptor Signalling
  Activation" when only the IL-11 -> ERK arm is evidenced in that tissue (the
  case for every current fibrosis conformer - IPF, liver cirrhosis, chronic
  kidney disease, dilated cardiomyopathy); reserve conformance to the
  central_effector "ERK-AMPK-mTORC1 Axis Dysregulation" for entries that actually
  evidence the coupled LKB1-AMPK-inactivation / mTORC1 metabolic arm, so a
  fibrosis conformer does not silently assert the full metabolic axis. Anti-IL-11
  (X203) neutralizes the ligand upstream and therefore INHIBITS the "IL-11
  Receptor Signalling Activation" amplifier node. Scope: this module deliberately does NOT re-derive
  the SASP (see cellular_senescence) or the source-agnostic systemic-inflammation
  convergence point (see inflammaging); it is the IL-11-specific, druggable
  driver upstream of both. It complements the hallmark-of-ageing modules rather
  than duplicating them. The relative contributions of canonical (JAK-STAT3)
  versus non-canonical (MEK-ERK) IL-11 signalling to ageing phenotypes are an
  open question, recorded as a KNOWLEDGE_GAP discussion below. All evidence is
  drawn from the landmark open-access study Widjaja et al., Nature 2024
  (PMID:39020175), which provides both mouse genetic/therapeutic
  (MODEL_ORGANISM) and human-cell (IN_VITRO) support across the chain.
pathophysiology:
- name: Age-Associated IL-11 Upregulation
  description: >-
    With ageing, the IL-6-family pro-inflammatory cytokine IL-11 is progressively
    upregulated across diverse cell types and tissues (liver, visceral white
    adipose tissue and skeletal muscle) - an alarmin-type response to
    accumulating age-related pathogenic factors. This rising IL-11 tone is the
    initiating step of the module. Conforming disorder nodes substitute the
    disease-specific IL-11-expressing parenchymal cell type and tissue.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Cytokine Production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: Adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: Skeletal myocyte
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      which revealed progressive up-regulation of IL-11 in all tissues
    explanation: >-
      Documents the age-dependent, multi-tissue up-regulation of IL-11 modeled
      by this trigger node, in an ageing time course of mouse liver, adipose and
      skeletal muscle. Evidence source is MODEL_ORGANISM (aged mice).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In two-year-old Il11-EGFP mice, IL-11 was apparent in parenchymal cells
      (hepatocytes in liver, adipocytes in vWAT and myocytes in skeletal muscle)
      and also seen in stromal, epithelial and endothelial cells across tissues
      and in nerves in skeletal muscle
    explanation: >-
      Identifies the IL-11-expressing cell types annotated on this node
      (hepatocyte, adipocyte, skeletal myocyte, plus stromal/fibroblast). Evidence
      source is MODEL_ORGANISM (aged Il11-EGFP reporter mice).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IL-11 is progressively upregulated across tissues with age, probably as an
      alarmin-type response to age-related pathogenic factors that include
      cytokines, proteotoxic stress, oxidative species and DNA damage, among
      others
    explanation: >-
      States the alarmin-type framing of age-associated IL-11 up-regulation used
      in this node's description. Evidence source is OTHER (authors' discussion /
      interpretive framing).
  downstream:
  - target: IL-11 Receptor Signalling Activation
- name: IL-11 Receptor Signalling Activation
  description: >-
    Upregulated IL-11 engages its receptor (IL11RA1 with the shared gp130
    signal-transducing subunit) to activate two arms: canonical JAK-STAT3 and
    non-canonical MEK-ERK-p90RSK signalling. Receptor engagement is the amplifier
    that converts rising IL-11 abundance into the downstream kinase-axis
    dysregulation, and is the node neutralized by anti-IL-11 (X203) or
    anti-IL11RA (X209) antibodies.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Interleukin-11-mediated signaling pathway
    term:
      id: GO:0038154
      label: interleukin-11-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Signalling pathway by which IL-11 induces canonical STAT3 activation and
      non-canonical ERK activation, LKB1–AMPK inactivation and mTOR activation.
    explanation: >-
      Defines the receptor-proximal bifurcation modeled here: IL-11 drives
      canonical STAT3 and non-canonical ERK, feeding LKB1-AMPK inactivation and
      mTOR activation. Evidence source is OTHER (signalling-pathway schematic
      synthesizing the study's and prior data).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This premise was founded on studies showing that IL-11 can activate
      ERK–mTORC1 and/or JAK–STAT3
    explanation: >-
      Records the established IL-11 receptor-signalling outputs (ERK-mTORC1 and
      JAK-STAT3) that this amplifier node represents. Evidence source is OTHER
      (authors' summary of prior mechanistic work).
  downstream:
  - target: ERK-AMPK-mTORC1 Axis Dysregulation
- name: ERK-AMPK-mTORC1 Axis Dysregulation
  description: >-
    The integrating, rate-limiting node of the module. IL-11 receptor signalling
    drives coupled activation of ERK-p90RSK, p90RSK/ERK-mediated inactivation of
    the LKB1-AMPK energy sensor (increased inhibitory p-LKB1, reduced active
    p-AMPK), and consequent de-repression and activation of mTORC1
    (increased p-mTOR, p-p70S6K and p-S6RP). Because ERK, AMPK and mTORC1 are the
    conserved lifespan-regulating pathways, this single coupled axis is where
    disorder-specific IL-11 signalling converges and is the key conformance
    target for conforming disorder entries.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  - preferred_term: TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: INCREASED
  molecular_functions:
  - preferred_term: AMP-activated protein kinase activity
    term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      With age, there was progressive activation of ERK–p90RSK, inactivation of
      LKB1–AMPK and mTOR–p70S6K activation, which comprise an IL-11 signalling
      module, in liver and muscle
    explanation: >-
      Directly names the three coupled arms of this central node - ERK-p90RSK
      up, LKB1-AMPK down, mTOR-p70S6K up - and calls them the IL-11 signalling
      module. Evidence source is MODEL_ORGANISM (ageing mouse liver and muscle).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      old wild-type mice exhibited increased phosphorylated (p)-ERK and p-p90RSK,
      increased p-LKB1 leading to reduced p-AMPK, and increased levels of p-mTOR,
      p-p70S6K and p-S6RP
    explanation: >-
      Provides the phospho-signalling detail (increased p-ERK/p-p90RSK, increased
      inhibitory p-LKB1 with reduced p-AMPK, increased p-mTOR/p-p70S6K/p-S6RP)
      annotated as the INCREASED ERK/TORC1 and DECREASED AMPK descriptors here.
      Evidence source is MODEL_ORGANISM (aged wild-type mouse tissues).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stimulation of human fibroblasts or hepatocytes with IL-11 activated
      ERK–mTOR, increased levels of p16 and p21, and reduced expression of PCNA
      and cyclin D1, which was prevented by U0126 or rapamycin
    explanation: >-
      Establishes IL-11 as causally sufficient to activate the ERK-mTOR axis in
      human cells and shows pharmacologic reversibility (MEK inhibitor U0126,
      mTOR inhibitor rapamycin), grounding the axis mechanistically. Evidence
      source is IN_VITRO (primary human fibroblasts and hepatocytes).
  downstream:
  - target: Cellular Senescence and Metabolic Decline
- name: Cellular Senescence and Metabolic Decline
  description: >-
    Sustained ERK-AMPK-mTORC1 dysregulation drives the cellular effectors of the
    module: mTORC1/ERK-dependent cellular senescence with induction of p16 and
    p21 and a senescence-associated secretory phenotype (SASP), together with
    metabolic decline - loss of AMPK-dependent metabolic flexibility, age-repressed
    white-adipose-tissue beiging, hepatic lipid accumulation and sarcopenia - and
    tissue fibrosis. Conforming disorder nodes specialize this to the affected
    organ.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  - preferred_term: Inflammatory response (SASP)
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Levels of the canonical senescence markers p16Inka4 and p21Waf1/Cip1 were
      increased in tissues of old wild-type mice.
    explanation: >-
      Documents induction of the canonical senescence markers p16 and p21 with
      age, the senescence arm of this node. Evidence source is MODEL_ORGANISM
      (aged wild-type mouse tissues).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Supernatants of IL-11-stimulated fibroblasts had increased amounts of
      senescence-associated secretory phenotype factors, and this increase was
      inhibited by U0126 or rapamycin
    explanation: >-
      Shows IL-11 induces a mTORC1/ERK-dependent SASP in human cells (blocked by
      rapamycin or U0126), linking the central axis to the secretory arm of
      senescence. Evidence source is IN_VITRO (human fibroblasts).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we surmise that inhibition of IL-11 prevents mTORC1 activation in fat,
      affording age-repressed WAT beiging that can be particularly prominent in
      mice
    explanation: >-
      Links mTORC1 activation in adipose to suppression of white-adipose-tissue
      beiging, the metabolic-decline arm of this node. Evidence source is OTHER
      (authors' mechanistic interpretation of the beiging data).
  downstream:
  - target: Frailty, Multimorbidity and Reduced Lifespan
- name: Frailty, Multimorbidity and Reduced Lifespan
  description: >-
    The organismal consequence of the module: age-associated IL-11 signalling
    manifests as frailty, sarcopenia, metabolic multimorbidity, increased
    age-related cancer burden and shortened lifespan. Genetic or pharmacological
    inhibition of IL-11 protects against these outcomes and extends both
    healthspan and lifespan. This is the conserved endpoint; the specific
    age-related phenotype is supplied by the conforming disorder.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of Il11 or Il11ra1 protects against metabolic decline,
      multi-morbidity and frailty in old age.
    explanation: >-
      States that genetic loss of IL-11 signalling protects against the
      metabolic decline, multimorbidity and frailty modeled by this outcome node.
      Evidence source is MODEL_ORGANISM (Il11 / Il11ra1 knockout mice).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In lifespan studies, genetic deletion of Il11 extended the lives of mice of
      both sexes, by 24.9% on average.
    explanation: >-
      Quantifies the lifespan-extension endpoint (24.9% mean extension with Il11
      deletion). Evidence source is MODEL_ORGANISM (Il11 knockout lifespan
      cohorts).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Beyond metabolism, inhibition of IL-11 improved deterministic features of
      ageing that are common among vertebrates (such as frailty and sarcopenia),
      showing generic anti-ageing benefits at the organismal level.
    explanation: >-
      Supports the frailty/sarcopenia and generic organismal-ageing content of
      this consequence node. Evidence source is MODEL_ORGANISM (aged mice).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      gross autopsy data revealed fewer macroscopic tumours in mice with Il11
      deletion
    explanation: >-
      Supports the reduced age-related cancer burden component of this outcome
      node. Evidence source is MODEL_ORGANISM (end-of-life mouse autopsy data).
treatments:
- name: Anti-IL-11 Therapy (Neutralizing Antibody)
  description: >-
    Neutralizing anti-IL-11 monoclonal antibody therapy (clone X203 in mouse
    studies; anti-IL11RA clone X209 in vitro) sequesters IL-11 and blocks
    receptor engagement, switching off the downstream ERK-AMPK-mTORC1 axis.
    Administered to 75-week-old mice until death, it improves metabolism and
    muscle function, reduces frailty and ageing biomarkers, and extends median
    lifespan by more than 20% in both sexes. Anti-IL-11 is in early-stage
    clinical trials for fibroinflammatory disease, making this the translational
    drug-target design pattern for conforming disorders. Represents the IL-11
    inhibition drug-target pattern.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-IL-11 monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: IL-11 Receptor Signalling Activation
    treatment_effect: INHIBITS
    description: >-
      Neutralizing anti-IL-11 (X203) sequesters the IL-11 ligand and prevents
      IL11RA1-gp130 receptor engagement, shutting down the non-canonical
      ERK-p90RSK and canonical STAT3 arms and the downstream ERK-AMPK-mTORC1
      axis dysregulation.
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Administration of anti-IL-11 to 75-week-old mice for 25 weeks improves
      metabolism and muscle function, and reduces ageing biomarkers and frailty
      across sexes.
    explanation: >-
      Establishes the healthspan benefit of the neutralizing antibody delivered
      in late life, supporting the drug-target link. Evidence source is
      MODEL_ORGANISM (anti-IL-11 X203 in aged mice).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Treatment with anti-IL-11 from 75 weeks of age until death extends the
      median lifespan of male mice by 22.5% and of female mice by 25%.
    explanation: >-
      Quantifies the lifespan extension achieved by pharmacological IL-11
      inhibition, the central therapeutic claim. Evidence source is
      MODEL_ORGANISM (anti-IL-11 X203 lifespan cohorts).
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our data suggest that anti-IL-11 therapy, which has a reassuring safety
      profile and is currently in early-stage clinical trials for
      fibroinflammatory diseases, is a potentially translatable approach for
      extending human healthspan and lifespan
    explanation: >-
      Records the translational framing (existing clinical trials, safety
      profile) motivating this drug-target pattern. Evidence source is OTHER
      (authors' translational discussion).
discussions:
- discussion_id: knowledge_gap_il11_canonical_versus_noncanonical_ageing
  prompt: >-
    What are the relative contributions of canonical JAK-STAT3 versus
    non-canonical MEK-ERK IL-11 signalling, alone or in combination, to the
    ageing phenotypes reversed by IL-11 inhibition?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#IL-11 Receptor Signalling Activation
  - pathophysiology#ERK-AMPK-mTORC1 Axis Dysregulation
  rationale: >-
    IL-11 receptor engagement bifurcates into canonical STAT3 and non-canonical
    ERK-p90RSK arms, and both feed the ERK-AMPK-mTORC1 axis. Which arm dominates
    for a given ageing phenotype is unresolved, and it matters for drug design: a
    STAT3-dominant phenotype might be addressable with existing JAK-STAT
    inhibitors, whereas an ERK-dominant phenotype argues for ligand/receptor
    neutralization or MEK inhibition. Curators should keep the two arms separated
    on the amplifier node rather than asserting either as the settled effector.
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The relative contributions of canonical (JAK–STAT3) and non-canonical
      (MEK–ERK) IL-11 signalling, alone or in combination, for ageing phenotypes
      remain to be determined.
    explanation: >-
      The authors explicitly frame the canonical-versus-non-canonical
      contribution as an open question, defining this knowledge gap. Evidence
      source is OTHER (authors' discussion).
- discussion_id: human_model_mismatch_il11_lifespan_extension
  prompt: >-
    Does the healthspan and lifespan extension achieved by IL-11 inhibition in
    aged mice translate to human ageing, or is the survival benefit specific to
    the laboratory-mouse ageing model?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Frailty, Multimorbidity and Reduced Lifespan
  rationale: >-
    The organismal-outcome node - reduced frailty, multimorbidity, age-related
    cancer and >20% median lifespan extension - rests entirely on mouse genetics
    (Il11 / Il11ra1 deletion) and anti-IL-11 antibody dosing from 75 weeks of
    age; there is no human survival or frailty evidence. This is a
    HUMAN_MODEL_MISMATCH rather than a plain KNOWLEDGE_GAP because the effect IS
    demonstrated in a model system and it is the translational validity to human
    ageing that is open. It is mechanistically meaningful because mouse late-life
    mortality is heavily cancer-driven (the autopsy tumour-burden data), whereas
    human ageing mortality is dominated by cardiovascular, neurodegenerative and
    multi-morbid disease, so a lifespan benefit routed largely through reduced
    murine tumours need not reproduce in humans. Anti-IL-11 is already in
    early-stage human trials for fibro-inflammatory disease, which is the natural
    setting to begin resolving this - but until human ageing endpoints exist,
    conforming disorder entries should not inherit the lifespan-extension claim.
  evidence:
  - reference: PMID:39020175
    reference_title: "Inhibition of IL-11 signalling extends mammalian healthspan and lifespan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We suggest that anti-IL-11 therapy, which is currently in early-stage
      clinical trials for fibrotic lung disease, may provide a translational
      opportunity to determine the effects of IL-11 inhibition on ageing
      pathologies in older people.
    explanation: >-
      The authors themselves frame human translation as an open opportunity yet
      to be tested, confirming the mouse-to-human mismatch modeled here. Evidence
      source is OTHER (authors' discussion of translational prospects).
  proposed_experiments:
  - experiment_id: exp_anti_il11_human_ageing_endpoints
    name: Human ageing and frailty endpoints in an anti-IL-11 clinical cohort
    description: >-
      Prospectively follow older adults receiving anti-IL-11 (or anti-IL11RA)
      therapy in trials for fibro-inflammatory disease and measure ageing
      endpoints beyond the primary fibrotic indication, versus matched
      placebo/standard-of-care comparators: a validated frailty index, body
      composition (lean and fat mass), physical function (grip strength and gait
      speed), metabolic and inflammatory ageing biomarkers, incident
      multimorbidity, age-related cancer incidence, and all-cause mortality.
    experiment_type:
      preferred_term: trial-embedded prospective cohort study
    decision_criterion: >-
      A reduction in frailty progression and/or age-related morbidity and
      mortality in anti-IL-11-treated older adults that is not attributable to
      the fibrotic indication alone would support translation of the murine
      healthspan and lifespan benefit to human ageing; a null effect on these
      endpoints would weaken it.
    would_support:
    - pathophysiology#Frailty, Multimorbidity and Reduced Lifespan
    would_refute:
    - pathophysiology#Frailty, Multimorbidity and Reduced Lifespan

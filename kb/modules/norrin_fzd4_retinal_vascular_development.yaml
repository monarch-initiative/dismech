    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:25323851
    reference_title: "Familial exudative vitreoretinopathy and related retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FEVR patients have an avascular peripheral retina which, depending on the
      degree of ischaemia, causes the secondary complications of the disease.
    explanation: >-
      States both halves of this node's claim: the avascular periphery is the
      primary structural lesion, and the degree of resulting ischaemia
      determines what follows. Evidence source is OTHER because this is a
      review.
  - reference: PMID:25323851
    reference_title: "Familial exudative vitreoretinopathy and related retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Familial exudative vitreoretinopathy (FEVR) is a rare inherited disorder
      of retinal angiogenesis.
    explanation: >-
      Classifies the disease as one of retinal angiogenesis, supporting the
      placement of this angiogenic node as the principal effector arm. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Ischaemia-Driven Neovascularization, Exudation and Tractional Detachment
    causal_link_type: DIRECT

- name: Inner Blood-Retina Barrier Failure
  description: >-
    The barrier arm, separable from the angiogenic one and generally less
    severe. Norrin-FZD4-beta-catenin signalling stabilizes the endothelial
    junctional complexes that make retinal capillaries impermeable, and it does
    so continuously rather than only during development. Where the signal is
    insufficient the inner blood-retina barrier leaks, contributing exudation
    independently of ischaemia. This arm is partially rescued by the redundant
    Wnt7a/Wnt7b system, which is one reason a conformer may show a marked
    angiogenic phenotype with comparatively modest barrier failure.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: Establishment of blood-retinal barrier
    term:
      id: GO:1990963
      label: establishment of blood-retinal barrier
    modifier: DECREASED
  - preferred_term: Bicellular tight junction assembly
    term:
      id: GO:0070830
      label: bicellular tight junction assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:41862006
    reference_title: "Therapeutic potential of norrin/FZD4/β-catenin signaling in blood-retinal barrier protection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disruption of BRB integrity represents a key mechanism underlying
      pathological vascular permeability and the progression of diabetic
      retinopathy and age-related macular degeneration.
    explanation: >-
      Establishes barrier failure as a distinct mechanism producing pathological
      permeability, supporting its modelling as a separate arm from the
      angiogenic one. Evidence source is OTHER because this is a review.
  - reference: PMID:30478038
    reference_title: "Interplay of the Norrin and Wnt7a/Wnt7b signaling systems in blood-brain barrier and blood-retina barrier development and maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, in the context of a partially impaired Norrin system, the retina
      reveals a small contribution to BRB development from the Wnt7a/Wnt7b
      system.
    explanation: >-
      Supports the partial-redundancy claim this node makes, and specifies that
      the redundant contribution in the retina is small - which is why the
      barrier arm is attenuated rather than absent.
  downstream:
  - target: Ischaemia-Driven Neovascularization, Exudation and Tractional Detachment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Ischaemia-Driven Neovascularization, Exudation and Tractional Detachment
  description: >-
    The avascular retina is hypoxic, and hypoxia drives VEGF-mediated
    neovascularization at the vascular-avascular junction. The new vessels are
    incompetent: they leak lipid and protein into and under the retina - the
    exudation the disease is named for - and the fibrovascular tissue
    accompanying them contracts, dragging the macula and eventually detaching the
    retina. This is where sight is lost in the milder end of the spectrum, and it
    is what laser ablation of the avascular retina and anti-VEGF therapy are
    aimed at. Note that it is a shared final pathway with the acquired ischaemic
    retinopathies and is not by itself evidence of conformance to this module.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell

  - reference: PMID:25323851
    reference_title: "Familial exudative vitreoretinopathy and related retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FEVR patients have an avascular peripheral retina which, depending on the
      degree of ischaemia, causes the secondary complications of the disease.
    explanation: >-
      Places the secondary complications modelled by this node downstream of
      ischaemia in the avascular retina, and makes their severity a function of
      that ischaemia. Evidence source is OTHER because this is a review.

treatments:
- name: Norrin-FZD4 Pathway Agonism (Investigational)
  description: >-
    Pharmacological or biological activation of Norrin-FZD4-beta-catenin
    signalling to restore endothelial junctional integrity, pursued through
    pathway agonists, receptor-targeting monoclonal antibodies, and gene therapy.
    This is the module's drug-target pattern and it acts on the rate-limiting
    node directly. It is a mechanism pattern, not a treatment recommendation:
    none of these approaches is established, and conforming disorders do not
    inherit it. Note that most of this development effort is aimed at acquired
    barrier disease rather than at the inherited disorders that conform here.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Insufficient Norrin-FZD4-beta-catenin Signalling in Retinal Endothelium
    treatment_effect: ACTIVATES
    description: >-
      Agonizing the pathway is intended to raise endothelial beta-catenin signal
      above the threshold at which the barrier fails, acting on the module's
      rate-limiting node rather than on the neovascular consequence that
      anti-VEGF therapy targets.
    evidence:
    - reference: PMID:41862006
      reference_title: "Therapeutic potential of norrin/FZD4/β-catenin signaling in blood-retinal barrier protection."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Current research directions focus on 3 potential therapeutic strategies:
        modulation of Wnt/norrin signaling using pathway agonists and
        inhibitors, application of monoclonal antibodies targeting receptors,
        and gene therapy.
      explanation: >-
        Names the three strategies that constitute this target pattern. Marked
        PARTIAL because the same review states further clinical studies are
        required to assess efficacy and safety.
  evidence:
  - reference: PMID:41862006
    reference_title: "Therapeutic potential of norrin/FZD4/β-catenin signaling in blood-retinal barrier protection."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Although all these approaches demonstrate promising therapeutic potential,
      further clinical studies are required to assess their long-term efficacy
      and safety.
    explanation: >-
      The review's own hedged conclusion, recorded so this pattern is not read
      as established therapy. Evidence source is OTHER because this is a review.

discussions:
- discussion_id: norrin_fzd4_residual_signal_versus_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does residual Norrin-FZD4-beta-catenin signalling amplitude quantitatively
    predict where a patient falls on the continuum from asymptomatic peripheral
    avascularity to congenital retinal dysplasia?
  attaches_to:
  - "pathophysiology#Insufficient Norrin-FZD4-beta-catenin Signalling in Retinal Endothelium"
  rationale: >-
    This module asserts that the phenotypic continuum is a dose series on one
    pathway, and the observation that TSPAN12 is a less potent modulator than
    Norrin itself is consistent with that. But expressivity in these diseases is
    notoriously variable and asymmetric between the two eyes of one patient, who
    necessarily share a genotype and therefore share whatever residual signal
    amplitude the allele permits. Either amplitude is not the whole story, or it
    varies locally within the developing retina in a way a germline genotype
    cannot capture. Resolving this determines whether a signalling assay could
    ever serve as a prognostic test, and whether pathway agonism has a
    plausible therapeutic window in the inherited disorders as opposed to the
    acquired ones.
  proposed_experiments:
  - experiment_id: norrin_signal_amplitude_vs_avascular_zone
    name: Allele-resolved signalling amplitude against angiographic avascular zone extent
    description: >-
      Measure beta-catenin reporter activation for a graded allelic series of
      NDP, FZD4, LRP5 and TSPAN12 variants in retinal endothelial cells, and
      test the correlation against quantified peripheral avascular zone area on
      ultra-widefield fluorescein angiography in the corresponding patients,
      including the within-patient interocular difference as a measure of how
      much variance genotype cannot explain.

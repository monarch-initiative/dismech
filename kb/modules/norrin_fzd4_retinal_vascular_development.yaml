name: Norrin-FZD4 Retinal Vascular Development Module
description: >-
  A conserved pathophysiology module for the inherited retinal vascular
  diseases, in which a single ligand-receptor system builds and then seals the
  retinal vasculature. Norrin, encoded by NDP, is not a Wnt but binds the
  Frizzled-4 receptor with the LRP5 co-receptor and the TSPAN12 potentiator to
  drive canonical beta-catenin signalling specifically in retinal vascular
  endothelium. That signal does two separable jobs: it directs angiogenic
  outgrowth of the retinal vascular plexuses to the periphery and into the deep
  retina during development, and it maintains the inner blood-retina barrier by
  stabilizing endothelial junctional complexes for life. A loss-of-function
  lesion anywhere in the module therefore produces one rate-limiting state -
  insufficient Norrin-FZD4-beta-catenin signalling in retinal endothelium - from
  which two consequences follow with a severity that scales with residual
  signal: a peripheral (and in severe cases central) avascular retina, and a
  leaky barrier. Everything clinically distinctive about these diseases follows
  from the avascular retina: it is ischaemic, it drives VEGF-mediated
  neovascularization and exudation, and the fibrovascular tissue it generates
  contracts to detach the retina. The phenotypic continuum - from asymptomatic
  peripheral avascularity through exudative vitreoretinopathy to congenital
  retinal dysplasia with blindness - is a dose series on one mechanism, not a
  set of distinct diseases.
category: Module
creation_date: "2026-08-23T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "norrin_fzd4_retinal_vascular_development#Insufficient Norrin-FZD4-beta-catenin
  Signalling in Retinal Endothelium"). Gene substitutions a conforming trigger
  node makes: NDP (the ligand; X-linked, giving Norrie disease at the severe end
  and X-linked FEVR at the mild end), FZD4 (the receptor), LRP5 (the
  co-receptor), TSPAN12 (the potentiator), and ZNF408 and KIF11 in FEVR
  pedigrees where the link to the pathway is less direct.

  Two things a conformer should carry from the module rather than re-derive.
  First, the severity continuum is a dose effect on one pathway: an entry
  covering both Norrie disease and X-linked FEVR should model them as points on
  this chain rather than as separate mechanisms. Second, LRP5 is not
  retina-specific - the same co-receptor carries canonical Wnt signalling in
  bone, so LRP5-mutant patients additionally get osteopenia and osteoporosis,
  and molecularly unsolved FEVR patients warrant bone densitometry. That is a
  pleiotropy of the gene, not of the retinal mechanism, and belongs on the
  disorder entry.

  SCOPE. This module covers the developmental and barrier-maintenance failure
  driven by the Norrin system. It is deliberately not a module for retinal
  neovascularization in general: retinopathy of prematurity and proliferative
  diabetic retinopathy reach an ischaemic, neovascular retina through
  hyperoxia-then-hypoxia and through metabolic injury respectively, and share
  only the downstream VEGF response, which is modelled by tumor_angiogenesis and
  diabetic_vascular_complications. A conformer here must have a lesion in the
  Norrin-FZD4 system itself. Note also that Norrin is partially redundant with
  the Wnt7a/Wnt7b system for blood-brain and blood-retina barrier maintenance,
  which is why the barrier arm of this module is less severe than the
  angiogenic arm.
pathophysiology:
- name: Norrin Ligand, Receptor or Co-receptor Defect
  description: >-
    The initiating lesion is a loss-of-function variant in a component of the
    Norrin signalling complex: the ligand Norrin (NDP), the receptor Frizzled-4
    (FZD4), the co-receptor LRP5, or the potentiator TSPAN12. The genes are
    functionally non-equivalent in the amplitude of signal they carry - TSPAN12
    enhances the Norrin signal rather than transducing it, and is correspondingly
    less potent - which is part of why the same pathway produces a phenotypic
    continuum rather than a single phenotype. Inheritance follows the gene:
    X-linked for NDP, dominant or recessive for FZD4, LRP5 and TSPAN12.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: Canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:25323851
    reference_title: "Familial exudative vitreoretinopathy and related retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Four of these genes have been shown to have a central role in
      Norrin/Frizzled4 signalling, suggesting a critical role for this pathway
      in retinal angiogenesis.
    explanation: >-
      Establishes that the disease genes converge on one pathway rather than
      acting independently, which is what makes this a module rather than a list
      of genes. Evidence source is OTHER because this is a review.
  - reference: PMID:30478038
    reference_title: "Interplay of the Norrin and Wnt7a/Wnt7b signaling systems in blood-brain barrier and blood-retina barrier development and maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tspan12, a coactivator of Norrin signaling in the retina, is also active in
      BBB maintenance but is less potent than Norrin, consistent with a model in
      which Tspan12 enhances the amplitude of the Norrin signal in vascular
      endothelial cells.
    explanation: >-
      Supports the specific claim in this node's description that the
      components are not functionally equivalent, and that TSPAN12 modulates
      signal amplitude rather than carrying the signal.
  downstream:
  - target: Insufficient Norrin-FZD4-beta-catenin Signalling in Retinal Endothelium
    causal_link_type: DIRECT

- name: Insufficient Norrin-FZD4-beta-catenin Signalling in Retinal Endothelium
  description: >-
    The rate-limiting, disorder-agnostic node and the module's key conformance
    target. Norrin binding to Frizzled-4 with LRP5 and TSPAN12 activates
    canonical beta-catenin signalling in retinal vascular endothelial cells, and
    it is the amplitude of that endothelial signal - not the identity of the
    component that failed - that determines the phenotype. Every conforming
    disorder funnels through this node, and the severity continuum across and
    within these diseases is a continuum in how much signal survives. Because
    the pathway is required both during angiogenic outgrowth and for lifelong
    barrier maintenance, the deficit is simultaneously developmental and
    ongoing.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: Canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:41862006
    reference_title: "Therapeutic potential of norrin/FZD4/β-catenin signaling in blood-retinal barrier protection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interest in norrin signaling within the Wnt/β-catenin pathway arises from
      its crucial role in maintaining BRB integrity through the activation of
      the FZD4 receptor and LRP5/6 co-receptors, leading to the stabilization of
      endothelial junctional complexes and the maintenance and restoration of
      retinal vascular barrier properties, particularly following vascular
      endothelial growth factor (VEGF)-induced barrier disruption modulation of
      this pthway may represent a novel therapeutic approach aimed at protecting
      and regenerating the BRB in degenerative retinal diseases.
    explanation: >-
      Names the ligand, receptor and co-receptors of this node and the
      downstream endothelial junctional stabilization it produces. Evidence
      source is OTHER because this is a review.
  - reference: PMID:30478038
    reference_title: "Interplay of the Norrin and Wnt7a/Wnt7b signaling systems in blood-brain barrier and blood-retina barrier development and maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      β-Catenin signaling controls the development and maintenance of the
      blood-brain barrier (BBB) and the blood-retina barrier (BRB), but the
      division of labor and degree of redundancy between the two principal
      ligand-receptor systems-the Norrin and Wnt7a/Wnt7b systems-are
      incompletely defined.
    explanation: >-
      Supports the dual developmental-and-maintenance role this node asserts,
      and is the source of the partial-redundancy caveat recorded in the module
      scope note.
  downstream:
  - target: Incomplete Retinal Vascularization with Peripheral Avascular Retina
    causal_link_type: DIRECT
  - target: Inner Blood-Retina Barrier Failure
    causal_link_type: DIRECT

- name: Incomplete Retinal Vascularization with Peripheral Avascular Retina
  description: >-
    The angiogenic arm. Retinal vessels normally grow centrifugally from the
    optic disc to the ora serrata and then dive to form the deep plexuses;
    without sufficient endothelial beta-catenin signal that outgrowth stalls,
    leaving a peripheral zone of retina permanently without a blood supply. The
    extent of the avascular zone is the single quantity that predicts everything
    downstream, which is why peripheral fluorescein angiography, not symptoms,
    is how family members are screened. At the severe end of the continuum the
    failure is not merely peripheral and the retina is dysplastic from birth.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: Retinal blood vessel morphogenesis
    term:
      id: GO:0061304
      label: retinal blood vessel morphogenesis
    modifier: DECREASED

- name: Accumulation of Aggregation-Prone Interstitial Proteins
  description: >-
    Reduced clearance raises the interstitial concentration of the
    aggregation-prone proteins that the pathway normally removes — amyloid-beta,
    tau, and alpha-synuclein — pushing them toward the concentration-dependent
    nucleation regime modelled by the amyloidogenesis module. In humans, acute
    experimental slow-wave disruption raises CSF amyloid-beta40 and a single
    night of sleep deprivation raises PET amyloid burden in hippocampus and
    thalamus; in mice, Aqp4 deletion after traumatic brain injury promotes
    neurofibrillary tau pathology. Conforming disorder nodes substitute the
    disorder-specific accumulating species.

name: Glymphatic Dysfunction Module
description: >-
  A conserved brain waste-clearance mechanism module representing glymphatic
  dysfunction — the failure of the brain-wide perivascular route by which
  cerebrospinal fluid (CSF) enters the parenchyma along periarterial spaces,
  exchanges with interstitial fluid (ISF), and carries aggregation-prone
  interstitial proteins out of the brain. The route is gated by behavioural
  state: glymphatic activity is markedly enhanced during slow-wave sleep and
  suppressed by arousal, and it depends on the perivascular polarization of the
  astroglial water channel aquaporin-4 (AQP4) at astrocyte end-feet. Diverse
  upstream insults converge on the same chain — chronic sleep disruption, normal
  ageing, traumatic brain injury, and cerebrovascular disease all reduce
  periarterial CSF influx and AQP4 polarization, impair CSF-ISF exchange and
  interstitial solute clearance, and thereby permit accumulation of
  amyloid-beta, tau, and other aggregation-prone interstitial proteins, driving
  neuroinflammation and progressive neurodegeneration. Disorder entries declare
  conformance via conforms_to on their pathophysiology nodes, substituting the
  disorder-specific upstream insult (sleep fragmentation, injury, ageing,
  ventriculomegaly) and the disorder-specific accumulating protein species
  (amyloid-beta in Alzheimer disease, tau after traumatic brain injury,
  alpha-synuclein in the synucleinopathies) while preserving the conserved
  influx-to-clearance-to-accumulation chain.
category: Module
creation_date: "2026-07-31T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "glymphatic_dysfunction#Impaired Perivascular CSF-ISF Exchange and Solute
  Clearance", the key conformance target and rate-limiting step). Candidate
  conformers span Alzheimer disease and the other neurodegenerative
  proteinopathies, traumatic brain injury, cerebral small vessel disease and
  stroke, idiopathic normal pressure hydrocephalus, and the sleep disorders that
  act as an upstream trigger. It is deliberately distinct from — and upstream of
  — the amyloidogenesis module, which models fibril nucleation and deposition
  once precursor concentration is permissive; this module models the *clearance*
  arm that sets that concentration. It is also distinct from
  loss_of_proteostasis, which covers intracellular chaperone/degradation
  capacity rather than extracellular perivascular bulk clearance.

  IMPORTANT scope and epistemic caveats, which conforming entries must not
  quietly discard. (1) The microscopic mode of parenchymal solute transport is
  genuinely contested: whether movement through the parenchymal extracellular
  space is AQP4-dependent convective bulk flow or ordinary size-dependent
  diffusion is unresolved, and the two readings are curated here as competing
  mechanistic_hypotheses (convective_glymphatic_transport vs
  diffusive_parenchymal_transport) rather than being silently collapsed into
  the canonical model. What is not contested is that periarterial CSF influx is
  higher in wild-type than in Aqp4-null rodents and that interstitial solute
  clearance declines with age, injury, and dementia. (2) Most mechanistic
  evidence is rodent, frequently anesthetized, and acquired with invasive
  tracer delivery — all three of which are themselves determinants of measured
  glymphatic influx, so the human-model mismatch is recorded as an explicit
  HUMAN_MODEL_MISMATCH discussion. (3) The non-invasive human imaging surrogates
  (notably DTI-ALPS) are not validated against a gold-standard clearance
  measurement; a low ALPS-index should not be curated as a direct measurement of
  glymphatic dysfunction. Conforming disorder nodes that rest only on an
  imaging-surrogate association should say so.
pathophysiology:
- name: Sleep Disruption and Loss of Sleep-Dependent Glymphatic Drive
  description: >-
    The shared initiating condition is loss of the sleep-associated brain state
    that normally drives perivascular fluid transport. During natural sleep and
    ketamine/xylazine anaesthesia the cortical interstitial space expands by
    roughly 60%, noradrenergic tone falls, and cortical slow (delta) activity
    rises; each of these covaries with CSF tracer influx. In humans, NREM slow
    waves are followed by hemodynamic oscillations that are in turn coupled to
    macroscopic CSF flow. Chronic sleep fragmentation, sleep deprivation, sleep
    apnoea, and the sleep-architecture changes of ageing remove this drive.
    Conforming disorder nodes substitute the disorder-specific route to lost
    glymphatic drive (primary sleep disorder, ageing, critical illness,
    disease-associated sleep fragmentation).
  role: trigger
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sleep
    term:
      id: GO:0030431
      label: sleep
    modifier: DECREASED
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:

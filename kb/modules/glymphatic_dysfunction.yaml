  evidence:
  - reference: PMID:24136970
    reference_title: "Sleep drives metabolite clearance from the adult brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      natural sleep or anesthesia are associated with a 60% increase in the
      interstitial space, resulting in a striking increase in convective
      exchange of cerebrospinal fluid with interstitial fluid
    explanation: >-
      Establishes the behavioural-state gating of the module: the sleeping brain
      expands its interstitial space and increases CSF-ISF exchange, so loss of
      sleep removes the drive for the whole downstream chain.
  - reference: PMID:30820460
    reference_title: "Increased glymphatic influx is correlated with high EEG delta power and low heart rate in mice during sleep."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is the first study to show that glymphatic influx correlates
      positively with cortical delta power in EEG recordings and negatively with
      beta power and heart rate.
    explanation: >-
      Identifies cortical slow-wave (delta) power as the specific electrographic
      correlate of glymphatic influx, making loss of slow-wave sleep the
      mechanistically relevant trigger rather than total sleep time.
  - reference: PMID:31672896
    reference_title: "Coupled electrophysiological, hemodynamic, and cerebrospinal fluid oscillations in human sleep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neural slow waves are followed by hemodynamic oscillations, which in turn
      are coupled to CSF flow.
    explanation: >-
      Human simultaneous EEG-fMRI evidence that the sleep-to-CSF-flow coupling
      seen in rodents also holds in people, supporting the trigger node in human
      physiology.
  - reference: PMID:42419635
    reference_title: "The Glymphatic system: A key mechanism linking sleep to brain health and diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulating evidence indicates that glymphatic activity is markedly
      enhanced during sleep through coordinated regulation of vasomotion,
      norepinephrine oscillations, aquaporin-4 polarization, extracellular space
      expansion, respiration, and meningeal lymphatic drainage.
    explanation: >-
      Review-level synthesis enumerating the coordinated sleep-dependent
      regulators that constitute the drive lost at this node.
  downstream:
  - target: Perivascular AQP4 Depolarization and Reduced Periarterial CSF Influx
    description: >-
      Loss of the sleep-associated state contracts the interstitial space and
      raises noradrenergic tone, reducing periarterial CSF influx; ageing and
      injury additionally depolarize astrocytic AQP4 away from the perivascular
      end-foot.
- name: Perivascular AQP4 Depolarization and Reduced Periarterial CSF Influx
  description: >-
    CSF enters the parenchyma along the perivascular spaces surrounding
    penetrating arteries, and this influx depends on the expression and
    perivascular localization of the astroglial water channel aquaporin-4 at
    astrocyte end-feet. Ageing, traumatic brain injury, and Alzheimer disease are
    each accompanied by loss of perivascular AQP4 polarization together with
    reduced arteriolar wall pulsatility, and Aqp4-null rodents show reduced CSF
    tracer influx. Conforming disorder nodes substitute the disorder-specific
    cause of reduced influx (AQP4 mislocalization, arteriosclerotic loss of
    pulsatility, perivascular space enlargement, meningeal lymphatic failure).
  role: amplifier
  biological_scale: CELLULAR

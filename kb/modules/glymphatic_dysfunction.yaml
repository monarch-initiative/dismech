- name: Neuroinflammation and Progressive Neurodegeneration
  description: >-
    Retained neurotoxic metabolites and accumulated protein aggregates provoke
    microglial and astroglial activation and chronic neuroinflammation, and the
    combination drives progressive neuronal dysfunction and loss. This is the
    clinical endpoint that makes glymphatic failure a proposed therapeutically
    targetable final common pathway to dementia, and it is where the module
    hands off to disease-specific downstream pathology in conforming entries.

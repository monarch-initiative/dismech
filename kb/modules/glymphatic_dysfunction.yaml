mechanistic_hypotheses:
- hypothesis_group_id: convective_glymphatic_transport
  hypothesis_label: AQP4-Dependent Convective (Bulk-Flow) Glymphatic Transport Model
  status: CANONICAL
  description: >-
    The canonical reading: CSF is driven by arterial pulsation and vasomotion
    into periarterial spaces, moves convectively (bulk flow) through the
    parenchymal extracellular space in an AQP4-dependent manner, and exits along
    paravenous routes, carrying interstitial solutes with it. Under this model
    the astroglial end-foot AQP4 channel is a necessary conduit, so loss of
    perivascular AQP4 polarization is mechanistically — not merely
    correlatively — responsible for impaired clearance.
  evidence:
  - reference: PMID:22896675
    reference_title: "A paravascular pathway facilitates CSF flow through the brain parenchyma and the clearance of interstitial solutes, including amyloid beta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Animals lacking the water channel aquaporin-4 (AQP4) in astrocytes exhibit
      slowed CSF influx through this system and a ~70% reduction in interstitial
      solute clearance, suggesting that the bulk fluid flow between these
      anatomical influx and efflux routes is supported by astrocytic water
      transport.
    explanation: >-
      The founding observation for the convective, AQP4-supported bulk-flow
      model.
  - reference: PMID:30561329
    reference_title: "Aquaporin-4-dependent glymphatic solute transport in the rodent brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Meta-analysis of all studies demonstrated a significant decrease in tracer
      transport in KO mice and rats compared to controls.
    explanation: >-
      Five-laboratory replication and meta-analysis re-establishing AQP4
      dependence after it had been challenged.
  notes: >-
    Note the scope boundary between the two hypotheses: the AQP4 dependence of
    periarterial CSF *influx* is the better-supported claim, whereas the
    convective nature of transport *within the parenchymal extracellular space*
    is what the alternative hypothesis disputes.
- hypothesis_group_id: diffusive_parenchymal_transport
  hypothesis_label: Diffusive, AQP4-Independent Parenchymal Transport Model
  status: ALTERNATIVE
  description: >-
    The principal alternative: convective flow is real in the subarachnoid and
    perivascular compartments, but movement of solutes through the parenchymal
    extracellular space itself is ordinary size-dependent diffusion rather than
    directed bulk flow, and does not require AQP4. Under this reading the
    clearance deficits observed in ageing, injury, and dementia are real, but
    are attributable to perivascular-space and extracellular-space geometry and
    to the rate of perivascular convection, not to an AQP4-gated parenchymal
    convective conduit. This matters for curation because it changes what an
    AQP4 finding in a conforming disorder entry may be taken to mean.
  evidence:
  - reference: PMID:28826498
    reference_title: "Test of the 'glymphatic' hypothesis demonstrates diffusive and aquaporin-4-independent solute transport in rodent brain parenchyma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results do not support the proposed glymphatic mechanism of convective
      solute transport in brain parenchyma.
    explanation: >-
      The primary experimental challenge: size-dependent dextran penetration,
      photobleaching after cardiorespiratory arrest, and Aqp4 deletion all
      pointed to diffusion rather than convection in the parenchyma.
  - reference: PMID:30561329
    reference_title: "Aquaporin-4-dependent glymphatic solute transport in the rodent brain."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Meta-regression indicated that anesthesia, age, and tracer delivery
      explain the opposing results.
    explanation: >-
      Direct rebuttal attributing the negative AQP4 result to methodological
      covariates (anaesthetic regimen, animal age, tracer delivery route) rather
      than to absence of the effect.
  notes: >-
    Retained as ALTERNATIVE rather than DEPRECATED. The rebuttal in PMID:30561329
    addresses the AQP4-dependence experiments specifically; the separate
    size-dependence and post-arrest photobleaching results bearing on convection
    within the parenchyma have not been overturned in the same way, and the
    seed review (PMID:42419635) still lists bulk flow versus diffusion as an open
    controversy in 2026.
discussions:
- discussion_id: controversy_glymphatic_bulk_flow_versus_diffusion
  prompt: >-
    Is solute movement through the parenchymal extracellular space in the
    glymphatic pathway convective (AQP4-dependent bulk flow) or diffusive, and
    what fraction of measured interstitial clearance does each contribute?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Perivascular AQP4 Depolarization and Reduced Periarterial CSF Influx
  - pathophysiology#Impaired Perivascular CSF-ISF Exchange and Solute Clearance
  rationale: >-
    This is the central unresolved mechanistic question about the pathway and it
    is not cosmetic. If parenchymal transport is predominantly diffusive, then
    an AQP4 mislocalization finding in a conforming disorder entry is a marker
    of astroglial reactivity rather than a lesion in the clearance conduit, and
    therapeutic strategies aimed at restoring AQP4 polarization lose their
    rationale. Curators should keep the two readings separated as
    mechanistic_hypotheses on the affected edge rather than asserting the
    canonical model as settled.
  evidence:
  - reference: PMID:42419635
    reference_title: "The Glymphatic system: A key mechanism linking sleep to brain health and diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We also discuss major controversies surrounding glymphatic physiology,
      including the relative contributions of bulk flow and diffusion,
      species-specific differences, and the challenges of validating human
      imaging biomarkers.
    explanation: >-
      Confirms that as of 2026 the bulk-flow-versus-diffusion question is still
      framed by the field as an open controversy, not a settled point.
  - reference: PMID:28826498
    reference_title: "Test of the 'glymphatic' hypothesis demonstrates diffusive and aquaporin-4-independent solute transport in rodent brain parenchyma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      transport of fluorescent dextrans in brain parenchyma depended on dextran
      size in a manner consistent with diffusive rather than convective
      transport
    explanation: >-
      The size-dependence result that motivates the diffusive reading.
  proposed_experiments:
  - experiment_id: exp_glymphatic_parenchymal_transport_mode_discrimination
    name: Anaesthesia- and delivery-controlled discrimination of convective versus diffusive parenchymal transport
    description: >-
      Run the size-dependence, post-cardiorespiratory-arrest photobleaching, and
      Aqp4-null tracer experiments in a single pre-registered protocol in which
      the three covariates identified by the PMID:30561329 meta-regression —
      anaesthetic regimen, animal age, and tracer delivery route (cisterna magna
      infusion versus intraparenchymal injection) — are systematically varied
      rather than held at one laboratory's default. Score convection with a
      directional readout (centroid displacement, quadrant-resolved fluorescence
      recovery) rather than with net tracer accumulation, which cannot
      distinguish the two transport modes.
- discussion_id: gap_glymphatic_human_model_translatability
  prompt: >-
    Which features of glymphatic transport measured in anaesthetized rodents
    with invasive tracer delivery hold in the awake human brain, given that
    anaesthetic regimen, age, and delivery route are themselves determinants of
    measured glymphatic influx?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Sleep Disruption and Loss of Sleep-Dependent Glymphatic Drive
  - pathophysiology#Perivascular AQP4 Depolarization and Reduced Periarterial CSF Influx
  - pathophysiology#Impaired Perivascular CSF-ISF Exchange and Solute Clearance
  rationale: >-
    Evidence for this module exists in models, but its translational validity is
    the open question — the defining condition for HUMAN_MODEL_MISMATCH rather
    than KNOWLEDGE_GAP. Three specific mismatches apply. Anaesthesia is not a
    neutral substitute for sleep: measured glymphatic influx varies several-fold
    across anaesthetic regimens, so a result obtained under ketamine/xylazine
    may not describe natural sleep, let alone human sleep. Invasive tracer
    delivery itself suppresses glymphatic function, so intraparenchymal-injection
    studies may under-report transport. And the rodent brain differs from the
    human brain in scale, perivascular-space geometry, and transport distances,
    which is exactly the species-specific difference the seed review flags.
    Human confirmation to date rests on intrathecal-contrast MRI in small
    clinical cohorts and on non-invasive imaging surrogates.
  evidence:
  - reference: PMID:30820460
    reference_title: "Increased glymphatic influx is correlated with high EEG delta power and low heart rate in mice during sleep."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that glymphatic CSF tracer influx was highest under K/X followed
      by isoflurane (ISO) supplemented with dexmedetomidine and pentobarbital.
      Mice anesthetized with α-chloralose, Avertin, or ISO exhibited low CSF
      tracer influx.
    explanation: >-
      Demonstrates that the anaesthetic regimen alone changes measured
      glymphatic influx severalfold, so anaesthetized-rodent results cannot be
      read directly as sleep physiology.
  - reference: PMID:30561329
    reference_title: "Aquaporin-4-dependent glymphatic solute transport in the rodent brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also report that intrastriatal injections suppress glymphatic function.
      This validates the role of AQP4 and shows that glymphatic studies must
      avoid the use of invasive procedures.
    explanation: >-
      Shows that the measurement procedure itself perturbs the process being
      measured, a methodological confound specific to the model systems.
  - reference: PMID:29997300
    reference_title: "Brain-wide glymphatic enhancement and clearance in humans assessed with MRI."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations translate previous findings in animal studies into
      humans and open new prospects concerning intrathecal treatment regimens,
      extravascular contrast-enhanced MRI, and assessment of brain clearance
      function.
    explanation: >-
      The strongest human translation available, but it is an
      intrathecal-contrast study in small clinical cohorts and establishes
      tracer access and delayed clearance rather than the transport mechanism,
      so it only partially closes the mismatch.
  proposed_experiments:
  - experiment_id: exp_glymphatic_awake_cross_species_comparison
    name: Awake, non-invasive cross-species comparison of glymphatic transport
    description: >-
      Measure CSF-ISF exchange in awake, unrestrained rodents with head-mounted
      or non-invasive imaging and no intraparenchymal injection, and compare the
      resulting transport parameters with intrathecal-contrast MRI in humans
      matched on sleep stage by concurrent EEG. Report the species difference in
      perivascular-space geometry and transport distance explicitly, so that
      rodent-derived rate constants are not transplanted into human models
      unadjusted.
- discussion_id: gap_glymphatic_imaging_biomarker_validation
  prompt: >-
    Do the non-invasive human imaging surrogates for glymphatic function —
    principally DTI-ALPS, but also dynamic contrast-enhanced and diffusion MRI —
    measure glymphatic clearance, and against what gold standard have they been
    validated?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Perivascular CSF-ISF Exchange and Solute Clearance
  rationale: >-
    Nearly all human disease associations attributed to glymphatic dysfunction
    rest on imaging surrogates rather than on measured clearance, so the
    validity of those surrogates gates how much of the human literature this
    module may absorb. The ALPS-index in particular is an index of directional
    water diffusivity at the lateral ventricular body level; treating a low
    ALPS-index as a direct measurement of glymphatic dysfunction over-claims.
    Curators adding a conforming disorder node supported only by an imaging
    surrogate should record the surrogate as such in the evidence explanation
    rather than asserting measured clearance failure.
  evidence:
  - reference: PMID:38569866
    reference_title: "Diffusion Tensor Image Analysis ALong the Perivascular Space (DTI-ALPS): Revisiting the Meaning and Significance of the Method."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a higher ALPS-index indicates predominant Brownian motion of water
      molecules in the radial direction at the lateral ventricular body level,
      no more and no less
    explanation: >-
      States the interpretive limit of the most widely used human surrogate,
      from the group that proposed the method.
  - reference: PMID:38569866
    reference_title: "Diffusion Tensor Image Analysis ALong the Perivascular Space (DTI-ALPS): Revisiting the Meaning and Significance of the Method."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It has become clear that these methods also do not seem to reflect the
      entirety of the extremely complex glymphatic system.
    explanation: >-
      Extends the caveat beyond DTI-ALPS to the other proposed non-invasive
      measures, which is why this is curated as a gap over the whole
      imaging-surrogate class.
  proposed_experiments:
  - experiment_id: exp_glymphatic_surrogate_versus_intrathecal_tracer_validation
    name: Head-to-head validation of imaging surrogates against intrathecal tracer clearance
    description: >-
      In a single human cohort, acquire DTI-ALPS, dynamic contrast-enhanced MRI,
      and diffusion MRI alongside serial intrathecal gadobutrol clearance
      measured over 24-48 hours, and report the correlation of each surrogate
      with regional tracer clearance rate. Include a repeatability arm to
      separate surrogate measurement noise from genuine between-subject
      variation, and report whether any surrogate retains an association with
      clearance after adjustment for ventricular size and white-matter
      microstructure.

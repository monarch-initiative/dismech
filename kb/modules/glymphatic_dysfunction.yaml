    reference_title: "A paravascular pathway facilitates CSF flow through the brain parenchyma and the clearance of interstitial solutes, including amyloid beta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we showed that CSF enters the parenchyma along paravascular spaces that
      surround penetrating arteries and that brain interstitial fluid is cleared
      along paravenous drainage pathways
    explanation: >-
      Defines the periarterial-influx / paravenous-efflux anatomy that this node
      models.
  - reference: PMID:30561329
    reference_title: "Aquaporin-4-dependent glymphatic solute transport in the rodent brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We concur that CSF influx is higher in wild-type mice than in four
      different Aqp4 KO lines and in one line that lacks perivascular AQP4
      (Snta1 KO).
    explanation: >-
      Multi-laboratory replication with meta-analysis establishing that
      periarterial CSF influx is AQP4-dependent, which is the specific claim
      this node makes.
  - reference: PMID:27893874
    reference_title: "Association of Perivascular Localization of Aquaporin-4 With Cognition and Alzheimer Disease in Aging Brains."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perivascular AQP4 localization was significantly associated with AD status
      independent of age
    explanation: >-
      Human postmortem evidence that loss of perivascular AQP4 polarization —
      the molecular lesion at this node — tracks with Alzheimer disease
      independently of age.
  - reference: PMID:25204284
    reference_title: "Impairment of paravascular clearance pathways in the aging brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A 27% reduction in the vessel wall pulsatility of intracortical arterioles
      and widespread loss of perivascular AQP4 polarization along the
      penetrating arteries accompanied the decline in CSF-ISF exchange.
    explanation: >-
      Couples the two proximal determinants modelled here — arteriolar
      pulsatility and AQP4 polarization — to the downstream fall in CSF-ISF
      exchange in the ageing brain.
  - reference: PMID:28826498
    reference_title: "Test of the 'glymphatic' hypothesis demonstrates diffusive and aquaporin-4-independent solute transport in rodent brain parenchyma."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Aqp4 gene deletion did not impair transport of fluorescent solutes from
      sub-arachnoid space to brain in mice or rats
    explanation: >-
      Explicitly recorded counter-evidence: an independent laboratory found no
      effect of Aqp4 deletion on subarachnoid-to-brain solute transport. Curated
      as REFUTE so the AQP4-dependence claim is not overstated; see the
      diffusive_parenchymal_transport hypothesis and the
      bulk-flow-versus-diffusion controversy discussion.
  downstream:
  - target: Impaired Perivascular CSF-ISF Exchange and Solute Clearance
    description: >-
      Reduced periarterial CSF influx and loss of perivascular AQP4 polarization
      lower the rate of exchange between subarachnoid CSF and brain interstitial
      fluid, and therefore the rate at which interstitial solutes are removed.
    hypothesis_groups:
    - convective_glymphatic_transport
    - diffusive_parenchymal_transport
- name: Impaired Perivascular CSF-ISF Exchange and Solute Clearance
  description: >-
    The rate-limiting, disorder-agnostic step: exchange between subarachnoid CSF
    and brain interstitial fluid falls, and with it the clearance of interstitial
    solutes from the parenchyma. This is the key conformance target. It is
    reached from many upstream directions — ageing reduces CSF-parenchyma
    exchange and impairs intraparenchymal amyloid-beta clearance by about 40% in
    mice; traumatic brain injury reduces glymphatic pathway function by about
    60% for at least a month; and in humans an intrathecally administered CSF
    tracer reaches all brain subregions but is cleared more slowly in a dementia
    cohort than in near-healthy references. Conforming disorder nodes preserve
    the impaired-clearance claim while substituting the disorder-specific insult
    and the solute measured.

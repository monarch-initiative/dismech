name: Dermal-Epidermal Junction Adhesion Failure Module
description: >-
  A conserved mechanobullous module for inherited epidermolysis bullosa (EB)
  and the related genetic disorders of skin fragility. The epidermis is held to
  the dermis by one continuous attachment network - keratin filaments anchored
  into hemidesmosomes, hemidesmosomes bridged to the lamina densa by anchoring
  filaments, and the lamina densa tethered into the papillary dermis by
  anchoring fibrils. Loss of any single component of that network leaves the
  junction unable to withstand ordinary shear, so minor mechanical trauma
  separates the tissue and a blister forms. Which component is lost sets the
  ultrastructural level of separation, and that cleavage plane - not the
  clinical severity - is what defines the EB subtype. Repeated blistering
  drives chronic erosion, scarring, and, in the sublamina densa forms, a
  markedly elevated risk of cutaneous squamous cell carcinoma. Disorder entries
  reference these nodes via conforms_to and substitute the gene-specific
  attachment component.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a shared mechanism module, not a disease.

  Disorder-specific substitutions at the trigger node, ordered by the cleavage
  plane each produces: PLEC (the plectin link from the keratin network into the
  hemidesmosome); ITGA6 / ITGB4 and COL17A1 (hemidesmosomal); LAMA3 / LAMB3 /
  LAMC2 (lamina lucida, the anchoring filament level); COL7A1 (sublamina densa,
  the anchoring fibril level); FERMT1 / kindlin-1 (mixed, and the reason Kindler
  EB shows more than one plane in the same biopsy).

  KRT5 and KRT14 are deliberately NOT in that list even though they cause an EB
  subtype, because they are intracellular filament proteins rather than
  components of the extracellular attachment network this node asserts. See the
  scope boundary below.

  Scope boundary with `keratin_intermediate_filament_fragility`. Epidermolysis
  bullosa simplex is classified as EB because it blisters, but its proximal
  lesion is dominant-negative collapse of the keratin network inside the basal
  keratinocyte, not loss of an extracellular attachment component. An EBS entry
  should conform to the keratin module, and should NOT conform to this module's
  trigger node.

  It should not conform to this module's *separation* node either, and the
  reason is worth stating because it is easy to get wrong: EBS splits
  **intraepidermally**, through the cytolysing basal keratinocyte, above an
  intact basement membrane zone - not at the dermal-epidermal junction. The
  blister looks the same clinically and the plane is not the same. What EBS
  shares with this module is the keratin module's cytolysis node, which is where
  its separation belongs.

  PLEC (plectin) is the genuine hinge and the one EBS-associated gene that does
  belong here, because plectin is a hemidesmosomal component linking the keratin
  network into the attachment complex; a plectin-deficient entry has a real
  claim on both this module's trigger and the keratin module's.

  This module models the *inherited* attachment defect. The acquired
  autoantibody-mediated route to the same cleavage planes (epidermolysis bullosa
  acquisita, bullous pemphigoid, anti-laminin-332 mucous membrane pemphigoid)
  reaches the separation node through immune targeting of the same proteins;
  such an entry may conform at the separation node while curating its own
  autoimmune trigger.

  Not an Xogenesis module: the blister is a plane of tissue separation - a
  failure of an adhesive structure - not the formation of a new pathological
  anatomical entity.

  Conformance requires evidence of mechanically-provoked separation at the
  dermal-epidermal junction. A gene expressed at the basement membrane zone, or
  a disorder with skin fragility from a different cause (cornification defects,
  desmosomal acantholysis), does not conform on that basis alone.
pathophysiology:
- name: Basement Membrane Zone Attachment Component Defect
  description: >-
    A structural component of the interconnected hemidesmosome - anchoring
    filament - anchoring fibril network of the cutaneous basement membrane zone
    is absent, reduced, or structurally abnormal. The network spans from the
    keratin cytoskeleton of the basal keratinocyte, across the lamina lucida and
    lamina densa, into the papillary dermis, and each disorder removes one link
    from it.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: basal keratinocyte
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: hemidesmosome assembly
    term:
      id: GO:0031581
      label: hemidesmosome assembly
    modifier: DECREASED
  - preferred_term: cell-matrix adhesion
    term:
      id: GO:0007160
      label: cell-matrix adhesion
    modifier: DECREASED
  cellular_components:
  - preferred_term: cutaneous basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  evidence:
  - reference: PMID:10367729
    reference_title: "Mutation analysis and molecular genetics of epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cutaneous basement membrane zone (BMZ) consists of a number of attachment structures that are critical for stable association of the epidermis to the underlying dermis. These include hemidesmosomes, anchoring filaments and anchoring fibrils which form an interconnecting network extending from the intracellular milieu of basal keratinocytes across the dermal-epidermal basement membrane to the underlying dermis.
    explanation: >-
      Defines the attachment network whose components are the substitutable
      triggers of this module.
  - reference: PMID:8370960
    reference_title: "Type VII collagen, anchoring fibrils, and epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The NC-1 domains are believed to interact with components of the basement membrane and thus to mediate the attachment of the basement membrane to the dermis.
    explanation: >-
      Gives the molecular function of the deepest link in the network, type VII
      collagen in anchoring fibrils, which the dystrophic forms lose.
  downstream:
  - target: Loss of Adhesive Integrity at a Defined Cleavage Plane
    description: >-
      Removing one link leaves the network mechanically incompetent at the exact
      level that link occupies.

- name: Loss of Adhesive Integrity at a Defined Cleavage Plane
  description: >-
    The attachment network loses tensile competence at one specific
    ultrastructural level - within the basal keratinocyte, at the
    hemidesmosome, within the lamina lucida, or beneath the lamina densa -
    determined by where the missing component sits. This level-specificity is
    the organizing principle of EB classification: the same clinical sign
    (a blister) arising at different depths defines the simplex, junctional,
    and dystrophic categories, and predicts whether healing will be scarless
    or scarring.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: basal keratinocyte
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: cell-substrate adhesion
    term:
      id: GO:0031589
      label: cell-substrate adhesion
    modifier: DECREASED
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:10367729
    reference_title: "Mutation analysis and molecular genetics of epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on constellations of the phenotypic manifestations, severity of the disease, and the level of tissue separation within the cutaneous BMZ, EB has been divided into clinically distinct subcategories, including the simplex, hemidesmosomal, junctional and dystrophic variants.
    explanation: >-
      States that the level of separation within the basement membrane zone is
      what partitions EB into subtypes, which is the claim this node makes.
  - reference: PMID:29946029
    reference_title: "Gentamicin induces LAMB3 nonsense mutation readthrough and restores functional laminin 332 in junctional epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      H-JEB is caused by loss-of-function mutations in LAMA3, LAMB3, or LAMC2, leading to complete loss of laminin 332, the major component of anchoring filaments, which mediate epidermal-dermal adherence.
    explanation: >-
      Worked example of one plane: loss of the anchoring filament component
      laminin 332 removes epidermal-dermal adherence at the lamina lucida.
  downstream:
  - target: Mechanically Induced Dermal-Epidermal Separation and Blistering
    description: >-
      An adhesively incompetent plane separates under shear forces that intact
      skin tolerates without injury.

- name: Mechanically Induced Dermal-Epidermal Separation and Blistering
  description: >-
    Ordinary mechanical shear - friction, pressure, minor trauma - separates
    the tissue at the incompetent plane, and fluid accumulates in the resulting
    cleft to form a blister or erosion. This is the rate-limiting,
    disorder-agnostic node of the module: every attachment-component lesion
    converges here, and it is the node against which conformance should be
    declared.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: basal keratinocyte
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: DECREASED
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:10367729
    reference_title: "Mutation analysis and molecular genetics of epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aberrations in this network structure, e.g. due to genetic lesions in the corresponding genes, can result in fragility of the skin at the level of the cutaneous BMZ.
    explanation: >-
      States the amplifier-to-central-effector step: network aberration yields
      skin fragility at the basement membrane zone.
  - reference: PMID:20301481
    reference_title: "Dystrophic Epidermolysis Bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dystrophic epidermolysis bullosa (DEB) is characterized by skin fragility manifested by blistering and erosions with minimal trauma.
    explanation: >-
      Documents the defining feature of this node - blistering provoked by
      minimal mechanical trauma - in the sublamina densa form.
  downstream:
  - target: Chronic Erosion, Impaired Healing and Dermal Scarring
    description: >-
      Blisters rupture into erosions; repeated cycles of injury and repair at a
      plane below the lamina densa heal with scarring rather than restitution.

- name: Chronic Erosion, Impaired Healing and Dermal Scarring
  description: >-
    Ruptured blisters leave chronic, slowly healing erosions and wounds. Where
    the plane of separation lies beneath the lamina densa, healing is
    fibrotic rather than restitutive, producing milia, atrophic scarring, and
    progressive contracture. The persistently wounded, inflamed, and
    fibrotic dermal microenvironment is itself the substrate for the malignant
    complication. Forms that split above the lamina densa heal without
    scarring, so this node is reached to markedly different degrees across
    conforming disorders.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: ABNORMAL
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  evidence:
  - reference: PMID:20301481
    reference_title: "Dystrophic Epidermolysis Bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical findings in severe RDEB include skin fragility manifested by blistering and erosions with minimal trauma that heals with milia and scarring.
    explanation: >-
      Documents the scarring rather than restitutive healing that follows
      separation below the lamina densa.
  - reference: PMID:26083672
    reference_title: "Update on the pathogenesis of squamous cell carcinoma development in recessive dystrophic epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent discovery of a remarkably distinct tumour microenvironment in part explains the aggressive nature of RDEB SCC and the importance of collagen VII expression as a potential therapeutic measure.
    explanation: >-
      Links the chronically wounded, collagen-VII-deficient dermal
      microenvironment of this node to the malignant consequence downstream.
  downstream:
  - target: Cutaneous and Extracutaneous Complications of Skin Fragility
    description: >-
      Chronic wounding and fibrosis produce the organ-level burden of disease,
      including squamous cell carcinoma at chronically wounded sites.

- name: Cutaneous and Extracutaneous Complications of Skin Fragility
  description: >-
    The organ-level endpoint. Because the same attachment network operates in
    every stratified squamous epithelium, fragility is not confined to skin:
    nail dystrophy, oral and oesophageal erosion with stricture, corneal
    erosion, and dental enamel defects occur depending on which component is
    lost. In the sublamina densa forms, cutaneous squamous cell carcinoma
    arising in chronically wounded skin becomes the leading cause of death in
    adulthood, and it is not UV-driven.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: epidermis development
    term:
      id: GO:0008544
      label: epidermis development
    modifier: ABNORMAL
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:26083672
    reference_title: "Update on the pathogenesis of squamous cell carcinoma development in recessive dystrophic epidermolysis bullosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with RDEB have up to a 50 fold increased incidence of cutaneous squamous cell carcinoma (cSCC) which is independent of ultraviolet (UV) exposure.
    explanation: >-
      Quantifies the malignant consequence and establishes that it follows from
      the chronic wounding of this module rather than from UV mutagenesis.
  - reference: PMID:12472531
    reference_title: "Epidermolysis bullosa and cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In spite of this progress, squamous cell carcinoma (SCC) is still a major cause of morbidity and mortality, particularly in Hallopeau--Siemens recessive dystrophic EB.
    explanation: >-
      Establishes that this consequence node, not the blistering itself, carries
      the mortality burden in the severe recessive dystrophic form.

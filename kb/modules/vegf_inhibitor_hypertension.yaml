treatments:
- name: Renin-Angiotensin System Inhibition (ACE Inhibitor or ARB)
  description: >-
    Angiotensin system inhibitors are a first-line antihypertensive choice in
    this setting. They act on the same central-effector node the module converges
    on — reducing angiotensin-II-driven vasoconstriction and so lowering
    peripheral vascular resistance — rather than restoring the upstream VEGF
    signal, which would antagonise the antitumour effect of the culprit drug.
    This is the drug-target design pattern conforming entries should copy: the
    antihypertensive targets the convergence node, not the trigger.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Vasoconstriction and Increased Peripheral Vascular Resistance
    treatment_effect: INHIBITS
    description: >-
      Blocking angiotensin II generation or its receptor removes a
      vasoconstrictor input to the same convergence node, lowering peripheral
      vascular resistance and blood pressure without restoring VEGF signalling.
  evidence:
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASIs and calcium channel blockers are first-line therapy for treatment and
      are associated with improved overall survival.
    explanation: >-
      Identifies angiotensin system inhibitors as first-line therapy for
      tyrosine-kinase-inhibitor-induced hypertension. Evidence source is OTHER
      because this is a review article summarizing trial data.
- name: Calcium Channel Blocker
  description: >-
    Dihydropyridine calcium channel blockers are the other first-line option,
    acting directly on vascular smooth muscle to oppose the vasoconstriction the
    module converges on. Note the practical caveat carried in the oncology
    literature but not modelled as a node here: non-dihydropyridine agents
    inhibit CYP3A4 and can raise exposure to several VSP tyrosine kinase
    inhibitors, so agent choice within the class is not mechanism-neutral.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
  target_mechanisms:
  - target: Vasoconstriction and Increased Peripheral Vascular Resistance
    treatment_effect: INHIBITS
    description: >-
      Blocking L-type calcium entry into vascular smooth muscle relaxes the
      vessel wall, directly opposing the vasoconstriction and raised peripheral
      resistance that define the central-effector node.
  evidence:
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASIs and calcium channel blockers are first-line therapy for treatment and
      are associated with improved overall survival.
    explanation: >-
      Identifies calcium channel blockers as first-line therapy for
      tyrosine-kinase-inhibitor-induced hypertension. Evidence source is OTHER
      because this is a review article summarizing trial data.
discussions:
- discussion_id: vegfi_hypertension_mechanism_unsettled
  prompt: >-
    Which of the three curated arms — endothelial nitric oxide deficiency with
    oxidative stress, endothelin-1 system activation, and microvascular
    rarefaction — is rate-limiting for the blood-pressure rise in patients, and
    in what temporal order do they act?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Endothelial Nitric Oxide Deficiency and Oxidative Stress
  - pathophysiology#Endothelin-1 System Activation
  - pathophysiology#Microvascular Rarefaction
  - pathophysiology#Vasoconstriction and Increased Peripheral Vascular Resistance
  rationale: >-
    This matters for curation discipline, not just completeness. The three
    upstream arms are each independently attested, but the field explicitly
    describes the integrated mechanism as unclear/elusive, so a conforming
    disorder entry must not assert one arm as "the" mechanism of its drug's
    hypertension. It also matters therapeutically: if endothelin-1 dominates, an
    endothelin receptor antagonist would be mechanism-matched therapy, whereas
    the two agents curated in this module's treatments block are chosen for
    convergence-node effect rather than for arm-specific targeting. The acute
    (tone) and slow (rarefaction) components also predict different
    blood-pressure time courses, which is testable.
  evidence:
  - reference: PMID:32990313
    reference_title: "Vascular toxicity associated with anti-angiogenic drugs."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the pathophysiological mechanisms still remain elusive and there
      is an urgent need to better understand exactly how anti-angiogenic drugs
      cause hypertension and other cardiovascular diseases (CVDs).
    explanation: >-
      States directly that the pathophysiological mechanism of anti-angiogenic
      hypertension is unresolved, which is the gap this discussion records.
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The exact molecular mechanisms underlying hypertension are unclear
    explanation: >-
      The AHA scientific statement independently characterises the molecular
      mechanism as unclear, confirming this is a field-level gap rather than a
      curation shortfall.
- discussion_id: vegfi_hypertension_as_efficacy_biomarker
  prompt: >-
    Is treatment-emergent hypertension a usable pharmacodynamic biomarker of
    antitumour efficacy for VEGF pathway inhibitors, and if so does it warrant
    dose titration to a blood-pressure target?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Treatment-Emergent Hypertension
  rationale: >-
    Because the toxicity is on-target, a rise in blood pressure plausibly indexes
    the degree of VEGF pathway inhibition actually achieved in a given patient,
    and a growing literature associates it with better cancer outcomes. The
    curation risk is real in both directions: recording the association as
    established would license a dangerous clinical inference (tolerate or induce
    hypertension to improve response), while omitting it hides the main reason
    this toxicity is studied. Curated here as open, with the reported limitation
    that the supporting data are constrained by study number and by incomplete
    understanding of the mechanism.
  evidence:
  - reference: PMID:30706818
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension: Role of Hypertension as a Biomarker in Cancer Treatment."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      HTN may become a potential biomarker in clinical practice involving
      treating advanced cancers. However, data are currently limited by the
      number of studies and knowledge of the mechanism of action.
    explanation: >-
      Supports the biomarker proposition while explicitly qualifying it as
      data-limited, which is why this is curated as an open question rather than
      an asserted association.
  - reference: PMID:35179707
    reference_title: "VEGF Receptor Inhibitor-Induced Hypertension: Emerging Mechanisms and Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the growing body of literature associating VEGFRi-induced hypertension with
      antitumor efficacy are reviewed
    explanation: >-
      Confirms the efficacy association is an active and growing literature, the
      subject of this open question.
- discussion_id: vegfi_hypertension_management_evidence_gap
  prompt: >-
    Should management of VEGF-inhibitor-induced hypertension continue to follow
    general-population hypertension guidelines, or does the distinct mechanism
    and the risk of rebound hypotension after cancer-therapy withdrawal require
    oncology-specific targets and agent choices?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Treatment-Emergent Hypertension
  rationale: >-
    The module's treatments block records angiotensin system inhibitors and
    calcium channel blockers as first-line, but that recommendation is
    extrapolated from general hypertension guidelines rather than derived from
    trials in this population — and the extrapolation is not obviously safe,
    because blood pressure falls again when the culprit drug is stopped. This is
    the practical knowledge gap the seed review for this module (PMID:42405920)
    was written to highlight.
  evidence:
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis, management, and follow-up of cancer therapy-induced hypertension
      follow national hypertension guidelines because evidence-based clinical
      trials specifically addressing patients who develop hypertension as a
      result of cancer therapy are currently lacking.
    explanation: >-
      States the evidence gap precisely: management is guideline-extrapolated
      because population-specific trials do not exist.
  - reference: PMID:42405920
    reference_title: "Oncohypertension: Unraveling the Link Between Cancer and Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the absence of dedicated guidelines, we critically appraise current
      management strategies and propose a framework for individualized care.
    explanation: >-
      The seed review for this module confirms that dedicated management
      guidelines are still absent, corroborating the gap.

name: VEGF Inhibitor-Induced Hypertension Module
description: >-
  A conserved treatment-toxicity module representing the final common pathway by
  which inhibition of vascular endothelial growth factor (VEGF) signalling raises
  systemic blood pressure. The culprit agent varies — the anti-VEGF antibody
  bevacizumab, the VEGFR2 antibody ramucirumab, the VEGF trap aflibercept, and
  the VEGF signalling pathway (VSP) tyrosine kinase inhibitors sunitinib,
  sorafenib, axitinib, pazopanib, cediranib, lenvatinib, cabozantinib and
  anlotinib — but because every one of them removes the same tonic VEGFA-VEGFR2
  drive from the vascular endothelium, the downstream sequence repeatedly
  converges on loss of endothelial nitric oxide with oxidative stress,
  activation of the endothelin-1 system, microvascular rarefaction,
  vasoconstriction with a rise in peripheral vascular resistance, and
  treatment-emergent hypertension. This is a "side effect as mechanism" module in
  the same family as drug_induced_liver_injury, drug_induced_nephrotoxicity,
  myelosuppression and drug_hypersensitivity_scar: it captures
  adverse-drug-reaction pathophysiology shared across culprit drugs so that a
  drug-toxicity or cancer entry can declare conformance rather than re-deriving
  the chain.
  Deliberately scoped to the on-target antiangiogenic route to hypertension;
  other oncology routes to a raised blood pressure (proteasome inhibitors,
  corticosteroids, calcineurin inhibitors, androgen-deprivation therapy, and the
  hypertension of the underlying cancer or of renal impairment) are noted in the
  literature but are mechanistically distinct arms and are not modelled here.
category: Module
creation_date: "2026-08-08T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "vegf_inhibitor_hypertension#Vasoconstriction and Increased Peripheral Vascular
  Resistance"). Conforming nodes should substitute the drug-specific route to
  VEGF pathway blockade — ligand sequestration (bevacizumab, aflibercept),
  receptor-antibody blockade (ramucirumab), or intracellular VEGFR2 kinase
  inhibition (the VSP tyrosine kinase inhibitors) — while preserving the
  conserved pathway-inhibition -> endothelial NO deficit / endothelin-1
  activation / rarefaction -> vasoconstriction and raised resistance ->
  hypertension chain. The key conformance / central-effector target is
  "vegf_inhibitor_hypertension#Vasoconstriction and Increased Peripheral Vascular
  Resistance". Two framing guardrails curators must preserve. (1) The mechanism
  is NOT settled: the AHA scientific statement calls the exact molecular
  mechanisms unclear and the vascular-toxicity literature calls them elusive, so
  the three arms below are curated as complementary contributors rather than as
  one proven sequence — see the KNOWLEDGE_GAP discussion. (2) The toxicity is
  on-target, so raised blood pressure on a VSP inhibitor is reported as a
  candidate pharmacodynamic biomarker of antitumour efficacy; that association is
  recorded as an OPEN_QUESTION and must not be curated as an established
  prognostic claim. Related modules: tumor_angiogenesis models the VEGF axis as a
  cancer hallmark and is the therapeutic rationale this toxicity is the price of;
  drug_induced_nephrotoxicity covers the separate renal arm (proteinuria,
  thrombotic microangiopathy) of VEGF inhibition.
pathophysiology:
- name: VEGF Signaling Pathway Inhibition
  description: >-
    The conserved initiating lesion is pharmacological removal of tonic
    VEGFA-VEGFR2 signalling from the vascular endothelium. The route varies by
    agent — ligand sequestration by an anti-VEGF antibody or VEGF trap, receptor
    blockade by an anti-VEGFR2 antibody, or intracellular inhibition of the
    VEGFR2 kinase by a small-molecule tyrosine kinase inhibitor — but each
    silences the same receptor. Hypertension is the most common vascular toxicity
    of this drug class and is dose dependent, consistent with an on-target class
    effect rather than an idiosyncratic reaction.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor signaling pathway
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One of the most common side effects of these drugs is hypertension,
      especially in patients treated with vascular endothelial growth factor
      inhibitors, as well as tyrosine kinase inhibitors and proteasome
      inhibitors.
    explanation: >-
      Establishes VEGF inhibition as the leading anticancer-drug route to
      hypertension, the trigger this node captures. Evidence source is OTHER
      because this is a scientific statement / review.
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of TKI-induced HTN among the VEGF inhibitors ranges from 5 to
      80% and is dose dependent.
    explanation: >-
      Dose dependence across the VEGF-inhibitor class supports an on-target
      pathway-inhibition trigger rather than an agent-specific idiosyncrasy.
      Evidence source is OTHER because this is a review article.
  downstream:
  - target: Endothelial Nitric Oxide Deficiency and Oxidative Stress
    description: >-
      Loss of VEGFR2 drive withdraws the PI3K/Akt-eNOS stimulus that maintains
      endothelial nitric oxide production.
  - target: Endothelin-1 System Activation
    description: >-
      VEGF pathway blockade is accompanied by increased endothelin production and
      activation of the endothelin system.
  - target: Microvascular Rarefaction
    description: >-
      Withdrawal of the VEGF survival/angiogenic signal reduces microvessel
      density in peripheral vascular beds.
- name: Endothelial Nitric Oxide Deficiency and Oxidative Stress
  description: >-
    VEGFR2 signalling normally sustains endothelial nitric oxide synthase
    activity through PI3K/Akt and MAPK, so pathway blockade lowers endothelial
    nitric oxide production. The resulting loss of the dominant
    endothelium-derived vasodilator is compounded by oxidative stress, which
    further consumes available nitric oxide. This is the best-characterised of
    the module's three parallel amplifier arms.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: nitric oxide biosynthetic process
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:32990313
    reference_title: "Vascular toxicity associated with anti-angiogenic drugs."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inhibition of endothelial NO synthase (eNOS), reduced nitric oxide (NO)
      production, oxidative stress, activation of the endothelin system, and
      rarefaction have been implicated
    explanation: >-
      Names eNOS inhibition, reduced nitric oxide and oxidative stress among the
      implicated mechanisms of VEGF-inhibitor vascular toxicity, the amplifier
      captured here. Evidence source is OTHER because this is a review article.
  - reference: PMID:26386874
    reference_title: "Treatment of sunitinib-induced hypertension in solid tumor by nitric oxide donors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VEGF, mediated by PI3K/Akt and MAPK pathway, upregulates the endothelial
      nitric oxide synthase enzyme leading to up-regulation of NO production. So
      inhibition of signaling through the VEGF pathway would lead to a decrease
      in NO production, resulting in an increase in vascular resistance and blood
      pressure.
    explanation: >-
      Gives the molecular link from VEGFR2 signalling through PI3K/Akt to eNOS,
      and states that removing it lowers nitric oxide and raises vascular
      resistance — the mechanistic content of this node and its downstream edge.
      Evidence source is OTHER because this is a review article.
  downstream:
  - target: Vasoconstriction and Increased Peripheral Vascular Resistance
    description: >-
      Loss of nitric-oxide-mediated vasodilator tone shifts the vessel wall
      toward constriction and raises resistance.
- name: Endothelin-1 System Activation
  description: >-
    VEGF pathway blockade is accompanied by increased endothelin production and
    activation of the endothelin system. Endothelin-1 acting on smooth-muscle
    endothelin receptors is a potent vasoconstrictor, so this arm pushes the
    vessel wall toward constriction from the opposite direction to the nitric
    oxide deficit — a loss of vasodilator tone paired with a gain of
    vasoconstrictor tone.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:

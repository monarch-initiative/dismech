      Evidence source is OTHER because this is a narrative review.
  downstream:
  - target: Vasoconstriction and Increased Peripheral Vascular Resistance
    description: >-
      Loss of parallel microvascular conduits raises total peripheral resistance
      independently of vasomotor tone.
- name: Vasoconstriction and Increased Peripheral Vascular Resistance
  description: >-
    The three upstream arms — nitric oxide deficiency with oxidative stress,
    endothelin-1 system activation, and microvascular rarefaction — converge on a
    net shift of the peripheral circulation toward constriction and a rise in
    total peripheral vascular resistance. This is the central effector lesion and
    the key conformance target; conforming disorder nodes substitute the
    drug-specific route to VEGF blockade upstream but funnel through this step.

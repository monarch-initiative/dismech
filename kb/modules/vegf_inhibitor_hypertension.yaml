- name: Treatment-Emergent Hypertension
  description: >-
    The defining clinical consequence: a new or worsened elevation of systemic
    arterial blood pressure emerging on therapy. It is frequently dose limiting,
    it increases cardiovascular mortality in cancer survivors, and it is usually
    reversible after interruption or discontinuation of the culprit drug — the
    reversibility being a strong argument that the mechanism is on-target
    pharmacology rather than structural vascular damage.

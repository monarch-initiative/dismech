    term:
      id: GO:0001525
      label: angiogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:35179707
    reference_title: "VEGF Receptor Inhibitor-Induced Hypertension: Emerging Mechanisms and Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the potential role of microparticles, vascular smooth muscle cells,
      vascular stiffness, and microvessel rarefaction
    explanation: >-
      Identifies microvessel rarefaction among the mechanisms connecting
      endothelial dysfunction to VEGFR-inhibitor-induced hypertension, the
      effector captured here. Evidence source is OTHER because this is a review
      article.
  - reference: PMID:30706818
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension: Role of Hypertension as a Biomarker in Cancer Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These include nitric oxide decrease, a change in endothelin-1 levels and
      capillary rarefaction.
    explanation: >-
      Names capillary rarefaction as one of the three standing hypotheses for

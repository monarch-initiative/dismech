      label: endothelin receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:29931399
    reference_title: "Tyrosine Kinase Inhibitor-Induced Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of action involves VSP inhibition, leading to decreased
      nitric oxide and increased endothelin production, which causes
      vasoconstriction, capillary rarefaction, and hypertension.
    explanation: >-
      States the increased-endothelin arm explicitly and places it, alongside the
      nitric oxide deficit, upstream of vasoconstriction and hypertension.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:36621810
    reference_title: "Cancer Therapy-Related Hypertension: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      recent discoveries indicate an important role for reduced nitric oxide
      generation, oxidative stress, endothelin-1, prostaglandins, endothelial
      dysfunction, increased sympathetic outflow, and microvascular rarefaction
    explanation: >-
      Independently lists endothelin-1 among the mediators of cancer
      therapy-related hypertension. Evidence source is OTHER because this is a
      scientific statement / review.
  downstream:
  - target: Vasoconstriction and Increased Peripheral Vascular Resistance
    description: >-
      Endothelin-1 acting on vascular smooth muscle is a direct vasoconstrictor
      stimulus.
- name: Microvascular Rarefaction
  description: >-
    VEGF is a survival and maintenance signal for the microvasculature, so
    sustained pathway blockade reduces the density of functional capillaries and
    small vessels in peripheral beds. Rarefaction raises resistance structurally
    rather than by acute tone, which is consistent with the slower, sustained
    component of the blood-pressure rise and with its reversal after drug
    withdrawal.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:

name: cDC1 Tolerogenic Maturation Module
description: >-
  A conserved mechanism module for the erythropoietin-receptor (EPOR) switch that
  determines whether type 1 conventional dendritic cells (cDC1s) become tolerogenic or
  immunogenic after taking up cell-associated antigen. cDC1s are the antigen-presenting
  cells specialized in efferocytosis of dying cells and in cross-presenting the
  resulting cell-associated antigens; the direction of the T cell response they
  subsequently drive is not fixed by the antigen but by the maturational program the
  cDC1 enters. This module captures that program: efferocytic uptake of dying cells
  raises EPOR on cDC1s, EPO-EPOR signalling drives tolerogenic maturation towards a
  late-mature CCR7+ state with high integrin beta-8, integrin alpha-V beta-8 activates
  latent TGF-beta at the cDC1-T cell interface, and antigen-specific FOXP3+ regulatory T
  cells are induced and expanded while CD8+ cross-priming is restrained. The same chain
  is beneficial in transplantation and autoimmunity (donor-specific tolerance, restraint
  of self-reactivity) and detrimental in cancer (tumour-antigen-specific tolerance,
  intratumoural Treg accumulation, blunted anti-tumour CD8+ T cell immunity), which is
  why it is factored out as one module rather than curated separately in each disease
  context. Conforming disorder entries substitute the context-specific dying-cell source
  (irradiated lymphocytes after total lymphoid irradiation, apoptotic tumour cells in
  the tumour microenvironment, apoptotic cells in peripheral tissue at homeostasis), the
  anatomical cDC1 compartment (splenic XCR1+CD8-alpha+ versus migratory XCR1+CD103+),
  and the antigen whose tolerance is at stake, while preserving the conserved
  EPOR-to-Treg causal chain.
category: Module
creation_date: "2026-08-17T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g. "cdc1_tolerogenic_maturation#Tolerogenic
  Maturation to CCR7+ Late-Mature cDC1s"). The key conformance target is that
  central_effector node — the disorder-agnostic, rate-limiting step every conformer
  funnels through.

  SPECIES SCOPE — READ BEFORE CONFORMING. The EPOR-cDC1 mechanism curated here is
  established entirely in mouse (conditional Epor, Itgb8 and MHCII deletion under
  Xcr1-Cre; Epor-tdTomato and Zbtb46-GFP reporters; allogeneic bone-marrow and
  heterotopic heart transplantation; B16F10-OVA and MC38-OVA tumours). The clinical
  total lymphoid irradiation / anti-thymocyte globulin regimen that motivates the
  model is used in human kidney transplantation, but no step of the EPOR-dependent
  chain has been demonstrated in human cDC1s. Do not curate a human disorder node as
  conforming to this module on the strength of this evidence alone; see the
  HUMAN_MODEL_MISMATCH discussion. A conforming node in a human disease entry needs
  its own human-derived evidence, or should be curated as a mechanistic_hypothesis
  with EMERGING status rather than as an asserted mechanism.

  Positive conformance to the central effector requires more than "a dendritic cell
  matured". It requires (i) cDC1 lineage specifically — not cDC2, plasmacytoid DC, or
  monocyte-derived DC, since EPOR responsiveness is cDC1-restricted in this system;
  (ii) uptake of cell-associated (dying-cell) antigen rather than soluble or microbial
  antigen; and (iii) a tolerogenic outcome — antigen-specific FOXP3+ Treg induction or
  demonstrated restraint of antigen-specific priming. CCR7 upregulation alone is not
  sufficient: CCR7+ maturation is the shared gateway to BOTH the tolerogenic and the
  immunogenic program, which is precisely the point of the EPOR switch, so a CCR7+
  mregDC-like node without a tolerogenic readout does not conform.

  Disorder-specific substitutions conforming entries make: the dying-cell source
  (irradiated apoptotic lymphocytes; apoptotic tumour cells; homeostatic apoptotic
  cells in skin, lung or brain); the cDC1 compartment (splenic XCR1+CD8-alpha+ versus
  peripheral-lymph-node migratory XCR1+CD103+, which preferentially expresses EPOR);
  and the tolerated antigen (donor alloantigen, tumour antigen, self antigen).

  Relationship to neighbouring modules. This is NOT a duplicate of
  immune_checkpoint_blockade, which models the tumour-cell-intrinsic adaptive immune
  resistance arm (PD-L1 upregulation, T cell exhaustion); this module models the
  antigen-presenting-cell-intrinsic arm upstream of it, and a tumour entry may
  reasonably conform to both. It is likewise distinct from tumor_promoting_inflammation
  (myeloid inflammatory microenvironment, not cDC1 maturational state). The Aldh1a2 /
  retinoic-acid route to Treg induction is deliberately NOT curated as part of the
  chain: cDC1-restricted Aldh1a2 deletion did not impair chimerism or donor-specific
  Treg induction in this system, so integrin beta-8 rather than retinoic acid is the
  EPOR-controlled effector here.
pathophysiology:
- name: Efferocytic Uptake of Cell-Associated Antigen by cDC1s
  description: >-
    cDC1s take up dying cells and their associated antigens by efferocytosis. This is
    the lineage-defining function that puts cDC1s in a position to determine the fate
    of responses to cell-associated (as opposed to soluble or microbial) antigen. The
    dying-cell source is what conforming disorder entries substitute: apoptotic
    lymphocytes generated by lymphodepleting conditioning, apoptotic tumour cells in
    the tumour microenvironment, or apoptotic cells cleared at homeostasis in
    peripheral tissue. Efferocytic load, together with circulating EPO, sets both the
    fraction of cDC1s expressing EPOR and the intensity of that expression, so this
    node is the input that scales the whole chain rather than a mere prerequisite.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Type 1 conventional dendritic cell (cDC1)
    term:
      id: CL:0000990
      label: conventional dendritic cell
  biological_processes:
  - preferred_term: Apoptotic Cell Clearance (Efferocytosis)
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: INCREASED
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNA–seq and Gene Ontology (GO) analysis of XCR1+CD8α+ cDC1s after TLI/ATS
      revealed upregulation of genes involved in phagocytosis, apoptotic cell
      clearance, erythropoiesis, and myeloid cell migration
    explanation: >-
      Transcriptional profiling of splenic cDC1s after lymphodepleting conditioning
      shows coordinated upregulation of the efferocytosis and erythropoiesis programs,
      establishing dying-cell uptake as the input state of this chain.
  downstream:
  - target: EPO-EPOR Signalling in cDC1s
    description: >-
      Efferocytosis of dying cells upregulates EPOR on cDC1s, licensing them to
      respond to erythropoietin.

- name: EPO-EPOR Signalling in cDC1s
  description: >-
    Erythropoietin receptor expressed on cDC1s binds erythropoietin and activates the
    AKT-mTOR, ERK and STAT5 cascades. This is the switch node of the module: EPOR is
    not a marker of a distinct cDC1 subset but a transcriptional program that cDC1s
    across the maturational continuum can enter, and its signalling output determines
    which maturational program follows. Responsiveness is cDC1-restricted — cDC2s in
    the same tissue show minimal pathway activation — which is why conformance
    requires cDC1 lineage specifically. Both ligand availability (circulating EPO,
    which rises with lymphodepleting conditioning and with tumour burden) and receptor
    abundance (driven by efferocytic load) are rate-setting, so the node is
    manipulable from either side; this is the basis of the treatment pattern below.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Erythropoietin Receptor Signalling in cDC1s
    term:
      id: GO:0038162
      label: erythropoietin-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the erythropoietin receptor (EPOR) acts as a critical switch
      that determines the tolerogenic function of cDC1s and the threshold of
      antigen-specific T cell responses.
    explanation: >-
      States the central claim of the module: EPOR is the switch setting cDC1
      tolerogenic function and the threshold of antigen-specific T cell responses.
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      increased phosphorylation of Akt, Erk, Stat5, S6, and 4E-BP1 (Extended Data Fig.
      3d), with minimal activation in cDC2s
    explanation: >-
      Identifies the downstream signalling cascades engaged by EPOR in cDC1s and
      establishes the cDC1-restricted responsiveness that gates conformance.
  downstream:
  - target: Tolerogenic Maturation to CCR7+ Late-Mature cDC1s
    description: >-
      EPOR signalling drives efferocytosis-induced tolerogenic maturation towards the
      late-mature CCR7+ state.
  - target: Immunogenic cDC1 Maturation and Enhanced T Cell Priming
    description: >-
      The reciprocal branch: when EPOR signalling is absent, the same efferocytic
      cDC1s mature along an immunogenic rather than a tolerogenic route.

- name: Tolerogenic Maturation to CCR7+ Late-Mature cDC1s
  description: >-
    Under EPOR signalling, efferocytic cDC1s progress along the maturational continuum
    to a late-mature CCR7+ state carrying a regulatory rather than a stimulatory
    program: increased integrin beta-8 (Itgb8), TGF-beta1, CCL22 and PD-L1 (Cd274),
    increased tolerance-associated genes, and reduced cross-presentation capacity.
    This is the key conformance target — the disorder-agnostic, rate-limiting step
    that every conforming disease funnels through, whatever the dying-cell source or
    anatomical compartment. Loss of EPOR both reduces the proportion of cells reaching
    this state and strips the regulatory program from the cells that do, so the node
    is defined by the program and not by CCR7 positivity alone. CCR7 upregulation is
    the shared gateway to the immunogenic route as well; a CCR7+ mregDC-like node
    without a tolerogenic readout does not conform.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CCR7+ late-mature tolerogenic cDC1
    term:
      id: CL:0000841
      label: mature conventional dendritic cell
  biological_processes:
  - preferred_term: Late-Mature cDC1 Differentiation
    term:
      id: GO:0097029
      label: mature conventional dendritic cell differentiation
    modifier: INCREASED
  - preferred_term: Cross-Presentation of Cell-Associated Antigen
    term:
      id: GO:0042590
      label: antigen processing and presentation of exogenous peptide antigen via MHC
        class I
    modifier: DECREASED
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      of splenic cDC1s towards late-stage CCR7+ cDC1s characterized by increased
      expression of the integrin β8 gene
    explanation: >-
      States the maturational endpoint of EPOR signalling and its defining molecular
      feature, integrin beta-8 upregulation, which is the effector carried by the next
      node.
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      towards late mature stage CCR7+ cDC1s and demonstrate that integrin β8, but not
      Aldh1a2, is a critical tolerogenic downstream mediator under EpoR control in
      TLI/ATS-induced tolerance
    explanation: >-
      Establishes integrin beta-8 rather than Aldh1a2/retinoic acid as the
      EPOR-controlled tolerogenic effector, which is why the retinoic-acid route is
      deliberately excluded from this module's chain.
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Migratory cDC1s in peripheral lymph nodes preferentially express EPOR, and their
      FOXP3+ Treg cell-inducing capacity is enhanced by erythropoietin.
    explanation: >-
      Extends the node beyond the splenic compartment: migratory cDC1s in peripheral
      lymph nodes carry the same EPOR-dependent tolerogenic capacity, supporting the
      compartment substitution conforming entries make.
  downstream:
  - target: Integrin alpha-V beta-8-Dependent Latent TGF-beta Activation
    description: >-
      The late-mature CCR7+ state carries high integrin beta-8, the effector through
      which it acts on responding T cells.

- name: Integrin alpha-V beta-8-Dependent Latent TGF-beta Activation
  description: >-
    Integrin alpha-V beta-8 on late-mature CCR7+ cDC1s binds the latency-associated
    peptide of latent TGF-beta and converts it to active TGF-beta at the cDC1-T cell
    interface. This makes TGF-beta availability local and contact-dependent rather
    than a diffuse cytokine signal, which is how an antigen-presenting cell can impose
    a regulatory fate specifically on the T cells it is engaging. cDC1-restricted
    deletion of Itgb8 reproduces the Treg-induction defect seen on loss of EPOR,
    placing integrin beta-8 causally downstream of the switch rather than merely
    correlated with it — though the resulting impairment of chimerism is less complete
    than with EPOR deletion, indicating integrin beta-8 carries much but not all of
    the EPOR effect.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Activation of Latent TGF-beta at the cDC1-T Cell Interface
    term:
      id: GO:0030511
      label: positive regulation of transforming growth factor beta receptor signaling
        pathway
    modifier: INCREASED
  molecular_functions:
  - preferred_term: Latent TGF-beta Binding by Integrin alpha-V beta-8
    term:
      id: GO:0050431
      label: transforming growth factor beta binding
    modifier: INCREASED
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      αvβ8 contributes to peripheral Treg differentiation due to its ability to
      activate latent TGFβ
    explanation: >-
      States the molecular function of integrin alpha-V beta-8 that this node models:
      activation of latent TGF-beta driving peripheral Treg differentiation.
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      14 days after allo-BM infusion, Treg frequencies increased in control mice but
      markedly decreased in Itgb8ΔXcr1 mice
    explanation: >-
      cDC1-restricted Itgb8 deletion phenocopies the Treg-induction defect of EPOR
      deletion, placing integrin beta-8 causally downstream of the EPOR switch.
  downstream:
  - target: Antigen-Specific FOXP3+ Treg Induction and Restrained T Cell Priming
    description: >-
      Locally activated TGF-beta drives naive antigen-specific CD4+ T cells to a
      FOXP3+ regulatory fate and supports expansion of preexisting Tregs.

- name: Antigen-Specific FOXP3+ Treg Induction and Restrained T Cell Priming
  description: >-
    The terminal state of the tolerogenic arm: antigen-specific CD4+FOXP3+ regulatory
    T cells are induced from naive precursors and preexisting Tregs are expanded,
    while CD8+ cross-priming and CD4+ priming against the same cell-associated antigen
    are held below threshold. The tolerance is antigen-specific rather than global
    immunosuppression, and it operates even at homeostatic EPO levels. Whether this
    outcome is beneficial or harmful is entirely context-dependent and is the reason
    the module serves opposite clinical goals: in transplantation and autoimmunity it
    is durable donor-specific or self-antigen-specific tolerance; in cancer it is
    tumour-antigen-specific tolerance with intratumoural Treg accumulation and blunted
    anti-tumour CD8+ T cell immunity. Conforming entries name the antigen and state
    which of these two readings applies.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Antigen-specific CD4+FOXP3+ regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: Induction of Antigen-Specific FOXP3+ Tregs
    term:
      id: GO:0045591
      label: positive regulation of regulatory T cell differentiation
    modifier: INCREASED
  - preferred_term: Peripheral T Cell Tolerance to Cell-Associated Antigen
    term:
      id: GO:0002458
      label: peripheral T cell tolerance induction
    modifier: INCREASED
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cDC1s upregulate EPOR expression, and conditional knockout of EPOR in cDC1s
      diminishes antigen-specific induction and expansion of FOXP3+ regulatory T (Treg)
      cells, resulting in allograft rejection
    explanation: >-
      Establishes the terminal readout of the tolerogenic arm and its clinical
      consequence: loss of cDC1 EPOR abolishes antigen-specific Treg induction and
      expansion, and tolerance fails.
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      even at low homeostatic EPO levels, cDC1-EpoR limits both CD8+ T cell
      cross-priming and CD4+ T cell priming in response to cell-associated Ags
    explanation: >-
      Establishes the second half of the terminal state — restraint of antigen-specific
      priming — and that it operates at homeostatic EPO levels, not only under
      conditioning.

- name: Immunogenic cDC1 Maturation and Enhanced T Cell Priming
  description: >-
    The reciprocal branch of the switch, and the reason EPOR is described as a switch
    rather than an amplifier. When EPOR signalling is absent, efferocytic cDC1s do not
    simply fail to become tolerogenic — they mature along an actively immunogenic
    route, upregulating MHC class II- and class I-mediated antigen presentation,
    cross-presentation and costimulation (CD40, CD80, CD86) while downregulating
    PD-L1. In tumours this branch increases generation of precursor exhausted
    tumour-antigen-specific CD8+ T cells in tumour-draining lymph nodes, supports
    their maintenance intratumourally, reduces intratumoural Tregs, restrains tumour
    growth and improves the efficacy of PD-1 blockade. This node is curated as the
    mechanistic rationale for the tolerance-breaking treatment pattern below; it is
    reached experimentally by cDC1-restricted EPOR deletion, so a disorder node should
    conform to it only where an equivalent loss-of-EPOR state is actually
    demonstrated, not merely where cDC1s appear immunogenic.
  role: adaptive_escape
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Immunogenically matured cDC1
    term:
      id: CL:0000841
      label: mature conventional dendritic cell
  biological_processes:
  - preferred_term: MHC Class II-Mediated Antigen Presentation by cDC1s
    term:
      id: GO:0019886
      label: antigen processing and presentation of exogenous peptide antigen via MHC
        class II
    modifier: INCREASED
  - preferred_term: Cross-Presentation of Cell-Associated Antigen
    term:
      id: GO:0042590
      label: antigen processing and presentation of exogenous peptide antigen via MHC
        class I
    modifier: INCREASED
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reciprocally, loss of EPOR enables immunogenic maturation of peripheral lymph
      node migratory and splenic CCR7+ cDC1s by upregulating genes involved in MHC
      class II- and class I-mediated antigen presentation, cross-presentation and
      costimulation.
    explanation: >-
      States the reciprocal branch directly: EPOR loss does not merely remove
      tolerogenic maturation but enables an immunogenic maturational program at both
      anatomical sites.
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      EPOR deficiency in cDC1s reduces tumour growth by enhancing anti-tumour T cell
      immunity, particularly increasing the generation of precursor exhausted tumour
      antigen-specific CD8+ T cells
    explanation: >-
      Establishes the anti-tumour consequence of the immunogenic branch, which is the
      rationale for the tolerance-breaking treatment pattern.
treatments:
- name: Erythropoietin as a cDC1 Tolerogenic Agonist
  description: >-
    The tolerance-inducing arm of the module's drug-target pattern. Exogenous
    erythropoietin acts on the EPOR switch node to amplify cDC1 tolerogenic maturation
    and increase antigen-specific FOXP3+ Treg induction, including by cDC1s that were
    EPOR-low at baseline. The effect is strictly cDC1-EPOR-dependent: it is abolished
    when EPOR is deleted from cDC1s, so it is a mechanism-specific action and not a
    general consequence of erythropoiesis. This is a preclinical (mouse) drug-target
    pattern demonstrating the node is pharmacologically addressable — it is NOT a
    treatment recommendation, and conforming disorders do not inherit it as one.
    Recombinant erythropoietin is an approved drug for anaemia, but its use as a
    tolerogenic agent in transplantation or autoimmunity is not established in humans
    and would carry the known thrombotic and tumour-progression safety concerns of
    erythropoiesis-stimulating agents.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant erythropoietin
      term:
        id: NCIT:C477
        label: Recombinant Erythropoietin
  target_mechanisms:
  - target: EPO-EPOR Signalling in cDC1s
    treatment_effect: ACTIVATES
    description: >-
      Ligand supply to the switch node, increasing tolerogenic maturation and
      antigen-specific Treg induction by cDC1s.
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      EpoR+ cDC1s generated more Ag-specific FOXP3+ Tregs than EpoR− cDC1s, which was
      further enhanced by EPO
    explanation: >-
      Exogenous EPO acting on the EPOR node increases antigen-specific FOXP3+ Treg
      induction by cDC1s, validating the node as a pharmacologically addressable
      tolerogenic target.
- name: cDC1 EPOR Blockade as a Tolerance-Breaking Strategy
  description: >-
    The tolerance-breaking arm of the same drug-target pattern, and the conceptual
    inverse of the agonist above. Removing EPOR signalling from cDC1s shifts them to the
    immunogenic branch, restraining tumour growth, increasing tumour-antigen-specific
    precursor exhausted CD8+ T cells in tumour-draining lymph nodes, reducing
    intratumoural Tregs and improving the efficacy of PD-1 blockade. This is a genetic
    proof of concept in mouse — cDC1-restricted Epor deletion — not an agent. No
    cDC1-selective EPOR antagonist exists, and systemic EPOR blockade would not be
    equivalent: EPOR is the erythropoiesis receptor, and the therapeutic proposition
    depends on cDC1 selectivity that has not been demonstrated. Curate this as a target
    rationale, never as an available treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: investigational cDC1 EPOR blockade
  target_mechanisms:
  - target: EPO-EPOR Signalling in cDC1s
    treatment_effect: INHIBITS
    description: >-
      Removing EPOR signalling from cDC1s diverts them from the tolerogenic to the
      immunogenic maturational branch, lifting the restraint on antigen-specific CD8+
      T cell priming.
  evidence:
  - reference: PMID:41372415
    reference_title: "Erythropoietin receptor on cDC1s dictates immune tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Targeting EPOR on cDC1s to induce or inhibit T cell immune tolerance could have
      potential for treating a variety of diseases.
    explanation: >-
      States the bidirectional therapeutic proposition — agonism to induce tolerance,
      antagonism to break it — that the two treatment entries in this module encode.
discussions:
- discussion_id: human_model_mismatch_cdc1_epor_switch
  prompt: >-
    Does the EPOR switch govern tolerogenic maturation of human cDC1s, or is it a
    mouse-specific feature of the systems in which it was discovered?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#EPO-EPOR Signalling in cDC1s
  - pathophysiology#Tolerogenic Maturation to CCR7+ Late-Mature cDC1s
  rationale: >-
    Every causal step in this module rests on mouse genetics — conditional Epor, Itgb8
    and H2-Ab1 deletion under Xcr1-Cre, Epor-tdTomato and Zbtb46-GFP reporters,
    allogeneic bone-marrow and heterotopic heart transplantation, and transplantable
    B16F10-OVA and MC38-OVA tumours. The translational pull is real: the total lymphoid
    irradiation plus anti-thymocyte globulin regimen that frames the model is used in
    human kidney transplantation to achieve mixed chimerism and drug-free tolerance, and
    erythropoiesis-stimulating agents are widely used in humans, so a human counterpart
    of this mechanism would have immediate clinical consequences in both directions.
    But the pull is not evidence. Mouse and human cDC1s are identified by different
    surface programs (mouse XCR1+CD8-alpha+ or CD103+; human CD141/BDCA-3+), and EPOR
    expression on human cDC1s, its regulation by efferocytosis, and its control of
    ITGB8 have not been shown. This matters for curation because the mismatch is not a
    question of effect size but of whether the switch exists at all in humans; a human
    disease entry asserting conformance would be importing an unverified species
    assumption into an otherwise evidence-backed graph.
  proposed_experiments:
  - experiment_id: exp_cdc1_epor_human_expression_efferocytosis
    name: EPOR expression and efferocytosis-dependence on human cDC1s
    description: >-
      Quantify EPOR protein and transcript on human CD141+ cDC1s sorted from blood,
      peripheral lymph node and tumour tissue, and test whether efferocytosis of
      apoptotic cells upregulates it, as it does in mouse.
  - experiment_id: exp_cdc1_epor_human_treg_induction_itgb8
    name: EPO-dependence of human cDC1 Treg induction and ITGB8 induction
    description: >-
      Co-culture human CD141+ cDC1s loaded with apoptotic cell-associated antigen with
      autologous naive CD4+ T cells with and without erythropoietin, reading out
      antigen-specific FOXP3+ Treg induction and cDC1 ITGB8 upregulation, with EPOR
      blockade or knockdown as the specificity control.
- discussion_id: knowledge_gap_esa_exposure_and_cdc1_tolerance
  prompt: >-
    Does therapeutic erythropoiesis-stimulating agent exposure in patients alter cDC1
    tolerogenic programming, and could that contribute to outcomes in transplantation
    or oncology?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#EPO-EPOR Signalling in cDC1s
  - pathophysiology#Antigen-Specific FOXP3+ Treg Induction and Restrained T Cell Priming
  rationale: >-
    If the switch operates in humans, then erythropoiesis-stimulating agents — given
    routinely for anaemia of chronic kidney disease, in transplant recipients, and in
    oncology — would be acting on it as an unintended pharmacology, in the tolerogenic
    direction. That predicts opposite-signed effects in the two settings where these
    agents are most used: potentially favourable for graft tolerance, potentially
    unfavourable for anti-tumour immunity. This is stated here as an open question and
    explicitly NOT as a curated mechanism. The source study neither administered these
    agents to patients nor examined human tumour outcomes, and the existing clinical
    safety literature on erythropoiesis-stimulating agents and tumour progression was
    generated without reference to cDC1 biology and has its own confounding; connecting
    the two would require evidence that does not yet exist. Curators should not cite
    this module as support for a mechanistic claim about erythropoiesis-stimulating
    agent safety.
  proposed_experiments:
  - experiment_id: exp_cdc1_phenotype_esa_exposed_patients
    name: cDC1 phenotype in patients on erythropoiesis-stimulating agents
    description: >-
      Compare EPOR expression, CCR7+ maturational state and ITGB8 on circulating and
      tissue cDC1s between patients receiving erythropoiesis-stimulating agents and
      matched unexposed controls, within a single indication to control for the
      underlying anaemia.

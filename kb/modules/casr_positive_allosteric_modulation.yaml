name: Calcium-Sensing Receptor Positive Allosteric Modulation Module
description: 'Pharmacological sensitisation of the calcium-sensing receptor on the parathyroid chief cell,
  and the hormone-suppression chain it drives. A calcimimetic binds the receptor allosterically rather
  than at the calcium site, which raises the receptor''s sensitivity to the extracellular calcium already
  present; the sensitised receptor suppresses parathyroid hormone secretion, and circulating parathyroid
  hormone, calcium and phosphate fall. The key conformance target is the central effector, "Suppression
  of Parathyroid Hormone Secretion". A disease entry that models the drug rather than the mechanism should
  instead conform at the trigger, "Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor".
  The module is scoped to positive modulation: calcilytics are negative allosteric modulators of the same
  receptor and would be a separate module by the project rule that one receptor family plus one direction
  of pharmacological action makes one module. It is deliberately not scoped to an indication, and its
  conformers span the three different reasons parathyroid hormone is excessive - reduced renal calcium
  and vitamin D handling in chronic kidney disease, an inactivating receptor variant in familial hypocalciuric
  hypercalcaemia, and autonomous parathyroid tissue in hyperplasia and carcinoma - because the drug acts
  at the same receptor on the same cell in all of them. Unlike the airway modules in this family it is
  not tissue-scoped, because the parathyroid chief cell is where the therapeutic action is in every one
  of those settings.'
category: Module
module_categories:
- PHARMACOLOGY
- METABOLISM
creation_date: '2026-10-29T13:00:00Z'
notes: 'Two deliberate omissions, both about terms that do not exist rather than steps that are unclear.
  GO has no calcium-sensing receptor activity term: searching OLS go for ''calcium-sensing receptor activity''
  returns two calcium channel activities (GO:0005220 and GO:0005219) and nothing for the receptor, and
  ''extracellular calcium ion sensing'' returns nothing at all, so the trigger sits on the generic GO:0004930
  G protein-coupled receptor activity and the receptor identity is carried by the CASR gene binding (hgnc:1514)
  instead. And no transducer is bound. The calcium-sensing receptor does couple through Gq/11 and phospholipase
  C, but none of the abstracts cited here states that step, and binding GO terms for a chain no cited
  source names is the defect this module was written to avoid; the sensitisation node therefore carries
  no process term and says what the sources do say, which is that the drug raises the receptor''s sensitivity
  to extracellular calcium. Whoever sources the coupling can add it. The module is grounded on two drugs,
  not one. Cinacalcet is the small molecule and etelcalcetide the intravenous peptide; PMID:29534286 is
  cited for the sensitisation step precisely because it states the mechanism for etelcalcetide and names
  the chief cell, so the module is not a cinacalcet module. Hypocalcaemia is modelled as a consequence
  arm rather than as an adverse-effect aside, because it is the same mechanism read at the organism scale:
  suppressing parathyroid hormone lowers serum calcium, and in the cited haemodialysis cohort two thirds
  of patients initiating cinacalcet became hypocalcaemic. That source also reports it was mostly asymptomatic
  and transient, which is quoted on the node so the arm is not read as a stronger safety claim than the
  source makes. The treatment block sets therapeutic_modality to SMALL_MOLECULE, which describes cinacalcet; the slot is single-valued and etelcalcetide is a peptide, so that value names the oral drug rather than the whole class. Parathyroid cell proliferation is not modelled. Calcimimetics are reported to affect parathyroid
  hyperplasia as well as secretion, but no abstract cited here establishes it, so there is no node for
  it. Five conformers are wired: CKD-Mineral_Bone_Disorder, Familial_Hypocalciuric_Hypercalcemia_1 and
  _2, Parathyroid_Gland_Carcinoma and Parathyroid_Hyperplasia. They span reduced renal handling, an
  inactivating receptor or G-protein variant, autonomous malignant tissue and autonomous hyperplastic
  tissue, which is what makes the module indication-independent. Two further entries name a calcimimetic
  and are deliberately not wired. Multiple_Endocrine_Neoplasia_Type_1 has no calcimimetic treatment to
  wire: the drug is named only inside a parathyroidectomy treatment, which binds no agent of its own.
  Autosomal_Recessive_Hypophosphatemic_Rickets_1 records a single adjunctive course in one adult that was
  stopped because higher doses were not tolerated, and the entry says explicitly that it does not
  establish routine efficacy; wiring it would present an abandoned single-patient trial as a therapeutic
  mechanism of that disease. The autosomal dominant hypocalcaemia entries are NOT conformers and must not be wired here: they are
  caused by activating receptor variants, so a calcimimetic is the wrong direction of action and those
  entries mention it as a thing to avoid. A calcilytic module, if one is ever written, is where they would
  belong.'
pathophysiology:
- name: Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor
  role: trigger
  biological_scale: MOLECULAR
  description: A calcimimetic occupies an allosteric site on the calcium-sensing receptor of the parathyroid
    chief cell. The receptor is a G protein-coupled receptor whose physiological ligand is an inorganic
    ion rather than a molecule, which is why the drugs act allosterically rather than at the orthosteric
    site.
  molecular_functions:
  - preferred_term: calcium-sensing receptor activity
    modifier: INCREASED
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  genes:
  - preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  evidence:
  - reference: PMID:29680147
    reference_title: Discovery and Development of Calcimimetic and Calcilytic Compounds.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: The extracellular calcium receptor (CaR) is a G protein-coupled receptor (GPCR) and the pivotal
      molecule regulating systemic Ca2+ homeostasis
    explanation: Establishes that the receptor this node binds is a G protein-coupled receptor, which
      is what the generic GO:0004930 binding asserts.
  - reference: PMID:29680147
    reference_title: Discovery and Development of Calcimimetic and Calcilytic Compounds.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Calcimimetics are agonists or positive allosteric modulators of the CaR
    explanation: Names the drug class and the direction of action this module is scoped to, and distinguishes
      it from the calcilytics the same review covers.
  downstream:
  - target: Increased Receptor Sensitivity to Extracellular Calcium
    causal_link_type: DIRECT
    description: Allosteric occupancy raises the receptor's responsiveness to the extracellular calcium
      already present, rather than supplying an agonist of its own. This is what makes the class modulators
      rather than agonists.
    evidence:
    - reference: PMID:31424183
      reference_title: A Multi-Compartment Model Capturing the Pharmacokinetics of the Calcimimetic Cinacalcet.
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: BACKGROUND
      snippet: This condition is widely treated by calcimimetics like cinacalcet which act by allosteric
        activation of the calcium sensing receptor
      explanation: States that the class acts by allosteric activation of this receptor, which is the
        step this edge asserts.
- name: Increased Receptor Sensitivity to Extracellular Calcium
  role: amplifier
  biological_scale: MOLECULAR
  description: 'The sensitised receptor responds to a lower extracellular calcium concentration than it
    otherwise would, which shifts the set-point of the gland''s calcium-sensing step downward. No transducer
    is bound here: see the module notes on why the Gq/phospholipase C coupling is deliberately not asserted.'
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  evidence:
  - reference: PMID:29534286
    reference_title: Clinical Pharmacokinetics and Pharmacodynamics of Etelcalcetide, a Novel Calcimimetic
      for Treatment of Secondary Hyperparathyroidism in Patients With Chronic Kidney Disease on Hemodialysis.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Etelcalcetide binds the calcium-sensing receptor and increases its sensitivity to extracellular
      calcium, thereby decreasing secretion of parathyroid hormone (PTH) by chief cells
    explanation: States the sensitisation this node represents, names the chief cell, and carries the
      step to the next node in one sentence.
  - reference: PMID:25498383
    reference_title: 'Calcium-sensing receptor activation in chronic kidney disease: effects beyond parathyroid
      hormone control.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: By enhancing CaSR sensitivity for plasma extracellular calcium (Ca(2+)0), cinacalcet reduces
      serum parathyroid hormone, Ca(2+)0, and serum inorganic phosphorous concentrations
    explanation: Independent statement of the same sensitisation step for the other drug in the class,
      carrying it through to the circulating consequences.
  downstream:
  - target: Suppression of Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    description: The sensitised receptor suppresses secretion of the hormone by the chief cell.
    evidence:
    - reference: PMID:29534286
      reference_title: Clinical Pharmacokinetics and Pharmacodynamics of Etelcalcetide, a Novel Calcimimetic
        for Treatment of Secondary Hyperparathyroidism in Patients With Chronic Kidney Disease on Hemodialysis.
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: increases its sensitivity to extracellular calcium, thereby decreasing secretion of parathyroid
        hormone (PTH) by chief cells
      explanation: The cited sentence states the sensitisation and the fall in secretion as one causal
        step, which is this edge.
- name: Suppression of Parathyroid Hormone Secretion
  role: central_effector
  biological_scale: CELLULAR
  description: 'The chief cell releases less parathyroid hormone. This is the key conformance target:
    it is the rate-limiting step every conformer funnels through, whatever made the hormone excessive
    in the first place.'
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    modifier: DECREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  evidence:
  - reference: PMID:29534286
    reference_title: Clinical Pharmacokinetics and Pharmacodynamics of Etelcalcetide, a Novel Calcimimetic
      for Treatment of Secondary Hyperparathyroidism in Patients With Chronic Kidney Disease on Hemodialysis.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: thereby decreasing secretion of parathyroid hormone (PTH) by chief cells
    explanation: Names the suppressed secretion and the cell that performs it, which is exactly this node.
  - reference: PMID:29047366
    reference_title: 'The use of cinacalcet hinders the diagnosis of parathyroid carcinoma in a chronic
      dialysis patient: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: Cinacalcet can also suppress PTH secretion due to parathyroid carcinoma in the same way as
      it does for parathyroid hyperplasia in the uremic condition
    explanation: 'Supports this node being the indication-independent step: the same suppression is reported
      for autonomous carcinoma and for uraemic hyperplasia, which is why conformers span both.'
  downstream:
  - target: Lowered Circulating Parathyroid Hormone, Calcium and Phosphate
    causal_link_type: DIRECT
    description: Less hormone secreted means less in the circulation, and the calcium and phosphate it
      mobilises fall with it.
    evidence:
    - reference: PMID:25498383
      reference_title: 'Calcium-sensing receptor activation in chronic kidney disease: effects beyond
        parathyroid hormone control.'
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: cinacalcet reduces serum parathyroid hormone, Ca(2+)0, and serum inorganic phosphorous
        concentrations
      explanation: Names all three circulating quantities that fall, which is what this edge carries.
- name: Lowered Circulating Parathyroid Hormone, Calcium and Phosphate
  role: consequence
  biological_scale: ORGANISM
  description: Serum parathyroid hormone, calcium and phosphate all fall, and the high-turnover bone disease
    that excess parathyroid hormone drives improves with them.
  evidence:
  - reference: PMID:18397701
    reference_title: An assessment of cinacalcet HCl effects on bone histology in dialysis patients with
      secondary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Treatment with cinacalcet lowered PTH and reduced bone turnover and tissue fibrosis among
      most dialysis patients with biochemical evidence of sHPT
    explanation: Randomised placebo-controlled trial measuring both the fall in hormone and the bone response
      this node describes.
  downstream:
  - target: Hypocalcaemia
    causal_link_type: DIRECT
    description: 'The same mechanism read one step too far: suppressing the hormone that defends serum
      calcium lowers serum calcium below the normal range in a large fraction of treated patients.'
    evidence:
    - reference: PMID:31848883
      reference_title: 'Cinacalcet-induced hypocalcemia in a cohort of European haemodialysis patients:
        predictors, therapeutic approaches and outcomes.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: BACKGROUND
      snippet: Calcimimetic treatment of secondary hyperparathyroidism in chronic dialysis patients is
        often followed by hypocalcemia
      explanation: States the causal link from calcimimetic treatment to hypocalcaemia that this edge
        asserts.
- name: Hypocalcaemia
  role: consequence
  biological_scale: ORGANISM
  description: Serum calcium falls below the normal range. In the cited European haemodialysis cohort
    two thirds of patients starting cinacalcet became hypocalcaemic within a year, and the same source
    reports it was mostly asymptomatic and transient, so this node is the dose-limiting edge of the mechanism
    rather than a claim about harm.
  evidence:
  - reference: PMID:31848883
    reference_title: 'Cinacalcet-induced hypocalcemia in a cohort of European haemodialysis patients:
      predictors, therapeutic approaches and outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: 'Of 905 normocalcemic patients initiating cinacalcet, 67% developed hypocalcemia within
      12 months: 68% mild, 23% moderate, 9% severe.'
    explanation: Quantifies how often the suppression overshoots into frank hypocalcaemia in a real treated
      cohort, and how it is distributed by severity.
  - reference: PMID:31848883
    reference_title: 'Cinacalcet-induced hypocalcemia in a cohort of European haemodialysis patients:
      predictors, therapeutic approaches and outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Hypocalcemia was mostly asymptomatic, transient (with and without targeted intervention to
      correct it) and not associated with an increase in cardiovascular events or deaths
    explanation: The same cohort's finding on how the hypocalcaemia behaved, carried here so this node is
      read as the dose-limiting edge of the mechanism rather than as a claim about harm.
treatments:
- name: Calcimimetic Therapy
  description: A positive allosteric modulator of the calcium-sensing receptor, given to suppress parathyroid
    hormone secretion. Cinacalcet is the oral small molecule and etelcalcetide the intravenous peptide.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cinacalcet
      term:
        id: CHEBI:48390
        label: cinacalcet
    - preferred_term: etelcalcetide
      term:
        id: CHEBI:134700
        label: etelcalcetide
  target_mechanisms:
  - target: Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor
    treatment_effect: ACTIVATES
    description: The drug is what occupies the receptor, so it acts at the module's trigger. The relation
      to the nodes below is relief of hormone excess rather than causation, so no downstream edge is asserted
      from the treatment.
    evidence:
    - reference: PMID:29680147
      reference_title: Discovery and Development of Calcimimetic and Calcilytic Compounds.
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: Calcimimetics are agonists or positive allosteric modulators of the CaR
      explanation: Establishes that this drug class acts as a positive modulator at this receptor, which
        is the ACTIVATES link.

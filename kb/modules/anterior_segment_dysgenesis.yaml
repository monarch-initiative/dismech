      label: iris morphogenesis
    modifier: ABNORMAL
  - preferred_term: Trabecular meshwork development
    term:
      id: GO:0002930
      label: trabecular meshwork development
    modifier: ABNORMAL
  locations:
  - preferred_term: anterior segment of eyeball
    term:
      id: UBERON:0001801
      label: anterior segment of eyeball
  evidence:
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Data were synthesized across major ASD subtypes: aniridia,
      Axenfeld-Rieger anomaly, Peters anomaly, primary aphakia, and related
      entities.
    explanation: >-
      Supports the claim that these named entities are subtypes of one
      developmental process rather than unrelated malformations, which is what
      makes this node a shared conformance target. Evidence source is OTHER
      because this is a review.
  - reference: PMID:20568247
    reference_title: "Lmx1b is required for murine trabecular meshwork formation and for maintenance of corneal transparency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results indicate that Lmx1b is required in neural crest-derived
      periocular mesenchyme for formation of anterior segment tissues, including
      trabecular meshwork, a critical regulator of intraocular pressure.
    explanation: >-
      Shows a single transcription factor acting in the periocular mesenchyme to
      build multiple anterior segment tissues, and names the angle as one of
      them, which is the bundle claim this node makes.
  downstream:
  - target: Structural Anterior Segment Malformation
    causal_link_type: DIRECT
  - target: Maldeveloped Aqueous Outflow Pathway and Developmental Glaucoma
    causal_link_type: DIRECT

- name: Structural Anterior Segment Malformation
  description: >-
    The visible anatomical output, and a recurring bundle rather than a single
    sign: iris hypoplasia or near-absence, corectopia and polycoria, posterior
    embryotoxon, peripheral anterior synechiae bridging iris to cornea, central
    corneal opacity with a posterior stromal and endothelial defect, and lens
    anomalies from cataract to attachment to absence. Two or three of these
    co-occur in an individual patient far more often than chance, which is the
    diagnostic expression of their shared developmental origin. Foveal hypoplasia
    and nystagmus accompany the PAX6 forms because that gene's dose is also
    required posteriorly.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Eye development
    term:
      id: GO:0001654
      label: eye development
    modifier: ABNORMAL
  - preferred_term: Lens development in camera-type eye
    term:
      id: GO:0002088
      label: lens development in camera-type eye
    modifier: ABNORMAL
  locations:
  - preferred_term: iris
    term:
      id: UBERON:0001769
      label: iris
  - preferred_term: anterior segment of eyeball
    term:
      id: UBERON:0001801
      label: anterior segment of eyeball
  evidence:
  - reference: PMID:41455383
    reference_title: "[National protocol for the diagnosis and management of Axenfeld-Rieger syndrome: Summary for the primary care physician]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ocular manifestations include iris abnormalities, posterior embryotoxon,
      juvenile-onset glaucoma (a common complication), and dysgenesis of the
      iridocorneal angle with iridocorneal adhesions.
    explanation: >-
      Enumerates the co-occurring structural bundle this node asserts for one
      ASD entity - iris, embryotoxon, angle dysgenesis and adhesions together -
      alongside the glaucoma that follows. Evidence source is OTHER because this
      is a national diagnostic protocol review.
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aniridia classically presents with a bilateral congenital absence or
      malformation of the irides, foveal hypoplasia, and nystagmus, and patients
      tend to develop visually significant pre-senile cataracts and keratopathy.
    explanation: >-
      Documents the same bundling for the PAX6 form, including the posterior
      (foveal) component this node's description attributes to PAX6 dose.
      Evidence source is OTHER because this is a review.

- name: Maldeveloped Aqueous Outflow Pathway and Developmental Glaucoma
  description: >-
    The module's terminal consequence and its clinical point. Aqueous humour
    leaves the eye through the trabecular meshwork and Schlemm's canal, both
    built by the same periocular mesenchyme as the visible structures above; when
    that population fails, the outflow pathway is maldeveloped whether or not the
    angle was the obvious lesion. Intraocular pressure rises and a developmental
    glaucoma follows, with onset from birth to young adulthood depending on the
    residual outflow capacity. This node marks the seam to
    glaucoma_optic_neuropathy, which models what raised pressure does to retinal
    ganglion cells; that programme is not re-derived here, and a conforming
    disorder with glaucoma should declare conformance to both modules. It is
    also the reason ASD is a lifelong surveillance diagnosis rather than a
    static malformation: the malformation is fixed at birth, but the glaucoma
    that blinds is not.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  - preferred_term: Schlemm's canal endothelial cell
    term:
      id: CL:4033097
      label: Schlemm's canal endothelial cell
  biological_processes:
  - preferred_term: Trabecular meshwork development
    term:
      id: GO:0002930
      label: trabecular meshwork development
    modifier: DECREASED
  locations:
  - preferred_term: eye trabecular meshwork
    term:
      id: UBERON:0005969
      label: eye trabecular meshwork
  - preferred_term: canal of Schlemm
    term:
      id: UBERON:0004029
      label: canal of Schlemm
  evidence:
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These disorders frequently lead to developmental glaucoma, a major cause
      of childhood blindness.
    explanation: >-
      Establishes developmental glaucoma as the shared terminal consequence of
      the ASD spectrum and its clinical weight, which is the claim this node
      rests on. Evidence source is OTHER because this is a review.
  - reference: PMID:32353428
    reference_title: "AP-2beta is required for formation of the murine trabecular meshwork and Schlemm's canal."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is the first study to show that AP-2β is required for development and
      differentiation of the trabecular meshwork and Schlemm's canal.
    explanation: >-
      Provides the mechanistic link this node asserts between the crest-lineage
      lesion and the outflow structures specifically; the same study reports the
      resulting rise in intraocular pressure.

discussions:
- discussion_id: asd_glaucoma_risk_not_predicted_by_visible_malformation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can glaucoma risk and age of onset in anterior segment dysgenesis be
    predicted from the visible anterior segment malformation, or does it require
    direct assessment of the outflow pathway?
  attaches_to:
  - "pathophysiology#Maldeveloped Aqueous Outflow Pathway and Developmental Glaucoma"
  rationale: >-
    This module asserts that the outflow pathway is built by the same population
    as the visible structures, which predicts that angle involvement is present
    whether or not it is apparent. Clinically, glaucoma frequency differs sharply
    between subtypes and genes - reported in about a fifth of eyes in one large
    PAX6 aniridia series, but described as a common complication of
    Axenfeld-Rieger - and genotype-phenotype correlations are said to explain
    some of the variability in onset. Whether residual outflow capacity is
    measurable early enough to stratify surveillance, or whether the visible
    malformation is simply a poor proxy for it, is unresolved and directly
    determines how these children are followed.
  proposed_experiments:
  - experiment_id: asd_outflow_imaging_glaucoma_cohort
    name: Prospective angle imaging against glaucoma incidence in genotyped ASD
    description: >-
      Follow a genotyped ASD cohort from infancy with anterior segment optical
      coherence tomography quantifying trabecular meshwork and Schlemm's canal
      dimensions, testing whether measured outflow-pathway hypoplasia predicts
      subsequent glaucoma onset better than the visible iris and corneal
      phenotype or than genotype alone.

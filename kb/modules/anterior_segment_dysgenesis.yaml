    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: ABNORMAL
  - preferred_term: Neural crest cell development
    term:
      id: GO:0014032
      label: neural crest cell development
    modifier: ABNORMAL
  locations:
  - preferred_term: anterior segment of eyeball
    term:
      id: UBERON:0001801
      label: anterior segment of eyeball
  evidence:
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anterior Segment Dysgenesis (ASD) encompasses a heterogeneous group of
      congenital ocular malformations resulting from disrupted differentiation of
      neural crest-derived tissues.
    explanation: >-
      States the module's central premise: the shared mechanism across a
      clinically heterogeneous group is disrupted differentiation of one
      neural-crest-derived population. Evidence source is OTHER because this is
      a review.
  - reference: PMID:32353428
    reference_title: "AP-2beta is required for formation of the murine trabecular meshwork and Schlemm's canal."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      targeted loss of Tfap2b in neural crest cells (NCCs)1 and their
      derivatives, particularly the periocular mesenchyme (POM), resulted in
      anterior segment defects affecting the cornea and angle tissue
    explanation: >-
      Direct genetic evidence that a lesion confined to the neural crest lineage
      produces the multi-tissue anterior segment defect this node asserts,
      affecting cornea and angle together.
  downstream:
  - target: Failed Differentiation and Separation of Anterior Segment Tissues
    causal_link_type: DIRECT

- name: Failed Differentiation and Separation of Anterior Segment Tissues
  description: >-
    The rate-limiting, disorder-agnostic node and the module's key conformance
    target. Building the anterior segment requires each derivative to
    differentiate on schedule and to separate cleanly from its neighbours - the
    lens vesicle from the surface ectoderm, the iris from the cornea, the angle
    from the iris root. When the periocular mesenchyme programme fails, tissues
    that should have separated stay attached and tissues that should have
    differentiated remain rudimentary. The specific arrest point determines the
    clinical label, which is why the ASD entities are variations on one process
    rather than distinct diseases: an early lens-cornea separation failure reads
    as Peters anomaly, an angle and iris differentiation failure as
    Axenfeld-Rieger, a global iris and limbal failure as aniridia.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: corneal endothelial cell
    term:
      id: CL:0000132
      label: corneal endothelial cell
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367

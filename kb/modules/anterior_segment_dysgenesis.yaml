name: Anterior Segment Dysgenesis Module
description: >-
  A conserved developmental pathophysiology module for the anterior segment
  dysgenesis (ASD) spectrum - aniridia, Axenfeld-Rieger anomaly and syndrome,
  Peters anomaly, primary congenital glaucoma, primary aphakia and related
  entities. The cornea, iris stroma, iridocorneal angle, trabecular meshwork and
  Schlemm's canal are all built by a single migratory population, the
  neural-crest-derived periocular mesenchyme, working in reciprocal induction
  with the surface ectoderm and the optic cup. Because one population builds
  them all, a dose-sensitive lesion in the transcriptional programme that governs
  it (PAX6, PITX2, FOXC1, FOXE3, PITX3, LMX1B, TFAP2B) or in the extracellular
  machinery it depends on (CYP1B1, LTBP2, PXDN, B3GLCT) does not produce an
  isolated defect - it produces a recurring bundle across the anterior segment,
  with the corneoscleral angle affected whether or not the angle was the
  clinically obvious lesion. That is why the module's terminal consequence is
  not the visible malformation but the near-universal, sight-threatening
  developmental glaucoma that follows from a maldeveloped aqueous outflow
  pathway. This is the anterior-segment counterpart of the serial-homology
  modules: one lesion, one progenitor population, a predictable multi-tissue
  bundle.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "anterior_segment_dysgenesis#Failed Differentiation and Separation of Anterior
  Segment Tissues"). Gene substitutions a conforming trigger node makes: PAX6
  haploinsufficiency in aniridia; PITX2 and FOXC1 in Axenfeld-Rieger syndrome
  and anomaly (with PITX2 carrying the extraocular umbilical, dental and
  craniofacial features and FOXC1 more nearly ocular-restricted); CYP1B1 and
  LTBP2 in primary congenital glaucoma; FOXE3 and PITX3 in primary aphakia and
  anterior segment dysgenesis with lens involvement; B3GLCT in Peters plus
  syndrome; PXDN and GJA8 in corneal and lens-predominant forms.

  RELATION TO NEIGHBOURING MODULES. This module is deliberately NOT
  ocular_morphogenesis_failure, which models the earlier and more posterior
  events - eye field specification, optic vesicle and cup morphogenesis, optic
  fissure closure - and terminates in the anophthalmia-microphthalmia-coloboma
  spectrum. The two are sequential and a syndromic entry may conform to both,
  but the failure modelled here is of the periocular mesenchyme that invades an
  already-formed optic cup. Downstream, this module hands off to
  glaucoma_optic_neuropathy at its "Trabecular Meshwork Outflow Dysfunction"
  node: developmental glaucoma is what a maldeveloped outflow pathway produces,
  and the retinal ganglion cell death that follows is modelled there, not
  re-derived here. A conforming disorder with glaucoma should wire both. Lens
  opacity arising in an ASD disorder likewise belongs to
  cataract_lens_opacification.
pathophysiology:
- name: Anterior Segment Developmental Regulator Defect
  description: >-
    The initiating lesion is a variant in a dose-sensitive gene governing
    periocular mesenchyme specification, migration or differentiation, or in the
    extracellular machinery those cells act through. Most are transcription
    factors, and most act by haploinsufficiency rather than by a novel gain of
    function, which is why deletions and truncating variants dominate the
    reported spectrum and why phenotype often tracks residual dose. The lesion
    is expressed in a progenitor population, not in a finished tissue, so its
    consequences are fixed before birth.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: Camera-type eye development
    term:
      id: GO:0043010
      label: camera-type eye development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in key transcriptional and structural genes-including PAX6,
      FOXC1, PITX2, CYP1B1, LTBP2, PXDN, and GJA8-account for the majority of
      ASD cases.
    explanation: >-
      Names the transcriptional and structural gene set that constitutes this
      trigger node and establishes that it accounts for most of the spectrum,
      supporting treatment of these genes as one mechanism rather than a list.
      Evidence source is OTHER because this is a systematic review.
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aniridia is most commonly caused by haploinsufficiency of the PAX6 gene,
      characterized by variable iris and foveal hypoplasia, nystagmus, cataracts,
      glaucoma, and aniridia-related keratopathy (ARK).
    explanation: >-
      Supports the dose-sensitivity claim with the module's archetypal gene, and
      shows a single haploinsufficient lesion producing the multi-tissue bundle
      this module asserts rather than an isolated iris defect.
  downstream:
  - target: Disrupted Periocular Mesenchyme Migration and Differentiation
    causal_link_type: DIRECT

- name: Disrupted Periocular Mesenchyme Migration and Differentiation
  description: >-
    Cranial neural crest cells migrate into the space between the surface
    ectoderm and the lens vesicle, forming the periocular mesenchyme that will
    become corneal stroma and endothelium, iris stroma, and the tissues of the
    iridocorneal angle. The lesion may impair the migration itself or, more often,
    the later programme by which these cells proliferate and differentiate into
    the specific derivatives. Conditional deletion experiments make the
    distinction concrete: removing AP-2beta from the crest lineage leaves
    migration into the eye intact while abolishing the postnatal proliferation
    and marker expression that build the angle. This is the amplification step
    that turns a transcription-factor dose problem into a tissue-building failure.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:

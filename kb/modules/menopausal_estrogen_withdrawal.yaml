name: Menopausal Estrogen Withdrawal Module
description: >-
  A conserved endocrine module representing the loss of ovarian estrogen output
  and its consequences for every estrogen-responsive tissue at once. Exhaustion
  of the ovarian follicle pool removes the granulosa-cell source of estradiol
  and inhibin B; loss of inhibin B and then estradiol feedback disinhibits
  pituitary gonadotropin secretion and raises FSH; and the fall in circulating
  estradiol withdraws estrogen-receptor signalling from bone, myocardium and
  coronary endothelium, urogenital connective tissue and the hypothalamus
  simultaneously. That receptor-level withdrawal - "Loss of Estrogen Receptor
  Signalling in the Target Tissue" - is the key conformance target: upstream the
  route into the follicle pool differs (lifelong atresia in natural menopause, a
  genetic or iatrogenic step reduction in premature ovarian insufficiency), and
  downstream the lesion differs by tissue, but the lost receptor signal is the
  shared step. The module also carries the hypothalamic KNDy arm, the one
  consequence whose mechanism is conserved rather than tissue-specific, and with
  it the neurokinin-3 receptor antagonist drug-target pattern. Conforming
  disorder entries substitute their own tissue, cell type and lesion while
  preserving the follicle-pool to receptor-withdrawal chain. Intended conformers:
  Osteoporosis and Heart_Failure (whose "Postmenopausal Oestrogen Withdrawal" and
  "Loss of Myocardial Oestrogen Receptor Signalling" nodes correspond to this
  module's systemic and receptor nodes respectively), Pelvic_Organ_Prolapse (at
  the systemic node only - see notes), and the premature ovarian insufficiency
  entries Fragile_X-Associated_Primary_Ovarian_Insufficiency and
  Premature_Ovarian_Failure_19, in which the identical withdrawal happens decades
  early. Complementary to, and deliberately not overlapping with, two sibling
  modules: osteoporosis_bone_resorption owns the RANKL/OPG bone arm downstream of
  this module, and sex_steroid_driven_proliferation is this module's opposite sign
  - sustained receptor signalling driving proliferation rather than its
  withdrawal.
category: Module
module_categories:
- AGING
- NEUROSCIENCE
creation_date: "2026-11-14T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (for example
  "menopausal_estrogen_withdrawal#Loss of Estrogen Receptor Signalling in the Target Tissue").

  Do NOT create a "Menopause" or "Perimenopause" Disease entry. Menopause is a
  life stage, not a disorder: MONDO has no term for natural menopause or
  perimenopause, HP files HP:0040406 Perimenopausal under past medical history
  and offers HP:6000314 Perimenopausal onset and HP:6000315 Postmenopausal onset
  only as onset modifiers, and GO:0042697 menopause is a phase term GO itself puts
  in the gocheck_do_not_annotate subset, carrying a comment that it should not be
  used for direct annotation - so no node in this module binds it, and none should. What is curated as disease is
  the premature or iatrogenic case (MONDO:0001119 premature menopause) and the
  organ consequences (MONDO:0008159 postmenopausal osteoporosis, MONDO:0001410
  postmenopausal atrophic vaginitis), each of which conforms to this module
  rather than replacing it.

  Where the boundary with osteoporosis_bone_resorption falls. That module keeps
  the whole bone arm - remodeling imbalance, the RANKL/OPG shift,
  osteoclastogenesis, resorption outpacing formation - and already names estrogen
  deficiency as one of its upstream drivers. This module supplies that driver and
  stops there. It carries no bone cell type, no bone process and no bone node,
  and a curator wanting the bone mechanism should conform to the bone module, not
  extend this one. The same rule holds for every other tissue: the myocardial
  fibrosis chain belongs in Heart_Failure, the pelvic matrix chain in
  Pelvic_Organ_Prolapse. This module ends at the receptor.

  The hypothalamic KNDy arm is a node here rather than a module of its own, and
  the reason is the module bar rather than the arm's importance. Arcuate KNDy
  neurons hypertrophy and raise neurokinin B and kisspeptin expression when
  estrogen is withdrawn, NKB infusion reproduces flushes in healthy
  premenopausal women, and NK3R antagonists reduce vasomotor symptoms - a
  complete chain with its own drug target. But a separate module needs two or
  more disorders funnelling through a rate-limiting node of its own, and every
  candidate conformer reaches this arm through the same estrogen withdrawal
  already modelled here, so it would have one real mechanism and no independent
  conformers. Keeping it as a node also keeps it where a curator will find it:
  beside the receptor node it depends on. If vasomotor curation later needs the
  thermoregulatory steps this node deliberately omits - the narrowed
  thermoneutral zone, the median preoptic relay, cutaneous vasodilatation and
  sweating - that is the point to factor a vasomotor module out, and this node is
  where it would attach. Note also that congenital TACR3 or TAC3 loss of function
  causes hypogonadotropic hypogonadism, which is not this mechanism and must not
  be conformed to this node.

  Iatrogenic withdrawal is in scope, as the same mechanism entered at a different
  point, but only when it is entered at the follicle pool. Bilateral oophorectomy
  removes the pool outright and chemotherapy or pelvic radiation destroys it;
  both are step reductions of exactly the kind the cited follicle-dynamics model
  treats as advancing the menopausal threshold, the downstream chain from the
  granulosa node onward is identical, and the international POI guideline covers
  iatrogenic POI within the same condition. Two caveats a conforming entry must
  observe. Surgical withdrawal is abrupt and also removes ovarian androgen
  output, which natural menopause substantially preserves, so a surgical
  conformer is not simply an accelerated natural one. And GnRH-agonist,
  aromatase-inhibitor and SERM "medical menopause" does NOT enter at the follicle
  pool: those agents act centrally on gonadotropin drive, or on peripheral
  aromatisation, or at the receptor itself, so such an entry conforms at the
  systemic or receptor node and must not claim the follicle-pool trigger.

  Not curated as an Xogenesis module. No pathological material anatomical entity
  is formed anywhere in this chain - the terminal state is the absence of a
  signal - so no OGMS/MPATH/UBERON lesion anchor applies and none is asserted.

  Node granularity follows the single-value biological_scale discipline, and two
  places in this chain needed splitting because of it. The fall in circulating
  estradiol (ORGANISM) and the loss of receptor occupancy in a target tissue
  (CELLULAR) are separate nodes, which is also how Heart_Failure splits its two
  oestrogen nodes and is what lets those two nodes conform here one-to-one. The
  granulosa secretory failure (CELLULAR) is likewise separate from the
  follicle-pool exhaustion above it (TISSUE).

  Spelling: node names and prose here use "estrogen" and "estradiol", matching
  the GO, HGNC and NCIT labels bound below. Conforming entries written in British
  English ("oestrogen", "oestradiol" - Heart_Failure and Pelvic_Organ_Prolapse
  both are) are not inconsistent with the module and need no renaming; both
  spellings appear in this paragraph so that either one finds the module by
  search.
pathophysiology:
- name: Ovarian Follicle Pool Exhaustion
  role: trigger
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The non-renewable primordial follicle reserve falls below the number needed
    to sustain ovulatory cycles. In natural menopause this is the endpoint of
    lifelong atresia, which accelerates in the final decade of menstrual life; in
    premature ovarian insufficiency the reserve is established normally and then
    lost faster, or is reduced in a step by oophorectomy, chemotherapy or
    radiation. The route in is the main substitution a conforming entry makes;
    the state this node describes - an ovary with essentially no recruitable
    follicles - is the same in every case.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  biological_processes:
  - preferred_term: ovarian follicle development
    term:
      id: GO:0001541
      label: ovarian follicle development
    modifier: DECREASED
  evidence:
  - reference: PMID:3119654
    reference_title: "Follicular depletion during the menopausal transition: evidence for accelerated loss and ultimate exhaustion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follicles were virtually absent in the postmenopausal ovaries."
    explanation: >-
      Direct histological measurement in serially sectioned human ovaries,
      establishing the state this node describes rather than inferring it from
      hormone levels.
  - reference: PMID:3119654
    reference_title: "Follicular depletion during the menopausal transition: evidence for accelerated loss and ultimate exhaustion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results support the view that declining follicular reserve is the immediate cause of both the perimenopausal and menopausal transitions"
    explanation: >-
      States that the follicular reserve is the immediate cause rather than a
      correlate, which is what makes this the trigger node of the module rather
      than context upstream of it.
  - reference: PMID:1291557
    reference_title: "Accelerated disappearance of ovarian follicles in mid-life: implications for forecasting menopause."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: COMPUTATIONAL
    snippet: "Menopause is triggered by the number of ovarian follicles falling below a threshold number and is irreversible because oogonial stem cells disappear after birth."
    explanation: >-
      Supplies the threshold formulation this node rests on, and the
      irreversibility that distinguishes follicle-pool exhaustion from a
      reversible suppression of ovarian function. Graded COMPUTATIONAL because
      the paper's own contribution is a mathematical model fitted to published
      human follicle counts.
  - reference: PMID:1291557
    reference_title: "Accelerated disappearance of ovarian follicles in mid-life: implications for forecasting menopause."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: COMPUTATIONAL
    snippet: "A reduction of 90% in childhood before age 14 years could result in menopause as early as 27 years"
    explanation: >-
      The basis for treating premature and iatrogenic withdrawal as the same
      mechanism entered early: a step reduction of the pool advances the
      threshold without changing anything downstream of it. Graded INDIRECT
      because the model predicts the consequence of a step reduction rather than
      observing one in a treated cohort.
  downstream:
  - target: Loss of Granulosa-Cell Estradiol and Inhibin B Output
    causal_link_type: DIRECT
    description: >-
      The growing follicle is the secretory unit; with no follicles to recruit
      there is no granulosa compartment to produce estradiol or inhibin B.

- name: Loss of Granulosa-Cell Estradiol and Inhibin B Output
  role: amplifier
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Granulosa cells of growing follicles aromatise androgen to estradiol and
    secrete inhibin B, and both outputs fall with the size of the recruitable
    cohort. The two are listed on one node because they are products of the same
    cell population lost together, but they are not lost on the same schedule:
    inhibin B secretion is already reduced in older ovulatory women whose
    estradiol is still normal or high, which is why the feedback arm downstream
    moves years before the systemic-estradiol arm does.
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  biological_processes:
  - preferred_term: estrogen biosynthetic process
    term:
      id: GO:0006703
      label: estrogen biosynthetic process
    modifier: DECREASED
  - preferred_term: hormone secretion
    term:
      id: GO:0046879
      label: hormone secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:8675606
    reference_title: "Decreased inhibin B secretion is associated with the monotropic FSH rise in older, ovulatory women: a study of serum and follicular fluid levels of dimeric inhibin A and B in spontaneous menstrual cycles."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follicular phase inhibin B secretion is decreased in older ovulatory women who demonstrate a monotropic FSH rise, whereas inhibin A secretion is similar to that in younger women."
    explanation: >-
      Daily-sampling study in normally ovulating women: inhibin B specifically,
      not inhibin A, is the output that falls, and it falls alongside the FSH
      rise. Supports both the loss recorded on this node and its selectivity.
  - reference: PMID:8675606
    reference_title: "Decreased inhibin B secretion is associated with the monotropic FSH rise in older, ovulatory women: a study of serum and follicular fluid levels of dimeric inhibin A and B in spontaneous menstrual cycles."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We speculate that decreased inhibin B secretion most likely reflects a diminished follicular pool in older women and may be an important regulator of the monotropic FSH rise."
    explanation: >-
      The authors' own link from the follicle pool above to the feedback arm
      below. Quoted with its hedge intact and graded INDIRECT because the study
      measured hormones rather than follicle counts, so the pool is inferred.
  downstream:
  - target: Hypergonadotropic Feedback Disinhibition
    causal_link_type: DIRECT
    description: >-
      Falling inhibin B, and later falling estradiol, remove the restraint on
      pituitary gonadotropin secretion.
  - target: Systemic Estradiol Withdrawal
    causal_link_type: DIRECT
    description: >-
      The ovary is the dominant source of circulating estradiol in a cycling
      woman, so loss of granulosa output is the fall in systemic estradiol.

- name: Hypergonadotropic Feedback Disinhibition
  role: effector
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Pituitary gonadotropes lose the negative feedback that ovarian inhibin B and
    estradiol normally impose, and FSH rises disproportionately to LH. This is a
    parallel arm, not a step on the way to the tissue consequences: the
    hypergonadotropic state is what makes the endocrine diagnosis, and the
    sequence of the two cohort-measured curves tells the mechanism apart from a
    purely estradiol-driven one - FSH begins to rise about six years before the
    final menstrual period, while mean estradiol does not move until about two
    years before it, so the early disinhibition is attributable to inhibin B
    rather than to estradiol. No node here asserts a direct action of FSH on
    bone or any other peripheral tissue; that hypothesis is outside this module's
    scope and is not curated as an edge.
  cell_types:
  - preferred_term: pituitary gonadotrope
    description: >-
      The label is CL's own spelling, "gonadtroph", which is missing an "o";
      preferred_term carries the conventional spelling. Do not correct the
      label - term.label must match the ontology verbatim.
    term:
      id: CL:0000437
      label: gonadtroph
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  biological_processes:
  - preferred_term: negative regulation of gonadotropin secretion
    description: >-
      Bound with a DECREASED modifier because the lesion is the loss of the
      negative-feedback process itself, which is what "disinhibition" names; the
      resulting rise in FSH secretion is the separate term below.
    term:
      id: GO:0032277
      label: negative regulation of gonadotropin secretion
    modifier: DECREASED
  - preferred_term: follicle-stimulating hormone secretion
    term:
      id: GO:0046884
      label: follicle-stimulating hormone secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:21159842
    reference_title: "Change in follicle-stimulating hormone and estradiol across the menopausal transition: effect of age at the final menstrual period."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FSH pattern across the menopausal transition began with an increase 6.10 yr before the FMP, an acceleration 2.05 yr before the FMP, deceleration beginning 0.20 yr before the FMP, and attainment of stable levels 2.00 yr after the FMP, independent of age at the FMP, race/ethnicity, or smoking status."
    explanation: >-
      Annual serum measurement in 1215 women of the SWAN cohort with a
      documented natural final menstrual period: the FSH rise is a measured
      longitudinal trajectory, and it begins roughly four years before estradiol
      moves, which is the timing claim this node makes.
  - reference: PMID:8675606
    reference_title: "Decreased inhibin B secretion is associated with the monotropic FSH rise in older, ovulatory women: a study of serum and follicular fluid levels of dimeric inhibin A and B in spontaneous menstrual cycles."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, the older group had higher maximal serum FSH concentrations compared to the younger women (11.4 +/- 0.5 vs. 8.0 +/- 0.4 IU/L, p < 0.001)."
    explanation: >-
      Measures the raised FSH in women who are still ovulating with normal
      estradiol, supporting the disinhibition as the early event rather than a
      late consequence of hypoestrogenism.

- name: Systemic Estradiol Withdrawal
  role: amplifier
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Circulating estradiol falls to a postmenopausal range and stays there. The
    node is the systemic hormonal state, deliberately separate from the
    receptor-level consequence below it: the fall is measurable in serum and is
    the same whatever tissue is being considered, whereas which receptor in which
    cell loses occupancy is tissue-specific. Heart_Failure's "Postmenopausal
    Oestrogen Withdrawal" node, which carries the systemic disinhibition of RAAS,
    insulin sensitivity and the adipokine profile at ORGANISM scale, is the
    worked conformer here, and Pelvic_Organ_Prolapse's "Oestrogen Withdrawal and
    Ageing of the Pelvic Support Tissues" belongs here too and not below.
  biological_processes:
  - preferred_term: regulation of hormone levels
    term:
      id: GO:0010817
      label: regulation of hormone levels
    modifier: DECREASED
  evidence:
  - reference: PMID:21159842
    reference_title: "Change in follicle-stimulating hormone and estradiol across the menopausal transition: effect of age at the final menstrual period."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean E2 concentration did not change until 2.03 yr before the FMP when it began decreasing, achieving maximal rate of change at the FMP, then decelerating to achieve stability 2.17 yr after the FMP."
    explanation: >-
      The measured estradiol trajectory in the SWAN cohort, which both
      establishes this node as a sustained new state rather than a transient dip
      and dates it against the FSH rise recorded on the parallel arm.
  - reference: PMID:3119654
    reference_title: "Follicular depletion during the menopausal transition: evidence for accelerated loss and ultimate exhaustion."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Menstrual histories were confirmed by plasma hormone levels and endometrial histology."
    explanation: >-
      Ties the hormonal state of this node to the histological follicle counts in
      the same women, which is the link from the trigger node to this one.
      Graded INDIRECT because the sentence reports the study's validation of its
      groups rather than an estradiol measurement in its own right.
  downstream:
  - target: Loss of Estrogen Receptor Signalling in the Target Tissue
    causal_link_type: DIRECT
    description: >-
      Estrogen receptors are ligand-activated, so a fall in circulating ligand is
      a fall in receptor occupancy in every responsive tissue.

- name: Loss of Estrogen Receptor Signalling in the Target Tissue
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Estrogen receptor alpha and beta in a responsive cell population lose their
    ligand, and the transcriptional and membrane-initiated programmes they
    maintain fall away. This is the rate-limiting, tissue-agnostic step and the
    key conformance target of the module: above it the route to hormone loss
    differs by disorder, below it the lesion differs by tissue, and this is the
    one step every conformer shares. The receptors themselves are intact and
    ligand-competent, so the activity is reduced rather than absent or altered -
    which is also what makes the withdrawal pharmacologically reversible in
    principle. Which cell population is the substrate is the main tissue-specific
    substitution: cardiac fibroblast and cardiac endothelial cell in
    Heart_Failure's "Loss of Myocardial Oestrogen Receptor Signalling", the
    osteoblast and osteocyte lineage for the bone arm that
    osteoporosis_bone_resorption owns, vaginal and urogenital connective tissue
    cells, and the arcuate KNDy neurons of the node below. No cell type is bound
    on this node, deliberately, because naming one would fix the choice the
    module exists to leave open.
  genes:
  - preferred_term: ESR1
    description: >-
      The gene encoding estrogen receptor alpha. Bound because the node models
      the unliganded state of the receptor, not a variant in the gene.
    term:
      id: hgnc:3467
      label: ESR1
  - preferred_term: ESR2
    description: >-
      The gene encoding estrogen receptor beta, bound alongside ESR1 because the
      two paralogues carry distinct arms of the lost signal and differ in tissue
      distribution, so which one a conformer loses is part of its substitution.
    term:
      id: hgnc:3468
      label: ESR2
  molecular_functions:
  - preferred_term: nuclear estrogen receptor activity in the target cell population
    description: >-
      DECREASED rather than absent: occupancy falls with circulating ligand while
      the receptor remains intact. The term names the receptor's nuclear
      function and is not a claim that the lost signal is genomic only;
      membrane-initiated signalling by the same receptors is withdrawn with it.
    term:
      id: GO:0030284
      label: nuclear estrogen receptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: estrogen receptor signaling pathway
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17488799
    reference_title: "Hypertrophy and increased kisspeptin gene expression in the hypothalamic infundibular nucleus of postmenopausal women and ovariectomized monkeys."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Conversely, in ovariectomized monkeys, estrogen replacement markedly reduced KiSS-1 gene expression."
    explanation: >-
      The strongest available evidence that a target tissue's response to
      menopause is estrogen-receptor-signalling-dependent rather than a
      correlate of ageing: removing the hormone produces the change and
      restoring it reverses the change, in the same primate model. Graded
      MODEL_ORGANISM because this arm of the study is in cynomolgus monkeys; the
      human counterpart is quoted on the node below.
  - reference: PMID:1708331
    reference_title: "Hypertrophy and increased gene expression of neurons containing neurokinin-B and substance-P messenger ribonucleic acids in the hypothalami of postmenopausal women."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "We have previously described hypertrophy of neurons containing estrogen receptor mRNA in the infundibular nucleus of postmenopausal women."
    explanation: >-
      Establishes that the cells responding to withdrawal in postmenopausal human
      hypothalamus are themselves estrogen-receptor-expressing, which is what
      places the responsive population downstream of this receptor node. Marked
      BACKGROUND because the sentence restates the authors' earlier work rather
      than this paper's own result, and INDIRECT because receptor expression
      locates the receptor without measuring its occupancy.
  - reference: PMID:9048584
    reference_title: "Comparison of the ligand binding specificity and transcript tissue distribution of estrogen receptors alpha and beta."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "The described differences between the ER subtypes in relative ligand binding affinity and tissue distribution could contribute to the selective action of ER agonists and antagonists in different tissues."
    explanation: >-
      Supports binding both paralogues on this node and treating the receptor
      substitution as tissue-specific. Graded MODEL_ORGANISM and INDIRECT because
      the transcript distribution measured is in rat tissues and the inference to
      selective action in human target tissues is the authors' own; the sentence
      is also appropriately hedged.
  downstream:
  - target: Hypothalamic KNDy Neuron Disinhibition
    causal_link_type: DIRECT
    description: >-
      Arcuate KNDy neurons are estrogen-receptor-expressing and are directly
      restrained by estradiol, so loss of receptor signalling releases them.
    evidence:
    - reference: PMID:17488799
      reference_title: "Hypertrophy and increased kisspeptin gene expression in the hypothalamic infundibular nucleus of postmenopausal women and ovariectomized monkeys."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "The cynomolgus monkey experiments provide strong evidence that the increase in KiSS-1 neuronal size and gene expression in postmenopausal women is secondary to ovarian failure."
      explanation: >-
        The authors' own statement of the direction of this edge, grounded in an
        ovariectomy-plus-replacement design rather than in the postmenopausal
        human observation alone.
  - target: Convergent Multi-System Estrogen Deficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The clinical state follows from receptor withdrawal through each tissue's
      own lesion. Typed as having known but omitted intermediates because those
      lesions are deliberately out of this module's scope: they are curated in
      the conforming disease entries and in osteoporosis_bone_resorption.

- name: Hypothalamic KNDy Neuron Disinhibition
  role: effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    KNDy neurons of the arcuate (infundibular) nucleus, which co-express
    kisspeptin, neurokinin B and dynorphin and are normally restrained by
    estradiol, hypertrophy and raise neurokinin B and kisspeptin expression once
    that restraint is gone. This is the one consequence arm whose mechanism is
    conserved rather than tissue-specific, which is why it sits in the module
    while the bone, myocardial and urogenital arms do not. The node is confined
    to the neuronal state; the thermoregulatory output of that state - a narrowed
    thermoneutral zone, cutaneous vasodilatation, sweating - is a whole-organism
    process at a different scale and is curated as a phenotype in the conforming
    entry, not bundled in here.
  cell_types:
  - preferred_term: arcuate KNDy neuron
    term:
      id: CL:4023125
      label: KNDy neuron
  locations:
  - preferred_term: arcuate nucleus of the hypothalamus (infundibular nucleus in the human literature)
    term:
      id: UBERON:0001932
      label: arcuate nucleus of hypothalamus
  biological_processes:
  - preferred_term: neurokinin B and kisspeptin neuropeptide signalling
    term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:1708331
    reference_title: "Hypertrophy and increased gene expression of neurons containing neurokinin-B and substance-P messenger ribonucleic acids in the hypothalami of postmenopausal women."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate that human menopause is associated with marked increases in hypothalamic NKB and SP gene expression."
    explanation: >-
      In situ hybridisation on premenopausal and postmenopausal human hypothalami:
      the increase in neurokinin B expression this node asserts, measured in human
      tissue. Note the paper measures neurokinin B and substance P, not the NK3R
      receptor.
  - reference: PMID:1708331
    reference_title: "Hypertrophy and increased gene expression of neurons containing neurokinin-B and substance-P messenger ribonucleic acids in the hypothalami of postmenopausal women."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean cross-sectional areas of postmenopausal infundibular neurons containing NKB and SP mRNAs increased to 194% and 176% of premenopausal values, respectively."
    explanation: >-
      Quantifies the hypertrophy half of the node's claim, which is a change in
      the cells themselves rather than only in their transcript levels.
  - reference: PMID:17488799
    reference_title: "Hypertrophy and increased kisspeptin gene expression in the hypothalamic infundibular nucleus of postmenopausal women and ovariectomized monkeys."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the infundibular nucleus of postmenopausal women, there was a significant increase in the size of neurons expressing KiSS-1 mRNA and the number of labeled cells and autoradiographic grains per neuron."
    explanation: >-
      The kisspeptin half of the KNDy phenotype, in human autopsy hypothalamus,
      showing that the same population changes on more than one of its three
      peptides.
  - reference: PMID:25683060
    reference_title: "Neurokinin B administration induces hot flushes in women."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight of ten participants experienced flushing during NKB infusion with none experiencing flushing during vehicle infusion (P = 0.0007)."
    explanation: >-
      A randomised, double-blinded, placebo-controlled crossover infusion in
      healthy premenopausal women: raising neurokinin B signalling is by itself
      sufficient to produce flushing, which is what makes this node causal for
      the vasomotor arm rather than a marker of it.
  downstream:
  - target: Convergent Multi-System Estrogen Deficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Raised neurokinin B signalling reaches the clinical vasomotor phenotype
      through hypothalamic thermoregulatory relays that this module does not
      model.
    evidence:
    - reference: PMID:25683060
      reference_title: "Neurokinin B administration induces hot flushes in women."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Expression of the gene encoding NKB is elevated in postmenopausal women."
      explanation: >-
        Connects the infusion result to the postmenopausal state, which is the
        step that makes this edge about menopause rather than about exogenous
        neurokinin B. Marked BACKGROUND because the sentence states the
        established human finding the study was designed around, and INDIRECT
        because the inference from raised expression to the clinical symptom is
        what the rest of the paper tests.

- name: Convergent Multi-System Estrogen Deficiency
  role: consequence
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical state of estrogen deficiency, affecting bone, the
    cardiovascular system, the urogenital tract, thermoregulation and the central
    nervous system at once. What this node asserts is only the convergence - that
    one withdrawn signal produces a multi-system picture rather than a
    single-organ lesion, which is the reason this module exists instead of four
    unrelated upstream nodes. It is not the place to curate any of those
    consequences: each tissue's lesion belongs in the conforming disease entry,
    and the bone arm belongs in osteoporosis_bone_resorption. Conformers
    normally attach at the receptor node above, not here.
  notes: >-
    No GO biological process is bound on this node, and the omission is
    deliberate rather than an unfilled slot. There is no single process term for
    a multi-system hormone-deficiency state: GO:0042697 menopause is a phase term
    GO marks gocheck_do_not_annotate, and rebinding a process already carried
    upstream would assert nothing new. A curator should resist the pull
    to bind something here; the mechanism in this node is entirely in the edges
    that reach it.
  evidence:
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The recent update of the POI guideline covers 40 clinical questions on
      diagnosis of the condition, the different sequelae, including bone,
      cardiovascular, neurological and sexual function, fertility and general
      well-being, and treatment options, including HT.
    explanation: >-
      Enumerates the organ systems affected, which is exactly the convergence
      claim of this node. Evidence source is OTHER and quote_role is
      REVIEW_SYNTHESIS because this is an international consensus guideline
      synthesising work it did not perform; the same sentence is cited with the
      same reading in the POI disease entries.
  - reference: PMID:39647506
    reference_title: "Evidence-based guideline: premature ovarian insufficiency(†)(‡)."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "specific considerations for HT in iatrogenic POI"
    explanation: >-
      The basis for treating iatrogenic withdrawal as the same condition reached
      by another route, as the module notes record: the guideline covers
      iatrogenic POI within its scope while flagging that its hormone-therapy
      handling differs. Graded INDIRECT because the sentence records the
      guideline's own scope rather than a clinical result, and OTHER because it
      is a consensus document.
biochemical:
- name: Serum follicle-stimulating hormone
  presence: INCREASED
  context: >-
    Serum FSH in a woman across the menopausal transition or under investigation
    for premature ovarian insufficiency.
  biomarker_term:
    preferred_term: Elevated circulating follicle stimulating hormone level
    term:
      id: HP:0008232
      label: Elevated circulating follicle stimulating hormone level
  loinc_term:
    id: LOINC:15067-2
    label: Follitropin [Units/volume] in Serum or Plasma
  notes: >-
    The diagnostic marker of the hypergonadotropic arm. Read it as a readout of
    lost ovarian feedback, not of estrogen deficiency: the two dissociate for
    about four years, over which FSH is already rising while mean estradiol has
    not yet moved, so a raised FSH does not by itself establish that the
    receptor-withdrawal arm of this module has begun.
  evidence:
  - reference: PMID:21159842
    reference_title: "Change in follicle-stimulating hormone and estradiol across the menopausal transition: effect of age at the final menstrual period."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annually collected serum was assayed for E2 and FSH levels."
    explanation: >-
      Establishes serum FSH as the measured quantity in the cohort whose
      trajectory this marker reports, alongside estradiol in the same samples.
  readouts:
  - target: Hypergonadotropic Feedback Disinhibition
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A higher FSH tracks with more complete loss of ovarian feedback. It is a
      readout of the feedback arm only; obesity attenuates the rise, so a
      normal-range value in an obese woman is not evidence against the
      mechanism.
    evidence:
    - reference: PMID:21159842
      reference_title: "Change in follicle-stimulating hormone and estradiol across the menopausal transition: effect of age at the final menstrual period."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Obesity attenuated the FSH rise and delayed the initial increase to 5.45 yr before the FMP."
      explanation: >-
        The measured modifier that makes this a context-dependent readout rather
        than a threshold applicable to every woman.
- name: Serum estradiol
  presence: DECREASED
  context: >-
    Serum estradiol in a woman across the menopausal transition or after
    oophorectomy.
  biomarker_term:
    preferred_term: Decreased serum estradiol
    term:
      id: HP:0008214
      label: Decreased serum estradiol
  loinc_term:
    id: LOINC:14715-7
    label: Estradiol (E2) [Moles/volume] in Serum or Plasma
  notes: >-
    Reports the systemic withdrawal node, not the receptor node below it. A
    conformer should not treat a serum estradiol value as a measure of how much
    receptor signalling a given tissue has lost: local aromatisation in adipose
    and other peripheral tissue, and differing receptor complements, both
    intervene.
  evidence:
  - reference: PMID:21159842
    reference_title: "Change in follicle-stimulating hormone and estradiol across the menopausal transition: effect of age at the final menstrual period."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Obesity, smoking behavior, and being Chinese or Japanese were associated with some variation in E2 levels but not the pattern of E2 change."
    explanation: >-
      Supports the measured quantity and records that absolute levels vary with
      body size, smoking and population while the shape of the decline does not -
      which is why the trajectory, not a single value, is the readout.
  readouts:
  - target: Systemic Estradiol Withdrawal
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A lower estradiol tracks with more complete withdrawal. Direction is
      NEGATIVE because the marker falls as the linked event advances.
    evidence:
    - reference: PMID:21159842
      reference_title: "Change in follicle-stimulating hormone and estradiol across the menopausal transition: effect of age at the final menstrual period."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "achieving maximal rate of change at the FMP, then decelerating to achieve stability 2.17 yr after the FMP"
      explanation: >-
        Dates the readout against the final menstrual period and shows it
        stabilises rather than continuing to fall, which is what makes the
        postmenopausal value interpretable as a steady state.
treatments:
- name: Neurokinin-3 Receptor Antagonism
  description: >-
    Blocking NK3R on the disinhibited KNDy population treats the vasomotor arm
    without replacing the withdrawn hormone. This is the module's drug-target
    design pattern, and it is a strong test of the KNDy node: the antagonist acts
    nowhere else in the chain - the follicle pool, the gonadotropin rise and the
    systemic estradiol fall are all untouched - so symptomatic benefit localises
    the mechanism to that node. It also makes the arm treatable where estrogen is
    contraindicated, which is why the same agents are used for withdrawal
    produced by endocrine therapy for breast cancer.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fezolinetant
      term:
        id: NCIT:C171845
        label: Fezolinetant
  target_mechanisms:
  - target: Hypothalamic KNDy Neuron Disinhibition
    treatment_effect: INHIBITS
    description: >-
      The antagonist blocks NK3R-mediated transmission from the disinhibited KNDy
      neurons, suppressing this node's output while leaving the upstream hormonal
      state unchanged.
  evidence:
  - reference: PMID:36924778
    reference_title: "Fezolinetant for treatment of moderate-to-severe vasomotor symptoms associated with menopause (SKYLIGHT 1): a phase 3 randomised controlled study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Improvements in frequency and severity of vasomotor symptoms were observed after 1 week and maintained over 52 weeks."
    explanation: >-
      A 12-week randomised, double-blind, placebo-controlled phase 3 trial with a
      40-week extension: NK3R antagonism reduces the vasomotor phenotype and keeps
      it reduced, which is the pharmacological confirmation of the node this
      treatment targets. Sustained benefit also argues that the disinhibition is
      ongoing rather than a transient adjustment to withdrawal.
  - reference: PMID:36924778
    reference_title: "Fezolinetant for treatment of moderate-to-severe vasomotor symptoms associated with menopause (SKYLIGHT 1): a phase 3 randomised controlled study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data support the clinical use of fezolinetant as a non-hormonal treatment for vasomotor symptoms associated with menopause."
    explanation: >-
      The trial's own conclusion, and the reason this treatment is recorded on the
      KNDy node rather than on the hormone-withdrawal nodes above it: the agent
      works without replacing the withdrawn estrogen.
  - reference: PMID:40454634
    reference_title: "Elinzanetant for Vasomotor Symptoms from Endocrine Therapy for Breast Cancer."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elinzanetant led to a significantly lower frequency of vasomotor symptoms associated with endocrine therapy than placebo."
    explanation: >-
      A second NK3R-targeted agent works on withdrawal produced by endocrine
      therapy rather than by follicle-pool exhaustion, supporting the notes'
      position that the arm is reached by more than one route and shares this
      target. Graded INDIRECT because the trial population's withdrawal is
      drug-induced, so the inference to natural menopause is one step removed.

name: Stem Cell Exhaustion Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed stem cell exhaustion: the age-associated decline in the number and
  function of tissue-specific stem cells, which erodes the regenerative capacity
  needed to maintain tissue homeostasis. Adult stem cells sustain tissue health
  by self-renewal and differentiation; with age, accumulated genetic mutations,
  epigenetic changes, and an altered extrinsic (niche/systemic) environment
  progressively impair stem-cell functionality. The resulting decline in
  self-renewal and regenerative output leaves tissues unable to replace lost or
  damaged cells, contributing to the functional decline of blood, muscle, brain,
  and other regenerative tissues. Stem cell exhaustion is an integrative
  hallmark - a downstream convergence of the primary damage hallmarks (genomic
  instability, telomere attrition, epigenetic alterations) acting on the stem
  compartment. Individual disorder entries declare conformance via conforms_to
  on their pathophysiology nodes, substituting the tissue-specific stem
  population and driver (e.g. hematopoietic stem cell aging, satellite-cell
  decline, accelerated stem-cell aging in progeroid syndromes) while preserving
  the conserved damage -> functional-decline -> regenerative-failure chain.
category: Module
module_categories:
- AGING
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function").
  Conforming nodes in disorder files should include the corresponding biological
  processes and causal edges, specialized to their disease context, substituting
  the tissue-specific stem-cell population. Stem cell exhaustion is an
  integrative hallmark: it sits downstream of the primary-damage modules
  (telomere_attrition, epigenetic_alterations, genome_instability_mutation) and
  overlaps cellular_senescence when stem cells senesce. Key conformance target:
  "stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function".
pathophysiology:
- name: Stem Cell Genetic, Epigenetic, and Niche Damage
  description: >-
    Over the lifespan, tissue-specific stem cells accumulate genetic mutations
    and epigenetic changes and are exposed to a progressively altered extrinsic
    environment (niche and systemic milieu). These intrinsic and extrinsic
    insults interact to compromise stem-cell functionality, the initiating layer
    of the hallmark.
  role: trigger
  cell_types:
  - preferred_term: Stem Cell
    term:
      id: CL:0000034
      label: stem cell
  evidence:
  - reference: PMID:26785478
    reference_title: "Stem cells and healthy aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent research has focused on the ways that genetic mutations, epigenetic
      changes, and the extrinsic environmental milieu influence stem cell
      functionality over time.
    explanation: >-
      Identifies genetic mutations, epigenetic changes, and the extrinsic milieu
      as the intrinsic and extrinsic drivers of declining stem-cell function, the
      trigger modeled here. Evidence source is OTHER because this is a review.
  downstream:
  - target: Decline in Stem Cell Self-Renewal and Function
- name: Decline in Stem Cell Self-Renewal and Function
  description: >-
    The accumulated damage leads to an age-associated decline in stem-cell
    function - reduced self-renewal capacity and impaired maintenance of the
    stem-cell pool. This is the conserved central effector that tissue-specific
    stem-cell aging (e.g. hematopoietic stem cells) converges upon; conforming
    disorder nodes substitute their particular stem population.
  role: central_effector
  cell_types:
  - preferred_term: Hematopoietic Stem Cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: Stem Cell Population Maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:26785478
    reference_title: "Stem cells and healthy aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Research into stem cells and aging aims to understand how stem cells
      maintain tissue health, what mechanisms ultimately lead to decline in stem
      cell function with age, and how the regenerative capacity of somatic stem
      cells can be enhanced to promote healthy aging.
    explanation: >-
      Establishes the age-associated decline in stem-cell function as the central
      question and effector of stem-cell aging, the node modeled here. Evidence
      source is OTHER because this is a review.
  - reference: PMID:23746838
    reference_title: "The hallmarks of aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These hallmarks are: genomic instability, telomere attrition, epigenetic
      alterations, loss of proteostasis, deregulated nutrient sensing,
      mitochondrial dysfunction, cellular senescence, stem cell exhaustion, and
      altered intercellular communication.
    explanation: >-
      Enumerates stem cell exhaustion as one of the conserved hallmarks of aging,
      framing this module. Evidence source is OTHER because this is a review.
  downstream:
  - target: Regenerative Failure and Tissue Homeostasis Decline
- name: Regenerative Failure and Tissue Homeostasis Decline
  description: >-
    Diminished stem-cell self-renewal and function reduce the regenerative
    capacity of somatic tissues, so lost or damaged cells are no longer
    adequately replaced and tissue homeostasis declines with age. This is the
    conserved consequence of stem cell exhaustion; the specific organ phenotype
    is supplied by the conforming disorder, and enhancing regenerative capacity
    is the corresponding healthy-aging intervention target.
  role: consequence
  biological_processes:
  - preferred_term: Tissue Regeneration
    term:
      id: GO:0042246
      label: tissue regeneration
    modifier: DECREASED
  evidence:
  - reference: PMID:26785478
    reference_title: "Stem cells and healthy aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      how the regenerative capacity of somatic stem cells can be enhanced to
      promote healthy aging
    explanation: >-
      Frames declining regenerative capacity of somatic stem cells - and its
      enhancement - as the outcome and intervention target modeled here. Evidence
      source is OTHER because this is a review.
animal_models:
- name: Aged killifish telencephalon stab-wound injury (Nothobranchius furzeri)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Traumatic brain injury model established in the dorsal telencephalon of young
    adult versus aged fish, comparing regeneration outcome and progenitor
    proliferation.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:34428340
  description: >-
    Teleosts normally regenerate central nervous tissue throughout adult life, which
    is what makes the killifish informative here: it is regeneration-competent when
    young and loses that competence within months. Van Houcke and colleagues showed
    that stab-wound repair of the aged killifish telencephalon is impaired and
    incomplete, that the atypical non-glial progenitors carrying young regeneration
    lose proliferative capacity with age, and that inflammation and glial scarring
    contribute to the failure. The model therefore isolates progenitor exhaustion
    against a background where the regenerative program itself is intact.
  modeled_mechanisms:
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The progenitor population that supports brain regeneration in young killifish
      loses proliferative capacity with age, which is the module's core node
      measured directly in the responsible cell population rather than inferred from
      tissue outcome.
    limitations: >-
      The atypical non-glial progenitors that drive killifish brain regeneration have
      no established human counterpart, and adult human forebrain neurogenesis is
      minimal, so this is a model of progenitor exhaustion in a regeneration-competent
      vertebrate rather than of the human situation. Proliferation was assayed after
      injury, so the decline measured is in the injury-responsive pool.
    readouts:
    - name: Non-glial progenitor proliferation capacity with age
      target: Decline in Stem Cell Self-Renewal and Function
      description: >-
        Proliferation of atypical non-glial progenitors in the dorsal telencephalon
        after stab-wound injury, young adult versus aged fish.
      direction: DECREASED
      interpretation: >-
        A measured fall in the proliferative capacity of the specific population that
        carries regeneration is the most direct evidence available for this node.
      evidence:
      - reference: PMID:34428340
        reference_title: Aging impairs the essential contributions of non-glial progenitors to neurorepair in the dorsal telencephalon of the Killifish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the young adult killifish, brain regeneration is mainly supported by atypical non-glial progenitors, yet their proliferation capacity clearly declines with age."
        explanation: Identifies the responsible progenitor population and reports its age-dependent proliferative decline.
    evidence:
    - reference: PMID:34428340
      reference_title: Aging impairs the essential contributions of non-glial progenitors to neurorepair in the dorsal telencephalon of the Killifish Nothobranchius furzeri.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the young adult killifish, brain regeneration is mainly supported by atypical non-glial progenitors, yet their proliferation capacity clearly declines with age."
      explanation: >-
        Supports treating this model as informative for progenitor functional decline,
        with the progenitor population identified rather than assumed.
  - target: Regenerative Failure and Tissue Homeostasis Decline
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Regeneration of the aged killifish telencephalon after injury is impaired and
      incomplete relative to young fish, and the failure is attributable to both a
      cell-intrinsic progenitor deficit and an extrinsic inflammatory and glial-scar
      environment.
    limitations: >-
      This is injury-induced regeneration, not steady-state tissue turnover, so it
      speaks to repair capacity rather than to homeostatic replenishment. Functional
      or behavioral recovery is not the endpoint measured here. The niche component
      means the deficit is not purely stem-cell-intrinsic, which matters when citing
      this model for a stem-cell-autonomous claim.
    readouts:
    - name: Regeneration response after stab-wound injury
      target: Regenerative Failure and Tissue Homeostasis Decline
      description: >-
        Extent and completeness of the regeneration response in the dorsal
        telencephalon of aged versus young killifish after stab-wound injury.
      direction: DECREASED
      interpretation: >-
        Impaired and incomplete repair is the tissue-level outcome that the
        progenitor decline predicts, measured in the same animals.
      evidence:
      - reference: PMID:34428340
        reference_title: Aging impairs the essential contributions of non-glial progenitors to neurorepair in the dorsal telencephalon of the Killifish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Stab-wound injury of the aged killifish dorsal telencephalon unveils an impaired and incomplete regeneration response when compared to young individuals."
        explanation: Reports the regeneration outcome underlying this readout.
    - name: Inflammatory response and glial scarring as extrinsic barriers
      target: Regenerative Failure and Tissue Homeostasis Decline
      description: >-
        Inflammatory response and glial scar formation in the aged injured
        telencephalon, assessed as contributors to the neurogenic deficit.
      direction: INCREASED
      interpretation: >-
        The niche contribution is why this model supports a combined intrinsic and
        extrinsic account of regenerative failure rather than progenitor exhaustion
        alone.
      evidence:
      - reference: PMID:34428340
        reference_title: Aging impairs the essential contributions of non-glial progenitors to neurorepair in the dorsal telencephalon of the Killifish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We identified a high inflammatory response and glial scarring to also underlie the hampered generation of new neurons in aged fish."
        explanation: Reports the extrinsic barriers measured alongside the progenitor deficit.
    evidence:
    - reference: PMID:34428340
      reference_title: Aging impairs the essential contributions of non-glial progenitors to neurorepair in the dorsal telencephalon of the Killifish Nothobranchius furzeri.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Stab-wound injury of the aged killifish dorsal telencephalon unveils an impaired and incomplete regeneration response when compared to young individuals."
      explanation: >-
        Supports treating this model as informative for regenerative failure, in a
        species that regenerates competently when young.
- name: Aging killifish intestinal mucosa with intermittent fasting arm (Nothobranchius furzeri)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Intestine sampled at stages corresponding to human neonatal, adolescent, adult,
    and old age, with an intermittent-fasting-during-adulthood arm; morphometry,
    histology, and transcriptomics integrated.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:40984680
  description: >-
    Killifish intestinal mucosa is organized into folds with interfold regions where
    the stem cells sit, closely enough to the mammalian arrangement that the authors
    argue the findings generalize. Across the lifespan the stem cell cycle time
    lengthens, the intestine shrinks, and stem cell niche and circadian clock gene
    expression shift. An intermittent-fasting arm held most of those genes at adult
    levels into old age, making this the module's rescue arm as well as its
    natural-aging arm.
  modeled_mechanisms:
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Intestinal stem cell cycling slows with age in a defined anatomical niche,
      accompanied by shifts in niche marker expression, giving this node a
      measurement in a canonical high-turnover tissue rather than in nervous system
      repair.
    limitations: >-
      Stem cell activity is read from cycle time and niche marker expression rather
      than from clonal lineage tracing or transplantation, so self-renewal capacity
      itself is not directly measured. The link between the transcriptional shifts
      and the morphological decline is correlative.
    readouts:
    - name: Intestinal stem cell cycle time
      target: Decline in Stem Cell Self-Renewal and Function
      description: >-
        Cycle time of intestinal stem cells in the interfold regions across the
        killifish lifespan.
      direction: INCREASED
      interpretation: >-
        Lengthening cycle time is slowed stem cell activity, the direct measurement
        behind this node in the intestine.
      evidence:
      - reference: PMID:40984680
        reference_title: Aging Reduces Intestinal Stem Cell Activity in Killifish and Intermittent Fasting Reverses Intestinal Gene Expression Patterns.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The stem cells occur in clusters, and the cycle time of stem cells increases with age."
        explanation: Reports the stem cell cycling measurement underlying this readout.
    evidence:
    - reference: PMID:40984680
      reference_title: Aging Reduces Intestinal Stem Cell Activity in Killifish and Intermittent Fasting Reverses Intestinal Gene Expression Patterns.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, our results demonstrate that the decline in structural intestinal tissue homeostasis is associated with a decline in stem cell activity that can be counteracted by intermittent fasting."
      explanation: >-
        Supports treating this model as informative for stem cell functional decline,
        and states the association with tissue-level homeostasis that the next link
        covers.
  - target: Regenerative Failure and Tissue Homeostasis Decline
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Structural intestinal homeostasis declines with age alongside the stem cell
      deficit, with measurable loss of intestinal length and volume.
    limitations: >-
      Morphometric loss is measured, but no functional intestinal readout such as
      barrier integrity or absorptive capacity is reported, so the consequence of the
      structural decline is not established in this model.
    readouts:
    - name: Intestinal length and volume with age
      target: Regenerative Failure and Tissue Homeostasis Decline
      description: >-
        Morphological measurement of intestinal length and volume across the
        killifish lifespan.
      direction: DECREASED
      interpretation: >-
        Tissue-level shrinkage is the structural correlate of the slowed stem cell
        turnover measured in the same animals.
      evidence:
      - reference: PMID:40984680
        reference_title: Aging Reduces Intestinal Stem Cell Activity in Killifish and Intermittent Fasting Reverses Intestinal Gene Expression Patterns.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We also observed a reduction in intestinal length and volume with age."
        explanation: Reports the morphometric measurement behind this readout.
    evidence:
    - reference: PMID:40984680
      reference_title: Aging Reduces Intestinal Stem Cell Activity in Killifish and Intermittent Fasting Reverses Intestinal Gene Expression Patterns.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also observed a reduction in intestinal length and volume with age."
      explanation: >-
        Supports treating this model as informative for the tissue-homeostasis node
        on a direct structural measurement.
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: RESCUES
    fidelity: LOW
    description: >-
      Intermittent fasting during adulthood held most of the age-shifted stem cell
      niche and circadian clock genes at their adult expression levels into old age,
      which the authors read as counteracting the stem cell activity decline.
    limitations: >-
      The rescue is demonstrated at the level of gene expression patterns; stem cell
      cycle time and intestinal morphometry were not shown to be restored by the
      fasting arm, so the functional rescue is inferred from the transcriptional one.
      No lifespan or healthspan endpoint accompanies this arm.
    readouts:
    - name: Stem cell niche and circadian clock gene expression under intermittent fasting
      target: Decline in Stem Cell Self-Renewal and Function
      description: >-
        Age-dependent transcriptomic profile of stem cell niche markers and peripheral
        circadian clock genes in old fish that underwent intermittent fasting during
        adulthood, compared against ad libitum controls.
      direction: RESTORED
      interpretation: >-
        Holding adult expression levels into old age is a transcriptional restoration;
        it is what the rescue claim rests on, and it is not the same as restoring
        measured stem cell cycling.
      evidence:
      - reference: PMID:40984680
        reference_title: Aging Reduces Intestinal Stem Cell Activity in Killifish and Intermittent Fasting Reverses Intestinal Gene Expression Patterns.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Notably, the majority of these genes maintained their adult gene expression levels in old age following intermittent fasting during adulthood."
        explanation: Reports the intermittent-fasting arm result underlying this readout.
    evidence:
    - reference: PMID:40984680
      reference_title: Aging Reduces Intestinal Stem Cell Activity in Killifish and Intermittent Fasting Reverses Intestinal Gene Expression Patterns.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, our results demonstrate that the decline in structural intestinal tissue homeostasis is associated with a decline in stem cell activity that can be counteracted by intermittent fasting."
      explanation: >-
        Supports treating the fasting arm as a rescue of this node, in the authors'
        own terms, with the transcriptional basis recorded in the limitations.
  notes: >-
    Curated as part of a tranche adding turquoise killifish models across the
    hallmarks-of-aging modules. Two entries are kept separate because the paradigms
    differ: one is injury-induced neural regeneration in a regeneration-competent
    vertebrate, the other natural aging of a high-turnover epithelium with a dietary
    intervention arm.
biochemical:
- name: Clonal hematopoiesis of indeterminate potential (CHIP)
  presence: INCREASED
  biomarker_term:
    preferred_term: clonal hematopoiesis of indeterminate potential
    term:
      id: NCIT:C158547
      label: Clonal Hematopoiesis of Indeterminate Potential
  notes: >-
    The same measurement curated in genomic_instability_aging, making a different
    claim. There it reports accumulated somatic mutation; here it reports what the
    mutation does to the stem-cell compartment. A CHIP clone is detectable in blood
    precisely because a mutated hematopoietic stem cell has gained a selective
    advantage and come to dominate output, which is the loss of clonal diversity this
    module models. Curating it twice is deliberate rather than duplicative: the
    readout targets and interpretations differ, and a curator looking for a stem-cell
    marker should not have to know to search the genomic-instability module.

    Note the direction of inference. CHIP is direct evidence of clonal dominance in
    the hematopoietic system only. Extending it to stem-cell exhaustion in other
    tissues is not supported by the curated evidence and should not be read into it.
  evidence:
  - reference: PMID:28636844
    reference_title: "Clonal Hematopoiesis and Risk of Atherosclerotic Cardiovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      These mutations, which are also common in the myelodysplastic syndrome and acute
      myeloid leukemia4, provide a selective advantage to the hematopoietic stem cells
      in which they occur5,6, and are detectable as clones in peripheral blood samples
      because the mutated stem cells maintain the ability to differentiate into
      circulating granulocytes, monocytes, and lymphocytes7,8.
    explanation: >-
      States the mechanism that makes CHIP a stem-cell readout rather than only a
      mutation readout: the clone is detectable because a stem cell with a selective
      advantage dominates hematopoietic output.
  readouts:
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: MONITORING
    interpretation: >-
      Detection of a CHIP clone reports loss of hematopoietic stem-cell clonal
      diversity, the compartment-level form of the self-renewal decline this node
      models. It is specific to the hematopoietic system.
    evidence:
    - reference: PMID:25426837
      reference_title: "Age-related clonal hematopoiesis associated with adverse outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The majority of the variants occurred in three genes: DNMT3A, TET2, and ASXL1.
      explanation: >-
        The recurrent involvement of three epigenetic-regulator genes indicates
        selection acting on stem-cell self-renewal rather than random mutation
        accumulation.
discussions:
- discussion_id: knowledge_gap_stem_cell_exhaustion_outside_hematopoiesis
  prompt: >-
    Is there any accessible human biomarker of stem-cell exhaustion outside the
    hematopoietic compartment?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#
  - pathophysiology#Regenerative Failure and Tissue Homeostasis Decline
  rationale: >-
    This module models stem-cell exhaustion as a general hallmark across tissues, but
    the only marker curated here is hematopoietic, and it is hematopoietic for a
    structural reason rather than an accidental one: blood is the tissue where a
    clonal expansion is both sequenceable and repeatedly samplable without biopsy.
    Satellite-cell decline in muscle, intestinal-crypt stem-cell attrition, and
    neural-stem-cell decline have no equivalent accessible readout, so the module's
    clinical face is much narrower than its mechanistic scope. This is worth recording
    explicitly because the asymmetry is easy to miss: a reader seeing one well-evidenced
    marker may take the hallmark to be measurable in general, when what is measurable
    is one compartment. Resolving it plausibly needs imaging or tissue-derived
    extracellular-vesicle readouts rather than a circulating analyte.
  evidence:
  - reference: PMID:28636844
    reference_title: "Clonal Hematopoiesis and Risk of Atherosclerotic Cardiovascular Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are detectable as clones in peripheral blood samples because the mutated stem
      cells maintain the ability to differentiate into circulating granulocytes,
      monocytes, and lymphocytes7,8.
    explanation: >-
      Names the property that makes hematopoietic stem-cell decline measurable and
      that other stem-cell compartments lack.
computational_models:
- name: Przybilla2014 Multiscale Model of Epigenetic Drift in Aging Stem Cells
  description: >-
    Individual cell-based model of a stem cell population coupled to a model of
    epigenetic regulation of transcription. Simulates age-related change in H3K4
    trimethylation and DNA methylation, and the expression changes that follow, on
    molecular, cellular, and population scales. Quiescent cells occupying a niche are
    contrasted with proliferating cells, and homing to the niche is shown to affect
    the accumulation of drift.
  model_type: AGENT_BASED
  publication: PMID:24428552
  modeled_mechanisms:
  - target: Stem Cell Genetic, Epigenetic, and Niche Damage
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models intrinsic epigenetic damage and the extrinsic niche together, and shows
      niche residence modulating how fast drift accumulates.
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces age-related cellular phenotypes and a marked increase in stem-cell
      heterogeneity, offering an explanation for observations in aged hematopoietic
      stem cells where aged clones contribute less efficiently to differentiated
      progeny.
    limitations: >-
      Cells do not interact in the simulation, and the genome is artificial, so
      competition between clones - central to the in vivo decline - is absent.
  notes: >-
    Shared with epigenetic_alterations. Here the interest is the population-level
    functional consequence; there, the molecular origin of the drift.
- name: Watson2020 Fitness Landscape of Clonal Hematopoiesis
  description: >-
    Population-genetics inference framework fitted to the variant-allele-frequency
    distribution of somatic mutations in blood, recovering the fitness effect of
    driver mutations in hematopoietic stem cells. Shows that age-related clonal
    hematopoiesis is the expected consequence of a stem-cell population under
    selection, with clone size determined by the driver's fitness advantage and the
    time since it arose, rather than requiring an age-specific change in stem-cell
    biology.
  model_type: KINETIC
  publication: PMID:32217721
  modeled_mechanisms:
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recasts the age-associated loss of stem-cell clonal diversity as a selection
      outcome, quantifying the fitness advantage each driver confers.
    limitations: >-
      Infers fitness from allele-frequency data rather than simulating self-renewal
      mechanistically, and covers the hematopoietic compartment only.
  notes: >-
    Provides a strong null model for this module: clonal narrowing with age is
    predicted by neutral-plus-selection dynamics alone, so a mechanistic claim of
    stem-cell exhaustion needs evidence beyond the observation of reduced clonality.
- name: Predicting Clonal Self-Renewal and Extinction of Hematopoietic Stem Cells
  description: >-
    Stochastic model of hematopoietic stem cell clone dynamics that predicts the
    probability of a clone self-renewing versus going extinct, reconciling the
    observed persistence of some clones with the loss of most.
  model_type: AGENT_BASED
  publication: PMID:21368169
  modeled_mechanisms:
  - target: Decline in Stem Cell Self-Renewal and Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Treats self-renewal as a stochastic per-clone outcome, so pool-level decline
      emerges from clone extinction rather than from uniform per-cell deterioration.
  - target: Regenerative Failure and Tissue Homeostasis Decline
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Links cumulative clone extinction to the shrinking effective size of the
      contributing stem-cell pool.
    limitations: >-
      Hematopoiesis-specific, and models the supply of stem cells rather than the
      tissue-level regenerative failure this node asserts.

treatments:
- name: Metformin Preconditioning of Mesenchymal Stem Cells
  description: >-
    Rather than dosing the organism, metformin is used here ex vivo to
    precondition mesenchymal stem cells before autologous transplantation. In
    chronic kidney disease the patient's own MSCs carry accelerated senescence
    and DNA damage - the barrier to autologous cell therapy in exactly the
    population that needs it, since allogeneic transplant risks allosensitization
    in future kidney-transplant candidates. Preconditioning targets the
    stem-cell defect directly and is a distinct delivery pattern from systemic
    gerotherapeutic dosing.

    Tagged CELL_THERAPY rather than SMALL_MOLECULE because the intervention that
    reaches the patient is the autologous MSC graft; metformin is a manufacturing
    step applied to the cells in culture and is never administered to the
    subject. It is retained as `therapeutic_agent` because it remains the
    pharmacological component of the preparation. A systemic-metformin entry for
    the same node would be a different treatment with different evidence.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: metformin-preconditioned autologous MSC transplantation
    term:
      id: NCIT:C116467
      label: Mesenchymal Stem Cell Transplantation
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: Decline in Stem Cell Self-Renewal and Function
    treatment_effect: INHIBITS
    description: >-
      Metformin treatment attenuates the reduced proliferation, accelerated
      senescence, and increased DNA damage of disease-aged mesenchymal stem
      cells, opposing the functional decline this node models.
  - target: Regenerative Failure and Tissue Homeostasis Decline
    treatment_effect: INHIBITS
    description: >-
      Preconditioned stem cells recover paracrine anti-inflammatory and
      antifibrotic activity in vivo, restoring part of the regenerative capacity
      lost with stem-cell exhaustion.
  evidence:
  - reference: PMID:33524231
    reference_title: Metformin inhibits chronic kidney disease-induced DNA damage and senescence of mesenchymal stem cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      CKD MSCs showed reduced proliferation, accelerated senescence, and
      increased DNA damage as compared to control MSCs. These changes were
      significantly attenuated following metformin treatment.
    explanation: >-
      Pairs the stem-cell defect with its correction by metformin on the same
      three readouts, supporting the self-renewal link. Marked INDIRECT because
      the senescence corrected here is CKD-induced - a uremic disease state that
      accelerates stem-cell aging - rather than the chronological stem-cell
      exhaustion this node models; the two are treated as the same defect only by
      inference. Evidence source is IN_VITRO (bone-marrow and adipose-derived
      MSCs cultured and treated ex vivo).
  - reference: PMID:33524231
    reference_title: Metformin inhibits chronic kidney disease-induced DNA damage and senescence of mesenchymal stem cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In unilateral ureteral obstruction kidneys, metformin-treated CKD MSCs more
      effectively attenuated inflammation and fibrosis as compared to untreated
      CKD MSCs.
    explanation: >-
      Shows the preconditioned cells perform better on a tissue-level outcome in
      a live animal, supporting the regenerative-capacity link rather than only
      the cell-intrinsic one. Evidence source is MODEL_ORGANISM (mouse
      unilateral ureteral obstruction model).
  - reference: PMID:32333835
    reference_title: Benefits of Metformin in Attenuating the Hallmarks of Aging.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review focuses on metformin's mechanisms in attenuating hallmarks of
      aging and their interconnectivity, by improving nutrient sensing, enhancing
      autophagy and intercellular communication, protecting against
      macromolecular damage, delaying stem cell aging, modulating mitochondrial
      function, regulating transcription, and lowering telomere attrition and
      senescence.
    explanation: >-
      Names delayed stem cell aging among metformin's hallmark-level effects,
      placing the preconditioning result in the wider geroscience case for the
      drug. Evidence source is OTHER because this is a review.

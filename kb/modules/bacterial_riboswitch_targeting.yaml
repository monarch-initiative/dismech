name: Bacterial Riboswitch Targeting Module
description: >-
  An antibacterial drug-mechanism module for compounds that act on a riboswitch -
  a structured cis-regulatory RNA element in the untranslated region of a
  bacterial mRNA that binds a metabolite and gates expression of the gene
  downstream of it. The causal chain is: a synthetic ligand mimic or
  antimetabolite occupies the riboswitch aptamer domain, the expression platform
  is locked in its off conformation, the genes for biosynthesis and uptake of the
  cognate metabolite are repressed, the cofactor pool is depleted, and growth
  arrests. Key conformance target: "Riboswitch-Gated Essential Gene Expression
  (Riboswitch Target)"; conforming entries point their riboswitch-directed
  treatments at that node via target_mechanisms. The worked case is the flavin
  mononucleotide (FMN) riboswitch controlling riboflavin biosynthesis and
  transport, targeted by ribocil and its analogues, by the natural antimetabolite
  roseoflavin, and by riboswitch-directed antisense oligonucleotides; the T-box
  riboswitches of Gram-positive bacteria are a second, amino-acid-sensing target
  class represented here. The module is complementary to, not overlapping with,
  the sibling antibacterial target-class modules: those name a protein target
  (penicillin-binding proteins, the 70S ribosome, DNA gyrase, RpoB, DHPS/DHFR),
  whereas this one names a regulatory RNA target, which is why it carries its own
  escape node for metabolite salvage - a bypass that has no counterpart in the
  protein-target modules and is the principal limit on which pathogens this
  strategy can reach. Every compound here is preclinical: none is an approved
  drug, and the module records in vitro and animal-model evidence as such.
category: Module
module_categories:
- PHARMACOLOGY
- INFECTIOUS_DISEASE
creation_date: "2026-10-03T00:00:00Z"
notes: >-
  Antibacterial drug-mechanism module, not a specific disease. Do NOT create a
  "Riboswitch Targeting" Disease entry. Disorder entries reference nodes via
  conforms_to (e.g. "bacterial_riboswitch_targeting#Riboswitch-Gated Essential
  Gene Expression (Riboswitch Target)") and point their riboswitch-directed
  treatments at that node via target_mechanisms. Nodes are druggable steps and
  escape routes, not individual compounds.

  Three things to get right when conforming to this module. First, the target is
  the regulatory RNA, not the enzyme it regulates: the resistance mutations map to
  the aptamer and expression platform, not to a biosynthetic enzyme, which is how
  the target was identified in the first place. An entry that models ribocil as a
  riboflavin-synthesis enzyme inhibitor has the mechanism wrong. Second, the
  salvage bypass decides the spectrum, so it is a node rather than a caveat in
  prose - exogenous riboflavin suppresses ribocil activity outright, and whether
  that rules the FMN riboswitch out for Gram-positive infection is unsettled in
  the literature (see the discussion attached to that node). Third, the FMN
  riboswitch is poorly conserved across Gram-negative genera, so activity does
  not transfer between them: aptamer identity relative to E. coli runs from 90
  percent in K. pneumoniae down to 61 percent in A. baumannii, and Ribocil C-PA is
  active against Enterobacteriaceae but not against A. baumannii or P.
  aeruginosa. Treat each genus as a separate claim.

  Roseoflavin is deliberately annotated as a multitarget compound rather than a
  clean riboswitch inhibitor. Its flavin derivatives also bind and inactivate
  flavoenzymes, its activity in E. coli is not fully suppressed by exogenous
  riboflavin, and the conservation between bacterial and human flavoenzymes is a
  stated safety concern. Citing it as evidence for riboswitch occupancy alone
  overstates what the source says.

  Ribocil has no class in either vocabulary that therapeutic_agent accepts, so
  its treatment entry carries a free-text preferred_term with no term binding,
  per the ontology term contract. Searched on 2026-10-03 via the OLS4 search
  API. CHEBI with exact=true for "ribocil": no hits, while the same query
  returns CHEBI:72346 for "roseoflavin", which is bound below. NCIT - the other
  vocabulary the ChemicalEntityTerm enum admits, through its NCIT:C1909
  Pharmacologic Substance branch - with exact=true for "ribocil", "ribocil-C"
  and "Ribocil C-PA", and again without exact=true for "ribocil": no hits in any
  of the four. No term was manufactured for any member of the series.
pathophysiology:
- name: Riboswitch-Gated Essential Gene Expression (Riboswitch Target)
  description: >-
    A riboswitch is a non-coding RNA structure in the untranslated region of a
    bacterial mRNA, built from an aptamer domain that binds a small-molecule
    ligand and a downstream expression platform that converts that binding event
    into a change in expression of the adjacent gene, by attenuating
    transcription or by occluding the ribosome binding site. Over 24 ligand
    classes are known, including the enzyme cofactors thiamine pyrophosphate and
    flavin mononucleotide, several amino acids, the purines, and inorganic ions.
    This is the druggable element: it is bacterial-specific with no known
    mammalian counterpart, and it sits upstream of pathways the cell needs to
    grow. The FMN riboswitch is the worked instance, controlling both de novo
    riboflavin synthesis and riboflavin transport; the T-box riboswitches of
    Gram-positive bacteria are a second class, sensing tRNA aminoacylation state
    to control amino-acid metabolism and transport.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Riboswitch-Mediated Transcriptional Attenuation
    term:
      id: GO:0031555
      label: transcriptional attenuation
  evidence:
  - reference: PMID:26416753
    reference_title: Selective small-molecule inhibition of an RNA structural element.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Riboswitches are non-coding RNA structures located in messenger RNAs that
      bind endogenous ligands, such as a specific metabolite or ion, to regulate
      gene expression.
    explanation: >-
      Establishes the class of element this node represents. Quoted from the
      paper's framing of riboswitch biology rather than from its own results,
      hence quote_role BACKGROUND; evidence_source is OTHER because the quoted
      sentence states established RNA biology rather than reporting a study of
      any particular evidence type.
  - reference: PMID:27485612
    reference_title: "Atomic resolution mechanistic studies of ribocil: A highly selective unnatural ligand mimic of the E. coli FMN riboswitch."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Riboswitches consist of 2 functionally distinct modules an aptamer ligand
      binding domain and a downstream expression platform.
    explanation: >-
      Supports the two-domain architecture this node describes, which is what
      makes the element druggable at the aptamer while the regulatory output is
      produced by the expression platform.
  - reference: PMID:27485612
    reference_title: "Atomic resolution mechanistic studies of ribocil: A highly selective unnatural ligand mimic of the E. coli FMN riboswitch."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      binding of the cognate ligand to the aptamer domain induces a
      conformational change in the expression platform that regulates gene
      expression typically through attenuation of transcription or inhibition of
      translation
    explanation: >-
      Supports the two regulatory outputs named in this node and the binding of
      the GO transcriptional-attenuation term.
  - reference: PMID:28434876
    reference_title: Dual-Targeting Small-Molecule Inhibitors of the Staphylococcus aureus FMN Riboswitch Disrupt Riboflavin Homeostasis in an Infectious Setting.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Riboswitches are bacterial-specific, broadly conserved, non-coding RNA
      structural elements that control gene expression of numerous metabolic
      pathways and transport functions essential for cell growth.
    explanation: >-
      Supports the bacterial specificity and the essentiality of the regulated
      pathways, which together are the selectivity argument for this target
      class.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Importantly, there are no human homologues of the FMN riboswitch and indeed
      no riboswitches are known in mammalian systems
    explanation: >-
      States the absence of a mammalian counterpart, the specific basis for
      expecting bacterial selectivity from compounds that engage this target.
  - reference: PMID:40962680
    reference_title: Specific targeting of transcriptional T-box riboswitches leads to effective inhibition of S. aureus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      T-box riboswitches belong to a specific class of RNA regulatory elements
      that control gene expression in Gram-positive bacteria, including prominent
      human pathogens.
    explanation: >-
      Supports the inclusion of the T-box class as a second riboswitch target
      represented by this node, in Gram-positive pathogens.
  downstream:
  - target: Ligand-Mimetic Riboswitch Occupancy
    description: >-
      A synthetic mimic or an antimetabolite analogue of the cognate ligand binds
      the aptamer domain, which is the drug-target engagement step.
  - target: Riboswitch Target-Site Resistance
    description: >-
      Because the target is the RNA element itself, mutations in the aptamer or
      the expression platform abolish compound binding without disabling the
      pathway.

- name: Ligand-Mimetic Riboswitch Occupancy
  description: >-
    An exogenous compound occupies the aptamer's ligand-binding pocket and holds
    the expression platform in the conformation that shuts the downstream gene
    off. The compound need not resemble the natural ligand: ribocil is
    structurally distinct from flavin mononucleotide yet binds the same pocket and
    acts as a selective synthetic mimic, which is the finding that opened this
    target class beyond cofactor analogues. Occupancy is the step a riboswitch
    ligand, an antimetabolite that is converted intracellularly into a
    riboswitch-binding derivative, and a riboswitch-directed antisense
    oligonucleotide all converge on, by different chemistry. The GO term bound on
    this node is the aptamer's own FMN-binding function, which is what defines the
    pocket being occupied; it is deliberately not a claim that these compounds are
    FMN analogues, since the finding that opened this target class is precisely
    that an occupying compound need not resemble the natural ligand.
  role: central_effector
  molecular_functions:
  - preferred_term: FMN Binding by the Riboswitch Aptamer
    term:
      id: GO:0010181
      label: FMN binding
  evidence:
  - reference: PMID:26416753
    reference_title: Selective small-molecule inhibition of an RNA structural element.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ribocil, a highly selective chemical modulator of bacterial riboflavin
      riboswitches, which was identified in a phenotypic screen and acts as a
      structurally distinct synthetic mimic of the natural ligand, flavin
      mononucleotide, to repress riboswitch-mediated ribB gene expression and
      inhibit bacterial cell growth
    explanation: >-
      The primary report of ligand-mimetic occupancy by a structurally unrelated
      synthetic compound, which is the claim this node makes. Evidence source is
      IN_VITRO because the finding rests on a bacterial phenotypic screen and
      cell-free riboswitch binding rather than on animal or human data.
  - reference: PMID:29736707
    reference_title: Validation and Development of an Escherichia coli Riboflavin Pathway Phenotypic Screen Hit as a Small-Molecule Ligand of the Flavin Mononucleotide Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although ribocil is structurally distinct from the natural riboswitch
      regulatory ligand flavin mononucleotide, ribocil binding to the riboswitch
      results in efficient repression of ribB expression and inhibition of
      riboflavin biosynthesis and bacterial growth.
    explanation: >-
      Confirms that aptamer occupancy, rather than enzyme inhibition, is what
      links compound binding to repression of the downstream gene.
  downstream:
  - target: Repression of Metabolite Biosynthesis and Uptake
    description: >-
      The locked-off expression platform suppresses the biosynthesis and
      transport genes the riboswitch controls.

- name: Repression of Metabolite Biosynthesis and Uptake
  description: >-
    With the riboswitch held off, the genes downstream of it are not expressed. In
    the FMN case the element controls both arms of riboflavin supply - the rib
    biosynthetic genes and, separately, the riboflavin transporter genes - so a
    compound that engages both riboswitches closes de novo synthesis and salvage
    at once. That dual engagement is what has been argued to be necessary in
    Gram-positive organisms, which can import riboflavin from their surroundings.
  role: effector
  biological_processes:
  - preferred_term: Riboflavin Biosynthetic Process
    modifier: DECREASED
    term:
      id: GO:0009231
      label: riboflavin biosynthetic process
  - preferred_term: Riboflavin Transport
    modifier: DECREASED
    term:
      id: GO:0032218
      label: riboflavin transport
  evidence:
  - reference: PMID:27485612
    reference_title: "Atomic resolution mechanistic studies of ribocil: A highly selective unnatural ligand mimic of the E. coli FMN riboswitch."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Indeed, intracellular RF concentrations mediated from de novo synthesis or
      active transport are both regulated by FMN riboswitches, thus reflecting a
      potentially attractive bacterial-specific target for antibiotic
      development.
    explanation: >-
      Supports this node's claim that one riboswitch class gates both the
      synthesis and the uptake arm of riboflavin supply.
  - reference: PMID:28434876
    reference_title: Dual-Targeting Small-Molecule Inhibitors of the Staphylococcus aureus FMN Riboswitch Disrupt Riboflavin Homeostasis in an Infectious Setting.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ribocil-C and RoF specifically inhibit dual FMN riboswitches, separately
      controlling RF biosynthesis and uptake processes essential for MRSA growth
      and pathogenesis
    explanation: >-
      Direct support for repression of both the biosynthesis and the uptake arm,
      in MRSA. Evidence source is IN_VITRO because the mechanistic
      characterization quoted here is genetic, biophysical and biochemical rather
      than an animal or human outcome.
  downstream:
  - target: Flavin Cofactor Starvation and Growth Arrest
    description: >-
      Loss of riboflavin supply depletes the FMN and FAD pools the cell's
      flavoenzymes depend on.
  - target: Exogenous Metabolite Salvage Bypass
    description: >-
      Where the organism can take up the metabolite from its environment,
      repression of the biosynthetic arm is not sufficient to starve it.

- name: Flavin Cofactor Starvation and Growth Arrest
  description: >-
    Riboflavin is the precursor of flavin mononucleotide and flavin adenine
    dinucleotide, the cofactors of the flavoenzymes that carry much of
    intermediary metabolism. Repressing its supply depletes those pools and
    arrests growth; the measured fall in intracellular flavins on treatment is
    what confirms that an antibacterial effect runs through this route rather
    than through an off-target one.
  role: consequence
  biological_processes:
  - preferred_term: FMN Biosynthetic Process
    modifier: DECREASED
    term:
      id: GO:0009398
      label: FMN biosynthetic process
  - preferred_term: FAD Biosynthetic Process
    modifier: DECREASED
    term:
      id: GO:0006747
      label: FAD biosynthetic process
  evidence:
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ribocil C targets the flavin mononucleotide (FMN) riboswitch, ultimately
      inducing bacterial death through riboflavin starvation.
    explanation: >-
      States the causal route from riboswitch engagement to bacterial death by
      starvation, which is the claim of this node.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using an LC-MS/MS assay to monitor flavin levels in E. coli cultures
      treated with Ribocil C-PA (at 0.5x the MIC), reduction in flavins was
      observed
    explanation: >-
      The measurement behind the cofactor-depletion claim, in treated E. coli
      cultures, with the inactive enantiomer as control.

- name: Exogenous Metabolite Salvage Bypass
  description: >-
    The principal limit on this strategy. If the organism can import the
    metabolite whose synthesis has been shut off, it escapes starvation and the
    compound loses its effect. For the FMN riboswitch this is not a marginal
    effect: adding riboflavin to the growth medium suppresses ribocil's
    antibacterial activity completely. Many Gram-positive species and some
    Gram-negatives carry riboflavin transporters, and whether that rules the FMN
    riboswitch out as a Gram-positive target is genuinely disputed - one line of
    work argues salvage makes such compounds unsuitable there, another argues that
    engaging the uptake riboswitch alongside the biosynthetic one is precisely
    what overcomes it. Recorded as a discussion on this node rather than resolved
    here.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Riboflavin Transport
    term:
      id: GO:0032218
      label: riboflavin transport
  evidence:
  - reference: PMID:29736707
    reference_title: Validation and Development of an Escherichia coli Riboflavin Pathway Phenotypic Screen Hit as a Small-Molecule Ligand of the Flavin Mononucleotide Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      intrinsic antibacterial activity against Escherichia coli was completely
      suppressed by addition of exogenous riboflavin to the bacterial growth
      medium
    explanation: >-
      Shows that supplying the metabolite abolishes the antibacterial effect,
      which is the bypass this node represents. The same observation is what
      originally localized the compound's action to the riboflavin pathway.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While Ribocil C kills S. aureus in culture, GP organisms can scavenge
      riboflavin from their environment
    explanation: >-
      Identifies environmental scavenging by Gram-positive organisms as the
      bypass route, and is one side of the dispute recorded in the discussion
      attached to this node.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      thus tempering enthusiasm for Ribocil C specifically, and the FMN
      riboswitch target in general, for S. aureus
    explanation: >-
      Supports the discussion's framing of this as an unresolved interpretive
      dispute rather than an absence of evidence: this assessment was published
      three years after the dual-targeting work and cites it, yet still treats
      the Gram-positive case as unsettled. quote_role is REVIEW_SYNTHESIS because
      the sentence is the authors' appraisal of another group's result rather
      than a finding of their own study.

- name: Riboswitch Target-Site Resistance
  description: >-
    Resistance arises in the RNA target itself, by mutation of the aptamer domain
    or of the expression platform, which abolishes compound binding or uncouples
    binding from repression while leaving the regulated pathway intact. Selection
    of such mutants is how the target was identified - resistance mapped to the
    regulatory RNA rather than to any biosynthetic enzyme. The frequency of
    resistance is high enough to be a stated liability for this target class, and
    resistant mutants grow at rates close to wild type, so there is little fitness
    cost to offset it.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:29736707
    reference_title: Validation and Development of an Escherichia coli Riboflavin Pathway Phenotypic Screen Hit as a Small-Molecule Ligand of the Flavin Mononucleotide Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      resistance mutation selection and whole-genome sequencing showed that the
      target of ribocil was not an enzyme in the riboflavin biosynthesis pathway,
      but instead the flavin mononucleotide riboswitch
    explanation: >-
      Supports both halves of this node: resistance arises at the RNA element,
      and that is what established the RNA rather than an enzyme as the target.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After generating and sequencing 20 different E. coli BW25113 clones
      resistant to Ribocil C-PA, 16 different mutations were observed, all of
      which mapped back to either the FMN riboswitch aptamer or expression
      platform
    explanation: >-
      Localizes resistance mutations to the aptamer and the expression platform,
      the two sub-domains named in this node.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While the elevated frequency of resistance that is apparently associated
      with this target is not ideal
    explanation: >-
      The authors' own statement that resistance frequency is a liability of this
      target class, supporting the caveat in this node rather than a claim about
      any one compound.
treatments:
- name: FMN Riboswitch Ligand (Ribocil Series)
  description: >-
    Ribocil and its analogues ribocil-B, ribocil-C and the accumulation-optimized
    derivative Ribocil C-PA are synthetic small molecules that occupy the FMN
    riboswitch aptamer and repress the riboflavin biosynthesis genes it controls.
    This is the reference instance of the riboswitch drug-target design pattern
    for conforming entries. All of it is preclinical: the series has in vitro
    activity against Enterobacteriaceae clinical isolates and efficacy in mouse
    pneumonia and septicaemia models, and no member has entered clinical
    development. Activity does not generalize across Gram-negative genera,
    because the FMN riboswitch is poorly conserved between them.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ribocil
  target_mechanisms:
  - target: Riboswitch-Gated Essential Gene Expression (Riboswitch Target)
    treatment_effect: INHIBITS
    description: >-
      Occupying the FMN riboswitch aptamer holds the expression platform off and
      represses the riboflavin biosynthesis genes downstream of it, starving the
      cell of flavin cofactors.
  evidence:
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a nearly 2-log reduction in bacterial burden was achieved for Ribocil C-PA
      in mice infected with two different pathogenic strains of E. coli
    explanation: >-
      Animal-model efficacy for a riboswitch-targeting compound, which is the
      strongest evidence available that this target class can be drugged. Evidence
      source is MODEL_ORGANISM because the result is a mouse infection model.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These compounds were inactive against the other GN ESKAPE26 pathogens,
      Acinetobacter baumannii and Pseudomonas aeruginosa, unsurprising based on
      the low homology of the FMN riboswitch target of these organisms with that
      of Enterobacteriaceae
    explanation: >-
      Supports the stated limit on spectrum, and is the reason a conforming entry
      must make the claim per genus rather than for Gram-negatives generally.

- name: Riboflavin Antimetabolite (Roseoflavin)
  description: >-
    Roseoflavin is a natural riboflavin analogue from Streptomyces davawensis. It
    is a prodrug, converted intracellularly to roseoflavin mononucleotide and
    roseoflavin adenine dinucleotide, and the mononucleotide binds FMN
    riboswitches and represses the riboflavin synthesis and transport genes. It is
    recorded here as a multitarget compound, not a clean riboswitch inhibitor: its
    flavin derivatives also associate with and inactivate flavoenzymes, its
    activity in E. coli is not fully suppressed by exogenous riboflavin, and the
    conservation of flavoenzymes between bacteria and humans is a stated safety
    concern for developing it as an antibiotic. Preclinical.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: roseoflavin
      term:
        id: CHEBI:72346
        label: roseoflavin
  target_mechanisms:
  - target: Riboswitch-Gated Essential Gene Expression (Riboswitch Target)
    treatment_effect: INHIBITS
    description: >-
      Roseoflavin mononucleotide binds FMN riboswitches and represses the
      riboflavin synthesis and transport genes they control, alongside
      riboswitch-independent flavoenzyme inhibition.
  evidence:
  - reference: PMID:28434876
    reference_title: Dual-Targeting Small-Molecule Inhibitors of the Staphylococcus aureus FMN Riboswitch Disrupt Riboflavin Homeostasis in an Infectious Setting.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we provide a mechanistic characterization of the antibacterial effects of
      ribocil-C as well as of roseoflavin (RoF), an antimetabolite analog of RF,
      among medically significant Gram-positive bacteria, including
      methicillin-resistant Staphylococcus aureus (MRSA) and Enterococcus
      faecalis
    explanation: >-
      Establishes roseoflavin as a riboflavin antimetabolite characterized
      against Gram-positive pathogens, which is what this treatment entry
      represents.
  - reference: PMID:27485612
    reference_title: "Atomic resolution mechanistic studies of ribocil: A highly selective unnatural ligand mimic of the E. coli FMN riboswitch."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      the antibacterial activity of RoF is not solely the result of inhibition of
      FMN riboswitches as RoFMN and RoFAD have also been demonstrated to
      associate with numerous flavoenzymes encoded by E. coli
    explanation: >-
      Graded REFUTE against the narrower claim that roseoflavin's antibacterial
      effect is attributable to riboswitch inhibition - the quoted sentence
      contradicts that reading, which is why this treatment is annotated as
      multitarget. quote_role is BACKGROUND because "have also been demonstrated"
      marks this as the citing paper restating other groups' flavoenzyme results,
      while evidence_source stays IN_VITRO because that is what the restated
      evidence is.
  - reference: PMID:27485612
    reference_title: "Atomic resolution mechanistic studies of ribocil: A highly selective unnatural ligand mimic of the E. coli FMN riboswitch."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      the high level of structural and functional conservation between bacterial
      and human flavoenzymes does raise considerable safety and toxicity concerns
      from the perspective of developing RoF as a new antibiotic
    explanation: >-
      Records the stated safety concern that bears on roseoflavin's
      developability. quote_role is BACKGROUND rather than REVIEW_SYNTHESIS
      because this is a primary research paper restating established flavoenzyme
      conservation in its own framing, not a review synthesizing work it did not
      perform.

- name: FMN Riboswitch-Directed Antisense Oligonucleotide
  description: >-
    An alternative chemistry against the same target: chimeric antisense
    oligonucleotides designed against the conserved FMN riboswitch, conjugated to
    the pVEC cell-penetrating peptide for uptake. Reported activity against MRSA
    in the low nanomolar range, with no inhibition of E. coli, which lacks the
    targeted riboswitch sequence - the negative control that establishes
    specificity. A conforming entry whose treatment is an oligonucleotide should
    also consider the antisense_oligonucleotide_therapy module, which covers the
    RNase H effector step this exploits. Preclinical.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_transcript: FMN riboswitch mRNA (Staphylococcus aureus)
  delivery_system:
    delivery_platform: CONJUGATE
    targeting_ligand: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Riboswitch-Gated Essential Gene Expression (Riboswitch Target)
    treatment_effect: INHIBITS
    description: >-
      Hybridizing to the FMN riboswitch sequence and recruiting RNase H destroys
      the regulatory element and the transcript carrying it, rather than locking
      it in its off conformation.
  evidence:
  - reference: PMID:41411532
    reference_title: Rational Design of Chimeric Antisense Oligonucleotides that Target FMN Riboswitch mRNAs and Inhibit the Growth of Methicillin-Resistant Staphylococcus aureus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      pVEC-ASO-3 showed the most potent effect, with MIC50 and MIC90 values of
      1.25 and 7.5 nM, respectively. No inhibition was observed in Escherichia
      coli, which lacks the FMN riboswitch, confirming specificity.
    explanation: >-
      Reports both the antibacterial potency against MRSA and the negative
      control in an organism lacking the target, supporting that the effect runs
      through the riboswitch.

- name: T-box Riboswitch Inhibitor
  description: >-
    T-box riboswitches sense the aminoacylation state of their cognate tRNAs and
    control amino-acid metabolism and transport genes in Gram-positive bacteria. A
    virtual screen against T-box crystal structures produced T-box-i, which
    disrupts T-box-mediated transcription in vivo, showed no cytotoxicity in
    mammalian cells, and did not induce resistance in S. aureus cultures - the
    last being notable against the high resistance frequency seen with FMN
    riboswitch ligands. Preclinical, and included here to keep the module from
    being read as FMN-only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

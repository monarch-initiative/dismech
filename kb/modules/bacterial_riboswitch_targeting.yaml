discussions:
- discussion_id: riboswitch_salvage_bypass_gram_positive_suitability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does environmental riboflavin salvage rule the FMN riboswitch out as an
    antibacterial target in Gram-positive pathogens, or does simultaneous
    engagement of the biosynthesis and uptake riboswitches overcome it?
  attaches_to:
  - "pathophysiology#Exogenous Metabolite Salvage Bypass"
  rationale: >-
    Two groups reach opposite conclusions from the same salvage observation, and
    this is a disagreement over how to read the published evidence rather than an
    absence of it. The dual-targeting work argues that because one riboswitch
    class gates both synthesis and transport, a compound engaging both closes the
    bypass, and reports that ribocil-C and roseoflavin do so in MRSA and E.
    faecalis; its title places that work in an infectious setting, it claims
    pharmacological evidence, and it is indexed under the MeSH heading Mice, so
    in vivo experiments with the dual-engaging compounds exist and the gap does
    not claim otherwise. The Gram-negative work, published three years later,
    nonetheless treats the Gram-positive case as unresolved, writing that
    scavenging tempers enthusiasm for the FMN riboswitch target in S. aureus
    while citing that earlier work. So the later group read the dual-targeting
    result and did not take it as settling the question.

    What a reader of this module cannot get from the repository is the design of
    that in vivo experiment - in particular whether the host environment was
    riboflavin-replete, which is the condition on which the two predictions
    diverge. The cached record for the dual-targeting paper is abstract-only and
    its full text was not reachable from the curation environment: the publisher
    returns HTTP 403, and the article is in neither PMC nor Europe PMC open
    access. That is a limit of this curation pass, not a finding about the
    literature, and it is recorded here so the next curator checks the full text
    rather than inheriting the gap. Until someone does, a Gram-positive conformer
    should record the salvage node explicitly rather than treating repression of
    biosynthesis as sufficient.
  proposed_experiments:
  - experiment_id: exp_dual_riboswitch_engagement_gram_positive_replete_host
    name: Dual FMN riboswitch engagement in a Gram-positive infection model under defined host riboflavin availability
    description: >-
      Test a compound that engages both the biosynthetic and the transporter FMN
      riboswitch against a Gram-positive infection in an animal model in which
      host riboflavin availability is measured and varied, rather than left
      uncontrolled. Compare bacterial burden under riboflavin-replete and
      riboflavin-restricted host conditions, against a biosynthesis-only
      riboswitch ligand and against a transporter-riboswitch-null mutant of the
      same strain. The dual-targeting prediction is that efficacy survives a
      replete host because the salvage route is closed pharmacologically; the
      opposing prediction is that a replete host rescues the organism whichever
      riboswitches are engaged. Reading the published dual-targeting in vivo
      experiment against this design is the first step, and may show the
      experiment has in substance already been done.
    experiment_type:
      preferred_term: animal infection model experiment with controlled host metabolite availability
    would_support:
    - "pathophysiology#Repression of Metabolite Biosynthesis and Uptake"
    would_refute:
    - "pathophysiology#Exogenous Metabolite Salvage Bypass"
    supporting_outcome:
    - >-
      Bacterial burden is reduced by the dual-engaging compound in a
      riboflavin-replete host, and that reduction is lost when the transporter
      riboswitch is not engaged, showing that closing both arms is what overcomes
      salvage.
    refuting_outcome:
    - >-
      A riboflavin-replete host rescues bacterial growth whether or not the
      transporter riboswitch is engaged, showing that salvage defeats the
      strategy in Gram-positive organisms regardless of how many riboswitches a
      compound occupies.

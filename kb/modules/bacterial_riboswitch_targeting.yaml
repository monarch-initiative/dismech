    reference_title: Specific targeting of transcriptional T-box riboswitches leads to effective inhibition of S. aureus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we report the characterization of an effective T-box riboswitch inhibitor,
      termed T-box-i, which efficiently disrupts T-box riboswitch-mediated
      transcription in vivo
    explanation: >-
      The primary report of a T-box riboswitch inhibitor, supporting this
      treatment entry and the inclusion of the T-box class in this module.
  - reference: PMID:40962680
    reference_title: Specific targeting of transcriptional T-box riboswitches leads to effective inhibition of S. aureus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It exhibited no cytotoxicity in mammalian cells nor induced antibiotic
      resistance in Staphylococcus aureus cultures.
    explanation: >-
      Supports the selectivity and the absence of induced resistance noted in
      this entry, which is the contrast with the FMN riboswitch ligands' high

name: Alphaherpesvirus Reactivation and Neural Spread Module
category: Module
creation_date: "2026-11-25T00:00:00Z"
module_categories:
- INFECTIOUS_DISEASE
- NEUROSCIENCE
description: >-
  The conserved reactivation pathophysiology of the neurotropic
  alphaherpesviruses (HSV-1, HSV-2 and VZV). After primary infection these
  viruses establish lifelong latency in peripheral sensory ganglion neurons;
  when host immune control over the ganglion wanes, the latent genome
  de-represses and undergoes lytic replication, newly assembled virions are
  carried anterogradely along the sensory axon back out to the epithelial
  territory the neuron innervates, and lytic infection of that epithelium
  produces the characteristic dermatomal or mucosal lesion while replication
  and inflammation in the ganglion injure the sensory neuron and sensitize its
  afferents. The chain is
  trigger (alphaherpesvirus latency in peripheral sensory neurons) ->
  amplifier (reactivation and lytic viral replication in the ganglion) ->
  central_effector (anterograde axonal transport and spread to the innervated
  periphery) ->
  effector (lytic infection of the innervated epithelium) ->
  consequence (ganglionic neuronal injury and neuropathic sensitization). The
  rate-limiting, disorder-agnostic key conformance target is
  "Anterograde Axonal Transport and Spread to the Innervated Periphery" — the
  neuron-borne egress step that every reactivation syndrome funnels through and
  that ties the cutaneous/mucosal lesion to its ganglionic origin. A conforming
  disorder substitutes its own alphaherpesvirus, its own latency ganglion and
  innervated territory, and the organ-specific lesion (herpes zoster
  ophthalmicus: VZV in the trigeminal ganglion, ophthalmic-division dermatome,
  keratitis/uveitis; herpes labialis: HSV-1 in the trigeminal ganglion,
  perioral skin; genital herpes: HSV-2 in the sacral ganglia). It is
  complementary to viral_latency_reservoir_persistence, which is the
  pharmacologic *gating* module explaining why replication-targeting antivirals
  suppress but cannot eradicate the archived genome: that module says why
  aciclovir does not cure, this module is the reactivation-and-spread
  pathophysiology the antiviral transiently interrupts. No pathological-structure
  (Xogenesis) anchor applies; the terminal outputs are a lytic epithelial lesion
  and sensory neuronal injury, not a discrete named pathological structure.
notes: >-
  Do NOT create a "herpesvirus reactivation" or "shingles" Disease entry for
  this module; it is a shared mechanism, not a disease. Conforming entries are
  specific alphaherpesvirus reactivation syndromes (herpes zoster, herpes zoster
  ophthalmicus, zoster oticus / Ramsay Hunt, herpes labialis, genital herpes,
  herpetic keratitis; and, via the rarer transsynaptic branch into the CNS,
  herpes simplex encephalitis). Scope is the neurotropic alphaherpesviruses
  only (HSV-1, HSV-2, VZV / human alphaherpesvirus 3). The beta- and
  gammaherpesviruses (CMV, HHV-6, EBV, KSHV) are explicitly out of scope: they
  establish latency in leukocytes rather than sensory neurons and do not use
  anterograde axonal transport, so an EBV or CMV disease does not conform here.
  Evidence is drawn from the VZV prototype (Gershon et al., Nat Rev Dis Primers)
  and from an alphaherpesvirus-generic directional-spread review (Kramer &
  Enquist, which treats HSV and pseudorabies virus); a conforming human disease
  must carry its own human evidence for the lesions and sequelae it claims.
pathophysiology:
- name: Alphaherpesvirus Latency in Peripheral Sensory Neurons
  role: trigger
  biological_scale: CELLULAR
  description: >-
    After primary infection, a neurotropic alphaherpesvirus establishes lifelong
    latency in the neurons of a peripheral sensory ganglion (trigeminal or dorsal
    root ganglion). During latency the viral genome persists transcriptionally
    quiescent, no infectious particles are produced, and the neuron is not
    overtly damaged. This latent reservoir is the substrate on which the
    reactivation syndrome depends.
  biological_processes:
  - preferred_term: viral latency
    term:
      id: GO:0019042
      label: viral latency
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Reactivation and Lytic Viral Replication in the Sensory Ganglion
    description: Loss of immune control over the latent ganglion permits reactivation.
  evidence:
  - reference: DOI:10.3390/v5020678
    reference_title: Directional Spread of Alphaherpesviruses in the Nervous System
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Many alphaherpesvirus infections originate at peripheral sites, such as epithelial tissues, and then enter neurons of the peripheral nervous system (PNS), where lifelong latency is established."
    explanation: Establishes that alphaherpesviruses establish lifelong latency in peripheral sensory neurons after a peripheral primary infection.
  - reference: PMID:27188665
    reference_title: Varicella zoster virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Primary infection is followed by latency in ganglionic neurons. During this period, no virus particles are produced and no obvious neuronal damage occurs."
    explanation: Confirms the quiescent, non-damaging latent state in ganglionic neurons for the VZV prototype.
- name: Reactivation and Lytic Viral Replication in the Sensory Ganglion
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    When cell-mediated immune control over the latent ganglion declines (ageing,
    immunosuppression, stress), the latent genome de-represses and re-enters the
    lytic programme, producing viral genome replication and assembly of new
    virions within the ganglion neuron. This is the amplifying event that
    converts a silent reservoir into productive, spreadable infection.
  biological_processes:
  - preferred_term: release from viral latency
    modifier: INCREASED
    term:
      id: GO:0019046
      label: release from viral latency
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Anterograde Axonal Transport and Spread to the Innervated Periphery
    description: Newly assembled virions are transported anterogradely out of the ganglion.
  - target: Ganglionic Neuronal Injury and Neuropathic Sensitization
    description: Lytic replication and inflammation in the ganglion injure the sensory neuron.
  evidence:
  - reference: PMID:27188665
    reference_title: Varicella zoster virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reactivation of the virus leads to virus replication, which causes zoster (shingles) in tissues innervated by the involved neurons, inflammation and cell death"
    explanation: Establishes reactivation driving lytic viral replication in the involved neurons.
  - reference: DOI:10.3390/v5020678
    reference_title: Directional Spread of Alphaherpesviruses in the Nervous System
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following reactivation from latency and assembly of new viral particles, the infection typically spreads back out towards the periphery."
    explanation: Confirms reactivation produces assembled progeny virions that then spread outward, the generic alphaherpesvirus step.
- name: Anterograde Axonal Transport and Spread to the Innervated Periphery
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Progeny virions assembled after reactivation are transported anterogradely
    along the sensory axon, from the ganglion cell body out to the nerve endings
    in the epithelial territory the neuron innervates. This neuron-borne egress
    is the conserved, rate-limiting step that distinguishes alphaherpesvirus
    reactivation from systemic viraemia and is the key conformance target: every
    reactivation syndrome, whatever virus and territory, funnels through this
    directional transport step.
  biological_processes:
  - preferred_term: anterograde axonal transport
    modifier: INCREASED
    term:
      id: GO:0008089
      label: anterograde axonal transport
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Lytic Infection of the Innervated Epithelium
    description: Anterograde delivery seeds lytic infection of the target epithelium.
  - target: Transsynaptic Spread into the Central Nervous System
    description: Rarely, the same neuron-to-neuron transport carries virus into the CNS.
  evidence:
  - reference: DOI:10.3390/v5020678
    reference_title: Directional Spread of Alphaherpesviruses in the Nervous System
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Directional spread of infection in the nervous system is a key component of the viral lifecycle and is critical for the onset of alphaherpesvirus-related diseases."
    explanation: Establishes directional neuronal spread of infection as the rate-limiting step for alphaherpesvirus disease.
  - reference: PMID:16971450
    reference_title: Herpes simplex virus capsids are transported in neuronal axons without an envelope containing the viral glycoproteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We concluded that HSV capsids are transported in axons without an envelope containing viral glycoproteins, with glycoproteins transported separately and assembling with capsids at axon termini."
    explanation: Primary experimental evidence that alphaherpesvirus (HSV) capsids are transported down the axon to the termini, the anterograde egress step.
  - reference: DOI:10.3390/v5020678
    reference_title: Directional Spread of Alphaherpesviruses in the Nervous System
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the infection typically spreads back out towards the periphery"
    explanation: Confirms the directional (outward/anterograde) spread of reactivated virus toward the innervated periphery.
- name: Lytic Infection of the Innervated Epithelium
  role: effector
  biological_scale: TISSUE
  description: >-
    Virions delivered to the nerve endings infect the keratinocytes of the
    innervated epithelium and replicate lytically, producing the characteristic
    dermatomal or mucosal vesicular lesion (shingles for VZV, cold sores for
    HSV-1, genital lesions for HSV-2). The lesion is confined to the territory of
    the reactivating neuron, which is why it is dermatomal.
  biological_processes:
  - preferred_term: viral life cycle
    modifier: INCREASED
    term:
      id: GO:0019058
      label: viral life cycle
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: DOI:10.3390/v5020678
    reference_title: Directional Spread of Alphaherpesviruses in the Nervous System
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These spread events result in the characteristic lesions (cold sores) commonly associated with herpes simplex virus (HSV) and herpes zoster (shingles) associated with varicella zoster virus (VZV)."
    explanation: Ties the anterograde spread to the characteristic epithelial lesions across alphaherpesviruses.
  - reference: PMID:27188665
    reference_title: Varicella zoster virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "causes zoster (shingles) in tissues innervated by the involved neurons"
    explanation: Confirms the lesion arises in the epithelial tissue innervated by the reactivating neuron.
- name: Ganglionic Neuronal Injury and Neuropathic Sensitization
  role: consequence
  biological_scale: TISSUE
  description: >-
    Lytic replication and the accompanying inflammatory response in the ganglion
    injure and kill sensory neurons and sensitize surviving afferents. This
    neuronal damage, rather than the skin lesion, is what can outlast the acute
    infection as chronic neuropathic pain (post-herpetic neuralgia for VZV). The
    rarer transsynaptic extension of the same spread machinery into the CNS
    produces the encephalitic/myelitic complications described in the module
    notes.
  biological_processes:
  - preferred_term: neuroinflammatory response
    modifier: INCREASED
    term:
      id: GO:0150076
      label: neuroinflammatory response
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  evidence:
  - reference: PMID:27188665
    reference_title: Varicella zoster virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "in tissues innervated by the involved neurons, inflammation and cell death"
    explanation: Establishes ganglionic inflammation and neuronal cell death as consequences of reactivation.
  - reference: PMID:27188665
    reference_title: Varicella zoster virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "a process that can lead to persistent radicular pain (postherpetic neuralgia)"
    explanation: Links the ganglionic injury to persistent neuropathic (radicular) pain, the chronic neuronal sequela.
- name: Transsynaptic Spread into the Central Nervous System
  role: consequence
  biological_scale: TISSUE
  description: >-
    Occasionally the same neuron-to-neuron transport carries the virus
    transsynaptically from the peripheral ganglion into higher-order neurons of
    the central nervous system - the route behind the rare encephalitic and
    myelitic complications (herpes simplex encephalitis is the paradigm). This is
    a branch off the anterograde-spread node, not part of the mucocutaneous spine.
  biological_processes:
  - preferred_term: anterograde axonal transport
    modifier: INCREASED
    term:
      id: GO:0008089
      label: anterograde axonal transport
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: DOI:10.3390/v5020678
    reference_title: Directional Spread of Alphaherpesviruses in the Nervous System
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Occasionally, the infection spreads transsynaptically from the PNS into higher order neurons of the central nervous system (CNS)."
    explanation: Establishes the rarer transsynaptic CNS branch that anchors encephalitic conformers such as herpes simplex encephalitis.

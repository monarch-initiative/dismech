treatments:
- name: Full Mu-Opioid Receptor Agonist Analgesics
  description: >-
    The opioid analgesics in ordinary clinical use - morphine, fentanyl,
    oxycodone and their congeners - acting as full agonists at the mu-opioid
    receptor. They engage the trigger node of this module and therefore produce
    every branch of it together: analgesia, respiratory depression,
    constipation and reward are one pharmacology, not a therapeutic effect plus
    separable side effects. This is the drug-target design pattern for a
    conforming pain or poisoning entry: point the treatment at the receptor
    activation node, and read the adverse effects off the module's branches.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: morphine
      term:
        id: CHEBI:17303
        label: morphine
    - preferred_term: fentanyl
      term:
        id: CHEBI:119915
        label: fentanyl
    - preferred_term: oxycodone
      term:
        id: CHEBI:7852
        label: oxycodone
  target_mechanisms:
  - target: Mu-Opioid Receptor Agonist Binding and Activation
    treatment_effect: ACTIVATES
    description: >-
      The agonist occupies and activates the mu-opioid receptor, driving the
      Gi/o coupling, GIRK and calcium-channel arms, and the neuronal
      hyperpolarization that every branch of the module depends on.
  evidence:
  - reference: PMID:29273520
    reference_title: Progress in understanding mechanisms of opioid-induced gastrointestinal
      adverse effects and respiratory depression.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Opioid-related adverse effects such as constipation, nausea, and vomiting
      pose challenges for compliance and continuation of the therapy for chronic
      pain management.
    explanation: >-
      Supports the design pattern this treatment encodes: the analgesic benefit
      and the adverse branches of the module come from the same receptor action,
      which is why the treatment targets the trigger node rather than a
      downstream pain phenotype. Evidence source is OTHER because this is a
      review article.
- name: Methadone (Long-Acting Full Agonist Maintenance)
  description: >-
    A long-acting full agonist at the mu-opioid receptor, used as agonist
    maintenance treatment for opioid use disorder and, less commonly, as an
    analgesic. Mechanistically it engages the same trigger node as the other
    full agonists; what makes it a maintenance drug is pharmacokinetic rather
    than pharmacodynamic - a long half-life and oral route give sustained
    receptor occupancy that suppresses withdrawal and produces cross-tolerance
    to illicit opioids without the repeated peaks that drive reinforcement.
    Methadone's non-opioid actions, including NMDA receptor antagonism and
    hERG-related QT prolongation, are outside this module and belong on the
    entries that prescribe it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methadone
      term:
        id: CHEBI:6807
        label: methadone
  target_mechanisms:
  - target: Mu-Opioid Receptor Agonist Binding and Activation
    treatment_effect: ACTIVATES
    description: >-
      Sustained full agonist occupancy of the mu-opioid receptor, which
      suppresses withdrawal and blunts the reinforcing effect of further opioid
      exposure through cross-tolerance.
  evidence:
  - reference: PMID:31009632
    reference_title: "Progress in agonist therapy for substance use disorders: Lessons
      learned from methadone and buprenorphine."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Of these, methadone is a mu opioid receptor full agonist, while
      buprenorphine and varenicline are partial agonists that bind at mu opioid
      and α4β2 nicotinic acetylcholine receptors, respectively.
    explanation: >-
      Establishes methadone's efficacy class at the receptor this module is
      about, which is the property that distinguishes it from buprenorphine on
      the same trigger node. Evidence source is OTHER because this is a review
      article.
  - reference: PMID:31009632
    reference_title: "Progress in agonist therapy for substance use disorders: Lessons
      learned from methadone and buprenorphine."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      As such, methadone and buprenorphine have become first-line
      pharmacological maintenance treatments for OUD
    explanation: >-
      Supports the clinical role of agonist maintenance, the use of this module
      an opioid use disorder entry conforms to.
- name: Buprenorphine (Partial Agonist)
  description: >-
    A partial agonist at the mu-opioid receptor, used for opioid use disorder
    maintenance and for analgesia. It belongs on the same trigger node as the
    full agonists because the receptor action is the same; the difference is
    intrinsic efficacy, and its clinical consequence is a ceiling on the
    respiratory branch - over a two-fold dose range in healthy volunteers peak
    respiratory depression did not grow while analgesia grew substantially. The
    ceiling is a property of this agonist on that branch and is recorded there;
    it should not be read as evidence that the branches are carried by different
    transducers, which is the separate and unsettled biased-agonism question.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: buprenorphine
      term:
        id: CHEBI:3216
        label: buprenorphine
  target_mechanisms:
  - target: Mu-Opioid Receptor Agonist Binding and Activation
    treatment_effect: ACTIVATES
    description: >-
      Partial agonist activation of the mu-opioid receptor: enough receptor
      activation to suppress withdrawal and produce analgesia, with a submaximal
      effect that caps the respiratory branch.
  evidence:
  - reference: PMID:16547090
    reference_title: Buprenorphine induces ceiling in respiratory depression but not
      in analgesia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While buprenorphine's analgesic effect increased significantly,

name: Mu-Opioid Receptor Agonism Module
description: >-
  A conserved drug-mechanism module for agonism at the mu-opioid receptor
  (MOR, OPRM1), the shared mechanism of the opioid analgesics and of the
  agonist maintenance treatments for opioid use disorder. Agonist occupancy of
  MOR activates inhibitory Gi/o proteins, which inhibit adenylyl cyclase while
  the released G beta-gamma subunits open G-protein-gated inwardly rectifying
  potassium (GIRK) channels and inhibit voltage-gated calcium channels. The
  resulting neuronal hyperpolarization and reduced neurotransmitter release is
  the single rate-limiting step and the key conformance target: every
  consequence of MOR agonism, therapeutic and toxic, is that one cellular
  effect read out in a different neuronal population. Four tissue branches
  follow: antinociception in the spinal dorsal horn and the supraspinal
  descending modulatory system (analgesia); depression of the inspiratory
  rhythm generator of the pre-Botzinger complex (opioid-induced respiratory
  depression, the mechanism of fatal overdose); inhibition of enteric neurons
  of the myenteric and submucosal plexuses (opioid-induced constipation); and
  disinhibition of mesolimbic dopamine neurons through hyperpolarization of
  local GABAergic interneurons (reward and reinforcement). A fifth, modulatory
  branch, GRK-mediated receptor phosphorylation with beta-arrestin recruitment
  and receptor internalization, feeds a separate tolerance and dependence
  consequence, which is kept apart from reward because the two have different
  proximate causes here and different time courses. Drug-target pattern: a
  treatment points at
  the receptor-activation trigger node with treatment_effect ACTIVATES, and the
  agonist's efficacy class is what distinguishes the treatments on that one
  node - full agonists (morphine, fentanyl, oxycodone) and the long-acting full
  agonist methadone against the partial agonist buprenorphine, whose ceiling on
  respiratory depression without a ceiling on analgesia is recorded on the
  respiratory branch. Complementary to, and deliberately not overlapping with,
  addiction_cycle (which starts downstream at mesolimbic dopamine release and
  models the three-stage neurocircuitry of addiction itself) and
  spinal_hsp90_opioid_enhancement (which models amplification of spinal MOR
  signaling by a chaperone-inhibitor adjuvant, not the receptor engagement
  itself).
category: Module
module_categories:
- PHARMACOLOGY
- TOXICOLOGY
- NEUROSCIENCE
creation_date: "2026-10-15T00:00:00Z"
notes: >-
  This is a drug-mechanism module, not a disease. Do not create a generic
  "Opioid Effect" or "Opioid Toxicity" Disease entry from it. The disease
  entries are the ones that conform: Acute_Opioid_Poisoning on the respiratory
  branch, Opioid_Use_Disorder on the reward/tolerance branch,
  Acute_Post-Surgical_Pain and other pain entries on the analgesia branch, and
  any entry whose treatments include an opioid on the trigger node.

  SCOPE. The module covers AGONISM only. Antagonism at the same receptor
  (naloxone reversal of overdose, naltrexone for relapse prevention, and the
  peripherally acting mu-opioid receptor antagonists used for opioid-induced
  constipation) is a separate module, because the consequence chain differs
  rather than simply inverting; it is planned as mu-opioid receptor antagonism
  in projects/GPCR.md. Kappa- and delta-receptor pharmacology, the mixed
  agonist-antagonists, and the noradrenergic and GABAergic physiology of opioid
  withdrawal outside the reward circuit are out of scope and stay on the
  disorder entries.

  BUPRENORPHINE belongs here rather than in a third module: it is a partial
  agonist at the same receptor and engages the same trigger node, and its
  clinically decisive property is a ceiling on the respiratory branch with no
  ceiling on analgesia over the same dose range (PMID:16547090). That ceiling
  is recorded as evidence on the respiratory-depression consequence node and in
  the buprenorphine treatment entry, not as a separate mechanism.

  BOUNDARY WITH addiction_cycle. The reward branch here stops at the
  consequence node "Opioid Reward and Reinforcement", which is the same event
  as the addiction_cycle trigger node "Acute Mesolimbic Dopamine
  Reinforcement", reached through the opioid-specific disinhibition
  pharmacology this module supplies. That node is the declared hand-off: an
  opioid use disorder entry should conform to both modules, to this one for how
  the drug reaches dopamine release and to addiction_cycle for what repeated
  reward then does to the circuit. Do not re-model incentive salience, the
  ventral-to-dorsal striatal shift, or the extended-amygdala stress systems
  here. Tolerance and dependence are a separate consequence node in this
  module, fed by the receptor-desensitization branch rather than by the
  dopamine branch; addiction_cycle's own opponent-process node
  ("Reward Deficit and Stress-System Recruitment") is the circuit-level
  adaptation and is not the same claim.

  Node term-binding follows module convention (GO, CL and UBERON terms only;
  the drug identities live on the treatments' therapeutic_agent as CHEBI ids).
  The receptor gene OPRM1 is bound on the trigger node. GO has no term for a
  pre-Botzinger-complex-specific respiratory rhythm process, so the respiratory
  branch uses the generic nervous-system regulation of respiratory gaseous
  exchange and carries the anatomical specificity in locations.

  BIASED AGONISM IS NOT SETTLED and is recorded as a hypothesis group
  (biased_agonism_separates_analgesia_from_side_effects, status EMERGING) plus
  an open knowledge gap, not as a module node. The original beta-arrestin2
  account of respiratory depression did not replicate in a three-laboratory
  consortium (PMID:32052419), and the therapeutic indices of the G-protein-biased
  compounds track their intrinsic efficacy rather than their bias factors
  (PMID:32854452). A conforming entry must not assert that oliceridine or any
  other biased agonist spares a branch of this module.
mechanistic_hypotheses:
- hypothesis_group_id: biased_agonism_separates_analgesia_from_side_effects
  hypothesis_label: G-Protein-Biased Agonism Separates Analgesia from Respiratory
    and Gastrointestinal Effects
  status: EMERGING
  description: >-
    The proposal that the analgesic and the adverse branches of this module are
    carried by different transducers at the same receptor - G protein for
    antinociception, beta-arrestin2 for respiratory depression and constipation
    - so that an agonist biased towards G protein would keep the analgesia
    branch and spare the others. It is recorded as emerging rather than
    canonical because its two load-bearing claims are both contested: the
    beta-arrestin2 knockout phenotype on which it rests did not replicate, and
    the therapeutic indices of the compounds built on it correlate with their
    intrinsic efficacy instead of with their bias. An alternative reading of
    the same data is that oliceridine, PZM21 and SR-17018 are simply partial
    agonists, which would place their improved indices on the same axis as
    buprenorphine's ceiling rather than on a separate transducer.
  evidence:
  - reference: PMID:32854452
    reference_title: Biased versus Partial Agonism in the Search for Safer Opioid Analgesics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies in β-arrestin 2 gene knockout (βarr2(-/-)) animals indicate that
      morphine analgesia is potentiated while side effects are reduced,
      suggesting that drugs biased away from arrestin may manifest with a
      reduced-side-effect profile.
    explanation: >-
      The result the hypothesis was built on, and the only evidence here that
      asserts its content: in beta-arrestin2 knockout animals analgesia was
      potentiated while the adverse effects were reduced, which is the
      transducer separation the hypothesis claims. Evidence source is
      MODEL_ORGANISM because the quoted text describes knockout animals; the
      citing publication is a review restating them, hence quote_role
      REVIEW_SYNTHESIS. The two items below are why this did not hold.
  - reference: PMID:32854452
    reference_title: Biased versus Partial Agonism in the Search for Safer Opioid Analgesics.
    supports: NO_EVIDENCE
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Several new molecules have been identified as mu receptor G-protein-biased
      agonists, including oliceridine (TRV130), PZM21 and SR-17018.
    explanation: >-
      Context rather than support: it names the compounds the hypothesis is
      pursued with, which is why they are named in the hypothesis description,
      but it makes no claim about whether bias separates the branches. Graded
      NO_EVIDENCE so that the compound list is not read as evidence for the
      transducer account.
  - reference: PMID:32854452
    reference_title: Biased versus Partial Agonism in the Search for Safer Opioid Analgesics.
    supports: REFUTE
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      there was a correlation between their therapeutic indices and their
      efficacies, but not their bias factors
    explanation: >-
      Cuts against the bias account of the improved safety profile: across the
      candidate compounds the therapeutic index tracked intrinsic efficacy,
      which is the partial-agonism explanation rather than the biased-signalling
      one.
  - reference: PMID:32052419
    reference_title: Morphine-induced respiratory depression is independent of β-arrestin2
      signalling.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings do not support the original suggestion that β-arrestin2
      signalling plays a key role in opioid-induced respiratory depression
    explanation: >-
      A three-laboratory consortium found morphine- and fentanyl-induced
      respiratory depression in beta-arrestin2 knockout mice indistinguishable
      from wild type, removing the genetic premise of the hypothesis. Evidence
      source MODEL_ORGANISM (mouse knockout).
discussions:
- discussion_id: gap_mor_transducer_assignment_of_branches
  prompt: >-
    Which transducer or receptor conformation, if any, distinguishes the
    antinociceptive branch of mu-opioid receptor agonism from the respiratory
    and gastrointestinal branches, given that all four branches are currently
    explained by the same hyperpolarization and reduced transmitter release in
    different neuronal populations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Hyperpolarization and Reduced Neurotransmitter Release
  - pathophysiology#Opioid-Induced Respiratory Depression
  - mechanistic_hypotheses#biased_agonism_separates_analgesia_from_side_effects
  rationale: >-
    The module's central effector is one cellular event, so on the mechanism as
    modelled there is nothing to separate the therapeutic from the toxic
    branches except which neurons express the receptor. The transducer-bias
    account that would supply such a separation has lost both of its supporting
    results. Whether the branches can be dissociated at the receptor at all, as
    opposed to only by restricting drug access to a neuronal population, is
    unresolved and would need new experiments: a receptor variant or ligand
    that demonstrably moves one branch without moving the central effector in
    the other.
  proposed_experiments:
  - experiment_id: conditional_oprm1_rescue_branch_separation
    experiment_design: TARGETED_PERTURBATION
    name: Conditional Oprm1 rescue in defined respiratory and nociceptive populations
    description: >-
      Re-express mu-opioid receptors in defined neuronal populations of an
      Oprm1-null background and measure antinociception and respiratory rate
      depression in the same animals, to establish how much of the branch
      separation is population-restricted receptor expression rather than
      transducer identity.
    would_support:
    - pathophysiology#Neuronal Hyperpolarization and Reduced Neurotransmitter Release
    supporting_outcome:
    - >-
      Antinociception and respiratory depression track the population in which
      the receptor is restored, with no residual separation attributable to the
      ligand.
    would_refute:
    - mechanistic_hypotheses#biased_agonism_separates_analgesia_from_side_effects
    refuting_outcome:
    - >-
      Branch separation persists within a single receptor-expressing population
      and varies with the agonist, which would require a transducer-level
      explanation.
pathophysiology:
- name: Mu-Opioid Receptor Agonist Binding and Activation
  description: >-
    The trigger and the drug-target node. An opioid agonist - endogenous
    (beta-endorphin, enkephalins) or exogenous (morphine, fentanyl, oxycodone,
    methadone, buprenorphine) - occupies the mu-opioid receptor encoded by
    OPRM1, a seven-transmembrane receptor that couples to inhibitory G
    proteins. Agonists differ on this node in efficacy rather than in
    mechanism: methadone is a full agonist and buprenorphine a partial agonist
    at the same receptor, which is what sets the ceiling recorded on the
    respiratory branch. Receptor expression across nociceptive, brainstem
    respiratory, enteric and mesolimbic circuits is what makes one receptor
    event produce four distinct consequences.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: mu-opioid receptor activation by agonist
    term:
      id: GO:0004985
      label: G protein-coupled opioid receptor activity
    modifier: INCREASED
  genes:
  - preferred_term: OPRM1
    term:
      id: hgnc:8156
      label: OPRM1
  evidence:
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      All four receptors are G-protein coupled and activate inhibitory G
      proteins.
    explanation: >-
      Establishes the trigger of this module: agonist occupancy of an opioid
      receptor activates inhibitory G proteins, the step every downstream node
      depends on. Evidence source is OTHER because this is a review article.
  - reference: PMID:29273520
    reference_title: Progress in understanding mechanisms of opioid-induced gastrointestinal
      adverse effects and respiratory depression.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Opioids evoke analgesia through activation of opioid receptors
      (predominantly the μ opioid receptor) in the central nervous system.
    explanation: >-
      Names the mu-opioid receptor as the receptor through which opioid
      analgesia is produced, which is why this module is receptor-specific
      rather than generic to the opioid receptor family.
  downstream:
  - target: Gi/o Coupling and Adenylyl Cyclase Inhibition
    description: >-
      Agonist-bound receptor activates pertussis-toxin-sensitive Gi/o
      heterotrimers, whose alpha subunit inhibits adenylyl cyclase.
  - target: Mu-Opioid Receptor Desensitization and Internalization
    description: >-
      The same agonist occupancy exposes the receptor to kinase-mediated
      regulation, which over continued exposure uncouples it from these
      transducers.
- name: Gi/o Coupling and Adenylyl Cyclase Inhibition
  description: >-
    Activated mu-opioid receptor engages inhibitory Gi/o heterotrimeric G
    proteins. The dissociated G alpha-i subunit inhibits adenylyl cyclase and
    lowers cyclic AMP, reducing protein kinase A activity and cAMP-dependent
    calcium influx. This is the classical biochemical signature of opioid
    receptor activation, and its compensatory reversal - upregulation of
    adenylyl cyclase and cAMP signalling during chronic exposure - is the
    adaptation that the tolerance and dependence consequence node records.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: opioid-receptor-mediated inhibition of adenylyl cyclase
    term:
      id: GO:0031635
      label: adenylate cyclase-inhibiting opioid receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Today it is widely accepted that all four opioid receptor types couple to
      pertussis toxin sensitive G-proteins including Gαi, to cause inhibition of
      cAMP formation.
    explanation: >-
      States the Gi coupling and the adenylyl cyclase inhibition that define
      this node, including the pertussis-toxin sensitivity that established it.
  downstream:
  - target: G Beta-Gamma Gating of GIRK Current and Calcium Channel Inhibition
    description: >-
      The G beta-gamma subunits released in the same activation step act
      directly on potassium and calcium channels, in parallel with the cyclase
      arm.
- name: G Beta-Gamma Gating of GIRK Current and Calcium Channel Inhibition
  description: >-
    The ion-channel arm, and the one that carries most of the acute neuronal
    effect. G beta-gamma released from the activated Gi/o heterotrimer opens
    G-protein-gated inwardly rectifying potassium channels (Kir3/GIRK),
    increasing potassium conductance, and binds directly to voltage-gated
    calcium channels of the P/Q-, N- and L-types, reducing calcium current by
    making pore opening harder to reach from a given voltage step. The two
    effects are complementary rather than redundant: the potassium current acts
    postsynaptically and somatically to silence tonic firing, while the calcium
    inhibition acts presynaptically to cut transmitter release.
  role: amplifier
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: GIRK (Kir3) channel opening by G beta-gamma
    term:
      id: GO:0015467
      label: G-protein activated inward rectifier potassium channel activity
    modifier: INCREASED
  - preferred_term: presynaptic voltage-gated calcium channel current
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      In several reports, the inhibitory effects of opioids on neural
      excitability were shown to be mediated by interactions of opioid
      receptors with G protein-regulated inwardly rectifying potassium channel
      (Kir3)
    explanation: >-
      Supports the GIRK/Kir3 half of this node as the route by which opioid
      receptors reduce neuronal excitability.
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Opioid receptor induced inhibition of calcium conductance is mediated by
      binding of the dissociated Gβγ subunit directly to the channel.
    explanation: >-
      Supports the calcium-channel half of this node and attributes it to direct
      G beta-gamma binding, which is why both channel effects are placed on one
      node downstream of Gi/o activation.
  downstream:
  - target: Neuronal Hyperpolarization and Reduced Neurotransmitter Release
    description: >-
      Increased potassium conductance hyperpolarizes the neuron while reduced
      presynaptic calcium entry lowers evoked transmitter release.
- name: Neuronal Hyperpolarization and Reduced Neurotransmitter Release
  description: >-
    The central effector and the key conformance target: the single
    rate-limiting cellular event of mu-opioid receptor agonism. The GIRK
    current hyperpolarizes the neuron and silences tonic activity, while
    reduced presynaptic calcium entry lowers the probability of transmitter
    release. Everything below this node is the same event read out in a
    different neuronal population, which is why the module has one trunk and
    four branches rather than four mechanisms. Conforming entries substitute
    the population their disease concerns (dorsal horn projection neurons and
    primary afferent terminals, pre-Botzinger complex rhythm-generating
    neurons, enteric neurons, mesolimbic GABAergic interneurons) and keep this
    node unchanged.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: opioid-evoked membrane hyperpolarization
    term:
      id: GO:0060081
      label: membrane hyperpolarization
    modifier: INCREASED
  - preferred_term: evoked neurotransmitter release
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: DECREASED
  cell_types:
  - preferred_term: mu-opioid-receptor-expressing neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      This process causes cellular hyperpolarization and inhibits tonic neural
      activity.
    explanation: >-
      States the hyperpolarization half of the central effector as the
      consequence of G-protein-gated potassium channel activation.
  - reference: PMID:20977770
    reference_title: Dissociation of μ- and δ-opioid inhibition of glutamatergic synaptic
      transmission in superficial dorsal horn.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Under basal conditions the μ-opioid agonist DAMGO (3 μM) reduced the rate
      of miniature EPSCs in 68% of neurons
    explanation: >-
      Measures the reduced-transmitter-release half of the central effector
      directly: a mu-opioid agonist lowers the frequency, not the amplitude, of
      miniature excitatory events, the signature of a presynaptic release
      effect. Evidence source IN_VITRO (patch-clamp recordings in rat spinal
      cord slices).
  downstream:
  - target: Spinal and Supraspinal Antinociception
    description: >-
      In nociceptive circuits the same event suppresses transmission of
      nociceptive input and engages descending modulation.
  - target: Brainstem Respiratory Rhythm Depression
    description: >-
      In the brainstem inspiratory rhythm generator the same event slows
      respiratory rate.
  - target: Enteric Neuron Inhibition and Slowed Propulsive Motility
    description: >-
      In the enteric nervous system the same event suppresses the neural drive
      to propulsive motility and fluid secretion.
  - target: Mesolimbic Dopamine Disinhibition
    description: >-
      In the ventral tegmental area the neuron hyperpolarized is a GABAergic
      interneuron, so the net effect on the dopamine neuron is excitatory.
- name: Spinal and Supraspinal Antinociception
  description: >-
    The analgesia branch. In the superficial dorsal horn of the spinal cord,
    mu-opioid receptor agonism inhibits glutamate release from primary afferent
    terminals and hyperpolarizes second-order neurons, suppressing transmission
    of nociceptive input. Supraspinally, receptor agonism in the periaqueductal
    gray and the rostral ventromedial medulla disinhibits descending
    pain-modulating pathways that in turn inhibit spinal nociceptive
    transmission - the same hyperpolarization producing a net excitatory effect
    because the cell silenced is inhibitory. The two sites are synergistic,
    which is why systemic, intrathecal and epidural routes all produce
    analgesia. GO has no term for transmission of nociceptive input through the
    dorsal horn, so the node is bound to sensory perception of pain, which is
    the process this suppressed transmission is a step of: the binding names the
    pathway the step belongs to and the modifier records the direction, while
    the anatomical specificity is carried in locations. The second-order cell is
    bound to the broad neuron of the dorsal spinal cord rather than to dorsal
    horn interneuron, because the population includes lamina I projection
    neurons and CL has no class for those.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: transmission of nociceptive input in the dorsal horn
    term:
      id: GO:0019233
      label: sensory perception of pain
    modifier: DECREASED
  cell_types:
  - preferred_term: nociceptor afferent terminal in superficial dorsal horn
    term:
      id: CL:0000198
      label: pain receptor cell
  - preferred_term: second-order dorsal horn neuron
    term:
      id: CL:0002611
      label: neuron of the dorsal spinal cord
  locations:
  - preferred_term: superficial dorsal horn of spinal cord
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  - preferred_term: periaqueductal gray
    term:
      id: UBERON:0003040
      label: central gray substance of midbrain
  - preferred_term: nucleus raphe magnus (rostral ventromedial medulla)
    term:
      id: UBERON:0002156
      label: nucleus raphe magnus
  evidence:
  - reference: PMID:20977770
    reference_title: Dissociation of μ- and δ-opioid inhibition of glutamatergic synaptic
      transmission in superficial dorsal horn.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      The superficial dorsal horn of the spinal cord is a major site of
      μ-opioid receptor mediated analgesia
    explanation: >-
      Places the spinal site of this branch. The quote is the paper's
      introduction restating established pharmacology rather than its own
      electrophysiological result, hence quote_role BACKGROUND; the sentence
      names no study design, so evidence_source is OTHER rather than a grade the
      sentence does not state.
  - reference: PMID:22020140
    reference_title: Molecular mechanisms of opioid receptor-dependent signaling and
      behavior.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The activation of opioid receptors at these locations directly inhibit
      neurons, which in turn inhibit spinal cord pain transmission
    explanation: >-
      Supports the supraspinal half of this branch: receptor agonism in
      descending pain-modulating regions inhibits neurons that themselves
      inhibit spinal pain transmission, the disinhibition logic of supraspinal
      analgesia.
  downstream:
  - target: Analgesia
    description: >-
      Suppressed nociceptive transmission at both levels raises the threshold
      for, and reduces the magnitude of, the behavioural pain response.
- name: Analgesia
  description: >-
    The therapeutic consequence of the module: a dose-dependent reduction in
    pain report and in nociceptive behaviour. Unlike the respiratory branch this
    one has no ceiling with a partial agonist over the clinical dose range,
    which is the pharmacological basis for buprenorphine's therapeutic index.
    Conforming pain entries substitute their own pain context (acute
    post-surgical, cancer, neuropathic) and the outcome measure used in it.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: behavioural pain response
    term:
      id: GO:0048266
      label: behavioral response to pain
    modifier: DECREASED
  evidence:
  - reference: PMID:16547090
    reference_title: Buprenorphine induces ceiling in respiratory depression but not
      in analgesia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, buprenorphine 0.4 mg caused a large and long-lived analgesic
      effect with a maximum increase in pain tolerance current of 23.8 (sd 7.4)
      mA occurring at 130 min after drug administration.
    explanation: >-
      Quantifies the analgesic consequence in humans and shows it continuing to
      grow with dose, the contrast that makes the respiratory ceiling on the
      other branch meaningful. Evidence source HUMAN_CLINICAL (healthy
      volunteers, experimental electrical pain tolerance).
- name: Brainstem Respiratory Rhythm Depression
  description: >-
    The toxicity branch, and the one that kills. Mu-opioid receptors are
    expressed on rhythm-generating neurons of the pre-Botzinger complex in the
    ventrolateral medulla, the inspiratory rhythm generator, where the same
    hyperpolarization slows and can abolish inspiratory rhythm. The
    opioid-sensitive subpopulation corresponds to the neurokinin-1
    receptor-expressing neurons of the complex, and the depression is
    receptor-mediated: animals lacking mu-opioid receptors do not show
    respiratory rate depression at all. Other brainstem sites, notably the
    Kolliker-Fuse and parabrachial nuclei, modulate the response, so a
    conforming entry should not treat the pre-Botzinger complex as the only
    site.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: neural control of respiratory rhythm
    term:
      id: GO:0002087
      label: regulation of respiratory gaseous exchange by nervous system process
    modifier: DECREASED
  cell_types:
  - preferred_term: neurokinin-1 receptor-expressing inspiratory rhythm-generating
      neuron

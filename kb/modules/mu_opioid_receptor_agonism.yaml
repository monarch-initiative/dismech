- name: Opioid Reward and Reinforcement
  description: >-
    The acute consequence of the reward branch: increased dopamine release in
    the nucleus accumbens produces euphoria and makes the drug reinforcing.
    This is the module's declared hand-off to addiction_cycle - it is the same
    event as that module's trigger node "Acute Mesolimbic Dopamine
    Reinforcement", reached here through the opioid-specific disinhibition
    pharmacology. What repeated reinforcement then does to the neurocircuitry,
    and the three-stage progression to compulsive use, is modelled there and
    not here; an opioid use disorder entry should conform to both modules. It
    is a separate node from tolerance and dependence because the two have
    different proximate causes in this module - this one is driven by the
    dopamine branch, the other by receptor-level adaptation - and because
    reinforcement is present from the first dose while tolerance requires
    repeated exposure. GO has no term for reward or reinforcement
    (`runoak -i ols:go search "reward"` returns nothing), so the node is bound
    to dopamine secretion in the accumbens, which is the measurable event the
    reinforcement claim rests on; this is the same binding addiction_cycle uses
    on the node this hands off to.

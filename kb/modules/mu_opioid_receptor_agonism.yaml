- name: Opioid Tolerance and Dependence
  description: >-
    The chronic-exposure consequence. Receptor-level desensitization and
    internalization, together with compensatory upregulation of adenylyl
    cyclase and cAMP signalling that reverses the trunk of this module, produce
    loss of effect at a given dose, physical dependence, and withdrawal on
    cessation. Tolerance is uneven across the module's branches - it develops
    to analgesia and to respiratory depression but not to constipation - which
    is clinically decisive and is the reason an entry cannot treat the branches
    as scaling together over time. Which signalling route carries clinical
    tolerance is not established, so this node makes no claim about which arm
    of the trunk the adaptation reverses.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:

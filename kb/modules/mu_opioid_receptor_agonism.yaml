- name: Mesolimbic Dopamine Disinhibition
  description: >-
    The reward branch, and the one place in the module where the central
    effector produces excitation. In the ventral tegmental area the neuron
    carrying the mu-opioid receptor is a local GABAergic interneuron, not the
    dopamine neuron; hyperpolarizing it removes spontaneous GABA-mediated
    inhibitory input to the dopamine cells, which are excited by disinhibition
    and increase dopamine release in the nucleus accumbens. This is the
    opioid-specific pharmacology that sits immediately upstream of the
    addiction_cycle module's trigger node; the circuit consequences of repeated
    reward are modelled there, not here.

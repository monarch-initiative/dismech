    The lethal consequence of the module and the mechanism of fatal opioid
    overdose: depression of respiratory drive which, with reduced consciousness
    and upper-airway obstruction, causes ventilatory insufficiency and
    ultimately apnea. This is the node an acute opioid poisoning entry conforms
    to. Unlike analgesia, this branch shows a ceiling with a partial agonist:
    over a two-fold dose range buprenorphine's respiratory depression did not
    increase in magnitude or timing while its analgesia grew, which is why
    buprenorphine is modelled on the same trigger node as the full agonists
    rather than in a separate module.

- name: Mu-Opioid Receptor Desensitization and Internalization
  description: >-
    The modulatory branch that converts acute signalling into tolerance.
    Phosphorylation of the agonist-occupied receptor by G protein-coupled
    receptor kinases recruits beta-arrestin, uncoupling the receptor from its
    transducers (homologous desensitization) and promoting endocytosis. Agonists
    differ in how strongly they engage this route - DAMGO engages the
    GRK-arrestin mechanism efficiently while morphine desensitizes the receptor
    largely without it - so the mechanism is agonist-specific rather than a
    single pathway, and how much of clinical tolerance it accounts for is
    contested. Chronic exposure adds a compensatory arm in the opposite
    direction, upregulation of adenylyl cyclase and cAMP signalling, which
    reverses the trunk of this module.

name: Gut Dysbiosis Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.,
  2023) termed dysbiosis: the age-associated alteration of the gut microbiome
  and its downstream contribution to systemic aging. With age the composition of
  the intestinal microbiota drifts - older people show greater inter-individual
  variation and increasingly individual-unique communities - and this is coupled
  to increased intestinal permeability. Loss of barrier integrity permits
  microbial products to translocate, driving age-associated systemic
  inflammation and macrophage dysfunction; germ-free and cohort studies indicate
  the microbiota is causally involved in the age-related rise in circulating
  inflammatory mediators. Gut-microbiome patterns track healthy aging and even
  predict survival. Dysbiosis is thus an integrative hallmark feeding
  inflammaging and broader age-related morbidity. Individual disorder entries
  declare conformance via conforms_to on their pathophysiology nodes,
  substituting the disease-specific microbiome or barrier context while
  preserving the conserved microbiota-shift -> barrier-failure ->
  systemic-inflammation -> age-related-decline chain.
category: Module
module_categories:
- AGING
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "gut_dysbiosis#Intestinal Barrier Dysfunction and Microbial Translocation").
  Conforming nodes in disorder files should include the corresponding biological
  processes and causal edges, specialized to their disease context. Dysbiosis is
  an integrative hallmark that feeds the inflammaging module (systemic
  inflammation is the shared interface); route the systemic-inflammation
  consequences there rather than re-deriving them. Key conformance target:
  "gut_dysbiosis#Intestinal Barrier Dysfunction and Microbial Translocation".
pathophysiology:
- name: Age-Associated Gut Microbiota Alteration
  description: >-
    With age the composition of the gut microbiota shifts: older individuals
    display greater inter-individual variation than younger adults and, from
    mid-to-late adulthood, increasingly unique individual microbiome
    compositions. This age-associated compositional drift is the initiating
    alteration of the hallmark.
  role: trigger
  evidence:
  - reference: PMID:22797518
    reference_title: "Gut microbiota composition correlates with diet and health in the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The microbiota of older people displays greater inter-individual variation
      than that of younger adults.
    explanation: >-
      Documents the greater compositional variation of the elderly gut
      microbiota, the age-associated drift modeled here. Evidence source is
      HUMAN_CLINICAL (elderly cohort study).
  - reference: PMID:33619379
    reference_title: "Gut microbiome pattern reflects healthy ageing and predicts survival in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      starting in mid-to-late adulthood, gut microbiomes become increasingly
      unique to individuals with age
    explanation: >-
      Shows progressive individualization of the gut microbiome with age across
      large cohorts, supporting the microbiota-drift trigger. Evidence source is
      HUMAN_CLINICAL (multi-cohort human study).
  downstream:
  - target: Intestinal Barrier Dysfunction and Microbial Translocation
- name: Intestinal Barrier Dysfunction and Microbial Translocation
  description: >-
    Age-associated dysbiosis is coupled to loss of intestinal barrier integrity
    (increased permeability), allowing microbial products to translocate across
    the gut wall. This barrier failure is the conserved central effector that
    links a shifted microbiota to systemic consequences.
  role: central_effector
  evidence:
  - reference: PMID:28407483
    reference_title: "Age-Associated Microbial Dysbiosis Promotes Intestinal Permeability, Systemic Inflammation, and Macrophage Dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Age-Associated Microbial Dysbiosis Promotes Intestinal Permeability,
      Systemic Inflammation, and Macrophage Dysfunction.
    explanation: >-
      States that age-associated dysbiosis promotes intestinal permeability
      (and downstream systemic inflammation), the barrier-failure effector
      modeled here. Evidence source is MODEL_ORGANISM (germ-free and aged mouse
      experiments).
  downstream:
  - target: Dysbiosis-Driven Systemic Inflammation
- name: Dysbiosis-Driven Systemic Inflammation
  description: >-
    Translocating microbial products drive the age-associated increase in
    circulating inflammatory mediators and macrophage dysfunction. Germ-free
    studies indicate this age-related inflammation is causally dependent on the
    microbiota. This node is the amplifying interface at which gut dysbiosis
    feeds inflammaging.
  role: amplifier
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:28407483
    reference_title: "Age-Associated Microbial Dysbiosis Promotes Intestinal Permeability, Systemic Inflammation, and Macrophage Dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      when maintained under germ-free conditions, mice do not display an
      age-related increase in circulating pro-inflammatory cytokine levels
    explanation: >-
      Germ-free mice lack the age-related rise in circulating pro-inflammatory
      cytokines, showing the microbiota is causally required for
      dysbiosis-driven systemic inflammation. Evidence source is MODEL_ORGANISM
      (germ-free mouse study).
  - reference: PMID:22797518
    reference_title: "Gut microbiota composition correlates with diet and health in the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations in intestinal microbiota composition are associated with
      several chronic conditions, including obesity and inflammatory diseases.
    explanation: >-
      Links altered microbiota composition to inflammatory and metabolic disease,
      supporting the inflammation-driving role of dysbiosis. Evidence source is
      HUMAN_CLINICAL (human cohort study).
  downstream:
  - target: Age-Related Health Decline and Reduced Survival
- name: Age-Related Health Decline and Reduced Survival
  description: >-
    Through systemic inflammation and impaired barrier and immune function,
    dysbiosis contributes to age-related health decline; conversely,
    gut-microbiome patterns that reflect healthy aging are associated with
    survival. This is the conserved consequence of dysbiosis; specific
    disease phenotypes are supplied by the conforming disorder, and
    microbiome-directed strategies are the corresponding intervention target.
  role: consequence
  evidence:
  - reference: PMID:33619379
    reference_title: "Gut microbiome pattern reflects healthy ageing and predicts survival in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gut microbiome pattern reflects healthy ageing and predicts survival in
      humans.
    explanation: >-
      Establishes that gut-microbiome patterns track healthy aging and predict
      survival, the outcome modeled here. Evidence source is HUMAN_CLINICAL
      (multi-cohort human study).
animal_models:
- name: Young-donor gut microbiota transfer in turquoise killifish (Nothobranchius furzeri)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Middle-aged fish whose gut was recolonized with bacteria from young donors,
    compared against age-matched controls, with 16S community profiling, survival,
    and behavioral endpoints.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:28826469
  description: >-
    This is the causal experiment behind the module. Rather than correlating an aged
    microbiome with poor outcomes, Smith and colleagues transferred the gut
    community of young killifish into middle-aged recipients and measured what
    happened. Recipients lived longer, declined behaviorally more slowly, retained
    microbial diversity, and kept a young-like community composition. Because the
    host is a vertebrate with a months-long lifespan, the whole intervention and its
    survival readout fit inside a single experiment.
  modeled_mechanisms:
  - target: Age-Associated Gut Microbiota Alteration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Killifish lose gut microbial diversity as they age and shift away from a
      young-like community composition, reproducing the module's upstream node in a
      vertebrate host.
    limitations: >-
      The taxa that mark a young-like killifish community are teleost gut genera and
      do not correspond to the human commensals whose loss defines age-associated
      dysbiosis in people, so the composition finding is directional rather than
      taxon-transferable. Fish gut communities are strongly shaped by the aquatic
      environment, which has no counterpart in the mammalian gut.
    readouts:
    - name: Gut microbial diversity and community composition with age
      target: Age-Associated Gut Microbiota Alteration
      description: >-
        Microbial diversity and community composition of the killifish gut across
        age, and in middle-aged recipients of a young-donor transfer.
      direction: DECREASED
      interpretation: >-
        Diversity falls with host age and is held up by the transfer, which is what
        establishes the shift as a modifiable state rather than a fixed correlate of
        age.
      evidence:
      - reference: PMID:28826469
        reference_title: Regulation of life span by the gut microbiota in the short-lived African turquoise killifish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This intervention prevented the decrease in microbial diversity associated with host aging and maintained a young-like gut bacterial community, characterized by overrepresentation of the key genera Exiguobacterium, Planococcus, Propionigenium and Psychrobacter."
        explanation: Reports both the age-associated diversity loss and the community composition that the transfer preserved.
    evidence:
    - reference: PMID:28826469
      reference_title: Regulation of life span by the gut microbiota in the short-lived African turquoise killifish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we show that the gut microbiota plays a key role in modulating vertebrate life span"
      explanation: >-
        Supports treating this model as informative for the module, in a vertebrate
        host rather than an invertebrate one.
  - target: Age-Related Health Decline and Reduced Survival
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Recolonizing middle-aged fish with a young-donor gut community extended
      lifespan and delayed behavioral decline. This is the module's strongest
      causal claim in any model: an intervention on the microbiota alone, applied
      after the host is already middle-aged, moving a survival endpoint.
    limitations: >-
      The mechanism connecting the transferred community to host survival is not
      resolved by this study; the module's intervening barrier-dysfunction and
      systemic-inflammation nodes are inferred, not measured here. The intervention
      is a whole-community transfer, so no individual taxon is established as
      causal. Lifespan effects in a fish with an annual life history and an
      environmentally coupled gut community should not be assumed to transfer
      quantitatively to mammals.
    readouts:
    - name: Lifespan after young-donor recolonization
      target: Age-Related Health Decline and Reduced Survival
      description: >-
        Survival of middle-aged fish recolonized with young-donor gut bacteria versus
        age-matched controls.
      direction: RESTORED
      interpretation: >-
        A survival benefit from a microbiota-only intervention started in middle age
        is what makes this a causal rather than correlative result.
      evidence:
      - reference: PMID:28826469
        reference_title: Regulation of life span by the gut microbiota in the short-lived African turquoise killifish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Recolonizing the gut of middle-age individuals with bacteria from young donors resulted in life span extension and delayed behavioral decline."
        explanation: Reports the survival and behavioral outcome of the transfer experiment.
    - name: Behavioral decline after young-donor recolonization
      target: Age-Related Health Decline and Reduced Survival
      description: >-
        Age-associated behavioral decline in recolonized fish versus controls,
        measured alongside survival.
      direction: RESTORED
      interpretation: >-
        A functional healthspan endpoint moving with survival is what distinguishes
        this from a lifespan-only result.
      evidence:
      - reference: PMID:28826469
        reference_title: Regulation of life span by the gut microbiota in the short-lived African turquoise killifish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Recolonizing the gut of middle-age individuals with bacteria from young donors resulted in life span extension and delayed behavioral decline."
        explanation: The same experiment read for its behavioral endpoint rather than its survival endpoint.
    evidence:
    - reference: PMID:28826469
      reference_title: Regulation of life span by the gut microbiota in the short-lived African turquoise killifish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings demonstrate that the natural microbial gut community of young individuals can causally induce long-lasting beneficial systemic effects that lead to life span extension in a vertebrate model."
      explanation: >-
        The authors' explicit causal claim, which is what licenses a RESCUES link
        rather than a correlative one.
  notes: >-
    Curated as part of a tranche adding turquoise killifish models across the
    hallmarks-of-aging modules. Note what this model does and does not cover: it
    supports the module's first and last nodes with a causal intervention, but says
    nothing about the intervening barrier-dysfunction and systemic-inflammation
    nodes, which are recorded as a limitation rather than silently assumed.
biochemical:
- name: Lipopolysaccharide-binding protein
  presence: INCREASED
  biomarker_term:
    preferred_term: lipopolysaccharide-binding protein
    term:
      id: NCIT:C105867
      label: Lipopolysaccharide-Binding Protein
  notes: >-
    LBP is an acute-phase protein induced by circulating bacterial lipopolysaccharide,
    so it reports host exposure to translocated microbial product rather than the
    microbiota itself. That distinction is the reason it is curated against the
    barrier node rather than the microbiota node: LBP can rise with unchanged
    microbiota if the barrier fails, and can stay flat with substantially altered
    microbiota if it does not. It is measured alongside soluble CD14 and FABP2 as a
    gut-permeability panel; FABP2 has no NCIT term and so is recorded here in prose
    rather than as its own entry.
  evidence:
  - reference: PMID:31830000
    reference_title: "Gut permeability, inflammation, and bone density across the menopause transition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In our primary analysis, FABP2, LBP, and sCD14 increased by 22.8% (P = 0.001),
      3.7% (P = 0.05), and 8.9% (P = 0.0002), respectively, from pre- to
      postmenopause.
    explanation: >-
      Longitudinal within-person increase in the gut-permeability panel across an
      aging transition in the SWAN cohort.
  readouts:
  - target: Intestinal Barrier Dysfunction and Microbial Translocation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      LBP reports systemic exposure to translocated lipopolysaccharide, which is the
      barrier failure this node models rather than the compositional shift upstream
      of it.
    evidence:
    - reference: PMID:31830000
      reference_title: "Gut permeability, inflammation, and bone density across the menopause transition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gut permeability increases during the MT. Greater gut permeability is
        associated with more inflammation and lower BMD.
      explanation: >-
        Links the permeability panel both to the barrier node and onward to the
        inflammatory and end-organ consequences this module chains to.
- name: Soluble CD14
  presence: INCREASED
  biomarker_term:
    preferred_term: soluble CD14
    term:
      id: NCIT:C191971
      label: Soluble Monocyte Differentiation Antigen CD14
  notes: >-
    sCD14 is shed on monocyte activation by lipopolysaccharide, so it sits one step
    downstream of LBP and reports the host immune response to translocation rather
    than the translocation itself. It showed the largest and most significant change
    of the three permeability markers across the menopause transition. Curating both
    LBP and sCD14 is not redundancy: they separate exposure from response, and they
    can dissociate when innate responsiveness itself changes with age.
  evidence:
  - reference: PMID:31830000
    reference_title: "Gut permeability, inflammation, and bone density across the menopause transition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In our primary analysis, FABP2, LBP, and sCD14 increased by 22.8% (P = 0.001),
      3.7% (P = 0.05), and 8.9% (P = 0.0002), respectively, from pre- to
      postmenopause.
    explanation: >-
      Quantifies the sCD14 increase across the same aging transition.
  readouts:
  - target: Dysbiosis-Driven Systemic Inflammation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      sCD14 reports monocyte activation by translocated microbial product, the step
      that converts barrier failure into the systemic inflammation this node models.
    evidence:
    - reference: PMID:31830000
      reference_title: "Gut permeability, inflammation, and bone density across the menopause transition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        greater gut permeability was associated with greater inflammation, along with
        lower LS and TH BMD
      explanation: >-
        Connects the permeability panel to measured inflammation, supporting sCD14 as
        a readout of the inflammatory consequence rather than of the barrier alone.
discussions:
- discussion_id: knowledge_gap_which_microbiome_measure_reports_aging
  prompt: >-
    Which summary of the gut microbiota, if any, is the aging readout? Alpha diversity
    is the usual assumption and does not survive contact with longitudinal data.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#
  - pathophysiology#Age-Associated Gut Microbiota Alteration
  rationale: >-
    Both markers curated in this module report the barrier and the host response to
    translocation. The first node, the compositional shift itself, has no curated
    marker, and the reason is that it is unclear what to measure. Reduced alpha
    diversity is the conventional summary, but in a longitudinal centenarian cohort
    followed to death there was no significant alpha-diversity difference between the
    period before death and earlier follow-up, while ten individual species did change
    significantly. If the signal is carried by particular taxa rather than by a
    diversity index, then the readout is a high-dimensional composition and not a
    number, which raises the same representational problem recorded in the decision
    register for composite indices. A further obstacle specific to this hallmark: the
    same paper found the centenarian microbiome in Hainan differs from that in northern
    Italy, so a taxon-level marker may not transfer between populations even if it is
    real within one.
  evidence:
  - reference: PMID:32714309
    reference_title: "Metagenomics Study Reveals Changes in Gut Microbiota in Centenarians: A Cohort Study of Hainan Centenarians."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All participants were grouped with 7 months before death as cut-off; no
      significant difference in α diversity was found between the two groups (P =
      0.45).
    explanation: >-
      Refutes alpha diversity as the readout of terminal decline in this cohort, which
      is the assumption a curator would otherwise import by default.
  - reference: PMID:32714309
    reference_title: "Metagenomics Study Reveals Changes in Gut Microbiota in Centenarians: A Cohort Study of Hainan Centenarians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to centenarians in northern Italy, Hainan centenarians exhibited unique
      characteristics of gut microbiome.
    explanation: >-
      Population-dependence of the centenarian microbiome, which bounds how far any
      taxon-level marker can be expected to transfer.
  notes: >-
    NCIT:C68564 (Microbiome) exists and would validate, but binding it would assert
    that "the microbiome" is the biomarker without saying what is measured, which is
    the substance of this gap rather than a resolution of it. Left unbound
    deliberately.
computational_models:
- name: AGORA Gut Microbiome Genome-Scale Metabolic Reconstructions
  description: >-
    Resource of genome-scale metabolic reconstructions semi-automatically generated
    for 773 human gut bacteria (assembly of gut organisms through reconstruction and
    analysis). Interactions among modelled species depend on both each species'
    metabolic potential and the nutrients available, so a community's metabolic
    output can be predicted from its composition. Reconstructions integrate
    metagenomic or 16S rRNA sequencing data and are compatible with the human
    reconstruction Recon 2, allowing host-microbiome metabolic coupling to be
    simulated.
  model_type: GENOME_SCALE_METABOLIC
  model_software: COBRA Toolbox
  model_format: SBML
  publication: PMID:27893703
  modeled_mechanisms:
  - target: Age-Associated Gut Microbiota Alteration
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Turns a compositional shift into a predicted metabolic-output shift, so an
      age-associated change in taxa can be expressed as a change in the community's
      metabolite production rather than as taxonomy alone.
    limitations: >-
      A general-purpose reconstruction resource, not an ageing model: it carries no
      age-specific parameterization, and any age contrast has to be supplied as
      input composition from a cohort.
  notes: >-
    This is the piece of tooling that makes the module's first node quantitatively
    connectable to its downstream inflammation node - short-chain fatty acid and
    other metabolite output is the mechanistic currency between them.

name: Membrane Contact Site Dysfunction Module
description: >-
  A conserved organelle-communication module. Organelles exchange lipids,
  calcium and signals at membrane contact sites, places where two membranes are
  held a few tens of nanometres apart by tethering proteins without fusing.
  Every organelle forms such contacts, so the module is written for any organelle
  pair: ER-mitochondria, ER-plasma membrane, ER-Golgi, ER-lipid droplet,
  ER-peroxisome, ER-endolysosome and mitochondria-lysosome. The chain runs from
  loss of a tether or contact-resident transfer protein, to failed or
  mis-regulated non-vesicular lipid transfer between the two organelles (the key
  conformance target), with a parallel arm for failed calcium transfer at
  ER-mitochondria contacts. The lipid arm leaves one or both organelles with the
  wrong membrane composition, most clearly the plasmalogen ether-phospholipid
  deficit that follows loss of the ACBD5-VAP tether between peroxisomes and the
  ER. Both arms, and the loss of tethering itself, change organelle morphology,
  number and position, which is also what multispectral organelle imaging
  ("organelle signature" analysis) measures. Lipid supply and organelle
  maturation at contacts are needed to build synapses, so synapse formation is
  a distinct downstream step. The main terminal consequence is neural:
  the conforming disorders are overwhelmingly neurodevelopmental,
  neurodegenerative or neuromuscular. A second, model-system consequence is
  impaired cardiomyocyte differentiation and maturation, through
  sarcoplasmic reticulum-mitochondria calcium coupling and through mitochondrial
  fusion, which Golgi-derived phosphoinositide vesicles help drive at
  mitofusin-marked sites. Complementary to `mitochondrial_dysfunction`
  (failure inside the mitochondrion), `peroxisomal_metabolic_failure` (failure of
  peroxisomal import or enzymes) and `lysosomal_substrate_accumulation`; this
  module covers the failure of the connection between organelles, not of either
  organelle's own machinery.
category: Module
module_categories:
- NEUROSCIENCE
- METABOLISM
creation_date: "2026-10-23T00:00:00Z"
notes: >-
  This is a shared mechanism module, not a disease. Do not create a "membrane
  contact site disease" Disease entry.

  Disorder-specific substitutions at the trigger node are the tether or
  contact-resident protein and the organelle pair it joins. Worked examples
  already in the knowledge base: VAPB, the ER-side tether for FFAT-motif
  partners (Adult-Onset_Proximal_Spinal_Muscular_Atrophy_Autosomal_Dominant);
  VPS13A, bridging the ER to mitochondria and lipid droplets
  (Chorea-acanthocytosis), and its XK partner at ER-plasma membrane contacts
  (McLeod_Neuroacanthocytosis_Syndrome); wolframin and CISD2 at
  mitochondria-associated ER membranes (Wolfram_Syndrome, WFS1-Related_Disorder);
  PDZD8 at ER-mitochondria and ER-lysosome contacts
  (Intellectual_Developmental_Disorder_With_Autism_And_Dysmorphic_Facies);
  SNX14 at ER-lipid droplet contacts (Autosomal_Recessive_Spinocerebellar_Ataxia_20);
  CERT1 at ER-Golgi contacts (Intellectual_Disability_Autosomal_Dominant_34);
  and ACBD5,
  the peroxisome-side partner of VAPA/VAPB, at ER-peroxisome contacts
  (ACBD5_Deficiency, also called retinal dystrophy with leukodystrophy).
  MFN2 at ER-mitochondria contacts (Charcot-Marie-Tooth type 2A) is a
  candidate, not yet conformed: that entry has no node for the tethering
  defect itself.

  GO has no separate plasmalogen biosynthesis term: "plasmalogen biosynthetic
  process" is a listed synonym of GO:0008611 ether lipid biosynthetic process,
  which is the term bound here. An OLS search of GO for "plasmalogen"
  (2026-10-23) returned only GO:0008611, GO:0046485 ether lipid metabolic
  process, and two molecular-function terms.

  The central node is deliberately "disrupted" rather than "reduced" transfer.
  The CERT1 autoregulatory-domain variants of
  Intellectual_Disability_Autosomal_Dominant_34 run ER-to-Golgi ceramide
  transfer above its regulated level; that is a contact-site transfer defect of
  the opposite sign and conforms at the same node.

  Conformance requires evidence that the disorder's protein acts at a contact
  site and that its loss changes contact extent, transfer, or both. Expression
  of a gene at the ER or in mitochondria is not sufficient, and neither is a
  mitochondrial or peroxisomal defect on its own: those belong to the
  organelle-intrinsic modules named in the description. Several conformers
  co-annotate with those modules, which is expected.

  The morphology node is both a consequence and the main observable. A
  mitofusin, atlastin or DRP1 defect changes organelle shape without being a
  contact-site defect; such entries do not conform here through the morphology
  node alone.

  Not an Xogenesis module: no pathological anatomical entity is formed.
pathophysiology:
- name: Loss of Organelle Tethering at a Membrane Contact Site
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A tethering protein that holds two organelle membranes in apposition, or a
    protein resident at that apposition, is lost or altered, and the contact
    between the two organelles shrinks or fails to form. Contacts are
    ubiquitous, so the organelle pair is set by the conforming disorder.
  cellular_components:
  - preferred_term: organelle membrane contact site
    term:
      id: GO:0044232
      label: organelle membrane contact site
  biological_processes:
  - preferred_term: organelle localization by membrane tethering
    modifier: DECREASED
    term:
      id: GO:0140056
      label: organelle localization by membrane tethering
  evidence:
  - reference: PMID:31732717
    reference_title: "The functional universe of membrane contact sites."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Interest in MCSs has grown dramatically in the past decade as it is has
      become clear that they are ubiquitous and have a much broader range of
      critical roles in cells than was initially thought.
    explanation: >-
      Review establishing that contact sites occur throughout the cell, which
      is why the trigger is written for any organelle pair.
  - reference: PMID:19052620
    reference_title: "Mitofusin 2 tethers endoplasmic reticulum to mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, mitofusin 2 tethers ER to mitochondria, a juxtaposition required for
      efficient mitochondrial Ca(2+) uptake.
    explanation: >-
      Identifies a disease gene product as an ER-mitochondria tether, the
      first worked instance of the trigger.
  - reference: PMID:28108524
    reference_title: "ACBD5 and VAPB mediate membrane associations between peroxisomes and the ER."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that ACBD5-VAPB interaction regulates PO-ER associations.
    explanation: >-
      Establishes the ACBD5-VAPB pair as the peroxisome-ER tether.
  - reference: PMID:40672445
    reference_title: "The neurological pathology of peroxisomal ACBD5 deficiency - lessons from patients and mouse models."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the first identified peroxisomal tethering protein facilitating membrane
      contacts with the endoplasmic reticulum (ER)
    explanation: >-
      Review of human ACBD5 deficiency describing ACBD5 as a peroxisome-ER
      tether, linking the trigger to a human disease.
  downstream:
  - target: Disrupted Non-Vesicular Lipid Transfer Between Organelles
    description: Without the tether, lipid transfer across the contact fails or loses its regulation.
    evidence:
    - reference: PMID:28108526
      reference_title: "VAPs and ACBD5 tether peroxisomes to the ER for peroxisome maintenance and lipid homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        this interaction is required to tether the two organelles together,
        thereby facilitating the lipid exchange between them
      explanation: Places tethering directly upstream of lipid exchange between the two organelles.
  - target: Impaired Inter-Organelle Calcium Transfer
    description: At ER-mitochondria contacts, loss of tethering lowers mitochondrial calcium uptake.
    evidence:
    - reference: PMID:19052620
      reference_title: "Mitofusin 2 tethers endoplasmic reticulum to mitochondria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        loosens ER-mitochondria interactions, thereby reducing the efficiency of
        mitochondrial Ca(2+) uptake in response to stimuli that generate
        inositol-1,4,5-trisphosphate
      explanation: Loss of the tether reduces calcium transfer from ER to mitochondria.
  - target: Altered Organelle Morphology, Number and Distribution
    description: Untethered organelles change shape and move more.
    evidence:
    - reference: PMID:28108524
      reference_title: "ACBD5 and VAPB mediate membrane associations between peroxisomes and the ER."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we demonstrate that loss of PO-ER association perturbs PO membrane
        expansion and increases PO movement
      explanation: Loss of peroxisome-ER tethering changes peroxisome growth and positioning.
    - reference: PMID:30765438
      reference_title: "Cerebellar ataxia disease-associated Snx14 promotes lipid droplet growth at ER-droplet contacts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SNX14KO cells exhibit perturbed LD morphology, whereas Snx14
        overexpression promotes LD biogenesis and extends ER-LD contacts.
      explanation: Loss of an ER-lipid droplet contact protein changes lipid droplet morphology.
- name: Disrupted Non-Vesicular Lipid Transfer Between Organelles
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The key conformance target. Lipid transfer proteins working at contacts
    move lipids between organelles that are not connected by vesicle traffic.
    When the contact or the transfer protein fails, or escapes its regulation,
    lipid flux between the two membranes is lost or set at the wrong level.
  cellular_components:
  - preferred_term: organelle membrane contact site
    term:
      id: GO:0044232
      label: organelle membrane contact site
  biological_processes:
  - preferred_term: intermembrane lipid transfer
    modifier: DYSREGULATED
    term:
      id: GO:0120009
      label: intermembrane lipid transfer
  evidence:
  - reference: PMID:30093493
    reference_title: "VPS13A and VPS13C are lipid transport proteins differentially localized at ER contact sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also show that human VPS13A and VPS13C bind to the ER, tethering it to
      mitochondria (VPS13A), to late endosome/lysosomes (VPS13C), and to lipid
      droplets (both VPS13A and VPS13C).
    explanation: >-
      The proteins mutated in chorea-acanthocytosis and Parkinson disease are
      contact-site tethers for several organelle pairs.
  - reference: PMID:30093493
    reference_title: "VPS13A and VPS13C are lipid transport proteins differentially localized at ER contact sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings identify VPS13 as a lipid transporter between the ER and
      other organelles, implicating defects in membrane lipid homeostasis in
      neurological disorders resulting from their mutations.
    explanation: Identifies lipid transport at the contact as the function lost in VPS13 disease.
  downstream:
  - target: Organelle Membrane Lipid Imbalance
    description: Failed transfer leaves the donor or acceptor membrane with the wrong lipid composition.
    evidence:
    - reference: PMID:28108526
      reference_title: "VAPs and ACBD5 tether peroxisomes to the ER for peroxisome maintenance and lipid homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also demonstrate that tethering of peroxisomes to the ER is necessary
        for peroxisome growth, the synthesis of plasmalogen phospholipids, and
        the maintenance of cellular cholesterol levels.
      explanation: Loss of ER-peroxisome contact lowers plasmalogen synthesis and cellular cholesterol.
- name: Impaired Inter-Organelle Calcium Transfer
  role: effector
  biological_scale: MOLECULAR
  description: >-
    At ER-mitochondria contacts, calcium released from ER stores is taken up
    by mitochondria. Loss of the contact or of its calcium-handling partners
    reduces that transfer, with consequences for mitochondrial metabolism and
    for cytosolic calcium buffering in neurons.
  cellular_components:
  - preferred_term: mitochondria-associated endoplasmic reticulum membrane contact site
    term:
      id: GO:0044233
      label: mitochondria-associated endoplasmic reticulum membrane contact site
  biological_processes:
  - preferred_term: calcium import into the mitochondrion
    modifier: DECREASED
    term:
      id: GO:0036444
      label: calcium import into the mitochondrion
  evidence:
  - reference: PMID:19052620
    reference_title: "Mitofusin 2 tethers endoplasmic reticulum to mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Juxtaposition between endoplasmic reticulum (ER) and mitochondria is a
      common structural feature, providing the physical basis for
      intercommunication during Ca(2+) signalling
    explanation: Establishes ER-mitochondria apposition as the route for calcium transfer.
  downstream:
  - target: Neural Cell Dysfunction from Contact-Site Failure
    description: Reduced mitochondrial calcium uptake impairs neuronal calcium handling and metabolism.
    evidence:
    - reference: PMID:29097544
      reference_title: "ER-mitochondria tethering by PDZD8 regulates Ca(2+) dynamics in mammalian neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In neurons, PDZD8 was required for calcium ion (Ca2+) uptake by
        mitochondria after synaptically induced Ca2+-release from ER and thereby
        regulated cytoplasmic Ca2+ dynamics.
      explanation: In neurons, loss of an ER-mitochondria contact protein disturbs cytoplasmic calcium after synaptic activity.
  - target: Impaired Cardiomyocyte Differentiation and Maturation
    description: >-
      In cardiomyocytes the ER is the sarcoplasmic reticulum, and its coupling
      to mitochondria through the IP3R-GRP75-VDAC bridge is needed for maturation.
    evidence:
    - reference: PMID:41848670
      reference_title: "Mitofusin 2 Is Required for the Maturation of Embryonic Stem Cell-Derived Cardiomyocytes via a GRP75-Dependent Suppression of the ROS/PI3K/AKT/mTOR Axis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Meanwhile, MFN2 knockdown decreased the IP3R-VDAC coupling mediated by
        GRP75. Importantly, GRP75 overexpression restored the decreased IP3R-VDAC
        coupling, reversed the increased cellular ROS, and reversed the increased
        PI3K/AKT/mTOR activity caused by MFN2 knockdown.
      explanation: >-
        In mouse ESC-derived cardiomyocytes, restoring the SR-mitochondria
        calcium bridge rescues the signalling defect caused by losing the MFN2
        tether.
- name: Organelle Membrane Lipid Imbalance
  role: effector
  biological_scale: CELLULAR
  description: >-
    One or both organelles end up with the wrong lipid composition. The
    clearest case is ether-phospholipid synthesis, which starts in the
    peroxisome and is completed in the ER, so plasmalogen production depends on
    ER-peroxisome contact. Other conformers show lipid droplet, sphingolipid or
    cholesterol imbalance, according to the organelle pair.
  biological_processes:
  - preferred_term: lipid homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0055088
      label: lipid homeostasis
  - preferred_term: plasmalogen (ether lipid) biosynthesis
    modifier: DECREASED
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
  evidence:
  - reference: PMID:28108526
    reference_title: "VAPs and ACBD5 tether peroxisomes to the ER for peroxisome maintenance and lipid homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also demonstrate that tethering of peroxisomes to the ER is necessary
      for peroxisome growth, the synthesis of plasmalogen phospholipids, and
      the maintenance of cellular cholesterol levels.
    explanation: Contact loss causes plasmalogen and cholesterol imbalance.
  - reference: PMID:41726917
    reference_title: "Organelle communication networks rewire to support lipid metabolism during neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disrupting this contact impairs plasmalogen production, synaptic
      organization, and neuronal activity
    explanation: >-
      In human iPSC-derived neurons, disrupting ER-peroxisome contact lowers
      plasmalogen production. Preprint, not yet peer reviewed.
  downstream:
  - target: Altered Organelle Morphology, Number and Distribution
    description: Organelles built from the wrong lipids grow, divide and mature abnormally.
    evidence:
    - reference: PMID:30765438
      reference_title: "Cerebellar ataxia disease-associated Snx14 promotes lipid droplet growth at ER-droplet contacts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SNX14KO cells exhibit perturbed LD morphology, whereas Snx14
        overexpression promotes LD biogenesis and extends ER-LD contacts.
      directness: INDIRECT
      explanation: >-
        Loss of an ER-lipid droplet contact protein changes lipid droplet
        morphology. It shows contact loss changing morphology, not lipid
        imbalance doing so, so it supports this edge only indirectly.
  - target: Impaired Synapse Formation and Maturation
    description: Developing synapses depend on contact-supplied lipids such as plasmalogens.
    evidence:
    - reference: PMID:41726917
      reference_title: "Organelle communication networks rewire to support lipid metabolism during neuronal differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Disrupting this contact impairs plasmalogen production, synaptic
        organization, and neuronal activity
      explanation: The same perturbation that lowers plasmalogens impairs synaptic organization. Preprint.
- name: Altered Organelle Morphology, Number and Distribution
  role: effector
  biological_scale: CELLULAR
  description: >-
    Organelles that lose a contact change size, shape, number, position and
    movement. This node is also the main observable: multispectral imaging of
    six to eight organelles at once in live cells measures their morphology,
    distribution and pairwise or higher-order contacts together, so a contact
    defect and its morphological consequence can be read in one experiment.
  biological_processes:
  - preferred_term: organelle organization
    modifier: ABNORMAL
    term:
      id: GO:0006996
      label: organelle organization
  evidence:
  - reference: PMID:19052620
    reference_title: "Mitofusin 2 tethers endoplasmic reticulum to mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ablation or silencing of mitofusin 2 in mouse embryonic fibroblasts and
      HeLa cells disrupts ER morphology
    explanation: Loss of an ER-mitochondria tether changes ER morphology.
  - reference: PMID:32193326
    reference_title: "Golgi-derived PI(4)P-containing vesicles drive late steps of mitochondrial division."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we found that microdomains of phosphatidylinositol 4-phosphate
      ... on trans-Golgi network (TGN) vesicles were recruited to
      mitochondria-ER contact sites and could drive mitochondrial division
      downstream of Drp1.
    explanation: >-
      Golgi-mitochondria communication shapes mitochondria: trans-Golgi vesicles
      join ER-mitochondria contacts, a three-organelle contact, to complete
      mitochondrial division.
  - reference: PMID:42848893
    reference_title: "Golgi-derived vesicles containing PI(3,4)P(2) drive mitochondrial fusion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we identified a role for Golgi-derived vesicles enriched in
      phosphatidylinositol 3,4-bisphosphate ... in regulating
      mitochondrial fusion. We found that these vesicles were recruited to ER-
      and mitofusin-marked fusion sites.
    explanation: A second population of Golgi-derived vesicles acts at ER- and mitofusin-marked sites to drive mitochondrial fusion.
  - reference: PMID:28538724
    reference_title: "Applying systems-level spectral imaging and analysis to reveal the organelle interactome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that each organelle has a characteristic distribution and
      dispersion pattern in three-dimensional space and that there is a
      reproducible pattern of contacts among the six organelles, that is
      affected by microtubule and cell nutrient status.
    explanation: >-
      Organelle distribution and contacts form a reproducible, measurable
      pattern that changes with perturbation, which makes this node observable.
  downstream:
  - target: Neural Cell Dysfunction from Contact-Site Failure
    description: Neurons depend on correctly sized and positioned organelles in long processes.
    evidence:
    - reference: PMID:40956669
      reference_title: "Neurons and astrocytes have distinct organelle signatures and responses to stress."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Additionally, neurons display a more robust organelle response than
        astrocytes to acute oxidative or ER stress.
      explanation: >-
        Neurons remodel their organelles more strongly under stress than
        astrocytes do. This suggests, but does not show, that organelle
        changes weigh more on neurons.
  - target: Impaired Cardiomyocyte Differentiation and Maturation
    description: >-
      Mitochondrial fusion and network shape, set in part at ER-mitochondria
      and Golgi-mitochondria interfaces, direct cardiomyocyte differentiation.
      The fusion evidence supports this edge indirectly; the evidence specific
      to contact sites is on the calcium edge.
    evidence:
    - reference: PMID:24091702
      reference_title: "Mitochondrial fusion directs cardiomyocyte differentiation via calcineurin and Notch signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ablation of mitochondrial fusion proteins Mitofusin 1 and 2 in the
        embryonic mouse heart, or gene-trapping of Mitofusin 2 or Optic atrophy 1
        in mouse embryonic stem cells (ESCs), arrested mouse heart development
        and impaired differentiation of ESCs into cardiomyocytes.
      directness: INDIRECT
      explanation: >-
        Loss of mitochondrial fusion proteins arrests heart development and
        cardiomyocyte differentiation. This is a fusion result, so it supports
        the contact-site edge only indirectly; the contact-specific support is
        the GRP75 IP3R-VDAC result (PMID:41848670) on the calcium edge.
    - reference: PMID:42848893
      reference_title: "Golgi-derived vesicles containing PI(3,4)P(2) drive mitochondrial fusion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, cardiomyocyte-specific PI3K-C2α and PI3K-C2β double-deletion
        mice exhibited mitochondrial fragmentation and heart failure.
      explanation: >-
        Removing the kinases that make the Golgi-vesicle PI(3,4)P2 signal in
        cardiomyocytes fragments mitochondria and causes heart failure.
  - target: Impaired Synapse Formation and Maturation
    description: >-
      Contact-dependent organelle maturation, such as lysosome maturation at
      ER-lysosome contacts, supplies the autophagic capacity that activity-driven
      synaptic growth needs.
    evidence:
    - reference: PMID:40156832
      reference_title: "PDZD8 promotes autophagy at ER-lysosome membrane contact sites to regulate activity-dependent synaptic growth."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        PDZD8 accelerates autophagic flux by promoting lysosome maturation at
        ER-late endosome/lysosome MCSs.
      explanation: In Drosophila neurons, a contact-site tether drives lysosome maturation upstream of synaptic growth.
- name: Impaired Synapse Formation and Maturation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Building synapses places a high demand on organelle communication.
    Contacts supply lipids to the growing synaptic membrane (ER-peroxisome
    contacts and plasmalogens) and the degradative capacity for activity-driven
    synaptic growth (ER-lysosome contacts and autophagy). Losing either leaves
    synapses fewer, smaller or disorganized, which fits the intellectual
    disability and epilepsy seen in several conforming disorders.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synapse assembly
    modifier: DECREASED
    term:
      id: GO:0007416
      label: synapse assembly
  evidence:
  - reference: PMID:41726917
    reference_title: "Organelle communication networks rewire to support lipid metabolism during neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Later, endoplasmic reticulum (ER)-organelle contacts dominate with
      ER-peroxisome contacts promoting ether lipid biosynthesis, membrane
      homeostasis and synapse formation.
    explanation: In human iPSC-derived neurons, ER-peroxisome contacts promote synapse formation. Preprint.
  - reference: PMID:40156832
    reference_title: "PDZD8 promotes autophagy at ER-lysosome membrane contact sites to regulate activity-dependent synaptic growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that PDZD8 is required for activity-dependent synaptic bouton
      formation in multiple paradigms.
    explanation: In Drosophila, the contact-site tether PDZD8 is required for synaptic bouton formation.
  downstream:
  - target: Neural Cell Dysfunction from Contact-Site Failure
    description: Too few or disorganized synapses impair neuronal activity and circuit development.
    evidence:
    - reference: PMID:41726917
      reference_title: "Organelle communication networks rewire to support lipid metabolism during neuronal differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Disrupting this contact impairs plasmalogen production, synaptic
        organization, and neuronal activity
      explanation: Loss of the contact reduces neuronal activity along with synaptic organization. Preprint.
- name: Neural Cell Dysfunction from Contact-Site Failure
  role: consequence
  biological_scale: CELLULAR
  description: >-
    The conforming disorders are almost all neurological: motor neuron disease,
    neuropathy, spastic paraplegia, ataxia, chorea, leukodystrophy and
    neurodevelopmental disorders. Neurons have a distinctive organelle profile
    dominated by mitochondria, and they respond to stress with larger organelle
    changes than astrocytes do. Why neurons are the vulnerable cell type is an
    open question (see discussions).
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30093493
    reference_title: "VPS13A and VPS13C are lipid transport proteins differentially localized at ER contact sites."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the human VPS13 genes are responsible for neurodevelopmental
      and neurodegenerative disorders including chorea acanthocytosis (VPS13A)
      and Parkinson's disease (VPS13C).
    explanation: Contact-site lipid transporters are mutated in neurological disease.
    quote_role: BACKGROUND
  - reference: PMID:19052620
    reference_title: "Mitofusin 2 tethers endoplasmic reticulum to mitochondria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      mitofusin 2, a mitochondrial dynamin-related protein mutated in the
      inherited motor neuropathy Charcot-Marie-Tooth type IIa, is enriched at
      the ER-mitochondria interface
    explanation: An ER-mitochondria tether is the gene mutated in an inherited motor neuropathy.
  - reference: PMID:40956669
    reference_title: "Neurons and astrocytes have distinct organelle signatures and responses to stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Neurons are characterized by prominent mitochondrial composition and
      interactions, while astrocytes contain more lysosomes and lipid droplet
      interactions. Additionally, neurons display a more robust organelle
      response than astrocytes to acute oxidative or ER stress.
    explanation: >-
      Organelle signature analysis in primary rodent neural cells shows that
      neurons rely on mitochondrial contacts and react more strongly to stress,
      one candidate reason for neuronal vulnerability.
- name: Impaired Cardiomyocyte Differentiation and Maturation
  role: consequence
  biological_scale: CELLULAR
  description: >-
    The second cell type in which contact-site failure has a measured
    developmental consequence. Cardiomyocytes build a dense mitochondrial
    network coupled to the sarcoplasmic reticulum. Loss of mitofusin-mediated
    fusion and tethering, of SR-mitochondria calcium coupling, or of the
    Golgi-derived phosphoinositide vesicles that act at mitofusin-marked fusion
    sites blocks or distorts cardiomyocyte differentiation and maturation, and
    in mice leads to arrested heart development or heart failure. The evidence
    is from mouse hearts and mouse embryonic stem cell-derived cardiomyocytes;
    no human contact-site disorder in the knowledge base yet carries a cardiac
    node that conforms here.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle cell differentiation
    modifier: DECREASED
    term:
      id: GO:0055007
      label: cardiac muscle cell differentiation
  evidence:
  - reference: PMID:24091702
    reference_title: "Mitochondrial fusion directs cardiomyocyte differentiation via calcineurin and Notch signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that mitochondrial fusion was required for proper cardiomyocyte
      development.
    explanation: Mitochondrial fusion, which mitofusins also tie to ER contacts, is required for cardiomyocyte development.
  - reference: PMID:41848670
    reference_title: "Mitofusin 2 Is Required for the Maturation of Embryonic Stem Cell-Derived Cardiomyocytes via a GRP75-Dependent Suppression of the ROS/PI3K/AKT/mTOR Axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MFN2 knockdown caused detrimental effects on mESC-CM maturation in terms of
      structure, cytosolic calcium kinetics, electrophysiology, and metabolism.
    explanation: Losing the SR-mitochondria tether MFN2 impairs maturation of ESC-derived cardiomyocytes.
discussions:
- discussion_id: mcs_neuronal_vulnerability_organelle_signature
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do contact-site disorders produce a characteristic organelle signature in
    the affected human cell type, and does it explain why neurons rather than
    other cells are damaged?
  attaches_to:
  - "pathophysiology#Altered Organelle Morphology, Number and Distribution"
  - "pathophysiology#Neural Cell Dysfunction from Contact-Site Failure"
  rationale: >-
    Most of the evidence in this module comes from single organelle pairs in
    non-neural cell lines. Neurons and astrocytes have different baseline
    organelle profiles, and contacts are rewired during neuronal
    differentiation, so a defect measured in HeLa or COS-7 cells may not show
    what goes wrong in the cell that degenerates. Contacts between different
    pairs also share tethers (VAPB serves several), so a single-pair assay can
    miss the effect on the rest of the network.
  evidence:
  - reference: PMID:41726917
    reference_title: "Organelle communication networks rewire to support lipid metabolism during neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find compartment and time-specific rescaling of organelles and a
      progressive increase in higher-order membrane contacts, with mitochondria
      emerging as an early interaction hub.
    explanation: Contacts are rewired during neuronal differentiation, so the cell type and stage matter. Preprint.
  proposed_experiments:
  - experiment_id: mcs_patient_ipsc_organelle_signature
    name: Organelle signature analysis of contact-site disorder iPSC-derived neurons and glia
    description: >-
      Differentiate patient and isogenic-corrected iPSC lines for several
      conforming disorders (for example VAPB, ACBD5, VPS13A, SNX14, PDZD8) into
      neurons and astrocytes, and image six to eight organelles at once with
      multispectral live-cell imaging. Quantify organelle number, volume,
      position and pairwise and higher-order contacts, under basal conditions
      and after oxidative or ER stress.
    readouts:
    - name: Organelle morphology and contact signature
      target: "pathophysiology#Altered Organelle Morphology, Number and Distribution"
    would_support:
    - "pathophysiology#Altered Organelle Morphology, Number and Distribution"
    - "pathophysiology#Neural Cell Dysfunction from Contact-Site Failure"
    supporting_outcome:
    - >-
      Each disorder changes contacts beyond the directly tethered pair, and the
      change is larger in neurons than in astrocytes from the same patient.
    refuting_outcome:
    - >-
      Patient neurons and astrocytes show the same change, or only the directly
      tethered pair is affected.
    evidence:
    - reference: PMID:40956669
      reference_title: "Neurons and astrocytes have distinct organelle signatures and responses to stress."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we use multispectral imaging to simultaneously visualize six
        organelles-endoplasmic reticulum (ER), lysosomes, mitochondria,
        peroxisomes, Golgi, and lipid droplets-in live primary rodent neurons
        and astrocytes.
      explanation: The method exists and has been applied to neural cells.
- discussion_id: mcs_golgi_mitochondria_cardiomyocyte
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do direct Golgi-mitochondria contacts exist in cardiomyocytes, and do they
    change as cardiomyocytes differentiate and mature?
  attaches_to:
  - "pathophysiology#Altered Organelle Morphology, Number and Distribution"
  - "pathophysiology#Impaired Cardiomyocyte Differentiation and Maturation"
  rationale: >-
    The cardiac evidence for Golgi-mitochondria communication is indirect:
    Golgi-derived vesicles carrying PI(4)P or PI(3,4)P2 reach ER-mitochondria
    and mitofusin-marked sites to complete mitochondrial division or fusion,
    and deleting the PI(3,4)P2-producing kinases in cardiomyocytes fragments
    mitochondria and causes heart failure. That is a vesicle acting at a
    three-organelle contact, not a stable two-membrane contact. Stable,
    long-lived Golgi-mitochondria contacts have been described in pancreatic
    acinar cells, where they shape Golgi calcium gradients, but no tether is
    known and they have not been mapped in heart muscle. Whether the Golgi is a
    regulated contact partner of mitochondria during cardiomyocyte maturation,
    or only a source of signalling vesicles, is open.
  evidence:
  - reference: PMID:15722348
    reference_title: "Stable Golgi-mitochondria complexes and formation of Golgi Ca(2+) gradients in pancreatic acinar cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mitochondria and the Golgi structures form very close contacts, and
      these contacts remain stable over time.
    explanation: Direct, stable Golgi-mitochondria contacts are documented, though in acinar cells rather than heart.
  proposed_experiments:
  - experiment_id: mcs_cardiomyocyte_organelle_signature_time_course
    name: Organelle signature time course of iPSC-cardiomyocyte differentiation
    description: >-
      Image ER/SR, mitochondria, Golgi, lysosomes, peroxisomes and lipid
      droplets together across human iPSC-to-cardiomyocyte differentiation and
      maturation, quantifying Golgi-mitochondria and SR-mitochondria contacts,
      mitochondrial network shape and organelle positions, in wild-type cells
      and after MFN2 or PI3K-C2 knockdown.
    readouts:
    - name: Golgi-mitochondria and SR-mitochondria contact extent over differentiation
      target: "pathophysiology#Altered Organelle Morphology, Number and Distribution"
    would_support:
    - "pathophysiology#Impaired Cardiomyocyte Differentiation and Maturation"
    supporting_outcome:
    - >-
      Golgi-mitochondria contacts change in a regulated way as cardiomyocytes
      mature, and their loss delays maturation.
    refuting_outcome:
    - >-
      Golgi-mitochondria proximity in cardiomyocytes is no more frequent than
      chance, and maturation defects track only SR-mitochondria coupling.

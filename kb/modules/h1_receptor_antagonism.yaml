name: H1 Receptor Antagonism Module
description: "Pharmacological blockade of the histamine H1 receptor by the antihistamine class, and the two compartments that decide whether occupancy helps or harms. In the skin and other peripheral tissues, blocking H1 removes the histamine-driven vasodilatation, plasma extravasation and itch that produce a weal, which is the therapeutic effect; in the brain, occupancy of the same receptor produces sedation and cognitive impairment, which is why the class divides into first-generation agents that penetrate the brain and later ones that largely do not. The key conformance target is the central effector, \"Blockade of H1-Mediated Vasodilatation, Plasma Extravasation and Itch\". A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"H1 Receptor Antagonist Occupancy\", which represents the drug's receptor occupancy rather than the state it produces. Scope: H1 only. H2 antagonism is a separate module, by the project rule that one receptor family plus one direction of pharmacological action makes one module -- H2 is a different receptor on a different cell with a disjoint effector chain, gastric parietal-cell acid secretion, and a disjoint set of conformers. The Workstream A table of projects/GPCR.md listed the two together as one candidate; they are two."
category: Module
module_categories:
- PHARMACOLOGY
- IMMUNOLOGY
creation_date: '2026-10-26T15:50:00Z'
notes: "Scope decisions recorded for the next curator. The central effector is graded INDIRECT on its cited evidence throughout, and deliberately: the sources describe what histamine does at the H1 receptor, so the claim that blockade removes it is an inference from the unblocked state rather than a measurement of the blocked one. Saying so is more useful than asserting the step directly from a source that does not test it. No transducer is named anywhere in the module. The H1 receptor's coupling is not stated by any abstract cited here, and module snippets are matched against the abstract, so the receptor's signalling is left unasserted rather than filled in from general knowledge -- that is the one claim an ontology binding would have made look sourced. The anticholinergic node is unparented for the same reason and it is a stronger case: those effects are conventionally muscarinic, no cited abstract says so, and an edge from H1 occupancy would have asserted that blocking H1 causes thirst and tachycardia. Itch is bound, after a search: GO:0160025 sensory perception of itch exists and fits, so the node binds all three components of the triad rather than carrying a note about the one that got away. Four entries treat with H1 and H2 antihistamines in a single treatment (Mast_Cell_Activation_Syndrome, Systemic_Mastocytosis, Maculopapular_Cutaneous_Mastocytosis and Monoclonal_Mast_Cell_Activation_Syndrome), and all four conform here. A bundled treatment is not an obstacle to conforming when it binds its components as separate agents: the treatment then carries one target_mechanisms link per receptor, and the link to this module's trigger asserts nothing about the H2 agent beside it. Two of the four already bound both classes as separate agents; the other two had agents missing, which were bound from each treatment's own citation. Splitting such a treatment is positively the wrong move in two of these cases -- Systemic_Mastocytosis' evidence is strategy-level rather than class-specific, so split halves would carry no evidence of their own, and Monoclonal_Mast_Cell_Activation_Syndrome's cited sentence is a diagnostic criterion about the bundle as a whole, which a split would misrepresent. What holds the H2 side of these four back is not bundling but the H2 module's scope: that module is a gastric acid-suppression chain, running parietal-cell cAMP loss to reduced acid output to raised intragastric pH, while these entries use H2 blockade for histamine-driven gastrointestinal symptoms without establishing the acid pathway. An H2-mediated-symptom module distinct from acid suppression is what the H2 side needs, and it does not exist yet."
pathophysiology:
- name: "H1 Receptor Antagonist Occupancy"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    An antihistamine binds the histamine H1 receptor and prevents histamine acting there. The agents
    are not only neutral antagonists: at least some of the class are inverse agonists, which
    suppress the receptor's constitutive activity rather than merely competing with histamine for
    it. No location is bound here on purpose: this node is the drug's occupancy of the receptor
    wherever the receptor is, and both the peripheral and the central arm hang off it, so pinning it
    to one tissue would contradict its own children.
  molecular_functions:
  - preferred_term: "H1 receptor blockade by an antihistamine"
    term:
      id: GO:0004969
      label: "histamine receptor activity"
    modifier: DECREASED
  genes:
  - preferred_term: "HRH1"
    term:
      id: hgnc:5182
      label: "HRH1"
  evidence:
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "H1 receptor antagonists, known as H1-antihistamines (AHs), inactivate the histamine H1-receptor thereby preventing histamine causing the primary symptoms of allergic diseases, such as atopic dermatitis, pollinosis, food allergies, and urticaria."
    explanation: "States the receptor, the action on it and the indications, which is this node."
  - reference: PMID:17902729
    reference_title: "Desloratadine for chronic idiopathic urticaria: a review of clinical efficacy."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Desloratadine is a rapid-acting, once-daily, nonsedating selective H1-receptor antagonist/inverse receptor agonist with proven clinical efficacy in patients with CIU."
    explanation: "Records that an agent of this class is an inverse agonist as well as an antagonist, which is the distinction this node's description draws."
  downstream:
  - target: "Blockade of H1-Mediated Vasodilatation, Plasma Extravasation and Itch"
  - target: "Central H1 Receptor Occupancy"
- name: "Blockade of H1-Mediated Vasodilatation, Plasma Extravasation and Itch"
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Histamine released from activated mast cells acts at H1 receptors to dilate dermal vessels, let
    plasma out of them and excite the sensory fibres that signal itch; that triad is what a weal and
    the itch over it consist of. Occupying the receptor removes the histamine-dependent part of it.
    This is the step the therapeutic consequence runs through and the key conformance target.

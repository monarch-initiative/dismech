name: H1 Receptor Antagonism Module
description: "Pharmacological blockade of the histamine H1 receptor by the antihistamine class, and the two compartments that decide whether occupancy helps or harms. In the skin and other peripheral tissues, blocking H1 removes the histamine-driven vasodilatation, plasma extravasation and itch that produce a weal, which is the therapeutic effect; in the brain, occupancy of the same receptor produces sedation and cognitive impairment, which is why the class divides into first-generation agents that penetrate the brain and later ones that largely do not. The key conformance target is the central effector, \"Blockade of H1-Mediated Vasodilatation, Plasma Extravasation and Itch\". A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"H1 Receptor Antagonist Occupancy\", which represents the drug's receptor occupancy rather than the state it produces; both current conformers do this. Scope: H1 only. H2 antagonism is a separate module, by the project rule that one receptor family plus one direction of pharmacological action makes one module -- H2 is a different receptor on a different cell with a disjoint effector chain, gastric parietal-cell acid secretion, and a disjoint set of conformers. The Workstream A table of projects/GPCR.md listed the two together as one candidate; they are two."
category: Module
module_categories:
- PHARMACOLOGY
- IMMUNOLOGY
creation_date: '2026-10-26T15:50:00Z'
notes: "Scope decisions recorded for the next curator. The central effector is graded INDIRECT on its cited evidence throughout, and deliberately: the sources describe what histamine does at the H1 receptor, so the claim that blockade removes it is an inference from the unblocked state rather than a measurement of the blocked one. Saying so is more useful than asserting the step directly from a source that does not test it. No transducer is named anywhere in the module. The H1 receptor's coupling is not stated by any abstract cited here, and module snippets are matched against the abstract, so the receptor's signalling is left unasserted rather than filled in from general knowledge -- that is the one claim an ontology binding would have made look sourced. Three further entries treat with H1 and H2 antihistamines bundled into a single treatment (Mast_Cell_Activation_Syndrome, with cetirizine and famotidine together; Maculopapular_Cutaneous_Mastocytosis; and Systemic_Mastocytosis' relatives), and none can be routed to an H1-only occupancy node without asserting H1 action for an H2 drug. Splitting those treatments is a worklist item the H2 module will meet again, and is an argument for having kept the two modules apart rather than against it."
pathophysiology:
- name: "H1 Receptor Antagonist Occupancy"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    An antihistamine binds the histamine H1 receptor and prevents histamine acting there. The agents
    are not only neutral antagonists: at least some of the class are inverse agonists, which
    suppress the receptor's constitutive activity rather than merely competing with histamine for
    it.
  molecular_functions:

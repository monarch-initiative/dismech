  evidence:
  - reference: PMID:40451490
    reference_title: "Chronic spontaneous urticaria and chronic inducible urticaria."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "When activated, they release bioactive mediators including histamine and leukotrienes that bind to histamine receptors causing vasodilation and extravasation of fluid from the blood vasculature, resulting in wheals and itch."
    explanation: "Describes the histamine-driven step this node asserts is removed. Graded INDIRECT because it reports the unblocked mechanism rather than the effect of blocking it."
  - reference: PMID:34536239
    reference_title: "The international EAACI/GA²LEN/EuroGuiDerm/APAAACI guideline for the definition, classification, diagnosis, and management of urticaria."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Urticaria is a frequent, mast cell-driven disease that presents with wheals, angioedema, or both."
    explanation: "Context for the blockade: the clinical target is a mast-cell-driven process. The mast cell is the histamine source upstream and is deliberately not bound on this node, because the receptors blocked here are on the vessel wall and the sensory ending and the drug does not act on the mast cell. INDIRECT for the same reason as above."
  downstream:
  - target: "Relief of Weals and Itch"
- name: "Relief of Weals and Itch"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint the class is prescribed for. H1 antihistamines are first-line in allergic
    disease and in chronic urticaria, where they reduce the number and size of weals and the
    severity of itch, and recover the sleep and daily activity those cost.
  evidence:
  - reference: PMID:17902729
    reference_title: "Desloratadine for chronic idiopathic urticaria: a review of clinical efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Results from randomized, double-blind, placebo-controlled studies of 6 weeks' duration in adults and adolescents with moderate-to-severe CIU indicate that desloratadine significantly minimizes the severity of pruritus, reduces the number and size of hives, and improves disease-impaired sleep and daily activities."
    explanation: "Names the endpoints and the trial design behind them, pooled for one agent of the class."
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "AHs, which are classified into first-generation (fgAHs) and second-generation (sgAHs) antihistamines, are the first line of treatment for allergic diseases."
    explanation: "Records the class's first-line standing, which is the clinical weight of this node."
- name: "Central H1 Receptor Occupancy"
  role: effector
  biological_scale: MOLECULAR
  description: >-
    The same receptor sits in the brain, so an agent that crosses the blood-brain barrier occupies
    it there as well. How much it does is measurable rather than inferred: positron emission
    tomography quantifies H1 receptor occupancy, and that measurement is what brain penetrability
    now means for this class. It is also what re-sorted the class -- agents shown not to penetrate
    were reclassified on the strength of those studies.
  molecular_functions:
  - preferred_term: "H1 receptor occupancy by a brain-penetrating antihistamine"
    term:
      id: GO:0004969
      label: "histamine receptor activity"
    modifier: DECREASED
  locations:
  - preferred_term: "brain"
    term:
      id: UBERON:0000955
      label: "brain"
  genes:
  - preferred_term: "HRH1"
    term:
      id: hgnc:5182
      label: "HRH1"
  evidence:
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of histamine H1-receptor occupancy (H1RO) based on positron emission tomography (PET) has been developed for the evaluation of brain penetrability."
    explanation: "Establishes that central occupancy of this receptor is measured directly, which is what makes this a node rather than an inference from sedation."
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on the results of the H1RO-PET studies, non-brain-penetrating AHs (nbpAHs) have recently been reclassified among sgAHs."
    explanation: "Records that the measurement reorganised the class, which is why central occupancy is modelled as its own step rather than folded into the adverse node."
  downstream:
  - target: "Sedation and Cognitive Impairment from Central H1 Occupancy"
- name: "Sedation and Cognitive Impairment from Central H1 Occupancy"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    Drowsiness, lassitude and cognitive impairment follow occupancy of brain H1 receptors. This is
    the central arm's consequence and nothing else: the anticholinergic effects the same agents
    cause are a separate node, because they are a different receptor. The cost is large enough that
    the cited review does not recommend first-generation agents for allergic disease at all. The
    later agents are minimally sedating, and that is what lets them be given at the higher doses
    where they work better.
  evidence:
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although fgAHs are effective, they cause adverse reactions such as potent sedating effects, including drowsiness, lassitude, and cognitive impairment; anticholinergic effects, including thirst and tachycardia."
    explanation: "Quoted whole because the sentence is one clause list; this node rests on its sedating half -- drowsiness, lassitude and cognitive impairment -- and the efficacy clause that makes it a trade-off rather than a failure. The anticholinergic half is a separate node."
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Consequently, the use of fgAHs is not recommended for allergic diseases."
    explanation: "The strength of the recommendation that follows from the adverse profile."
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Today, sgAHs, which are minimally sedating and, therefore, may be used at more effective doses, are the first-line treatment for alleviating the symptoms of allergic diseases."
    explanation: "Records that reduced sedation buys dose headroom, which is the other half of why the compartment distinction matters clinically."
- name: "Anticholinergic Effects of First-Generation Antihistamines"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    Thirst, tachycardia and the rest of the antimuscarinic picture accompany the first-generation
    agents. This node has no upstream edge inside the module, and that is the claim: these effects
    do not follow from H1 occupancy at all, central or peripheral, so giving them one would assert
    that blocking H1 causes them. They are conventionally attributed to the same molecules binding
    muscarinic acetylcholine receptors, but no abstract cited here states that, so the upstream step
    is left unasserted rather than filled in -- the same decision taken for the H1 receptor's own
    transducer. What the module does assert is that the agents cause them, and that this is part of
    why the first generation is no longer recommended.
  evidence:
  - reference: PMID:34622396
    reference_title: "Efficacy and Safety of Non-brain Penetrating H(1)-Antihistamines for the Treatment of Allergic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although fgAHs are effective, they cause adverse reactions such as potent sedating effects, including drowsiness, lassitude, and cognitive impairment; anticholinergic effects, including thirst and tachycardia."
    explanation: "Quoted whole for the same reason as the sedation node; this node rests on its anticholinergic half -- thirst and tachycardia -- and on the sentence attributing them to the agents rather than to a mechanism, which is why no upstream edge is drawn."

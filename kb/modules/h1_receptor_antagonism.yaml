    term:
      id: GO:0042311
      label: "vasodilation"
    modifier: DECREASED
  - preferred_term: "regulation of vascular permeability"
    term:
      id: GO:0043114
      label: "regulation of vascular permeability"
    modifier: DECREASED
  - preferred_term: "sensory perception of itch"
    term:

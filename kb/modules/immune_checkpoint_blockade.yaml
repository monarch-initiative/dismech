name: Immune Checkpoint Blockade Module
description: >-
  A conserved mechanism module representing the tumor-immune cycle that
  checkpoint inhibitors target. Across many cancer types, tumor cells
  generate neoantigens that provoke anti-tumor T cell responses, but
  adaptively upregulate immune checkpoint ligands (PD-L1, PD-L2) and
  recruit immunosuppressive cells to evade destruction. Immune checkpoint
  blockade (anti-PD-1, anti-PD-L1, anti-CTLA-4) reverses this evasion by
  restoring effector T cell function. This module captures the shared
  causal chain from neoantigen presentation through adaptive immune
  resistance to T cell exhaustion, and defines the mechanism-of-action
  pattern for checkpoint inhibitor treatments. Individual disorder entries
  declare conformance via conforms_to on their pathophysiology nodes,
  substituting tumor-type-specific details (driver mutations, neoantigen
  sources, tissue-specific immune microenvironment) while preserving the
  conserved immune evasion and checkpoint blockade response pattern. The chain
  then carries the blockade itself and its failure. The drug node is where a
  conforming entry's checkpoint inhibitor belongs, and it records that the two
  classes act at non-overlapping points of the same cycle - anti-CTLA-4 at
  priming, anti-PD-1/PD-L1 at the effector phase - which is the mechanistic
  argument for combining them and also predicts their toxicity, since
  releasing the brake releases it outside the tumour too. The resistance node
  records that most failures sit upstream of the checkpoint rather than at it:
  no antigen to recognise, or antigen that can no longer be presented.
category: Module
module_categories:
- PHARMACOLOGY
- ONCOLOGY
- IMMUNOLOGY
creation_date: "2026-03-21T00:00:00Z"
updated_date: "2026-04-12T22:30:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "immune_checkpoint_blockade#Adaptive Immune Resistance"). The module
  defines the expected pathophysiology structure; conforming nodes in
  disorder files should include the corresponding cell types, biological
  processes, and causal edges, specialized to their tumor context.
  Key tumor-specific substitutions: MSI-H CRC uses dMMR-driven
  hypermutation as the neoantigen source; melanoma uses UV-induced
  mutation burden; virus-associated cancers (NPC, EBV gastric) use
  viral antigen presentation alongside somatic neoantigens.
  A conforming entry's checkpoint inhibitor should reach
  "immune_checkpoint_blockade#Checkpoint Blockade and Restoration of Effector
  Function" via target_mechanisms rather than hang unlinked, and its
  resistance route belongs on "Primary and Acquired Resistance to Checkpoint
  Blockade", naming which upstream node the route removes - antigen, antigen
  presentation, or T cell entry. The neoantigen source itself is the trigger
  node here and is the same claim that
  "genome_instability_mutation#Neoantigen Load and Checkpoint-Blockade
  Sensitivity" makes from the repair-defect side; an entry whose
  immunogenicity comes from a caretaker lesion can conform to both, and the
  scope limit recorded on that node applies here too.
computational_models:
- name: Base Tumor-Immune PhysiCell Model
  description: >-
    Grammar-based PhysiCell agent-based model of a heterogeneous tumor under
    immune surveillance. Immune cells chemotax toward tumor-derived signals,
    form physical contacts, and attempt contact-mediated killing, making this a
    useful executable baseline for the anti-tumor T cell response segment of
    this module.
  model_type: AGENT_BASED
  repository_url: https://github.com/PhysiCell-Models/grammar_samples/tree/v2.0.1/user_projects/tumor_immune_base
  model_id: grammar_samples:v2.0.1/user_projects/tumor_immune_base
  base_model: PhysiCell grammar manuscript release DOI:10.5281/zenodo.16285252
  model_software: PhysiCell
  model_format: C++/XML/CSV
  publication: DOI:10.1016/j.cell.2025.06.048
  notes: >-
    Official sample model from the manuscript-synced grammar_samples release.
    Most relevant to the "Anti-Tumor T Cell Response" and early immune-escape
    portions of this module.
- name: Extended Tumor-Immune PhysiCell Model
  description: >-
    Expanded grammar-based PhysiCell tumor-immune model with a richer set of
    immune-tumor interaction rules than the base example. This is a better
    executable analogue for adaptive immune resistance and state-dependent
    suppression within checkpoint-responsive tumors.
  model_type: AGENT_BASED
  repository_url: https://github.com/PhysiCell-Models/grammar_samples/tree/v2.0.1/user_projects/tumor_immune_extended
  model_id: grammar_samples:v2.0.1/user_projects/tumor_immune_extended
  base_model: PhysiCell grammar manuscript release DOI:10.5281/zenodo.16285252
  model_software: PhysiCell
  model_format: C++/XML/CSV
  publication: DOI:10.1016/j.cell.2025.06.048
  notes: >-
    Official sample model from the manuscript-synced grammar_samples release.
    Best treated as a reusable executable reference for checkpoint-sensitive
    tumor-immune interaction logic rather than a disease-specific digital twin.
pathophysiology:
- name: Neoantigen Generation
  description: >-
    Tumor cells accumulate somatic mutations, some of which produce
    novel peptides (neoantigens) presented on MHC class I molecules.
    The neoantigen source varies by tumor type: mismatch repair
    deficiency in MSI-H cancers, UV-induced mutations in melanoma,
    viral antigens in virus-associated cancers, or high tumor
    mutational burden from other causes. Higher neoantigen load
    generally correlates with greater immunogenicity and checkpoint
    inhibitor responsiveness.
  role: trigger
  biological_processes:
  - preferred_term: Antigen Processing and Presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
  evidence:
  - reference: PMID:35105974
    reference_title: "Identification of neoantigens for individualized therapeutic cancer vaccines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Somatic mutations in cancer cells can generate tumour-specific
      neoepitopes, which are recognized by autologous T cells in the host.
      As neoepitopes are not subject to central immune tolerance and are
      not expressed in healthy tissues, they are attractive targets for
      therapeutic cancer vaccines.
    explanation: >-
      Review directly describing how somatic mutations generate
      tumor-specific neoantigens recognized by host T cells, supporting
      the neoantigen generation mechanism. Evidence source is OTHER
      because this is a review article.
  downstream:
  - target: Anti-Tumor T Cell Response

- name: Anti-Tumor T Cell Response
  description: >-
    Dendritic cells present tumor neoantigens to naive T cells, priming
    CD8+ cytotoxic T lymphocytes that infiltrate the tumor and recognize
    tumor cells via MHC-I/neoantigen complexes. CTLA-4 acts as a brake
    at this priming stage in lymph nodes, competing with CD28 for B7
    ligand binding. The magnitude of the T cell response depends on
    neoantigen immunogenicity, dendritic cell function, and the balance
    of co-stimulatory versus co-inhibitory signals during priming.
  role: effector
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T Cell Activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: INCREASED
  - preferred_term: T Cell Mediated Cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
    modifier: INCREASED
  evidence:
  - reference: PMID:38762484
    reference_title: "Regulatory mechanisms of PD-1/PD-L1 in cancers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blockade of PD-1/PD-L1 by neutralizing antibodies restores T cells
      activity and enhances anti-tumor immunity, achieving remarkable success
      in cancer therapy.
    explanation: >-
      Review confirming that anti-tumor T cell responses exist but are
      suppressed by PD-1/PD-L1 signaling, and can be restored by checkpoint
      blockade. Evidence source is OTHER because this is a review article.
  - reference: PMID:28187290
    reference_title: "Primary, Adaptive, and Acquired Resistance to Cancer Immunotherapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CTLA-4 competes with CD28 for B7 ligands and inhibits proliferation and
      IL-2 secretion by T cells
    explanation: >-
      Supports the CTLA-4 brake this node describes, which it previously
      asserted without a citation. Graded OTHER as the source is a review.
  downstream:
  - target: Adaptive Immune Resistance
    description: >-
      The anti-tumor immune response itself triggers adaptive upregulation
      of checkpoint ligands by tumor cells, creating a negative feedback loop.

- name: Adaptive Immune Resistance
  description: >-
    Tumor cells upregulate PD-L1 (and PD-L2) expression in response to
    interferon-gamma secreted by infiltrating T cells. This adaptive
    mechanism represents a co-opted physiological immune homeostasis
    pathway: PD-L1 engagement of PD-1 on effector T cells delivers
    inhibitory signals that suppress cytotoxicity, cytokine production,
    and proliferation. Tumors with active adaptive immune resistance
    are termed "immune-adapted" and are the best candidates for
    PD-1/PD-L1 blockade therapy, as the underlying anti-tumor immunity
    exists but is being actively suppressed.
  role: central_effector
  biological_processes:
  - preferred_term: Negative Regulation of T Cell Mediated Immunity
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
    modifier: INCREASED
  evidence:
  - reference: PMID:38762484
    reference_title: "Regulatory mechanisms of PD-1/PD-L1 in cancers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The interaction of PD-1 and PD-L1 negatively regulates adaptive
      immune response mainly by inhibiting the activity of effector T cells
      while enhancing the function of immunosuppressive regulatory T cells
      (Tregs), largely contributing to the maintenance of immune homeostasis
      that prevents dysregulated immunity and harmful immune responses.
      However, cancer cells exploit the PD-1/PD-L1 axis to cause immune
      escape in cancer development and progression.
    explanation: >-
      Directly describes the adaptive immune resistance mechanism: tumors
      co-opt the PD-1/PD-L1 homeostatic pathway to suppress anti-tumor
      T cell activity. Evidence source is OTHER as this is a review.
  downstream:
  - target: T Cell Exhaustion and Immune Escape
    description: >-
      Chronic checkpoint engagement drives T cells toward an exhausted
      phenotype with progressive loss of effector function.
  - target: Checkpoint Blockade and Restoration of Effector Function
    description: >-
      Adaptive immune resistance is a brake applied to a response that already
      exists, which is exactly what an antibody can take off - so this node is
      the module's druggable step.

- name: T Cell Exhaustion and Immune Escape
  description: >-
    Persistent antigen exposure combined with chronic PD-1 signaling
    drives tumor-infiltrating T cells toward an exhausted phenotype
    characterized by progressive loss of cytokine production,
    cytotoxicity, and proliferative capacity, with upregulation of
    multiple inhibitory receptors (PD-1, LAG-3, TIM-3, TIGIT). The
    immunosuppressive tumor microenvironment is further reinforced by
    recruitment of regulatory T cells, myeloid-derived suppressor cells,
    and tumor-associated macrophages. This results in functional immune
    escape despite physical T cell presence in the tumor.
  role: consequence
  cell_types:
  - preferred_term: Exhausted T cell
    term:
      id: CL:0011025
      label: exhausted T cell
  biological_processes:
  - preferred_term: Exhausted T Cell Differentiation
    term:
      id: GO:0160083
      label: exhausted T cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:26086965
    reference_title: "T-cell exhaustion in the tumor microenvironment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The exhausted T cells in the tumor microenvironment show
      overexpressed inhibitory receptors, decreased effector cytokine
      production and cytolytic activity, leading to the failure of
      cancer elimination.
    explanation: >-
      Review directly describing T cell exhaustion in the tumor
      microenvironment, including overexpression of inhibitory receptors
      (PD-1, LAG-3, TIM-3) and loss of effector function leading to
      immune escape. Evidence source is OTHER as this is a review article.
  - reference: PMID:28878676
    reference_title: "PD-1 and PD-L1 Checkpoint Signaling Inhibition for Cancer Immunotherapy: Mechanism, Combinations, and Clinical Outcome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite the huge success and efficacy of the anti-PD therapy response,
      it is limited to specific types of cancers, which attributes to the
      insufficient and heterogeneous expression of PD-1 in the tumor
      microenvironment.
    explanation: >-
      Establishes that immune escape via checkpoint pathways varies across
      cancers, with PD-1 expression heterogeneity explaining differential
      responses to checkpoint blockade.

- name: Checkpoint Blockade and Restoration of Effector Function
  description: >-
    This is the node a conforming entry's checkpoint inhibitor targets, and the
    module was named for it while not containing it. Blocking the inhibitory
    axis with an antibody does not add anti-tumour immunity; it removes a brake
    from immunity the patient already has, which is why the upstream nodes are
    load-bearing - a tumour with no neoantigen and no infiltrate has nothing to
    release. The two drug classes act at non-overlapping points of the same
    cycle: anti-CTLA-4 at priming in the lymph node, where CTLA-4 competes with
    CD28 for B7, and anti-PD-1 or anti-PD-L1 at the effector phase inside the
    tumour. That non-overlap, not additive potency, is the mechanistic argument
    for combining them, and it predicts the cost - CTLA-4 blockade in the first
    randomised trial to improve survival in metastatic melanoma produced grade
    3 or 4 immune-related adverse events in 10 to 15% of patients. Those events
    are the same mechanism acting outside the tumour rather than an off-target
    effect, which is why they are managed by suppressing the response rather
    than by changing the agent.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: T cell mediated immunity restored by checkpoint blockade
    term:
      id: GO:0002456
      label: T cell mediated immunity
  - preferred_term: Negative Regulation of T Cell Mediated Immunity
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
    modifier: DECREASED
  evidence:
  - reference: PMID:20525992
    reference_title: "Improved survival with ipilimumab in patients with metastatic melanoma."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ipilimumab, with or without a gp100 peptide vaccine, as compared with
      gp100 alone, improved overall survival in patients with previously
      treated metastatic melanoma.
    explanation: >-
      The randomised result that established this node clinically, and the first
      phase 3 trial to improve overall survival in metastatic melanoma.
  - reference: PMID:20525992
    reference_title: "Improved survival with ipilimumab in patients with metastatic melanoma."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Grade 3 or 4 immune-related adverse events occurred in 10 to 15% of
      patients treated with ipilimumab and in 3% treated with gp100 alone.
    explanation: >-
      Quantifies the toxicity this node treats as part of the mechanism rather
      than as an adverse-effect footnote: releasing the brake releases it
      everywhere, so the rate scales with the mechanism working.
  - reference: PMID:28187290
    reference_title: "Primary, Adaptive, and Acquired Resistance to Cancer Immunotherapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      clinical testing of the combination of these two classes of checkpoint
      inhibitors showed improved clinical response
    explanation: >-
      Supports the combination claim, which this node derives from the two
      classes acting at different points of the cycle rather than from additive
      potency. Graded OTHER as the source is a review.
  downstream:
  - target: Primary and Acquired Resistance to Checkpoint Blockade
    description: >-
      Most patients do not benefit, and the reasons are mostly upstream of the
      checkpoint rather than at it.

- name: Primary and Acquired Resistance to Checkpoint Blockade
  description: >-
    The majority of patients treated with checkpoint blockade do not benefit,
    and the instructive part is where the failure sits: not at the checkpoint,
    which the antibody blocks reliably, but at the earlier nodes of this
    module. A tumour may present no antigen for a T cell to recognise, or carry
    antigen it can no longer display - loss of beta-2-microglobulin, MHC class
    I itself, or the TAP transporters, any of which leaves CD8 T cells blind to
    an otherwise immunogenic tumour. Tumour-intrinsic signalling routes
    including MAPK output, PTEN loss, WNT/beta-catenin activity and loss of
    interferon-gamma signalling exclude T cells from the microenvironment
    instead. The acquired form is the same lesion arriving later: in the
    mismatch-repair-deficient cohort that defined the neoantigen vulnerability
    in genome_instability_mutation, the brain metastases that escaped
    pembrolizumab had acquired truncating B2M mutations that their primary
    tumours did not carry. Read that way, resistance here is loss of this
    module's trigger node rather than restoration of its central one, which is
    why adding a second checkpoint antibody does not address it and why a
    conforming entry should record which node its resistance route removes.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
    modifier: DECREASED
  evidence:
  - reference: PMID:28187290
    reference_title: "Primary, Adaptive, and Acquired Resistance to Cancer Immunotherapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients who have primary resistance to checkpoint inhibitors do not
      respond to the initial therapy.
    explanation: >-
      Establishes the primary form of this node as distinct from relapse after
      response, which is the distinction the node's two halves rest on.
  - reference: PMID:28187290
    reference_title: "Primary, Adaptive, and Acquired Resistance to Cancer Immunotherapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most straightforward reason why a tumor would not respond to immune
      checkpoint therapy or ACT is lack of recognition by T cells because of
      absence of tumor antigens
    explanation: >-
      States the node's central claim - that the commonest failure is at the
      antigen step, upstream of the checkpoint the drug blocks.
  - reference: PMID:28187290
    reference_title: "Primary, Adaptive, and Acquired Resistance to Cancer Immunotherapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      B2M is required for HLA class I folding and transport to the cell
      surface, and its genetic deficiency would lead to lack of CD8 T cell
      recognition
    explanation: >-
      Supplies the mechanism by which the B2M lesion in the clinical result
      below causes resistance, which the mutation alone does not establish.
  - reference: PMID:28596308
    reference_title: "Mismatch repair deficiency predicts response of solid tumors to PD-1 blockade."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of note, the brain metastases from both these patients contained
      mutations in the B2M gene.
    explanation: >-
      The acquired-resistance observation in humans, and the same cohort that
      supplies the neoantigen vulnerability in genome_instability_mutation - so
      the vulnerability and its escape route are measured in one series.

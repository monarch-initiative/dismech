name: Beta2 Adrenergic Receptor Agonism Module
description: "Pharmacological activation of the beta2 adrenergic receptor on airway smooth muscle, and the relaxation chain it drives. An agonist occupies beta2, which couples through a trimeric Gs protein to adenylate cyclase; the resulting cAMP relaxes airway smooth muscle by phosphorylating muscle regulatory proteins and lowering cytosolic calcium, which dilates the airway and relieves airflow obstruction. The key conformance target is the central effector, \"Airway Smooth Muscle Relaxation\". A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"Beta2 Adrenergic Receptor Agonist Occupancy\". Scope: the airway chain only, which is how the Workstream A queue of projects/GPCR.md names this module and which follows the tissue-scoped precedent of cardiac_camp_pka_calcium_handling and spinal_hsp90_opioid_enhancement. Beta2 agonists are used in this knowledge base for two further and mechanistically disjoint purposes that share this module's trigger and transducer but not its effector: enhancing neuromuscular transmission, in the congenital myasthenic syndromes and several myopathies, and driving potassium intracellularly in Hyperkalemic_Periodic_Paralysis. Those are candidates for their own modules, or for further effector arms here; which of the two is right is undecided, and the airway scope here does not settle it. Muscarinic antagonism is a separate module by the project rule that one receptor family plus one direction of pharmacological action makes one module; the two classes are frequently inhaled together, which is a shared indication and not a shared mechanism."
category: Module
module_categories:
- PHARMACOLOGY
creation_date: '2026-10-27T02:20:00Z'
notes: "The transducer and the receptor subtype are both bound, and both are more specific than their counterparts in the histamine modules, because the ontology happens to cover this receptor better. GO:0004941 beta2-adrenergic receptor activity names the subtype, where h1_receptor_antagonism and h2_receptor_antagonism both had to sit on GO:0004969 histamine receptor activity because GO has no subtype-specific histamine receptor terms. GO:0071880 is adrenergic-specific, where the H2 module could only use the generic GO:0007189. The difference is ontology coverage, not a claim that this receptor is better understood. Desensitisation is a mechanism node here, not a knowledge gap, because the cited review states the mechanism: phosphorylation by beta-ARK and uncoupling from Gs after beta-arrestin binding. In h2_receptor_antagonism the comparable tolerance is a KNOWLEDGE_GAP, because its source says the mechanism remains unclear; and in this module the variability in who benefits from a long-acting agonist is also a gap, because the cited review says genotypic and phenotypic explanations have not been demonstrated. The three differ according to what their sources state, not according to any judgement about the drug classes. The monotherapy claim is scoped carefully. PMID:21659855 (2011) states that long-acting agonists are not recommended as monotherapy, and PMID:26949137 (2016) is the large trial showing that the fixed-dose combination with an inhaled corticosteroid carries no significantly higher risk of serious asthma-related events than the corticosteroid alone. No source cited here covers the subsequent regulatory history, so the module asserts the trial result and the recommendation and says nothing about boxed warnings. Conformers include airway-disease entries and a toxicological one (Formaldehyde_Poisoning), so the module is not tied to asthma. The current conformer list is read from the entries themselves (`just list-modules`, `just check-conformance-content`), not from this paragraph. Sulfur_Mustard_Poisoning is not a conformer: its salmeterol is bound at CHEBI:9011, but that treatment's own target_mechanisms record an anti-inflammatory rather than a bronchodilator use, so routing it here would assert the wrong action."
pathophysiology:
- name: "Beta2 Adrenergic Receptor Agonist Occupancy"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A beta2 agonist binds and activates the beta2 adrenergic receptor on airway smooth muscle. The
    receptor is widely distributed in the respiratory tract and particularly in that muscle, which
    is what makes an inhaled agonist a targeted bronchodilator rather than a systemic one. The
    agonists are not a uniform group: the cited review distinguishes those that activate the
    receptor directly from those taken up into a membrane depot and those binding a
    receptor-specific auxiliary site, and those differences set the onset and duration that separate
    short- from long-acting use.
  molecular_functions:

    quote_role: REVIEW_SYNTHESIS
    snippet: "beta2-receptors being widely distributed in the respiratory tract, particularly in airway smooth muscle"
    explanation: "Places the receptor this node binds in the tissue the module is scoped to, which is why an inhaled agonist acts where it does."

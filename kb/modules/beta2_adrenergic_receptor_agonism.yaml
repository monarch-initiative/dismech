- name: "Gs-Coupled Adenylate Cyclase Activation and cAMP Generation"
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Signalling from the occupied receptor runs through a trimeric Gs protein coupled to adenylate
    cyclase, raising cAMP. The step is bound rather than inferred because the cited review states
    it. The same review notes cAMP-independent routes, through membrane maxi-K+ channels and through
    Gi to the MAP kinase system, which this module does not assert: they are named in the source
    without being tied to the relaxation this chain describes.

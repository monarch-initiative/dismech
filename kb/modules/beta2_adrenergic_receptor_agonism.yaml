  downstream:
  - target: "Bronchodilation and Relief of Airflow Obstruction"
- name: "Bronchodilation and Relief of Airflow Obstruction"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Relaxed airway smooth muscle widens the airway, which relieves airflow obstruction and the
    symptoms that follow from it. Added to an inhaled corticosteroid, a long-acting agonist also
    lowers the rate of severe exacerbations, which is a different and longer-run benefit from the
    immediate bronchodilation and is measured in the trial cited here.
  evidence:
  - reference: PMID:9817738
    reference_title: "The beta-adrenoceptor."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "These differences in mechanism of action are reflected in the kinetics of airway smooth muscle relaxation and bronchodilation in patients with asthma."
    explanation: "Ties the relaxation above to bronchodilation in patients. INDIRECT because the sentence is about how the agents differ in kinetics, and the bronchodilation is the shared outcome it assumes rather than reports."
  - reference: PMID:26949137
    reference_title: "Serious Asthma Events with Fluticasone plus Salmeterol versus Fluticasone Alone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "The risk of a severe asthma exacerbation was 21% lower in the fluticasone-salmeterol group than in the fluticasone-only group"
    explanation: "The exacerbation benefit of adding a long-acting agonist to an inhaled corticosteroid, measured in an 11,679-patient randomised trial."
- name: "Receptor Desensitisation and Downregulation on Continued Agonist Exposure"
  role: adverse_effect
  biological_scale: MOLECULAR
  description: >-
    Continued agonist exposure desensitises the receptor. The mechanism is stated rather than
    unknown: phosphorylation by beta-adrenoceptor kinase uncouples the receptor from Gs after
    beta-arrestin binds, with internalisation, recycling and downregulation of receptor gene
    expression behind the longer-run loss. The extent differs by cell and tissue type, which is the
    source's own explanation for why clinical tolerance to chronic therapy varies. The Gly16
    receptor variant downregulates more and is associated with worse asthma, which is recorded here
    as a property of the receptor rather than as a separate node.
  molecular_functions:
  - preferred_term: "beta2 receptor uncoupling from Gs"
    term:
      id: GO:0004941
      label: "beta2-adrenergic receptor activity"
    modifier: DECREASED
  evidence:
  - reference: PMID:9817738
    reference_title: "The beta-adrenoceptor."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "beta-Adrenoceptor desensitization associated with beta2-agonist activation is a consequence of phosphorylation by beta-ARK and uncoupling of the receptor from Gs following beta-arrestin binding"
    explanation: "The stated mechanism for this node. Worth contrasting with h2_receptor_antagonism, where tolerance is a knowledge gap because its source says the mechanism is unclear; here the source supplies it."
  - reference: PMID:9817738
    reference_title: "The beta-adrenoceptor."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Gly 16 receptor downregulates to a greater extent and is associated with increased airway hyperreactivity, nocturnal symptoms, and more severe asthma."
    explanation: "A receptor variant that modifies the degree of downregulation this node describes, and the one polymorphism the source ties to a clinical picture."
- name: "Serious Asthma Event Risk Governing Use Without an Inhaled Corticosteroid"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    The safety question that shapes how this class is given. Earlier trials raised a potential risk
    of serious asthma-related events with long-acting agonists, and the cited review records that
    they are therefore not recommended as monotherapy or without optimising the inhaled
    corticosteroid dose. A later 11,679-patient randomised trial found no significantly higher risk
    of serious asthma-related events for the fixed-dose combination with an inhaled corticosteroid
    than for the corticosteroid alone. The node is scoped to that pair of claims: it says what the
    trial measured and what the recommendation is, and nothing about the regulatory history, which
    no source cited here covers. The node has no upstream edge, and that is the claim: the sources
    report a risk *associated with* the class, and the one trial here that tested the combination
    found no significant excess, so nothing cited establishes that receptor occupancy causes these
    events. An edge from occupancy would assert a mechanism the evidence does not supply -- the same
    decision taken for the anticholinergic node in h1_receptor_antagonism.
  evidence:
  - reference: PMID:26949137
    reference_title: "Serious Asthma Events with Fluticasone plus Salmeterol versus Fluticasone Alone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: "In two large clinical trials, investigators found a potential risk of serious asthma-related events associated with LABAs."
    explanation: "The signal that motivated the trial, quoted from its background section. Graded HUMAN_CLINICAL because the evidence it describes is human trial data, with quote_role BACKGROUND because this paper is reporting earlier trials rather than its own result."
  - reference: PMID:21659855
    reference_title: "Controversies regarding long-acting β2-agonists."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "long-acting β2-agonists are not recommended for use as monotherapy or without optimization of inhaled corticosteroid dose"
    explanation: "The recommendation that follows, in the review's own words. This is why the long-acting treatment below is the corticosteroid-combination one rather than a monotherapy."
  - reference: PMID:26949137
    reference_title: "Serious Asthma Events with Fluticasone plus Salmeterol versus Fluticasone Alone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Patients who received salmeterol in a fixed-dose combination with fluticasone did not have a significantly higher risk of serious asthma-related events than did those who received fluticasone alone."
    explanation: "The trial's own finding on the combination, which is the claim this node makes about current use. It bears on the combination and not on monotherapy, which the trial did not test."

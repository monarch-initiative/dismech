    term:
      id: GO:0004941
      label: "beta2-adrenergic receptor activity"
    modifier: INCREASED
  cell_types:
  - preferred_term: "bronchial smooth muscle cell"
    term:
      id: CL:0002598
      label: "bronchial smooth muscle cell"
  locations:
  - preferred_term: "bronchus"

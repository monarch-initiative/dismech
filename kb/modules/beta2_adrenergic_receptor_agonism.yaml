discussions:
- discussion_id: beta2_agonist_response_variability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do some patients, including steroid-naive patients, not obtain the benefit most asthmatic
    patients get from adding a long-acting beta2 agonist?
  attaches_to:
  - "pathophysiology#Receptor Desensitisation and Downregulation on Continued Agonist Exposure"
  rationale: >-
    The cited review reports that a small proportion of patients may not benefit from a long-acting
    agonist and states outright that studies have not clearly demonstrated genotypic or phenotypic
    differences explaining the variability in response. It is a genuine biological unknown rather
    than an uncurated fact: the measurements exist, the variability is agreed, and no explanation
    has been established. It matters to this module because the same review's recommendation that
    the class not be used as monotherapy rests partly on that unexplained variability, and because
    the receptor polymorphisms the other cited review describes are the obvious candidate
    explanation and have not settled it. The Arg16Gly variant is recorded on the desensitisation
    node as a property of the receptor; what is not asserted anywhere is that it accounts for who
    responds.
  proposed_experiments:
  - experiment_id: adrb2_genotype_stratified_laba_response_cohort
    name: "Genotype-stratified prospective cohort of long-acting agonist response"
    description: >-
      Genotype a cohort at ADRB2 Arg16Gly, Glu27Gln and Thr164Ile before starting a long-acting
      agonist with an inhaled corticosteroid, and measure bronchodilator response, exacerbation rate
      and receptor downregulation on airway cells over a year, powered to detect a
      genotype-by-treatment interaction rather than a main effect. A genotype that explains response
      has to predict who fails prospectively, which is what the retrospective association studies
      the review describes could not establish; including steroid-naive patients as a stratum tests
      the other candidate the review names.

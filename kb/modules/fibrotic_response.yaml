name: Conserved Fibrotic Response Module
description: >-
  A conserved pathological module representing the dysregulation of normal
  wound healing (GO:0042060) that underlies organ fibrosis across tissues.
  Tissue injury triggers inflammation and resident mesenchymal cell activation,
  leading to myofibroblast transdifferentiation, excessive extracellular matrix
  deposition, and progressive architectural distortion with organ dysfunction.
  This module captures the shared core of fibrotic disease across liver, lung,
  heart, kidney, skin, and other organs. Individual disorder entries declare
  conformance via conforms_to on their pathophysiology nodes, substituting
  organ-specific cell types and anatomical locations while preserving the
  conserved causal chain and signaling axes.
category: Module
creation_date: "2026-03-18T00:00:00Z"
updated_date: "2026-03-18T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g., "fibrotic_response#Mesenchymal Cell
  Activation"). The module defines the expected pathophysiology structure;
  conforming nodes in disorder files should include the corresponding cell types,
  biological processes, and causal edges, specialized to their organ context.
  Key organ-specific substitutions: liver uses hepatic stellate cells
  (CL:0000632), lung uses pulmonary fibroblasts, heart uses cardiac fibroblasts,
  kidney uses mesangial cells (CL:0000650) or pericytes.
pathophysiology:
- name: Tissue Injury
  biological_scale: TISSUE
  description: >-
    Chronic or repeated injury to organ-specific parenchymal cells initiates
    the fibrotic cascade. The nature of injury varies by organ (viral hepatitis
    in liver, inhaled particles in lung, ischemia in heart, immune complex
    deposition in kidney) but the downstream response converges on a common
    inflammatory and reparative program.
  role: trigger
  biological_processes:
  - preferred_term: Wound Healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23255577
    reference_title: "Cellular mechanisms of tissue fibrosis. 1. Common and organ-specific mechanisms associated with tissue fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fibrosis is a pathological scarring process that leads to destruction of
      organ architecture and impairment of organ function. Chronic loss of organ
      function in most organs, including bone marrow, heart, intestine, kidney,
      liver, lung, and skin, is associated with fibrosis, contributing to an
      estimated one third of natural deaths worldwide.
    explanation: >-
      Establishes that fibrosis is a conserved response to chronic tissue injury
      across all major organs. Evidence source is OTHER because this is a review
      synthesizing data from multiple study types.
  downstream:
  - target: Inflammatory Recruitment and Amplification

- name: Inflammatory Recruitment and Amplification
  biological_scale: TISSUE
  description: >-
    Damage-associated molecular patterns (DAMPs) from injured parenchymal cells
    recruit and activate macrophages, which produce pro-fibrotic cytokines
    including TGF-beta, PDGF, and IL-13. This inflammatory phase bridges
    tissue injury to mesenchymal cell activation and is a key amplification
    step in the fibrotic cascade.
  role: amplifier
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Leukocyte Migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  evidence:
  - reference: PMID:21727191
    reference_title: "Integrating mechanisms of pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Platelet aggregation and subsequent degranulation in turn promotes blood
      vessel dilation and increased permeability, allowing efficient recruitment
      of inflammatory cells (e.g., neutrophils, macrophages, lymphocytes, and
      eosinophils) to the site of injury. Neutrophils are the most abundant
      inflammatory cell at the earliest stages of wound healing, but are quickly
      replaced by macrophages after neutrophil degranulation. During this initial
      leukocyte migration phase, activated macrophages and neutrophils debride
      the wound and eliminate any invading organisms. They also produce a variety
      of cytokines and chemokines that amplify the inflammatory response and
      trigger fibroblast proliferation and recruitment.
    explanation: >-
      Directly describes macrophage recruitment and cytokine/chemokine
      amplification as the inflammatory phase that bridges tissue injury to
      fibroblast activation. Evidence source is OTHER because this is a review
      synthesizing human clinical and model organism data.
  downstream:
  - target: Mesenchymal Cell Activation

- name: Mesenchymal Cell Activation
  biological_scale: CELLULAR
  description: >-
    Resident mesenchymal cells (fibroblasts, hepatic stellate cells, pericytes,
    or mesangial cells depending on organ) are activated by TGF-beta and other
    pro-fibrotic signals to transdifferentiate into alpha-SMA-positive
    myofibroblasts. This is the central effector step of fibrosis, conserved
    across all organs. The specific precursor cell type varies by tissue but the
    TGF-beta/Smad signaling axis driving activation is shared.
  role: central_effector
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: Myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: TGF-beta Receptor Signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:32673537
    reference_title: "Myofibroblasts and Fibrosis: Mitochondrial and Metabolic Control of Cellular Differentiation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac fibrosis is mediated by the activation of resident cardiac
      fibroblasts, which differentiate into myofibroblasts in response to
      injury or stress. Although myofibroblast formation is a physiological
      response to acute injury, such as myocardial infarction, myofibroblast
      persistence, as occurs in heart failure, contributes to maladaptive
      remodeling and progressive functional decline.
    explanation: >-
      Demonstrates the conserved fibroblast-to-myofibroblast transition
      as the central effector mechanism, with the distinction between
      physiological (acute) and pathological (persistent) activation.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:33774068
    reference_title: "Therapeutic targets in lung tissue remodelling and fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One central pathway in remodelling processes involves transforming growth
      factor (TGF)-β induced fibroblast activation and myofibroblast
      differentiation that increases ECM production.
    explanation: >-
      Confirms TGF-beta-induced fibroblast activation and myofibroblast
      differentiation as the central conserved pathway in tissue remodeling
      and fibrosis. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Excessive ECM Deposition

- name: Excessive ECM Deposition
  biological_scale: TISSUE
  description: >-
    Activated myofibroblasts produce excessive collagen (types I and III) and
    other extracellular matrix proteins while also secreting tissue inhibitors
    of metalloproteinases (TIMPs) that block matrix degradation. The imbalance
    between ECM production and degradation leads to progressive matrix
    accumulation. This process is conserved across organs though the specific
    collagen subtypes and matrix composition may vary.
  role: effector
  cell_types:
  - preferred_term: Myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: ECM Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  - preferred_term: Collagen Biosynthesis
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: INCREASED
  - preferred_term: Collagen Fibril Organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  evidence:
  - reference: PMID:33774068
    reference_title: "Therapeutic targets in lung tissue remodelling and fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Abnormal deposition of extracellular matrix (ECM) proteins is a key
      factor in the development of tissue remodelling that results in symptoms
      and impaired lung function in these diseases.
    explanation: >-
      Establishes abnormal ECM deposition as the key factor in fibrotic
      tissue remodeling. Evidence source is OTHER because this is a review
      article synthesizing data across multiple pulmonary diseases.
  - reference: PMID:21727191
    reference_title: "Integrating mechanisms of pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once fibroblasts become activated, they transform into α-smooth muscle
      actin–expressing myofibroblasts that secrete ECM components.
    explanation: >-
      Directly describes activated myofibroblasts as the source of ECM
      production in fibrosis. Evidence source is OTHER because this is a
      review synthesizing human and model organism data.
  downstream:
  - target: Architectural Distortion and Organ Dysfunction

- name: Architectural Distortion and Organ Dysfunction
  biological_scale: TISSUE
  description: >-
    Progressive matrix accumulation distorts normal tissue architecture, leading
    to organ-specific structural changes: nodular regeneration and portal
    hypertension in liver, honeycombing in lung, interstitial expansion and
    stiffening in heart, glomerulosclerosis in kidney. The end result is
    irreversible loss of organ function. While the specific architectural
    consequences are organ-dependent, the underlying process of progressive
    structural distortion from excessive matrix is conserved.
  role: consequence
  evidence:
  - reference: PMID:23255577
    reference_title: "Cellular mechanisms of tissue fibrosis. 1. Common and organ-specific mechanisms associated with tissue fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fibrosis is a pathological scarring process that leads to destruction of
      organ architecture and impairment of organ function.
    explanation: >-
      Directly states that fibrosis leads to destruction of organ architecture
      and impairment of function, the defining consequence of the fibrotic
      response module. Evidence source is OTHER because this is a review.
  - reference: PMID:21727191
    reference_title: "Integrating mechanisms of pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fibrosis develops when the wound is severe, the tissue-damaging irritant
      persists, or when the repair process becomes dysregulated.
    explanation: >-
      Establishes that architectural distortion and organ dysfunction result
      from persistent or dysregulated wound repair rather than the normal
      healing process.
experimental_models:
- name: Scar-in-a-Jar macromolecular-crowding fibroblast fibrosis assay
  description: >-
    A macromolecular-crowding culture system in which an inert crowder added to
    the medium excludes volume and thereby accelerates procollagen processing
    and extracellular deposition, producing a quantifiable collagen matrix in
    days rather than weeks. TGF-beta 1 is supplied to drive the fibroblast to
    myofibroblast transition, and the deposited matrix is read directly in the
    well by immunofluorescence or, in the prolonged variant, by neoepitope
    ELISAs on the supernatant. The collagen-producing cell type is a parameter
    of the assay rather than a fixed feature of it, which is what makes this a
    module-level rather than an organ-level model. The same platform has been
    run with embryonic and adult lung fibroblasts, embryonic and adult dermal
    fibroblasts, corneal keratocytes and vocal fold fibroblasts, so the two
    nodes it is linked to here are exercised without committing to an organ.
  experimental_model_type: PRIMARY_CELL_CULTURE
  namo_type: namo:TwoDCellCulture
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: Myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  conditions:
  - TGF-beta 1 stimulation
  - macromolecular crowding
  - anti-fibrotic compound screening
  cell_source: >-
    Primary human fibroblasts, with the organ of origin chosen per experiment -
    adult dermal fibroblasts in the crowder-comparison study and primary lung
    fibroblasts from healthy donors in the prolonged variant. Earlier work used
    the WI-38 embryonic lung fibroblast line.
  culture_system: >-
    Two-dimensional fibroblast monoculture in medium containing a macromolecular
    crowder and ascorbate, with recombinant TGF-beta 1 as the pro-fibrotic
    stimulus. Read out by in-well immunofluorescence of deposited collagen and
    alpha-smooth muscle actin, or over 12 days by extracellular matrix
    neoepitope ELISAs on the culture supernatant.
  publication: PMID:34028741
  notes: >-
    tissue_term is deliberately omitted. The assay has no tissue of its own: the
    fibroblast source is a parameter, and binding any one organ would assert a
    specificity the platform does not have. This is the property that licenses a
    module-level model here rather than the organ-specific lung chip and liver
    microtissue plate that prompted the gap (issue #9997).
  modeled_mechanisms:
  - target: Mesenchymal Cell Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recombinant TGF-beta 1 drives resident fibroblasts through the defining
      transition of this node - conversion to an alpha-smooth-muscle-actin
      positive myofibroblast - and the conversion is measured directly by
      alpha-SMA staining or ELISA rather than inferred from downstream matrix.
    limitations: >-
      Fibroblast monoculture. TGF-beta 1 is supplied exogenously in place of the
      endogenous injury-driven latent-TGF-beta activation route, so the upstream
      epithelial injury and inflammatory amplification steps of this module are
      bypassed rather than modeled. Alpha-SMA induction is slower than matrix
      output in the prolonged variant, where it does not separate from control
      until day 8, so a short assay can register matrix deposition while the
      activation marker is still flat.
    readouts:
    - name: alpha-smooth muscle actin expression
      target: Mesenchymal Cell Activation
      direction: INCREASED
      interpretation: >-
        Alpha-SMA is the canonical marker of fibroblast to myofibroblast
        conversion and is the direct transcriptional readout of this node.
      evidence:
      - reference: PMID:32381012
        reference_title: "Prolonged Scar-in-a-Jar: an in vitro screening tool for anti-fibrotic therapies using biomarkers of extracellular matrix synthesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We found that stimulating primary lung fibroblasts with TGF-β1 increased the ECM synthesis and α-SMA expression over time"
        explanation: >-
          States directly that alpha-SMA expression increased under TGF-beta 1
          in primary human lung fibroblasts, which is the direction this readout
          records.
      - reference: PMID:32381012
        reference_title: "Prolonged Scar-in-a-Jar: an in vitro screening tool for anti-fibrotic therapies using biomarkers of extracellular matrix synthesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "TGF-β1 induced synthesis of PRO-C1, PRO-C6 and FBN-C as compared with unstimulated fibroblasts at all timepoints, while PRO-C3 and α-SMA levels were not elevated until day 8."
        explanation: >-
          Qualifies the timing of that rise - alpha-SMA does not separate from
          unstimulated control until day 8, the caveat recorded in this link's
          limitations.
    - name: Myofibroblast formation by alpha-SMA immunofluorescence
      target: Mesenchymal Cell Activation
      direction: INCREASED
      interpretation: >-
        In-well imaging of alpha-SMA-positive cells shows the same activation
        endpoint in dermal fibroblasts, establishing that the node is exercised
        outside the lung.
      evidence:
      - reference: PMID:33521022
        reference_title: "Macromolecular Crowding as a Tool to Screen Anti-fibrotic Drugs: The Scar-in-a-Jar System Revisited."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "a significant increase is seen in mRNA levels of genes encoding COL1A1, COL5A1, and FN1EDA (extracellular matrix proteins), SERPINH1 and PLOD2 (collagen-processing proteins), ACTA2 (a marker for myofibroblasts) and XBP1"
        explanation: >-
          Reports a significant rise in ACTA2, the myofibroblast marker gene, in
          primary adult human dermal fibroblasts under TGF-beta 1, which is the
          direction this readout records.
    evidence:
    - reference: PMID:34028741
      reference_title: "The Scar-in-a-Jar: In Vitro Fibrosis Model for Anti-Fibrotic Drug Testing."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The system can be aided by activating compounds such as transforming growth factor-β1, a classical inducer of the myofibroblast phenotype in fibroblasts."
      explanation: >-
        The protocol's own statement that the assay induces the myofibroblast
        phenotype, which is the transition this node names.
  - target: Excessive ECM Deposition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The point of the crowding step is to make deposited matrix the net
      read-out. Activated fibroblasts lay down a collagen matrix that is
      quantified in the well, and in the prolonged variant type I, III and VI
      collagen formation and fibronectin deposition are measured separately.
    limitations: >-
      The deposited matrix is a two-dimensional in-well layer, not
      three-dimensional tissue architecture, so matrix stiffening, cross-linked
      fibril remodeling and the mechanical feedback onto the fibroblast are not
      represented. Deposition is accelerated by an artificial crowder rather
      than occurring at tissue rates, and the degradation arm of the module -
      TIMP-mediated blockade of matrix turnover - is not measured, so the assay
      reports production rather than the production-degradation imbalance the
      node describes.
    readouts:
    - name: Type I and type VI collagen formation (PRO-C1, PRO-C6)
      target: Excessive ECM Deposition
      direction: INCREASED
      biological_processes:
      - preferred_term: Collagen Biosynthesis
        description: >-
          Neoepitope ELISAs measure the propeptides released during collagen
          formation, so they report synthesis rather than accumulated matrix.
        term:
          id: GO:0032964
          label: collagen biosynthetic process
      interpretation: >-
        Elevated collagen formation biomarkers are the direct measurement of the
        excessive matrix production this node names.
      evidence:
      - reference: PMID:32381012
        reference_title: "Prolonged Scar-in-a-Jar: an in vitro screening tool for anti-fibrotic therapies using biomarkers of extracellular matrix synthesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Biomarkers of ECM synthesis were evaluated over time in cell supernatants using ELISAs to assess type I, III, IV, V and VI collagen formation (PRO-C1, PRO-C3, PRO-C4, PRO-C5, PRO-C6), fibronectin (FBN-C) deposition and α-smooth muscle actin (α-SMA) expression."
        explanation: >-
          Identifies the collagen formation markers measured in this assay and
          the compartment they are measured in.
    - name: Fibronectin deposition (FBN-C)
      target: Excessive ECM Deposition
      direction: INCREASED
      biological_processes:
      - preferred_term: ECM Organization
        description: >-
          Fibronectin deposition is the non-collagenous arm of the matrix output
          measured in this system.
        term:
          id: GO:0030198
          label: extracellular matrix organization
      interpretation: >-
        Fibronectin rises alongside collagen under TGF-beta 1, showing the node
        is exercised beyond a single matrix protein.
      evidence:
      - reference: PMID:32381012
        reference_title: "Prolonged Scar-in-a-Jar: an in vitro screening tool for anti-fibrotic therapies using biomarkers of extracellular matrix synthesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "TGF-β1 induced synthesis of PRO-C1, PRO-C6 and FBN-C as compared with unstimulated fibroblasts at all timepoints"
        explanation: >-
          Reports fibronectin deposition rising under TGF-beta 1 relative to
          unstimulated fibroblasts at every timepoint measured.
    evidence:
    - reference: PMID:34028741
      reference_title: "The Scar-in-a-Jar: In Vitro Fibrosis Model for Anti-Fibrotic Drug Testing."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "an in vitro fibrosis model for anti-fibrotic drug testing that benefits from a substantially accelerated extracellular matrix deposition employing macromolecular crowding"
      explanation: >-
        Establishes that accelerated extracellular matrix deposition is what the
        assay is built to produce and measure, which is this node.
  findings:
  - statement: >-
      The collagen-producing cell in this assay is a parameter rather than a
      fixed organ-specific feature, and the platform has been run across lung,
      dermal, corneal and vocal fold fibroblasts, which is what licenses it as a
      model of the module rather than of one organ's fibrosis.
    evidence:
    - reference: PMID:34028741
      reference_title: "The Scar-in-a-Jar: In Vitro Fibrosis Model for Anti-Fibrotic Drug Testing."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "employing macromolecular crowding and a collagen-producing cell type of choice (e.g., lung fibroblasts like WI-38)"
      explanation: >-
        The protocol states the cell type is chosen per experiment, so the
        system is not defined by any one organ.
    - reference: PMID:33521022
      reference_title: "Macromolecular Crowding as a Tool to Screen Anti-fibrotic Drugs: The Scar-in-a-Jar System Revisited."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Human fibroblasts used are WI-38 cells (embryonic lung fibroblasts) (3, 4, 6, 31, 38), WS-1 cells (embryonic dermal fibroblasts) (38, 39), adult dermal fibroblasts (37, 40), adult corneal fibroblasts (keratocytes) (34–36) and immortalized adult vocal fold fibroblasts (32)."
      explanation: >-
        Enumerates the fibroblast sources the published literature has run this
        system with, spanning four different organs. The authors give this list
        while arguing that the earlier studies were inadequately validated, so
        it establishes the breadth of cell types the platform accepts rather
        than endorsing each of those studies.
  - statement: >-
      Macromolecular crowding is what compresses fibrotic matrix deposition into
      a timescale short enough to screen against, which is the practical reason
      this system rather than a conventional fibroblast culture is the module's
      exemplar.
    evidence:
    - reference: PMID:33521022
      reference_title: "Macromolecular Crowding as a Tool to Screen Anti-fibrotic Drugs: The Scar-in-a-Jar System Revisited."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "With macromolecular crowding a rapid deposition of collagen is seen, resulting in a substantial decrease in culture time"
      explanation: >-
        States the effect of the crowding step on the rate of collagen
        deposition.
  evidence:
  - reference: PMID:32381012
    reference_title: "Prolonged Scar-in-a-Jar: an in vitro screening tool for anti-fibrotic therapies using biomarkers of extracellular matrix synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Primary human lung fibroblasts from healthy donors were cultured for 12 days in the presence of ficoll and were stimulated with TGF-β1"
    explanation: >-
      Documents the primary human lung fibroblast implementation of the assay,
      the counterpart to the dermal implementation, together demonstrating the
      platform is not organ-bound.

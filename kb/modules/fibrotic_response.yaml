  - reference: PMID:28691737
    reference_title: "Evaluating the antifibrotic potency of galunisertib in a human ex vivo model of liver fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphorylation of SMAD2 was inhibited, while that of SMAD1 remained unchanged."
    explanation: >-
      Human liver ex vivo confirmation of galunisertib's mechanism of action:

name: Resisting Cell Death Module
description: >-
  A conserved mechanism module for the third hallmark of cancer (Hanahan &
  Weinberg): resistance to programmed cell death. Apoptosis is a natural
  barrier to cancer that is engaged by the physiologic stresses of
  tumorigenesis, including oncogene-driven hyperproliferation and DNA
  damage. The mitochondrial (intrinsic) apoptotic program is governed by the
  BCL-2 family, in which pro-apoptotic effectors (BAX, BAK) and BH3-only
  sensitizers (BIM, BID, PUMA, NOXA, BAD) are opposed by pro-survival
  guardians (BCL-2, BCL-XL, MCL-1). The conserved causal chain runs from an
  apoptosis-evasion lesion (overexpression of pro-survival BCL-2 proteins,
  loss of pro-apoptotic effectors or of the p53-PUMA/NOXA axis) through a
  shifted BCL-2-family rheostat that blocks mitochondrial outer-membrane
  permeabilization and cytochrome c release, to impaired apoptotic execution
  and the survival of cells that should have died. Individual disorder
  entries declare conformance via conforms_to, substituting the
  tumor-type-specific apoptosis-evasion lesion (e.g., t(14;18) BCL2
  overexpression in follicular lymphoma, MCL1 amplification, TP53 loss). The
  shifted rheostat is also the rationale for BH3-mimetic therapy (e.g.,
  venetoclax), and the chain now carries that as its own node rather than as a
  remark: a cell storing its death effectors in complex with a guardian is
  primed to die when they are displaced, which is why the drug kills rather
  than arrests. The node records the two conditions that make it usable -
  selectivity, since the non-selective predecessor's BCL-XL inhibition caused
  dose-limiting thrombocytopenia, and dependence on a named guardian, so
  BCL-2-dependent and MCL-1-dependent tumours are not interchangeable. The
  resistance node is this module's central node restored, either by
  remodelling the drug's binding site or by moving the dependence to a
  guardian the drug does not bind.
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "resisting_cell_death#BCL-2 Family Rheostat Shift Toward Survival"). The
  module defines the expected pathophysiology structure; conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their tumor context. Key tumor-specific
  substitutions: follicular lymphoma uses t(14;18)-driven BCL2
  overexpression; CLL/AML use BCL-2 or MCL-1 dependence (BH3-mimetic
  targets); many cancers evade apoptosis through TP53 loss disabling the
  PUMA/NOXA arm. Key conformance / treatment target:
  "resisting_cell_death#BCL-2 Family Rheostat Shift Toward Survival". A
  conforming entry's BH3-mimetic should reach
  "resisting_cell_death#BCL-2 Dependence as a BH3-Mimetic Target" via
  target_mechanisms and name which guardian the tumour depends on, since that
  selects the agent; its relapse route belongs on "Guardian Substitution and
  BH3-Mimetic Resistance", where the dependence has to be re-established
  rather than assumed from diagnosis.
pathophysiology:
- name: Apoptosis-Evasion Lesion
  description: >-
    A lesion that biases the cell against apoptosis. Routes include
    overexpression of pro-survival BCL-2 family members (BCL-2, BCL-XL,
    MCL-1) via translocation or amplification, loss-of-function of the
    pro-apoptotic effectors BAX/BAK, silencing of BH3-only sensitizers, or
    loss of upstream p53 that transactivates PUMA and NOXA. Each lesion
    raises the apoptotic threshold so that pro-death signals from
    oncogenic stress fail to trigger cell death.
  role: trigger
  biological_processes:
  - preferred_term: Negative Regulation of Apoptotic Process
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:18097445
    reference_title: "The BCL-2 protein family: opposing activities that mediate cell death."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BCL-2 family proteins, which have either pro- or anti-apoptotic
      activities, have been studied intensively for the past decade owing to
      their importance in the regulation of apoptosis, tumorigenesis and
      cellular responses to anti-cancer therapy.
    explanation: >-
      Establishes the BCL-2 family as the regulatory hub of apoptosis whose
      dysregulation drives tumorigenesis, supporting the apoptosis-evasion
      lesion as the trigger of this module. Evidence source is OTHER because
      this is a review article.
  downstream:
  - target: BCL-2 Family Rheostat Shift Toward Survival

- name: BCL-2 Family Rheostat Shift Toward Survival
  description: >-
    The balance of the BCL-2 family is shifted so that pro-survival members
    sequester pro-apoptotic effectors and BH3-only proteins, preventing
    BAX/BAK oligomerization in the mitochondrial outer membrane. With
    mitochondrial outer-membrane permeabilization blocked, cytochrome c is
    not released and the apoptosome cannot form. This shifted rheostat is
    the conserved central node and the molecular target of BH3-mimetic
    drugs.
  role: central_effector
  biological_processes:
  - preferred_term: Intrinsic Apoptotic Signaling Pathway
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    modifier: DECREASED
  - preferred_term: Release of Cytochrome c from Mitochondria
    term:
      id: GO:0001836
      label: release of cytochrome c from mitochondria
    modifier: DECREASED
  evidence:
  - reference: PMID:18097445
    reference_title: "The BCL-2 protein family: opposing activities that mediate cell death."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They control the point of no return for clonogenic cell survival and
      thereby affect tumorigenesis
    explanation: >-
      Describes BCL-2 family control over the commitment point for cell
      survival, the conserved central effector of apoptosis evasion modeled
      here. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Impaired Apoptotic Execution and Cell Survival
  - target: BCL-2 Dependence as a BH3-Mimetic Target
    description: >-
      A cell that survives by sequestering its own death effectors is primed to
      die the moment the sequestration is released, so the shifted rheostat is
      a dependence as well as a defence.

- name: Impaired Apoptotic Execution and Cell Survival
  description: >-
    With the intrinsic pathway blocked upstream, effector caspase activation
    fails and apoptotic execution is impaired. Cells carrying oncogenic and
    genotoxic stress that should have been culled instead survive and
    persist, providing a substrate for further malignant evolution and
    contributing to resistance to chemotherapy and radiotherapy, which act
    in part by triggering apoptosis.
  role: consequence
  biological_processes:
  - preferred_term: Apoptotic Process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: DECREASED
  evidence:
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include sustaining proliferative signaling, evading growth
      suppressors, resisting cell death, enabling replicative immortality,
      inducing angiogenesis, and activating invasion and metastasis.
    explanation: >-
      Hanahan & Weinberg list resisting cell death as a core hallmark
      capability, the consequence modeled here. Evidence source is OTHER
      because this is a review article.

- name: BCL-2 Dependence as a BH3-Mimetic Target
  description: >-
    The module's central node is the clearest case in the hallmark set of a
    defence that is also a liability. A cell holding BAX, BAK and its BH3-only
    sensitizers in complex with a pro-survival guardian is not short of death
    signals; it is storing them. Displacing them with a BH3-mimetic therefore
    kills rather than arrests, and it kills fast - a single dose of the
    BCL-2-selective inhibitor produced tumour lysis within 24 hours in three
    patients with refractory chronic lymphocytic leukaemia.
    Two conditions make the node usable and both were absent from the module.
    Selectivity: the first-generation inhibitor also blocked BCL-XL and caused
    on-target thrombocytopenia, which capped the dose, and re-engineering to
    spare BCL-XL is what turned the mechanism into a drug. And member
    specificity: the dependence is on a named guardian, so a BCL-2-dependent
    tumour and an MCL-1-dependent one are not interchangeable even though the
    module's trigger node lists their lesions together. A conforming entry
    should name which guardian its tumour depends on, because that selects the
    agent.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Intrinsic Apoptotic Signaling Pathway
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
  evidence:
  - reference: PMID:23291630
    reference_title: "ABT-199, a potent and selective BCL-2 inhibitor, achieves antitumor activity while sparing platelets."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      This family comprises proapoptotic and prosurvival proteins, and shifting
      the balance toward the latter is an established mechanism whereby cancer
      cells evade apoptosis.
    explanation: >-
      The premise this node inverts, stated as established fact in the paper's
      framing rather than as its own result, hence BACKGROUND.
  - reference: PMID:23291630
    reference_title: "ABT-199, a potent and selective BCL-2 inhibitor, achieves antitumor activity while sparing platelets."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      This compound inhibits the growth of BCL-2-dependent tumors in vivo and
      spares human platelets.
    explanation: >-
      Cited for the in vivo tumour result, hence MODEL_ORGANISM, and for the
      selectivity condition this node turns on - sparing BCL-XL is what removed
      the dose-limiting thrombocytopenia of the non-selective predecessor.
  - reference: PMID:23291630
    reference_title: "ABT-199, a potent and selective BCL-2 inhibitor, achieves antitumor activity while sparing platelets."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A single dose of ABT-199 in three patients with refractory chronic
      lymphocytic leukemia resulted in tumor lysis within 24 h.
    explanation: >-
      The human observation behind this node's distinguishing claim: the death
      signal was already present and waiting, which is why the response is
      immediate rather than cumulative.
  downstream:
  - target: Guardian Substitution and BH3-Mimetic Resistance
    description: >-
      Resistance here restores the sequestration, either by remodelling the
      drug's binding site or by moving the dependence to a guardian the drug
      does not bind.

- name: Guardian Substitution and BH3-Mimetic Resistance
  description: >-
    Remission under a BH3-mimetic is usually not cure, and the escape routes
    are specific enough to be anticipated. The clearest is a point mutation in
    the drug's own target: BCL2 Gly101Val appears at progression in patients
    treated with venetoclax and in none at study entry, becomes detectable
    after 19 to 42 months of continuous therapy, and is detectable months
    before clinical relapse - so it is a usable biomarker of impending
    progression as well as a mechanism. It works by lowering the drug's
    affinity for BCL-2 enough that the sequestered effectors are no longer
    displaced, which is this module's central node restored rather than a new
    one. The second route moves the dependence instead of defending it: a
    tumour surviving on another guardian is no longer a target for a
    BCL-2-selective agent, which is why the member specificity recorded on the
    node above has to be re-established at relapse and not assumed from
    diagnosis.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Negative Regulation of Apoptotic Process
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:30514704
    reference_title: "Acquisition of the Recurrent Gly101Val Mutation in BCL2 Confers Resistance to Venetoclax in Patients with Progressive Chronic Lymphocytic Leukemia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The novel Gly101Val mutation in BCL2 was identified at progression in 7
      patients, but not at study entry.
    explanation: >-
      Establishes the lesion as acquired under treatment rather than
      pre-existing, which is what makes this an adaptive_escape node.
  - reference: PMID:30514704
    reference_title: "Acquisition of the Recurrent Gly101Val Mutation in BCL2 Confers Resistance to Venetoclax in Patients with Progressive Chronic Lymphocytic Leukemia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It was first detectable after 19 to 42 months of therapy, and its
      emergence anticipated clinical disease progression by many months.
    explanation: >-
      Supplies the timing, and the reason this node is worth recording as more
      than a failure mode: the lesion is detectable before the relapse it
      causes.
  - reference: PMID:30514704
    reference_title: "Acquisition of the Recurrent Gly101Val Mutation in BCL2 Confers Resistance to Venetoclax in Patients with Progressive Chronic Lymphocytic Leukemia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mutation reduces venetoclax binding and is sufficient to confer
      resistance.
    explanation: >-
      The mechanism, from surface plasmon resonance and cell lines rather than
      from the patient series, hence IN_VITRO - and the basis for reading this
      node as the central node restored rather than a separate lesion.

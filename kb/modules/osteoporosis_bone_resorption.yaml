name: Osteoporosis Bone Resorption Module
description: >-
  A conserved metabolic bone-disease module representing the imbalance between
  osteoclastic bone resorption and osteoblastic bone formation that produces low
  bone mass and skeletal fragility. Across postmenopausal (estrogen-deficient),
  senile, glucocorticoid-induced, and genetic/secondary osteoporoses, the
  initiating lesion converges on the basic multicellular unit: tightly coupled
  remodeling becomes uncoupled, RANKL-driven osteoclastogenesis is enhanced
  relative to Wnt-driven osteoblast formation, and net negative bone balance with
  microarchitectural deterioration follows. Individual disorder entries declare
  conformance via conforms_to on their pathophysiology nodes, substituting the
  disorder-specific upstream driver (estrogen withdrawal, glucocorticoid excess,
  Wnt-pathway or collagen gene defect) while preserving the conserved
  resorption/formation-imbalance chain.
category: Module
creation_date: "2026-06-06T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption").
  Conforming nodes should substitute the disorder-specific driver of the
  remodeling imbalance: estrogen deficiency in postmenopausal osteoporosis,
  Wnt/Dkk1 suppression in glucocorticoid-induced osteoporosis, and LRP5/WNT1 or
  COL1A1/COL1A2 variants in monogenic low-bone-mass disorders.

  The "Endosteal Vascular Niche Dysfunction" node is a deliberately separate,
  EMERGING upstream arm (hypothesis group endosteal_vascular_niche_model). It is
  not part of the settled RANKL/Wnt chain and should not be treated as such: a
  disorder node should declare conformance to it only when there is a specific
  endothelial or vascular-smooth-muscle lesion in bone, not merely because the
  disorder features low bone mass.
pathophysiology:
- name: Endosteal Vascular Niche Dysfunction
  description: >-
    The endosteal compartment, at the interface between bone and bone marrow, is
    the site where bone turnover is regulated, and it contains vascular
    endothelial cells (sinusoidal, arteriolar and type H) and vascular smooth
    muscle cells and pericytes alongside the osteoblast, chondrocyte and
    osteoclast lineages. Cross-species single-cell mapping of this compartment
    prioritized endothelial cells and vascular smooth muscle cells as
    skeletal-disease-relevant cell types whose gene programs are enriched for
    genes associated with estimated bone mineral density, and showed that they
    signal directly to osteoblast lineage cells. Under this emerging model, a
    lesion in the endosteal vasculature is an upstream driver of remodeling
    imbalance in its own right, parallel to the hormonal, pharmacological and
    osteoblast-intrinsic genetic drivers that dominate the rest of this module.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Bone vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: Bone vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: Pericyte
    term:
      id: CL:0000669
      label: pericyte
  locations:
  - preferred_term: endosteum
    term:
      id: UBERON:0009859
      label: endosteum
  - preferred_term: bone blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  biological_processes:
  - preferred_term: Skeletal angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: DECREASED
  - preferred_term: Bone blood vessel morphogenesis
    term:
      id: GO:0048514
      label: blood vessel morphogenesis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:42432248
    reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Endothelial cells and vascular smooth muscle cells were identified as new
      skeletal-disease-relevant cells alongside osteoblast, chondrocyte and
      osteoclast cell lineages.
    explanation: >-
      The headline claim that establishes this node: endothelial cells and
      vascular smooth muscle cells are skeletal-disease-relevant lineages in
      their own right, not only supporting tissue.
  - reference: PMID:42432248
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Osteoclasts, osteoblast lineage cells, chondrocytes, ECs and VSMCs
      originated almost exclusively (> 98%) from this compartment.
    explanation: >-
      Localizes the vascular cell types of this node to the endosteal
      compartment, which is why the node is scoped to the endosteum rather than
      to bone vasculature in general.
  - reference: PMID:42432248
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, 26.9% and 27.7% of highly expressed genes in ECs and VSMCs,
      respectively, were annotated in the GO database with a skeletal biological
      process or skeletal phenotypes in the MGI database
    explanation: >-
      Quantifies the skeletal annotation of the endothelial and smooth-muscle
      gene programs, the basis for treating these cells as skeletally active
      rather than incidental.
  - reference: PMID:42432248
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together, this demonstrates that gene programs of osteoblast lineage cells,
      chondrocytes, ECs and VSMCs are enriched for genes associated with eBMD.
    explanation: >-
      Ties the endothelial and smooth-muscle programs to human bone mineral
      density genetics (an extended UK Biobank GWAS), which is the human-genetic
      anchor for this otherwise mouse-derived node.
  downstream:
  - target: Bone Remodeling Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - endosteal_vascular_niche_model
    description: >-
      A vascular lesion in the endosteal niche is proposed to act upstream of the
      remodeling cycle, shifting the resorption/formation balance without an
      osteoblast- or osteoclast-intrinsic primary defect.
  - target: Impaired Osteoblastic Bone Formation
    causal_link_type: DIRECT
    hypothesis_groups:
    - endosteal_vascular_niche_model
    description: >-
      Endothelial and vascular smooth muscle cells signal directly to osteoblast
      lineage cells (NOTCH with endothelium, IGF1R with smooth muscle, TGF-beta
      in common), so loss of that input is the most direct route from a vascular
      lesion to a deficient formation arm.
    evidence:
    - reference: PMID:42432248
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To investigate further, we characterized the interactions between cells
        and showed that ECs and VSMCs can interact directly with osteoblast
        lineage cells. This provides a potential explanation for how genes
        expressed in ECs and VSMCs, such as Pls3, Nherf2 and Cbx6, regulate bone.
      explanation: >-
        States the direct vascular-to-osteoblast interaction that this edge
        asserts, and names it as the authors' own explanation for how
        vascular-restricted genes influence bone.
    - reference: PMID:42432248
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Osteoblasts interact with these cells via common (for example,
        transforming growth factor-β) and distinct pathways (for example, WNT
        with chondrocytes, NOTCH with ECs, insulin-like growth factor 1 receptor
        with VSMCs; Supplementary Fig. 2).
      explanation: >-
        Names the specific signaling pathways carrying the interaction, which is
        what makes this a DIRECT rather than an unspecified edge.
- name: Bone Remodeling Imbalance
  description: >-
    The bone remodeling cycle normally tightly couples osteoclastic resorption to
    osteoblastic formation within the basic multicellular unit, governed by the
    RANK/RANKL/osteoprotegerin and canonical Wnt signaling axes. The initiating
    lesion of osteoporosis is disruption of this coupling so that the resorption
    and formation arms are no longer balanced, regardless of whether the upstream
    driver is hormonal, pharmacological, or genetic.
  role: trigger
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: Bone Remodeling
    term:
      id: GO:0046849
      label: bone remodeling
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29368538
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During the bone remodelling cycle, osteoclastic resorption is tightly
      coupled to osteoblastic bone formation.
    explanation: >-
      Establishes the normal tight coupling of resorption to formation whose
      disruption is the conserved initiating lesion of this module. Evidence
      source is OTHER because this is a review article.
  - reference: PMID:29368538
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The key signalling pathways controlling osteoclastic bone resorption and
      osteoblastic bone formation are receptor activator of nuclear factor-κB
      (RANK)/RANK ligand/osteoprotegerin and canonical Wnt signalling.
    explanation: >-
      Identifies the conserved RANK/RANKL/OPG and Wnt signaling axes that govern
      the remodeling balance perturbed across osteoporoses. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: RANKL-Driven Osteoclastogenesis
- name: RANKL-Driven Osteoclastogenesis
  description: >-
    Loss of remodeling coupling shifts the RANKL/OPG ratio toward RANKL, the
    critical uncoupling factor that drives differentiation and survival of
    osteoclasts from myeloid precursors. Estrogen deficiency raises RANKL and
    lowers OPG; glucocorticoid excess likewise enhances RANKL and suppresses OPG,
    converging on enhanced osteoclastogenesis.
  role: amplifier
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: Osteoclast Differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:36982891
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nuclear factor-κβ ligand (RANKL) appears to be the critical uncoupling
      factor that enhances osteoclastogenesis. In contrast, osteoprotegerin (OPG)
      is a RANKL antagonist secreted by osteoblast lineage cells.
    explanation: >-
      Directly names RANKL as the critical uncoupling factor enhancing
      osteoclastogenesis and OPG as its antagonist, the conserved amplifier step.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:36982891
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Estrogen deficiency leads to the uncoupling of bone resorption and
      formation; therefore, resulting in greater bone loss.
    explanation: >-
      Shows that a major upstream driver (estrogen deficiency) acts through
      uncoupling resorption from formation, the mechanism this node captures.
      Evidence source is OTHER because this is a review article.
  downstream:
  - target: Increased Osteoclastic Bone Resorption
- name: Increased Osteoclastic Bone Resorption
  description: >-
    Expanded and activated osteoclasts digest mineralized bone matrix at a rate
    that exceeds osteoblastic replacement. This is the central effector step of
    the module: resorption that is normally balanced by an equal wave of
    formation now outpaces it, eroding trabecular and cortical bone.
  role: central_effector
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: Bone Resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  evidence:
  - reference: PMID:17308163
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bone remodeling involves the removal of mineralized bone by osteoclasts
      followed by the formation of bone matrix through the osteoblasts that
      subsequently become mineralized.
    explanation: >-
      Establishes osteoclast-mediated removal of mineralized bone as the
      resorptive arm of remodeling whose excess defines this central effector
      step. Evidence source is OTHER because this is a review article.
  - reference: PMID:17308163
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the processes of bone resorption and formation are tightly coupled allowing
      a wave of bone formation to follow each cycle of bone resorption, thus
      maintaining skeletal integrity.
    explanation: >-
      Describes how resorption is normally coupled to a following wave of
      formation; loss of this coupling yields the net resorption this node
      represents. Evidence source is OTHER because this is a review.
  downstream:
  - target: Impaired Osteoblastic Bone Formation
- name: Impaired Osteoblastic Bone Formation
  description: >-
    In parallel with excess resorption, osteoblastic bone formation and
    mineralization are inadequate to refill resorption cavities. Glucocorticoid
    excess upregulates Dickkopf-1 and inhibits Wnt signaling to reduce osteoblast
    differentiation, while estrogen deficiency removes a pro-osteogenic Wnt/BMP
    stimulus. The result is reduced ossification relative to the resorptive load.
  role: effector
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: Ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: DECREASED
  - preferred_term: Bone Mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED
  evidence:
  - reference: PMID:36982891
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Excessive glucocorticoids increase PPAR-2 production, upregulate the
      expression of Dickkopf-1 (DKK1) in osteoblasts, and inhibit the Wnt
      signaling pathway, thus decreasing osteoblast differentiation.
    explanation: >-
      Demonstrates suppression of Wnt-driven osteoblast differentiation as a
      conserved mechanism reducing the formation arm of remodeling. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Net Bone Loss and Skeletal Fragility
- name: Net Bone Loss and Skeletal Fragility
  description: >-
    Sustained imbalance between excess resorption and deficient formation produces
    net negative bone balance, loss of bone mineral density, and deterioration of
    trabecular and cortical microarchitecture. The accumulated structural deficit
    reduces bone strength and predisposes to low-trauma fractures, the defining
    clinical consequence of osteoporosis.
  role: consequence
  biological_processes:
  - preferred_term: Bone Remodeling
    term:
      id: GO:0046849
      label: bone remodeling
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29368538
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disruption of the bone remodelling cycle and any resulting imbalance
      between bone resorption and formation leads to metabolic bone disease, most
      commonly osteoporosis.
    explanation: >-
      Directly states that imbalance between resorption and formation leads to
      osteoporosis, the defining consequence of this module. Evidence source is
      OTHER because this is a review article.
  - reference: PMID:36982891
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Osteoporosis resulting from an imbalance of bone turnover between
      resorption and formation is a critical health issue worldwide.
    explanation: >-
      Confirms that osteoporosis is the clinical outcome of imbalanced bone
      turnover, the endpoint of this module's causal chain. Evidence source is
      OTHER because this is a review article.
mechanistic_hypotheses:
- hypothesis_group_id: endosteal_vascular_niche_model
  hypothesis_label: Endosteal Vascular Niche Contribution to Bone Turnover
  status: EMERGING
  description: >-
    An emerging model in which endothelial cells and vascular smooth muscle
    cells of the endosteal compartment are themselves regulators of bone mass,
    rather than passive supporting tissue, so that a primary vascular lesion can
    drive remodeling imbalance and low bone mass. The evidence base is a
    cross-species single-cell map of the murine endosteal compartment integrated
    with a human bone mineral density GWAS, functional validation in over 1,000
    single-gene-deletion mouse lines, and confirmation of the same cell
    populations and effector genes in adult human bone. It is curated as
    EMERGING rather than CANONICAL because the causal demonstrations are in
    mouse and zebrafish, and no human disorder has yet been shown to produce low
    bone mass through a demonstrated bone-vascular lesion. Edges belonging to
    this group carry hypothesis_groups endosteal_vascular_niche_model; a
    conforming disorder entry should copy the grouping only if its own vascular
    causal claim belongs to this model.
  evidence:
  - reference: PMID:42432248
    reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our approach generated a comprehensive map of cell types across the
      endosteal compartment and expands the repertoire of cells that regulate
      bone to include ECs and VSMCs.
    explanation: >-
      The authors' own statement of the hypothesis this group represents:
      the set of bone-regulating cell types is expanded to include the
      vasculature.
  - reference: PMID:42432248
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The absence of bone cells at this developmental stage indicates that pls3
      might act directly to control angiogenesis and vascular patterning. These
      data suggest that X-linked osteoporosis might result from abnormalities in
      bone vasculature.
    explanation: >-
      The strongest causal statement available for this model, and also the
      reason it is EMERGING rather than CANONICAL - the authors themselves write
      "might result from", not "results from".
  - reference: PMID:42432248
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human VSMCs and ECs were also enriched for eBMD-associated genes (Fig. 8d);
      82-100% of eBMD effector genes that we validated in mice were also found in
      their cellular counterparts in human bone
    explanation: >-
      Human bone single-cell data support the translational relevance of the
      model, but establish gene-expression correspondence only; they do not
      demonstrate that a vascular lesion causes low bone mass in humans, so this
      is recorded as PARTIAL.
discussions:
- discussion_id: endosteal_vascular_arm_causal_status
  prompt: >-
    Do endothelial and vascular smooth muscle lesions in the endosteal
    compartment cause low bone mass in humans, or do the vascular gene programs
    score as skeletally relevant because they share genes with the osteoblast
    lineage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Endosteal Vascular Niche Dysfunction
  rationale: >-
    The enrichment signal that motivates this arm is not uniform across
    analyses, and the discrepancies point the same way. In the rare-disorder
    gene enrichment, endothelial and vascular smooth muscle programs reached
    only nominal significance and the authors themselves attribute that to genes
    shared with osteoblasts. In the mouse abnormal-bone-structure enrichment,
    vascular smooth muscle cells were highly enriched but endothelial cells were
    not. So the two vascular cell types are not equally supported, and the
    endothelial arm in particular rests on the bone mineral density GWAS
    enrichment plus single-gene knockouts rather than on monogenic human disease
    genes. Curators should not upgrade this arm to CANONICAL, and should not let
    a conforming disorder entry assert a vascular cause of low bone mass on the
    strength of this module alone.
  evidence:
  - reference: PMID:42432248
    reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ECs and VSMCs showed nominal evidence of enrichment (P < 0.05) for
      proteoglycan core protein disorders and bent bone disease, possibly because
      of genes shared with osteoblasts
    explanation: >-
      States the confounder directly: the rare-skeletal-disorder enrichment for
      the vascular programs may reflect genes shared with osteoblasts rather than
      an independent vascular contribution.
  - reference: PMID:42432248
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Osteoblasts, chondrocytes, osteoclasts and VSMCs, but not ECs, were highly
      enriched (Extended Data Fig. 8a and Supplementary Table 8).
    explanation: >-
      Shows that the endothelial arm specifically failed the mouse
      abnormal-bone-structure enrichment test that the smooth-muscle arm passed,
      which is why the two are not equally supported.
  proposed_experiments:
  - experiment_id: exp_endosteal_lineage_restricted_effector_gene_deletion
    name: Endothelial- and VSMC-restricted conditional deletion of validated effector genes
    description: >-
      Delete Nherf2 (endothelial-restricted) and Cbx6 (vascular smooth
      muscle-restricted) using lineage-restricted Cre drivers rather than
      constitutive knockouts, and measure trabecular and cortical bone
      parameters. A constitutive knockout cannot distinguish a bone-vascular
      mechanism from a systemic or extraskeletal one, which is the specific
      ambiguity this gap describes.
  - experiment_id: exp_pls3_human_bone_vascular_phenotyping
    name: Human bone vascular phenotyping in PLS3-related X-linked osteoporosis
    description: >-
      Assess bone vascular architecture in individuals carrying PLS3
      loss-of-function variants, to test whether the smaller bone blood vessels
      seen in Pls3-deficient mice are present in the human disease. This is the
      single observation that would move the arm from EMERGING toward CANONICAL.
- discussion_id: endosteal_map_species_mismatch
  prompt: >-
    How far does a single-cell map of the mouse endosteal compartment, and
    functional validation in mouse and zebrafish, transfer to the human endosteal
    niche?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Endosteal Vascular Niche Dysfunction
  rationale: >-
    The cell map and every causal experiment behind this arm are murine or
    zebrafish; the human component is a bone mineral density GWAS and a
    single-cell survey of adult human femoral bone. The mouse route was chosen
    precisely because human endosteal cells are hard to obtain, so the human
    reference tissue is not equivalent - it is adult femoral head bone from a
    surgical population, not the metaphyseal and diaphyseal endosteum that was
    dissected in mouse. The correspondence that was demonstrated is at the level
    of cell populations and gene expression, which is weaker than a demonstration
    that the same causal chain operates. This is recorded as HUMAN_MODEL_MISMATCH
    rather than KNOWLEDGE_GAP because the evidence exists and is strong in the
    model system; what is open is its translational validity.
  evidence:
  - reference: PMID:42432248
    reference_title: "Multiscale analysis and functional validation of the cellular and genetic determinants of skeletal disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To investigate the translational importance of our findings, we isolated
      and sequenced 125,063 cells from adult human femoral bone (Fig. 8a). Human
      bone included similar populations of MSCs, pre-osteoblasts, mature
      osteoblasts, chondrocytes, fibroblasts, ECs and VSMCs to mice
    explanation: >-
      Establishes what the human validation does and does not show: the same cell
      populations are present in human bone, which is population correspondence
      rather than mechanistic transfer.
  proposed_experiments:
  - experiment_id: exp_human_endosteal_compartment_single_cell_profiling
    name: Single-cell profiling of the human endosteal compartment
    description: >-
      Profile cells isolated from the human endosteal compartment specifically,
      rather than whole femoral head bone, and test whether the vascular gene
      programs that carry the mouse enrichment signal are reproduced in the
      anatomically matched human tissue.
animal_models:
- name: Pls3-deficient mouse (Pls3 hemizygous null, male)
  species: Mouse
  genotype: Pls3 hemizygous null (Pls3y/-)
  publication: PMID:42432248
  description: >-
    Male mice hemizygous for a Pls3 null allele. PLS3 loss-of-function variants
    cause osteogenesis imperfecta and X-linked osteoporosis in children, and Pls3
    is expressed in osteoblast lineage cells, endothelial cells and vascular
    smooth muscle cells in bone. The model was used to ask which of those cell
    types Pls3 acts through, and revealed a bone vascular phenotype rather than a
    purely osteoblast-intrinsic one.
  modeled_mechanisms:
  - target: Endosteal Vascular Niche Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of a gene that causes human X-linked osteoporosis produces abnormal
      bone vasculature, which is the observation this node is built on.
    limitations: >-
      The vascular phenotype has been demonstrated in mouse only; individuals
      carrying PLS3 loss-of-function variants have not been shown to have
      abnormal bone vasculature, and the authors state the human inference as
      "might result from". The model is male hemizygous, matching the X-linked
      human genetics but giving no information about heterozygous carriers. Pls3
      is expressed in osteoblast lineage cells as well as in the vasculature, so
      the model does not by itself isolate the vascular contribution.
    readouts:
    - name: Bone blood vessel size
      target: Endosteal Vascular Niche Dysfunction
      description: >-
        Anti-CD31 immunohistochemistry of mid-femur sections with confirmation by
        backscattered scanning electron microscopy and micro-CT.
      direction: DECREASED
      interpretation: >-
        Smaller bone blood vessels are the structural correlate of the vascular
        niche node in this model.
      evidence:
      - reference: PMID:42432248
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          mice showed smaller blood vessels in bone compared to controls (CTRLs)
          (Fig. 6a), which was confirmed by backscattered scanning electron
          microscopy (SEM) and micro-CT analysis
        explanation: >-
          Reports the vascular measurement, in three independent modalities, that
          grounds this readout.
    evidence:
    - reference: PMID:42432248
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The absence of bone cells at this developmental stage indicates that pls3
        might act directly to control angiogenesis and vascular patterning. These
        data suggest that X-linked osteoporosis might result from abnormalities in
        bone vasculature.
      explanation: >-
        Supports treating this model as informative for the vascular niche node,
        while its hedged phrasing is also why fidelity is MODERATE rather than
        HIGH.
- name: pls3 crispant zebrafish embryo
  species: Zebrafish
  genotype: pls3 CRISPR-Cas9 crispant (F0 knockdown)
  publication: PMID:42432248
  description: >-
    Zebrafish embryos in which pls3 was knocked down, examined at a developmental
    stage before bone cells are present. This is the experiment that separates a
    direct vascular role for pls3 from a secondary consequence of a bone defect.
  modeled_mechanisms:
  - target: Endosteal Vascular Niche Dysfunction
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Perturbs the same gene in a system with no bone, isolating the vascular
      patterning function from any skeletal contribution.
    limitations: >-
      Zebrafish embryos have no endosteal compartment and no bone at the stage
      examined, so this model speaks to a general vascular patterning role for
      pls3 rather than to the endosteal niche specifically. Intersegmental vessel
      defects in the trunk are not bone vasculature. F0 crispants are mosaic.
    readouts:
    - name: Intersegmental vessel patterning
      target: Endosteal Vascular Niche Dysfunction
      description: >-
        Scoring of intersegmental vessel formation in pls3 crispant embryos.
      direction: ALTERED
      interpretation: >-
        Disconnections, ectopic connections and smaller lumens indicate a
        vascular patterning requirement for pls3 that is independent of bone.
      evidence:
      - reference: PMID:42432248
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          resulted in mild cardiac edema and defects in intersegmental vessel
          (ISV) formation, including disconnections from the dorsal aorta or
          posterior cardinal vein, ectopic vessel connections and smaller lumens
        explanation: >-
          Reports the vascular patterning defects that constitute this readout.
- name: Nherf2 knockout mouse
  species: Mouse
  genotype: Nherf2 homozygous knockout (Nherf2-/-)
  publication: PMID:42432248
  description: >-
    Constitutive knockout of Nherf2, an estimated bone mineral density-associated

name: CDK4/6 Inhibitor Resistance Module
description: >-
  A conserved therapy-resistance mechanism module for tumors treated with
  selective CDK4/6 inhibitors (palbociclib, ribociclib, abemaciclib). The
  conserved chain runs from a tumor's dependence on the cyclin
  D-CDK4/6-INK4-RB axis to license the G1/S transition, through pharmacologic
  CDK4/6 blockade that holds RB hypophosphorylated and arrests sensitive cells
  in G1, to the two routes by which tumors escape that arrest — selection of
  cell-cycle bypass lesions (RB1 loss of function, cyclin E1/CDK2 activation,
  CDK6 amplification) and reactivation of upstream bypass signaling (FAT1
  loss/Hippo-YAP-TAZ, PI3K-AKT-mTOR, FGFR, RAS-MAPK) — which converge on the
  rate-limiting node of RB-pathway bypass and restored E2F-driven S-phase
  re-entry, and thence on loss of clinical benefit and tumor progression. This
  module is the therapy-resistance counterpart of the growth-suppressor
  hallmark modules: `evading_growth_suppressors` models the germline/somatic
  loss of the RB and p53 antiproliferative brakes as an oncogenic capability,
  whereas this module models what happens when that same axis is
  pharmacologically re-imposed and the tumor evolves around the drug. Disorder
  entries treated with CDK4/6 inhibitors (HR-positive breast cancer,
  CDKN2A-deleted tumors such as chordoma and mesothelioma, mantle cell
  lymphoma, NRAS-mutant melanoma) declare conformance via `conforms_to`,
  substituting the tumor-type-specific route into cyclin D-CDK4/6 dependence
  and the tumor-type-specific resistance lesion.
category: Module
creation_date: "2026-07-30T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g., "cdk46_inhibitor_resistance#RB
  Pathway Bypass and E2F-Driven S-Phase Re-entry"). Key conformance target: "cdk46_inhibitor_resistance#RB
  Pathway Bypass and E2F-Driven S-Phase Re-entry" — the disorder-agnostic,
  rate-limiting step every resistance route funnels through. Drug-target
  pattern: CDK4/6-inhibitor treatments use target_mechanisms with INHIBITS on
  "Cyclin D-CDK4/6-RB Pathway Dependency". Tumor-specific substitutions
  conforming entries make at the trigger node: CDKN2A/p16 deletion (chordoma,
  mesothelioma, oral squamous cell carcinoma), CCND1 translocation/cyclin D1
  overexpression (mantle cell lymphoma), estrogen-receptor-driven cyclin D1
  transcription (HR-positive breast cancer), and MAPK-driven cyclin D
  induction (NRAS-mutant melanoma). Deliberate scope boundaries: (1) the
  oncogenic loss of RB/p53 brakes as a cancer hallmark is
  `evading_growth_suppressors`, not this module; (2) endocrine-therapy
  resistance mechanisms that travel with CDK4/6-inhibitor combinations (ESR1
  mutation, PIK3CA mutation selected by fulvestrant) belong on the disorder
  entry, not here, because they are not CDK4/6-axis mechanisms; (3) the
  senescence/quiescence depth of the drug-induced arrest is
  `cellular_senescence`. Evidence caveat curators must preserve: the
  preclinical resistance mechanisms (CCNE1 amplification, CDK6 amplification)
  are robust in cell-line models but were NOT confirmed as acquired events in
  the largest randomized-trial circulating-tumor-DNA analysis (PALOMA-3,
  PMID:30206110), and acquired RB1 mutation there was subclonal and present in
  only 4.7% of palbociclib-treated patients. Do not curate any of these as
  "the" dominant clinical resistance mechanism; the discussions block records
  this as an open knowledge gap.
pathophysiology:
- name: Cyclin D-CDK4/6-RB Pathway Dependency
  description: >-
    The tumor's proliferation depends on the cyclin D-CDK4/6-INK4-RB axis to
    license the G1/S transition. Cyclin D, induced by lineage-specific
    mitogenic input (estrogen receptor signaling in HR-positive breast cancer,
    MAPK signaling in melanoma, CCND1 translocation in mantle cell lymphoma),
    partners with CDK4 or CDK6 to phosphorylate the retinoblastoma protein,
    releasing E2F transcription factors and committing the cell to S phase.
    Loss of the INK4 brake (CDKN2A/p16 deletion) or cyclin D/CDK4-6
    amplification deepens this dependency. A tumor that has retained
    functional RB and depends on this axis is the population in which CDK4/6
    inhibition is expected to work; this is the module trigger.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: cyclin D-CDK4/6 kinase activity
    term:
      id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
    modifier: INCREASED
  evidence:
  - reference: PMID:30478914
    reference_title: "Molecular mechanisms of resistance to CDK4/6 inhibitors in breast cancer: A review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Deregulation of the cyclin D-CDK4/6-INK4-RB pathway leading to
      uncontrolled cell proliferation, is frequently observed in breast cancer.
    explanation: >-
      Establishes deregulation of the cyclin D-CDK4/6-INK4-RB axis as the
      recurrent lesion that creates the dependency this module is triggered by.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:35304604
    reference_title: "Targeting CDK4 and CDK6 in cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cyclin-dependent kinase 4 (CDK4) and CDK6 are critical mediators of
      cellular transition into S phase and are important for the initiation,
      growth and survival of many cancer types.
    explanation: >-
      Confirms that CDK4/CDK6 control the S-phase transition across many tumor
      types, supporting the cross-cancer scope of the trigger node. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Pharmacologic CDK4/6 Inhibition and G1 Arrest
    description: >-
      Because proliferation is routed through CDK4/6, the axis is druggable and
      selective inhibitors impose a G1 block on dependent tumor cells.

- name: Pharmacologic CDK4/6 Inhibition and G1 Arrest
  description: >-
    A selective CDK4/6 inhibitor (palbociclib, ribociclib, or abemaciclib)
    occupies the ATP pocket of CDK4 and CDK6, preventing cyclin D-CDK4/6 from
    phosphorylating RB. RB stays hypophosphorylated, E2F remains sequestered,
    and sensitive tumor cells arrest in G1. This is the therapeutic response
    node — the intended, on-target effect — and it is also the selective
    pressure that shapes everything downstream in this module.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: negative regulation of G1/S transition of mitotic cell cycle
    term:
      id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
    modifier: INCREASED
  - preferred_term: negative regulation of cell cycle
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
    modifier: INCREASED
  evidence:
  - reference: PMID:35304604
    reference_title: "Targeting CDK4 and CDK6 in cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As expected, CDK4/6 inhibitors arrest sensitive tumour cells in the G1
      phase of the cell cycle.
    explanation: >-
      States the on-target pharmacodynamic effect (G1 arrest of sensitive
      cells) that defines this node. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: Cell-Cycle Bypass Lesion Selection
    description: >-
      Sustained drug pressure selects for pre-existing or newly acquired
      lesions in the cell-cycle machinery downstream of the drug target.
  - target: Upstream Bypass Signaling Reactivation
    description: >-
      Sustained drug pressure also selects for signaling rewiring that restores
      cyclin-CDK activity without requiring the inhibited CDK4/6 kinases.

- name: Cell-Cycle Bypass Lesion Selection
  description: >-
    Under CDK4/6-inhibitor pressure the tumor selects lesions in the cell-cycle
    machinery that make the drug target dispensable. Three recurrent classes
    are documented: (1) loss-of-function alteration of RB1 itself, which
    removes the substrate the drug protects and is the only class so far
    confirmed to be positively selected in a randomized clinical trial; (2)
    cyclin E1 (CCNE1) overexpression, which activates CDK2 to phosphorylate RB
    independently of CDK4/6 and is a validated clinical resistance biomarker;
    and (3) amplification/overexpression of CDK6 itself, which raises the
    target above achievable drug exposure. Conforming disorder entries
    substitute whichever lesion their tumor type acquires.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: positive regulation of cyclin-dependent protein serine/threonine
      kinase activity
    term:
      id: GO:0045737
      label: positive regulation of cyclin-dependent protein serine/threonine kinase
        activity
    modifier: INCREASED
  evidence:
  - reference: PMID:30206110
    reference_title: "The Genetic Landscape and Clonal Evolution of Breast Cancer Resistance to Palbociclib plus Fulvestrant in the PALOMA-3 Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations support the emergence of RB1 aberrations being
      acquired or selected under pressure from palbociclib, but only in a
      minority of patients (6/127, 4.7%).
    explanation: >-
      Paired baseline/end-of-treatment circulating-tumor-DNA sequencing in the
      randomized PALOMA-3 trial demonstrates positive selection of RB1
      loss-of-function under palbociclib, establishing this node clinically —
      but supports only PARTIALLY, because the same analysis shows the event is
      subclonal and confined to a small minority, so RB1 loss cannot be curated
      as the dominant clinical resistance mechanism.
  - reference: PMID:30807234
    reference_title: "Cyclin E1 Expression and Palbociclib Efficacy in Previously Treated Hormone Receptor-Positive Metastatic Breast Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Addition of palbociclib to fulvestrant demonstrated efficacy in all
      biomarker groups, although high CCNE1 mRNA expression was associated with
      relative resistance to palbociclib.
    explanation: >-
      Prospective gene-expression analysis of the randomized PALOMA-3 trial,
      independently validated in the POP trial, links high cyclin E1 expression
      to relative palbociclib resistance, supporting the CDK2/cyclin E1 bypass
      lesion class.
  - reference: PMID:27748766
    reference_title: "Acquired CDK6 amplification promotes breast cancer resistance to CDK4/6 inhibitors and loss of ER signaling and dependence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockdown of CDK6 restored drug sensitivity, while enforced
      overexpression of CDK6 was sufficient to mediate drug resistance.
    explanation: >-
      Gain- and loss-of-function experiments in chronically abemaciclib-exposed
      breast cancer cell lines establish CDK6 amplification/overexpression as a
      sufficient bypass lesion. Evidence source is IN_VITRO because the
      experiments were performed in cultured cell lines.
  downstream:
  - target: RB Pathway Bypass and E2F-Driven S-Phase Re-entry
    description: >-
      RB1 loss, CDK2/cyclin E1 activity, or excess CDK6 all restore RB
      phosphorylation or make it unnecessary, releasing E2F despite the drug.

- name: Upstream Bypass Signaling Reactivation
  description: >-
    In parallel with lesions in the core cell-cycle machinery, tumors rewire
    upstream signaling so that cyclin-CDK activity is restored without the
    inhibited kinases. Loss of the FAT1 tumor suppressor deregulates
    Hippo signaling, allowing YAP/TAZ to accumulate on the CDK6 promoter and
    markedly elevate CDK6; alterations in other Hippo components act the same
    way. PI3K-AKT-mTOR, FGFR, and RAS-MAPK reactivation similarly sustain
    cyclin D and D-type-cyclin-independent proliferative drive. Reviews of the
    field group these with the cell-cycle lesions as "upstream response" versus
    "downstream bypass" mechanisms.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: hippo signaling
    term:
      id: GO:0035329
      label: hippo signaling
    modifier: DECREASED
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:30537512
    reference_title: "Loss of the FAT1 Tumor Suppressor Promotes Resistance to CDK4/6 Inhibitors via the Hippo Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings uncover a tumor suppressor function of Hippo signaling in
      ER+ breast cancer and establish FAT1 loss as a mechanism of resistance to
      CDK4/6i.
    explanation: >-
      Conclusion of a genomic analysis of 348 estrogen-receptor-positive breast
      cancers treated with CDK4/6 inhibitors, establishing FAT1 loss as a
      clinically observed resistance mechanism acting through Hippo signaling.
  - reference: PMID:30537512
    reference_title: "Loss of the FAT1 Tumor Suppressor Promotes Resistance to CDK4/6 Inhibitors via the Hippo Pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The induction of CDK6 was mediated by the Hippo pathway with accumulation
      of YAP and TAZ transcription factors on the CDK6 promoter.
    explanation: >-
      Defines the mechanism by which FAT1 loss produces CDK4/6-inhibitor
      resistance — Hippo-pathway deregulation driving YAP/TAZ-dependent CDK6
      induction — which is the archetype of upstream bypass signaling in this
      node. Evidence source is IN_VITRO because the promoter-occupancy and
      rescue experiments were performed in cell lines and xenografts.
  - reference: PMID:33364954
    reference_title: "Mechanisms of CDK4/6 Inhibitor Resistance in Luminal Breast Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The cell signaling pathways involved in therapy resistance are divided
      into two groups: upstream response mechanisms and downstream bypass
      mechanisms.
    explanation: >-
      Supports the module's two-branch architecture — upstream signaling
      reactivation and downstream cell-cycle bypass — as the accepted
      organizing framework for CDK4/6-inhibitor resistance. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: RB Pathway Bypass and E2F-Driven S-Phase Re-entry
    description: >-
      Restored upstream drive raises cyclin-CDK activity above the level the
      inhibitor can suppress, re-phosphorylating RB.

- name: RB Pathway Bypass and E2F-Driven S-Phase Re-entry
  description: >-
    The convergent, rate-limiting node of the module. Whether the tumor lost
    RB1, gained CDK2/cyclin E1 activity, amplified CDK6, or rewired upstream
    signaling, the common endpoint is the same: the RB brake that the drug was
    holding in place is bypassed, E2F transcriptional activity is restored, and
    cells re-enter S phase despite continued CDK4/6 inhibition. This is the key
    conformance target — a conforming disorder node should describe its own
    tumor-specific route into this state, not a new endpoint.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
    modifier: INCREASED
  - preferred_term: negative regulation of cell cycle
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:33364954
    reference_title: "Mechanisms of CDK4/6 Inhibitor Resistance in Luminal Breast Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overactivation of the cyclin-CDK-Rb axis related to uncontrolled cell
      proliferation is the main cause of CDK4/6 inhibitor resistance; however,
      the underlying mechanisms need to be clarified further.
    explanation: >-
      Identifies reactivation of the cyclin-CDK-RB axis as the convergent cause
      of CDK4/6-inhibitor resistance, which is exactly the rate-limiting node
      modeled here. Evidence source is OTHER because this is a review article.
  - reference: PMID:30807234
    reference_title: "Cyclin E1 Expression and Palbociclib Efficacy in Previously Treated Hormone Receptor-Positive Metastatic Breast Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results from the unbiased search support and confirm the critical
      role of E2F transcriptional activity, and CCNE1 mRNA in particular, in
      determining the relative clinical efficacy from the addition of
      palbociclib to fulvestrant.
    explanation: >-
      Panel-wide expression analysis of a randomized trial shows E2F
      transcriptional output determines clinical benefit from CDK4/6
      inhibition, supporting restored E2F-driven S-phase entry as the node that
      decides response versus resistance.
  downstream:
  - target: Acquired CDK4/6 Inhibitor Resistance and Tumor Progression
    description: >-
      Resumed proliferation under therapy is expressed clinically as loss of
      disease control and radiographic progression.

- name: Acquired CDK4/6 Inhibitor Resistance and Tumor Progression
  description: >-
    The clinical consequence: tumor cells proliferate despite continued CDK4/6
    inhibition, progression-free survival benefit is lost, and the disease
    progresses. Innate (de novo) resistance produces the same endpoint without
    an initial response. This node is where conforming disorder entries attach
    their disease-specific progression phenotypes and post-progression
    treatment strategies.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:32289274
    reference_title: "Mechanisms of Sensitivity and Resistance to CDK4/6 Inhibition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The efficacy of this strategy is, however, limited by innate or acquired
      resistance mechanisms and its application to other tumor types is still
      uncertain.
    explanation: >-
      States the clinical endpoint of the module — innate or acquired
      resistance limiting the efficacy of CDK4/6 inhibition — and flags the
      uncertain extension beyond breast cancer. Evidence source is OTHER
      because this is a review article.
treatments:
- name: Selective CDK4/6 Inhibitor Therapy
  description: >-
    Palbociclib, ribociclib, and abemaciclib are selective ATP-competitive
    inhibitors of CDK4 and CDK6. By preventing cyclin D-CDK4/6 from
    phosphorylating RB they impose the G1 arrest modeled by this module, and in
    hormone-receptor-positive advanced breast cancer they are combined with
    endocrine therapy as standard of care. This is the drug-target design
    pattern for conforming disorders: the treatment acts on the upstream
    dependency node, and the rest of the module models how tumors escape it.
    (Abemaciclib is named here in prose rather than as a therapeutic_agent
    because it has no CHEBI class; conforming entries that need it should bind
    an NCIT term.)
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: palbociclib
      term:
        id: CHEBI:85993
        label: palbociclib
    - preferred_term: ribociclib
      term:
        id: CHEBI:230905
        label: Ribociclib
  target_mechanisms:
  - target: Cyclin D-CDK4/6-RB Pathway Dependency
    treatment_effect: INHIBITS
    description: >-
      Selective CDK4/6 inhibition blocks the cyclin D-CDK4/6 kinase activity
      the tumor depends on to phosphorylate RB, converting the dependency node
      into a therapeutic vulnerability and producing the G1 arrest downstream.
  evidence:
  - reference: PMID:35304604
    reference_title: "Targeting CDK4 and CDK6 in cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pharmacological inhibitors of CDK4/6 have rapidly become a new standard
      of care for patients with advanced hormone receptor-positive breast
      cancer.
    explanation: >-
      Establishes CDK4/6 inhibitors as standard-of-care therapy in the setting
      where this module's resistance chain is most extensively documented.
      Evidence source is OTHER because this is a review article.
discussions:
- discussion_id: gap_cdk46_preclinical_vs_clinical_resistance_lesions
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cell-Cycle Bypass Lesion Selection
  prompt: >-
    Which CDK4/6-inhibitor resistance mechanisms established in preclinical
    models are actually selected in patients, and what explains the gap between
    the strong cell-line evidence for CCNE1 and CDK6 amplification and their
    absence as acquired events in randomized-trial circulating tumor DNA?
  rationale: >-
    CCNE1 amplification and CDK6 amplification are reproducible, mechanistically
    sufficient resistance drivers in cell lines (PMID:27748766), yet the
    PALOMA-3 paired baseline/end-of-treatment ctDNA analysis found no acquired
    CCNE1, CDK4, or CDK6 amplification, and found acquired RB1 mutation in only
    4.7% of palbociclib-treated patients, all subclonal (PMID:30206110). The
    authors note that ctDNA is poorly powered for copy-number calling at low
    tumor purity, so the discrepancy may be technical rather than biological.
    Until this is resolved, the dominant clinical resistance mechanism for
    CDK4/6 inhibitors is genuinely unknown, and conforming disorder entries must
    not curate any single bypass lesion as "the" resistance mechanism.
  proposed_experiments:
  - experiment_id: exp_cdk46_paired_tissue_biopsy_copy_number_at_progression
    name: Paired pre-treatment and progression tissue sequencing for bypass-lesion
      copy number
    description: >-
      Collect paired pre-treatment and at-progression tumor tissue biopsies
      (not circulating tumor DNA) from a prospective cohort of patients
      receiving a CDK4/6 inhibitor, and perform whole-exome plus RNA
      sequencing. Tissue avoids the low-tumor-purity limitation that prevented
      PALOMA-3 from reliably calling copy number, allowing adequately powered
      assessment of whether CCNE1, CDK4, CDK6 amplification and RB1 loss are
      genuinely acquired under therapy.
    decision_criterion: >-
      A significant increase in the prevalence of CCNE1, CDK6, or CDK4
      amplification, or of RB1 loss, between paired pre-treatment and
      progression tissue samples.
    would_support:
    - >-
      Confirms that the cell-line bypass lesions are genuinely selected in
      patients and that the PALOMA-3 negative result was a ctDNA
      copy-number-sensitivity artifact.
    would_refute:
    - >-
      No enrichment of these lesions in tissue would indicate that the dominant
      clinical resistance mechanism lies outside the bypass lesions currently
      modeled at this node.
  - experiment_id: exp_cdk46_single_cell_resistant_subclone_architecture
    name: Single-cell resolution of resistant subclone architecture at progression
    description: >-
      Apply single-cell or high-depth bulk sequencing to progression samples to
      determine whether resistant subclones converge on a single bypass lesion
      per patient or coexist polyclonally, as the polyclonal RB1 aberrations
      observed in PALOMA-3 suggest.
    decision_criterion: >-
      Recovery of two or more independent bypass lesions in genetically
      distinct subclones within the same progression sample.
    would_support:
    - >-
      Polyclonal convergence would imply that targeting any single bypass
      lesion after progression is unlikely to restore control, favoring
      combination or pathway-level strategies.
    would_refute:
    - >-
      Monoclonal, single-lesion resistance would support lesion-directed
      post-progression therapy selection.
  evidence:
  - reference: PMID:30206110
    reference_title: "The Genetic Landscape and Clonal Evolution of Breast Cancer Resistance to Palbociclib plus Fulvestrant in the PALOMA-3 Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find no evidence that acquired CCNE1, CDK4 or CDK6 amplification are
      relevant in the clinic, although we do note that circulating tumor DNA
      analysis is limited in analyzing copy number due to the challenge of low
      tumor purity.
    explanation: >-
      Directly states the model-versus-clinic discrepancy and its most likely
      technical explanation, which is the substance of this knowledge gap.
- discussion_id: gap_cdk46_cyclin_isoform_context_dependence
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cyclin D-CDK4/6-RB Pathway Dependency
  prompt: >-
    Which cyclin and CDK isoforms drive proliferation in which tumor contexts,
    and can that context-dependence be used to predict CDK4/6-inhibitor
    sensitivity outside hormone-receptor-positive breast cancer?
  rationale: >-
    The module's trigger node asserts a dependency on cyclin D-CDK4/6, but which
    specific cyclin and CDK isoforms carry that dependency is tumor-type- and
    context-dependent and remains incompletely mapped. This is the gap that
    motivated this module's creation (dismech issue #6033) and it is the main
    barrier to extending CDK4/6 inhibition to tumor types beyond HR-positive
    breast cancer.
  proposed_experiments:
  - experiment_id: exp_cdk46_isoform_resolved_dependency_screen
    name: Isoform-resolved cyclin and CDK dependency screen across tumor types
    description: >-
      Run isoform-resolved functional genomics (separate CCND1, CCND2, CCND3,
      CDK4, and CDK6 dependency screens) across a tumor-type-diverse panel of
      cell lines and patient-derived organoids, and correlate the dependency
      profile with measured sensitivity to palbociclib, ribociclib, and
      abemaciclib.
    decision_criterion: >-
      A reproducible mapping from isoform dependency profile to CDK4/6
      inhibitor sensitivity that holds across tumor lineages.
    would_support:
    - >-
      Establishes isoform dependency as a predictive biomarker and would let
      conforming disorder entries name the specific isoform carrying the
      dependency at the trigger node.
    would_refute:
    - >-
      Absence of a lineage-transferable mapping would indicate the dependency
      is set by context rather than isoform identity, and the trigger node
      should remain isoform-agnostic.
  evidence:
  - reference: PMID:42398754
    reference_title: "Involvement of cyclins in the pathogenesis of cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite extensive research, the context-dependent roles of cyclins, their
      isoform-specific functions, and mechanisms underlying resistance to
      cyclin-targeted therapies remain incompletely understood.
    explanation: >-
      The review that prompted this module states the isoform-specificity and
      resistance gaps explicitly. Evidence source is OTHER because this is a
      review article.

- name: Airway Smooth Muscle Relaxation Downstream of GABA-A Receptor Chloride Conductance
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Airway smooth muscle relaxes. This is the module's key conformance target: the step every airway
    use of a GABA_A positive allosteric modulator passes through, and the point at which this chain
    reaches the same effector as the beta2 and muscarinic modules by a disjoint route. The relaxation
    is shown to be GABA_A-mediated by its reversal with the selective antagonist gabazine, and it
    relaxes muscle already contracted by an independent agonist (a tachykinin such as substance P, or
    histamine, or bradykinin) rather than preventing a contraction from forming.
  biological_processes:
  - preferred_term: relaxation of airway smooth muscle
    term:
      id: GO:0044557
      label: relaxation of smooth muscle
    modifier: INCREASED

name: GABA-A Receptor Agonism Module
description: "Pharmacological positive allosteric modulation of the GABA_A receptor on airway smooth muscle, and the relaxation chain it drives. A subtype-selective positive allosteric modulator occupies the benzodiazepine site of the alpha4/alpha5 GABA_A receptors that airway smooth muscle expresses; the ligand-gated chloride channel opens, chloride conductance rises and the membrane potential changes, which reduces calcium influx and relaxes the muscle, dilating the airway and reducing airway hyperresponsiveness. The key conformance target is the central effector, \"Airway Smooth Muscle Relaxation Downstream of GABA-A Receptor Chloride Conductance\". A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"GABA-A Receptor Benzodiazepine-Site Occupancy on Airway Smooth Muscle\". Scope: the airway chain only, the third inhaled-bronchodilator sibling after beta2_adrenergic_receptor_agonism and muscarinic_receptor_antagonism. It reaches the same effector -- airway smooth muscle relaxation -- by a mechanistically disjoint route: a ligand-gated chloride channel and a membrane-potential change, where the beta2 class works through Gs/adenylate cyclase/cAMP and the muscarinic class through loss of Gq/phospholipase C/calcium. The effector and apical nodes are named distinctly from the beta2 nodes on purpose, because the beta2 relaxation and bronchodilation nodes sit downstream of cAMP, and a GABA_A ligand must not be linked to a transducer it never engages. Unlike the two siblings, this drug class is investigational rather than approved, so the module currently has no conformers; it documents the mechanism ahead of the entries that will use it."
category: Module
module_categories:
- PHARMACOLOGY
creation_date: '2026-11-22T18:00:00Z'
notes: "Scope and evidence decisions recorded for the next curator. The airway restriction is deliberate and matches the two sibling pharmacology modules: GABA_A receptors are expressed across many tissues and the brain receptors are the sedative target this drug class is engineered to avoid, but this module is the airway relaxation chain only. The CNS-avoidance property -- the design feature that an ionised carboxylate holds these compounds out of the brain, shown by the absence of rotarod impairment -- is the drug's safety argument rather than a step in airway relaxation, so it is scoped out here, in the same way the beta2 and muscarinic modules scope out the other uses of their drug classes. There is no slot for \"mechanism X is absent in compartment Y at dose Z\", which is what a CNS-exclusion node would need; it is left as a recorded gap. The transducer step is sourced but its sign is stated carefully. What is directly measured in airway smooth muscle is an increase in GABA-activated chloride current (voltage-clamp, human ASM cells) and a membrane-potential-dependent inhibition of calcium influx; the general principle that membrane hyperpolarisation favours airway smooth muscle relaxation is cited as background, and the precise direction of the potential change in airway smooth muscle (which carries a relatively high intracellular chloride) is not asserted beyond what the sources measure. The binding-affinity figures reported for candidate ligands must never be recorded as airway GABA_A affinity: the headline 9 nM for Webb et al. 2023 compound 5c is 3H-flunitrazepam displacement from rat brain extract, a subtype mixture dominated by alpha1beta2gamma2, while the airway target is alpha4/alpha5, and alpha4-containing receptors are largely insensitive at that site; the docking in that paper is on alpha1beta3gamma2 for the same reason. The airway alpha4/alpha5 premise and the gabazine-reversible, Gabra4-knockout-confirmed functional controls come from Mizuta 2008, Gallos 2015 and Yocum 2016. Those three and Webb 2023 share C. W. Emala as an author (senior author on the first three, co-author on the fourth), so the corroboration across the chain is not independent of the group making the claim; it qualifies the attribution rather than invalidating it. Two further mechanisms this drug class raises have no node here and are recorded so they are not lost: the Webb et al. observation that compound 5f showed a much stronger ex vivo effect than in vivo effect is a statement about the limits of the ex vivo tracheal ring as a predictor of the whole animal, which would become a FAILS_TO_RECAPITULATE model link against the apical node once a disease entry wires these models; and the designed peripheral restriction is the CNS-exclusion finding above. No conformer is wired, because no curated disease entry yet treats with an approved GABA_A bronchodilator; the beta2 sibling's Asthma node 'Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors' exists because that class is approved, and this class is not."
pathophysiology:
- name: GABA-A Receptor Benzodiazepine-Site Occupancy on Airway Smooth Muscle
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A subtype-selective positive allosteric modulator binds the benzodiazepine site of the GABA_A
    receptor on airway smooth muscle and potentiates its chloride channel. Airway smooth muscle
    expresses GABA_A receptors restricted, among the alpha subunits, to alpha4 and alpha5 (with beta3
    and gamma2), which is what makes a subtype-selective modulator a targeted bronchodilator rather
    than a sedative: the alpha1-alpha3 receptors that mediate the central benzodiazepine effects are
    not the airway target. The occupancy is a positive allosteric modulation of the receptor rather
    than direct gating, and the binding affinities reported for candidate ligands are measured on
    brain GABA_A subtype mixtures, not on the airway receptor, so they are not recorded as an airway
    affinity (see notes).

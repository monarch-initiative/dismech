  downstream:
  - target: Bronchodilation by GABA-A Receptor Positive Allosteric Modulation
- name: Bronchodilation by GABA-A Receptor Positive Allosteric Modulation
  role: consequence
  biological_scale: ORGANISM
  description: >-
    In the whole animal, a subtype-selective GABA_A positive allosteric modulator delivered to the
    airway reduces airway resistance and methacholine-induced airway hyperresponsiveness. This is the
    apical readout the drug class is being developed for, and it is reached without the Gs/cAMP
    transducer of the beta2 class or the withdrawal of cholinergic tone of the muscarinic class.
  evidence:
  - reference: PMID:37418196
    reference_title: "Design, Synthesis, and Biological Evaluation of Novel Spiro Imidazobenzodiazepines to Identify Improved Inhaled Bronchodilators."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "reduction of methacholine-induced airway hyperresponsiveness (AHR) in conscious mice"
    explanation: Nebulised modulator reduces methacholine-induced airway hyperresponsiveness in conscious mice, the apical bronchodilation this node describes.
  - reference: PMID:26405827
    reference_title: Targeting the γ-Aminobutyric Acid A Receptor α4 Subunit in Airway Smooth Muscle to Alleviate Bronchoconstriction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "In vivo, inhaled XHe-III-74 reduced respiratory system resistance in an asthmatic mouse model."
    explanation: An inhaled subtype-selective modulator reduces airway resistance in an asthmatic mouse model, the same apical effect by the alpha4 arm.
treatments:
- name: Investigational Subtype-Selective GABA-A Receptor Positive Allosteric Modulator Therapy
  description: >-
    An investigational inhaled bronchodilator class: subtype-selective GABA_A receptor positive
    allosteric modulators designed against the alpha4/alpha5 airway receptors and, in several cases,
    against blood-brain-barrier penetration to avoid the sedation that the alpha1-alpha3 brain
    receptors mediate. No agent in this class is clinically approved; exemplars are MIDD0301, the
    spiro imidazobenzodiazepine acids of Webb et al. 2023, and the Yocum et al. ligands CMD-45 and
    XHe-III-74. The agent is carried as free text because these compounds have no CHEBI identifier.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: subtype-selective GABA_A receptor positive allosteric modulator
  target_mechanisms:
  - target: GABA-A Receptor Benzodiazepine-Site Occupancy on Airway Smooth Muscle
    treatment_effect: ACTIVATES
    description: The modulator is what establishes the positive allosteric occupancy of the airway GABA_A receptor at this node.
  evidence:
  - reference: PMID:26405827
    reference_title: Targeting the γ-Aminobutyric Acid A Receptor α4 Subunit in Airway Smooth Muscle to Alleviate Bronchoconstriction.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Selective targeting of the GABA(A)R α4 subunit with inhaled ligands may be a novel therapeutic pathway to treat bronchoconstriction, while avoiding sedative central nervous system effects, which are largely mediated by α1-3 subunit-containing GABA(A)Rs in the brain."
    explanation: States the therapeutic strategy this treatment represents and its CNS-avoidance rationale, in the authors' own conclusion. INDIRECT because the benefit is projected from mechanism and animal data rather than demonstrated in patients.

    reference_title: GABAA receptors are expressed and facilitate relaxation in airway smooth muscle.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "it directly concentration dependently relaxed a tachykinin-induced contraction in guinea pig tracheal rings, which was inhibited by the GABA(A)-selective antagonist gabazine"
    explanation: The GABA_A agonist muscimol relaxes contracted airway smooth muscle, and the gabazine reversal proves the relaxation is GABA_A-mediated.
  - reference: PMID:37418196
    reference_title: "Design, Synthesis, and Biological Evaluation of Novel Spiro Imidazobenzodiazepines to Identify Improved Inhaled Bronchodilators."

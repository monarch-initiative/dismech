    explanation: The spiro imidazobenzodiazepine positive allosteric modulators relax airway smooth muscle ex vivo, the effector this node names.
  - reference: PMID:26405827
    reference_title: Targeting the γ-Aminobutyric Acid A Receptor α4 Subunit in Airway Smooth Muscle to Alleviate Bronchoconstriction.

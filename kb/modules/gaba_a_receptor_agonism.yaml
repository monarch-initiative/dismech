    explanation: States the alpha4/alpha5 subunit restriction that makes a subtype-selective modulator airway-targeted; quote_role BACKGROUND because this paper restates its own earlier demonstration of the restriction.
  downstream:
  - target: Increased Chloride Conductance and Membrane Potential Change in Airway Smooth Muscle
- name: Increased Chloride Conductance and Membrane Potential Change in Airway Smooth Muscle
  role: effector
  biological_scale: CELLULAR
  description: >-
    Potentiation of the ligand-gated chloride channel raises chloride conductance across the airway
    smooth muscle plasma membrane and changes the membrane potential, which reduces calcium influx.
    This is the module's transducer step. What is measured directly in airway smooth muscle is the
    increase in GABA-activated chloride current and a membrane-potential-dependent inhibition of
    calcium influx; the general principle that membrane hyperpolarisation favours airway smooth
    muscle relaxation is carried as background rather than as a measurement of the direction of the
    potential change in this tissue.
  biological_processes:

- name: "Loss of Histamine-Driven Adenylate Cyclase and cAMP Signalling in the Parietal Cell"
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Histamine's stimulatory effect on the parietal cell runs through activation of adenylate cyclase
    and generation of cAMP, so occupying H2 removes that second-messenger arm. The gastrin and
    acetylcholine inputs are not removed with it: they act through cytosolic calcium, which is why
    this node is a loss of one of three convergent inputs rather than a shutdown of parietal-cell
    stimulation, and why the acid suppression downstream is partial.

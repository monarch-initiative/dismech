- name: "H2 Receptor Antagonist Occupancy"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    An H2-receptor antagonist binds the histamine H2 receptor on the gastric parietal cell and
    competes with histamine for it. The cited review classes the agents as competitive antagonists
    at a stimulatory receptor, which is the mechanistic claim this node makes: they occupy the
    receptor rather than inhibiting the terminal pump, and that is what separates the class from the
    proton-pump inhibitors and what makes the downstream chain surmountable by raised histamine
    drive.

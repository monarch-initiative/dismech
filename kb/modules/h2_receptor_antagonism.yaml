- name: "Reduced H+/K+-ATPase-Mediated Gastric Acid Secretion"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    All three stimulatory pathways converge on the H+/K+-ATPase, the proton pump at the parietal
    cell's luminal surface, so removing the histamine arm lowers the pump's activity and with it
    acid output. This is the module's key conformance target. Because the pump itself is untouched
    and still driven by calcium-mediated inputs, the suppression is incomplete by construction --
    the mechanistic basis for both the tolerance and the nocturnal breakthrough recorded downstream.

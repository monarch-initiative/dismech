treatments:
- name: "H2 Receptor Antagonist Therapy"
  description: >-
    Famotidine and cimetidine, given to suppress gastric acid secretion in peptic ulcer disease and
    reflux disease. Ranitidine, which the cited 1992 review lists alongside them as first-line, is
    not bound as an agent here: NDMA contamination of ranitidine products led to recalls and
    registration suspensions. That is a contaminant and manufacturing matter rather than a
    consequence of H2 blockade, so it is recorded here and not as a mechanism node.

name: H2 Receptor Antagonism Module
description: "Pharmacological blockade of the histamine H2 receptor by the H2-receptor antagonist class, and the parietal-cell chain it interrupts. Histamine acting at H2 on the gastric parietal cell raises cAMP through adenylate cyclase; that signal, together with the gastrin and acetylcholine pathways, converges on the H+/K+-ATPase that pumps acid into the lumen. An H2 antagonist competes with histamine for the receptor, so it removes the cAMP arm and lowers acid secretion, which raises intragastric pH and lets acid-mediated mucosal injury heal. The key conformance target is the central effector, \"Reduced H+/K+-ATPase-Mediated Gastric Acid Secretion\". A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"H2 Receptor Antagonist Occupancy\", which represents the drug's receptor occupancy rather than the state it produces. Scope: H2 only. H1 antagonism belongs to a separate module, h1_receptor_antagonism, by the project rule that one receptor family plus one direction of pharmacological action makes one module -- a different receptor, on a different cell, with a disjoint effector chain and a disjoint set of conformers. That module is curated alongside this one and may land before or after it, so check kb/modules/ rather than assuming it is present. The class is also distinguished from the proton-pump inhibitors, which block the same terminal pump non-competitively and are not this module: the H2RA mechanism is upstream of the pump, which is why tolerance and nocturnal breakthrough are properties of this module and not of theirs."
category: Module
module_categories:
- PHARMACOLOGY
creation_date: '2026-10-26T17:20:00Z'
notes: "This module names a transducer: the cited review states that histamine's effect on the parietal cell is mediated by activation of adenylate cyclase and generation of cAMP, so GO:0007189 and GO:0006171 are bound on it. The sibling module h1_receptor_antagonism binds none, because no abstract cited there states the H1 receptor's coupling. The asymmetry is in the available sources, not in the two receptors' biology being differently well understood. The effector chain is graded INDIRECT on the Shamburek and Schubert review throughout: that review describes what histamine does at the receptor and what the antagonists are, not a measurement of the blocked state, so the step from occupancy to reduced secretion is an inference from the unblocked chain. The tolerance node is the exception and is DIRECT, because its source measured the diminishing antisecretory effect itself. Ranitidine is not bound among the therapeutic agents although the 1992 review names it as first-line, because NDMA contamination led to recalls and registration suspensions; that is a manufacturing and chemistry matter rather than a consequence of H2 blockade, so it is cited on the treatment and is not a pathograph node. Nizatidine is likewise unbound: CHEBI:7601 exists, so the omission is a deliberate silence rather than a missing lookup, but no source cited here establishes its current availability. The tolerance evidence carries its own negative half, quoted rather than dropped: duodenal ulcer patients do not develop significant tolerance on the sparse data available, so the node is scoped to the healthy-volunteer finding and to diseases needing tight acidity control, which is where the cited source puts it. Three entries bundle an H1 and an H2 antihistamine into a single treatment (Mast_Cell_Activation_Syndrome, with cetirizine and famotidine together; Maculopapular_Cutaneous_Mastocytosis; and the related systemic mastocytosis entries). None can be routed to this module's occupancy node, or to the H1 module's, without asserting one receptor's action for the other receptor's drug. Splitting those treatments is the prerequisite for conforming them, and it is a change to those entries rather than to either module."

  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    The class is generally well tolerated, but the cited review records CNS, cardiac and endocrine
    effects, together with interference in the absorption, metabolism and elimination of other
    drugs. No mechanism is asserted for any of them: the review names the effects without stating
    how they arise, and the interaction effects in particular are a pharmacokinetic property of
    individual agents rather than a consequence of H2 blockade. The node hangs off the trigger
    because what is sourced is that taking these drugs produces these effects.

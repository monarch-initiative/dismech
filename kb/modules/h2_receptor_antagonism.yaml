discussions:
- discussion_id: h2ra_tolerance_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does the antisecretory effect of an H2-receptor antagonist diminish on
    repeated dosing, and why do patients with duodenal ulcer disease appear not to show it?
  attaches_to:
  - "pathophysiology#Tolerance to the Antisecretory Effect on Repeated Dosing"
  rationale: >-
    The cited overview establishes that tolerance occurs and states outright that the mechanisms
    implicated in its development remain unclear. It is a genuine biological unknown rather than an
    uncurated fact: the measurements exist and agree that the effect diminishes, and no mechanism
    has been identified for it. It matters to this module because tolerance is the property that
    distinguishes this mechanism from proton-pump inhibition, and because the same source reports
    that duodenal ulcer patients do not develop significant tolerance -- so whatever the mechanism
    is, it is either absent or compensated in that group, which a candidate explanation has to
    account for. Receptor downregulation and the secondary hypergastrinemia that follows acid
    suppression are both available as hypotheses; neither is established by any source cited here,
    so neither is asserted as a node.
  proposed_experiments:
  - experiment_id: h2ra_tolerance_receptor_and_gastrin_timecourse
    name: "Parallel receptor-density and gastrin time-course during H2 antagonist dosing in volunteers and duodenal ulcer patients"
    description: >-
      Dose healthy volunteers and duodenal ulcer patients with a fixed H2-receptor antagonist
      regimen and measure, on the same schedule in both groups, the antisecretory effect,
      parietal-cell H2 receptor density and coupling, and integrated plasma gastrin. A mechanism
      that explains tolerance has to track the loss of effect in the volunteers and also account for
      its reported absence in the ulcer patients, so running both arms on one protocol is what
      distinguishes receptor downregulation from gastrin-driven compensation rather than measuring
      either alone.

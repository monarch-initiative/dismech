- name: "Raised Intragastric pH and Healing of Acid-Mediated Mucosal Injury"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Lower acid output raises intragastric pH, which is the therapeutic endpoint: it allows
    acid-mediated mucosal injury to heal and relieves the symptoms that follow from acid exposure.
    The cited review records the class as first-line therapy for peptic ulcer disease and effective
    at preventing relapse, which is the clinical form of this claim at the time it was written.
  evidence:
  - reference: PMID:1355465
    reference_title: "Control of gastric acid secretion. Histamine H2-receptor antagonists and H+K(+)-ATPase inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "The histamine H2-receptor antagonists (cimetidine, ranitidine, famotidine, and nizatidine) continue as first-line therapy for peptic ulcer disease and are effective in preventing relapse."
    explanation: "The clinical outcome this node records. The sentence's 1992 agent list includes ranitidine, which the treatment's own evidence addresses; the claim used here is the healing and relapse-prevention effect, not the roster."
  - reference: PMID:12698865
    reference_title: "Therapeutic approaches to reflux disease, focusing on acid secretion."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Proton pump inhibitors (PPIs) and histamine H2 receptor antagonists (H2RAs) are two major acid-suppressing drugs used for the treatment of GERD."
    explanation: "Extends the outcome beyond peptic ulcer to reflux disease, which is where this module's conformer sits."
- name: "Tolerance to the Antisecretory Effect on Repeated Dosing"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    The antisecretory effect diminishes with repeated oral dosing, which is established in healthy
    volunteers and is the class's characteristic limitation. The cited overview is careful about its
    scope and so is this node: patients with duodenal ulcer disease do not develop significant
    tolerance on the sparse data available, so the finding bears on diseases that need tight control
    of acidity rather than on ulcer healing. The mechanism is not known, which is recorded as a
    knowledge gap rather than filled in.
  evidence:
  - reference: PMID:1363254
    reference_title: "Tolerance during dosing with H2-receptor antagonists. An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diminution of antisecretory effect of H2-receptor antagonists with repeated oral dosing, termed tolerance, has been established in healthy volunteers."
    explanation: "The node's claim, measured rather than inferred, which is why this is the one DIRECT step in the chain. Graded HUMAN_CLINICAL because the finding it synthesises is a human volunteer measurement."
  - reference: PMID:1363254
    reference_title: "Tolerance during dosing with H2-receptor antagonists. An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with duodenal ulcer disease, however, do not develop significant tolerance, according to the sparse investigations available."
    explanation: "The negative half of the same source, quoted so the node is not read as a general claim about every indication. It is what scopes tolerance to diseases needing tight acidity control."
- name: "Nocturnal Acid Breakthrough Addressed by Adding an H2 Antagonist to a Proton Pump Inhibitor"
  role: effector
  biological_scale: ORGANISM
  description: >-
    In Helicobacter pylori-negative high-grade reflux disease with resistance to a proton pump
    inhibitor, intragastric pH may still fall overnight on the inhibitor, and adding an H2
    antagonist can control that, at least over the short term. The population is the narrow one the
    cited review names and not patients on a proton pump inhibitor generally. The node is in this
    module because the mechanism is this module's: the H2RA removes the histamine arm upstream of
    the pump, which is a different point of attack from the pump inhibitor and so is not redundant
    with it. Its parent is the trigger rather than the acid-secretion effector, because the claim is
    about what adding the drug achieves in a patient already on another agent, not about a further
    reduction of the same node.

name: Intracellular Pathogen Persistence Module
description: >-
  A conserved antibacterial lifestyle-gating module representing the intracellular
  niche occupied by obligate and facultative intracellular bacteria (e.g.
  Rickettsia, Bartonella, Brucella, Coxiella, Legionella, Chlamydia,
  Mycobacterium, intracellular phases of others). Unlike the cell-wall and
  protein-synthesis modules, the nodes here are not a single drug target but a
  pharmacokinetic gating principle: the pathogen resides inside host cells where
  hydrophilic, poorly cell-penetrant antibiotics — chiefly the beta-lactams —
  cannot accumulate, so they fail regardless of intrinsic susceptibility.
  Effective therapy requires agents that concentrate intracellularly: tetracyclines
  (doxycycline), macrolides, fluoroquinolones, and rifamycins. This module
  encodes WHY drug choice for intracellular infections departs from "any
  bactericidal antibiotic" and complements the target-based modules: a conforming
  disease may inhibit a ribosomal or cell-wall target, but only with a drug that
  first reaches the intracellular compartment. Two further nodes qualify that
  rule. Penetration is necessary and not sufficient, because which subcellular
  compartment the organism occupies decides whether an agent that arrives is
  still active there - doxycycline reaches Coxiella burnetii in its acidified
  phagolysosome and is not bactericidal at that pH, which is why chronic Q fever
  is treated with a lysosomotropic adjuvant rather than a different antibiotic.
  And the niche supports slow replication, which sets treatment durations of 18
  to 24 months, so in this module duration is a mechanistic claim rather than a
  dosing detail. A KNOWLEDGE_GAP records that the accumulation-efficacy
  correlation the therapeutic node rests on is not a rule, so an entry should not
  infer from accumulation alone that an untried agent will work.
category: Module
module_categories:
- PHARMACOLOGY
- INFECTIOUS_DISEASE
creation_date: "2026-06-20T00:00:00Z"
notes: >-
  This is an antibacterial drug-mechanism (lifestyle-gating) module, not a
  specific disease. Disorder entries for intracellular bacterial infections
  reference nodes via conforms_to (e.g.,
  "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
  Exclusion"), and their treatments point at the cell-penetrant requirement node
  via target_mechanisms. Key conformance / treatment target: "Requirement for
  Cell-Penetrant Antimicrobials" (the doxycycline/macrolide/fluoroquinolone/
  rifamycin rationale). The nodes are gating principles, not enzyme targets; a
  conforming disease typically ALSO conforms to a target-based module
  (ribosome/cell wall) for the drug's molecular mechanism, with this module
  explaining the penetration constraint on which agents qualify. A conforming
  entry should say which subcellular compartment its organism occupies -
  cytosol, remodelled non-acidified vacuole, or acidified phagolysosome -
  because that is what decides whether the vacuolar-pH node adds a constraint
  for it. Worked compartment cases: Coxiella burnetii for the acidified
  phagolysosome, Mycobacterium tuberculosis for an organism spread across
  several compartments at once.
pathophysiology:
- name: Intracellular Niche and Beta-Lactam Exclusion
  description: >-
    Obligate and facultative intracellular bacteria invade and persist within
    host cells (phagocytes, endothelium, epithelium), where they are shielded
    from antibodies, complement, and — critically for therapy — from antibiotics
    that cannot cross or accumulate within the eukaryotic cell membrane. The
    beta-lactams are the paradigm case: they diffuse poorly into and do not
    concentrate within host cells, so they are ineffective against intracellular
    pathogens even when the organism is susceptible in vitro. This is the gating
    principle that excludes cell-wall-active therapy for this class of infection.
  role: intrinsic_resistance
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:18611821
    reference_title: "Intracellular organisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.
    explanation: >-
      Review of intracellular organisms stating that the intracellular niche
      confers resistance to poorly cell-penetrant antibiotics such as
      beta-lactams. Evidence source is OTHER as this is a review article.
  downstream:
  - target: Subcellular Compartment and Vacuolar pH Gate Drug Activity
    description: >-
      Which compartment of the host cell the organism occupies decides whether a
      cell-penetrant drug is also active once it arrives, so the niche is not one
      niche.
  - target: Slow Intracellular Replication and Prolonged Therapy
    description: >-
      The same shielded compartment that excludes the drug also supports slow
      replication, which sets the duration of therapy independently of which
      agent is chosen.
  - target: Requirement for Cell-Penetrant Antimicrobials
    description: >-
      Because the niche excludes poorly penetrant drugs, effective therapy is
      restricted to agents that accumulate intracellularly.

- name: Subcellular Compartment and Vacuolar pH Gate Drug Activity
  description: >-
    The module's first node treats the host cell as one compartment, which is
    the approximation that fails in practice. An organism may sit in the cytosol,
    in a remodelled non-acidified vacuole, or in a fully acidified
    phagolysosome, and the last of those imposes a second constraint beyond
    penetration: Coxiella burnetii replicates in a phagolysosome at a pH near
    4.5, where doxycycline reaches the organism but loses bactericidal activity,
    so monotherapy suppresses rather than cures and relapse after years of
    treatment was the historical norm. The remedy acts on the compartment rather
    than on the bacterium — hydroxychloroquine is lysosomotropic and raises the
    vacuolar pH, restoring doxycycline's bactericidal activity, which is why
    chronic Q fever is treated with the pair and not with the tetracycline
    alone. Mycobacterium tuberculosis makes the general form of the point by
    occupying several heterogeneous compartments at once, so an antitubercular
    agent must cross several membranes to reach all of its target populations.
    A conforming entry should therefore say which compartment its organism
    occupies, because that is what decides whether this node adds a constraint
    or not.
  role: intrinsic_resistance
  biological_processes:
  - preferred_term: Phagolysosomal lumen acidification
    term:
      id: GO:0007042
      label: lysosomal lumen acidification
  evidence:
  - reference: PMID:24073941
    reference_title: "Antimicrobial therapies for Q fever."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The low pH in the intracellular compartments could reduce the efficacy of
      the drugs and prevent bactericidal activity
    explanation: >-
      States this node's claim: compartment pH, not penetration, is the second
      gate. Graded OTHER as the source is a review.
  - reference: PMID:24073941
    reference_title: "Antimicrobial therapies for Q fever."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The hydroxyl derivative of chloroquine will also raise the pH of lysosomal
      compartments and allow doxycycline to have bactericidal activity against
      C. burnetii.
    explanation: >-
      Supports the remedy acting on the host compartment rather than on the
      organism, which is what makes hydroxychloroquine an antibacterial adjuvant
      here despite having no antibacterial target of its own.
  - reference: PMID:37709598
    reference_title: "Host cell environments and antibiotic efficacy in tuberculosis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, TB chemotherapy requires antibiotics crossing multiple
      biological membranes to reach distinct subcellular compartments and target
      these bacterial populations.
    explanation: >-
      Generalises the node beyond the Q fever case: where an organism occupies
      several compartments, reaching one of them is not reaching the organism.
  downstream:
  - target: Requirement for Cell-Penetrant Antimicrobials
    description: >-
      Penetration is necessary but not sufficient — the agent that qualifies
      must also retain activity in the compartment it reaches, or be paired with
      something that changes the compartment.

- name: Slow Intracellular Replication and Prolonged Therapy
  description: >-
    Inside the niche the organism replicates slowly, and the clinical
    consequence is a treatment duration unlike anything extracellular infection
    requires. Chronic Q fever is the documented extreme: 18 months of
    doxycycline with hydroxychloroquine for a native valve and 24 for a
    prosthetic one, which is among the longest regimens used for any bacterial
    infection, and that figure is already the shortened one — before
    hydroxychloroquine was added, treatment ran to five years and relapses were
    still common. This node is why a conforming entry's treatment duration is a
    mechanistic claim rather than a dosing detail, and why apparent treatment
    failure in an intracellular infection is more often insufficient duration
    than acquired resistance.
  role: consequence
  biological_processes:
  - preferred_term: Bacterial replication within the host cell
    term:
      id: GO:0040007
      label: growth
    modifier: DECREASED
  evidence:
  - reference: PMID:24073941
    reference_title: "Antimicrobial therapies for Q fever."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      C. burnetii is taken up through the endocytic pathway and remains in an
      acidic vacuole where it replicates slowly
    explanation: >-
      Establishes the slow-replication premise of this node, in the same
      compartment the upstream pH node describes.
  - reference: PMID:24073941
    reference_title: "Antimicrobial therapies for Q fever."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the treatment recommendation of antimicrobial therapy for at least 18
      months is one of the longest treatment regimens used for a bacterial
      infection
    explanation: >-
      Quantifies the consequence and states its standing relative to bacterial
      therapy generally, which is the point of recording it as a node rather
      than as a dosing note on a treatment.
  - reference: PMID:24073941
    reference_title: "Antimicrobial therapies for Q fever."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The usage of doxycycline plus hydroxychloroquine has reduced the time of
      treatment in chronic Q fever patients to 18 months for those with native
      heart valves and 24 months for patients with prosthetic valves.
    explanation: >-
      Ties this node to the upstream pH node: correcting the compartment
      shortened the regimen, so the duration tracks the mechanism rather than
      being fixed by the organism.

- name: Requirement for Cell-Penetrant Antimicrobials
  description: >-
    Therapeutic efficacy against intracellular bacteria tracks the intracellular
    concentration the drug achieves, not just its in vitro MIC. Tetracyclines
    (doxycycline), macrolides, fluoroquinolones, and rifamycins accumulate within
    host cells and are therefore the mainstays for rickettsioses, bartonelloses,
    brucellosis, Q fever, Legionella and Mycoplasma pneumonia, and chlamydial
    infection. This node is the cell-penetrant-drug requirement that conforming
    intracellular-infection treatments target; the drug's molecular target
    (usually the ribosome) is captured by the relevant target-based module.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    reference_title: "Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Review of intracellular antibacterial pharmacokinetics establishing that
      efficacy against intracellular pathogens depends on the intracellular
      concentration achieved — the cell-penetrant requirement this node
      represents. Evidence source is OTHER as this is a review article.

discussions:
- discussion_id: gap_intracellular_accumulation_versus_activity
  prompt: >-
    Does the intracellular concentration a drug achieves predict its activity
    against the organism in that cell, and if not, what else has to be known
    before a cell-penetrant agent can be chosen on mechanism rather than by
    precedent?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Requirement for Cell-Penetrant Antimicrobials
  rationale: >-
    This module's therapeutic node is built on the correlation between
    intracellular concentration and efficacy, and that correlation is real. It
    is also not a rule: the cellular pharmacology literature states outright
    that equating accumulation with activity is incorrect, and the
    acidified-vacuole node upstream is one worked reason why - doxycycline
    accumulates and is still not bactericidal at pH 4.5. The aminoglycosides are the mirror
    case, where accumulation predicts organ toxicity rather than cure. What is
    missing is any account of which further determinants matter and in what
    order, so the choice of a cell-penetrant agent for a given organism and
    compartment still rests on clinical precedent. The practical consequence for
    this module is that a conforming entry may cite accumulation in support of
    an agent, but should not infer from accumulation alone that an untried agent
    will work.
  evidence:
  - reference: PMID:14711080
    reference_title: "Intracellular pharmacodynamics of antibiotics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Simple rules, such as equating accumulation and activity, are certainly
      incorrect, and other determinants need to be added to the equation.
    explanation: >-
      States the gap in the field's own terms, and is the sentence that stops
      this module's therapeutic node being read as a sufficient criterion.
  - reference: PMID:14711080
    reference_title: "Intracellular pharmacodynamics of antibiotics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Finally, this article emphasizes the fact that much remains to be done in
      this area before rational therapeutic choices can be made.
    explanation: >-
      Establishes that the gap is open rather than merely unsummarised, which is
      what distinguishes a KNOWLEDGE_GAP here from a curation shortfall.
  - reference: PMID:28639230
    reference_title: "Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Additionally, intracellular accumulation of antibacterials was correlated
      with the possibility of causing organ-specific toxicity, as in the case of
      aminoglycosides in regard to the risk of nephrotoxicity.
    explanation: >-
      The mirror case: the same review that establishes the accumulation-efficacy
      correlation this module relies on also reports accumulation predicting
      toxicity. Recorded as INDIRECT because it bears on the gap by showing
      accumulation has more than one consequence, rather than by testing the
      accumulation-activity link itself.

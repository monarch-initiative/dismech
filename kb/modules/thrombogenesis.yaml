name: Thrombogenesis Module
description: >-
  A conserved pathophysiology module representing the formation of a thrombus -
  the pathological intravascular clot that recurs across venous thromboembolism
  (deep vein thrombosis, pulmonary embolism), arterial thrombosis (myocardial
  infarction, ischemic stroke), cancer-associated thrombosis, antiphospholipid
  syndrome, and immobilization. Thrombosis is driven by Virchow's triad -
  endothelial injury, blood stasis, and hypercoagulability. These predisposing
  states promote platelet adhesion, activation, and aggregation at the vessel
  wall while simultaneously activating the coagulation cascade: tissue factor
  triggers thrombin generation, and thrombin cleaves fibrinogen into a
  crosslinked, insoluble fibrin network. Fibrin and aggregated platelets
  assemble into a thrombus that propagates and occludes the vessel; fragments may
  embolize downstream. The occlusion and embolization cause ischemic tissue
  injury and thromboembolic disease. The module captures the shared core across
  venous and arterial thrombotic disorders. Conforming disorder nodes substitute
  the disease-specific dominant limb of Virchow's triad (venous stasis in
  immobilization, endothelial injury/plaque rupture in arterial thrombosis, a
  hypercoagulable state in cancer, thrombophilia, or antiphospholipid syndrome)
  while preserving the triad -> platelet activation -> coagulation/fibrin ->
  thrombus propagation/occlusion -> thromboembolism causal chain.
category: Module
creation_date: "2026-07-14T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is a pathological
  structure-formation ("Xogenesis") module. Xogenesis anchor: the terminal
  output is a thrombus, an OGMS:0000078 pathological anatomical structure
  produced by an OGMS:0000081 pathological derivation (a new intravascular
  formation); process genus OGMS:0000061 pathological bodily process; site
  UBERON:0001981 blood vessel. MPATH represents the process as MPATH:125
  (thrombosis) but has no distinct "thrombus" continuant class, an OBO gap noted
  for upstream contribution. SNOMED "Morphologically abnormal structure"
  (49755003) is used only as an external census/gap guide and is not bound here.
  Disorder entries reference individual nodes via conforms_to (for example,
  "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin
  Formation"). The module defines the expected pathophysiology structure;
  conforming nodes in disorder files should include the corresponding cell
  types, biological processes, and causal edges, specialized to their disease
  context. Key disease-specific substitutions: venous thromboembolism
  substitutes stasis (immobilization) as the dominant trigger; arterial
  thrombosis substitutes endothelial injury / atherosclerotic plaque rupture and
  a platelet-rich white thrombus; cancer-associated and antiphospholipid
  thrombosis substitute a systemic hypercoagulable state. Modules bind GO and CL
  terms only and do not use chemical (CHEBI) or disease (MONDO) term bindings,
  except in the treatments block where the therapeutic agent carries an ontology
  identifier per the treatment schema.
pathophysiology:
- name: Virchow's Triad - Endothelial Injury, Stasis, Hypercoagulability
  description: >-
    The proximal trigger of thrombosis is Virchow's triad: endothelial injury,
    blood stasis, and a hypercoagulable (prothrombotic) state, arising singly or
    in combination. Endothelial injury exposes subendothelial matrix and tissue
    factor; stasis prevents dilution and clearance of activated clotting factors;
    hypercoagulability shifts the balance of pro- and anti-thrombotic factors
    toward clot formation. Which limb dominates differs by disorder, but the
    prothrombotic state they create is the shared upstream condition for thrombus
    formation.
  role: trigger
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:33276943
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Malignancy itself induces a thrombophilic state by increasing the risk of
      venous stasis, endothelial injury and an imbalance of pro and
      anti-thrombotic factors leading to a hypercoaguable state.
    explanation: >-
      Directly enumerates Virchow's triad (venous stasis, endothelial injury,
      and an imbalance of pro/anti-thrombotic factors producing a hypercoagulable
      state) as the drivers of thrombus formation, the trigger of this module.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Platelet Adhesion, Activation, and Aggregation
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
- name: Platelet Adhesion, Activation, and Aggregation
  description: >-
    At the site of endothelial injury or prothrombotic activation, circulating
    platelets adhere to exposed subendothelial matrix, become activated, secrete
    their granule contents, and aggregate with one another. Platelet activation
    both builds the cellular mass of the thrombus and provides the negatively
    charged phospholipid surface on which coagulation reactions are amplified,
    coupling the platelet arm to the coagulation arm of thrombus formation.
  role: amplifier
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: INCREASED
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: INCREASED
  evidence:
  - reference: PMID:17635703
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thrombus formation, including platelet adhesion, activation, secretion and
      aggregation as well as tissue factor-initiated thrombin generation and
      fibrin formation, has been studied in the past using in vitro systems,
      often with isolated components.
    explanation: >-
      Enumerates platelet adhesion, activation, secretion, and aggregation
      alongside tissue-factor-initiated thrombin and fibrin formation as the
      components of thrombus formation, supporting the platelet-activation
      amplifier and its coupling to coagulation. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
- name: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
  description: >-
    The rate-limiting central effector of thrombogenesis. Tissue factor exposed
    by injury forms the extrinsic tenase complex, driving assembly of the
    prothrombinase complex (FXa-FVa) that converts prothrombin to thrombin;
    intrinsic tenase amplifies thrombin generation on the activated platelet
    surface. Thrombin then cleaves fibrinogen into fibrin monomers that
    polymerize and crosslink into an insoluble fibrin network. This
    thrombin-driven fibrin formation is the disorder-agnostic convergence step
    that solidifies the thrombus and is the key conformance target of the module.
  role: central_effector
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  - preferred_term: fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:39466528
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thrombin cleaves fibrinogen into one fibrin monomer and two
      fibrinopeptides. Fibrin monomers aggregate, crosslink, and branch into an
      insoluble fibrin network structure.
    explanation: >-
      Describes thrombin cleaving fibrinogen and fibrin monomers crosslinking
      into an insoluble network, the central effector that solidifies the
      thrombus. Evidence source is OTHER because this is a review.
  - reference: PMID:39466528
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FXa-FVa forms a prothrombinase complex that converts prothrombin into
      thrombin.
    explanation: >-
      Identifies the prothrombinase complex converting prothrombin to thrombin,
      the coagulation step upstream of fibrin formation at this node. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Fibrin-Platelet Thrombus Propagation and Vascular Occlusion
- name: Fibrin-Platelet Thrombus Propagation and Vascular Occlusion
  description: >-
    The crosslinked fibrin network and aggregated platelets assemble into a
    thrombus that grows and propagates along the vessel, progressively narrowing
    and then occluding the lumen. The thrombus is the pathological intravascular
    structure produced by the module; its growth converts a localized clot into a
    flow-limiting obstruction.
  role: effector
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:39466528
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fibrin monomers aggregate, crosslink, and branch into an insoluble fibrin
      network structure.
    explanation: >-
      The insoluble crosslinked fibrin network is the structural scaffold of the
      propagating thrombus at this effector node. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Thromboembolism and Ischemic Tissue Injury
- name: Thromboembolism and Ischemic Tissue Injury
  description: >-
    The clinical end state of the module. An occlusive thrombus obstructs blood
    flow and causes downstream ischemic tissue injury (myocardial infarction,
    stroke, limb ischemia); alternatively, the thrombus or a fragment detaches
    and embolizes, lodging in a distant vessel (pulmonary embolism from a
    deep-vein thrombus). Venous thromboembolism is a common, prognostically
    important complication and the consequence of the conserved thrombogenesis
    chain.
  role: consequence
  evidence:
  - reference: PMID:33276943
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Venous thromboembolism (VTE) is a common complication in patients with
      cancer and portends a poor prognosis.
    explanation: >-
      Establishes venous thromboembolism as a common, prognostically serious
      clinical outcome, the consequence of the thrombogenesis chain. Evidence
      source is OTHER because this is a review.
treatments:
- name: Anticoagulation (Factor Xa / Thrombin Inhibition)
  description: >-
    Anticoagulants blunt thrombus formation by inhibiting the coagulation
    cascade. Direct oral anticoagulants act on the central effector directly:
    factor Xa inhibitors (e.g., rivaroxaban, apixaban) block prothrombinase-driven
    thrombin generation, and direct thrombin inhibitors block thrombin itself,
    preventing fibrin formation and thrombus growth. Represents the thrombogenesis
    drug-target design pattern for conforming disorders, acting on the
    coagulation/thrombin node rather than on the established clot.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
  target_mechanisms:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    treatment_effect: INHIBITS
    description: >-
      Factor Xa or thrombin inhibition suppresses prothrombinase-driven thrombin
      generation and fibrin formation, blocking the central effector that
      solidifies and propagates the thrombus.
  evidence:
  - reference: PMID:35869411
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Considering the mechanism underlying coagulation, it may be more efficient
      to inhibit the upstream coagulation FXa than thrombin.
    explanation: >-
      Frames factor Xa and thrombin as the anticoagulant drug targets within the
      coagulation cascade, the central effector node this treatment inhibits.
      Evidence source is OTHER because this is a review.

name: Thrombogenesis Module
description: >-
  A conserved pathophysiology module representing conventional
  platelet-assisted, thrombin/fibrin thrombogenesis across venous and arterial
  thrombotic disorders. One or more Virchow-triad conditions - vessel-wall
  perturbation, altered or stagnant blood flow, and hypercoagulability - can
  create the prothrombotic context. Platelet adhesion, activation, secretion,
  and aggregation participate alongside tissue-factor-initiated thrombin
  generation and fibrin formation. The evidence used here does not establish a
  fixed platelet contribution, thrombus composition, or sequence across
  arterial and venous settings, so those features remain disease-specific. The
  defining output is pathological intravascular fibrin-platelet thrombus
  formation. A formed thrombus may remain nonocclusive or may later grow and
  obstruct local blood flow. If obstruction compromises tissue perfusion,
  ischemic injury can follow as a conditional, site-dependent consequence. A
  venous thrombus may instead dislodge and travel to the pulmonary arteries;
  this narrowly evidenced embolic branch is separate from local ischemic injury.
  None of occlusion, ischemia, or embolization is required for conformance.
  Conformance is branch- and node-qualified: disorder entries map only the
  stages their evidence directly represents and do not imply the entire module
  chain from a downstream match.
category: Module
creation_date: "2026-07-14T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is a pathological
  structure-formation ("Xogenesis") module. Xogenesis anchor: the terminal
  output is a thrombus, an OGMS:0000078 pathological anatomical structure
  produced by an OGMS:0000081 pathological derivation (a new intravascular
  formation); process genus OGMS:0000061 pathological bodily process; site
  UBERON:0001981 blood vessel. MPATH represents the process as MPATH:125
  (thrombosis) but has no distinct "thrombus" continuant class, an OBO gap noted
  for upstream contribution. SNOMED "Morphologically abnormal structure"
  (49755003) is used only as an external census/gap guide and is not bound here.
  Disorder entries reference individual nodes via conforms_to (for example,
  "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin
  Formation"). The module defines the expected pathophysiology structure;
  conforming nodes in disorder files should include the corresponding cell
  types, biological processes, and causal edges, specialized to their disease
  context. Operational conformance boundary: a disease branch is in scope when
  it directly represents pathological intravascular formation of a
  platelet-assisted, thrombin-generated fibrin thrombus. That formed
  fibrin-platelet thrombus is necessary and sufficient for branch-level
  qualification, but each conforms_to assertion remains local to the stage
  actually modeled. This is an operational curation boundary, not a formal
  Grouping criteria assertion. A Virchow-triad context, a separately represented
  platelet amplifier, and local occlusion, ischemic injury, or venous
  embolization are not all required as separate nodes. Conversely, ischemia,
  infarction, vessel
  occlusion, or embolism alone is not sufficient to infer thrombogenesis. The
  module evidence identifies platelet processes and thrombin/fibrin formation as
  interacting components but does not license fixed arterial-versus-venous
  composition or platelet dominance; conformers must specialize their relative
  contribution using disease-specific evidence.
  Physiologic hemostatic plugs, nonthrombotic emboli or occlusions, and
  VWF-platelet microangiopathy such as thrombotic thrombocytopenic purpura are out
  of scope unless a distinct conventional thrombin/fibrin thrombosis branch is
  explicitly evidenced. Key disease-specific substitutions include venous
  stasis in immobilization, arterial plaque disruption, and systemic
  hypercoagulability in cancer, thrombophilia, or thrombotic antiphospholipid
  syndrome. The module's treatment is a mechanistic target pattern, not an
  inherited treatment recommendation; agent selection and contraindications
  remain disease-specific. Pathophysiology nodes bind GO biological processes,
  CL cell types, and, where needed, UBERON anatomy; they do not bind CHEBI
  chemicals or MONDO diseases. The treatments block may bind a therapeutic agent
  per the treatment schema.
pathophysiology:
- name: Virchow-Triad Prothrombotic Context
  description: >-
    An optional upstream context in which one or more of vessel-wall
    perturbation, altered or stagnant blood flow, and hypercoagulability
    predisposes to thrombosis. The dominant limb and its concrete cells and
    processes are disease-specific. This generic context node intentionally has
    no endothelial-cell or coagulation-process binding; those belong on a
    specialized disease trigger or the downstream coagulation node when directly
    evidenced.
  role: trigger
  evidence:
  - reference: PMID:33276943
    reference_title: "Cancer and thrombosis: new insights to an old problem."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Malignancy itself induces a thrombophilic state by increasing the risk of
      venous stasis, endothelial injury and an imbalance of pro and
      anti-thrombotic factors leading to a hypercoaguable state.
    explanation: >-
      This cancer-specific review directly enumerates venous stasis, endothelial
      injury, and a pro-/antithrombotic imbalance as one disease example of the
      three-part context. It provides only partial support for this generic,
      optional module node and does not establish that every branch contains all
      three conditions. Evidence source is OTHER because this is a review.
  downstream:
  - target: Platelet Adhesion, Activation, and Aggregation
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
- name: Platelet Adhesion, Activation, and Aggregation
  description: >-
    Platelet adhesion, activation, secretion, and aggregation participate in
    thrombus formation alongside tissue-factor-initiated thrombin generation and
    fibrin formation. This amplifier node represents platelet participation and
    its interaction with coagulation without asserting a fixed sequence,
    abundance, composition, or dominance in arterial versus venous thrombi.
  role: amplifier
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: INCREASED
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: INCREASED
  evidence:
  - reference: PMID:17635703
    reference_title: "In vivo thrombus formation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thrombus formation, including platelet adhesion, activation, secretion and
      aggregation as well as tissue factor-initiated thrombin generation and
      fibrin formation, has been studied in the past using in vitro systems,
      often with isolated components.
    explanation: >-
      Enumerates platelet adhesion, activation, secretion, and aggregation
      alongside tissue-factor-initiated thrombin and fibrin formation as the
      components of thrombus formation, supporting the platelet-activation
      amplifier and its coupling to coagulation. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
- name: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
  description: >-
    The central coagulation convergence step of thrombogenesis. Tissue factor
    exposed by injury forms the extrinsic tenase complex, driving assembly of
    the prothrombinase complex (FXa-FVa) that converts prothrombin to thrombin;
    intrinsic tenase amplifies thrombin generation on the activated platelet
    surface. Thrombin then cleaves fibrinogen into fibrin monomers that
    polymerize and crosslink into an insoluble fibrin network. This
    thrombin-driven fibrin formation solidifies the thrombus and is the module's
    principal anticoagulant target, without claiming that one universal
    rate-limiting step applies across every arterial and venous context.
  role: central_effector
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  - preferred_term: fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:39466528
    reference_title: "Back to basics: the coagulation pathway."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thrombin cleaves fibrinogen into one fibrin monomer and two
      fibrinopeptides. Fibrin monomers aggregate, crosslink, and branch into an
      insoluble fibrin network structure.
    explanation: >-
      Describes thrombin cleaving fibrinogen and fibrin monomers crosslinking
      into an insoluble network, the central effector that solidifies the
      thrombus. Evidence source is OTHER because this is a review.
  - reference: PMID:39466528
    reference_title: "Back to basics: the coagulation pathway."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FXa-FVa forms a prothrombinase complex that converts prothrombin into
      thrombin.
    explanation: >-
      Identifies the prothrombinase complex converting prothrombin to thrombin,
      the coagulation step upstream of fibrin formation at this node. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Pathological Fibrin-Platelet Thrombus Formation
- name: Pathological Fibrin-Platelet Thrombus Formation
  description: >-
    The crosslinked fibrin network and aggregated platelets assemble into a
    pathological intravascular thrombus, the atomic structure-formation output of
    this Xogenesis module. Subsequent growth, propagation, narrowing, or complete
    vascular occlusion are conditional later states and are not part of the
    defining formation claim.
  role: effector
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:39466528
    reference_title: "Back to basics: the coagulation pathway."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Fibrin monomers aggregate, crosslink, and branch into an insoluble fibrin
      network structure.
    explanation: >-
      The insoluble crosslinked fibrin network supports the fibrin scaffold of
      the formed thrombus but does not alone establish its platelet component;
      the support is therefore partial. Evidence source is OTHER because this is
      a review.
  - reference: DOI:10.1152/japplphysiol.00017.2011
    reference_title: "Thrombosis, physical activity, and acute coronary syndromes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Platelet deposition and activation of the blood coagulation cascade in
      response to plaque disruption lead to the formation of a platelet-fibrin
      thrombus
    explanation: >-
      Directly supports the atomic formation of a platelet-fibrin thrombus in an
      arterial plaque-disruption branch. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Thrombotic Vascular Occlusion and Ischemic Tissue Injury
  - target: Venous Thrombus Embolization to Pulmonary Arteries
- name: Thrombotic Vascular Occlusion and Ischemic Tissue Injury
  description: >-
    A conditional local consequence, distinct from the thrombus formed by the
    Xogenesis module. A formed thrombus may grow and obstruct local blood flow;
    when the affected vessel supplies perfusion-dependent tissue, the obstruction
    can cause ischemia or infarction. Nonocclusive thrombi may cause neither, so
    this consequence is not required for every conforming branch.
  role: consequence
  evidence:
  - reference: DOI:10.1152/japplphysiol.00017.2011
    reference_title: "Thrombosis, physical activity, and acute coronary syndromes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Platelet deposition and activation of the blood coagulation cascade in
      response to plaque disruption lead to the formation of a platelet-fibrin
      thrombus, which can grow rapidly, obstruct coronary blood flow, and cause
      myocardial ischemia and/or infarction.
    explanation: >-
      Directly states that a platelet-fibrin thrombus can obstruct coronary blood
      flow and cause myocardial ischemia or infarction, supporting the local
      occlusion-to-injury arm. Evidence source is OTHER because this is a review.
- name: Venous Thrombus Embolization to Pulmonary Arteries
  description: >-
    A separate, conditional venous consequence in which a formed thrombus
    dislodges and travels to the pulmonary arteries, producing pulmonary
    embolism. This narrow node does not generalize the evidence to arterial
    embolization, every distant vascular bed, or every formed thrombus.
  role: consequence
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: DOI:10.7759/cureus.66555
    reference_title: "Antiphospholipid Syndrome and Catastrophic Antiphospholipid Syndrome: A Comprehensive Review of Pathogenesis, Clinical Features, and Management Strategies"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complications of venous thrombosis include pulmonary embolism (PE), where
      a dislodged thrombus travels to the pulmonary arteries, potentially leading
      to fatal outcomes
    explanation: >-
      Directly supports dislodgement and travel of a venous thrombus to the
      pulmonary arteries. The node is restricted to that pulmonary embolic
      branch because the source does not establish a generic distant-obstruction
      mechanism. Evidence source is OTHER because this is a review.
treatments:
- name: Anticoagulation via Heparin-Potentiated Antithrombin
  description: >-
    Therapeutic heparins potentiate antithrombin-mediated inhibition of thrombin
    and activated coagulation factors, including factor Xa. This is a
    mechanism-level anticoagulation pattern aimed at the coagulation/thrombin
    node rather than a recommendation inherited by conforming disorders. Agent
    or class selection, dose, intensity, duration, bleeding risk, and other
    contraindications must be assessed and evidenced in each disease context.
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
  target_mechanisms:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    treatment_effect: INHIBITS
    description: >-
      Heparin-enhanced antithrombin activity inhibits thrombin and factor Xa,
      suppressing the coagulation reactions that generate and stabilize fibrin.
  evidence:
  - reference: PMID:39466528
    reference_title: "Back to basics: the coagulation pathway."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Antithrombin inhibits thrombin, FXa, FIXa, FXIa, and FXIIa when stimulated
      by physiologic heparan sulfate or pharmacologic heparins.
    explanation: >-
      Directly identifies pharmacologic heparins as enhancers of antithrombin
      inhibition of thrombin and multiple activated coagulation factors,
      including factor Xa. Evidence source is OTHER because this is a review.

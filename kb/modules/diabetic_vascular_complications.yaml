name: Diabetic Vascular Complications Module
description: >-
  A conserved pathophysiology module representing the final-common vascular
  injury pathway shared by all forms of diabetes mellitus, regardless of the
  upstream cause of the hyperglycemia. Sustained elevation of blood glucose is
  the disorder-agnostic driver: it increases mitochondrial superoxide production
  and activates the canonical hyperglycemia-injury pathways (polyol flux,
  advanced glycation end-product/AGE formation and RAGE signaling, protein
  kinase C activation, and hexosamine flux), generating oxidative and glycative
  stress in insulin-independent vascular tissue. This stress converges on the
  endothelium, where the balanced release of vasodilator and vasoconstrictor
  mediators is lost and an inflammatory, prothrombotic vessel-wall phenotype
  develops (endothelial dysfunction and vascular inflammation) — the pivotal,
  disorder-agnostic step of the module. Endothelial injury and inflammation then
  damage both the microvasculature (kidney, retina, nerve) and the
  macrovasculature (accelerated atherosclerosis of the coronary, cerebral and
  peripheral arteries), producing the classic diabetic end-organ complications:
  diabetic kidney disease, retinopathy, neuropathy, and atherosclerotic
  cardiovascular disease. The module captures the shared core across type 1
  (autoimmune), type 2 (insulin-resistant), malnutrition-related/type 5, and the
  monogenic and secondary diabetes forms. Conforming disorder nodes substitute
  the disorder-specific route to chronic hyperglycemia (absolute insulin
  deficiency in type 1, insulin resistance plus beta-cell secretory failure in
  type 2, undernutrition-associated beta-cell impairment in type 5) while
  preserving the chronic hyperglycemia -> oxidative/AGE-RAGE stress ->
  endothelial dysfunction and vascular inflammation -> micro- and macrovascular
  injury -> end-organ complications causal chain.
category: Module
creation_date: "2026-07-25T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It models the conserved
  vascular-complication cascade that is downstream of, and shared by, every
  cause of chronic hyperglycemia; it deliberately does NOT model the
  type-specific routes into hyperglycemia (autoimmune beta-cell destruction,
  insulin resistance, undernutrition beta-cell impairment, monogenic beta-cell
  defects), which stay on the individual disease entries. Diabetes mellitus is
  represented in dismech as a Grouping over the distinct type entries
  (kb/groupings/Diabetes_Mellitus.yaml, owning MONDO:0005015) plus this shared
  mechanism module plus the per-type Disease entries; there is no blended
  umbrella pathophysiology graph. Disorder entries reference individual nodes
  via conforms_to (e.g.,
  "diabetic_vascular_complications#Endothelial Dysfunction and Vascular Inflammation").
  The key conformance target is the Endothelial Dysfunction and Vascular
  Inflammation central-effector node, the rate-limiting convergence point every
  hyperglycemic disorder funnels through. Conforming nodes in disorder files
  should include the corresponding cell types, biological processes, and causal
  edges, specialized to their disease context (e.g., a disease may elaborate the
  renal sub-cascade into glomerular, tubular, and fibrotic nodes, or the
  retinal/neural arms, beneath the module's collapsed Diabetic Microvascular and
  Macrovascular Injury effector). Worked conformers: Type I Diabetes, Type 2
  Diabetes Mellitus, and Malnutrition-Related Diabetes Mellitus each declare a
  conforms_to edge onto the shared cascade. The drug-target design pattern:
  glucose-lowering and cardiorenal-protective therapy (here SGLT2 inhibitors)
  acts upstream on the Chronic Hyperglycemia trigger rather than on the
  downstream structural phenotype, reducing the whole complication cascade.
  Modules bind GO and CL terms only and do not use chemical (CHEBI) or disease
  (MONDO) term bindings; chemistry and disease concepts are described in prose,
  except in the treatments block where the therapeutic agent carries a
  CHEBI/NCIT identifier per the treatment schema.
pathophysiology:
- name: Chronic Hyperglycemia
  description: >-
    The shared, disorder-agnostic trigger. Sustained elevation of blood glucose
    — however it arises (absolute insulin deficiency, insulin resistance with
    beta-cell secretory failure, undernutrition-associated beta-cell impairment,
    or a monogenic beta-cell defect) — establishes the biochemical driver of
    long-term diabetic tissue injury. Because glucose enters insulin-independent
    vascular cells (endothelium, mesangium, Schwann cells, retinal pericytes)
    without downregulation, these cells experience the full intracellular glucose
    load and become the site of complication-initiating stress.
  role: trigger
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32872570
    reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the World Health Organization (WHO) diabetes mellitus is a chronic, metabolic disease characterized by elevated levels of blood glucose, which leads over time to damage to the heart, vasculature, eyes, kidneys and nerves."
    explanation: >-
      Establishes chronic hyperglycemia as the central upstream driver of
      multiorgan diabetic complications (heart, vasculature, eyes, kidneys,
      nerves), the trigger of this module.
  - reference: PMID:32990681
    reference_title: "Canagliflozin extends life span in genetically heterogeneous male but not female mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, the life span benefit of Cana is likely to reflect blunting of
      peak glucose levels, because similar longevity effects are seen in male
      mice given acarbose, a diabetes drug that blocks glucose surges through a
      distinct mechanism
    explanation: >-
      Convergent pharmacological support for glycemic excursion as the
      pathogenic quantity in this trigger node: two drugs that lower postprandial
      glucose by unrelated mechanisms (SGLT2 inhibition and alpha-glucosidase
      inhibition) produce the same survival benefit in non-diabetic
      genetically heterogeneous mice. Extends the node beyond diabetes, since
      these animals are not diabetic. The benefit was male-specific, so this is
      not evidence of a uniform effect. Evidence source is MODEL_ORGANISM
      (UM-HET3 mice, NIA Interventions Testing Program).
  - reference: PMID:30688027
    reference_title: "Acarbose improves health and lifespan in aging HET3 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ACA at 1,000 ppm reduced lung tumors in males, diminished liver
      degeneration in both sexes and glomerulosclerosis in females, reduced
      blood glucose responses to refeeding in males, and improved rotarod
      performance in aging females, but not males.
    explanation: >-
      Ties the glucose-excursion intervention to end-organ pathology in the same
      cohort: acarbose both blunted refeeding glucose responses and reduced
      glomerulosclerosis and liver degeneration, the kind of tissue injury this
      module's downstream nodes model. The endpoints are sex-discordant rather
      than co-occurring, and the snippet should not be read as showing that the
      glucose effect accompanied the renal one: the glucose response was reduced
      in males, glomerulosclerosis was diminished in females, and only liver
      degeneration improved in both sexes. That discordance is the caveat a
      curator should carry forward rather than reading it as general protection.
      Evidence source is MODEL_ORGANISM (UM-HET3 mice).
  downstream:
  - target: Hyperglycemia-Induced Oxidative Stress and AGE-RAGE Activation
    description: >-
      Chronic glucose excess increases reactive oxygen species and advanced
      glycation end-product formation, activating the canonical
      hyperglycemia-injury pathways.
    evidence:
    - reference: PMID:32872570
      reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The increase in O2− production activates the five major pathways involved in the pathogenesis of diabetes complications: enhancement of the polyol pathway, increased formation of advanced glycation end products (AGEs), increased expression of AGEs receptor and its activating ligands, activation of protein kinase C (PKC) isoforms, and overactivity of the hexosamine pathway [55,56,57]."
      explanation: >-
        Supports progression from chronic hyperglycemia to the superoxide- and
        AGE-driven injury pathways that constitute the amplifier node.
- name: Hyperglycemia-Induced Oxidative Stress and AGE-RAGE Activation
  description: >-
    The amplifying step. Hyperglycemia raises mitochondrial superoxide
    production, which activates the five interlocking pathways of diabetic
    complications: the polyol pathway, advanced glycation end-product (AGE)
    formation, increased AGE-receptor (RAGE) expression and ligand signaling,
    protein kinase C (PKC) isoform activation, and hexosamine-pathway overload.
    AGE-RAGE engagement propagates a self-amplifying pro-inflammatory,
    pro-oxidant signal. This oxidative and glycative stress is the biochemical
    amplifier that converts elevated glucose into vascular-wall injury.
  role: amplifier
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: AGE-RAGE inflammatory signaling
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:32872570
    reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The increase in O2− production activates the five major pathways involved in the pathogenesis of diabetes complications: enhancement of the polyol pathway, increased formation of advanced glycation end products (AGEs), increased expression of AGEs receptor and its activating ligands, activation of protein kinase C (PKC) isoforms, and overactivity of the hexosamine pathway [55,56,57]."
    explanation: >-
      Directly identifies superoxide-driven activation of the polyol, AGE/RAGE,
      PKC and hexosamine pathways as the mechanistic amplifier of diabetic
      complications.
  - reference: PMID:28460155
    reference_title: "Mechanism of Generation of Oxidative Stress and Pathophysiology of Type 2 Diabetes Mellitus: How Are They Interlinked?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oxidative stress has been considered as a major hallmark for the pathogenesis and development of type 2 diabetes mellitus (T2DM)"
    explanation: >-
      Supports oxidative stress as a major mechanistic hallmark amplifying
      diabetic pathophysiology.
  downstream:
  - target: Endothelial Dysfunction and Vascular Inflammation
    description: >-
      Oxidative and glycative stress impair endothelial homeostatic signaling
      and drive inflammatory activation of the vessel wall.
    evidence:
    - reference: PMID:32872570
      reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This balance is altered in T2DM leading to alteration of the physicochemical properties of the vascular wall via endothelial dysfunction, oxidative stress, platelet hyperreactivity, and inflammation [240,241]."
      explanation: >-
        Links oxidative stress and inflammation to altered vascular-wall
        properties and endothelial dysfunction, the central effector.
- name: Endothelial Dysfunction and Vascular Inflammation
  description: >-
    The rate-limiting central effector and key conformance target. Oxidative and
    AGE-RAGE stress disrupt the endothelium's balanced release of vasodilator
    (e.g., nitric oxide) and vasoconstrictor mediators, altering the
    physicochemical properties of the vascular wall. The endothelium shifts to a
    vasoconstricted, prothrombotic, pro-inflammatory phenotype with platelet
    hyperreactivity and leukocyte recruitment. This endothelial dysfunction with
    vascular inflammation is the pivotal, disorder-agnostic convergence point:
    every cause of chronic hyperglycemia funnels through it to reach both micro-
    and macrovascular injury. This is the key conformance target of the module.
  role: central_effector
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: blood vessel remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: ABNORMAL
  - preferred_term: vascular inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  evidence:
  - reference: PMID:32872570
    reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endothelium plays an important role in the regulation of vascular tone and structure through a balanced release of endothelial-derived relaxing and contracting factors. This balance is altered in T2DM leading to alteration of the physicochemical properties of the vascular wall via endothelial dysfunction, oxidative stress, platelet hyperreactivity, and inflammation [240,241]."
    explanation: >-
      Establishes loss of balanced endothelial mediator release, with oxidative
      stress, platelet hyperreactivity and inflammation, as the pivotal
      intermediate event linking hyperglycemia to vascular complications.
  downstream:
  - target: Diabetic Microvascular and Macrovascular Injury
    description: >-
      Endothelial injury and vascular inflammation damage small vessels of the
      kidney, retina and nerve and accelerate atherosclerosis of the large
      arteries.
    evidence:
    - reference: PMID:32872570
      reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "T2DM leads to a two- to four-fold increase in the mortality rate of adults from heart disease and stroke and is associated with both micro- and macro-vascular complications, the latter consisting of accelerated atherosclerosis leading to severe peripheral vascular disease, premature coronary artery disease (CAD) and increased risk of cerebrovascular diseases [178,179,180]."
      explanation: >-
        Supports progression from endothelial dysfunction/inflammation to both
        microvascular and macrovascular (accelerated atherosclerotic) injury.
- name: Diabetic Microvascular and Macrovascular Injury
  description: >-
    The effector step where endothelial dysfunction becomes structural vascular
    disease. In the microvasculature, injury of the small vessels of the kidney
    (glomerular and peritubular capillaries), retina, and peripheral nerve
    produces the classic diabetic microvascular triad. In the macrovasculature,
    endothelial dysfunction and inflammation accelerate atherosclerotic plaque
    formation in the coronary, cerebral, and peripheral arteries. A disease entry
    may elaborate this collapsed node into organ-specific sub-cascades (e.g.,
    renal hemodynamic dysregulation -> glomerular injury -> tubular injury ->
    renal fibrosis) beneath this shared effector.
  role: effector
  biological_processes:
  - preferred_term: blood vessel remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: ABNORMAL
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  evidence:
  - reference: PMID:39158206
    reference_title: "Serum biomarkers for predicting microvascular complications of diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetic microvascular complications such as retinopathy, nephropathy, and neuropathy are primary causes of blindness, terminal renal failure, and neuropathic disorders in type 2 diabetes mellitus patients."
    explanation: >-
      Identifies retinopathy, nephropathy and neuropathy as the microvascular
      injury pathways driven by diabetic small-vessel disease.
  - reference: PMID:32872570
    reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T2DM leads to a two- to four-fold increase in the mortality rate of adults from heart disease and stroke and is associated with both micro- and macro-vascular complications, the latter consisting of accelerated atherosclerosis leading to severe peripheral vascular disease, premature coronary artery disease (CAD) and increased risk of cerebrovascular diseases [178,179,180]."
    explanation: >-
      Supports the macrovascular arm — accelerated atherosclerosis producing
      coronary, cerebrovascular and peripheral arterial disease.
  downstream:
  - target: Diabetic End-Organ Complications
    description: >-
      Sustained micro- and macrovascular injury produces the clinical diabetic
      end-organ complications.
    evidence:
    - reference: PMID:39158206
      reference_title: "Serum biomarkers for predicting microvascular complications of diabetes mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diabetic microvascular complications such as retinopathy, nephropathy, and neuropathy are primary causes of blindness, terminal renal failure, and neuropathic disorders in type 2 diabetes mellitus patients."
      explanation: >-
        Supports progression from microvascular injury to the sight-, renal- and
        nerve-threatening end-organ complications.
- name: Diabetic End-Organ Complications
  description: >-
    The clinical end state of the module. Chronic micro- and macrovascular injury
    manifests as diabetic kidney disease (albuminuria progressing to chronic
    kidney disease and end-stage renal failure), diabetic retinopathy (a leading
    cause of acquired blindness), diabetic neuropathy (peripheral and autonomic),
    and atherosclerotic cardiovascular disease (coronary artery disease, stroke,
    and peripheral artery disease). These complications are the principal source
    of diabetes-related morbidity and premature mortality and are the shared
    consequence of the conserved chronic-hyperglycemia -> oxidative/AGE-RAGE
    stress -> endothelial dysfunction -> vascular injury chain.
  role: consequence
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  evidence:
  - reference: PMID:32872570
    reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the World Health Organization (WHO) diabetes mellitus is a chronic, metabolic disease characterized by elevated levels of blood glucose, which leads over time to damage to the heart, vasculature, eyes, kidneys and nerves."
    explanation: >-
      Establishes damage to the heart, vasculature, eyes, kidneys and nerves as
      the end-organ consequence of chronic diabetes, the terminal node of this
      module.
  - reference: PMID:39158206
    reference_title: "Serum biomarkers for predicting microvascular complications of diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetic microvascular complications such as retinopathy, nephropathy, and neuropathy are primary causes of blindness, terminal renal failure, and neuropathic disorders in type 2 diabetes mellitus patients."
    explanation: >-
      Confirms retinopathy, nephropathy and neuropathy as the vision-, renal- and
      nerve-threatening clinical end-organ complications.
treatments:
- name: SGLT2 Inhibitor Cardiorenal Protection
  description: >-
    Sodium-glucose cotransporter-2 (SGLT2) inhibitors (empagliflozin,
    dapagliflozin, canagliflozin) lower plasma glucose by increasing urinary
    glucose excretion, acting on the upstream Chronic Hyperglycemia trigger of
    this module. In large cardiovascular and renal outcome trials they reduce
    diabetic cardiovascular and kidney complications, illustrating the module's
    drug-target design pattern: acting on the upstream hyperglycemic driver (and,
    for this class, additional glucose-independent renal-hemodynamic effects)
    reduces the entire downstream vascular-complication cascade rather than
    treating an established end-organ phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: empagliflozin
      term:
        id: CHEBI:82720
        label: empagliflozin
    - preferred_term: dapagliflozin
      term:
        id: CHEBI:85078
        label: dapagliflozin
    - preferred_term: canagliflozin
      term:
        id: CHEBI:73274
        label: canagliflozin
  target_mechanisms:
  - target: Chronic Hyperglycemia
    treatment_effect: INHIBITS
    description: >-
      Lowering chronic hyperglycemia (with additional glucose-independent
      renal-hemodynamic effects) attenuates the downstream oxidative/AGE-RAGE
      stress and vascular injury cascade, reducing cardiovascular and renal
      complications.
  evidence:
  - reference: PMID:33441402
    reference_title: "Sodium-glucose cotransporter protein-2 (SGLT-2) inhibitors and glucagon-like peptide-1 (GLP-1) receptor agonists for type 2 diabetes: systematic review and network meta-analysis of randomised controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with type 2 diabetes, SGLT-2 inhibitors and GLP-1 receptor agonists reduced cardiovascular and renal outcomes, with some differences in benefits and harms."
    explanation: >-
      A systematic review and network meta-analysis of randomized trials shows
      SGLT-2 inhibitors reduce cardiovascular and renal outcomes in type 2
      diabetes, validating upstream glucose-lowering/cardiorenal therapy as a
      target of the diabetic vascular-complication cascade.

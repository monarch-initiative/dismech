name: Bradykinin-Mediated Angioedema Module
description: >-
  A conserved mechanism module for bradykinin-mediated angioedema: unrestrained
  activation of the plasma kallikrein-kinin (contact) system liberates excess
  bradykinin, which engages the endothelial bradykinin B2 receptor, destabilizes
  interendothelial adherens junctions, and produces transient non-pitting
  submucosal and subcutaneous edema without urticaria. The rate-limiting,
  etiology-agnostic key conformance target is "Excess Bradykinin B2 Receptor
  Signaling": every bradykinin-mediated angioedema funnels through it, whether
  the excess bradykinin arises from overproduction (loss of the C1-inhibitor
  brake in C1-INH-deficient hereditary and acquired angioedema, or a
  contact-factor gain of function in normal-C1-INH disease) or from impaired
  degradation (ACE/kininase-II inhibition in ACE-inhibitor-associated
  angioedema, which joins the chain at the key node rather than upstream). The
  drug-target pattern is unusually dense and node-specific: a B2-receptor
  antagonist (icatibant) acts on the key node, and plasma-kallikrein inhibitors
  (ecallantide, lanadelumab, berotralstat) act on the bradykinin-production
  node. Complementary to, and distinct from, complement_dysregulation (the low
  C4/C1q seen in C1-INH deficiency is a diagnostic readout of unopposed C1
  esterase activity, not the swelling mechanism) and from histaminergic
  (mast-cell-mediated) angioedema, which is urticarial and antihistamine- or
  steroid-responsive rather than bradykinin-driven.
category: Module
creation_date: "2026-10-29T00:00:00Z"
module_categories:
- IMMUNOLOGY
- PHARMACOLOGY
notes: >-
  This is a mechanism module, not a disease. Do NOT create a "Bradykinin-Mediated
  Angioedema" Disease entry; conforming disorder entries reference individual
  nodes via conforms_to (for example "bradykinin_mediated_angioedema#Excess
  Bradykinin B2 Receptor Signaling"). Conformance is a consistency check, not
  inheritance: a conforming node fully duplicates the content and substitutes the
  etiology-specific detail the module leaves in prose. The module binds only the
  conserved GO processes and CL cell types; the etiology-specific genes a
  conformer substitutes are named here in prose rather than bound in the nodes,
  because they differ by cause and would over-specify a generic template.
  Substitutions conformers make at each node: at contact-system activation,
  SERPING1-encoded C1-inhibitor loss or dysfunction (hereditary type 1 and type 2,
  and acquired C1-INH deficiency) or a contact-factor gain of function
  (F12-related normal-C1-INH disease); at bradykinin production, the KNG1
  substrate (and the KNG1 cleavage-site variant that causes a normal-C1-INH
  subtype); at the endothelial node, the normal-C1-INH barrier genes ANGPT1 and
  HS3ST6, whose loss removes counter-regulation of bradykinin-induced leak.
  ACE-inhibitor-associated angioedema is a conformer that joins at the key node
  only: there is no contact-system overactivation, so it substitutes nothing at
  the first two nodes and instead reaches excess bradykinin through impaired
  kininase-II degradation. The low C4 and C1q of C1-INH deficiency are complement
  readouts handled in the disorder entries (and in complement_dysregulation), not
  in this module. Evidence here is drawn from the hereditary (C1-INH-deficient and
  normal-C1-INH) and acquired C1-INH-deficiency exemplars; it documents the
  conserved cascade rather than any single disease.
pathophysiology:
- name: Kallikrein-Kinin Contact System Activation
  description: >-
    The plasma contact (kallikrein-kinin) system activates without adequate
    restraint. In the common route, loss or dysfunction of the C1 inhibitor
    (the principal plasma inhibitor of the contact-system proteases) removes the
    brake on factor XII autoactivation and on plasma kallikrein; a contact-factor
    gain of function produces the same unrestrained activation in normal-C1-INH
    disease. Active factor XIIa and plasma kallikrein reciprocally activate one
    another, forming the self-amplifying loop that gives attacks their explosive,
    self-sustaining character. This node is the conserved trigger; conformers
    substitute the specific lesion (C1-inhibitor loss, or a contact-factor
    variant).
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Factor XII activation
    term:
      id: GO:0002542
      label: Factor XII activation
    modifier: INCREASED
  - preferred_term: plasma kallikrein-kinin cascade
    term:
      id: GO:0002353
      label: plasma kallikrein-kinin cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:29920929
    reference_title: "Hereditary angioedema: the plasma contact system out of control."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      C1-INH is the key plasma inhibitor of the contact system enzymes, and its
      deficiency causes hereditary angioedema (HAE).
    explanation: >-
      Identifies C1-inhibitor loss as removing the brake on the contact-system
      proteases, the conserved trigger of this module.
  - reference: PMID:27459852
    reference_title: HAE Pathophysiology and Underlying Mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the fundamental cause of swelling is enhanced contact system activation
      leading to increased generation of bradykinin
    explanation: >-
      Places enhanced contact-system activation upstream of bradykinin
      generation, the trigger-to-amplifier step of this module.
  downstream:
  - target: Bradykinin Overproduction via Kininogen Cleavage
    description: >-
      Active plasma kallikrein cleaves high-molecular-weight kininogen to
      liberate bradykinin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27459852
      reference_title: HAE Pathophysiology and Underlying Mechanisms.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the fundamental cause of swelling is enhanced contact system activation
        leading to increased generation of bradykinin
      explanation: >-
        Connects contact-system activation directly to increased bradykinin
        generation.

- name: Bradykinin Overproduction via Kininogen Cleavage
  description: >-
    Active plasma kallikrein cleaves high-molecular-weight kininogen to release
    the nonapeptide bradykinin, and the reciprocal kallikrein-to-factor-XII loop
    drives escalating, self-sustaining bradykinin generation during an attack.
    This node is the conserved amplifier; conformers substitute the kininogen
    substrate, and a normal-C1-INH subtype arises from a kininogen variant that
    alters the bradykinin cleavage site. Plasma kallikrein is the most heavily
    drugged node of the cascade.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: bradykinin biosynthetic process
    term:
      id: GO:0002936
      label: bradykinin biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:21481442
    reference_title: "Ecallantide (DX-88) for acute hereditary angioedema attacks: integrated analysis of 2 double-blind, phase 3 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ecallantide, a novel plasma kallikrein inhibitor, inhibits production of
      bradykinin, the key mediator of these angioedema attacks.
    explanation: >-
      Kallikrein inhibition blocking bradykinin production establishes plasma
      kallikrein as the protease that generates bradykinin at this node.
  - reference: PMID:35442579
    reference_title: "Hereditary Angioedema: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "excessive bradykinin production, with subsequent increased vascular permeability"
    explanation: >-
      Places excess bradykinin production immediately upstream of the
      permeability lesion, the amplifier-to-key-node step.
  downstream:
  - target: Excess Bradykinin B2 Receptor Signaling
    description: >-
      Liberated bradykinin is the mediator that engages the endothelial
      bradykinin B2 receptor.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35442579
      reference_title: "Hereditary Angioedema: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "excessive bradykinin production, with subsequent increased vascular permeability"
      explanation: >-
        Connects liberated bradykinin to the vascular-permeability effect it
        produces through receptor engagement.

- name: Excess Bradykinin B2 Receptor Signaling
  description: >-
    Excess bradykinin engages the bradykinin B2 receptor on vascular endothelium
    and raises vascular permeability. This is the key conformance target: it is
    the rate-limiting, etiology-agnostic convergence point at which every
    bradykinin-mediated angioedema meets, whether the excess bradykinin arose
    from overproduction (C1-inhibitor loss or a contact-factor gain of function)
    or from impaired degradation (ACE/kininase-II inhibition in
    ACE-inhibitor-associated angioedema, which has no contact-system
    overactivation and joins the cascade here). The B2 receptor is the target of
    icatibant; contributions from the B1 and gC1q receptors are reported and the
    B2 receptor is not modeled as the only receptor-level contributor.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: bradykinin receptor activity
    term:
      id: GO:0004947
      label: bradykinin receptor activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: regulation of vascular permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:20818888
    reference_title: "Icatibant, a new bradykinin-receptor antagonist, in hereditary angioedema."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Icatibant is a selective bradykinin B2 receptor antagonist."
    explanation: >-
      Identifies the drug acting at this node as a selective B2-receptor
      antagonist, so the B2 receptor is the operative bradykinin-signaling
      target.
  - reference: PMID:20818888
    reference_title: "Icatibant, a new bradykinin-receptor antagonist, in hereditary angioedema."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      time to clinically significant relief of the index symptom was
      significantly shorter for patients given icatibant than for patients
      given tranexamic acid
    explanation: >-
      The therapeutic response to selective B2-receptor antagonism validates B2
      signaling as the operative step at this node; indirect because it is a
      treatment response cited as mechanism validation.
  - reference: PMID:20818888
    reference_title: "Icatibant, a new bradykinin-receptor antagonist, in hereditary angioedema."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bradykinin is the key mediator of symptoms."
    explanation: >-
      Identifies bradykinin as the symptom-producing mediator acting at this
      node.
  - reference: PMID:19796797
    reference_title: Novel pathogenic mechanism and therapeutic approaches to angioedema associated with C1 inhibitor deficiency.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Activation of bradykinin-mediated B2 receptor has been shown to play an
      important role in the onset of angioedema associated with C1 inhibitor
      deficiency.
    explanation: >-
      A second C1-INH-deficiency source (its study covers both hereditary and
      acquired disease) supports B2-receptor activation as the proximal
      mechanism, evidencing conservation across etiologies; the sentence is
      background in the citing paper.
  downstream:
  - target: Endothelial Adherens Junction Destabilization
    description: >-
      B2-receptor signaling on vascular endothelium disassembles interendothelial
      adherens junctions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27459852
      reference_title: HAE Pathophysiology and Underlying Mechanisms.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        tissue swelling in hereditary angioedema primarily involves the function
        of endothelial cell adherens junctions
      explanation: >-
        Identifies endothelial adherens-junction function as the mechanism
        through which bradykinin signaling produces swelling.

- name: Endothelial Adherens Junction Destabilization
  description: >-
    The proximate cellular lesion is loss of interendothelial adherens-junction
    integrity in postcapillary vessels, with reduced surface VE-cadherin and
    beta-catenin, cytoskeletal reorganization, and interendothelial gap
    formation. This node is the conserved effector and the convergence point for
    the normal-C1-INH endothelial-barrier genes: loss of ANGPT1 removes the
    Tie2-dependent counter-regulation that normally opposes bradykinin-induced
    leak, and loss of HS3ST6 alters endothelial heparan sulfate involved in the
    cell-surface interactions of angioedema mediators. Conformers substitute
    these barrier genes.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: adherens junction organization
    term:
      id: GO:0034332
      label: adherens junction organization
    modifier: ABNORMAL
  - preferred_term: regulation of vascular permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:30689269
    reference_title: Angiopoietin-1 haploinsufficiency affects the endothelial barrier and causes hereditary angioedema.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Likewise, cell surface expression of β-catenin was reduced and severe gap
      formation between adjacent HUVECs developed.
    explanation: >-
      Endothelial-cell experiments show junctional-protein loss and gap
      formation, the cellular readout of this node.
  - reference: PMID:27459852
    reference_title: HAE Pathophysiology and Underlying Mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      tissue swelling in hereditary angioedema primarily involves the function
      of endothelial cell adherens junctions
    explanation: >-
      Supports endothelial adherens-junction function as the cellular mechanism
      of swelling.
  downstream:
  - target: Vascular Hyperpermeability and Angioedema
    description: >-
      Interendothelial gap formation permits plasma extravasation into
      subcutaneous and submucosal tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30689269
      reference_title: Angiopoietin-1 haploinsufficiency affects the endothelial barrier and causes hereditary angioedema.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Likewise, cell surface expression of β-catenin was reduced and severe gap
        formation between adjacent HUVECs developed.
      explanation: >-
        Junctional destabilization degrading barrier integrity is the step that
        permits extravasation.

- name: Vascular Hyperpermeability and Angioedema
  description: >-
    Increased vascular permeability produces transient, recurrent, non-pitting
    subcutaneous and submucosal edema involving skin, abdominal viscera, and the
    upper airway. The lesion is interstitial fluid accumulation from
    postcapillary endothelial leak rather than tissue destruction, so attacks
    resolve completely and leave no fibrosis or scarring, and the swelling is
    non-urticarial, distinguishing it from histaminergic (mast-cell-mediated)
    angioedema. This node is the conserved clinical consequence.
  role: consequence
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: regulation of vascular permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:35442579
    reference_title: "Hereditary Angioedema: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increased vascular permeability in the superficial tissues and
      gastrointestinal and respiratory mucosa.
    explanation: >-
      Supports the tissue-edema distribution produced by the permeability
      lesion.
  - reference: PMID:19796797
    reference_title: Novel pathogenic mechanism and therapeutic approaches to angioedema associated with C1 inhibitor deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The plasma permeabilizing effect was prevented by blocking the gC1q
      receptor-high-molecular-weight kininogen interaction, was partially
      inhibited by B2 receptor or B1 receptor antagonists, and was totally
      prevented by the mixture of the 2 antagonists.
    explanation: >-
      Receptor blockade reducing or preventing C1-INH-deficient plasma-induced
      permeability supports the receptor-to-permeability link across etiologies.
treatments:
- name: Bradykinin B2 receptor antagonist (icatibant)
  description: >-
    A selective bradykinin B2-receptor antagonist blocks the key node directly,
    aborting an acute attack regardless of the upstream cause of the excess
    bradykinin. This is the drug-target pattern pointing at the central effector.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: icatibant
      term:
        id: CHEBI:68556
        label: icatibant
  target_mechanisms:
  - target: Excess Bradykinin B2 Receptor Signaling
    treatment_effect: INHIBITS
    description: >-
      Icatibant competitively antagonizes the bradykinin B2 receptor, blocking
      the key signaling node.
    evidence:
    - reference: PMID:20818888
      reference_title: "Icatibant, a new bradykinin-receptor antagonist, in hereditary angioedema."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Icatibant is a selective bradykinin B2 receptor antagonist."
      explanation: >-
        Establishes icatibant as the selective B2-receptor antagonist acting on
        the key node.
- name: Plasma kallikrein inhibitor
  description: >-
    Plasma-kallikrein inhibitors (ecallantide, lanadelumab, berotralstat) block
    the protease that cleaves kininogen, cutting bradykinin production upstream
    of the key node. This is the drug-target pattern pointing at the amplifier.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ecallantide
      term:
        id: NCIT:C65505
        label: Ecallantide
    - preferred_term: lanadelumab
      term:
        id: NCIT:C166535
        label: Lanadelumab
    - preferred_term: berotralstat
      term:
        id: NCIT:C169808
        label: Berotralstat
  target_mechanisms:
  - target: Bradykinin Overproduction via Kininogen Cleavage
    treatment_effect: INHIBITS
    description: >-
      Inhibiting plasma kallikrein prevents cleavage of kininogen and so blocks
      bradykinin production at the amplifier node.
    evidence:
    - reference: PMID:21481442
      reference_title: "Ecallantide (DX-88) for acute hereditary angioedema attacks: integrated analysis of 2 double-blind, phase 3 studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ecallantide, a novel plasma kallikrein inhibitor, inhibits production of
        bradykinin, the key mediator of these angioedema attacks.
      explanation: >-
        Establishes plasma-kallikrein inhibition as blocking bradykinin
        production at this node.

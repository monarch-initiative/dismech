  evidence:
  - reference: PMID:18255030
    reference_title: "Satb2 regulates callosal projection neuron identity in the developing cerebral cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, we find that Satb2 binds directly to regulatory regions of Ctip2
      and induces changes in chromatin structure.
    explanation: >-
      Shows the prototype determinant acting directly on a sibling-subtype locus,
      which is the molecular content of this trigger node.
  - reference: PMID:21285371
    reference_title: "TBR1 directly represses Fezf2 to control the laminar origin and development of the corticospinal tract."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the transcription factor TBR1 directly binds the Fezf2
      locus and represses its activity in L6 corticothalamic projection neurons to
      restrict the origin of the CS tract to L5.
    explanation: >-
      Establishes the second prototype determinant and shows the same
      cross-repressive mechanism operating on a different laminar subtype, which is
      what makes the node reusable rather than SATB2-specific.
  - reference: PMID:25232744
    reference_title: "De novo TBR1 mutations in sporadic autism disrupt protein functions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      De novo truncating and missense mutations disrupt multiple aspects of TBR1
      function, including subcellular localization, interactions with co-regulators
      and transcriptional repression.
    explanation: >-
      Functional assays of patient-derived variants show that human disease
      variants hit the transcriptional-repression function this node describes,
      rather than only being statistical associations.
  downstream:
  - target: Altered Laminar and Projection-Subtype Identity
    causal_link_type: DIRECT
    description: >-
      Loss of the repressor de-represses the sibling-subtype program, so affected
      neurons adopt a projection identity that does not match their laminar
      position or birthdate.
- name: Altered Laminar and Projection-Subtype Identity
  description: >-
    Affected projection neurons lose their own subtype identity and activate the
    genetic program of a sibling subtype. This is a fate change, not a loss of
    neurons: the cells are generated on schedule and remain glutamatergic
    projection neurons, but the transcriptional identity that determines where
    they will send their axon has been switched.

  evidence:
  - reference: PMID:18255031
    reference_title: "Satb2 is a postmitotic determinant for upper-layer neuron specification in the neocortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the absence of Satb2, UL1 neurons lose their identity and activate DL-
      and UL2-specific genetic programs.
    explanation: >-
      States the identity switch directly: the affected neurons do not die or stall,
      they run a different subtype's program.
  - reference: PMID:18255030
    reference_title: "Satb2 regulates callosal projection neuron identity in the developing cerebral cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Satb2 mutant neurons acquire expression of Ctip2, a transcription factor
      that is necessary and sufficient for the extension of subcortical
      projections by cortical neurons.
    explanation: >-
      Identifies the acquired program as the one that specifies a different
      projection target, linking this node mechanistically to the next.
  - reference: PMID:24301056
    reference_title: "Further delineation of the SATB2 phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vertebrate animal models have shown that Satb2 has a crucial role in
      craniofacial patterning and osteoblast differentiation, as well as in
      determining the fates of neuronal projections in the developing neocortex.
    explanation: >-
      Independent review-level confirmation that the determinant's neural role is
      specifically the fate of neuronal projections.
  downstream:
  - target: Mis-specified Long-Range Axon Target Selection
    causal_link_type: DIRECT
    description: >-
      A neuron running the wrong subtype program extends its axon along the tract
      specified by that program.
- name: Mis-specified Long-Range Axon Target Selection
  description: >-
    The altered identity is executed as a failure to innervate the target that the
    neuron's correct subtype identity specifies. Two forms are curated here. The
    strong form is frank redirection: axons that should have crossed the midline
    into the corpus callosum instead descend into corticofugal tracts, or axons
    that should have stopped at the thalamus continue to the brainstem. The weaker
    form is failure of the correct long-range projection to form at all, without a
    demonstrated switch to a sibling tract — which is the shape of the available
    human-cell evidence. Both are target-selection failures rather than a general
    inability to grow an axon, and the distinction between them is tracked as an
    open human-model mismatch below.

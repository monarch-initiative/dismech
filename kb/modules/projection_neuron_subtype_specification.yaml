discussions:
- discussion_id: gap_identity_versus_migration_conformance_boundary
  prompt: >-
    Which disorders should conform to this module rather than to a radial-migration,
    progenitor, or interneuron module — and where does a forebrain areal-patterning
    factor such as FOXG1 attach?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Laminar and Projection-Subtype Identity
  - pathophysiology#Aberrant Long-Range Cortical Circuit Assembly
  rationale: >-
    Postmitotic subtype identity, radial migration, and areal patterning are
    separable in principle but frequently co-perturbed in real disorders, and the
    Satb2 literature itself reports both an identity switch and a failure to reach
    superficial layers in the same mutant. The conservative rule adopted here is
    that a disease node conforms at the identity node only when the evidence names
    subtype identity or projection fate, and at the circuit-assembly node when
    only the tissue-level callosal or tract phenotype is evidenced. FOXG1 is the
    worked instance of the harder case: it is a forebrain areal-specification
    factor whose cited evidence covers cortical layering and corpus-callosum
    formation, so FOXG1_Disorder is wired at the circuit-assembly node and
    deliberately NOT at the identity node, pending evidence that FOXG1 dosage
    changes projection-subtype identity as SATB2 and TBR1 do.
  evidence:
  - reference: PMID:18255031
    reference_title: "Satb2 is a postmitotic determinant for upper-layer neuron specification in the neocortex."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      UL1 neurons in Satb2 mutants fail to migrate to superficial layers and do
      not contribute to the corpus callosum but to the corticospinal tract, which
      is normally populated by DL axons.
    explanation: >-
      The same mutant shows both a laminar-positioning defect and a projection-fate
      switch, which is exactly why the conformance boundary between this module and
      the migration modules has to be decided from the evidence a disease entry
      actually cites.
  - reference: PMID:31454984
    reference_title: "FOXG1-Related Syndrome: From Clinical to Molecular Genetics and Pathogenic Mechanisms."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      FOXG1 is a transcriptional factor. It is expressed mainly in the telencephalon and plays a pleiotropic role in the development of the brain. It is a key player in development and territorial specification of the anterior brain.
    explanation: >-
      FOXG1's documented role is territorial/areal specification, which is adjacent
      to but not the same claim as projection-subtype identity — the reason its
      conformance is limited to the downstream circuit-assembly node.
- discussion_id: gap_human_fidelity_of_projection_fate_switch
  prompt: >-
    Does the callosal-to-corticofugal projection-fate switch demonstrated in mouse
    Satb2 and Tbr1 mutants occur in human cortex, where callosal projection
    neurons are proportionally far more numerous and the identity programs act over
    a much longer neurogenic window?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Laminar and Projection-Subtype Identity
  - pathophysiology#Mis-specified Long-Range Axon Target Selection
  rationale: >-
    Every direct observation of the fate switch — axons leaving the corpus callosum
    and descending the corticospinal tract, ectopic corticospinal projections from
    layer 6 — comes from mouse null mutants, and depends on retrograde tracing and
    birthdating that cannot be performed in humans. The available human evidence is
    of a different kind: an organoid model showing impaired maturation of SATB2+
    callosal projection neurons and reduced long-range projections, and patient
    imaging showing callosal agenesis. Neither establishes that the human lesion
    *redirects* axons to a sibling tract rather than simply failing to form the
    callosum. The distinction matters for curation because the module's central
    claim is a switch, not a deficit, and an entry that only has imaging evidence
    should conform downstream rather than at the identity node.
  evidence:
  - reference: PMID:38718796
    reference_title: "ARID1B controls transcriptional programs of axon projection in an organoid model of the human corpus callosum."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      neurons expressing SATB2, a determinant of callosal projection neuron (CPN) identity, show impaired maturation in ARID1B+/- neural organoids.
    explanation: >-
      The strongest human-cell evidence available reports impaired maturation of
      SATB2+ callosal projection neurons, not an observed switch to a different
      projection identity.
  - reference: PMID:18255030
    reference_title: "Satb2 regulates callosal projection neuron identity in the developing cerebral cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mutant mice, beta-galactosidase-labeled axons are absent from the corpus
      callosum and instead descend along the corticospinal tract.
    explanation: >-
      The redirection claim rests on mouse genetic tracing, which is the model half
      of this mismatch.
  proposed_experiments:
  - experiment_id: exp_human_projection_fate_switch_assembloid
    name: Human cortico-callosal assembloid projection-fate mapping across SATB2 and TBR1 variant classes
    description: >-
      Build isogenic human iPSC lines carrying loss-of-function SATB2 and TBR1
      variants alongside corrected controls, differentiate paired dorsal cortical
      organoids, and fuse them into interhemispheric-like assembloids that support
      long-range axon projection between the two. Combine single-cell and spatial
      transcriptomics with sparse labelling and anterograde tracing to ask whether
      mutant SATB2+ or TBR1+ neurons acquire the sibling-subtype program (BCL11B,
      FEZF2) and whether their axons are redirected to a corticofugal-like target
      rather than simply failing to project.
    experiment_type:
      preferred_term: human cortical assembloid projection-fate mapping experiment
    model_systems:
    - name: Human iPSC-derived interhemispheric cortical assembloid
      description: >-
        Two fused dorsal cortical organoids supporting long-range axon projection
        between separately labelled cortical territories, used as a human proxy for
        callosal versus corticofugal target choice.

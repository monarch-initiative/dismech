name: Projection Neuron Subtype Specification and Circuit Miswiring Module
description: >-
  A conserved neurodevelopmental mechanism module for disorders in which a
  postmitotic transcriptional program that assigns cortical excitatory
  projection-neuron subtype identity is disrupted, so that neurons are born and
  positioned but acquire the wrong projection identity and send their long-range
  axons to the wrong target. The reusable skeleton is subtype-identity program
  disruption, altered laminar and projection-subtype identity, mis-specified
  long-range axon target selection, aberrant long-range (callosal and
  corticofugal) circuit assembly, and a region-specific neurodevelopmental
  phenotype. SATB2 (upper-layer callosal identity, via repression of BCL11B/Ctip2)
  and TBR1 (deep-layer corticothalamic identity, via repression of FEZF2) are the
  prototype determinants; conforming entries substitute their own identity
  determinant or an upstream chromatin regulator of the same program (e.g. ARID1B
  acting on corpus-callosum genes). This is the second pilot module of the
  NEUROCIPHER circuit-pathomechanism prototype (dismech#3549), after
  excitatory_synapse_scaffold_disruption.
category: Module
creation_date: "2026-08-19T15:20:00Z"
notes: >-
  This is a mechanism module, not a disease and not a broad cortical-malformation
  or agenesis-of-corpus-callosum bucket. Disorder entries reference individual
  nodes via conforms_to using
  "projection_neuron_subtype_specification#<Node Name>".

  Scope boundary, stated deliberately because three adjacent modules already
  exist. This module covers POSTMITOTIC EXCITATORY projection-neuron subtype
  identity and long-range axon target selection. It excludes: radial migration
  and the microtubule/cytoskeletal machinery
  (microtubule_dependent_neuronal_migration_failure); progenitor proliferation and
  spindle biology (neural_progenitor_centrosome_spindle_dysfunction); GABAergic
  interneuron specification and tangential migration
  (interneuron_specification_tangential_migration_failure); synapse-level
  scaffold and receptor organization (excitatory_synapse_scaffold_disruption); and
  the excitation-inhibition/seizure final common pathway
  (epilepsy_excitation_inhibition_imbalance). A neuron that reaches the right
  layer by the right route and then projects to the wrong target belongs here; a
  neuron that never arrives belongs in a migration module. Entries may of course
  conform to this module and one of those in parallel when both branches are
  evidenced.

  Ontology gap found while building this module (recorded for the NEUROCIPHER
  aim of identifying needed terms): CL has no class for a cortical projection
  neuron or its callosal/corticothalamic/corticospinal subtypes, so the generic
  cell type here is glutamatergic neuron (CL:0000679) with the subtype carried in
  preferred_term. The existing conforming entries had already independently fallen
  back to CL:0000540 neuron for "callosal projection neuron" and "cortical
  upper-layer projection neuron", so the gap is load-bearing rather than
  hypothetical.

  Conformance-attachment guidance, and a finding worth preserving. The evidence
  supporting the three middle nodes is not of uniform provenance, and conformance
  should follow that grain rather than the module's narrative order. Attach at
  "Altered Laminar and Projection-Subtype Identity" only when the entry cites
  evidence about subtype identity or projection fate (Chromosome_2q32-q33_Deletion
  Syndrome does, for SATB2). Attach at "Mis-specified Long-Range Axon Target
  Selection" when the entry evidences failure of the correct long-range projection
  (Coffin_Siris_Syndrome does, from the human ARID1B corpus-callosum organoid).
  Attach at "Aberrant Long-Range Cortical Circuit Assembly" when only the
  tissue-level callosal or tract phenotype is evidenced (FOXG1_Disorder). Note the
  asymmetry this exposes: the frank identity-switch nodes rest on mouse null
  mutants, while every human conformer attaches at or below the axon-targeting
  node — see gap_human_fidelity_of_projection_fate_switch.

  Module evidence reuses PMIDs already cached for the conforming disorder entries
  plus the primary Satb2/Tbr1 fate-switch literature; it is illustrative of the
  abstracted pattern rather than an exhaustive citation set.
mechanistic_hypotheses:
- hypothesis_group_id: projection_neuron_identity_miswiring_model
  hypothesis_label: Projection Neuron Identity and Circuit Miswiring Model
  status: CANONICAL
  description: >-
    Cortical projection-neuron subtype identity is assigned postmitotically by
    cross-repressive transcription-factor programs. When one of those determinants
    is lost, the affected neurons switch to a sibling subtype program and project
    their axons along the tract that belongs to that other subtype rather than
    failing to project at all. The resulting long-range connectivity defect —
    typically callosal agenesis or hypoplasia, or an ectopic corticofugal tract —
    is the structural substrate of the intellectual-disability, autism, and
    language phenotypes seen in the conforming disorders.
  evidence:
  - reference: PMID:24105342
    reference_title: "Molecular logic of neocortical projection neuron specification, development and diversity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In recent years, several key controls over the specification and
      differentiation of neocortical projection neurons have been identified.
    explanation: >-
      The reference review frames postmitotic subtype specification of neocortical
      projection neurons as a defined, curatable set of molecular controls, which
      is what this module abstracts.
  - reference: PMID:18255030
    reference_title: "Satb2 regulates callosal projection neuron identity in the developing cerebral cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that Satb2 functions as a repressor of Ctip2 and
      regulatory determinant of corticocortical connections in the developing
      cerebral cortex.
    explanation: >-
      Establishes the cross-repressive identity logic (SATB2 repressing Ctip2) that
      links a transcriptional determinant to which long-range connection a cortical
      neuron makes.
pathophysiology:
- name: Projection Neuron Subtype Identity Program Disruption
  description: >-
    The proximal lesion: loss of function of a postmitotic transcriptional
    determinant of cortical projection-neuron subtype identity, or of a chromatin
    regulator that keeps the corresponding program accessible. These factors act
    by cross-repression — SATB2 represses BCL11B/Ctip2 to hold upper-layer
    callosal identity, TBR1 represses FEZF2 to hold layer 6 corticothalamic
    identity — so the lesion removes a repressor rather than a structural protein.
    Conforming entries substitute their own determinant.

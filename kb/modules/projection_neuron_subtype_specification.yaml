- name: Aberrant Long-Range Cortical Circuit Assembly
  description: >-
    At tissue level the mis-specified projections produce a structurally abnormal
    long-range connectome: agenesis or hypoplasia of the corpus callosum,
    interhemispheric underconnectivity, and abnormal corticothalamic or
    corticospinal tracts. This is the node that imaging sees.

name: Conserved JAK-STAT Pathway Activation Module
description: >-
  A conserved module representing pathological ACTIVATION of the cytokine
  receptor-JAK-STAT axis: an activating lesion or sustained ligand drive in a
  cytokine receptor, a Janus kinase, or a STAT transcription factor produces
  constitutive JAK kinase activity, which drives ligand-independent STAT
  tyrosine phosphorylation, dimerization and nuclear translocation, sustained
  STAT-driven target-gene transcription, and finally cytokine-independent
  proliferation and chronic inflammation. Loss of SOCS-mediated negative
  feedback is modelled as a parallel route into the same effector node, since a
  failed brake and a stuck accelerator are mechanistically distinct causes of
  the same constitutive signal. Conforming disorder nodes substitute the
  disorder-specific lesion and the specific JAK/STAT paralog involved: JAK2
  V617F in the myeloproliferative neoplasms, MPL and CRLF2 receptor lesions,
  activating JAK1 alleles in autoinflammatory disease, and gain-of-function
  STAT1, STAT3, STAT5B or STAT6 alleles in the monogenic immune dysregulation
  syndromes. This module carries the JAK-inhibitor drug-target pattern:
  conforming entries link a JAK inhibitor to the node it inhibits via
  target_mechanisms.

  This module models the ACTIVATION arm only. Loss-of-signalling disease
  (IL2RG/JAK3 severe combined immunodeficiency, GHR growth hormone
  insensitivity, GM-CSF receptor dysfunction in hereditary pulmonary alveolar
  proteinosis, LIFR/gp130 failure in Stuve-Wiedemann syndrome, dominant-negative
  STAT3 in autosomal dominant hyper-IgE syndrome) is the mechanistically inverse
  arm and belongs in a separate deficiency module; such nodes must NOT conform
  to the activation nodes here.
category: Module
creation_date: "2026-08-21T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Its nodes are successive
  steps of pathological cytokine receptor-JAK-STAT activation
  (lesion/ligand drive -> constitutive JAK activity -> constitutive STAT
  activation -> sustained target-gene transcription -> proliferation and chronic
  inflammation), with SOCS feedback loss as a parallel entry into the effector
  node.

  Key conformance target (the disorder-agnostic, rate-limiting node):
  `jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear
  Translocation`. Attach here when the entry evidences ligand-independent or
  constitutive STAT phosphorylation, whatever the upstream lesion. Attach at
  `#Constitutive JAK Kinase Activation` instead when the evidenced lesion is in
  a Janus kinase itself (JAK2 V617F, activating JAK1 alleles, JAK fusions) and
  reserve `#Activating Lesion or Sustained Ligand Drive Upstream of JAK` for
  receptor-level or ligand-excess entries.

  Paralog substitution: module nodes list the family members that carry the
  step; a conforming disorder node narrows `genes` to the paralog its own
  evidence supports (Polycythemia_Vera -> JAK2; Chronic_Mucocutaneous_Candidiasis
  -> STAT1; STAT6_Gain_of_Function_Disease -> STAT6). Listing several paralogs on
  a module node asserts that each can occupy that step, not that any one of them
  is required. Note that JAK3 appears here only in the four-paralog census of the
  JAK node: human JAK3 disease is loss-of-function (SCID) and belongs to the
  deficiency arm, so a JAK3 entry should not conform to these activation nodes.

  Straddling diseases. A single disease may have one node on each arm, and the
  arms must be kept apart at node granularity rather than at entry granularity.
  SOCS1_Haploinsufficiency is the worked example: losing the SOCS brake raises
  STAT1 phosphorylation to a degree comparable with STAT1 gain-of-function
  disease while LOWERING STAT3 phosphorylation, so its
  `Cytokine Hypersensitivity with Increased STAT Activation` and
  `Loss of JAK-STAT Negative Feedback` nodes conform here, and its sibling
  `Reduced STAT3 Phosphorylation` node deliberately does not.

  Scope discipline. Merely elevated cytokine signalling is not this module.
  Conformance requires evidence of constitutive or ligand-independent pathway
  activity - an activating lesion, a demonstrated ligand-independent
  phosphorylation readout, or a documented loss of the SOCS brake. A node
  curated only as "cytokine signalling is increased" (GO:0019221, modifier
  INCREASED) does not by itself satisfy the module, and should stay unconformed
  until the constitutive character is evidenced. This distinction matters
  because roughly 30 KB entries currently annotate GO:0007259 with
  modifier INCREASED, and only some of them are making the stronger claim.

  This is deliberately NOT an Xogenesis module: the terminal output is a
  dysregulated signalling state, not the formation of a pathological material
  anatomical entity, so no OGMS/MPATH anchor stanza applies.
pathophysiology:
- name: Activating Lesion or Sustained Ligand Drive Upstream of JAK
  description: >-
    The initiating event that commits the axis to constitutive signalling. Three
    non-exclusive routes converge here: a somatic or germline activating variant
    in a cytokine receptor (MPL W515 in the myeloproliferative neoplasms, CRLF2
    rearrangement in B-lymphoblastic leukaemia), a rearrangement creating a
    constitutively dimerized kinase fusion, or sustained excess of a cytokine
    ligand acting on an intact receptor (IL-6 in idiopathic multicentric
    Castleman disease, IFN-gamma and IL-15 in alopecia areata). The routes are
    mechanistically distinct upstream but are indistinguishable from the JAK node
    downwards, which is why they are modelled as one trigger. Conforming disorder
    nodes substitute the specific receptor or ligand.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MPL
    term:
      id: hgnc:7217
      label: MPL
  - preferred_term: CRLF2
    term:
      id: hgnc:14281
      label: CRLF2
  - preferred_term: IL6ST
    term:
      id: hgnc:6021
      label: IL6ST
  biological_processes:
  - preferred_term: cytokine-mediated signaling pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic mutations and polymorphisms are functionally relevant to a variety
      of human diseases, especially cancer and immune-related conditions.
    explanation: >-
      Establishes that lesions in this pathway are the initiating events in a
      broad class of human cancer and immune disease, which is what this trigger
      node represents. Evidence source is OTHER as this is a review article.
  downstream:
  - target: Constitutive JAK Kinase Activation
    description: >-
      A receptor lesion, kinase fusion, or sustained ligand excess holds the
      receptor-associated Janus kinases in an activated state, converting a
      normally transient signal into a continuous one.

- name: Constitutive JAK Kinase Activation
  description: >-
    Receptor-associated Janus kinases are held in a catalytically active state
    independent of, or hypersensitive to, ligand. In the physiological pathway
    ligand engagement activates the receptor-associated JAKs, which
    transphosphorylate each other and the receptor tail to create STAT docking
    sites; in disease that step becomes constitutive. The canonical lesion is
    JAK2 V617F in the JH2 pseudokinase domain, which releases autoinhibition of
    the adjacent kinase domain; activating JAK1 alleles produce the analogous
    state in immune dysregulatory disease. Four Janus kinases occupy this step
    (JAK1, JAK2, JAK3, TYK2) and pair selectively with different receptor chains,
    which is what gives JAK-selective inhibitors their differing clinical
    profiles. This node is the JAK-inhibitor drug target.
  role: amplifier
  biological_scale: MOLECULAR
  genes:
  - preferred_term: JAK1
    term:
      id: hgnc:6190
      label: JAK1
  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  - preferred_term: JAK3
    term:
      id: hgnc:6193
      label: JAK3
  - preferred_term: TYK2
    term:
      id: hgnc:12440
      label: TYK2
  molecular_functions:
  - preferred_term: protein tyrosine kinase activity
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: positive regulation of receptor signaling pathway via JAK-STAT
    term:
      id: GO:0046427
      label: positive regulation of receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Upon engagement by ligand, receptor-associated Janus Kinases (Jaks) become
      activated and phosphorylate both each other and the intracellular tail of
      their receptors, thereby creating docking sites for latent, cytoplasmic
      transcription factors termed signal transducers and activators of
      transcription (STATs).
    explanation: >-
      Defines the normal kinase step that becomes constitutive in this node, and
      the mechanism by which activated JAKs create the STAT docking sites that
      drive the downstream effector. Evidence source is OTHER as this is a
      review article.
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are four Jaks, Jak1, Jak2, Jak3, and Tyk2, which selectively bind
      different receptor chains
    explanation: >-
      Grounds the four-paralog gene list on this node and the selective
      receptor pairing that conforming entries narrow to. Evidence source is
      OTHER as this is a review article.
  - reference: PMID:15793561
    reference_title: "A unique clonal JAK2 mutation leading to constitutive signalling causes polycythaemia vera."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation, a valine-to-phenylalanine substitution at amino acid position
      617, leads to constitutive tyrosine phosphorylation activity that promotes
      cytokine hypersensitivity and induces erythrocytosis in a mouse model.
    explanation: >-
      The archetypal lesion for this node: JAK2 V617F confers constitutive
      tyrosine kinase activity and cytokine hypersensitivity, the defining
      properties of constitutive JAK activation.
  downstream:
  - target: Constitutive STAT Activation and Nuclear Translocation
    description: >-
      Continuously active JAKs phosphorylate STAT transcription factors docked at
      the receptor, driving STAT activation without a ligand signal.

- name: Constitutive STAT Activation and Nuclear Translocation
  description: >-
    The rate-limiting, disorder-agnostic node of the module and its key
    conformance target. STAT transcription factors are tyrosine-phosphorylated,
    dimerize, and translocate to the nucleus continuously rather than
    transiently. Every upstream route in this module converges here, and a
    gain-of-function STAT allele enters at this node directly, without any
    upstream receptor or kinase lesion. Seven mammalian STATs exist; the four
    listed here are those with established human gain-of-function disease
    (STAT1 in chronic mucocutaneous candidiasis, STAT3 in the GOF immune
    dysregulation syndrome, STAT5B in overgrowth, STAT6 in severe allergic
    disease). Conforming disorder nodes narrow to the paralog their own
    phospho-STAT or genetic evidence supports.
  role: central_effector
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STAT1
    term:
      id: hgnc:11362
      label: STAT1
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  - preferred_term: STAT5B
    term:
      id: hgnc:11367
      label: STAT5B
  - preferred_term: STAT6
    term:
      id: hgnc:11368
      label: STAT6
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Jak-mediated phosphorylation activates STATs, which in turn directly bind
      DNA and regulate gene expression
    explanation: >-
      Establishes the STAT activation step this node represents and its direct
      coupling to gene regulation, which is the downstream edge. Evidence source
      is OTHER as this is a review article.
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Seven mammalian STAT family members have been identified (STAT1, STAT2,
      STAT3, STAT4, STAT5a, STAT5b, STAT6).
    explanation: >-
      Grounds the STAT paralog census behind this node's gene list, from which
      conforming entries select the disorder-specific family member. Evidence
      source is OTHER as this is a review article.
  - reference: PMID:22375971
    reference_title: "A double-blind, placebo-controlled trial of ruxolitinib for myelofibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dysregulation of this pathway is a central pathogenic component in
      myelofibrosis regardless of the mutational status of JAK2
    explanation: >-
      Supports treating constitutive pathway activation, rather than any single
      upstream lesion, as the rate-limiting node: myelofibrosis converges here
      whether or not JAK2 itself is mutated.
  downstream:
  - target: Sustained STAT-Driven Target-Gene Transcription
    description: >-
      Persistently nuclear STAT dimers occupy their genomic binding sites
      continuously, converting a transient transcriptional response into a
      sustained program.

- name: Sustained STAT-Driven Target-Gene Transcription
  description: >-
    Continuously nuclear STAT dimers drive a sustained transcriptional program
    rather than a self-limiting one. STATs bind tens of thousands of genomic
    sites and regulate thousands of protein-coding genes plus microRNAs and long
    non-coding RNAs, and they reshape chromatin and enhancer landscapes, so the
    downstream output is a broad change of cell state rather than a small set of
    induced genes. In conforming entries this node is where the disorder-specific
    output program is named: an interferon-stimulated gene signature, a
    Th17-skewing program, or a proliferative and anti-apoptotic program.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: INCREASED
  evidence:
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now clear that STATs bind tens of thousands of sites in the genome
      and regulate transcription of thousands of protein-coding genes, along with
      microRNAs and long non-coding RNAs.
    explanation: >-
      Establishes the breadth of the STAT transcriptional output that this node
      represents, and why sustained STAT activity produces a change of cell state
      rather than a narrow gene response. Evidence source is OTHER as this is a
      review article.
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      STATs also have important impacts on chromatin structure and the
      distinctive enhancer landscapes of differentiating cells.
    explanation: >-
      Supports the chromatin and enhancer remodelling component of this node,
      which is why the downstream consequence is a durable phenotypic program.
      Evidence source is OTHER as this is a review article.
  downstream:
  - target: Cytokine-Independent Proliferation and Chronic Inflammation
    description: >-
      A sustained STAT transcriptional program removes the cytokine dependence of
      proliferation and maintains an inflammatory output that does not resolve.

- name: Cytokine-Independent Proliferation and Chronic Inflammation
  description: >-
    The terminal output of the module. Cells acquire growth-factor independence
    or hypersensitivity and proliferate without the normal cytokine requirement,
    while the same sustained transcriptional program maintains a chronic
    inflammatory state. Which arm dominates is disorder-specific: clonal
    myeloproliferation in the myeloproliferative neoplasms and lymphoid
    malignancies, chronic autoinflammation and tissue infiltration in the
    monogenic immune dysregulation syndromes, and organ-specific inflammatory
    disease in the autoimmune conformers. Conforming entries substitute their own
    proliferative or inflammatory endpoint.
  role: consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:15793561
    reference_title: "A unique clonal JAK2 mutation leading to constitutive signalling causes polycythaemia vera."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myeloproliferative disorders are clonal haematopoietic stem cell
      malignancies characterized by independency or hypersensitivity of
      haematopoietic progenitors to numerous cytokines.
    explanation: >-
      Names the defining property of this terminal node - proliferation that no
      longer depends on the normal cytokine signal - in the archetypal disease
      class for the module.

- name: Loss of SOCS-Mediated Negative Feedback
  description: >-
    A parallel entry into constitutive signalling by failure of the brake rather
    than by a stuck accelerator. SOCS proteins are STAT-induced inhibitors of
    JAK-STAT signalling and form the pathway's principal negative-feedback loop:
    a normal cytokine response is terminated within hours largely through SOCS
    activity. Where that feedback is lost - by SOCS silencing or deletion, or by
    a lesion that renders the kinase insensitive to it - the same constitutive
    STAT activation results without any activating lesion in a JAK or STAT.
    This node is included because it is a mechanistically distinct route to the
    module's central effector, and because a disorder entry curating "pathway is
    increased" has usually not established which of the two routes it means.
  role: modifier
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SOCS1
    term:
      id: hgnc:19383
      label: SOCS1
  - preferred_term: SOCS3
    term:
      id: hgnc:19391
      label: SOCS3
  biological_processes:
  - preferred_term: negative regulation of receptor signaling pathway via JAK-STAT
    term:
      id: GO:0046426
      label: negative regulation of receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:17525754
    reference_title: "SOCS proteins, cytokine signalling and immune regulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Suppressor of cytokine signalling (SOCS) proteins are inhibitors of
      cytokine signalling pathways.
    explanation: >-
      Establishes SOCS proteins as the inhibitory arm of cytokine signalling
      whose loss this node represents. Evidence source is OTHER as this is a
      review article.
  - reference: PMID:22520844
    reference_title: "The JAK-STAT pathway at twenty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the initial responses to IFNs and IL-6 that are due to tyrosine
      phosphorylation are downregulated rapidly, through a variety of mechanisms
      but especially through the activities of the SOCS proteins
    explanation: >-
      Establishes that SOCS activity is what makes the normal STAT
      tyrosine-phosphorylation response self-limiting, so that its loss yields a
      sustained signal. Evidence source is OTHER as this is a review article.
  downstream:
  - target: Constitutive STAT Activation and Nuclear Translocation
    description: >-
      Without the SOCS brake, STAT tyrosine phosphorylation that would normally
      be terminated within hours persists, producing the same constitutive
      effector state as an activating kinase lesion.
treatments:
- name: Janus Kinase Inhibitor Therapy
  description: >-
    Small-molecule ATP-competitive inhibitors of the Janus kinases (ruxolitinib,
    baricitinib, tofacitinib, upadacitinib, fedratinib, and JAK-selective agents
    such as ritlecitinib and deuruxolitinib) block the catalytic step at the
    Constitutive JAK Kinase Activation node and thereby suppress the downstream
    STAT effector. This is the module's drug-target design pattern: a conforming
    disorder entry links its JAK inhibitor by target_mechanisms to the specific
    node the drug acts on, rather than to a downstream symptom. Because the four
    JAKs pair selectively with different receptor chains, agents differ in which
    cytokine families they suppress, and a conforming entry should name the
    inhibitor actually evidenced for that disease rather than inheriting this
    generic class entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Constitutive JAK Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      JAK inhibitors occupy the kinase ATP site, blocking JAK-mediated STAT
      tyrosine phosphorylation and collapsing the constitutive signal at its
      source rather than downstream of the transcriptional program.
  evidence:
  - reference: PMID:22375971
    reference_title: "A double-blind, placebo-controlled trial of ruxolitinib for myelofibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ruxolitinib, as compared with placebo, provided significant clinical
      benefits in patients with myelofibrosis by reducing spleen size,
      ameliorating debilitating myelofibrosis-related symptoms, and improving
      overall survival.
    explanation: >-
      Randomized placebo-controlled evidence that inhibiting the JAK node
      produces clinical benefit in a disease driven by constitutive JAK-STAT
      activation, validating this node as the drug target.
  - reference: PMID:25587654
    reference_title: "The JAK-STAT pathway: impact on human disease and therapeutic intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical relevance of the pathway has been confirmed by the emergence
      of a new class of therapeutics that targets JAKs.
    explanation: >-
      Establishes JAK inhibition as an established therapeutic class acting on
      this pathway, which is the basis for the module's drug-target pattern.
      Evidence source is OTHER as this is a review article.
discussions:
- discussion_id: gap_jak_stat_socs_feedback_underdetermined
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of SOCS-Mediated Negative Feedback
  prompt: >-
    In disorder entries that curate increased JAK-STAT signalling without an
    activating JAK or STAT lesion, is the constitutive signal driven by sustained
    upstream ligand drive or by failure of SOCS-mediated negative feedback, and
    what evidence would distinguish them?
  rationale: >-
    A stuck accelerator and a failed brake produce the same readout - persistent
    STAT tyrosine phosphorylation - but imply different therapeutic logic, since
    ligand-directed biologics act only on the former. Across the dismech KB the
    SOCS arm is almost entirely uncurated: only three disorder entries mention
    SOCS at all, and only SOCS1_Haploinsufficiency models the brake itself,
    against roughly thirty entries that annotate GO:0007259 with modifier
    INCREASED. That asymmetry is a curation gap rather than a biological finding,
    and it means that for most entries the KB currently cannot answer which route
    is meant.
    Conforming entries should not assert SOCS feedback loss without direct
    evidence (loss of SOCS induction, SOCS promoter silencing, or a lesion shown
    to escape SOCS control); absent that evidence the entry should conform to the
    JAK or STAT nodes and leave this node unconformed.

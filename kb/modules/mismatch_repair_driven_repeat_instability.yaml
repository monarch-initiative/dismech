name: Mismatch-Repair-Driven Repeat Instability Module
description: >-
  A conserved DNA-level mechanism module for the short-tandem-repeat (STR)
  expansion diseases, capturing the somatic-instability "engine" that is
  mechanistically upstream of, and orthogonal to, the downstream toxicity
  modules (translated polyglutamine proteotoxicity, repeat-RNA gain-of-toxicity,
  and repeat-driven gene silencing). An expandable tandem repeat above a
  length/instability threshold is aberrantly processed by the DNA mismatch-repair
  (MMR) machinery — the MutSβ (MSH2-MSH3) recognition complex and the MutLγ
  (MLH1-MLH3) effector complex — which, rather than faithfully repairing the
  slipped/hairpin repeat structure, licenses incremental expansion; FAN1 and EXO1
  oppose it. The repeat therefore continues to expand throughout life in specific
  post-mitotic somatic cells (notably neurons), generating a mosaic of
  progressively larger alleles far exceeding the inherited germline length. When
  somatic expansion in a vulnerable cell crosses that cell's toxicity threshold,
  the cell tips into the disease-specific downstream consequence, so the
  cell-type-specific expansion rate — not the static germline allele — is the
  rate-limiting driver of age of onset, progression, and the selective regional
  vulnerability of a ubiquitously expressed gene. Individual disorder entries declare
  conformance via conforms_to on their pathophysiology nodes, substituting the
  disorder-specific expandable repeat (CAG, CTG, CGG, GAA), the vulnerable cell
  population, and the downstream toxicity route.
category: Module
creation_date: "2026-07-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (for example,
  "mismatch_repair_driven_repeat_instability#Somatic Repeat Expansion in
  Post-Mitotic Cells", the key conformance target — the disorder-agnostic,
  rate-limiting central_effector node). The module is deliberately upstream of
  and complementary to the downstream toxicity modules: a CAG/polyQ disorder
  conforms to BOTH this module (the instability engine) and
  polyglutamine_expansion_proteotoxicity (the protein-level consequence), with
  the seam at the "Cell-Type-Selective Toxicity Threshold Crossing" effector
  node handing off to the toxicity module's trigger. The same compositional logic
  extends to CTG/DMPK (repeat-RNA toxicity) and CGG/FMR1 or GAA/FXN (gene
  silencing) disorders, which substitute their repeat and their downstream route
  while reusing this instability chain.

  This is NOT a duplicate of genome_instability_mutation (the cancer mutator /
  chromosomal-instability hallmark): there the loss of MMR causes a general
  mutator phenotype; here the MMR machinery is intact and paradoxically DRIVES a
  specific pathogenic tandem-repeat expansion — a gain of a toxic repair outcome
  rather than a loss of repair.

  Evidence architecture: the molecular MMR-driven expansion mechanism (trigger
  and amplifier nodes) is most cleanly demonstrated in knock-in mouse models
  (MODEL_ORGANISM evidence across Fragile X CGG and Huntington CAG models), while
  the disease-level somatic-expansion, selective-vulnerability, and onset/
  progression consequences are supported by human clinical/GWAS evidence
  (HUMAN_CLINICAL). The pan-repeat scope is grounded in ≥2 repeat classes here
  (CAG: HD and the SCAs; CGG: Fragile X) plus the explicit generalization that
  the mechanism "is likely applicable to other trinucleotide repeat diseases".
  GAA/FXN (Friedreich ataxia) remains a named extensible conformer to be wired
  once its own MMR-instability evidence is curated. STRchive locus tags
  somatic_instability, anticipation, and length_affects_onset name the phenomena
  this module models mechanistically.

  Worked conformers span three repeat classes: Huntington disease (striatal
  medium spiny neurons, CAG) and Machado-Joseph disease / SCA3 (cerebellar and
  brainstem neurons, CAG); myotonic dystrophy type 1 (skeletal muscle and other
  tissues, CTG/DMPK, feeding CUG-RNA toxicity); and Fragile X syndrome
  (CGG/FMR1, feeding full-mutation methylation silencing). The CTG and CGG
  conformers demonstrate the module's intended composition — the shared
  instability engine feeding a different downstream toxicity route per repeat
  class (RNA gain-of-toxicity for CTG; transcriptional silencing for CGG).
pathophysiology:
- name: Expandable Tandem Repeat Above the Instability Threshold
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The shared substrate is a germline tandem repeat expanded (or in the
    premutation range) above a length/instability threshold, at which the repeat
    forms slipped-strand and hairpin secondary structures that become substrates
    for aberrant repair. This applies across the repeat classes of the STR
    expansion diseases — CAG (Huntington disease, the polyglutamine SCAs, DRPLA,
    SBMA), CGG (FMR1), CTG (DMPK), and GAA (FXN) — with the specific expandable
    locus substituted by the conforming disorder.

  evidence:
  - reference: PMID:26420841
    reference_title: >-
      Mutsβ generates both expansions and contractions in a mouse model of the
      Fragile X-associated disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MSH3, the MSH2-binding partner in the MutSβ complex, is required for 98% of
      germ line expansions and all somatic expansions in this model.
    explanation: >-
      Demonstrates that the MutSβ (MSH2-MSH3) complex is required for all somatic
      repeat expansions in a CGG-repeat model, the core molecular driver.
  - reference: PMID:30312299
    reference_title: >-
      MutLγ promotes repeat expansion in a Fragile X mouse model while EXO1 is
      protective.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MLH1/MLH3 (MutLγ), a protein complex that can act downstream of MutSβ in
      MMR, is also required for all germ line and somatic expansions.
    explanation: >-
      Establishes the MutLγ (MLH1-MLH3) effector complex acting downstream of
      MutSβ, and (with the EXO1-protective finding of the same study) the
      opposing/protective arm of the machinery.
  - reference: PMID:33579859
    reference_title: >-
      DNA Repair in Huntington's Disease and Spinocerebellar Ataxias: Somatic
      Instability and Alternative Hypotheses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Validation of leads including the mismatch repair protein MSH3, and
      interstrand cross-link repair protein FAN1, suggest the mechanism is driven
      by somatic CAG instability, which is supported by the protective effect of
      CAA substitutions in the CAG tract.
    explanation: >-
      Human genetic-modifier evidence across HD and the spinocerebellar ataxias
      implicates MSH3 (driver) and FAN1 (protective) and the CAA-interruption
      stabilizing effect, corroborating the mouse mechanism in human disease.
  downstream:
  - target: Somatic Repeat Expansion in Post-Mitotic Cells
    description: >-
      Aberrant MMR processing drives repeated rounds of incremental expansion in
      somatic tissue.
- name: Somatic Repeat Expansion in Post-Mitotic Cells
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Because the aberrant MMR-driven expansion continues throughout life and is
    not limited to replication, the repeat keeps expanding in specific
    post-mitotic somatic cells — most consequentially neurons — generating a
    mosaic of progressively larger alleles far exceeding the inherited germline
    length. This ongoing, cell-type-biased somatic expansion (not the static
    germline allele) is the rate-limiting driver of pathology and is the key
    conformance target: conforming disorder entries substitute their own
    expanding repeat and vulnerable cell population (striatal medium spiny
    neurons in Huntington disease; cerebellar and brainstem neurons in SCA3).
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: mismatch repair
    term:
      id: GO:0006298
      label: mismatch repair
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:41233526
    reference_title: "Huntington disease: somatic expansion, pathobiology and therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genome-wide association studies have identified genetic modifiers, mostly
      DNA repair genes, that significantly influence disease onset and
      progression. These findings point to somatic CAG repeat expansions in
      affected tissues as a key pathological mechanism.
    explanation: >-
      Human GWAS evidence establishes somatic repeat expansion in affected
      tissue, driven by DNA-repair modifiers, as the key pathological mechanism.
  - reference: PMID:24204323
    reference_title: >-
      Mismatch repair genes Mlh1 and Mlh3 modify CAG instability in Huntington's
      disease mice: genome-wide and candidate approaches.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mlh1 is essential for somatic CAG expansions and that it is an enhancer of
      nuclear huntingtin accumulation in striatal neurons.
    explanation: >-
      Directly links MMR-driven somatic expansion to the downstream disease
      protein burden in the vulnerable neuronal population, defining the seam to
      the toxicity route.
  downstream:
  - target: Cell-Type-Selective Toxicity Threshold Crossing
    description: >-
      When somatic expansion in a vulnerable cell exceeds its toxicity threshold,
      the cell tips into the disease-specific downstream consequence.
- name: Cell-Type-Selective Toxicity Threshold Crossing
  role: effector
  biological_scale: CELLULAR
  description: >-
    When cumulative somatic expansion in a vulnerable cell pushes the repeat past
    that cell's toxicity threshold, the cell tips into the disorder-specific
    downstream consequence — translated polyglutamine proteotoxicity for CAG,
    repeat-RNA gain-of-toxicity for CTG, or transcriptional silencing for CGG and
    GAA. Because the expansion rate is cell-type-specific, this threshold crossing
    is the event that explains the selective regional vulnerability of a
    ubiquitously expressed gene and is the seam handing off to the disorder's
    toxicity module.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:42400823
    reference_title: "Update on Genetic Chorea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Striatal pallidal neurons (SPNs) with 150-500 + CAG repeats seem to lose
      positive and then negative features of neuronal identity, de-repress
      senescence/apoptosis genes, ultimately leading to cell death.
    explanation: >-
      Shows that crossing a high somatic-expansion threshold in vulnerable
      striatal neurons drives loss of neuronal identity and cell death, the
      cellular tipping point into the disease phenotype.
  - reference: PMID:24204323
    reference_title: >-
      Mismatch repair genes Mlh1 and Mlh3 modify CAG instability in Huntington's
      disease mice: genome-wide and candidate approaches.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mlh1 is essential for somatic CAG expansions and that it is an enhancer of
      nuclear huntingtin accumulation in striatal neurons.
    explanation: >-
      The same MMR-driven somatic expansion enhances the toxic disease-protein
      burden specifically in the vulnerable striatal neurons, linking expansion
      to the cell-type-selective toxicity threshold.
  downstream:
  - target: Repeat-Length-Dependent Onset, Progression, and Anticipation
    description: >-
      The aggregate of cell-level threshold crossings determines the
      organism-level timing and severity of disease.
- name: Repeat-Length-Dependent Onset, Progression, and Anticipation
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The organism-scale readout of the molecular engine: somatic-expansion burden
    sets the age of onset — earlier than the inherited germline allele alone
    predicts — and the rate of progression, while germline instability with
    parent-of-origin bias produces intergenerational anticipation. These are the
    defining clinical hallmarks of the repeat expansion diseases (mirrored by the
    STRchive locus tags somatic_instability, anticipation, and
    length_affects_onset), here derived mechanistically from MMR-driven
    instability rather than merely correlated with germline repeat length.
  evidence:
  - reference: PMID:41130308
    reference_title: >-
      Inhibiting Cytosine-Adenine-Guanine (CAG) repeat expansions as a
      therapeutic strategy for Huntington's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Somatic expansion of the CAG repeat length, beyond the inherited length,
      has been associated with hastening the onset of symptoms compared to that
      predicted from the germline length.
    explanation: >-
      Establishes that somatic expansion beyond the germline length hastens
      onset, the organism-level consequence of the instability engine.
  - reference: PMID:41233526
    reference_title: "Huntington disease: somatic expansion, pathobiology and therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genome-wide association studies have identified genetic modifiers, mostly
      DNA repair genes, that significantly influence disease onset and
      progression.
    explanation: >-
      DNA-repair genetic modifiers influence both onset and progression,
      confirming the instability engine as the determinant of the clinical
      time course.
treatments:
- name: Somatic Repeat-Expansion Inhibitor Therapy (investigational)
  description: >-
    An emerging disease-modifying strategy that targets the instability engine
    itself — slowing or halting somatic repeat expansion (for example by lowering
    or inhibiting MSH3 / MutSβ activity) to delay onset and progression — rather
    than acting on the downstream toxic product. It is the instability-module
    drug-target design pattern for conforming disorders: a treatment acting
    upstream on the aberrant-MMR amplifier node. The approach is still
    investigational and preclinically challenging.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Aberrant Mismatch-Repair Processing of the Repeat
    treatment_effect: INHIBITS
    description: >-
      Inhibiting MutSβ-driven aberrant repair slows somatic repeat expansion,
      the rate-limiting driver of onset and progression, upstream of the
      disorder-specific toxic consequence.
  evidence:
  - reference: PMID:41130308
    reference_title: >-
      Inhibiting Cytosine-Adenine-Guanine (CAG) repeat expansions as a
      therapeutic strategy for Huntington's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeting somatic CAG repeat expansion as a therapeutic has been
      challenging due to several factors
    explanation: >-
      Frames targeting somatic repeat expansion (including via the DNA
      mismatch-repair proteins) as an active, if still challenging, therapeutic
      strategy — the basis of the upstream drug-target pattern.

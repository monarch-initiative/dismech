  evidence:
  - reference: PMID:26420841
    reference_title: >-
      Mutsβ generates both expansions and contractions in a mouse model of the
      Fragile X-associated disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fragile X-associated disorders are Repeat Expansion Diseases that result
      from expansion of a CGG/CCG-repeat in the FMR1 gene.
    explanation: >-
      Establishes the expandable-repeat substrate for the CGG class, generalizing
      the trigger beyond the CAG/polyglutamine disorders.
  - reference: PMID:24204323
    reference_title: >-
      Mismatch repair genes Mlh1 and Mlh3 modify CAG instability in Huntington's
      disease mice: genome-wide and candidate approaches.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Huntington's disease gene (HTT) CAG repeat mutation undergoes somatic
      expansion that correlates with pathogenesis. Modifiers of somatic expansion
      may therefore provide routes for therapies targeting the underlying
      mutation, an approach that is likely applicable to other trinucleotide
      repeat diseases.
    explanation: >-
      Establishes the CAG expandable repeat and the explicit pan-repeat
      generalization that grounds the module's cross-disease scope.
  downstream:
  - target: Aberrant Mismatch-Repair Processing of the Repeat
    description: >-
      The slipped/hairpin repeat structure formed above the instability threshold
      is engaged by the MMR machinery.
- name: Aberrant Mismatch-Repair Processing of the Repeat
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The MutSβ complex (MSH2-MSH3) recognizes the slipped/hairpin repeat structure
    and, instead of faithfully repairing it, licenses incremental expansion; the
    MutLγ complex (MLH1-MLH3) acts downstream of MutSβ to effect the expansion,
    while FAN1 (an interstrand-cross-link-repair nuclease) and EXO1 oppose it and
    are protective. This aberrant, gain-of-toxic-outcome use of a normally
    protective repair pathway is the disorder-agnostic molecular driver of the
    expansion; human genetic-modifier studies converge on these same MMR factors.
  genes:
  - preferred_term: MSH2
    term:
      id: hgnc:7325
      label: MSH2
  - preferred_term: MSH3
    term:
      id: hgnc:7326

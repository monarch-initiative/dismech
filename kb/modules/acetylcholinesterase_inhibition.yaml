name: Acetylcholinesterase Inhibition Module
description: >-
  The conserved toxicological mechanism of anticholinesterase poisoning: a
  xenobiotic inactivates the catalytic serine of acetylcholinesterase, so
  acetylcholine is no longer hydrolysed and accumulates at cholinergic synapses,
  which overstimulates muscarinic, nicotinic and central cholinergic receptors
  and converges on a cholinergic crisis whose lethal endpoint is respiratory
  failure. The rate-limiting, agent-agnostic step every conformer funnels
  through is the key conformance target `Synaptic Acetylcholine Accumulation`:
  whatever carbamylates or phosphorylates the enzyme, the downstream chain is
  the same, so a conforming entry substitutes the specific inhibitor and the
  specific receptor arm that dominates its presentation. It carries the
  anticholinesterase antidote drug-target pattern - a muscarinic antagonist
  (atropine) on the muscarinic arm, an oxime reactivator (pralidoxime) on the
  inhibition node itself, and a benzodiazepine on the central arm. The module
  is the excess-acetylcholine counterpart of `neuromuscular_transmission_failure`
  and does not overlap it: that module is organised around loss of the endplate
  safety factor from an acetylcholine *deficit* (congenital myasthenic
  syndromes, myasthenia gravis, botulism), whereas transmission here fails from
  an acetylcholine *excess* that depolarises the endplate, the opposite lesion.
  Enzyme "aging" (dealkylation that makes the inhibition irreversible) is
  deliberately not a module node: it is an agent-specific elaboration on the
  inhibition step that occurs with organophosphates and nerve agents but not
  with carbamates, so it belongs to the conforming entry rather than to the
  shared chain.
category: Module
module_categories:
- TOXICOLOGY
- PHARMACOLOGY
- NEUROSCIENCE
creation_date: '2026-10-28T00:00:00Z'
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create an
  "Acetylcholinesterase Inhibition" Disease entry. Disorder entries reference
  individual nodes via conforms_to, for example
  "acetylcholinesterase_inhibition#Synaptic Acetylcholine Accumulation".


  Scope. The module opens at the enzyme-inhibitor interaction and stops at the
  organism-level cholinergic crisis. What delivered the inhibitor (agricultural
  pesticide exposure, intentional ingestion, a chemical-weapon release, a
  cholinesterase-inhibitor drug overdose) and the agent-specific kinetics
  (bioactivation of a phosphorothioate to its oxon, spontaneous decarbamylation
  of a reversible carbamate adduct, aging of a phosphylated adduct) belong to the
  conforming entry. A conformer substitutes its own inhibitor and, where one arm
  dominates, the receptor arm that matters to it.


  Bindings. Nodes bind GO and CL terms only, per the create-module convention;
  the inhibitor chemistry is described in prose and the antidotes carry CHEBI
  therapeutic_agent terms on the treatments. GO has no "acetylcholine
  accumulation" class, so the central node is bound to GO:0007271 synaptic
  transmission, cholinergic with modifier INCREASED, which states the sustained
  cholinergic signalling that the accumulation produces rather than asserting an
  accumulation term that does not exist.


  Worked conformers: Organophosphate_Poisoning and Nerve_Agent_Poisoning (both
  irreversible inhibitors that also age), and Carbamate_Poisoning (a reversible
  inhibitor that does not age).
pathophysiology:
- name: Acetylcholinesterase Inhibition
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    An anticholinesterase xenobiotic covalently modifies the serine hydroxyl in
    the catalytic site of acetylcholinesterase - carbamylation by a carbamate,
    phosphorylation by an organophosphate or nerve agent - inactivating the
    enzyme that hydrolyses acetylcholine, so acetylcholine breakdown falls.
  molecular_functions:
  - preferred_term: acetylcholinesterase activity
    modifier: DECREASED
    term:
      id: GO:0003990
      label: acetylcholinesterase activity
  biological_processes:
  - preferred_term: acetylcholine catabolic process
    modifier: DECREASED
    term:
      id: GO:0006581
      label: acetylcholine catabolic process
  downstream:
  - target: Synaptic Acetylcholine Accumulation
    description: Loss of acetylcholinesterase activity prevents breakdown of acetylcholine at synapses.
  evidence:
  - reference: PMID:24508992
    reference_title: Acute organophosphorus poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhibition of acetylcholinesterase enzyme is the main mechanism of toxicity of such pesticides and measurement of acetylcholinesterase activity is the commonly used laboratory diagnosis approved for the purpose."
    explanation: Supports acetylcholinesterase inhibition as the main toxic mechanism.
  - reference: PMID:17913691
    reference_title: "Red blood cell acetylcholinesterase and plasma butyrylcholinesterase status: important indicators for the treatment of patients poisoned by organophosphorus compounds."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhibition of acetylcholinesterase (AChE) is regarded as the primary toxic mechanism of organophosphorus compounds (OP)."
    explanation: Independently supports acetylcholinesterase inhibition as the primary toxic mechanism.
- name: Synaptic Acetylcholine Accumulation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    With acetylcholinesterase inhibited, acetylcholine released at cholinergic
    synapses is not degraded and accumulates at autonomic, neuromuscular and
    central synapses, producing sustained receptor stimulation. This is the
    rate-limiting, agent-agnostic step every conforming poisoning funnels through.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  downstream:
  - target: Muscarinic Receptor Overstimulation
    description: Excess acetylcholine overstimulates muscarinic acetylcholine receptors.
  - target: Nicotinic Receptor Overstimulation
    description: Excess acetylcholine overstimulates nicotinic acetylcholine receptors.
  - target: Central Cholinergic Overstimulation
    description: Excess acetylcholine overstimulates central nervous system cholinergic pathways.
  evidence:
  - reference: PMID:26563788
    reference_title: Organophosphorus and carbamate insecticide poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both organophosphorus (OP) and carbamate insecticides inhibit acetylcholinesterase (AChE), which results in accumulation of acetylcholine (ACh) at autonomic and some central synapses and at autonomic postganglionic and neuromuscular junctions."
    explanation: Supports acetylcholine accumulation across autonomic, central, and neuromuscular synapses, for both inhibitor classes.
- name: Muscarinic Receptor Overstimulation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Accumulated acetylcholine overstimulates muscarinic receptors on smooth
    muscle, glands and the heart, producing parasympathetic and secretory excess:
    miosis, lacrimation, salivation, bronchorrhea, bronchoconstriction,
    bradycardia, gastrointestinal hypermotility, sweating and urinary
    incontinence (the SLUDGE/DUMBELS pattern).
  biological_processes:
  - preferred_term: G protein-coupled acetylcholine receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007213
      label: G protein-coupled acetylcholine receptor signaling pathway
  downstream:
  - target: Cholinergic Crisis and Respiratory Failure
    description: Bronchorrhea and bronchoconstriction impair gas exchange and contribute to respiratory failure.
  evidence:
  - reference: PMID:26563788
    reference_title: Organophosphorus and carbamate insecticide poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACh binds to, and stimulates, muscarinic and nicotinic receptors, thereby producing characteristic features."
    explanation: Supports muscarinic receptor stimulation as the source of the characteristic muscarinic features.
- name: Nicotinic Receptor Overstimulation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Accumulated acetylcholine overstimulates nicotinic receptors at the
    neuromuscular junction and autonomic ganglia, causing fasciculations
    followed by depolarizing neuromuscular blockade and weakness, together with
    sympathetic ganglionic effects such as tachycardia and hypertension.
  cell_types:
  - preferred_term: muscle cell
    term:
      id: CL:0000187
      label: muscle cell
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
  downstream:
  - target: Cholinergic Crisis and Respiratory Failure
    description: Depolarizing neuromuscular block weakens the respiratory muscles and contributes to respiratory failure.
  evidence:
  - reference: PMID:25455666
    reference_title: Organophosphate and carbamate poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the setting of toxicity from either agent class, clinical syndromes result from excessive nicotinic and muscarinic neurostimulation."
    explanation: Supports nicotinic overstimulation as a source of the clinical syndrome, across inhibitor classes.
- name: Central Cholinergic Overstimulation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Acetylcholine accumulation in the central nervous system overstimulates
    central cholinergic pathways, producing anxiety, confusion, seizures and
    status epilepticus, depression of the central respiratory drive, and coma.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  downstream:
  - target: Cholinergic Crisis and Respiratory Failure
    description: Central depression of the respiratory center contributes to respiratory failure.
  evidence:
  - reference: PMID:37888716
    reference_title: Mechanisms of Organophosphate Toxicity and the Role of Acetylcholinesterase Inhibition.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In acute OP exposure, the subsequent surge of acetylcholine in cholinergic synapses causes a peripheral cholinergic crisis and status epilepticus (SE), either of which can lead to death."
    explanation: Supports central cholinergic overstimulation producing status epilepticus and a cholinergic crisis.
- name: Cholinergic Crisis and Respiratory Failure
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The muscarinic, nicotinic and central arms converge on a cholinergic crisis
    whose principal cause of death is respiratory failure, from the combination
    of muscarinic bronchorrhea and bronchoconstriction, nicotinic
    respiratory-muscle weakness, and central depression of the respiratory drive.
  biological_processes:
  - preferred_term: respiratory gaseous exchange by respiratory system
    modifier: DECREASED
    term:
      id: GO:0007585
      label: respiratory gaseous exchange by respiratory system
  evidence:
  - reference: PMID:17913691
    reference_title: "Red blood cell acetylcholinesterase and plasma butyrylcholinesterase status: important indicators for the treatment of patients poisoned by organophosphorus compounds."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reactivation is crucial within the neuromuscular synapse, where atropine is ineffective, since peripheral neuromuscular block eventually leads to respiratory failure."
    explanation: Links the neuromuscular arm to respiratory failure as the lethal endpoint.
treatments:
- name: Muscarinic Antagonist (atropine)
  description: >-
    Competitive muscarinic antagonist, the mainstay antidote; reverses the
    muscarinic (secretory and bronchospastic) arm and is titrated to drying of
    secretions. It does not act at the nicotinic neuromuscular junction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Muscarinic Receptor Overstimulation
    treatment_effect: INHIBITS
    description: Blocks the muscarinic receptors that the accumulated acetylcholine overstimulates.
  evidence:
  - reference: PMID:30159887
    reference_title: Acute and long-term consequences of exposure to organophosphate nerve agents in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Standard-of-care treatment for OP nerve agent acute exposure includes atropine, a muscarinic antagonist, pralidoxime (2-PAM), an oxime that regenerates acetycholinesterase activity in those molecules that are not aged, and diazepam, a benzodiazepine to stop/attenuate seizures."
    explanation: Atropine is the standard-of-care muscarinic antagonist for anticholinesterase poisoning.
- name: Oxime reactivator (pralidoxime)
  description: >-
    Reactivates inhibited acetylcholinesterase by displacing the inhibitor from
    the catalytic serine, relieving the inhibition node itself. It is effective
    only in enzyme molecules that have not aged, so its window is set by the
    agent-specific aging rate the conforming entry carries.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    For reversible carbamate inhibition the adduct decarbamylates
    spontaneously and does not age, so oxime use in carbamate poisoning is
    debated rather than standard; the conforming entry records that.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pralidoxime
      term:
        id: CHEBI:8354
        label: pralidoxime
  target_mechanisms:
  - target: Acetylcholinesterase Inhibition
    treatment_effect: INHIBITS
    description: Reverses the enzyme inhibition by reactivating acetylcholinesterase, before aging.
  evidence:
  - reference: PMID:18555982
    reference_title: Comparison of oxime reactivation and aging of nerve agent-inhibited monkey and human acetylcholinesterases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "the efficacy of an oxime primarily depends on its ability to reactivate nerve agent-inhibited acetylcholinesterase (AChE)"
    explanation: Oxime benefit depends on reactivating inhibited AChE, the node this treatment targets.
- name: Benzodiazepine
  description: >-
    First-line anticonvulsant for the seizures and status epilepticus of the
    central arm; by stopping seizures it also limits the downstream
    excitotoxic neuropathology. Efficacy declines the longer administration is delayed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Central Cholinergic Overstimulation
    treatment_effect: INHIBITS
    description: Suppresses the seizure activity driven by central cholinergic overstimulation.
  evidence:
  - reference: PMID:30159887
    reference_title: Acute and long-term consequences of exposure to organophosphate nerve agents in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Anticonvulsants such as benzodiazepines decrease seizure activity and improve outcome, but their efficacy depends upon the administration time after exposure to the nerve agent."
    explanation: Benzodiazepines control anticholinesterase seizures, with time-dependent efficacy.

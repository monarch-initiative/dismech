    term:
      id: GO:0004697
      label: diacylglycerol-dependent serine/threonine kinase activity
    modifier: INCREASED
  locations:
  - preferred_term: Spinal cord dorsal horn
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  evidence:
  - reference: PMID:42263270
    reference_title: "Inhibition of heat shock protein 90 in the mouse spinal cord enhances opioid antinociception through upregulation of PKCβ in CGRP neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We then used selective siRNA to identify PKCβ as the active isoform and
      further found PKCβ to be selectively activated in CGRP neurons by Hsp90
      inhibition and morphine combined.
    explanation: >-
      Establishes PKCbeta as the active PKC isoform selectively activated in CGRP
      neurons by combined Hsp90 inhibition and morphine. Evidence source
      MODEL_ORGANISM (mouse).
  - reference: PMID:42263270
    reference_title: "Inhibition of heat shock protein 90 in the mouse spinal cord enhances opioid antinociception through upregulation of PKCβ in CGRP neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      show that pan-PKC signaling contributes to the enhanced opioid
      antinociception observed in tail flick and postsurgical pain models
    explanation: >-
      Ties the PKC arm to the same postsurgical (paw-incision) pain context as the
      microglial Src arm, supporting it as a parallel amplifier.
  downstream:
  - target: ERK-RSK Cascade Activation
- name: ERK-RSK Cascade Activation
  description: >-
    The central effector and convergent hub. Spinal Hsp90 inhibition permits
    opioid-induced phosphorylation of ERK1/2 and increased abundance of the
    kinase RSK in the spinal dorsal horn. Mechanistically this convergence is
    gated by relief of an opioid-induced, AMPK-mediated negative feedback loop
    (Hsp90 inhibition lowers spinal AMPK, disabling the brake), and microglial
    Src acts upstream of ERK. Blocking ERK, RSK, or protein synthesis abolishes
    the enhancement, marking this cascade as the rate-limiting step every
    mechanistic arm funnels through.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Opioid-evoked ERK1/2 cascade activation
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  locations:
  - preferred_term: Spinal cord dorsal horn
    term:

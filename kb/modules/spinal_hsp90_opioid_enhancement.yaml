name: Spinal Hsp90 Inhibition Opioid Antinociceptive Enhancement Module
description: >-
  A conserved drug-mechanism module capturing how inhibition of the chaperone
  Heat shock protein 90 (Hsp90) restricted to the spinal cord amplifies
  mu-opioid receptor (MOR) antinociceptive signaling, enabling an
  opioid-sparing / dose-reduction strategy. In the spinal dorsal horn, Hsp90
  normally restrains a downstream MOR signaling cascade; intrathecal Hsp90
  inhibition (e.g. 17-AAG/tanespimycin, KU-32) releases this restraint,
  activating Src kinase in microglia, relieving an AMPK-mediated opioid-induced
  negative feedback loop, and permitting opioid-evoked ERK1/2 phosphorylation
  and RSK accumulation, which converge to enhance spinal MOR antinociceptive
  output. The net effect is boosted opioid analgesic potency with reduced
  tolerance and an improved therapeutic index. This module defines the
  mechanism-of-action pattern for spinal-selective Hsp90-inhibitor adjuvant
  treatments; pain-disorder entries can declare conformance on the pathophysiology
  nodes that model an opioid-sparing Hsp90 strategy, substituting the
  pain-context-specific model (thermal/tail-flick, incisional/postsurgical,
  neuropathic, cancer pain).
category: Module
creation_date: "2026-07-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It models the
  compartment-specific, direction-specific pharmacology characterized by the
  Streicher lab across a coherent series of mouse studies (PMID:32371496,
  PMID:37040443, PMID:41031962, PMID:42263270, PMID:38926482). The flagship
  paper for this module is Bowden et al. 2026 (PMID:41031962,
  DOI:10.1097/j.pain.0000000000003813), which established the microglial Src arm.

  CRITICAL SCOPE CAVEAT (compartment- and context-specificity). The
  enhancement is specific to the SPINAL CORD. Hsp90 regulates downstream opioid
  signaling OPPOSITELY in the brain versus the spinal cord: brain or systemic
  non-selective Hsp90 inhibition BLOCKS opioid antinociception (PMID:42263270,
  PMID:32701840), and in chemotherapy-induced peripheral neuropathy and
  cancer-induced bone pain models Hsp90 inhibitors reduced or blocked opioid
  antinociception (PMID:32701840). The translationally feasible route is
  therefore selective inhibition of the spinal-cord-active isoforms (Hsp90-beta,
  Grp94), not non-selective/systemic Hsp90 blockade (PMID:38926482). Do not let
  a conforming entry overstate this as a generic "Hsp90 inhibition relieves
  pain" claim.

  All evidence is MODEL_ORGANISM (mouse, intrathecal/intracerebroventricular
  dosing, CRISPR knockdown); the strategy is preclinical. Conforming
  disorder nodes should substitute the pain-context-specific model but keep the
  evidence_source as MODEL_ORGANISM until human data exist.

  Node term-binding follows module convention (GO/CL terms only; the drug
  identity CHEBI id lives on the treatment therapeutic_agent). Key conformance /
  treatment-relevant target: the trigger node "Spinal Hsp90 Chaperone Restraint
  of MOR Signaling" is where the drug acts (treatment target_mechanisms INHIBITS
  the restraint); the central effector "ERK-RSK Cascade Activation" is the
  convergent hub every mechanistic arm (microglial Src and CGRP-neuron PKCbeta)
  funnels through.
discussions:
- discussion_id: gap_hsp90_spinal_translational_selectivity
  prompt: >-
    Can spinal-cord-restricted Hsp90 inhibition (selective Hsp90-beta or Grp94
    inhibitors delivered systemically) reproduce in humans the opioid
    dose-reduction and tolerance-rescue seen in mice, without triggering the
    brain/systemic Hsp90-inhibition effect that blocks opioid antinociception?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Spinal Hsp90 Chaperone Restraint of MOR Signaling
  - pathophysiology#Increased Opioid Antinociception and Improved Therapeutic Index
  rationale: >-
    The entire module chain is established in mice with intrathecal or
    isoform-selective dosing. Because non-selective/systemic Hsp90 inhibition has
    the opposite (opioid-blocking) effect in the brain and in some cancer-pain
    models, clinical translation depends on achieving spinal-compartment or
    spinal-isoform selectivity in humans, which has not yet been demonstrated.
pathophysiology:
- name: Spinal Hsp90 Chaperone Restraint of MOR Signaling
  description: >-
    The trigger and the drug-target node, named for the biological process that
    the treatment acts on (following module convention). In the spinal dorsal
    horn the chaperone Hsp90 normally restrains a downstream mu-opioid receptor
    (MOR) signaling cascade. Pharmacological Hsp90 inhibition delivered
    intrathecally (17-AAG/tanespimycin, KU-32) removes this chaperone-imposed
    brake, enabling the amplified MOR signaling modeled by the downstream nodes.
    The effect is compartment-specific: inhibiting Hsp90 specifically in the
    spinal cord enhances opioid antinociception, whereas brain or systemic
    non-selective inhibition has the opposite, opioid-blocking effect.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Spinal Hsp90 chaperone activity restraining MOR signaling
    term:
      id: GO:0140662
      label: ATP-dependent protein folding chaperone
  locations:
  - preferred_term: Spinal cord dorsal horn
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  evidence:
  - reference: PMID:32371496
    reference_title: "Inhibition of Hsp90 in the spinal cord enhances the antinociceptive effects of morphine by activating an ERK-RSK pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we found that inhibiting Hsp90 specifically in the spinal cord
      enhanced the antinociceptive effects of morphine in mice.
    explanation: >-
      Establishes the trigger of this module: spinal-cord-restricted Hsp90
      inhibition enhances morphine antinociception. Evidence source is
      MODEL_ORGANISM because the effect was measured behaviorally in mice.
  - reference: PMID:41031962
    reference_title: "Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      when inhibited in the spinal cord through intrathecal administration of
      17-N-allylamino-17-demethoxygeldanamycin (17-AAG) in mice, led to an
      increase in morphine antinociception
    explanation: >-
      The flagship paper restates the intrathecal-17-AAG trigger that increases
      morphine antinociception in mice, the entry point for the Src/microglia
      mechanism it characterizes.
  - reference: PMID:42263270
    reference_title: "Inhibition of heat shock protein 90 in the mouse spinal cord enhances opioid antinociception through upregulation of PKCβ in CGRP neurons."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      regulates downstream opioid signaling oppositely in the brain vs the
      spinal cord
    explanation: >-
      Documents the compartment-specificity caveat: the enhancement is confined
      to the spinal cord and is opposite in direction to brain Hsp90 inhibition,
      constraining the scope of any conforming claim. Marked PARTIAL because it
      qualifies rather than fully supports a generic Hsp90-inhibition claim.
  - reference: PMID:32701840
    reference_title: "Heat shock protein 90 inhibitors block the antinociceptive effects of opioids in mouse chemotherapy-induced neuropathy and cancer bone pain models."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heat shock protein 90 inhibition in the brain or systemically completely
      blocked morphine and oxymorphone antinociception in chemotherapy-induced
      peripheral neuropathy
    explanation: >-
      First-class counter-evidence for the CRITICAL scope caveat: brain/systemic
      (non-spinal, non-selective) Hsp90 inhibition BLOCKS opioid antinociception,
      the opposite of the spinal effect. Marked PARTIAL because it refutes only
      an over-general reading of the module, not the spinal-specific claim.
      Evidence source MODEL_ORGANISM (mouse CIPN model).
  downstream:
  - target: Microglial Src Kinase Activation
  - target: PKCbeta Activation in CGRP Neurons
- name: Microglial Src Kinase Activation
  description: >-
    The amplifier arm characterized by the flagship study. Following spinal
    Hsp90 inhibition, Src-family kinase is upregulated and activated in the
    spinal dorsal horn, where activated Src colocalizes with microglia.
    Microglial Src is causally required: microglial-specific Src CRISPR knockdown
    abolishes the enhanced antinociception, and pharmacological microglial
    inhibition (minocycline/PLX3397) mimics the Hsp90-inhibition effect while
    microglial activation (LPS) reverses it. Src acts upstream of ERK in this
    cascade.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spinal dorsal horn microglia
    term:
      id: CL:0000129
      label: microglial cell
  molecular_functions:
  - preferred_term: Src-family kinase activity
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    modifier: INCREASED
  locations:
  - preferred_term: Spinal cord dorsal horn
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  evidence:
  - reference: PMID:41031962
    reference_title: "Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunohistochemistry confirmed the upregulation of Src in the spinal
      dorsal horn and colocalization of activated Src with microglia.
    explanation: >-
      Localizes the activated Src to the spinal dorsal horn and to microglia,
      defining the cellular substrate of this amplifier node.
  - reference: PMID:41031962
    reference_title: "Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we used microglial-specific CRISPR knockdown to confirm that microglial
      Src is essential to the enhanced opioid antinociception observed with
      spinal Hsp90 inhibition
    explanation: >-
      Establishes causal necessity of microglial Src via cell-type-selective
      CRISPR knockdown, the key result of the flagship paper.
  downstream:
  - target: ERK-RSK Cascade Activation
- name: PKCbeta Activation in CGRP Neurons
  description: >-
    A second, parallel amplifier arm established by the same lab with the same
    cell-type-selective CRISPR logic as the microglial Src arm. Spinal Hsp90
    inhibition (with opioid) selectively activates protein kinase C beta (PKCbeta)
    in calcitonin-gene-related-peptide (CGRP) primary-afferent neurons of the
    dorsal horn; PKCbeta in these specific cells is required for the enhanced
    opioid antinociception. Like the Src arm, this contributes to the convergent
    ERK/downstream MOR signaling enhancement, and it was demonstrated in tail-flick
    and postsurgical (paw-incision) pain models.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CGRP-positive peptidergic nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:

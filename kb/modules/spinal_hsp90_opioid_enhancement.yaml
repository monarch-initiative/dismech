treatments:
- name: Spinal-Selective Hsp90 Inhibitor (Opioid Adjuvant)
  description: >-
    A spinal-cord-directed Hsp90 inhibitor used as an opioid adjuvant to
    potentiate analgesia and enable dose reduction. Tool compounds are the
    intrathecally delivered non-selective inhibitors 17-AAG (tanespimycin) and
    KU-32; the translationally feasible form is a systemically delivered
    inhibitor selective for the spinal-cord-active isoforms Hsp90-beta (KUNB106)
    or Grp94 (KUNG65), which enhance opioid antinociception and rescue tolerance
    while avoiding the opioid-blocking effect of brain/systemic non-selective
    Hsp90 inhibition. This is the drug-target design pattern for conforming
    pain-disorder entries: a treatment acting on the upstream Hsp90 trigger node,
    not on a downstream pain phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 17-AAG (tanespimycin)
      term:
        id: CHEBI:64153
        label: tanespimycin
  target_mechanisms:
  - target: Spinal Hsp90 Chaperone Restraint of MOR Signaling
    treatment_effect: INHIBITS
    description: >-
      The inhibitor blocks spinal-cord Hsp90 chaperone activity, relieving its
      restraint on the downstream MOR cascade (Src/microglia, AMPK-feedback
      relief, ERK-RSK) and thereby amplifying opioid antinociception. Spinal
      compartment or isoform selectivity is required, since brain/systemic
      non-selective inhibition blocks opioid antinociception instead.
  evidence:
  - reference: PMID:38926482
    reference_title: "Inhibiting spinal cord-specific hsp90 isoforms reveals a novel strategy to improve the therapeutic index of opioid treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these results suggest that selective inhibition of spinal cord
      Hsp90 isoforms is a novel, translationally feasible strategy to improve the
      therapeutic index of opioids.
    explanation: >-
      Supports the drug-target pattern: selective inhibition of spinal-cord Hsp90
      isoforms improves the opioid therapeutic index, defining the treatment's
      mechanism of action against the trigger node.

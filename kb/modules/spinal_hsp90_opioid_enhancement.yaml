    reference_title: "Inhibition of heat shock protein 90 in the mouse spinal cord enhances opioid antinociception through upregulation of PKCβ in CGRP neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the spinal cord, we have found that Hsp90 inhibition enables
      antinociceptive signaling and disables pronociceptive signaling to enhance

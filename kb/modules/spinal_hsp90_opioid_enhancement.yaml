  evidence:
  - reference: PMID:32371496
    reference_title: "Inhibition of Hsp90 in the spinal cord enhances the antinociceptive effects of morphine by activating an ERK-RSK pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hsp90 inhibition enabled opioid-induced phosphorylation of the kinase ERK
      and increased abundance of the kinase RSK in the dorsal horns of the
      spinal cord
    explanation: >-
      Establishes the ERK-RSK cascade as the signaling readout enabled by spinal
      Hsp90 inhibition, and (with the protein-synthesis/ERK/RSK block
      experiments) as necessary for the enhancement.
  - reference: PMID:37040443
    reference_title: "HSP90 inhibition in the mouse spinal cord enhances opioid signaling by suppressing an AMPK-mediated negative feedback loop."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the underlying mechanism involves the relief of a negative feedback loop
      mediated by the kinase AMPK
    explanation: >-
      Identifies relief of an AMPK-mediated negative feedback loop as the
      mechanism gating ERK activation downstream of Hsp90 inhibition.
  - reference: PMID:41031962
    reference_title: "Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Src is upstream of extracellular signal-regulated kinase in this signaling
      cascade
    explanation: >-
      Places microglial Src upstream of ERK, connecting the amplifier node to
      this central effector.
  downstream:
  - target: Enhanced Spinal Mu-Opioid Receptor Antinociceptive Signaling
- name: Enhanced Spinal Mu-Opioid Receptor Antinociceptive Signaling
  description: >-
    The effector node. The relieved, amplified cascade downstream of the
    spinal mu-opioid receptor increases antinociceptive output while the
    Hsp90-restrained pronociceptive arm is disabled. This enhanced MOR signaling
    is localized to the spinal cord and is the disorder-agnostic convergence
    point that translates the molecular cascade into increased analgesic
    efficacy.
  role: effector
  biological_scale: CELLULAR
  biological_processes:

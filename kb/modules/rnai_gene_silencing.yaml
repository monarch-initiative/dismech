- name: Patisiran
  description: >-
    The first approved RNAi therapeutic, and the worked example of the
    lipid-nanoparticle delivery platform: an unconjugated siRNA against TTR mRNA
    encapsulated in an ionizable lipid nanoparticle and infused intravenously
    every three weeks.
  action_category: THERAPEUTIC
  therapeutic_modality: SIRNA
  oligonucleotide_details:
    oligonucleotide_mechanism: RNAI_KNOCKDOWN
    target_gene:
      preferred_term: TTR
      term:
        id: hgnc:12405
        label: TTR
    target_transcript: TTR mRNA
    conjugation: UNCONJUGATED
    delivery_platform: LIPID_NANOPARTICLE
  dosing_interval: once every 3 weeks
  dosing_interval_days: 21
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

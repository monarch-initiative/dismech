discussions:
- discussion_id: gap_sirna_endosomal_escape_fraction
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of an administered siRNA dose actually escapes the endosome, and does
    the escape fraction differ enough between delivery platforms to explain their
    different dosing intervals?
  rationale: >-
    Endosomal escape is the least characterized step in the chain above. It is
    widely reported to be inefficient for unassisted conjugate uptake, and the
    catalytic nature of RISC is invoked to explain why that is nonetheless
    sufficient. But the module's delivery node cites platform identity, not a
    measured escape fraction, and the cached sources here do not quantify it. The
    dosing intervals recorded on the treatments above are label facts; attributing
    the difference between them specifically to escape kinetics rather than to
    duplex stability or tissue residence would be an inference this module does not
    currently support.
  attaches_to:
  - pathophysiology#Target-Cell siRNA Delivery

name: RNAi Gene Silencing Therapy Module
description: >-
  A conserved mechanism module representing therapeutic RNA interference (RNAi):
  the paradigm in which a chemically stabilized double-stranded small interfering
  RNA (siRNA) is delivered to a target cell, its guide strand is loaded into the
  RNA-induced silencing complex (RISC), and Argonaute-2 catalytically cleaves the
  sequence-matched transcript. Loading and cleavage are one node here rather than
  two - see the note on node granularity. The therapeutic consequence is a sustained,
  dose-dependent reduction in the encoded protein.
  This is the double-stranded counterpart of the RNase H branch of
  antisense_oligonucleotide_therapy. Both reduce a pathogenic transcript by
  base-pairing, and both are programmable - the chemistry and delivery are held
  constant while the targeting sequence is changed for a new disease - but they
  use different effectors (Argonaute-2 slicer versus RNase H1) and are therefore
  modeled as sibling modules rather than as one.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disorder-specific gene, transcript, and
  protein while preserving the shared delivery-to-cleavage-to-protein-reduction
  chain.
category: Module
creation_date: "2026-08-26T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease, and conformance is
  node-level consistency rather than inheritance.
  Scope: use this module for treatments whose operative mechanism is
  Argonaute-mediated cleavage of a target mRNA by an exogenous double-stranded
  siRNA. Exclude single-stranded antisense oligonucleotides, which belong to
  antisense_oligonucleotide_therapy even when they knock a transcript down -
  the effector is RNase H1, not RISC. Exclude endogenous miRNA biology, miRNA
  mimics and antimiRs, shRNA expressed from a viral vector (the delivery node
  below assumes a synthetic duplex administered as a drug), and CRISPR
  interference.
  The delivery node is deliberately part of the chain rather than a module of
  its own. Delivery is what makes an RNAi drug organ-specific, so it is the node
  a conforming disorder entry specializes - hepatocyte ASGR1 uptake of a GalNAc
  conjugate for a liver target, intrathecal or lipid-conjugate delivery for a CNS
  target. The chemistry of a given platform is not itself a pathophysiology
  claim: record it on the treatment via oligonucleotide_details
  (delivery_platform, conjugation, oligonucleotide_chemistry) rather than as
  additional nodes here.
  Node granularity: RISC loading is described inside the Argonaute-2 cleavage
  node rather than modeled as a node of its own. It was one initially, and was
  folded in on review: the cached sources here describe the Argonaute slicer
  degrading the transcript, but none of them mention RISC, the passenger strand,
  or guide-strand selection, so a separate loading node asserted three claims and
  its ontology bindings (GO:0016442, GO:0035197) carried no evidence at all. The
  step is textbook biology, and if a source that states it is later cached the
  node can be split back out; until then the module does not claim a step it
  cannot cite. ATTR_Amyloidosis, the only conformer, already collapses loading
  and cleavage into one node.
  Evidence discipline: every node below is supported by a source that describes
  the step in a named, marketed or trialed siRNA drug. The mechanism is well
  established, but a conforming disorder entry must still cite its own
  disease-specific evidence that the named transcript is the pathogenic one and
  that silencing it produces the claimed protein reduction - a modality tag and
  a plausible target are not sufficient. Where a conformer's siRNA is preclinical
  or allele-selective proof of concept (several are), say so rather than
  inheriting this module's approved-drug evidence. Where a clinical-outcome trial
  is cited as validation of the mechanism it targets rather than as a measurement
  of the node itself, keep supports: SUPPORT and record directness: INDIRECT.
  Every delivery-to-effector edge is conditional on administration of the
  sequence-matched siRNA and must say so explicitly.

pathophysiology:
- name: Pathogenic Transcript Abundance
  description: >-
    The disease-causing transcript is transcribed and translated at a level that
    produces harmful amounts of the encoded protein, or produces a protein whose
    intrinsic properties are pathogenic. The transcript is usually structurally
    normal - it is the abundance of its product, or that product's toxicity, that
    drives disease - which makes reducing the message, rather than inhibiting the
    protein after it is made, the upstream therapeutic target. This is the same
    upstream state that the RNase H branch of antisense_oligonucleotide_therapy
    addresses; it is restated here so an RNAi conformer has an anchor that does
    not imply an ASO effector. Worked targets include TTR mRNA in ATTR
    amyloidosis, PCSK9 mRNA in familial hypercholesterolemia, ALAS1 mRNA in acute
    intermittent porphyria, and APOC3 mRNA in familial chylomicronemia syndrome.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mRNA metabolic process
    term:
      id: GO:0016071
      label: mRNA metabolic process
    modifier: INCREASED
  evidence:
  - reference: DOI:10.1007/s40259-023-00577-7
    reference_title: RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic strategies, which are aimed at reducing ongoing ATTR amyloid
      fibrillogenesis, include stabilization of the circulating TTR tetramer or
      reduction of TTR synthesis.
    explanation: >-
      Establishes reduction of synthesis of the pathogenic protein - rather than
      action on the protein once made - as a distinct therapeutic target, which is
      the state this trigger node represents.
  downstream:
  - target: Target-Cell siRNA Delivery
    description: >-
      Conditional on administration of a sequence-matched siRNA drug, the duplex
      is carried to the cell that expresses the pathogenic transcript.
    causal_link_type: DIRECT

- name: Target-Cell siRNA Delivery
  description: >-
    A chemically stabilized siRNA duplex reaches the cytosol of the cell that
    transcribes the target gene. Naked siRNA cannot do this unaided: it is
    degraded by serum nucleases, cannot cross the plasma membrane, and is digested
    in the endosome after uptake. Two platforms solve this in approved drugs. An
    ionizable lipid nanoparticle encapsulates the duplex and, on endosomal
    acidification, becomes positively charged and destabilizes the endosomal
    membrane (patisiran). Alternatively, a tri-antennary GalNAc conjugate on a
    nuclease-resistant duplex engages the asialoglycoprotein receptor on
    hepatocytes, driving receptor-mediated endocytosis, after which a small
    fraction escapes the endosome - enough, because RISC-mediated cleavage is catalytic
    (vutrisiran, inclisiran, givosiran).
    This is the node a conforming disorder entry specializes to its own target
    organ; the two platforms above are the liver-directed case, not the general
    one.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: receptor-mediated endocytosis of a GalNAc-conjugated siRNA
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
    modifier: INCREASED
  evidence:
  - reference: DOI:10.1007/s40259-023-00577-7
    reference_title: RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patisiran is formulated in a lipid nanoparticle to ensure delivery to the
      hepatocyte.
    explanation: >-
      Documents the lipid-nanoparticle delivery platform in an approved siRNA drug.
  - reference: DOI:10.1007/s40259-023-00577-7
    reference_title: RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Revusiran is conjugated to N-acetylgalactosamine (GalNAc), which promotes
      the interaction with the asialoglycoprotein receptor, widely expressed on
      hepatocytes.
    explanation: >-
      Documents the GalNAc-asialoglycoprotein-receptor route as the alternative
      delivery platform. Revusiran itself was discontinued in development; the
      quote is cited for the conjugate-uptake mechanism, which is shared by the
      approved GalNAc siRNAs, not as evidence for that drug.
  downstream:
  - target: Argonaute-2 Cleavage of the Target Transcript
    description: >-
      Once in the cytosol, the duplex is handed to the RNA-induced silencing
      complex, whose guide strand directs Argonaute-2 to the matching transcript.
    causal_link_type: DIRECT

- name: Argonaute-2 Cleavage of the Target Transcript
  description: >-
    The cytosolic siRNA duplex is loaded into the RNA-induced silencing complex, the
    passenger strand is discarded, and the retained guide strand directs the complex
    by Watson-Crick base pairing to the transcript carrying the matching sequence.
    That guide-strand selection is what makes the platform programmable: the protein
    machinery is endogenous and constant, and only the loaded sequence changes between
    one disease and the next. Loading is described here as setup rather than modeled as
    its own node - see the note on node granularity below.
    Argonaute-2, the sole catalytically competent human Argonaute, endonucleolytically
    cleaves the guide-paired transcript. The cleaved fragments are degraded by
    cytoplasmic exonucleases and the guide-loaded complex is released to engage
    another transcript, so silencing is catalytic rather than stoichiometric. That
    catalytic turnover is what allows the very small fraction of an administered
    dose that escapes the endosome to produce a therapeutic effect, and is the
    proximate reason GalNAc siRNAs can be dosed quarterly or twice yearly.
    This is the RNAi counterpart of the
    antisense_oligonucleotide_therapy#RNase H-Mediated Transcript Degradation node.
    Both degrade the target message; the effector differs, and a disorder entry
    should conform to the one that matches its drug rather than treating them as
    interchangeable.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Argonaute-2 slicer activity
    term:
      id: GO:0070551
      label: endoribonuclease activity, cleaving siRNA-paired mRNA
    modifier: INCREASED
  biological_processes:
  - preferred_term: siRNA-mediated degradation of the target transcript
    term:
      id: GO:0090625
      label: siRNA-mediated gene silencing by mRNA destabilization
    modifier: INCREASED
  evidence:
  - reference: DOI:10.1007/s40259-023-00577-7
    reference_title: RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Binding triggers activation of the Argonaute slicer protein, which degrades
      the mRNA, thereby inhibiting TTR synthesis
    explanation: >-
      Directly attributes transcript degradation, and the resulting block on protein
      synthesis, to Argonaute slicer activity.
  - reference: PMID:29972753
    reference_title: Patisiran, an RNAi Therapeutic, for Hereditary Transthyretin Amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patisiran, an investigational RNA interference therapeutic agent, specifically inhibits hepatic synthesis of transthyretin."
    explanation: >-
      Confirms in a phase 3 human trial that the RNA-interference mechanism
      specifically suppresses synthesis of the targeted protein.
  downstream:
  - target: Sustained Reduction of the Encoded Protein
    description: >-
      Loss of the message removes the template for translation, lowering the
      steady-state level of the encoded protein.
    causal_link_type: DIRECT

- name: Sustained Reduction of the Encoded Protein
  description: >-
    Steady-state levels of the encoded protein fall in proportion to the degree of
    transcript knockdown, and remain suppressed for as long as the guide-loaded
    complex persists. The reduction is deep - typically 80% or more of circulating
    protein for a liver-expressed target - and long-lived, which is what converts a
    molecular effect into an interval-dosed medicine. Because silencing is
    reversible and does not alter the genome, protein levels recover when dosing
    stops; this distinguishes RNAi from gene editing and is the reason these are
    chronic therapies.
    Downstream disease benefit is not asserted here. It depends on whether the
    silenced protein is genuinely causal in the disease at hand and on how much
    irreversible damage has already accrued, so a conforming disorder entry must
    carry its own outcome evidence.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: DECREASED
  evidence:
  - reference: DOI:10.1007/s40259-023-00577-7
    reference_title: RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vutrisiran achieved a dose-dependent TTR knockdown; a single 25 mg
      subcutaneous dose resulted in a maximum TTR reduction of 80%, which was
      sustained for 90 days
    explanation: >-
      Quantifies both the depth and the duration of protein reduction after a single
      dose of a GalNAc-conjugated siRNA, which is the property this node claims.
  - reference: PMID:32197277
    reference_title: "Inclisiran for the Treatment of Heterozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a twice-yearly injection of inclisiran, a small interfering RNA, was shown to inhibit hepatic synthesis of PCSK9 in adults with heterozygous familial hypercholesterolemia."
    explanation: >-
      Demonstrates the same sustained-knockdown consequence for a different gene and
      a different disease, which is what makes this a module rather than a
      disease-specific mechanism.
  - reference: PMID:35067977
    reference_title: "RNAi therapy with givosiran significantly reduces attack rates in acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The results of clinical trials have shown that givosiran treatment
      leads to a rapid and sustained reduction of ALAS1 mRNA, decreased heme
      precursor levels, and a decreased rate of acute attacks compared with
      placebo.
    explanation: >-
      A third gene and disease showing rapid and sustained transcript-level
      knockdown with a downstream biochemical consequence.


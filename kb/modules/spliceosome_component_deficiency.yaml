name: Spliceosome Component Deficiency Module
description: >-
  A conserved mechanism module for the spliceosomopathies: disorders caused
  by germline loss of a core component of the pre-mRNA splicing machinery, a
  snRNP protein (EFTUD2, SF3B4, SNRPB, TXNL4A, PRPF31, PRPF8) or a spliceosomal
  snRNA gene (RNU4-2, RNU4ATAC, RNU12). The spliceosome is required in every
  cell, yet each lesion produces a sharply restricted phenotype, and the
  chain this module factors out is the same in every case: the deficient
  component reduces assembly or activation of the spliceosome, splicing of
  the transcriptome is disrupted in a measurable and component-specific
  pattern (5' splice-site misuse for U4, retention of U12-type introns for
  the minor spliceosome, exon skipping and intron retention for the U2 and U5
  snRNP proteins), and a subset of splicing-sensitive, lineage-critical
  transcripts falls below the level the most dependent cell type needs. The
  terminal node is set by which lineage that is: cranial neural crest
  (mandibulofacial dysostosis with microcephaly, Nager, Burn-McKeown,
  cerebrocostomandibular syndrome), photoreceptors (PRPF31 and PRPF8
  retinitis pigmentosa), or neural progenitors and cerebellar neurons (ReNU
  syndrome, Roifman syndrome, MOPD type I, RNU12 ataxia). Conforming entries
  substitute the component, the major or minor spliceosome, the splicing
  signature, and the vulnerable lineage. Key conformance target:
  `spliceosome_component_deficiency#Transcriptome-Wide Pre-mRNA Mis-Splicing`.
  Deliberately complementary to `photoreceptor_degeneration`, which the
  retinal branch feeds (a PRPF entry conforms to both, at different nodes),
  to `pol1_nucleolar_stress_neural_crest_apoptosis` (Treacher Collins, a
  neurocristopathy reached through ribosome biogenesis rather than splicing),
  and to `fame_pentanucleotide_repeat_rna_toxicity`, where splicing factors
  are sequestered by a toxic RNA rather than lost by mutation.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
- NEUROSCIENCE
creation_date: "2026-10-08T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "spliceosome_component_deficiency#Transcriptome-Wide Pre-mRNA
  Mis-Splicing").

  Scope decision - the lesion is in the machine, not in the message. A
  cis-acting splice-site variant in one gene (Canavan ASPA, Behr OPA1,
  Frasier WT1 intron 9, Pompe GAA) mis-splices that one transcript and is an
  ordinary loss-of-function allele of that gene; it does not conform here.
  Nor does sequestration of splicing factors by an expanded-repeat RNA (Fuchs
  endothelial corneal dystrophy, myotonic dystrophy, SCA31 and SCA36), which
  is RNA toxicity with the spliceosome intact. Somatic SF3B1, SRSF2 and U2AF1
  hotspot mutations in myelodysplastic syndrome and uveal melanoma are
  change-of-function lesions that alter branch-point choice rather than
  deplete a component; they are out of scope until a neoplastic branch is
  curated with its own evidence. THOC6 and EIF4A3 act on the TREX export
  complex and the exon junction complex respectively, downstream of
  splicing; THOC6 syndrome does not conform, and EIF4A3
  (Richieri-Costa-Pereira) is a borderline case the craniofacial reviews
  include that a conforming entry should justify in its own notes.

  Major and minor spliceosome are two branches of one trigger node, not two
  modules. They share the chain (component deficiency, measurable splicing
  disruption, lineage-restricted transcript loss, lineage-restricted
  phenotype) and differ in the signature the central node carries - U12-type
  intron retention for RNU4ATAC and RNU12, 5' splice-site misuse for RNU4-2,
  exon skipping and intron retention for the U2 and U5 snRNP proteins. A
  conforming entry records which in the central node's description.

  Node-level substitutions. Trigger: the component and its snRNP (U5 for
  EFTUD2 and TXNL4A, U2 for SF3B4, Sm core for SNRPB, U4/U6 tri-snRNP for
  PRPF31, PRPF8 and RNU4-2, minor U4atac/U12 for RNU4ATAC and RNU12), and the
  allelic mechanism (de novo haploinsufficiency for EFTUD2 and SF3B4,
  biallelic hypomorphic promoter plus null alleles for TXNL4A, de novo
  dominant for RNU4-2, biallelic for RNU4ATAC and RNU12, and the SNRPB
  poison-exon auto-regulatory mechanism). Consequence: whichever of the
  three lineage nodes the entry's phenotype sits in; an entry may conform to
  more than one (Roifman syndrome has both skeletal and cognitive
  involvement).

  Why the lineage is restricted is the open question. The two retinal papers
  cited on the central and effector nodes both state that it is unknown how a
  ubiquitous splicing-factor deficiency produces a photoreceptor-only
  disease, and the neural crest reviews offer a timing model (a window of
  high splicing demand during neural crest specification and migration)
  without a discriminating test. The KNOWLEDGE_GAP discussion below holds
  that question; the effector node states the observation only.
pathophysiology:
- name: Core Spliceosome Component Deficiency
  description: >-
    A germline variant reduces the amount or function of a core spliceosomal
    protein or snRNA. Mechanisms differ by gene - de novo haploinsufficiency
    (EFTUD2, SF3B4), biallelic hypomorphic promoter plus null alleles
    (TXNL4A), increased inclusion of a poison exon that triggers
    nonsense-mediated decay of the component's own transcript (SNRPB), or
    point variants in a conserved structural element of a non-coding snRNA
    (RNU4-2, RNU4ATAC, RNU12) - but each lowers the pool of functional
    spliceosomes, measured as reduced assembly of the U4/U6.U5 tri-snRNP or
    of the minor spliceosome. Conforming entries substitute the component,
    its snRNP, and the allelic mechanism.
  role: trigger
  biological_processes:
  - preferred_term: spliceosomal complex assembly
    term:
      id: GO:0000245
      label: spliceosomal complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:32315467
    reference_title: "Spliceosomopathies and neurocristopathies: Two sides of the same coin?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in core components of the spliceosome are responsible for a group of syndromes collectively known as spliceosomopathies."
    explanation: Defines the lesion class this trigger node represents.
  - reference: PMID:22305528
    reference_title: "Haploinsufficiency of a spliceosomal GTPase encoded by EFTUD2 causes mandibulofacial dysostosis with microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A range of EFTUD2-mutation types, including null alleles and frameshifts, is seen in MFDM, consistent with haploinsufficiency; segregation is de novo in all cases assessed to date."
    explanation: The haploinsufficiency allelic mechanism for a U5 snRNP protein.
  - reference: PMID:25434003
    reference_title: "Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depletion of TXNL4A (Dib1) in yeast demonstrated reduced assembly of the tri-snRNP complex."
    explanation: Direct measurement of the assembly defect this node's GO binding describes.
  - reference: PMID:25047197
    reference_title: "Disrupted auto-regulation of the spliceosomal gene SNRPB causes cerebro-costo-mandibular syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These mutations cause increased inclusion of the alternative exon and decreased overall expression of SNRPB."
    explanation: The poison-exon mechanism by which an Sm core protein is depleted.
  - reference: PMID:24003905
    reference_title: "Nager syndrome: confirmation of SF3B4 haploinsufficiency as the major cause."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SF3B4 is the major gene responsible for autosomal dominant Nager syndrome. All mutations reported predict null alleles, therefore precluding genotype-phenotype correlations."
    explanation: The U2 snRNP protein branch, again by haploinsufficiency.
  - reference: PMID:26522830
    reference_title: "Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman Syndrome by disrupting minor intron splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compound heterozygous rare variants that disrupt highly conserved positions of the RNU4ATAC small nuclear RNA gene, a minor spliceosome component that is essential for minor intron splicing"
    explanation: The snRNA-gene branch, in the minor spliceosome.
  downstream:
  - target: Transcriptome-Wide Pre-mRNA Mis-Splicing
    causal_link_type: DIRECT
    description: >-
      Fewer functional spliceosomes, or spliceosomes that activate
      incorrectly, mis-process the introns that depend most on the missing
      component.
- name: Transcriptome-Wide Pre-mRNA Mis-Splicing
  description: >-
    Splicing of the transcriptome is disrupted in a pattern specific to the
    lost component: systematic misuse of 5' splice sites (RNU4-2), retention
    of U12-type introns across the hundreds of minor-intron genes (RNU4ATAC,
    RNU12), and exon skipping or intron retention in a distinct subset of
    pre-mRNAs (PRPF31, SF3B4, EFTUD2). This is the rate-limiting step every
    conforming disorder funnels through and the one RNA sequencing of patient
    cells measures directly; a conforming entry records the signature here.
  role: central_effector
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  evidence:
  - reference: PMID:38991538
    reference_title: "De novo variants in the RNU4-2 snRNA cause a frequent neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "5' splice-site use is systematically disrupted in individuals with RNU4-2 variants, consistent with the known role of this region during spliceosome activation."
    explanation: The major-spliceosome snRNA signature, measured in patients.
  - reference: PMID:26522830
    reference_title: "Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman Syndrome by disrupting minor intron splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA-seq analysis confirms extensive and specific defects of minor intron splicing."
    explanation: The minor-spliceosome signature in RNU4ATAC patients.
  - reference: PMID:27863452
    reference_title: "Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNAseq showed splicing disruption specific to all U12-type introns detected in blood monocytes from affected individuals."
    explanation: The same minor-spliceosome signature from a different component, confirming it is a property of the branch rather than the gene.
  - reference: PMID:28965864
    reference_title: "Minor spliceosome and disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A common theme in these diseases is the detection of elevated levels of transcripts containing U12-type introns, of which a subset is associated with other splicing defects."
    explanation: Review statement of the minor-intron-retention signature as the common theme.
  - reference: PMID:31654038
    reference_title: "PRPF31 reduction causes mis-splicing of the phototransduction genes in human organotypic retinal culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data revealed that PRPF31 deficiency leads to the mis-splicing of a distinct subset of pre-mRNAs with a widespread effect on phototransduction and RNA processing."
    explanation: The U4/U6 tri-snRNP protein signature in human retinal tissue.
  downstream:
  - target: Selective Depletion of Splicing-Sensitive Lineage Transcripts
    causal_link_type: DIRECT
    description: >-
      Mis-spliced transcripts are degraded or retained in the nucleus, and
      the genes whose introns depend most on the lost component lose
      expression first.
- name: Selective Depletion of Splicing-Sensitive Lineage Transcripts
  description: >-
    Despite the ubiquitous requirement for splicing, expression loss is
    confined to a subset of transcripts - phototransduction genes (RHO, ROM1,
    GNAT1) and other splicing factors in PRPF31 deficiency, minor-intron genes
    linked to cerebellar degeneration in RNU12 deficiency, neural crest
    developmental programs in the craniofacial disorders. Which subset falls
    below threshold sets the vulnerable lineage. This node records that
    selectivity as an observation; the module's KNOWLEDGE_GAP discussion holds
    the unanswered question of why it occurs.
  role: effector
  biological_processes:
  - preferred_term: expression of splicing-sensitive lineage transcripts
    term:
      id: GO:0010467
      label: gene expression
    modifier: DECREASED
  evidence:
  - reference: PMID:21051334
    reference_title: "Systemic splicing factor deficiency causes tissue-specific defects: a zebrafish model for retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite reducing the level of a constitutive splicing factor, no general defects in gene expression were found. Instead, retinal genes were selectively affected, providing the first in vivo link between mutations in splicing factors and the RP phenotype."
    explanation: The selectivity measured in vivo - a constitutive factor, a retina-restricted expression loss.
  - reference: PMID:31654038
    reference_title: "PRPF31 reduction causes mis-splicing of the phototransduction genes in human organotypic retinal culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the PRPF31 deficiency causes mis-splicing of genes involved in RNA processing (PRPF3, PRPF8, PRPF4, and PRPF19) and phototransduction (RHO, ROM1, FSCN2, GNAT2, and GNAT1) in the retina in the PRPF31 reduced samples"
    explanation: Names the transcript subset for the photoreceptor branch.
  - reference: PMID:27863452
    reference_title: "Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "144 minor intron-containing RNAs were differentially expressed, including transcripts for 3 genes previously associated with cerebellar neurodegeneration"
    explanation: Names the transcript subset for the cerebellar branch.
  downstream:
  - target: Neural Crest-Derived Craniofacial Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      When the depleted transcripts are those cranial neural crest cells need
      during specification and migration, the result is mandibulofacial or
      acrofacial dysostosis.
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      When the depleted transcripts are phototransduction genes, rod
      photoreceptors degenerate.
  - target: Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      When the depleted transcripts are those neural progenitors or cerebellar
      neurons depend on, the result is microcephaly, intellectual disability
      or ataxia.
- name: Neural Crest-Derived Craniofacial Malformation
  description: >-
    Cranial neural crest cells fail to populate or pattern the first and
    second pharyngeal arches, producing malar and mandibular hypoplasia,
    external ear anomalies, choanal atresia and cleft palate - the shared
    facies of mandibulofacial dysostosis with microcephaly, Nager syndrome,
    Burn-McKeown syndrome and cerebrocostomandibular syndrome. Conforming
    entries substitute the arch derivatives most affected.
  role: consequence
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    term:
      id: GO:0014032
      label: neural crest cell development
    modifier: DECREASED
  evidence:
  - reference: PMID:32315467
    reference_title: "Spliceosomopathies and neurocristopathies: Two sides of the same coin?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Craniofacial malformations in these patients are predominantly found in neural crest cells-derived structures of the face and head."
    explanation: Localizes the malformations to neural crest derivatives.
  - reference: PMID:25865758
    reference_title: "A review of craniofacial disorders caused by spliceosomal defects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SF3B4 in Nager syndrome, an acrofacial dysostosis (AFD); SNRPB in cerebrocostomandibular syndrome, characterized by Robin sequence and rib defects; EIF4A3 in the AFD Richieri-Costa-Pereira syndrome, characterized by Robin sequence, median mandibular cleft and limb defects; and TXNL4A in Burn-McKeown syndrome, involving specific craniofacial dysmorphisms."
    explanation: The set of craniofacial conformers and their defining features.
  - reference: PMID:22305528
    reference_title: "Haploinsufficiency of a spliceosomal GTPase encoded by EFTUD2 causes mandibulofacial dysostosis with microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major sequelae, including choanal atresia, sensorineural hearing loss, and cleft palate, each occur in a significant proportion of affected individuals."
    explanation: The arch-derivative phenotype in the index spliceosomopathy cohort.
- name: Photoreceptor Degeneration
  description: >-
    Rod photoreceptors degenerate progressively, producing retinitis
    pigmentosa, when the depleted transcripts are phototransduction genes.
    This is the autosomal dominant PRPF31, PRPF8, PRPF3 and SNRNP200 branch;
    a conforming entry should also conform to the `photoreceptor_degeneration`
    module, which carries the downstream rod-to-cone degeneration chain.
  role: consequence
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:21051334
    reference_title: "Systemic splicing factor deficiency causes tissue-specific defects: a zebrafish model for retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have modeled the disease in zebrafish by silencing the RP-associated splicing factor Prpf31 and observed detrimental effects on visual function and photoreceptor morphology."
    explanation: Photoreceptor loss reproduced by splicing-factor depletion in vivo.
  - reference: PMID:31654038
    reference_title: "PRPF31 reduction causes mis-splicing of the phototransduction genes in human organotypic retinal culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mis-splicing of genes implicated in phototransduction was associated with photoreceptor degeneration observed in RP patients."
    explanation: Links the transcript subset to the degeneration in human retina.
- name: Neurodevelopmental Impairment
  description: >-
    Reduced neural progenitor output or cerebellar neuron survival produces
    microcephaly, intellectual disability, growth retardation or early-onset
    ataxia - the ReNU syndrome (RNU4-2), Roifman syndrome and MOPD type I
    (RNU4ATAC), and RNU12 ataxia branch. Conforming entries substitute the
    neural population and the clinical presentation.
  role: consequence
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: DECREASED
  evidence:
  - reference: PMID:38991538
    reference_title: "De novo variants in the RNU4-2 snRNA cause a frequent neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify the non-coding RNA RNU4-2 as a syndromic NDD gene"
    explanation: The major-spliceosome snRNA neurodevelopmental branch.
  - reference: PMID:26522830
    reference_title: "Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman Syndrome by disrupting minor intron splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Roifman Syndrome is a rare congenital disorder characterized by growth retardation, cognitive delay, spondyloepiphyseal dysplasia and antibody deficiency."
    explanation: Cognitive delay in a minor-spliceosome disorder.
  - reference: PMID:27863452
    reference_title: "Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WGS revealed a point mutation in noncoding RNA RNU12 that was associated with early onset cerebellar ataxia."
    explanation: The cerebellar presentation of the minor-spliceosome branch.
  - reference: PMID:32315467
    reference_title: "Spliceosomopathies and neurocristopathies: Two sides of the same coin?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients exhibit microcephaly, micrognathia, malar hypoplasia, external ear anomalies, eye anomalies, psychomotor delay, intellectual disability, limb, and heart defects."
    explanation: Microcephaly and intellectual disability recur even in the craniofacial spliceosomopathies, so this node is not exclusive to the snRNA disorders.
discussions:
- discussion_id: gap_spliceosomopathy_lineage_restriction
  prompt: >-
    Why does germline deficiency of a spliceosome component required in every
    cell produce disease confined to one lineage - cranial neural crest for
    EFTUD2 and SF3B4, rod photoreceptors for PRPF31, neural progenitors for
    RNU4-2 - and what determines which lineage a given component protects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Selective Depletion of Splicing-Sensitive Lineage Transcripts
  rationale: >-
    The effector node of this module records the selectivity without
    explaining it, because the primary literature says the explanation is
    unknown. Candidate mechanisms - a lineage-specific peak in splicing
    demand during neural crest specification, lineage-specific transcripts
    with weak splice sites or many minor introns, differential dependence on
    residual spliceosome levels, and p53 activation downstream of mis-spliced
    transcripts - are each supported by one model and discriminated by none.
    Until one is, a conforming entry should state its lineage on this node as
    an observation and not derive it from the component.
  evidence:
  - reference: PMID:31654038
    reference_title: "PRPF31 reduction causes mis-splicing of the phototransduction genes in human organotypic retinal culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, it is not clear how reduced expression of this general splicing factor leads to retinal restricted disease, retinitis pigmentosa (RP)."
    explanation: States the gap for the photoreceptor branch.
  - reference: PMID:21051334
    reference_title: "Systemic splicing factor deficiency causes tissue-specific defects: a zebrafish model for retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RP can be elicited by mutations that affect the tri-snRNP subunit of the pre-mRNA splicing machinery, but how defects in this essential macromolecular complex transform into a photoreceptor-specific phenotype is unknown."
    explanation: The same gap stated independently a decade earlier.
  - reference: PMID:32315467
    reference_title: "Spliceosomopathies and neurocristopathies: Two sides of the same coin?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "We also describe a model to explain how and when these mutations are most likely to impact neural crest cells."
    explanation: A proposed model for the neural crest branch, offered as a model rather than a finding.

name: Paraneoplastic Neuronal Autoimmunity Module
category: Module
creation_date: '2026-11-13T16:50:00Z'
module_categories:
- IMMUNOLOGY
- NEUROSCIENCE
- ONCOLOGY
description: >-
  A conserved pathophysiology module for the autoimmunity a tumour provokes against the nervous
  system. A neoplasm expresses a protein whose normal expression is restricted to neurons; the
  antitumour immune response raised against it cross-recognises the same protein in the nervous
  system, and the neurologic disease follows from that cross-recognition rather than from the
  tumour's growth, invasion or metastasis. The chain runs tumour expression of a neuronal antigen ->
  antitumour immune response cross-recognising it -> one of two effector arms -> neuronal loss or
  dysfunction. Which arm a disorder runs is set by where the antigen sits: an intracellular antigen
  is reachable only by cytotoxic T cells, and its antibody is a marker rather than the effector; a
  cell-surface or synaptic antigen is reached by the antibody itself, which is the effector. That
  distinction is not academic: it is what a conformer uses to decide which arm it runs. What it does
  not settle is prognosis, and this module asserts no difference in reversibility between the arms.
  The one autopsy cohort cited here that compared them found Purkinje cell loss in both - diffuse
  where the antigen was intracellular, focal where it was on the surface - and for the
  surface-antigen cases it recommends early treatment rather than reporting recovery. Conforming entries
  substitute their own antigen and tumour at the trigger, their own neuron at the effector and
  consequence nodes, and declare whichever arm their antigen dictates, or both where the disorder
  spans antigen classes. Key conformance target:
  `paraneoplastic_neuronal_autoimmunity#Antitumour Immune Response Cross-Recognising the Neuronal
  Antigen`, the disorder-agnostic step every conformer funnels through and the one that makes a
  syndrome paraneoplastic rather than merely concurrent with a cancer. Complementary to, and
  distinct from, `molecular_mimicry_autoimmunity`: there a *foreign* antigen resembles a host protein
  closely enough to break tolerance, and the self antigen is never presented by the trigger; here the
  antigen *is* the self protein, presented in an ectopic site by the patient's own tumour, so no
  sequence mimicry is required and no infection is involved. A disorder whose trigger is an infection
  conforms to that module, not this one. Complementary also to `cerebellar_purkinje_degeneration`,
  which is the Purkinje-centred final common pathway of acquired cerebellar degeneration from any
  insult: that module is organ-specific and cause-agnostic, this one cause-specific and
  organ-agnostic, so a paraneoplastic cerebellar disorder may legitimately conform to both - this
  module for how the immune attack arises, that one for what becomes of the Purkinje cell - using
  the `conforms_to` list form.
notes: >-
  Do NOT create a `Paraneoplastic Neuronal Autoimmunity` Disease entry. This is a mechanism, and the
  diseases that run it are curated separately (`Paraneoplastic_Neurological_Syndromes`,
  `Paraneoplastic_Cerebellar_Degeneration`).


  Scope limit, and the reason this module is not named for onconeural antigens. The 2021 PNS-Care
  consensus retired that term precisely because it implies the antigen is obligatorily expressed by
  both the nervous system and the cancer, and that is not always so - the Tr/DNER antigen of classical
  paraneoplastic cerebellar degeneration is not expressed in the associated Hodgkin lymphoma. So the
  trigger node states tumour expression of a neuronal antigen as this module's own scope condition,
  not as a universal truth about paraneoplastic disease: a syndrome whose antigen is demonstrably
  absent from its tumour is outside this module even though it is paraneoplastic by every clinical
  criterion.


  A note on sourcing, because it constrains what this module can say. Modules are snippet-checked
  against abstracts only, and the 2021 consensus is a diagnostic-criteria paper whose abstract carries
  no mechanism at all. It is therefore cited here only for the terminological point above, which is in
  its abstract, and the mechanism nodes rest on the papers the two conformers already cite.


  The two effector arms are deliberately separate nodes rather than one generic immune-injury node,
  because they diverge on the three things a curator needs from them: which cell does the killing,
  whether the antibody is the effector or only a biomarker, and whether the damage reverses. A node
  bundling them would assert the same prognosis for anti-Hu and for anti-NMDA-receptor disease, and
  those are opposite.


  This module makes no claim about what breaks tolerance in the first place. Tumour-resident germinal
  centres and somatic alteration of the antigen gene are both reported; the module does not choose
  between them, and a conformer with evidence for one may model it upstream of this trigger.


  How thin the surface-antigen arm is. The autopsy cohort this module leans on for both arms states
  its own denominator in its abstract - formalin-fixed and paraffin-embedded brain tissue of 1
  anti-P/Q-VGCC, 2 anti-Yo-PCD autopsy cases and controls - so the surface-antigen histology here
  rests on a single case. `Paraneoplastic_Cerebellar_Degeneration` curates that contrast as a
  knowledge gap rather than settled fact, and this module should be read the same way: the two arms
  are a well-supported distinction in antigen location and a thinly supported one in tissue
  pathology.


  The Tr/DNER case cuts two ways, and a conformer may use it where this module cannot. The scope
  limit above puts a syndrome whose antigen is demonstrably absent from its tumour outside this
  module, and Tr/DNER in Hodgkin lymphoma is the named instance.
  `Paraneoplastic_Cerebellar_Degeneration` nevertheless cites anti-Tr/DNER in support of its
  surface-antigen arm, because the antigen's extracellular domain is what makes the antibody
  reachable - a fact about the effector step, not about the trigger. The exclusion bites at the
  trigger only, so both are correct at once; a conformer modelling Tr/DNER disease end to end would
  need a trigger node this module does not supply.
pathophysiology:
- name: Tumour Expression of a Neuronal Antigen
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A neoplasm expresses a protein whose normal expression is restricted to neurons. No ontology terms
    are bound here on purpose: the antigen and the tumour type are exactly what a conforming entry
    substitutes, and the module has no business naming either. See this module's notes for the case
    where the antigen is absent from the tumour, which is outside the module's scope.
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The underlying mechanism is believed to be an immunological reaction to cerebellar
      degeneration-related protein 2 (CDR2), a protein usually found in the cerebellum that is
      ectopically produced by tumor cells.
    explanation: >-
      The worked instance of this node and the next in one sentence: a cerebellar protein made
      ectopically by the tumour, and an immunological reaction to it. Graded REVIEW_SYNTHESIS because
      the paper is a review of the anti-Yo literature, and the authors write the mechanism as believed
      rather than as shown.
  downstream:
  - target: Antitumour Immune Response Cross-Recognising the Neuronal Antigen
    causal_link_type: DIRECT
    description: >-
      An immune response raised against the tumour's copy of the protein recognises the neuronal copy,
      because it is the same protein.
    evidence:
    - reference: PMID:41562781
      reference_title: >-
        Paraneoplastic Neurological Syndromes: Advances and Future Perspectives in Immunopathogenesis
        and Management.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Paraneoplastic neurological syndromes (PNSs) are immune-mediated disorders caused by an
        antitumor response that cross-reacts with the nervous system, leading to severe and often
        irreversible neurological disability.
      explanation: >-
        States this edge as the definition of the disease class: an antitumour response that
        cross-reacts with the nervous system. It also carries the irreversibility that the consequence
        node records.
- name: Antitumour Immune Response Cross-Recognising the Neuronal Antigen
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The step that makes a neurologic syndrome paraneoplastic rather than coincident with a cancer, and
    this module's key conformance target. Both arms of adaptive immunity are engaged against the
    antigen, and which of them does the damage is not settled here - that is what the two effector
    nodes below separate, by where the antigen sits.
  biological_processes:
  - preferred_term: immune response against the tumour-expressed neuronal antigen
    term:
      id: GO:0002418
      label: immune response to tumor cell
  cell_types:
  - preferred_term: cytotoxic T cell
    term:
      id: CL:0000910
      label: cytotoxic T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:27606347
    reference_title: Paraneoplastic cerebellar degeneration with anti-Yo antibodies - a review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although both B- and T-cell abnormalities are seen, there is debate about the relative
      importance of the autoantibodies and cytotoxic T lymphocytes in the neuronal loss.
    explanation: >-
      Why this node binds both a cytotoxic T cell and a B cell and commits to neither as the effector:
      the review reports both arms engaged and the division of labour between them contested. That
      contest is what the two downstream nodes resolve by antigen location.
  downstream:
  - target: Cytotoxic T Cell-Mediated Neuronal Destruction
    causal_link_type: DIRECT
    description: >-
      Where the antigen is intracellular, antibody cannot reach it and the cytotoxic T cell is the
      effector.
    evidence:
    - reference: PMID:36070310
      reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although the intracellular location of the target antigen in anti-Yo-PCD supports a T
        cell-mediated pathology, the immune mechanisms in anti-P/Q-VGCC-PCD remain unclear.
      explanation: >-
        States the inference this edge rests on - antigen location implies the effector - and in the
        same breath that it does not settle the surface-antigen case, which is why that arm is a
        separate node with its own evidence.
  - target: Autoantibody-Mediated Neuronal Surface Dysfunction
    causal_link_type: DIRECT
    description: >-
      Where the antigen is on the cell surface or in the synapse, the antibody reaches it and is the
      effector.
    evidence:
    - reference: PMID:41562781
      reference_title: >-
        Paraneoplastic Neurological Syndromes: Advances and Future Perspectives in Immunopathogenesis
        and Management.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenetically, we distinguish T-cell-mediated syndromes associated with intracellular
        antigens from antibody-mediated disorders targeting neuronal surface proteins, integrating
        emerging concepts of molecular mimicry, tumor genetics, and HLA-linked susceptibility.
      explanation: >-
        The antigen-location distinction this edge turns on, as the review's own pathogenetic
        division: surface proteins go with antibody-mediated disease. It is also where this module's
        relation to molecular mimicry sits in the literature - named as an emerging concept alongside
        tumour genetics, not as this mechanism's trigger.
- name: Cytotoxic T Cell-Mediated Neuronal Destruction
  role: effector
  biological_scale: CELLULAR
  description: >-
    The arm that runs when the antigen is intracellular. Antigen-specific cytotoxic T cells kill the
    neuron and the neuron upregulates MHC class I. The antibody that names such a syndrome is a marker
    of the T cell response rather than its effector, which is why these disorders respond poorly to
    immunotherapy and why the loss does not reverse.
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity against the antigen-expressing neuron
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
  cell_types:
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000910
      label: cytotoxic T cell
  - preferred_term: antigen-expressing neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-Yo-PCD revealed a diffuse and widespread PC loss together with microglial nodules with
      pSTAT1+ and CD8+granzymeB+ T cells and neuronal upregulation of major histocompatibility complex
      (MHC) Class I molecules.
    explanation: >-
      The histological content of this node, from autopsy tissue: granzyme B-positive CD8 T cells
      against neurons that have upregulated MHC class I, beside the cell loss. The three together are
      what make this an immune killing rather than an association.
  - reference: PMID:41562781
    reference_title: >-
      Paraneoplastic Neurological Syndromes: Advances and Future Perspectives in Immunopathogenesis
      and Management.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenetically, we distinguish T-cell-mediated syndromes associated with intracellular
      antigens from antibody-mediated disorders targeting neuronal surface proteins, integrating
      emerging concepts of molecular mimicry, tumor genetics, and HLA-linked susceptibility.
    explanation: >-
      That an intracellular antigen goes with T-cell-mediated disease, which is the rule by which a
      conformer declares this arm rather than the other. The further claim that the antibody in these
      syndromes is a marker rather than the effector is in no sentence quoted anywhere in this
      module; it is the node description's, and it is why no antibody process is bound here. It is
      stated in the body of PMID:34006622, which a module cannot quote because modules are
      snippet-checked against abstracts only.
  downstream:
  - target: Neuronal Loss or Dysfunction
    causal_link_type: DIRECT
    description: >-
      Killing the neuron removes it, so this arm's consequence is loss rather than dysfunction and it
      does not reverse.
    evidence:
    - reference: PMID:36070310
      reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Anti-Yo-PCD revealed a diffuse and widespread PC loss together with microglial nodules with
        pSTAT1+ and CD8+granzymeB+ T cells and neuronal upregulation of major histocompatibility
        complex (MHC) Class I molecules.
      explanation: >-
        The cell loss and the cytotoxic infiltrate reported in the same tissue, which is the basis for
        drawing this edge from the T cell arm to loss.
- name: Autoantibody-Mediated Neuronal Surface Dysfunction
  role: effector
  biological_scale: CELLULAR
  description: >-
    The arm that runs when the antigen is on the neuronal surface or in the synapse. The antibody binds
    its target directly and disturbs its function. Whether that leaves the neuron impaired rather
    than destroyed is not settled by the sources cited here: the one autopsy cohort comparing the
    arms found Purkinje cell loss in this arm too, focal rather than diffuse, from a single
    surface-antigen case.
  biological_processes:
  - preferred_term: circulating autoantibody response against a neuronal surface antigen
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
  cell_types:
  - preferred_term: neuron bearing the surface antigen
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:41562781
    reference_title: >-
      Paraneoplastic Neurological Syndromes: Advances and Future Perspectives in Immunopathogenesis
      and Management.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenetically, we distinguish T-cell-mediated syndromes associated with intracellular
      antigens from antibody-mediated disorders targeting neuronal surface proteins, integrating
      emerging concepts of molecular mimicry, tumor genetics, and HLA-linked susceptibility.
    explanation: >-
      That a neuronal surface antigen goes with antibody-mediated disease, which is this node's claim
      and the rule by which a conformer declares this arm rather than the cytotoxic one.
  - reference: PMID:36070310
    reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, PC loss in anti-P/Q-VGCC-PCD was focal and predominantly affected the upper vermis,
      whereas caudal regions and lateral hemispheres were spared.
    explanation: >-
      The tissue counterpart of this arm, read against the cytotoxic one in the same cohort: where the
      antigen was on the surface the cell loss was focal and regionally restricted, not diffuse.
      Indirect because the measurement is the distribution of loss rather than the antibody's action,
      and because the same paper says the immune mechanism in these cases remains unclear - which is
      why this node does not claim the antibody is cytotoxic.
  downstream:
  - target: Neuronal Loss or Dysfunction
    causal_link_type: DIRECT
    description: >-
      Antibody binding impairs the target's function. This arm reaches the consequence node as
      dysfunction, as loss, or as both - the cited cohort reports focal Purkinje cell loss in its
      surface-antigen case - which is why the consequence node is named for either outcome.
    evidence:
    - reference: PMID:36070310
      reference_title: Paraneoplastic Cerebellar Degeneration With P/Q-VGCC vs Yo Autoantibodies.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Paraneoplastic cerebellar degeneration (PCD) is characterized by a widespread loss of Purkinje
        cells (PCs) and may be associated with autoantibodies against intracellular antigens such as
        Yo or cell surface neuronal antigens such as the P/Q-type voltage-gated calcium channel
        (P/Q-VGCC).
      explanation: >-
        That one clinical syndrome is reached from either antigen class, which is what justifies both
        arms converging on one consequence node. Indirect because the sentence is the study's framing
        of the entity rather than a measurement of this edge, and because in that cohort the
        surface-antigen case showed focal rather than widespread loss.
- name: Neuronal Loss or Dysfunction
  role: consequence
  biological_scale: TISSUE
  description: >-
    The convergence point, and the reason the two arms are worth keeping apart above it: the clinical
    syndrome can look similar from either while the substrate differs. Conforming entries substitute
    their own neuron and site, and should say which of loss or dysfunction their arm produces, because
    the prognosis follows from that and not from the syndrome's name. No GO process is bound:
    `GO:0070997` neuron death is obsolete, and the sources name no death programme.
  cell_types:
  - preferred_term: affected neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:41562781
    reference_title: >-
      Paraneoplastic Neurological Syndromes: Advances and Future Perspectives in Immunopathogenesis
      and Management.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paraneoplastic neurological syndromes (PNSs) are immune-mediated disorders caused by an
      antitumor response that cross-reacts with the nervous system, leading to severe and often
      irreversible neurological disability.
    explanation: >-
      The outcome this node records, with the qualifier that matters: often irreversible. The sentence
      says this of paraneoplastic neurological syndromes as a class and attributes it to neither
      arm, so the node carries it as the shared consequence of both rather than as a feature of
      either.
  - reference: PMID:34006622
    reference_title: Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: 'The term "onconeural antibody" was replaced by "high risk" (>70% associated with cancer) and "intermediate risk" (30%-70% associated with cancer) antibodies.'
    explanation: >-
      The consensus panel's retirement of the onconeural term, which is why this module is named for
      the autoimmunity rather than for the antigen class and why its trigger is a scope condition
      rather than a universal claim. Graded OTHER because a consensus criteria document is expert
      agreement rather than study data, and INDIRECT because it bears on the module's scope rather
      than on neuronal loss itself.

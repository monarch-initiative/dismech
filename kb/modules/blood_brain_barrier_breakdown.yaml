name: Blood-Brain Barrier Breakdown Module
description: >-
  A conserved central nervous system pathophysiology module for the cascade by
  which heterogeneous insults to the neurovascular unit converge on loss of
  cerebrovascular barrier function. An insult to the brain endothelium,
  pericytes or astrocytic endfeet — mechanical deformation in neurotrauma,
  ischaemia and reperfusion, systemic inflammation in sepsis, or seizure
  activity — activates matrix metalloproteinases and other proteases that
  degrade the endothelial tight-junction proteins claudin-5, occludin and ZO-1
  and raise endothelial transcytosis; barrier permeability rises; plasma
  proteins that the intact barrier excludes (albumin, fibrinogen) enter the
  neuropil, where albumin is taken up by astrocytes through TGF-beta receptor
  signalling and fibrinogen drives perivascular microglial clustering; and
  protein-rich fluid accumulating in the extracellular space becomes vasogenic
  cerebral oedema with raised intracranial pressure. The distinguishing claim of
  the module, and what makes it separable from the entries that use it, is that
  the permeability step is one rate-limiting state reached by all of those
  insults and read out the same way (tracer, contrast or plasma-protein
  immunostaining), so a disease entry substitutes its own insult at the trigger
  node and inherits the rest. Key conformance target:
  `blood_brain_barrier_breakdown#Blood-Brain Barrier Permeability Increase`.
  Complementary to, and deliberately narrower than, three sibling modules:
  `alveolar_capillary_barrier_failure` models the same kind of failure in the
  two-cell-layer blood-gas barrier of the lung and terminates in gas-exchange
  failure; `epithelial_barrier_dysfunction` models the allergic / type-2
  epithelial barrier hypothesis across skin, airway, gut and oesophagus and
  terminates in IgE sensitization; and `neuroinflammation_glial_activation`
  begins where a danger signal is already in the parenchyma and models the glial
  innate-immune response to it. This module supplies the route by which a
  blood-borne danger signal gets there, so an entry commonly conforms to both.
category: Module
module_categories:
- NEUROSCIENCE
creation_date: "2026-10-01T04:30:00Z"
notes: >-
  This is a mechanism module, not a disease. Disorder entries reference
  individual nodes with conforms_to, for example
  "blood_brain_barrier_breakdown#Blood-Brain Barrier Permeability Increase".

  What a conformer substitutes. Only the trigger node is disorder-specific:
  neurotrauma substitutes mechanical deformation of the neurovascular unit at
  the impact site; ischaemic stroke substitutes occlusion and reperfusion;
  sepsis-associated encephalopathy substitutes circulating bacterial products
  and systemic cytokines; status epilepticus and chronic epilepsy substitute
  seizure activity. The cell types are conserved across all of them — brain
  microvascular endothelial cell, brain pericyte, astrocyte — so a conformer
  should normally keep them rather than substituting an organ-specific cell as
  conformers of the fibrotic or alveolar modules do. A conformer may legitimately
  specialize the plasma protein it cares about: albumin where the consequence is
  astrocytic TGF-beta signalling and loss of potassium buffering, fibrinogen
  where it is perivascular microglial clustering and axonal damage.

  Worked conformers to come: Traumatic_Brain_Injury (not yet created) at the
  permeability node, and the existing Post-Traumatic_Epilepsy node "Blood-Brain
  Barrier Disruption and Albumin Extravasation", which already carries the
  albumin/TGF-beta chain this module's effector node generalizes.

  Two scope limits worth knowing before conforming. First, the module covers
  barrier opening after an insult to a developed barrier; it does not cover
  failure of barrier formation during development, which is a different
  mechanism with a different cell biology. Second, vasogenic oedema is the
  terminal node, and it is not the only oedema after CNS injury: cytotoxic
  (cellular) oedema arises from maladaptive ion and water transport into cells
  and can dominate the measured brain-water increase even while the barrier is
  intact or recovering. An entry whose oedema is primarily cytotoxic should not
  conform here on the strength of the oedema alone.

  The ordering of the transcellular and paracellular steps is an open question
  the module does not settle. In the mouse stroke model that imaged both, the
  rise in endothelial caveolae and transcytosis preceded structural
  tight-junction defects by days, so the amplifier node names both routes and
  does not assert that junctional loss comes first. Whether that ordering holds
  in trauma or sepsis has not been shown.
pathophysiology:
- name: Neurovascular Unit Insult
  role: trigger
  biological_scale: TISSUE
  description: >-
    An insult reaches the neurovascular unit — the brain microvascular
    endothelium, its investing pericytes and basal lamina, and the astrocytic
    endfeet that surround the vessel. The initiating agents are heterogeneous:
    mechanical deformation of cerebral vessels in neurotrauma, occlusion and
    reperfusion in ischaemic stroke, circulating bacterial products and cytokines
    in sepsis, and seizure activity. Each converges on inflammatory signalling at
    the vessel wall and on structural disorganization of the unit — pericyte
    detachment from the basal lamina, loss of endfoot polarization — rather than
    on injury to one cell type alone. This node is the disorder-specific entry
    point; conforming entries substitute their own insult here.
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  - preferred_term: brain pericyte
    term:
      id: CL:2000043
      label: brain pericyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  cellular_components:
  - preferred_term: astrocyte endfoot
    term:
      id: GO:0097450
      label: astrocyte end-foot
  - preferred_term: perivascular basal lamina
    term:
      id: GO:0005604
      label: basement membrane
  biological_processes:
  - preferred_term: maintenance of the blood-brain barrier
    term:
      id: GO:0035633
      label: maintenance of blood-brain barrier
    modifier: DECREASED
  - preferred_term: inflammatory response at the vessel wall
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Tight Junction Disassembly
    causal_link_type: DIRECT
    description: >-
      The insult activates matrix metalloproteinases at the vessel wall, which
      proteolyse the endothelial tight-junction proteins; inhibiting the
      proteases prevents the junctional loss, which makes the step causal rather
      than coincident.
    evidence:
    - reference: PMID:16850029
      reference_title: Matrix metalloproteinase-mediated disruption of tight junction proteins in cerebral
        vessels is reversed by synthetic matrix metalloproteinase inhibitor in focal ischemia in rat.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Claudin-5 and occludin mRNA expression decreased at 2 h in both hemispheres with fragments
        of both proteins seen on Western blot by 3 h on the ischemic side; treatment with BB-1101 reversed
        the degradation of the TJPs.
      explanation: Shows an ischaemia-reperfusion insult producing degradation of claudin-5 and occludin,
        reversed by a protease inhibitor, which is the edge from insult to junctional disassembly.
  evidence:
  - reference: PMID:20944627
    reference_title: Pericytes regulate the blood-brain barrier.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: pericyte deficiency increases the permeability of the BBB to water and a range of low-molecular-mass
      and high-molecular-mass tracers.
    explanation: Establishes that the pericyte, not the endothelium alone, is a constituent of the barrier,
      so loss of the pericyte compartment is itself sufficient to raise permeability.
  - reference: PMID:20944627
    reference_title: Pericytes regulate the blood-brain barrier.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: by inducing polarization of astrocyte end-feet surrounding CNS blood vessels.
    explanation: Supports treating endothelium, pericyte and astrocytic endfoot as one coupled unit, which
      is why this node is written at the level of the unit rather than of a single cell type.
  - reference: PMID:18987969
    reference_title: Detachment of brain pericytes from the basal lamina is involved in disruption of the
      blood-brain barrier caused by lipopolysaccharide-induced sepsis in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: LPS-treated mice exhibited a broken basal lamina and pericyte detachment from the basal lamina
      at 6-24 h after LPS injection.
    explanation: A non-traumatic, non-ischaemic systemic inflammatory insult producing structural disorganization
      of the same unit, which is the module's claim that the trigger is substitutable.
  - reference: PMID:17377766
    reference_title: "Brain lesions in septic shock: a magnetic resonance imaging study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These lesions predominated in the white matter, suggesting increased blood-brain barrier permeability,
      and were associated with poor outcome.
    explanation: Human imaging evidence that septic shock produces white-matter lesions the authors attribute
      to raised barrier permeability; the authors' own hedge ("suggesting") is preserved, and this is an
      inference from lesion distribution rather than a direct permeability measurement.
  - reference: PMID:20551947
    reference_title: Blood-brain barrier breakdown as a therapeutic target in traumatic brain injury.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Animal studies have demonstrated that BBB breakdown is involved in the initiation of transcriptional
      changes in the neurovascular network that ultimately lead to delayed neuronal dysfunction and degeneration.
    explanation: Review placing barrier breakdown at the neurovascular network as an initiating rather than
      incidental event after trauma, which is the position this node occupies in the chain.

- name: Tight Junction Disassembly
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Proteases released or activated at the injured vessel wall — matrix
    metalloproteinase-9 and matrix metalloproteinase-2 prominently, with
    membrane-type MMP and furin as activators — degrade the endothelial
    tight-junction proteins claudin-5, occludin and ZO-1 and the perivascular
    extracellular matrix, and the junctional proteins are lost from or
    redistributed away from the cell-cell contact. In parallel the endothelium
    increases vesicular traffic: caveolae multiply and the transcellular
    transcytosis rate rises. The two routes are not alternatives but components
    of the same amplification step, and in the one model where both were imaged
    in vivo the transcellular change came first. Because claudin-5 loss alone
    opens the barrier only to small solutes, the magnitude of the eventual leak
    depends on how much of this programme runs.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  cellular_components:
  - preferred_term: endothelial tight junction
    term:
      id: GO:0005923
      label: bicellular tight junction
  - preferred_term: endothelial caveola
    term:
      id: GO:0005901
      label: caveola
  biological_processes:
  - preferred_term: tight junction disassembly
    term:
      id: GO:1905071
      label: tight junction disassembly
    modifier: INCREASED
  - preferred_term: proteolysis of the perivascular extracellular matrix
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  - preferred_term: endothelial transcytosis
    term:
      id: GO:0045056
      label: transcytosis
    modifier: INCREASED
  downstream:
  - target: Blood-Brain Barrier Permeability Increase
    causal_link_type: DIRECT
    description: >-
      Loss of the junctional proteins and the rise in transcytosis are what the
      measured leak consists of. Both interventional directions support the edge:
      deleting the protease that degrades ZO-1 attenuates tracer leakage, and
      inhibiting the proteases pharmacologically prevents the barrier opening.
    evidence:
    - reference: PMID:11567062
      reference_title: Effects of matrix metalloproteinase-9 gene knock-out on the proteolysis of blood-brain
        barrier and white matter components after cerebral ischemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: blood-brain barrier disruption assessed via Evans Blue leakage was significantly attenuated
        in MMP-9 knock-out mice compared with wild types.
      explanation: Genetic removal of the protease reduces both substrate degradation and the resulting tracer
        leakage, which is this edge read in the subtractive direction.
    - reference: PMID:16850029
      reference_title: Matrix metalloproteinase-mediated disruption of tight junction proteins in cerebral
        vessels is reversed by synthetic matrix metalloproteinase inhibitor in focal ischemia in rat.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: There was opening of the BBB in the piriform cortex after 3 h of reperfusion, and an MMP inhibitor,
        BB-1101 (30 mg/kg), prevented the opening.
      explanation: Pharmacological inhibition of the same proteases prevents the barrier opening, which is
        the edge read in the pharmacological direction.
  evidence:
  - reference: PMID:16850029
    reference_title: Matrix metalloproteinase-mediated disruption of tight junction proteins in cerebral vessels
      is reversed by synthetic matrix metalloproteinase inhibitor in focal ischemia in rat.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Our results provide direct evidence that MMPs open the BBB by degrading TJPs and that an MMP
      inhibitor prevents degradation of the TJPs by MMPs.
    explanation: >-
      The authors' own statement of the mechanism this node asserts — protease degradation of tight-junction
      proteins as the route by which the barrier opens.
  - reference: PMID:11567062
    reference_title: Effects of matrix metalloproteinase-9 gene knock-out on the proteolysis of blood-brain
      barrier and white matter components after cerebral ischemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: zonae occludens-1 was degraded after ischemia, but this was reduced in knock-out mice.
    explanation: Identifies ZO-1 as a protease substrate degraded after the insult, naming one of the specific
      junctional proteins lost at this node. Note the same study found no detectable change in occludin,
      so the substrate set is protease-specific rather than uniform.
  - reference: PMID:12743111
    reference_title: Size-selective loosening of the blood-brain barrier in claudin-5-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the BBB against small molecules (<800 D), but not larger molecules, was selectively affected.
    explanation: Loss of claudin-5 alone is sufficient to open the barrier, but only to small solutes, which
      is why this node treats the magnitude of the leak as depending on how much of the junctional and transcellular
      programme runs rather than on claudin-5 loss alone.
  - reference: PMID:24746419
    reference_title: Stepwise recruitment of transcellular and paracellular pathways underlies blood-brain
      barrier breakdown in stroke.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Although barrier function is impaired as early as 6 hr after stroke, TJs display profound structural
      defects only after 2 days.
    explanation: In vivo imaging showing that functional barrier failure precedes structural tight-junction
      loss, which is the evidence for this node naming both routes rather than asserting junctional loss
      first.
  - reference: PMID:24746419
    reference_title: Stepwise recruitment of transcellular and paracellular pathways underlies blood-brain
      barrier breakdown in stroke.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the number of endothelial caveolae and transcytosis rate increase as early as 6 hr after stroke.
    explanation: Direct support for the transcellular component of this node — caveolar transcytosis rising
      early — alongside the paracellular junctional component.

- name: Blood-Brain Barrier Permeability Increase
  role: central_effector
  biological_scale: TISSUE
  description: >-
    The cerebrovascular barrier now passes solutes and proteins it normally
    excludes. This is the module's rate-limiting, disorder-agnostic state and the
    node conforming entries should target. It is a state rather than an event:
    after neurotrauma it is detectable within hours, persists for months in
    animal models and is still present in a substantial proportion of human late
    survivors, so an entry modelling a chronic post-injury process can place its
    mechanism downstream of this node rather than treating barrier opening as a
    transient acute phenomenon. It is also the step the available readouts
    measure directly — gadolinium or tracer leakage in vivo, parenchymal
    fibrinogen, immunoglobulin or albumin immunostaining in tissue — which is
    what makes the module auditable across diseases whose triggers have nothing
    in common.
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  biological_processes:
  - preferred_term: blood-brain barrier permeability
    term:
      id: GO:1905605
      label: positive regulation of blood-brain barrier permeability
    modifier: INCREASED
  - preferred_term: maintenance of the blood-brain barrier
    term:
      id: GO:0035633
      label: maintenance of blood-brain barrier
    modifier: DECREASED
  downstream:
  - target: Extravasation of Plasma Proteins into the Brain Parenchyma
    causal_link_type: DIRECT
    description: >-
      A barrier that passes macromolecules admits the abundant plasma proteins
      first, so the permeability state is read out in tissue as perivascular and
      parenchymal fibrinogen, immunoglobulin and albumin.
    evidence:
    - reference: PMID:26574669
      reference_title: Blood-Brain Barrier Disruption Is an Early Event That May Persist for Many Years After
        Traumatic Brain Injury in Humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: showed multifocal, abnormal, perivascular, and parenchymal fibrinogen and immunoglobulin G
        immunostaining localized to the gray matter, with preferential distribution toward the crests of
        gyri and deep neocortical layers.
      explanation: Human autopsy tissue showing the two plasma proteins in the parenchyma after injury, which
        is this edge observed directly in human material.
  - target: Vasogenic Cerebral Edema
    causal_link_type: DIRECT
    description: >-
      Raised permeability lets protein-rich plasma filtrate follow its osmotic
      and hydrostatic gradients into the extracellular space; that accumulation
      is what vasogenic oedema is, so the definitional link runs from this node
      to the oedema node.
    evidence:
    - reference: PMID:15561417
      reference_title: Edema and brain trauma.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: vasogenic" due to blood-brain barrier (BBB) disruption resulting in extracellular water accumulation
        and "cytotoxic/cellular" due to sustained intracellular water collection.
      explanation: Defines vasogenic oedema as the extracellular water accumulation caused by barrier disruption,
        and distinguishes it from the cytotoxic form this module does not cover.
    - reference: PMID:3564903
      reference_title: Pathophysiological aspects of brain edema.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: vasogenic type-where an increased vascular permeability leading to accumulation of edema fluid
        in the extracellular spaces plays the principal role.
      explanation: Independent statement of the same edge from the classical description of the two oedema
        types.
  evidence:
  - reference: PMID:26574669
    reference_title: Blood-Brain Barrier Disruption Is an Early Event That May Persist for Many Years After
      Traumatic Brain Injury in Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These preliminary data demonstrate evidence of widespread BBB disruption in a proportion of TBI
      patients emerging in the acute phase and, intriguingly, persisting in a high proportion of late survivors.
    explanation: Human evidence for both properties this node asserts — early onset and persistence — in an
      autopsy series spanning acute to decades-long survival. The authors call the data preliminary, and
      the proportions are of a selected autopsy cohort rather than of injured people generally.
  - reference: PMID:32919030
    reference_title: Long-lasting blood-brain barrier dysfunction and neuroinflammation after traumatic brain
      injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: MRI indicated persistent Gd leakage in the impacted cortex and thalamus of variable severity
      in all rats with TBI which correlated with fluorescein extravasation.
    explanation: Longitudinal in vivo measurement of the permeability state after trauma, with two independent
      tracers agreeing, supporting the node as a persistent measurable state rather than an acute event.
  - reference: PMID:24771110
    reference_title: Ablation of matrix metalloproteinase-9 gene decreases cerebrovascular permeability and
      fibrinogen deposition post traumatic brain injury in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These changes were attenuated in Mmp9(-/-) mice and were associated with lesser loss of short-term
      memory in these mice than in WT mice.
    explanation: Removing the upstream protease reduces the permeability state and its parenchymal protein
      deposition after trauma, which supports this node sitting downstream of the junctional step in a second
      insult type.
  - reference: PMID:17124188
    reference_title: Blood-brain barrier leakage may lead to progression of temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Artificial opening of the BBB by mannitol in the chronic epileptic phase induced a persistent
      increase in the number of seizures in the majority of rats.
    explanation: Opening the barrier experimentally, with no other insult, worsens the disease, which supports
      this node carrying causal weight of its own rather than being a marker of upstream injury. Note that
      this is an osmotic opening rather than the protease-mediated route modelled upstream.

- name: Extravasation of Plasma Proteins into the Brain Parenchyma
  role: effector
  biological_scale: TISSUE
  description: >-
    Plasma proteins the intact barrier excludes now reach the neuropil, where
    they are not inert. Albumin is taken up by astrocytes through TGF-beta
    receptor signalling, the best-documented single consequence of the
    extravasation and the step that connects barrier failure to astrocytic
    dysfunction. Fibrinogen, acting through the microglial integrin receptor
    CD11b/CD18, draws microglia into perivascular clusters and is required for
    the axonal damage that follows in neuroinflammation. The node therefore
    converts a vascular event into a parenchymal one, and it is where this module
    hands over to `neuroinflammation_glial_activation`.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: astrocytic TGF-beta receptor signalling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: astrocyte activation
    term:
      id: GO:0048143
      label: astrocyte activation
    modifier: INCREASED
  downstream:
  - target: Vasogenic Cerebral Edema
    causal_link_type: DIRECT
    description: >-
      The extravasated protein raises the osmotic load of the extracellular
      space, so water is retained with it; protein extravasation and tissue water
      retention are two aspects of one process rather than independent events.
    evidence:
    - reference: PMID:3564903
      reference_title: Pathophysiological aspects of brain edema.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: In this type of edema, there is a close interrelationship between extravasation of serum proteins
        and retention of water in the brain tissue.
      explanation: States the coupling between serum-protein extravasation and brain water retention that
        this edge asserts.
  evidence:
  - reference: PMID:17121744
    reference_title: TGF-beta receptor-mediated albumin uptake into astrocytes is involved in neocortical
      epileptogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We demonstrate that direct brain exposure to serum albumin is associated with albumin uptake
      into astrocytes, which is mediated by transforming growth factor beta receptors (TGF-betaRs).
    explanation: The direct evidence for the albumin-to-astrocyte TGF-beta receptor step this node asserts,
      established by exposing brain tissue to albumin rather than inferred from a disease model.
  - reference: PMID:23187627
    reference_title: Fibrinogen-induced perivascular microglial clustering is required for the development
      of axonal damage in neuroinflammation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we show that the blood protein fibrinogen induces rapid microglial responses toward the vasculature
      and is required for axonal damage in neuroinflammation.
    explanation: Establishes the second plasma protein's consequence — perivascular microglial clustering
      — and that it is necessary for the downstream axonal damage, not merely associated with it.
  - reference: PMID:23187627
    reference_title: Fibrinogen-induced perivascular microglial clustering is required for the development
      of axonal damage in neuroinflammation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Fibrinogen leakage correlates with areas of axonal damage and induces reactive oxygen species
      release in microglia.
    explanation: Links the spatial distribution of the leak to the distribution of parenchymal damage, which
      is why this node is modelled as the conversion of a vascular event into a parenchymal one.
  - reference: PMID:17124188
    reference_title: Blood-brain barrier leakage may lead to progression of temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Albumin extravasation in human was prominent after status epilepticus (SE) in astrocytes and
      neurons, and also in hippocampus of TLE patients.
    explanation: Human tissue evidence that albumin reaches astrocytes and neurons after a non-traumatic,
      non-ischaemic insult, supporting this node's generality across the module's trigger types.

- name: Vasogenic Cerebral Edema
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Protein-rich fluid accumulating in the extracellular space expands brain
    volume. Because the skull is closed, this raises intracranial pressure,
    impairs cerebral perfusion and oxygenation, and so causes further ischaemic
    injury — the step at which a local barrier failure becomes a whole-organism
    problem and the clinical target of osmotherapy. Clearance runs partly through
    astrocytic aquaporin-4, so the oedema's severity reflects the balance between
    the rate of entry across the failed barrier and the rate of transcellular
    removal, not the entry rate alone. In focal ischaemia the same capillary
    dysfunction can progress beyond vasogenic oedema to frank haemorrhagic
    conversion.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: water movement into and out of the brain extracellular space
    term:
      id: GO:0006833
      label: water transport
    modifier: INCREASED
  evidence:
  - reference: PMID:15561417
    reference_title: Edema and brain trauma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Brain edema leading to an expansion of brain volume has a crucial impact on morbidity and mortality
      following traumatic brain injury (TBI) as it increases intracranial pressure, impairs cerebral perfusion
      and oxygenation, and contributes to additional ischemic injuries.
    explanation: States the organism-level consequence chain this node asserts — volume expansion, raised
      intracranial pressure, impaired perfusion, secondary ischaemia.
  - reference: PMID:17303532
    reference_title: "Brain oedema in focal ischaemia: molecular pathophysiology and theoretical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We organise the progressive changes in osmotic and hydrostatic conductivity of abnormal capillaries
      into three phases: formation of ionic oedema, formation of vasogenic oedema, and catastrophic failure
      with haemorrhagic conversion."
    explanation: Places vasogenic oedema in a graded sequence of capillary dysfunction that can progress to
      haemorrhagic conversion, which is the severity statement in this node's description.
  - reference: PMID:15208268
    reference_title: Aquaporin-4 facilitates reabsorption of excess fluid in vasogenic brain edema.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Thus, AQP4-mediated transcellular water movement is crucial for fluid clearance in vasogenic
      brain edema, suggesting AQP4 activation and/or up-regulation as a novel therapeutic option in vasogenic
      brain edema.
    explanation: Supports the clearance arm of this node — that severity depends on astrocytic transcellular
      water removal as well as on entry across the failed barrier.

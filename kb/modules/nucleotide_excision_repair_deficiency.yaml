name: Nucleotide Excision Repair Deficiency Module
description: >-
  A conserved mechanism module for inherited loss of nucleotide excision repair
  (NER), the cut-and-patch pathway that removes helix-distorting and
  transcription-blocking DNA lesions (UV photoproducts, bulky chemical adducts,
  endogenous cyclopurines). The chain is: lesion formation -> loss of one of the
  three ways NER reaches a lesion (global-genome recognition by XPC/DDB2;
  transcription-coupled initiation at stalled RNA polymerase II by CSB/CSA/UVSSA;
  the core verification and dual-incision machinery XPA/TFIIH/XPG/ERCC1-XPF that
  both subpathways share) -> persistent unexcised lesions, the key conformance
  target -> two divergent effector arms. In the global-genome arm the lesion is
  replicated over and fixed as a UV-signature mutation, ending in
  carcinogenesis (xeroderma pigmentosum). In the transcription-coupled arm the
  lesion stalls RNA polymerase II and triggers cell death or senescence, ending
  in neurodegeneration and segmental progeroid degeneration (Cockayne syndrome,
  COFS, XFE progeroid syndrome); UV-sensitive syndrome reaches the cell-death
  effector in skin but not the degenerative consequence, which is the open
  genotype-phenotype question this module hosts rather than resolves. Key
  conformance target: "nucleotide_excision_repair_deficiency#Persistent
  Unexcised DNA Lesions". Complementary to genomic_instability_aging, which
  frames generic age-related decline of all genome maintenance and is the
  right target for the progeroid consequence of any repair defect, and to
  dna_repair_synthetic_lethality, which covers homologous-recombination loss
  in tumours; this module is the NER-specific entry point for the
  DNA-repair-deficiency syndromes.
category: Module
module_categories:
- AGING
- ONCOLOGY
creation_date: "2026-10-03T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "nucleotide_excision_repair_deficiency#Persistent Unexcised DNA Lesions").

  The three loss-of-function nodes are alternative entry points, not a
  sequence. A conforming entry declares the one that matches its gene: XPC or
  DDB2 loss conforms to the global-genome node; ERCC6, ERCC8 or UVSSA loss to
  the transcription-coupled node; XPA, ERCC3, ERCC2, GTF2H5, ERCC5, ERCC4 or
  ERCC1 loss to the core node, because a core factor is used by both
  subpathways and its loss abolishes both. Xeroderma pigmentosum as a whole is
  defined by global-genome NER failure (every complementation group loses it),
  so an entry that bundles recognition and core genes into one NER node, as
  Xeroderma_Pigmentosum does, conforms to the global-genome node and lets the
  core node stand for the entries whose causal gene is a core factor
  (trichothiodystrophy, XFE progeroid syndrome, COFS).

  Which effector arm an entry takes follows from which subpathway it has lost,
  not from the gene alone. Loss of a core factor removes both subpathways and
  an entry may conform on both arms; XPA, XPD and XPG patients develop both
  skin cancer and neurodegeneration. Loss of a transcription-coupled factor
  leaves global-genome NER intact, so Cockayne syndrome and UV-sensitive
  syndrome carry no mutagenic arm and no cancer excess: Ljungman and Zhang's
  reading is that the easily triggered apoptosis of the transcription-coupled
  arm eliminates pre-mutagenic cells. Conversely XPC and DDB2 loss leaves
  transcription-coupled NER intact and those patients have no neurological
  disease.

  The lesion trigger carries no GO binding on purpose. The input is chemistry
  and exposure, not a biological process: UV photoproducts in skin, platinum
  and other bulky adducts, and the endogenous 8,5'-cyclopurine
  deoxynucleosides that are candidate neurodegenerative lesions because UV
  does not reach the brain. A conforming entry binds the exposure on its own
  node (an ECTO `triggers` term, or the entry's `environmental` block linked
  through `influences_mechanisms`) and may bind GO:0009411 response to UV
  where the trigger is sunlight, as Xeroderma_Pigmentosum does.

  Deliberately outside this module: the transcription-factor functions of
  TFIIH and the CS proteins that are independent of repair. Trichothiodystrophy
  is a transcription syndrome whose photosensitive subset also loses NER; only
  the NER node of that entry conforms here, and its basal-transcription and
  R-loop nodes do not. Likewise the repair-independent roles of CSA and CSB
  that are the leading explanation for why Cockayne syndrome is so much more
  severe than UV-sensitive syndrome are not module content; they are the
  competing hypotheses curated in UV-Sensitive_Syndrome
  (csa_csb_repair_independent_functions, csb_pgbd3_fusion_position) and
  Cockayne_Syndrome, and this module's knowledge-gap discussion points at them.
  Do not add a node for them here until one is established.
pathophysiology:
- name: Helix-Distorting and Transcription-Blocking DNA Lesion Formation
  description: >-
    Bulky, helix-distorting lesions are formed continuously in DNA by
    ultraviolet light (cyclobutane pyrimidine dimers and 6-4 photoproducts),
    by environmental and chemotherapeutic alkylating and platinum adducts, and
    endogenously by oxidative chemistry (8,5'-cyclopurine deoxynucleosides).
    Any of these distorts the helix enough to be a nucleotide excision repair
    substrate and, if it lies in a transcribed strand, to block elongating RNA
    polymerase II. In a repair-proficient cell these lesions are transient;
    this node is the lesion input that the repair failure below converts into
    a persistent burden.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:24086042
    reference_title: "Nucleotide excision repair in eukaryotes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nucleotide excision repair (NER) is the main pathway used by mammals to
      remove bulky DNA lesions such as those formed by UV light, environmental
      mutagens, and some cancer chemotherapeutic adducts from DNA.
    explanation: >-
      Enumerates the lesion classes that are NER substrates and so the inputs
      to this trigger. Evidence source is OTHER because this is a review.
  - reference: PMID:17184928
    reference_title: "The case for 8,5'-cyclopurine-2'-deoxynucleosides as endogenous DNA lesions that cause neurodegeneration in xeroderma pigmentosum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Specifically, these lesions are chemically stable, endogenous DNA lesions
      that are repaired by the NER pathway but not by any other known process,
      and strongly block transcription by RNA polymerase II in cells from XP
      patients.
    explanation: >-
      Supplies the endogenous, non-UV lesion class that makes the trigger
      relevant in tissues sunlight never reaches, which the neurodegenerative
      arm depends on. Evidence source is OTHER because this is a review.
  downstream:
  - target: Persistent Unexcised DNA Lesions
    description: >-
      Lesions persist only when the subpathway responsible for them has been
      lost; this edge is the lesion load that the three repair-failure nodes
      convert into a persistent burden.
    causal_link_type: DIRECT
- name: Global-Genome NER Failure
  description: >-
    Global-genome nucleotide excision repair surveys the whole genome for
    helix-distorting lesions and is initiated by XPC-RAD23B, assisted at UV
    photoproducts by the UV-DDB complex (DDB2). Loss of either recognition
    factor leaves transcription-coupled repair intact but abolishes removal of
    lesions from non-transcribed DNA and from the non-transcribed strand of
    active genes; loss of a core factor (next node) abolishes it as well. This
    is the subpathway whose failure defines xeroderma pigmentosum.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: XPC
    term:
      id: hgnc:12816
      label: XPC
  - preferred_term: DDB2
    term:
      id: hgnc:2718
      label: DDB2
  biological_processes:
  - preferred_term: global genome nucleotide-excision repair
    term:
      id: GO:0070911
      label: global genome nucleotide-excision repair
    modifier: DECREASED
  - preferred_term: nucleotide-excision repair, DNA damage recognition
    term:
      id: GO:0000715
      label: nucleotide-excision repair, DNA damage recognition
    modifier: DECREASED
  evidence:
  - reference: PMID:9734359
    reference_title: "Xeroderma pigmentosum group C protein complex is the initiator of global genome nucleotide excision repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a novel DNA damage recognition-competition assay, we identified
      XPC-HR23B as the earliest damage detector to initiate NER: it acts before
      the known damage-binding protein XPA.
    explanation: >-
      Establishes XPC as the initiating recognition factor of the global-genome
      subpathway, so its loss is a failure at the first step modeled here.
  - reference: PMID:24086042
    reference_title: "Nucleotide excision repair in eukaryotes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GG-NER is initiated by the GG-NER specific factor XPC-RAD23B, in some
      cases with the help of UV-DDB (UV-damaged DNA-binding protein).
    explanation: >-
      Names the two subpathway-specific recognition factors whose genes
      (XPC, DDB2) this node carries. Evidence source is OTHER because this is
      a review.
  - reference: PMID:24954209
    reference_title: "Understanding nucleotide excision repair and its roles in cancer and ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The global genome NER (GG-NER) subpathway prevents mutagenesis by probing
      the genome for helix-distorting lesions, whereas transcription-coupled
      NER (TC-NER) removes transcription-blocking lesions to permit unperturbed
      gene expression, thereby preventing cell death.
    explanation: >-
      States the division of labour between the two subpathways that the two
      loss-of-function nodes and the two effector arms of this module follow.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Persistent Unexcised DNA Lesions
    description: >-
      Without global-genome recognition, helix-distorting lesions outside
      transcribed strands are never presented to the excision machinery and
      persist genome-wide until replication reaches them.
    causal_link_type: DIRECT
- name: Transcription-Coupled NER Initiation Failure at Stalled RNA Polymerase II
  description: >-
    Transcription-coupled nucleotide excision repair is initiated when
    elongating RNA polymerase II stalls at a lesion in the transcribed strand;
    CSB (ERCC6) is recruited to the stalled polymerase, CSA (ERCC8) and
    UVSSA-USP7 stabilise CSB and process the stalled polymerase, and the core
    machinery is then recruited. Loss of CSB, CSA or UVSSA leaves global-genome
    repair intact but abolishes the preferential, rapid removal of
    transcription-blocking lesions, so that a stalled polymerase itself becomes
    the persistent problem.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ERCC6
    term:
      id: hgnc:3438
      label: ERCC6
  - preferred_term: ERCC8
    term:
      id: hgnc:3439
      label: ERCC8
  - preferred_term: UVSSA
    term:
      id: hgnc:29304
      label: UVSSA
  biological_processes:
  - preferred_term: transcription-coupled nucleotide-excision repair
    term:
      id: GO:0006283
      label: transcription-coupled nucleotide-excision repair
    modifier: DECREASED
  evidence:
  - reference: PMID:23906714
    reference_title: "Mammalian transcription-coupled excision repair."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To alleviate transcriptional arrest, cells trigger a
      transcription-dependent genome surveillance pathway, termed
      transcription-coupled nucleotide excision repair (TC-NER) that ensures
      rapid removal of such transcription-impeding DNA lesions and prevents
      persistent stalling of transcription.
    explanation: >-
      Defines the subpathway and the stalled-transcription trigger that this
      node's factors act on. Evidence source is OTHER because this is a review.
  - reference: PMID:31558824
    reference_title: "The DNA damage response to transcription stress."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Damage detection by stalling of the transcribing Pol II is highly
      efficient, but a stalled Pol II complex may create an even bigger problem
      by interfering with repair of the lesions, and overall with transcription
      and replication.
    explanation: >-
      Explains why failure at this step is more than a missed repair: the
      stalled polymerase is itself an obstacle. Evidence source is OTHER
      because this is a review.
  - reference: PMID:22466611
    reference_title: "UV-sensitive syndrome protein UVSSA recruits USP7 to regulate transcription-coupled repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The UVSSA protein interacts with elongating RNA polymerase II, localizes
      specifically to UV-induced lesions, resides in chromatin-associated
      TC-NER complexes and is implicated in stabilizing the TC-NER master
      organizing protein ERCC6 (also known as CSB) by delivering the
      deubiquitinating enzyme USP7 to TC-NER complexes.
    explanation: >-
      Places UVSSA in the same initiation complex as CSB and shows the
      CSB-stabilising role that makes UVSSA loss a failure of the same step.
  - reference: PMID:22466610
    reference_title: "Mutations in UVSSA cause UV-sensitive syndrome and impair RNA polymerase IIo processing in transcription-coupled nucleotide-excision repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite mild clinical features, cells from individuals with UV(S)S, like
      Cockayne syndrome cells, are very UV sensitive and are deficient in
      transcription-coupled nucleotide-excision repair (TC-NER), which removes
      DNA damage in actively transcribed genes.
    explanation: >-
      Patient cells from both disorders share the same TC-NER deficiency, which
      is why both conform to this node despite very different outcomes.
  downstream:
  - target: Persistent Unexcised DNA Lesions
    description: >-
      Without transcription-coupled initiation, lesions in the transcribed
      strand of active genes are removed only slowly, if global-genome repair
      reaches them, and stalled RNA polymerase II remains at the lesion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31558824
      reference_title: "The DNA damage response to transcription stress."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To overcome the highly cytotoxic effects of TBLs, an intricate cellular
        response has evolved, in which the transcription-coupled nucleotide
        excision repair (TC-NER) pathway has a central role in removing TBLs
        specifically from the transcribed strand.
      explanation: >-
        Identifies TC-NER as the route by which transcription-blocking lesions
        leave the transcribed strand, so its loss is what makes them persist
        there. Evidence source is OTHER because this is a review.
- name: Core NER Lesion Verification and Dual Incision Failure
  description: >-
    Both subpathways converge on one excision machinery. TFIIH is recruited to
    the recognised lesion, its XPB subunit opens the helix and its XPD subunit
    tracks until it stalls at the lesion and verifies it; XPA, RPA and XPG then
    assemble the preincision complex, and ERCC1-XPF incises 5' and XPG 3' of
    the lesion to release a roughly 30-nucleotide oligonucleotide. Loss of any
    core factor (XPA, ERCC3/XPB, ERCC2/XPD, GTF2H5/TTDA, ERCC5/XPG, ERCC4/XPF,
    ERCC1) abolishes excision downstream of either recognition route, so
    these patients lose both global-genome and transcription-coupled repair.
    TFIIH also serves transcription initiation and ERCC1-XPF also serves
    interstrand-crosslink repair, so loss of those factors adds consequences
    this module does not model.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: XPA
    term:
      id: hgnc:12814
      label: XPA
  - preferred_term: ERCC3
    term:
      id: hgnc:3435
      label: ERCC3
  - preferred_term: ERCC2
    term:
      id: hgnc:3434
      label: ERCC2
  - preferred_term: GTF2H5
    term:
      id: hgnc:21157
      label: GTF2H5
  - preferred_term: ERCC5
    term:
      id: hgnc:3437
      label: ERCC5
  - preferred_term: ERCC4
    term:
      id: hgnc:3436
      label: ERCC4
  - preferred_term: ERCC1
    term:
      id: hgnc:3433
      label: ERCC1
  biological_processes:
  - preferred_term: nucleotide-excision repair, preincision complex assembly
    term:
      id: GO:0006294
      label: nucleotide-excision repair, preincision complex assembly
    modifier: DECREASED
  - preferred_term: nucleotide-excision repair
    term:
      id: GO:0006289
      label: nucleotide-excision repair
    modifier: DECREASED
  evidence:
  - reference: PMID:24086042
    reference_title: "Nucleotide excision repair in eukaryotes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Stalling of XPD at the lesion allows for the formation of the preincision
      complex by recruitment of XPA, RPA, and XPG.
    explanation: >-
      Describes the verification and preincision-assembly step that the core
      factors carry out after either recognition route. Evidence source is
      OTHER because this is a review.
  - reference: PMID:9734359
    reference_title: "Xeroderma pigmentosum group C protein complex is the initiator of global genome nucleotide excision repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After this subpathway-specific initial lesion detection, XPA may function
      as a common damage verifier and adaptor to the core of the NER apparatus.
    explanation: >-
      Positions XPA as the common verifier downstream of both subpathway-specific
      detection routes, which is what makes this node the shared core.
  - reference: PMID:19279666
    reference_title: "Coordination of dual incision and repair synthesis in human nucleotide excision repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Following damage recognition, dual incision 5' to the lesion by ERCC1-XPF
      and 3' to the lesion by XPG leads to the removal of a lesion-containing
      oligonucleotide of about 30 nucleotides.
    explanation: >-
      Defines the dual-incision step and the two endonucleases whose loss ends
      excision regardless of how the lesion was found.
  - reference: PMID:22572993
    reference_title: "TFIIH: when transcription met DNA repair."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The transcription initiation factor TFIIH is a remarkable protein complex
      that has a fundamental role in the transcription of protein-coding genes
      as well as during the DNA nucleotide excision repair pathway.
    explanation: >-
      Records the dual role of TFIIH that the node description flags as the
      source of consequences outside this module. Evidence source is OTHER
      because this is a review.
  - reference: PMID:17183314
    reference_title: "A new progeroid syndrome reveals that genotoxic stress suppresses the somatotroph axis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XPF-ERCC1 endonuclease is required for repair of helix-distorting DNA
      lesions and cytotoxic DNA interstrand crosslinks.
    explanation: >-
      Supports the ERCC1-XPF requirement and the crosslink-repair role that
      lies outside the module; the index patient of XFE progeroid syndrome is
      the human conformer of this node.
  downstream:
  - target: Persistent Unexcised DNA Lesions
    description: >-
      With the shared excision machinery lost, lesions reached by either
      recognition route are verified or incised inefficiently or not at all,
      so both the genome-wide and the transcribed-strand lesion burdens
      persist.
    causal_link_type: DIRECT
- name: Persistent Unexcised DNA Lesions
  description: >-
    The key conformance target. Whichever route was lost, the consequence is a
    lesion that nucleotide excision repair should have removed and did not:
    genome-wide after global-genome failure, concentrated in the transcribed
    strands of active genes after transcription-coupled failure, both after
    core-factor loss. The persistent lesion signals as ongoing DNA damage and
    is the substrate for the two effector arms, which fate depends on whether
    the cell meets it with a replication fork or with an elongating RNA
    polymerase. Conforming entries name the lesion class and compartment that
    applies to them (UV photoproducts in epidermis, endogenous cyclopurines in
    neurons, platinum adducts after chemotherapy).
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:24954209
    reference_title: "Understanding nucleotide excision repair and its roles in cancer and ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nucleotide excision repair (NER) eliminates various structurally
      unrelated DNA lesions by a multiwise 'cut and patch'-type reaction.
    explanation: >-
      The lesions this node holds are exactly those the cut-and-patch reaction
      would otherwise eliminate. Evidence source is OTHER because this is a
      review.
  - reference: PMID:17184928
    reference_title: "The case for 8,5'-cyclopurine-2'-deoxynucleosides as endogenous DNA lesions that cause neurodegeneration in xeroderma pigmentosum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the absence of NER, the damage accumulates, causing neuronal death by
      blocking transcription.
    explanation: >-
      States the accumulation of unrepaired damage in the absence of NER that
      this node represents, and previews the transcription-blockage arm.
      Evidence source is OTHER because this is a review.
  - reference: PMID:17183314
    reference_title: "A new progeroid syndrome reveals that genotoxic stress suppresses the somatotroph axis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that unrepaired cytotoxic DNA damage induces a highly
      conserved metabolic response mediated by the IGF1/insulin pathway, which
      re-allocates resources from growth to somatic preservation and life
      extension.
    explanation: >-
      Shows in ERCC1-XPF-deficient mice that the unrepaired-damage state is
      itself signalled systemically, the organism-level reading of the
      persistent-lesion node.
  downstream:
  - target: Mutagenic Replication Across Persistent Lesions
    description: >-
      A persistent lesion met by a replication fork is bypassed rather than
      removed, and the bypass fixes the lesion as a mutation; this arm is open
      to entries that have lost global-genome repair.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24954209
      reference_title: "Understanding nucleotide excision repair and its roles in cancer and ageing."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The global genome NER (GG-NER) subpathway prevents mutagenesis by
        probing the genome for helix-distorting lesions, whereas
        transcription-coupled NER (TC-NER) removes transcription-blocking
        lesions to permit unperturbed gene expression, thereby preventing cell
        death.
      explanation: >-
        Mutagenesis is the stated consequence prevented by GG-NER, so its loss
        opens this arm. Evidence source is OTHER because this is a review.
  - target: Transcription Stress-Induced Cell Death and Senescence
    description: >-
      A persistent lesion in a transcribed strand stalls RNA polymerase II;
      the stalled polymerase triggers apoptosis or senescence. This arm is open
      to entries that have lost transcription-coupled repair, and to
      core-factor entries in post-mitotic tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8761304
      reference_title: "Blockage of RNA polymerase as a possible trigger for u.v. light-induced apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We propose that the blockage of RNA polymerases at DNA lesions in the
        transcribed strand triggers the induction of a pathway leading to
        apoptosis.
      explanation: >-
        The proposed trigger for the cell-death arm is the stalled polymerase
        at an unrepaired transcribed-strand lesion, which is this edge.
- name: Mutagenic Replication Across Persistent Lesions
  description: >-
    When replication reaches an unrepaired helix-distorting lesion the fork
    bypasses it by translesion synthesis. Bypass of UV photoproducts yields the
    characteristic C-to-T transitions and CC-to-TT tandem substitutions at
    dipyrimidine sites (the UV signature), and the mutation burden accumulates
    with every exposure. This is the global-genome effector arm; it requires a
    dividing cell, so it is expressed in epidermis and other renewing tissues
    and not in post-mitotic neurons. Conforming entries name the exposure and
    the tissue; xeroderma pigmentosum variant (POLH loss) enters this node
    directly, with intact excision but error-prone bypass.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: translesion synthesis
    term:
      id: GO:0019985
      label: translesion synthesis
  evidence:
  - reference: PMID:25354245
    reference_title: "UV signature mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A confirmed UV signature was: ≥60% of mutations are C→T at a dipyrimidine
      site, with ≥5% CC→TT.
    explanation: >-
      Defines the mutation signature that bypass of unrepaired UV photoproducts
      leaves, the measurable output of this node. Evidence source is OTHER
      because this is a review and meta-analysis.
  - reference: PMID:24954209
    reference_title: "Understanding nucleotide excision repair and its roles in cancer and ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Consequently, defects in GG-NER result in cancer predisposition, whereas
      defects in TC-NER cause a variety of diseases ranging from ultraviolet
      radiation-sensitive syndrome to severe premature ageing conditions such
      as Cockayne syndrome.
    explanation: >-
      The cancer predisposition that follows GG-NER loss is the downstream of
      this mutagenic arm, and the contrast with TC-NER loss is why the two arms
      are separate nodes. Evidence source is OTHER because this is a review.
  downstream:
  - target: Mutagenesis-Driven Carcinogenesis
    description: >-
      Accumulated signature mutations in proliferating cells of the exposed
      tissue drive clonal transformation.
    causal_link_type: DIRECT
- name: Transcription Stress-Induced Cell Death and Senescence
  description: >-
    An elongating RNA polymerase II stalled at an unrepaired transcribed-strand
    lesion suppresses global transcription, stabilises p53 and triggers
    apoptosis at lesion doses that a repair-proficient cell tolerates; cells
    that survive enter senescence. This is the transcription-coupled effector
    arm. It is expressed in any cell, including post-mitotic neurons, and does
    not need replication. Conforming entries name the cell type and the stress
    that applies: UV-irradiated keratinocytes in the skin of UV-sensitive and
    Cockayne syndrome patients, endogenous-lesion-stressed neurons in
    neurodegenerative NER disease, senescent fibroblasts in the progeroid
    syndromes.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  evidence:
  - reference: PMID:8761304
    reference_title: "Blockage of RNA polymerase as a possible trigger for u.v. light-induced apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It was found that cells from patients with Cockayne's syndrome, which are
      deficient in the processing of u.v.-induced pyrimidine dimers from the

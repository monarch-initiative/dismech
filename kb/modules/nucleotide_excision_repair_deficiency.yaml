discussions:
- discussion_id: tc_ner_loss_severity_divergence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does loss of the same transcription-coupled initiation step produce
    only photosensitivity in UV-sensitive syndrome but neurodegeneration and
    segmental progeria in Cockayne syndrome, and does the degenerative
    consequence of this module therefore depend on a repair-independent
    function of CSA and CSB that it does not model?
  attaches_to:
  - "pathophysiology#Transcription Stress-Induced Cell Death and Senescence"
  - "pathophysiology#Neurodegeneration and Segmental Progeroid Degeneration"
  rationale: >-
    The module's transcription-coupled arm is supported by the shared cellular
    phenotype of UV-sensitive and Cockayne syndrome cells, but the clinical
    outcomes diverge completely, and the cell-death effector alone cannot
    account for that. The leading explanations (repair-independent roles of
    CSB and CSA in transcription by RNA polymerases I and II, in oxidative
    damage handling and in mitochondria, and the position of the CSB-PGBD3
    fusion) are curated as competing hypotheses in UV-Sensitive_Syndrome and
    Cockayne_Syndrome, not as module nodes. Until one of them is established,
    conforming entries should treat the degenerative consequence as
    disease-specific and keep the module's claim to the shared repair failure.
  evidence:
  - reference: PMID:23683874
    reference_title: "Blinded by the UV light: how the focus on transcription-coupled NER has distracted from understanding the mechanisms of Cockayne syndrome neurologic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, the TC-NER defect explains the sun sensitive phenotype common
      to both CS and UVsS, but cannot explain CS neurologic disease.
    explanation: >-
      States the gap directly: the shared repair failure explains the shared
      cutaneous feature and not the divergent neurological one. Evidence source
      is OTHER because this is a review.
  - reference: PMID:24954209
    reference_title: "Understanding nucleotide excision repair and its roles in cancer and ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Based on these findings, a mechanistic model is proposed that explains
      the complex genotype-phenotype correlations of transcription-coupled
      repair disorders.
    explanation: >-
      Records that a resolving model has been proposed, so the gap is live
      rather than settled. Evidence source is OTHER because this is a review.

name: Migraine Neurovascular Mechanism Module
category: Module
module_categories:
- NEUROSCIENCE
creation_date: '2026-10-29T14:30:00Z'
description: 'The conserved neurovascular chain of a migraine attack: cortical hyperexcitability lowers
  the threshold for cortical spreading depolarization, the depolarizing wave activates trigeminovascular
  nociceptors innervating the meninges, those afferents release CGRP and related neuropeptides onto the
  meningeal vasculature, and sustained afferent traffic drives central sensitization in the second-order
  trigeminal neurons. The key conformance target is Trigeminovascular Nociceptor Activation, the step
  at which a cortical electrophysiological event becomes head pain; every conformer funnels through it
  whatever lowered its own spreading-depolarization threshold. This is a disease module, not a drug one,
  and it carries no treatments block: the pharmacology of migraine is already factored into `serotonin_1b_1d_receptor_agonism`
  and `cgrp_receptor_antagonism`, and a conformer that uses those drugs reaches them through its own `therapeutic_vulnerability`
  nodes rather than through this module: `Migraine` conforms to both, `Migraine_with_Aura` to the 5-HT1B/1D
  module only, and `Familial_Hemiplegic_Migraine` to neither, because triptans and ergots are contraindicated
  there. That last case is a second reason this module carries no treatments block: a drug arm here would
  attach a therapy to a conformer that must avoid it. It is complementary to `nociceptor_sodium_channel_excitability`,
  which is scoped to channel-intrinsic hereditary pain disorders in which the nociceptor itself carries
  the lesion; here the nociceptor is normal and is driven by an event upstream of it in the cortex.'
notes: 'Disorder-specific substitutions at the trigger node: CACNA1A Cav2.1 gain of function, ATP1A2 astrocytic
  Na+/K+-ATPase loss of function and SCN1A Nav1.1 gain of function in familial hemiplegic migraine; K2P
  potassium channel dysfunction and endothelial dysfunction in migraine with aura; no identified molecular
  lesion in common migraine, where the trigger node is a population-level susceptibility rather than a
  named defect. The two halves of the chain are sourced differently. The cortical and spreading-depolarization
  half of the chain rests on genetic mouse models (PMID:15003170, PMID:21731499), so its evidence is MODEL_ORGANISM
  throughout and graded INDIRECT: the step from a mouse CSD threshold to a human attack is an inference
  this module does not assert. The step from spreading depolarization to trigeminal activation is the
  contested one. That edge carries a REFUTE item quoting PMID:40498799 on recent clinical data that challenge
  aura causing headache in patients, beside the SUPPORT item from the same essay for the animal-model
  result. PMID:21731499''s introduction says independently that the role of CSD in migraine headache is
  still debated; that sentence is not quoted as an evidence item, because a statement that a question
  is open takes no direction on it. A conformer should not read the edge as settled. The nociceptor node
  keeps GO:0048265 response to pain rather than a term under GO:0019233 sensory perception of pain, because
  Migraine and Migraine_with_Aura already bind GO:0048265 on the very nodes that conform here; moving
  the module off it would put the module and two of its three conformers on different terms, which is
  a judgement about those entries rather than about this module. No node asserts a vasodilation measurement.
  GO:0042311 vasodilation is bound on the neuropeptide node because the cited review describes CGRP release
  onto the meningeal vasculature, but none of the cited abstracts quantifies meningeal vessel calibre
  during an attack, and the older view that vasodilation is itself the source of the pain is not claimed
  here. The module is deliberately silent on the premonitory and postdromal phases, on hypothalamic and
  brainstem involvement, and on the episodic-to-chronic transition. Those are real parts of migraine biology
  and none of them is a conserved step in this chain; an entry curating them should model them in its
  own pathophysiology rather than stretching a node here. Do NOT create a `Migraine Neurovascular Mechanism`
  Disease entry: this is a mechanism module, and the diseases that instantiate it are `Migraine`, `Migraine_with_Aura`
  and `Familial_Hemiplegic_Migraine`.'
pathophysiology:
- name: Cortical Hyperexcitability Lowering the Spreading Depolarization Threshold
  role: trigger
  biological_scale: CELLULAR
  description: Raised glutamatergic drive, impaired astrocytic clearance of glutamate and potassium, or
    an interneuron firing defect leaves the cortical network closer to the threshold at which a self-propagating
    depolarization can be ignited. The node is about the lowered threshold, not about any one molecular
    lesion; conformers substitute their own.
  biological_processes:
  - preferred_term: synaptic transmission, glutamatergic
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: INCREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  locations:
  - preferred_term: neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  evidence:
  - reference: PMID:15003170
    reference_title: A Cacna1a knockin migraine mouse model with increased susceptibility to cortical
      spreading depression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Our data show that the increased susceptibility for CSD and aura in migraine may be due to
      cortical hyperexcitability.
    explanation: 'States the node directly: susceptibility to spreading depolarization is attributed to
      cortical hyperexcitability. Measured in a knockin mouse carrying the human FHM1 R192Q allele.'
  downstream:
  - target: Cortical Spreading Depolarization
    causal_link_type: DIRECT
    description: A lowered threshold is what permits the wave to be ignited and to propagate faster.
    evidence:
    - reference: PMID:15003170
      reference_title: A Cacna1a knockin migraine mouse model with increased susceptibility to cortical
        spreading depression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: in the intact animal, a reduced threshold and increased velocity of cortical spreading
        depression (CSD; the likely mechanism for the migraine aura)
      explanation: 'Measures both halves of the edge in the intact animal: threshold down, velocity up.'
- name: Cortical Spreading Depolarization
  role: amplifier
  biological_scale: TISSUE
  description: A slowly propagating wave of near-complete neuronal and glial depolarization crossing the
    cortex, followed by prolonged suppression of activity. It is the accepted correlate of the aura.
  biological_processes:
  - preferred_term: membrane depolarization
    term:
      id: GO:0051899
      label: membrane depolarization
    modifier: INCREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  locations:
  - preferred_term: neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  evidence:
  - reference: PMID:34384631
    reference_title: Migraine with aura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The pivotal role of cortical spreading depression (CSD) as a mechanism underlying aura has
      been widely supported by a large body of studies.
    explanation: Establishes spreading depolarization as the mechanism of the aura.
  - reference: PMID:21731499
    reference_title: Increased susceptibility to cortical spreading depression in the mouse model of familial
      hemiplegic migraine type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Neuroimaging examination suggests that migraine aura is associated to cortical spreading
      depression (CSD), a short-lasting, intense wave of neuronal and glial cell depolarization.
    explanation: Supplies the node's physical description, a short intense wave of neuronal and glial
      depolarization, and its human imaging correlate.
  downstream:
  - target: Trigeminovascular Nociceptor Activation
    causal_link_type: DIRECT
    description: 'The depolarizing wave and the ionic and inflammatory environment it leaves behind activate
      meningeal trigeminal afferents. This is the contested step of the chain: the two evidence items
      below quote the same essay in opposite directions, the animal-model result for the edge and the
      recent clinical data against it in patients.'
    evidence:
    - reference: PMID:40498799
      reference_title: The mysterious link between migraine aura and migraine headache.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: Cortical spreading depolarization (SD), recognized as the mechanism underlying aura symptoms,
        has been shown to trigger head pain through activation of trigeminal nociceptors in animal models.
      explanation: States the edge, and names the animal models it has been shown in.
    - reference: PMID:40498799
      reference_title: The mysterious link between migraine aura and migraine headache.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: However, recent clinical data challenge the notion that aura causes migraine headache in
        patients.
      explanation: 'The same essay''s countervailing clinical evidence: in patients the aura-to-headache
        causal step is not established.'
- name: Trigeminovascular Nociceptor Activation
  role: central_effector
  biological_scale: CELLULAR
  description: 'Activation, and then mechanical sensitization, of the trigeminal primary afferents innervating
    the meninges and their vessels. This is the key conformance target: the step at which a cortical electrophysiological
    event becomes nociceptive traffic, and the one every conformer shares whatever lowered its own threshold
    upstream. Activation and sensitization are separable at this node, and the cited work shows they have
    different mechanisms.'
  biological_processes:
  - preferred_term: response to pain
    term:
      id: GO:0048265
      label: response to pain
    modifier: INCREASED
  cell_types:
  - preferred_term: pain receptor cell
    term:
      id: CL:0000198
      label: pain receptor cell
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  - preferred_term: trigeminal ganglion
    term:
      id: UBERON:0001675
      label: trigeminal ganglion
  evidence:
  - reference: PMID:37487740
    reference_title: Meningeal P2X7 Signaling Mediates Migraine-Related Intracranial Mechanical Hypersensitivity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: Activation and sensitization of meningeal afferents play a key role in migraine headache,
      but the underlying mechanisms remain unclear.
    explanation: Establishes the node as the pivotal step in migraine headache, and that its mechanism
      is open.
  - reference: PMID:37487740
    reference_title: Meningeal P2X7 Signaling Mediates Migraine-Related Intracranial Mechanical Hypersensitivity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Broad-spectrum P2X receptor inhibition, selective blockade of the P2X7 receptor, and its
      related Pannexin 1 channel suppressed CSD-evoked afferent mechanical sensitization but did not affect
      the accompanying afferent activation response.
    explanation: Dissociates the node's two components pharmacologically, which is why the description
      keeps activation and sensitization distinct.
  - reference: PMID:37487740
    reference_title: Meningeal P2X7 Signaling Mediates Migraine-Related Intracranial Mechanical Hypersensitivity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: mediates the mechanical sensitization of meningeal afferents, which contributes to migraine
      pain by exacerbating the headache during normally innocuous physical activities
    explanation: 'Names the peripheral half of this node, mechanical sensitization of the meningeal afferents,
      and its clinical signature: headache worsened by ordinarily innocuous activity.'
  downstream:
  - target: Meningeal Neuropeptide Release and Neurogenic Vasodilation
    causal_link_type: DIRECT
    description: Activated afferents release CGRP and related neuropeptides from their peripheral terminals.
    evidence:
    - reference: PMID:30982963
      reference_title: CGRP and the Trigeminal System in Migraine.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: The neuropeptide CGRP is abundant in trigeminal ganglion neurons, and is released from
        the peripheral nerve and central nerve terminals as well as being secreted within the trigeminal
        ganglion.
      explanation: 'States the edge: the activated trigeminal neuron is the source of the neuropeptide.'
- name: Meningeal Neuropeptide Release and Neurogenic Vasodilation
  role: effector
  biological_scale: TISSUE
  description: CGRP and related neuropeptides released from peripheral trigeminal terminals act on the
    meningeal vasculature and on neighbouring afferents, producing vasodilation and a neurogenic inflammatory
    milieu that keeps the afferents firing. The module does not claim that the vasodilation is itself
    the source of the pain; see the notes.
  biological_processes:
  - preferred_term: neuropeptide signaling pathway
    term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    modifier: INCREASED
  - preferred_term: vasodilation
    term:
      id: GO:0042311
      label: vasodilation
    modifier: INCREASED
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  - preferred_term: middle meningeal artery
    term:
      id: UBERON:0010250
      label: middle meningeal artery
  evidence:
  - reference: PMID:30982963
    reference_title: CGRP and the Trigeminal System in Migraine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Release of CGRP from the peripheral terminals initiates a cascade of events that include
      increased synthesis of nitric oxide and sensitization of the trigeminal nerves.
    explanation: Describes what the released neuropeptide does locally, including the feedback onto the
      afferents.
  downstream:
  - target: Central Trigeminal Sensitization
    causal_link_type: DIRECT
    description: Sustained peripheral neuropeptide signalling and afferent traffic drive the second-order
      neurons into a sensitized state.
    evidence:
    - reference: PMID:30982963
      reference_title: CGRP and the Trigeminal System in Migraine.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Secreted CGRP in the trigeminal ganglion interacts with adjacent neurons and satellite
        glial cells to perpetuate peripheral sensitization, and can drive central sensitization of the
        second-order neurons.
      explanation: States the edge from peripheral neuropeptide signalling to sensitization of the second-order
        neurons.
- name: Central Trigeminal Sensitization
  role: consequence
  biological_scale: CELLULAR
  description: Amplified synaptic transmission in the second-order trigeminal neurons, which outlasts
    the peripheral drive and is the substrate of the allodynia and of pain on ordinarily innocuous movement
    that characterize an established attack.
  biological_processes:
  - preferred_term: positive regulation of synaptic transmission
    term:
      id: GO:0050806
      label: positive regulation of synaptic transmission
    modifier: INCREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30982963
    reference_title: CGRP and the Trigeminal System in Migraine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: progresses from peripheral sensitization of the primary afferent TG neurons to central sensitization
      of TNC second-order neurons and ultimately to central sensitization of third-order neurons in the
      thalamus.
    explanation: 'States the node''s own compartment: sensitization of the second-order neurons of the
      trigeminal nucleus caudalis, downstream of the peripheral afferent sensitization the node above
      carries.'
  - reference: PMID:30982963
    reference_title: CGRP and the Trigeminal System in Migraine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: As the migraine attack progresses, cutaneous allodynia develops in the periorbital area,
      signaling central sensitization of convergent TNC neurons and an increased resistance to the efficacy
      of triptans.
    explanation: Supplies the allodynia this node's description asserts, and ties it to central sensitization
      of convergent TNC neurons in patients during an attack.
  locations:
  - preferred_term: trigeminal nucleus caudalis
    term:
      id: UBERON:0002866
      label: caudal part of spinal trigeminal nucleus

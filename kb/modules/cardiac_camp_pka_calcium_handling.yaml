    term:
      id: hgnc:9380
      label: PRKACA
  - preferred_term: PLN
    term:
      id: hgnc:9080
      label: PLN
  - preferred_term: RYR2
    term:
      id: hgnc:10484
      label: RYR2
  - preferred_term: ATP2A2
    term:
      id: hgnc:812
      label: ATP2A2
  cellular_components:
  - preferred_term: sarcoplasmic reticulum membrane
    term:
      id: GO:0033017
      label: sarcoplasmic reticulum membrane
  evidence:
  - reference: PMID:33475150
    reference_title: Compartmentation of β(2) -adrenoceptor stimulated cAMP responses by phosphodiesterase types 2 and 3 in cardiac ventricular myocytes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: This second messenger produces many of its effects by activating protein kinase A (PKA), which phosphorylates key proteins involved in excitation and contraction of cardiac myocytes, including L-type Ca2+ channels (LTCCs) and phospholamban (PLN)
    explanation: >-
      States the node: cAMP acts by activating PKA, and PKA's cardiac substrates
      are the excitation-contraction proteins. Background framing in a study
      whose own measurements are FRET biosensors in adult rat ventricular
      myocytes.
  - reference: PMID:10710345
    reference_title: Phosphorylation of phospholamban and troponin I in beta-adrenergic-induced acceleration of cardiac relaxation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: Activation of cAMP-dependent protein kinase A (PKA) in ventricular myocytes by isoproterenol (Iso) causes phosphorylation of both phospholamban (PLB) and troponin I (TnI) and accelerates relaxation by up to twofold
    explanation: >-
      Names two of the substrates and the functional consequence, in ventricular
      myocytes under a beta-adrenergic agonist. The paper's own contribution is
      the phospholamban-knockout comparison that apportions the effect between
      them.
  - reference: PMID:21743453
    reference_title: Carvedilol and its new analogs suppress arrhythmogenic store overload-induced Ca2+ release.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: Carvedilol, but not VK-II-86, abolished the Iso-induced PKA phosphorylation of RyR2
    explanation: >-
      Immunoblot in mice given isoproterenol, with a beta-blocking and a
      minimally beta-blocking compound compared. Establishes that RyR2 is a PKA
      substrate under adrenergic drive and that blocking the receptor removes
      the phosphorylation, without committing to which site or what the
      phosphorylation does.
  downstream:
  - target: Increased Sarcoplasmic Reticulum Calcium Load
    causal_link_type: DIRECT
    description: >-
      Phosphorylated phospholamban stops inhibiting SERCA2a, so more calcium is
      pumped into the store between beats and the store content rises.
    hypothesis_groups:
    - pka_phospholamban_sr_load_elevation
  - target: Spontaneous Diastolic Sarcoplasmic Reticulum Calcium Release
    causal_link_type: DIRECT
    description: >-
      A second, disputed route in which phosphorylation of the release channel
      itself makes it likelier to open, independently of how much calcium the
      store holds. Both named models of this route are carried on this edge
      because both assert it and they disagree about the site and about the
      direction of the threshold change.
    hypothesis_groups:
    - pka_ryr2_ser2808_calstabin_dissociation
    - pka_ryr2_ser2030_soicr_sensitization
- name: Increased Sarcoplasmic Reticulum Calcium Load
  role: effector
  biological_scale: CELLULAR
  description: >-
    The calcium content of the sarcoplasmic reticulum rises. Phospholamban,
    once phosphorylated, releases its grip on SERCA2a, which then pumps calcium
    back into the store faster; combined with greater calcium entry through the
    phosphorylated L-type channel, the store ends each beat holding more than it
    did. This is the step that makes beta-adrenergic stimulation both
    inotropic and arrhythmogenic by the same action.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: calcium ion import into sarcoplasmic reticulum
    term:
      id: GO:1990036
      label: calcium ion import into sarcoplasmic reticulum
    modifier: INCREASED
  - preferred_term: sarcoplasmic reticulum calcium ion transport
    term:
      id: GO:0070296
      label: sarcoplasmic reticulum calcium ion transport
    modifier: INCREASED
  cellular_components:
  - preferred_term: sarcoplasmic reticulum
    term:
      id: GO:0016529
      label: sarcoplasmic reticulum
  evidence:
  - reference: PMID:33475150
    reference_title: Compartmentation of β(2) -adrenoceptor stimulated cAMP responses by phosphodiesterase types 2 and 3 in cardiac ventricular myocytes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: PKA-dependent phosphorylation of PLN diminishes the inhibitory effect that PLN has on SERCA2, resulting in an increase in the amount of Ca2+ taken up into the SR and available for subsequent release
    explanation: >-
      The mechanism of this node stated in full, including the consequence that
      matters for the next one: the extra calcium is available for subsequent
      release.
  - reference: PMID:10710345
    reference_title: Phosphorylation of phospholamban and troponin I in beta-adrenergic-induced acceleration of cardiac relaxation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: PLB phosphorylation increases sarcoplasmic reticulum (SR) Ca pumping
    explanation: >-
      The pumping half of the claim, in a study of ventricular myocytes and
      muscle from wild-type and phospholamban-knockout mice.
  - reference: PMID:21743453
    reference_title: Carvedilol and its new analogs suppress arrhythmogenic store overload-induced Ca2+ release.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: excessive beta-adrenergic receptor (AR) stimulation can result in sarcoplasmic recticulum (SR) Ca2+ overload that can trigger spontaneous Ca2+ waves
    explanation: >-
      Names the consequence of this node and the reason it matters, connecting
      the adrenergic route to store overload. Graded OTHER because the sentence

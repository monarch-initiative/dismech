treatments:
- name: Beta-Adrenergic Blockade
  description: >-
    Blocking the beta-adrenergic receptor removes the physiologic route into
    this module and is the mainstay of treatment in the catecholaminergic
    arrhythmia syndromes. Carvedilol is distinguished within the class: besides
    blocking the receptor it directly shortens ryanodine-receptor openings and
    suppresses spontaneous release, which is why it is modelled here as acting
    on two nodes rather than one. This is the module's drug-target pattern and
    is not a treatment recommendation inherited by conforming disorders, which
    carry their own.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
  target_mechanisms:
  - target: Cardiomyocyte cAMP-Raising Stimulus
    treatment_effect: INHIBITS
    description: >-
      Receptor blockade prevents the catecholamine surge from reaching adenylyl
      cyclase, so the stimulus never becomes a cAMP rise.
    evidence:
    - reference: PMID:21743453
      reference_title: Carvedilol and its new analogs suppress arrhythmogenic store overload-induced Ca2+ release.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: Beta-blockers suppress beta-AR mediated, stress-induced SR Ca2+ overload and its arrhythmogenicity
      explanation: >-
        States the class effect this target links to. Graded OTHER because the
        sentence sets up the paper's question rather than reporting its result.
  - target: Spontaneous Diastolic Sarcoplasmic Reticulum Calcium Release
    treatment_effect: INHIBITS
    description: >-
      Carvedilol additionally acts on the release channel itself, reducing the
      duration of its openings and suppressing spontaneous release independently
      of receptor blockade.
    evidence:
    - reference: PMID:21743453
      reference_title: Carvedilol and its new analogs suppress arrhythmogenic store overload-induced Ca2+ release.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: carvedilol is the only beta blocker tested that effectively suppresses SOICR by directly reducing the open duration of the cardiac ryanodine receptor (RyR2)
      explanation: >-
        Fourteen beta-blockers screened in HEK293 cells and cardiomyocytes, with
        single-channel recordings from native and recombinant RyR2. The direct
        action is separated from beta-blockade by a minimally beta-blocking
        analogue that retains it.
discussions:
- discussion_id: controversy_pka_ryr2_phosphorylation_site_and_consequence
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#PKA Activation and Phosphorylation of the Calcium-Handling Apparatus
  - pathophysiology#Spontaneous Diastolic Sarcoplasmic Reticulum Calcium Release
  prompt: >-
    Which serine on RyR2 carries the beta-adrenergic PKA signal, and does its
    phosphorylation change the channel's behaviour enough to cause arrhythmia on
    its own, or only by way of the store load that phospholamban phosphorylation
    produces?
  rationale: >-
    Three positions have been maintained in the primary literature for
    twenty-five years and none has displaced the others. The Ser2808 model holds
    that chronic adrenergic drive hyperphosphorylates that site and strips
    calstabin-2 from the channel. A knock-in mouse lacking the site shows an
    intact beta-adrenergic response and no protection from chronic stress, which
    is the result a sufficient mechanism should not produce. A second group
    reports that Ser2808 is already substantially phosphorylated before
    stimulation and that Ser2030 is the site that responds, and that RyR2 is not
    hyperphosphorylated in heart failure at all; that group's own functional work
    says PKA phosphorylation lowers the store threshold for spontaneous release.
    A direct measurement of intra-store calcium in rabbit myocytes then found
    acute beta-adrenergic stimulation raising the wave threshold rather than
    lowering it, attributing the waves to store load instead. The module
    therefore routes its default edge through store load, carries both
    channel-sensitization models as ALTERNATIVE hypothesis groups on a separate
    edge, and asserts neither as settled. Note that AOP-Wiki AOP 558 states this
    step as a plain causal relationship graded "High" weight of evidence, on a
    Key Event Relationship record carrying no references at all, and cites in its
    own bibliography a paper attributing RyR2 hyperphosphorylation to
    oxidative-stress-driven calpain activation rather than to PKA.
  evidence:
  - reference: PMID:17693412
    reference_title: "Functional consequence of protein kinase A-dependent phosphorylation of the cardiac ryanodine receptor: sensitization of store overload-induced Ca2+ release."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: The phosphorylation of the cardiac Ca(2+)-release channel (ryanodine receptor, RyR2) by protein kinase A (PKA) has been extensively characterized, but its functional consequence remains poorly defined and controversial
    explanation: >-
      The field's own statement that this step is unresolved, written by one of
      the disputing groups in the opening sentence of the paper that advances
      their position.
  - reference: PMID:22988136
    reference_title: β-Adrenergic stimulation increases the intra-sarcoplasmic reticulum Ca2+ threshold for Ca2+ wave generation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: whether the increased incidence of Ca(2+) waves during β-adrenergic stimulation is due to an alteration in this threshold remains controversial
    explanation: >-
      A second, independent group stating the same step is unsettled, and naming
      the specific quantity in dispute: whether beta-adrenergic stimulation acts
      on the release threshold or only on the store content.
  proposed_experiments:
  - experiment_id: exp_site_specific_phosphomutant_store_threshold
    name: Store-threshold measurement in site-specific RyR2 phosphomutant myocytes
    description: >-
      Measure intra-sarcoplasmic-reticulum calcium directly, with an entrapped
      low-affinity indicator, in cardiomyocytes carrying S2808A, S2030A, and the
      double phospho-null substitution, and determine the store content at which
      waves begin, before and during beta-adrenergic stimulation. The existing
      disagreement rests on experiments that measured different quantities in
      different species: one group inferred sensitization from single channels
      and cytosolic wave frequency, the other measured the store threshold
      directly but in wild-type cells only. A design that holds the readout fixed
      while varying the site would say whether either substitution moves the
      threshold, and a result in which neither does would place the whole effect
      on store load.
- discussion_id: gap_pde_isoform_compartment_and_disease_state_conditioning
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte cAMP-Raising Stimulus
  - pathophysiology#Increased Cardiomyocyte cAMP
  prompt: >-
    For which phosphodiesterase isoform, in which subcellular compartment, and in
    which disease state does inhibiting a cardiac phosphodiesterase actually
    raise cyclic AMP where the calcium-handling proteins are?
  rationale: >-
    The module curates a single trigger node covering both the adrenergic and the
    pharmacologic route, and that is a simplification it should be honest about.
    Two studies using FRET biosensors in adult rat ventricular myocytes show the
    answer flipping along two independent axes. PDE3 inhibition has no effect on
    the cytosolic cAMP transient in a normal heart and a clear effect in a
    hypertrophied one, so the answer depends on disease state. PDE4 inhibition
    raises cytosolic cAMP but does not reach the SERCA2 microdomain, where PDE2
    and PDE3 govern access instead, so the answer depends on which compartment is
    measured. A single arrow from "phosphodiesterase inhibition" to "increased
    cAMP" collapses three mechanisms into one, which is why this module does not
    draw that arrow as AOP-Wiki KER3445 states it. The full analysis is recorded
    in dismech issue #10454. What is missing is any human measurement: both
    studies are isolated rat myocytes, and no equivalent compartment-resolved
    data exist for the human heart or for the PDE3 inhibitors actually given to
    patients.
  evidence:
  - reference: PMID:33184031
    reference_title: Selective changes in cytosolic β-adrenergic cAMP signals and L-type Calcium Channel regulation by Phosphodiesterases during cardiac hypertrophy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: PDE3 inhibition with cilostamide (1 μM) had no effect on the amplitude of the cAMP transient and a minimal effect on its recovery in SHAM, whereas it potentiated the amplitude and slowed the decay in CH
    explanation: >-
      The disease-state axis, measured within one study: the same PDE3 inhibitor
      does nothing in sham-operated myocytes and raises cAMP in hypertrophied
      ones.
  - reference: PMID:33475150
    reference_title: Compartmentation of β(2) -adrenoceptor stimulated cAMP responses by phosphodiesterase types 2 and 3 in cardiac ventricular myocytes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: These results support the conclusion that cAMP produced by β2 -adrenoceptor stimulation was not able to reach subcellular locations where the SERCA2 pump is located
    explanation: >-
      The compartment axis: a cAMP signal that a cytosolic sensor reports is not
      necessarily present at the pump the signal is supposed to regulate.
  proposed_experiments:
  - experiment_id: exp_compartment_resolved_pde_inhibition_human_myocytes
    name: Compartment-resolved cAMP response to isoform-selective PDE inhibition in human cardiomyocytes
    description: >-
      Repeat the cytosolic and SERCA2-targeted biosensor comparison in human
      cardiomyocytes, ideally both induced-pluripotent-stem-cell-derived and
      freshly isolated from failing and non-failing explanted hearts, using
      isoform-selective PDE2, PDE3, and PDE4 inhibitors at clinically relevant
      concentrations. A result in which the rat compartment pattern is preserved
      would license curating the pharmacologic route as one edge with a stated
      compartment; a result in which it is not would mean the rodent data cannot
      carry the human claim at all.
- discussion_id: gap_mechanism_of_pde3_inhibitor_mortality
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Delayed Afterdepolarizations and Triggered Activity
  prompt: >-
    Is the excess mortality seen when a phosphodiesterase-3 inhibitor is given
    long term in chronic heart failure caused by the arrhythmic arm this module
    models, or by something else?
  rationale: >-
    The strongest human evidence that raising cardiomyocyte cAMP is harmful is
    the PROMISE trial, in which oral milrinone increased all-cause mortality by
    28 percent in 1088 patients with severe chronic heart failure despite
    improving haemodynamics. It is tempting to read that result as the clinical
    endpoint of this module, and the trial itself refuses the reading: its
    abstract states that the mechanism of the harm is unknown. The module
    therefore cites PROMISE for the pharmacologic entry point, where the trial
    does state a mechanism, and not for the arrhythmic consequence. Closing this
    gap needs evidence connecting the drug to the mechanism in patients, not a
    plausible chain drawn between two things that are separately true.
  evidence:
  - reference: PMID:1944425
    reference_title: Effect of oral milrinone on mortality in severe chronic heart failure. The PROMISE Study Research Group.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: milrinone therapy was associated with a 28 percent increase in mortality from all causes
    explanation: >-
      The size of the human harm signal, from a double-blind randomised trial
      against a background of conventional heart failure therapy.
  - reference: PMID:1944425
    reference_title: Effect of oral milrinone on mortality in severe chronic heart failure. The PROMISE Study Research Group.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The mechanism by which the drug exerts its deleterious effects is unknown
    explanation: >-
      The trialists' own statement of the gap, which is why this module does not
      attach the mortality result to a mechanism node.
  proposed_experiments:
  - experiment_id: exp_arrhythmic_mode_of_death_under_pde3_inhibition
    name: Mode-of-death and continuous-rhythm analysis under phosphodiesterase-3 inhibition
    description: >-
      In patients receiving a PDE3 inhibitor with an implanted device capable of
      continuous rhythm storage, compare the rate of ventricular
      tachyarrhythmia and of afterdepolarization-associated ectopy against a
      matched cohort not receiving one, and adjudicate mode of death rather than
      counting deaths. An excess concentrated in triggered ventricular
      arrhythmia would connect the trial result to this module; an excess
      distributed across pump failure and non-arrhythmic death would say the
      harm runs by another route and that this module should not claim it.

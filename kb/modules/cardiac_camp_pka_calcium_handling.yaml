name: Cardiac cAMP/PKA Calcium-Handling Module
description: >-
  A conserved cardiomyocyte signalling module for the second-messenger arm that
  destabilizes cardiac calcium handling: a cAMP-raising stimulus (a catecholamine
  surge acting on beta-adrenergic receptors, or a phosphodiesterase inhibitor
  removing cAMP degradation) raises cardiomyocyte cAMP, which activates protein
  kinase A; PKA phosphorylates the calcium-handling apparatus (phospholamban,
  the L-type calcium channel, troponin I, and the ryanodine receptor RyR2);
  phospholamban phosphorylation disinhibits SERCA2a and raises sarcoplasmic
  reticulum calcium load; and the loaded store releases spontaneously, producing
  delayed afterdepolarizations and triggered activity. The key conformance
  target is `PKA Activation and Phosphorylation of the Calcium-Handling
  Apparatus`, the step every route funnels through whatever raised cAMP. Two
  competing models of how PKA reaches the release channel are carried as
  `mechanistic_hypotheses` rather than settled: Ser2808 hyperphosphorylation
  with calstabin-2 dissociation, and Ser2030 phosphorylation sensitizing
  store-overload-induced calcium release. The module is the signalling
  counterpart of `cardiac_ion_channel_repolarization`, which opens at a germline
  channel variant and carries the downstream arrhythmia chain this module hands
  off to; it is distinct from `xenobiotic_cardiac_channel_perturbation`, whose
  scope requires the drug to act on an ion channel itself, and from
  `cardiomyopathy_maladaptive_remodeling`, which reaches heart failure through
  structural remodeling rather than through a second-messenger signal. Carries
  the beta-blocker drug-target pattern (carvedilol, which both blocks the
  receptor and directly suppresses spontaneous release).
category: Module
module_categories:
- PHARMACOLOGY
- TOXICOLOGY
creation_date: "2026-09-16T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a "Cardiac
  cAMP/PKA Calcium Handling" Disease entry. Disorder entries reference
  individual nodes via conforms_to, for example
  "cardiac_camp_pka_calcium_handling#PKA Activation and Phosphorylation of the
  Calcium-Handling Apparatus". Conforming nodes substitute the specific
  cAMP-raising stimulus (exertion or emotional stress in the inherited
  catecholaminergic arrhythmia syndromes; a PDE3 or PDE4 inhibitor in the
  pharmacologic case) and the calcium-handling lesion the phosphorylation acts
  upon.

  Scope. The module starts inside the cardiomyocyte. The systemic arm that
  produces the catecholamine surge (sympathoadrenal activation, plasma
  catecholamine rise) is left to the conforming disorder entry, which is why the
  two CPVT conformers declare conformance from an ORGANISM-scale stimulus node
  onto this module's MOLECULAR-scale trigger. The module also stops at
  spontaneous release and triggered activity: the organism-level chain from
  there (ventricular tachyarrhythmia, syncope, sudden cardiac death) already
  exists in `cardiac_ion_channel_repolarization` and is deliberately not
  duplicated. That module's new `Adrenergic and cAMP-Dependent Triggering` node
  conforms to this module's central effector, which is how the two are wired.

  Ontology bindings. A CHEBI binding for cAMP itself is deliberately absent, and
  was declined during review of PR #11954: module nodes in this repository bind
  GO and CL terms only, per the `create-module` skill, so the cAMP pool is
  carried by the biosynthesis and catabolism processes on either side of it
  rather than by a chemical entity.

  Deliberately out of scope, each for a stated reason. The direct,
  PKA-independent cyclic-nucleotide-gated arm (cAMP binding to HCN4 to set
  pacemaker rate, as in `Sick_Sinus_Syndrome_2_Autosomal_Dominant`'s "Loss of
  cAMP-Dependent Rate Modulation") is a different mechanism reaching a different
  endpoint, and folding it in would give the module two chains that never
  rejoin. Nodes describing a LOSS of the PKA arm rather than a gain
  (`Dilated_Cardiomyopathy_1P`'s "Protein Kinase A Sequestration by Mutant
  Phospholamban", `Hypertrophic_Cardiomyopathy_2`'s "Increased Myofilament
  Calcium Sensitivity and Loss of PKA-Mediated Desensitization") are not
  conformers: this module asserts a gain, and declaring conformance from a loss
  would be a contradiction rather than a consistency check.
  `Takotsubo_Cardiomyopathy` was examined and not wired: its beta2-adrenergic
  Gs-to-Gi switch is an attenuation of the cAMP arm, and its calcium-overload
  node runs to contraction-band necrosis rather than to triggered activity.
  `Long_QT_Syndrome`'s "Adrenergic Trigger Susceptibility" names the same arm
  but is curated as genotype-specific clinical trigger circumstances with no
  ontology bindings and no myocyte-level mechanism, so it is left for a later
  pass rather than conformed on the strength of its name.

  Provenance and the AOP-Wiki caveat. This module was curated against AOP-Wiki
  Key Event 693 (Increased, cyclic adenosine monophosphate), issue #11949. None
  of the evidence here came from AOP-Wiki. In the 2026-09-16 XML snapshot KE 693
  is an empty record (no description, no measurement method, no references) and
  every one of the four Key Event Relationships touching it sits at the 29.41%
  stub completion score with zero references; its cardiac parent pathway, AOP
  558, has never been OECD reviewed and was last modified 2024-12-03. AOP 558
  labels its own KER3446 (increased cAMP to RyR2 hyperphosphorylation) as "High"
  weight of evidence while the KER record behind that label holds nothing, and
  its bibliography cites a paper attributing RyR2 hyperphosphorylation to
  calpain rather than to the cAMP/PKA route the next edge asserts. The upstream
  edge KER3445 (phosphodiesterase inhibition to increased cAMP) was separately
  verified in issue #10454 and returned a do-not-curate-as-a-single-edge
  verdict, because the answer depends on PDE isoform, subcellular compartment,
  and disease state; that conditioning is recorded here as a discussion rather
  than flattened into a causal edge. Every reference in this module was found
  independently and each snippet verified against the cached paper.
mechanistic_hypotheses:
- hypothesis_group_id: pka_phospholamban_sr_load_elevation
  hypothesis_label: Phospholamban Phosphorylation and Sarcoplasmic Reticulum Calcium Load Model
  status: CANONICAL
  description: >-
    PKA phosphorylation of phospholamban relieves its inhibition of SERCA2a,
    accelerating calcium reuptake and raising the calcium content of the
    sarcoplasmic reticulum. Spontaneous release follows because the store is
    loaded past the threshold for it, not because the release channel has been
    made more sensitive. This is the route both camps in the RyR2
    phosphorylation dispute accept, and it is the one this module treats as
    default.
  evidence:
  - reference: PMID:10710345
    reference_title: Phosphorylation of phospholamban and troponin I in beta-adrenergic-induced acceleration of cardiac relaxation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: We conclude that the effect of beta-adrenergic activation on relaxation is mediated entirely by PLB phosphorylation in the absence of external load
    explanation: >-
      Phospholamban-knockout versus wild-type mouse myocytes and muscle, with
      twitch amplitudes matched before and after isoproterenol. The comparison
      isolates phospholamban phosphorylation as the step that carries the
      beta-adrenergic effect on calcium removal.
  - reference: PMID:33475150
    reference_title: Compartmentation of β(2) -adrenoceptor stimulated cAMP responses by phosphodiesterase types 2 and 3 in cardiac ventricular myocytes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: β1AR stimulation enhances contraction through PKA-dependent phosphorylation of LTCCs, which causes an increase in the influx of extracellular Ca2+, triggering a greater release of intracellular Ca2+ from the SR
    explanation: >-
      The load arm of this model stated from the other direction: PKA
      phosphorylation of the L-type channel admits more calcium, and a fuller
      store releases more. Background framing in a study whose own measurements
      are FRET biosensors in adult rat ventricular myocytes.
- hypothesis_group_id: pka_ryr2_ser2808_calstabin_dissociation
  hypothesis_label: Ser2808 Hyperphosphorylation and Calstabin-2 Dissociation Model
  status: ALTERNATIVE
  description: >-
    Chronic adrenergic drive PKA-hyperphosphorylates RyR2 at Ser2808, which
    dissociates the stabilizing subunit calstabin-2 (FKBP12.6) from the channel
    and raises its open probability, producing a leaky release channel. This is
    the most cited account of how cAMP reaches the release channel and it is
    directly disputed: a knock-in mouse lacking the site is not protected, and a
    second group reports that Ser2808 is already largely phosphorylated at
    baseline and is not the site that responds to beta-adrenergic stimulation.
    Recorded as ALTERNATIVE rather than CANONICAL for that reason. The same
    model appears in `RYR2_CPVT` as the calstabin-2 dissociation hypothesis for
    the variant channel; here it is the pharmacologic and adrenergic entry into
    it.
  evidence:
  - reference: PMID:10830164
    reference_title: "PKA phosphorylation dissociates FKBP12.6 from the calcium release channel (ryanodine receptor): defective regulation in failing hearts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: In failing human hearts, RyR2 is PKA hyperphosphorylated, resulting in defective channel function due to increased sensitivity to Ca2+-induced activation
    explanation: >-
      Immunoblot and single-channel work on explanted failing human myocardium
      and a canine pacing model. The founding claim of this model, and graded
      IN_VITRO because the measurement is biochemistry and bilayer recording on
      tissue removed from the organism.
  - reference: PMID:17717301
    reference_title: Intact beta-adrenergic response and unmodified progression toward heart failure in mice with genetic ablation of a major protein kinase A phosphorylation site in the cardiac ryanodine receptor.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: We found that the RyR2-S2808A mutation does not alter the beta-adrenergic response, leaves cellular function almost unchanged, and offers no significant protection in the maladaptive cardiac remodeling induced by chronic stress
    explanation: >-
      Gene-targeted mice in which the Ser2808 site is ablated, assessed by
      whole-heart and isolated-cardiomyocyte experiments under chronic stress.
      If the site carried the mechanism, removing it should have protected the
      animals, and it did not.
  - reference: PMID:16483256
    reference_title: "Ser-2030, but not Ser-2808, is the major phosphorylation site in cardiac ryanodine receptors responding to protein kinase A activation upon beta-adrenergic stimulation in normal and failing hearts."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: Ser-2030, but not Ser-2808, is the major PKA phosphorylation site in RyR2 responding to PKA activation upon beta-adrenergic stimulation in both normal and failing hearts, and that RyR2 is not hyperphosphorylated by PKA in heart failure
    explanation: >-
      Site- and phospho-specific antibodies applied to recombinant and native
      RyR2 across species, with isoproterenol stimulation in rat cardiac
      myocytes and in failing rat hearts. Denies both halves of the Ser2808
      model: the site identity and the hyperphosphorylation itself.
- hypothesis_group_id: pka_ryr2_ser2030_soicr_sensitization
  hypothesis_label: Ser2030 Phosphorylation and Store-Overload-Induced Release Sensitization Model
  status: ALTERNATIVE
  description: >-
    PKA phosphorylates RyR2 at Ser2030, and the functional consequence is a
    heightened response of the channel to luminal calcium, lowering the store
    content at which spontaneous release occurs. This is the competing account
    from the group that disputes the Ser2808 model, and it makes a testable
    claim the Ser2808 model does not: that the effect is conditional on luminal
    calcium being present. It is itself contradicted by a direct measurement of
    the wave threshold in rabbit myocytes, where beta-adrenergic stimulation
    moved the threshold in the opposite direction.
  evidence:
  - reference: PMID:17693412
    reference_title: "Functional consequence of protein kinase A-dependent phosphorylation of the cardiac ryanodine receptor: sensitization of store overload-induced Ca2+ release."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: our data indicate that PKA-dependent phosphorylation enhances the response of RyR2 to luminal Ca(2+) and reduces the threshold for SOICR and that this effect of PKA is largely mediated by phosphorylation at Ser-2,030
    explanation: >-
      Single-channel recording plus phosphomimetic and phospho-null mutants
      expressed in HEK293 cells, with confocal calcium imaging in intact rat
      ventricular myocytes. States the model's central claim and localizes it to
      Ser2030.
  - reference: PMID:22988136
    reference_title: β-Adrenergic stimulation increases the intra-sarcoplasmic reticulum Ca2+ threshold for Ca2+ wave generation.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: the refractoriness of wave occurrence (Ca(2+) wave latency) was prolonged during β-adrenergic stimulation
    explanation: >-
      Intra-store calcium measured directly with entrapped fluo-5N in rabbit
      ventricular myocytes, with store content held at a set level so that load
      and release readiness could be separated. Waves became harder to elicit
      under beta-adrenergic stimulation, not easier, which is the opposite of
      what a sensitized release channel predicts for acute stimulation.
pathophysiology:
- name: Cardiomyocyte cAMP-Raising Stimulus
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Something raises the rate at which cyclic AMP accumulates in the
    cardiomyocyte, by making more of it or by stopping its removal. The
    physiologic and pathophysiologic route is catecholamine occupancy of the
    beta-adrenergic receptor, which couples through Gs to adenylyl cyclase; the
    pharmacologic route is inhibition of the phosphodiesterases that hydrolyse
    cAMP, principally PDE3 and PDE4 in the myocyte. Conforming disorder entries
    substitute the particular stimulus: exertion or acute emotional stress in
    the inherited catecholaminergic arrhythmia syndromes, a PDE3 inhibitor such
    as milrinone or enoximone in the pharmacologic case. The systemic arm that
    generates the catecholamine surge sits upstream of this module.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: adenylate cyclase-activating adrenergic receptor signaling pathway
    term:
      id: GO:0071880
      label: adenylate cyclase-activating adrenergic receptor signaling pathway
    modifier: INCREASED
  molecular_functions:
  - preferred_term: 3',5'-cyclic-nucleotide phosphodiesterase activity
    term:
      id: GO:0004114
      label: 3',5'-cyclic-nucleotide phosphodiesterase activity
    modifier: DECREASED
  genes:
  - preferred_term: ADRB1
    term:
      id: hgnc:285
      label: ADRB1
  - preferred_term: PDE4D
    term:
      id: hgnc:8783
      label: PDE4D
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:

    reference_title: Selective changes in cytosolic β-adrenergic cAMP signals and L-type Calcium Channel regulation by Phosphodiesterases during cardiac hypertrophy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: In cardiomyocytes, phosphodiesterases (PDEs) type 3 and 4 are the predominant enzymes that degrade cAMP generated by β-adrenergic receptors
    explanation: >-
      Names both entry points this node covers in one sentence: cAMP generated
      by beta-adrenergic receptors, and the PDE3 and PDE4 activity that removes
      it. Background framing in a study whose own measurements are FRET and
      patch clamp in isolated rat left ventricular myocytes.
  - reference: PMID:1944425
    reference_title: Effect of oral milrinone on mortality in severe chronic heart failure. The PROMISE Study Research Group.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Milrinone, a phosphodiesterase inhibitor, enhances cardiac contractility by increasing intracellular levels of cyclic AMP
    explanation: >-
      The pharmacologic arm of this node stated by the randomised trial that
      tested the drug in patients. A PDE inhibitor is here precisely because it
      raises intracellular cAMP.
  downstream:
  - target: Increased Cardiomyocyte cAMP
    causal_link_type: DIRECT
    description: >-
      Increased synthesis, decreased hydrolysis, or both, raise the
      concentration of cyclic AMP available to its effectors in the myocyte.
- name: Increased Cardiomyocyte cAMP
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Cyclic AMP rises in the cardiomyocyte. The rise is not uniform across the
    cell: cAMP is confined into subcellular microdomains by the
    phosphodiesterases that degrade it, so which PDE is inhibited, which
    compartment is measured, and whether the heart is healthy or hypertrophied
    all change whether a rise is seen at all.
  notes: >-
    This node is the analogue of AOP-Wiki Key Event 693, "Increased, cyclic
    adenosine monophosphate", and is curated with the qualification that Key
    Event lacks: KE 693 asserts a tissue-level rise with no compartment, no
    isoform, and no disease state. A conforming entry should say where the rise
    was measured rather than assert a cell-wide one. See the
    gap_pde_isoform_compartment_and_disease_state_conditioning discussion.

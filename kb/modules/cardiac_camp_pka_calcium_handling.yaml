      its catalytic subunits onto their substrates.
- name: PKA Activation and Phosphorylation of the Calcium-Handling Apparatus
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Protein kinase A is activated and phosphorylates the proteins that move
    calcium in the cardiomyocyte: phospholamban, which restrains SERCA2a; the
    L-type calcium channel, which admits the trigger calcium; troponin I, which
    sets myofilament calcium sensitivity; and the ryanodine receptor RyR2, which
    releases the store. Which RyR2 site carries the effect, and what that effect
    is, is disputed.
  notes: >-
    Key conformance target. Every route into the module passes through this step
    whatever raised cAMP, which is what makes it the one to conform to. Before
    issue #11949 the knowledge base had no cardiac cAMP or PKA node at all: the
    inherited-channelopathy module reached sarcoplasmic-reticulum calcium leak
    from a mutant channel and never from a kinase. The two competing accounts of
    how PKA reaches the release channel are carried as mechanistic_hypotheses on
    the two edges out of this node rather than being resolved here; the default
    edge runs through store load, which both camps accept.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: activation of protein kinase A activity
    term:
      id: GO:0034199
      label: activation of protein kinase A activity
    modifier: INCREASED
  - preferred_term: protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: INCREASED
  genes:

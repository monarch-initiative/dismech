    reference_title: Gradual loss of myelin and formation of an astrocytic scar during Wallerian degeneration in the human spinal cord.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurofilament (NF) staining demonstrated a spatio-temporal pattern of
      axonal loss within degenerating descending nerve fibre tracts that could be
      detected close to the lesion as early as 12 days after injury and
      progressed to an almost complete loss of NF immunoreactivity at survival
      times of 1 year and longer.
    explanation: >-
      Human timecourse of this node in the central nervous system: axonal loss in
      the tract distal to the lesion, beginning within two weeks and essentially
      complete by a year.
  - reference: PMID:36244414
    reference_title: "Traumatic axonopathy in spinal tracts after impact acceleration head injury: Ultrastructural observations and evidence of SARM1-dependent axonal degeneration."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Several morphological features such as neurofilament compaction,
      accumulation of organelles and inclusions, axoskeletal flocculation,
      myelin degeneration and formation of ovoids are similar to profiles
      encountered in classical examples of WD.
    explanation: >-
      Supplies the ultrastructural description of this node and identifies the
      morphology after traumatic axonal injury as that of classical Wallerian
      degeneration.
  - reference: PMID:22678360
    reference_title: dSarm/Sarm1 is required for activation of an injury-induced axon death pathway.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results provide direct evidence that axons actively promote their own
      destruction after injury and identify dSarm/Sarm1 as a member of an ancient
      axon death signaling pathway.
    explanation: >-
      Supports the characterisation of this node as programmed self-destruction
      rather than passive loss of trophic support, which is what licenses calling
      it an effector step with a drug target upstream.
  downstream:
  - target: Disconnection of Neural Circuits
    causal_link_type: DIRECT
    description: >-
      An axon is the physical connection between two regions, so destroying the
      distal segment removes that connection.
    evidence:
    - reference: PMID:25808370
      reference_title: Disconnection of network hubs and cognitive impairment after traumatic brain injury.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Traumatic brain injury affects brain connectivity by producing traumatic
        axonal injury. This disrupts the function of large-scale networks that
        support cognition.
      explanation: >-
        States the edge in human patients: axonal injury is how the injury
        changes connectivity, and the connectivity change is what disrupts
        network function.

- name: Disconnection of Neural Circuits
  description: >-
    The convergent outcome is loss of connectivity. Axons destroyed distal to
    their lesions no longer transmit, the white matter tracts they composed thin
    and degenerate, and the networks they linked are measurably disconnected.
    Which deficit follows depends entirely on which tracts were injured, so this
    node is deliberately described as disconnection rather than as any particular
    clinical syndrome; conforming entries attach their own phenotypes here. In
    humans after a single traumatic brain injury the degeneration continues for
    years, so this node is not restricted to the acute phase.
  role: consequence
  biological_scale: ORGANISM

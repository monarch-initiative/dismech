  - reference: PMID:8247344
    reference_title: Beta-amyloid precursor protein (beta APP) as a marker for axonal injury after head injury.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, beta APP immunoreactivity was noted within white matter
      tracts where it marked damaged axons.
    explanation: >-
      The original human postmortem demonstration that accumulated amyloid
      precursor protein marks injured axons in white matter after head injury,
      which is what makes cargo accumulation the standard histological readout of
      this node.
  - reference: PMID:22079153
    reference_title: Partial interruption of axonal transport due to microtubule breakage accounts for the formation of periodic varicosities after traumatic axonal injury.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Although transport interruption underlies axonal bulb formation, it is
      unclear how varicosities arise, with multiple sites accumulating
      transported materials along one axon.
    explanation: >-
      States the mechanism of this node - transport interruption accumulating
      transported material - and distinguishes the terminal bulb from the
      periodic swellings along the shaft. Quoted from the stretch-injury culture
      model that produced the microtubule data.
  - reference: PMID:20019243
    reference_title: Mechanical breaking of microtubules in axons during dynamic stretch injury underlies delayed elasticity, microtubule disassembly, and axon degeneration.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      After stretch, undulating distortions formed along the axons that gradually
      relaxed back to a straight orientation, demonstrating a delayed elastic
      response. Subsequently, swellings developed, leading to degeneration of
      almost all axons by 24 h.
    explanation: >-
      Shows the temporal order within this node: cytoskeletal distortion first,
      then swellings, then degeneration of nearly every axon within a day.
  downstream:
  - target: Loss of Axonal NMNAT2
    causal_link_type: DIRECT
    description: >-
      NMNAT2 reaches the axon only by anterograde transport and has a short
      half-life, so interrupting its delivery is sufficient to deplete it beyond
      the lesion.
    evidence:
    - reference: PMID:20126265
      reference_title: Endogenous Nmnat2 is an essential survival factor for maintenance of healthy axons.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        We identify endogenous Nmnat2 as a labile axon survival factor whose
        constant replenishment by anterograde axonal transport is a limiting
        factor for axon survival.
      explanation: >-
        Makes the dependence explicit: the survival factor is supplied by the
        transport process the previous node interrupts, and its supply is
        rate-limiting for axon survival.

- name: Loss of Axonal NMNAT2
  description: >-
    NMNAT2 is the NAD+-synthesising enzyme that maintains the axon, and it is the
    most labile of the three mammalian NMNAT isoforms. Because it is made in the
    cell body and delivered by anterograde transport, the segment beyond a focal
    lesion loses it within hours of injury, before any morphological degeneration
    is visible. Neither NMNAT1 nor NMNAT3 substitutes. Depleting NMNAT2 is itself
    sufficient to make an uninjured axon degenerate, so this node is not merely a
    correlate of injury but the step that licenses the next one.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: injured neuron
    term:

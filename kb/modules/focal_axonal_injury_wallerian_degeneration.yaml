  evidence:
  - reference: PMID:25908823
    reference_title: SARM1 activation triggers axon degeneration locally via NAD⁺ destruction.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We report that SARM1 initiates a local destruction program involving rapid
      breakdown of nicotinamide adenine dinucleotide (NAD(+)) after injury.
    explanation: >-
      States the node's claim directly - SARM1 activation after injury destroys
      axonal NAD+ locally - using protease-sensitised SARM1 in dorsal root
      ganglion neuron cultures.
  - reference: PMID:28334607
    reference_title: The SARM1 Toll/Interleukin-1 Receptor Domain Possesses Intrinsic NAD(+) Cleavage Activity that Promotes Pathological Axonal Degeneration.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Using traumatic and vincristine-induced injury models in neurons, we
      demonstrate that the NADase activity of full-length SARM1 is required in
      axons to promote axonal NAD+ depletion and axonal degeneration after
      injury.
    explanation: >-
      Identifies the enzyme activity bound in this node: SARM1's own TIR domain
      cleaves NAD+, and that activity is required in the axon for depletion and
      degeneration. Purified proteins plus neuronal injury models.
  - reference: PMID:22678360
    reference_title: dSarm/Sarm1 is required for activation of an injury-induced axon death pathway.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Severed mouse Sarm1 null axons exhibit remarkable long-term survival both
      in vivo and in vitro, indicating that Sarm1 prodegenerative signaling is
      conserved in mammals.
    explanation: >-
      The loss-of-function evidence that makes this the rate-limiting node:
      without SARM1 a severed axon survives for weeks, so the cascade cannot
      proceed past this step.
  - reference: PMID:26912636
    reference_title: Attenuated traumatic axonal injury and improved functional outcome after traumatic brain injury in mice lacking Sarm1.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sarm1(-/-) mice developed fewer β-amyloid precursor protein aggregates in
      axons of the corpus callosum after traumatic brain injury as compared to
      Sarm1(+/+) mice.
    explanation: >-
      Connects this node to the traumatic entry route specifically: in a
      closed-head injury model, deleting SARM1 reduces the cargo-accumulation
      pathology that marks traumatic axonal injury.
  - reference: PMID:36244414
    reference_title: "Traumatic axonopathy in spinal tracts after impact acceleration head injury: Ultrastructural observations and evidence of SARM1-dependent axonal degeneration."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      an up to 90% reduction in the density of pathological profiles in Sarm1 KO
      mice after IA-TBI
    explanation: >-
      Quantifies the dependence in long spinal tracts after impact-acceleration
      head injury, and shows it is not confined to one tract or one injury
      geometry.
  downstream:
  - target: Wallerian Degeneration of the Distal Axon
    causal_link_type: DIRECT
    description: >-
      NAD+ destruction is the act of dismantling; the distal axon fragments
      because SARM1 has consumed the cofactor it needs to persist.
    evidence:
    - reference: PMID:25908823
      reference_title: SARM1 activation triggers axon degeneration locally via NAD⁺ destruction.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Formation of the SARM1 TIR dimer triggered rapid breakdown of NAD(+),
        whereas SARM1-induced axon destruction could be counteracted by increased
        NAD(+) synthesis.
      explanation: >-
        Shows the edge in both directions: SARM1 activation destroys NAD+, and
        restoring NAD+ synthesis prevents the destruction of the axon, so NAD+
        loss is the mediator of this edge rather than a side effect.

- name: Wallerian Degeneration of the Distal Axon
  description: >-
    The segment of axon distal to the lesion is dismantled: neurofilament
    compaction, accumulation of organelles, granular disintegration of the
    cytoskeleton, fragmentation into ovoids, and breakdown of the surrounding
    myelin, followed by clearance. This is a programmed self-destruction and not
    passive wasting from the loss of cell-body support, which is the point the
    SARM1 and NMNAT2 genetics above establish. In the human central nervous
    system the process is slow, continuing for months to years, and ends in an
    astrocytic scar rather than in regeneration.
  role: effector
  biological_scale: CELLULAR

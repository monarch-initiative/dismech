    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the slow reduction of CNS myelin and the long-term deposition of a dense
      astrocytic scar may present an environment that is non-supportive for axon
      regrowth
    explanation: >-
      Explains why the disconnection persists in the central nervous system: the
      degenerated tract is replaced by a scar that does not support regrowth, so
      the lost connection is not restored.
treatments:
- name: Small-Molecule SARM1 NADase Inhibition
  description: >-
    Selective small-molecule inhibitors of the SARM1 NADase block the executing
    step of this cascade after the injury has occurred. They are the drug-target
    pattern this module exists to expose, and they are preclinical: the published
    evidence is axon protection in neuronal culture and reproduction of the
    SARM1-null phenotype, with no approved agent and no human efficacy data. A
    conforming disorder entry should carry this treatment only if it has its own
    evidence for that disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: SARM1 Activation and Axonal NAD+ Depletion
    treatment_effect: INHIBITS
    description: >-
      The inhibitor acts on SARM1's NAD+-cleaving activity itself, so it blocks
      the central effector node rather than the injury upstream of it.
  evidence:
  - reference: PMID:33406435
    reference_title: Small Molecule SARM1 Inhibitors Recapitulate the SARM1(-/-) Phenotype and Allow Recovery of a Metastable Pool of Axons Fated to Degenerate.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We identify a potent and selective small molecule isoquinoline inhibitor of
      SARM1 NADase that recapitulates the SARM1-/- phenotype and protects axons
      from degeneration induced by axotomy or mitochondrial dysfunction.
    explanation: >-
      Establishes that the central effector node is pharmacologically
      inhibitable, and that inhibition protects axons after axotomy. Cultured
      neurons; no human data.
discussions:
- discussion_id: focal_axon_injury_sarm1_human_validity
  prompt: >-
    Does the SARM1-dependent execution step, established in mouse genetics and
    neuronal culture, operate in human focal axonal injury?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#SARM1 Activation and Axonal NAD+ Depletion
  - pathophysiology#Loss of Axonal NMNAT2
  rationale: >-
    The trigger, transport-interruption and Wallerian-degeneration nodes of this
    module all carry human postmortem evidence. The two molecular nodes do not:
    the demonstrations that NMNAT2 loss licenses degeneration and that SARM1
    executes it come from mouse knockouts and from rodent neuronal culture, and
    the traumatic-injury experiments are closed-head and impact-acceleration
    models in mice. The one human observation on the pathway is biallelic NMNAT2
    loss of function in two fetuses, which is a germline deficiency rather than a
    focal lesion. So the human question is not whether axons degenerate distal to
    a lesion - that is directly observed - but whether the SARM1 NADase is the
    executing step in human axons, which matters because it is the step the
    candidate drugs act on. Resolving it needs SARM1-dependence evidence in human
    neurons or human tissue, or a clinical result with a SARM1 inhibitor.
  evidence:
  - reference: PMID:26912636
    reference_title: Attenuated traumatic axonal injury and improved functional outcome after traumatic brain injury in mice lacking Sarm1.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results indicate that the SARM1-mediated prodegenerative pathway
      promotes pathogenesis in traumatic brain injury and suggest that
      anti-SARM1 therapeutics are a viable approach for preserving neurological
      function after traumatic brain injury.
    explanation: >-
      The strongest statement of the SARM1 claim for traumatic injury, and it is
      made entirely from a mouse knockout experiment - which is the mismatch this
      discussion records.
  - reference: PMID:31136762
    reference_title: Severe biallelic loss-of-function mutations in nicotinamide mononucleotide adenylyltransferase 2 (NMNAT2) in two fetuses with fetal akinesia deformation sequence.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this work, we present the first human variants in NMNAT2 identified in
      two fetuses with severe skeletal muscle hypoplasia and fetal akinesia.
    explanation: >-
      The extent of the human molecular evidence on this pathway: two fetuses
      with a germline NMNAT2 deficiency, which is why the model-to-human question
      remains open for the focal-injury cascade.

      label: nerve
  evidence:
  - reference: PMID:14534158
    reference_title: Gradual loss of myelin and formation of an astrocytic scar during Wallerian degeneration in the human spinal cord.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Axons undergo Wallerian degeneration distal to a point of injury.
    explanation: >-
      States the geometry this trigger node asserts: injury at a point, and
      degeneration of what lies distal to it. Human postmortem spinal cords after
      traumatic spinal cord injury and cerebral infarction.
  - reference: PMID:22079153
    reference_title: Partial interruption of axonal transport due to microtubule breakage accounts for the formation of periodic varicosities after traumatic axonal injury.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar axonal undulations and varicosities were observed following TBI in
      humans, suggesting primary microtubule failure may also be a feature of
      DAI.
    explanation: >-
      Human brains acquired acutely after traumatic brain injury show the same
      focal axonal lesions as mechanically stretched axons in culture,
      establishing mechanical injury of white matter axons as a real human
      trigger.
  - reference: PMID:9445407
    reference_title: Axonal transection in the lesions of multiple sclerosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Axonal transection, identified by the presence of terminal axonal ovoids,
      was detected in all 47 lesions and quantified in 18 lesions.
    explanation: >-
      Establishes the non-mechanical entry point to this module: inflammatory
      lesions transect axons in human multiple sclerosis, so the trigger node is
      not specific to trauma.
  downstream:
  - target: Axonal Transport Interruption and Axonal Swelling
    causal_link_type: DIRECT
    description: >-
      Focal injury damages the axonal cytoskeleton at the lesion, and the
      microtubule tracks that carry transported cargo are broken there.
    evidence:
    - reference: PMID:20019243
      reference_title: Mechanical breaking of microtubules in axons during dynamic stretch injury underlies delayed elasticity, microtubule disassembly, and axon degeneration.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Ultrastructural analyses of axons postinjury revealed immediate breakage
        and buckling of microtubules in axon undulations and progressive loss of
        microtubules.
      explanation: >-
        Links the mechanical event directly to microtubule breakage at the site
        of injury, the step that interrupts transport. Micropatterned neuronal
        cultures subjected to dynamic stretch.

- name: Axonal Transport Interruption and Axonal Swelling
  description: >-
    Cytoskeletal failure at the lesion interrupts anterograde axonal transport.
    Transported cargo accumulates where transport stops, producing the swellings
    and terminal retraction bulbs that are the histological signature of
    traumatic axonal injury. Amyloid precursor protein is the cargo
    conventionally stained for this purpose, which is why beta-APP
    immunoreactivity marks damaged axons in injured human white matter. Because
    an axon contains many microtubules, breakage of a subset interrupts
    transport only partly and at several points, giving the periodic varicosities
    seen alongside frank bulbs.

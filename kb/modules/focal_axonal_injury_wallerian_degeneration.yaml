name: Focal Axonal Injury and Wallerian Degeneration Module
description: >-
  A conserved acute axon-injury module: damage at one point along an axon
  (mechanical stretch or shear, transection, crush, or inflammatory attack)
  disrupts the axonal cytoskeleton and interrupts axonal transport, so
  transported cargo accumulates in swellings and retraction bulbs; the labile
  axon survival factor NMNAT2 is no longer delivered beyond the lesion and
  decays in the distal segment; its loss permits activation of the NAD+
  hydrolase SARM1, axonal NAD+ falls, and the distal axon is dismantled by the
  programmed self-destruction known as Wallerian degeneration, disconnecting the
  circuits those axons carried. The key conformance target is
  "SARM1 Activation and Axonal NAD+ Depletion", the rate-limiting step of the
  cascade and the only one with a candidate drug target: loss of SARM1 preserves
  severed axons for weeks, and selective small-molecule SARM1 NADase inhibitors
  reproduce that protection in neuronal culture (preclinical only, no approved
  agent). The module is deliberately generic in its trigger so that it is
  reusable outside head trauma - diffuse axonal injury in traumatic brain
  injury, white matter tract degeneration after spinal cord injury, peripheral
  nerve crush and transection, and axon transection inside inflammatory
  demyelinating lesions all enter at the same trigger node.
  COMPLEMENTARY TO, NOT OVERLAPPING WITH, the two dying-back modules.
  peripheral_axonal_degeneration and corticospinal_tract_axonopathy both model
  slow, length-dependent degeneration in which the longest axons fail from their
  distal ends because a diffuse metabolic, genetic, or toxic lesion starves a
  supply line stretched over a great distance; the insult is distributed, there
  is no lesion site, and the clinical pattern is graded by axon length. This
  module models the opposite geometry: a single focal lesion at an arbitrary
  point along an axon of any length, after which everything distal to that point
  is destroyed on a timescale of days, and nothing is predicted about axon
  length. A disorder may conform to both (SARM1 is also implicated in
  dying-back axonopathy), but at different nodes and for different claims; do
  not collapse the acute focal cascade onto a dying-back node.
category: Module
module_categories:
- NEUROSCIENCE
creation_date: "2026-10-01T04:30:00Z"
notes: >-
  This is a mechanism module, not a disease. Do not create a Disease entry for
  Wallerian degeneration or for traumatic axonal injury as such; those are
  mechanisms inside a disorder entry. Disorder entries reference individual
  nodes via conforms_to, for example
  "focal_axonal_injury_wallerian_degeneration#SARM1 Activation and Axonal NAD+ Depletion".


  What conformers substitute at the trigger node: traumatic brain injury
  substitutes high-strain-rate stretch and shear of white matter axons during
  rapid head acceleration; spinal cord injury substitutes contusion or
  laceration of ascending and descending tracts; peripheral nerve injury
  substitutes crush or transection of a named nerve, with the Schwann cell
  (CL:0002573) and the distal nerve stump as the site; inflammatory
  demyelinating disease substitutes immune-mediated transection of axons inside
  a lesion. The locations substituted at the downstream nodes follow the
  compartment: brain white matter and corpus callosum for traumatic brain
  injury, spinal cord white matter for spinal cord injury, the peripheral nerve
  for nerve injury. A conformer that models regeneration (peripheral nerve,
  where the distal stump is cleared and reinnervated) extends the chain past the
  consequence node rather than altering it.


  Worked conformers to come: Traumatic_Brain_Injury (diffuse axonal injury
  branch) and Chronic_Traumatic_Encephalopathy (repetitive mild injury, whose
  trauma node is mostly axonal). Neither is wired to this module yet; this
  module was created first in the build order of the injury-granularity pilot.


  Evidence asymmetry to be aware of when conforming: the trigger, transport
  interruption, and Wallerian-degeneration nodes all carry human postmortem
  evidence, whereas the NMNAT2 and SARM1 steps rest mainly on mouse genetics and
  neuronal culture. The one human genetic observation on the pathway is biallelic
  NMNAT2 loss of function in fetal akinesia. This is recorded as a
  HUMAN_MODEL_MISMATCH discussion rather than left implicit, and it is the
  reason the central effector node's claim is framed as the executing step of
  the cascade rather than as a validated human therapeutic target.
pathophysiology:
- name: Focal Axonal Injury
  description: >-
    An axon is damaged at one point along its length. The insult may be
    mechanical - stretch and shear at high strain rate, crush, or outright
    transection - or an inflammatory attack on the axon inside a lesion. What
    the cascade requires is only that the damage be focal: the lesion defines a
    proximal segment that remains attached to the cell body and a distal segment
    that does not, and the module describes the fate of the distal segment. Axon
    length is not a determinant here, which is what separates this trigger from
    the diffuse metabolic insults of the dying-back modules.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: injured neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: response to axon injury
    term:
      id: GO:0048678
      label: response to axon injury
    modifier: INCREASED

  evidence:
  - reference: PMID:20126265
    reference_title: Endogenous Nmnat2 is an essential survival factor for maintenance of healthy axons.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Nmnat2 is by far the most labile Nmnat isoform and is depleted in distal
      stumps of injured neurites before Wallerian degeneration begins.
    explanation: >-
      Establishes both halves of this node: NMNAT2 is the labile isoform, and it
      disappears from the distal stump ahead of degeneration, so its loss is
      upstream rather than a consequence.
  - reference: PMID:23610559
    reference_title: Subcellular localization determines the stability and axon protective capacity of axon survival factor Nmnat2.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Axons require a constant supply of the labile axon survival factor Nmnat2
      from their cell bodies to avoid spontaneous axon degeneration.
    explanation: >-
      Confirms the continuous-supply requirement independently, in sympathetic
      neuron cultures with live imaging of NMNAT2 transport.
  - reference: PMID:31136762
    reference_title: Severe biallelic loss-of-function mutations in nicotinamide mononucleotide adenylyltransferase 2 (NMNAT2) in two fetuses with fetal akinesia deformation sequence.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate a previously unknown role for NMNAT2 in human
      neurological development and provide the first direct molecular evidence to
      support the involvement of Wallerian degeneration in a human axonal
      disorder.
    explanation: >-
      The only human genetic evidence on this step: biallelic NMNAT2 loss of
      function in two fetuses, with the authors reading it as involvement of
      Wallerian degeneration in human disease. Indirect for the injury cascade,
      because the lesion here is germline rather than focal.
  downstream:
  - target: SARM1 Activation and Axonal NAD+ Depletion
    causal_link_type: DIRECT
    description: >-
      Falling NMNAT2 activity is what permits SARM1 to become active; the
      degeneration caused by NMNAT2 depletion does not occur without SARM1.
    evidence:
    - reference: PMID:25818290
      reference_title: Absence of SARM1 rescues development and survival of NMNAT2-deficient axons.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        axon degeneration specifically induced by NMNAT2 depletion requires
        SARM1
      explanation: >-
        Places the two nodes in order by epistasis: removing SARM1 abolishes the
        degeneration that NMNAT2 loss causes, in NMNAT2-deficient mice and their
        neurons.

- name: SARM1 Activation and Axonal NAD+ Depletion
  description: >-
    SARM1 is the executioner of the cascade. Once NMNAT2 support falls, SARM1 is
    activated and its TIR domain hydrolyses NAD+ directly, collapsing axonal
    NAD+ and the energy state that depends on it. The destruction is local to the
    axon and does not require the cell body. This is the key conformance target
    of the module: it is the rate-limiting step, it is where every entry route
    converges, and it is the only step in the chain with a candidate drug target,
    since both genetic deletion and selective NADase inhibitors block
    degeneration downstream of an injury that has already happened.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: injured neuron
    term:

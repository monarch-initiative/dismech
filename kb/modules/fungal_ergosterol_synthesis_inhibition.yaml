name: Fungal Ergosterol Synthesis Inhibition Module
description: >-
  A conserved antifungal drug-target module for two entry points into fungal
  ergosterol biosynthesis. Squalene epoxidase (Erg1) catalyzes an early sterol
  step targeted by allylamines, while sterol 14-alpha-demethylase (Cyp51/Erg11)
  converts lanosterol along the azole-targeted branch. Both normal dependencies
  converge on ergosterol production and ergosterol-dependent fungal
  plasma-membrane organization. Antifungal treatments inhibit the applicable
  enzyme node; the positive pathophysiology edges describe the untreated
  biosynthetic dependency and do not invert inhibition into a causal claim that
  normal enzyme activity produces sterol depletion. Acquired azole resistance
  through target alteration or overexpression and drug efflux is recorded as a
  separate adaptive state rather than as a downstream product of normal Cyp51
  activity.
category: Module
creation_date: "2026-06-24T00:00:00Z"
notes: >-
  This module contains two parallel therapeutic-vulnerability nodes rather than
  treating Erg1 and Cyp51 as consecutive reactions: many enzymatic intermediates
  separate squalene epoxidation from lanosterol demethylation. Each target has an
  INDIRECT_KNOWN_INTERMEDIATES edge to the shared ergosterol-production node,
  which then supports plasma-membrane organization. Azoles and allylamines point
  to the applicable local target with an evidence-bearing INHIBITS edge.
  Resistance is optional context and is not sufficient for positive target
  conformance.

  As a high-precision operational curation boundary, a conforming disorder must
  identify a fungal infectious agent; model a disease-local Erg1 or Cyp51 target
  with the corresponding conserved GO process and molecular function; preserve
  the applicable target-to-ergosterol and ergosterol-to-membrane causal slice;
  and link a separately modeled azole or allylamine treatment to that local
  target with treatment_effect INHIBITS. The target edge needs cached
  class-mechanism evidence and the treatment needs disease-specific use evidence.
  These conditions are jointly sufficient for high-precision conformance to the
  applicable target branch, and each is required by this operational boundary. A
  Cyp51 conformer need not duplicate the Erg1 branch, and an Erg1 conformer need
  not duplicate the Cyp51 branch.
  A treatment mention without a local target, mixed antifungal regimens without
  agent-specific targeting, host steroidogenesis inhibition, incidental fungal
  complications, and resistance without the normal target pathway are
  insufficient. Polyene binding, echinocandin wall inhibition, and flucytosine
  antimetabolism belong to their dedicated modules. This boundary is an
  operational conformance rule, not a claim that treatment is biologically
  necessary for the fungal pathway to exist.
pathophysiology:
- name: Squalene Epoxidation by Squalene Epoxidase (ERG1)
  description: >-
    Squalene epoxidase (Erg1) catalyzes an early committed reaction in sterol
    biosynthesis and is the molecular target of allylamines such as terbinafine.
    Inhibiting this enzyme causes squalene accumulation and ergosterol
    deficiency. This node represents the normal fungal enzyme activity that is
    therapeutically vulnerable, not the inhibited state.
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Sterol Biosynthetic Process
    term:
      id: GO:0016126
      label: sterol biosynthetic process
  molecular_functions:
  - preferred_term: Squalene Monooxygenase Activity
    term:
      id: GO:0004506
      label: squalene monooxygenase activity
  evidence:
  - reference: PMID:1543672
    reference_title: "Terbinafine: mode of action and properties of the squalene epoxidase inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Terbinafine (Lamisil) has primarily fungicidal action against many fungi as
      a result of its specific mechanism of squalene epoxidase inhibition.
    explanation: >-
      Biochemical evidence identifies squalene epoxidase as the allylamine
      target represented by this therapeutic-vulnerability node.
  downstream:
  - target: Ergosterol Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - 2,3-oxidosqualene formation
    - lanosterol and downstream sterol-intermediate synthesis
    description: >-
      The Erg1-catalyzed early sterol step supplies intermediates that proceed
      through multiple reactions to ergosterol production.
    evidence:
    - reference: PMID:1543672
      reference_title: "Terbinafine: mode of action and properties of the squalene epoxidase inhibition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Treated fungi accumulate squalene while becoming deficient in ergosterol,
        an essential component of fungal cell membranes.
      explanation: >-
        The coupled squalene accumulation and ergosterol deficiency after Erg1
        inhibition supports the normal indirect dependency of ergosterol
        production on this early enzyme step.

- name: Lanosterol 14-alpha-Demethylation by CYP51 (ERG11)
  description: >-
    Sterol 14-alpha-demethylase (Cyp51, commonly encoded by ERG11 in fungi)
    catalyzes demethylation in the ergosterol pathway and is the molecular target
    of imidazole and triazole antifungals. This node represents the normal fungal
    enzyme activity that is therapeutically vulnerable; azole inhibition is
    represented by treatment edges.
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Ergosterol Biosynthetic Process
    term:
      id: GO:0006696
      label: ergosterol biosynthetic process
  molecular_functions:
  - preferred_term: Sterol 14-Demethylase Activity
    term:
      id: GO:0008398
      label: sterol 14-demethylase activity
  evidence:
  - reference: PMID:33374996
    reference_title: "Sterol 14α-Demethylase Ligand-Binding Pocket-Mediated Acquired and Intrinsic Azole Resistance in Fungal Pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The fungal cytochrome P450 enzyme sterol 14α-demethylase (SDM) is a key
      enzyme in the ergosterol biosynthesis pathway.
    explanation: >-
      Review evidence establishes fungal sterol 14-alpha-demethylase as a key
      enzyme in ergosterol biosynthesis.
  - reference: PMID:33374996
    reference_title: "Sterol 14α-Demethylase Ligand-Binding Pocket-Mediated Acquired and Intrinsic Azole Resistance in Fungal Pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The binding of azoles to the active site of SDM results in a depletion of
      ergosterol, the accumulation of toxic intermediates and growth inhibition.
    explanation: >-
      Review evidence identifies this enzyme as the azole target and states the
      consequences of inhibiting it.
  downstream:
  - target: Ergosterol Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - removal of the lanosterol 14-alpha-methyl group
    - completion of downstream sterol-biosynthetic reactions
    description: >-
      Cyp51-mediated lanosterol demethylation permits the remaining sterol
      reactions that yield ergosterol.
    evidence:
    - reference: PMID:31643715
      reference_title: "Antifungal Agents."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Imidazole and triazole antifungal drugs inhibit cytochrome P450
        14α-demethylase which is responsible for converting lanosterol to
        ergosterol, which blocks cell membrane synthesis in fungi.
      explanation: >-
        The reference explicitly connects the demethylase step to conversion of
        lanosterol into ergosterol and fungal membrane synthesis.

- name: Ergosterol Production
  description: >-
    Completion of fungal sterol biosynthesis yields ergosterol, the sterol that
    supplies the fungal plasma membrane. This shared output is downstream of
    both druggable entry points in the module.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Ergosterol Metabolic Process
    term:
      id: GO:0008204
      label: ergosterol metabolic process
  evidence:
  - reference: PMID:1543672
    reference_title: "Terbinafine: mode of action and properties of the squalene epoxidase inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Treated fungi accumulate squalene while becoming deficient in ergosterol,
      an essential component of fungal cell membranes.
    explanation: >-
      Biochemical evidence identifies ergosterol as the pathway product and an
      essential fungal-membrane component.
  downstream:
  - target: Ergosterol-Dependent Fungal Plasma-Membrane Organization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - ergosterol insertion into the fungal plasma membrane
    - sterol-dependent membrane packing and membrane-protein organization
    description: >-
      Ergosterol produced by the pathway is incorporated into the fungal plasma
      membrane, where it supports membrane organization.
    evidence:
    - reference: PMID:1543672
      reference_title: "Terbinafine: mode of action and properties of the squalene epoxidase inhibition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Treated fungi accumulate squalene while becoming deficient in ergosterol,
        an essential component of fungal cell membranes.
      explanation: >-
        The evidence identifies ergosterol as an essential fungal-membrane
        component, supporting the indirect production-to-organization edge.

- name: Ergosterol-Dependent Fungal Plasma-Membrane Organization
  description: >-
    Ergosterol incorporation supports the organization and integrity of the
    fungal plasma membrane. This is the normal cellular output of the
    biosynthetic dependency, not an assertion of drug-induced depletion or cell
    death.
  role: consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Plasma Membrane Organization
    term:
      id: GO:0007009
      label: plasma membrane organization
  evidence:
  - reference: PMID:1543672
    reference_title: "Terbinafine: mode of action and properties of the squalene epoxidase inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Treated fungi accumulate squalene while becoming deficient in ergosterol,
      an essential component of fungal cell membranes.
    explanation: >-
      The evidence identifies ergosterol as an essential fungal-membrane
      component, supporting this cellular membrane-organization output.

- name: Azole Target-Alteration, Overexpression, and Efflux Resistance
  description: >-
    Azole resistance can arise through amino-acid substitutions in sterol
    14-alpha-demethylase that reduce drug binding, overexpression of the target,
    or increased drug efflux. This adaptive state is recorded independently of
    the normal biosynthetic graph because normal Cyp51 activity does not cause
    resistance.
  role: adaptive_escape
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Response to Xenobiotic Stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:33374996
    reference_title: "Sterol 14α-Demethylase Ligand-Binding Pocket-Mediated Acquired and Intrinsic Azole Resistance in Fungal Pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diverse mechanisms are responsible for azole resistance. They include
      amino acid (AA) substitutions in SDM and overexpression of SDM and/or
      efflux pumps.
    explanation: >-
      Review evidence directly supports the target-alteration,
      target-overexpression, and efflux mechanisms represented by this standalone
      adaptive state.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      increased membrane permeability which allows soluble enzymes such as
      creatine kinase to leak out of the cell and ions such as calcium to enter
      the cell
    explanation: >-
      States that the permeable dystrophic membrane lets creatine kinase leak out
      while calcium enters, the basis of the serum-CK readout node. Evidence
      source is OTHER and quote_role REVIEW_SYNTHESIS because this is a review of
      the permeability mechanism.
- name: Necrosis-Driven Muscle Inflammation
  description: >-
    Necrotic fibers release damage signals that recruit and activate macrophages
    into the muscle. In the dystrophic environment the pro-inflammatory (M1)
    macrophage phenotype worsens fiber injury, so the inflammatory infiltrate is
    not merely reactive but amplifies the damage and shapes the regenerative
    response that follows.

    snippet: >-
      A defect in the proliferative capacity of satellite cells, mononucleated
      precursors of mature muscle fibers, was found in clonal analyses of cells
      cultured from Duchenne muscular dystrophy (DMD) patients.
    explanation: >-
      Clonal analysis of DMD patient-derived cells shows a defect in satellite
      cell proliferative capacity, the human correlate of the exhaustion node.
      Evidence source is IN_VITRO because the defect was measured in cultured
      patient myoblasts.
  downstream:
  - target: Fibro-Adipose Replacement of Muscle
  - target: Progressive Muscle Weakness
- name: Fibro-Adipose Replacement of Muscle
  description: >-
    When regeneration can no longer replace lost fibers, resident
    platelet-derived growth factor receptor alpha (PDGFRalpha)-positive
    fibro-adipogenic progenitors proliferate and differentiate into
    collagen-producing fibroblasts and adipocytes, replacing contractile muscle
    with fibrous and fatty tissue. These interstitial mesenchymal progenitors -
    distinct from satellite cells - are the common origin of both the fibrosis
    and the fat. This node is the muscle-specific instance of the generic
    fibrotic mesenchymal-cell activation step.
  role: effector
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  cell_types:
  - preferred_term: Fibro-adipogenic progenitor (PDGFRalpha+ mesenchymal cell)
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: Collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  - preferred_term: Fat cell differentiation
    term:
      id: GO:0045444
      label: fat cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:20081842
    reference_title: "Mesenchymal progenitors distinct from satellite cells contribute to ectopic fat cell formation in skeletal muscle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PDGFRalpha(+) mesenchymal progenitors are the major contributor to ectopic
      fat cell formation in skeletal muscle
    explanation: >-
      Identifies interstitial PDGFRalpha+ mesenchymal progenitors, distinct from
      satellite cells, as the source of ectopic muscle fat, the adipose arm of
      this replacement node. Evidence source is MODEL_ORGANISM because the
      lineage work was done in mouse muscle.
  - reference: PMID:22045730
    reference_title: "Fibrosis and adipogenesis originate from a common mesenchymal progenitor in skeletal muscle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PDGFRα(+) cells accumulated in fibrotic areas of the diaphragm in the mdx
      mouse, a model of Duchenne muscular dystrophy.
    explanation: >-
      Shows the same PDGFRalpha+ progenitors accumulate in and produce the
      fibrosis of mdx diaphragm, the fibrotic arm of this node and the basis for
      its conformance to the generic fibrotic mesenchymal-activation step.
      Evidence source is MODEL_ORGANISM because it is the mdx mouse.
  downstream:
  - target: Progressive Muscle Weakness
- name: Progressive Muscle Weakness
  description: >-
    The organism-level end state. Cumulative fiber loss, failed regeneration, and
    replacement of contractile tissue by fibrosis and fat reduce functional
    muscle mass, so strength declines progressively. This is the shared clinical
    consequence toward which every conforming dystrophy converges, varying only
    in tempo and distribution by disorder.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26676145
    reference_title: "Absence of Dystrophin Disrupts Skeletal Muscle Signaling: Roles of Ca2+, Reactive Oxygen Species, and Nitric Oxide in the Development of Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      repeated bouts of muscle damage lead to atrophy and fibrosis, and
      eventually muscle degeneration
    explanation: >-
      States that repeated muscle damage culminates in atrophy, fibrosis, and
      muscle degeneration, the progressive-weakness end state. Evidence source is
      OTHER and quote_role REVIEW_SYNTHESIS because this is a review.
  - reference: PMID:23620650
    reference_title: The role of fibrosis in Duchenne muscular dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Severity was gauged by muscle strength and age at loss of ambulation.
    explanation: >-
      Ties disease severity directly to declining muscle strength and loss of
      ambulation - the progressive loss of strength this node names.
  - reference: PMID:23620650
    reference_title: "The role of fibrosis in Duchenne muscular dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Muscular recovery is limited due to the limited number and capacity of
      satellite cells.
    explanation: >-
      Links limited satellite-cell number and capacity to limited muscular
      recovery, the regeneration-failure contribution to progressive weakness.
      Evidence source is OTHER and quote_role REVIEW_SYNTHESIS because this is a
      review.
treatments:
- name: Corticosteroid Therapy (Prednisone or Deflazacort)
  description: >-
    Daily glucocorticoids - prednisone/prednisolone or deflazacort - are the
    long-standing standard-of-care pharmacotherapy that preserves muscle strength
    in Duchenne muscular dystrophy. Their precise mechanism is debated - proposed
    actions include anti-inflammatory effects, membrane stabilization, and effects
    on regeneration - and the trial evidence shows a clinical strength benefit
    rather than action on any single node. They are placed on the inflammatory
    node here because dampening the macrophage-driven inflammation that amplifies
    myofiber injury is the best-characterized of those actions; they do not
    restore the upstream mechanical link.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: deflazacort
      term:
        id: CHEBI:135720
        label: deflazacort
  target_mechanisms:
  - target: Necrosis-Driven Muscle Inflammation
    treatment_effect: INHIBITS
    description: >-
      Glucocorticoids are proposed to suppress the pro-inflammatory macrophage
      response that worsens fiber injury; this is the best-characterized of several
      debated actions, and the cited trial shows a strength benefit rather than a
      node-specific effect.
  evidence:
  - reference: PMID:27566742
    reference_title: "Efficacy and safety of deflazacort vs prednisone and placebo for Duchenne muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 12 weeks of treatment, PRED and both doses of DFZ improved muscle
      strength compared with placebo.
    explanation: >-
      A phase III randomized placebo-controlled trial shows prednisone and
      deflazacort both improve muscle strength in DMD, validating corticosteroid
      pharmacotherapy as disease-modifying. Evidence source is HUMAN_CLINICAL
      because it is a randomized controlled trial in patients.
- name: Cyclophilin D / mPTP Inhibition (Alisporivir / Debio-025, experimental)
  description: >-
    An experimental, not yet approved, strategy that targets the
    permeability-transition node directly. Debio-025 (alisporivir) is a
    non-immunosuppressive cyclophilin inhibitor that desensitizes the
    mitochondrial permeability transition pore, reducing calcium-overload-driven
    necrosis. In mdx and sarcoglycan-null mice it reduces dystrophic pathology at
    least as effectively as prednisone. It illustrates the module's drug-target
    pattern of acting on a specific internal node (here the mitochondrial pore)
    rather than the upstream genetic lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alisporivir
      term:
        id: CHEBI:149837
        label: alisporivir
  target_mechanisms:
  - target: Mitochondrial Permeability Transition
    treatment_effect: INHIBITS
    description: >-
      Cyclophilin inhibition desensitizes the mitochondrial permeability
      transition pore, blocking the calcium-driven route to necrotic fiber death.
  evidence:
  - reference: PMID:20637615
    reference_title: "Debio-025 is more effective than prednisone in reducing muscular pathology in mdx mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Debio-025, a cyclophilin inhibitor that desensitizes the mitochondrial
      permeability pore and subsequent cellular necrosis, was shown to improve
      pathology in three different mouse models of muscular dystrophy
    explanation: >-
      Establishes Debio-025 as a cyclophilin inhibitor that desensitizes the
      mitochondrial permeability pore and reduces necrosis across dystrophy
      models, the mechanistic basis for targeting the permeability-transition
      node. Evidence source is MODEL_ORGANISM because the data are from mouse
      dystrophy models.
- name: Micro-dystrophin Gene Replacement
  description: >-
    Gene-replacement therapy delivering a truncated but functional
    micro-dystrophin by AAV vector aims to restore the cytoskeleton-to-matrix
    mechanical link at the trigger node, so the sarcolemma regains mechanical
    protection and the whole downstream chain is pre-empted. Highly functional
    micro-dystrophins protect dystrophic muscle from contraction-induced damage
    in mice, and systemic AAV micro-dystrophin has entered clinical testing in
    DMD.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Dystrophin-Glycoprotein Complex Mechanical Link Loss
    treatment_effect: INHIBITS
    description: >-
      Restoring a functional (micro-)dystrophin re-establishes the cytoskeleton
      to extracellular-matrix mechanical link, acting at the trigger node to
      pre-empt the downstream chain.
  evidence:
  - reference: PMID:11875496
    reference_title: "Modular flexibility of dystrophin: implications for gene therapy of Duchenne muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Muscles expressing the smallest dystrophins are fully protected against
      damage caused by muscle activity and are not morphologically different from
      normal muscle.
    explanation: >-
      Shows micro-dystrophins fully protect dystrophic muscle from
      activity-induced damage in mdx mice, the rationale for acting at the
      trigger node. Evidence source is MODEL_ORGANISM because the protection was
      demonstrated in transgenic mdx mice.
  - reference: PMID:32539076
    reference_title: "Assessment of Systemic Delivery of rAAVrh74.MHCK7.micro-dystrophin in Children With Duchenne Muscular Dystrophy: A Nonrandomized Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Micro-dystrophin gene transfer shows promise for treating patients with
      Duchenne muscular dystrophy (DMD) using recombinant adeno-associated virus
      serotype rh74 (rAAVrh74) and codon-optimized human micro-dystrophin
    explanation: >-
      A phase 1/2a trial reports systemic AAV micro-dystrophin gene transfer in
      DMD patients, showing the trigger-node strategy has reached the clinic.
      Evidence source is HUMAN_CLINICAL because it is a trial in patients.

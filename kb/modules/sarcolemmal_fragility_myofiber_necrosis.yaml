- name: Exhausted Satellite-Cell Regeneration
  description: >-
    Each round of necrosis demands repair by muscle satellite cells. Repeated
    degeneration-regeneration cycles progressively deplete the satellite-cell
    pool and its proliferative capacity, so regeneration eventually fails to keep
    pace with fiber loss. This cell-autonomous decline in regenerative capacity
    is a major determinant of disease progression, and in humans satellite-cell /
    myoblast proliferative capacity is already defective.

    reference_title: "Genetic and pharmacologic inhibition of mitochondrial-dependent necrosis attenuates muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      deletion of the gene encoding cyclophilin D (Ppif) rendered mitochondria
      largely insensitive to the calcium overload-induced swelling associated
      with a defective sarcolemma, thus reducing myofiber necrosis in two
      distinct models of muscular dystrophy
    explanation: >-
      Cyclophilin-D deletion makes mitochondria insensitive to calcium-overload
      swelling and cuts necrosis in two dystrophy models, establishing the
      calcium-driven permeability transition as the route to fiber death.
      Evidence source is MODEL_ORGANISM because it is a mouse knockout study.
  - reference: DOI:10.1126/sciadv.adi2767
    reference_title: "ANT-dependent MPTP underlies necrotic myofiber death in muscular dystrophy"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study provides direct evidence that ANT1 and CypD are required MPTP

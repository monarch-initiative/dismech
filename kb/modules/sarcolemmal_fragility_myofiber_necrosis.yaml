- name: Creatine Kinase Leakage into Serum
  description: >-
    Because the necrotic fiber's membrane is breached and permeable, soluble
    cytoplasmic enzymes - most prominently creatine kinase - escape into the
    circulation, producing the markedly elevated serum creatine kinase that is
    the hallmark laboratory readout of active myofiber damage in these diseases.
    This is a systemic consequence of fiber necrosis rather than a step that
    drives further pathology.
  role: consequence
  biological_scale: ORGANISM
  evidence:

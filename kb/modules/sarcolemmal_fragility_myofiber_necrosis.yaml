      primary muscle defect.
    explanation: >-
      Calpastatin overexpression in mdx muscle reduces necrosis while leaving
      membrane damage unchanged, establishing calpain activation as a downstream
      killing step rather than the primary lesion. Evidence source is
      MODEL_ORGANISM because it is a transgenic mdx mouse.
  downstream:
  - target: Myofiber Necrosis
- name: Mitochondrial Permeability Transition
  description: >-
    Cytosolic calcium overload loads the mitochondria with calcium and opens the
    mitochondrial permeability transition pore (MPTP), whose components include
    the adenine nucleotide translocase and whose opening requires cyclophilin D.
    Pore opening collapses the mitochondrial membrane potential and precipitates
    necrotic fiber death. Genetic deletion of cyclophilin D (Ppif) or of ANT1
    (Slc25a4) protects dystrophic muscle, and this arm is shared by non-DGC
    myopathies (for example collagen VI myopathy) that converge on the pore.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:

  evidence:
  - reference: PMID:12736685
    reference_title: "Defective membrane repair in dysferlin-deficient muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      dysferlin-null mice maintain a functional dystrophin-glycoprotein complex
      but nevertheless develop a progressive muscular dystrophy
    explanation: >-
      Dysferlin-null mice show that muscular dystrophy can arise from a
      membrane-repair defect with an intact DGC, establishing this arm as
      independent of the mechanical-link trigger. Evidence source is
      MODEL_ORGANISM because the finding is from knockout mice.
  - reference: PMID:12736685
    reference_title: "Defective membrane repair in dysferlin-deficient muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      dysferlin-deficient muscle fibres are defective in Ca2+-dependent
      sarcolemma resealing
    explanation: >-
      Two-photon membrane-wounding assays show dysferlin-deficient fibers fail
      to reseal the sarcolemma, the molecular lesion of this repair-failure
      node. Evidence source is MODEL_ORGANISM because the assay was performed on
      mouse muscle fibers.
  downstream:
  - target: Myofiber Cytosolic Calcium Overload
- name: Sarcolemmal Mechanical Fragility
  description: >-
    With the cytoskeleton-to-matrix link gone, the sarcolemma loses the
    mechanical reinforcement the DGC normally provides and becomes abnormally
    vulnerable to the stresses developed during contraction. This is a change in
    the membrane's physical robustness that precedes any actual tear.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  cellular_components:
  - preferred_term: Sarcolemma
    term:

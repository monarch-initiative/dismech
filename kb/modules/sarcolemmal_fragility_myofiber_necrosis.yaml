name: Sarcolemmal Fragility and Myofiber Necrosis Module
description: >-
  The conserved skeletal-muscle degeneration pathway of the
  dystrophin-glycoprotein-complex (DGC) muscular dystrophies. Loss of the
  mechanical link that couples the myofiber cytoskeleton through the DGC to
  laminin-211 in the basal lamina makes the sarcolemma fragile; eccentric
  (contraction-induced) stress tears the unsupported membrane; extracellular
  calcium enters through those lesions and through stretch-activated and
  store-operated (TRPC/Orai1-STIM1) channels; cytosolic calcium overload
  activates calpains and drives mitochondrial calcium loading and permeability
  transition; the fiber undergoes necrosis (releasing creatine kinase into
  serum); necrosis recruits macrophages; repeated degeneration-regeneration
  cycles exhaust satellite-cell regeneration; and fibro-adipogenic progenitors
  replace muscle with fibrous and fatty tissue, producing progressive weakness.
  The key conformance target is Myofiber Cytosolic Calcium Overload: it is the
  rate-limiting convergence point where the mechanical-fragility arm and the
  membrane-repair-failure arm meet, calcium influx alone is sufficient to cause
  dystrophy independent of membrane tears (Millay 2009), and enhancing calcium
  clearance rescues it. Drug-target pattern (treatments block specific nodes):
  corticosteroids (prednisone, deflazacort) act on the inflammation node;
  experimental cyclophilin-D/mPTP inhibitors (alisporivir / Debio-025) act on
  the permeability-transition node; micro-dystrophin gene replacement acts at
  the trigger to restore the mechanical link. Complementary to, not overlapping
  with, skeletal_muscle_mechanotransduction (absent or untransduced load leading
  to atrophy; this module is the mirror image, excess load on a fragile membrane
  leading to necrosis), fibrotic_response (the fibro-adipose node conforms to it
  rather than re-deriving fibrogenesis), and
  cardiomyopathy_maladaptive_remodeling / mitochondrial_dysfunction (the cardiac
  and generic bioenergetic arms, out of scope here).
category: Module
creation_date: "2026-10-15T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease; do NOT create a "sarcolemmal
  fragility" or "myofiber necrosis" Disease entry from it. It is deliberately
  skeletal-muscle focused: the dystrophic cardiomyopathy arm belongs to
  cardiomyopathy_maladaptive_remodeling, and the generic bioenergetic arm to
  mitochondrial_dysfunction, so conforming disorders should route their cardiac
  nodes there rather than here. It is not an Xogenesis (pathological
  structure-formation) module. Scope and boundary decisions: (1) The membrane
  mechanical-fragility arm (Dystrophin-Glycoprotein Complex Mechanical Link
  Loss to Contraction-Induced Sarcolemmal Lesions) is solid for dystrophin,
  sarcoglycan, and alpha-dystroglycan hypoglycosylation; for laminin-alpha2
  (LAMA2 / MDC1A) documented membrane rupture is contested, so those entries
  conform at Sarcolemmal Mechanical Fragility (vulnerability to contraction
  stress, which fits fibre detachment) rather than at Contraction-Induced
  Sarcolemmal Lesions, which asserts frank tracer-proven membrane tears. The
  curated MDC1A conformer (Contraction-Induced Myofibre Detachment and Mechanical
  Injury) does exactly this; its own evidence records that detached fibres retain
  membrane integrity. (2) A membrane-repair
  arm (Sarcolemmal Membrane Repair Failure) is where dysferlinopathy (DYSF) and
  anoctaminopathy (ANO5) enter: the DGC is intact but tears fail to reseal, so
  these conform at the repair node and the calcium node, bypassing the
  mechanical-link trigger. (3) Calpain-3 deficiency (CAPN3, LGMDR1) is OUT of
  scope as a conformer: calpain-3 is a titin-bound sarcomeric protease whose
  loss (not calcium-driven overactivation of ubiquitous mu/m-calpain) causes
  disease. (4) Modulator genes such as TRPC, ORAI1/STIM1 and PPIF are not
  disease genes here; they are represented through the calcium node and the
  drug-target treatments, not as genes on pathophysiology nodes. Modules bind GO
  and CL terms only (plus UBERON locations / GO cellular components) and do not
  use chemical (CHEBI) or disease (MONDO) term bindings in nodes; drug chemistry
  is carried in the treatments block's therapeutic_agent per the treatment
  schema. Worked conformers: Duchenne and Becker muscular dystrophy
  (dystrophinopathy), autosomal recessive limb-girdle muscular dystrophy
  (sarcoglycanopathy / dysferlinopathy), dystroglycanopathy, and congenital
  merosin-deficient muscular dystrophy 1A (LAMA2).
pathophysiology:
- name: Dystrophin-Glycoprotein Complex Mechanical Link Loss
  description: >-
    The shared upstream lesion of the DGC muscular dystrophies. Dystrophin binds
    cytoskeletal F-actin at its N-terminus and the dystrophin-glycoprotein
    complex at its C-terminus; within that complex, glycosylated
    alpha-dystroglycan binds laminin-211 in the basal lamina. Loss of
    dystrophin, of a sarcoglycan, of alpha-dystroglycan O-mannosyl glycosylation,
    or of laminin-211 itself therefore breaks the continuous mechanical link
    between the contractile cytoskeleton and the extracellular matrix. The
    specific protein lost differs by disorder, but the loss of the cytoskeleton
    to matrix mechanical coupling is the conserved trigger.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  cellular_components:
  - preferred_term: Dystrophin-associated glycoprotein complex
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex
  molecular_functions:
  - preferred_term: alpha-Dystroglycan laminin binding
    term:
      id: GO:0043236
      label: laminin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:8349731
    reference_title: "A role for the dystrophin-glycoprotein complex as a transmembrane linker between laminin and actin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results support a role for the striated muscle dystrophin-glycoprotein
      complex in linking the actin-based cytoskeleton with the extracellular
      matrix.
    explanation: >-
      Biochemical binding and cosedimentation assays establish the DGC as the
      transmembrane link between cytoskeletal actin and extracellular laminin,
      the structure whose loss is this module's trigger. Evidence source is
      IN_VITRO because the interactions were measured in protein overlay and
      precipitation assays.
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      part of the dystrophin-glycoprotein complex (DGC) present in muscle
      sarcolemma, which acts as a linker between the cytoskeleton of the muscle
      fiber and the extracellular matrix, providing mechanical support to the
      sarcolemma during myofiber contraction
    explanation: >-
      A sarcoglycanopathy review states that the DGC links the muscle-fiber
      cytoskeleton to the extracellular matrix and gives the sarcolemma
      mechanical support during contraction, framing the trigger node. Evidence
      source is OTHER and quote_role REVIEW_SYNTHESIS because this is a review
      restating the established structural role.
  downstream:
  - target: Sarcolemmal Mechanical Fragility
- name: Sarcolemmal Membrane Repair Failure
  description: >-
    An alternative upstream arm, independent of the DGC mechanical link. In
    healthy fibers, dysferlin-dependent vesicle fusion reseals sarcolemmal tears
    in a calcium-dependent membrane-repair response. Where the repair machinery
    is defective (dysferlinopathy, anoctaminopathy), the DGC is structurally
    intact but tears that normally reseal instead persist, so even ordinary
    contraction-induced lesions remain open conduits for calcium entry. This arm
    enters the shared chain at the calcium node, bypassing the mechanical-link
    trigger.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:

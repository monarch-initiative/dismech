      label: sarcolemma
  evidence:
  - reference: PMID:8475120
    reference_title: "Dystrophin protects the sarcolemma from stresses developed during muscle contraction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings strongly support the proposition that the primary function
      of dystrophin is to provide mechanical reinforcement to the sarcolemma and
      thereby protect it from the membrane stresses developed during muscle
      contraction.
    explanation: >-
      The mdx mouse study concludes that dystrophin's primary role is mechanical
      reinforcement of the sarcolemma against contraction stress, so its loss
      produces the membrane fragility of this node. Evidence source is
      MODEL_ORGANISM because the work was done in mdx mouse muscle.
  downstream:
  - target: Contraction-Induced Sarcolemmal Lesions
- name: Contraction-Induced Sarcolemmal Lesions
  description: >-
    Eccentric (lengthening) contractions impose the largest mechanical stress on
    the membrane, and in the fragile dystrophic sarcolemma they produce frank
    membrane lesions. These breaches are demonstrable because low-molecular-weight
    tracers that are excluded from healthy fibers (Evans blue dye, procion
    orange) now enter the cytoplasm, and the amount of damage scales with the
    magnitude of the mechanical stress rather than with the number of
    contractions.
  role: effector
  biological_scale: CELLULAR
  cell_types:

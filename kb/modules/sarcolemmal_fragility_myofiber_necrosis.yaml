    explanation: >-
      In vivo deletion of ANT1 and cyclophilin D in a dystrophic mouse shows both
      are required MPTP components governing necrotic death, identifying the pore
      molecularly. Evidence source is MODEL_ORGANISM because it is a mouse
      genetic study.
  downstream:
  - target: Myofiber Necrosis
- name: Myofiber Necrosis
  description: >-
    Calpain activity and mitochondrial permeability transition together kill the
    muscle fiber by necrosis. Mitochondrial-dependent necrosis is a prominent and
    rate-contributing mechanism of fiber loss across muscular dystrophies, and
    the dying fiber is the source of the inflammation, regeneration demand, and
    enzyme leakage that follow.

      fibers
    explanation: >-
      Evans blue dye enters dystrophin-deficient fibers but not healthy ones,
      directly demonstrating sarcolemmal breaches. Evidence source is
      MODEL_ORGANISM because the tracer study was done in mice (the same paper
      notes dy/dy laminin-alpha2 mice accumulate little dye, the basis of the
      LAMA2 caveat in notes).
  downstream:
  - target: Myofiber Cytosolic Calcium Overload
- name: Myofiber Cytosolic Calcium Overload
  description: >-
    The rate-limiting central effector and the module's key conformance target.
    Calcium enters the fiber both through the membrane lesions and through
    stretch-activated and store-operated channels (TRPC and the Orai1-STIM1
    complex) whose activity is increased in dystrophic muscle, raising cytosolic
    calcium above its normal tightly regulated level. This is where the
    mechanical-fragility arm and the membrane-repair-failure arm converge, and it
    is sufficient on its own: artificially raising calcium influx reproduces
    muscular dystrophy independent of membrane fragility, while enhancing calcium
    clearance is protective. Every conforming disorder funnels through this node.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: Calcium ion import across the sarcolemma
    term:
      id: GO:0098703
      label: calcium ion import across plasma membrane
    modifier: INCREASED
  - preferred_term: Store-operated calcium entry
    term:
      id: GO:0002115
      label: store-operated calcium entry
    modifier: INCREASED
  evidence:
  - reference: PMID:19864620
    reference_title: "Calcium influx is sufficient to induce muscular dystrophy through a TRPC-dependent mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we demonstrate that calcium itself is sufficient to cause a dystrophic
      phenotype in skeletal muscle independent of membrane fragility.
    explanation: >-
      TRPC3 overexpression raises calcium influx and reproduces muscular
      dystrophy with no primary membrane defect, establishing cytosolic calcium
      overload as the sufficient central effector and justifying it as the key
      conformance target. Evidence source is MODEL_ORGANISM because it is a
      transgenic mouse experiment.
  - reference: PMID:19864620
    reference_title: "Calcium influx is sufficient to induce muscular dystrophy through a TRPC-dependent mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that calcium itself is sufficient to induce
      muscular dystrophy in vivo, and that TRPC channels are key disease
      initiators downstream of the unstable membrane that characterizes many
      types of muscular dystrophy.
    explanation: >-
      Identifies TRPC channels as a calcium-entry route downstream of the
      unstable membrane across many dystrophies, supporting the channel arm of
      this node. Evidence source is MODEL_ORGANISM because it is an in vivo mouse
      study.
  - reference: PMID:35939054
    reference_title: "Postdevelopmental knockout of Orai1 improves muscle pathology in a mouse model of Duchenne muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Enhanced store-operated Ca2+ entry (SOCE), a Ca2+ influx mechanism
      coordinated by STIM1 sensors of luminal Ca2+ within the sarcoplasmic
      reticulum (SR) and Ca2+-permeable Orai1 channels in the sarcolemma, is
      proposed to contribute to Ca2+-mediated muscle damage in DMD.
    explanation: >-
      Documents the store-operated Orai1-STIM1 calcium-entry route as a
      contributor to calcium-mediated damage in DMD, supporting the SOCE process
      on this node. Evidence source is MODEL_ORGANISM because the dystrophic
      model is the mdx mouse.
  - reference: PMID:26088163
    reference_title: "Genetic evidence in the mouse solidifies the calcium hypothesis of myofiber death in muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      models with artificially elevated calcium in skeletal muscle manifest
      fulminant dystrophic-like disease, whereas models with enhanced calcium
      clearance or inhibited calcium influx are resistant to myofiber death and
      MD
    explanation: >-
      A synthesis of mouse genetic data shows raising calcium causes dystrophy
      and clearing it prevents myofiber death, the bidirectional evidence that
      makes this the rate-limiting node. Evidence source is MODEL_ORGANISM
      (mouse genetics) and quote_role REVIEW_SYNTHESIS because the paper reviews
      that body of work.
  downstream:
  - target: Calpain Activation
  - target: Mitochondrial Permeability Transition
- name: Calpain Activation
  description: >-
    Sustained cytosolic calcium activates the ubiquitous calcium-dependent
    cysteine proteases (mu- and m-calpain), which degrade myofibrillar and
    membrane-cytoskeletal substrates. Inhibiting these calpains with a
    calpastatin transgene reduces necrosis without changing the upstream membrane
    damage, placing calpain activation downstream of the primary defect as a
    killing arm rather than a cause.

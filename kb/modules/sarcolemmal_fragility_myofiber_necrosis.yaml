    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The level of sarcolemmal damage is directly correlated with the magnitude
      of mechanical stress placed upon the membrane during contraction rather
      than the number of activations of the muscle.
    explanation: >-
      Shows that sarcolemmal damage in mdx muscle scales with contraction-induced
      mechanical stress, establishing eccentric contraction as the source of the
      lesions. Evidence source is MODEL_ORGANISM because it is an mdx mouse
      contraction protocol.

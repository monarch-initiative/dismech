name: NLRP3 Inflammasome Activation Module
description: >-
  A conserved pathophysiology module representing the two-signal NLRP3
  inflammasome pathway, the innate-immune sensing device that converts a
  heterogeneous set of danger signals into a single stereotyped inflammatory
  output. A priming signal (PAMP or DAMP engagement of a pattern-recognition
  receptor, or a cytokine receptor) drives NF-kappaB-dependent transcriptional
  upregulation of NLRP3 and pro-IL-1 beta, licensing but not activating the
  cell. A second, activating signal, delivered by potassium efflux, lysosomal
  rupture after phagocytosis of particulates, or mitochondrial damage with
  release of reactive oxygen species and mitochondrial DNA, then triggers NLRP3
  oligomerization with the adaptor ASC and proximity-induced autoproteolytic
  activation of caspase-1. Active caspase-1 cleaves pro-IL-1 beta and pro-IL-18
  into their bioactive forms and cleaves gasdermin D, whose N-terminal fragment
  forms plasma-membrane pores that both release the mature cytokines and execute
  pyroptotic cell death. The released IL-1 family cytokines and pyroptotic
  contents drive sterile inflammatory tissue injury. Conforming disorder nodes
  substitute the disorder-specific priming stimulus and activating danger signal
  (monosodium urate crystals in gout, inhaled silica or asbestos fibres in
  pneumoconiosis, cholesterol crystals in atherosclerosis, amyloid-beta
  aggregates in Alzheimer disease, or a constitutively active NLRP3 variant in
  the cryopyrin-associated periodic syndromes) while preserving the conserved
  priming, assembly, caspase-1, and IL-1 output chain.
category: Module
creation_date: "2026-08-19T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1
  Activation"). The module was created because the inflammasome was the one
  major innate-immune convergence point with no reusable module: 66 disorder
  entries mention the inflammasome in prose and about 20 carry a dedicated
  inflammasome pathophysiology node, but the only inflammasome node anywhere in
  kb/modules/ sat inside gout_urate_crystal_inflammation, where it is scoped to
  monosodium urate crystal arthropathy and is not reusable by a silicosis,
  atherosclerosis, or neuroinflammation entry.

  Relationship to gout_urate_crystal_inflammation. That module is deliberately
  left untouched by this one. Its "NLRP3 Inflammasome Activation" node remains
  the crystal-arthropathy-specific step, and no existing conformance to it has
  been retargeted here. Whether the gout module should instead declare
  conformance to this module, or keep its own node, is a governance question
  recorded as an OPEN discussion below rather than decided unilaterally.

  Scope. This module models the canonical, NLRP3-specific, two-signal pathway.
  It does not model the other inflammasome sensors (NLRP1, NLRC4, AIM2, pyrin),
  which have distinct ligands and priming requirements; an entry whose evidence
  identifies a non-NLRP3 sensor should curate its own node rather than conform
  here. The non-canonical caspase-4/5/11 route to cytosolic-LPS sensing feeds
  gasdermin D cleavage and, through the resulting potassium efflux, the
  canonical NLRP3 step; it is described in prose at the activating-signal node
  rather than given its own branch, because the evidence assembled here does not
  separate its contribution in any conforming disorder.

  Relationship to other modules. The mitochondrial arm of the activating signal
  overlaps mitochondrial_dysfunction (which owns impaired mitophagy and quality
  control) and disabled_macroautophagy; this module does not re-derive those,
  and a conforming entry whose claim is about clearance capacity rather than
  inflammasome output should attach there instead. cellular_senescence and
  inflammaging describe sterile inflammation downstream of senescence without
  owning an inflammasome node, so they are complementary rather than
  overlapping.

  Two conformance patterns are worth stating, because both came out of wiring
  the first conformers and neither is obvious from the chain alone.

  First, a conforming entry may legitimately split the activating signal across
  several atomic nodes that each conform to the single "Activating Danger
  Signal" node. That node is explicitly a union of non-exclusive routes, so
  Silicosis, which curates phagolysosomal rupture with cathepsin B release and
  reactive oxygen species generation as two separate nodes both feeding
  assembly, conforms twice rather than being forced to bundle two mechanistic
  claims into one node.

  Second, a gain-of-function NLRP3 variant enters this module at the central
  effector and legitimately bypasses the trigger and amplifier nodes. In the
  cryopyrin-associated periodic syndromes the mutant sensor assembles with a
  reduced or absent requirement for a second signal, so a conforming node there
  should attach at "NLRP3 Inflammasome Assembly and Caspase-1 Activation" and
  must not be wired to "Activating Danger Signal" — the whole point of the
  genetic lesion is that the second signal is not needed. Worked conformers:
  Silicosis (particulate route, conforming at the activating-signal and
  assembly nodes) and Familial_Cold_Autoinflammatory_Syndrome (constitutive
  variant route, conforming at the assembly and cytokine-output nodes).

  Modules bind GO and CL terms only; drug chemistry is carried by the
  treatments block per the treatment schema, and cytokine and crystal chemistry
  is described in prose.
pathophysiology:
- name: Priming Signal and NLRP3 Transcriptional Upregulation
  description: >-
    Signal 1. Engagement of a pattern-recognition receptor (Toll-like receptors,
    NOD2) by a pathogen-associated or damage-associated molecular pattern, or of
    a cytokine receptor by TNF or IL-1 beta, activates NF-kappaB and
    transcriptionally upregulates NLRP3 itself along with pro-IL-1 beta. NLRP3
    expression is the rate-limiting checkpoint: resting cells express too little
    NLRP3 to assemble an inflammasome, so priming licenses the cell to respond
    to a subsequent danger signal without itself activating the complex. Priming
    additionally imposes post-translational modifications that hold NLRP3 in an
    inactive but signal-competent state. Conforming disorder nodes substitute
    the disorder-specific priming stimulus (microbial ligand, sterile DAMP, or
    an ambient inflammatory cytokine milieu).
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: NF-kappaB-dependent priming of inflammasome components
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  - preferred_term: Cellular response to lipopolysaccharide
    term:
      id: GO:0071222
      label: cellular response to lipopolysaccharide
    modifier: INCREASED
  evidence:
  - reference: PMID:19570822
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cell priming through multiple signaling receptors induces NLRP3
      expression, which we identified to be a critical checkpoint for NLRP3
      activation
    explanation: >-
      Identifies priming-induced NLRP3 expression as the critical checkpoint,
      which is what makes this a distinct upstream node rather than part of
      assembly. Evidence source is IN_VITRO because the genetic dissection used
      cultured mouse macrophages and human monocytes.
  - reference: PMID:19570822
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Signals provided by NF-kappaB activators are necessary but not sufficient
      for NLRP3 activation, and a second stimulus such as ATP or
      crystal-induced damage is required for NLRP3 activation.
    explanation: >-
      Establishes the two-signal architecture this module is built on: the
      priming node is necessary but not sufficient, so it is typed as the
      trigger and the activating signal is modelled as a separate downstream
      node. Evidence source is IN_VITRO for the same reason.
  - reference: PMID:31036962
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NLRP3 (NOD-, LRR- and pyrin domain-containing protein 3) is an
      intracellular sensor that detects a broad range of microbial motifs,
      endogenous danger signals and environmental irritants, resulting in the
      formation and activation of the NLRP3 inflammasome.
    explanation: >-
      Establishes the breadth of stimuli that converge on NLRP3, which is the
      property that makes this a reusable module across infectious, crystal,
      metabolic, and neurodegenerative disorders. Evidence source is OTHER
      because this is a narrative review.
  downstream:
  - target: Activating Danger Signal
- name: Activating Danger Signal
  description: >-
    Signal 2. A primed cell is converted to an assembling one by a cellular
    stress that NLRP3 senses indirectly. Three routes are established and are
    not mutually exclusive: efflux of potassium from the cytosol, driven by
    pore-forming toxins, ATP acting through P2X7, or particulate stimuli;
    lysosomal destabilization and rupture following phagocytosis of crystalline
    or fibrous material; and mitochondrial damage with release of reactive
    oxygen species and oxidized mitochondrial DNA, which accumulates when
    mitophagy is blocked. Cytosolic LPS sensed by caspase-4/5 additionally
    reaches this node indirectly, because the resulting gasdermin D pores
    themselves cause potassium efflux. Conforming disorder nodes substitute the
    disorder-specific danger signal; which route dominates is disease-specific
    and, as recorded in the open discussion below, there is no consensus
    unifying model.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Potassium efflux from the cytosol
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: INCREASED
  - preferred_term: Mitochondrial reactive oxygen species stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  cellular_components:
  - preferred_term: Lysosome
    term:
      id: GO:0005764
      label: lysosome
  - preferred_term: Mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:23809161
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, reduction of the intracellular K⁺ concentration was sufficient
      to activate NLRP3, whereas an increase in intracellular Na⁺ modulated but
      was not strictly required for inflammasome activation.
    explanation: >-
      Establishes falling cytosolic potassium as sufficient for NLRP3
      activation, the best-supported of the three activating routes at this
      node. Evidence source is IN_VITRO because the ion-substitution
      experiments were done in cultured macrophages.
  - reference: PMID:23809161
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We show that NLRP3 activators including bacterial pore-forming toxins,
      nigericin, ATP, and particulate matter caused mitochondrial perturbation
      or the opening of a large membrane pore, but this was not required for
      NLRP3 activation.
    explanation: >-
      Recorded as PARTIAL because it supports the node while contradicting part
      of it: these authors found mitochondrial perturbation dispensable, which
      is why the mitochondrial route is curated as one of several
      non-exclusive routes rather than as the mechanism, and why the conflict
      is carried as an open discussion.
  - reference: PMID:18604214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NALP3 activation required phagocytosis of crystals, and this uptake
      subsequently led to lysosomal damage and rupture.
    explanation: >-
      Supports the lysosomal-rupture route, the one that conforming
      particulate-exposure disorders (silicosis, asbestosis, gout,
      atherosclerosis) substitute into this node. Evidence source is IN_VITRO
      because the phagocytosis and cathepsin experiments used cultured
      macrophages.
  - reference: PMID:21124315
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that mitophagy/autophagy blockade leads to the accumulation
      of damaged, ROS-generating mitochondria, and this in turn activates the
      NLRP3 inflammasome.
    explanation: >-
      Supports the mitochondrial route and is the specific link that lets an
      entry already conforming to mitochondrial_dysfunction or
      disabled_macroautophagy connect a clearance defect to inflammasome
      output. Evidence source is IN_VITRO because the blockade experiments used
      cultured macrophages.
  downstream:
  - target: NLRP3 Inflammasome Assembly and Caspase-1 Activation
- name: NLRP3 Inflammasome Assembly and Caspase-1 Activation
  description: >-
    The rate-limiting, disorder-agnostic step and the key conformance target of
    this module. Activated NLRP3 oligomerizes and recruits the adaptor ASC
    through pyrin-domain interactions, nucleating ASC filaments that coalesce
    into a single macromolecular speck. Assembled ASC recruits pro-caspase-1
    through CARD-CARD interactions, and the resulting proximity drives
    autoproteolytic cleavage and activation of caspase-1. Every route through
    the module funnels through this complex: whatever the priming stimulus and
    whatever the danger signal, an entry conforms here if the evidence places an
    assembled, caspase-1-activating NLRP3 complex in the causal chain. An entry
    that evidences only elevated IL-1 beta, or only NLRP3 transcript
    upregulation, does not satisfy this node.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  - preferred_term: Inflammasome-mediated signaling
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
    modifier: INCREASED
  cellular_components:
  - preferred_term: NLRP3 inflammasome complex
    term:
      id: GO:0072559
      label: NLRP3 inflammasome complex
  evidence:
  - reference: PMID:12191486
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report the identification of a caspase-activating complex that we
      call the inflammasome.
    explanation: >-
      The founding identification of the inflammasome as a caspase-activating
      complex, which is the claim this node makes. Evidence source is IN_VITRO
      because the complex was defined in a cell-free system and in THP-1 cells.
  - reference: PMID:12191486
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, expression of a dominant-negative form of Pycard in
      differentiated THP-1 cells blocks proIL-1beta maturation and activation
      of inflammatory caspases induced by LPS in vivo.
    explanation: >-
      Shows the ASC/Pycard adaptor is required for caspase activation and
      pro-IL-1 beta maturation, supporting assembly as the necessary step
      upstream of cytokine output rather than a parallel event.
  - reference: PMID:30026524
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once activated, NLRP3 nucleates the assembly of an inflammasome, leading
      to caspase 1-mediated proteolytic activation of the interleukin-1β
      (IL-1β) family of cytokines, and induces an inflammatory, pyroptotic cell
      death.
    explanation: >-
      States the assembly-to-caspase-1-to-cytokine-and-pyroptosis sequence that
      defines this node and the edge into the effector node. Evidence source is
      OTHER because this is a narrative review.
  downstream:
  - target: IL-1 Family Cytokine Maturation and Gasdermin D-Mediated Pyroptosis
- name: IL-1 Family Cytokine Maturation and Gasdermin D-Mediated Pyroptosis
  description: >-
    Active caspase-1 has two substrate classes and therefore two coupled
    outputs. It cleaves pro-IL-1 beta and pro-IL-18 into their bioactive
    secreted forms, and it cleaves gasdermin D between its N-terminal
    pore-forming and C-terminal autoinhibitory domains. The liberated
    gasdermin-N fragment oligomerizes in the plasma membrane to form pores,
    which both provide the unconventional secretion route for the mature
    cytokines and, if unrepaired, lyse the cell as pyroptosis. The two outputs
    are separable: cytokine processing can be intact while release and cell
    death are lost in gasdermin-D-deficient cells, so a conforming entry may
    evidence the cytokine arm without evidencing pyroptosis.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  - preferred_term: Interleukin-18 production
    term:
      id: GO:0032621
      label: interleukin-18 production
    modifier: INCREASED
  - preferred_term: Gasdermin D-mediated pyroptotic cell death
    term:
      id: GO:0141201
      label: pyroptotic cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:26375003
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Caspase-1 and caspase-4/5/11 specifically cleaved the linker between the
      amino-terminal gasdermin-N and carboxy-terminal gasdermin-C domains in
      GSDMD, which was required and sufficient for pyroptosis.
    explanation: >-
      Establishes gasdermin D cleavage by caspase-1 as required and sufficient
      for pyroptosis, the mechanistic basis of the cell-death arm of this node.
      Evidence source is IN_VITRO because the CRISPR screens and reconstitution
      were done in bone-marrow macrophages and cell lines.
  - reference: PMID:26375003
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interleukin-1β release was also diminished in Gsdmd(-/-) cells, despite
      intact processing by caspase-1.
    explanation: >-
      Directly supports the separability of the two arms curated in this node's
      description: gasdermin D is required for release but not for caspase-1
      processing of the cytokine.
  - reference: PMID:31036962
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Assembly of the NLRP3 inflammasome leads to caspase 1-dependent release
      of the pro-inflammatory cytokines IL-1β and IL-18, as well as to
      gasdermin D-mediated pyroptotic cell death.
    explanation: >-
      Review synthesis stating both outputs of this node and their dependence
      on the upstream assembly step. Evidence source is OTHER because this is a
      narrative review.
  downstream:
  - target: Sterile Inflammatory Tissue Injury
- name: Sterile Inflammatory Tissue Injury
  description: >-
    Released IL-1 beta and IL-18, together with the intracellular contents
    spilled by pyroptotic cells, drive a self-amplifying inflammatory response:
    IL-1 beta acts on IL-1 receptors to upregulate adhesion molecules and
    chemokines and recruit neutrophils, and because IL-1 beta is itself a
    priming stimulus it feeds back onto the trigger node in neighbouring cells.
    Sustained or repeated cycles produce the tissue injury, fibrosis, and
    clinical inflammation attributed to inflammasome-driven disease. This is the
    node conforming disorders specialize to their affected tissue, and it is
    where the therapeutic argument is anchored: blocking IL-1 beta reduces
    clinical events in humans.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Pyroptotic inflammatory response
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:30026524
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Danger signals are a hallmark of many common inflammatory diseases, and
      these stimuli can function to activate the cytosolic innate immune
      signalling receptor NLRP3 (NOD-, LRR- and pyrin domain-containing 3).
    explanation: >-
      Establishes that this chain is a recurrent feature of common inflammatory
      disease rather than a single-disorder mechanism, which is the
      justification for modelling it as a module. Evidence source is OTHER
      because this is a review.
  - reference: PMID:30026524
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pharmacological inhibition of NLRP3 activation results in potent
      therapeutic effects in a wide variety of rodent models of inflammatory
      diseases, effects that are mirrored by genetic ablation of NLRP3.
    explanation: >-
      Supports the causal direction of the whole chain: removing NLRP3
      pharmacologically or genetically removes the downstream tissue injury.
      Evidence source is MODEL_ORGANISM because the summarized experiments are
      rodent disease models.
  - reference: PMID:28845751
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiinflammatory therapy targeting the interleukin-1β innate immunity
      pathway with canakinumab at a dose of 150 mg every 3 months led to a
      significantly lower rate of recurrent cardiovascular events than placebo,
      independent of lipid-level lowering.
    explanation: >-
      The strongest human evidence that the IL-1 beta output of this pathway
      causes tissue-level disease: a randomized trial in 10,061 patients in
      which neutralizing IL-1 beta reduced cardiovascular events without
      changing lipids.
treatments:
- name: IL-1 beta Neutralizing Antibody (Canakinumab)
  description: >-
    A monoclonal antibody that binds IL-1 beta and prevents it from engaging the
    IL-1 receptor, neutralizing the principal secreted output of the pathway
    without touching the sensor. This is the output-blockade arm of the
    inflammasome drug-target pattern: it is agnostic to which danger signal
    activated NLRP3, which is why the same agent is used in the
    cryopyrin-associated periodic syndromes, gout, and atherosclerotic disease.
    Its limitation is the mirror image of its breadth: blocking IL-1 beta also
    removes a defence cytokine, and the CANTOS trial recorded more fatal
    infections on canakinumab than on placebo. Conforming disorders should
    curate their own indication and outcome evidence rather than inheriting a
    recommendation from this module.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: canakinumab
      term:
        id: NCIT:C80971
        label: Canakinumab
  target_mechanisms:
  - target: IL-1 Family Cytokine Maturation and Gasdermin D-Mediated Pyroptosis
    treatment_effect: INHIBITS
    description: >-
      Canakinumab neutralizes the mature IL-1 beta produced at this node,
      blocking its receptor engagement and preventing the downstream sterile
      inflammatory injury. It acts on the pathway output, leaving assembly and
      caspase-1 activation intact.
  evidence:
  - reference: PMID:28845751
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted a randomized, double-blind trial of canakinumab, a
      therapeutic monoclonal antibody targeting interleukin-1β, involving
      10,061 patients with previous myocardial infarction and a
      high-sensitivity C-reactive protein level of 2 mg or more per liter.
    explanation: >-
      Identifies canakinumab as an IL-1 beta-targeting monoclonal antibody and
      establishes the randomized human trial that tested the output-blockade
      arm of this pattern.
  - reference: PMID:28845751
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Canakinumab was associated with a higher incidence of fatal infection
      than was placebo.
    explanation: >-
      Recorded as PARTIAL because it qualifies rather than supports the
      treatment claim: neutralizing IL-1 beta also removes host defence, which
      is the caveat conforming disorders must carry with this pattern.
- name: Direct NLRP3 Inhibitor (MCC950)
  description: >-
    A small-molecule inhibitor that binds NLRP3 itself and blocks inflammasome
    assembly, the sensor-blockade arm of the drug-target pattern. Unlike IL-1
    beta neutralization it is selective for the NLRP3 sensor and spares the
    NLRP1, NLRC4, and AIM2 inflammasomes, so it removes only this pathway's
    output. It is curated here as a mechanistic tool and design pattern, not as
    an available therapy: MCC950 is investigational, and a phase II trial in
    rheumatoid arthritis was suspended for hepatic toxicity. A conforming
    disorder should not curate MCC950 as a treatment on the strength of this
    module.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: MCC950
      term:
        id: CHEBI:231684
        label: MCC950
  target_mechanisms:
  - target: NLRP3 Inflammasome Assembly and Caspase-1 Activation
    treatment_effect: INHIBITS
    description: >-
      MCC950 binds NLRP3 and blocks assembly of the inflammasome complex,
      preventing caspase-1 activation and therefore both the cytokine and the
      pyroptotic output, while leaving the other inflammasome sensors
      functional.
  evidence:
  - reference: PMID:25686105
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We describe the development of MCC950, a potent, selective,
      small-molecule inhibitor of NLRP3. MCC950 blocked canonical and
      noncanonical NLRP3 activation at nanomolar concentrations. MCC950
      specifically inhibited activation of NLRP3 but not the AIM2, NLRC4 or
      NLRP1 inflammasomes.
    explanation: >-
      Establishes both the target and the selectivity that make this the
      sensor-blockade counterpart to IL-1 beta neutralization. Evidence source
      is IN_VITRO because the potency and selectivity were established in
      cultured macrophages.
  - reference: PMID:25686105
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MCC950 reduced interleukin-1β (IL-1β) production in vivo and attenuated
      the severity of experimental autoimmune encephalomyelitis (EAE), a
      disease model of multiple sclerosis.
    explanation: >-
      Shows that blocking the sensor reduces the pathway output and the
      resulting tissue disease in vivo, supporting the INHIBITS edge onto the
      assembly node. Evidence source is MODEL_ORGANISM because EAE and the CAPS
      rescue are mouse models.
discussions:
- discussion_id: gap_nlrp3_no_consensus_activating_signal
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Activating Danger Signal
  prompt: >-
    Which of the proposed activating signals for NLRP3 (potassium efflux,
    lysosomal rupture, mitochondrial reactive oxygen species and mitochondrial
    DNA release) is the proximal event NLRP3 actually senses, and are they a
    single convergent pathway or genuinely independent routes?
  rationale: >-
    The three routes curated at the activating-signal node are supported by
    strong primary evidence individually but conflict with one another when
    tested as unifying models. Munoz-Planillo et al. (PMID:23809161) found that
    every NLRP3 agonist they tested induced potassium efflux, that lowering
    cytosolic potassium alone was sufficient, and explicitly that mitochondrial
    perturbation and reactive oxygen species generation were not required. Zhou
    et al. (PMID:21124315) reached the opposite emphasis, showing that blocking
    mitophagy accumulates ROS-generating mitochondria and that this activates
    the inflammasome. Hornung et al. (PMID:18604214) place the proximal event at
    the lysosome for particulate stimuli. Much of the supporting evidence rests
    on pharmacological inhibitors with known off-target effects rather than
    genetic ablation, so the discrepancy may be methodological. Until this is
    resolved, a conforming disorder entry should curate the specific activating
    route its own evidence establishes and must not assert one of these as the
    general mechanism of NLRP3 activation.
  proposed_experiments:
  - experiment_id: exp_nlrp3_genetic_dissection_of_activating_routes
    name: Genetic rather than pharmacological dissection of the three activating routes
    description: >-
      In a single macrophage background, use genetic ablation rather than
      small-molecule inhibitors to remove each proposed route independently
      (the potassium channel required for efflux, the cathepsins and lysosomal
      permeabilization machinery, and the mitochondrial permeability transition
      and mtDNA-synthesis arm), then challenge each line with a panel of
      chemically unrelated NLRP3 agonists spanning pore-forming toxin,
      particulate, and metabolic classes. Read out ASC speck formation and
      caspase-1 cleavage, not IL-1 beta release alone, so that priming effects
      are not scored as activation effects. A route that is dispensable for
      every agonist class is not the proximal sensed event; a route required
      only for particulate agonists is disease-context-specific and should be
      curated at the conforming entry rather than in this module.

      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This unregulated uptake can lead to iron accumulation in vulnerable tissues such as the liver and the heart."
      explanation: Links unregulated NTBI uptake to iron accumulation in parenchymal tissues.
- name: Parenchymal Iron Deposition and Oxidative Injury
  description: >-
    Parenchymal cells of the liver, heart and endocrine organs take up NTBI and
    accumulate iron. The excess iron participates in free-radical-generating
    reactions, producing oxidative stress that drives cell injury and death,
    fibrosis and progressive organ failure — hepatic cirrhosis, cardiomyopathy,
    diabetes and endocrine deficiency. Ferroptotic cell death is discussed in the
    literature as a contributing mode but is not bound here (see notes). A
    conforming disorder's fibrotic arm conforms to fibrotic_response and its
    cardiac remodeling to cardiomyopathy_maladaptive_remodeling rather than
    re-deriving them here.

      snippet: "In gain-of-function SLC40A1 mutations, ferroportin is resistant to hepcidin activity. This leads to unregulated iron export from enterocytes and macrophages and thus, systemic iron overload."
      explanation: States the branch-C edge directly, from hepcidin-resistant ferroportin to unregulated export from enterocytes and macrophages.
- name: Unrestrained Ferroportin Iron Export
  description: >-
    The key conformance target: the disorder-agnostic, rate-limiting
    convergence step. Ferroportin, the sole cellular iron exporter and the
    hepcidin receptor, remains on the surface of duodenal enterocytes and
    recycling macrophages and effluxes iron into plasma unchecked. Every branch
    reaches this node — branches A and B because too little hepcidin fails to
    internalize the exporter, branch C because the exporter cannot respond to
    hepcidin. The mechanism is that hepcidin normally binds ferroportin, driving
    its internalization and degradation and so decreasing iron export; losing
    that restraint leaves export unopposed.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: iron ion export across plasma membrane
    term:
      id: GO:1903988
      label: iron ion export across plasma membrane
    modifier: INCREASED
  - preferred_term: positive regulation of iron ion transport
    term:
      id: GO:0034758
      label: positive regulation of iron ion transport
    modifier: INCREASED
  evidence:
  - reference: PMID:15514116
    reference_title: "Hepcidin regulates cellular iron efflux by binding to ferroportin and inducing its internalization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After binding, ferroportin was internalized and degraded, leading to decreased export of cellular iron."
    explanation: >-
      The defining experiment: hepcidin binding internalizes and degrades
      ferroportin and decreases export, so loss of hepcidin restraint (or a
      resistant exporter) leaves export elevated — this node.
  downstream:
  - target: Transferrin Saturation and Non-Transferrin-Bound Iron Formation
    description: Sustained export expands the plasma iron pool until transferrin saturates and NTBI appears.
    causal_link_type: DIRECT
    evidence:

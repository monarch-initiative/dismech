    reference_title: "Comparing the types of haemochromatosis- from genetics to clinics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gain-of-function variants in the SLC40A1 gene affect the hepcidin binding site on ferroportin."
    explanation: >-
      Locates the branch-C variants at the hepcidin binding site, which is why
      hepcidin no longer triggers internalization of the exporter.
  - reference: PMID:29620054
    reference_title: "Haemochromatosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in SLC40A1 (also known as FPN1; encoding ferroportin) that prevent hepcidin-ferroportin binding also cause haemochromatosis."
    explanation: >-
      Confirms that the hepcidin-resistance class of SLC40A1 variants causes
      hemochromatosis, the branch-C route into this module.
  downstream:
  - target: Unrestrained Ferroportin Iron Export
    description: A hepcidin-resistant exporter continues to efflux iron regardless of hepcidin level, reaching the same export node without a deficiency step.
    causal_link_type: DIRECT

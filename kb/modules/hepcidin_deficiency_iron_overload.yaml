name: Hepcidin Deficiency Iron Overload Module
description: >-
  The conserved systemic iron-overload pathway shared by hereditary
  hemochromatosis and the iron-loading anemias. Three alternative triggers
  funnel into one rate-limiting step: (A) loss of hepatocyte iron sensing
  through the HFE / TFR2 / hemojuvelin / BMP6 BMP-SMAD pathway lowers hepcidin
  transcription; (B) expanded but ineffective erythropoiesis releases
  erythroferrone, which sequesters BMP ligands and suppresses hepcidin; and
  (C) SLC40A1 gain-of-function variants make ferroportin resistant to hepcidin,
  so the exporter is never internalized even when hepcidin is normal. Branches
  A and B converge on a shared Hepcidin Deficiency node; branch C bypasses it.
  All three reach the key conformance target, Unrestrained Ferroportin Iron
  Export, the disorder-agnostic rate-limiting step where enterocyte and
  macrophage ferroportin exports iron into plasma unchecked. Downstream,
  transferrin saturates and toxic non-transferrin-bound iron (NTBI) appears;
  parenchymal cells of the liver, heart and endocrine organs take up NTBI
  through transferrin-receptor-independent routes and accumulate iron,
  generating oxidative injury, fibrosis and organ failure. A conforming
  disorder substitutes its own driver gene at the trigger (HFE, HJV, BMP6,
  TFR2, HAMP for branch A; a globin or erythropoiesis gene such as HBB upstream
  of branch B; SLC40A1 for branch C) but routes into the same export node.
  Complementary to, not overlapping with, fibrotic_response (the organ-injury
  node's fibrosis conforms to it rather than re-deriving fibrogenesis) and
  cardiomyopathy_maladaptive_remodeling / mitochondrial_dysfunction (the cardiac
  remodeling and generic bioenergetic arms of iron toxicity belong there). It is
  not an Xogenesis (pathological-structure-formation) module.
category: Module
module_categories:
- METABOLISM
creation_date: "2026-10-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease; do NOT create a "hepcidin
  deficiency" or "iron overload" Disease entry from it. Scope and boundary
  decisions. (1) The module covers iron overload driven by iron hyperabsorption
  and unrestrained release — the hepcidin-ferroportin axis. Transfusional
  siderosis feeds the same two downstream nodes (NTBI formation and parenchymal
  loading) but bypasses the trigger and export nodes, so a transfused patient's
  overload conforms only from the NTBI node downward, not at the trigger. (2)
  Branch C (SLC40A1 gain of function) is included and deliberately bypasses the
  Hepcidin Deficiency node: hepcidin is not deficient there, the ferroportin
  receptor is resistant, so the branch points straight at Unrestrained
  Ferroportin Iron Export. Loss-of-function SLC40A1 (classic ferroportin disease,
  macrophage iron retention with normal-to-low transferrin saturation) is the
  opposite lesion and does NOT conform. (3) Branches A and B are drawn as
  independent triggers, not parent and child: the erythroferrone branch may
  suppress hepcidin without acting through the canonical BMP-SMAD pathway that
  branch A disrupts, so neither is modeled as upstream of the other. (4) HAMP
  (hepcidin) loss is the hormone itself; its loss is represented at the Hepcidin
  Deficiency node rather than as a separate trigger. (5) TMPRSS6 (matriptase-2)
  is an opposing-direction gene — its loss raises hepcidin and causes iron
  deficiency — so it is out of scope. (6) FTH1 iron-responsive-element variants,
  aceruloplasminemia, DMT1 disease and atransferrinemia reach tissue iron
  loading by routes that are not hepcidin-ferroportin-mediated and should not be
  forced to conform. (7) Ferroptosis is named in prose only; the module binds no
  ferroptosis term because no primary source tying ferroptosis specifically to
  hepcidin-deficiency overload was cached at curation time. Modules bind GO and
  CL terms only (plus UBERON locations / GO cellular components) and carry no
  CHEBI or MONDO bindings on nodes; iron chemistry is described in prose. Worked
  conformers to wire: Hemochromatosis (branch A, and branch C at its SLC40A1
  node), Beta_Thalassemia and Congenital_Dyserythropoietic_Anemia (branch B).
pathophysiology:
- name: Hepatocyte Iron-Sensing BMP-SMAD Signaling Loss
  description: >-
    Branch A trigger. Hepatocytes sense body iron through a BMP6-hemojuvelin
    co-receptor complex that signals via SMAD1/5/8 to induce hepcidin
    transcription; HFE and TFR2 feed into the same sensing apparatus. Loss of
    hemojuvelin, BMP6, HFE or TFR2 blunts this BMP-SMAD signal, so hepcidin is
    not induced in proportion to iron stores. The specific sensing protein lost
    differs by disorder, but the failure of BMP-SMAD-driven hepcidin induction
    is the conserved branch-A lesion.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  - preferred_term: negative regulation of iron ion transport
    term:
      id: GO:0034757
      label: negative regulation of iron ion transport
    modifier: DECREASED
  evidence:
  - reference: PMID:16604073
    reference_title: "Bone morphogenetic protein signaling by hemojuvelin regulates hepcidin expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report that hemojuvelin is a BMP coreceptor and that hemojuvelin mutants associated with hemochromatosis have impaired BMP signaling ability."
    explanation: >-
      Establishes hemojuvelin as a BMP co-receptor and shows hemochromatosis
      mutants have impaired BMP signaling, the branch-A sensing lesion. Source
      is IN_VITRO because signaling was measured in a hepatocyte cell system.
  - reference: PMID:26582087
    reference_title: "Heterozygous Mutations in BMP6 Pro-peptide Lead to Inappropriate Hepcidin Synthesis and Moderate Iron Overload in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "resulted in defective secretion of BMP6; reduced signaling via SMAD1, SMAD5, and SMAD8; and loss of hepcidin production."
    explanation: >-
      Cell-line functional assays show BMP6 propeptide mutations impair BMP6
      secretion, SMAD1/5/8 signaling and hepcidin production, tracing the branch-A
      edge from a sensing-gene lesion to failed hepcidin induction.
  downstream:
  - target: Hepcidin Deficiency
    description: Failed BMP-SMAD induction leaves hepcidin transcription inappropriately low for body iron.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16604073
      reference_title: "Bone morphogenetic protein signaling by hemojuvelin regulates hepcidin expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "hemojuvelin dysfunction decreases BMP signaling, thereby lowering hepcidin expression"
      explanation: Directly links the decreased BMP signal to lowered hepcidin expression.
- name: Erythroferrone-Mediated Hepcidin Suppression
  description: >-
    Branch B trigger. In the iron-loading anemias, expanded but ineffective
    erythropoiesis drives erythroblasts to release erythroferrone (ERFE) in
    response to erythropoietin; ERFE sequesters BMP ligands and suppresses
    hepcidin transcription. This arm needs an upstream erythropoietic-expansion
    driver (a globin or dyserythropoiesis gene carried by the conforming
    disease), which is not itself a module node.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: negative regulation of iron ion transport
    term:
      id: GO:0034757
      label: negative regulation of iron ion transport
    modifier: DECREASED
  evidence:
  - reference: PMID:24880340
    reference_title: "Identification of erythroferrone as an erythroid regulator of iron metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ERFE is produced by erythroblasts in response to erythropoietin."
    explanation: >-
      Identifies the erythroblast as the ERFE source and erythropoietin as its
      trigger. Source is MODEL_ORGANISM because ERFE was identified and tested in
      mice.
  - reference: PMID:31949017
    reference_title: "Iron metabolism and iron disorders revisited in the hepcidin era."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "releases erythroferrone, which sequesters BMP receptor ligands, thereby inhibiting hepcidin"
    explanation: >-
      A review states the branch-B mechanism: erythroferrone sequesters BMP
      ligands and inhibits hepcidin. Source is OTHER with quote_role
      REVIEW_SYNTHESIS because it synthesizes established work.
  downstream:
  - target: Hepcidin Deficiency
    description: ERFE-driven suppression lowers hepcidin despite rising iron stores.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24880340
      reference_title: "Identification of erythroferrone as an erythroid regulator of iron metabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ERFE expression is greatly increased in Hbb(th3/+) mice with thalassemia intermedia, where it contributes to the suppression of hepcidin and the systemic iron overload characteristic of this disease."
      explanation: >-
        In thalassemic mice ERFE contributes to hepcidin suppression and the
        systemic iron overload, linking branch B to the shared deficiency node.
- name: Hepcidin Deficiency
  description: >-
    Shared hub of branches A and B. Hepcidin, the liver peptide hormone that
    restrains iron entry into plasma, is present at a level inappropriately low
    for body iron stores. Decreased hepcidin is the established cause of tissue
    iron overload. Branch C does not pass through this node because there
    hepcidin is adequate and ferroportin is resistant instead.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: negative regulation of iron ion transport
    term:
      id: GO:0034757
      label: negative regulation of iron ion transport
    modifier: DECREASED
  evidence:
  - reference: PMID:15514116
    reference_title: "Hepcidin regulates cellular iron efflux by binding to ferroportin and inducing its internalization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Decreased hepcidin leads to tissue iron overload"
    explanation: >-
      States the governing fact that low hepcidin causes tissue iron overload.
      evidence_source is HUMAN_CLINICAL because the quoted sentence describes the
      human iron-overload disorders, not the paper's own tissue-culture result;
      quote_role is BACKGROUND because this is the abstract's framing sentence,
      restating established physiology, in a paper whose own result is in vitro.
  downstream:
  - target: Unrestrained Ferroportin Iron Export
    description: Too little hepcidin fails to internalize and degrade ferroportin, releasing the brake on iron export.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21705976
      reference_title: "Pathophysiology of beta thalassaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hepcidin deficiency in turn allows excessive duodenal iron absorption and development of systemic iron overload."
      explanation: Links hepcidin deficiency to unrestrained duodenal iron absorption and systemic overload.
- name: Hepcidin-Resistant Ferroportin
  description: >-
    Branch C trigger. SLC40A1 gain-of-function variants sit at the hepcidin
    binding site on ferroportin, so the exporter is no longer internalized and
    degraded when hepcidin rises. Hepcidin itself is not deficient; the receptor
    cannot respond. This branch bypasses the Hepcidin Deficiency node and points
    straight at the export step. It is distinct from loss-of-function SLC40A1
    (ferroportin disease), which retains iron in macrophages and does not conform.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:

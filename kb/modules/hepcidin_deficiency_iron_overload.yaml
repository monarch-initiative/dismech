      reference_title: "Diagnosis and management of hereditary hemochromatosis: lifestyle modification, phlebotomy, and blood donation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This results in the formation of toxic non-transferrin-bound iron, which ultimately accumulates in multiple organs, including the liver, heart, endocrine glands, and joints."
      explanation: Links the expanded iron pool to toxic NTBI formation and multi-organ accumulation.
- name: Transferrin Saturation and Non-Transferrin-Bound Iron Formation
  description: >-
    Unrestrained export expands the plasma iron pool beyond the binding capacity
    of transferrin. Once transferrin is saturated, toxic non-transferrin-bound
    iron (NTBI), including its redox-active labile-plasma-iron fraction, appears
    in plasma. NTBI enters cells through transferrin-receptor-independent routes
    not subject to cellular iron regulation, which is what directs it to
    parenchymal rather than erythroid tissue.
  role: effector
  biological_scale: ORGANISM
  notes: >-
    GO:0006826 'iron ion transport' is the closest available process term and
    stands in for the expansion of the plasma iron pool and transferrin
    saturation this node describes; there is no GO term for transferrin
    saturation or an NTBI pool, so do not tighten the binding on that basis.
  biological_processes:
  - preferred_term: iron ion transport
    term:
      id: GO:0006826
      label: iron ion transport
    modifier: INCREASED
  evidence:
  - reference: PMID:39644049
    reference_title: "Diagnosis and management of hereditary hemochromatosis: lifestyle modification, phlebotomy, and blood donation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hepcidin insufficiency in the context of normal erythropoiesis, iron hyperabsorption, and expansion of the plasma iron pool with increased transferrin saturation"
    explanation: >-
      Names the plasma-iron-pool expansion and the rise in transferrin
      saturation that this node's first half asserts, upstream of NTBI formation.
  - reference: PMID:39644049
    reference_title: "Diagnosis and management of hereditary hemochromatosis: lifestyle modification, phlebotomy, and blood donation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

name: mTOR Adaptive Resistance to Androgen Deprivation Module
description: >-
  A conserved resistance-mechanism module capturing PI3K/AKT/mTOR-driven
  adaptive resistance to androgen-receptor (AR) pathway blockade in prostate
  cancer. Androgen deprivation therapy (ADT) and AR-signaling inhibitors
  (ARPIs) impose a selective pressure on AR-dependent tumor cells; because the
  AR and PI3K/AKT/mTOR pathways are reciprocally cross-regulated, suppression
  of AR relieves feedback inhibition of the PI3K/AKT axis (classically
  potentiated by PTEN loss), driving compensatory mTORC1 hyperactivation. The
  hyperactive mTORC1 node sustains pro-survival translational and metabolic
  programs that keep tumor cells alive under androgen blockade, producing
  adaptive (castration) resistance and treatment failure. Because the
  reciprocal wiring means inhibiting one pathway activates the other, the
  therapeutic rationale of the module is co-targeting: pharmacologic mTOR
  inhibition combined with AR-pathway inhibition, which can be captured with
  target_mechanisms on conforming treatments (e.g., everolimus plus abiraterone
  acetate). Individual disorder entries declare conformance via conforms_to,
  substituting the tumor-context-specific lesion (PTEN loss, PIK3CA/AKT1
  activation) and the specific ARPI/mTOR-inhibitor pair.
category: Module
creation_date: "2026-07-25T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "mtor_androgen_deprivation_resistance#mTORC1 Hyperactivation"). The module
  defines the expected pathophysiology structure; conforming nodes in disorder
  files should include the corresponding biological processes and causal edges,
  specialized to their tumor context. Key tumor-context substitutions: PTEN
  deletion (the most common route, ~40% of primary and ~70% of metastatic
  disease) relieving PI3K feedback; PIK3CA or AKT1 activating alterations; the
  specific ARPI used (abiraterone, enzalutamide) and mTOR inhibitor (everolimus,
  temsirolimus, rapamycin). Key conformance / treatment target:
  "mtor_androgen_deprivation_resistance#mTORC1 Hyperactivation". This module is
  the mechanistic complement to AI-derived morphometric predictors of ADT
  response: the INR-like ("incomplete/non-responder") tumor state defined by
  such predictors converges on this mTOR-hyperactive resistance axis, providing
  the biological explanation for why co-targeting mTOR re-sensitizes resistant
  tumors to AR blockade.
mechanistic_hypotheses:
- hypothesis_group_id: mtor_resensitization
  hypothesis_label: mTOR inhibition re-sensitizes ADT-resistant tumors to AR blockade
  status: EMERGING
  description: >-
    The hypothesis that pharmacologic mTOR inhibition, added to AR-pathway
    blockade, overcomes adaptive resistance in the PI3K/AKT/mTOR-hyperactive
    (castration-resistant / INR-like) subset. Preclinical co-inhibition data are
    strong (near-complete regressions with combined PI3K and AR blockade in
    murine and xenograft models); prospective clinical confirmation of the
    specific mTOR-inhibitor-plus-ARPI combination in a morphometrically or
    molecularly defined resistant subgroup is still emerging.
pathophysiology:
- name: Androgen Receptor Pathway Blockade
  description: >-
    Androgen deprivation therapy or an AR-signaling inhibitor (ARPI) suppresses
    androgen-receptor transcriptional output, the therapeutic starting point
    that imposes selective pressure on AR-dependent prostate cancer cells. AR
    cross-talk with oncogenic survival pathways is the substrate on which
    resistance is built; conforming disorder nodes substitute the specific agent
    (ADT, abiraterone, enzalutamide).
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Androgen Receptor Signaling Pathway
    term:
      id: GO:0030521
      label: androgen receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:21620777
    reference_title: "Cell autonomous role of PTEN in regulating castration-resistant prostate cancer growth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, all men with metastatic disease develop resistance to these
      therapies and will progress to castration-resistant prostate cancer
      (CRPC).
    explanation: >-
      Establishes AR-pathway blockade as the therapeutic pressure that
      universally selects for resistance in advanced prostate cancer, the
      trigger of this module. Evidence source is OTHER because this statement is
      introductory clinical background rather than the paper's own experimental
      data.
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Extracellular communication of the androgen receptor (AR) with a wide
      array of oncogenic signatures is a primary evasion mechanism of cancer
      therapy and metastasis.
    explanation: >-
      Frames AR cross-talk with oncogenic pathways as the primary
      therapy-evasion mechanism, motivating the reciprocal-feedback amplifier
      that follows. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Reciprocal PI3K/AKT Feedback Activation
- name: Reciprocal PI3K/AKT Feedback Activation
  description: >-
    Because the AR and PI3K/AKT pathways cross-regulate each other by reciprocal
    feedback, suppression of AR signaling relieves feedback inhibition of the
    PI3K/AKT axis (for example, by reducing the AKT phosphatase PHLPP), so AR
    blockade paradoxically activates AKT signaling. PTEN loss, the most common
    PI3K-pathway lesion in prostate cancer, sensitizes the tumor to this
    compensatory activation. Conforming disorder nodes substitute the specific
    PI3K-pathway lesion (PTEN deletion, PIK3CA/AKT1 activation).
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: PI3K/AKT Signal Transduction
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:21575859
    reference_title: "Reciprocal feedback regulation of PI3K and androgen receptor signaling in PTEN-deficient prostate cancer."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Similarly, AR inhibition activates AKT signaling by reducing levels of
      the AKT phosphatase PHLPP. Thus, these two oncogenic pathways
      cross-regulate each other by reciprocal feedback. Inhibition of one
      activates the other, thereby maintaining tumor cell survival.
    explanation: >-
      Directly demonstrates the reciprocal feedback in murine and human prostate
      cancer models: AR inhibition activates AKT, establishing the amplifier
      that converts AR blockade into compensatory PI3K/AKT activation.
  - reference: PMID:21620777
    reference_title: "Cell autonomous role of PTEN in regulating castration-resistant prostate cancer growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conditional deletion of Ar in the epithelium promotes the proliferation of
      Pten null cancer cells, at least in part, by downregulating the
      androgen-responsive gene Fkbp5 and preventing PHLPP-mediated AKT
      inhibition.
    explanation: >-
      Independent genetic demonstration of the amplifier's direction in the
      Pten-null model: removing AR signaling relieves PHLPP-mediated inhibition
      of AKT and promotes proliferation, so AR blockade sensitizes the PI3K/AKT
      arm rather than merely co-occurring with it.
  downstream:
  - target: mTORC1 Hyperactivation
- name: mTORC1 Hyperactivation
  description: >-
    Compensatory PI3K/AKT activation converges on constitutive mTOR complex 1
    (mTORC1) signaling, the rate-limiting, disorder-agnostic central node of the
    module and the pharmacologic target of rapalogs. Hyperactive mTORC1 is the
    conserved point through which every conforming tumor funnels its
    ADT-resistant survival signaling, and its activity distinguishes
    resistant (incomplete/non-responder) from sensitive tumors.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Prostate luminal tumor cell
    term:
      id: CL:0002340
      label: luminal cell of prostate epithelium
  biological_processes:
  - preferred_term: TORC1 Signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: INCREASED
  - preferred_term: TOR Signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In prostate cancer this pathway is generally altered due to the mutation
      or deletion of the PTEN (phosphatase and tensin homolog) gene and
      unnecessary activities of some components of PI3K, AKT, or mTOR.
    explanation: >-
      Establishes constitutive PI3K/AKT/mTOR activation (via PTEN loss and
      component activation) as a defining feature of prostate cancer, supporting
      mTORC1 hyperactivation as the conserved central effector. Evidence source
      is OTHER because this is a review article.
  downstream:
  - target: Pro-Survival Translational and Metabolic Reprogramming
- name: Pro-Survival Translational and Metabolic Reprogramming
  description: >-
    Hyperactive mTORC1 drives cap-dependent protein translation and anabolic
    metabolism (via effectors such as S6K1/p70S6K and 4E-BP1), sustaining
    biosynthesis, growth, and survival programs that compensate for the loss of
    AR-driven survival signals under androgen blockade. p70S6K, a direct
    mTORC1 effector, is a robust functional readout of this node.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Positive Regulation of Translation
    term:
      id: GO:0045727
      label: positive regulation of translation
    modifier: INCREASED
  evidence:
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PI3K, AKT, and mTOR signalling pathways play a pivotal role in
      cellular sustenance, growth, metabolism, and proliferation.
    explanation: >-
      Supports the mTOR-driven translational/metabolic survival programs as the
      downstream effector sustaining tumor cells under androgen blockade.
      Evidence source is OTHER because this is a review article.
  downstream:
  - target: Adaptive Resistance to Androgen-Deprivation Therapy
- name: Adaptive Resistance to Androgen-Deprivation Therapy
  description: >-
    The net consequence: mTOR-sustained survival signaling renders tumor cells
    able to grow independently of androgen, producing adaptive
    (castration-resistant) growth and clinical failure of ADT/ARPI monotherapy.
    This is the resistant/incomplete-responder phenotype that co-targeting the
    mTOR node aims to reverse.
  role: consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Androgen-Independent Tumor Cell Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:21620777
    reference_title: "Cell autonomous role of PTEN in regulating castration-resistant prostate cancer growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that castration-resistant growth is an intrinsic property of
      Pten null prostate cancer (CaP) cells, independent of cancer development
      stage.
    explanation: >-
      Demonstrates castration-resistant (androgen-independent) growth as the
      consequence of PI3K-pathway activation in the Pten-null model, the
      resistant phenotype this module describes.
  - reference: PMID:21620777
    reference_title: "Cell autonomous role of PTEN in regulating castration-resistant prostate cancer growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings identify PI3K and AR pathway crosstalk as a mechanism of
      CRPC development, with potentially important implications for CaP etiology
      and therapy.
    explanation: >-
      Identifies PI3K-AR crosstalk as a mechanism of castration-resistant
      prostate cancer development, tying the module's amplifier to its resistant
      consequence and to therapeutic implications.
treatments:
- name: mTOR Inhibition Combined with AR-Pathway Inhibition
  description: >-
    The module's drug-target design pattern: because AR blockade activates the
    PI3K/AKT/mTOR survival axis by reciprocal feedback, co-targeting mTORC1
    alongside an AR-pathway inhibitor is expected to suppress the compensatory
    survival node and re-sensitize resistant tumors to androgen blockade.
    Combined pharmacologic inhibition of the PI3K and AR pathways produced
    near-complete tumor regressions preclinically. The named agents record the
    one combination actually taken into patients on this rationale — the
    rapalog everolimus co-administered with the AR antagonist bicalutamide in
    the phase II NCT00814788 trial — and are a statement of the design pattern,
    NOT a recommended regimen: everolimus monotherapy failed in mCRPC and
    rapalog-induced feedback is itself a documented limitation of the class
    (see the KNOWLEDGE_GAP discussion on mTORC1 Hyperactivation). Conforming
    treatments act upstream on the mTORC1 node rather than on the downstream
    resistant phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
    - preferred_term: bicalutamide
      term:
        id: CHEBI:3090
        label: bicalutamide
  target_mechanisms:
  - target: mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Rapalog inhibition of mTORC1 suppresses the compensatory central-effector
      node that sustains tumor survival under AR blockade, restoring sensitivity
      to AR-pathway inhibition when the two are combined.
  evidence:
  - reference: PMID:21575859
    reference_title: "Reciprocal feedback regulation of PI3K and androgen receptor signaling in PTEN-deficient prostate cancer."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, combined pharmacologic inhibition of PI3K and AR signaling caused
      near-complete prostate cancer regressions in a Pten-deficient murine
      prostate cancer model and in human prostate cancer xenografts, indicating
      that both pathways coordinately support survival.
    explanation: >-
      Provides the preclinical rationale for the co-targeting design pattern:
      simultaneous PI3K/mTOR and AR inhibition, but not either alone, produces
      near-complete regressions, supporting mTOR inhibition combined with AR
      blockade as the module's therapeutic strategy.
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      current therapeutic strategies that combinatorically target individual
      components of this pathway, such as allosteric and ATP-competitive AKT
      inhibitors, isoform-selective PI3K inhibitors, first- and second-generation
      mTOR inhibitors, are under consideration
    explanation: >-
      Supports pharmacologic targeting of individual PI3K/AKT/mTOR-pathway
      components, including mTOR inhibitors, as a combinatorial therapeutic
      strategy in prostate cancer — the class of agent this treatment pattern
      applies to the module's mTORC1 node. Evidence source is OTHER because this
      is a review article.
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a Phase II trial (NCT00814788), everolimus was co-administered with
      bicalutamide
    explanation: >-
      Documents the specific rapalog plus AR-antagonist pair named in this
      treatment's therapeutic_agent list, so the machine-readable drug pair
      corresponds to a combination actually administered to patients rather than
      to an untested pairing. Evidence source is OTHER because this is a review
      article reporting the trial.
discussions:
- discussion_id: gap_mtor_adt_rapalog_feedback_and_monotherapy_failure
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#mTORC1 Hyperactivation
  prompt: >-
    Can pharmacologic inhibition of mTORC1 actually break the reciprocal
    PI3K/AKT-AR feedback loop this module is built around, given that rapalogs
    only partially inhibit mTORC2 and therefore themselves elicit the same
    PI3K/AKT-induced feedback, and that everolimus monotherapy produced no PSA
    responses in metastatic castration-resistant prostate cancer?
  rationale: >-
    The module's therapeutic arm asserts that inhibiting mTORC1 relieves the
    resistant phenotype, but the cited review documents the reverse running
    through the same loop the module models: "the rapalog family only has a
    partial inhibition of mTORC2. As a result, the associated inhibition of
    mTORC1 can elicit PI3K/AKT-induced positive feedback mechanisms that
    constrain the durable effectiveness of the therapeutic responses"
    (PMID:41525007). The clinical record is correspondingly negative — in
    NCT00976755 everolimus monotherapy in 37 post-docetaxel mCRPC patients
    showed "minimal clinical effectiveness, and no patient displayed a PSA
    response, with a median PFS of only 3 months". Combination evidence for the
    strategy remains preclinical (PMID:21575859, Pten-deficient murine and
    xenograft models); the one combination trial named in the review
    (NCT00814788, everolimus plus bicalutamide) is cited without an outcome.
    Until a combination trial reports, whether the mTORC1 node is a tractable
    drug target in this disease or only a mechanistic waypoint is genuinely
    open, and conforming disorder entries must not curate rapalog therapy as an
    effective intervention on the strength of this module.
  proposed_experiments:
  - experiment_id: exp_mtor_adt_dual_mtorc1_mtorc2_vs_rapalog_with_arpi
    name: Rapalog versus dual mTORC1/mTORC2 inhibitor, each combined with an
      AR-pathway inhibitor
    description: >-
      In castration-resistant prostate cancer models and, if the preclinical
      arm separates, in a randomized trial, compare an AR-pathway inhibitor
      combined with a rapalog against the same AR-pathway inhibitor combined
      with an ATP-competitive dual mTORC1/mTORC2 inhibitor, measuring
      phospho-AKT (S473) as the direct readout of whether feedback
      reactivation occurs under each agent.
    decision_criterion: >-
      Greater and more durable tumor control in the dual mTORC1/mTORC2 arm,
      accompanied by suppression rather than induction of phospho-AKT relative
      to the rapalog arm.
    would_support:
    - >-
      Confirms that rapalog-induced feedback, not the mTORC1 node itself, is
      what limits the strategy, and that the node is druggable with an agent
      that closes the mTORC2 arm of the loop.
    would_refute:
    - >-
      Equivalent failure of both arms would indicate the resistant phenotype is
      sustained by effectors outside the mTORC1 node, and that this module's
      therapeutic arm should be recorded as mechanistic rather than actionable.
  evidence:
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      the rapalog family only has a partial inhibition of mTORC2. As a result,
      the associated inhibition of mTORC1 can elicit PI3K/AKT-induced positive
      feedback mechanisms that constrain the durable effectiveness of the
      therapeutic responses
    explanation: >-
      States the paradox that motivates this gap: the class of drug used to
      inhibit the module's central effector re-activates the very upstream
      feedback arm the module models, so mTORC1 inhibition is not a clean test
      of the mechanism.
  - reference: PMID:41525007
    reference_title: "Targeting the PI3K/AKT/mTOR signaling pathway in prostate cancer: Molecular dysregulation, therapeutic advances, and future directions."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The findings demonstrate minimal clinical effectiveness, and no patient
      displayed a PSA response, with a median PFS of only 3 months
    explanation: >-
      The negative NCT00976755 monotherapy result. Marked REFUTE because it
      counts against mTORC1 inhibition alone being sufficient to reverse the
      resistant phenotype; it does not speak to the combination strategy, which
      is what leaves the question open rather than closed.

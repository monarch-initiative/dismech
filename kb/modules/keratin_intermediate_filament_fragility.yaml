name: Keratin Intermediate Filament Fragility Module
description: >-
  A conserved cytoskeletal-fragility module for the keratinopathies. Keratins
  assemble as obligate heterodimers of one type I and one type II chain into the
  intermediate filament network that gives a keratinocyte its mechanical
  resilience. A heterozygous missense or small in-frame variant in a
  filament-assembly domain is incorporated into that network and poisons it
  in trans, so a single mutant allele collapses the filament system - the
  defining dominant-negative mechanism of this disease group. The weakened
  keratinocyte lyses under mechanical stress that normal skin tolerates. Which
  tissue blisters is set not by the mechanism, which is identical throughout,
  but by where the affected keratin pair is expressed: basal K5/K14, suprabasal
  K1/K10, palmoplantar and appendageal K6/K16/K17, hair-shaft K81/K83/K86.
  Disorder entries reference these nodes via conforms_to and substitute the
  affected keratin pair.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a shared mechanism module, not a disease.

  Disorder-specific substitutions at the trigger node, listed with the
  expression domain that sets the affected tissue: KRT5 / KRT14 in basal
  keratinocytes (epidermolysis bullosa simplex - intraepidermal basal
  cytolysis); KRT1 / KRT10 in suprabasal keratinocytes (epidermolytic
  ichthyosis, formerly epidermolytic hyperkeratosis, and the mosaic epidermal
  naevus form); KRT9 in palmoplantar suprabasal epidermis (epidermolytic
  palmoplantar keratoderma); KRT6A / KRT6B / KRT6C / KRT16 / KRT17 in nail bed,
  palmoplantar epidermis and pilosebaceous units (pachyonychia congenita);
  KRT81 / KRT83 / KRT86 in the hair shaft cortex (monilethrix); KRT3 / KRT12 in
  corneal epithelium (Meesmann corneal dystrophy).

  The mutational hot spots are the helix boundary motifs at the ends of the
  central rod domain (the beginning of 1A and the end of 2B) plus the H1 head
  domain, because those are the regions mediating end-to-end molecular overlap
  during filament assembly. A variant there is more disruptive, and more
  dominant, than one in the middle of the rod - which is why genotype maps onto
  severity within a single gene.

  Scope boundary with `dermal_epidermal_junction_adhesion_failure`. EBS reaches
  a plane of separation in skin, so it conforms to that module at its separation
  node, but its proximal lesion is intracellular and belongs here. Do not
  conform an EBS entry to that module's *trigger* node, which asserts a
  basement-membrane-zone attachment defect. PLEC/plectin is the genuine hinge:
  plectin links the keratin network into the hemidesmosome, so plectin-deficient
  EB has a real claim on both triggers.

  Scope boundary with `epidermal_cornification_failure`. Epidermolytic ichthyosis
  conforms to BOTH modules and to neither alone: the K1/K10 lesion is a keratin
  filament lesion (here), while the resulting hyperkeratotic scaling arises
  through the barrier-failure and compensatory-hyperproliferation chain of the
  cornification module. Curate both, rather than forcing one to carry the other.

  Not an Xogenesis module: the terminal output is cytolysis, the destruction of
  cells, not the formation of a pathological anatomical entity.

  Conformance requires evidence of keratin filament network disruption or
  keratinocyte cytolysis. A keratin gene expressed in the affected tissue, or a
  keratin variant of unknown consequence, does not conform on that basis alone;
  in particular a keratin *null* allele acting by haploinsufficiency is a
  different mechanism from the dominant-negative one this module models.
pathophysiology:
- name: Dominant-Negative Keratin Variant in a Filament Assembly Domain
  description: >-
    A heterozygous missense or small in-frame insertion/deletion variant falls in
    a keratin domain required for filament assembly - characteristically a helix
    boundary motif at the start of the 1A or the end of the 2B rod segment, or
    the H1 head domain. These are the regions that mediate the end-to-end
    molecular overlaps between adjacent keratin molecules, so a substitution
    there yields a chain that still enters the filament but cannot support
    normal assembly.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: structural constituent of cytoskeleton
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: keratin filament
    term:
      id: GO:0045095
      label: keratin filament
  evidence:
  - reference: PMID:7507151
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, analyses of all mutations in epidermolytic hyperkeratosis known to date demonstrate remarkable clustering in the molecular overlap region.
    explanation: >-
      Establishes that pathogenic keratin variants cluster in the assembly
      domains mediating molecular overlap, which is the claim of this node.
  - reference: PMID:19609311
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dominant-negative mutations in any of the four identified keratin genes, KRT6A, KRT6B, KRT16, or KRT17, cause pachyonychia congenita (PC), characterized by hypertrophic nail dystrophy and other ectodermal features.
    explanation: >-
      Documents the dominant-negative mode of action in a second keratin pair and
      a second tissue, supporting the mechanism as shared rather than
      gene-specific.
  downstream:
  - target: Keratin Filament Network Collapse and Aggregation
    description: >-
      The mutant chain is incorporated into the obligate heterodimer and
      disrupts assembly of the whole network in trans.

- name: Keratin Filament Network Collapse and Aggregation
  description: >-
    Because keratin filaments are obligate heterodimers of a type I and a type II
    chain, mutant protein from a single allele is incorporated throughout the
    network rather than segregating from it. The filament system fails to form a
    normal cytoplasmic array and instead collapses into perinuclear clumps and
    tonofilament aggregates - the ultrastructural hallmark of this disease group,
    and the basis of the clumped tonofilaments seen in Dowling-Meara EBS.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: keratin filament
    term:
      id: GO:0045095
      label: keratin filament
  evidence:
  - reference: PMID:1717157
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we engineered one of these point mutations in a cloned human K14 cDNA, and showed that a K14 with an Arg-125----Cys mutation disrupted keratin network formation in transfected keratinocytes and perturbed filament assembly in vitro
    explanation: >-
      Directly demonstrates the trigger-to-amplifier step: a patient point
      mutation, reintroduced experimentally, disrupts keratin network formation.
  - reference: PMID:17914454
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As predicted for a dominant-negative disease, simultaneous expression of both wild-type and mutant K6a resulted in defective keratin filament formation. Addition of mutant-specific siRNAs allowed normal filament formation, suggesting selective inhibition of mutant K6a.
    explanation: >-
      Shows the dominant-negative logic explicitly - wild-type protein does not
      rescue, and removing only the mutant transcript restores the network.
  downstream:
  - target: Loss of Keratinocyte Mechanical Resilience
    description: >-
      A collapsed filament network no longer distributes mechanical load across
      the cell.

- name: Loss of Keratinocyte Mechanical Resilience
  description: >-
    The keratin network is the load-bearing element of the keratinocyte, so its
    collapse leaves the cell unable to withstand shear and compression. This is
    the rate-limiting, disorder-agnostic node of the module: every affected
    keratin pair converges here, and conformance should be declared against it.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: cellular response to mechanical stimulus
    term:
      id: GO:0071260
      label: cellular response to mechanical stimulus
    modifier: ABNORMAL
  evidence:
  - reference: PMID:1720261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that abnormalities of either of the components of the keratin intermediate filament heterodipolymer can impair the mechanical stability of these epithelial cells.
    explanation: >-
      States this node directly, and states it for either chain of the
      heterodimer, which is why the module is keratin-pair-agnostic.
  - reference: PMID:7537780
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder results from a mutation in either the keratin 5 or keratin 14 gene, which encode the peptide components of the obligate heterodimeric keratin intermediate filaments of the basal cell.
    explanation: >-
      Confirms the obligate-heterodimer architecture that makes a single mutant
      allele sufficient to compromise resilience.
  downstream:
  - target: Keratinocyte Cytolysis Within the Keratin Expression Domain
    description: >-
      Mechanically incompetent cells rupture, and they do so in whichever
      epithelial layer or appendage expresses the affected keratin pair.

- name: Keratinocyte Cytolysis Within the Keratin Expression Domain
  description: >-
    Cells lyse under mechanical stress, producing a plane of tissue disruption
    at the level where the affected keratin pair is expressed. This node is
    where the module's single mechanism becomes several distinct diseases: basal
    K5/K14 cytolysis splits the epidermis at its base and blisters; suprabasal
    K1/K10 cytolysis produces the vacuolar degeneration of epidermolytic
    ichthyosis; K6/K16/K17 involvement affects nail bed, palmoplantar epidermis
    and pilosebaceous units; hair-cortex keratins produce a fragile,
    beaded hair shaft.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: basal keratinocyte
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: cytolysis
    term:
      id: GO:0019835
      label: cytolysis
    modifier: INCREASED
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:1720261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epidermolysis bullosa simplex (EBS) is characterized by skin blistering due to basal keratinocyte fragility.
    explanation: >-
      Documents the basal-layer instance of this node, produced by the K5/K14
      pair.
  - reference: PMID:7951667
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in keratins K5 or K14 are found in epidermolysis bullosa simplex.
    explanation: >-
      Anchors the basal expression domain to its disease; the same source maps
      the suprabasal K1/K10 pair to epidermolytic hyperkeratosis, which is the
      expression-domain principle this node asserts.
  downstream:
  - target: Mechanically Provoked Blistering, Hyperkeratosis and Appendage Dystrophy
    description: >-
      Repeated cytolysis in the affected compartment produces the clinical
      phenotype characteristic of that keratin pair.

- name: Mechanically Provoked Blistering, Hyperkeratosis and Appendage Dystrophy
  description: >-
    The clinical endpoint, which varies with the expression domain but is
    uniformly provoked or worsened by friction and pressure: trauma-induced
    blistering favouring hands and feet; erythema and blistering in the neonate
    giving way to thick adherent hyperkeratosis; focal palmoplantar keratoderma
    with disabling plantar pain and hypertrophic nail dystrophy; or fragile
    beaded hair with patchy alopecia. Because the trigger is mechanical, disease
    burden tracks physical activity and heat, and management is largely
    protective.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: ABNORMAL
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:15663649
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This inherited keratinization disorder is characterized clinically by erythema, blistering, and peeling shortly after birth. It may resolve and be replaced with thick scaling.
    explanation: >-
      Documents the suprabasal K1/K10 endpoint, in which neonatal blistering is
      succeeded by hyperkeratosis.
  - reference: PMID:7537780
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Weber-Cockayne subtype of epidermolysis bullosa simplex is an inherited skin-fragility disorder characterized by basal keratinocyte lysis and epidermal blistering confined primarily to the hands and feet.
    explanation: >-
      Documents the basal K5/K14 endpoint and its localization to the most
      mechanically stressed sites, which is the module's mechanical logic.

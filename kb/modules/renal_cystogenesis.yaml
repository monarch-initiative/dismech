name: Renal Tubular Cystogenesis Module
description: >-
  A conserved pathophysiology module representing the tubular cyst-formation
  pathway shared by the inherited cystic kidney diseases. Loss or dysfunction of
  the primary-cilium polycystin complex (polycystin-1/PKD1, polycystin-2/PKD2)
  or of other ciliary/basal-body proteins removes the flow-sensing and calcium
  signal that normally restrains tubular epithelial cells. The resulting fall in
  intracellular calcium disinhibits adenylate cyclase and raises intracellular
  cAMP, an effect amplified by abnormal stimulation of the vasopressin V2
  receptor (V2R). Elevated cAMP does two things at once in the mutant epithelium:
  it drives mural (cyst-lining) epithelial cell proliferation, and it stimulates
  cAMP-dependent transepithelial chloride secretion through the apical CFTR
  channel, which osmotically drives fluid into the lumen. Proliferation plus
  fluid secretion convert a focal segment of tubule into an expanding,
  fluid-filled cyst that ultimately detaches from the parent nephron. Continued
  cyst growth produces massive kidney enlargement, and compression, interstitial
  inflammation and fibrosis of the intervening parenchyma cause progressive
  nephron loss and decline in kidney function. The module captures the shared
  core across autosomal dominant polycystic kidney disease (ADPKD), autosomal
  recessive polycystic kidney disease (ARPKD), nephronophthisis, and the cystic
  kidney component of the syndromic ciliopathies (e.g., Bardet-Biedl, Joubert,
  Meckel). Conforming disorder nodes substitute the disorder-specific ciliary or
  tubular lesion (PKD1/PKD2 in ADPKD, PKHD1/fibrocystin in ARPKD, NPHP genes in
  nephronophthisis, BBSome components in Bardet-Biedl) while preserving the
  polycystin/cilia loss -> cAMP elevation -> proliferation and fluid secretion ->
  cyst expansion -> nephron loss causal chain.
category: Module
creation_date: "2026-07-13T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease, and NOT a general
  representation of every kind of cyst. It is a pathological structure-formation
  ("Xogenesis") module. Xogenesis anchor: the terminal output is a cyst
  (MPATH:62), an OGMS:0000078 pathological anatomical structure produced by an
  OGMS:0000080 pathological transformation (a canonical tubule segment becomes a
  cyst); process genus OGMS:0000061 pathological bodily process; site
  UBERON:0002113 kidney. SNOMED "Morphologically abnormal structure" (49755003)
  is an external census/gap guide only and is not bound here. It models
  epithelial (tubular) renal cystogenesis, the cAMP-driven ciliopathy/PKD
  pathway; it deliberately does not
  cover mechanistically unrelated cysts (arachnoid, dermoid, parasitic hydatid,
  neoplastic cystadenoma, developmental cavitation), which share no common
  trigger-to-effector chain. Disorder entries reference individual nodes via
  conforms_to (e.g., "renal_cystogenesis#Cyst-Lining Epithelial Proliferation
  and Transepithelial Fluid Secretion"). The module defines the expected
  pathophysiology structure; conforming nodes in disorder files should include
  the corresponding cell types, biological processes, and causal edges,
  specialized to their disease context. Key disease-specific substitutions:
  ADPKD substitutes germline PKD1/PKD2 (polycystin) loss with a somatic
  second-hit; ARPKD substitutes PKHD1/fibrocystin at the ciliary trigger;
  nephronophthisis substitutes NPHP-gene transition-zone defects; syndromic
  ciliopathies substitute BBSome/IFT lesions and also conform to
  ciliopathy_dysfunction for their multisystem features. Autosomal Dominant
  Polycystic Kidney Disease is the flagship worked conformer, declaring
  conforms_to across all five module nodes; the general Polycystic Kidney
  Disease entry conforms at the cAMP/V2R and proliferation/secretion nodes.
  This module is the
  cystogenic-machinery complement of ciliopathy_dysfunction, which captures the
  broader Hedgehog/PCP developmental arm of the ciliopathies but not the
  cAMP-CFTR cyst-fluid pathway detailed here. Modules bind GO and CL terms only
  and do not use chemical (CHEBI) or disease (MONDO) term bindings; drug and
  solute chemistry is described in prose, except in the treatments block where
  the therapeutic agent carries a CHEBI identifier per the treatment schema.
pathophysiology:
- name: Polycystin and Primary Cilium Signaling Loss
  description: >-
    The shared upstream lesion of the inherited cystic kidney diseases. The
    polycystin-1/polycystin-2 complex and other ciliary and basal-body proteins
    localize to the primary cilium of renal tubular epithelial cells, where they
    act as a flow sensor that governs intracellular calcium. Loss-of-function
    mutations (or, in ADPKD, a germline mutation plus a somatic second hit)
    abolish this mechanosensitive calcium signal, leaving the cell unable to
    read the mechanical cues that normally maintain tubular architecture and
    restrain proliferation. The specific ciliary or polycystin lesion differs by
    disorder but the loss of the cilium-dependent calcium restraint is shared.
  role: trigger
  cell_types:
  - preferred_term: Renal tubular epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  biological_processes:
  - preferred_term: Cilium-Dependent Calcium Signaling
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: DECREASED
  evidence:
  - reference: PMID:12514735
    reference_title: "Polycystins 1 and 2 mediate mechanosensation in the primary cilium of kidney cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss or dysfunction of PC1 or PC2 may therefore lead to PKD owing to the
      inability of cells to sense mechanical cues that normally regulate tissue
      morphogenesis.
    explanation: >-
      Establishes that polycystin-1/polycystin-2 mediate flow sensation in the
      primary cilium of renal epithelium and that their loss causes PKD by
      abolishing the mechanosensitive signal, the trigger of this module.
      Evidence source is IN_VITRO because the flow-induced calcium response was
      measured in isolated renal epithelial cells and antibody-blocked
      wild-type cells.
  - reference: PMID:40136708
    reference_title: "Ciliary Ion Channels in Polycystic Kidney Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dysregulation of these pathways due to genetic mutations in PKD1 and PKD2
      leads to disrupted Ca+2 and cAMP signaling, aberrant fluid secretion, and
      uncontrolled cellular proliferation, resulting in tubular cystogenesis.
    explanation: >-
      Directly connects PKD1/PKD2 ciliary-signaling dysregulation to disrupted
      calcium and cAMP signaling, fluid secretion, and proliferation that
      converge on tubular cystogenesis, framing the whole module chain. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: cAMP and Vasopressin-V2R Signaling Activation
- name: cAMP and Vasopressin-V2R Signaling Activation
  description: >-
    The amplifying step and the principal therapeutic target. The fall in
    intracellular calcium that follows polycystin/ciliary loss disinhibits
    calcium-inhibitable adenylate cyclase and reduces cAMP degradation, raising
    intracellular cAMP in tubular epithelial cells. This elevation is further
    driven by abnormal stimulation of the Gs-coupled vasopressin V2 receptor
    (V2R) in the collecting duct, which activates adenylate cyclase. cAMP
    therefore accumulates in the mutant epithelium and becomes the central
    second messenger that converts the upstream signaling defect into the two
    cystogenic outputs (proliferation and fluid secretion). Because the V2R sits
    upstream of this node, pharmacological V2R blockade lowers cystic-tissue
    cAMP and is the basis of tolvaptan therapy.
  role: amplifier
  cell_types:
  - preferred_term: Collecting duct epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  biological_processes:
  - preferred_term: Vasopressin V2 Receptor-Adenylate Cyclase cAMP Signaling
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:23736843
    reference_title: "Osmoregulation, vasopressin, and cAMP signaling in autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Increased levels of cAMP in tubular cells, reflecting modifications in
      intracellular calcium homeostasis and abnormal stimulation of the
      vasopressin V2 receptor (V2R), play a central role in cystogenesis.
    explanation: >-
      Establishes elevated tubular-cell cAMP, driven by disrupted calcium
      homeostasis and abnormal V2R stimulation, as central to cystogenesis, the
      amplifier step of this module. Evidence source is OTHER because this is a
      review.
  - reference: PMID:21255645
    reference_title: "Fluid transport and cystogenesis in autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The whole secretory process is stimulated by increased levels of cAMP in
      the cells, probably reflecting modifications in the intracellular calcium
      homeostasis and abnormal stimulation of the vasopressin V2 receptor.
    explanation: >-
      Documents that the cyst-fluid secretory process is stimulated by raised
      cAMP arising from disturbed calcium homeostasis and V2R stimulation,
      linking this amplifier to the downstream secretion effector. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Cyst-Lining Epithelial Proliferation and Transepithelial Fluid Secretion
- name: Cyst-Lining Epithelial Proliferation and Transepithelial Fluid Secretion
  description: >-
    The rate-limiting central effector where the conserved cystogenic engine
    runs. Elevated cAMP acts on the calcium-depleted mutant epithelium in two
    complementary ways. First, it becomes mitogenic: through cross-talk to the
    B-Raf/MEK/ERK pathway that is normally repressed in healthy tubular cells,
    cAMP stimulates proliferation of the mural cyst-lining epithelium. Second, it
    drives cAMP-dependent transepithelial chloride secretion through the apical
    CFTR chloride channel, and the secreted chloride osmotically pulls fluid into
    the tubular lumen. Proliferation expands the cyst wall while fluid secretion
    fills the cavity; together they are the pivotal, disorder-agnostic step that
    converts a normal tubule segment into a growing cyst. This is the key
    conformance target of the module.
  role: central_effector
  cell_types:
  - preferred_term: Cyst-lining renal epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  biological_processes:
  - preferred_term: Cyst-Lining Epithelial Cell Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  - preferred_term: CFTR-Mediated Transepithelial Chloride Secretion
    term:
      id: GO:1902476
      label: chloride transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:23832438
    reference_title: "[Inhibitors of intra-cystic secretion: novel therapies in ADPKD (Autosomal Dominant Polycystic Kidney Disease)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Progressive enlargement of the kidneys is due to aberrant proliferation of
      the cyst epithelial cells, together with accumulation of fluid within the
      cyst cavities due to transepithelial fluid secretion.
    explanation: >-
      Directly identifies aberrant cyst-lining epithelial proliferation plus
      transepithelial fluid secretion as the paired cystogenic mechanisms, the
      central effector of this module. Evidence source is OTHER because this is a
      review.
  - reference: PMID:21118718
    reference_title: "Cyclic AMP-mediated cyst expansion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fluid secretion by cystic cells is driven by cAMP-dependent transepithelial
      Cl(-) secretion involving apical cystic fibrosis transmembrane conductance
      regulator (CFTR) Cl(-) channels.
    explanation: >-
      Establishes that cyst fluid secretion is cAMP-dependent chloride secretion
      through apical CFTR channels, the secretory arm of this central effector.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Progressive Cyst Expansion and Kidney Enlargement
- name: Progressive Cyst Expansion and Kidney Enlargement
  description: >-
    Sustained proliferation and continued cAMP-driven fluid secretion enlarge
    individual cysts, which progressively detach from the parent nephron and
    behave as isolated fluid-filled sacs that keep secreting into a closed
    lumen. As hundreds to thousands of cysts expand, total kidney volume rises
    relentlessly, producing the massively enlarged polycystic kidneys that are
    the radiological hallmark and the best early biomarker of disease
    progression. This is the effector step that converts the microscopic
    cystogenic process into the gross organ phenotype.
  role: effector
  cell_types:
  - preferred_term: Cyst-lining renal epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  biological_processes:
  - preferred_term: Transepithelial Water Movement into the Cyst Lumen
    term:
      id: GO:0006833
      label: water transport
    modifier: INCREASED
  evidence:
  - reference: PMID:26125646
    reference_title: "Chloride secretion by renal collecting ducts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In ADPKD, Cl secretion plays a central role in the accumulation of cyst
      fluid and the remarkable size of the cystic kidneys.
    explanation: >-
      Directly attributes cyst-fluid accumulation and the remarkable size of the
      cystic kidneys to chloride secretion, supporting cyst expansion and kidney
      enlargement as the effector step. Evidence source is OTHER because this is
      a review.
  - reference: PMID:23832438
    reference_title: "[Inhibitors of intra-cystic secretion: novel therapies in ADPKD (Autosomal Dominant Polycystic Kidney Disease)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Progressive enlargement of the kidneys is due to aberrant proliferation of
      the cyst epithelial cells, together with accumulation of fluid within the
      cyst cavities due to transepithelial fluid secretion.
    explanation: >-
      Confirms that progressive kidney enlargement is the organ-level result of
      cyst-lining proliferation and fluid accumulation, the effector consequence
      of the central cystogenic engine. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Nephron Loss and Progressive Kidney Failure
- name: Nephron Loss and Progressive Kidney Failure
  description: >-
    The clinical end state of the module. Expanding cysts compress adjacent
    functioning nephrons and the renal vasculature, and the cystic microenvironment
    provokes interstitial inflammation and progressive fibrosis of the intervening
    parenchyma. The cumulative loss of functioning nephrons erodes glomerular
    filtration over decades, so that despite compensatory hyperfiltration the
    kidney function declines and a substantial fraction of patients reach
    end-stage kidney disease. This is the consequence of the conserved
    polycystin/cilia-loss to cAMP to proliferation-and-secretion to
    cyst-expansion chain.
  role: consequence
  cell_types:
  - preferred_term: Renal tubular epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  evidence:
  - reference: PMID:40136708
    reference_title: "Ciliary Ion Channels in Polycystic Kidney Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Polycystic kidney disease (PKD) is the most common hereditary disorder
      that disrupts renal function and frequently progresses to end-stage renal
      disease.
    explanation: >-
      Establishes progression to end-stage renal disease as the clinical
      consequence of polycystic kidney disease, the terminal node of this
      module. Evidence source is OTHER because this is a review.
  - reference: PMID:17434405
    reference_title: "Autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal dominant polycystic kidney disease is the most prevalent,
      potentially lethal, monogenic disorder.
    explanation: >-
      Frames ADPKD, the prototypical cystogenesis disorder, as a prevalent and
      potentially lethal monogenic disease, supporting the severity of this
      consequence node. Evidence source is OTHER because this is a review.
treatments:
- name: Vasopressin V2 Receptor Antagonist (Tolvaptan)
  description: >-
    Tolvaptan is a selective vasopressin V2 receptor (V2R) antagonist. By
    blocking the V2R on collecting-duct epithelium it lowers intracellular cAMP
    in cystic tissue, thereby dampening both the cAMP-driven proliferation and
    the cAMP-dependent CFTR chloride/fluid secretion that expand cysts. It is the
    first disease-modifying therapy for ADPKD and represents the cystogenesis
    drug-target design pattern for conforming disorders: a treatment that acts
    upstream on the cAMP/V2R amplifier node rather than on the downstream
    structural phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tolvaptan
      term:
        id: CHEBI:32246
        label: tolvaptan
  target_mechanisms:
  - target: cAMP and Vasopressin-V2R Signaling Activation
    treatment_effect: INHIBITS
    description: >-
      V2R blockade lowers cAMP in cystic tissue, suppressing the amplifier node
      that drives cyst-lining proliferation and transepithelial fluid secretion,
      and thereby slowing cyst growth and kidney-function decline.
  evidence:
  - reference: PMID:23121377
    reference_title: "Tolvaptan in patients with autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tolvaptan, as compared with placebo, slowed the increase in total kidney
      volume and the decline in kidney function over a 3-year period in patients
      with ADPKD
    explanation: >-
      The phase 3 TEMPO 3:4 trial shows that the V2R antagonist tolvaptan slows
      total-kidney-volume growth and kidney-function decline in ADPKD patients,
      validating V2R/cAMP blockade as a disease-modifying target. Evidence
      source is HUMAN_CLINICAL because this is a randomized controlled trial in
      patients.
  - reference: PMID:23736843
    reference_title: "Osmoregulation, vasopressin, and cAMP signaling in autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blocking the V2R lowers cAMP in cystic tissues, slows renal cystic
      progression and improves renal function in preclinical models.
    explanation: >-
      Establishes the mechanistic rationale that V2R blockade lowers
      cystic-tissue cAMP and slows cystic progression, linking the drug to the
      cAMP/V2R amplifier node it targets. Evidence source is OTHER because this
      is a review summarizing preclinical models.

name: Conserved Cellular Senescence Module
description: >-
  A conserved pathological module representing cellular senescence (GO:0090398) -
  a stress-associated stable cell-cycle arrest - as a shared driver
  of age-related tissue dysfunction across organs. Diverse senescence-inducing
  stresses (replicative/telomeric, oncogenic, genotoxic, oxidative) engage the
  p16INK4a/Rb and p53/p21 tumor-suppressor programs to arrest the cell; arrested
  cells can acquire a context-dependent senescence-associated secretory phenotype
  (SASP); when senescent-cell generation exceeds immune clearance,
  senescent cells accumulate, and their persistent secretome can drive
  chronic inflammation, loss of regenerative capacity, and progressive tissue
  dysfunction. This is the conserved core that recurs in osteoarthritis,
  pulmonary and other organ fibrosis, atherosclerosis, and broader aging biology.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the tissue-specific senescent cell type
  (e.g. chondrocyte in osteoarthritis, fibroblast in pulmonary fibrosis) while
  preserving the supported parts of the arrest -> SASP -> accumulation ->
  dysfunction chain. Impaired immune surveillance provides a distinct route to
  accumulation; HLA-E-mediated inhibition of NK-cell cytotoxicity is an
  experimentally supported, context-specific immune-evasion branch.
category: Module
module_categories:
- AGING
- IMMUNOLOGY
creation_date: "2026-06-23T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "cellular_senescence#Senescent Cell Accumulation"). Conforming nodes should
  substitute the organ-specific senescent cell type and retain the conserved
  causal relationships supported in the disease context. The module captures
  the senescence mechanism and two supportive biomarkers (p16INK4a expression and
  senescence-associated beta-galactosidase) plus the senolytic drug-target
  pattern, but deliberately does NOT carry disease-specific or
  context-dependent downstream theories (e.g. the age-contextualized,
  surface-counterintuitive relationship between accelerated biological aging and
  early-onset cancer). Such specific, contested, or context-dependent
  associations belong on the relevant disorder or comorbidity/trajectory entry,
  which may conforms_to or reference this module rather than embedding the theory
  here. Worked conformers: Osteoarthritis (senescent chondrocytes; PMID:28436958)
  and pulmonary fibrosis (senescent fibroblasts; PMID:28230051). Senolytic
  drug-target pattern: senescence-active treatments use target_mechanisms to link
  back to the "Senescent Cell Accumulation" node they deplete.

  A naked mole-rat (Heterocephalus glaber) comparative negative model is
  attached under animal_models. It is a species comparison, not a disease model:
  the arrest and SASP nodes are recapitulated while senescent-cell accumulation
  and the tissue-dysfunction consequence are not, and conforming disorder
  entries do NOT inherit those links. The translational caveat is recorded as a
  HUMAN_MODEL_MISMATCH discussion.

  Cell identity is represented with CL and senescence with GO biological
  processes. The HLA-E branch retains the human dermal-fibroblast context of its
  primary study and is not required of every conformer. The NK effector is not
  asserted to be senescent. Immunosenescence denotes broader immune aging and
  must not be equated with senescence of every immune cell. Escape from immune
  clearance can occur while arrest persists; escape from proliferative arrest
  is a different event. GO:0090398 retains its canonical irreversible-arrest
  definition; the review's context-dependent escape discussion is a scope
  caveat, not a local redefinition of the ontology term.
pathophysiology:
- name: Senescence-Inducing Stress
  description: >-
    A diverse set of cellular stresses initiates the senescence program: telomere
    attrition from repeated division (replicative senescence), activated oncogenes
    (oncogene-induced senescence), severe or irreparable DNA damage and chromatin
    disruption (genotoxic stress), oxidative and mitochondrial stress, and
    therapy-induced damage. Regardless of the specific insult, these converge once
    the cell senses a critical level of damage or dysfunction.
  role: trigger
  biological_processes:
  - preferred_term: DNA Damage Response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:20078217
    reference_title: "The senescence-associated secretory phenotype: the dark side of tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These stresses include telomeric dysfunction (telomere uncapping) resulting
      from repeated cell division (termed replicative senescence), mitochondrial
      deterioration, oxidative stress, severe or irreparable DNA damage and
      chromatin disruption (genotoxic stress), and the expression of certain
      oncogenes (oncogene-induced senescence)
    explanation: >-
      Enumerates the conserved set of senescence-inducing stresses that initiate
      the program. Evidence source is OTHER because this is a review.
  downstream:
  - target: Senescence-Associated Cell Cycle Arrest

- name: Senescence-Associated Cell Cycle Arrest
  description: >-
    Sensing of critical damage engages the major tumor-suppressor pathways -
    p16INK4a/Rb and p53/p21 - to impose a stable cell-cycle
    arrest. This arrest is the defining feature of senescence and is initially
    protective, preventing propagation of damage and malignant transformation of
    cells at risk. Arrest durability depends on cell type and stimulus; escape
    has been reported in some oncogene-induced contexts. Replicative senescence
    is one inducing route, not a required property of every senescent cell.
    p16INK4a and p21 are supportive features interpreted with other evidence;
    neither is a universal or sufficient marker on its own.
  role: central_effector
  biological_processes:
  - preferred_term: Cellular Senescence
    term:
      id: GO:0090398
      label: cellular senescence
  evidence:
  - reference: PMID:20078217
    reference_title: "The senescence-associated secretory phenotype: the dark side of tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the senescence growth arrest has been shown to depend on the activities of
      the major tumor-suppressor pathways controlled by p16INK4a and pRB
      (retinoblastoma protein), as well as by p53
    explanation: >-
      Establishes the p16INK4a/Rb and p53 tumor-suppressor pathways as the
      conserved effectors of the senescence-associated arrest. Evidence source is
      OTHER because this is a review.
  - reference: PMID:28729727
    reference_title: "Senescent cells: an emerging target for diseases of ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cellular senescence, which is a permanent state of cell cycle arrest induced
      by cellular stress, has recently emerged as a fundamental ageing mechanism
      that also contributes to diseases of late life, including cancer,
      atherosclerosis and osteoarthritis.
    explanation: >-
      Defines senescence as a stress-induced permanent arrest and a fundamental
      aging mechanism contributing to multiple age-related diseases, supporting
      the module's conserved-driver framing. Evidence source is OTHER (review).
  - reference: PMID:42518598
    reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      However, the stability and irreversible fate of senescent cells depend on
      both cell type and the senescence-inducing stimulus.
    explanation: >-
      Page 2, Senescent cells and their role in inflammaging. This qualifies
      universal permanence without converting transient cytostasis into
      senescence or asserting that all senescent cells can resume cycling.
  downstream:
  - target: Senescence-Associated Secretory Phenotype
  - target: Senescent Cell Accumulation

- name: Senescence-Associated Secretory Phenotype
  description: >-
    Senescent cells can adopt a secretory program whose composition depends on
    cell type and inducing stimulus. Components include cytokines, chemokines,
    growth factors, matrix-remodeling proteases, extracellular vesicles, lipids
    and nucleic acids. Autocrine signals can reinforce senescence and paracrine
    signals can induce it in neighboring cells. Immune recruitment and
    inflammatory tissue remodeling are distinct consequences; recruitment does
    not itself establish successful clearance. This node captures the persistent
    pathological secretory arm without making every SASP effect deleterious.
  role: amplifier
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
    description: >-
      A senescent producer population in the cited fibroblast work; conformers
      substitute their supported cell identity. Recipient and immune-effector
      populations do not acquire this state by association.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Cytokine Production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  - preferred_term: Cytokine-Mediated Signaling
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20078217
    reference_title: "The senescence-associated secretory phenotype: the dark side of tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most significant of these effects is the acquisition of a
      senescence-associated secretory phenotype (SASP) that turns senescent
      fibroblasts into proinflammatory cells that have the ability to promote
      tumor progression.
    explanation: >-
      Defines the SASP and its conversion of senescent cells into proinflammatory
      cells acting on the microenvironment. Evidence source is OTHER (review).
  - reference: PMID:42518598
    reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The SASP is comprised of pro-inflammatory cytokines, chemokines,
      extracellular vesicles, growth factors, lipids, nucleic acids, and proteases
    explanation: >-
      Pages 2-3, Senescent cells and their role in inflammaging. The following
      sentence makes composition dependent on cell type and trigger. Generic
      cytokine GO bindings describe components of the program, not its entirety.
  downstream:
  - target: Senescent Cell Accumulation
    description: >-
      Autocrine reinforcement and paracrine induction can sustain or expand
      the senescent population, separately from failure of immune clearance.
    evidence:
    - reference: PMID:42518598
      reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        In addition to causing tissue dysfunction, SASP factors can reinforce
        senescence in an autocrine manner and induce senescence in neighboring
        cells through paracrine signaling
      explanation: >-
        Page 3, Senescent cells and their role in inflammaging. Maintenance and
        induction provide routes to accumulation; this does not measure net
        population burden or establish senescence in every neighboring cell.
  - target: Tissue Dysfunction and Age-Related Pathology
  - target: HLA-E Display by Senescent Cells
    description: >-
      SASP-related inflammatory signaling provides an upstream route to HLA-E
      induction, with IL-6 and p38 signaling implicated in the fibroblast study.
      This branch is not asserted for all cell types or inducing stimuli.
    evidence:
    - reference: PMID:31160572
      reference_title: "Senescent cells evade immune clearance via HLA-E-mediated NK and CD8(+) T cell inhibition."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        HLA-E expression is induced by senescence-associated secretary
        phenotype-related pro-inflammatory cytokines, and is regulated by p38
        MAP kinase signalling in vitro.
      explanation: >-
        Abstract and Results, Figure 2: p38 inhibition reduced HLA-E induction,
        while SASP-conditioned medium and IL-6 also induced HLA-E on
        non-senescent recipient fibroblasts. These results support a secretory
        signaling route rather than arrest itself as the causal parent. The
        source spelling secretary is retained verbatim; HLA-E expression alone
        does not identify a senescent cell.

- name: HLA-E Display by Senescent Cells
  description: >-
    Experimentally senescent human dermal fibroblasts express HLA-E, providing
    a ligand for inhibitory NKG2A on immune effectors. This describes the target
    population's immune-evasion machinery, not a new fibroblast identity or a
    universal senescence marker. Functional blockade evidence comes from cell
    culture; human skin observations support tissue relevance without measuring
    the contribution of this route to whole-organism senescent-cell burden.
    Disease conformers must establish their own target-cell identity and HLA-E
    mechanism; the reusable node name does not generalize the skin evidence.
  role: amplifier
  biological_scale: CELLULAR
  genes:
  - preferred_term: HLA-E
    term:
      id: hgnc:4962
      label: HLA-E
    description: Gene encoding the HLA-E inhibitory ligand displayed by the target cell.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
    description: The senescent target population in this experimental branch.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
  evidence:
  - reference: PMID:31160572
    reference_title: "Senescent cells evade immune clearance via HLA-E-mediated NK and CD8(+) T cell inhibition."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: senescent dermal fibroblasts express the non-classical MHC molecule HLA-E
    explanation: >-
      Abstract; Results, Senescent cells express atypical MHC molecules; Figure
      1. The primary study establishes HLA-E as the ligand. The supplied review
      discusses this on page 5; its HLE-A spelling is not used as an entity name.
  downstream:
  - target: Reduced NK-Cell Cytotoxicity toward Senescent Cells
    description: >-
      Target-cell HLA-E engages inhibitory NKG2A on NK cells. The primary study
      also examines highly differentiated CD8-positive T cells; this branch
      explicitly models the NK effector to keep the participant roles separate.
    evidence:
    - reference: PMID:31160572
      reference_title: "Senescent cells evade immune clearance via HLA-E-mediated NK and CD8(+) T cell inhibition."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: blocking the interaction between HLA-E and NKG2A boosts immune responses
      explanation: >-
        The blockade result supports an inhibitory interaction through
        perturbation. It does not establish clinical efficacy or the effect
        size of this pathway in every tissue.

- name: Reduced NK-Cell Cytotoxicity toward Senescent Cells
  description: >-
    Inhibitory HLA-E/NKG2A signaling reduces NK-cell responses against the
    senescent fibroblast target. The NK cell is an inhibited effector; this
    mechanism does not assert that it is itself senescent or exhausted.
  role: effector
  biological_scale: CELLULAR
  genes:
  - preferred_term: KLRC1
    term:
      id: hgnc:6374
      label: KLRC1
    description: Gene encoding NKG2A, the inhibitory receptor subunit on the NK effector.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
    modifier: DECREASED
  evidence:
  - reference: PMID:31160572
    reference_title: "Senescent cells evade immune clearance via HLA-E-mediated NK and CD8(+) T cell inhibition."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: blocking the interaction between HLA-E and NKG2A boosts immune responses
    explanation: >-
      The study measures immune responses against senescent cells in vitro;
      blockade of the inhibitory interaction supports reduced cytotoxicity
      when that interaction is intact.
  downstream:
  - target: Impaired Immune Clearance of Senescent Cells
    description: Reduced target-cell killing provides one route to impaired clearance.
    evidence:
    - reference: PMID:31160572
      reference_title: "Senescent cells evade immune clearance via HLA-E-mediated NK and CD8(+) T cell inhibition."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: blocking the interaction between HLA-E and NKG2A boosts immune responses
      explanation: >-
        This links the cytotoxicity result to the clearance mechanism. Net
        senescent-cell accumulation in human tissues remains an extrapolation
        beyond the in-vitro blockade assay.

- name: Impaired Immune Clearance of Senescent Cells
  description: >-
    Age-associated changes in innate and adaptive immunity can compromise
    surveillance and elimination of senescent cells. Target-cell immune evasion
    is a separate contributing route, exemplified by the HLA-E branch. These
    defects can increase persistence even without increased induction of
    senescence. Recruitment, recognition, cytotoxic killing and phagocytic
    removal are distinct steps whose limiting contribution varies by tissue.
  role: amplifier
  biological_processes:
  - preferred_term: immune effector process
    term:
      id: GO:0002252
      label: immune effector process
    modifier: DECREASED
  evidence:
  - reference: PMID:42518598
    reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      These age-related changes in immune function can compromise
      immunosurveillance, further exacerbating senescent cell burden and its
      effects.
    explanation: >-
      Page 1, Abstract; expanded on pages 5-6, Immunosenescence impairs
      immunosurveillance. This is review synthesis about clearance failure,
      not evidence that every immune participant has entered cellular senescence.
  downstream:
  - target: Senescent Cell Accumulation
    description: Reduced immune elimination allows senescent cells to persist.
    evidence:
    - reference: PMID:42518598
      reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        These age-related changes in immune function can compromise
        immunosurveillance, further exacerbating senescent cell burden and its
        effects.
      explanation: >-
        The review explicitly connects impaired surveillance to burden.
        Accumulation is a population outcome, not a measurement of the rate
        at which individual cells enter senescence.

- name: Senescent Cell Accumulation
  description: >-
    When clearance and regeneration are effective, a senescent population can
    be transient even if its individual cells remain arrested until elimination.
    In aged or pathological tissue, generation and persistence can outpace
    elimination, so senescent cells accumulate. The
    accumulated burden, sustained by the SASP and impaired immune surveillance,
    is the rate-limiting reservoir that selective elimination (senolysis)
    targets.
  role: effector
  biological_processes:
  - preferred_term: Cellular Senescence
    term:
      id: GO:0090398
      label: cellular senescence
  evidence:
  - reference: PMID:24954210
    reference_title: "Cellular senescence: from physiology to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This sequence of events - senescence, followed by clearance and then
      regeneration - may not be efficiently completed in aged tissues or in
      pathological contexts, thereby resulting in the accumulation of senescent
      cells.
    explanation: >-
      Describes failure of the senescence-clearance-regeneration cycle in aged or
      pathological tissue as the cause of senescent cell accumulation. Evidence
      source is OTHER (review).
  - reference: PMID:20078217
    reference_title: "The senescence-associated secretory phenotype: the dark side of tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Senescent cells have been shown to accumulate over the life span of
      rodents, nonhuman primates, and humans
    explanation: >-
      Documents accumulation of senescent cells with age across species. Evidence
      source is OTHER (review).
  downstream:
  - target: Tissue Dysfunction and Age-Related Pathology

- name: Tissue Dysfunction and Age-Related Pathology
  description: >-
    The persistent senescent-cell burden and its chronic inflammatory secretome
    degrade tissue function: chronic sterile inflammation, decline of regenerative
    and stem-cell capacity, and disruption of tissue architecture. This is the
    conserved consequence by which senescence contributes causally to age-related
    diseases; the specific organ pathology (cartilage degradation, lung fibrosis,
    vascular plaque) is supplied by the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:29477613
    reference_title: "Hallmarks of Cellular Senescence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cellular senescence is a permanent state of cell cycle arrest that promotes
      tissue remodeling during development and after injury, but can also
      contribute to the decline of the regenerative potential and function of
      tissues, to inflammation, and to tumorigenesis in aged organisms.
    explanation: >-
      States the consequence arm of the module: senescence contributes to
      declining tissue regenerative capacity, inflammation, and tumorigenesis in
      aged tissue. Evidence source is OTHER (review).
  - reference: PMID:22048312
    reference_title: "Clearance of p16Ink4a-positive senescent cells delays ageing-associated disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data indicate that cellular senescence is causally implicated in
      generating age-related phenotypes and that removal of senescent cells can
      prevent or delay tissue dysfunction and extend healthspan.
    explanation: >-
      In vivo genetic clearance of p16Ink4a-positive senescent cells in mice
      establishes senescent cell accumulation as a causal driver of age-related
      tissue dysfunction. Evidence source is MODEL_ORGANISM (transgenic mouse).
biochemical:
- name: Elevated p16INK4a (CDKN2A) expression
  presence: INCREASED
  context: >-
    Human idiopathic pulmonary fibrosis lung tissue; the cited expression
    profiles measure transcripts, with protein localization assessed separately.
  biomarker_term:
    preferred_term: CDKN2A (p16INK4a) transcript expression
  notes: >-
    Increased expression is supportive when interpreted with additional
    senescence features and the cell population assayed. The cited human lung
    association does not establish a universal senescent-cell count or a
    prospective prognostic test. No protein ontology term is used to identify
    the transcript measurement; assay probes and isoform specificity require
    source-specific interpretation.
  evidence:
  - reference: PMID:28230051
    reference_title: "Cellular senescence mediates fibrotic pulmonary disease."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we demonstrate elevated abundance of senescence biomarkers in IPF
      lung, with p16 expression increasing with disease severity.
    explanation: >-
      Results, first paragraph and Figure 1a: human IPF expression profiling
      associates p16 transcripts with disease severity. Separate staining
      localizes p16 protein; these are different measurements.
  readouts:
  - target: Senescence-Associated Cell Cycle Arrest
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: >-
      Elevated p16INK4a expression supports a senescence-associated arrest
      interpretation in conjunction with other observations. The IPF severity
      association is not automatically transferable to conforming diseases.
    evidence:
    - reference: PMID:28230051
      reference_title: "Cellular senescence mediates fibrotic pulmonary disease."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we demonstrate elevated abundance of senescence biomarkers in IPF
        lung, with p16 expression increasing with disease severity.
      explanation: >-
        The tissue association supports a contextual biomarker interpretation;
        it does not directly measure durable arrest in each expressing cell or
        establish future clinical outcome prediction.
- name: Senescence-associated beta-galactosidase activity
  context: >-
    Activity measured at pH 6.0, interpreted together with other senescence
    features in the relevant tissue or cultured cell population.
  assays:
  - preferred_term: senescence-associated beta-galactosidase activity assay at pH 6.0
  biomarker_term:
    preferred_term: senescence-associated beta-galactosidase
    term:
      id: NCIT:C107438
      label: Beta-Galactosidase
  notes: >-
    SA-beta-gal is a supportive enzymatic feature, not a universal or sufficient
    state classifier. The NCIT binding identifies beta-galactosidase, not a
    senescence-specific enzyme or an assay. Population burden requires a defined
    cell population, denominator, and multiple supporting features; no universal
    positivity threshold or diagnostic performance is asserted here.
  evidence:
  - reference: PMID:29477613
    reference_title: "Hallmarks of Cellular Senescence."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      the nonspecificity of current senescence markers and the existence of
      different senescence programs strongly limit these tasks
    explanation: >-
      The Hallmarks of Cellular Senescence review emphasizes that senescence
      markers (including SA-beta-gal) are individually nonspecific, supporting use
      of SA-beta-gal as a supportive rather than definitive readout.
  readouts:
  - target: Senescence-Associated Cell Cycle Arrest
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    interpretation: >-
      SA-beta-gal activity supports a senescence-associated state interpretation
      alongside arrest and other molecular features. It does not independently
      demonstrate durable arrest or quantify the total senescent-cell burden.
    evidence:
    - reference: PMID:42518598
      reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        While no universal marker for senescent cells exists, they develop a
        signature marked by molecular and phenotypic changes including
        morphological changes, expression of cyclin-dependent kinase inhibitors
        (p16INK4a, and p21CIP1), loss of nuclear structure and release of chromatin
        fragments into the cytoplasm, DNA damage signaling, enzymatic changes
        including senescence-associated β-galactosidase (SA-β-Gal) activity at
        pH 6.0, and the adoption of a secretory phenotype
      explanation: >-
        Page 2, Senescent cells and their role in inflammaging. The review
        explicitly rejects a universal marker and places this activity within a
        collection of features. The readout is supportive, not a stand-alone
        diagnostic or a direct assay of proliferation arrest.
treatments:
- name: Senolytic Therapy (Dasatinib plus Quercetin)
  description: >-
    Senolytics are drugs that selectively kill senescent cells by disabling their
    pro-survival (anti-apoptotic) networks, thereby depleting the accumulated
    senescent-cell reservoir. The prototypical combination is dasatinib plus
    quercetin (D+Q). Distinct from senomorphics, which instead suppress the SASP
    without killing the cells. Represents the senescence drug-target design
    pattern for conforming disorders.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dasatinib
      term:
        id: CHEBI:49375
        label: dasatinib (anhydrous)
    - preferred_term: quercetin
      term:
        id: CHEBI:16243
        label: quercetin
  target_mechanisms:
  - target: Senescent Cell Accumulation
    treatment_effect: INHIBITS
    description: >-
      Senolytics selectively eliminate senescent cells, depleting the accumulated
      burden that sustains the pathogenic SASP and downstream tissue dysfunction.
  evidence:
  - reference: PMID:25754370
    reference_title: "The Achilles' heel of senescent cells: from transcriptome to senolytic drugs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we describe the rationale for identification and validation of a new
      class of drugs termed senolytics, which selectively kill senescent cells.
    explanation: >-
      Defines senolytics as agents that selectively kill senescent cells,
      establishing the drug-target rationale. Evidence source is IN_VITRO
      (transcriptomic discovery and cell-based validation).
  - reference: PMID:28436958
    reference_title: "Local clearance of senescent cells attenuates the development of post-traumatic osteoarthritis and creates a pro-regenerative environment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that SnCs accumulated in the articular cartilage and synovium after
      ACLT, and selective elimination of these cells attenuated the development of
      post-traumatic OA, reduced pain and increased cartilage development.
    explanation: >-
      In a mouse osteoarthritis model, selective elimination of senescent cells
      attenuates disease, validating the senolytic target. Evidence source is
      MODEL_ORGANISM (transgenic and aged mice).

experimental_models:
- name: Outer Biosciences long-term ex vivo human skin platform (aged-donor senolytic arm)
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  cell_source: >-
    Primary full-thickness skin explants (8 mm biopsies) from aged human donors
    (58 to 74 years) from surgical excision
  culture_system: >-
    Air-liquid interface culture of native full-thickness skin on a 3D-printed
    high-porosity gyroid insert in an SBS 24-well format, maintained up to three
    weeks with repeated basal-media dosing
  conditions:
  - Aged donor skin (58 to 74 years), vehicle
  - Dasatinib (50 nM)
  - Dasatinib (50 nM) plus quercetin (10 uM), senolytic combination
  publication: DOI:10.64898/2026.04.30.721933
  notes: >-
    Source is a bioRxiv preprint (DOI:10.64898/2026.04.30.721933), not yet
    peer-reviewed. Evidence snippets quote the cached abstract; figure-level
    detail is summarized in prose.
  description: >-
    An ex vivo human skin platform used to probe delayed senolytic-associated
    responses in aged donor tissue. Full-thickness skin from aged donors was
    maintained for three weeks with repeated exposure to the senolytic tyrosine
    kinase inhibitor dasatinib, or dasatinib plus quercetin (D plus Q). Both
    treatments reduced a published skin senescence signature (SenSkin) and an
    inflammaging signature, downregulated canonical SASP-associated,
    inflammatory, and matrix-remodeling genes, and lowered secreted IL-6 and
    MMP1 at Week 3. The extended culture window captured responses that emerged
    only late, consistent with the delayed senolytic kinetics reported in vivo.
  modeled_mechanisms:
  - target: Senescent Cell Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Native full-thickness skin from aged human donors sustains a
      senescence-associated transcriptional state (a published SenSkin skin
      senescence signature and an inflammaging signature) over three weeks of ex
      vivo culture, providing an aged human-tissue reservoir on which senolytic
      elimination can act.
    limitations: >-
      The senescent burden is inferred from transcriptomic signatures rather than
      direct single-cell quantification (for example p16INK4a or
      SA-beta-galactosidase staining) in this arm, and is subject to
      donor-to-donor variability inherent to primary explants.
    readouts:
    - name: Skin senescence signature (SenSkin) and inflammaging signature
      target: Senescent Cell Accumulation
      interpretation: >-
        The preprint reports that aged donor tissue sustains measurable SenSkin and
        inflammaging transcriptional scores in culture, the baseline against which
        senolytic reduction is measured; these signatures are shown in the preprint
        figures, not the cached abstract.
    evidence:
    - reference: DOI:10.64898/2026.04.30.721933
      reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using aged donor tissue, prolonged senolytic-associated treatment attenuated inflammatory and remodeling pathways."
      explanation: >-
        Establishes aged human skin in the platform as an informative reservoir
        of the senescence-associated state targeted by senolysis.
  - target: Senescence-Associated Secretory Phenotype
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Three weeks of senolytic dasatinib, or dasatinib plus quercetin, attenuate
      the SASP-associated program in aged skin, downregulating canonical
      SASP, inflammatory, and matrix-remodeling genes and lowering secreted IL-6
      and MMP1, with broadly similar effects between the two treatments.
    limitations: >-
      Earlier time points showed minimal transcriptional or protein-level
      response, so the rescue is a delayed effect apparent only by Week 3; the two
      senolytic regimens were not clearly separated in this system.
    readouts:
    - name: SASP mediators and senescence-associated scores under senolytic treatment
      target: Senescence-Associated Secretory Phenotype
      direction: DECREASED
      interpretation: >-
        The preprint reports that dasatinib and dasatinib plus quercetin reduced
        secreted IL-6 and MMP1 and lowered the SenSkin and inflammaging scores
        relative to vehicle at Week 3; these per-analyte and per-score values are
        shown in the preprint figures, not the cached abstract.
    evidence:
    - reference: DOI:10.64898/2026.04.30.721933
      reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using aged donor tissue, prolonged senolytic-associated treatment attenuated inflammatory and remodeling pathways."
      explanation: >-
        Supports a RESCUES link in which senolytic elimination lowers the
        SASP-associated inflammatory and remodeling program.

animal_models:
- name: Naked mole-rat (Heterocephalus glaber) comparative longevity model
  species: Naked mole-rat
  genotype: Wild type
  publication: PMID:29432174
  description: >-
    The naked mole-rat is a mouse-sized subterranean eusocial rodent with a
    maximum lifespan over 30 years and an age-specific mortality hazard that
    does not rise with age. It is curated here as a comparative negative model
    rather than as a disease model: the early steps of this module (stress
    sensing, senescence-associated arrest, SASP induction) are present in naked
    mole-rat cells, while the late steps this module builds its pathology on
    (senescent-cell accumulation and the resulting tissue dysfunction) are not
    observed over a lifespan an order of magnitude longer than the mouse. The
    model is informative because it dissociates the two halves of the chain,
    which no short-lived rodent model does.
  modeled_mechanisms:
  - target: Senescence-Associated Cell Cycle Arrest
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Naked mole-rat cells run the senescence program itself. Senescence is
      seen developmentally in multiple tissues, after oncogenic Ras
      transfection, and after ionizing radiation, so an absence of senescence
      competence is not the explanation for this species' longevity.
    limitations: >-
      Induction thresholds differ from the mouse: naked mole-rat cells need a
      higher radiation dose to be driven into senescence and their fibroblasts
      resist radiation-induced apoptosis, so the arrest and the death decision
      are set differently even where the program is shared. The oncogene and
      irradiation arms are cultured-fibroblast experiments, and the p16INK4a
      and p53/p21 arms of the human pathway were not dissected separately.
    readouts:
    - name: Developmentally programmed senescence in tissue
      target: Senescence-Associated Cell Cycle Arrest
      description: >-
        Senescence staining of nail bed, skin dermis, hair follicle and
        nasopharyngeal cavity in naked mole-rat embryos and pups.
      direction: INCREASED
      interpretation: >-
        Establishes that the arrest node is executed in vivo in this species.
      evidence:
      - reference: PMID:29432174
        reference_title: "Naked mole rats can undergo developmental, oncogene-induced and DNA damage-induced cellular senescence."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We report that the NMR displays developmentally programmed cellular
          senescence in multiple tissues
        explanation: >-
          Reports the in vivo tissues in which programmed senescence was
          detected in this species.
    - name: Senescence induction by oncogenic Ras
      target: Senescence-Associated Cell Cycle Arrest
      direction: INCREASED
      interpretation: >-
        Oncogene-induced senescence, the tumour-suppressive arm of this node, is
        intact in naked mole-rat cells.
      evidence:
      - reference: PMID:29432174
        reference_title: "Naked mole rats can undergo developmental, oncogene-induced and DNA damage-induced cellular senescence."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          NMR cells also underwent cellular senescence when transfected with
          oncogenic Ras.
        explanation: >-
          Direct demonstration of oncogene-induced senescence in cultured naked
          mole-rat cells.
    evidence:
    - reference: PMID:29432174
      reference_title: "Naked mole rats can undergo developmental, oncogene-induced and DNA damage-induced cellular senescence."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We conclude that the NMR displays the same types of cellular senescence
        found in a short-lived rodent.
      explanation: >-
        The authors' summary judgement that the senescence program modelled by
        this node is shared with the short-lived comparator species.
    - reference: PMID:29432174
      reference_title: "Naked mole rats can undergo developmental, oncogene-induced and DNA damage-induced cellular senescence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, NMR cells required a higher dose of IR for induction of
        cellular senescence, and NMR fibroblasts were resistant to IR-induced
        apoptosis.
      explanation: >-
        Records the quantitative difference in induction threshold and the
        divergent apoptosis decision, which is why fidelity is qualified in
        limitations rather than left implicit.
  - target: Senescence-Associated Secretory Phenotype
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Senescent naked mole-rat cells induce SASP genes as mouse cells do, but
      the wider transcriptional response is not the same: down-regulation of DNA
      metabolism, transcription and translation is more profound than in the
      mouse.
    limitations: >-
      The comparison is a gene-expression one in cultured cells. Secreted SASP
      protein output, its paracrine effect on neighbouring cells, and whether
      the SASP recruits immune clearance in naked mole-rat tissue - the facets
      this node actually asserts - were not measured.
    evidence:
    - reference: PMID:29432174
      reference_title: "Naked mole rats can undergo developmental, oncogene-induced and DNA damage-induced cellular senescence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        similar to mice, NMR cells up-regulated senescence-associated secretory
        phenotype genes but displayed more profound down-regulation of DNA
        metabolism, transcription, and translation than mouse cells
      explanation: >-
        Supports SASP induction as shared while naming the transcriptional
        divergence that makes this a partial rather than full recapitulation.
  - target: Senescent Cell Accumulation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Despite running the senescence program, naked mole-rats are not reported
      to accumulate a senescent-cell burden or the pathology attributed to it,
      and their cells actively hold the senescent state off through a
      beta-catenin-driven cholesterol and lipid-droplet program whose removal
      is sufficient to induce senescence-like phenotypes.
    limitations: >-
      This is a negative claim resting on absence of reported age-related
      pathology plus a cell-autonomous resistance mechanism, not on a
      quantitative census: p16INK4a-positive or SA-beta-gal-positive cell
      burden has not been counted across the naked mole-rat lifespan in the way
      it has in mouse and human tissue, so "does not accumulate" is not
      distinguishable here from "has not been measured". The beta-catenin
      result is a cultured-fibroblast experiment in one laboratory's cells.
      Immune clearance capacity, the other half of what this node asserts, is
      untested in this species.
    readouts:
    - name: Senescence-like phenotype after beta-catenin ablation
      target: Senescent Cell Accumulation
      description: >-
        Loss of lipid droplets and appearance of senescence-like phenotypes in
        naked mole-rat fibroblasts after beta-catenin ablation or inhibition of
        cholesterol synthesis.
      direction: INCREASED
      interpretation: >-
        Senescence resistance in this species is an actively maintained state:
        removing the program restores the senescence phenotype this node
        describes.
      evidence:
      - reference: PMID:33742113
        reference_title: "β-catenin-promoted cholesterol metabolism protects against cellular senescence in naked mole-rat cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Ablation of β-catenin or inhibition of cholesterol synthesis abolished
          lipid droplet formation and induced senescence-like phenotypes
          accompanied by increased oxidative stress.
        explanation: >-
          Shows the resistance is dependent on an identified pathway rather than
          being a passive species difference.
    evidence:
    - reference: PMID:21993625
      reference_title: Genome sequencing reveals insights into physiology and longevity of the naked mole rat.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Naked mole rats show negligible senescence, no age-related increase in
        mortality, and high fecundity until death.
      explanation: >-
        States the organism-level phenotype this link asserts. Graded OTHER
        because the sentence is a background characterisation of the species in
        a genome-sequencing paper, not a result that paper measured.
    - reference: PMID:33742113
      reference_title: "β-catenin-promoted cholesterol metabolism protects against cellular senescence in naked mole-rat cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we suggest that β-catenin in NMRs functions to offset senescence by
        regulating cholesterol metabolism
      explanation: >-
        Names a cell-autonomous mechanism by which this species holds off the
        state that accumulates in this node.
  - target: Tissue Dysfunction and Age-Related Pathology
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The consequence node of this module is not reached in the naked mole-rat
      on any timescale so far observed: age-associated physiological decline is
      delayed or attenuated and the hazard of death does not rise with age.
    limitations: >-
      The supporting argument is demographic and organism-level, drawn from a
      historical compendium of captive-colony records, so it shows that
      age-related mortality is absent rather than that senescence-driven tissue
      dysfunction specifically is absent. Captive animals are protected from
      the extrinsic mortality that shapes wild demography, and the same dataset
      has been re-analysed by others. The absence of an age-related mortality
      increase also does not identify which node of this chain is broken; the
      proteostasis and genome-maintenance modules carry competing candidate
      explanations for the same phenotype.
    readouts:
    - name: Age-specific mortality hazard
      target: Tissue Dysfunction and Age-Related Pathology
      description: >-
        Kaplan-Meier and hazard analysis of more than 3000 naked mole-rat
        lifespan data points from captive colonies.
      direction: UNCHANGED
      interpretation: >-
        A flat hazard with age is the organism-level readout of a species in
        which this consequence node is not reached.
      evidence:
      - reference: PMID:29364116
        reference_title: Naked Mole-Rat mortality rates defy gompertzian laws by not increasing with age.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the age-specific hazard of mortality did not increase with age, even
          at ages 25-fold past their time to reproductive maturity
        explanation: >-
          The measured demographic result behind this readout.
    evidence:
    - reference: PMID:29364116
      reference_title: Naked Mole-Rat mortality rates defy gompertzian laws by not increasing with age.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        exhibits delayed and/or attenuated age-associated physiological
        declines
      explanation: >-
        States the absence of the age-related functional decline that this node
        asserts as the conserved consequence of senescent-cell burden.
- name: Turquoise killifish senescence-marker strain pair (Nothobranchius furzeri GRZ vs MZM)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Short-lived laboratory strain GRZ (maximum age 3-4 months) compared against the
    longer-lived wild-derived MZM strains (6-10 months), with primary cell cultures
    established from both.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:22445733
  description: >-
    The turquoise killifish is the shortest-lived vertebrate that can be bred in
    captivity and displays the classical organismal hallmarks of aging within
    months. Graf and colleagues used the natural lifespan difference between the
    GRZ and MZM strains to ask whether cellular senescence tracks organismal
    aging in this species. In vivo, cell cycle inhibitor expression rose with age
    only in the longer-lived strain; in vitro, primary cultures from both strains
    failed to enter replicative senescence at all. The model is therefore
    informative about this module chiefly as a dissociation experiment: it
    separates organismal aging from the replicative-senescence program that the
    module places downstream of senescence-inducing stress.
  modeled_mechanisms:
  - target: Senescence-Associated Cell Cycle Arrest
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Primary cells cultured from both a short-lived and a long-lived killifish
      strain do not undergo replicative senescence, so this model does not
      reproduce the stable, telomere-driven proliferative arrest that the module
      places at the core of the senescence program.
    limitations: >-
      The negative result is specific to replicative senescence in cultured cells
      and does not exclude stress-induced or oncogene-induced senescence in vivo.
      The authors attribute the absence of arrest to sustained telomerase activity
      and maintained telomere length, a teleost trait not shared by human somatic
      cells, in which telomerase is silenced and replicative senescence is the
      normal endpoint of serial passage. Conclusions about human senescence
      biology should not be transferred from this model without corroboration in
      human cells; conversely, the dissociation it demonstrates is a caution
      against treating organismal lifespan as a proxy for senescent burden.
    readouts:
    - name: Onset of replicative senescence in long-term primary culture
      target: Senescence-Associated Cell Cycle Arrest
      description: >-
        Serial passage of primary killifish cell cultures from both strains,
        scored by morphology, population doubling time, and expression of the cell
        cycle inhibitors Cdkn1a and Cdkn2a/b.
      direction: UNCHANGED
      interpretation: >-
        No arrest emerged over long-term culture in either strain, so the
        senescence-associated cell cycle arrest node has no counterpart in this
        model system.
      evidence:
      - reference: PMID:22445733
        reference_title: Absence of replicative senescence in cultured cells from the short-lived killifish Nothobranchius furzeri.
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "we demonstrate here the absence of replicative senescence as analysed by morphology, expression of Cdkn1a and Cdkn2a/b, population doubling times"
        explanation: Reports the passage experiment and its negative result across both strains.
    - name: Telomerase activity and telomere length in cultured cells
      target: Senescence-Associated Cell Cycle Arrest
      description: >-
        Telomerase activity and telomere length measured in the same cultures, as
        the proposed explanation for the missing arrest.
      direction: UNCHANGED
      interpretation: >-
        Maintained telomeres remove the trigger that drives replicative senescence
        in human somatic cells, which is why the arrest node is absent here rather
        than merely delayed.
      evidence:
      - reference: PMID:22445733
        reference_title: Absence of replicative senescence in cultured cells from the short-lived killifish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We reason this to be on account of sustained telomerase activity and maintained telomeric length."
        explanation: Gives the mechanistic reason the arrest node fails to appear in this model.
    evidence:
    - reference: PMID:22445733
      reference_title: Absence of replicative senescence in cultured cells from the short-lived killifish Nothobranchius furzeri.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "we demonstrate here the absence of replicative senescence as analysed by morphology, expression of Cdkn1a and Cdkn2a/b, population doubling times"
      explanation: >-
        Substantiates the negative claim that this model does not reproduce the
        replicative-senescence arrest node.
  - target: Senescent Cell Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      In skin, the cell cycle inhibitors Cdkn1a and Cdkn2a/b rise with age in the
      longer-lived MZM strain but not in the short-lived GRZ strain, so the
      accumulation node is reproduced in one strain and absent in the other.
    limitations: >-
      Only inhibitor transcript levels were measured; no senescence-associated
      secretory phenotype, senescence-associated beta-galactosidase, or
      single-cell burden estimate was reported, so this is a marker proxy rather
      than a direct count of senescent cells. Because the strain in which markers
      rise is the one that lives longer, the authors read the signal as tracking
      chronological rather than biological age, which is the opposite of the
      relationship the module asserts between senescent burden and functional
      decline.
    readouts:
    - name: Cdkn1a and Cdkn2a/b expression in aging skin
      target: Senescent Cell Accumulation
      description: >-
        Transcript levels of Tp53, Cdkn1a, and Cdkn2a/b in skin of young versus
        old fish of both strains.
      direction: INCREASED
      interpretation: >-
        The increase is confined to the long-lived MZM strain; the short-lived GRZ
        strain shows no change, which is why this link is graded as partial.
      evidence:
      - reference: PMID:22445733
        reference_title: Absence of replicative senescence in cultured cells from the short-lived killifish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Expression of Tp53, Cdkn1a and Cdkn2a/b in skin revealed no change in the short-lived GRZ but increased expression of the cell cycle inhibitors Cdkn1a and Cdkn2a/b in the long-lived MZM strain with age."
        explanation: Reports the in vivo marker measurement and its strain dependence.
    evidence:
    - reference: PMID:22445733
      reference_title: Absence of replicative senescence in cultured cells from the short-lived killifish Nothobranchius furzeri.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This suggests that expression of distinct cell cycle inhibitors reflects rather chronological than biological age in N. furzeri."
      explanation: >-
        The authors' own reading of what the marker signal does and does not
        establish, which is why this link is informative but graded LOW fidelity.
  notes: >-
    Curated as part of a tranche adding turquoise killifish models across the
    hallmarks-of-aging modules. This entry is deliberately anchored on a negative
    result: the killifish is the standard short-lived vertebrate aging model, yet
    it does not reproduce replicative senescence in culture, and its in vivo
    senescence markers track the longer-lived strain. Both facts matter when
    reading killifish evidence cited for this module elsewhere.
discussions:
- discussion_id: gap_immune_rejuvenation_vs_senescence_clearance
  prompt: >-
    Which benefits of immune rejuvenation are mediated by improved clearance
    of senescent cells, and which arise through other immune functions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Immune Clearance of Senescent Cells
  - pathophysiology#Senescent Cell Accumulation
  rationale: >-
    Improved immune function, reduced inflammatory signaling, and elimination
    of senescent cells are different intervention outcomes. The review discusses
    checkpoint and engineered immune-cell approaches, but does not establish a
    general human therapeutic benefit through this specific mechanism. Tissue,
    target population, and the limiting recognition or effector step need to be
    resolved before disease-specific treatment claims are made. Other reviewed
    evasion routes, including CD47/SIRP-alpha, ligand shedding, PD-L1/PD-1, GD3,
    FasL and suppressive secretions, require source-specific assessment rather
    than extrapolation from the dermal-fibroblast HLA-E experiment.
  evidence:
  - reference: PMID:42518598
    reference_title: "Escape and evasion: when immunosurveillance of senescent cells goes wrong."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      it remains to be seen whether these interventions are enhancing
      immunosurveillance of senescent cells (either directly or indirectly) or
      whether their benefits are derived through other mechanisms such as
      restoring immune resolution or ameliorating the pathogenic features that
      accumulate in some aged immune cells
    explanation: >-
      Page 6, Conclusion. The review explicitly leaves the mediating mechanism
      unresolved; proposed immune-restoration strategies are not established
      disease-specific treatment recommendations.
- discussion_id: gap_senescence_vs_plasma_cell_type_aging_clocks
  prompt: >-
    Do cell-type-specific plasma proteomic aging clocks report senescent-cell
    burden, or a distinct axis of cellular aging that this module does not model?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Senescent Cell Accumulation
  - pathophysiology#Senescence-Associated Secretory Phenotype
  rationale: >-
    This module carries two biomarkers, p16INK4a and SA-beta-gal, and both are
    tissue assays: they need a biopsy or a model system, which is precisely what
    has kept senescent-cell burden out of population-scale study. A separate
    class of blood-based marker now claims to measure cellular aging at scale.
    Cell-type-specific plasma proteomic clocks estimate the biological age of
    over 40 cell types from one blood draw, and the burden they measure behaves
    the way senescent-cell burden is theorized to: it is heterogeneous across
    cell types within an individual, it accumulates, and it shows a graded
    dose-response with survival, from about 90% 15-year survival in normal agers
    to about 34% in those with more than 20 extremely aged cell types. A
    composite polycellular aging risk score built from these clocks stratified
    mortality across cohorts and across two proteomic platforms, and its authors
    propose it as a platform-agnostic biomarker of healthspan.

    The open question is whether these two measurement classes are reporting the
    same biology. Three readings are live and this module does not currently
    choose between them. (1) The clocks are a scalable proxy for senescent-cell
    burden, in which case they belong as biomarkers of this module's
    accumulation node and the SASP is the plausible route by which a senescent
    cell alters the plasma proteome. (2) They report a broader cellular-aging
    axis of which senescence is only one component, in which case wiring them
    here would overstate what they measure. (3) They report a partly orthogonal
    signal - the protective arm is suggestive here, since youthful immune and
    neuronal lineages conferred survival at or above that of normal agers, which
    is a resilience claim this module has no node for at all.

    The curation consequence is concrete and is why this gap is recorded rather
    than resolved. The five cell-type aging-clock biomarkers curated in this KB
    (astrocyte, oligodendrocyte precursor cell and inhibitory neuron on
    Alzheimer_Disease; skeletal myocyte and cardiomyocyte on
    Amyotrophic_Lateral_Sclerosis; alveolar type 2 and respiratory epithelial on
    Lung_Carcinoma; myeloid lineage on Type_2_Diabetes_Mellitus; NEFL-C1QL2
    projection neuron on Frontotemporal_Dementia) were deliberately NOT attached
    to this module, because none of the underlying work measures a senescence
    marker. Resolving this question either brings that whole set into
    conformance here or confirms it belongs outside. Note also that the source
    study is indexed under Cellular Senescence in MeSH while making no senescence
    measurement of its own, which is exactly the kind of indexing-by-association
    that would let an unexamined conformance edge in.
  proposed_experiments:
  - experiment_id: exp_senescence_clock_tissue_concordance
    name: Joint tissue-senescence and plasma-clock measurement in the same individuals
    description: >-
      In a cohort with both banked plasma and matched tissue (surgical or
      post-mortem), measure p16INK4a expression and SA-beta-gal positivity in the
      tissue alongside the cell-type plasma proteomic age gap for the matching
      cell type, and test whether the age gap tracks senescent-cell burden in the
      cell type it names. A positive result licenses wiring these clocks to the
      Senescent Cell Accumulation node; a null result establishes them as a
      distinct axis. Post-mortem brain with matched ante-mortem plasma is the
      most tractable starting design given the neurodegenerative clocks are the
      best characterized.
  - experiment_id: exp_senolytic_pharmacodynamic_clock_response
    name: Senolytic intervention as a pharmacodynamic test
    description: >-
      In a senolytic trial, test whether cell-type plasma proteomic age gaps fall
      after senescent-cell clearance. If the clocks are reporting senescent-cell
      burden they should move; if they are reporting a broader aging axis they
      should be substantially unchanged despite a measured fall in tissue p16.
      This is the cleaner discriminator of the two experiments because it
      perturbs rather than observes, and it would simultaneously test the clocks
      as pharmacodynamic markers for this module's own drug-target pattern.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We observed that 20-25% of individuals exhibited accelerated aging in a single cell type and 1-3% in 10 or more cell types.
    explanation: >-
      Establishes that the burden these clocks measure is heterogeneous across
      cell types within individuals, which is the property that makes them a
      candidate proxy for senescent-cell burden. PARTIAL because the study
      measures no senescence marker.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: individuals with normal aging profiles maintained ~90% survival, whereas those with over 20 extremely aged cell types showed ~34% survival over a 15-year follow-up period
    explanation: >-
      The dose-response between accumulated cellular aging burden and survival,
      which is the behaviour this module predicts for senescent-cell accumulation
      but has no population-scale measurement of.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings illustrate the prognostic value of the PARS as a platform-agnostic biomarker for mortality and health span.
    explanation: >-
      The healthspan-biomarker claim that makes the comparison with this module's
      tissue-assay biomarkers worth adjudicating.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with youthful immune lineage or neuron lineage cell types showed survival comparable or better than normal agers, with combined youthful states showing the highest survival.
    explanation: >-
      The protective/resilience arm, which this module has no node for and which
      is the strongest hint that the clocks are not simply an inverse readout of
      senescent-cell burden.
- discussion_id: human_model_mismatch_naked_mole_rat_senescence_resistance
  prompt: >-
    The naked mole-rat runs the senescence program but is not reported to
    accumulate senescent cells or the pathology attributed to them. Does that
    identify a mechanism that could be engaged in human tissue, or only a
    species-specific adaptation showing that this chain is breakable somewhere?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Senescent Cell Accumulation
  - pathophysiology#Tissue Dysfunction and Age-Related Pathology
  rationale: >-
    The mismatch is worth recording because the divergence sits at a specific
    point in this module rather than across it. Developmental, oncogene-induced
    and irradiation-induced senescence all occur in naked mole-rat cells, and
    SASP genes are induced, so the arrest and secretory nodes are shared with
    the short-lived rodent. What is absent is everything downstream: the
    accumulated burden and the tissue dysfunction the burden is held to cause.

    The evidence on the two sides of that point is not of the same kind, and
    conflating them would overstate the model. The positive claims are direct
    experiments in cells and embryonic tissue. The negative claim is an absence
    argument assembled from a demographic hazard analysis of captive colonies
    and from the species' reputation for negligible senescence, plus one
    cell-autonomous resistance mechanism - a beta-catenin-driven cholesterol
    and lipid-droplet program whose ablation restores senescence-like
    phenotypes - characterised in cultured fibroblasts. No study has counted
    p16INK4a-positive or SA-beta-gal-positive cells across the naked mole-rat
    lifespan the way this has been done in mouse and human tissue, so "does not
    accumulate" cannot currently be separated from "has not been counted".
    Immune clearance capacity, the other determinant this module assigns to the
    accumulation node, is untested in this species.

    Three things therefore do not follow and must not be curated as if they
    did: that human senescent-cell accumulation is dispensable because a rodent
    lives 30 years without it; that the beta-catenin and cholesterol program is
    a senescence brake in human cells, which has not been tested; or that a
    conforming disorder entry inherits these links, since the naked mole-rat is
    not a model of any disease in this knowledge base and the links exist only
    to mark where the conserved chain breaks in a naturally long-lived mammal.

    There is one positive precedent for transferability and it argues for
    testing rather than assuming. A different naked mole-rat longevity
    adaptation, high-molecular-mass hyaluronan, was exported into the mouse as
    the nmrHas2 transgenic and produced attenuated inflammation, lower cancer
    incidence and extended lifespan (PMID:37612507, curated on the inflammaging
    module). That shows a species-specific adaptation can carry into another
    mammal; it says nothing yet about whether the senescence-resistance
    mechanism does.
  proposed_experiments:
  - experiment_id: exp_nmr_senescent_cell_census_across_lifespan
    name: Senescent-cell census across the naked mole-rat lifespan
    description: >-
      Quantify p16INK4a-positive and SA-beta-gal-positive cells in matched
      tissues from naked mole-rats aged roughly 2, 10, 20 and over 25 years,
      against a mouse ageing series, to convert the absence argument into a
      measurement. This is the single experiment that would decide whether the
      accumulation node is genuinely not reached or merely uncounted.
    would_support:
    - pathophysiology#Senescent Cell Accumulation
    supporting_outcome:
    - >-
      A flat senescent-cell burden across the naked mole-rat lifespan
      against a rising burden in the mouse series would establish that this
      species does not reach the accumulation node.
    refuting_outcome:
    - >-
      A rising burden with age in naked mole-rat tissue would show the
      species accumulates senescent cells and tolerates them, relocating the
      divergence to the tissue-dysfunction node instead.
  - experiment_id: exp_beta_catenin_cholesterol_senescence_human_fibroblasts
    name: Test the beta-catenin and cholesterol senescence brake in human cells
    description: >-
      Ask whether raising beta-catenin-driven cholesterol synthesis and lipid
      droplet accumulation in human fibroblasts delays replicative or
      irradiation-induced senescence, and whether it does so in the presence of
      the human oxidative-stress response. This tests transferability of the
      one identified naked mole-rat mechanism rather than inferring it.
    would_support:
    - pathophysiology#Senescent Cell Accumulation
    supporting_outcome:
    - >-
      Delayed onset of senescence markers in human fibroblasts under the
      same manipulation would make this a candidate human senescence brake.
    refuting_outcome:
    - >-
      No delay, or delay only at cholesterol loads human cells do not
      tolerate, would place the mechanism on the species-specific side.
computational_models:
- name: Passos2010 p21-ROS Senescence Feedback Loop
  description: >-
    Stochastic kinetic model of the DNA-damage-response feedback loop that locks a
    cell into deep senescence. Long-term CDKN1A (p21) activation signals through
    GADD45-MAPK14-GRB2-TGFBR2-TGF-beta to induce mitochondrial dysfunction and
    reactive oxygen species production, which in turn sustain DNA damage and p21 -
    a self-reinforcing loop that engages after a delay of several days. Built by
    combining interactome analysis, functional target-gene inhibition, stochastic
    simulation, and live-cell microscopy.
  model_type: KINETIC
  repository_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000287
  model_id: BIOMD0000000287
  model_format: SBML
  publication: PMID:20160708
  modeled_mechanisms:
  - target: Senescence-Inducing Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models the DNA damage response as the initiating stress that engages the
      senescence program, and shows it is actively maintained rather than
      transient.
  - target: Senescence-Associated Cell Cycle Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the establishment and active maintenance of the arrest through
      sustained p21 signalling.
    limitations: >-
      Calibrated in human fibroblasts; the loop's timing and ROS dependence may
      differ in post-mitotic and non-fibroblast lineages that also senesce.
  notes: >-
    Mechanistically links this module to mitochondrial_dysfunction: the arrest
    node itself drives the mitochondrial ROS production that sustains it.
- name: Karin-Alon Saturating-Removal Model of Senescent Cell Accumulation
  description: >-
    Mathematical model of senescent-cell turnover fitted to longitudinal
    senescent-cell measurements and induction experiments in mice. Senescent cells
    turn over rapidly in young mice (half-life of days) but slow their own removal
    rate in old mice (half-life of weeks), producing a critical slowing-down with
    persistent fluctuations. Modelling death as the first crossing of a
    senescent-cell threshold quantitatively recapitulates the Gompertz law of
    mortality in mice and humans, and extends to lifespan-modulating interventions
    in Drosophila and C. elegans.
  model_type: KINETIC
  publication: PMID:31792199
  modeled_mechanisms:
  - target: Senescent Cell Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Quantifies the accumulation as an imbalance between production and a removal
      rate that itself declines with age, rather than as a simple monotonic
      build-up.
  - target: Tissue Dysfunction and Age-Related Pathology
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Connects senescent-cell burden to organism-level mortality, reproducing the
      Gompertz law from the turnover dynamics.
    limitations: >-
      Represents the downstream consequence as a single mortality threshold on
      senescent-cell burden; it does not model the tissue-specific dysfunction that
      this node describes.
  notes: >-
    Supplies the quantitative rationale for senolytic timing: because removal
    capacity, not production, is what fails with age, intermittent clearance is
    predicted to have durable effects.
- name: Verlingue2016 Geroconversion Boolean Model
  description: >-
    Boolean model of the signalling network controlling S-phase entry and
    geroconversion (the conversion of a growth-arrested cell into a senescent one).
    Reproduces the variation in senescence levels seen across insulin-resistant
    tissues, and, once mTOR-inhibitor pharmacodynamics were calibrated, the
    dose-dependent effect of rapamycin on liver degeneration and lifespan in
    wild-type and HER2-neu mice. Used for an in silico screen of the risk-benefit
    ratio of rapamycin dosing.
  model_type: BOOLEAN_NETWORK
  repository_url: https://www.ebi.ac.uk/biomodels/MODEL1611180000
  model_id: MODEL1611180000
  model_format: SBML-qual
  publication: PMID:27613445
  modeled_mechanisms:
  - target: Senescence-Associated Cell Cycle Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models geroconversion as a distinct network state downstream of arrest,
      separating reversible quiescence from the senescent outcome.
    limitations: >-
      Boolean logic gives qualitative state transitions only; it carries no
      concentrations or rates, so predicted senescence levels are ordinal.
  notes: >-
    Directly couples this module to deregulated_nutrient_sensing - mTOR activity is
    the model's central determinant of whether an arrested cell geroconverts.
- name: Population Model of DNA Damage, Senescence, and Stem Cell Dynamics in Ageing
  description: >-
    Deterministic and stochastic population model integrating DNA damage repair,
    senescence, quiescence, apoptosis, and cell division. Reproduces core ageing
    features - progressive senescent-cell accumulation, a generation distribution
    centred near experimentally observed Hayflick limits, and an exponential-like
    age distribution of non-senescent cells - and was used to simulate senolytics,
    telomere-length preservation, and stem cell therapy.
  model_type: KINETIC
  publication: PMID:41687688
  modeled_mechanisms:
  - target: Senescent Cell Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Simulates the accumulation as an emergent property of competing division,
      arrest, and apoptosis rates within a cell population.
  - target: Tissue Dysfunction and Age-Related Pathology
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Evaluates senolytic, telomere-preservation, and stem-cell interventions
      against the accumulated senescent burden.
    limitations: >-
      Tissue dysfunction is represented only as loss of proliferative cell supply;
      the SASP-driven paracrine damage central to this node is not modelled.

name: Activating Invasion and Metastasis Module
description: >-
  A conserved mechanism module for the sixth hallmark of cancer (Hanahan &
  Weinberg): activation of invasion and metastasis, the multistep
  invasion-metastasis cascade that accounts for the great majority of
  cancer deaths. The conserved causal chain runs from activation of an
  epithelial-mesenchymal transition (EMT) program - loss of E-cadherin and
  cell-cell junctions, acquisition of a motile, invasive mesenchymal
  phenotype driven by EMT transcription factors (SNAIL, SLUG, ZEB1/2,
  TWIST) - through local invasion across the basement membrane and stroma
  via matrix-degrading proteases (MMPs), into intravasation, survival in the
  circulation as circulating tumor cells, extravasation at a distant site,
  and finally metastatic colonization, the rate-limiting step in which
  disseminated cells adapt to the foreign microenvironment and resume
  proliferation. That dormant interval is a node of its own rather than a
  parenthesis: most cells that survive extravasation enter a reversible
  quiescence instead of colonising, which is why metastasis can appear years
  after the primary tumour was treated and why adjuvant therapy directed at
  proliferating cells does not reach the residual disease it is meant to
  eliminate. Individual disorder
  entries declare conformance via conforms_to, substituting
  tumor-type-specific drivers and organotropic patterns (e.g., bone-tropic breast
  cancer, liver-tropic colorectal cancer). This module connects to
  tumor_angiogenesis (vasculature provides the route for dissemination) and
  tumor_promoting_inflammation (stromal cells facilitate invasion).
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "invasion_and_metastasis#Local Invasion and Intravasation" or
  "invasion_and_metastasis#Metastatic Colonization"). The module defines the
  expected pathophysiology structure; conforming nodes in disorder files
  should include the corresponding cell types, biological processes, and
  causal edges, specialized to their tumor context. Key tumor-specific
  substitutions: carcinomas use classical E-cadherin-loss EMT; organotropism
  (Paget "seed and soil") substitutes the target organ and its premetastatic
  niche. Key conformance target: "invasion_and_metastasis#Metastatic
  Colonization". An entry whose disease relapses late should also conform to
  "invasion_and_metastasis#Disseminated Tumour Cell Dormancy" rather than
  modelling late recurrence as slow colonisation; note that node is quiescence
  and not senescence, so it is not a conformance target for the senescence
  modules.
pathophysiology:
- name: Epithelial-Mesenchymal Transition Activation
  description: >-
    Tumor cells reactivate the latent embryonic EMT program. EMT
    transcription factors (SNAIL, SLUG, ZEB1/2, TWIST), induced by TGF-beta,
    Wnt, and signals from the tumor stroma, repress E-cadherin and other
    epithelial genes and induce mesenchymal markers. Cells lose apical-basal
    polarity and cell-cell adhesion and acquire a motile, invasive
    phenotype. EMT is typically partial and reversible
    (epithelial-mesenchymal plasticity), enabling later reversion (MET) at the
    metastatic site.
  role: trigger
  biological_processes:
  - preferred_term: Epithelial to Mesenchymal Transition
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
    modifier: INCREASED
  - preferred_term: Negative Regulation of Cell Adhesion
    term:
      id: GO:0007162
      label: negative regulation of cell adhesion
    modifier: INCREASED
  evidence:
  - reference: PMID:28187288
    reference_title: "Emerging Biological Principles of Metastasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the biological programs that underlie the dissemination and metastatic
      outgrowth of cancer cells are beginning to come into view
    explanation: >-
      Frames the cellular programs (including EMT) that drive dissemination
      and metastatic outgrowth, the trigger of this module. Evidence source
      is OTHER because this is a review article.
  downstream:
  - target: Local Invasion and Intravasation

- name: Local Invasion and Intravasation
  description: >-
    Motile tumor cells invade locally, degrading the basement membrane and
    extracellular matrix with matrix metalloproteinases and other proteases
    and migrating through the stroma, often led by invadopodia and aided by
    tumor-associated macrophages and cancer-associated fibroblasts. Invading
    cells reach and penetrate the walls of blood or lymphatic vessels
    (intravasation), entering the circulation.
  role: effector
  biological_processes:
  - preferred_term: Cell Migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: INCREASED
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:22094253
    reference_title: "Direct signaling between platelets and cancer cells induces an epithelial-mesenchymal-like transition and promotes metastasis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "In primary carcinomas, secreted growth factors and cytokines contributed by stromal cells are key in inducing epithelial-mesenchymal transition (EMT), a transient and reversible process that promotes cell motility, invasion, and dissemination of cancer cells out of the tumor microenvironment"
    explanation: "Motility and local invasion out of the primary site, the first half of this node."
  - reference: PMID:26615781
    reference_title: "Involvement of platelets in tumor cell metastasis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Activated platelets release secretory factors that promote growth factors, chemokines, proangiogenic regulatory proteins, proteolytic enzymes and microparticles within the microenvironment to promote tumor cell growth and invasion."
    explanation: "Proteolytic enzyme supply in the microenvironment supporting invasion."
  downstream:
  - target: Circulatory Survival and Extravasation

- name: Circulatory Survival and Extravasation
  description: >-
    As circulating tumor cells, disseminating cells must survive loss of
    matrix attachment (resisting anoikis), shear stress, and immune
    surveillance, sometimes shielded by platelet cloaking. Surviving cells
    arrest in the microvasculature of a distant organ and extravasate across
    the endothelium into the parenchyma, a step shaped by organ-specific
    adhesion and chemokine cues.
  role: effector
  biological_processes:
  - preferred_term: Cell Migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: INCREASED
  evidence:
  - reference: PMID:26615781
    reference_title: "Involvement of platelets in tumor cell metastasis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the formation of platelet-tumor cell heteroaggregates by integrin αIIbβ3 (glycoprotein IIb/IIIa) bridging plays an important role in tumor survival by forming a physical shield around tumor cells, and thereby protecting circulating tumor cells from immune-mediated lysis by natural killer (NK) cells"
    explanation: "The platelet cloaking that protects circulating tumor cells, named in this node."
  - reference: PMID:22094253
    reference_title: "Direct signaling between platelets and cancer cells induces an epithelial-mesenchymal-like transition and promotes metastasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Platelet-derived TGFβ and direct platelet-tumor cell contacts synergistically activate the TGFβ/Smad and NF-κB pathways in cancer cells, resulting in their transition to an invasive mesenchymal-like phenotype and enhanced metastasis in vivo."
    explanation: "Intravascular platelet signalling priming extravasation and metastasis in vivo."
  downstream:
  - target: Metastatic Colonization
  - target: Disseminated Tumour Cell Dormancy
    description: >-
      Most cells that complete extravasation do not colonise next; they enter a
      reversible non-proliferative state, which is a different fate from
      failing the cascade.

- name: Metastatic Colonization
  description: >-
    Extravasated cells must adapt to the foreign microenvironment of the
    distant organ and re-initiate proliferation to form a clinically
    relevant macrometastasis. Most disseminated cells fail this step or enter
    prolonged dormancy; colonization is the rate-limiting and least efficient
    stage of the cascade, often requiring establishment of a supportive
    (pre-metastatic) niche and frequently a reversion toward an epithelial
    state (MET). Successful colonization produces the metastases responsible
    for most cancer mortality.
  role: consequence
  biological_processes:
  - preferred_term: Cell Population Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:28187288
    reference_title: "Emerging Biological Principles of Metastasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Metastases account for the great majority of cancer-associated deaths,
      yet this complex process remains the least understood aspect of cancer
      biology.
    explanation: >-
      Establishes metastatic colonization as the clinically decisive
      endpoint of the invasion-metastasis cascade, the consequence modeled
      here. Evidence source is OTHER because this is a review article.
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include sustaining proliferative signaling, evading growth
      suppressors, resisting cell death, enabling replicative immortality,
      inducing angiogenesis, and activating invasion and metastasis.
    explanation: >-
      Hanahan & Weinberg list activating invasion and metastasis as a core
      hallmark capability modeled here. Evidence source is OTHER because this
      is a review article.

- name: Disseminated Tumour Cell Dormancy
  description: >-
    The module's colonisation node mentions dormancy and then models only its
    alternative, which leaves out the state most disseminated cells are
    actually in and the reason the cascade has a clinical course measured in
    years. A disseminated tumour cell that survives extravasation commonly
    enters quiescence rather than either dying or proliferating, and metastasis
    then appears long after the primary tumour was treated. The state matters
    because it is not senescence: quiescence is equally stable and
    non-proliferative but reversible, so the cell retains latent
    tumour-initiating capacity and can resume growth, which senescence would
    preclude. It also explains a therapeutic failure that is otherwise
    puzzling. Adjuvant treatment is given to eliminate residual disease, and
    the drugs available act on proliferating cells, so a dormant cell is
    refractory to them by virtue of its state rather than by any resistance
    determinant. The biology of this residual disease diverges from the
    proliferative lesion it came from, which is also why therapy chosen on the
    primary tumour's characteristics may not reach it. A conforming entry whose
    disease relapses late should record this node rather than treating late
    recurrence as slow colonisation.
  role: intrinsic_resistance
  biological_processes:
  - preferred_term: Cell quiescence
    term:
      id: GO:0044838
      label: cell quiescence
    modifier: INCREASED
  - preferred_term: Autophagy supporting survival during dormancy
    term:
      id: GO:0006914
      label: autophagy
    modifier: INCREASED
  evidence:
  - reference: PMID:25118602
    reference_title: "Mechanisms of disseminated cancer cell dormancy: an awakening field."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This can happen years after primary tumour treatment because residual
      tumour cells can enter dormancy and evade therapies.
    explanation: >-
      States both halves of this node - the latency and the therapeutic evasion
      - and ties them to the same cause. Graded OTHER as the source is a
      review.
  - reference: PMID:25118602
    reference_title: "Mechanisms of disseminated cancer cell dormancy: an awakening field."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Similar to senescence, quiescence is a stable, non-proliferative cellular
      state, but in contrast to senescence, quiescence is reversible.
    explanation: >-
      The distinction this node turns on, and the reason it is not a conformance
      target for the senescence modules: a senescent cell cannot resume growth,
      so it could not produce the late metastasis.
  - reference: PMID:25118602
    reference_title: "Mechanisms of disseminated cancer cell dormancy: an awakening field."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As the biology of minimal residual disease seems to diverge from that of
      proliferative lesions, understanding the underpinnings of this new cancer
      biology is key to prevent metastasis.
    explanation: >-
      Supports treating this as its own node rather than a phase of
      colonisation, and the warning that therapy chosen on the primary tumour
      may not reach it.
  - reference: PMID:25118602
    reference_title: "Mechanisms of disseminated cancer cell dormancy: an awakening field."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Current therapies target proliferating tumour cells with varying success.
    explanation: >-
      The basis for the intrinsic_resistance role: the dormant cell is
      refractory by virtue of its state, with no resistance determinant
      involved.
  downstream:
  - target: Metastatic Colonization
    description: >-
      Exit from quiescence is what turns residual disease into a clinically
      apparent metastasis, often years later.

      label: placenta
  evidence:
  - reference: PMID:12089065
    reference_title: "Hypoxia-reoxygenation: a potent inducer of apoptotic changes
      in the human placenta and possible etiological factor in preeclampsia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      After H/R, release of cytochrome c from mitochondria was significantly
      increased and was associated with intense immunolabeling for active
      caspase 3 in the syncytiotrophoblast and fetal endothelial cells.
    explanation: >-
      Measures the apoptotic machinery in the specific cell type this node
      names, in human placental tissue subjected to hypoxia-reoxygenation.
  downstream:
  - target: Release of Placental Factors into the Maternal Circulation
    description: >-
      The stressed syncytiotrophoblast sheds antiangiogenic factors and apoptotic
      debris into maternal blood.
    evidence:
    - reference: PMID:12089065
      reference_title: "Hypoxia-reoxygenation: a potent inducer of apoptotic changes
        in the human placenta and possible etiological factor in preeclampsia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        Oxidative stress of the placenta is considered a key intermediary step,
        precipitating deportation of apoptotic fragments into the maternal
        circulation, but the cause remains unknown.
      explanation: >-
        States the placenta-to-mother deportation step this edge asserts. Marked
        INDIRECT and BACKGROUND because the sentence frames the field's position
        in the study's introduction rather than reporting the study's own result.

- name: Release of Placental Factors into the Maternal Circulation
  description: >-
    The terminal, disorder-agnostic output of the module: the stressed placenta
    exports antiangiogenic factors - soluble fms-like tyrosine kinase 1 scavenging
    placental growth factor and VEGF - together with apoptotic debris, into the
    maternal circulation. What the mother and fetus then develop is decided by
    each conforming disorder and is deliberately not modelled here: preeclampsia
    continues into maternal endothelial dysfunction, fetal growth restriction
    into reduced transfer capacity and chronic fetal hypoxaemia, placental
    abruption into decidual haemorrhage and separation.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: syncytiotrophoblast
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: negative regulation of angiogenesis
    term:
      id: GO:0016525
      label: negative regulation of angiogenesis
    modifier: INCREASED
  - preferred_term: secretion of sFlt-1 and apoptotic debris into maternal blood
    term:
      id: GO:0046903
      label: secretion
    modifier: INCREASED
    description: >-
      The export step itself, which the antiangiogenic binding above does not
      name. GO has no term for syncytiotrophoblast deportation into the
      maternal circulation, so the specificity is carried in preferred_term.
  evidence:
  - reference: PMID:14764923
    reference_title: Circulating angiogenic factors and the risk of preeclampsia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The sFlt-1 level increased beginning approximately five weeks before the
      onset of preeclampsia.
    explanation: >-
      Places the antiangiogenic export before clinical disease in a prospective
      human cohort, which is what makes this node a step in the chain rather
      than a marker of the outcome.
  - reference: PMID:14764923
    reference_title: Circulating angiogenic factors and the risk of preeclampsia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Alterations in the levels of sFlt-1 and free PlGF were greater in women
      with an earlier onset of preeclampsia and in women in whom preeclampsia
      was associated with a small-for-gestational-age infant.
    explanation: >-
      The dose-response the module predicts: the same placental export tracks
      both the early-onset preeclampsia phenotype and the growth-restricted
      one, which is the observation that makes a single shared upstream lesion
      plausible rather than two coincidental ones.

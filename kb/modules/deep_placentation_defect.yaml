name: Defective Deep Placentation Module
description: >-
  A conserved pathological module for defective deep placentation - the failure
  of physiological transformation of the maternal spiral arteries at the
  implantation site, which Brosens and colleagues identified as the lesion
  shared by the "great obstetrical syndromes" (PMID:21094932). The chain runs
  decidualization resistance in the endometrial stroma -> shallow extravillous
  trophoblast invasion of the junctional-zone myometrium -> failure of spiral
  artery physiological transformation -> high-momentum, intermittent
  uteroplacental perfusion -> syncytiotrophoblast oxidative stress and apoptosis
  -> release of antiangiogenic and damage-associated factors into the maternal
  circulation. The key conformance target is
  "deep_placentation_defect#Failure of Spiral Artery Physiological
  Transformation" - the disorder-agnostic, rate-limiting step every conformer
  funnels through, and the one whose downstream branch point decides which
  syndrome a given pregnancy develops. Conforming entries substitute the
  syndrome-specific downstream consequence (maternal endothelial dysfunction in
  preeclampsia, reduced nutrient transfer in fetal growth restriction,
  decidual haemorrhage in placental abruption) while preserving the conserved
  decidua -> trophoblast -> spiral artery chain. This module is the *deficient
  invasion* arm and is deliberately scoped to it: placenta accreta spectrum and
  placenta previa are the mirror-image lesion, in which absent decidua basalis
  permits *unconstrained* trophoblast invasion, and they should not be conformed
  here. It is complementary to, not overlapping with, thrombogenesis (which
  Preeclampsia already conforms to for the downstream microvascular thrombosis
  arm) and cellular_senescence (which PPROM already conforms to for the
  amniochorion arm); this module carries only the upstream placental-bed lesion
  that those modules take as given. There is no drug-target pattern: no
  therapy in current practice reverses the established lesion, which is itself
  a curation-relevant fact and the reason prevention is the only lever.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
creation_date: "2026-09-21T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease. Do NOT create a "Defective Deep
  Placentation" Disease entry: the lesion is a placental-bed finding that is
  diagnosed on targeted biopsy and has no standalone clinical identity or MONDO
  term. Disorder entries reference individual nodes via conforms_to, e.g.
  "deep_placentation_defect#Failure of Spiral Artery Physiological
  Transformation".

  Species caveat. Deep interstitial and endovascular trophoblast invasion as far
  as the junctional-zone myometrium is essentially restricted to humans and the
  great apes; the mouse and rat models that supply most mechanistic data invade
  far more shallowly, so a rodent result should be linked with
  FAILS_TO_RECAPITULATE or a recorded fidelity caveat rather than read straight
  across. No animal or computational models are attached to this module for that
  reason - they belong on the conforming disorder entries, where the specific
  caveat can be stated.

  Wired conformers at the time of creation: Preeclampsia ("Defective Trophoblast
  Invasion and Spiral Artery Remodeling"), Fetal_Growth_Restriction ("Deficient
  Uterine Spiral Artery Remodeling") and Placental_Abruption ("Decidual
  Vasculopathy and Spiral Artery Failure"). Brosens et al. also place preterm
  labor with intact membranes, preterm prelabor rupture of the membranes and
  late spontaneous abortion in the same group; the KB's
  Preterm_Premature_Rupture_of_the_Membranes entry currently models the
  amniochorion arm rather than the placental bed and so has no node to conform
  here yet. That is an open curation lead, not an omission from the module.

  Three of the KB's obstetric entries were written independently and each named
  this same lesion differently - "Defective Trophoblast Invasion and Spiral
  Artery Remodeling", "Deficient Uterine Spiral Artery Remodeling", "Decidual
  Vasculopathy and Spiral Artery Failure". Fetal_Growth_Restriction's own notes
  record that it made no conforms_to declarations because no suitable module
  existed. That divergence is what this module exists to make checkable.
pathophysiology:
- name: Decidualization Resistance at the Implantation Site
  description: >-
    Endometrial stromal fibroblasts fail to complete the progesterone- and
    cAMP-driven differentiation into secretory decidual cells that normally
    prepares the implantation site. The undecidualized or partly decidualized
    stroma is the "soil" defect: decidual cells are what license, direct and
    ultimately limit extravillous trophoblast invasion, so a stroma that has not
    differentiated properly cannot support the invasion depth that deep
    placentation requires. In severe preeclampsia the defect is detectable in
    non-pregnant endometrium years after the affected pregnancy, which places it
    upstream of, and not merely consequent on, the abnormal placenta.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endometrial stromal fibroblast
    term:
      id: CL:0002255
      label: stromal cell of endometrium
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  biological_processes:
  - preferred_term: decidualization
    term:
      id: GO:0046697
      label: decidualization
    modifier: DECREASED
  locations:
  - preferred_term: decidua
    term:
      id: UBERON:0002450
      label: decidua
  evidence:
  - reference: PMID:33007270
    reference_title: Decidualization resistance in the origin of preeclampsia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Decidualization of endometrial cells regulates embryo invasion, which is
      essential for spiral artery remodeling and establishing the maternal-fetal
      interface.
    explanation: >-
      States the module's premise that decidualization is the upstream control
      on the invasion that remodels the spiral arteries. Graded HUMAN_CLINICAL
      because the quoted sentence describes human endometrial and placental
      biology, with quote_role REVIEW_SYNTHESIS because the review is not where
      that finding was produced.
  - reference: PMID:34709177
    reference_title: Disrupted PGR-B and ESR1 signaling underlies defective decidualization
      linked to severe preeclampsia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      ESR1 and PGR-B gene expression and protein abundance were remarkably
      disrupted in sPE.
    explanation: >-
      Measures the hormonal-signalling failure behind the decidualization defect
      in endometrial biopsies from women who had severe preeclampsia, which is
      what makes this node a distinct upstream step rather than a restatement of
      shallow invasion.
  downstream:
  - target: Shallow Extravillous Trophoblast Invasion of the Junctional Zone
    description: >-
      A stroma that has not decidualized cannot guide extravillous trophoblast
      through the decidua into the junctional-zone myometrium.
    evidence:
    - reference: PMID:33007270
      reference_title: Decidualization resistance in the origin of preeclampsia.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        decidualization resistance, which is a defective endometrial cell
        differentiation during the menstrual cycle, could underlie shallow
        trophoblast invasion and the poor establishment of the maternal-fetal
        interface
      explanation: >-
        Asserts the causal direction of this edge - decidualization resistance
        upstream of shallow trophoblast invasion.

- name: Shallow Extravillous Trophoblast Invasion of the Junctional Zone
  description: >-
    Extravillous trophoblast migrates out of the anchoring villi and through the
    decidua, but stops short of the junctional-zone segment of the myometrium
    that deep placentation requires. Uterine natural killer cells, the dominant
    leukocyte at the first-trimester maternal-fetal interface, are part of the
    control system for that migration through their interaction with
    trophoblast HLA molecules. The failure is one of depth, not of the
    trophoblast's presence: interstitial and endovascular trophoblast are still
    found in the decidual segment.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: extravillous trophoblast
    term:
      id: CL:0008036
      label: extravillous trophoblast
  - preferred_term: uterine natural killer cell
    term:
      id: CL:4052028
      label: uterine natural killer cell
  biological_processes:
  - preferred_term: trophoblast cell migration
    term:
      id: GO:0061450
      label: trophoblast cell migration
    modifier: DECREASED
  locations:
  - preferred_term: decidua
    term:
      id: UBERON:0002450
      label: decidua
  evidence:
  - reference: PMID:33007270
    reference_title: Decidualization resistance in the origin of preeclampsia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Shallow cytotrophoblast invasion through the uterine decidua into the
      spiral arteries is implicated in the pathogenesis of preeclampsia,
      although the cause of deficient arterial invasion remains unknown.
    explanation: >-
      Names the shallow-invasion step and, usefully for this module, records
      that its cause is not settled - which is why the upstream trigger node is
      curated as a candidate rather than an established cause.
  - reference: PMID:34709177
    reference_title: Disrupted PGR-B and ESR1 signaling underlies defective decidualization
      linked to severe preeclampsia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Appropriate depth of placental invasion is needed to support a healthy
      pregnancy; shallow invasion is associated with the development of severe
      preeclampsia (sPE).
    explanation: >-
      States that invasion depth is the quantity at issue. Graded
      HUMAN_CLINICAL because the claim is about human pregnancy, with
      quote_role BACKGROUND because the sentence sits in the cited study's
      introduction rather than reporting its own result.
  downstream:
  - target: Failure of Spiral Artery Physiological Transformation
    description: >-
      Trophoblast that does not reach the junctional-zone segment cannot convert
      it, so the myometrial segment of the spiral artery is left unremodelled.
    evidence:
    - reference: PMID:21094932
      reference_title: The "Great Obstetrical Syndromes" are associated with disorders
        of deep placentation.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Defective deep placentation was first described in preeclampsia and
        intrauterine growth restriction (IUGR) and was characterized by absent
        or incomplete remodeling of the JZ segment of the spiral arteries
      explanation: >-
        Ties failure of invasion depth specifically to the junctional-zone
        segment, which is the anatomical content of this edge.

- name: Failure of Spiral Artery Physiological Transformation
  description: >-
    The module's key conformance target and its rate-limiting step. Normal deep
    placentation converts roughly 100 spiral arteries along both their decidual
    and their junctional-zone myometrial segments: smooth muscle and the
    internal elastic lamina are lost from the vessel wall and the mouth dilates
    five- to ten-fold, turning a narrow, high-resistance, vasoactive artery into
    a wide, inelastic, flow-independent conduit. When transformation fails, the
    vessel retains its musculoelastic wall and its narrow terminal calibre. This
    is the lesion the pathologist sees on a placental-bed biopsy and the one
    every conforming disorder funnels through; the syndrome that follows is
    decided downstream, not here.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: extravillous trophoblast
    term:
      id: CL:0008036
      label: extravillous trophoblast
  biological_processes:
  - preferred_term: spiral artery remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: DECREASED
  - preferred_term: maternal placenta development
    term:
      id: GO:0001893
      label: maternal placenta development
    modifier: DECREASED
  locations:
  - preferred_term: uterine spiral artery
    term:
      id: UBERON:0015171
      label: uterine spiral artery
  evidence:
  - reference: PMID:21094932
    reference_title: The "Great Obstetrical Syndromes" are associated with disorders
      of deep placentation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Deep placentation involves nearly complete transformation of the decidual
      and myometrial segments of approximately 100 spiral arteries.
    explanation: >-
      Defines what the normal process is and therefore what failing it means -
      both segments of roughly 100 vessels, which is the standard this node is
      measured against.
  - reference: PMID:21094932
    reference_title: The "Great Obstetrical Syndromes" are associated with disorders
      of deep placentation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Defective deep placentation has been associated with a spectrum of
      complications of pregnancy including preeclampsia, intrauterine growth
      restriction, preterm labor, preterm premature rupture of membranes, late
      spontaneous abortion, and abruptio placentae.
    explanation: >-
      This is the module's justification: one lesion, recurring across several
      separately curated disorders, which is exactly the recurrence criterion a
      mechanism module has to meet.
  - reference: PMID:19375795
    reference_title: Rheological and physiological consequences of conversion of the
      maternal spiral arteries for uteroplacental blood flow during human pregnancy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It involves loss of smooth muscle and the elastic lamina from the vessel
      wall as far as the inner third of the myometrium, and is associated with a
      5-10-fold dilation at the vessel mouth.
    explanation: >-
      Gives the structural content of physiological transformation, which is
      what a conforming node has to be describing the absence of. Graded
      HUMAN_CLINICAL with quote_role BACKGROUND because the sentence states
      established human placental anatomy in the introduction of a modelling
      paper.
  downstream:
  - target: High-Momentum, Intermittent Uteroplacental Perfusion
    description: >-
      An unconverted artery keeps a narrow mouth and a contractile wall, so
      maternal blood enters the intervillous space fast and its delivery stays
      vasomotor-dependent.
    evidence:
    - reference: PMID:19375795
      reference_title: Rheological and physiological consequences of conversion of
        the maternal spiral arteries for uteroplacental blood flow during human pregnancy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The model shows that in the absence of conversion blood will enter the
        intervillous space as a turbulent jet at rates of 1-2m/s.
      explanation: >-
        The paper's own modelling result for what failed conversion does to
        inflow. Graded COMPUTATIONAL because the claim is the output of a
        fluid-dynamic model, not a measurement in pregnant women.

- name: High-Momentum, Intermittent Uteroplacental Perfusion
  description: >-
    Blood reaches the intervillous space as a fast jet rather than a slow,
    steady stream, and because the retained smooth muscle leaves the vessel
    responsive to vasoconstrictors, delivery is intermittent. The placenta is
    therefore subjected to mechanical damage of the villous architecture and to
    repeated ischaemia-reperfusion rather than to steady hypoxia - a
    distinction that matters, because the two produce different cell-death
    phenotypes downstream.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  locations:
  - preferred_term: uterine spiral artery
    term:
      id: UBERON:0015171
      label: uterine spiral artery
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  evidence:
  - reference: PMID:19375795
    reference_title: Rheological and physiological consequences of conversion of the
      maternal spiral arteries for uteroplacental blood flow during human pregnancy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The retention of smooth muscle will also increase the risk of spontaneous
      vasoconstriction and ischaemia-reperfusion injury, generating oxidative
      stress.
    explanation: >-
      Supplies the intermittency mechanism this node asserts. Marked INDIRECT
      because the authors state it as an inference from their model rather than
      as a measured result.
  - reference: PMID:12089065
    reference_title: "Hypoxia-reoxygenation: a potent inducer of apoptotic changes
      in the human placenta and possible etiological factor in preeclampsia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      We hypothesize that intermittent placental perfusion, secondary to
      deficient trophoblast invasion of the endometrial arteries, leads to an
      ischemia-reperfusion-type insult.
    explanation: >-
      Records that this node is the hypothesis the downstream experiment was
      built to test, which is the honest grading - the sentence is the study's
      stated hypothesis, not its finding.
  downstream:
  - target: Syncytiotrophoblast Oxidative Stress and Apoptosis
    description: >-
      Repeated ischaemia-reperfusion generates reactive oxygen species in the
      syncytiotrophoblast, the layer in direct contact with maternal blood.
    evidence:
    - reference: PMID:12089065
      reference_title: "Hypoxia-reoxygenation: a potent inducer of apoptotic changes
        in the human placenta and possible etiological factor in preeclampsia."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We conclude that H/R stimulates apoptotic changes within the
        syncytiotrophoblast, whereas hypoxia principally induces necrosis.
      explanation: >-
        Establishes that it is the reperfusion cycle, not hypoxia alone, that
        produces the downstream syncytiotrophoblast phenotype - which is why
        this edge starts from intermittent perfusion rather than from low oxygen.

- name: Syncytiotrophoblast Oxidative Stress and Apoptosis
  description: >-
    The syncytiotrophoblast, the multinucleate layer bathed in maternal blood,
    mounts an oxidative and hypoxic stress response and undergoes apoptotic
    change: mitochondrial cytochrome c release, caspase-3 activation, PARP
    cleavage and nuclear condensation. This is the cellular step that converts
    a maternal vascular lesion into a placental secretory phenotype.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: syncytiotrophoblast
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: cellular response to hypoxia
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  - preferred_term: apoptotic process

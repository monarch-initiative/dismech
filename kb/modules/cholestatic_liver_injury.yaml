    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  locations:
  - preferred_term: bile duct
    term:
      id: UBERON:0002394
      label: bile duct
  evidence:
  - reference: PMID:39250501
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Herein, we review the pivotal role of cholangiocytes in cholestatic
      fibrogenesis, focusing on the crosstalk between cholangiocytes and portal
      fibroblasts and HSCs.
    explanation: >-
      Names the cholangiocyte-portal fibroblast-hepatic stellate cell crosstalk
      that constitutes this node. Evidence source is OTHER because this is a
      review.
  - reference: PMID:40360509
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Txnip deficiency increases TNF-α and TGF-β secretion by cholangiocytes to
      stimulate Kupffer cells and hepatic stellate cells, consequently leading
      to inflammation and collagen deposition.
    explanation: >-
      Provides the mechanistic link from cholangiocyte cytokine secretion to
      Kupffer cell and stellate cell activation and thence to collagen
      deposition. Evidence source is MODEL_ORGANISM because the causal chain
      was established in cholangiocyte-specific knockout mice.
  - reference: PMID:40360509
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ductular reaction is associated with liver disease progression, but there
      are no drugs targeting ductular reaction.
    explanation: >-
      Establishes that the extent of ductular reaction tracks with progression
      of chronic liver disease, and records that this node has no approved
      therapy. Evidence source is OTHER, not HUMAN_CLINICAL: this is the paper's
      framing sentence citing prior literature rather than a measurement in its
      own cohort, and the study itself is a mouse-genetics paper (its other
      snippets here are correctly tagged MODEL_ORGANISM).
  downstream:
  - target: Biliary Fibrosis Progressing to Biliary Cirrhosis
    causal_link_type: DIRECT
    description: >-
      Sustained portal fibrogenesis accumulates as bridging biliary fibrosis and
      ultimately remodels the liver into biliary cirrhosis.

- name: Biliary Fibrosis Progressing to Biliary Cirrhosis
  description: >-
    Persistent cholestatic fibrogenesis produces progressive portal and
    periportal fibrosis, bridging fibrosis, and finally biliary cirrhosis with
    its sequelae - portal hypertension, hepatic decompensation, and the need for
    liver transplantation. This is the shared clinical endpoint of the
    cholangiopathies and of untreated hepatocellular cholestasis, and it is the
    outcome that conforming entries are ultimately describing.
  role: consequence
  biological_scale: ORGANISM
  notes: >-
    This node is the hand-off point to `portal_hypertension`: biliary cirrhosis
    is a sinusoidal-resistance trigger for that module, so an entry reaching
    this node and going on to varices, ascites or hepatic encephalopathy should
    conform to `portal_hypertension#Increased Intrahepatic Vascular Resistance`
    rather than re-deriving the haemodynamic chain here.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39250501
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cholangiopathies comprise a spectrum of chronic intrahepatic and
      extrahepatic biliary tract disorders culminating in progressive
      cholestatic liver injury, fibrosis, and often cirrhosis and its sequela.
    explanation: >-
      States the terminal step of the module - progressive cholestatic injury
      and fibrosis culminating in cirrhosis - and that it is shared across the
      whole cholangiopathy spectrum. Evidence source is OTHER because this is a
      review.
  - reference: PMID:30205418
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sclerosing cholangitis (SC) is defined as a condition with progressive
      stenosis and destruction of the bile ducts due to diffuse inflammation and
      fibrosis
    explanation: >-
      Confirms that progressive inflammation and fibrosis destroying bile ducts
      is the defining disease process for a major conforming disorder class,
      the sclerosing cholangitides. Evidence source is OTHER because this is a
      clinical review.
  - reference: PMID:30148122
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      with onset in early infancy and progression to end-stage liver disease
    explanation: >-
      Records that the severe end of the inherited cholestasis spectrum reaches
      the same end-stage liver disease endpoint this node describes. Evidence
      source is OTHER because this is a review.

treatments:
- name: Ursodeoxycholic Acid
  description: >-
    Ursodeoxycholic acid (UDCA) is a hydrophilic bile acid and the first-line
    therapy for most cholestatic liver diseases. It acts on the bile acid
    retention node rather than on the downstream fibrosis: it enriches the bile
    acid pool with a non-cytotoxic species, stimulates bile flow, and - as shown
    in an experimental model of inflammatory cholestasis - restores expression
    and plasma-membrane localisation of the canalicular bile salt export pump
    BSEP, protecting hepatocytes against the bile acids accumulated by the
    secretory failure. This is the anticholestatic drug-target design pattern
    for conforming disorders: act upstream on the retention amplifier, not on
    the structural endpoint.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ursodeoxycholic acid
      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  target_mechanisms:
  - target: Hepatocellular and Biliary Bile Acid Retention
    treatment_effect: INHIBITS
    description: >-
      UDCA reduces the hepatocellular burden of cytotoxic hydrophobic bile acids
      by promoting their export and enriching the pool with a hydrophilic
      species, damping the deteriorative arm of the retention node.
    evidence:
    - reference: PMID:31202734
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        UDCA protects the hepatocyte against the damaging effect of bile acids
        accumulated by the LPS-induced secretory failure.
      explanation: >-
        States precisely the mechanism this link asserts - protection of the
        hepatocyte against bile acids accumulated because of secretory failure.
        Evidence source is MODEL_ORGANISM because the experiment was performed
        in LPS-treated Wistar rats.
  evidence:
  - reference: PMID:31202734
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This involved an enhanced synthesis of Bsep and an improved membrane
      stability of the newly synthesized transporters.
    explanation: >-
      Gives the molecular basis of UDCA's anticholestatic effect - restored
      canalicular export pump expression and membrane localisation. Evidence
      source is MODEL_ORGANISM because Bsep expression was measured in rat
      liver.
  - reference: PMID:27532829
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 216 patients who underwent randomization and received at least one dose
      of obeticholic acid or placebo, 93% received ursodiol as background
      therapy.
    explanation: >-
      Documents that ursodiol (UDCA) is the standard background therapy in
      primary biliary cholangitis, the reference conforming disorder. Evidence
      source is HUMAN_CLINICAL because this is a randomized phase 3 trial in
      patients.

- name: Farnesoid X Receptor Agonist (Obeticholic Acid)
  description: >-
    Obeticholic acid is a semisynthetic bile acid and agonist of the nuclear
    bile acid receptor FXR (NR1H4). FXR activation represses de novo bile acid
    synthesis and induces bile acid export, reinforcing the adaptive arm of the
    retention node. In patients with primary biliary cholangitis and an
    inadequate response to ursodiol it lowered alkaline phosphatase and
    bilirubin significantly more than placebo. Two caveats conforming entries
    must preserve: the trial showed no significant difference in noninvasive
    fibrosis measures at 12 months, so it is not evidence of an effect on the
    downstream fibrosis nodes; and it aggravates pruritus, the symptom most
    directly attributable to bile acid retention.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: obeticholic acid
      term:
        id: CHEBI:43602
        label: obeticholic acid
  target_mechanisms:
  - target: Hepatocellular and Biliary Bile Acid Retention
    treatment_effect: INHIBITS
    description: >-
      FXR agonism represses bile acid synthesis and promotes export, lowering
      the retained bile acid load and the cholestatic biochemical markers it
      produces.
    evidence:
    - reference: PMID:27532829
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The primary end point occurred in more patients in the 5-10-mg group
        (46%) and the 10-mg group (47%) than in the placebo group (10%; P<0.001
        for both comparisons).
      explanation: >-
        Quantifies the effect of FXR agonism on the composite cholestatic
        biochemical endpoint against placebo. Evidence source is HUMAN_CLINICAL
        because this is a randomized, double-blind, placebo-controlled phase 3
        trial.
  evidence:
  - reference: PMID:27532829
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Changes in noninvasive measures of liver fibrosis did not differ
      significantly between either treatment group and the placebo group at 12
      months.
    explanation: >-
      Marked PARTIAL because it bounds the claim: obeticholic acid's benefit was
      demonstrated on the bile-acid-retention node, not on the downstream
      fibrosis nodes of this module. Conforming entries must not curate it as
      antifibrotic. Evidence source is HUMAN_CLINICAL.
  - reference: PMID:27532829
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pruritus was more common with obeticholic acid than with placebo (56% of
      patients in the 5-10-mg group and 68% of those in the 10-mg group vs. 38%
      in the placebo group).
    explanation: >-
      Records the dose-related aggravation of pruritus, the treatment-limiting
      adverse effect of FXR agonism in cholestasis. Evidence source is
      HUMAN_CLINICAL.

discussions:
- discussion_id: ductular_reaction_undruggable
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does any therapy act on the ductular reaction and cholestatic fibrogenesis
    node itself, rather than only on upstream bile acid retention?
  attaches_to:
  - "pathophysiology#Ductular Reaction and Cholangiocyte-Driven Fibrogenesis"
  rationale: >-
    Both curated treatments in this module (UDCA, obeticholic acid) act on the
    retention amplifier, and the one randomized trial with fibrosis endpoints
    showed no significant effect on noninvasive fibrosis measures at 12 months.
    The ductular reaction node is explicitly described in the literature as
    having no drugs targeting it. This is the therapeutic gap that makes the
    cholangiopathies a "black box" in clinical hepatology, and conforming
    entries should not imply that upstream bile-acid-directed therapy addresses
    it.
  proposed_experiments:
  - experiment_id: cholestatic_fibrosis_histology_trial
    name: Randomized trial with histological fibrosis endpoints in cholestatic disease
    description: >-
      A trial of a candidate antifibrotic or anti-ductular agent in a
      cholangiopathy, powered on paired liver histology or a validated fibrosis
      endpoint rather than on alkaline phosphatase, would establish whether the
      fibrogenesis node is independently druggable.

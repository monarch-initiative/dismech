name: Cholestatic Liver Injury Module
description: >-
  A conserved module representing the final common pathway shared by the
  cholangiopathies and the hepatocellular cholestatic disorders. A lesion of
  bile formation, canalicular secretion, or bile drainage - whether an
  inherited transporter defect (ATP8B1, ABCB11, ABCB4, TJP2, NR1H4),
  immune-mediated destruction of small or large bile ducts (primary biliary
  cholangitis, primary sclerosing cholangitis, IgG4-related sclerosing
  cholangitis), developmental duct paucity or obliteration (Alagille syndrome,
  biliary atresia), a hormonal or drug insult (intrahepatic cholestasis of
  pregnancy, drug-induced cholestasis), or mechanical obstruction - reduces
  bile flow and traps hydrophobic bile acids inside hepatocytes and the biliary
  tree. The retained bile acids are directly cytotoxic to hepatocytes and
  cholangiocytes; the injured cholangiocyte then acts as a signalling hub,
  proliferating as a ductular reaction and secreting proinflammatory and
  profibrogenic mediators that recruit macrophages and activate portal
  fibroblasts and hepatic stellate cells. The resulting portal-based
  (cholestatic) fibrogenesis progresses to biliary fibrosis and, ultimately,
  biliary cirrhosis with portal hypertension and end-stage liver disease.
  Conforming disorder entries substitute the disorder-specific initiating
  lesion while preserving this conserved retention - injury - ductular reaction
  - fibrosis chain.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "cholestatic_liver_injury#Hepatocellular and Biliary Bile Acid Retention").
  The key conformance target is the central_effector node "Bile Acid-Mediated
  Hepatocyte and Cholangiocyte Injury" - the disorder-agnostic, rate-limiting
  step every conformer funnels through.

  Disorder-specific substitutions at the trigger node: a canalicular transporter
  or tight-junction defect in progressive familial intrahepatic cholestasis
  (ATP8B1/FIC1, ABCB11/BSEP, ABCB4/MDR3, TJP2, NR1H4/FXR); autoimmune
  destruction of small intrahepatic bile ducts in primary biliary cholangitis;
  fibro-obliterative inflammation of larger ducts in primary sclerosing
  cholangitis and IgG4-related sclerosing cholangitis; congenital paucity of
  interlobular bile ducts in Alagille syndrome; perinatal obliteration of the
  extrahepatic biliary tree in biliary atresia; oestrogen/progesterone-metabolite
  inhibition of canalicular export in intrahepatic cholestasis of pregnancy;
  and drug or metabolite inhibition of BSEP in drug-induced cholestasis.

  Scope boundaries. This module is deliberately NOT an Xogenesis module: its
  terminal output is failure of a normal secretory process and the fibrotic
  remodelling that follows, not the formation of a discrete pathological
  structure. It is distinct from - and complementary to -
  `cholelithiasis_biliary_supersaturation`, which models the physical-chemical
  formation of gallstones from supersaturated bile rather than the consequences
  of retained bile acids; a disorder in which an impacted stone obstructs the
  biliary tree may conform to both. The generic mesenchymal arm of the fibrosis
  it produces is modelled by `fibrotic_response`, and the drug-toxicity arm of
  cholestatic drug reactions by `drug_induced_liver_injury`; this module
  contributes the bile-acid-retention and cholangiocyte-hub steps that neither
  of those carries. Hyperbilirubinaemia arising from a pure conjugation or
  bilirubin-transport defect with intact bile acid secretion (Gilbert,
  Crigler-Najjar, Dubin-Johnson, Rotor) is NOT cholestasis in this sense and
  does not conform: those disorders lack bile acid retention and do not produce
  this injury chain.
pathophysiology:
- name: Impaired Bile Formation and Secretion
  description: >-
    The initiating lesion is a reduction in bile formation, canalicular
    secretion, or bile drainage. Conforming disorders substitute their own
    lesion: loss of a hepatocyte canalicular transporter or of canalicular
    tight-junction integrity, immune destruction or developmental paucity of
    bile ducts, or obstruction of the biliary tree. Whatever the cause, the
    result is the same physiological state - cholestasis - defined by impaired
    bile secretion.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  biological_processes:
  - preferred_term: bile acid secretion
    term:
      id: GO:0032782
      label: bile acid secretion
    modifier: DECREASED
  - preferred_term: bile acid and bile salt transport
    term:
      id: GO:0015721
      label: bile acid and bile salt transport
    modifier: DECREASED
  locations:
  - preferred_term: bile duct
    term:
      id: UBERON:0002394
      label: bile duct
  evidence:
  - reference: PMID:30148122
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cholestasis is characterised by impaired bile secretion and accumulation
      of bile salts in the organism.
    explanation: >-
      Defines the initiating lesion of the module as impaired bile secretion,
      and couples it directly to the downstream bile salt accumulation node.
      Evidence source is OTHER because this is a review synthesizing clinical
      and molecular genetic data.
  - reference: PMID:23141890
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three types of PFIC have been identified and associated with mutations in
      hepatocellular transport-system genes involved in bile formation.
    explanation: >-
      Establishes that loss-of-function defects in hepatocellular transport
      genes are a route into this trigger node, the substitution conforming
      inherited cholestasis entries make.
  downstream:
  - target: Hepatocellular and Biliary Bile Acid Retention
    causal_link_type: DIRECT
    description: >-
      Failure of canalicular secretion or bile drainage traps bile acids in the
      hepatocyte and the biliary tree instead of exporting them into bile.

- name: Hepatocellular and Biliary Bile Acid Retention
  description: >-
    Bile acids that cannot be exported accumulate to supraphysiological
    concentrations inside hepatocytes, in the biliary tree, and in the systemic
    circulation. Retention drives two opposing responses: a deteriorative
    response, in which the accumulated hydrophobic bile acids act as detergents
    and signalling molecules that injure cells, and an adaptive response, in
    which alternative basolateral export pumps, bile acid hydroxylation, and
    FXR-mediated repression of bile acid synthesis act to lower the intracellular
    load. The balance between these two responses sets whether cholestasis stays
    compensated or progresses, and it is the node on which the bile-acid-directed
    drugs act.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: bile acid metabolic process
    term:
      id: GO:0008206
      label: bile acid metabolic process
    modifier: DYSREGULATED
  - preferred_term: bile acid and bile salt transport
    term:
      id: GO:0015721
      label: bile acid and bile salt transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:30972450
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it can be triggered by a variety of factors that induce 2 types of
      biological responses, namely a deteriorative response, caused by bile acid
      accumulation, and an adaptive response, aimed at removing the accumulated
      bile acids.
    explanation: >-
      States the two-response structure of this node - injury driven by bile acid
      accumulation, opposed by an adaptive removal response - and that diverse
      upstream triggers converge on it. Evidence source is OTHER because this is
      a review of mechanisms and in vitro models.
  - reference: PMID:30148122
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary cholestasis is a heterogeneous group of rare autosomal
      recessive liver disorders, which are characterised by intrahepatic
      cholestasis, pruritus, and jaundice and caused by defects in genes related
      to the secretion and transport of bile salts and lipids.
    explanation: >-
      Links the retention state to its systemic clinical readouts (pruritus,
      jaundice) and confirms that heterogeneous genetic lesions converge on it.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Bile Acid-Mediated Hepatocyte and Cholangiocyte Injury
    causal_link_type: DIRECT
    description: >-
      Retained hydrophobic bile acids reach concentrations that are directly
      cytotoxic to hepatocytes and to the cholangiocytes lining the bile ducts.

- name: Bile Acid-Mediated Hepatocyte and Cholangiocyte Injury
  description: >-
    Accumulated hydrophobic bile acids kill hepatocytes and injure
    cholangiocytes. In animal models of bile acid overload the biliary
    concentrations reached are sufficient to cause direct hepatocyte
    cytotoxicity and necrosis, with recruitment of neutrophils and induction of
    proinflammatory genes following the onset of that necrosis rather than
    initiating it. The injured cholangiocyte is not a passive casualty: it
    becomes the central signalling hub of the cholangiopathies, adopting a
    senescence-associated secretory phenotype that is both proinflammatory and
    profibrogenic. This is the disorder-agnostic, rate-limiting step of the
    module and the key conformance target.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:24742700
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only the observed biliary levels of taurochenodeoxycholic acid and
      potentially tauro-LCA caused direct cytotoxicity in mouse hepatocytes.
    explanation: >-
      Establishes that the bile acid concentrations actually reached during
      cholestasis are directly cytotoxic to hepatocytes, which is the causal
      claim this node makes. Evidence source is MODEL_ORGANISM because the
      measurement was made in lithocholic-acid-fed mice.
  - reference: PMID:24742700
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data support the conclusion that neutrophil recruitment occurs after
      the onset of bile acid-induced necrosis in LCA-fed animals, and is not a
      primary mechanism of cell death when cholestasis occurs through
      accumulation of hydrophobic bile acids.
    explanation: >-
      Orders the two arms of this node: direct bile acid cytotoxicity comes
      first, and the neutrophilic inflammatory response follows it. Conforming
      entries should not curate neutrophil influx as the initiating injury
      mechanism in hydrophobic-bile-acid cholestasis. Evidence source is
      MODEL_ORGANISM because this is a mouse feeding study.
  - reference: PMID:39250501
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The common pathways involve cholangiocytes, the epithelial cells lining
      the intrahepatic and extrahepatic bile ducts, which are central to the
      pathogenesis of these disorders.
    explanation: >-
      Supports treating cholangiocyte injury as the shared central step across
      the cholangiopathies rather than a disorder-specific detail. Evidence
      source is OTHER because this is a review synthesizing human and
      experimental data.
  - reference: PMID:39250501
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The proclivity of these cells to undergo a senescence-associated secretory
      phenotype, which is proinflammatory and profibrogenic, and the intrinsic
      intracellular activation pathways resulting in the secretion of cytokines
      and chemokines are reviewed.
    explanation: >-
      Identifies the cholangiocyte senescence-associated secretory phenotype as
      the mechanism coupling this injury node to the downstream ductular
      reaction and fibrogenesis nodes. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Ductular Reaction and Cholangiocyte-Driven Fibrogenesis
    causal_link_type: DIRECT
    description: >-
      Injured and senescent cholangiocytes proliferate and secrete cytokines and
      profibrogenic mediators that engage portal fibroblasts, hepatic stellate
      cells, and macrophages.

- name: Ductular Reaction and Cholangiocyte-Driven Fibrogenesis
  description: >-
    Cholangiocyte proliferation at the portal-parenchymal interface produces the
    ductular reaction, the histological hallmark of chronic cholestasis. The
    reactive ductular cells secrete cytokines including TNF-alpha and TGF-beta
    that recruit and activate macrophages (Kupffer cells) and hepatic stellate
    cells, and they engage in direct crosstalk with portal fibroblasts. The
    result is portal-based collagen deposition - cholestatic fibrogenesis -
    which is anatomically distinct from the pericentral fibrosis of
    steatohepatitis and alcohol-related liver disease. The extent of ductular
    reaction tracks with the rate of disease progression.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  - preferred_term: Kupffer cell
    term:
      id: CL:0000091
      label: Kupffer cell
  biological_processes:

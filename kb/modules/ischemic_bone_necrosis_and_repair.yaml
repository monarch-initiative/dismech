  downstream:
  - target: Necrotic Bone DAMP Release and Inflammatory Repair Bias
    description: >-
      Dying bone and marrow cells release HMGB1, RANKL and other damage-associated
      molecular patterns into the necrotic segment, and inflammatory cytokines rise
      with time; this is what sets the repair response toward resorption and fibrosis.
  - target: Resorption-Dominant Revascularization and Creeping Substitution
    description: >-
      The necrotic segment cannot remodel itself; repair arrives as vessels and
      osteoclasts invading from the viable margin, so revascularization and resorption
      of dead bone are coupled.
- name: Epiphyseal Cartilage-Canal Ischemic Chondronecrosis
  description: >-
    During growth the secondary ossification centre of an epiphysis is supplied through
    vessels running in cartilage canals, and the growth cartilage around it depends on
    them. Focal failure or transection of these vessels kills the chondrocytes and the
    canal endothelium of the supplied growth cartilage before any bone has mineralised
    at that site. The sequence was reproduced causally by transecting cartilage-canal
    vessels in foals, and histologically identical lesions, confirmed to represent
    cartilage-canal supply failure, were found at the predilection sites for juvenile
    osteochondritis dissecans in human paediatric knees. This node is specific to the
    skeletally immature conformers and is the reason a module built from the adult
    picture alone would misdescribe them.
  role: effector
  biological_scale: CELLULAR

    explanation: >-
      Names the non-traumatic route to supply interruption, endothelial dysfunction with
      thrombosis and failed angiogenesis, which is what the endothelial cell type and
      the DECREASED angiogenesis binding on this node describe.
  - reference: PMID:12136349
    reference_title: "Femoral head vascularisation in Legg-Calvé-Perthes disease: comparison of dynamic gadolinium-enhanced subtraction MRI with bone scintigraphy."

    snippet: "Osteonecrosis of the femoral head (ONFH), a condition characterized by the presence of a necrotic bone lesion in the femoral head, is caused by a disruption in the blood supply."
    explanation: >-
      States the defining causal claim of the trigger node for the commonest adult
      conformer: the necrotic lesion follows interruption of the blood supply. Graded
      OTHER because the source is a narrative review.
  - reference: PMID:38540277

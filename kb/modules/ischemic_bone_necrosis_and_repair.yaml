treatments:
- name: Antiresorptive Therapy during the Resorptive Repair Phase (Bisphosphonate or RANKL Inhibition)
  description: >-
    Because the deformity develops during the resorption-dominant repair phase rather
    than at infarction, suppressing osteoclastic resorption while the necrotic segment
    is revascularised is the module's drug-target pattern. In the piglet model of total
    femoral head infarction, RANKL inhibition with osteoprotegerin-Fc and local
    ibandronate both preserved epiphyseal height and trabecular structure, and
    ibandronate combined with BMP-2 added new bone formation that the antiresorptive
    alone lacks. In adults bisphosphonates are among the pharmacological options for
    pre-collapse osteonecrosis. The systematic review of bisphosphonate therapy in
    Legg-Calve-Perthes disease found only three level IV clinical studies with
    inconsistent patient groups and drug protocols, so the human evidence for the
    paediatric indication is inconclusive and the pattern rests on the preclinical
    work. Conforming entries substitute the agent actually used (ibandronate or
    zoledronate clinically, OPG-Fc experimentally) and the stage at which it was given.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiresorptive pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ibandronate
      term:
        id: CHEBI:41060
        label: IBANDRONATE

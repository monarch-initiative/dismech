- name: Resorption-Dominant Revascularization and Creeping Substitution
  description: >-
    Repair of necrotic bone proceeds by creeping substitution: vessels sprout into the
    dead segment from the viable margin, bringing osteoclasts (and chondroclasts in an
    unossified epiphysis) that resorb necrotic bone and granulation tissue that fills the
    space, while osteoblasts lay down new bone on the remaining scaffold. In ischemic
    osteonecrosis this phase is unbalanced: resorption predominates and new bone
    formation is delayed, so the segment loses trabecular bone exactly when it is being
    repaired, and in children this produces the fragmented radiographic appearance of
    the Waldenstrom fragmentation stage. The extent and pattern of revascularization
    varies between individuals and governs prognosis; where angiogenesis-osteogenesis
    coupling is damaged, as under glucocorticoids, the capacity for reconstruction is
    reduced. This is the key conformance target: every conformer, adult or paediatric,
    femoral, vertebral or tarsal, passes through it, and it is the step the
    antiresorptive drug-target pattern acts on.

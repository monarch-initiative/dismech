      the same resorption-dominant phase the adult arm reaches.
- name: Necrotic Bone DAMP Release and Inflammatory Repair Bias
  description: >-
    The fluid of a necrotic femoral head contains HMGB1, biglycan, 4-hydroxynonenal and
    RANKL, and its IL-1, IL-6 and TNF content rises with the progression of necrosis.
    These damage-associated molecular patterns and cytokines act on the cells recruited
    to repair the segment: they inhibit osteoblastic differentiation of mesenchymal stem
    cells while driving their proliferation and fibrogenic differentiation, raise the
    RANKL/OPG ratio, and polarise macrophages toward an M1 phenotype through TLR4. In
    children with juvenile ischemic osteonecrosis IL-6 is raised in hip synovial fluid,
    and in Kummell disease the same cytokines are raised in vertebral blood. The result
    is a repair response that produces osteoclasts and fibrous tissue in preference to
    bone, which is why the reparative phase is itself destructive.

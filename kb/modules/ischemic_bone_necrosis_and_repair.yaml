- name: Structural Failure of Necrotic Bone under Mechanical Load
  description: >-
    The necrotic, partly resorbed segment cannot bear physiological load. In the adult
    femoral head a subchondral fracture develops and the articular surface collapses;
    in the child's epiphysis the head flattens and fragments and, in osteochondritis
    dissecans, an osteochondral fragment separates; in the vertebral body delayed
    collapse opens an intravertebral vacuum cleft of nonunion; in the tarsal navicular
    the bone sclerosses, flattens and fragments. The femoral head's lack of collateral
    supply and the immature head's mechanical weakening after necrosis are why the
    failure is so often there. Load is the variable: in the piglet model unloading
    reduces deformity even though it does not improve the underlying repair.

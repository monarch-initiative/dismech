- name: Residual Articular Deformity and Secondary Osteoarthritis
  description: >-
    Once the articular surface has collapsed or healed flattened, the joint is
    mechanically incongruent and degenerates. In adults osteonecrosis of the femoral
    head is the main indication for total hip arthroplasty in young and middle-aged
    patients, and joint-preserving procedures are indicated only before collapse. In
    children the same deformity, once the epiphysis has reossified and remodelled,
    produces early-onset osteoarthritis, with the Stulberg classification of residual
    femoral head shape predicting it; but the paediatric outcome is not fixed, because
    the articular osteochondroses are self-limited and a spherical, congruent surface
    results when repair keeps pace with load. The consequence node is therefore the
    outcome the whole chain is managed against, not an inevitable endpoint.
  role: consequence
  biological_scale: TISSUE
  evidence:
  - reference: PMID:22488623

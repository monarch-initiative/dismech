    explanation: >-
      Shows the trigger recurring at a non-epiphyseal site: a compression fracture
      interrupting the vertebral body's supply. The sentence is the case report's
      introductory definition of the entity, hence BACKGROUND.
  - reference: PMID:40041162
    reference_title: Progress in understanding Legg-Calvé-Perthes disease etiology from a molecular and cellular biology perspective.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The in-depth study of LCPD cell biology has facilitated the suggestion regarding structural and/or functional abnormalities of microvascular endothelial cells in LCPD."
    explanation: >-
      Places the microvascular endothelium at the trigger in the paediatric disease as
      well as the adult one, which is why the node binds the endothelial cell rather
      than a site-specific vessel.
  downstream:
  - target: Ischemic Osteocyte and Marrow Cell Death
    description: >-
      Loss of perfusion deprives the bone and marrow of the segment of oxygen and
      nutrients; osteocytes and marrow cells die by apoptosis and necrosis.
  - target: Epiphyseal Cartilage-Canal Ischemic Chondronecrosis
    description: >-
      In a growing epiphysis the same interruption, when it affects cartilage-canal
      vessels, kills the chondrocytes of the epiphyseal growth cartilage before bone has
      formed at that site. This edge applies only to skeletally immature conformers.
- name: Ischemic Osteocyte and Marrow Cell Death
  description: >-
    Disrupted perfusion kills the osteocytes of the affected trabeculae and the
    haematopoietic and stromal cells of the marrow between them. This is the defining
    cellular lesion of osteonecrosis and the state histology confirms when a necrotic
    vertebral body or femoral head is biopsied: empty lacunae and necrotic marrow in a
    segment whose mineralised matrix is still intact. The necrotic bone cannot remodel
    itself, which is why what happens next depends on cells recruited from the viable
    margin. Dying cells also release the damage-associated molecular patterns that bias
    the subsequent repair.

name: Ischemic Bone Necrosis and Repair Module
description: >-
  A conserved skeletal module for bone death from interrupted blood supply and the
  repair response that decides the outcome. Interruption of the vascular supply to a
  bone segment (thrombotic, traumatic, embolic, compressive, or endothelial-toxic) kills
  the osteocytes and marrow of that segment and, in a growing epiphysis, also the
  chondrocytes supplied by cartilage canals, injuring the growth plate and delaying
  endochondral ossification. Dying cells release damage-associated molecular patterns
  and cytokines that bias the repair response toward inflammation, osteoclastogenesis
  and fibrogenesis rather than osteogenesis. Revascularization then drives a
  resorption-dominant phase of creeping substitution in which necrotic bone is removed
  faster than new bone is laid down, so the segment is mechanically weakest exactly
  when it is being repaired; under continued load it fractures and collapses, and the
  residual deformity produces secondary osteoarthritis. The key conformance target is
  `ischemic_bone_necrosis_and_repair#Resorption-Dominant Revascularization and Creeping
  Substitution`, the step every conformer funnels through whatever interrupted the
  supply and whatever bone was affected. The module carries two arms off one trigger
  so that it describes children correctly: adult osteonecrosis conforms on the bony
  arm, the articular osteochondroses (Legg-Calve-Perthes, Kohler, Freiberg, juvenile
  osteochondritis dissecans) conform on the epiphyseal arm, and both conform on the
  shared repair and failure segment. It carries the antiresorptive drug-target pattern
  (bisphosphonate or RANKL inhibition acting on the central effector) and the mechanical
  unloading and containment pattern (acting on structural failure). It is complementary
  to `osteoporosis_bone_resorption`, which models a systemic remodeling imbalance in
  viable bone with no ischemic trigger, and to `thrombogenesis` and `atherogenesis`,
  which stop at the vessel; this module starts where the perfusion stops.
category: Module
creation_date: "2026-10-04T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create an "Ischemic Bone
  Necrosis" Disease entry; the disease entries are Osteonecrosis (MONDO:0005380),
  Osteochondrosis (MONDO:0018381), Kummell_Disease, Osteochondritis_of_Tarsal_Metatarsal_Bone,
  Avascular_Necrosis_Of_Femoral_Head_Primary_2 and their relatives. Disorder entries
  reference individual nodes via conforms_to, for example
  "ischemic_bone_necrosis_and_repair#Resorption-Dominant Revascularization and Creeping
  Substitution".

  Arm scoping. Conformance is per node, so an entry takes only the arm that applies to
  it. An adult femoral-head, vertebral-body or navicular necrosis conforms at the trigger,
  at Ischemic Osteocyte and Marrow Cell Death, and at the shared repair and failure nodes.
  A growing-epiphysis disorder additionally conforms at Epiphyseal Cartilage-Canal
  Ischemic Chondronecrosis and at Growth Plate Injury and Delayed Endochondral
  Ossification; it may also conform at the osteocyte-death node, because the secondary
  ossification centre of a child's epiphysis contains bone and marrow that die too. The
  two epiphyseal nodes must not be declared by an adult entry, and the apophyseal and
  physeal families of Osteochondrosis (Osgood-Schlatter, Sever, Scheuermann) must not
  conform anywhere in this module: they are traction and compression lesions of growth
  cartilage without an ischemic trigger, and the Osteochondrosis entry keeps them on
  separate chains for that reason.

  Disorder-specific substitutions at the trigger. Glucocorticoid or alcohol exposure
  with endothelial dysfunction and hypofibrinolysis (Osteonecrosis), a displaced femoral
  neck fracture or dislocation (traumatic osteonecrosis), sickled erythrocytes or
  nitrogen emboli (sickle cell disease, dysbaric osteonecrosis), compromise of the
  basivertebral microcirculation after a minor compression fracture (Kummell disease),
  endothelial calcium overload and microvascular thrombosis downstream of a TRPV4
  gain-of-function variant (Avascular_Necrosis_Of_Femoral_Head_Primary_2), and the
  idiopathic, probably mechanically induced, interruption of the cartilage-canal supply
  to the capital femoral epiphysis (Legg-Calve-Perthes). The etiology-specific amplifier
  of glucocorticoid and alcohol osteonecrosis, marrow adipogenesis and lipotoxicity, is
  deliberately NOT a module node: it does not recur in the traumatic, vertebral or
  paediatric conformers, so it stays in the Osteonecrosis entry.

  What the module does not settle. Why the capital femoral epiphysis loses its supply in
  Legg-Calve-Perthes is unresolved; the 64-article systematic review (PMID:30918798)
  finds no decisive hypothesis, and that question is curated as the
  perthes_etiology_undetermined knowledge gap on the Osteochondrosis entry, not here. The
  classical repeated-infarction model of Perthes disease is likewise not asserted by the
  module's causal spine: an entry that wants it should carry it as a
  mechanistic_hypothesis with EMERGING status. The paediatric repair nodes rest on
  piglet, foal, rat and mouse ischemia models with human histology and perfusion imaging
  as the translational anchor; see the HUMAN_MODEL_MISMATCH discussion before treating
  them as established human mechanism.

  Ontology bindings. Nodes bind GO, CL and UBERON only, per the create-module skill.
  The central effector's ossification DECREASED binding is read as net new bone
  formation falling behind resorption during repair, not as a systemic ossification
  defect. No module_categories value is declared: the trigger node is a vascular event
  rather than a toxicant exposure, so TOXICOLOGY would assert more than the module
  claims even though glucocorticoid-induced osteonecrosis is its commonest adult
  conformer; a wrong pill is worse than no pill. No Xogenesis anchor: the terminal
  output is loss and collapse of a structure, not formation of a pathological one.
pathophysiology:
- name: Bone Vascular Supply Interruption
  description: >-
    The initiating event is loss of perfusion to a segment of bone. The interruption may
    be mechanical (vessel disruption by fracture or dislocation, transection of
    cartilage-canal vessels in a growing epiphysis), occlusive (microvascular
    thrombosis, sickled erythrocytes, gas emboli) or the product of endothelial
    dysfunction, coagulopathy and failed angiogenesis in a chronic inflammatory milieu,
    as with glucocorticoid and alcohol exposure. Bones with a precarious or
    non-collateralised supply, the femoral head, the capital femoral epiphysis before its
    transphyseal vessels mature, the tarsal navicular, the vertebral body around the
    basivertebral foramen, are the recurrent sites. Dynamic contrast-enhanced MRI
    detects the resulting epiphyseal ischemia in children directly.

  - target: Resorption-Dominant Revascularization and Creeping Substitution
    treatment_effect: INHIBITS
    description: >-
      Osteoclast inhibition during revascularization preserves the necrotic trabecular
      scaffold until new bone can replace it, reducing the deformity that the unopposed
      resorptive phase produces.
    evidence:

      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Non-weight-bearing decreases the femoral head deformity but increases bone resorption without increasing bone formation in an experimental animal model of Legg-Calvé-Perthes disease."
      explanation: >-
        The reason the edge points at structural failure and not at the central
        effector: unloading reduces deformity while leaving the resorption-dominant
        repair unimproved. The sentence summarises the group's earlier piglet result
        in this paper's background.
  evidence:

    explanation: >-
      The human translation of the foal experiment: the same lesion, with the same
      histological signature, at the sites where juvenile osteochondritis dissecans
      occurs in children.
  downstream:
  - target: Growth Plate Injury and Delayed Endochondral Ossification
    description: >-
      Necrotic growth cartilage cannot be converted to bone, so endochondral
      ossification is focally delayed at the lesion and, when the physis shares the
      lost supply, its proliferative and hypertrophic zones thin.
- name: Growth Plate Injury and Delayed Endochondral Ossification
  description: >-
    The ischemic epiphysis fails to ossify on schedule. Necrotic growth cartilage is
    not converted to bone, producing a focal delay in endochondral ossification that is
    the defining feature of osteochondrosis, and when the physis is within the ischemic
    territory its proliferative and hypertrophic zones thin and the primary spongiosa
    beneath it is lost. In the piglet model of Legg-Calve-Perthes disease these changes
    appear within two days of inducing ischemia, and metaphyseal abnormalities are seen
    on perfusion MRI in children. Because the growth plate is both injured and still
    growing, the paediatric disease is a growth disturbance as well as a necrosis, and
    its outcome is staged on reossification and remodelling, which has no adult
    equivalent.
  role: effector

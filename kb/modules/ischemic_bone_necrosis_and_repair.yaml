- name: Mechanical Unloading and Containment of the Necrotic Segment
  description: >-
    Because structural failure requires load on a weakened segment, reducing or
    redistributing that load is the module's non-pharmacological pattern: protected
    weight-bearing and, in Legg-Calve-Perthes disease, containment of the femoral head
    within the acetabulum by bracing or osteotomy so that it remodels against a
    spherical mould. In the piglet model, enforced non-weight-bearing decreased femoral
    head deformity, but it did so without improving the repair itself: resorption
    increased and formation did not, which is why unloading acts on the structural
    failure node and not on the central effector, and why it is combined with
    antiresorptive or anabolic therapy experimentally. In older children the current
    operative and non-operative containment treatments have only modest success in
    producing a spherical head.
  treatment_term:
    preferred_term: mechanical unloading and containment of the necrotic segment
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Structural Failure of Necrotic Bone under Mechanical Load
    treatment_effect: INHIBITS
    description: >-
      Removing or redistributing load on the weakened segment reduces fracture and
      flattening during the resorptive phase without changing the repair biology.
    evidence:
    - reference: PMID:25232075
      reference_title: "Local administration of bone morphogenetic protein-2 and bisphosphonate during non-weight-bearing treatment of ischemic osteonecrosis of the femoral head: an experimental investigation in immature pigs."

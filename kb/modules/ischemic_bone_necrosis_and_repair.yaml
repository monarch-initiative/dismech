discussions:
- discussion_id: gap_paediatric_repair_nodes_rest_on_animal_ischemia_models
  prompt: >-
    Do the growth-plate injury, DAMP-driven repair bias and resorption-dominant repair
    measured after surgically induced femoral head ischemia in piglets, foals, rats and
    mice reproduce what happens in children with Legg-Calve-Perthes disease and the other
    articular osteochondroses, whose ischemia is idiopathic, possibly repeated, and
    never total?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Growth Plate Injury and Delayed Endochondral Ossification
  - pathophysiology#Necrotic Bone DAMP Release and Inflammatory Repair Bias
  - pathophysiology#Resorption-Dominant Revascularization and Creeping Substitution
  rationale: >-
    The paediatric arm's quantitative claims come from models in which the whole
    femoral head is infarcted at once by ligating the neck or transecting canal
    vessels, then followed for weeks. The human anchors are real but thinner: histology
    of ischemic chondronecrosis and chondroclast-rich repair at predilection sites in
    children's knees, perfusion MRI of epiphyseal ischemia and revascularization
    pattern, raised IL-6 in the synovial fluid of children with juvenile ischemic
    osteonecrosis. No human study measures growth-plate zone thickness, necrotic bone
    fluid DAMP content or the RANKL/OPG ratio in the affected epiphysis, and the piglet
    authors themselves qualify growth disruption as occurring "in some children". The
    repair-biology claims and the two drug-target patterns should therefore be read as
    MODEL_ORGANISM evidence with human clinical correlates, not as established human
    mechanism; a conforming entry that states them for a human disease should keep the
    evidence_source distinction visible and may want to record the IL-6-blockade and
    antiresorptive leads as proposed rather than curated treatments. The Osteochondrosis
    entry's osteochondrosis_animal_ischemia_human_translation discussion frames the same
    question for the chondronecrosis node; this one extends it to the repair nodes the
    module adds.
  evidence:
  - reference: PMID:36696941
    reference_title: Effects of acute femoral head ischemia on the growth plate and metaphysis in a piglet model of Legg-Calvé-Perthes disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Our findings suggest that endochondral ossification may be disrupted at an earlier time point than previously reported and that growth disruption may occur in the piglet model as occurs in some children with LCPD."
    explanation: >-
      The authors' own hedge: the model's growth disruption corresponds to what happens
      in some children, not all, which is the mismatch this discussion records.
  - reference: PMID:30248503
    reference_title: Juvenile osteochondritis dissecans of the knee is a result of failure of the blood supply to growth cartilage and osteochondrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Defects corresponded to areas of ischemic chondronecrosis in sections from all 11 histologically validated lesions."
    explanation: >-
      The strongest human anchor for the paediatric arm: the animal lesion is
      histologically confirmed in children. It covers the chondronecrosis node, not the
      quantitative repair claims, which is where the gap lies.
  - reference: PMID:30404032
    reference_title: IL6 receptor blockade preserves articular cartilage and increases bone volume following ischemic osteonecrosis in immature mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The findings lead to a possible application of tocilizumab for preclinical study using a large animal model of JIO and a clinical trial to validate this treatment."
    explanation: >-
      The IL-6-blockade lead is explicitly a mouse result awaiting large-animal and
      clinical validation, which is why it is recorded here as part of the gap rather
      than as a module treatment.

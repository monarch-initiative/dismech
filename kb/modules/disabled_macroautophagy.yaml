name: Disabled Macroautophagy Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.,
  2023) termed disabled macroautophagy: the age-associated decline of the
  macroautophagy machinery and the loss of its cytoplasmic quality-control
  function. Macroautophagy is the lysosomal degradation pathway - mediated by
  the evolutionarily conserved autophagy-related (ATG) genes - that sequesters
  and recycles dysfunctional organelles, aggregated proteins, and intracellular
  microbes, playing a fundamental role in cellular, tissue, and organismal
  homeostasis. Autophagic potential falls in normal and pathological aging; when
  ATG-mediated capture and lysosomal clearance fail, damaged cytoplasmic
  constituents accumulate, contributing to neurodegenerative, inflammatory, and
  other age-related disease. Because autophagy induction (by dietary restriction
  or nutrient-signaling inactivation) counteracts age-associated damage,
  restoring autophagic competence is a target for healthy-aging intervention.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disease-specific autophagy lesion
  (e.g. an ATG-pathway or autophagy-adaptor mutation, or secondary autophagy
  suppression) while preserving the conserved machinery-decline ->
  failed-clearance -> accumulated-damage chain.
category: Module
module_categories:
- METABOLISM
- AGING
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"). This module
  treats macroautophagy COMPETENCE (the ATG machinery) as the hallmark itself,
  distinct from - but complementary to - the specific autophagy-related arms
  modeled elsewhere: deregulated_nutrient_sensing models mTORC1-driven autophagy
  SUPPRESSION as one downstream node, loss_of_proteostasis models autophagy as
  one aggregate-clearance route, and mitochondrial_dysfunction models mitophagy.
  Keep this module focused on the general macroautophagy pathway; route
  organelle- or substrate-specific claims to those modules. Key conformance
  target: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control".
pathophysiology:
- name: Autophagy Machinery Decline
  description: >-
    The macroautophagy pathway - autophagosome formation and lysosomal fusion,
    mediated by the conserved autophagy-related (ATG) genes - declines in
    capacity during normal and pathological aging. This reduced autophagic
    potential is the initiating lesion of the hallmark.
  role: trigger
  biological_processes:
  - preferred_term: Macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  - preferred_term: Autophagosome Assembly
    term:
      id: GO:0000045
      label: autophagosome assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:30633901
    reference_title: "Biological Functions of Autophagy Genes: A Disease Perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The lysosomal degradation pathway of autophagy plays a fundamental role in
      cellular, tissue, and organismal homeostasis and is mediated by
      evolutionarily conserved autophagy-related (ATG) genes.
    explanation: >-
      Defines the ATG-mediated macroautophagy pathway whose age-associated
      decline is the trigger modeled here. Evidence source is OTHER because this
      is a review.
  - reference: PMID:21884931
    reference_title: "Autophagy and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      normal and pathological aging are often associated with a reduced
      autophagic potential
    explanation: >-
      Documents reduced autophagic potential in normal and pathological aging,
      the initiating decline of this module. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Failure of Cytoplasmic Quality Control
- name: Failure of Cytoplasmic Quality Control
  description: >-
    Autophagy selectively targets dysfunctional organelles, intracellular
    microbes, and pathogenic proteins for recycling, counteracting the
    age-associated accumulation of damaged organelles and proteins. When
    macroautophagy is disabled, this cytoplasmic quality-control and
    recycling function is lost - the central effector state that
    disease-specific autophagy lesions converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:30633901
    reference_title: "Biological Functions of Autophagy Genes: A Disease Perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autophagy selectively targets dysfunctional organelles, intracellular
      microbes, and pathogenic proteins, and deficiencies in these processes may
      lead to disease.
    explanation: >-
      Establishes autophagy's selective quality-control function and that its
      deficiency causes disease, the central effector modeled here. Evidence
      source is OTHER because this is a review.
  - reference: PMID:25654554
    reference_title: "Essential role for autophagy in life span extension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both starvation and the genetic inactivation of nutrient signaling
      converge on the induction of autophagy, a cytoplasmic recycling process
      that counteracts the age-associated accumulation of damaged organelles and
      proteins as it improves the metabolic fitness of cells.
    explanation: >-
      Establishes autophagy as the cytoplasmic recycling process that clears
      age-associated damage; its failure is the loss modeled here. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Accumulated Cellular Damage and Age-Related Disease
- name: Accumulated Cellular Damage and Age-Related Disease
  description: >-
    With cytoplasmic quality control disabled, damaged organelles and pathogenic
    proteins accumulate, producing degenerative changes and predisposing to
    age-related disease, especially neurodegenerative and inflammatory
    disorders. This is the conserved consequence of disabled macroautophagy; the
    specific clinical phenotype is supplied by the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:30633901
    reference_title: "Biological Functions of Autophagy Genes: A Disease Perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Definitive etiological links exist between mutations in genes that control
      autophagy and human disease, especially neurodegenerative, inflammatory
      disorders and cancer.
    explanation: >-
      Establishes etiological links between autophagy-gene defects and
      age-related disease, the consequence modeled here. Evidence source is OTHER
      because this is a review.
  - reference: PMID:21884931
    reference_title: "Autophagy and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic inhibition of autophagy induces degenerative changes in mammalian
      tissues that resemble those associated with aging
    explanation: >-
      Shows that inhibiting autophagy produces aging-like degenerative tissue
      changes, supporting this outcome node. Evidence source is OTHER because
      this is a review.
discussions:
- discussion_id: knowledge_gap_no_human_autophagy_flux_biomarker
  prompt: >-
    Can autophagic flux be measured in a living human, and if not, what would a
    biomarker for this hallmark even look like?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#
  - pathophysiology#Autophagy Machinery Decline
  - pathophysiology#Failure of Cytoplasmic Quality Control
  rationale: >-
    This module has no biochemical block, and that is a finding rather than an
    omission. Of the eleven hallmark-of-aging modules it is the only one where a
    literature search for an accessible human readout returns nothing usable, so the
    absence is recorded here instead of being left ambiguous or papered over with a
    marker that does not measure the hallmark.

    The obstacle is that autophagy is a flux, not a level. The standard readouts, LC3
    and SQSTM1/p62, are steady-state abundances of proteins that are themselves
    consumed by the process, so a raised LC3-II is equally consistent with increased
    autophagosome formation and with blocked downstream degradation. Distinguishing
    the two requires either a lysosomal-inhibitor clamp or a tandem-fluorescent
    reporter, and both are available only in cell culture and animal models, not in
    a living human. The methodological literature is explicit that the individual
    assays are semiquantitative, that several proteins must be read together, and
    preferably over a time course.

    Two consequences worth stating for curators. First, do not import a single LC3 or
    p62 measurement into this module as a readout: without a flux clamp it does not
    have a direction, and `direction` is not optional guesswork. Second, this is a
    genuinely different gap from the ones recorded in loss_of_proteostasis and
    stem_cell_exhaustion. There the marker exists but is scoped to one protein or one
    compartment; here the quantity of interest is not measurable by any accessible
    means, so no amount of further curation will close it. Progress plausibly requires
    a tracer or imaging approach rather than a circulating analyte.
  evidence:
  - reference: PMID:30725456
    reference_title: "Methods to Measure Autophagy in Cancer Metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Because most of these methods are semiquantitative and have significant
      limitations, it is important to emphasize that a combination of these assays is
      recommended for the analysis of autophagy.
    explanation: >-
      States the semiquantitative character and limitations of the available autophagy
      assays, which is why no single one can serve as a biomarker readout. Evidence
      source is OTHER because this is a methods review.
  - reference: PMID:33342508
    reference_title: "Research Techniques Made Simple: Analysis of Autophagy in the Skin."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      measurement of LC3 flux using a dual-fluorescent reporter, which provides a
      quantitative readout of autophagy in cell culture systems in vitro and animal
      models in vivo
    explanation: >-
      The one method described as giving a quantitative flux readout is scoped to cell
      culture and animal models, which is precisely the gap: the quantitative approach
      does not exist for living humans.
  - reference: PMID:33342508
    reference_title: "Research Techniques Made Simple: Analysis of Autophagy in the Skin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the complex regulation of individual autophagy proteins and their
      involvement in multiple pathways means that several proteins must be analyzed
      together, preferably over a time course to accurately interpret changes in
      autophagic activity.
    explanation: >-
      Supports the specific warning against curating a single-protein readout here.
  notes: >-
    Recorded against an intentionally empty biochemical section using the empty-anchor
    form, which is the documented use for a knowledge gap attached to a section with
    no individual item to name.
computational_models:
- name: Tavassoly2015 Autophagy-Apoptosis Decision Model
  description: >-
    ODE model of the interaction between autophagy and apoptosis in mammalian cells,
    representing the two as coupled responses to a common stress input rather than
    as independent programs. Captures the regime in which autophagy is
    cytoprotective and the threshold beyond which the cell commits to apoptosis
    instead.
  model_type: KINETIC
  publication: PMID:26225250
  modeled_mechanisms:
  - target: Autophagy Machinery Decline
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Provides the quantitative dose-response of autophagic flux to stress, so an
      age-related decline in capacity is imposed on the model as a reduction in
      flux parameters and its consequences simulated.
    limitations: >-
      The decline is an input to the model, not an output of it: nothing here
      measures or derives the age-related loss of autophagic capacity, so this
      link cannot be cited as evidence that the decline occurs.
  - target: Failure of Cytoplasmic Quality Control
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Models the switch from successful autophagic clearance to cell-death
      commitment when the stress load exceeds autophagic capacity.
    limitations: >-
      Built for acute stress in mammalian cell culture, not for the gradual
      lifelong decline in autophagic capacity this module describes; ageing enters
      only as an assumed reduction in flux parameters.
  notes: >-
    The only substantially validated dynamic model covering this hallmark. The
    degradative capacity it represents overlaps the proteasome arm modelled in
    loss_of_proteostasis; the two compete for the same misfolded substrate pool.

treatments:
- name: Aspirin (EP300 Inhibition, Caloric-Restriction Mimetic)
  description: >-
    Aspirin and its active metabolite salicylate induce autophagy by inhibiting
    the acetyltransferase EP300, lowering overall protein acetylation and so
    reproducing the biochemical signature of caloric restriction. The mechanism
    is EP300-dependent rather than a general anti-inflammatory effect, and it is
    conserved to the nematode - which is what places aspirin in the
    caloric-restriction-mimetic class rather than merely among drugs that happen
    to raise autophagic flux. Ranked eighth of nine (6/12) by Kulkarni et al.,
    because the anti-inflammatory doses used in animals are not the antiplatelet
    doses used in humans.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Autophagy Machinery Decline
    treatment_effect: ACTIVATES
    description: >-
      Inhibition of EP300 acetyltransferase activity by salicylate de-represses
      autophagic flux, opposing the age-associated decline of the macroautophagy
      machinery this node models.
  evidence:
  - reference: PMID:29490275
    reference_title: Aspirin Recapitulates Features of Caloric Restriction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that aspirin or its active metabolite salicylate induce
      autophagy by virtue of their capacity to inhibit the acetyltransferase
      activity of EP300.
    explanation: >-
      States the drug-target relationship and the molecular mechanism by which
      aspirin acts on this node. Evidence source is IN_VITRO (cultured cells,
      including EP300-deficient and salicylate-resistant EP300 mutant lines).
  - reference: PMID:29490275
    reference_title: Aspirin Recapitulates Features of Caloric Restriction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Accordingly, the pro-autophagic activity of aspirin and salicylate on the
      nematode Caenorhabditis elegans is lost when the expression of the EP300
      ortholog cpb-1 is reduced.
    explanation: >-
      Genetic loss-of-function in a whole organism shows the autophagy induction
      is EP300-dependent rather than an off-target effect, and that the mechanism
      is evolutionarily conserved. Evidence source is MODEL_ORGANISM (C.
      elegans).
- name: Metformin (Autophagic Flux Restoration)
  description: >-
    Metformin restores autophagy in aged human T cells alongside mitochondrial
    function, the pairing that underlies its anti-inflammaging effect. Autophagy
    here is not an incidental readout: siRNA knockdown of the autophagy machinery
    in cells from young donors reproduces the aged inflammatory phenotype, while
    knocking down mitophagy specifically does not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: Autophagy Machinery Decline
    treatment_effect: ACTIVATES
    description: >-
      Metformin increases autophagy in cells from older donors, which show
      autophagy defects relative to younger donors, directly opposing the decline
      this node models.
  evidence:
  - reference: PMID:32402267
    reference_title: Metformin Enhances Autophagy and Normalizes Mitochondrial Function to Alleviate Aging-Associated Inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      T cells from older compared to younger subjects also had defects in
      autophagy and mitochondrial bioenergetics that associate with redox
      imbalance.
    explanation: >-
      Documents the age-associated autophagy defect in human cells that this node
      models and that metformin is then shown to correct. Evidence source is
      IN_VITRO (human CD4+ T cells assayed ex vivo).
  - reference: PMID:32402267
    reference_title: Metformin Enhances Autophagy and Normalizes Mitochondrial Function to Alleviate Aging-Associated Inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Metformin ameliorated the Th17 inflammaging profile by increasing autophagy
      and improving mitochondrial bioenergetics.
    explanation: >-
      States that metformin acts by increasing autophagy, the effect claimed on
      this node. Evidence source is IN_VITRO (human CD4+ T cells treated ex
      vivo).
- name: SGLT2 Inhibition
  description: >-
    SGLT2 inhibitors reactivate autophagy in cell types where it has been
    suppressed by metabolic disease, demonstrated most clearly in podocytes of
    diabetic mice by direct morphometric counting of autophagosomes and
    autolysosomes rather than by marker staining alone. SGLT2 inhibitors are the
    only class to receive the maximum score (12/12) in the Kulkarni et al.
    geroscience prioritization, on the strength of rodent lifespan extension plus
    randomized human healthspan and mortality benefit.

    The claim here is class-level, so the drug class itself is bound as an agent
    alongside the two molecules. Empagliflozin and canagliflozin are listed as
    separate exemplars of that class, NOT as a combination regimen: empagliflozin
    supplies the podocyte autophagy result and canagliflozin the Interventions
    Testing Program lifespan result. They are not co-administered, and nothing
    here supports giving them together.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
    - preferred_term: empagliflozin
      term:
        id: CHEBI:82720
        label: empagliflozin
    - preferred_term: canagliflozin
      term:
        id: CHEBI:73274
        label: canagliflozin
  target_mechanisms:
  - target: Autophagy Machinery Decline
    treatment_effect: RESTORES
    description: >-
      Empagliflozin restores autophagosome and autolysosome formation in
      podocytes in which autophagy had been suppressed, recovering flux rather
      than driving it above baseline.
  evidence:
  - reference: PMID:32340263
    reference_title: "SGLT2 Inhibitor Empagliflozin and DPP4 Inhibitor Linagliptin Reactivate Glomerular Autophagy in db/db Mice, a Model of Type 2 Diabetes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Empagliflozin and linagliptin, both as monotherapy and in combination,
      enhanced the areas of glomerular staining for beclin-1 and LAMP-1 and
      increased Vv of autophagosomes and autolysosomes in podocytes.
    explanation: >-
      Reports both marker staining and direct electron-microscopic volume-density
      counts of autophagosomes and autolysosomes, supporting restored autophagic
      flux rather than marker accumulation alone. Marked INDIRECT because the
      autophagy suppression reversed here is that of a metabolic-disease model -
      db/db diabetic mice, in podocytes - not the chronological age-associated
      decline this node models; the extrapolation from one to the other is an
      inference step. Evidence source is MODEL_ORGANISM (db/db mice).
  - reference: PMID:32990681
    reference_title: Canagliflozin extends life span in genetically heterogeneous male but not female mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: Cana extended median survival of male mice by 14%.
    explanation: >-
      Establishes SGLT2 inhibition as a genuine geroprotector in the NIA
      Interventions Testing Program, the result that motivates curating the class
      against an aging hallmark at all. Marked INDIRECT because lifespan
      extension in male mice does not by itself demonstrate that the benefit runs
      through autophagy restoration, and the effect was absent in females.
      Evidence source is MODEL_ORGANISM (genetically heterogeneous UM-HET3 mice).

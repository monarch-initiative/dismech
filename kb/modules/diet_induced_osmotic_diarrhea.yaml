name: Diet-Induced Osmotic Diarrhea Module
description: >-
  A conserved pathophysiology module representing the final common pathway of
  the "diet-induced" (classically termed osmotic) congenital diarrheas, in which
  a specific ingested nutrient cannot be digested or absorbed and is therefore
  retained in the intestinal lumen as an osmotically active solute. The trigger
  is loss of a single, substrate-specific step at the enterocyte apical surface:
  either a brush-border disaccharidase (lactase-phlorizin hydrolase/LCT,
  sucrase-isomaltase/SI, trehalase/TREH) or an apical monosaccharide transporter
  (the sodium/glucose cotransporter SGLT1/SLC5A1). Because the lost step is
  substrate-specific, the ingested substrate escapes hydrolysis or uptake and
  accumulates in the lumen; this luminal solute retention is the rate-limiting,
  disorder-agnostic node that every conformer funnels through. Retained solute
  osmotically draws water into the small-bowel lumen, causing distension and
  rapid propulsion of fluid into the colon, while the substrate that reaches the
  colon is fermented by the resident microbiota into gas, lactate and
  short-chain fatty acids. Colonic fermentation is a genuine branch rather than
  an obligatory step: short-chain fatty acid absorption drives concomitant
  colonic water and electrolyte salvage, so the colon's fermentative and
  reabsorptive reserve, not the primary defect alone, sets the dose at which a
  malabsorbing individual becomes symptomatic. The output is a
  substrate-dependent watery diarrhea with a high stool osmotic gap that appears
  on first exposure to the offending nutrient, remits completely when that
  nutrient is withdrawn, and recurs on rechallenge - a reversibility that
  distinguishes this module from the structural and immune-mediated
  enteropathies.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It models one conserved
  mechanism - substrate-specific failure of an apical digestive or absorptive
  step producing luminal osmotic solute retention - and deliberately does NOT
  cover the other congenital-diarrhea mechanism classes, which have different
  rate-limiting steps and are separated from this one in the current CODE
  nosology (PMID:29654747). In particular it excludes
  electrolyte-transport-related diarrhea (congenital chloride diarrhea/SLC26A3,
  congenital sodium diarrhea/SLC9A3 and GUCY2C), where the lost transport step
  handles ions rather
  than an ingested nutrient and the stool osmotic gap is low rather than high -
  that class is modelled by the sibling module
  electrolyte_transport_related_diarrhea, and a disorder must not conform to both
  this module and that one for the same node;
  it excludes the enterocyte structural/trafficking enteropathies (microvillus
  inclusion disease, congenital tufting enteropathy), where villus architecture
  itself is abnormal and diarrhea does not remit on dietary substrate
  withdrawal; and it excludes immune-mediated enteropathy (IPEX, autoimmune
  enteropathy) and barrier injury, which are covered by
  intestinal_barrier_dysfunction. Note that this module and
  intestinal_barrier_dysfunction reach a superficially similar "absorptive
  failure -> diarrhea" endpoint from opposite directions: there, malabsorption
  is a downstream consequence of mucosal injury and villus blunting; here, the
  mucosa is histologically normal (a normal villus-to-crypt ratio is the
  diagnostic hallmark of this class) and the lesion is a single missing
  molecular step. A disorder should not conform to both for the same node.
  Key disease-specific substitutions conforming entries make: congenital lactase
  deficiency substitutes LCT/lactase-phlorizin hydrolase and lactose;
  congenital sucrase-isomaltase deficiency substitutes SI and sucrose (with
  variable isomaltose/starch involvement); trehalase deficiency substitutes TREH
  and trehalose; glucose-galactose malabsorption substitutes SLC5A1/SGLT1 and
  dietary glucose plus galactose, and is the one conformer whose lesion is a
  transporter rather than a hydrolase - fructose absorption via GLUT5 is spared,
  which is what makes a fructose-based formula therapeutic. The module carries
  two complementary treatment patterns on different nodes: dietary elimination
  of the offending substrate INHIBITS luminal solute retention, and oral enzyme
  replacement (sacrosidase in CSID) BYPASSES the missing brush-border digestive
  step. Modules bind GO and CL terms only and do not use chemical (CHEBI) or
  disease (MONDO) term bindings; substrate chemistry is described in prose,
  except in the treatments block where the therapeutic agent carries an
  NCIT/CHEBI identifier per the treatment schema.
pathophysiology:
- name: Loss of a Substrate-Specific Brush-Border Digestive or Absorptive Step
  description: >-
    The shared upstream lesion. A biallelic loss-of-function defect removes one
    substrate-specific activity from the apical brush border of the
    small-intestinal enterocyte, while leaving the rest of the absorptive
    machinery and the villus architecture intact. Two molecular classes of lesion produce the
    same functional result. In the hydrolase class, a brush-border
    disaccharidase is absent, catalytically dead, or - as demonstrated for
    sucrase-isomaltase - synthesised but blocked in the endoplasmic reticulum or
    Golgi and never delivered to the apical membrane, so the dietary disaccharide
    is never cleaved to absorbable monosaccharides. In the transporter class, the
    apical sodium-coupled monosaccharide carrier is present but non-functional,
    so hydrolysis proceeds normally yet the liberated monosaccharide cannot cross
    the apical membrane. Because each lesion removes exactly one step, the defect
    is silent until the corresponding substrate is fed, and the specific
    enzyme or transporter substituted differs by disorder.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  molecular_functions:

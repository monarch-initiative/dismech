    term:
      id: GO:0004553
      label: hydrolase activity, hydrolyzing O-glycosyl compounds
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: Apical monosaccharide uptake across the brush border
    term:
      id: GO:0034219
      label: carbohydrate transmembrane transport
    modifier: DECREASED
  cellular_components:

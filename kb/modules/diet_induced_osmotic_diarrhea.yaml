  evidence:
  - reference: PMID:16400612
    reference_title: "Mutations in the translated region of the lactase gene (LCT) underlie congenital lactase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data demonstrate that, in contrast to common adult-type hypolactasia
      (lactose intolerance) caused by a variant of the regulatory element, the
      severe infancy form represents the outcome of mutations affecting the
      structure of the protein inactivating the enzyme
    explanation: >-
      Establishes the hydrolase class of this trigger: coding-region LCT
      mutations that inactivate the lactase enzyme protein itself, as opposed to
      the regulatory downregulation that causes common lactase non-persistence.
      This is the distinction that makes congenital lactase deficiency a
      Mendelian conformer of this module and adult-type hypolactasia not one.
  - reference: PMID:3403721
    reference_title: "Sucrase-isomaltase deficiency in humans. Different mutations disrupt intracellular transport, processing, and function of an intestinal brush border enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results suggest that different, probably small, mutations in the
      sucrase-isomaltase gene lead to the synthesis of transport-incompetent or
      functionally altered enzyme which results in congenital sucrose
      intolerance.
    explanation: >-
      Shows that the trigger node covers trafficking failure as well as loss of
      catalytic activity: transport-incompetent sucrase-isomaltase never reaches
      the brush border, which is functionally equivalent to absence of the
      enzyme. Evidence source is IN_VITRO because the phenotypes were resolved by
      antibody-based subcellular and protein analysis of patient material.
  - reference: PMID:2008213
    reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Sequence analysis of the amplified products has revealed a single missense
      mutation in SGLT1 which cosegregates with the GGM phenotype and results in
      a complete loss of Na(+)-dependent glucose transport
    explanation: >-
      Establishes the transporter class of this trigger - a single SGLT1 missense
      mutation abolishing sodium-dependent glucose transport - showing that the
      module's trigger admits an apical carrier defect as well as a hydrolase
      defect. Evidence source is IN_VITRO because the transport loss was measured
      in Xenopus oocytes injected with the mutant cRNA.
  downstream:
  - target: Unabsorbed Dietary Solute Retention in the Intestinal Lumen
    causal_link_type: DIRECT
- name: Unabsorbed Dietary Solute Retention in the Intestinal Lumen
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target.
    Whatever the specific missing step, its consequence is identical: the
    ingested substrate is neither reduced to an absorbable form nor taken up, so
    it remains in the small-intestinal lumen as an osmotically active solute at a
    concentration set by dietary load rather than by absorptive capacity. This is
    the point at which the disorder-specific molecular lesions converge, and the
    point at which both therapeutic strategies act - removing the substrate from
    the diet, or hydrolysing it in the lumen with a replacement enzyme, each
    empties this node without repairing the underlying genetic defect. Its
    clinical signature is a high stool osmotic gap, which is what separates this
    class from the electrolyte-transport-related congenital diarrheas.

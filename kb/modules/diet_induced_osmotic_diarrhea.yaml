  evidence:
  - reference: PMID:29654747
    reference_title: "Advances in Evaluation of Chronic Diarrhea in Infants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diet-induced diarrhea is characterized by an elevated stool osmotic gap
      (>100 mOsm). Examples include glucose or disaccharide malabsorption.
    explanation: >-
      Defines the class this module models and names its measurable signature -
      an elevated stool osmotic gap produced by retained unabsorbed nutrient -
      with glucose and disaccharide malabsorption given as the examples, i.e.
      exactly the module's conformers. Evidence source is OTHER because this is a
      review proposing the current CODE classification.
  - reference: PMID:29654747
    reference_title: "Advances in Evaluation of Chronic Diarrhea in Infants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infants with CODEs resulting from defects in digestion, absorption,
      transport of nutrients and electrolytes, or enteroendocrine cell
      development or function have normal villi to crypt ratios; defects in
      enterocyte structure or immune-mediated conditions result in an abnormal
      villus to crypt ratios and morphology.
    explanation: >-
      Supports the module's scope boundary: the digestion/absorption defects
      modelled here leave villus architecture normal, which is what
      distinguishes them from the structural and immune-mediated enteropathies
      that this module explicitly excludes and that intestinal_barrier_dysfunction
      covers instead.
  downstream:
  - target: Osmotic Water Influx and Luminal Distension
    causal_link_type: DIRECT
  - target: Colonic Microbial Fermentation of the Malabsorbed Substrate
    causal_link_type: DIRECT
- name: Osmotic Water Influx and Luminal Distension
  description: >-
    Retained luminal solute exerts an osmotic force that draws water across the
    intestinal epithelium into the lumen. The resulting increase in luminal
    volume distends the small bowel and accelerates propulsion of fluid and
    unabsorbed substrate into the colon, shortening the time available for any
    residual absorption or for colonic salvage. This is the step that converts a
    biochemical malabsorption into a fluid-volume problem.
  role: amplifier
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: Transepithelial water movement into the lumen
    term:
      id: GO:0006833
      label: water transport
    modifier: INCREASED
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:35565890
    reference_title: "Carbohydrate Maldigestion and Intolerance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carbohydrate malabsorption can provoke an osmotically driven influx of
      fluid into the small bowel, leading to intestinal distension and rapid
      propulsion into the colon
    explanation: >-
      States this node directly: malabsorbed carbohydrate osmotically drives
      fluid into the small bowel, distending it and accelerating delivery to the
      colon. Evidence source is OTHER because this is a review.
  downstream:
  - target: Substrate-Dependent Watery Diarrhea and Nutritional Consequences
    causal_link_type: DIRECT
- name: Colonic Microbial Fermentation of the Malabsorbed Substrate
  description: >-
    A parallel branch rather than an obligatory step in the chain to diarrhea.
    Substrate delivered to the colon is fermented by the resident microbiota to
    hydrogen, carbon dioxide, methane, lactate and short-chain fatty acids. This
    branch has two opposing effects, which is why it is modelled separately. Gas
    production causes the bloating, distension and flatulence that dominate the
    milder phenotypes, and is what the hydrogen and 13C breath tests used to
    diagnose these disorders actually measure. At the same time, short-chain
    fatty acids are absorbed by the colonic mucosa and drive concomitant salvage
    of water and electrolytes, partially offsetting the osmotic load. The balance
    between fermentative production and this reabsorptive reserve, rather than
    the primary enzymatic defect alone, determines the substrate dose at which an
    affected individual becomes symptomatic - which is why partial-deficiency
    phenotypes are dose-dependent while complete congenital deficiencies are not.
  role: amplifier
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Colonic epithelial cell
    term:
      id: CL:0011108
      label: colon epithelial cell
  biological_processes:
  - preferred_term: Microbial fermentation of malabsorbed carbohydrate
    term:
      id: GO:0006113
      label: fermentation
    modifier: INCREASED
  locations:
  - preferred_term: Colon
    term:
      id: UBERON:0001155
      label: colon
  evidence:
  - reference: PMID:35565890
    reference_title: "Carbohydrate Maldigestion and Intolerance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      unabsorbed carbohydrates are rapidly fermented by colonic microbiota,
      generating gas, lactate, and short-chain fatty acids that have effects on
      gastrointestinal function
    explanation: >-
      Establishes the fermentative branch - colonic microbiota rapidly ferment
      unabsorbed carbohydrate into gas, lactate and short-chain fatty acids.
      Evidence source is OTHER because this is a review.
  - reference: PMID:35565890
    reference_title: "Carbohydrate Maldigestion and Intolerance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The short-chain fatty acids are rapidly absorbed by the colonic mucosa,
      favouring the concomitant absorption of water and electrolytes
    explanation: >-
      Supports the offsetting arm of this branch: short-chain fatty acid uptake
      by the colonic mucosa drives water and electrolyte salvage, which is why
      fermentation is modelled as a branch with two opposing effects rather than
      as a step that simply worsens the diarrhea. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Substrate-Dependent Watery Diarrhea and Nutritional Consequences
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Substrate-Dependent Watery Diarrhea and Nutritional Consequences
  description: >-
    The clinical output. Osmotic fluid loss that exceeds colonic salvage capacity
    produces watery, often explosive and acidic diarrhea, accompanied by
    abdominal distension, flatulence and pain from the fermentative branch. In
    the complete congenital deficiencies the diarrhea begins with the first feed
    containing the offending substrate and, if unrecognised, causes dehydration,
    electrolyte disturbance, failure to thrive and malnutrition, historically
    with substantial mortality. The defining feature of this node - and of the
    whole module - is its strict substrate dependence: symptoms remit completely
    when the offending nutrient is removed from the diet and recur on
    rechallenge, without any repair of the underlying molecular defect. That
    reversibility is the clinical evidence that the chain runs through luminal
    solute retention rather than through mucosal damage.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Intestine
    term:
      id: UBERON:0000160
      label: intestine
  evidence:
  - reference: PMID:2008213
    reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consequent severe diarrhoea and dehydration are usually fatal unless
      these sugars are eliminated from the diet.
    explanation: >-
      States both halves of this node in one sentence: the severity of the
      outcome (fatal diarrhea and dehydration) and its strict substrate
      dependence (reversed by eliminating the offending sugars), which is the
      module's defining clinical signature.
  - reference: PMID:16400612
    reference_title: "Mutations in the translated region of the lactase gene (LCT) underlie congenital lactase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital lactase deficiency (CLD) is a severe gastrointestinal disorder
      characterized by watery diarrhea in infants fed with breast milk or other
      lactose-containing formulas.
    explanation: >-
      Shows the substrate-triggered onset that characterises this node - watery
      diarrhea appearing specifically on feeding with a lactose-containing milk,
      not from birth independent of diet.
treatments:
- name: Elimination of the Offending Dietary Substrate
  description: >-
    The foundational treatment for every disorder conforming to this module, and
    the intervention that demonstrates the module's causal chain. Removing the
    substrate the patient cannot handle - a lactose-free formula in congenital
    lactase deficiency, sucrose and starch restriction in sucrase-isomaltase
    deficiency, trehalose avoidance in trehalase deficiency, a fructose-based
    formula in glucose-galactose malabsorption, where GLUT5-mediated fructose
    uptake is spared - empties the luminal solute pool without correcting the
    genetic lesion. Symptoms resolve and recur predictably on rechallenge. In the
    complete congenital deficiencies this is life-saving rather than
    symptom-relieving.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Unabsorbed Dietary Solute Retention in the Intestinal Lumen
    treatment_effect: INHIBITS
    description: >-
      Withdrawing the substrate prevents the osmotically active solute from
      accumulating in the lumen, acting on the module's rate-limiting node rather
      than on the upstream molecular defect.
    evidence:
    - reference: PMID:2008213
      reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The consequent severe diarrhoea and dehydration are usually fatal unless
        these sugars are eliminated from the diet.
      explanation: >-
        Documents that eliminating the offending sugars from the diet is what
        prevents the otherwise fatal outcome, establishing dietary substrate
        withdrawal as acting on the luminal solute-retention node.
- name: Oral Enzyme Replacement (Sacrosidase)
  description: >-
    The complementary treatment pattern, acting on the trigger node rather than
    the central effector. Sacrosidase is a liquid sucrase preparation derived
    from Saccharomyces cerevisiae, taken with meals so that it hydrolyses sucrose
    in the intestinal lumen in place of the missing brush-border enzyme. It
    bypasses the defective apical digestive step, allowing patients with
    congenital sucrase-isomaltase deficiency to eat a normal sucrose-containing
    diet. Its effectiveness is direct interventional evidence for the module's
    trigger-to-central-effector link. This pattern is specific to the hydrolase
    class of trigger and is not inherited by conformers whose lesion is a
    transporter: no equivalent luminal replacement exists for SGLT1, because the
    defective step is membrane transport rather than luminal hydrolysis.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sacrosidase
      term:
        id: NCIT:C66525
        label: Sacrosidase
  target_mechanisms:
  - target: Loss of a Substrate-Specific Brush-Border Digestive or Absorptive Step
    treatment_effect: BYPASSES
    description: >-
      An exogenous yeast-derived sucrase hydrolyses sucrose within the lumen,
      substituting for the absent brush-border sucrase-isomaltase and so
      bypassing the missing apical digestive step.
    evidence:
    - reference: PMID:9932843
      reference_title: "Sacrosidase therapy for congenital sucrase-isomaltase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sacrosidase is a safe, effective, well-accepted treatment to prevent
        gastrointestinal symptoms in patients with CSID consuming a normal diet.
      explanation: >-
        Randomized double-blind evidence that replacing the missing sucrase
        activity in the lumen prevents symptoms while the patient eats a normal
        sucrose-containing diet, confirming that bypassing the trigger node is
        sufficient to prevent the downstream chain.
    - reference: PMID:9932843
      reference_title: "Sacrosidase therapy for congenital sucrase-isomaltase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Breath H2 excretion decreased significantly when patients received
        sacrosidase or sacrosidase plus milk compared to placebo during sucrose
        breath tests.
      explanation: >-
        Provides the mechanistic readout linking the treatment to the module's
        fermentative branch: replacing the enzyme reduces the colonic hydrogen
        production that malabsorbed sucrose would otherwise generate.

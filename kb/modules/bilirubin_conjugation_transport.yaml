name: Bilirubin Conjugation and Transport Module
description: >-
  A conserved module representing hepatocellular bilirubin disposal and the
  hereditary hyperbilirubinaemias that arise when one of its steps fails.
  Unconjugated bilirubin, the end product of haem catabolism, is taken up across
  the sinusoidal membrane of the hepatocyte, glucuronidated by UGT1A1, and
  exported across the canalicular membrane into bile by MRP2/ABCC2; a fraction
  of the conjugates that escapes into sinusoidal blood via MRP3 is recaptured by
  OATP1B1 and OATP1B3. Two mechanistically distinct arms break this pathway and
  are distinguished at the bedside by the conjugation state of the accumulated
  pigment. A conjugation-capacity lesion (UGT1A1) yields UNCONJUGATED
  hyperbilirubinaemia - Gilbert syndrome at the mild end, Crigler-Najjar
  syndrome at the severe end, where the unbound pigment crosses the blood-brain
  barrier and causes kernicterus. A conjugate-transport lesion yields CONJUGATED
  hyperbilirubinaemia - Dubin-Johnson syndrome from loss of canalicular MRP2
  export, Rotor syndrome from loss of sinusoidal OATP1B1/OATP1B3 reuptake - and
  is benign and non-progressive. Conforming disorder entries substitute the
  affected transporter or enzyme while preserving this conserved
  load - disposal-lesion - hyperbilirubinaemia chain.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "bilirubin_conjugation_transport#Hyperbilirubinaemia"). The key conformance
  target is the central_effector node "Hyperbilirubinaemia" - the
  disorder-agnostic convergence point through which every conformer funnels,
  whichever of the two lesion arms it enters by.

  ARM SELECTION IS THE CURATOR'S FIRST DECISION, and the two arms are not
  interchangeable. Enter at "UGT1A1-Dependent Bilirubin Glucuronidation
  Deficiency" only for a disorder with UNCONJUGATED hyperbilirubinaemia
  (Gilbert syndrome - reduced UGT1A1 promoter activity; Crigler-Najjar syndrome
  types I and II - coding mutations in UGT1A1; physiological and prolonged
  neonatal jaundice; haemolysis-driven bilirubin overload, which overwhelms
  rather than lesions the enzyme). Enter at "Conjugated Bilirubin Transport
  Failure" only for a disorder with CONJUGATED hyperbilirubinaemia
  (Dubin-Johnson syndrome - ABCC2/MRP2; Rotor syndrome - simultaneous
  SLCO1B1 and SLCO1B3 loss).

  The downstream consequence node "Bilirubin Neurotoxicity and Kernicterus" is
  reachable ONLY from the unconjugated arm and only at severe elevations. A
  conforming entry on the transport arm must NOT declare conformance to it:
  Dubin-Johnson and Rotor syndromes are explicitly benign and non-progressive,
  and asserting a kernicterus risk for them would be a substantive error, not a
  conservative one.

  Scope boundary against `cholestatic_liver_injury`. Conjugated
  hyperbilirubinaemia also arises in true cholestasis, where bile acid secretion
  fails alongside bilirubin export. That is a different disease process and
  belongs to the cholestatic module: the isolated transport lesions modelled
  here leave bile acid secretion intact, produce no pruritus, no bile acid
  retention, and no biliary fibrosis. Do not conform a cholestatic disorder to
  this module merely because its patients are jaundiced.
pathophysiology:
- name: Haem Catabolism and the Unconjugated Bilirubin Load
  description: >-
    Unconjugated bilirubin is the final product of haem catabolism, generated
    chiefly from senescent erythrocyte haemoglobin. Being poorly water-soluble
    it circulates bound to albumin and must be taken up across the sinusoidal
    membrane of the hepatocyte before it can be disposed of. This node sets the
    substrate load the downstream disposal machinery must clear; it is raised
    above normal by haemolysis and by the physiological erythrocyte turnover of
    the newborn, which is why those states unmask a marginal conjugation
    capacity.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: heme catabolic process
    term:
      id: GO:0042167
      label: heme catabolic process
  - preferred_term: bilirubin transport
    term:
      id: GO:0015723
      label: bilirubin transport
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Jaundice results from the systemic accumulation of bilirubin, the final
      product of the catabolism of haem.
    explanation: >-
      Establishes bilirubin as the terminal product of haem catabolism and
      systemic accumulation as the route to the module's clinical readout.
      Evidence source is OTHER because this is a review of clinical features,
      pathophysiology, and genetics.
  - reference: PMID:24459177
    reference_title: "The roles of MRP2, MRP3, OATP1B1, and OATP1B3 in conjugated hyperbilirubinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Under normal conditions, unconjugated bilirubin is taken up into
      hepatocytes by transporters of the organic anion-transporting polypeptide
      (OATP) family, followed by conjugation with glucuronic acid, and
      ATP-dependent transport into bile.
    explanation: >-
      States the normal three-step disposal pathway - uptake, conjugation,
      canalicular export - whose successive failure defines the two lesion arms
      of this module. Evidence source is OTHER because this is a review of
      hepatobiliary transport physiology.
  downstream:
  - target: UGT1A1-Dependent Bilirubin Glucuronidation Deficiency
    causal_link_type: DIRECT
    description: >-
      The unconjugated bilirubin load must be glucuronidated by UGT1A1 before it
      can be excreted; a deficiency of that enzyme is the first lesion arm.
  - target: Conjugated Bilirubin Transport Failure
    causal_link_type: DIRECT
    description: >-
      When conjugation is intact, the resulting bilirubin glucuronides must be
      exported and recaptured by canalicular and sinusoidal transporters; loss
      of those transporters is the second lesion arm.

- name: UGT1A1-Dependent Bilirubin Glucuronidation Deficiency
  description: >-
    UGT1A1 is the enzyme responsible for glucuronidating bilirubin and so for
    converting it into a water-soluble, excretable form. Reduced UGT1A1 activity
    is the lesion of the unconjugated arm. The severity is graded by how much
    activity remains: reduced promoter activity, as in the common Gilbert
    genotype, leaves enough capacity for a mild and benign elevation, whereas
    coding mutations in UGT1A1 abolish or severely reduce activity and produce
    the Crigler-Najjar phenotype. Conforming entries substitute their specific
    UGT1A1 lesion here.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: bilirubin conjugation
    term:
      id: GO:0006789
      label: bilirubin conjugation
    modifier: DECREASED
  molecular_functions:
  - preferred_term: glucuronosyltransferase activity
    term:
      id: GO:0015020
      label: glucuronosyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Uridine diphospho-glucuronosyl transferase 1A1 (UGT1A1) is responsible for
      the glucuronidation of bilirubin; deficiency of this enzyme results in
      unconjugated hyperbilirubinaemia.
    explanation: >-
      States the enzyme, its reaction, and the specific biochemical phenotype
      its deficiency produces - the defining claim of this arm. Evidence source
      is OTHER because this is a review.
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Gilbert syndrome is the mild and benign form of inherited unconjugated
      hyperbilirubinaemia and is mostly caused by reduced promoter activity of
      the UGT1A1 gene.
    explanation: >-
      Documents the mild end of the severity gradient and its distinct molecular
      basis (promoter rather than coding lesion), the substitution the Gilbert
      syndrome entry makes at this node. Evidence source is OTHER because this
      is a review.
  - reference: PMID:30764062
    reference_title: "Crigler-Najjar syndrome: therapeutic options and consequences of mutations in the UGT1A1 complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The underlying problem in both conditions is impaired bilirubin
      conjugation and elimination due to a mutation in uridine
      5'-diphosphate glucuronyltransferase.
    explanation: >-
      Confirms that Gilbert and Crigler-Najjar syndromes share this single node
      as their common lesion, differing in degree - which is why they are
      modelled as one arm rather than two. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Hyperbilirubinaemia
    causal_link_type: DIRECT
    description: >-
      Bilirubin that cannot be glucuronidated accumulates in plasma in the
      unconjugated form.

- name: Conjugated Bilirubin Transport Failure
  description: >-
    When conjugation is intact but the handling of the conjugates fails,
    bilirubin glucuronides accumulate in plasma. Two non-overlapping transporter
    lesions produce this. Loss of the ATP-dependent canalicular pump MRP2
    (ABCC2) blocks export of mono- and bisglucuronosyl bilirubin into bile; the
    basolateral pump MRP3, upregulated in that setting, then diverts the
    conjugates into sinusoidal blood. Loss of both sinusoidal reuptake
    transporters OATP1B1 and OATP1B3 instead prevents recapture of the
    conjugates that normally re-enter the hepatocyte. Both lesions are benign
    and non-progressive - a fact conforming entries must preserve.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: bilirubin transport
    term:
      id: GO:0015723
      label: bilirubin transport
    modifier: DECREASED
  evidence:
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dubin-Johnson syndrome is caused by a defect in the ATP-dependent
      canalicular transporter, multidrug resistance-associated protein 2 (MRP2),
      which mediates the export of conjugated bilirubin into bile.
    explanation: >-
      Names the canalicular export lesion and the transporter involved, the
      substitution a Dubin-Johnson syndrome entry makes at this node. Evidence
      source is OTHER because this is a review.
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with Rotor syndrome, bilirubin (re)uptake is impaired due to
      the deficiency of two basolateral/sinusoidal hepatocellular membrane
      proteins, organic anion-transporting polypeptide 1B1 (OATP1B1) and
      OATP1B3.
    explanation: >-
      Names the sinusoidal reuptake lesion, mechanistically distinct from the
      canalicular one though producing the same biochemical pattern. Evidence
      source is OTHER because this is a review.
  - reference: PMID:24459177
    reference_title: "The roles of MRP2, MRP3, OATP1B1, and OATP1B3 in conjugated hyperbilirubinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Under pathophysiological conditions such as cholestatic liver injury and
      MRP2 inhibition, the basolateral efflux pump multidrug resistance protein
      3 (MRP3 or ABCC3) is responsible for the occurrence of conjugated
      hyperbilirubinemia.
    explanation: >-
      Supplies the mechanism by which a canalicular export block actually raises
      plasma conjugated bilirubin - MRP3-mediated basolateral diversion - rather
      than merely trapping pigment in the hepatocyte. Evidence source is OTHER
      because this is a review.
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inherited non-hemolytic conjugated hyperbilirubinemic conditions include
      Dubin-Johnson syndrome (caused by mutations affecting ABCC2 gene) and
      Rotor syndrome (caused by the simultaneous presence of mutations in
      SLCO1B1 and SLCO1B3 genes).
    explanation: >-
      Confirms the gene-level basis of both conformers and, importantly, that
      Rotor syndrome requires simultaneous loss of both OATP genes rather than
      either alone. Evidence source is OTHER because this is a narrative review.
  downstream:
  - target: Hyperbilirubinaemia
    causal_link_type: DIRECT
    description: >-
      Bilirubin conjugates that can be neither exported into bile nor recaptured
      from sinusoidal blood accumulate in plasma in the conjugated form.

- name: Hyperbilirubinaemia
  description: >-
    Systemic accumulation of bilirubin, producing jaundice and scleral icterus.
    This is the disorder-agnostic convergence node of the module and its key
    conformance target: both lesion arms terminate here, and the conjugation
    state of the accumulated pigment is what discriminates between them
    diagnostically. Conforming entries should record which fraction predominates,
    because that assignment determines whether the downstream neurotoxicity node
    is reachable at all.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: bilirubin transport
    term:
      id: GO:0015723
      label: bilirubin transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35860851
    reference_title: "Benign inheritable disorders of bilirubin metabolism manifested by conjugated hyperbilirubinemia-A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bilirubin, a breakdown product of heme, is normally glucuronidated and
      excreted by the liver into bile. Failure of this system can lead to a
      buildup of conjugated bilirubin in the blood, resulting in jaundice.
    explanation: >-
      States the convergence this node represents - failure anywhere in the
      conjugate-and-excrete system produces the same clinical endpoint. Evidence
      source is OTHER because this is a narrative review.
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both disorders are benign and not progressive and are characterised by
      elevated serum levels of mainly conjugated bilirubin.
    explanation: >-
      Records the conjugated pattern and the benign, non-progressive course of
      the transport arm - the guardrail that stops a conforming Dubin-Johnson or
      Rotor entry from inheriting the neurotoxicity consequence. Evidence source
      is OTHER because this is a review.
  - reference: PMID:36157610
    reference_title: "Rotor Syndrome Presenting as Dubin-Johnson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory tests were notable for hyperbilirubinemia (total 7.97 mg/dL,
      direct 5.37 mg/dL), bilirubinuria, no signs of hemolysis, normal liver
      tests and lipids profile.
    explanation: >-
      A worked human example of the conjugated pattern at this node with
      otherwise normal liver tests, illustrating that the transport arm is an
      isolated bilirubin-handling defect rather than liver disease. Evidence
      source is HUMAN_CLINICAL because this is a patient case report.
  downstream:
  - target: Bilirubin Neurotoxicity and Kernicterus
    causal_link_type: DIRECT
    description: >-
      Reachable only from the unconjugated arm, and only at severe elevations:
      unconjugated bilirubin in excess of albumin binding capacity crosses the
      blood-brain barrier. Conjugated hyperbilirubinaemia does not take this
      edge.

- name: Bilirubin Neurotoxicity and Kernicterus
  description: >-
    At high concentrations, unconjugated bilirubin that exceeds albumin binding
    capacity crosses the blood-brain barrier and deposits in the basal ganglia
    and brainstem nuclei, where it is neurotoxic. The resulting acute bilirubin
    encephalopathy and its chronic sequela, kernicterus, cause severe permanent
    disability and can be fatal when untreated. This node is the reason
    Crigler-Najjar syndrome is a medical emergency of the newborn while the
    other hereditary hyperbilirubinaemias are not, and it is the endpoint that
    phototherapy exists to prevent.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  locations:

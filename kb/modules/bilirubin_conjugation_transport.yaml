    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Crigler-Najjar syndrome is the severe inherited form of unconjugated
      hyperbilirubinaemia due to mutations in the UGT1A1 gene, which can cause
      kernicterus early in life and can be even lethal when left untreated.
    explanation: >-
      Establishes that this consequence node is reached specifically from the
      severe end of the unconjugated arm, and that it is lethal without
      treatment. Evidence source is OTHER because this is a review.
  - reference: PMID:30764062
    reference_title: "Crigler-Najjar syndrome: therapeutic options and consequences of mutations in the UGT1A1 complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Crigler-Najjar syndrome (CN), a rare inherited disorder characterized by
      failure of bilirubin glucuronidation, can lead to severe disability and
      death from kernicterus.
    explanation: >-
      Independently confirms the causal chain from glucuronidation failure to
      kernicterus and its outcome. Evidence source is OTHER because this is a
      review.

treatments:
- name: Phototherapy
  description: >-
    Phototherapy converts unconjugated bilirubin in the skin into water-soluble
    photoisomers that can be excreted in bile and urine without glucuronidation,
    thereby bypassing the missing UGT1A1 step rather than restoring it. It acts
    on the hyperbilirubinaemia convergence node to keep plasma bilirubin below
    the threshold for neurotoxicity, and it is the mainstay of Crigler-Najjar
    management. This is a containment therapy, not a cure: the underlying
    enzymatic lesion is untouched, its efficacy falls as body surface area to
    mass ratio declines with age, and definitive treatment is liver
    transplantation. It applies only to the unconjugated arm and confers no
    benefit in the transport-lesion disorders, which need no treatment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  target_mechanisms:
  - target: Hyperbilirubinaemia
    treatment_effect: INHIBITS
    description: >-
      Photoisomerisation provides a conjugation-independent excretion route,
      lowering the plasma unconjugated bilirubin concentration and so preventing
      the downstream neurotoxicity node from being reached.
    evidence:
    - reference: PMID:30764062
      reference_title: "Crigler-Najjar syndrome: therapeutic options and consequences of mutations in the UGT1A1 complex."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mainstay of current management of CN is phototherapy, followed by
        liver transplantation.
      explanation: >-
        Establishes phototherapy as the primary intervention on this node in the
        severe unconjugated disorder, with transplantation as the definitive
        escalation. Evidence source is OTHER because this is a review of
        therapeutic options.
  evidence:
  - reference: PMID:25315738
    reference_title: "Gene replacement therapy for genetic hepatocellular jaundice."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Due to major disadvantages of the current standard treatments for
      Crigler-Najjar syndrome, phototherapy and liver transplantation, new
      effective therapeutic strategies are under development.
    explanation: >-
      Marked PARTIAL because it bounds the claim: phototherapy is the standard
      of care but has major disadvantages, and conforming entries should not
      present it as a satisfactory long-term solution. Evidence source is OTHER
      because this is a review.

discussions:
- discussion_id: ugt1a1_gene_replacement_unproven
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can hepatocyte-directed gene replacement durably restore UGT1A1 activity and
    replace phototherapy and liver transplantation in Crigler-Najjar syndrome?
  attaches_to:
  - "pathophysiology#UGT1A1-Dependent Bilirubin Glucuronidation Deficiency"
  rationale: >-
    The only curated treatment in this module acts on the downstream
    hyperbilirubinaemia node and bypasses rather than repairs the enzymatic
    lesion, and the review literature explicitly frames both standard treatments
    as having major disadvantages that motivate new strategies. Gene replacement
    and hepatocyte transplantation target the lesion node itself, but long-term
    engraftment of transplanted cells remains elusive and vector safety and
    immunotolerance to the transgene product are unresolved. Conforming entries
    should curate these as investigational, not established.
  proposed_experiments:
  - experiment_id: ugt1a1_gene_transfer_durability
    name: Long-term durability study of UGT1A1 gene transfer
    description: >-
      Extended follow-up of AAV-mediated UGT1A1 gene transfer in Crigler-Najjar
      syndrome, reporting sustained plasma bilirubin reduction and freedom from
      phototherapy years after dosing, would establish whether the lesion node
      is durably correctable in a growing liver.

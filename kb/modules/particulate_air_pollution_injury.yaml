    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PM significantly increased mice emphysema and airway inflammation measured by mean linear intercept, alveolar destroy index and total cell, neutrophil counts, cytokines IL-6, tumor necrosis factor (TNF)-α, CXCL1, IL-1β in bronchoalveolar lavage fluid."
    explanation: >-
      Quantifies the effector state - neutrophil influx with IL-6, TNF-alpha, CXCL1
      and IL-1beta in lavage fluid - after particulate exposure in vivo.
  downstream:
  - target: Airway Epithelial Barrier Disruption and Remodeling
    description: >-
      Sustained neutrophilic inflammation degrades junctional integrity and drives
      structural airway change.
    causal_link_type: DIRECT
  - target: Systemic Inflammation and Endothelial Dysfunction
    description: >-
      Pulmonary inflammatory mediators and translocated ultrafine particles spill
      over into the circulation, carrying the injury beyond the lung. Intermediates
      between the airway compartment and the vascular effect are incompletely
      established.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Airway Epithelial Barrier Disruption and Remodeling
  description: >-
    Tight-junction protein expression falls, mucociliary clearance is impaired, and
    the epithelium releases alarmins, so the barrier that normally excludes inhaled
    material is itself degraded - a feed-forward loss that increases the delivered
    dose of every subsequent exposure and, over time, contributes to structural
    airway remodeling.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Airway Epithelial Cell

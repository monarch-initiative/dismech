    reference_title: "Triggering mechanisms of acute thunderstorm asthma: epithelial barrier disruption and immune dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These factors can lead to damage of the airway epithelial barrier, with sequential cellular and molecular pathophysiological changes including downregulation of various tight junction proteins in the epithelial barrier, imbalance of mucociliary clearance function"
    explanation: >-
      States the barrier consequence explicitly for a PM2.5/ozone-containing
      bioaerosol exposure - tight-junction downregulation plus impaired mucociliary
      clearance - which is what this node asserts.
- name: Systemic Inflammation and Endothelial Dysfunction
  description: >-
    Pulmonary inflammation and translocated ultrafine particles produce a systemic
    inflammatory and pro-oxidant state with impaired endothelium-dependent
    vasodilation, the vascular output that makes ambient particulate exposure a
    cardiovascular as well as a respiratory risk. This node is the seam to the
    atherogenesis module, whose endothelial dysfunction trigger it feeds; it is a
    consequence branch and a conforming disorder need not declare it.
  role: consequence
  biological_scale: ORGANISM

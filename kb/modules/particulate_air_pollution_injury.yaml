  evidence:
  - reference: PMID:39336475
    reference_title: "PM(2.5) Induces Pyroptosis via Activation of the ROS/NF-κB Signaling Pathway in Bronchial Epithelial Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PM2.5 activated the NLRP3-casp1-gasdermin D pathway, with resulting secretions of the proinflammatory cytokines IL-1β and IL-18."
    explanation: >-
      Direct demonstration in human bronchial epithelial cells that PM2.5 assembles
      the NLRP3 inflammasome and matures IL-1beta and IL-18, the defining claim of
      this node.
  - reference: PMID:39336475
    reference_title: "PM(2.5) Induces Pyroptosis via Activation of the ROS/NF-κB Signaling Pathway in Bronchial Epithelial Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ROS scavenger inhibited the expression of the NLRP3 inflammasome, and the NF-κB inhibitor attenuated pyroptotic cell death triggered by PM2.5 exposure"
    explanation: >-
      Pharmacological ordering evidence: scavenging reactive oxygen species blocks
      inflammasome induction, establishing that the upstream amplifier node is
      required for this hub rather than merely co-occurring with it.
  - reference: PMID:32116706
    reference_title: "Hydrogen Sulfide Attenuates Particulate Matter-Induced Emphysema and Airway Inflammation Through Nrf2-Dependent Manner."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The expression of NLRP3, active caspase-1, and active caspase-3 enhanced by PM were also downregulated by hydrogen sulfide in mice lung."
    explanation: >-
      In vivo corroboration that particulate exposure raises NLRP3 and active
      caspase-1 in lung tissue, and that the effect is reversible - the model-organism
      counterpart of the in vitro evidence above.
  downstream:
  - target: Neutrophilic Airway Inflammation and Cytokine Release
    description: >-
      Matured IL-1beta and IL-18 together with NF-kB-driven cytokine transcription
      recruit neutrophils and amplify airway inflammation.
    causal_link_type: DIRECT
- name: Neutrophilic Airway Inflammation and Cytokine Release
  description: >-
    The inflammasome and NF-kB output produces a predominantly neutrophilic airway
    infiltrate with release of IL-1beta, IL-6, TNF, and the neutrophil chemokines
    CXCL1 and CXCL8/IL-8 into the airway lumen. This is the effector state that a
    conforming disorder's own inflammation node typically already curates, and the
    point at which pollutant injury becomes indistinguishable from the disorder's
    background inflammatory burden.
  role: effector
  biological_scale: TISSUE
  cell_types:

    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  - preferred_term: Cellular Response to Oxidative Stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:39336475
    reference_title: "PM(2.5) Induces Pyroptosis via Activation of the ROS/NF-κB Signaling Pathway in Bronchial Epithelial Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In PM2.5-exposed BEAS-2B cells, levels of intracellular ROS and NF-κB p65 increased."
    explanation: >-
      Direct measurement of the rise in intracellular reactive oxygen species in
      human bronchial epithelial cells after PM2.5 exposure, with the coupled rise
      in NF-kB p65 that carries this node into the central effector.
  - reference: PMID:40938902
    reference_title: "Aerosolized vitamin D attenuates ozone-induced inflammation and transcriptional responses via membrane antioxidant effects in human bronchial epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "vitamin D suppressed the ozone-induced expression of inflammation- and oxidative stress-related genes, including CXCL8, FFAR2, PTGS2 (COX-2), and NFKB2"
    explanation: >-
      Establishes the oxidant-gas arm of this node in primary human bronchial
      epithelial cells - ozone induces oxidative-stress and inflammatory genes
      including NFKB2 and CXCL8 - showing that a non-particulate pollutant reaches
      the same hub.
  - reference: PMID:40719997
    reference_title: "Toxicological Effects of Air Pollutants on Human Airway Cell Models Using Air-liquid Interface Systems: A Systematic Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "both, acute and prolonged exposures to air pollution induce oxidative, inflammatory, and genotoxic responses in airway epithelial cells"
    explanation: >-
      Systematic review across 53 air-liquid-interface studies supporting oxidative
      and inflammatory responses as the general airway-epithelial reaction to air
      pollution, the generalization this amplifier node makes.
  downstream:
  - target: NF-kB Activation and NLRP3 Inflammasome Assembly
    description: >-
      Reactive oxygen species activate NF-kB and license NLRP3 inflammasome
      assembly; ROS scavenging blocks inflammasome induction, placing oxidative
      stress upstream of the hub.
    causal_link_type: DIRECT
- name: NF-kB Activation and NLRP3 Inflammasome Assembly
  description: >-
    Pollutant-driven oxidative stress converges on NF-kB-dependent transcription of
    pro-inflammatory genes and on assembly of the NLRP3 inflammasome, with
    caspase-1 activation and maturation of IL-1beta and IL-18. This is the
    disorder-agnostic, rate-limiting step of the module and the key conformance
    target: it is where chemically unrelated pollutants become one inflammatory
    programme, and it is the point at which the module can be pharmacologically or
    genetically interrupted.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Airway Epithelial Cell

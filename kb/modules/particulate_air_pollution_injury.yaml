    snippet: "It is the opinion of the writing group that the overall evidence is consistent with a causal relationship between PM(2.5) exposure and cardiovascular morbidity and mortality."
    explanation: >-
      American Heart Association consensus that the PM2.5-cardiovascular
      relationship is causal, which is what licenses curating this systemic branch
      rather than leaving it as an association.
  - reference: PMID:20458016
    reference_title: "Particulate matter air pollution and cardiovascular disease: An update to the scientific statement from the American Heart Association."
    supports: SUPPORT

name: Conserved Particulate and Oxidant Air Pollution Injury Module
description: >-
  Conserved pathway by which inhaled ambient air pollutants injure the airway and,
  through spillover, the systemic vasculature: deposition of fine particulate
  matter and oxidant gases (PM2.5, PM10, black carbon, ozone, nitrogen dioxide,
  sulfur dioxide, wildfire smoke) on the airway epithelium and resident
  macrophages generates reactive oxygen species; the resulting oxidative stress
  converges on a single rate-limiting transcriptional and inflammasome hub -
  NF-kB activation with NLRP3 inflammasome assembly and caspase-1-dependent
  IL-1beta/IL-18 maturation - which drives neutrophilic airway inflammation and
  cytokine release, and from there to two parallel outputs: airway epithelial
  barrier disruption with remodeling, and systemic inflammation with endothelial
  dysfunction. The pollutant-agnostic complement of the tobacco-smoke and
  occupational-dust routes to the same hub; it is the mechanistic substrate under
  the epidemiological air-quality associations already curated across the chronic
  airway diseases.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  Conserved mechanism, one rate-limiting hub. The key conformance target is the
  central_effector node "NF-kB Activation and NLRP3 Inflammasome Assembly": every
  route from an inhaled particulate or oxidant gas to airway inflammation funnels
  through redox-driven NF-kB activation and inflammasome-dependent IL-1beta
  maturation. Conforming entries substitute the pollutant species and the
  disease-relevant cell type while keeping this spine - the specific pollutant
  (PM2.5 vs PM10 vs black carbon vs O3 vs NO2 vs SO2 vs smoke-derived PM), the
  dominant reactive species, the affected epithelial compartment (bronchial vs
  alveolar), and the effector cytokines (IL-1beta, IL-18, IL-6, TNF, CXCL8/IL-8,
  CXCL1). The corresponding disease-level exposure should be bound with the
  specific ECTO term rather than the generic parent "exposure to air pollution"
  (ECTO:8000036) - ECTO:7000117 fine respirable suspended particulate matter for
  PM2.5, ECTO:7000116 for PM10, ECTO:7000068 for particulate matter generally,
  ECTO:9000052 ozone, ECTO:9000252 nitrogen dioxide, ECTO:9000196 sulfur dioxide,
  ECTO:9002171 carbon black, ECTO:7000059 smoke - and linked to the conforming node
  with influences_mechanisms.

  Deliberately NOT re-derived here and left to the sibling modules a conforming
  entry may declare in parallel: the protease-antiprotease arm of the resulting
  alveolar destruction (emphysema_protease_antiprotease_imbalance), the
  mesenchymal arm of the remodeling output (fibrotic_response), the type-2
  sensitization arm of barrier loss (epithelial_barrier_dysfunction), the
  senescence programme that pollutant oxidative stress also engages
  (cellular_senescence), and the plaque-formation arm downstream of the vascular
  output (atherogenesis, whose Endothelial Dysfunction trigger node is where the
  systemic branch of this module hands off). Also out of scope: the mutagenesis
  and lung-carcinogenesis output of polycyclic aromatic hydrocarbons in the same
  particles, which is a distinct DNA-damage route rather than the
  redox-inflammatory one modeled here; and carbon monoxide, which is a co-emitted
  combustion product but acts by an entirely separate hypoxic mechanism (see
  Carbon_Monoxide_Poisoning) and must not be curated as conforming to this module.

  Not an Xogenesis module: the terminal outputs are loss of an intact barrier and
  loss of normal endothelial function, not the formation of a discrete pathological
  structure. Chemistry (reactive oxygen species, the pollutant species themselves)
  is described in prose per module convention.

  Scope caveat curators must preserve: the epidemiological association between
  ambient pollutant concentration and disease exacerbation is far better evidenced
  in humans than the specific molecular hub curated here, which rests chiefly on
  in vitro airway-cell and rodent exposure work. A conforming entry should keep
  its human association evidence and its mechanistic evidence as separate evidence
  items with distinct evidence_source values, and should not cite a BEAS-2B or
  mouse result as though it established the human mechanism.
pathophysiology:
- name: Inhaled Particulate and Oxidant Gas Deposition
  description: >-
    Ambient fine particulate matter and oxidant gases reach and deposit on the
    conducting-airway and alveolar epithelium, which is the first point of contact
    between inhaled pollutants and the body, and are taken up by resident alveolar
    macrophages. Particle size governs how distally the material penetrates:
    respirable fractions reach the small airways and alveoli, and the reactive
    gases dissolve into the airway lining fluid. This is the initiating exposure
    step of the module.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Airway Epithelial Cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  - preferred_term: Alveolar Macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: Response to Inhaled Xenobiotic
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
    modifier: INCREASED
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  triggers:
  - preferred_term: exposure to fine respirable suspended particulate matter
    term:
      id: ECTO:7000117
      label: exposure to fine respirable suspended particulate matter
  evidence:
  - reference: PMID:40719997
    reference_title: "Toxicological Effects of Air Pollutants on Human Airway Cell Models Using Air-liquid Interface Systems: A Systematic Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the toxicological effects of air pollution on airway epithelial cells, the first point of contact of the air pollutants with the body"
    explanation: >-
      Establishes the airway epithelium as the first point of contact for inhaled
      pollutants, which is what this trigger node asserts.
  - reference: PMID:41652394
    reference_title: "Triggering mechanisms of acute thunderstorm asthma: epithelial barrier disruption and immune dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "particulate matter ≤ 2.5 μm(PM2.5) and ozone (O3) to form bioaerosols capable of penetrating small airways"
    explanation: >-
      Supports size-dependent penetration of PM2.5 and ozone into the small
      airways, the deposition step modeled here.
  downstream:
  - target: Airway Epithelial and Macrophage Oxidative Stress
    description: >-
      Deposited particles and dissolved oxidant gases generate reactive oxygen
      species in the epithelium and in phagocytosing macrophages.
    causal_link_type: DIRECT
- name: Airway Epithelial and Macrophage Oxidative Stress
  description: >-
    Redox-active particle components and the oxidant gases themselves raise
    intracellular reactive oxygen species and overwhelm epithelial antioxidant
    defences, producing lipid peroxidation, glutathione oxidation, and induction of
    oxidative-stress-response genes. This is the amplifier that couples a
    physicochemically heterogeneous set of pollutants to one downstream signalling
    hub - it is why PM, ozone, and nitrogen dioxide converge despite acting through
    different chemistry.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Airway Epithelial Cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  - preferred_term: Alveolar Macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:

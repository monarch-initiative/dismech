- name: Area Postrema GLP-1R Neuronal Activation
  description: 'GLP1R-expressing neurons of the area postrema, a circumventricular structure outside
    the blood-brain barrier, are activated by the circulating agonist. In mice this is the step that
    produces emesis: ablating GLP-1R in the area postrema abolishes the response, while cutting the
    vagal afferents does not, and the coupling is postsynaptic and AMPA-receptor dependent. That last
    point is why this node hangs off receptor activation rather than off the module''s cAMP effector
    - the evidence at this site does not place it below that step.'

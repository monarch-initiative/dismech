name: GLP-1 Receptor Agonism Module
description: 'The drug-mechanism module for GLP-1 receptor agonism: a degradation-resistant incretin
  mimetic activates GLP1R, the receptor engages Gs and raises cAMP, and cAMP is read by both protein
  kinase A and Epac2 - the module''s key conformance target for its metabolic arms. Four arms follow:
  glucose-dependent potentiation of insulin secretion in the beta cell, suppression of alpha-cell
  glucagon, slowed gastric emptying, and reduced food intake. The first three converge on improved
  glycaemic control; gastric emptying and intake feed weight loss. A fifth arm is the adverse one
  - area postrema GLP-1R activation producing nausea and vomiting - and it is attached to receptor
  activation rather than below the cAMP step, because the only direct evidence at that site shows
  postsynaptic AMPA-dependent coupling. The module states explicitly that it does not name a dominant
  mechanism for weight loss, because the critical review of the eight candidate mechanisms concludes
  the evidence supports none. It is the agonist counterpart of `beta_adrenergic_receptor_blockade`,
  which runs the same Gs-cAMP-PKA cascade in the cAMP-lowering direction, and it is complementary
  to `diabetic_vascular_complications`, which opens at chronic hyperglycaemia and carries the end-organ
  damage this module''s glycaemic arm acts to prevent rather than duplicating it. Carries the drug-target
  pattern for single-target agonists and for GLP-1/GIP co-agonists, whose GIPR half is deliberately
  out of scope.'
category: Module
module_categories:
- PHARMACOLOGY
- METABOLISM
creation_date: '2026-10-22T00:00:00Z'
notes: 'This is a mechanism module, not a specific disease. Do NOT create a "GLP-1 Receptor Agonism"
  Disease entry. Disorder entries reference individual nodes via conforms_to, for example "glp1_receptor_agonism#PKA
  and Epac2 Effector Engagement".

  Scope. The module opens at the drug-receptor interaction and stops at the organism-level outcomes.
  The disease state the therapy acts on - beta-cell failure, insulin resistance, hypothalamic dysregulation,
  positive energy balance - belongs to the conforming entry, as does the end-organ damage of chronic
  hyperglycaemia, which `diabetic_vascular_complications` already carries.

  What this module refuses to claim. It names no dominant mechanism for weight loss. PMID:42083883
  assesses eight candidate mechanisms and concludes that the evidence supports no single dominant
  one, and it finds the liraglutide appetite effect moderate, not dose-dependent, and transient. A
  conforming obesity entry should therefore conform at the receptor or cAMP step rather than asserting
  that its weight loss runs through a named arm. Writing one in would be exactly the over-claim the
  evidence rules out.

  The emesis arm''s attachment point is a deliberate judgement, not an oversight. Area postrema GLP-1R
  activation hangs off the trigger rather than the central effector because the direct evidence there
  (murine, PMID:40622911) demonstrates postsynaptic AMPA-receptor dependent coupling and does not
  place the step below cAMP/PKA. If a cAMP-dependent account of that site is established, the edge
  should move.

  Ontology bindings. Nodes bind GO and CL terms only; no CHEBI term is placed on cAMP itself, following
  the convention recorded in `cardiac_camp_pka_calcium_handling`. Epac2 is named in prose rather than
  bound, because the node''s molecular function is the cAMP-dependent kinase activity GO:0004691 and
  no single GO term covers both effectors. GIPR (hgnc:4271) is deliberately not bound on any node:
  co-agonists reach this module through their GLP1R half only.'
pathophysiology:
- name: GLP-1 Receptor Agonist Binding and Activation
  description: 'An incretin mimetic occupies and activates GLP1R, a class B G protein-coupled receptor.
    Unlike the receptor-blockade modules, the drug here reproduces an endogenous signal rather than
    removing one, and it does so at a concentration and duration the native hormone never reaches:
    GLP-1 itself is degraded within minutes, while the agonists are engineered to resist that degradation.
    The receptor is expressed well beyond the islet - hindbrain, hypothalamus, stomach, vagal afferents
    - which is why one receptor action produces the several arms below.'
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: glucagon-like peptide 1 receptor activity
    term:
      id: GO:0044508
      label: glucagon-like peptide 1 receptor activity
    modifier: INCREASED
  genes:
  - &id002
    preferred_term: GLP1R
    term:
      id: hgnc:4324
      label: GLP1R
  evidence:
  - reference: PMID:14693691
    reference_title: 'Epac: A new cAMP-binding protein in support of glucagon-like peptide-1 receptor-mediated
      signal transduction in the pancreatic beta-cell.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Although GLP-1 is established to be a cAMP-elevating agent, these studies demonstrate
      that protein kinase A (PKA) is not the only cAMP-binding protein by which GLP-1 acts.
    explanation: Establishes the receptor's second-messenger consequence that the next node carries,
      and flags that the effector step is not PKA alone - which is why this module's central effector
      names Epac2 beside it.
  - reference: PMID:29949126
    reference_title: Clinical pharmacology of glucagon-like peptide-1 receptor agonists.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: GLP-1 RAs are injectable peptides that resemble the structure and function of endogenous
      incretin GLP-1, but as they are not deactivated by the dipeptidyl peptidase-4 (DPP-4), their
      half-life is prolonged compared with native GLP-1.
    explanation: Sources this node's distinctive claim - that the drug reproduces the endogenous
      signal at an exposure the native hormone cannot reach, because it escapes the protease that
      clears GLP-1.
  downstream:
  - target: Gs Coupling and Adenylyl Cyclase Activation
    description: The activated receptor engages Gs and stimulates adenylyl cyclase.
  - target: Area Postrema GLP-1R Neuronal Activation
    description: The same agonist engages GLP1R on area postrema neurons. Attached here rather than
      below the cAMP step because the coupling demonstrated at that site is postsynaptic and AMPA-receptor
      dependent.
- name: Gs Coupling and Adenylyl Cyclase Activation
  description: The agonist-bound receptor catalyses nucleotide exchange on Gs-alpha, which stimulates
    adenylyl cyclase and raises intracellular cAMP in the cell that carries the receptor. No CHEBI
    binding is placed on cAMP itself, per the module convention that nodes bind GO and CL terms only.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:14693691
    reference_title: 'Epac: A new cAMP-binding protein in support of glucagon-like peptide-1 receptor-mediated
      signal transduction in the pancreatic beta-cell.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Although GLP-1 is established to be a cAMP-elevating agent, these studies demonstrate
      that protein kinase A (PKA) is not the only cAMP-binding protein by which GLP-1 acts.
    explanation: States the cAMP rise this node asserts, in the cell type the islet arm depends on.
  downstream:
  - target: PKA and Epac2 Effector Engagement
    description: Raised cAMP is read by both of its effector proteins.
- name: PKA and Epac2 Effector Engagement
  description: 'Raised cAMP engages two effectors, not one: protein kinase A, and the cAMP-regulated
    guanine nucleotide exchange factor Epac2, which couples the cAMP rise to calcium-dependent exocytosis
    and to calcium release from intracellular stores. This is the module''s key conformance target
    for the metabolic arms - the step the islet, gastric and feeding arms share - and it is the mirror
    image of `beta_adrenergic_receptor_blockade`, whose central effector is the same cascade running
    down rather than up. The emesis arm is deliberately not placed below it.'
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:14693691
    reference_title: 'Epac: A new cAMP-binding protein in support of glucagon-like peptide-1 receptor-mediated
      signal transduction in the pancreatic beta-cell.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Two variants of Epac (Epac1 and Epac2) are expressed in beta-cells, and downregulation
      of Epac function diminishes stimulatory effects of GLP-1 on beta-cell Ca(2+) signaling and insulin
      secretion.
    explanation: 'Supports naming Epac beside PKA: removing Epac function blunts the insulin-secretory
      effect, so the effector step is not PKA alone.'
  downstream:
  - target: Glucose-Dependent Potentiation of Insulin Secretion
    description: In the beta cell the cAMP effectors amplify secretion already initiated by glucose.
  - target: Suppressed Glucagon Secretion
    description: Alpha-cell glucagon output falls.
  - target: Slowed Gastric Emptying
    description: Gastric motor activity is inhibited, delaying nutrient delivery to the small intestine.
  - target: Reduced Food Intake
    description: Hypothalamic and hindbrain GLP-1R circuits reduce intake.
- name: Glucose-Dependent Potentiation of Insulin Secretion
  description: 'The cAMP effectors amplify insulin secretion that glucose has already initiated, by
    reloading the immediately releasable granule pool and sensitising exocytosis to calcium. The glucose-dependence
    is the clinically decisive property and the reason this class does not cause hypoglycaemia the
    way a sulfonylurea or exogenous insulin does: below a glucose threshold the amplification does
    not occur. A conforming entry that models beta-cell failure substitutes its own account of the
    secretory defect this potentiation acts on.'
  role: effector
  biological_scale: CELLULAR
  biological_processes:

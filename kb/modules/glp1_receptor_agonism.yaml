- name: Weight Loss
  description: 'Sustained weight loss, the outcome the obesity indication rests on. The module deliberately
    does NOT name a dominant upstream arm: a critical review of eight purported mechanisms - appetite,
    chemosensory function, cravings, food noise, gastric emptying, the microbiome, incretin activity
    and energy expenditure - concludes that the evidence supports no single dominant mechanism and
    that a combination of subtle effects is likely. A conforming obesity entry should therefore conform
    at the receptor or cAMP step and not assert that its weight loss runs through one named arm.'
  role: consequence
  biological_scale: ORGANISM
  evidence:

- name: Slowed Gastric Emptying
  description: Gastric motor activity is inhibited and nutrient delivery to the small intestine is
    delayed, blunting the postprandial glucose excursion and contributing to satiety. The effect attenuates
    with continued exposure to a long-acting agonist, which is one reason the weight-loss contribution
    of this arm is contested rather than settled.

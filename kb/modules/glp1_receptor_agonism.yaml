- name: Reduced Food Intake
  description: 'GLP-1R circuits in the hypothalamus and hindbrain reduce food intake and subjective
    appetite. The node is deliberately modest: the cited critical review finds the appetite effect
    of liraglutide to be only moderate, not dose-dependent, and transient, so this arm is recorded
    as one contributor among several rather than as the mechanism of weight loss. No cell type or
    anatomical site is bound: the cited sources name satiety and calorie intake without naming a
    nucleus or a neuronal population, and the receptor is expressed at several of the sites that
    could carry this arm, so binding one of them would assert a route the evidence here does not
    establish.'
  role: effector
  biological_scale: ORGANISM

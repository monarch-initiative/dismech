- name: Nausea and Vomiting
  description: 'The dose-limiting adverse effect of the class, and the usual reason for dose reduction
    or discontinuation. It is a mechanism rather than an idiosyncrasy: the same receptor that delivers
    the metabolic benefit mediates the symptom, which is why tolerability is managed by slow up-titration
    rather than by avoiding the target. The human attribution rests on the clinical record; the circuit
    evidence cited upstream is murine.'
  role: consequence
  biological_scale: ORGANISM

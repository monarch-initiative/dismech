- name: Improved Glycaemic Control
  description: 'The organism-level metabolic outcome the diabetes indication rests on: lower postprandial
    and fasting glucose, reached through three arms at once - more glucose-dependent insulin, less
    glucagon, and slower nutrient delivery. Because the insulin arm is glucose-dependent, the improvement
    carries a low intrinsic hypoglycaemia risk.'

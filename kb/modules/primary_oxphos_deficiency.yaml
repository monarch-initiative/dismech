name: Primary OXPHOS Deficiency Module
description: >-
  A conserved mechanism module for inherited (primary) oxidative
  phosphorylation (OXPHOS) deficiency, the shared core of the monogenic
  mitochondrial diseases. Three genetically distinct lesion classes converge
  on one rate-limiting step: (a) a defect in a structural subunit or assembly
  factor of an OXPHOS complex, encoded by nuclear DNA or mtDNA; (b) a defect
  of mitochondrial gene expression - mt-tRNA point variants such as the MELAS
  m.3243A>G variant, mt-tRNA modification enzymes, mitoribosomal proteins,
  mitochondrial aminoacyl-tRNA synthetases and translation factors - which
  starves every complex of its mtDNA-encoded subunits; or (c) a defect of
  mtDNA quantity or integrity - depletion or multiple deletions from defects
  of mtDNA maintenance (POLG, TK2, DGUOK, SUCLA2, FBXL4) and single
  large-scale deletions (Kearns-Sayre and Pearson syndromes). Each produces
  an isolated or combined respiratory chain complex deficiency, which fails to
  build the proton-motive force that drives mitochondrial ATP synthesis. Cells
  with high and sustained energy demand fail first, and the cytosolic shift in
  the NADH/NAD+ ratio diverts pyruvate to lactate. The terminal tissue
  outcomes curated here are Leigh-type necrotizing encephalopathy,
  mitochondrial myopathy and mitochondrial cardiomyopathy. Key conformance
  target: `primary_oxphos_deficiency#OXPHOS Complex Deficiency`.
  Scope and siblings: this module is for primary, genetic OXPHOS defects of
  any onset age. Age-related somatic mtDNA damage, waning mitophagy and
  secondary mitochondrial decline in common disease belong to
  `mitochondrial_dysfunction` (the Lopez-Otin aging-hallmark module), not
  here. `complex_i_deficiency` and `complex_iv_assembly_deficiency` are
  complex-specific specializations of lesion class (a) and remain the more
  specific conformance targets for isolated complex I and complex IV
  disorders; an entry may conform to both a complex-specific module and this
  one.
category: Module
module_categories:
- METABOLISM
creation_date: "2026-10-10T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.
  "primary_oxphos_deficiency#OXPHOS Complex Deficiency").

  The three trigger nodes are alternatives, not a sequence: a conforming entry
  normally declares conformance at the one trigger matching its lesion class
  and at the central node. Lesion-class substitutions: subunit or assembly
  factor (NDUF*/NDUFAF*, SDH*, UQCR*, COX*/SURF1/SCO*, ATP5*/TMEM70, MT-ND*,
  MT-CO*, MT-ATP6); gene expression (MT-TL1, MT-TK, MT-TV and other mt-tRNA
  genes; GTPBP3, MTO1, TRIT1, NSUN3, GATC/QRSL1 tRNA modification and
  charging; MRPS*/MRPL*/PTCD3 mitoribosome; the *ARS2 synthetases; GFM1,
  TUFM, TSFM elongation factors; PNPT1 RNA import and processing); mtDNA
  quantity or integrity (POLG, TWNK, TK2, DGUOK, RRM2B, SUCLA2, SUCLG1, MPV17,
  FBXL4, OPA1; single large-scale deletions).

  Disorders whose primary lesion lies outside the three classes but which
  produce a documented respiratory chain complex deficiency (for example
  LETM1, a mitochondrial K+/H+ exchanger, whose loss disorganizes the cristae
  that house the complexes) may conform at the central node without a trigger
  node. A primary genetic disorder with altered mitochondrial bioenergetics but
  no reported respiratory chain complex deficiency should not be forced here.

  FGF-21 and GDF-15 are curated under biochemical as serum markers of primary
  mitochondrial disease, not of age-related decline; FGF-21 induction is
  lesion-class dependent (strong for translation defects and mtDNA deletions,
  weak for structural subunit or assembly factor defects), which is why its
  readout points at the gene-expression trigger rather than the central node.

  Curation guardrail - do NOT create a "Primary OXPHOS Deficiency" or
  "Mitochondrial Disease" Disease entry for this module; the umbrella is a
  mechanism, and a union of diseases belongs in a Grouping.
pathophysiology:
- name: OXPHOS Subunit or Assembly Factor Defect
  description: >-
    Pathogenic variants in a structural subunit of one of the five OXPHOS
    complexes, in a factor required for its assembly, or in the biogenesis of
    the electron carriers, encoded by either the nuclear or the mitochondrial
    genome, prevent a functional complex from being built or retained. This is
    the largest group of primary defect genes; it usually produces an isolated
    deficiency of the affected complex, but sometimes a combined one.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex assembly
    term:
      id: GO:0033108
      label: mitochondrial respiratory chain complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The largest group of primary defect genes encode structural subunits of
      one of the five OXPHOS complexes, factors required for their assembly, or
      are involved in the biogenesis of the electron carriers cytochrome c and
      ubiquinone (coenzyme Q)
    explanation: >-
      Defines this lesion class and establishes it as the largest category of
      primary OXPHOS disease genes.
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, there are many exceptions to this, with mutations in genes
      encoding OXPHOS subunits and assembly factors sometimes resulting in a
      combined OXPHOS deficiency.
    explanation: >-
      Records that this class usually, but not always, yields an isolated
      deficiency, which is why the downstream node covers both isolated and
      combined deficiency.
  downstream:
  - target: OXPHOS Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      A complex that cannot be assembled or retained is absent or
      catalytically incompetent.
    evidence:
    - reference: PMID:29233888
      reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        is suggestive of a mutation in either a structural subunit or assembly
        factor of the affected OXPHOS complex
      explanation: >-
        An isolated enzyme deficiency is the expected biochemical consequence
        of a subunit or assembly-factor lesion.
- name: Mitochondrial Translation Defect
  description: >-
    The 13 mtDNA-encoded OXPHOS polypeptides are synthesized inside the
    mitochondrion by a dedicated apparatus built from mtDNA-encoded tRNAs and
    rRNAs and nuclear-encoded proteins. Pathogenic variants in mt-tRNA genes
    (MELAS m.3243A>G in MT-TL1), in mt-tRNA processing and modification
    enzymes, in mitoribosomal proteins, in mitochondrial aminoacyl-tRNA
    synthetases or in translation factors impair mitochondrial protein
    synthesis, depleting every complex that carries an mtDNA-encoded subunit
    (I, III, IV and V) while sparing the wholly nuclear-encoded complex II.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Numerous nuclear encoded and mtDNA encoded factors are required for
      transcription and translation of the 13 mtDNA-encoded OXPHOS
      polypeptides.
    explanation: >-
      Establishes the dual-genome translation apparatus whose failure defines
      this lesion class.
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Likewise, mitochondria require 19 aminoacyl tRNA synthetases to attach
      cognate amino acids to the appropriate tRNA, with mutations in all 19 now
      identified
    explanation: >-
      The mitochondrial aminoacyl-tRNA synthetases are a recurrent nuclear
      cause of this lesion class.
  - reference: PMID:30406383
    reference_title: "Diagnosis and Treatment of Mitochondrial Myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primary mutations of the mtDNA include point mutations affecting protein
      coding regions of the genome and mt-tRNA genes which alter mitochondrial
      protein synthesis.
    explanation: >-
      Places mtDNA-encoded tRNA point variants in this class, as a defect of
      mitochondrial protein synthesis.
  - reference: PMID:17132941
    reference_title: "Human mitochondrial diseases associated with tRNA wobble modification deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the translational activity of MELAS mt tRNA(Leu(UUR)) lacking wobble
      modification is more depressed in decoding of UUG codon than UUA codon
    explanation: >-
      The MELAS mt-tRNA-Leu(UUR) variant is a worked case of this node: the
      mutant tRNA decodes its codons inefficiently.
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in GTPBP3 are associated with a severe mitochondrial
      translation defect
    explanation: >-
      A nuclear mt-tRNA modification enzyme as a worked case of the
      nuclear-encoded branch of this node.
  downstream:
  - target: OXPHOS Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of mtDNA-encoded subunit synthesis produces a combined deficiency of
      the complexes that contain them.
    evidence:
    - reference: PMID:25434004
      reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Affected individuals from eight out of nine families presented with
        combined respiratory chain complex deficiencies in skeletal muscle.
      explanation: >-
        A translation defect manifesting as combined respiratory chain
        deficiency in patient tissue.
- name: Mitochondrial DNA Depletion or Deletion
  description: >-
    A fall in mtDNA quantity (depletion) or integrity (deletions) removes the
    templates for the mtDNA-encoded tRNAs, rRNAs and OXPHOS subunits. Nuclear
    defects of mtDNA maintenance - in mitochondrial nucleotide supply (TK2,
    DGUOK, SUCLA2, SUCLG1, RRM2B, TYMP), mtDNA replication (POLG, TWNK) or
    mitochondrial homeostasis (FBXL4, OPA1, MPV17) - cause depletion or
    multiple deletions; a single large-scale deletion, usually sporadic, causes
    Kearns-Sayre and Pearson syndromes. Deleted genomes that span tRNA genes
    impair translation of the subunits encoded outside the deletion as well.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: DECREASED
  - preferred_term: mitochondrial DNA metabolic process
    term:
      id: GO:0032042
      label: mitochondrial DNA metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23385875
    reference_title: "Mitochondrial DNA depletion syndromes: review and updates of genetic basis, manifestations, and therapeutic options."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MDS are due to defects in mtDNA maintenance caused by mutations in
      nuclear genes that function in either mitochondrial nucleotide synthesis
      (TK2, SUCLA2, SUCLG1, RRM2B, DGUOK, and TYMP) or mtDNA replication (POLG
      and C10orf2).
    explanation: >-
      Defines the nuclear mtDNA-maintenance branch of this node and its two
      sub-branches, nucleotide supply and replication.
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Disorders of mtDNA maintenance can cause mtDNA depletion or multiple deletions of mtDNA
    explanation: >-
      Both depletion and multiple deletions are outcomes of the same
      maintenance defect, which is why they share one node.
  - reference: PMID:30406383
    reference_title: "Diagnosis and Treatment of Mitochondrial Myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They also include single, large-scale mtDNA deletions which can either be
      inherited or arise sporadically during embryogenesis
    explanation: >-
      Places single large-scale deletions (the Kearns-Sayre and Pearson
      lesion) among the primary mtDNA lesions covered by this node.
  downstream:
  - target: OXPHOS Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      Too few intact mtDNA templates limit synthesis of the mtDNA-encoded
      subunits, producing a combined deficiency of complexes I, III, IV and V.
    evidence:
    - reference: PMID:23385875
      reference_title: "Mitochondrial DNA depletion syndromes: review and updates of genetic basis, manifestations, and therapeutic options."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        characterized by a severe reduction in mtDNA content leading to
        impaired energy production in affected tissues and organs
      explanation: >-
        Links loss of mtDNA content to failure of mitochondrial energy
        production.
- name: OXPHOS Complex Deficiency
  description: >-
    Reduced amount or activity of one (isolated) or several (combined)
    OXPHOS complexes. This is the biochemical lesion that defines primary
    mitochondrial disease and the step every conforming disorder funnels
    through, whatever the upstream lesion class. Conforming entries specify
    which complexes are affected (isolated complex I, combined I+III+IV with
    complex II spared, isolated complex V) and in which tissue it was
    measured.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:27775730
    reference_title: "Mitochondrial diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mitochondrial diseases are a group of genetic disorders that are
      characterized by defects in oxidative phosphorylation and caused by
      mutations in genes in the nuclear DNA (nDNA) and mitochondrial DNA (mtDNA)
      that encode structural mitochondrial proteins or proteins involved in
      mitochondrial function.
    explanation: >-
      Establishes defective oxidative phosphorylation as the defining lesion of
      primary mitochondrial disease, caused by genes of both genomes.
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In contrast, mutations in the other mitochondrial disease genes would be
      assumed to affect multiple OXPHOS complexes, and this is observed in
      30-60% of patients
    explanation: >-
      Combined deficiency of several complexes is the common outcome of the
      non-structural lesion classes, so this node covers both isolated and
      combined deficiency.
  downstream:
  - target: Cellular Energy Failure in High-Demand Tissues
    causal_link_type: DIRECT
    description: >-
      Without a functional respiratory chain the proton gradient that drives
      complex V collapses and mitochondrial ATP synthesis falls.
    evidence:
    - reference: PMID:29233888
      reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The first four complexes and two electron carriers form the respiratory
        chain, which generates a proton gradient used by complex V (F1F0-ATP
        synthase) to generate the majority of cellular ATP.
      explanation: >-
        States the dependence of most cellular ATP on the respiratory chain,
        the basis of this edge.
  - target: NADH Redox Imbalance and Lactic Acidosis
    causal_link_type: DIRECT
    description: >-
      Failure to reoxidize NADH raises the NADH/NAD+ ratio and shifts the
      lactate dehydrogenase equilibrium toward lactate.
    evidence:
    - reference: PMID:29233888
      reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Primary or secondary defects of complex I inhibit NADH oxidation, and
        cell lines and tissues from complex I-deficient mouse models show a
        decreased ratio of NAD+/NADH
      explanation: >-
        Respiratory chain failure at its NADH entry point lowers the NAD+/NADH
        ratio.
- name: Cellular Energy Failure in High-Demand Tissues
  description: >-
    Impaired mitochondrial ATP synthesis is limiting first in cells with high
    and sustained energy demand - neurons, cardiomyocytes, skeletal muscle
    fibres, retina and renal tubule - which is why primary OXPHOS disease is
    tissue-selective despite a ubiquitous lesion. Heteroplasmy and tissue
    thresholds shape which organs fail.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: proton motive force-driven mitochondrial ATP synthesis
    term:
      id: GO:0042776
      label: proton motive force-driven mitochondrial ATP synthesis
    modifier: DECREASED
  evidence:
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Inadequate ATP synthesis is an obvious issue for cells with constant or
      intermittently high energy demands such as neurons, cardiomyocytes, and
      renal tubular cells
    explanation: >-
      Names the high-demand cell types in which the ATP deficit is limiting.
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      most often they affect organs with the highest energy demands such as
      brain, skeletal muscle, eyes, and heart
    explanation: >-
      Supports the organ tropism of primary mitochondrial disease.
  downstream:
  - target: Leigh-Type Necrotizing Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Energy failure in the basal ganglia and brainstem produces the
      characteristic symmetric necrotizing lesions.
  - target: Mitochondrial Myopathy
    causal_link_type: DIRECT
    description: >-
      Skeletal muscle cannot meet its ATP demand.
    evidence:
    - reference: PMID:30406383
      reference_title: "Diagnosis and Treatment of Mitochondrial Myopathies."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This causes a deficit in energy production in the form of adenosine
        triphosphate (ATP), particularly in skeletal muscle.
      explanation: >-
        Links the OXPHOS defect to an ATP deficit in skeletal muscle.
  - target: Mitochondrial Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cardiomyocyte energy failure leads to hypertrophic, and less often
      dilated, cardiomyopathy.
- name: NADH Redox Imbalance and Lactic Acidosis
  description: >-
    The raised NADH/NAD+ ratio and pyruvate accumulation drive lactate
    dehydrogenase toward lactate production, raising lactate (and the
    lactate-to-pyruvate ratio) in blood and cerebrospinal fluid. Lactate is a
    useful but neither sensitive nor specific marker; many adults with primary
    mitochondrial disease have normal values.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:27504452
    reference_title: "Mitochondrial Cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both elevated pyruvate and NADH:NAD ratio result in shifting the
      equilibrium of lactate dehydrogenase toward the production of lactate
      from pyruvate.
    explanation: >-
      States the redox mechanism linking respiratory chain failure to lactate
      production.
  - reference: PMID:25434004
    reference_title: "Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All case subjects presented with lactic acidosis
    explanation: >-
      Lactic acidosis in every patient of a primary translation-defect cohort.
  - reference: PMID:27504452
    reference_title: "Mitochondrial Cardiomyopathies."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although lactic acidemia is a common biochemical feature of many
      mitochondrial disorders, it is neither specific nor sensitive
    explanation: >-
      Refutes reading lactic acidosis as an obligate consequence of the
      central node; it is common but not universal.
- name: Leigh-Type Necrotizing Encephalopathy
  description: >-
    Subacute necrotizing encephalopathy with bilateral symmetric lesions of the
    basal ganglia and brainstem, the most common paediatric presentation of
    primary mitochondrial disease. It is reached from all three lesion classes
    and from more than 75 genes across both genomes.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: basal ganglia
    term:
      id: UBERON:0010011
      label: collection of basal ganglia
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  evidence:
  - reference: PMID:26506407
    reference_title: "Leigh syndrome: One disorder, more than 75 monogenic causes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Leigh syndrome is the most common pediatric presentation of mitochondrial disease.
    explanation: >-
      Establishes Leigh syndrome as the dominant paediatric tissue outcome of
      primary OXPHOS deficiency.
  - reference: PMID:29233888
    reference_title: "Mitochondrial energy generation disorders: genes, mechanisms, and clues to pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      an infantile neurodegenerative disorder with characteristic lesions in the
      basal ganglia and brainstem caused by mutations in >75 genes to date
    explanation: >-
      Locates the lesions and records the genetic heterogeneity converging on
      this outcome.
  - reference: PMID:17160893
    reference_title: "Infantile encephalopathy and defective mitochondrial DNA translation in patients with mutations of mitochondrial elongation factors EFG1 and EFTu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The EFG1-mutant patient had early-onset Leigh syndrome
    explanation: >-
      A mitochondrial translation-factor defect reaching the Leigh outcome,
      showing the translation trigger converges here too.
- name: Mitochondrial Myopathy
  description: >-
    Progressive skeletal muscle weakness, exercise intolerance and external
    ophthalmoplegia from OXPHOS failure in muscle fibres, with ragged-red and
    cytochrome c oxidase-deficient fibres on biopsy. It is among the most
    common manifestations of adult-onset primary mitochondrial disease.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:30406383
    reference_title: "Diagnosis and Treatment of Mitochondrial Myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mitochondrial myopathies are progressive muscle conditions caused
      primarily by the impairment of oxidative phosphorylation (OXPHOS) in the
      mitochondria.
    explanation: >-
      Defines mitochondrial myopathy as an outcome of impaired OXPHOS.
  - reference: PMID:30406383
    reference_title: "Diagnosis and Treatment of Mitochondrial Myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Myopathy is one of the most common manifestations of adult-onset
      mitochondrial disorders due to the high cellular energy demand of
      skeletal muscle.
    explanation: >-
      Ties the muscle tropism to high energy demand, the upstream node.
- name: Mitochondrial Cardiomyopathy
  description: >-
    Abnormal myocardial structure or function secondary to a genetic
    respiratory chain defect, most often hypertrophic and less often dilated,
    restrictive, non-compaction or histiocytoid. It arises from all three
    lesion classes and carries a worse prognosis in children.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:27504452
    reference_title: "Mitochondrial Cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mitochondrial cardiomyopathy can be described as a myocardial disorder
      characterized by abnormal myocardial structure and/or function secondary
      to genetic defects resulting in the impairment of the mitochondrial
      respiratory chain
    explanation: >-
      Defines mitochondrial cardiomyopathy as a consequence of a genetic
      respiratory chain defect.
  - reference: PMID:27504452
    reference_title: "Mitochondrial Cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiomyopathies are frequent manifestations of mitochondrial diseases
      associated with defects in ETC complexes subunits and their assembly
      factors, mitochondrial tRNAs, rRNAs, ribosomal proteins, translation
      factors, mtDNA maintenance, and CoQ10 synthesis.
    explanation: >-
      All three trigger classes of this module converge on cardiomyopathy.
  - reference: PMID:27504452
    reference_title: "Mitochondrial Cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hypertrophic cardiomyopathy is the most frequent cardiac manifestation in
      mitochondrial diseases
    explanation: >-
      Records the dominant cardiomyopathy subtype.
biochemical:
- name: Blood lactate
  presence: INCREASED
  biomarker_term:
    preferred_term: lactic acid measurement
    term:
      id: NCIT:C79450
      label: Lactic Acid Measurement
  notes: >-
    Resting or exercise-provoked blood and CSF lactate, with the
    lactate-to-pyruvate ratio, is the classical first-line screen. It is
    insensitive in adults and non-specific, so a normal value does not exclude
    primary OXPHOS disease.
  evidence:
  - reference: PMID:30406383

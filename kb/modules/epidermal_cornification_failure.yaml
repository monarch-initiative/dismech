name: Epidermal Cornification Failure Module
description: >-
  A conserved final-common-pathway module for the inherited ichthyoses and
  related disorders of cornification. Mechanistically unrelated lesions in the
  terminal keratinocyte differentiation program - loss of transglutaminase-1
  cross-linking (TGM1), loss of the profilaggrin/filaggrin keratin matrix
  (FLG), loss of epidermal lipoxygenase activity (ALOX12B/ALOXE3), failure of
  lamellar-body glucosylceramide transport (ABCA12), failure of cholesterol
  sulfate desulfation (STS), or loss of stratum-corneum protease restraint
  (SPINK5/LEKTI) - converge on a defective cornified envelope and a defective
  intercellular lipid lamellar membrane. The resulting stratum corneum
  permeability barrier failure is the rate-limiting, disorder-agnostic step:
  it drives compensatory epidermal hyperproliferation and retention
  hyperkeratosis, which is what is clinically visible as ichthyotic scaling.
  Disorder entries reference these nodes via conforms_to and substitute the
  gene-specific proximal lesion.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a shared mechanism module, not a disease.

  Disorder-specific substitutions at the trigger node: TGM1 (transglutaminase-1
  cross-linking of the protein envelope), FLG (profilaggrin-derived keratin
  aggregation matrix), ALOX12B / ALOXE3 (the epidermal lipoxygenase pathway
  acting on the corneocyte lipid envelope), ABCA12 (lamellar-body
  glucosylceramide transporter), STS (steroid sulfatase; cholesterol sulfate
  accumulation), SPINK5 (LEKTI restraint of kallikrein-mediated desquamation),
  ALDH3A2 (Sjogren-Larsson fatty aldehyde dehydrogenase), ABHD5/PNPLA2
  (Chanarin-Dorfman neutral lipid storage), and the distal cholesterol
  biosynthetic enzymes (CHILD/CDPX2/MSMO1 group).

  Deliberately scoped to the cornification arm. Three related mechanisms are
  NOT re-derived here and have their own modules: dominant-negative keratin
  filament collapse (`keratin_intermediate_filament_fragility`, which the
  epidermolytic ichthyoses conform to *in parallel* with this module),
  desmosomal adhesion loss (`desmosomal_adhesion_failure`), and the type 2
  allergic-sensitization arm of barrier loss (`epithelial_barrier_dysfunction`,
  which models where barrier failure leads *immunologically* rather than how
  cornification fails structurally). A filaggrin-deficient entry may reasonably
  conform to both this module and `epithelial_barrier_dysfunction`.

  Not an Xogenesis module: the terminal output is the failure of a normal
  programmed process (cornification), not the formation of a new pathological
  anatomical entity.

  Barrier failure is the intended conformance target because it is the node
  every route funnels through and the node topical therapy acts on. Attaching
  at the trigger node alone is insufficient for conformance - an entry must
  evidence the barrier consequence, not merely a mutation in a cornification
  gene.
pathophysiology:
- name: Cornification Program Component Deficiency
  description: >-
    A structural, enzymatic, or lipid-transport component required for terminal
    keratinocyte differentiation is deficient or absent. The affected component
    differs by disorder, but each is required for the orderly conversion of a
    granular-layer keratinocyte into a corneocyte.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DECREASED
  - preferred_term: transglutaminase-mediated peptide cross-linking
    term:
      id: GO:0018149
      label: peptide cross-linking
    modifier: DECREASED
  evidence:
  - reference: PMID:9517915
    reference_title: "Structural organization of cornified cell envelopes and alterations in inherited skin disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The recent identification of genetic skin diseases with mutations in the genes encoding some of these proteins, including transglutaminase 1 and loricrin, has disclosed that abnormal cornified cell envelope synthesis is significantly involved in the pathophysiology of certain inherited keratodermas
    explanation: >-
      Establishes that loss of individual cornified-envelope components is the
      shared proximal lesion across several inherited disorders of cornification.
  - reference: PMID:11251583
    reference_title: "Novel mutations of TGM1 in a child with congenital ichthyosiform erythroderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An in situ TGase activity assay detected markedly reduced TGase activity in the patient's epidermis. Electron microscopy revealed incomplete thickening of the cornified cell envelope during keratinization in the epidermis.
    explanation: >-
      Shows the trigger-to-amplifier step directly in patient epidermis: loss of
      transglutaminase-1 activity yields an incompletely assembled cornified
      envelope.
  downstream:
  - target: Defective Cornified Envelope Assembly and Lamellar Lipid Delivery
    description: >-
      Loss of the deficient component prevents normal assembly of the
      cross-linked protein envelope, of the extracellular lipid lamellae, or of
      both.

- name: Defective Cornified Envelope Assembly and Lamellar Lipid Delivery
  description: >-
    The two structural arms of cornification fail. The insoluble, transglutaminase
    cross-linked protein envelope beneath the corneocyte plasma membrane is
    incompletely assembled, and/or lamellar bodies fail to deliver
    glucosylceramides and other lipid precursors to the extracellular space,
    so the intercellular lipid lamellar membrane of the stratum corneum is not
    formed. Either arm alone is sufficient to compromise the barrier; most
    disorders show some degree of both.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  biological_processes:
  - preferred_term: cornified envelope assembly
    term:
      id: GO:1903575
      label: cornified envelope assembly
    modifier: DECREASED
  - preferred_term: lamellar body lipid transport
    term:
      id: GO:0006869
      label: lipid transport
    modifier: DECREASED
  cellular_components:
  - preferred_term: epidermal lamellar body
    term:
      id: GO:0097209
      label: epidermal lamellar body
  evidence:
  - reference: PMID:16007253
    reference_title: "Mutations in lipid transporter ABCA12 in harlequin ichthyosis and functional recovery by corrective gene transfer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We confirmed that ABCA12 defects cause congested lipid secretion in cultured HI keratinocytes and succeeded in obtaining the recovery of LG lipid secretion after corrective gene transfer of ABCA12.
    explanation: >-
      Demonstrates the lipid arm of this node and, via the gene-correction
      rescue, that lamellar-granule lipid secretion is the step ABCA12 controls.
  - reference: PMID:16444271
    reference_title: "Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During terminal differentiation, it is cleaved into multiple filaggrin peptides that aggregate keratin filaments. The resultant matrix is cross-linked to form a major component of the cornified cell envelope.
    explanation: >-
      Demonstrates the protein-envelope arm: profilaggrin-derived filaggrin
      supplies the keratin-aggregating matrix that is cross-linked into the
      cornified envelope.
  downstream:
  - target: Stratum Corneum Permeability Barrier Failure
    description: >-
      An incomplete protein envelope and absent or disorganized intercellular
      lipid lamellae leave the stratum corneum permeable.

- name: Stratum Corneum Permeability Barrier Failure
  description: >-
    The stratum corneum fails as a permeability barrier: transepidermal water
    loss rises and the epidermis is more permeable to the external environment.
    This is the rate-limiting, disorder-agnostic node of the module - every
    upstream route converges here, and it is the node topical barrier-repair
    therapy targets.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: corneocyte
    term:
      id: CL:0002153
      label: corneocyte
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  locations:
  - preferred_term: stratum corneum
    term:
      id: UBERON:0002027
      label: stratum corneum of epidermis
  evidence:
  - reference: PMID:22864982
    reference_title: "Harlequin ichthyosis: ABCA12 mutations underlie defective lipid transport, reduced protease regulation and skin-barrier dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In HI skin, loss of function of ABCA12 due to null mutations results in impaired lipid lamellar membrane formation in the cornified layer, leading to defective permeability of the skin barrier.
    explanation: >-
      States the amplifier-to-central-effector step explicitly: failed lamellar
      membrane formation produces permeability barrier failure.
  - reference: PMID:15803139
    reference_title: "The cornified envelope: a model of cell death in the skin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      New insights into the molecular mechanisms and the physiological endpoints of cornification are increasing our understanding of the pathological defects of this unique form of programmed cell death, which is associated with barrier malfunctions and ichthyosis.
    explanation: >-
      Ties defective cornification to barrier malfunction and to ichthyosis as a
      disease class, supporting this node as the shared convergence point.
  downstream:
  - target: Compensatory Epidermal Hyperproliferation and Retention Hyperkeratosis
    description: >-
      Barrier failure signals a homeostatic repair response - increased lipid
      and DNA synthesis - while defective corneocyte shedding retains
      corneocytes at the surface.

- name: Compensatory Epidermal Hyperproliferation and Retention Hyperkeratosis
  description: >-
    Two processes thicken the stratum corneum. First, barrier disruption
    stimulates epidermal DNA synthesis and hyperplasia as a homeostatic attempt
    to restore the barrier. Second, corneocyte shedding is impaired, so
    corneocytes are retained rather than desquamated. Disorders differ in which
    process dominates - retention hyperkeratosis is the primary mechanism in
    X-linked ichthyosis, whereas hyperproliferative kinetics predominate in the
    congenital ichthyosiform erythrodermas.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte proliferation
    term:
      id: GO:0043616
      label: keratinocyte proliferation
    modifier: INCREASED
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: INCREASED
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:1628964
    reference_title: "[Regulation of the epidermal permeability barrier by lipids and hyperproliferation]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      After barrier disturbance not only lipid but also DNA synthesis is stimulated. Stimulation of DNA synthesis leading to epidermal hyperplasia may be a second mechanism by which the epidermis tries to correct defects in barrier function.
    explanation: >-
      Establishes the central-effector-to-effector step: barrier disruption is
      itself the signal that drives compensatory epidermal hyperproliferation.
  - reference: PMID:28846233
    reference_title: "X-Linked Ichthyosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected patients can normally produce skin cells but cannot shed them correctly, leading to dry skin that accumulates in the form of polygonal scales.
    explanation: >-
      Documents the retention-hyperkeratosis arm of this node in X-linked
      ichthyosis, where impaired shedding rather than hyperproliferation
      dominates.
  downstream:
  - target: Ichthyotic Scaling and Cutaneous Barrier Complications
    description: >-
      A thickened, poorly shed stratum corneum presents clinically as adherent
      scale, and the underlying barrier defect produces its systemic
      complications.

- name: Ichthyotic Scaling and Cutaneous Barrier Complications
  description: >-
    The clinical endpoint: generalized adherent scaling, with disorder-dependent
    erythroderma, palmoplantar keratoderma, and fissuring. Because the defect is
    a permeability barrier defect and not merely a cosmetic one, severe forms
    carry neonatal transcutaneous water and electrolyte loss, impaired
    thermoregulation, and increased cutaneous infection risk.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: epidermis development
    term:
      id: GO:0008544
      label: epidermis development
    modifier: ABNORMAL
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:16403385
    reference_title: "Lamellar ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in genes encoding transglutaminase 1 (TGM1), the ABCA12 transporter (ABCA12), ichthyin, lipoxygenase 3 (ALOXE3), and 12(R)-lipoxygenase (ALOX12B) have been shown to underlie both NBCIE and LI.
    explanation: >-
      Shows that mechanistically distinct upstream lesions produce the same
      clinical scaling endpoint, which is the convergence this module asserts.
  - reference: PMID:10583107
    reference_title: "X-linked ichthyosis: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked ichthyosis is a genetic disorder of keratinization characterized by a generalized desquamation of large, adherent, dark brown scales.
    explanation: >-
      Characterizes the scaling endpoint reached through the steroid-sulfatase
      route.

name: Evading Growth Suppressors Module
description: >-
  A conserved mechanism module for the second hallmark of cancer (Hanahan &
  Weinberg): the evasion of antiproliferative programs governed by tumor
  suppressors. Two master tumor-suppressor circuits enforce these programs:
  the retinoblastoma protein (RB) pathway, which integrates extracellular
  antigrowth signals to gate the G1/S transition, and the TP53 (p53)
  pathway, which senses intracellular stress (DNA damage, oncogene-induced
  hyperproliferation, hypoxia) and triggers cell-cycle arrest, senescence,
  or apoptosis. The conserved causal chain runs from inactivation of an RB-
  or p53-axis tumor suppressor (RB1/CDKN2A loss, cyclin D/CDK4-6
  amplification, TP53 mutation, MDM2 amplification) through loss of
  cell-cycle-checkpoint and antiproliferative control, and additionally
  through loss of contact inhibition, to unrestrained proliferation. This is
  the antiproliferative-brake counterpart to
  sustaining_proliferative_signaling: that module models acquisition of
  growth-promoting drive, this one models loss of growth-restraining
  control. Individual disorder entries declare conformance via conforms_to,
  substituting the tumor-type-specific tumor-suppressor lesion (e.g.,
  biallelic RB1 in retinoblastoma, germline TP53 in Li-Fraumeni, APC/Wnt in
  familial adenomatous polyposis, NF1 in neurofibromatosis). The chain then
  carries the one place a loss-of-function hallmark is druggable, which is not
  where the brake was lost but where it is enforced: a cell whose lesion lies
  upstream of RB still runs G1/S through cyclin D-CDK4/6, so a selective
  CDK4/6 inhibitor can reimpose the restraint, and a cell with no functional
  RB cannot. That condition is why the lesion list above is not a list of
  interchangeable routes, and resistance to the inhibitor is this module's own
  mechanism recurring one step lower.
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"). The
  module defines the expected pathophysiology structure; conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their tumor context. Key tumor-specific
  substitutions: retinoblastoma uses biallelic RB1 inactivation (the two-hit
  paradigm); Li-Fraumeni uses germline TP53 loss; many sporadic cancers use
  CDKN2A (p16INK4A) deletion or MDM2 amplification. The senescence arm of
  tumor suppression is elaborated in senescence_tumor_suppression. Key
  conformance target: "evading_growth_suppressors#Loss of Cell-Cycle
  Checkpoint Control". A conforming entry should also say whether its lesion
  is upstream of RB or at RB, because only the first makes
  "evading_growth_suppressors#CDK4/6 Dependence of an Intact RB Brake"
  available to it - retinoblastoma's biallelic RB1 loss is the worked negative
  case, and CDKN2A deletion or cyclin D amplification the positive one. An
  entry modelling a CDK4/6 inhibitor should reach that node via
  target_mechanisms and record its resistance route on "Restored G1/S Transit
  and Resistance to CDK4/6 Inhibition", whose off-cycle bypass arm is where
  this module meets sustaining_proliferative_signaling.
pathophysiology:
- name: Tumor Suppressor Inactivation
  description: >-
    A genetic or epigenetic lesion inactivates an RB- or p53-axis tumor
    suppressor. Routes include biallelic loss of RB1, deletion or silencing
    of CDKN2A (encoding p16INK4A and p14ARF), amplification of cyclin
    D/CDK4-6 that hyperphosphorylates RB, loss-of-function mutation of TP53
    (the most frequently mutated gene in human cancer), or amplification of
    the p53 antagonists MDM2/MDM4. Each route disables a node that normally
    enforces antiproliferative control.
  role: trigger
  biological_processes:
  - preferred_term: Signal Transduction by p53 Class Mediator
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
    modifier: DECREASED
  evidence:
  - reference: PMID:24739573
    reference_title: "Unravelling mechanisms of p53-mediated tumour suppression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The importance of p53 in tumour suppression is unequivocal, as shown
      by its inactivation in more than half of all sporadic human cancers
    explanation: >-
      Review establishing that p53 tumor-suppressor inactivation is a
      near-universal event in human cancer, supporting tumor-suppressor
      inactivation as the trigger of this module. Evidence source is OTHER
      because this is a review article.
  downstream:
  - target: Loss of Cell-Cycle Checkpoint Control
    description: >-
      Inactivation of the RB or p53 axis removes the brakes that gate
      cell-cycle progression and stress responses.

- name: Loss of Cell-Cycle Checkpoint Control
  description: >-
    With the RB and/or p53 circuits disabled, the cell loses the
    antiproliferative checkpoints that normally halt division. RB-pathway
    loss permits unrestrained G1/S transit regardless of antigrowth signals;
    p53-pathway loss abolishes the stress-induced cell-cycle arrest,
    senescence, and apoptosis that would otherwise eliminate incipient tumor
    cells. This is the conserved central node disorder-specific lesions
    converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Negative Regulation of Cell Cycle
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
    modifier: DECREASED
  - preferred_term: Negative Regulation of Cyclin-Dependent Protein Kinase Activity
    term:
      id: GO:1904030
      label: negative regulation of cyclin-dependent protein kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24739573
    reference_title: "Unravelling mechanisms of p53-mediated tumour suppression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      p53 is a crucial tumour suppressor that responds to diverse stress
      signals by orchestrating specific cellular responses, including
      transient cell cycle arrest, cellular senescence and apoptosis, which
      are all processes associated with tumour suppression.
    explanation: >-
      Defines the antiproliferative checkpoint responses (arrest,
      senescence, apoptosis) whose loss is the central effector of this
      module. Evidence source is OTHER because this is a review article.
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include sustaining proliferative signaling, evading growth
      suppressors, resisting cell death, enabling replicative immortality,
      inducing angiogenesis, and activating invasion and metastasis.
    explanation: >-
      Hanahan & Weinberg list evading growth suppressors as a core hallmark
      capability modeled here. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: Loss of Contact Inhibition
    description: >-
      Disabled tumor-suppressor circuits also relax density-dependent
      restraints on proliferation.
  - target: Unrestrained Proliferation
    description: >-
      Removal of antiproliferative checkpoints permits continued division of
      cells that should have arrested or died.
  - target: CDK4/6 Dependence of an Intact RB Brake
    description: >-
      Where the brake was lost upstream of RB, the cell still runs G1/S through
      CDK4/6 and an inhibitor can reimpose the restraint pharmacologically -
      which is only true for that subset of the lesions listed above.

- name: Loss of Contact Inhibition
  description: >-
    Normal epithelial and mesenchymal cells cease proliferating when they
    reach high density (contact inhibition), a tumor-suppressive restraint
    mediated in part by the Hippo-YAP/TAZ pathway, NF2/Merlin, and
    LKB1-AMPK. Cancer cells lose contact inhibition, continuing to divide
    and pile up beyond a confluent monolayer.
  role: effector
  biological_processes:
  - preferred_term: Contact Inhibition
    term:
      id: GO:0060242
      label: contact inhibition
    modifier: DECREASED
  evidence:
  - reference: PMID:17974916
    reference_title: "Inactivation of YAP oncoprotein by the Hippo pathway is involved in cell contact inhibition and tissue growth control."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "YAP overexpression regulates gene expression in a manner opposite to cell density, and is able to overcome cell contact inhibition."
    explanation: "Shows the Hippo-YAP axis is the restraint whose loss this node represents, by overriding contact inhibition experimentally."
  - reference: PMID:17974916
    reference_title: "Inactivation of YAP oncoprotein by the Hippo pathway is involved in cell contact inhibition and tissue growth control."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed that YAP protein is elevated and nuclear localized in some human liver and prostate cancers"
    explanation: "Places the same lesion in human tumors."
  downstream:
  - target: Unrestrained Proliferation

- name: Unrestrained Proliferation
  description: >-
    The combined loss of cell-cycle-checkpoint control and contact
    inhibition yields unrestrained proliferation: cells divide despite
    antigrowth signals, high density, and intracellular stress that would
    normally trigger arrest or death. This is the defining phenotype of the
    evading-growth-suppressors hallmark.
  role: consequence
  biological_processes:
  - preferred_term: Cell Population Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:34407969
    reference_title: "Relevance of pRB Loss in Human Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "pRB exerts a well-understood function in regulating cell-cycle progression by inhibiting the activity of E2F transcription factors."
    explanation: "The checkpoint whose loss releases proliferation at this node."
  - reference: PMID:10618707
    reference_title: "Alternative pathways for the extension of cellular life span: inactivation of p53/pRb and expression of telomerase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The development of human cancer is frequently associated with the inactivation of the pRb and p53 pathways, attesting to the importance of senescence in restricting the tumor-forming ability of human cells."
    explanation: "Links loss of the two checkpoint pathways to the unrestrained growth of tumors."

- name: CDK4/6 Dependence of an Intact RB Brake
  description: >-
    This hallmark is a loss of function, so it looks undruggable - there is no
    inhibitor of an absent tumour suppressor. The exception is the point in the
    circuit where the brake is enforced rather than where it was lost. Cyclin
    D-CDK4/6 phosphorylates RB to release G1/S, and a cell whose lesion lies
    upstream of RB - CDKN2A deletion, cyclin D or CDK4/6 amplification,
    mitogenic drive raising cyclin D - still depends on that kinase step, so a
    selective CDK4/6 inhibitor reimposes the restraint the cell lost. That is
    the basis of palbociclib, ribociclib and abemaciclib with endocrine
    therapy in hormone-receptor-positive breast cancer.
    The condition is the whole content of the node and the module's trigger
    list obscures it: RB1 loss and cyclin D amplification are listed together
    as routes to the same central node, and they are not interchangeable here.
    A tumour with no functional RB has nothing for the inhibitor to hand the
    brake back to. A conforming entry should therefore say whether its lesion
    is upstream or at RB, because that decides whether this node exists for it
    at all.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  - preferred_term: Negative Regulation of Cyclin-Dependent Protein Kinase Activity
    term:
      id: GO:1904030
      label: negative regulation of cyclin-dependent protein kinase activity
  evidence:
  - reference: PMID:27017286
    reference_title: "Targeting CDK4/6 in patients with cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dysregulation of the cyclin D-CDK4/6-INK4-Rb pathway results in increased
      proliferation, and is frequently observed in many types of cancer.
    explanation: >-
      Names the circuit this node acts in and ties its dysregulation to the
      proliferation the module's consequence node carries. Graded OTHER as the
      source is a review.
  - reference: PMID:27017286
    reference_title: "Targeting CDK4/6 in patients with cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the importance of CDK4/6 activity in cancer cells, CDK4/6
      inhibitors have emerged as promising candidates for cancer treatment.
    explanation: >-
      Supports the druggability claim at this step, which is what makes a
      loss-of-function hallmark reachable by an inhibitor at all.
  - reference: PMID:27017286
    reference_title: "Targeting CDK4/6 in patients with cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pathway activation can occur through a variety of mechanisms, including
      gene amplification or rearrangement, loss of negative regulators,
      epigenetic alterations, and point mutations in key pathway components.
    explanation: >-
      Enumerates the upstream-of-RB lesions for which this node exists, which
      is the distinction the module's trigger list does not draw.
  downstream:
  - target: Restored G1/S Transit and Resistance to CDK4/6 Inhibition
    description: >-
      Resistance here is the brake being lost a second time, at or below the
      point the drug was holding.

- name: Restored G1/S Transit and Resistance to CDK4/6 Inhibition
  description: >-
    Resistance to CDK4/6 inhibition is this module's own mechanism recurring
    one step lower. Roughly a tenth of patients never respond, and most of the
    rest progress after about two years of first-line therapy. The cell-cycle
    routes are the informative ones: RB loss, which removes the substrate the
    drug's restraint depends on, p16 amplification, CDK4 or CDK6
    amplification, and cyclin E-CDK2 amplification, which bypasses CDK4/6
    altogether. Bypass through FGFR or PI3K/AKT/mTOR raises cyclin D from
    outside the cycle instead, which is where this module meets
    sustaining_proliferative_signaling. The practical consequence for a
    conforming entry is that RB status is not a fixed property of the tumour:
    a lesion that made the vulnerability node available can be lost under
    treatment, and the resistance route should be recorded as which element of
    the brake the tumour gave up.
  role: adaptive_escape
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
    modifier: INCREASED
  evidence:
  - reference: PMID:36030016
    reference_title: "Resistance to CDK4/6 inhibition: Mechanisms and strategies to overcome a therapeutic problem in the treatment of hormone receptor-positive metastatic breast cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Various mechanisms of resistance to CDK4/6 inhibitors have been
      described, including cell cycle-related mechanisms, such as RB loss, p16
      amplification, CDK6 or CDK4 amplification, and cyclin E-CDK2
      amplification.
    explanation: >-
      Enumerates the cell-cycle resistance routes this node lists, including RB
      loss - the one that removes the substrate the upstream vulnerability
      depends on. Graded OTHER as the source is a review.
  - reference: PMID:36030016
    reference_title: "Resistance to CDK4/6 inhibition: Mechanisms and strategies to overcome a therapeutic problem in the treatment of hormone receptor-positive metastatic breast cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other bypass mechanisms involve the activation of FGFR or PI3K/AKT/mTOR
      pathways.
    explanation: >-
      Supports the off-cycle bypass arm, which is the point at which this node
      becomes the sibling module's central node rather than this one's.
  - reference: PMID:36030016
    reference_title: "Resistance to CDK4/6 inhibition: Mechanisms and strategies to overcome a therapeutic problem in the treatment of hormone receptor-positive metastatic breast cancer."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite their promising activity, approximately 10 % of patients have de
      novo resistance, while the rest of them will develop acquired resistance
      after 24-28 months when used as first-line therapy and after a shorter
      period when used as second-line therapy.
    explanation: >-
      Quantifies both halves of the node and makes the de novo and acquired
      forms distinguishable, which is what stops a conforming entry treating RB
      status as fixed.

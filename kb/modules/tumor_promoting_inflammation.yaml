name: Tumor-Promoting Inflammation Module
description: >-
  A conserved mechanism module for the enabling characteristic of cancer
  (Hanahan & Weinberg): tumor-promoting inflammation. Chronic inflammation
  fosters multiple hallmark capabilities by supplying the tumor
  microenvironment with bioactive molecules. The conserved causal chain runs
  from an inflammatory stimulus (chronic infection, autoimmune or
  irritant-driven chronic inflammation, obesity-associated inflammation, or
  inflammation elicited by the incipient neoplasm itself) through
  recruitment and activation of innate and adaptive immune cells -
  tumor-associated macrophages, neutrophils, mast cells, and lymphocytes -
  that establish a pro-tumorigenic inflammatory microenvironment.
  These cells secrete growth factors, pro-angiogenic factors (VEGF),
  matrix-remodeling proteases (MMPs), reactive oxygen species that are
  themselves mutagenic, and cytokines (TNF, IL-6) that activate
  pro-survival/proliferative NF-kB and STAT3 signaling in tumor cells. The
  net effect is promotion of proliferation, survival, angiogenesis,
  invasion, and further genomic instability. Individual disorder entries
  declare conformance via conforms_to, substituting the tumor-type-specific
  inflammatory driver (e.g., Helicobacter pylori gastritis preceding gastric
  cancer, inflammatory bowel disease preceding colitis-associated colorectal
  cancer, viral hepatitis preceding hepatocellular carcinoma). This module
  complements immune_checkpoint_blockade, which models the adaptive
  immune-evasion arm.
category: Module
module_categories:
- ONCOLOGY
- IMMUNOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory
  Microenvironment"). The module defines the expected pathophysiology
  structure; conforming nodes in disorder files should include the
  corresponding cell types, biological processes, and causal edges,
  specialized to their tumor context. Key tumor-specific substitutions:
  Helicobacter pylori gastritis -> gastric cancer; inflammatory bowel
  disease -> colitis-associated colorectal cancer; chronic viral hepatitis
  -> hepatocellular carcinoma. The distinct adaptive immune-evasion /
  checkpoint axis is modeled in immune_checkpoint_blockade. Key conformance
  target: "tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory
  Microenvironment".
pathophysiology:
- name: Chronic Inflammatory Stimulus
  description: >-
    A persistent inflammatory stimulus initiates the cascade. Sources
    include chronic infection (e.g., Helicobacter pylori, hepatitis B/C
    virus, schistosomiasis), chronic non-infectious inflammation
    (inflammatory bowel disease, chronic pancreatitis, reflux esophagitis),
    inhaled irritants (tobacco smoke, asbestos), obesity-associated
    metabolic inflammation, and inflammation triggered by the developing
    neoplasm itself. Each sustains an inflammatory response at the future
    tumor site.
  role: trigger
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it has become evident that an inflammatory microenvironment is an
      essential component of all tumors
    explanation: >-
      Establishes the inflammatory microenvironment as an essential
      component of tumors, the basis for the inflammatory stimulus trigger of
      this module. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Pro-Tumorigenic Inflammatory Microenvironment

- name: Pro-Tumorigenic Inflammatory Microenvironment
  description: >-
    The inflammatory stimulus recruits and activates innate and adaptive
    immune cells - tumor-associated macrophages (often M2-polarized),
    neutrophils, mast cells, and lymphocytes - that infiltrate the tissue
    and establish a pro-tumorigenic inflammatory microenvironment. These
    cells secrete growth and survival factors, pro-angiogenic factors,
    matrix-remodeling proteases, and cytokines, and engage in dynamic
    crosstalk with (pre)neoplastic cells. This is the conserved central node
    of the module.
  role: central_effector
  cell_types:
  - preferred_term: Tumor-Associated Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Positive Regulation of Cytokine Production
    term:
      id: GO:0001819
      label: positive regulation of cytokine production
    modifier: INCREASED
  evidence:
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immune cells that infiltrate tumors engage in an extensive and dynamic
      crosstalk with cancer cells, and some of the molecular events that
      mediate this dialog have been revealed.
    explanation: >-
      Describes the infiltrating-immune-cell / cancer-cell crosstalk that
      defines the pro-tumorigenic inflammatory microenvironment, the central
      effector of this module. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: Hallmark-Promoting Inflammatory Output

- name: Hallmark-Promoting Inflammatory Output
  description: >-
    The inflammatory microenvironment supplies the tumor with bioactive
    molecules that promote multiple hallmark capabilities: growth factors
    (proliferation), survival factors and NF-kB/STAT3-activating cytokines
    such as TNF and IL-6 (resisting cell death), VEGF (angiogenesis), and
    matrix-degrading proteases (invasion and metastasis). Reactive oxygen
    and nitrogen species released by inflammatory cells are mutagenic,
    feeding back to increase genomic instability. The net output is
    acceleration of tumor initiation, promotion, and progression.
  role: consequence
  biological_processes:
  - preferred_term: Cytokine-Mediated Signaling Pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inflammatory responses play decisive roles at different stages of
      tumor development, including initiation, promotion, malignant
      conversion, invasion, and metastasis.
    explanation: >-
      Directly states that inflammation drives multiple stages of tumor
      development, the hallmark-promoting output modeled in this node.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Underlying these hallmarks are genome instability, which generates the
      genetic diversity that expedites their acquisition, and inflammation,
      which fosters multiple hallmark functions.
    explanation: >-
      Hanahan & Weinberg define inflammation as an enabling characteristic
      that fosters multiple hallmark functions, modeled in this output node.
      Evidence source is OTHER because this is a review article.
environmental:
- name: Chronic Tobacco Smoke Exposure
  description: >-
    Inhaled tobacco smoke is the largest single exposure in this module's
    inflammatory class. Beyond its carcinogen content, which acts
    on tumor initiation, it sustains chronic inflammation at the future tumor
    site and so supplies the module's trigger independently of any mutagenic
    effect.
  exposure_term:
    preferred_term: chronic tobacco smoke exposure
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Up to 20% of cancers are linked to chronic infections, 30% can be
      attributed to tobacco smoking and inhaled pollutants (such as silica and
      asbestos), and 35% to dietary factors (20% of cancer burden is linked to
      obesity) (Aggarwal et al., 2009).
    explanation: >-
      Quantifies the share of cancer burden attributable to this exposure class
      across tumor types rather than in one disorder. The review attributes the
      figures to Aggarwal et al., which the quote retains. Evidence source is
      OTHER because this is a review article.
  influences_mechanisms:
  - target: Chronic Inflammatory Stimulus
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Tobacco smoke acts on the module's trigger node as a tumor promoter, by
      establishing chronic inflammation at the exposed site. This is separable
      from its role as a tumor initiator, which runs through carcinogen-driven
      mutation rather than through this module.
    evidence:
    - reference: PMID:20303878
      reference_title: "Immunity, inflammation, and cancer."
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      snippet: >-
        recent work has shown that in addition to being a tumor initiator by
        virtue of its high carcinogen content, tobacco smoke is also a tumor
        promoter due to its ability to trigger chronic inflammation (Takahashi
        et al., 2010)
      explanation: >-
        States that the tumor-promoting action of tobacco smoke runs through
        triggering chronic inflammation, which is exactly the edge this link
        asserts. The review attributes the finding to Takahashi et al., which
        the quote retains. Evidence source is OTHER because this is a review
        article.
- name: Inhaled Asbestos Exposure
  description: >-
    Inhaled mineral fibers and particles are the non-mutagenic member of this
    exposure class. Asbestos gives rise to lung cancer without obvious mutagenic
    activity, so its tumorigenic action is attributed to the inflammation it
    provokes rather than to direct genotoxicity.
  exposure_term:
    preferred_term: inhaled asbestos exposure
    term:
      id: ECTO:9000033
      label: exposure to asbestos
  evidence:
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Inhaled asbestos or silica particles also give rise to lung cancer but
      have no obvious mutagenic activity.
    explanation: >-
      Establishes the exposure as carcinogenic while excluding direct mutagenic
      action, which is why it belongs to the inflammation-mediated route this
      module models. Evidence source is OTHER because this is a review article.
  influences_mechanisms:
  - target: Chronic Inflammatory Stimulus
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhaled mineral particles act on the trigger node through inflammasome
      activation, supplying a sustained inflammatory stimulus in the absence of
      a mutagenic one.
    evidence:
    - reference: PMID:20303878
      reference_title: "Immunity, inflammation, and cancer."
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      snippet: >-
        Such particles, however, can trigger inflammation through effects on
        pro-interluekin-1β (IL-1β) processing by the inflammasome (Dostert et
        al., 2008) and this may mediate their tumorigenic activity.
      explanation: >-
        Supports the exposure triggering inflammation, the edge asserted here.
        Note that the review hedges the onward step, that this inflammation
        mediates tumorigenesis, as one that may hold; the link is scoped to the
        inflammatory trigger and does not carry the hedged claim. Evidence
        source is OTHER because this is a review article.
- name: Persistent Helicobacter pylori Infection
  description: >-
    Persistent infection with a tumorigenic pathogen is the infectious arm of
    the exposure class. The organism is not cleared, and the low-grade
    inflammation that accompanies its persistence is what feeds this module.
  exposure_term:
    preferred_term: persistent Helicobacter pylori infection
    term:
      id: ECTO:3000003
      label: exposure to Helicobacter pylori
  review_notes: >-
    The other infectious drivers named in the module description, hepatitis B
    and C virus and Schistosoma, have no ECTO exposure term and are not modeled
    as separate entries here. The non-infectious chronic inflammatory drivers,
    inflammatory bowel disease and chronic pancreatitis, are deliberately not
    modeled as exposures at all: they are disease states, and an exposure entry
    is the wrong shape for them. Helicobacter pylori is bound because ECTO
    carries the term, not because the module is gastric; the evidence quoted for
    it is drawn from a pan-cancer review rather than a gastric cancer paper.
  evidence:
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Persistent Helicobacter pylori infection is associated with gastric cancer
      and MALT (mucosa-associated lymphoid tissue) lymphoma.
    explanation: >-
      Establishes the persistent infection as a cancer-associated exposure. The
      quote names the two malignancies it is associated with; the module does
      not inherit that organ specificity, which stays on the conforming disorder
      entries. Evidence source is OTHER because this is a review article.
  influences_mechanisms:
  - target: Chronic Inflammatory Stimulus
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A tumorigenic pathogen that establishes persistent infection supplies the
      module's trigger node with a chronic, low-grade inflammatory stimulus. The
      persistence is the operative feature, since an infection that resolves
      does not sustain the stimulus.
    evidence:
    - reference: PMID:20303878
      reference_title: "Immunity, inflammation, and cancer."
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      snippet: >-
        tumorigenic pathogens subvert host immunity and establish persistent
        infections associated with low grade but chronic inflammation
      explanation: >-
        States the pathogen-to-chronic-inflammation edge generically across
        tumorigenic pathogens rather than for one organism, which is the level
        at which this module works. Evidence source is OTHER because this is a
        review article.

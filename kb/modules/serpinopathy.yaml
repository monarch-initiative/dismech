name: Serpinopathy Module
description: >-
  A conserved mechanism module for the serpinopathies: a destabilizing missense
  variant in an inhibitory serpin perturbs its metastable native fold, the
  destabilized molecules associate into ordered, hyperstable polymers (an
  RCL-into-sheet-A loop-sheet / domain-swap linkage) that are retained in the
  endoplasmic reticulum of the secretory cell as inclusions, and the retained
  polymer load then acts through two parallel arms - a proteotoxic gain of
  function (ER stress and cell death, with organ-specific injury) and a loss of
  function (depleted circulating serpin, leaving its target protease unopposed).
  The rate-limiting, disorder-agnostic key conformance target is Serpin
  Polymerization; conformers substitute the specific serpin, secretory cell type
  and downstream organ injury (Z-alpha-1-antitrypsin in hepatocytes and lung;
  neuroserpin in neurons). A drug-target pattern points polymerization inhibitors
  at that node. This module is complementary to er_protein_storage_disease (the
  hepatocyte-specific ER-storage -> injury -> stellate-cell fibrosis downstream,
  which a hepatic serpinopathy conforms to in parallel) and distinct from
  amyloidogenesis (cross-beta amyloid, not the serpin loop-sheet/domain-swap
  polymer).
category: Module
creation_date: "2026-10-29T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease: do not create a "Serpinopathy"
  Disease entry. Conformers are the polymerizing (conformational) serpinopathies
  - alpha-1-antitrypsin (SERPINA1), neuroserpin (SERPINI1), antithrombin
  (SERPINC1), C1-inhibitor (SERPING1) shutter-region variants, and
  alpha-1-antichymotrypsin (SERPINA3) - whose variants form intracellular
  polymers. A serpin null allele, a non-polymerizing loss-of-function variant,
  or a secreted/cytoplasmic clade-B serpin disease (such as SERPINB7
  Nagashima-type palmoplantar keratoderma) is a plain loss-of-function serpin
  deficiency and does not conform. The exact polymer model - classic loop-sheet
  versus a more extensive domain swap - is debated (PMID:20667823); the module is
  framed on the agreed conserved fact of ordered protomer-protomer polymerization,
  not on one structural model. Evidence is drawn from two exemplars, the
  prototypical Z-alpha-1-antitrypsin (liver and lung) and neuroserpin (brain,
  FENIB), to document the conserved cascade rather than a single disease. A
  hepatic serpinopathy conforms its ER-retention, injury and fibrosis nodes to
  er_protein_storage_disease in parallel with conforming its polymerization node
  here.
pathophysiology:
- name: Serpin Conformational Instability
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A destabilizing missense variant, classically in the shutter or breach
    region, perturbs the metastable native fold of an inhibitory serpin - whose
    reactive-centre loop (RCL) is normally held exposed over beta-sheet A - and
    populates a polymerogenic intermediate.
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  downstream:
  - target: Serpin Polymerization
    description: The destabilized, metastable molecule is primed to associate into polymers.
  evidence:
  - reference: PMID:20667823
    reference_title: Loop-sheet mechanism of serpin polymerization tested by reactive center loop mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "The serpin mechanism of protease inhibition involves the rapid and stable incorporation of the reactive center loop (RCL) into central β-sheet A."
    explanation: >-
      Establishes the metastable RCL-exposed serpin architecture that a
      destabilizing variant perturbs.
  - reference: PMID:20667823
    reference_title: Loop-sheet mechanism of serpin polymerization tested by reactive center loop mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "This unusual feature of serpins renders them highly susceptible to point mutations that lead to the accumulation of hyperstable misfolded polymers in the endoplasmic reticulum of secretory cells."
    explanation: >-
      Links the metastable fold to point-mutation-driven accumulation of
      hyperstable polymers in the ER, the conserved trigger of this module.
- name: Serpin Polymerization
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Destabilized serpin monomers associate into ordered, hyperstable,
    SDS-resistant polymers through a sequential linkage in which a segment of one
    protomer's RCL inserts into beta-sheet A of the next. The exact model (classic
    loop-sheet versus a more extensive domain swap) is debated, but the ordered
    protomer-protomer association is the conserved, rate-limiting, disease-defining
    step every serpinopathy funnels through. This is the key conformance target.
  biological_processes:
  - preferred_term: protein polymerization
    modifier: INCREASED
    term:
      id: GO:0051258
      label: protein polymerization
  downstream:
  - target: Intracellular Polymer Retention
    description: The ordered polymers are too stable to refold and accumulate intracellularly.
  evidence:
  - reference: PMID:20667823
    reference_title: Loop-sheet mechanism of serpin polymerization tested by reactive center loop mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: 'The ordered and stable protomer-protomer association in serpin polymers has led to the acceptance of the "loop-sheet" hypothesis of polymerization, where a portion of the RCL of one protomer incorporates in register into sheet A of another.'
    explanation: >-
      Defines the ordered protomer-protomer polymer linkage (loop-sheet /
      domain-swap) that is the conserved key step.
  - reference: PMID:10517635
    reference_title: Familial dementia caused by polymerization of mutant neuroserpin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we describe a new disease, familial encephalopathy with neuroserpin inclusion bodies, characterized clinically as an autosomal dominantly inherited dementia, histologically by unique neuronal inclusion bodies and biochemically by polymers of the neuron-specific serpin, neuroserpin."
    explanation: >-
      A second serpin (neuroserpin) polymerizing in a different organ (brain),
      showing the polymerization mechanism is conserved across the family.
- name: Intracellular Polymer Retention
  role: effector
  biological_scale: CELLULAR
  description: >-
    The ordered polymers cannot be refolded or efficiently exported and
    accumulate within the endoplasmic reticulum of the serpin-synthesizing
    secretory cell as insoluble inclusions (PAS-positive globules in hepatocytes;
    Collins bodies in neurons). ER-associated degradation and autophagy attempt to
    clear them. (ERAD acts mainly on soluble monomers; the ordered polymers
    themselves are cleared largely by autophagy, so no single clearance pathway is
    bound here.)
  cell_types:
  - preferred_term: secretory cell
    term:
      id: CL:0000151
      label: secretory cell
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  downstream:
  - target: Polymer Proteotoxicity
    description: The retained polymer load imposes proteotoxic stress on the cell.
  - target: Circulating Serpin Deficiency
    description: Intracellular retention lowers the circulating serpin concentration.
  evidence:
  - reference: DOI:10.1186/s12929-024-01054-1
    reference_title: "The double whammy of ER-retention and dominant-negative effects in numerous autosomal dominant diseases: significance in disease mechanisms and therapy"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutant proteins unable to attain their correct tertiary conformation or form complexes with their partners are retained in the ER and subsequently degraded through ER-associated protein degradation (ERAD) and associated mechanisms."
    explanation: >-
      Establishes ER retention of misfolded mutant proteins and their disposal
      through ERAD, the conserved retention/clearance step.
  - reference: PMID:28752441
    reference_title: Pathophysiology of Alpha-1 Antitrypsin Deficiency Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These homozygous individuals synthesize large quantities of a1AT mutant Z protein in the liver, but the mutant protein folds improperly during biogenesis and approximately 85% of the molecules are retained within the hepatocytes rather than appropriately secreted."
    explanation: >-
      The prototype (Z-AAT): most of the misfolded serpin is retained within the
      synthesizing hepatocyte rather than secreted.
- name: Polymer Proteotoxicity
  role: consequence
  biological_scale: CELLULAR
  description: >-
    The retained polymer load is a proteotoxic gain of function: it imposes ER
    stress and, in the prototype (Z-AAT hepatocyte), drives mitochondrial
    depolarization and caspase-mediated death with a cycle of cell death and
    regeneration. Conformers substitute the organ-specific injury (hepatocyte
    death -> liver fibrosis/cirrhosis; neuronal death -> dementia). Note that
    serpin polymers characteristically provoke an ER-overload / NF-kappaB response
    rather than a strong classic unfolded protein response, so conformers should
    not assume UPR activation from this node.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:28752441
    reference_title: Pathophysiology of Alpha-1 Antitrypsin Deficiency Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This intracellular death cascade appears to involve ER stress, mitochondrial depolarization, and caspase cleavage, and is possibly linked to autophagy and redox injury."
    explanation: >-
      Defines the proteotoxic death cascade driven by the retained polymer load,
      the conserved gain-of-function injury arm.
- name: Circulating Serpin Deficiency
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Because most of the mutant serpin is retained intracellularly, its circulating
    concentration falls - a loss of the secreted inhibitor pool.
  molecular_functions:
  - preferred_term: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  downstream:
  - target: Unopposed Protease Activity
    description: The depleted circulating inhibitor leaves the target protease uncontrolled.
  evidence:
  - reference: PMID:39440224
    reference_title: Liver Characterization of a Cohort of Alpha-1 Antitrypsin Deficiency Patients with and without Lung Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpha-1 antitrypsin deficiency (AATD) is a genetic disorder characterized by the misfolding and accumulation of the mutant variant of alpha-1 antitrypsin (AAT) within hepatocytes, which limits its access to the circulation and exposes the lungs to protease-mediated tissue damage."
    explanation: >-
      Intracellular retention limits the serpin's access to the circulation,
      lowering the secreted inhibitor level (prototype: Z-AAT).
- name: Unopposed Protease Activity
  role: consequence
  biological_scale: ORGANISM
  description: >-
    With the circulating inhibitor depleted, the serpin's target protease is no
    longer adequately controlled and damages the organ specific to that serpin
    (neutrophil elastase -> pulmonary emphysema for alpha-1-antitrypsin; thrombin
    for antithrombin; the contact-system proteases for C1-inhibitor). This
    loss-of-function arm runs parallel to the polymer proteotoxicity arm.
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    modifier: INCREASED
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  evidence:
  - reference: PMID:39440224
    reference_title: Liver Characterization of a Cohort of Alpha-1 Antitrypsin Deficiency Patients with and without Lung Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpha-1 antitrypsin deficiency (AATD) is a genetic disorder characterized by the misfolding and accumulation of the mutant variant of alpha-1 antitrypsin (AAT) within hepatocytes, which limits its access to the circulation and exposes the lungs to protease-mediated tissue damage."
    explanation: >-
      The uninhibited target protease causes organ damage (prototype: unopposed
      neutrophil elastase injuring the lung).
treatments:
- name: Serpin polymerization inhibitor (investigational)
  description: >-
    Small molecules or peptides that block the ordered protomer-protomer
    association, proposed to act at the key conformance node. Investigational;
    no approved agent exists.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Serpin Polymerization
    treatment_effect: INHIBITS
    description: >-
      Blocking polymerization at the rate-limiting conserved step would prevent
      both intracellular polymer accumulation and the resulting loss of secreted
      serpin.
    evidence:
    - reference: PMID:10517635
      reference_title: Familial dementia caused by polymerization of mutant neuroserpin.
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "Our findings provide a molecular mechanism for a familial dementia and imply that inhibitors of protein polymerization may be effective therapies for this disorder and perhaps for other more common neurodegenerative diseases."
      explanation: >-
        Names inhibition of serpin polymerization as a therapeutic strategy
        acting on the key conformance node.

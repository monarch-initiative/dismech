    snippet: >-
      change in cellular morphology from pseudostratified columnar epithelium
      to squamous epithelium, and depletion of GSH
    explanation: >-
      Measures dose-dependent glutathione depletion in human nasal epithelium
      after reactive vapour exposure, which is the thiol depletion this node
      asserts.
  - reference: PMID:31808915
    reference_title: "Metabolic Basis for Nonlinearity in 1,3-Dichloropropene Toxicokinetics and Use in Setting a Kinetically-derived Maximum Inhalation Exposure Concentration in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The glutathione (GSH)-dependent metabolism of 1,3-D results in
      significant depletion of GSH at repeated exposure levels of 30 ppm and
      above
    explanation: >-
      Confirms in a whole animal, and with a concentration threshold, the
      thiol depletion the in vitro airway models show, so this node does not
      rest on cell culture alone.
  downstream:
  - target: Airway Epithelial Junctional Barrier Failure
    description: >-
      Unbuffered electrophilic and oxidative stress damages tight junction
      proteins and, at higher exposure, kills epithelial cells.
- name: Airway Epithelial Junctional Barrier Failure
  description: >-
    The rate-limiting step and the key conformance target. Tight junctions are
    disrupted, paracellular permeability rises, and transepithelial electrical
    resistance falls — the readout the air-liquid-interface airway models use.
    Crucially this can occur with the epithelium intact: acrolein disrupts
    zonula occludens-1 and raises permeability without cell death or
    detachment, so junctional failure is not merely a consequence of
    cytotoxicity. Epithelial cell death is an additional route to the same
    node at higher exposure. Once the barrier is lost, the agent and
    co-deposited material reach the submucosa, and the epithelium enters the
    repair programme that the next node describes.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: bicellular tight junction assembly
    term:
      id: GO:0070830
      label: bicellular tight junction assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: bicellular tight junction
    term:
      id: GO:0005923
      label: bicellular tight junction
    modifier: DECREASED
  locations:
  - preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  evidence:
  - reference: PMID:32588239
    reference_title: Ion transport mechanisms for smoke inhalation-injured airway epithelial barrier.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thermal stress or acrolein disrupted zonula occludens-1 tight junctions,
      increased fluorescein isothiocyanate-dextran permeability but did not
      cause cell death or detachment
    explanation: >-
      Establishes the central claim of this node: a reactive inhaled aldehyde
      causes junctional disruption and permeability loss without killing the
      epithelium, so barrier failure is a mechanism in its own right.
  - reference: PMID:38013136
    reference_title: "Toxicological assessment of E-cigarette flavored E-liquids aerosols using Calu-3 cells: A 3D lung model approach."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      significantly decreased TEER and increased lactate dehydrogenase (LDH)
      release compared to the incubator and air-only controls
    explanation: >-
      Shows the same barrier failure in a human bronchial air-liquid-interface
      model after aerosol exposure, measured as transepithelial electrical
      resistance, alongside the cytotoxicity route to this node.
  - reference: PMID:36183849
    reference_title: "NAM-based prediction of point-of-contact toxicity in the lung: A case example with 1,3-dichloropropene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      using an assay for transepithelial conductance (for epithelial barrier
      integrity) and the lactate dehydrogenase (LDH) release assay (for
      cytotoxicity)
    explanation: >-
      Names barrier integrity and cytotoxicity as the two measured endpoints
      for a reactive vapour across five airway regions, which is this node
      read out as the assay that conforming models use.
  downstream:
  - target: Loss of Mucociliary Differentiation
    description: >-
      Injury to the barrier triggers a repair response in which the
      differentiated mucociliary phenotype is lost.
- name: Loss of Mucociliary Differentiation
  description: >-
    The injured epithelium loses its differentiated phenotype: ciliated cells
    are lost, apoptotic bodies appear, mucous cell populations change, and the
    pseudostratified columnar architecture is replaced by squamous epithelium.
    Squamous metaplasia is the characteristic repeated-exposure lesion of the
    conducting airway and is a reparative response, not a neoplastic one. This
    node is **not** ciliary dysfunction in the sense of
    `ciliopathy_dysfunction`: there the axoneme or basal body is genetically
    defective, whereas here the ciliated cell population is depleted and
    replaced. Do not conform a chemical exposure to that module.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: respiratory tract multiciliated cell
    term:
      id: CL:4030034
      label: respiratory tract multiciliated cell
  biological_processes:
  - preferred_term: epithelial cell differentiation
    term:
      id: GO:0030855
      label: epithelial cell differentiation
    modifier: DECREASED
  locations:
  - preferred_term: nasal cavity respiratory epithelium
    term:
      id: UBERON:0005385
      label: nasal cavity respiratory epithelium
  evidence:
  - reference: PMID:37863466
    reference_title: "Increasing confidence in new approach methodologies for inhalation risk assessment with multiple end point assays using 5-day repeated exposure to 1,3-dichloropropene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      a decrease in ciliated bodies and an increase in apoptotic bodies
    explanation: >-
      Measures the ciliated cell loss and apoptosis of this node in human
      nasal epithelium under repeated reactive vapour exposure.
  - reference: PMID:25398987
    reference_title: Abnormal epithelial structure and chronic lung inflammation after repair of chlorine-induced airway injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The repaired epithelium contained an abnormal distribution of epithelial
      cells containing clusters of club or ciliated cells rather than the
      uniformly interspersed pattern of these cells in unexposed mice
    explanation: >-
      Shows with a chemically unrelated irritant that the epithelium repairs to
      a disordered mucociliary arrangement rather than to normal, which is this
      node reached by a second agent and in vivo.
  downstream:
  - target: Impaired Mucociliary Clearance and Persistent Airway Irritation
    description: >-
      An epithelium without cilia and with altered mucus cannot clear the
      airway, so deposited material and the irritant response persist.
- name: Impaired Mucociliary Clearance and Persistent Airway Irritation
  description: >-
    The outcome. With the ciliated population depleted and the mucus altered,
    mucociliary clearance falls, so deposited material dwells longer and the
    injury is self-sustaining under continued exposure. Clinically this is
    mucous membrane irritation of the upper and lower airway, and with
    repeated exposure the remodelled, metaplastic epithelium persists. Reduced
    clearance also raises susceptibility to inhaled pathogens and to
    co-deposited material.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: mucociliary clearance
    term:
      id: GO:0120197
      label: mucociliary clearance
    modifier: DECREASED

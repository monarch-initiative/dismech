- name: Calu-3 air-liquid-interface 3D bronchial airway model, aerosol exposure
  description: >-
    The Calu-3 human bronchial epithelial cell line cultured at an air-liquid
    interface (ALI), validated over 28 days as a differentiated 3D airway model
    (rising transepithelial electrical resistance alongside rising goblet,
    ciliated and tight-junction markers and MUC5AC production) and then, on
    21-day ALI cultures, exposed apically to the aerosols of three flavoured
    electronic-cigarette e-liquids, a
    PG/VG vehicle, and a 3R4F reference-cigarette comparator. It is the
    air-liquid-interface readout this module's barrier-failure node is built
    around: an inhaled aerosol deposited on the bronchial epithelium, read out as
    the TEER drop that marks junctional barrier loss, with lactate dehydrogenase
    release as the accompanying cytotoxicity. The PG/VG vehicle, cinnamon and
    hazelnut aerosols each dropped TEER and raised LDH to a degree
    indistinguishable from the reference cigarette, while vanilla tobacco was
    inert — a flavour- and vehicle-dependent difference the model resolves but
    which dismech has no shape to carry.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  conditions:
  - inhaled aerosol exposure
  - electronic-cigarette aerosol
  - airway epithelial barrier injury
  cell_source: >-
    Calu-3, a human bronchial epithelial line derived from a bronchial
    adenocarcinoma, cultured as a single cell type at an air-liquid interface on
    a collagen-coated transwell; the model was validated over 28 days and the

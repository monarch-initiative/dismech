name: Inhaled Irritant Airway Epithelial Injury Module
description: >-
  The conserved pathophysiology of chemical irritant injury to the conducting
  airway epithelium — nasal, tracheal and bronchial — caused by reactive
  inhaled xenobiotics: volatile electrophiles such as 1,3-dichloropropene,
  aldehydes such as acrolein and formaldehyde, oxidant gases such as chlorine
  and ozone, and inhaled aerosol and particulate mixtures. The chain is:
  deposition of the reactive agent on the airway epithelial lining; epithelial
  thiol depletion with electrophilic and oxidative stress; junctional barrier
  failure; loss of mucociliary differentiation, with ciliated cell loss and
  squamous metaplasia; and impaired mucociliary clearance with persistent
  irritation. Key conformance target is
  `inhaled_irritant_airway_injury#Airway Epithelial Junctional Barrier Failure`
  — the rate-limiting step every conforming entry funnels through, and the one
  the air-liquid-interface airway models read out as transepithelial electrical
  resistance. Conforming entries substitute the agent and the airway level:
  nasal epithelium for a soluble reactive vapour, bronchial for an aerosol.
  This module is **non-immune**: there is no haptenation and no
  antigen-specific memory, which is what separates it from
  `chemical_respiratory_allergy`, the sensitizing counterpart that can run in
  the same airway from the same exposure. It is complementary to
  `keap1_nrf2_are_signaling`, which models the KEAP1 sensor cysteine
  modification and the adaptive antioxidant response — that module is the cell
  defending itself, this one is the injury that defence fails to prevent, and a
  node may legitimately conform to both. It is distinct from
  `alveolar_capillary_barrier_failure` (distal lung, gas-exchange surface),
  from `emphysema_protease_antiprotease_imbalance` (a protease-driven
  mechanism), and from `epithelial_barrier_dysfunction`, which is scoped to the
  allergic type 2 barrier hypothesis as an intrinsic junctional or
  differentiation defect rather than a chemical insult.
category: Module
module_categories:
- TOXICOLOGY
creation_date: "2026-11-09T00:00:00Z"
notes: >-
  Scope. The conducting airway only. Injury to the alveolar gas-exchange
  surface is `alveolar_capillary_barrier_failure`. Do NOT create an
  `Inhaled Irritant Airway Injury` Disease entry — this is a mechanism that
  specific exposures and diseases conform to, not a disease. Reactive airways
  dysfunction syndrome, which follows a single high-dose irritant exposure, is
  a clinical entity that would conform here rather than being modelled
  separately inside the module.

  Barrier failure does not require cell death, and the node is worded to allow
  both. Acrolein disrupts zonula occludens-1 tight junctions and increases
  paracellular permeability without killing or detaching the epithelium, so a
  module that made cytotoxicity the mechanism of barrier loss would be wrong
  for the best-characterised agent in the class. Cell death occurs at higher
  exposure and is an additional route to the same node, not a precondition
  for it.

  Why this is one module and not three. Thiol depletion, barrier failure and
  loss of mucociliary differentiation are separable measurements, and the NAMs
  literature measures them separately — which raised the question of whether
  this should be three modules. It is one because they form a single ordered
  chain through one rate-limiting step: the reactive agent must deplete
  epithelial defences before it injures the junctions, and the differentiated
  mucociliary phenotype is lost downstream of that injury as the epithelium
  repairs toward squamous. A conforming entry that measures only one of the
  three conforms at that node and reports the others as absent, which is what
  `just check-conformance-content` is for.

  Sensory irritation is a parallel reflex, not part of this chain. Reactive
  inhaled electrophiles also activate TRPA1 on airway sensory nerve endings,
  producing cough, the respiratory rate drop of the Alarie reflex, and the
  perception of irritation. That is a neural pathway running alongside the
  epithelial injury modelled here, on a faster timescale and at lower
  concentrations, and it does not pass through barrier failure. An entry
  conforming here that also needs the sensory arm should model it separately;
  `Formaldehyde_Poisoning` already carries a distinct trigeminal sensory
  irritation node.

  Dosimetry is upstream of this module and deliberately outside it. Which
  airway level a given agent injures is set by its water solubility and
  reactivity, and the in-vitro-to-in-vivo extrapolation that converts an
  exposure concentration to a delivered dose is a separate modelling step with
  no mechanism node here. See dismech#16887 on where that step belongs.

  Evidence shape. The trigger, thiol-depletion and differentiation nodes rest
  on one well-characterised human nasal air-liquid-interface study of a single
  agent (1,3-dichloropropene); the barrier node adds acrolein in mouse
  tracheal monolayers and an aerosol exposure in human bronchial cells. The
  chain is therefore better evidenced at its centre than at its ends, and the
  consequence node is supported only by a background statement of the human
  clinical picture rather than by a measurement.
pathophysiology:
- name: Reactive Inhaled Xenobiotic Deposition on Airway Epithelium
  description: >-
    The initiating step. An electrophilic or oxidant gas, vapour or particle
    deposits on the airway surface liquid and the epithelial lining of the
    conducting airway. Where it deposits, and therefore which airway level is
    injured, is governed by the agent's water solubility and reactivity: a
    soluble reactive vapour is scrubbed proximally and injures the nasal
    epithelium, a less soluble one penetrates to the bronchi. This node is the
    delivered exposure, not yet a cellular response.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: respiratory tract epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  biological_processes:
  - preferred_term: cellular response to xenobiotic stimulus
    term:
      id: GO:0071466
      label: cellular response to xenobiotic stimulus
    modifier: INCREASED
  locations:
  - preferred_term: nasal cavity respiratory epithelium
    term:
      id: UBERON:0005385
      label: nasal cavity respiratory epithelium
  - preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  evidence:
  - reference: PMID:37863466
    reference_title: "Increasing confidence in new approach methodologies for inhalation risk assessment with multiple end point assays using 5-day repeated exposure to 1,3-dichloropropene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      were exposed to six sub-cytotoxic concentrations of 1,3-DCP vapor at the
      air-liquid interface
    explanation: >-
      Describes the delivered vapour exposure to differentiated nasal
      epithelium at the air-liquid interface that this node represents, at
      concentrations below overt cytotoxicity.
  - reference: PMID:36183849
    reference_title: "NAM-based prediction of point-of-contact toxicity in the lung: A case example with 1,3-dichloropropene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Because the airway epithelium varies along its length, with various
      regions composed of different cell types, we have introduced a known
      toxic vapor to five human-derived, differentiated, in vitro airway
      epithelial cell culture models
    explanation: >-
      Supports the regional claim of this node directly, by delivering one
      reactive vapour to five models representing five airway levels — the
      reason deposition and not a single generic exposure is the trigger here.
  downstream:
  - target: Epithelial Thiol Depletion and Electrophilic Stress
    description: >-
      The deposited electrophile is conjugated by, and depletes, epithelial
      thiol defences.
- name: Epithelial Thiol Depletion and Electrophilic Stress
  description: >-
    Conjugation and oxidation deplete epithelial glutathione and protein
    thiols, leaving the cell in electrophilic and oxidative stress with a
    transcriptional stress response. This is the same insult that
    `keap1_nrf2_are_signaling` models from the sensor side: there, KEAP1
    cysteine modification initiates an adaptive antioxidant response. Here the
    node is the depletion itself, which is what the defence is responding to
    and what, when it outruns that defence, injures the epithelium downstream.
    It is measurable in human airway cultures at concentrations well below
    those causing cytotoxicity, so it precedes injury rather than accompanying
    it.

  - reference: PMID:37863466
    reference_title: "Increasing confidence in new approach methodologies for inhalation risk assessment with multiple end point assays using 5-day repeated exposure to 1,3-dichloropropene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Short-term exposure of humans to 1,3-DCP can result in mucous membrane
      irritation
    explanation: >-
      States the human clinical consequence of exposure to this agent class.
      Graded HUMAN_CLINICAL because the quoted sentence describes the human
      picture, and BACKGROUND because the citing study is an in vitro one
      restating it in its introduction rather than measuring it.
experimental_models:
- name: MucilAir human nasal air-liquid-interface epithelium, 1,3-dichloropropene vapor exposure
  description: >-
    A reconstituted, differentiated primary human nasal epithelium (MucilAir, Epithelix)
    cultured at the air-liquid interface and exposed to 1,3-dichloropropene (1,3-DCP)
    vapor, a volatile agricultural fumigant and reactive electrophile. In the source
    study the pseudostratified columnar epithelium was exposed to six sub-cytotoxic
    concentrations in a single acute exposure, and separately to three concentrations
    in a 5-day repeated exposure (4 hours per day), and read by histology,
    transcriptomics and a glutathione-depletion assay. It is a human primary-cell NAM
    for the upper-airway arm of this module, exercising the deposition to
    thiol-depletion to loss-of-mucociliary-differentiation chain in human tissue
    rather than in an animal. Recorded from the primary paper, Paudel et al. 2023
    (PMID:37863466), in the Toxicology special issue "New approach methodologies: from
    conceptual development to regulatory application"; the full text was not retrievable
    in the curation environment, so the links below are bounded to the abstract.
  experimental_model_type: PRIMARY_CELL_CULTURE
  namo_type: namo:TwoDCellCulture
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: nasal epithelium
    term:

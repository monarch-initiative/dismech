    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      disrupted zonula occludens-1 tight junctions, increased fluorescein
      isothiocyanate-dextran permeability but did not cause cell death or
      detachment
    explanation: >-
      Establishes the central claim of this node: a reactive inhaled aldehyde
      causes junctional disruption and permeability loss without killing the
      epithelium, so barrier failure is a mechanism in its own right.
  - reference: PMID:38013136
    reference_title: "Toxicological assessment of E-cigarette flavored E-liquids aerosols using Calu-3 cells: A 3D lung model approach."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      significantly decreased TEER and increased lactate dehydrogenase (LDH)
      release compared to the incubator and air-only controls
    explanation: >-
      Shows the same barrier failure in a human bronchial air-liquid-interface
      model after aerosol exposure, measured as transepithelial electrical
      resistance, alongside the cytotoxicity route to this node.
  - reference: PMID:36183849
    reference_title: "NAM-based prediction of point-of-contact toxicity in the lung: A case example with 1,3-dichloropropene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      using an assay for transepithelial conductance (for epithelial barrier
      integrity) and the lactate dehydrogenase (LDH) release assay (for
      cytotoxicity)
    explanation: >-
      Names barrier integrity and cytotoxicity as the two measured endpoints
      for a reactive vapour across five airway regions, which is this node
      read out as the assay that conforming models use.
  downstream:
  - target: Loss of Mucociliary Differentiation
    description: >-
      Injury to the barrier triggers a repair response in which the
      differentiated mucociliary phenotype is lost.
- name: Loss of Mucociliary Differentiation
  description: >-
    The injured epithelium loses its differentiated phenotype: ciliated cells
    are lost, apoptotic bodies appear, mucous cell populations change, and the
    pseudostratified columnar architecture is replaced by squamous epithelium.
    Squamous metaplasia is the characteristic repeated-exposure lesion of the
    conducting airway and is a reparative response, not a neoplastic one. This
    node is **not** ciliary dysfunction in the sense of
    `ciliopathy_dysfunction`: there the axoneme or basal body is genetically
    defective, whereas here the ciliated cell population is depleted and
    replaced. Do not conform a chemical exposure to that module.
  role: effector
  biological_scale: TISSUE

  - reference: PMID:25398987
    reference_title: Abnormal epithelial structure and chronic lung inflammation after repair of chlorine-induced airway injury.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The repaired epithelium contained an abnormal distribution of epithelial
      cells containing clusters of club or ciliated cells rather than the
      uniformly interspersed pattern of these cells in unexposed mice
    explanation: >-
      Shows with a chemically unrelated irritant that the epithelium repairs to
      a disordered mucociliary arrangement rather than to normal, which is this
      node reached by a second agent and in vivo.
  downstream:
  - target: Impaired Mucociliary Clearance and Persistent Airway Irritation
    description: >-
      An epithelium without cilia and with altered mucus cannot clear the
      airway, so deposited material and the irritant response persist.
- name: Impaired Mucociliary Clearance and Persistent Airway Irritation
  description: >-
    The outcome. With the ciliated population depleted and the mucus altered,
    mucociliary clearance falls, so deposited material dwells longer and the
    injury is self-sustaining under continued exposure. Clinically this is
    mucous membrane irritation of the upper and lower airway, and with
    repeated exposure the remodelled, metaplastic epithelium persists. Reduced
    clearance also raises susceptibility to inhaled pathogens and to
    co-deposited material.
  role: consequence
  biological_scale: ORGANISM

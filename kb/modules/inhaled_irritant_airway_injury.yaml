    quote_role: PRIMARY_RESULT
    snippet: >-
      change in cellular morphology from pseudostratified columnar epithelium
      to squamous epithelium, and depletion of GSH
    explanation: >-
      Measures dose-dependent glutathione depletion in human nasal epithelium
      after reactive vapour exposure, which is the thiol depletion this node
      asserts.
  - reference: PMID:31808915
    reference_title: "Metabolic Basis for Nonlinearity in 1,3-Dichloropropene Toxicokinetics and Use in Setting a Kinetically-derived Maximum Inhalation Exposure Concentration in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The glutathione (GSH)-dependent metabolism of 1,3-D results in
      significant depletion of GSH at repeated exposure levels of 30 ppm and
      above
    explanation: >-
      Confirms in a whole animal, and with a concentration threshold, the
      thiol depletion the in vitro airway models show, so this node does not
      rest on cell culture alone.
  downstream:
  - target: Airway Epithelial Junctional Barrier Failure
    description: >-
      Unbuffered electrophilic and oxidative stress damages tight junction
      proteins and, at higher exposure, kills epithelial cells.
- name: Airway Epithelial Junctional Barrier Failure
  description: >-
    The rate-limiting step and the key conformance target. Tight junctions are
    disrupted, paracellular permeability rises, and transepithelial electrical
    resistance falls — the readout the air-liquid-interface airway models use.
    Crucially this can occur with the epithelium intact: acrolein disrupts
    zonula occludens-1 and raises permeability without cell death or
    detachment, so junctional failure is not merely a consequence of
    cytotoxicity. Epithelial cell death is an additional route to the same
    node at higher exposure. Once the barrier is lost, the agent and
    co-deposited material reach the submucosa, and the epithelium enters the
    repair programme that the next node describes.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: bronchial epithelial cell

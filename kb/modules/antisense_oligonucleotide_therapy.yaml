name: Antisense Oligonucleotide Therapy Module
description: >-
  A conserved mechanism module representing the three principal RNA-targeting
  paradigms by which antisense oligonucleotides (ASOs) — single-stranded
  nucleic acids that target RNA — produce therapeutic effects. The first
  paradigm is RNase H-mediated mRNA degradation, used when the therapeutic
  goal is to reduce a pathogenic or overexpressed protein (dominant
  gain-of-function diseases and dyslipidemias). The second paradigm is
  splice-site occlusion, in which the ASO sterically blocks a splice regulatory
  element to redirect spliceosome activity — either forcing exon skipping to
  restore a disrupted reading frame (e.g., DMD exon-skipping ASOs), or
  unblocking exon inclusion to restore functional protein (e.g., nusinersen
  in SMA). The third paradigm is steric translation blockade, in which the
  ASO physically impedes ribosomal access without recruiting RNase H. Each
  paradigm operates on a distinct pre-RNA or mRNA target and leaves a distinct
  molecular footprint.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disorder-specific gene, transcript,
  protein, and variant while preserving the shared RNA-level causal chain.
category: Module
creation_date: "2026-06-12T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease, and conformance is
  node-level consistency rather than inheritance. The operational splice-branch
  boundary below is a curation guardrail, not a formal schema or Grouping
  criterion. Use
  "antisense_oligonucleotide_therapy#Pathogenic Pre-mRNA Missplicing" only for
  an evidence-backed disease-, variant-, or subgroup-specific abnormal splice
  event, and use "antisense_oligonucleotide_therapy#Exon-Skipping-Addressable
  Reading-Frame Lesion" for a genomic reading-frame lesion whose pre-mRNA is a
  substrate for therapeutic exon skipping without claiming abnormal basal
  splicing. In either branch, the disorder entry must duplicate the conserved
  vulnerability-to-ASO-effector-to-productive-output chain with disease-specific
  nodes and causal edges; the treatment must also target the exact RNA
  vulnerability through an evidence-bearing target_mechanisms link. Every
  vulnerability-to-effector edge is conditional on administration of the
  sequence-matched ASO and must say so explicitly. Prefer direct evidence that
  the ASO redirects the named splice event toward a productive transcript.
  When the cached evidence establishes only molecular eligibility and downstream
  protein production, mark the exact RNA-target link PARTIAL and state that
  limitation. If evidence establishes restored productive RNA and cellular
  function but does not measure protein expression, retain the disease-specific
  consequence without conforming it to the module protein-expression outcome and
  do not add an unsupported translation modifier merely to complete the chain. A
  modality tag, a downstream protein deficit, or clinical benefit alone is not
  sufficient. In scope here are exon-skipping-amenable DMD
  transcripts, whose genomic reading-frame lesion creates a targetable pre-mRNA
  processing vulnerability without implying globally abnormal basal splicing,
  and the patient-specific MFSD8 cryptic splice-acceptor event targeted by
  milasen. Exclude siRNA/RNAi,
  splice-modifying small molecules, and ASOs whose operative mechanism is
  lncRNA unsilencing, upstream-open-reading-frame blockade, or epigenetic
  de-repression. The RNase H and viral-translation branches are retained as
  descriptive module content, but new conformers to those branches are deferred
  until their trigger semantics and drug-specific evidence are separately
  reconciled; in particular, do not map fomivirsen while its RNase H versus
  steric-blockade classification remains contradictory in the cached evidence.
  Spinal muscular atrophy and nusinersen are also deliberately deferred: their
  compensatory SMN2 exon-inclusion vulnerability requires a separately curated
  anchor and must not be presumed to conform to the disease-causal missplicing
  anchor used here.
pathophysiology:
- name: Pathogenic mRNA Accumulation
  description: >-
    In dominant gain-of-function or toxic protein overexpression diseases, the
    causal mRNA is transcribed and translated at a level that produces harmful
    amounts of the encoded protein. The transcript itself is structurally normal
    but its abundance or the toxicity of its protein product is the pathogenic
    driver — making mRNA level reduction, rather than protein inhibition, the
    upstream therapeutic target. Examples include SOD1 mRNA in SOD1-ALS, TTR
    mRNA in hereditary transthyretin amyloidosis, APOB mRNA in homozygous
    familial hypercholesterolemia, APOC3 mRNA in familial chylomicronemia
    syndrome, KLKB1 (prekallikrein) mRNA in hereditary angioedema, and FUS
    mRNA in FUS-ALS. RNase H-dependent ASOs bind the target mRNA and recruit
    endogenous RNase H1 to cleave the heteroduplex, degrading the message and
    reducing the pathogenic protein.
  role: trigger
  biological_processes:
  - preferred_term: mRNA metabolic process
    term:
      id: GO:0016071
      label: mRNA metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38914784
    reference_title: >-
      Mechanisms of Action of the US Food and Drug Administration-Approved
      Antisense Oligonucleotide Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The first MOA is initiated by base-pairing between the ASO and its
      target mRNA, followed by RNase H-dependent mRNA degradation.
    explanation: >-
      Sang et al. 2024 identifies RNase H-dependent mRNA degradation as the
      first principal mechanism of FDA-approved ASOs, directly supporting the
      pathogenic mRNA accumulation node as the upstream therapeutic target for
      this paradigm.
  downstream:
  - target: RNase H-Mediated Transcript Degradation
    description: >-
      The ASO base-pairs with the target mRNA, forming a DNA:RNA heteroduplex
      that recruits endogenous RNase H1 to cleave the RNA strand.
    causal_link_type: DIRECT

- name: RNase H-Mediated Transcript Degradation
  description: >-
    The ASO:mRNA heteroduplex recruits endogenous RNase H1, which cleaves the
    RNA strand of the duplex. This catalytic cleavage degrades the target
    mRNA, freeing the ASO to engage additional mRNA molecules. The result is
    a sustained, dose-dependent reduction in steady-state mRNA and protein
    levels. The ASO backbone chemistry — typically 2'-O-methoxyethyl (2'-MOE)
    modifications with a central phosphorothioate gap region (gapmer design)
    — is optimized to support RNase H recruitment while resisting nuclease
    degradation. GalNAc conjugation (as in eplontersen and olezarsen) enables
    hepatocyte-targeted delivery for liver-expressed transcripts.
  role: effector
  biological_processes:
  - preferred_term: RNA catabolic process
    term:
      id: GO:0006401
      label: RNA catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38914784
    reference_title: >-
      Mechanisms of Action of the US Food and Drug Administration-Approved
      Antisense Oligonucleotide Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RNase H-dependent ASOs include inotersen and eplontersen (for
      hereditary transthyretin amyloidosis), fomiversen (for opportunistic
      cytomegalovirus infection), mipomersen (for familial
      hypercholesterolemia), and tofersen [for amyotrophic lateral sclerosis
      (ALS)].
    explanation: >-
      Sang et al. 2024 lists the FDA-approved RNase H-dependent ASO drugs,
      directly supporting this node as the RNase H cleavage effector step of
      the knockdown paradigm.
  downstream:
  - target: Reduction of Pathogenic Protein
    description: >-
      Degradation of the target mRNA reduces ribosomal translation and lowers
      steady-state levels of the pathogenic or overexpressed protein.
    causal_link_type: DIRECT

- name: Reduction of Pathogenic Protein
  description: >-
    RNase H-mediated mRNA cleavage reduces ribosomal substrate availability,
    producing a sustained, dose-dependent reduction in the pathogenic protein.
    The magnitude of protein reduction is the primary pharmacodynamic
    readout: tofersen reduces CSF SOD1; inotersen and eplontersen reduce
    serum TTR; mipomersen reduces LDL-C via APOB reduction; volanesorsen and
    olezarsen reduce APOC3 and serum triglycerides; donidalorsen reduces
    prekallikrein. Protein reduction translates to disease modification when
    the targeted protein is the proximate pathogenic driver.
  role: consequence
  biological_processes:
  - preferred_term: negative regulation of translation
    term:
      id: GO:0017148
      label: negative regulation of translation
    modifier: INCREASED

- name: Pathogenic Pre-mRNA Missplicing
  description: >-
    A disease-, variant-, or subgroup-specific pre-mRNA is processed through an
    abnormal splice event, such as activation of a cryptic splice acceptor or
    pathogenic exclusion of an exon. The missplicing is part of the untreated
    disease mechanism and creates a sequence-specific therapeutic vulnerability
    when a steric ASO can occlude the responsible regulatory element. This
    anchor is not for genomic reading-frame lesions whose basal splice-site use
    is normal.
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: RNA splicing
    modifier: ABNORMAL
    term:
      id: GO:0008380
      label: RNA splicing
  evidence:
  - reference: PMID:31597037
    reference_title: >-
      Patient-Customized Oligonucleotide Therapy for a Rare Genetic Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA sequencing (RNA-seq) and reverse-transcriptase–PCR analyses revealed
      missplicing of exon 6 into a cryptic splice-acceptor site (i6.SA) in MFSD8
      intron 6
    explanation: >-
      The patient and family RNA data provide a direct human example of the
      pathogenic cryptic-splicing state represented by this anchor.
  downstream:
  - target: ASO-Directed Splice Redirection
    description: >-
      When a sequence-matched splice-switching ASO is administered, occupancy of
      the pathogenic splice element redirects exon choice toward a productive
      transcript. This is an intervention-conditioned edge, not an untreated
      consequence of the missplicing defect.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31597037
      reference_title: >-
        Patient-Customized Oligonucleotide Therapy for a Rare Genetic Disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        RNA-seq from patient fibroblasts showed that milasen treatment more than
        tripled the amount of normal (exon 6–exon 7) splicing (Fig. 2C).
      explanation: >-
        Patient fibroblasts directly demonstrate the treatment-conditioned
        transition from cryptic missplicing to ASO-directed splice redirection.

- name: Exon-Skipping-Addressable Reading-Frame Lesion
  description: >-
    A genomic exon deletion or related lesion shifts the coding frame, yielding
    an out-of-frame mature transcript and prematurely truncated dysfunctional
    protein. Basal splice-site use need not be abnormal. The therapeutic
    vulnerability is the pre-mRNA state in which controlled skipping of one
    additional, genotype-specific exon can restore an in-frame transcript. This
    anchor applies only to molecularly amenable genotypes, not to the disorder
    generally.
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
  evidence:
  - reference: PMID:16770791
    reference_title: >-
      Entries in the Leiden Duchenne muscular dystrophy mutation database: an
      overview of mutation types and paradoxical cases that confirm the
      reading-frame rule.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Duchenne patients, mutations induce a shift in the reading frame
      leading to prematurely truncated, dysfunctional dystrophins.
    explanation: >-
      The human mutation series establishes the reading-frame lesion while
      making no claim that the patient's basal RNA splicing is abnormal.
  downstream:
  - target: ASO-Directed Splice Redirection
    description: >-
      When a matching exon-skipping ASO is administered to an amenable genotype,
      steric occlusion of the selected exon redirects pre-mRNA processing toward
      an in-frame transcript. This is an intervention-conditioned edge, not a
      consequence of the untreated genomic lesion alone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29752304
      reference_title: >-
        Eteplirsen treatment for Duchenne muscular dystrophy: Exon skipping and
        dystrophin production.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reverse transcription PCR analysis and sequencing of the newly formed
        splice junction confirmed that 100% of treated patients displayed the
        expected skipped exon 51 sequence.
      explanation: >-
        Treatment-induced splice-junction sequencing directly supports the
        conditioned transition from an amenable lesion to splice redirection.

- name: ASO-Directed Splice Redirection
  description: >-
    After administration to a patient with the matching RNA vulnerability, a
    steric-blocking ASO (uniformly modified; no RNase H recruitment) binds a
    splice regulatory element on the pre-mRNA — a splice acceptor, splice donor,
    exonic splicing silencer, or intronic silencing sequence — and physically
    prevents spliceosome recognition. The spliceosome bypasses the blocked
    element, either skipping a mutation-bearing exon (exon-skipping paradigm) or
    including a normally silenced exon (exon-inclusion paradigm).
    Phosphorodiamidate morpholino oligomer (PMO) chemistry, used in the DMD
    exon-skipping ASOs, is uncharged and cell-penetrant without lipid
    formulation, while 2'-MOE chemistry (used in nusinersen) supports
    intrathecal delivery to motor neurons.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
  evidence:
  - reference: PMID:38914784
    reference_title: >-
      Mechanisms of Action of the US Food and Drug Administration-Approved
      Antisense Oligonucleotide Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Splice modulating ASOs include nursinersen (for spinal muscular
      atrophy) and eteplirsen, golodirsen, viltolarsen, and casimersen (all
      for the treatment of Duchenne muscular dystrophy).
    explanation: >-
      Sang et al. 2024 lists the FDA-approved splice-modulating ASO drugs,
      directly supporting this node as the splice-redirection effector step
      (the abstract misspells nusinersen as "nursinersen").
  downstream:
  - target: Restored Productive Transcript and Protein Expression
    description: >-
      Treatment-induced splice redirection yields an in-frame mRNA that can be
      translated into a truncated but partially functional protein, or restores
      full-length protein when an inclusion event is achieved.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32139505
      reference_title: >-
        Increased dystrophin production with golodirsen in patients with
        Duchenne muscular dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A significant increase in exon 53 skipping was associated with
        ∼16-fold increase over baseline in dystrophin protein expression at
        week 48, with a mean percent normal dystrophin protein standard of
        1.019% (range, 0.09%-4.30%).
      explanation: >-
        The paired molecular measurements directly associate ASO-directed exon
        skipping with restoration of dystrophin protein expression.
    - reference: PMID:31597037
      reference_title: >-
        Patient-Customized Oligonucleotide Therapy for a Rare Genetic Disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        RNA-seq from patient fibroblasts showed that milasen treatment more than
        tripled the amount of normal (exon 6–exon 7) splicing (Fig. 2C).
      explanation: >-
        Patient-derived cells show that occluding a cryptic splice acceptor can
        restore the productive transcript rather than merely alter a downstream
        phenotype.
    - reference: PMID:31597037
      reference_title: >-
        Patient-Customized Oligonucleotide Therapy for a Rare Genetic Disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All these phenotypes were alleviated by milasen administration,
        indicating that treatment could rescue not only splicing but also
        function.
      explanation: >-
        Rescue of patient-fibroblast lysosomal phenotypes supports the
        intervention-conditioned transition from corrected splicing to
        functional molecular output.

- name: Restored Productive Transcript and Protein Expression
  description: >-
    Under treatment with the matching splice-switching ASO, redirection increases
    a productive transcript and functional output from its encoded protein. In
    DMD exon skipping, the resulting dystrophin is shorter than wild type but in
    frame and partially functional. Correction of a cryptic splice acceptor, as
    in the single milasen-treated NCL7 patient, instead restores the normal exon
    junction, avoids premature translational termination, and can rescue cellular
    function even when protein abundance is not directly quantified.
    Exon-inclusion strategies can restore a full-length protein. This node
    describes the shared productive-transcript outcome without claiming that
    every strategy restores a literal genomic reading frame or a full-length
    protein.
  role: consequence
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: INCREASED
  evidence:
  - reference: PMID:32139505
    reference_title: >-
      Increased dystrophin production with golodirsen in patients with Duchenne
      muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant increase in exon 53 skipping was associated with ∼16-fold
      increase over baseline in dystrophin protein expression at week 48, with
      a mean percent normal dystrophin protein standard of 1.019% (range,
      0.09%-4.30%).
    explanation: >-
      Golodirsen provides observed molecular evidence that splice redirection
      increases productive dystrophin expression.

- name: Pathogenic Viral mRNA Translation
  description: >-
    In viral infections where the pathogenic protein is virus-encoded rather
    than host-encoded, an ASO can sterically block translation of the viral
    mRNA without recruiting RNase H. This generic paradigm differs from
    host-gene RNase H knockdown because the target is an exogenous transcript
    and the therapeutic window relies on viral-sequence specificity. Fomivirsen
    is not treated as an example or conformer here: the review cited below
    discusses steric blockade as a general ASO mechanism but classifies
    fomivirsen itself as RNase H dependent, so its drug-specific placement must
    be resolved with direct evidence before curation.
  role: trigger
  biological_processes:
  - preferred_term: viral gene expression
    term:
      id: GO:0019080
      label: viral gene expression
    modifier: INCREASED
  evidence:
  - reference: PMID:38914784
    reference_title: >-
      Mechanisms of Action of the US Food and Drug Administration-Approved
      Antisense Oligonucleotide Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The third MOA involves ASOs that sterically hinder mRNA function,
      often inhibiting translation.
    explanation: >-
      Sang et al. 2024 identifies steric interference with mRNA function as a
      general ASO mechanism. The same source places "fomiversen" (a misspelling
      of fomivirsen) in its RNase H-dependent list, so this quote does not
      establish a fomivirsen-specific steric mechanism and no CMV conformance
      should be asserted from it.
  downstream:
  - target: Steric Viral mRNA Translation Blockade
    description: >-
      The ASO base-pairs with the viral mRNA target site, physically impeding
      ribosome scanning or 48S complex assembly without cleaving the transcript.
    causal_link_type: DIRECT

- name: Steric Viral mRNA Translation Blockade
  description: >-
    The ASO:viral mRNA duplex physically impedes ribosomal access to the
    translation initiation region or coding sequence without recruiting RNase H.
    Because the RNA strand is not cleaved, this mechanism requires sustained
    ASO occupancy at the target site. The steric blockade reduces viral
    immediate-early gene product levels, disrupting the transcriptional
    amplification cascade essential for productive viral replication. This
    paradigm is now largely superseded by RNase H knockdown and small-molecule
    antivirals for most viral targets, but established the proof of concept
    for ASO therapeutics.
  role: effector
  biological_processes:
  - preferred_term: negative regulation of translation
    term:
      id: GO:0017148
      label: negative regulation of translation
    modifier: INCREASED

name: Telomere Attrition Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed telomere attrition: the progressive shortening of the protective
  telomere end-complexes of chromosomes with successive cell divisions and age.
  Because conventional DNA polymerases cannot fully replicate chromosome ends,
  telomeres shorten with each division unless maintained by telomerase; in most
  somatic tissues telomerase is limiting, so telomeres erode over the lifespan.
  Critically short or uncapped telomeres can no longer fulfil their protective
  function and are sensed as DNA double-strand breaks, triggering a persistent
  DNA-damage response that drives replicative senescence and blocks further
  division. The resulting failure to replenish tissues underlies telomere
  syndromes and contributes to age-related disease and mortality. Individual
  disorder entries declare conformance via conforms_to on their pathophysiology
  nodes, substituting the disease-specific lesion (e.g. telomerase-complex or
  shelterin mutations in the short-telomere/telomere-syndrome disorders) while
  preserving the conserved attrition -> DNA-damage/senescence -> tissue-failure
  chain.
category: Module
module_categories:
- AGING
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "telomere_attrition#Telomere-Initiated DNA Damage and Replicative
  Senescence"). Conforming nodes in disorder files should include the
  corresponding biological processes and causal edges, specialized to their
  disease context. This module is the aging-facing complement of the
  cancer-facing enabling_replicative_immortality module: this one models
  telomere ATTRITION driving senescence in normal/aging cells, whereas
  enabling_replicative_immortality models telomere-maintenance REACTIVATION that
  lets tumor cells escape that barrier. It also feeds cellular_senescence
  (telomere attrition is one of the senescence-inducing stresses). Key
  conformance target:
  "telomere_attrition#Telomere-Initiated DNA Damage and Replicative Senescence".
pathophysiology:
- name: Progressive Telomere Attrition
  description: >-
    Because conventional DNA replication cannot fully copy the ends of linear
    chromosomes (the end-replication problem) and somatic telomerase is
    limiting, telomeres lose repeat sequence with each cell division and shorten
    progressively with age. This cumulative loss of telomeric DNA is the
    initiating lesion of the hallmark; age-related and premature-aging syndromes
    are characterized by short telomeres.
  role: trigger
  biological_processes:
  - preferred_term: Telomere Maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:2342578
    reference_title: "Telomeres shorten during ageing of human fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It has been proposed that the finite doubling capacity of normal mammalian
      cells is due to a loss of telomeric DNA and eventual deletion of essential
      sequences.
    explanation: >-
      Establishes progressive loss of telomeric DNA with division as the basis of
      the finite replicative capacity of cells, the initiating attrition modeled
      here. Evidence source is IN_VITRO (human fibroblast study).
  - reference: PMID:16136653
    reference_title: "Telomeres and human disease: ageing, cancer and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Age-related diseases and premature ageing syndromes are characterized by
      short telomeres, which can compromise cell viability, whereas tumour cells
      can prevent telomere loss by aberrantly upregulating telomerase.
    explanation: >-
      States that age-related and premature-aging syndromes are characterized by
      short telomeres, supporting telomere attrition as the aging lesion (and
      contrasting the cancer telomerase-reactivation arm). Evidence source is
      OTHER because this is a review.
  downstream:
  - target: Telomere-Initiated DNA Damage and Replicative Senescence
- name: Telomere-Initiated DNA Damage and Replicative Senescence
  description: >-
    When telomeres become critically short or uncapped they can no longer
    protect chromosome ends, which are then sensed as DNA double-strand breaks.
    The resulting persistent DNA-damage-response signaling enforces replicative
    senescence - an essentially permanent proliferative arrest. This is the
    conserved central effector that disease-specific telomere lesions converge
    upon, and the point at which telomere attrition feeds the cellular
    senescence module.
  role: central_effector
  biological_processes:
  - preferred_term: DNA Damage Response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  - preferred_term: Replicative Senescence
    term:
      id: GO:0090399
      label: replicative senescence
    modifier: INCREASED
  evidence:
  - reference: PMID:14608368
    reference_title: "A DNA damage checkpoint response in telomere-initiated senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This exhaustion of proliferative potential, called senescence, can be
      triggered when telomeres--the ends of linear chromosomes-cannot fulfil
      their normal protective functions.
    explanation: >-
      Establishes that loss of telomere protective function triggers replicative
      senescence, the central effector modeled here. Evidence source is IN_VITRO
      (human fibroblast senescence study).
  - reference: PMID:14608368
    reference_title: "A DNA damage checkpoint response in telomere-initiated senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that senescent human fibroblasts display molecular markers
      characteristic of cells bearing DNA double-strand breaks.
    explanation: >-
      Shows that telomere-initiated senescent cells carry DNA double-strand-break
      damage markers, supporting the DNA-damage-response arm of this node.
      Evidence source is IN_VITRO (human fibroblast study).
  downstream:
  - target: Tissue Replenishment Failure and Age-Related Disease
- name: Tissue Replenishment Failure and Age-Related Disease
  description: >-
    Telomere attrition, by blocking cell division and imposing senescence,
    interferes with the replenishment of proliferative tissues. The resulting
    regenerative failure contributes causally to telomere syndromes and to
    broader age-related disease and mortality; the specific organ phenotype is
    supplied by the conforming disorder.
  role: consequence
  evidence:
  - reference: PMID:26785477
    reference_title: "Human telomere biology: A contributory and interactive factor in aging, disease risks, and protection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Telomere attrition can lead to potentially maladaptive cellular changes,
      block cell division, and interfere with tissue replenishment.
    explanation: >-
      States that telomere attrition blocks cell division and impairs tissue
      replenishment, the consequence modeled here. Evidence source is OTHER
      because this is a review.
animal_models:
- name: Turquoise killifish telomere-length strain pair (Nothobranchius furzeri GRZ vs MZM-0403)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Laboratory strain GRZ (approximately 3.5-month lifespan) compared against the
    wild-derived MZM-0403 strain (approximately 6-month lifespan), assayed in
    muscle and skin.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:19428446
  description: >-
    Hartmann and colleagues measured telomere length, telomerase gene sequence,
    and telomerase activity across the two killifish strains that differ in
    lifespan. Age-dependent telomere shortening was present in the longer-lived
    strain and absent in the shorter-lived one, and Tert expression rose rather
    than fell in aged tissue. The model therefore reproduces telomere attrition
    itself in one strain while explicitly dissociating it from lifespan
    determination, which is the module's downstream claim.
  modeled_mechanisms:
  - target: Progressive Telomere Attrition
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Telomeres shorten measurably with age in muscle and skin of the MZM-0403
      strain, reproducing the attrition node in a vertebrate whose entire lifespan
      fits in months. The short-lived GRZ strain does not show the same shortening,
      so the node is strain-conditional in this model.
    limitations: >-
      Attrition was detected in only one of the two strains studied, and the
      attrition that does occur proceeds despite rising Tert expression and high
      telomerase activity, unlike human somatic tissues where telomerase is
      largely silenced. Only muscle and skin were assayed. Rates of shortening in
      a teleost with active somatic telomerase should not be transferred to human
      replicative tissue without corroboration.
    readouts:
    - name: Telomere length in muscle and skin
      target: Progressive Telomere Attrition
      description: >-
        Telomere length in young versus old fish of both strains, measured by
        several independent methods.
      direction: DECREASED
      interpretation: >-
        Shortening in MZM-0403 is the direct structural correlate of the attrition
        node; its absence in GRZ is why the link is graded partial.
      evidence:
      - reference: PMID:19428446
        reference_title: Telomeres shorten while Tert expression increases during ageing of the short-lived fish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found age-dependent telomere shortening in the MZM-0403 strain with the longer lifespan, whereas the short-lived GRZ strain showed no significant telomere shortening with advanced age."
        explanation: Reports the telomere-length measurement and its strain dependence.
    - name: Tert expression in aged muscle and skin
      target: Progressive Telomere Attrition
      description: >-
        Transcript levels of the telomerase reverse transcriptase gene Tert in aged
        versus young MZM-0403 tissue, with matched telomerase activity assays.
      direction: INCREASED
      interpretation: >-
        Telomeres shorten even as Tert rises, so attrition here is not simply a
        readout of failing telomerase, unlike the canonical human account.
      evidence:
      - reference: PMID:19428446
        reference_title: Telomeres shorten while Tert expression increases during ageing of the short-lived fish Nothobranchius furzeri.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the expression level of Tert is increased in aged muscle and skin tissue of MZM-0403 suggesting that telomeres shorten upon ageing despite increased Tert expression and hence high telomerase activity"
        explanation: Establishes that attrition proceeds against an increased telomerase signal in this model.
    evidence:
    - reference: PMID:19428446
      reference_title: Telomeres shorten while Tert expression increases during ageing of the short-lived fish Nothobranchius furzeri.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found age-dependent telomere shortening in the MZM-0403 strain with the longer lifespan, whereas the short-lived GRZ strain showed no significant telomere shortening with advanced age."
      explanation: >-
        Supports treating this model as informative for the attrition node, in the
        strain in which attrition occurs.
  - target: Tissue Replenishment Failure and Age-Related Disease
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The module places telomere attrition upstream of replicative exhaustion and
      shortened healthspan. In this model the causal arrow does not hold: the
      strain with the shortest lifespan is the one without telomere shortening,
      and the authors conclude its lifespan is not explained by telomere or
      telomerase status.
    limitations: >-
      This is a negative result about one species and two strains, not a general
      refutation of the module's downstream edge. Killifish retain somatic
      telomerase activity, so the ordinary human route from attrition to
      replicative senescence is not available for testing here, and the model's
      extremely compressed lifespan may simply end before attrition becomes
      limiting. It does establish that in this widely used aging model, lifespan
      differences must be attributed to something other than telomere dynamics.
    readouts:
    - name: Lifespan difference between strains versus telomere and telomerase status
      target: Tissue Replenishment Failure and Age-Related Disease
      description: >-
        Maximum lifespan of the GRZ and MZM-0403 strains set against their
        telomere lengths, shortening rates, and telomerase activity.
      direction: UNCHANGED
      interpretation: >-
        The shorter-lived strain shows neither accelerated shortening nor reduced
        telomerase, so telomere status does not track lifespan in this model.
      evidence:
      - reference: PMID:19428446
        reference_title: Telomeres shorten while Tert expression increases during ageing of the short-lived fish Nothobranchius furzeri.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "We further conclude that the extremely short lifespan of the GRZ strain is not caused by diminished telomerase activity or accelerated telomere shortening."
        explanation: The authors' explicit negative conclusion on the attrition-to-lifespan link in this model.
    evidence:
    - reference: PMID:19428446
      reference_title: Telomeres shorten while Tert expression increases during ageing of the short-lived fish Nothobranchius furzeri.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "We further conclude that the extremely short lifespan of the GRZ strain is not caused by diminished telomerase activity or accelerated telomere shortening."
      explanation: >-
        Substantiates the negative claim that this model does not reproduce the
        module's attrition-to-healthspan edge.
  notes: >-
    Curated as part of a tranche adding turquoise killifish models across the
    hallmarks-of-aging modules. The pairing matters: the same study that
    establishes killifish telomere attrition also rules it out as the cause of the
    strain lifespan difference, so citing this model for the module's upstream node
    does not license citing it for the downstream one.
biochemical:
- name: Leukocyte telomere length
  presence: DECREASED
  biomarker_term:
    preferred_term: leukocyte telomere length
    term:
      id: NCIT:C129765
      label: Telomere Length
  notes: >-
    The oldest aging biomarker and the one with the most equivocal standing. It is
    on the 2025 Delphi consensus list, but with the lowest agreement of any
    recommended marker on precision and reliability, because measurement technique
    and age at measurement drive much of the between-study heterogeneity and
    because interindividual variation is large relative to the age effect. The
    meta-analytic effect is real and small: roughly 9% higher all-cause mortality
    per standard-deviation decrement, attenuating above age 80. Treat it as a
    population-level marker, not an individual-level one, and note that a single
    measurement is much weaker than a trajectory.
  evidence:
  - reference: PMID:30254001
    reference_title: "Telomere Length and All-Cause Mortality: A Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In summary, short telomeres are associated with increased all-cause mortality
      risk in the general population.
    explanation: >-
      Meta-analysis over 121,749 individuals establishing the association between
      short telomeres and mortality.
  - reference: PMID:30254001
    reference_title: "Telomere Length and All-Cause Mortality: A Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, TL measurement techniques and age at measurement contribute to the
      heterogeneity of effect estimation.
    explanation: >-
      The same meta-analysis records the measurement-dependence that limits this
      marker, which is why it is curated with an explicit reliability caveat rather
      than as a clean readout.
  readouts:
  - target: Progressive Telomere Attrition
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: >-
      Leukocyte telomere length directly measures the attrition this node models,
      in the accessible blood compartment. Direction is negative: shorter marks the
      more advanced state.
    evidence:
    - reference: PMID:30254001
      reference_title: "Telomere Length and All-Cause Mortality: A Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the STR studies, one standard deviation (SD) decrement of leukocyte TL
        corresponded to 13% increased all-cause mortality risk (95% confidence
        interval [CI]: 7%-19%); individuals in the shortest TL quarter had 44%
        higher hazard (95% CI: 27%-63%) than those in the longest quarter.
      explanation: >-
        Quantifies the graded relationship between leukocyte telomere length and
        outcome in the Swedish Twin Registry cohorts.
  - target: Tissue Replenishment Failure and Age-Related Disease
    relationship: PREDICTS
    direction: NEGATIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Shorter leukocyte telomeres predict all-cause mortality, with a pooled hazard
      ratio of 1.09 per SD decrement. The effect is smaller above age 80, so the
      prognostic claim is age-dependent.
    evidence:
    - reference: PMID:30254001
      reference_title: "Telomere Length and All-Cause Mortality: A Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analyses stratified by age indicated that the hazard ratio was smaller in
        individuals over 80 years old.
      explanation: >-
        Records the age-dependence of the prognostic association, which bounds the
        population in which this readout is informative.
discussions:
- discussion_id: knowledge_gap_telomere_length_measurement_reliability
  prompt: >-
    Is leukocyte telomere length reliable enough at the individual level to serve
    as anything more than a population-scale marker?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Leukocyte telomere length
  - pathophysiology#Progressive Telomere Attrition
  rationale: >-
    This gap is about measurement rather than biology, which makes it unusual among
    the aging-biomarker gaps and is why it is recorded separately. The association
    between short telomeres and mortality is established across 121,749 individuals.
    What is not established is whether a single measurement in one person means
    anything actionable. Three things work against it: assay technique contributes
    materially to between-study heterogeneity, interindividual variation is large
    relative to the age effect, and the mortality association attenuates in the
    oldest old, who are the population most trials would enrol. The 2025 Delphi
    consensus recommends the marker while giving it the lowest agreement of any on
    its list for precision and reliability, and notes that repeated measurement over
    a participant's lifetime may be required for meaningful inference. Resolving
    this is an assay-standardization problem before it is a biology problem.
  evidence:
  - reference: PMID:30254001
    reference_title: "Telomere Length and All-Cause Mortality: A Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, TL measurement techniques and age at measurement contribute to the
      heterogeneity of effect estimation.
    explanation: >-
      Identifies assay technique and age at measurement as sources of heterogeneity,
      which is the substance of this gap.
  notes: >-
    Contrast with the composite-biomarker gap recorded in the inflammaging module.
    That one says no single analyte suffices; this one says a specific analyte's
    measurement is not yet reliable enough to contribute cleanly to a composite.
computational_models:
- name: Proctor-Kirkwood Telomere Shortening and Oxidative Stress Model
  description: >-
    Mathematical model separating the contributions of the end-replication problem,
    oxidative stress, and a C-strand-specific exonuclease to the rate of telomeric
    DNA loss, and to the triggering of replicative senescence. Parameter variation
    is used to test which combinations of these mechanisms are compatible with the
    observed quantitative and qualitative features of telomere loss.
  model_type: KINETIC
  publication: PMID:11744046
  modeled_mechanisms:
  - target: Progressive Telomere Attrition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Decomposes the per-division attrition rate into its replicative and oxidative
      components, so that the oxidative contribution can be varied independently.
  notes: >-
    The oxidative-stress term is the quantitative bridge from
    mitochondrial_dysfunction into this module - ROS accelerate attrition without
    any change in division rate.
- name: Proctor2006 Telomere Uncapping Checkpoint Model
  description: >-
    Stochastic model of how uncapped telomeres initiate the checkpoint pathway
    leading to cell-cycle arrest, built on the budding-yeast cdc13-1 system in which
    telomeres are left unprotected over a permissive temperature range. Encoded in
    SBML and simulated stochastically; captures generation of long single-stranded
    DNA regions and the dependence of the response on checkpoint proteins and
    nucleases.
  model_type: KINETIC
  repository_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000087
  model_id: BIOMD0000000087
  model_format: SBML
  publication: PMID:17015293
  modeled_mechanisms:
  - target: Telomere-Initiated DNA Damage and Replicative Senescence
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Models the step from an uncapped telomere to checkpoint activation and
      cell-cycle arrest, including the single-stranded DNA intermediate.
    limitations: >-
      Budding yeast carrying a temperature-sensitive cdc13-1 allele, so uncapping is
      acute and conditional rather than the gradual attrition-driven uncapping this
      node describes, and the arrest is reversible rather than a permanent
      mammalian senescence program.
  notes: >-
    The "Proctor2006" label follows the BioModels record name; the paper
    (PMID:17015293) appeared in J Cell Sci in 2007 after a 2006 epub.
- name: Rastgou Talemi2015 DNA Damage Model with Persistent Telomere-Associated Foci
  description: >-
    Extension of the two-lesion kinetic (TLK) model of double-strand-break repair
    that adds persistent telomere-associated DNA damage foci (TAF) as a distinct
    damage category. Competing model versions were subjected to formal model
    discrimination against extensive data; the selected parsimonious model
    recapitulates and predicts both transient and persistent DNA damage, supporting
    nonlinear dose-damage relationships and negligible repair saturation.
  model_type: KINETIC
  repository_url: https://www.ebi.ac.uk/biomodels/MODEL1412200000
  model_id: MODEL1412200000
  model_format: SBML
  publication: PMID:26359627
  modeled_mechanisms:
  - target: Telomere-Initiated DNA Damage and Replicative Senescence
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Gives persistent telomere-associated damage its own kinetic compartment,
      distinguishing irreparable telomeric foci from repairable double-strand
      breaks.
    limitations: >-
      Calibrated on ionizing-radiation dose-response data for secondary cancer risk
      assessment, not on physiological replicative attrition; the persistence of TAF
      transfers, but the damage input does not.
- name: Mathematical Modelling of Telomere Length Dynamics
  description: >-
    Mathematical treatment of telomere length dynamics across a dividing cell
    population, addressing how the distribution of telomere lengths - not only the
    mean - evolves with successive divisions and governs the onset of replicative
    senescence.
  model_type: KINETIC
  publication: PMID:31728621
  modeled_mechanisms:
  - target: Progressive Telomere Attrition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Treats attrition as a distribution over chromosome ends rather than a single
      average length, which is what determines when the shortest telomere triggers
      arrest.

name: Sleep-Disordered Breathing and Intermittent Hypoxia Module
description: >-
  A conserved mechanism module for the sleep-related breathing disorders and the
  systemic injury they cause. Sleep withdraws the wakefulness drive to breathe,
  and two mechanistically separate lesions exploit that withdrawal: an anatomic
  arm, in which loss of compensatory tonic drive to the pharyngeal dilator
  muscles allows a collapsible upper airway to occlude, and a control arm, in
  which the chemoreflex feedback loop is either unstable (high loop gain,
  producing overshoot-undershoot oscillation and central apnoea) or
  hyporesponsive (failed chemoreception, producing sustained hypoventilation).
  Both anatomic and control lesions converge on the same amplifier - recurrent
  apnoea-hypopnoea terminated by arousal - and thence on chronic intermittent
  hypoxia with reoxygenation, the rate-limiting node from which the systemic
  disease follows: carotid-body sensitisation and sympathetic overactivation,
  superoxide generation and vascular inflammation, and the cardiovascular,
  metabolic, and neurocognitive sequelae that make sleep-disordered breathing a
  systemic rather than a respiratory disease.
category: Module
creation_date: "2026-08-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "sleep_disordered_breathing_intermittent_hypoxia#Chronic Intermittent Hypoxia
  and Reoxygenation", the key conformance target and rate-limiting step).

  ARM SELECTION. Enter at #Sleep-Related Loss of Upper Airway Dilator
  Compensation in a Collapsible Pharynx for obstructive disease, and at
  #Ventilatory Control Instability or Chemoreflex Failure for central disease.
  The arms are not alternatives to be picked by convenience: an obstructive
  entry has flow limitation against continued respiratory effort, a central
  entry has absent effort. They frequently coexist in one patient - a high loop
  gain is present in about a third of patients with anatomically obstructive
  apnoea and is what turns a marginal airway into a cycling one - so a disorder
  entry may honestly conform to both, but should say which lesion it is
  evidencing at each node.

  THE INTERMITTENT-VERSUS-SUSTAINED BOUNDARY, which conformers must not blur.
  The central node is specifically CYCLICAL desaturation followed by
  reoxygenation; the reoxygenation half is not incidental, it is the source of
  the superoxide burst that drives the downstream vascular arm, which is why
  intermittent hypoxia and sustained hypoxia of the same average severity have
  different consequences. A disorder whose gas-exchange lesion is sustained
  nocturnal hypoventilation with hypercapnia rather than cyclical desaturation -
  congenital central hypoventilation syndrome is the clearest case, and
  neuromuscular and obesity hypoventilation are others - conforms at
  #Ventilatory Control Instability or Chemoreflex Failure and may conform at the
  systemic sequelae, but must NOT conform at #Chronic Intermittent Hypoxia and
  Reoxygenation. Recording that distinction is the point of the module for those
  entries.

  HETEROGENEITY IS CURATED, NOT SMOOTHED. Obstructive sleep apnoea is not one
  mechanism with one severity axis. Endotyping shows four largely independent
  traits - pharyngeal collapsibility, genioglossus responsiveness, arousal
  threshold, and loop gain - and non-anatomic traits contribute importantly in
  the majority of patients. A conforming disorder entry that curates only airway
  anatomy has curated one of four, and the apnoea-hypopnoea index it is
  typically graded by is a count of events rather than a measure of any of them.

  DEVICE-TARGET PATTERN. Continuous positive airway pressure INHIBITS
  #Recurrent Apnoea-Hypopnoea with Arousal from Sleep by pneumatically splinting
  the airway. It is the module's mechanistic proof that the apnoeic events, not
  a shared antecedent such as obesity, cause the downstream chain - but note the
  honest caveat curators must preserve: greater physiological efficacy does not
  translate into proportionally greater clinical effectiveness, because adherence
  is the binding constraint, and a less efficacious device used for more of the
  night can deliver equivalent health outcomes.

  SCOPE BOUNDARIES. Distinct from orexin_arousal_instability (sleepiness from
  an unstable state switch with normal breathing) and
  circadian_phase_misalignment (sleep correctly structured but mistimed). The
  downstream vascular arm feeds atherogenesis and the systemic hypertension
  pathway rather than re-deriving them.

  Not an Xogenesis module - a physiological control loop fails, nothing
  pathological is formed.
pathophysiology:
- name: Sleep-Related Loss of Upper Airway Dilator Compensation in a Collapsible Pharynx
  description: >-
    First of two entry arms, and the obstructive one. The pharynx has no rigid
    skeleton and is held open during wakefulness by tonic activity in the
    genioglossus and other dilator muscles, which is itself a compensation for
    an anatomically narrow or collapsible airway. Sleep withdraws that
    wakefulness-dependent drive. Where the underlying airway is sufficiently
    collapsible - a positive or near-positive pharyngeal critical closing
    pressure - the loss of compensation is enough to close it. Anatomy alone
    does not determine severity: whether an individual event becomes a
    self-limited perturbation or the start of a cycling pattern depends on the
    other endotypic traits, particularly how responsive the genioglossus remains
    during sleep and how easily the patient arouses. Conforming disorder nodes
    substitute the disorder-specific source of collapsibility (obesity and
    parapharyngeal fat, craniofacial retrognathia, adenotonsillar hypertrophy,
    macroglossia, or a syndromic midface).
  role: trigger
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: pharyngeal dilator muscle tone during sleep
    term:
      id: GO:0006937
      label: regulation of muscle contraction
    modifier: DECREASED
  locations:
  - preferred_term: pharynx
    term:
      id: UBERON:0001042
      label: chordate pharynx
  - preferred_term: genioglossus muscle
    term:
      id: UBERON:0001571
      label: genioglossus muscle
  evidence:
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the presence of an anatomically compromised, collapsible airway, the
      sleep-induced loss of compensatory tonic input to the upper airway dilator
      muscle motor neurons leads to collapse of the pharyngeal airway.
    explanation: >-
      States the obstructive trigger precisely as this node models it - a
      state-dependent loss of neural compensation acting on a pre-existing
      anatomic vulnerability, not anatomy alone.
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study confirms that OSA is a heterogeneous disorder. Although
      Pcrit-anatomy is an important determinant, abnormalities in nonanatomic
      traits are also present in most patients with OSA.
    explanation: >-
      Confirms pharyngeal collapsibility as an important anatomic determinant at
      this node while establishing that it is not the whole mechanism, which is
      why the module curates the non-anatomic traits as a separate arm.
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 36% of patients with OSA had minimal genioglossus muscle
      responsiveness during sleep, 37% had a low arousal threshold, and 36% had
      high loop gain.
    explanation: >-
      Quantifies the endotypic traits that modify this node, and is the evidence
      behind the module's instruction that curating airway anatomy alone
      captures one of four contributing mechanisms.
  downstream:
  - target: Recurrent Apnoea-Hypopnoea with Arousal from Sleep
    description: >-
      Pharyngeal collapse during sleep produces cessation or reduction of
      airflow against continued respiratory effort, terminated by arousal.
    causal_link_type: DIRECT

- name: Ventilatory Control Instability or Chemoreflex Failure
  description: >-
    Second entry arm, mechanistically distinct from the first, and itself
    covering two opposite control failures. In the UNSTABLE case, chemoreflex
    loop gain is high: a small ventilatory perturbation provokes an
    overcorrection, driving arterial carbon dioxide below the apnoeic threshold,
    which stops respiratory effort altogether until carbon dioxide reaccumulates,
    and the loop oscillates. This is the mechanism of idiopathic central sleep
    apnoea and of the Cheyne-Stokes pattern in heart failure, and - because loop
    gain is a continuously distributed trait - it also destabilises airways that
    anatomy alone would have left marginal. In the HYPORESPONSIVE case, the
    chemoreflex fails to respond at all: central chemoreception to carbon dioxide
    is absent or blunted, so no corrective ventilatory response is generated and
    the result is sustained hypoventilation rather than oscillation. Conforming
    disorder nodes must state which failure they evidence, because the two
    predict opposite responses to supplemental oxygen and to respiratory
    stimulants.
  role: trigger
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: nervous system control of respiratory gas exchange
    term:
      id: GO:0002087
      label: regulation of respiratory gaseous exchange by nervous system process
    modifier: ABNORMAL
  - preferred_term: chemoreflex response to carbon dioxide
    term:
      id: GO:0010037
      label: response to carbon dioxide
    modifier: ABNORMAL
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  - preferred_term: carotid body
    term:
      id: UBERON:0001629
      label: carotid body
  evidence:
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In turn, the ability of the sleeping subject to compensate for this airway
      obstruction will determine the degree of cycling of these events.
    explanation: >-
      Identifies the control-loop contribution as what converts an isolated
      event into a cycling pattern, which is the amplifying role this arm plays
      even in anatomically driven disease.
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In these patients, loop gain was almost twice as high as patients with a
      Pcrit greater than -2 cm H2O
    explanation: >-
      Directly demonstrates the trade-off between the two arms: patients with a
      relatively non-collapsible airway who nonetheless have apnoea have roughly
      double the loop gain, so control instability substitutes for anatomy.
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital central hypoventilation syndrome (CCHS or Ondine's curse; OMIM
      209880) is a life-threatening disorder involving an impaired ventilatory
      response to hypercarbia and hypoxemia.
    explanation: >-
      The worked human case of the hyporesponsive rather than unstable failure
      at this node, and the entry point for the disorders the module explicitly
      excludes from the intermittent-hypoxia node.
  downstream:
  - target: Recurrent Apnoea-Hypopnoea with Arousal from Sleep
    description: >-
      Oscillation of the chemoreflex loop drives arterial carbon dioxide below
      the apnoeic threshold, producing central apnoeas that terminate in arousal
      as carbon dioxide reaccumulates. This edge applies to the unstable
      (high-loop-gain) failure; the hyporesponsive failure produces sustained
      hypoventilation and does not traverse it.
    causal_link_type: DIRECT

- name: Recurrent Apnoea-Hypopnoea with Arousal from Sleep
  description: >-
    Both arms converge here. Airflow is repeatedly abolished or reduced, gas
    exchange deteriorates until chemical and mechanical stimuli reach the arousal
    threshold, and a cortical arousal restores airway patency or ventilatory
    drive - after which sleep resumes and the cycle repeats, often hundreds of
    times a night. The arousal is simultaneously the corrective mechanism and a
    source of injury: it fragments sleep and delivers a sympathetic surge at each
    event. The arousal threshold is therefore genuinely double-edged, and a low
    threshold is a distinct endotype rather than a marker of severity - patients
    who arouse too easily terminate events before dilator recruitment can
    stabilise the airway, which is why sedating such patients can paradoxically
    reduce their event count.
  role: amplifier
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: respiratory system process
    term:
      id: GO:0003016
      label: respiratory system process
    modifier: ABNORMAL
  - preferred_term: sleep
    term:
      id: GO:0030431
      label: sleep
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23721582
    reference_title: Defining phenotypic causes of obstructive sleep apnea. Identification of novel therapeutic targets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It suggests that nonanatomic features play an important role in 56% of
      patients with OSA.
    explanation: >-
      Establishes the event count at this node as the joint output of several
      upstream traits rather than a mechanism in itself: non-anatomic
      contributions matter in the majority of patients, which is the reading the
      module's notes ask conformers to preserve.
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sleep-induced apnea and disordered breathing refers to intermittent,
      cyclical cessations or reductions of airflow, with or without obstructions
      of the upper airway (OSA).
    explanation: >-
      Defines the node's cyclical character and explicitly spans both the
      obstructive and non-obstructive arms, which is why it is the convergence
      point.
  downstream:
  - target: Chronic Intermittent Hypoxia and Reoxygenation
    description: >-
      Each cycle of obstruction and relief produces a fall and then a rapid
      restoration of arterial oxygen saturation, repeated through the night.
    causal_link_type: DIRECT

- name: Chronic Intermittent Hypoxia and Reoxygenation
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target.
    The exposure that drives systemic disease is not hypoxia but the cycle:
    repeated desaturation followed by rapid reoxygenation, delivered hundreds of
    times nightly for years. The reoxygenation phase is mechanistically
    essential, because it is the ischaemia-reperfusion-like burst of reactive
    oxygen species, rather than the oxygen debt, that sensitises the carotid body
    and initiates the vascular arm. This is why an equivalent time-averaged
    oxygen saturation delivered continuously does not reproduce the phenotype,
    and why disorders whose lesion is sustained nocturnal hypoventilation must
    not conform here.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  evidence:
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We review three types of major long-term sequelae to severe OSA that have
      been assessed in humans through use of continuous positive airway pressure
      (CPAP) treatment and in animal models via long-term intermittent hypoxemia
      (IH)
    explanation: >-
      Establishes intermittent hypoxaemia as the experimental exposure that
      stands in for the disease in mechanistic work - i.e. that this node, not
      the apnoea count, is the causal quantity for the systemic sequelae.
  downstream:
  - target: Sympathetic Overactivation, Oxidative Stress and Vascular Inflammation
    description: >-
      Cyclical hypoxia and reoxygenation sensitise the peripheral chemoreflex and
      generate reactive oxygen species in the vascular wall.
    causal_link_type: DIRECT

- name: Sympathetic Overactivation, Oxidative Stress and Vascular Inflammation
  description: >-
    Chemoreceptor sensitisation converts a nocturnal, intermittent stimulus into
    a tonic, daytime elevation of sympathetic vasoconstrictor outflow that
    persists long after the patient has woken - which is the step that makes a
    sleep disorder into a cardiovascular one. In parallel, superoxide
    overproduction and inflammatory activation act directly on resistance
    vessels. The two mechanisms are additive rather than alternative, and both
    are needed to explain the hypertension.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: regulation of systemic arterial blood pressure
    term:
      id: GO:0003073
      label: regulation of systemic arterial blood pressure
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The underlying mechanisms mediating hypertension include enhanced
      chemoreceptor sensitivity causing excessive daytime sympathetic
      vasoconstrictor activity, combined with overproduction of superoxide ion
      and inflammatory effects on resistance vessels.
    explanation: >-
      Names both limbs of this node and their combination, and specifically the
      carry-over of a nocturnal stimulus into daytime sympathetic tone, which is
      the mechanism the node exists to record.
  downstream:
  - target: Cardiovascular, Metabolic and Neurocognitive Sequelae
    description: >-
      Sustained sympathetic and oxidative-inflammatory activation, together with
      sleep fragmentation, produce the systemic consequences.
    causal_link_type: DIRECT

- name: Cardiovascular, Metabolic and Neurocognitive Sequelae
  description: >-
    The clinical endpoint, and deliberately graded rather than uniform: the
    evidence is strongest for daytime systemic hypertension, weaker and less
    settled for pulmonary hypertension, stroke, coronary disease, and
    arrhythmia. The metabolic arm - impaired insulin sensitivity and glucose
    homeostasis - is driven by both intermittent hypoxaemia and sleep
    disruption, but whether it contributes independently of obesity remains
    unsettled, and conforming entries should not assert independence that the
    evidence does not support. The neurocognitive arm (sleepiness, impaired
    memory and concentration) reflects both fragmentation and hypoxic neural
    injury.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The evidence is strongest to support daytime systemic hypertension as a
      consequence of severe OSA, with less conclusive effects on pulmonary
      hypertension, stroke, coronary artery disease, and cardiac arrhythmias.
    explanation: >-
      Grades the cardiovascular claims explicitly, which is the calibration
      conforming entries should inherit rather than asserting the whole list
      uniformly.
  - reference: PMID:20086074
    reference_title: Pathophysiology of sleep apnea.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      but whether these influences of OSA are sufficient, independent of obesity,
      to contribute significantly to the "metabolic syndrome" remains unsettled
    explanation: >-
      Cited as PARTIAL because it withholds rather than supports the independent
      metabolic claim; recorded so that a conforming entry cannot silently
      upgrade it.
treatments:
- name: Continuous Positive Airway Pressure
  description: >-
    CPAP delivers a pneumatic splint to the pharynx, holding it open across the
    respiratory cycle and abolishing the obstructive events at the module's
    amplifier node. It is the device-target pattern for this module and, more
    importantly, its causal test: because CPAP removes the events without
    altering obesity, craniofacial anatomy, or any other shared antecedent,
    reversal of the downstream chain under CPAP is the evidence that the events
    themselves drive it. The caveat conforming entries must preserve is that
    physiological efficacy and clinical effectiveness diverge - in head-to-head
    randomisation CPAP reduced the apnoea-hypopnoea index considerably more than
    a mandibular advancement device, yet delivered similar health outcomes,
    because adherence was lower. Event suppression per hour used is not the same
    quantity as event suppression per night.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Recurrent Apnoea-Hypopnoea with Arousal from Sleep
    treatment_effect: INHIBITS
    description: >-
      Positive airway pressure prevents pharyngeal collapse, abolishing the
      apnoea-hypopnoea-arousal cycle and, with it, the intermittent hypoxia
      downstream.
  evidence:
  - reference: PMID:23413266
    reference_title: "Health outcomes of continuous positive airway pressure versus oral appliance treatment for obstructive sleep apnea: a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CPAP was more efficacious than MAD in reducing AHI
    explanation: >-
      Establishes that CPAP acts on the amplifier node more completely than the
      comparator device, which is the mechanistic half of the drug-target claim.
  - reference: PMID:23413266
    reference_title: "Health outcomes of continuous positive airway pressure versus oral appliance treatment for obstructive sleep apnea: a randomized controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results may be explained by greater efficacy of CPAP being offset by
      inferior compliance relative to MAD, resulting in similar effectiveness.
    explanation: >-
      Cited as PARTIAL because it qualifies the pattern rather than supporting
      it: greater action on the node did not produce proportionally greater
      clinical benefit, and the module records that adherence, not efficacy, was
      the binding constraint.
discussions:
- discussion_id: gap_ahi_as_severity_metric
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the apnoea-hypopnoea index an adequate measure of the exposure this
    module makes rate-limiting?
  attaches_to:
  - pathophysiology#Chronic Intermittent Hypoxia and Reoxygenation
  - pathophysiology#Recurrent Apnoea-Hypopnoea with Arousal from Sleep
  rationale: >-
    Every diagnostic threshold, severity band, and trial eligibility criterion in
    this field uses the apnoea-hypopnoea index, a count of events per hour. But
    the module's causal quantity is the cyclical hypoxic exposure, and two
    patients with identical event counts can differ several-fold in desaturation
    depth, hypoxic burden, and arousal intensity. That mismatch is a plausible
    contributor to the repeated failure of CPAP trials powered on
    index-based severity to show cardiovascular benefit, and it means a
    conforming disorder entry curating "severe OSA" by index has not necessarily
    curated severe exposure at the central node.
  proposed_experiments:
  - experiment_id: exp_hypoxic_burden_vs_ahi_outcome
    name: Hypoxic burden versus event index as predictors of cardiovascular outcome
    description: >-
      Re-analysis of existing polysomnography cohorts with prospective
      cardiovascular follow-up, comparing the predictive performance of
      area-under-the-desaturation-curve hypoxic burden against the
      apnoea-hypopnoea index for incident hypertension and cardiovascular
      events, and testing whether treatment effects stratify by hypoxic burden
      where they do not stratify by index.

name: Enterocyte Polarity and Trafficking Failure Module
description: >-
  A conserved pathophysiology module representing the third and most severe class
  of the congenital diarrheas and enteropathies (CODEs): the disorders in which
  the enterocyte fails to build or hold a correctly polarized apical surface, so
  the absorptive interface of the intestine is structurally lost rather than
  functionally impaired. The trigger admits two molecularly distinct lesions that
  converge on one endpoint. In the trafficking arm, loss of the apical delivery
  machinery - the myosin Vb motor (MYO5B) or the apical SNARE syntaxin-3 (STX3)
  one step downstream - prevents recycling-endosome cargo from reaching the
  apical membrane, so the brush border is never built and internalized microvilli
  accumulate as intracellular inclusions. In the adhesion arm, loss of functional
  EpCAM (by EPCAM variants, or indirectly by SPINT2 variants that unleash
  matriptase to degrade it) strips claudin-7 from the tight junction and
  destabilizes the whole apical junctional complex, which is what maintains
  polarity across the sheet. Either way the epithelium loses a functionally
  polarized absorptive surface - the rate-limiting node - and with it the brush
  border enzymes, nutrient carriers and ion exchangers that surface carries. The
  class has a distinctive triad that separates it operationally from both
  non-structural CODE classes: villus architecture is abnormal (an abnormal
  villus-to-crypt ratio, unlike the normal ratio of the digestive, absorptive and
  electrolyte-transport defects), the diarrhea does not remit during complete
  bowel rest or on any dietary elimination, and the outcome is intestinal failure
  with parenteral-nutrition dependence for which transplantation, not diet or
  drug, is the definitive treatment.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is the third of three
  sibling modules covering the epithelial CODE classes as the current nosology
  separates them (PMID:29654747), alongside diet_induced_osmotic_diarrhea (loss
  of a substrate-specific step handling an ingested nutrient; normal villus
  architecture; remits on dietary elimination) and
  electrolyte_transport_related_diarrhea (loss of an ion-transport step; normal
  villus architecture; low stool osmotic gap). The discriminator that assigns a
  disorder to this module rather than either sibling is the villus-to-crypt
  ratio: it is abnormal here and normal in both of the others, which is exactly
  the split PMID:29654747 draws. A disorder must not conform to this module and
  to either sibling for the same node.
  ARM SELECTION IS THE CURATOR'S FIRST DECISION. The module carries two
  molecularly distinct trigger arms as SEPARATE nodes - `#Loss of Apical Delivery
  Machinery` (MYO5B/STX3) and `#Loss of Junctional Adhesion Machinery`
  (EPCAM/SPINT2) - which converge on one rate-limiting node but are not
  interchangeable. They were originally curated as a single blended trigger; that
  structure let a conformer implicitly assert the other arm's lesion, so it was
  split to follow the separate-arm precedent of `defective_skeletal_mineralization`
  and `bilirubin_conjugation_transport`. A disorder must enter through exactly one
  arm and must NOT declare conformance to the other: MYO5B/STX3 disease and
  EPCAM/SPINT2 disease differ in histology (intracellular microvillus inclusions
  versus focal epithelial tufts), and apical vesicle delivery is intact in EpCAM
  disease. Note that a disorder may map more than one of its own nodes onto the
  central effector, because that node is deliberately coarser than the
  structural/functional split most conformers curate.
  Excluded: immune-mediated enteropathy (IPEX, autoimmune enteropathy), where
  epithelial damage is secondary to immune dysregulation rather than intrinsic to
  the enterocyte - PMID:29654747 separates epithelium-intrinsic from
  immune-mediated CODEs on exactly this basis; barrier injury and inflammatory
  villus blunting, covered by intestinal_barrier_dysfunction; and
  post-uptake intracellular metabolic defects such as DGAT1 deficiency, where the
  apical surface is intact and endoscopy is typically normal.
  Key disease-specific substitutions: microvillus inclusion disease substitutes
  MYO5B (or STX3/STXBP2) and the brush-border-loss-with-inclusions histology;
  congenital tufting enteropathy substitutes EpCAM (or SPINT2 acting through it)
  and the tuft-with-crypt-hyperplasia histology. Modules bind GO and CL terms
  only and do not use chemical (CHEBI) or disease (MONDO) term bindings.
pathophysiology:
- name: Loss of Apical Delivery Machinery
  description: >-
    ARM SELECTION IS THE CURATOR'S FIRST DECISION. This is the trafficking arm.
    Biallelic loss of the myosin Vb motor - or of syntaxin-3, the apical SNARE
    that receives its vesicles one step downstream - arrests delivery of
    recycling-endosome cargo to the apical membrane. Because basolateral cargo is
    mislocalized too, the defect is one of general epithelial polarity rather
    than of a single apical protein. A disorder entering the module through this
    arm must NOT declare conformance to the adhesion arm: the two are
    molecularly distinct and histologically distinguishable (intracellular
    microvillus inclusions here, focal epithelial tufts there), and conforming to
    both would assert a claudin-7 lesion that MYO5B disease does not have.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: Apical delivery of vesicular cargo
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: LOSS_OF_FUNCTION
  - preferred_term: Establishment of enterocyte apical-basal polarity
    term:
      id: GO:0045198
      label: establishment of epithelial cell apical/basal polarity
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: Apical recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:18724368
    reference_title: "MYO5B mutations cause microvillus inclusion disease and disrupt epithelial cell polarity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mislocalization of transferrin receptor in MVID enterocytes suggests that
      MYO5B deficiency causes defective trafficking of apical and basolateral
      proteins in MVID
    explanation: >-
      Establishes the trafficking arm of this trigger as a general defect of
      polarized membrane traffic, affecting basolateral as well as apical cargo,
      rather than loss of one apical protein.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Along with microvillus inclusion disease, a severe disorder belonging to
      the defective enterocyte trafficking and polarity category of CODEs is
      congenital tufting enteropathy (CTE).
    explanation: >-
      Supports treating the two arms as one CODE class even though they are
      curated as separate trigger nodes: both microvillus inclusion disease and
      congenital tufting enteropathy are assigned to the defective enterocyte
      trafficking and polarity category. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Loss of a Functionally Polarized Absorptive Epithelial Surface
    causal_link_type: DIRECT
- name: Loss of Junctional Adhesion Machinery
  description: >-
    ARM SELECTION IS THE CURATOR'S FIRST DECISION. This is the adhesion arm.
    Loss of functional EpCAM at the epithelial cell surface - by EPCAM variants,
    or indirectly by SPINT2 variants that unleash matriptase to degrade it -
    removes the anchor that recruits claudin-7 to the tight junction,
    destabilizing the apical junctional complex that maintains polarity and
    cohesion across the sheet. A disorder entering through this arm must NOT
    declare conformance to the trafficking arm: apical vesicle delivery is intact
    in EpCAM disease, and the histology is focal epithelial tufts rather than
    intracellular microvillus inclusions.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: Homotypic cell-cell adhesion
    term:
      id: GO:0034109
      label: homotypic cell-cell adhesion
    modifier: DECREASED
  cellular_components:
  - preferred_term: Tight junction
    term:
      id: GO:0070160
      label: tight junction
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In CTE, the absence of EpCAM substantially reduces the recruitment of
      claudin-7 to TJs, leading to loss of TJ formation.
    explanation: >-
      Establishes this arm - EpCAM loss removing claudin-7 from the tight
      junction so junction formation fails. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Loss of a Functionally Polarized Absorptive Epithelial Surface
    causal_link_type: DIRECT
- name: Loss of a Functionally Polarized Absorptive Epithelial Surface
  description: >-
    The rate-limiting, disorder-agnostic node and the key conformance target.
    Whichever arm is taken, the epithelium can no longer present a correctly
    organized apical surface to the lumen. In the trafficking arm the brush
    border is sparse or absent and microvilli are internalized into cytoplasmic
    inclusions; in the adhesion arm the sheet becomes dysplastic, with
    disorganized enterocytes crowding into focal tufts on a background of villous
    atrophy and crypt hyperplasia. The functional consequence is the same and is
    what matters mechanistically: the apical surface carries the brush-border
    hydrolases, the nutrient carriers and the ion exchangers, so losing it
    removes absorptive capacity across the board rather than for any one
    substrate or ion. This is why conforming disorders cannot be treated by
    eliminating a dietary constituent or by replacing an ion - there is no single
    missing step to bypass.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: Apical membrane protein delivery and retention
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  - preferred_term: Intestinal absorption
    term:
      id: GO:0050892
      label: intestinal absorption
    modifier: DECREASED
  cellular_components:
  - preferred_term: Microvillus
    term:
      id: GO:0005902
      label: microvillus
  evidence:
  - reference: PMID:18724368
    reference_title: "MYO5B mutations cause microvillus inclusion disease and disrupt epithelial cell polarity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MVID is characterized by lack of microvilli on the surface of enterocytes
      and occurrence of intracellular vacuolar structures containing microvilli.
    explanation: >-
      Documents the trafficking arm's version of this node: the apical surface is
      absent and its microvilli are internalized.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The tufts are composed of disorganized enterocytes with focal crowding at
      villous tips and basement membrane abnormalities resulting in teardrop-like
      configurations.
    explanation: >-
      Documents the adhesion arm's version of this node: the sheet itself becomes
      disorganized and dysplastic rather than the apical membrane being absent.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The combined effect of decreased glucose transporters and disaccharidase
      expression result in compromised caloric uptake in this disease, which may
      contribute to weight loss and failure to thrive
    explanation: >-
      Supports the claim that losing the polarized surface removes several
      classes of absorptive machinery at once - transporters and disaccharidases
      together - rather than one substrate-specific step.
  downstream:
  - target: Abnormal Villus Architecture
    causal_link_type: DIRECT
  - target: Feeding-Independent Intractable Diarrhea
    causal_link_type: DIRECT
- name: Abnormal Villus Architecture
  description: >-
    The histological signature of the class and its diagnostic discriminator.
    Unlike the digestive, absorptive and electrolyte-transport CODEs, where the
    villus-to-crypt ratio is normal, the enterocyte-structural disorders produce
    an abnormal ratio and abnormal morphology - villous atrophy in both arms,
    with crypt hyperplasia and focal tufts in the adhesion arm and subapical
    periodic-acid-Schiff-positive granules with intracytoplasmic microvillus
    inclusions in the trafficking arm. This node is what a biopsy-first
    diagnostic pathway detects, and it is the single feature that assigns a
    congenital diarrhea to this module rather than to either sibling.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:29654747
    reference_title: "Advances in Evaluation of Chronic Diarrhea in Infants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infants with CODEs resulting from defects in digestion, absorption,
      transport of nutrients and electrolytes, or enteroendocrine cell
      development or function have normal villi to crypt ratios; defects in
      enterocyte structure or immune-mediated conditions result in an abnormal
      villus to crypt ratios and morphology.
    explanation: >-
      States the discriminator this node encodes: enterocyte-structural defects
      give an abnormal villus-to-crypt ratio while the digestive, absorptive and
      electrolyte-transport defects give a normal one. Evidence source is OTHER
      because this is a review proposing the current CODE classification.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CTE is typically diagnosed by its characteristic histological features,
      including villous atrophy, crypt hyperplasia and focal epithelial tufts
      consisting of densely packed enterocytes.
    explanation: >-
      Gives the adhesion arm's histology and confirms that diagnosis in this
      class rests on the mucosal architecture this node describes.
  downstream:
  - target: Intestinal Failure and Parenteral Nutrition Dependence
    causal_link_type: DIRECT
- name: Feeding-Independent Intractable Diarrhea
  description: >-
    The functional output. Profuse watery diarrhea begins in the neonatal period
    and, critically, continues whether the infant is fed or fasted, because the
    lesion is in the absorptive surface itself rather than in the handling of
    anything ingested. This is the property that rules out the two
    non-structural CODE classes at the bedside: no dietary elimination abolishes
    it, no enzyme replacement bypasses it, and no ion substitution reduces stool
    volume. In the adhesion arm the loss of tight junctions adds a secretory
    component and the loss of glucose transporters and disaccharidases an osmotic
    one, so the diarrhea is mixed rather than cleanly of either type.
  role: effector
  biological_scale: ORGANISM
  locations:
  - preferred_term: Intestine
    term:
      id: UBERON:0000160
      label: intestine
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Watery diarrhea is abundant in CTE patients irrespective of whether the
      infant is fed or fasted
    explanation: >-
      States the feeding independence that defines this node and separates the
      class from the substrate-dependent diet-induced congenital diarrheas.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alteration in expression and localization of ion transporters and tight
      junction proteins explains the secretory nature of diarrhea found in CTE,
      whereas changes in glucose transporters explain osmotic diarrhea seen in
      these patients
    explanation: >-
      Supports the mixed secretory-plus-osmotic character of the diarrhea in this
      class, both components being downstream of the lost polarized surface
      rather than primary.
  downstream:
  - target: Intestinal Failure and Parenteral Nutrition Dependence
    causal_link_type: DIRECT
- name: Intestinal Failure and Parenteral Nutrition Dependence
  description: >-
    The clinical output, and the most severe of the three epithelial CODE
    classes. Because absorptive capacity is structurally absent, enteral feeding
    cannot sustain the child and parenteral nutrition is required from the
    neonatal period. The natural history is then dominated by the complications
    of that dependence - intestinal-failure-associated liver disease,
    catheter-related sepsis, growth failure, renal impairment and metabolic bone
    disease. Most patients never achieve enteral autonomy, and small-bowel
    transplantation, which replaces the epithelium with genotypically normal
    donor tissue, is the only definitive treatment. Severity is nonetheless
    heterogeneous within the class, and in the adhesion arm some patients improve
    substantially over time, so transplantation is not automatically first-line.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:21407114
    reference_title: "Microvillous inclusion disease: how to improve the prognosis of a severe congenital enterocyte disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the patients completely depended on PN.
    explanation: >-
      Documents universal parenteral-nutrition dependence in a 24-patient
      microvillus inclusion disease cohort, the trafficking arm's version of this
      node.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, most patients never achieve enteral autonomy
    explanation: >-
      Documents the same outcome in the adhesion arm, supporting the claim that
      failure to achieve enteral autonomy characterises the class rather than one
      disorder.
  - reference: PMID:21407114
    reference_title: "Microvillous inclusion disease: how to improve the prognosis of a severe congenital enterocyte disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SBTx, despite being complicated, remains the only hope to improve the
      quality of life and long-term prognosis of these children.
    explanation: >-
      Supports transplantation as the only definitive treatment for this node,
      which is what distinguishes the prognosis of this class from the dietarily
      and pharmacologically manageable sibling classes.
treatments:
- name: Parenteral Nutrition
  description: >-
    The shared supportive mainstay of the class. Because the absorptive surface
    is structurally absent, nutrition must bypass the intestine entirely. It is
    not disease-modifying: it sustains the child while the polarity defect
    persists, and it carries substantial morbidity of its own. Its necessity
    here, as opposed to the dietary and ion-replacement strategies that work in
    the sibling classes, is a direct consequence of there being no single missing
    step to eliminate, replace or bypass.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Total Parenteral Nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Feeding-Independent Intractable Diarrhea
    treatment_effect: BYPASSES
    description: >-
      Intravenous nutrition bypasses the non-functional absorptive surface; it
      does not act on the trafficking or adhesion lesion and does not restore
      epithelial polarity.
    evidence:
    - reference: PMID:33374714
      reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These findings provide a rationale as to why parenteral nutrition is
        often the only reliable source of nutrients in these patients and the
        clinical observation that enteral feeding has been shown to worsen CTE
      explanation: >-
        Explains why parenteral nutrition is required in this class and ties that
        requirement to the loss of absorptive machinery, not to intolerance of a
        specific nutrient.
- name: Small-Bowel Transplantation
  description: >-
    The only definitive treatment in this class, and the one that acts on the
    central effector rather than compensating for it: donor intestine carries
    genotypically normal epithelium that can build and hold a polarized apical
    surface. It is the therapeutic signature of the class - neither sibling
    module has a curative intervention of this kind, because in those classes the
    epithelium is intact and a single step can be replaced or avoided instead.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Small Bowel Transplantation
    term:
      id: NCIT:C157985
      label: Small Bowel Transplantation
  target_mechanisms:
  - target: Loss of a Functionally Polarized Absorptive Epithelial Surface
    treatment_effect: RESTORES
    description: >-
      Replacing the intestine with donor epithelium restores an intact,
      correctly polarized absorptive surface, addressing the rate-limiting node
      itself.
    evidence:
    - reference: PMID:21407114
      reference_title: "Microvillous inclusion disease: how to improve the prognosis of a severe congenital enterocyte disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient survival rates were 63% without SBTx and 77% with SBTx.
      explanation: >-
        Quantifies the survival benefit of transplantation in the trafficking
        arm, supporting it as the intervention that addresses the central
        effector.
    - reference: PMID:33374714
      reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Although small bowel transplantation is the only accepted cure for CTE to
        date, transplantation should not be the first line of treatment given the
        varied natural history of the disease, with some patients showing
        significant improvement over time.
      explanation: >-
        Confirms transplantation as the only cure in the adhesion arm while
        recording the caveat against using it first-line, which conforming
        entries should preserve.

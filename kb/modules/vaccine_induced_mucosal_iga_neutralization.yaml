  evidence:
  - reference: PMID:8817767
    reference_title: "Mucosal immune responses to intestinal bacterial pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      V cholerae, the representative noninvasive pathogen, has fimbrial adhesins
      that mediate attachment and colonization of the luminal surface of epithelial
      cells where organisms secrete cholera toxin (CT), a potent enterotoxin that
      induces a voluminous diarrhea via adenylate cyclase-dependent chloride
      secretion.
    explanation: >-
      Establishes luminal attachment and colonization of gut epithelial cells via
      surface adhesins as the primary pathogen step targeted by mucosal secretory
      IgA.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rotavirus attachment to host cells is mediated by the outer capsid protein
      VP4 (through its VP8* domain37) and binding partners on the host cell
      surface, including sialoglycans (such as gangliosides GM1 and GD1a) and
      histo-blood group antigens (HBGAs)
    explanation: >-
      Identifies the viral capsid adhesin (VP4/VP8*) and host epithelial glycan
      receptors (sialoglycans and HBGAs) that mediate enterocyte attachment and
      serve as the target of neutralizing mucosal antibodies.
  downstream:
  - target: Luminal Secretory IgA Immune Exclusion and Epithelial Attachment Blockade
    description: >-
      When intercepted by vaccine-induced luminal secretory IgA, pathogen surface
      adhesins and capsid proteins are sterically blocked from engaging host
      epithelial receptors.

- name: Luminal Secretory IgA Immune Exclusion and Epithelial Attachment Blockade
  description: >-
    Secretory IgA (sIgA) delivered to the luminal surface of intestinal epithelial
    cells binds pathogen surface adhesins and capsid proteins — including rotavirus
    outer capsid spike protein VP4 (VP8*/VP5*) and VP7, Vibrio cholerae O-antigen
    lipopolysaccharide and fimbrial adhesins, and poliovirus capsid proteins —
    physically blocking attachment to host epithelial receptors (such as
    histo-blood group antigens, sialoglycans, or CD155) and preventing enterocyte
    entry.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:

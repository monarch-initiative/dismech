notes: >-
  This is a mechanism module, not a specific disease; do NOT create a
  "Vaccine-Induced Mucosal IgA Neutralization" Disease entry. Disorder entries
  reference the pathogen-side luminal attachment and entry node via conforms_to
  (specifically "vaccine_induced_mucosal_iga_neutralization#Enteric Pathogen
  Luminal Attachment and Mucosal Epithelial Entry"). Conforming disorder nodes
  represent the pathogen's luminal attachment and epithelial entry step in the
  disease direction (Rotaviral_Enteritis at "Host Glycan Attachment and Mature
  Villus Enterocyte Entry", where anti-VP4/VP8* and anti-VP7 sIgA block HBGA/sialoglycan
  attachment; Cholera at "Colonization and Biofilm Formation", where anti-OSP and
  anti-fimbrial sIgA agglutinate Vibrio cholerae and block epithelial adherence;
  Paralytic_Poliomyelitis at "Poliovirus Entry via CD155 Receptor", where OPV-induced
  intestinal sIgA neutralizes luminal poliovirus and curtails fecal shedding).
  The module also captures why parenteral inactivated vaccines (such as IPV in
  naive infants) protect against viremic CNS invasion via serum IgG while exerting
  only a modest direct effect on intestinal shedding unless mucosal priming has
  occurred, and why environmental/tropical enteropathy blunts oral vaccine take
  in low-income settings. Modules bind GO, CL, and UBERON terms only; specific
  viral/bacterial antigens and host receptors (VP4, VP8*, CD155, FUT2, HBGAs) are
  described in prose.
pathophysiology:
- name: Mucosal Inductive-Site Antigen Sampling and B Cell Priming
  description: >-
    Luminal viral particles or noninvasive enteric pathogens delivered by oral
    vaccination or natural exposure interact with the gut epithelial compartment
    and are sampled at mucosal immune inductive sites — Peyer's patches of the
    small intestine and lymphoid follicles of the colon — where naive B cells
    encounter antigen and initiate mucosal humoral priming. Environmental or
    tropical enteropathy, which disrupts intestinal mucosal barrier integrity and
    mucosal inductive-site function, diminishes seroconversion to oral rotavirus
    and oral poliovirus vaccines in low-income settings.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: naive B cell
    term:
      id: CL:0000788
      label: naive B cell
  biological_processes:
  - preferred_term: antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
  - preferred_term: B cell activation
    term:
      id: GO:0042113
      label: B cell activation
    modifier: INCREASED
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:8817767
    reference_title: "Mucosal immune responses to intestinal bacterial pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenicity and immune response can be conceptualized in terms of the
      interaction of these enteric pathogens with the gut epithelial compartment,
      immune inductive sites (Peyer's patch of the small intestine and lymphoid
      follicles of the colon), and a common immune effector compartment in the
      laimina propria where protective antibody is secreted.
    explanation: >-
      Establishes the anatomical and functional division between gut mucosal
      inductive sites (Peyer's patches and colonic lymphoid follicles) and the
      lamina propria effector compartment where protective antibody is secreted.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Environmental enteropathy (a common disorder in children in some low-income
      countries that is associated with diminished gastrointestinal immunity) might
      also have a role in reduced vaccine effectiveness in developing countries123.
      Indeed, the presence of biomarkers of environmental enteropathy has been
      associated with diminished RV5 vaccine seroconversion in infants123.
    explanation: >-
      Demonstrates that intact gastrointestinal mucosal immunity at the inductive
      site is required for efficient oral vaccine seroconversion, and that
      environmental enteropathy impairs this trigger step.
  downstream:
  - target: CD4+ T Cell-Dependent Class Switching to IgA and Lamina Propria Plasma Cell Homing
    description: >-
      Primed mucosal B cells receive CD4+ T cell help, switch to IgA, and home to
      the intestinal lamina propria and submucosa as antibody-secreting plasma
      cells and memory B cells.

- name: CD4+ T Cell-Dependent Class Switching to IgA and Lamina Propria Plasma Cell Homing
  description: >-
    Activated mucosal B cells depend on CD4+ T cell help to undergo class switch
    recombination to immunoglobulin A (IgA) and differentiate into IgA-secreting
    plasma cells and cross-reactive submucosal memory B cells that populate the
    intestinal lamina propria effector compartment. Serum and intestinal
    antigen-specific IgA levels serve as the primary immunological marker of
    mucosal vaccine take.
  role: amplifier
  biological_scale: CELLULAR

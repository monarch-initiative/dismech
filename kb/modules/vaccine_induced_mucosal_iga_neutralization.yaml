    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In adult mice, protection from rotavirus reinfection is almost absolute and
      is mostly mediated by intestinal IgA antibodies90, the production of which is
      largely dependent on the activation of CD4+ T cells89.
    explanation: >-
      Establishes that protective intestinal IgA production depends on CD4+ T cell
      activation.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Levels of total serum rotavirus-specific immunoglobulin A (IgA) antibodies,
      measured after infection, are currently the best marker of protection against
      rotavirus disease74, and the presence of anti-rotavirus IgA antibodies in
      serum is widely used as a marker of vaccine take, although the correlation
      with protection from severe gastroenteritis is not absolute.
    explanation: >-
      Supports antigen-specific IgA production as the canonical human correlate of
      protection and marker of oral vaccine take.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      One study identified memory B cells in the submucosa of adult intestinal
      tissue that produced broadly cross-reactive and cross-neutralizing antibodies
      specific to VP5*; accordingly, recombinant VP5* might represent a broadly
      efficient candidate for a rotavirus vaccine191.
    explanation: >-
      Confirms that human intestinal submucosal memory B cells produce broadly
      cross-neutralizing antibodies against enteric viral capsid proteins.
  downstream:
  - target: Enteric Pathogen Luminal Attachment and Mucosal Epithelial Entry
    description: >-
      Lamina propria plasma cells secrete polymeric IgA that is transcytosed into
      the gut lumen to target pathogen attachment and entry at the intestinal
      epithelium.

- name: Enteric Pathogen Luminal Attachment and Mucosal Epithelial Entry
  description: >-
    Enteric viruses and noninvasive mucosal bacteria initiate infection at the
    intestinal epithelial surface by binding host cell-surface glycans or protein
    receptors — including rotavirus outer capsid VP4 (VP8*/VP5*) binding
    histo-blood group antigens and sialoglycans on mature villus enterocytes,
    Vibrio cholerae fimbrial adhesins and toxin-coregulated pilus mediating
    attachment and microcolony formation on small-intestinal epithelium, and
    poliovirus capsid binding CD155 (PVR) on alimentary mucosal cells. This
    pathogen attachment and entry step is the module's key conformance and
    therapeutic target: conforming disorder entries align their primary luminal
    attachment or epithelial entry node here, and oral mucosal vaccines direct
    their inhibitory target_mechanisms edge at that conforming node.
  role: therapeutic_vulnerability
  biological_scale: CELLULAR

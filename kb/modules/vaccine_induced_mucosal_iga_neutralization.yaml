  evidence:
  - reference: PMID:8817767
    reference_title: "Mucosal immune responses to intestinal bacterial pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      V cholerae, the representative noninvasive pathogen, has fimbrial adhesins
      that mediate attachment and colonization of the luminal surface of epithelial
      cells where organisms secrete cholera toxin (CT), a potent enterotoxin that
      induces a voluminous diarrhea via adenylate cyclase-dependent chloride
      secretion. Protective immunity is based on secretory (s) immunoglobulin A
      directed against whole-cell components that prevent attachment to gut
      epithelial cells and is enhanced by CT, an immunogen with potent adjuvant
      activity.
    explanation: >-
      Directly establishes that secretory IgA directed against pathogen surface
      components prevents attachment to gut epithelial cells, the central
      immune-exclusion mechanism of this module.
  - reference: PMID:20463105
    reference_title: "Correlates of protection induced by vaccination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the immune system is redundant, almost all current vaccines work
      through antibodies in serum or on mucosa that block infection or
      bacteremia/viremia and thus provide a correlate of protection.
    explanation: >-
      Confirms across vaccine classes that mucosal antibodies act by blocking
      initial infection at the mucosal surface.
  downstream:
  - target: Restriction of Mucosal Replication and Fecal Shedding
    description: >-
      Blocking epithelial attachment and enterocyte entry prevents productive
      luminal replication and reduces the titer and duration of fecal pathogen
      shedding.

- name: Restriction of Mucosal Replication and Fecal Shedding
  description: >-
    By preventing luminal attachment and enterocyte infection, mucosal sIgA
    curtails viral or bacterial replication in the intestinal tract and reduces
    both the quantity (titer) and duration of fecal pathogen excretion upon
    subsequent exposure. Parenteral inactivated vaccines (such as IPV in naive
    infants) do not directly induce primary intestinal sIgA, but boost waned
    intestinal mucosal immunity in previously mucosally primed individuals and
    shorten viral shedding duration and titer.
  role: effector
  biological_scale: TISSUE

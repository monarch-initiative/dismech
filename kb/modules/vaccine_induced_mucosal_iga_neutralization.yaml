  evidence:
  - reference: PMID:38535567
    reference_title: "Inactivated Poliovirus Vaccine: Recent Developments and the Tortuous Path to Global Acceptance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While IPV on its own in naïve infants does not induce intestinal mucosal
      immunity, an ever-increasing body of evidence supports that IPV-vaccinated
      infants excrete poliovirus for significantly shorter periods and with a
      lower quantity (lower viral titer) after challenge with vaccine virus or
      natural infection
    explanation: >-
      Contrasts primary intestinal mucosal immunity with parenteral immunization
      and identifies reduction in the duration and titer of fecal viral excretion
      as the functional readout of mucosal effector immunity.
  - reference: PMID:38535567
    reference_title: "Inactivated Poliovirus Vaccine: Recent Developments and the Tortuous Path to Global Acceptance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The boosting by IPV on waned mucosal immunity in previously OPV immunized
      individuals after a bOPV (types 1 + 3) challenge dose was shown to be
      greater than an additional dose of bOPV.
    explanation: >-
      Demonstrates that mucosal priming establishes a memory compartment whose
      intestinal shedding-reduction capacity can be boosted upon re-exposure or
      parenteral boosting.
  downstream:
  - target: Interruption of Fecal-Oral Transmission and Protection Against Enteric Disease
    description: >-
      Reduced mucosal replication and fecal shedding prevents severe diarrheal or
      invasive disease in the vaccinee and interrupts community fecal-oral
      transmission.

- name: Interruption of Fecal-Oral Transmission and Protection Against Enteric Disease
  description: >-
    The organism- and population-level consequence of mucosal sIgA immune
    exclusion is protection of the immunized host against severe secretory/osmotic
    diarrhea (in rotavirus and cholera) or viremic CNS invasion (in poliomyelitis),
    coupled with interruption of fecal-oral transmission in the community.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: immunoglobulin mediated immune response
    term:
      id: GO:0016064
      label: immunoglobulin mediated immune response
  evidence:
  - reference: PMID:38535567
    reference_title: "Inactivated Poliovirus Vaccine: Recent Developments and the Tortuous Path to Global Acceptance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      OPV became the main vaccine of choice for the GPEI due to its ease of use,
      low cost and ability to induce mucosal immunity, required for preventing
      transmission
    explanation: >-
      Establishes that vaccine-induced intestinal mucosal immunity is the
      mechanism required to interrupt fecal-oral transmission at the population
      level.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both vaccines are highly effective in preventing severe rotavirus disease in
      high-income countries117 but reduce the incidence of severe rotavirus disease
      by ~50–60% in many low-income countries118–120.
    explanation: >-
      Quantifies the clinical consequence of oral rotavirus vaccination in
      preventing severe enteric disease across high- and low-income settings.

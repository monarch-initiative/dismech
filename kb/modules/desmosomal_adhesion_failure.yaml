name: Desmosomal Adhesion Failure Module
description: >-
  A conserved cell-adhesion module for the desmosomal diseases. Desmosomes are
  the high-tensile intercellular junctions of tissues that bear mechanical
  stress, and they work by coupling desmosomal cadherins across the intercellular
  space to the intermediate filament cytoskeleton of both partner cells through
  an armadillo-and-plakin plaque. Three mechanistically distinct routes converge
  on the loss of that coupling: germline loss of a desmosomal structural
  component, autoantibody blockade of a desmosomal cadherin ectodomain, and loss
  of the keratinocyte calcium compartmentalization that desmosome assembly
  requires. Adhesion loss then manifests in whichever desmosome-dependent tissue
  is affected - acantholysis in epidermis, a fragile beaded or woolly hair
  shaft, and myocyte detachment with fibrofatty replacement in myocardium. This
  cross-organ reach is why a single desmosomal gene can produce a cardiocutaneous
  syndrome. Disorder entries reference these nodes via conforms_to and
  substitute their own route into the trigger.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a shared mechanism module, not a disease.

  Three substitutable routes into the trigger node, which are NOT
  interchangeable and should be curated as the specific route the disorder
  takes:

  1. Structural gene loss - DSP (Carvajal syndrome, striate palmoplantar
     keratoderma, arrhythmogenic cardiomyopathy), JUP/plakoglobin (Naxos
     disease), DSG1 (striate palmoplantar keratoderma type 1, SAM syndrome),
     PKP1 (ectodermal dysplasia-skin fragility syndrome), PKP2 and DSC2 and
     DSG2 (arrhythmogenic right ventricular cardiomyopathy).
  2. Autoantibody blockade - IgG against the DSG3 and/or DSG1 ectodomain in
     pemphigus vulgaris and pemphigus foliaceus. The target protein is the same
     as in route 1; only the mechanism of its removal differs, which is why an
     acquired disease conforms to a module otherwise populated by Mendelian
     entries.
  3. Calcium-handling failure - ATP2A2/SERCA2 (Darier disease) and
     ATP2C1/SPCA1 (Hailey-Hailey disease). These are not desmosomal proteins;
     they are the ER and Golgi calcium pumps whose activity the post-translational
     processing and assembly of desmosomal proteins depends on, so the desmosomal
     defect here is secondary. Curate the calcium lesion as the trigger and the
     desmosomal consequence downstream of it - do not assert a primary
     desmosomal protein defect in Darier or Hailey-Hailey disease.

  Dose-sensitivity is a real and curatable feature of route 1: DSP
  haploinsufficiency alone is sufficient for striate palmoplantar keratoderma,
  whereas the cardiocutaneous syndromes generally require a more severe or
  recessive allele. A conforming entry should preserve that distinction rather
  than describing every desmosomal lesion as equivalent.

  Scope boundary with `keratin_intermediate_filament_fragility`. Both modules end
  in a mechanically fragile keratinocyte, but the failing element differs: there
  the filament network itself collapses, here the network is intact and its
  anchorage to the junction is lost. A DSP entry belongs here; a KRT5 entry does
  not.

  Scope boundary with `cardiomyopathy_maladaptive_remodeling`. The cardiocutaneous
  entries reach ventricular remodeling and should keep conforming to that module
  for the heart-failure arm; this module supplies the upstream adhesion lesion
  that module takes as given.

  Not an Xogenesis module: acantholysis is the dissolution of intercellular
  adhesion, not the formation of a pathological anatomical entity.

  Conformance requires evidence of lost desmosomal adhesion - acantholysis,
  reduced or malformed desmosomes, or intermediate filament retraction from the
  plaque. Expression of a desmosomal gene in the affected tissue is not
  sufficient.
pathophysiology:
- name: Desmosomal Component Loss or Blockade
  description: >-
    A structural component of the desmosome becomes unavailable to the junction.
    It may be absent because the gene encoding it carries a loss-of-function
    variant, functionally blocked because autoantibody has bound its adhesive
    ectodomain, or unable to be assembled because the calcium compartmentalization
    required for its processing has failed.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:9887343
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified mutation, resulting in a null allele and haploinsufficiency, was observed in genomic DNA from a kindred with the dominantly inherited skin disorder, striate palmoplantar keratoderma.
    explanation: >-
      Documents the structural-gene route, and specifically that reduced dosage
      of one desmosomal plaque protein is by itself sufficient to cause disease.
  - reference: PMID:10767338
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrates that defects in ATP2C1 cause HHD and together with the recent identification of ATP2A2 as the defective gene in Darier's disease, provide further evidence of the critical role of Ca(2+)signaling in maintaining epidermal integrity.
    explanation: >-
      Documents the calcium-handling route into this module and establishes that
      the two calcium pumps converge on the same epidermal-integrity endpoint.
  downstream:
  - target: Failure of Desmosome Assembly and Intermediate Filament Anchorage
    description: >-
      Without an available component, desmosomes are reduced in number or size
      and the intermediate filament network is no longer tethered to the plaque.

- name: Failure of Desmosome Assembly and Intermediate Filament Anchorage
  description: >-
    Desmosomes are assembled in reduced numbers, are structurally abnormal, or
    lose their cytoskeletal connection. The plakin-family plaque proteins,
    desmoplakin foremost among them, are what link the intermediate filament
    network to the junctional membrane, so their loss uncouples the cytoskeleton
    from the adhesive surface even when cadherins are present. The junction is
    then no longer a load-bearing element of the tissue.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: desmosome organization
    term:
      id: GO:0002934
      label: desmosome organization
    modifier: ABNORMAL
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:11063735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry of skin from the patients showed a perinuclear localization of keratin in suprabasal keratinocytes, suggesting a collapsed intermediate filament network. This study demonstrates the importance of desmoplakin in the attachment of intermediate filaments to the desmosome.
    explanation: >-
      Demonstrates this node directly in patient tissue: loss of the desmoplakin
      tail retracts the keratin network to the perinuclear region, establishing
      that desmoplakin is what attaches intermediate filaments to the desmosome.
  - reference: PMID:9887343
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Desmoplakin, a constitutive component of the desmosomal plaque, is the most abundant protein present in such junctions and plays a critical role in linking the intermediate filament network to the plasma membrane in these tissues.
    explanation: >-
      Establishes the anchorage function whose loss defines this node.
  downstream:
  - target: Loss of Desmosomal Intercellular Adhesion
    description: >-
      Junctions that are absent, malformed, or uncoupled from the cytoskeleton
      cannot hold adjacent cells together under load.

- name: Loss of Desmosomal Intercellular Adhesion
  description: >-
    Adjacent cells lose the high-tensile adhesion desmosomes provide. This is
    the rate-limiting, disorder-agnostic node of the module: the structural,
    autoimmune, and calcium-handling routes all converge here, and conformance
    should be declared against it.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:10902626
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This protein is a key component of desmosomes and adherens junctions, and is important for the tight adhesion of many cell types, including those in the heart and skin.
    explanation: >-
      States the adhesive function lost at this node and, critically for this
      module, that the same junction serves both heart and skin.
  - reference: PMID:10878487
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antibody (Ab) binding interferes with the adhesive function of these molecules, leading to detachment and subsequently blister formation.
    explanation: >-
      Shows the autoantibody route reaching this same node, supporting the claim
      that the acquired and inherited diseases share a convergence point.
  downstream:
  - target: Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues
    description: >-
      Cells separate from their neighbours under the mechanical load their tissue
      normally carries.

- name: Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues
  description: >-
    Cells detach from one another in whichever desmosome-dependent tissue is
    affected. In epidermis this is acantholysis - suprabasal separation producing
    blisters, erosions, or the acantholytic dyskeratosis of Darier disease - and
    the palmoplantar epidermis, which bears the greatest shear, responds with
    keratoderma. In the hair shaft it yields a structurally abnormal woolly or
    fragile hair. In myocardium, myocyte detachment at the intercalated disc
    permits cell death and fibrofatty replacement, the substrate for
    arrhythmogenic cardiomyopathy.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte

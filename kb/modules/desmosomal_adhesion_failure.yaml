  evidence:
  - reference: PMID:10080178
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Darier disease (DD) is an autosomal-dominant skin disorder characterized by loss of adhesion between epidermal cells (acantholysis) and abnormal keratinization.
    explanation: >-
      Documents the epidermal instance of this node, reached through the
      calcium-handling route.
  - reference: PMID:10767338
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hailey-Hailey disease (HHD) is an autosomal dominant skin disorder characterized by suprabasal cell separation (acantholysis) of the epidermis.
    explanation: >-
      Documents the same epidermal endpoint through the second calcium pump,
      supporting the convergence rather than a gene-specific effect.
  downstream:
  - target: Cutaneous, Appendageal and Cardiac Manifestations
    description: >-
      Tissue-level adhesion failure produces the organ-level syndrome, whose
      composition depends on where the affected component is expressed.

- name: Cutaneous, Appendageal and Cardiac Manifestations
  description: >-
    The organ-level endpoint. Cutaneously this ranges from focal or striate
    palmoplantar keratoderma through generalized acantholytic blistering; the
    hair may be woolly or fragile; and where the affected component is also
    expressed in myocardium the syndrome includes cardiomyopathy with
    ventricular arrhythmia and a risk of sudden death that can substantially
    precede any cardiac symptom. The cardiac arm is the reason a dermatological
    diagnosis in this group carries a cardiological obligation.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:

      id: UBERON:0002097
      label: skin of body
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  evidence:
  - reference: PMID:11063735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe the first recessive human mutation, 7901delG, in the desmoplakin gene which causes a generalized striate keratoderma particularly affecting the palmoplantar epidermis, woolly hair and a dilated left ventricular cardiomyopathy.
    explanation: >-
      Documents the full three-organ cardiocutaneous endpoint arising from a
      single desmosomal lesion.
  - reference: PMID:11063735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A number of the patients with this syndromic disorder suffer heart failure in their teenage years, resulting in early morbidity.
    explanation: >-
      Establishes that the cardiac arm, not the cutaneous one, carries the
      morbidity burden, which is why conforming entries must not treat the skin
      findings as the whole disease.

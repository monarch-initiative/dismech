name: Bacterial Protein Synthesis Inhibition Module
description: >-
  A conserved antibacterial drug-mechanism module representing bacterial mRNA
  translation by the 70S ribosome — the second major antibiotic target after the
  cell wall. Multiple antibiotic classes inhibit distinct steps: aminoglycosides
  and tetracyclines act on the 30S subunit (decoding/A-site tRNA), while
  macrolides, lincosamides (clindamycin), chloramphenicol, and oxazolidinones
  (linezolid) act on the 50S subunit (peptidyl transferase centre and polypeptide
  exit tunnel). Most are bacteriostatic (translational arrest), but
  aminoglycosides are bactericidal because they corrupt decoding and so deliver
  mistranslated protein rather than withholding protein; secondary membrane
  damage has long been proposed as a further contribution but is not what the
  consequence node here asserts. Separately, two organism groups defeat the
  module with no resistance determinant at all — strict anaerobes cannot import
  aminoglycosides, and the Gram-negative outer membrane excludes macrolides —
  which the intrinsic-resistance node carries because it constrains empiric
  choice before an isolate exists. A clinically important consequence distinct from killing is suppression
  of toxin and exoprotein synthesis: protein-synthesis inhibitors such as
  clindamycin and linezolid shut off production of secreted toxins even at the
  high bacterial densities where beta-lactams lose efficacy (the inoculum/Eagle
  effect), which is why they are added in toxin-mediated streptococcal and
  staphylococcal disease. This module defines the mechanism-of-action design
  pattern for ribosome-targeting treatments: conforming entries link a treatment
  to the node it inhibits via target_mechanisms.
category: Module
module_categories:
- PHARMACOLOGY
- INFECTIOUS_DISEASE
creation_date: "2026-06-20T00:00:00Z"
notes: >-
  This is an antibacterial drug-mechanism module, not a specific disease.
  Disorder entries reference individual nodes via conforms_to (e.g.,
  "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
  Ribosome"), and their ribosome-targeting treatments point at the inhibited node
  via target_mechanisms. Two key conformance / treatment targets: "Bacterial mRNA
  Translation by the Ribosome" (the shared ribosomal target of tetracyclines,
  macrolides, aminoglycosides, lincosamides, chloramphenicol, oxazolidinones) and
  "Suppression of Toxin and Exoprotein Synthesis" (the adjunctive anti-toxin
  rationale for clindamycin/linezolid in toxin-mediated disease). Nodes are
  druggable steps, not individual drugs.
pathophysiology:
- name: Bacterial mRNA Translation by the Ribosome
  description: >-
    The bacterial 70S ribosome translates mRNA into protein through decoding at
    the 30S subunit and peptide-bond formation at the 50S peptidyl transferase
    centre. This essential process is the second major antibiotic target after
    the cell wall. Drug classes bind distinct sites: aminoglycosides and
    tetracyclines act on the 30S (aminoglycosides cause misreading and are
    bactericidal; tetracyclines block A-site tRNA and are bacteriostatic), while
    macrolides, lincosamides (clindamycin), chloramphenicol, and oxazolidinones
    (linezolid) act on the 50S. Bacterial ribosomes differ enough from the
    eukaryotic 80S ribosome to give these drugs selective toxicity.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review establishing the bacterial ribosome as a principal antibiotic
      target, the step this node represents. Evidence source is OTHER as this is
      a review article.
  downstream:
  - target: Loss of Proteome Supply and Translational Fidelity
    description: >-
      The two outcomes available at this target are different drugs' mechanisms,
      not degrees of the same one: blocking elongation withholds protein, while
      promoting misreading delivers protein that is wrong.
  - target: Suppression of Toxin and Exoprotein Synthesis
    description: >-
      Inhibiting translation also halts synthesis of secreted toxins and
      exoproteins, an effect exploited adjunctively in toxin-mediated disease.
  - target: Ribosomal Target Resistance
    description: >-
      Bacteria protect the ribosomal target from these drugs, escaping
      protein-synthesis inhibition.
  - target: Intrinsic Inaccessibility of the Ribosomal Target
    description: >-
      Some organisms never expose this target to the drug at all, independently
      of any resistance determinant they carry.

- name: Suppression of Toxin and Exoprotein Synthesis
  description: >-
    Because secreted toxins and virulence exoproteins are themselves translated
    products, ribosome-targeting drugs shut off their production independently of
    bacterial killing. Clindamycin and linezolid retain this anti-toxin effect at
    high bacterial densities and in stationary phase, where beta-lactams lose
    efficacy (the inoculum/Eagle effect). This is the mechanistic basis for adding
    a protein-synthesis inhibitor to a beta-lactam in toxin-driven streptococcal
    toxic shock, necrotizing soft-tissue infection, and staphylococcal toxic
    shock — the bactericidal agent clears the organism while the ribosomal agent
    silences toxin output.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  evidence:
  - reference: PMID:17101685
    reference_title: "Growth phase-dependent effect of clindamycin on production of exoproteins by Streptococcus pyogenes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      clindamycin has great efficacy against the production of bacterial
      exoproteins
    explanation: >-
      Study of Streptococcus pyogenes exoprotein production confirming that the
      protein-synthesis inhibitor clindamycin suppresses bacterial exoprotein
      (toxin) synthesis. Evidence source is IN_VITRO (bacterial culture/exoprotein
      assay).

- name: Loss of Proteome Supply and Translational Fidelity
  description: >-
    Downstream of the ribosome the drug classes split, and the split is what
    decides whether an agent is bacteriostatic or bactericidal. Tetracyclines,
    macrolides, lincosamides, chloramphenicol and the oxazolidinones withhold
    peptide: elongation stops, the proteome is not replenished, and growth
    halts while the existing proteome persists, which is reversible on drug
    removal. The aminoglycosides instead corrupt decoding — they stabilise the
    flipped-out conformation of the 16S decoding bases A1492 and A1493, so near-
    and non-cognate tRNAs are accepted and the cell synthesises mistranslated
    protein. Delivering defective protein is not the same lesion as delivering
    none, and it is the reason this one 30S class kills rather than arrests.
    Selectivity has the same structural basis at this step: the decoding
    nucleotide that aminoglycosides exploit differs in the human cytosolic
    ribosome, so the drug has no equivalent effect there.
  role: consequence
  biological_processes:
  - preferred_term: Regulation of translational fidelity
    term:
      id: GO:0006450
      label: regulation of translational fidelity
    modifier: DECREASED
  - preferred_term: Bacterial growth
    term:
      id: GO:0040007
      label: growth
    modifier: DECREASED
  evidence:
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These drugs favor the flipped-out conformation of A1492 and A1493, and
      thereby increase miscoding by stimulating the binding of near- and
      non-cognate tRNAs in the A site.
    explanation: >-
      Gives the structural basis for this node's fidelity arm, which is what
      separates the bactericidal aminoglycosides from the classes that only
      withhold peptide. Graded OTHER as the source is a review.
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Notably, G1408 normally exist in human cytosolic ribosomes, explaining why
      aminoglycosides are inactive against human ribosomes and rationalizing
      their specificity for bacteria.
    explanation: >-
      Supports the selectivity claim at the end of this node, and locates it in
      the same decoding site the fidelity arm acts on rather than in a general
      appeal to 70S-versus-80S difference.
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Chloramphenicol is one such antibiotic which inhibits translation in a
      wide range of gram-positive and gram-negative bacteria as well as in
      mitochondria, but not in the cytoplasm of eukaryotic cells.
    explanation: >-
      Supports the peptide-withholding arm across both Gram classes, and records
      the one host compartment where selectivity does not hold — the
      mitochondrial ribosome is bacterial in ancestry, which is the mechanistic
      basis of chloramphenicol marrow toxicity.
  downstream:
  - target: Ribosomal Target Resistance
    description: >-
      A methylated, mutated or protected ribosome keeps elongating accurately, so
      neither the peptide deficit nor the misreading is produced.

- name: Intrinsic Inaccessibility of the Ribosomal Target
  description: >-
    Two organism groups defeat this module without carrying any resistance
    determinant, because the drug never reaches the ribosome. Aminoglycoside
    uptake is driven by the proton-motive force generated by oxidative
    metabolism, so strict anaerobes do not import the drug and are uniformly
    unaffected by it — which is why an aminoglycoside is not an option in
    anaerobic infection however susceptible the ribosome itself would be.
    Separately, the Gram-negative outer membrane excludes the hydrophobic
    macrolides. Both are properties of the organism rather than acquired traits,
    so they are not susceptibility-testable in the way the resistance node's
    determinants are, and they constrain empiric choice before any isolate is
    available.
  role: intrinsic_resistance
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anaerobic bacteria are naturally resistant to aminoglycosides because the
      transport of aminoglycosides into the cell is driven by energy produced by
      oxidative metabolism, which these bacteria cannot perform.
    explanation: >-
      States the anaerobe arm of this node and its mechanism, uptake rather than
      target alteration, which is what makes it intrinsic rather than acquired.
  - reference: PMID:29570352
    reference_title: "Ribosome-Targeting Antibiotics: Modes of Action, Mechanisms of Resistance, and Implications for Drug Design."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For example, Gram-negative bacteria are resistant to macrolides because the
      hydrophobic nature of macrolides prevents them from penetrating their outer
      membranes.
    explanation: >-
      States the second arm, outer-membrane exclusion of macrolides, in the same
      permeability terms.

- name: Ribosomal Target Resistance
  description: >-
    Bacteria acquire resistance to ribosome-targeting drugs by modifying or
    protecting the target: methylation of 23S rRNA by erm methyltransferases
    confers macrolide-lincosamide-streptogramin B (MLSb) resistance, ribosomal
    protein/rRNA mutations and ribosomal protection proteins block tetracyclines,
    and aminoglycoside-modifying enzymes inactivate aminoglycosides. Efflux pumps
    remove several classes. This node explains why a ribosome-active agent can
    fail against a specific organism and why inducible clindamycin resistance
    must be excluded before relying on clindamycin's anti-toxin effect.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the molecular mechanisms of bacterial resistance
    explanation: >-
      The review covers the molecular mechanisms by which bacteria resist
      ribosome-targeting antibiotics (rRNA methylation, target mutation, drug
      modification). Evidence source is OTHER as this is a review article.

name: Genome Instability and Mutation Module
description: >-
  A conserved mechanism module for the enabling characteristic of cancer
  (Hanahan & Weinberg): genome instability and mutation. Genome instability
  is the engine that generates the genetic diversity upon which selection
  acts during tumor evolution, accelerating acquisition of every hallmark
  capability. The conserved causal chain runs from an initiating insult that
  compromises genome integrity - inactivation of a "caretaker"
  genome-maintenance gene (mismatch repair, homologous recombination/BRCA,
  nucleotide-excision repair) and/or oncogene-induced DNA replication stress
  - through failure of DNA-damage surveillance and repair (frequently
  compounded by loss of the p53 and ATM/ATR checkpoint barriers), to an
  elevated mutation rate and chromosomal instability (the mutator
  phenotype). The resulting heritable diversity (point mutations,
  copy-number changes, aneuploidy, structural rearrangements) fuels clonal
  evolution and the stepwise acquisition of hallmark traits. Individual
  disorder entries declare conformance via conforms_to, substituting the
  tumor-type-specific caretaker lesion (e.g., MMR loss/microsatellite
  instability in Lynch syndrome, BRCA1/2 loss in HBOC, oncogene-induced
  replication stress in TP53/ATM-mutant sporadic cancers). The specific
  HRR/BRCA-deficiency therapeutic vulnerability is detailed in
  dna_repair_synthetic_lethality. The chain also carries the immunological
  consequence of the mutator phenotype, which is not covered by that module and
  is the one place where this hallmark's engine is itself a therapeutic
  opening: a hypermutated genome presents mutant peptides, and PD-1 blockade in
  mismatch-repair-deficient cancers works regardless of tissue of origin. That
  node carries its own scope limit, because the generalisation to mutational
  burden alone does not hold across tumour types.
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "genome_instability_mutation#Mutator Phenotype and Chromosomal
  Instability"). The module defines the expected pathophysiology structure;
  conforming nodes in disorder files should include the corresponding
  biological processes and causal edges, specialized to their tumor context.
  Key tumor-specific substitutions: Lynch syndrome uses mismatch-repair loss
  producing microsatellite instability and hypermutation; HBOC uses
  BRCA1/2-driven HRR deficiency; many sporadic cancers use oncogene-induced
  replication stress with TP53/ATM loss. The synthetic-lethal therapeutic
  exploitation of HRR deficiency (PARP inhibitors, platinum) is captured in
  dna_repair_synthetic_lethality. Key conformance target:
  "genome_instability_mutation#Mutator Phenotype and Chromosomal
  Instability". An entry whose instability arises from a defined
  repair-pathway defect may also conform to "Neoantigen Load and
  Checkpoint-Blockade Sensitivity"; one claiming it from a high mutation count
  alone should not, and the node says why. "Accelerated Clonal Evolution" is
  deliberately left with no ontology-bound process - subclonal selection is a
  population-level phenomenon that GO's biological-process branch does not
  name - so it reads as anchor_no_process in just check-conformance-content by
  design rather than by omission.
pathophysiology:
- name: Genome-Maintenance Defect or Replication Stress
  description: >-
    Genome integrity is compromised by either inactivation of a caretaker
    genome-maintenance pathway (DNA mismatch repair, homologous-recombination
    repair/BRCA, nucleotide- or base-excision repair) or by
    oncogene-induced DNA replication stress, in which deregulated
    proliferative signaling forces aberrant origin firing and
    replication-fork collapse. Either insult increases the burden of unrepaired DNA
    lesions.
  role: trigger
  biological_processes:
  - preferred_term: DNA Repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  - preferred_term: DNA Replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20177397
    reference_title: "Genomic instability--an evolving hallmark of cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In hereditary cancers, genomic instability results from mutations in
      DNA repair genes and drives cancer development, as predicted by the
      mutator hypothesis.
    explanation: >-
      Establishes DNA-repair-gene defects as a source of genomic instability
      that drives cancer, the trigger of this module. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: Failure of DNA Damage Surveillance and Repair

- name: Failure of DNA Damage Surveillance and Repair
  description: >-
    Accumulating DNA lesions are normally detected by the DNA-damage
    response (ATM/ATR-CHK signaling) and either repaired or, if irreparable,
    routed to p53-dependent arrest, senescence, or apoptosis. When repair is
    deficient and/or the checkpoint barrier is itself disabled (TP53, ATM,
    or CDKN2A loss), damaged cells continue to divide and propagate their
    lesions instead of being eliminated.
  role: effector
  biological_processes:
  - preferred_term: DNA Integrity Checkpoint Signaling
    term:
      id: GO:0031570
      label: DNA integrity checkpoint signaling
    modifier: DECREASED
  - preferred_term: DNA Damage Response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20177397
    reference_title: "Genomic instability--an evolving hallmark of cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the mutation patterns of the tumour suppressor TP53 (which encodes
      p53), ataxia telangiectasia mutated (ATM) and cyclin-dependent kinase
      inhibitor 2A (CDKN2A; which encodes p16INK4A and p14ARF) support the
      oncogene-induced DNA replication stress model
    explanation: >-
      Links loss of the TP53/ATM/CDKN2A checkpoint barrier to
      oncogene-induced replication stress and genomic instability, the failure
      modeled in this node. Evidence source is OTHER because this is a review
      article.
  downstream:
  - target: Mutator Phenotype and Chromosomal Instability

- name: Mutator Phenotype and Chromosomal Instability
  description: >-
    The combination of defective repair and failed surveillance yields an
    elevated, heritable rate of genomic alteration - the mutator phenotype.
    Depending on the underlying defect this manifests as a hypermutated /
    microsatellite-unstable genome (MMR loss), a
    homologous-recombination-deficiency mutational signature (BRCA loss), or
    chromosomal instability with aneuploidy and structural rearrangements
    (replication stress, checkpoint loss). This is the conserved central node
    that disorder-specific caretaker lesions converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: DNA Repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:20177397
    reference_title: "Genomic instability--an evolving hallmark of cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genomic instability is a characteristic of most cancers.
    explanation: >-
      States that genomic instability is a characteristic of most cancers,
      the central effector (mutator phenotype/chromosomal instability)
      modeled here. Evidence source is OTHER because this is a review
      article.
  - reference: PMID:28596308
    reference_title: "Mismatch repair deficiency predicts response of solid tumors to PD-1 blockade."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The genomes of cancers deficient in mismatch repair contain exceptionally
      high numbers of somatic mutations.
    explanation: >-
      Quantifies one of the three forms this node takes - the hypermutated
      genome of mismatch-repair loss - in human tumours rather than from a
      review's summary. Recorded as BACKGROUND because the sentence is the
      paper's statement of established fact, not the result it reports.
  downstream:
  - target: Accelerated Clonal Evolution
  - target: Neoantigen Load and Checkpoint-Blockade Sensitivity
    description: >-
      The same mutation burden that fuels clonal evolution also makes the
      tumour's proteome foreign, so this hallmark's engine is simultaneously a
      therapeutic opening.

- name: Accelerated Clonal Evolution
  description: >-
    The heritable genetic diversity generated by the mutator phenotype
    provides the substrate for Darwinian selection within the tumor.
    Variant subclones bearing advantageous alterations are selected and
    expand, accelerating the stepwise acquisition of the other hallmark
    capabilities (proliferative signaling, growth-suppressor evasion,
    immortality, invasion) and driving intratumoral heterogeneity, therapy
    resistance, and progression. This node is deliberately left without an
    ontology-bound process: Darwinian selection among subclones within a tumour
    is a population-level phenomenon, and GO's biological-process branch
    describes processes a cell or gene product carries out, so nothing in it
    names this. An over-broad binding here would assert less than the absence
    does.
  role: consequence
  evidence:
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Underlying these hallmarks are genome instability, which generates the
      genetic diversity that expedites their acquisition, and inflammation,
      which fosters multiple hallmark functions.
    explanation: >-
      Hanahan & Weinberg define genome instability as the enabling
      characteristic that generates the genetic diversity expediting hallmark
      acquisition, the consequence modeled here. Evidence source is OTHER
      because this is a review article.

- name: Neoantigen Load and Checkpoint-Blockade Sensitivity
  description: >-
    A hypermutated genome translates mutant peptides, and a tumour presenting
    enough of them can be recognised by an endogenous T cell response that
    checkpoint blockade releases. This is the one place where the engine of
    tumour evolution is also the reason a therapy works, and it is established
    at the level of this node's upstream defect rather than at the level of
    mutation count: PD-1 blockade in mismatch-repair-deficient cancers produced
    objective responses in 53% of patients across twelve tumour types, with
    neoantigen-specific T cell clones expanding in a responder, and the result
    held regardless of tissue of origin - the first tissue-agnostic approval in
    oncology.
    The generalisation to mutational burden alone does not hold, and that
    limit belongs on this node rather than beside it. Tumour mutational burden
    predicts response only in cancers where CD8 infiltration tracks neoantigen
    load; where it does not - breast, prostate, glioma - high-burden tumours
    fail to reach a 20% response rate and do worse than low-burden ones. So a
    conforming entry may claim this vulnerability from a defined
    repair-pathway defect, and should not claim it from a high mutation count
    in a tumour type where the correlation has not been shown.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Antigen processing and presentation of mutant peptide via MHC class I
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
  - preferred_term: Immune response to tumor cell
    term:
      id: GO:0002418
      label: immune response to tumor cell
  evidence:
  - reference: PMID:28596308
    reference_title: "Mismatch repair deficiency predicts response of solid tumors to PD-1 blockade."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These data support the hypothesis that the large proportion of mutant
      neoantigens in mismatch repair-deficient cancers make them sensitive to
      immune checkpoint blockade, regardless of the cancers' tissue of origin.
    explanation: >-
      States the node, including the tissue-agnostic scope that makes it a
      property of this module's lesion rather than of any one tumour type.
  - reference: PMID:28596308
    reference_title: "Mismatch repair deficiency predicts response of solid tumors to PD-1 blockade."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Objective radiographic responses were observed in 53% of patients, and
      complete responses were achieved in 21% of patients.
    explanation: >-
      The measured effect size behind the node, in the prospective twelve-tumour
      cohort.
  - reference: PMID:28596308
    reference_title: "Mismatch repair deficiency predicts response of solid tumors to PD-1 blockade."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Functional analysis in a responding patient demonstrated rapid in vivo
      expansion of neoantigen-specific T cell clones that were reactive to
      mutant neopeptides found in the tumor.
    explanation: >-
      Supplies the mechanistic step between the genome and the response, which
      the response rate alone does not establish: the expanded T cells were
      specific for the tumour's own mutant peptides.
  - reference: PMID:33736924
    reference_title: "High tumor mutation burden fails to predict immune checkpoint blockade response across all cancer types."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our analysis failed to support application of TMB-H as a biomarker for
      treatment with ICB in all solid cancer types.
    explanation: >-
      Refutes the pan-cancer mutational-burden form of this node's claim, which
      is the form a reader would otherwise infer from the tissue-agnostic result
      above. It does not refute the node as scoped to a defined
      repair-pathway defect.
  - reference: PMID:33736924
    reference_title: "High tumor mutation burden fails to predict immune checkpoint blockade response across all cancer types."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In cancer types that showed no relationship between CD8 T-cell levels and
      neoantigen load, such as breast cancer, prostate cancer, and glioma,
      TMB-H tumors failed to achieve a 20% ORR
    explanation: >-
      Names the condition the node depends on - that CD8 infiltration tracks
      neoantigen load in that tumour type - and the cancers where it does not,
      which is what makes the preceding REFUTE a scope limit rather than a
      contradiction.

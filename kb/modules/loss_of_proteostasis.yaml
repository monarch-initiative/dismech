name: Loss of Proteostasis Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed loss of proteostasis: the age-associated decline of the protein
  homeostasis (proteostasis) network and the resulting accumulation of
  misfolded and aggregated proteins. In healthy cells a complex proteostasis
  network - molecular chaperones, the ubiquitin-proteasome system, and
  autophagy, with their regulators - coordinates protein synthesis, folding,
  conformational maintenance, and degradation. Chronic external and endogenous
  stresses erode this network's capacity during aging; as folding and clearance
  fail, non-native proteins misfold and aggregate. The aggregates (often
  beta-sheet-rich amyloid) accumulate, disproportionately burdening postmitotic
  cells such as neurons, driving proteotoxic dysfunction and the
  age-associated proteinopathies. This is the conserved core shared by the major
  neurodegenerative diseases. Individual disorder entries declare conformance
  via conforms_to on their pathophysiology nodes, substituting the
  disease-specific aggregating protein (e.g. amyloid-beta and tau in Alzheimer
  disease, alpha-synuclein in Parkinson disease, polyglutamine huntingtin in
  Huntington disease, TDP-43/SOD1 in ALS) while preserving the conserved
  network-decline -> misfolding -> aggregation -> proteotoxicity chain.
category: Module
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "loss_of_proteostasis#Misfolded-Protein Aggregation"). Conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their disease context, substituting the
  disease-specific aggregating protein and vulnerable cell type. The module is
  intentionally kept lean: it captures the conserved proteostasis-network
  decline and its convergence on protein aggregation and proteotoxicity, but
  deliberately does NOT embed disease-specific aggregate species, seeding/prion
  spread models, or contested cell-non-autonomous theories, which belong on the
  relevant disorder entry. Complements deregulated_nutrient_sensing (mTORC1
  suppression of autophagy is one contributor to failing clearance) and
  cellular_senescence. It is distinct from
  tsr_o_glycosylation_quality_control: that module recognizes correctly folded
  TSR domains and stabilizes their secretion, rather than modeling declining
  clearance capacity and accumulation of misfolded proteins. Key conformance target:
  "loss_of_proteostasis#Misfolded-Protein Aggregation".
pathophysiology:
- name: Proteostasis Network Decline
  description: >-
    The proteostasis network - molecular chaperones, the ubiquitin-proteasome
    system, and the autophagy-lysosome pathway, together with their regulators -
    normally maintains proteome integrity by coordinating folding,
    conformational maintenance, and degradation. Chronic external and endogenous
    stresses that accumulate during aging erode the capacity of this network,
    the initiating lesion of the hallmark.
  role: trigger
  biological_processes:
  - preferred_term: Protein Folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  - preferred_term: Proteasome-Mediated Ubiquitin-Dependent Protein Catabolism
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  - preferred_term: Macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:30733602
    reference_title: "The proteostasis network and its decline in ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In healthy cells, a complex proteostasis network, comprising molecular
      chaperones and proteolytic machineries and their regulators, operates to
      ensure the maintenance of proteostasis.
    explanation: >-
      Defines the proteostasis network of chaperones and proteolytic machineries
      whose decline is the trigger modeled here. Evidence source is OTHER because
      this is a review.
  - reference: PMID:30733602
    reference_title: "The proteostasis network and its decline in ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These stresses lead to the decline of proteostasis network capacity and
      proteome integrity.
    explanation: >-
      States that accumulated stresses decline proteostasis network capacity, the
      initiating lesion of this module. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Loss of Proteostasis
- name: Loss of Proteostasis
  description: >-
    As the network's folding and clearance capacity falls below demand,
    protein homeostasis is lost: the cell can no longer keep its proteome
    correctly folded and turned over. This age-associated collapse of
    proteostatic control is the central effector state and is a common feature
    of aging and age-related disease across tissues.
  role: central_effector
  biological_processes:
  - preferred_term: Protein Folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  evidence:
  - reference: PMID:25784053
    reference_title: "The biology of proteostasis in aging and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Loss of protein homeostasis (proteostasis) is a common feature of aging
      and disease that is characterized by the appearance of nonnative protein
      aggregates in various tissues.
    explanation: >-
      Establishes loss of proteostasis as a common feature of aging characterized
      by aggregate appearance, the central effector modeled here. Evidence source
      is OTHER because this is a review.
  - reference: PMID:29127110
    reference_title: "Pathways of cellular proteostasis in aging and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now clear that the capacity of cells to maintain proteostasis
      undergoes a decline during aging, rendering the organism susceptible to
      these pathologies.
    explanation: >-
      States that proteostatic capacity declines during aging and predisposes to
      disease, supporting this node. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Misfolded-Protein Aggregation
- name: Misfolded-Protein Aggregation
  description: >-
    With folding and degradation failing, non-native proteins misfold and
    self-associate into aggregates - frequently beta-sheet-rich amyloid fibrils
    and inclusion bodies. This is the conserved central node that
    disease-specific aggregating proteins (amyloid-beta, tau, alpha-synuclein,
    polyglutamine huntingtin, TDP-43) converge upon; conforming disorder nodes
    substitute their particular aggregate species.
  role: effector
  evidence:
  - reference: PMID:25784053
    reference_title: "The biology of proteostasis in aging and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Protein aggregation is routinely suppressed by the proteostasis network
      (PN), a collection of macromolecular machines that operate in diverse ways
      to maintain proteome integrity across subcellular compartments and between
      tissues to ensure a healthy life span.
    explanation: >-
      Establishes that the proteostasis network normally suppresses aggregation,
      so its decline permits the aggregation modeled here. Evidence source is
      OTHER because this is a review.
  - reference: PMID:15272267
    reference_title: "Protein aggregation and neurodegenerative disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The aggregates usually consist of fibers containing misfolded protein with
      a beta-sheet conformation, termed amyloid.
    explanation: >-
      Describes the beta-sheet amyloid character of the misfolded-protein
      aggregates modeled in this node. Evidence source is OTHER because this is a
      review.
  - reference: PMID:38753231
    reference_title: "Amyloid β accelerates age-related proteome-wide protein insolubility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Specifically, we uncovered that Aβ expression drives proteome-wide protein
      insolubility in C. elegans, even in young animals, and this insoluble
      proteome is highly similar to the insoluble proteome driven by normal
      aging, this vulnerable sub-proteome we term the core insoluble proteome
      (CIP).
    explanation: >-
      Unbiased proteomics showing that a single disease-specific aggregating
      species (amyloid-beta) drives insolubility across the whole proteome,
      converging on the same vulnerable sub-proteome that normal aging produces.
      This supports the module's claim that aggregation is a conserved node onto
      which disease-specific species converge, rather than a set of
      protein-specific events. Bridges this module to amyloidogenesis. Evidence
      source is MODEL_ORGANISM because the insolubility arises in live
      transgenic C. elegans; the proteomics is performed on lysates from those
      animals rather than on cultured cells.
  downstream:
  - target: Proteotoxic Cell Dysfunction and Neurodegeneration
- name: Proteotoxic Cell Dysfunction and Neurodegeneration
  description: >-
    Accumulating misfolded and aggregated proteins are proteotoxic, especially
    to long-lived postmitotic cells such as neurons that cannot dilute the
    burden by division. The resulting cellular dysfunction and death underlies
    the age-associated proteinopathies, most prominently the neurodegenerative
    diseases. The specific clinical phenotype is supplied by the conforming
    disorder.
  role: consequence
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30733602
    reference_title: "The proteostasis network and its decline in ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The resulting accumulation of misfolded and aggregated proteins affects,
      in particular, postmitotic cell types such as neurons
    explanation: >-
      States that aggregated proteins disproportionately affect postmitotic
      neurons, the vulnerable cell type in this consequence node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:32831297
    reference_title: "Quantification of Insoluble Protein Aggregation in Caenorhabditis elegans during Aging with a Novel Data-Independent Acquisition Workflow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knocking down genes encoding the insoluble proteins over 40% of the time
      results in an extension of the lifespan in C. elegans, suggesting that
      many of these proteins are key determinants of the aging process.
    explanation: >-
      Supports the causal direction of this node rather than the correlation:
      removing the proteins that become insoluble with age extends lifespan in a
      large fraction of cases, so age-associated insolubility is a driver of
      decline and not only a marker of it. Note the source is a methods paper
      for the insoluble-proteome (insolublome) workflow, and the 40% figure is
      cited there as established background. Evidence source is MODEL_ORGANISM
      (C. elegans knockdown lifespan assays).
  - reference: PMID:15272267
    reference_title: "Protein aggregation and neurodegenerative disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurodegenerative diseases such as Alzheimer's disease (AD), Parkinson's
      disease (PD), Huntington's disease (HD), amyotrophic lateral sclerosis
      (ALS) and prion diseases are increasingly being realized to have common
      cellular and molecular mechanisms including protein aggregation and
      inclusion body formation.
    explanation: >-
      Establishes that the major neurodegenerative diseases share protein
      aggregation as a common mechanism, the conserved consequence this module
      captures. Evidence source is OTHER because this is a review.
biochemical:
- name: Plasma phosphorylated tau 217
  presence: INCREASED
  biomarker_term:
    preferred_term: phosphorylated tau 217 measurement
    term:
      id: NCIT:C202389
      label: Phosphorylated Tau Protein 217 Measurement
  notes: >-
    Plasma p-tau217 is the most consequential recent advance in blood biomarkers of
    protein aggregation, reaching accuracy comparable to CSF and PET measures for
    Alzheimer disease. Its scope in this module is narrow and should stay that way:
    it reports one specific aggregating protein in one disease, not proteostatic
    capacity in general. It is curated here because Misfolded-Protein Aggregation is
    the node it directly measures, and because it is the clearest available evidence
    that aggregation is measurable from blood at all. The discussions block records
    why this does not generalize to the module as a whole.
  evidence:
  - reference: PMID:32722745
    reference_title: "Discriminative Accuracy of Plasma Phospho-tau217 for Alzheimer Disease vs Other Neurodegenerative Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Among 1402 participants from 3 selected cohorts, plasma P-tau217 discriminated
      AD from other neurodegenerative diseases, with significantly higher accuracy
      than established plasma- and MRI-based biomarkers, and its performance was not
      significantly different from key CSF- or PET-based measures.
    explanation: >-
      Establishes plasma p-tau217 as an accurate blood readout of Alzheimer-type
      protein pathology, benchmarked against CSF and imaging standards.
  readouts:
  - target: Misfolded-Protein Aggregation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Plasma p-tau217 reports tau aggregation pathology specifically. It is a readout
      of one instance of the node, not of the node in general: a normal value says
      nothing about alpha-synuclein, TDP-43, or transthyretin aggregation.
    evidence:
    - reference: PMID:32722745
      reference_title: "Discriminative Accuracy of Plasma Phospho-tau217 for Alzheimer Disease vs Other Neurodegenerative Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Further research is needed to optimize the assay, validate the findings in
        unselected and diverse populations, and determine its potential role in
        clinical care.
      explanation: >-
        The authors' own scoping caveat, recorded because it bounds the population in
        which this readout has been shown to work.
discussions:
- discussion_id: knowledge_gap_no_general_proteostasis_capacity_biomarker
  prompt: >-
    Can proteostatic capacity be measured in humans, as opposed to measuring the
    specific proteins that have already aggregated?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#
  - pathophysiology#Proteostasis Network Decline
  - pathophysiology#Loss of Proteostasis
  rationale: >-
    The one marker curated in this module attaches to the third node in the chain,
    Misfolded-Protein Aggregation, and to one aggregating protein within it. The two
    upstream nodes, which are what the hallmark actually names, have no human
    biomarker at all. Chaperone capacity, ubiquitin-proteasome throughput and the
    heat-shock response are measurable in cells and in model organisms but not from
    an accessible human sample, so what reaches the clinic is the failure's product
    rather than the failing capacity. The practical consequence is that proteostasis
    can currently only be assessed after aggregation has occurred, which is the wrong
    end for prevention and for any trial wanting an early pharmacodynamic readout.
    A second consequence for this KB: markers that look like proteostasis markers are
    usually disease-specific aggregation markers, and importing more of them would
    make the module look better covered than it is while leaving the hallmark itself
    unmeasured.
  evidence:
  - reference: PMID:32722745
    reference_title: "Discriminative Accuracy of Plasma Phospho-tau217 for Alzheimer Disease vs Other Neurodegenerative Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      plasma P-tau217 discriminated AD from other neurodegenerative diseases
    explanation: >-
      Illustrates the pattern: the available blood readout is protein- and
      disease-specific by construction, since discriminating between aggregopathies
      is what it is built to do. A capacity marker would not behave this way.
  notes: >-
    Compare the mitochondrial_dysfunction gap on disease-validated markers imported
    into an aging module. This is the same problem one step further along: there,
    markers exist but were validated in the wrong population; here, for the upstream
    nodes, no human marker exists at all.

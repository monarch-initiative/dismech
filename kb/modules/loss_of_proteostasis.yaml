name: Loss of Proteostasis Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed loss of proteostasis: the age-associated decline of the protein
  homeostasis (proteostasis) network and the resulting accumulation of
  misfolded and aggregated proteins. In healthy cells a complex proteostasis
  network - molecular chaperones, the ubiquitin-proteasome system, and
  autophagy, with their regulators - coordinates protein synthesis, folding,
  conformational maintenance, and degradation. Chronic external and endogenous
  stresses erode this network's capacity during aging; as folding and clearance
  fail, non-native proteins misfold and aggregate. The aggregates (often
  beta-sheet-rich amyloid) accumulate, disproportionately burdening postmitotic
  cells such as neurons, driving proteotoxic dysfunction and the
  age-associated proteinopathies. This is the conserved core shared by the major
  neurodegenerative diseases. Individual disorder entries declare conformance
  via conforms_to on their pathophysiology nodes, substituting the
  disease-specific aggregating protein (e.g. amyloid-beta and tau in Alzheimer
  disease, alpha-synuclein in Parkinson disease, polyglutamine huntingtin in
  Huntington disease, TDP-43/SOD1 in ALS) while preserving the conserved
  network-decline -> misfolding -> aggregation -> proteotoxicity chain.
category: Module
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "loss_of_proteostasis#Misfolded-Protein Aggregation"). Conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their disease context, substituting the
  disease-specific aggregating protein and vulnerable cell type. The module is
  intentionally kept lean: it captures the conserved proteostasis-network
  decline and its convergence on protein aggregation and proteotoxicity, but
  deliberately does NOT embed disease-specific aggregate species, seeding/prion
  spread models, or contested cell-non-autonomous theories, which belong on the
  relevant disorder entry. Complements deregulated_nutrient_sensing (mTORC1
  suppression of autophagy is one contributor to failing clearance) and
  cellular_senescence. It is distinct from
  tsr_o_glycosylation_quality_control: that module recognizes correctly folded
  TSR domains and stabilizes their secretion, rather than modeling declining
  clearance capacity and accumulation of misfolded proteins. Key conformance target:
  "loss_of_proteostasis#Misfolded-Protein Aggregation".

  A naked mole-rat (Heterocephalus glaber) comparative negative model is
  attached under animal_models, and is the hallmark where the comparative
  evidence is longitudinal rather than only cross-species: the proteostasis
  measures that decline in aging mice do not change over two decades of naked
  mole-rat life. It is a species comparison, not a disease model, and conforming
  disorder entries do NOT inherit those links.
pathophysiology:
- name: Proteostasis Network Decline
  description: >-
    The proteostasis network - molecular chaperones, the ubiquitin-proteasome
    system, and the autophagy-lysosome pathway, together with their regulators -
    normally maintains proteome integrity by coordinating folding,
    conformational maintenance, and degradation. Chronic external and endogenous
    stresses that accumulate during aging erode the capacity of this network,
    the initiating lesion of the hallmark.
  role: trigger
  biological_processes:
  - preferred_term: Protein Folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  - preferred_term: Proteasome-Mediated Ubiquitin-Dependent Protein Catabolism
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  - preferred_term: Macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:30733602
    reference_title: "The proteostasis network and its decline in ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In healthy cells, a complex proteostasis network, comprising molecular
      chaperones and proteolytic machineries and their regulators, operates to
      ensure the maintenance of proteostasis.
    explanation: >-
      Defines the proteostasis network of chaperones and proteolytic machineries
      whose decline is the trigger modeled here. Evidence source is OTHER because
      this is a review.
  - reference: PMID:30733602
    reference_title: "The proteostasis network and its decline in ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These stresses lead to the decline of proteostasis network capacity and
      proteome integrity.
    explanation: >-
      States that accumulated stresses decline proteostasis network capacity, the
      initiating lesion of this module. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Loss of Proteostasis
- name: Loss of Proteostasis
  description: >-
    As the network's folding and clearance capacity falls below demand,
    protein homeostasis is lost: the cell can no longer keep its proteome
    correctly folded and turned over. This age-associated collapse of
    proteostatic control is the central effector state and is a common feature
    of aging and age-related disease across tissues.
  role: central_effector
  biological_processes:
  - preferred_term: Protein Folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  evidence:
  - reference: PMID:25784053
    reference_title: "The biology of proteostasis in aging and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Loss of protein homeostasis (proteostasis) is a common feature of aging
      and disease that is characterized by the appearance of nonnative protein
      aggregates in various tissues.
    explanation: >-
      Establishes loss of proteostasis as a common feature of aging characterized
      by aggregate appearance, the central effector modeled here. Evidence source
      is OTHER because this is a review.
  - reference: PMID:29127110
    reference_title: "Pathways of cellular proteostasis in aging and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now clear that the capacity of cells to maintain proteostasis
      undergoes a decline during aging, rendering the organism susceptible to
      these pathologies.
    explanation: >-
      States that proteostatic capacity declines during aging and predisposes to
      disease, supporting this node. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Misfolded-Protein Aggregation
- name: Misfolded-Protein Aggregation
  description: >-
    With folding and degradation failing, non-native proteins misfold and
    self-associate into aggregates - frequently beta-sheet-rich amyloid fibrils
    and inclusion bodies. This is the conserved central node that
    disease-specific aggregating proteins (amyloid-beta, tau, alpha-synuclein,
    polyglutamine huntingtin, TDP-43) converge upon; conforming disorder nodes
    substitute their particular aggregate species.
  role: effector
  evidence:
  - reference: PMID:25784053
    reference_title: "The biology of proteostasis in aging and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Protein aggregation is routinely suppressed by the proteostasis network
      (PN), a collection of macromolecular machines that operate in diverse ways
      to maintain proteome integrity across subcellular compartments and between
      tissues to ensure a healthy life span.
    explanation: >-
      Establishes that the proteostasis network normally suppresses aggregation,
      so its decline permits the aggregation modeled here. Evidence source is
      OTHER because this is a review.
  - reference: PMID:15272267
    reference_title: "Protein aggregation and neurodegenerative disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The aggregates usually consist of fibers containing misfolded protein with
      a beta-sheet conformation, termed amyloid.
    explanation: >-
      Describes the beta-sheet amyloid character of the misfolded-protein
      aggregates modeled in this node. Evidence source is OTHER because this is a
      review.
  - reference: PMID:38753231
    reference_title: "Amyloid β accelerates age-related proteome-wide protein insolubility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Specifically, we uncovered that Aβ expression drives proteome-wide protein
      insolubility in C. elegans, even in young animals, and this insoluble
      proteome is highly similar to the insoluble proteome driven by normal
      aging, this vulnerable sub-proteome we term the core insoluble proteome
      (CIP).
    explanation: >-
      Unbiased proteomics showing that a single disease-specific aggregating
      species (amyloid-beta) drives insolubility across the whole proteome,
      converging on the same vulnerable sub-proteome that normal aging produces.
      This supports the module's claim that aggregation is a conserved node onto
      which disease-specific species converge, rather than a set of
      protein-specific events. Bridges this module to amyloidogenesis. Evidence
      source is MODEL_ORGANISM because the insolubility arises in live
      transgenic C. elegans; the proteomics is performed on lysates from those
      animals rather than on cultured cells.
  downstream:
  - target: Proteotoxic Cell Dysfunction and Neurodegeneration
- name: Proteotoxic Cell Dysfunction and Neurodegeneration
  description: >-
    Accumulating misfolded and aggregated proteins are proteotoxic, especially
    to long-lived postmitotic cells such as neurons that cannot dilute the
    burden by division. The resulting cellular dysfunction and death underlies
    the age-associated proteinopathies, most prominently the neurodegenerative
    diseases. The specific clinical phenotype is supplied by the conforming
    disorder.
  role: consequence
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30733602
    reference_title: "The proteostasis network and its decline in ageing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The resulting accumulation of misfolded and aggregated proteins affects,
      in particular, postmitotic cell types such as neurons
    explanation: >-
      States that aggregated proteins disproportionately affect postmitotic
      neurons, the vulnerable cell type in this consequence node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:32831297
    reference_title: "Quantification of Insoluble Protein Aggregation in Caenorhabditis elegans during Aging with a Novel Data-Independent Acquisition Workflow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knocking down genes encoding the insoluble proteins over 40% of the time
      results in an extension of the lifespan in C. elegans, suggesting that
      many of these proteins are key determinants of the aging process.
    explanation: >-
      Supports the causal direction of this node rather than the correlation:
      removing the proteins that become insoluble with age extends lifespan in a
      large fraction of cases, so age-associated insolubility is a driver of
      decline and not only a marker of it. Note the source is a methods paper
      for the insoluble-proteome (insolublome) workflow, and the 40% figure is
      cited there as established background. Evidence source is MODEL_ORGANISM
      (C. elegans knockdown lifespan assays).
  - reference: PMID:15272267
    reference_title: "Protein aggregation and neurodegenerative disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurodegenerative diseases such as Alzheimer's disease (AD), Parkinson's
      disease (PD), Huntington's disease (HD), amyotrophic lateral sclerosis
      (ALS) and prion diseases are increasingly being realized to have common
      cellular and molecular mechanisms including protein aggregation and
      inclusion body formation.
    explanation: >-
      Establishes that the major neurodegenerative diseases share protein
      aggregation as a common mechanism, the conserved consequence this module
      captures. Evidence source is OTHER because this is a review.
animal_models:
- name: Naked mole-rat (Heterocephalus glaber) comparative longevity model
  species: Naked mole-rat
  genotype: Wild type
  publication: PMID:19223593
  description: >-
    Comparative negative model for this module, and the hallmark where the
    naked mole-rat evidence is longitudinal rather than only cross-species.
    Over two decades of life the proteostasis measures that decline in aging
    mice - cysteine oxidation, protein ubiquitination, susceptibility to
    unfolding - do not change in the naked mole-rat, while proteasome activity
    and translational fidelity are higher than in the mouse. The model is
    curated here to mark the step this species holds constant, not as a model
    of a disease.
  modeled_mechanisms:
  - target: Proteostasis Network Decline
    relationship: FAILS_TO_RECAPITULATE
    fidelity: HIGH
    description: >-
      The initiating lesion of this module - erosion of chaperone,
      ubiquitin-proteasome and autophagy capacity with age - is not observed.
      Young naked mole-rats already show less urea-induced unfolding, less
      ubiquitination and higher proteasome activity than young mice, and none
      of these measures shifts significantly between 2 and more than 24 years
      of age.
    limitations: >-
      The longitudinal comparison is liver-focused and rests on one laboratory's
      colony, with mice sampled at 6 and 28 months as the physiologically
      age-matched comparator; other tissues, and the chaperone arm of the
      network, are covered only by the cross-species survey. That survey is a
      correlation across eight rodent species and its own authors note the
      confound: every subterranean species sampled had high proteasome
      activity and autophagy, so the association may track burrowing ecology
      rather than longevity. None of this shows that maintained proteostasis
      causes the long lifespan.
    readouts:
    - name: Proteasome activity
      target: Proteostasis Network Decline
      direction: INCREASED
      interpretation: >-
        Higher degradative capacity than the short-lived comparator, in the
        direction opposite to this node.
      evidence:
      - reference: PMID:19223593
        reference_title: "Protein stability and resistance to oxidative stress are determinants of longevity in the longest-living rodent, the naked mole-rat."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          they show less urea-induced protein unfolding, less protein
          ubiquitination, and higher proteasome activity
        explanation: >-
          The three interspecific measurements behind this readout and the
          unfolding and ubiquitination readouts below.
    - name: Age-related change in cysteine oxidation and ubiquitination
      target: Proteostasis Network Decline
      description: >-
        Reversible and irreversible cysteine oxidation states, ubiquitination
        and proteasome activity compared between naked mole-rats aged 2 and
        more than 24 years.
      direction: UNCHANGED
      interpretation: >-
        A flat trajectory over two decades is the direct negative readout for
        this node; the mouse comparator rises over the same physiological span.
      evidence:
      - reference: PMID:19223593
        reference_title: "Protein stability and resistance to oxidative stress are determinants of longevity in the longest-living rodent, the naked mole-rat."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, none of these parameters were significantly altered over
          2 decades in MRs.
        explanation: >-
          The longitudinal null result, which is what makes this a failure to
          recapitulate rather than a species baseline difference.
    evidence:
    - reference: PMID:19223593
      reference_title: "Protein stability and resistance to oxidative stress are determinants of longevity in the longest-living rodent, the naked mole-rat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Clearly MRs have markedly attenuated age-related accrual of oxidation
        damage to thiol groups
      explanation: >-
        The authors' summary of the attenuated age-related change that this
        link asserts.
    - reference: PMID:26894765
      reference_title: Determinants of rodent longevity in the chaperone-protein degradation network.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A notable exception to this trend is observed in the longest-lived
        rodent, the naked mole-rat (NMR, Heterocephalus glaber) which maintains
        proteostasis and proteasome-mediated degradation and autophagy during
        aging.
      explanation: >-
        Places the naked mole-rat explicitly as the exception to the
        age-associated decline in protein quality control that this node
        models, in a survey spanning eight rodent species.
    - reference: PMID:21993625
      reference_title: Genome sequencing reveals insights into physiology and longevity of the naked mole rat.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Although characterized by significant oxidative stress, the naked mole
        rat proteome does not show age-related susceptibility to oxidative
        damage or increased ubiquitination.
      explanation: >-
        Independent statement of the same dissociation - high oxidative input,
        no age-related proteome consequence. Graded OTHER because the sentence
        summarises the species' known biology in the paper's framing rather
        than reporting a measurement it made.
  - target: Loss of Proteostasis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The central effector state is held off partly upstream of folding and
      clearance, at protein synthesis: naked mole-rat fibroblasts translate
      with significantly higher fidelity than mouse fibroblasts at comparable
      translation rates, so fewer aberrant proteins enter the proteome that
      this node describes the cell as failing to keep correctly folded.
    limitations: >-
      Fidelity was measured in cultured fibroblasts with misincorporation
      reporters, not in tissue and not across age. The proposed structural
      explanation - a naked-mole-rat-specific 28S ribosomal RNA cleavage - is
      explicitly speculative in the source, which states it could not be
      directly tested, and no causal link from fidelity to lifespan was
      established. A lower rate of aberrant protein production is an input to
      proteostatic load, not a demonstration that proteostatic control itself
      is preserved.
    readouts:
    - name: Translational fidelity
      target: Loss of Proteostasis
      direction: INCREASED
      interpretation: >-
        Fewer mistranslated proteins made per unit of synthesis lowers the load
        that would otherwise drive this node.
      evidence:
      - reference: PMID:24082110
        reference_title: "Naked mole-rat has increased translational fidelity compared with the mouse, as well as a unique 28S ribosomal RNA cleavage."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We report that naked mole-rat fibroblasts have significantly increased
          translational fidelity despite having comparable translation rates
          with mouse fibroblasts.
        explanation: >-
          The measured fidelity difference, with translation rate controlled.
    evidence:
    - reference: PMID:24082110
      reference_title: "Naked mole-rat has increased translational fidelity compared with the mouse, as well as a unique 28S ribosomal RNA cleavage."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        our results show that naked mole-rat cells produce fewer aberrant
        proteins
      explanation: >-
        States the consequence for proteome quality that makes this species
        informative about the effector node.
- name: Aging turquoise killifish proteome (Nothobranchius furzeri)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Laboratory strains GRZ and MZM assayed across the natural lifespan; brain is
    the primary tissue, with a seven-tissue aggregation survey and a segmental
    progeria arm in the multi-tissue study.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:32558274
  description: >-
    The killifish is the workhorse vertebrate for this module because a full
    lifespan of proteostasis decline fits inside a few months, allowing paired
    transcriptome, translatome, proteome, and aggregome measurement in the same
    animals. Three studies together trace the module's chain in this model:
    proteasome activity falls early and is sufficient to induce aging proteomic
    signatures; ribosome stalling and altered translation elongation deplete
    basic-amino-acid-rich proteins; and protein aggregates accumulate in a
    strikingly tissue-specific pattern that co-sequesters the quality-control
    machinery itself.
  modeled_mechanisms:
  - target: Proteostasis Network Decline
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Both arms of the proteostasis network decline measurably with age in this
      model. Degradative capacity falls early, with reduced proteasome activity
      shown to be sufficient to induce the proteomic signature of aging; on the
      synthesis side, aging causes ribosome stalling and aberrant translation
      pausing that changes protein abundance independently of transcription.
    limitations: >-
      Most measurements are brain-focused and correlative across age groups rather
      than longitudinal within individuals. The proteasome manipulation
      establishes sufficiency for the proteomic signature, not for organismal
      aging. Teleost brain retains substantial adult neurogenesis, so the
      postmitotic burden argument transfers to human neurons only in part.
    readouts:
    - name: Proteasome activity in aging brain
      target: Proteostasis Network Decline
      description: >-
        Proteasome activity measured across age groups in killifish brain, with a
        pharmacological reduction arm testing sufficiency in vivo.
      direction: DECREASED
      interpretation: >-
        An early, causally sufficient decline in degradative capacity is the
        clearest direct evidence for the network-decline node in a vertebrate.
      evidence:
      - reference: PMID:32558274
        reference_title: Reduced proteasome activity in the aging brain results in ribosome stoichiometry loss and aggregation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mechanistically, we show that reduction of proteasome activity is an early event during brain aging and is sufficient to induce proteomic signatures of aging and loss of stoichiometry in vivo."
        explanation: Reports both the measured decline and the in vivo sufficiency test.
    - name: Ribosome stalling and translation pausing in aging brain
      target: Proteostasis Network Decline
      description: >-
        Ribosome profiling of young versus old killifish brain, read alongside
        matched transcriptome and proteome.
      direction: INCREASED
      interpretation: >-
        Elongation defects place part of the network decline on the synthesis side,
        upstream of misfolding, rather than solely on clearance.
      evidence:
      - reference: PMID:40743332
        reference_title: Altered translation elongation contributes to key hallmarks of aging in the killifish brain.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In particular, aging caused increased ribosome stalling and widespread depletion of proteins enriched in basic amino acids."
        explanation: Reports the stalling measurement and the protein classes it depletes.
    - name: Protein abundance uncoupled from transcript abundance
      target: Proteostasis Network Decline
      description: >-
        Correlation between protein and mRNA levels across the killifish lifespan.
      direction: DECREASED
      interpretation: >-
        A falling protein-mRNA correlation is the quantitative signature that
        post-transcriptional handling, not transcription, is what fails with age.
      evidence:
      - reference: PMID:32558274
        reference_title: Reduced proteasome activity in the aging brain results in ribosome stoichiometry loss and aggregation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We detected a progressive reduction in the correlation between protein and mRNA, mainly due to post-transcriptional mechanisms that account for over 40% of the age-regulated proteins."
        explanation: Quantifies the uncoupling that defines network decline in this model.
    evidence:
    - reference: PMID:32558274
      reference_title: Reduced proteasome activity in the aging brain results in ribosome stoichiometry loss and aggregation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, we show that reduction of proteasome activity is an early event during brain aging and is sufficient to induce proteomic signatures of aging and loss of stoichiometry in vivo."
      explanation: >-
        Supports treating this model as informative for the network-decline node,
        including a sufficiency test rather than correlation alone.
  - target: Misfolded-Protein Aggregation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Aggregates accumulate during normal aging in this model and have been
      profiled across seven tissues. Aggregation is tissue specific rather than a
      uniform proteome-wide drift, co-sequesters quality-control machinery, and
      preferentially involves wild-type versions of proteins whose mutant forms
      cause human disease.
    limitations: >-
      Aggregate identity is defined biochemically by insolubility rather than by
      disease-specific conformer, so these are not the seeded, strain-specific
      aggregates of a human proteinopathy. The tissue-specificity findings rest
      partly on machine-learning inference and yeast cross-validation. Whether
      aggregate burden is causal for the functional decline it accompanies is not
      established here.
    readouts:
    - name: Tissue-specific aggregate burden across seven tissues
      target: Misfolded-Protein Aggregation
      description: >-
        Systematic proteomic profiling of insoluble aggregates in seven killifish
        tissues across age, with a segmental progeria comparison arm.
      direction: INCREASED
      interpretation: >-
        Aggregation rises with age but partitions by tissue in a way not explained
        by expression level, which refines the module's node from a global to a
        tissue-conditioned claim.
      evidence:
      - reference: PMID:38810654
        reference_title: Tissue-specific landscape of protein aggregation and quality control in an aging vertebrate.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Age-dependent aggregation is strikingly tissue specific and not simply driven by protein expression differences."
        explanation: Reports the central aggregation measurement and its tissue structure.
    - name: Co-aggregation of protein quality control machinery
      target: Misfolded-Protein Aggregation
      description: >-
        Representation of chaperone and degradation-machinery components within the
        aggregated fraction of aged tissues.
      direction: INCREASED
      interpretation: >-
        Quality-control components ending up inside aggregates closes a feed-forward
        loop between the module's decline node and its aggregation node.
      evidence:
      - reference: PMID:38810654
        reference_title: Tissue-specific landscape of protein aggregation and quality control in an aging vertebrate.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Co-aggregation of protein quality control machinery during aging may further reduce proteostasis capacity, exacerbating aggregate burden."
        explanation: Reports the co-aggregation observation and the loop the authors infer from it.
    - name: Ribosome stoichiometry loss and ribosomal protein aggregation
      target: Misfolded-Protein Aggregation
      description: >-
        Stoichiometry of ribosomal and other protein complexes in aging brain, with
        aggregate enrichment measured for the same components.
      direction: ALTERED
      interpretation: >-
        Complexes losing stoichiometry and turning up in aggregates connect the
        proteasome decline directly to aggregate formation in this model.
      evidence:
      - reference: PMID:32558274
        reference_title: Reduced proteasome activity in the aging brain results in ribosome stoichiometry loss and aggregation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These changes cause a progressive loss of stoichiometry in several protein complexes, including ribosomes, which show impaired assembly/disassembly and are enriched in protein aggregates in old brains."
        explanation: Links the stoichiometry defect to measured aggregate enrichment.
    evidence:
    - reference: PMID:38810654
      reference_title: Tissue-specific landscape of protein aggregation and quality control in an aging vertebrate.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Intriguingly, many age-related protein aggregates arise in wild-type proteins that, when mutated, drive human diseases."
      explanation: >-
        Supports treating this model as informative for the aggregation node's
        relevance to human proteinopathy, since the aggregating species overlap the
        proteins whose mutant forms cause disease.
  - target: Proteotoxic Cell Dysfunction and Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model reaches the module's terminal node through a specific proposed
      route: depletion of basic-amino-acid-rich proteins, which are enriched among
      DNA and RNA binding proteins, links failing proteostasis to genome integrity
      and macromolecular biosynthesis in the aging brain.
    limitations: >-
      The unifying vulnerability is proposed by the authors rather than
      demonstrated causally, and is stated as potential. Killifish do develop
      spontaneous neurodegenerative phenotypes, but this study measures molecular
      depletion rather than neuronal loss or behavioral decline, so the step from
      protein depletion to cellular dysfunction is inferred.
    readouts:
    - name: Abundance of basic-amino-acid-enriched DNA and RNA binding proteins
      target: Proteotoxic Cell Dysfunction and Neurodegeneration
      description: >-
        Proteome-wide abundance of basic-residue-rich proteins in old versus young
        killifish brain, traced back to translation pausing.
      direction: DECREASED
      interpretation: >-
        Depletion of this protein class is the proposed convergence point tying
        proteostasis failure to genome integrity and biosynthesis.
      evidence:
      - reference: PMID:40743332
        reference_title: Altered translation elongation contributes to key hallmarks of aging in the killifish brain.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These findings uncover a potential vulnerable point in the aging brain's biology-the biogenesis of basic DNA and RNA binding proteins."
        explanation: States the depletion finding and the vulnerability the authors infer, in their own hedged terms.
    evidence:
    - reference: PMID:40743332
      reference_title: Altered translation elongation contributes to key hallmarks of aging in the killifish brain.

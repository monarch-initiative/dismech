name: Portal Hypertension Module
description: >-
  A conserved module representing the haemodynamic final common pathway by which
  chronic liver disease and hepatic vascular obstruction produce their
  life-threatening non-neoplastic complications. An increase in the resistance
  the liver offers to portal blood flow - most often from the profibrogenic,
  vasoconstricted phenotype that sinusoidal cells acquire in cirrhosis, but also
  from post-sinusoidal outflow obstruction as in Budd-Chiari syndrome, or from
  presinusoidal portal-tract fibrosis - raises portal pressure. The rise is then
  aggravated, rather than compensated, by a hyperdynamic circulatory syndrome:
  splanchnic arterial vasodilation increases portal venous inflow into an
  already high-resistance bed. Sustained portal hypertension drives
  decompression through portosystemic collaterals, of which gastro-oesophageal
  varices are the clinically decisive set, and produces the decompensating
  events that define prognosis in cirrhosis - variceal haemorrhage, ascites, and
  hepatic encephalopathy. Conforming disorder entries substitute their own route
  to increased resistance while preserving the conserved
  resistance - inflow - portal pressure - collateral - decompensation chain.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "portal_hypertension#Increased Intrahepatic Vascular Resistance"). The key
  conformance target is the central_effector node "Portal Hypertension" - the
  disorder-agnostic, rate-limiting step every conformer funnels through.

  Disorder-specific substitutions at the trigger node, following the standard
  sinusoidal anatomy: PRESINUSOIDAL resistance in congenital hepatic fibrosis,
  schistosomiasis, and non-cirrhotic portal fibrosis; SINUSOIDAL resistance in
  cirrhosis of any aetiology (alcohol-related liver disease, MASLD, chronic
  viral hepatitis, the cholangiopathies via biliary cirrhosis), which is the
  commonest route; and POSTSINUSOIDAL resistance in Budd-Chiari syndrome and
  sinusoidal obstruction syndrome, where hepatic venous outflow is obstructed.
  Prehepatic portal vein thrombosis raises portal pressure without raising
  hepatic sinusoidal pressure and therefore conforms at the portal hypertension
  node and below, not at the intrahepatic-resistance trigger.

  Scope and relationships. The module is deliberately haemodynamic: the
  fibrogenesis that produces sinusoidal resistance in cirrhosis is modelled by
  `fibrotic_response` (and, for the biliary route, by
  `cholestatic_liver_injury`, whose terminal biliary-cirrhosis node feeds this
  module's trigger), and this module picks up where those leave off.
  It is not an Xogenesis module - portosystemic collaterals arise by dilation
  and neovascularisation of pre-existing embryonic vascular channels under a
  pressure gradient, not as a discrete new pathological structure. Note the
  therapeutic asymmetry a conforming entry should preserve: nonselective
  beta-blockade acts on the splanchnic inflow arm, and no established
  pharmacotherapy reverses the intrahepatic resistance arm.
pathophysiology:
- name: Increased Intrahepatic Vascular Resistance
  description: >-
    The initiating lesion is a rise in the resistance the hepatic vasculature
    offers to portal blood flow. In cirrhosis this has both a structural
    component - fibrosis and architectural distortion - and a dynamic,
    potentially reversible component: liver sinusoidal endothelial cells lose
    their normal vasodilatory phenotype and hepatic stellate cells contract,
    raising hepatic vascular tone. The profibrogenic phenotype acquired by these
    sinusoidal cells is the initial event. In non-cirrhotic conformers the same
    node is reached instead by obstruction of hepatic venous outflow or by
    presinusoidal portal-tract fibrosis.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: liver sinusoidal endothelial cell
    term:
      id: CL:1000398
      label: endothelial cell of hepatic sinusoid
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  biological_processes:
  - preferred_term: blood vessel diameter maintenance
    term:
      id: GO:0097746
      label: blood vessel diameter maintenance
    modifier: DYSREGULATED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:38642564
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Existing knowledge indicates that the profibrogenic phenotype acquired by
      sinusoidal cells is the initial factor leading to increased hepatic
      vascular tone and fibrosis, which cause increased vascular resistance and
      portal hypertension.
    explanation: >-
      States the cellular origin of this trigger node - the profibrogenic
      sinusoidal cell phenotype - and its two consequences, raised vascular tone
      and fibrosis, both of which increase resistance. Evidence source is OTHER
      because this is a review synthesizing human and experimental vascular
      biology.
  - reference: PMID:32982109
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is increase in the intrahepatic resistances and, therefore, decrease
      in portal venous flow
    explanation: >-
      Documents the postsinusoidal route into this node, in which hepatic venous
      outflow obstruction rather than sinusoidal fibrosis raises intrahepatic
      resistance - the substitution Budd-Chiari syndrome makes. Evidence source
      is OTHER because this is a clinical review.
  downstream:
  - target: Portal Hypertension
    causal_link_type: DIRECT
    description: >-
      A rise in the resistance of the hepatic vascular bed raises the pressure
      required to drive portal blood through it.

- name: Splanchnic Vasodilation and Hyperdynamic Circulation
  description: >-
    Portal hypertension is not simply a resistance problem. Arterial
    vasodilation in the splanchnic bed, driven by excess local vasodilators,
    increases the volume of blood delivered into the portal system, while
    systemic vasodilation triggers compensatory cardiac output rise and
    sodium-retaining neurohormonal activation. This hyperdynamic circulatory
    syndrome aggravates the portal pressure produced by the resistance lesion
    and is the arm on which nonselective beta-blockade acts.
  role: amplifier
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: vasodilation
    term:
      id: GO:0042311
      label: vasodilation
    modifier: INCREASED
  - preferred_term: blood vessel diameter maintenance
    term:
      id: GO:0097746
      label: blood vessel diameter maintenance
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38642564
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Portal hypertension occurs due to increased resistance of the cirrhotic
      liver vasculature to portal blood flow and is further aggravated by the
      hyperdynamic circulatory syndrome.
    explanation: >-
      Establishes the two-arm structure of the module: the resistance trigger
      plus this hyperdynamic inflow amplifier, which aggravates rather than
      compensates the pressure rise. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Portal Hypertension
    causal_link_type: DIRECT
    description: >-
      Increased splanchnic inflow into a high-resistance hepatic bed raises
      portal pressure further.

- name: Portal Hypertension
  description: >-
    Sustained elevation of pressure in the portal venous system, measured
    clinically as the hepatic venous pressure gradient. This is the
    disorder-agnostic, rate-limiting node of the module: every conformer,
    whatever its route to increased resistance, funnels through it, and every
    downstream complication in this module is a consequence of it rather than of
    the underlying liver disease directly. It is the primary non-neoplastic
    complication of cirrhosis and has few pharmacological treatment options.
  role: central_effector
  biological_scale: ORGANISM
  notes: >-
    Deliberately carries no GO biological_processes term. This node is an
    organ-level haemodynamic state - a sustained pressure gradient across a
    vascular bed - whereas GO:0097746 (blood vessel diameter maintenance), used
    legitimately by the upstream resistance and vasodilation nodes, describes a
    cellular process. Per the terms skill, no term beats a near-miss; the node
    is grounded anatomically by UBERON:0001639 instead.
  locations:
  - preferred_term: hepatic portal vein
    term:
      id: UBERON:0001639
      label: hepatic portal vein
  evidence:
  - reference: PMID:38642564
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Portal hypertension represents the primary non-neoplastic complication of
      liver cirrhosis and has life-threatening consequences, such as
      oesophageal variceal bleeding, ascites, and hepatic encephalopathy.
    explanation: >-
      Establishes this node as the central complication of cirrhosis and names
      the three downstream decompensating events the module terminates in.
      Evidence source is OTHER because this is a review.
  - reference: PMID:38642564
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this Review, we discuss recent discoveries in the pathophysiology and
      treatment of cirrhotic portal hypertension, a condition with few
      pharmacological treatment options.
    explanation: >-
      Records that this node remains largely undruggable, which bounds what a
      conforming entry may claim for therapy directed at it. Evidence source is
      OTHER because this is a review.
  downstream:
  - target: Portosystemic Collateral Formation and Gastro-oesophageal Varices
    causal_link_type: DIRECT
    description: >-
      The portosystemic pressure gradient opens and dilates collateral channels
      that decompress the portal system into the systemic circulation.
  - target: Hepatic Decompensation
    causal_link_type: DIRECT
    description: >-
      Raised sinusoidal pressure drives interstitial filtration and ascites, and
      portosystemic shunting permits gut-derived neurotoxins to bypass the
      liver, producing hepatic encephalopathy.

- name: Portosystemic Collateral Formation and Gastro-oesophageal Varices
  description: >-
    The portosystemic pressure gradient opens, dilates, and neovascularises
    collateral channels connecting the portal and systemic venous circulations.
    Gastro-oesophageal varices are the clinically decisive set: thin-walled,
    high-pressure submucosal vessels that rupture and bleed. Splenomegaly from
    passive congestion accompanies the collateral circulation and correlates
    with the measured portal pressure gradient.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: INCREASED
  evidence:
  - reference: PMID:32982109
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      haematemesis (due to esophageal varices caused by portal hypertension)
    explanation: >-
      Attributes oesophageal varices, and the haemorrhage they cause, directly
      to portal hypertension - the causal edge this node asserts. Evidence
      source is OTHER because this is a clinical review.
  - reference: PMID:37780566
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      splenomegaly results from passive congestion due to portal hypertension
      and recent data have shown a positive correlation between HVPG and spleen
      stiffness
    explanation: >-
      Supports the congestive component of this node and its quantitative
      relationship to the measured hepatic venous pressure gradient. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Hepatic Decompensation
    causal_link_type: DIRECT
    description: >-
      Rupture of gastro-oesophageal varices produces portal-hypertensive
      haemorrhage, one of the defining decompensating events.

- name: Hepatic Decompensation
  description: >-
    The clinical endpoint of the module: the appearance of ascites, jaundice,
    hepatic encephalopathy, infection, or portal-hypertensive haemorrhage marks
    acute decompensation, a watershed in prognosis. Once decompensation occurs,
    survival is measured in months to a few years, and further complications -
    spontaneous bacterial peritonitis, hepatorenal syndrome, acute-on-chronic
    liver failure - become likely. Conforming entries attach their
    disease-specific decompensating events here.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:37780566
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute decompensation of liver cirrhosis represents a watershed in
      prognosis and is characterized by the occurrence of clinical complications
      such as ascites, jaundice, hepatic encephalopathy, infections, or
      portal-hypertensive hemorrhages.
    explanation: >-
      Defines this consequence node and enumerates its constituent events,
      including the portal-hypertensive haemorrhage arriving from the varices
      node. Evidence source is OTHER because this is a review.
  - reference: PMID:37159031
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The median survival time following onset of hepatic encephalopathy and
      ascites is 0.92 and 1.1 years, respectively.
    explanation: >-
      Quantifies the prognostic weight of reaching this node, which is why it is
      curated as the module's terminal consequence rather than as an incidental
      finding. Evidence source is OTHER because this is a JAMA narrative review
      summarising the literature rather than reporting an original cohort.
  - reference: PMID:37159031
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among people with ascites, the annual incidence of spontaneous bacterial
      peritonitis is 11% and of hepatorenal syndrome is 8%; the latter is
      associated with a median survival of less than 2 weeks.
    explanation: >-
      Documents the secondary complications that follow from ascites, the link
      by which this module connects to renal and infectious sequelae in
      conforming entries. Evidence source is OTHER because this is a narrative review.

treatments:
- name: Nonselective Beta-Blocker (Carvedilol or Propranolol)
  description: >-
    Nonselective beta-blockers lower portal pressure by acting on the splanchnic
    inflow arm rather than on intrahepatic resistance: beta-2 blockade leaves
    splanchnic alpha-adrenergic vasoconstriction unopposed, reducing portal
    venous inflow, while beta-1 blockade lowers cardiac output. Carvedilol adds
    alpha-1 blockade, which also lowers intrahepatic vascular tone. In patients
    with clinically significant portal hypertension this reduced the risk of
    decompensation or death against placebo. This is the portal-hypertension
    drug-target design pattern for conforming disorders - act on the
    hyperdynamic amplifier, because the resistance trigger has no established
    pharmacotherapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
  target_mechanisms:
  - target: Splanchnic Vasodilation and Hyperdynamic Circulation
    treatment_effect: INHIBITS
    description: >-
      Nonselective beta-blockade reduces splanchnic arterial inflow and cardiac
      output, damping the hyperdynamic amplifier and thereby lowering the portal
      pressure it sustains.
    evidence:
    - reference: PMID:37159031
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In a 3-year randomized clinical trial of 201 patients with portal
        hypertension, nonselective β-blockers (carvedilol or propranolol)
        reduced the risk of decompensation or death compared with placebo (16%
        vs 27%).
      explanation: >-
        Review statement of the randomized result. Evidence source is OTHER
        because this is a narrative review rather than the trial report.
    - reference: PMID:30910320
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The primary endpoint occurred in 16 (16%) of 100 patients in the β
        blockers group versus 27 (27%) of 101 in the placebo group (hazard ratio
        [HR] 0·51, 95% CI 0·26-0·97, p=0·041).
      explanation: >-
        The PREDESCI trial result cited directly rather than through a review:
        beta-blockade reduced decompensation or death in compensated cirrhosis
        with clinically significant portal hypertension. Evidence source is
        HUMAN_CLINICAL because this is a randomised controlled trial.
  evidence:
  - reference: PMID:37159031
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a 3-year randomized clinical trial of 201 patients with portal
      hypertension, nonselective β-blockers (carvedilol or propranolol) reduced
      the risk of decompensation or death compared with placebo (16% vs 27%).
    explanation: >-
      Establishes nonselective beta-blockade as an effective intervention on
      this module's pathway, with a hard clinical endpoint. Evidence source is
      OTHER because this is a JAMA narrative review; the PREDESCI trial is cited
      directly below for the trial-grade claim.
  - reference: PMID:30910320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term treatment with β blockers could increase decompensation-free
      survival in patients with compensated cirrhosis and CSPH, mainly by
      reducing the incidence of ascites.
    explanation: >-
      PREDESCI's own conclusion, and the trial-grade basis for placing this
      treatment on the module. Note it localises the benefit to ascites, the
      decompensating event most directly downstream of the pressure this drug
      lowers. Evidence source is HUMAN_CLINICAL because this is a randomised,
      double-blind, placebo-controlled multicentre trial.
  - reference: PMID:30910320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically significant portal hypertension (CSPH), defined by a hepatic
      venous pressure gradient (HVPG) ≥10 mm Hg, is the strongest predictor of
      decompensation.
    explanation: >-
      Grounds the module's central_effector node quantitatively and confirms it
      is the dominant predictor of the downstream decompensation node. Evidence
      source is HUMAN_CLINICAL because this is the trial's enrolment criterion
      derived from patient haemodynamic measurement.

discussions:
- discussion_id: intrahepatic_resistance_undruggable
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can the intrahepatic vascular resistance arm of portal hypertension be
    lowered pharmacologically, as distinct from reducing splanchnic inflow?
  attaches_to:
  - "pathophysiology#Increased Intrahepatic Vascular Resistance"
  rationale: >-
    The only treatment curated in this module acts on the splanchnic inflow
    amplifier, and cirrhotic portal hypertension is described in the current
    review literature as a condition with few pharmacological treatment options.
    Because part of the intrahepatic resistance is dynamic - sinusoidal
    endothelial dysfunction and stellate cell contraction rather than fixed
    fibrosis - it is in principle reversible, but no agent has established
    clinical benefit by that route. Conforming entries should not present
    beta-blockade as treating the resistance trigger.
  proposed_experiments:
  - experiment_id: hvpg_endpoint_sinusoidal_agent_trial
    name: HVPG-endpoint trial of a sinusoidal-endothelial-directed agent
    description: >-
      A randomized trial in compensated cirrhosis using paired hepatic venous
      pressure gradient measurement as the primary endpoint would separate an
      effect on intrahepatic resistance from the systemic haemodynamic effect
      that beta-blockade already provides.

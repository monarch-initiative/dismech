name: Interleukin-6 Hypercytokinemia Module
category: Module
creation_date: "2026-08-27T00:00:00Z"
description: >-
  A conserved module for ligand-driven interleukin-6 hypercytokinemia: sustained
  oversupply of IL-6 from a disorder-specific source engages the gp130 receptor
  complex, activates JAK-STAT3 in responder cells, and drives hepatic
  acute-phase reprogramming together with B-lineage differentiation, producing a
  systemic inflammatory syndrome. The rate-limiting, disorder-agnostic step is
  gp130-mediated JAK-STAT3 activation, and it is the key conformance target.
  What distinguishes this module from cell-intrinsic pathway activation is that
  every step is ligand-dependent and therefore pharmacologically reversible at
  three separate points - the cytokine, the receptor, and the kinase - which is
  why anti-IL-6, anti-IL-6-receptor and JAK-inhibitor therapy all work in
  disorders that conform to it.
notes: >-
  Conforming entries substitute the disorder-specific IL-6 source at the trigger
  node and keep the rest of the chain: lymph node stromal and plasma cells in
  idiopathic multicentric Castleman disease, lytically infected plasmablasts
  producing a viral IL-6 homolog in HHV-8-associated multicentric Castleman
  disease, synovial fibroblasts and macrophages in rheumatoid arthritis,
  activated macrophages in Still disease and in cytokine release syndrome, and
  tumour or stromal cells in IL-6-driven malignancy. The clinical read-out set
  at the consequence node is likewise substituted.

  This module is deliberately distinct from `jak_stat_pathway_activation`, and a
  node should not conform to both. That module covers cell-intrinsic,
  constitutive, ligand-INDEPENDENT activation from an activating lesion in a
  receptor, JAK or STAT - or from lost SOCS feedback - and terminates in
  cytokine-independent proliferation. This module covers the opposite case: a
  structurally normal pathway driven by an excess of ligand, where removing the
  ligand or blocking its receptor switches the pathway off. A disorder in which
  IL-6 blockade produces clinical remission conforms here, not there.

  This is not an Xogenesis module: the terminal output is a systemic
  physiological state, not a pathological material anatomical entity, so no
  MPATH/OGMS anchor stanza applies.
pathophysiology:
- name: Sustained Interleukin-6 Oversupply
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    IL-6 is produced in excess of what its clearance and negative-feedback
    machinery can absorb, and the excess is sustained rather than transient. The
    producing cell is the disorder-specific substitution and varies widely -
    stromal cells, plasma cells, macrophages, endothelium, synovial fibroblasts,
    tumour cells - and in one case the ligand is not host IL-6 at all but a
    virally encoded homolog. Normal control operates through induction of
    suppressor molecules after pathway activation and through circulating
    soluble IL-6 receptor and gp130; sustained oversupply overwhelms it.
  biological_processes:
  - preferred_term: Interleukin-6 production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:31958792
    reference_title: "Interleukin-6: A Masterplayer in the Cytokine Network."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vice versa, an overproduction of IL-6 and dysregulation of the IL-6 signaling pathways can result in inflammatory and autoimmune disorders as well as cancer development suggesting that IL-6 plays a significant role in the human cytokine network."
    explanation: >-
      States that overproduction of IL-6, rather than a receptor or kinase
      lesion, is what produces the disease states this module covers.
  - reference: PMID:31958792
    reference_title: "Interleukin-6: A Masterplayer in the Cytokine Network."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The control of IL-6 signaling is regulated through the induction of suppressor molecules after activation of the IL-6 pathways as well as through the presence of sIL-6R and gp130 forms in the blood."
    explanation: Describes the negative-feedback machinery that sustained oversupply overwhelms.
  downstream:
  - target: gp130 Receptor Complex Engagement
    causal_link_type: DIRECT
    description: >-
      Excess ligand drives assembly of the signaling complex; this is the step
      that anti-IL-6 antibody therapy removes.
- name: gp130 Receptor Complex Engagement
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    IL-6 signals through a complex of IL-6, an IL-6 receptor and the
    signal-transducing subunit gp130. Three modes exist: classic signaling
    through the membrane-bound receptor, trans-signaling through a soluble
    receptor, and trans-presentation from a neighbouring cell. The amplification
    that makes hypercytokinemia systemic is trans-signaling: only a few cell
    types express the membrane receptor, whereas gp130 is ubiquitous, so a
    soluble-receptor complex dramatically enlarges the spectrum of responder
    cells. Pro-inflammatory responses are attributed rather to trans-signaling
    and regenerative or anti-inflammatory responses to classic signaling.
  biological_processes:
  - preferred_term: Interleukin-6-mediated signaling pathway
    term:
      id: GO:0070102
      label: interleukin-6-mediated signaling pathway
    modifier: INCREASED
  molecular_functions:
  - preferred_term: Interleukin-6 receptor binding
    term:
      id: GO:0005138
      label: interleukin-6 receptor binding
    modifier: INCREASED
  evidence:
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, only few cells express membrane bound interleukin-6 receptor whereas all cells display gp130 on the cell surface."
    explanation: >-
      Establishes the asymmetry between restricted receptor expression and
      ubiquitous gp130 that makes trans-signaling the amplifying step.
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, the generation of soluble form of the interleukin-6 receptor dramatically enlarges the spectrum of interleukin-6 target cells. This process has been named trans-signaling."
    explanation: Names and defines the amplification mechanism recorded at this node.
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It turns out that regenerative or anti-inflammatory activities of interleukin-6 are mediated by classic signaling whereas pro-inflammatory responses of interleukin-6 are rather mediated by trans-signaling."
    explanation: >-
      Assigns the pro-inflammatory output this module models to the
      trans-signaling mode specifically.
  - reference: PMID:31958792
    reference_title: "Interleukin-6: A Masterplayer in the Cytokine Network."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, three modes for IL-6 signaling may occur in which IL-6 is binding to mIL-6R (classic), to sIL-6R (trans-signaling), or is joined through IL-6R to gp130 on nearby located cells (trans-presentation)."
    explanation: Enumerates the three signaling modes described at this node.
  downstream:
  - target: JAK-STAT3 Activation in Responder Cells
    causal_link_type: DIRECT
    description: >-
      Complex assembly dimerizes gp130 and activates the associated kinases;
      this is the step that anti-IL-6-receptor antibody therapy removes.
- name: JAK-STAT3 Activation in Responder Cells
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting, disorder-agnostic step and the key conformance target.
    gp130 dimerization activates Janus kinases, which phosphorylate tyrosine
    residues in the gp130 cytoplasmic tail. Two arms follow: recruitment and
    phosphorylation of STAT transcription factors, which dimerize, translocate to
    the nucleus and activate target genes; and engagement of SHP-2 with
    activation of the Ras/Raf/MAPK pathway. Every conforming disorder funnels
    through this node regardless of what supplies the ligand, and it is the point
    a JAK inhibitor acts on.
  biological_processes:
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gp130 dimerizes, leading to the activation of Janus kinases and subsequent phosphorylation of tyrosine residues within the cytoplasmic portion of gp130."
    explanation: The receptor-to-kinase step this node records.
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In addition, signal transducer and activator of transcription factors are recruited, which are phosphorylated, and consequently dimerize whereupon they translocate into the nucleus and activate target genes."
    explanation: The STAT arm of this node.
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This leads to the engagement of phosphatase Src homology domains containing tyrosin phosphatase-2 (SHP-2) and activation of the ras/raf/Mitogen-activated protein (MAP) kinase (MAPK) pathway."
    explanation: The MAPK arm of this node.
  downstream:
  - target: Hepatic Acute-Phase Reprogramming and B-Lineage Differentiation
    causal_link_type: DIRECT
- name: Hepatic Acute-Phase Reprogramming and B-Lineage Differentiation
  role: effector
  biological_scale: TISSUE
  description: >-
    STAT3-driven transcription reprogrammes two compartments at once. In the
    liver, positive acute-phase proteins including C-reactive protein and
    fibrinogen are induced while albumin synthesis is suppressed, and hepcidin
    induction restricts iron availability to produce the anemia of inflammation.
    In the B-cell compartment, IL-6 drives IL-21 production by CD4+ T cells, and
    STAT3 in the B cell is required for optimal immunoglobulin production and for
    upregulation of the master plasma cell factor PRDM1, so the output is plasma
    cell differentiation and immunoglobulin secretion. Both compartments reverse
    on IL-6 blockade, and their laboratory markers normalize in a reproducible
    sequence.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: Plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: Acute-phase response
    term:
      id: GO:0006953
      label: acute-phase response
    modifier: INCREASED
  - preferred_term: Plasma cell differentiation
    term:
      id: GO:0002317
      label: plasma cell differentiation
    modifier: INCREASED
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  evidence:
  - reference: PMID:22491065
    reference_title: "IL-6 triggers IL-21 production by human CD4+ T cells to drive STAT3-dependent plasma cell differentiation in B cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In IL-21-treated B cells, signal transducer and activator of transcription (STAT)3 was required for optimal immunoglobulin production and upregulation of PR domain containing 1 (PRDM1(+)), the master plasma cell factor."
    explanation: >-
      Establishes the STAT3 requirement for the plasma cell differentiation arm
      of this node.
  - reference: PMID:22491065
    reference_title: "IL-6 triggers IL-21 production by human CD4+ T cells to drive STAT3-dependent plasma cell differentiation in B cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show here that IL-21 was required for the induction of Ab production by IL-6."
    explanation: Places IL-21 as the intermediate between IL-6 and antibody output.
  - reference: DOI:10.1182/bloodadvances.2022007112
    reference_title: "Siltuximab is associated with improved progression-free survival in idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the median time to normalization of abnormal laboratory tests and clinical end points occurred in the following sequence: thrombocytosis, symptomatic response, elevated C-reactive protein, hypoalbuminemia, anemia, lymph node response, hyperfibrinogenemia, and elevated immunoglobulin G"
    explanation: >-
      Shows the acute-phase and immunoglobulin outputs of this node reversing on
      IL-6 blockade, which is the evidence that they are downstream of the
      cytokine rather than independent.
  downstream:
  - target: Systemic Inflammatory Syndrome
    causal_link_type: DIRECT
- name: Systemic Inflammatory Syndrome
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical state: fever, fatigue and weight loss, anemia of inflammation,
    hypoalbuminemia with third-space fluid accumulation, a raised C-reactive
    protein and erythrocyte sedimentation rate, hypergammaglobulinemia, and
    platelet counts driven away from normal. Which of these dominate is the
    disorder-specific substitution. The defining property for conformance is that
    the syndrome remits when the IL-6 axis is blocked - if it does not, the
    disorder is being driven by something this module does not model.
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:25042199
    reference_title: "Siltuximab for multicentric Castleman's disease: a randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Durable tumour and symptomatic responses occurred in 18 (34%) of 53 patients in the siltuximab group and none of 26 in the placebo group (difference 34·0%, 95% CI 11·1-54·8, p=0·0012)."
    explanation: >-
      Randomised placebo-controlled evidence that this syndrome is
      IL-6-dependent and reversible - and, at 34%, that not every clinically
      similar case is.
treatments:
- name: Anti-IL-6 Monoclonal Antibody
  description: >-
    Neutralizes the cytokine itself before it can assemble a receptor complex.
    Siltuximab is the worked example and is approved for idiopathic multicentric
    Castleman disease.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-IL-6 monoclonal antibody therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: siltuximab
      term:
        id: NCIT:C61084
        label: Siltuximab
  target_mechanisms:
  - target: Sustained Interleukin-6 Oversupply
    treatment_effect: INHIBITS
    description: Removes the ligand, so no receptor complex forms.
  evidence:
  - reference: PMID:31958792
    reference_title: "Interleukin-6: A Masterplayer in the Cytokine Network."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Amongst others, tocilizumab (anti-IL-6R humanized antibody) has been approved for the treatment of rheumatoid arthritis, cytokine release syndrome, and idiopathic multicentric Castleman's disease (iMCD), whereas siltuximab (an IL-6 antagonist) received approval for iMCD only."
    explanation: >-
      Records the approved indications for both antibody classes, and names three
      disorders that conform to this module.
- name: Anti-IL-6-Receptor Monoclonal Antibody
  description: >-
    Blocks the receptor rather than the ligand. Tocilizumab is the worked
    example and is approved for rheumatoid arthritis, cytokine release syndrome
    and idiopathic multicentric Castleman disease - three disorders that conform
    to this module by different triggers.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-IL-6 receptor monoclonal antibody therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: gp130 Receptor Complex Engagement
    treatment_effect: INHIBITS
    description: >-
      Blocks both membrane and soluble IL-6 receptor, so neither classic nor
      trans-signaling can assemble a gp130 complex.
  evidence:
  - reference: PMID:21296109
    reference_title: "The pro- and anti-inflammatory properties of the cytokine interleukin-6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This is important since therapeutic blockade of interleukin-6 by the neutralizing anti-interleukin-6 receptor monoclonal antibody tocilizumab has recently been approved for the treatment of inflammatory diseases."
    explanation: Establishes receptor blockade as an approved intervention at this node.
- name: JAK Inhibition
  description: >-
    Acts inside the responder cell at the central effector node, downstream of
    both the cytokine and its receptor. This is the rational option when the
    ligand is not host IL-6 or when more than one gp130-family cytokine is
    contributing, since it does not depend on neutralizing a single ligand.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: JAK-STAT3 Activation in Responder Cells
    treatment_effect: INHIBITS
    description: >-
      Inhibits the Janus kinases downstream of gp130, the shared node for every
      gp130-family ligand.
  evidence:
  - reference: PMID:31958792
    reference_title: "Interleukin-6: A Masterplayer in the Cytokine Network."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Several therapeutic agents have been evaluated for inhibiting the cytokine itself, the signaling via the IL-6 receptor, or target kinases (e.g., JAK/STAT) associated with the signaling pathways."
    explanation: >-
      Names the three intervention points that correspond to this module's
      trigger, amplifier and central-effector nodes.

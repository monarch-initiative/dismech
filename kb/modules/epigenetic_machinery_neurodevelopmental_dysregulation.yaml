name: Epigenetic Machinery Neurodevelopmental Dysregulation Module
description: >-
  A conserved neurodevelopmental mechanism module for the Mendelian disorders of
  the epigenetic machinery (MDEMs), also called the chromatinopathies: genetic
  disorders caused by lesions in the proteins that write, erase, read, or remodel
  chromatin. Individually rare but collectively a common cause of intellectual
  disability and growth disruption, these disorders share a single causal chain.
  A dosage-sensitive component of the epigenetic apparatus is lost (typically by
  haploinsufficiency); the balance between permissive (open) and repressive
  (closed) chromatin shifts at the component's target loci and, in many of these
  disorders, genome-wide; the neurodevelopmental transcriptional program those
  loci encode is dysregulated; neuronal maturation, activity-dependent synaptic
  plasticity, and postnatal neurogenesis are impaired; and the result is
  intellectual disability with the growth and craniofacial features
  characteristic of this group. Conforming disorder entries substitute the
  disorder-specific component and the chromatin mark it controls - KMT2D/KDM6A
  and H3K4 methylation in Kabuki syndrome, CREBBP/EP300 lysine acetylation in
  Rubinstein-Taybi syndrome, the ARID1B/SMARCA2/SMARCA4 BAF remodeler in
  Coffin-Siris and Nicolaides-Baraitser syndromes, EHMT1 H3K9 methylation in
  Kleefstra syndrome, the NIPBL/cohesin regulator in Cornelia de Lange syndrome,
  BRPF1 as a reader-scaffold for the KAT6A/KAT6B acetyltransferases - while
  preserving the conserved chromatin-imbalance to transcription to
  neuronal-maturation chain.
category: Module
creation_date: "2026-08-22T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.
  "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program").

  NOT an Xogenesis module: the terminal output is failure of a normal
  developmental process, not formation of a pathological anatomical entity, so
  no OGMS/MPATH anchor stanza applies.

  Scope and the four functional classes. The epigenetic machinery comprises three
  enzymatic classes - writers (KMT2D, KMT2A, EHMT1, NSD1, EZH2, SETD5, CREBBP,
  EP300, KAT6A, KAT6B), erasers (KDM6A, KDM5C, HDAC8), and chromatin remodelers
  (the BAF/SWI-SNF subunits ARID1A, ARID1B, SMARCA2, SMARCA4, SMARCB1; CHD7,
  CHD8) - plus one non-enzymatic class, readers (BRPF1, BRD4, PHF6, ATRX).
  Enzymatic activities never coexist within a single component, but an individual
  enzymatic activity often coexists with a reader domain (PMID:31595951). A
  conforming entry should say which class its component belongs to.

  What does NOT conform. This module is about the machinery that maintains
  chromatin state, not about every transcriptional lesion. A sequence-specific
  transcription factor whose loss dysregulates its own target genes (FOXP1,
  SOX11, TBR1) is a transcription-factor disorder, not an MDEM, and should not
  declare conformance here on that basis alone; nor should the age-associated,
  partly stochastic epigenetic drift covered by the separate
  `epigenetic_alterations` aging-hallmark module, which is a different
  explanandum (drift with age vs. a germline lesion in a machinery component).
  Cancer-associated somatic mutation of the same genes (SMARCB1 in rhabdoid
  tumor, EZH2 in lymphoma, SETD2 in renal cell carcinoma) belongs to the cancer
  hallmark modules, not here.

  Deliberately not asserted. The module does NOT claim that global DNA-methylation
  episignatures are causal. They are robust, clinically deployed diagnostic
  classifiers and evidence that these disorders share a downstream chromatin
  consequence, but a peripheral-blood methylation signature is a biomarker of the
  lesion, not a demonstrated step in the brain's causal chain - this is recorded
  as an open KNOWLEDGE_GAP discussion rather than curated as a pathophysiology
  node.

  Drug-target pattern. Chromatin-directed therapy (the HDAC inhibitor arm) uses
  target_mechanisms with INHIBITS on the "Permissive-Repressive Chromatin State
  Imbalance" node. The rationale is the postnatal malleability of this group:
  in the Kmt2d(+/betaGeo) Kabuki mouse, postnatal AR-42 treatment normalised
  H3K4me3 deficiency, dentate-gyrus neurogenesis, and hippocampal memory
  (PMID:25273096). This is an investigational, mouse-derived pattern and is NOT
  inherited as a treatment recommendation by conforming disorders; the
  human-translation gap is recorded as a HUMAN_MODEL_MISMATCH discussion.

  Conformers span all four functional classes.
  WRITERS: Kabuki_Syndrome (KMT2D/KDM6A writer-eraser pair),
  Rubinstein-Taybi_Syndrome (CREBBP/EP300 acetyltransferase),
  Kleefstra_Syndrome (EHMT1 H3K9), Weaver_Syndrome (EZH2/PRC2 H3K27),
  Wiedemann-Steiner_Syndrome (KMT2A H3K4),
  SETD5_Haploinsufficiency_Syndrome and Luscan-Lumish_Syndrome (SETD2, H3K36),
  Arboleda-Tham_Syndrome (KAT6A acetyltransferase).
  ERASERS: Beck-Fahrner_Syndrome (TET3 - the DNA-methylation arm rather than a
  histone mark), KDM6B-Related_Neurodevelopmental_Disorder (H3K27 demethylase),
  KDM1A-Related_Neurodevelopmental_Disorder (LSD1).
  REMODELERS: Coffin_Siris_Syndrome and Nicolaides-Baraitser_Syndrome (BAF; the
  two share an epi-signature, PMID:30459321),
  CHD8-Related_Neurodevelopmental_Disorder_with_Overgrowth,
  CHD2-Related_Developmental_and_Epileptic_Encephalopathy, ATRX_Syndrome.
  READERS / SCAFFOLDS: BRPF1-Related_Intellectual_Disability (KAT6A/KAT6B
  scaffold), Borjeson-Forssman-Lehmann_syndrome (PHF6),
  Bainbridge-Ropers_Syndrome (ASXL3/PR-DUB).
  COHESIN AND REGULATORS: Cornelia_de_Lange_Syndrome (NIPBL) - attached only at
  the transcriptional node, because cohesin acts on TAD and loop architecture
  rather than on permissive-repressive mark balance.

  A useful negative control already in the KB: Bainbridge-Ropers_Syndrome
  carries a node recording the *absence* of an ASXL3 DNA-methylation
  episignature. That is consistent with, and strengthens, this module's standing
  KNOWLEDGE_GAP: an episignature is a per-gene diagnostic property, not a
  necessary feature of belonging to this mechanism class.

  Key conformance target: the central_effector "Dysregulated Neurodevelopmental
  Transcriptional Program" - the disorder-agnostic, rate-limiting step every
  conformer funnels through regardless of which machinery class is lesioned.
pathophysiology:
- name: Epigenetic Machinery Component Haploinsufficiency
  description: >-
    A dosage-sensitive component of the epigenetic apparatus - a writer, eraser,
    reader, or chromatin remodeler - is functionally lost. Haploinsufficiency is
    the predominant disease mechanism for this gene group: a single functional
    allele is insufficient, so most MDEMs are dominant and caused by truncating
    or loss-of-function missense variants rather than gain of a new activity.
    Conforming disorder nodes substitute the specific component and its
    enzymatic or reader class.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: histone H3K4 methyltransferase activity (writer class; KMT2D/KMT2A)
    term:
      id: GO:0042800
      label: histone H3K4 methyltransferase activity
    modifier: DECREASED
  - preferred_term: histone acetyltransferase activity (writer class; CREBBP/EP300/KAT6A)
    term:
      id: GO:0004402
      label: histone acetyltransferase activity
    modifier: DECREASED
  - preferred_term: histone demethylase activity (eraser class; KDM6A/KDM5C)
    term:
      id: GO:0032452
      label: histone demethylase activity
    modifier: DECREASED
  - preferred_term: chromatin binding (reader class; BRPF1/ATRX/PHF6)
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: chromatin remodeling (remodeler class; BAF/SWI-SNF subunits)
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DECREASED
  evidence:
  - reference: PMID:31595951
    reference_title: "Mendelian disorders of the epigenetic machinery: postnatal malleability and therapeutic prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Studies in model organisms and humans have demonstrated dosage sensitivity
      of this gene group with haploinsufficiency as a predominant disease
      mechanism.
    explanation: >-
      Establishes haploinsufficiency of a dosage-sensitive epigenetic-machinery
      component as the predominant lesion initiating this chain. Evidence source
      is OTHER because this is a review.
  - reference: PMID:31595951
    reference_title: "Mendelian disorders of the epigenetic machinery: postnatal malleability and therapeutic prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The epigenetic machinery consists of three enzymatic components (writers,
      erasers and chromatin remodelers) as well as one non-enzymatic group
      (readers).
    explanation: >-
      Defines the four functional classes of machinery component that this
      trigger node covers, and which a conforming entry substitutes into.
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRPF1 encodes a protein modifier of two histone acetyltransferases
      associated with ID: KAT6A (also known as MOZ or MYST3) and KAT6B (MORF or
      MYST4).
    explanation: >-
      Worked example of the non-enzymatic reader/scaffold class entering the
      chain: BRPF1 is not itself an enzyme but modifies the KAT6A/KAT6B
      acetyltransferases, and its loss causes dominant intellectual disability.
  downstream:
  - target: Permissive-Repressive Chromatin State Imbalance

- name: Permissive-Repressive Chromatin State Imbalance
  description: >-
    Loss of the component shifts the balance between permissive (open,
    transcriptionally competent) and repressive (closed) chromatin at the loci
    that component normally acts on. Because writers and erasers of opposing
    marks act antagonistically on the same nucleosomes, losing one arm is
    equivalent to unopposed activity of the other: KMT2D haploinsufficiency
    reduces H3K4 trimethylation and histone acetylation, leaving chromatin
    inappropriately closed. This imbalance - not the absence of any single mark -
    is the pathogenic state, and it is what chromatin-directed therapy targets.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: chromatin
    term:
      id: GO:0000785
      label: chromatin
  evidence:
  - reference: PMID:25273096
    reference_title: Histone deacetylase inhibition rescues structural and functional brain deficits in a mouse model of Kabuki syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Kabuki syndrome is caused by haploinsufficiency for either of two genes
      that promote the opening of chromatin. If an imbalance between open and
      closed chromatin is central to the pathogenesis of Kabuki syndrome, agents
      that promote chromatin opening might have therapeutic potential.
    explanation: >-
      States the open-versus-closed chromatin imbalance as the central pathogenic
      state of the prototype MDEM, and the reason this node rather than the
      genetic lesion is the drug target.
  - reference: PMID:25273096
    reference_title: Histone deacetylase inhibition rescues structural and functional brain deficits in a mouse model of Kabuki syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vitro reporter alleles demonstrated a reduction in histone 4 acetylation
      and histone 3 lysine 4 trimethylation (H3K4me3) activity in mouse embryonic
      fibroblasts from Kmt2d(+/βGeo) mice.
    explanation: >-
      Measures the imbalance directly: loss of one writer reduces both the mark
      it deposits (H3K4me3) and a second permissive mark (H4 acetylation).
  downstream:
  - target: Dysregulated Neurodevelopmental Transcriptional Program
    causal_link_type: DIRECT

- name: Dysregulated Neurodevelopmental Transcriptional Program
  description: >-
    The rate-limiting, disorder-agnostic step. Altered chromatin state at the
    component's target loci dysregulates expression of the developmental gene
    programs those loci encode. This is where the four functional classes
    converge: whichever component is lost, and whichever mark is perturbed, the
    shared consequence is that neurodevelopmental transcription is no longer
    correctly patterned. It is the level at which the chromatinopathies are
    recognised as one class, and the level at which their clinical overlap -
    developmental delay, intellectual disability, facial dysmorphism, behavioural
    disturbance - is explained.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: LOSS_OF_FUNCTION
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: DECREASED
  evidence:
  - reference: PMID:34803598
    reference_title: Cornelia de Lange Syndrome as Paradigm of Chromatinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chromatinopathies can be defined as a class of neurodevelopmental disorders
      caused by mutations affecting proteins responsible for chromatin remodeling
      and transcriptional regulation. The resulting dysregulation of gene
      expression favors the onset of a series of clinical features such as
      developmental delay, intellectual disability, facial dysmorphism, and
      behavioral disturbances.
    explanation: >-
      States the convergence this node models: chromatin-machinery lesions of
      varied class produce one shared consequence, dysregulated gene expression,
      which in turn produces the shared clinical picture. Source is a review.
  - reference: PMID:31595951
    reference_title: "Mendelian disorders of the epigenetic machinery: postnatal malleability and therapeutic prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This group of disorders disrupts both the chromatin and transcription
      states of target genes downstream of the given component
    explanation: >-
      Explicitly couples the chromatin-state change to the transcription-state
      change at the component's downstream target genes, which is the edge into
      this node.
  - reference: PMID:34202860
    reference_title: "Rubinstein-Taybi Syndrome: A Model of Epigenetic Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These two genes encode paralogs acting as lysine acetyltransferase involved
      in transcriptional regulation and chromatin remodeling with a key role in
      neuronal plasticity and cognition.
    explanation: >-
      Independent worked example from a second MDEM (Rubinstein-Taybi,
      CREBBP/EP300) reaching the same transcriptional-regulation node from the
      acetyltransferase writer arm.
  downstream:
  - target: Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis
    causal_link_type: DIRECT

- name: Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis
  description: >-
    The dysregulated transcriptional program is read out in neurons as failure of
    the activity-dependent processes that build and tune circuits: dendritic
    spine formation and actin dynamics, synapse number, long-term synaptic
    plasticity, and - importantly for this module's therapeutic logic - ongoing
    neurogenesis in the postnatal dentate gyrus. Because several of these
    processes continue after birth, the deficit at this node is not purely a
    fixed developmental endpoint, which is the mechanistic basis for postnatal
    malleability.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: neural stem cell (postnatal dentate gyrus progenitor)
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: DECREASED
  - preferred_term: generation of neurons
    term:
      id: GO:0048699
      label: generation of neurons
    modifier: DECREASED
  - preferred_term: dentate gyrus development
    term:
      id: GO:0021542
      label: dentate gyrus development
    modifier: DECREASED
  evidence:
  - reference: PMID:25273096
    reference_title: Histone deacetylase inhibition rescues structural and functional brain deficits in a mouse model of Kabuki syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo, deficiency of H3K4me3 in the dentate gyrus granule cell layer of
      Kmt2d(+/βGeo) mice correlated with reduced neurogenesis and hippocampal
      memory defects.
    explanation: >-
      Links the chromatin-mark deficit to the cellular readout at this node -
      reduced postnatal dentate-gyrus neurogenesis - and to a cognitive
      consequence, in the prototype MDEM model.
  - reference: PMID:35185468
    reference_title: Insights Into the Emerging Role of Baf53b in Autism Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Deletion of one or both copies of mouse Baf53b disrupts dendritic spine
      development, alters actin dynamics and results in fewer synapses in vitro.
    explanation: >-
      Independent arrival at this node from the chromatin-remodeler class (nBAF),
      showing the same effector-level readout - spine development, synapse number
      - rather than the neurogenesis readout. Source is a review.
  - reference: PMID:35185468
    reference_title: Insights Into the Emerging Role of Baf53b in Autism Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the mouse, heterozygous loss of Baf53b severely impacts synaptic
      plasticity and long-term memory
    explanation: >-
      Supports the synaptic-plasticity component of this node from the remodeler
      arm, complementing the neurogenesis evidence from the writer arm.
  downstream:
  - target: Intellectual Disability with Growth and Craniofacial Dysmorphism
    causal_link_type: DIRECT

- name: Intellectual Disability with Growth and Craniofacial Dysmorphism
  description: >-
    The clinical output of the chain, and the reason this group is curated as one
    class: intellectual disability and developmental delay, accompanied by growth
    disruption (short stature in Kabuki and Cornelia de Lange, overgrowth in
    Sotos and Weaver - the direction differs but the dysregulation does not) and
    a recognisable facial gestalt, often with behavioural disturbance. MDEMs are
    individually rare but collectively a common aetiology for intellectual
    disability, which is what makes the shared mechanism worth modelling.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: learning or memory
    term:
      id: GO:0007611
      label: learning or memory
    modifier: DECREASED
  evidence:
  - reference: PMID:31595951
    reference_title: "Mendelian disorders of the epigenetic machinery: postnatal malleability and therapeutic prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Though individually rare, MDEMs have emerged as a collectively common
      etiology for intellectual disability (ID) and growth disruption.
    explanation: >-
      States the terminal clinical output of the chain and the epidemiological
      reason the class is worth a shared module.
  - reference: PMID:34803598
    reference_title: Cornelia de Lange Syndrome as Paradigm of Chromatinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A distinct craniofacial appearance, pre- and post-natal growth retardation,
      intellectual disability, developmental delay, behavioral issues, and limb
      anomalies are the main clinical features of CdLS
    explanation: >-
      Worked example of the composite output - cognition plus growth plus facial
      gestalt - in the paradigm chromatinopathy.
treatments:
- name: Histone Deacetylase Inhibitor (Chromatin-Directed Therapy)
  description: >-
    The chromatin-directed drug-target pattern for this module. If the pathogenic
    state is an imbalance favouring closed chromatin, an agent that promotes
    chromatin opening should counteract it downstream of the untreatable genetic
    lesion. Histone deacetylase inhibitors do exactly this: in the
    Kmt2d(+/betaGeo) Kabuki mouse the HDAC inhibitor AR-42 normalised the reduced
    H4 acetylation and H3K4me3 activity in vitro, and postnatal treatment
    improved dentate-gyrus neurogenesis and hippocampal memory in vivo. Vorinostat
    is given as the ontology-bound exemplar of the class; AR-42 (the agent
    actually used) has no CHEBI or NCIT identifier. IMPORTANT: this is an
    investigational, mouse-derived pattern, not a treatment recommendation, and
    conforming disorders do NOT inherit it - see the HUMAN_MODEL_MISMATCH
    discussion on this module.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vorinostat (ontology-bound exemplar of the HDAC-inhibitor class)
      term:
        id: NCIT:C1796
        label: Vorinostat
  target_mechanisms:
  - target: Permissive-Repressive Chromatin State Imbalance
    treatment_effect: INHIBITS
    description: >-
      HDAC inhibition raises histone acetylation and so counteracts the shift
      toward closed chromatin produced by loss of a permissive-mark writer,
      acting on the amplifier node rather than on the genetic lesion or the
      downstream phenotype.
    evidence:
    - reference: PMID:25273096
      reference_title: Histone deacetylase inhibition rescues structural and functional brain deficits in a mouse model of Kabuki syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These activities were normalized in response to AR-42, a histone
        deacetylase inhibitor.
      explanation: >-
        Demonstrates the drug acting on this specific node: the reduced
        acetylation and H3K4me3 activities defining the chromatin imbalance are
        normalised by HDAC inhibition.
  evidence:
  - reference: PMID:25273096
    reference_title: Histone deacetylase inhibition rescues structural and functional brain deficits in a mouse model of Kabuki syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These abnormalities improved upon postnatal treatment with AR-42.
    explanation: >-
      Establishes the in vivo efficacy claim for the pattern - and its postnatal
      timing, which is what makes it interesting - in the Kabuki mouse model.
discussions:
- discussion_id: hdac_rescue_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does postnatal HDAC-inhibitor rescue of neurogenesis and memory in the
    Kmt2d(+/betaGeo) Kabuki mouse predict cognitive benefit in humans with a
    Mendelian disorder of the epigenetic machinery?
  attaches_to:
  - "pathophysiology#Permissive-Repressive Chromatin State Imbalance"
  rationale: >-
    The entire chromatin-directed therapeutic rationale for this module rests on
    a single mouse model of a single MDEM. The mismatch is not that the mechanism
    is implausible in humans - the chromatin imbalance is well evidenced on both
    sides - but that three translational steps are untested. First, the mouse
    readout is postnatal dentate-gyrus neurogenesis and hippocampal memory, which
    is a far narrower phenotype than human intellectual disability. Second, the
    human deficit accumulates across a developmental window that has largely
    closed by the time of diagnosis, so it is unknown how much of the phenotype
    remains malleable postnatally in humans even if the mouse deficit is. Third,
    HDAC inhibitors act genome-wide rather than at the affected component's
    target loci, so the therapeutic index in a developing human brain is
    unestablished. The review that frames this group as potentially treatable is
    explicit that the postnatal-treatability observation is recent and its
    clinical translation prospective, not demonstrated.
  proposed_experiments:
  - experiment_id: cross_mdem_postnatal_rescue
    name: Cross-MDEM replication of postnatal chromatin-directed rescue
    description: >-
      Test whether postnatal HDAC-inhibitor treatment rescues the cognitive
      phenotype in mouse models of MDEMs from the other three functional classes
      (an eraser, a reader, and a BAF remodeler model), to establish whether
      malleability is a property of the shared chromatin-imbalance node or a
      peculiarity of the Kmt2d writer model.
  - experiment_id: mdem_episignature_anchored_trial
    name: Human biomarker-anchored early-phase trial
    description: >-
      An early-phase trial in a defined MDEM cohort using the disorder's
      established DNA-methylation episignature and a validated cognitive endpoint
      as paired readouts, to establish whether a chromatin-directed agent moves
      the molecular phenotype in humans at all, and whether that movement tracks
      any cognitive change.
- discussion_id: episignature_causal_versus_biomarker
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are the peripheral-blood DNA-methylation episignatures of the
    chromatinopathies a step in the causal chain to intellectual disability, or a
    downstream biomarker of the machinery lesion?
  attaches_to:
  - "pathophysiology#Dysregulated Neurodevelopmental Transcriptional Program"
  rationale: >-
    Episignatures are robust enough to reclassify variants of unknown
    significance and to identify undiagnosed individuals by population screening,
    and their cross-syndrome similarity - the BAFopathy signature is shared
    between Coffin-Siris and Nicolaides-Baraitser, sometimes more closely across
    the two syndromes than within one - is strong evidence that these disorders
    converge on a common chromatin consequence. But they are measured in
    peripheral blood, not brain, and no study establishes that the methylation
    changes themselves mediate the neurodevelopmental phenotype rather than
    marking the lesion that does. The module therefore treats them as diagnostic
    and classificatory evidence for convergence at this node, and deliberately
    does not curate a methylation node in the causal chain.
  proposed_experiments:
  - experiment_id: brain_blood_episignature_concordance
    name: Brain-versus-blood episignature concordance
    description: >-
      Compare episignatures derived from post-mortem or iPSC-derived neuronal
      tissue against matched peripheral blood in the same MDEM, to establish
      whether the blood signature reflects the chromatin state of the cell type
      in which the phenotype arises.

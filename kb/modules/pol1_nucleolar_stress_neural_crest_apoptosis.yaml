    quote_role: BACKGROUND
    snippet: >-
      Ribosomal RNA (rRNA) transcription by RNA polymerase I (Pol I) is a
      critical rate-limiting step in ribosome biogenesis, which is essential for
      cell survival.
    explanation: >-
      Establishes why this step, rather than any other in ribosome assembly, is
      the one a Pol I subunit variant is felt at. The sentence is the paper's
      framing of established biology rather than its own result, which is what
      quote_role records.
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."

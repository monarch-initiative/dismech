- name: Depletion of Neural-Crest-Derived Craniofacial Skeletal Precursors
  role: consequence
  biological_scale: TISSUE
  description: >-
    Where both arms converge, and the node a conforming entry's craniofacial
    phenotypes hang from. Neural crest cells migrate into the frontonasal
    prominences and pharyngeal arches and differentiate there into most of the
    craniofacial bone and cartilage. A shortfall in that population, whether from
    apoptosis or from failed proliferation, produces hypoplasia of the structures
    those arches build. This module stops here. What a depleted arch population
    then does to the serially repeated arch derivatives, and why the resulting
    malformation is a coordinated bundle rather than an isolated defect, is the
    subject of pharyngeal_arch_patterning_serial_homology, and a conforming entry
    will normally declare conformance to both modules at different nodes.
  cell_types:

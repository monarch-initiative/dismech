    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      High expression of Pol I subunits sustains elevated rRNA transcription in
      NCC progenitors, which supports their high tissue-specific levels of
      protein translation, but also makes NCCs particularly sensitive to rRNA
      synthesis defects.
    explanation: >-
      The threshold-sensitivity argument stated directly, and the reason this
      node exists between the global transcriptional defect and the localised
      phenotype.
  - reference: PMID:18246078
    reference_title: "Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our work further implies that neuroepithelial and neural crest cells are
      particularly sensitive to cellular stress during embryogenesis
    explanation: >-
      The same selective vulnerability inferred from an independent lesion and

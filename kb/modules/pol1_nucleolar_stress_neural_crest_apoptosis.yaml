    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, complete rescue of cartilage development is not observed due to
      the failure to improve rDNA transcription and neural crest cell
      proliferation.
    explanation: >-
      The incompleteness of the p53 rescue, attributed by the authors to
      persistent transcriptional and proliferative deficits. This is the evidence
      that the arm exists.
  - reference: PMID:18246078
    reference_title: "Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These improvements, however, occur independently of the effects on ribosome biogenesis
    explanation: >-
      Independent confirmation that p53 inhibition rescues the phenotype without
      correcting the underlying biogenesis defect, which is the dissociation this

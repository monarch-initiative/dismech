name: RNA Polymerase I Nucleolar Stress and Neural Crest Apoptosis Module
description: >-
  The worked mechanism behind the ribosomopathy paradox in craniofacial
  development: how a defect in machinery every cell needs produces a defect in
  one part of the body. RNA polymerase I transcribes the 47S precursor rRNA, the
  rate-limiting step of ribosome biogenesis, so reducing Pol I activity lowers
  rRNA output in every cell. Pol I subunits are most highly expressed in the
  neuroepithelium and in neural crest cells, which sustain unusually high rates
  of rRNA transcription and protein translation, and those progenitors therefore
  cross the deficit threshold first. In them the shortfall of rRNA leaves
  ribosomal proteins in excess of the rRNA they should have assembled with; free
  RPL5 and RPL11 bind MDM2 and displace it from p53; p53 accumulates and kills
  the cell. Neural crest builds most of the craniofacial skeleton, so the tissue
  that is most sensitive to the lesion is also the one whose loss is visible.
  The chain is trigger (reduced Pol I rRNA transcription) -> amplifier
  (tissue-selective threshold failure) -> central_effector (nucleolar stress and
  RPL5/RPL11 sequestration of MDM2, the key conformance target and the
  disorder-agnostic rate-limiting step) -> effector (p53-dependent apoptosis) ->
  consequence (depletion of neural-crest-derived craniofacial skeletal
  precursors). A second, EMERGING hypothesis group models the documented
  p53-independent arm: inhibiting tp53 in polr1a-mutant zebrafish suppresses the
  apoptosis and only partially rescues cartilage, because rDNA transcription and
  neural crest proliferation stay impaired, so part of the deficit is a failure
  to generate progenitors rather than to keep them alive. The drug-target
  pattern is p53 inhibition acting on the apoptosis node, which is preclinical
  target validation in mouse and zebrafish and not a human therapy. Worked
  conformers are Acrofacial_Dysostosis_Cincinnati_Type (POLR1A, the flagship,
  which conforms at every node) and Treacher_Collins_Syndrome (TCOF1, POLR1B,
  POLR1C, POLR1D). Complementary to, and not overlapping with,
  pharyngeal_arch_patterning_serial_homology, which takes over where this module
  ends: this module explains why the neural crest population is depleted, and
  that module explains why depleting it yields a serially repeated malformation
  bundle across arch derivatives rather than an isolated defect.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
creation_date: "2026-09-17T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  "Pol I ribosomopathy" or "nucleolar stress" Disease entry; disorder entries
  reference individual nodes via conforms_to, for example
  "pol1_nucleolar_stress_neural_crest_apoptosis#Nucleolar Stress and RPL5/RPL11
  Sequestration of MDM2". Conforming nodes substitute the disorder-specific
  lesion at the trigger node (POLR1A in acrofacial dysostosis Cincinnati type;
  TCOF1, POLR1B, POLR1C or POLR1D in Treacher Collins syndrome) while keeping
  the conserved MDM2-p53 checkpoint and the apoptosis-to-precursor-depletion
  chain. Modules bind GO and CL terms only, so the genes are named in prose here
  and belong in the conforming entry's genetic section.

  Scope, and the boundary that most needs stating. This module is scoped to the
  Pol I TRANSCRIPTION trigger, which is what makes the tissue-selectivity
  argument work: the threshold node depends on Pol I subunits being most highly
  expressed in neuroepithelium and neural crest, a claim about Pol I and not
  about ribosome biogenesis generally. Other ribosomopathies reach the same
  MDM2-p53 checkpoint from a different upstream lesion. Diamond-Blackfan anemia
  already curates free RPL5/RPL11 binding MDM2 and stabilizing p53
  independently, but its trigger is ribosomal-protein haploinsufficiency
  impairing subunit assembly, and its selectively vulnerable lineage is
  erythroid rather than neural crest. Shwachman-Diamond syndrome reaches a
  p53-dependent progenitor apoptosis node through failed eIF6 eviction. Neither
  has been given conforms_to here, deliberately, and neither should be without a
  decision on whether this module stays a Pol I module or is generalized to
  nucleolar stress with several upstream triggers. Widening it would change
  which entries the module gates, and the tissue-threshold argument would have
  to be restated per lineage rather than once.

  The sharpest boundary case is not either of those, because both differ in
  lineage as well as in trigger. It is EFTUD2-related mandibulofacial dysostosis
  with microcephaly, which depletes the same cranial neural crest through the
  same MDM2-p53 checkpoint, and even uses the same pifithrin-alpha rescue. What
  excludes it is the entry point rather than the lineage: EFTUD2 loss reaches
  p53 by mis-splicing MDM2 itself, producing a transcript that skips exon 3, and
  not by nucleolar stress freeing RPL5 and RPL11 to sequester it. It therefore
  fails at this module's central_effector, which is where a conformer must
  match. That criterion is the durable one, and it would still hold if this
  module were ever renamed around nucleolar stress. Whether the shared
  p53-checkpoint segment eventually deserves a module of its own, that this one
  and the EFTUD2 entry both feed into, is a real question and is not settled
  here.

  Two binding notes for conformers. The `Experimental p53 Inhibition` treatment
  carries no `therapeutic_agent` because no suitable term exists to carry: CHEBI
  has only `CHEBI:229924` pifithrin-alpha hydrobromide, a salt the cited studies
  do not name, and NCIT returns nothing for pifithrin at all. Binding the salt
  would manufacture a narrower match than the sources support, so the slot is
  deliberately empty. Separately, this module's consequence node binds
  `CL:0000333` migratory neural crest cell because it describes precursors that
  have already reached the arches. A conforming node whose own scope also covers
  premigratory crest lost to apoptosis is right to bind the general
  `CL:0011012` instead, as the POLR1A entry does; that is a real distinction and
  not a conformance gap to normalize away.

  Species note. The p53 rescue experiments that establish the causal weight of
  the apoptosis node are mouse and zebrafish. Genetic or pharmacologic p53
  inhibition rescues craniofacial development in those models without restoring
  ribosome biogenesis; no human disease-modifying intervention follows from it,
  and the treatments block here records preclinical target validation rather
  than clinical practice.
mechanistic_hypotheses:
- hypothesis_group_id: pol1_nucleolar_stress_ncc_apoptosis
  hypothesis_label: Pol I Nucleolar-Stress and Neural Crest Apoptosis Model
  status: CANONICAL
  description: >-
    Reduced Pol I activity lowers 47S rRNA transcription. Because neuroepithelium
    and neural crest cells run rRNA transcription and protein translation at
    unusually high rates, they are the first tissues to fall below threshold. The
    resulting imbalance between ribosomal proteins and rRNA frees RPL5 and RPL11
    to bind MDM2, p53 escapes degradation and accumulates, and the affected cells
    die. The craniofacial skeleton is built by exactly those cells. CANONICAL
    because human genetics, zebrafish polr1a, polr1b, polr1c and polr1d mutants,
    lineage-restricted mouse conditional knockouts, and the RPL5/RPL11-MDM2
    biochemistry all support it, and because p53 inhibition rescues the
    phenotype in two species.
  evidence:
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NCC-specific deletion of Pol I subunits Polr1a, Polr1c, and associated
      factor Tcof1 in mice cell-autonomously diminishes rRNA synthesis, which
      leads to p53 protein accumulation, resulting in NCC apoptosis and
      craniofacial anomalies.
    explanation: >-
      Three different Pol I genes deleted in one lineage give one mechanism,
      which is the evidence that this is a single shared chain rather than
      several similar ones.
- hypothesis_group_id: pol1_p53_independent_arm
  hypothesis_label: p53-Independent Arm of Pol I Ribosomopathy
  status: EMERGING
  description: >-
    Blocking p53 is not enough. In polr1a-mutant zebrafish, genetic tp53
    inhibition suppresses neuroepithelial apoptosis and partially improves the
    phenotype, but cartilage development is not fully rescued because rDNA
    transcription and neural crest cell proliferation remain impaired. Part of
    the craniofacial deficit therefore comes from failing to make enough
    progenitors rather than from killing the ones that were made, and that arm is
    not p53-dependent. The same dissociation appears in the Tcof1 mouse, where
    the craniofacial rescue by p53 inhibition occurs without any improvement in
    ribosome biogenesis. EMERGING because the dissociation is established in two
    models and its molecular basis is not.
  evidence:
  - reference: PMID:29750247
    reference_title: "tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      these data reveal specific functions for both Tp53-dependent and
      independent signaling downstream of polr1a in ribosome biogenesis during
      neural crest cell and craniofacial development
    explanation: >-
      The authors' own summary that two arms exist downstream of the same
      lesion, which is what this module models as two hypothesis groups rather
      than one chain.
discussions:
- discussion_id: gap_pol1_p53_independent_arm_mediator
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What mediates the p53-independent arm, the failure of neural crest cells to
    proliferate that persists after tp53 inhibition?
  attaches_to:
  - pathophysiology#p53-Independent Neural Crest Proliferation Failure
  - mechanistic_hypotheses#pol1_p53_independent_arm
  rationale: >-
    The p53 arm is worked out from rRNA imbalance through RPL5/RPL11-MDM2 to
    apoptosis. The other arm is defined only by what remains after p53 is
    removed: rDNA transcription and neural crest proliferation stay impaired and
    cartilage is not fully rescued. No molecular mechanism has been proposed for
    it. This is the gap with the clearest therapeutic consequence in the module,
    because a p53-directed intervention would by construction leave this arm
    untouched.
- discussion_id: gap_pol1_threshold_lineage_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the tissue-threshold argument predict which lineages a given Pol I
    lesion affects, or only that the most transcriptionally demanding lineage
    fails first?
  attaches_to:
  - pathophysiology#Tissue-Selective Threshold Failure in Neuroepithelium and Neural Crest
  rationale: >-
    Conditional deletion of Polr1a in neural crest, in the second heart field,
    and in forebrain precursors each causes cell-autonomous apoptosis in that
    lineage, so the sensitive population is wider than neural crest alone and the
    craniofacial emphasis of this module reflects which lineage fails at the
    mildest deficit rather than an exclusive susceptibility. Whether the residual
    Pol I activity of a particular allele predicts which lineages decompensate
    has not been shown, and it is what determines whether the model is
    prognostic or only explanatory.
pathophysiology:
- name: Reduced Pol I rRNA Transcription
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The conserved initiating lesion. RNA polymerase I transcribes the 47S
    precursor rRNA that is processed into the 5.8S, 18S and 28S rRNAs of the
    ribosome, and that transcription is the rate-limiting step of ribosome
    biogenesis. Loss of a Pol I subunit, or of a factor the polymerase depends
    on, lowers 47S output, reduces monosomes and polysomes, and impairs protein
    translation. This node is where the housekeeping defect sits, before any
    tissue selectivity has entered the picture, and it is where a conforming
    entry substitutes its own gene: POLR1A, POLR1B, POLR1C, POLR1D, or the
    nucleolar cofactor TCOF1 whose product Treacle is required for the same
    step.

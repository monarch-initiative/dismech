      polr1a loss of function led to perturbed ribosome biogenesis and
      p53-dependent cell death, resulting in a deficiency of neural-crest-derived
      skeletal precursor cells and consequently craniofacial anomalies.
    explanation: >-
      The whole chain from ribosome biogenesis through p53 to skeletal precursor
      deficiency and craniofacial anomaly, stated in one sentence.
  - reference: PMID:16938878
    reference_title: "Tcof1/Treacle is required for neural crest cell formation and proliferation deficiencies that cause craniofacial abnormalities."
    supports: SUPPORT
    evidence_source: OTHER

- name: p53-Independent Neural Crest Proliferation Failure
  role: effector
  biological_scale: CELLULAR
  description: >-
    The p53-independent arm, and the reason blocking p53 does not fix the disease
    in the models. In polr1a-mutant zebrafish, tp53 inhibition removes the
    apoptosis but leaves rDNA transcription and neural crest cell proliferation
    impaired, and cartilage development is correspondingly only partly rescued.
    Part of the craniofacial deficit is therefore a failure to generate enough
    progenitors rather than a failure to keep the generated ones alive. The
    Tcof1 mouse shows the mirror image of the same dissociation: the craniofacial
    rescue by p53 inhibition happens without any improvement in ribosome
    biogenesis. The distinction matters therapeutically, because a p53-directed
    intervention addresses one arm and by construction not the other. This node
    carries the EMERGING hypothesis group; a conforming entry should copy it only
    when its own disease-specific edge belongs to that model.

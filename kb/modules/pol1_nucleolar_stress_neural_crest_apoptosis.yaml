- name: Nucleolar Stress and RPL5/RPL11 Sequestration of MDM2
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The key conformance target, and the disorder-agnostic rate-limiting step
    every conformer funnels through. This is the biochemical event that converts
    a shortage of rRNA into a p53 signal. When rRNA synthesis falls, ribosomal
    proteins are made in excess of the rRNA they should assemble with; free RPL5
    and RPL11 bind MDM2, the E3 ligase that normally keeps p53 degraded, and
    MDM2's binding to p53 falls correspondingly. This is the canonical
    impaired-ribosome-biogenesis checkpoint, and it was demonstrated for Pol I
    subunit loss specifically, in mouse neural crest, rather than assumed from
    the general checkpoint literature. A conforming node should carry the
    nucleolar compartment and the p53-signalling process, and should not
    substitute a different sensor.

- name: Tissue-Selective Threshold Failure in Neuroepithelium and Neural Crest
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    The node that answers the central puzzle of every ribosomopathy: why a
    ubiquitous defect gives a localised disease. Pol I subunits are most highly
    expressed in the neuroepithelium and in neural crest cells; that expression
    sustains the elevated rRNA transcription those progenitors need for their
    high rate of protein translation, and it is exactly what makes them the first
    cells to fall below threshold when rRNA synthesis is reduced. The
    selectivity is a threshold effect on a shared requirement, not a
    tissue-restricted pathway, which is why it is an amplifier of the trigger
    rather than a separate lesion. The sensitive set is not exclusively neural
    crest: conditional deletion of a Pol I subunit in the second heart field or
    in forebrain precursors kills cells there too. Craniofacial involvement
    dominates because neural crest builds most of the craniofacial skeleton and
    fails at the mildest deficit.
  cell_types:

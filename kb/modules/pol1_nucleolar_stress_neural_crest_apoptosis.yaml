    term:
      id: GO:0005730
      label: nucleolus
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
    modifier: INCREASED
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  evidence:
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mechanistically, we demonstrate that diminished rRNA synthesis causes an imbalance between rRNA and ribosomal proteins.
    explanation: >-
      The upstream imbalance that makes the ribosomal proteins available to bind
      MDM2 in the first place.
  - reference: PMID:35881792
    reference_title: "Dynamic regulation and requirement for ribosomal RNA transcription during mammalian development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This leads to increased binding of ribosomal proteins Rpl5 and Rpl11 to Mdm2 and concomitantly diminished binding between Mdm2 and p53.
    explanation: >-
      The specific molecular event this node asserts, measured in Pol I subunit
      mutants rather than inferred.
  - reference: PMID:18246078
    reference_title: "Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Haploinsufficiency of Tcof1 perturbs mature ribosome biogenesis, resulting

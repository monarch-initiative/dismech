treatments:
- name: Experimental p53 Inhibition
  description: >-
    The drug-target pattern of this module, and preclinical target validation
    rather than a human therapy. Genetic inhibition of tp53 in polr1a, polr1c and
    polr1d mutant zebrafish and in the Tcof1 mouse suppresses the neuroepithelial
    apoptosis and rescues craniofacial development, and the small-molecule p53
    inhibitor pifithrin-alpha reproduces the effect pharmacologically in a
    polr1c zebrafish model within a narrow developmental window. It is curated
    here because the rescue is what establishes the apoptosis node as causal, and
    because it identifies the node a therapy would have to act on. It is not a
    treatment for any human disease: the intervention is embryonic, it does not
    correct ribosome biogenesis, it leaves the p53-independent arm untouched, and
    inhibiting a tumour suppressor during development has consequences no model
    has assessed. A conforming disorder entry should not present it as management.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: p53 inhibition
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: p53-Dependent Neuroepithelial and Neural Crest Apoptosis
    treatment_effect: INHIBITS
    description: >-
      Blocking p53 activation prevents the apoptotic elimination of
      neuroepithelial and neural crest cells, which partially rescues the
      craniofacial phenotype without restoring rRNA transcription.
  evidence:
  - reference: PMID:18246078
    reference_title: "Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      inhibition of p53 prevents cyclin G1-driven apoptotic elimination of
      neural crest cells while rescuing the craniofacial abnormalities
      associated with mutations in Tcof1 and extending life span.
    explanation: >-
      The mouse rescue that validates the apoptosis node as the target of this
      intervention.
  - reference: PMID:38556235
    reference_title: "p53 inhibitor or antioxidants reduce the severity of ethmoid plate deformities in zebrafish Type 3 Treacher Collins syndrome model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Utilizing p53 inhibitor (Pifithrin-α; PFT-α) or antioxidants (Glutathione;
      GSH and N-Acetyl-L-cysteine; NAC) effectively corrected migrated NCC
      distribution in the pharyngeal arch (PA), suppressed oxidative stress,
      prevented cell death, and modulated EMT inducers.
    explanation: >-
      A pharmacological rather than genetic p53 inhibition, in a Pol I subunit
      model, which is what makes this a drug-target pattern and not only a
      genetic epistasis result.

name: Dopamine Receptor Agonism Module
description: 'Direct pharmacological activation of D2-subfamily dopamine receptors (D2 and D3) by dopamine agonist drugs, and the consequences that follow in the two tissues where this class is used therapeutically: the striatum, where postsynaptic receptor activation substitutes for a failing presynaptic dopamine supply, and the adenohypophysis, where lactotroph D2 activation suppresses prolactin release. The key conformance target is the central effector, "Direct Postsynaptic D2/D3 Signalling Independent of Presynaptic Dopamine", which is the step that every therapeutic and adverse branch runs through. This module covers agonism only. Antagonism of the same receptor is a separate module, by the project decision that the two are kept apart because they drive opposite consequence chains. A disease entry that models the drug rather than the mechanism should instead conform at the trigger, "D2/D3 Receptor Agonist Occupancy", which represents the drug''s receptor occupancy rather than the signalling state it produces.'
category: Module
module_categories:
- PHARMACOLOGY
- NEUROSCIENCE
creation_date: '2026-10-23T15:50:00Z'
notes: 'Scope decisions recorded for the next curator. The emesis node is bound to no anatomical site: the pooled apomorphine safety data establish that nausea and vomiting occur on this class, but say nothing about where, so the conventional area postrema attribution is not asserted here. The impulse-control node binds no receptor gene for the same reason -- the D3-preference of pramipexole is documented in vitro and the clinical association is documented epidemiologically, but no cited source links the two, and the cited prevalence study found similar rates for pramipexole and ropinirole, which is evidence against a drug-specific subtype explanation. Ergot-derived agonist valvulopathy is a real class effect and is not modelled, because no candidate conformer in the knowledge base carries it.'
pathophysiology:
- name: D2/D3 Receptor Agonist Occupancy
  role: trigger
  biological_scale: MOLECULAR
  description: A dopamine agonist drug binds and activates D2-subfamily receptors directly. The class is selective for this subfamily over adrenergic and serotonergic receptors, and within it the non-ergot agents have preferential affinity for D3.
  molecular_functions:
  - preferred_term: dopamine D2/D3 receptor activation by an agonist drug
    term:
      id: GO:0001591
      label: dopamine neurotransmitter receptor activity, coupled via Gi/Go
    modifier: INCREASED
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  genes:
  - preferred_term: DRD2
    term:
      id: hgnc:3023
      label: DRD2
  - preferred_term: DRD3
    term:
      id: hgnc:3024
      label: DRD3
  evidence:
  - reference: PMID:9617505
    reference_title: "Pharmacology of pramipexole, a dopamine D3-preferring agonist useful in treating Parkinson's disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: First, it has high selectivity for interacting with dopamine D2 subfamily receptors (D2, D3, and D4 receptor subtypes) and has little interaction with adrenergic or serotonergic receptors.
    explanation: Establishes that the drug class acts on the D2 subfamily rather than on other aminergic receptors, which is what makes this node receptor-specific.
  - reference: PMID:9617505
    reference_title: "Pharmacology of pramipexole, a dopamine D3-preferring agonist useful in treating Parkinson's disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Second, within the D2 subfamily, it has preferential affinity for the D3 receptor subtype, which, according to preclinical studies, could contribute additional efficacy for treatment of both motor and psychiatric syndromes in Parkinson's disease.
    explanation: Supports binding both DRD2 and DRD3 on this node rather than DRD2 alone.
  downstream:
  - target: Direct Postsynaptic D2/D3 Signalling Independent of Presynaptic Dopamine
  - target: Lactotroph D2 Activation Suppressing Prolactin Secretion
- name: Direct Postsynaptic D2/D3 Signalling Independent of Presynaptic Dopamine
  role: central_effector
  biological_scale: CELLULAR
  description: Agonist occupancy drives Gi/Go-coupled signalling at the receptor itself, so the response does not depend on presynaptic dopamine synthesis, storage or release. This is the step that distinguishes the class from levodopa, which must first be taken up and decarboxylated by surviving neurons, and it is why agonists retain effect as the presynaptic terminal is lost.
  biological_processes:
  - preferred_term: adenylate cyclase-inhibiting dopamine receptor signaling pathway
    term:
      id: GO:0007195
      label: adenylate cyclase-inhibiting dopamine receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:9617505
    reference_title: "Pharmacology of pramipexole, a dopamine D3-preferring agonist useful in treating Parkinson's disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Third, it has full intrinsic activity at dopamine D2 subfamily receptors.
    explanation: Full intrinsic activity at the receptor is what makes the downstream signalling independent of how much endogenous dopamine is available.
  downstream:
  - target: Fewer Motor Complications but Less Symptomatic Benefit Than Levodopa
  - target: Impulse Control Disorders on Dopamine Agonist Therapy
  - target: Somnolence and Peripheral Oedema on Dopamine Agonist Therapy
  - target: Nausea and Vomiting on Dopamine Agonist Therapy
- name: Fewer Motor Complications but Less Symptomatic Benefit Than Levodopa
  role: consequence
  biological_scale: ORGANISM
  description: 'Beginning treatment with an agonist rather than levodopa halves the risk of dyskinesia and reduces wearing off, and costs symptomatic control: at four years the levodopa arm had the better motor score. Both halves of that trade-off are this node, because a module that recorded only the benefit would misrepresent the class.'
  evidence:
  - reference: PMID:15262734
    reference_title: "Pramipexole vs levodopa as initial treatment for Parkinson disease: a 4-year randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: 'RESULTS: Initial pramipexole treatment resulted in a significant reduction in the risk of developing dyskinesias (24.5% vs 54%; hazard ratio, 0.37; 95% confidence interval [CI], 0.25-0.56; P<.001) and wearing off (47% vs 62.7%; hazard ratio, 0.68; 95% CI, 0.49-0.63; P =.02).'
    explanation: The motor-complication-sparing half of the trade-off, from the randomized comparison against levodopa initiation.
  - reference: PMID:15262734
    reference_title: "Pramipexole vs levodopa as initial treatment for Parkinson disease: a 4-year randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The mean improvement in the total Unified Parkinson's Disease Rating Scale score from baseline to 48 months was greater in the levodopa group than in the pramipexole group (2 +/- 15.4 points vs -3.2 +/- 17.3 points, P =.003).
    explanation: 'The cost half of the same trade-off: agonist initiation gave less symptomatic benefit than levodopa over four years.'
- name: Impulse Control Disorders on Dopamine Agonist Therapy
  role: adverse_effect
  biological_scale: ORGANISM
  description: Gambling, compulsive sexual behaviour, compulsive buying and binge eating are about two and a half times as common on an agonist as off one. The rate is similar for pramipexole and ropinirole, so this reads as a class effect of D2-subfamily agonism rather than a property of one drug.
  evidence:
  - reference: PMID:20457959
    reference_title: "Impulse control disorders in Parkinson disease: a cross-sectional study of 3090 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Impulse control disorders were more common in patients treated with a dopamine agonist than in patients not taking a dopamine agonist (17.1% vs 6.9%; odds ratio [OR], 2.72; 95% confidence interval [CI], 2.08-3.54; P < .001).
    explanation: Quantifies the association between agonist exposure and impulse control disorders in 3090 patients.
  - reference: PMID:20457959
    reference_title: "Impulse control disorders in Parkinson disease: a cross-sectional study of 3090 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Impulse control disorder frequency was similar for pramipexole and ropinirole (17.7% vs 15.5%; OR, 1.22; 95% CI, 0.94-1.57; P = .14).
    explanation: Supports describing this as a class effect, and argues against attributing it to one drug's receptor-subtype profile.
- name: Somnolence and Peripheral Oedema on Dopamine Agonist Therapy
  role: adverse_effect
  biological_scale: ORGANISM
  description: Daytime somnolence and peripheral oedema are both substantially more frequent on agonist than on levodopa initiation, and are the usual reasons for dose reduction or withdrawal.
  evidence:
  - reference: PMID:15262734
    reference_title: "Pramipexole vs levodopa as initial treatment for Parkinson disease: a 4-year randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Somnolence (36% vs 21%, P =.005) and edema (42% vs 15%, P<.001) were more common in pramipexole-treated subjects than in levodopa-treated subjects.
    explanation: Direct randomized comparison establishing both adverse effects against a levodopa control.
- name: Nausea and Vomiting on Dopamine Agonist Therapy
  role: adverse_effect
  biological_scale: ORGANISM
  description: 'Nausea and vomiting are dose-limiting on initiation and are why parenteral apomorphine is given with an antiemetic. No anatomical site is bound on this node: see the module notes.'
  evidence:
  - reference: PMID:41310565
    reference_title: "Identification of the efficacy and safety of apomorphine in the treatment of Parkinson's disease via meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: In terms of safety analyses from single-armed studies, apomorphine treatment was associated with several AES, including nausea, drowsiness, vomiting, dizziness, and excessive sweating.
    explanation: Establishes nausea and vomiting as adverse effects of direct D2-subfamily agonism, pooled across studies.
- name: Lactotroph D2 Activation Suppressing Prolactin Secretion
  role: effector
  biological_scale: CELLULAR
  description: D2 receptors on pituitary lactotrophs tonically restrain prolactin release, and an agonist reinstates that restraint pharmacologically. This is the same receptor on the same cell type whose tonic restraint a D2 antagonist removes, with the sign reversed.
  biological_processes:
  - preferred_term: prolactin secretion
    term:
      id: GO:0070459
      label: prolactin secretion
    modifier: DECREASED
  cell_types:
  - preferred_term: mammotroph
    term:
      id: CL:0002311
      label: mammotroph
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  genes:
  - preferred_term: DRD2
    term:
      id: hgnc:3023
      label: DRD2
  evidence:
  - reference: PMID:7915824
    reference_title: "A comparison of cabergoline and bromocriptine in the treatment of hyperprolactinemic amenorrhea. Cabergoline Comparative Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Cabergoline is a long-acting dopamine-agonist drug that suppresses prolactin secretion and restores gonadal function in women with hyperprolactinemic amenorrhea.
    explanation: States the suppression of prolactin secretion by a dopamine agonist, which is this node.
  downstream:
  - target: Normoprolactinaemia and Restored Gonadal Function
- name: Normoprolactinaemia and Restored Gonadal Function
  role: consequence
  biological_scale: ORGANISM
  description: Sustained prolactin suppression returns prolactin to the reference range and restores ovulatory cycles, which is the clinical endpoint dopamine agonists are prescribed for in hyperprolactinaemia.
  evidence:
  - reference: PMID:7915824
    reference_title: "A comparison of cabergoline and bromocriptine in the treatment of hyperprolactinemic amenorrhea. Cabergoline Comparative Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: 'RESULTS: Stable normoprolactinemia was achieved in 186 of the 223 women treated with cabergoline (83 percent) and 138 of the 236 women treated with bromocriptine (59 percent, P < 0.001).'
    explanation: The biochemical endpoint, from the randomized comparison of two dopamine agonists.
  - reference: PMID:7915824
    reference_title: "A comparison of cabergoline and bromocriptine in the treatment of hyperprolactinemic amenorrhea. Cabergoline Comparative Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Seventy-two percent of the women treated with cabergoline and 52 percent of those treated with bromocriptine had ovulatory cycles or became pregnant during treatment (P < 0.001).
    explanation: The gonadal endpoint that follows from prolactin normalization.

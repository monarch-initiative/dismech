name: Sperm Flagellum Assembly Failure Module
description: >-
  A conserved mechanism module for multiple morphological abnormalities of the
  sperm flagella (MMAF), the monogenic asthenoteratozoospermia in which
  spermatids fail to build a normal flagellum. Biallelic loss of one of more
  than forty axonemal or peri-axonemal proteins (inner- and outer-arm dynein
  heavy chains such as DNAH1 and DNAH17, the CFAP43/CFAP44 tether, central-pair
  and radial-spoke-associated proteins such as SPEF2 and CFAP251, the
  midpiece protein CFAP69, fibrous-sheath proteins such as FSIP2), or of the
  intraflagellar and intra-manchette transport that delivers them, converges
  on one key conformance target: Sperm Axonemal Disorganization, the loss of
  the 9+2 axoneme with mislocalized doublets, frequent central-pair loss and
  disordered peri-axonemal structures. That disorganization produces the MMAF
  morphology (absent, short, coiled, bent and irregular-caliber flagella),
  which causes asthenozoospermia and male infertility. The drug-target pattern
  is bypass rather than repair: intracytoplasmic sperm injection (ICSI) acts
  on the infertility node by making motility irrelevant to fertilization. The
  module is complementary to ciliopathy_dysfunction, whose Motile Cilia Beat
  Dysfunction node models failure of an assembled axoneme to beat (the airway,
  nodal and ependymal branch of primary ciliary dyskinesia), and to
  meiotic_prophase_failure, which models arrest before spermatids form; an
  MMAF gene that also causes airway disease conforms here for its sperm
  branch and to ciliopathy_dysfunction for its airway branch.
category: Module
module_categories:
- DEVELOPMENTAL_BIOLOGY
creation_date: "2026-11-24T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to, for example
  "sperm_flagellum_assembly_failure#Sperm Axonemal Disorganization". Most
  conforming entries are the numbered spermatogenic failure (SPGF) entries for
  single MMAF genes; their protein-loss node conforms to the trigger, any
  intraflagellar or intra-manchette transport node to the transport node, and
  their axonemal and MMAF nodes to the two nodes of the same name. Gene-level
  substitutions are expected: a dynein heavy chain entry adds an inner- or
  outer-arm loss step, a calmodulin- and spoke-associated complex entry adds
  that complex, and a centriolar or basal-body entry such as DZIP1 may arrest
  axoneme outgrowth before any 9+2 structure forms and so conform only to the
  trigger and MMAF nodes. Do not use this module for globozoospermia or
  acephalic spermatozoa, which are head and head-tail coupling defects, or for
  isolated asthenozoospermia with normal flagellar morphology. Whether
  respiratory, laterality or hydrocephalus phenotypes accompany MMAF depends
  on the gene and belongs to the ciliopathy_dysfunction branch, not this one.
  Mouse knockouts of MMAF genes often add oligozoospermia and sperm head
  defects that patients with the same gene do not show; conforming entries
  should record that as a model divergence rather than as part of this chain.
pathophysiology:
- name: Loss of a Sperm Axonemal or Peri-Axonemal Protein
  description: >-
    Biallelic, usually truncating, variants remove a protein that forms or
    anchors part of the sperm axoneme or its peri-axonemal structures: an
    axonemal dynein heavy chain, a dynein tether, a central-pair or
    radial-spoke-associated protein, or a fibrous-sheath, mitochondrial-sheath
    or midpiece protein. More than one thousand proteins localize to the human
    sperm flagellum, which explains the genetic heterogeneity of MMAF.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: spermatid
    term:
      id: CL:0000018
      label: spermatid
  cellular_components:
  - preferred_term: sperm flagellum
    term:
      id: GO:0036126
      label: sperm flagellum
  examples:
  - DNAH1
  - DNAH17
  - CFAP43
  - CFAP44
  - CFAP69
  - CFAP251
  - SPEF2
  - FSIP2
  - ARMC2
  evidence:
  - reference: PMID:31950240
    reference_title: "The genetic architecture of morphological abnormalities of the sperm tail."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recent studies have demonstrated that MMAF is genetically heterogeneous which is consistent with the large number of proteins (over one thousand) localized in the human sperm flagella."
    explanation: Many flagellar proteins can be the initiating loss.
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither the transcript nor the protein was observed in this individual, confirming the pathogenicity of this variant."
    explanation: The founding MMAF gene, DNAH1, acts through loss of the protein.
  - reference: PMID:29606301
    reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunostaining experiments in sperm from fertile control individuals showed that CFAP69 localized to the midpiece of the flagellum, and the absence of CFAP69 was confirmed in both individuals carrying CFPA69 mutations."
    explanation: A second, structurally unrelated flagellar protein is lost in patients.
  downstream:
  - target: Defective Cargo Delivery to the Growing Flagellum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Applies to genes whose products travel with or depend on the transport
      machinery; for structural components the loss acts directly on the
      axoneme instead.
  - target: Sperm Axonemal Disorganization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24360805
      reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A general axonemal disorganization including mislocalization of the microtubule doublets and loss of the inner dynein arms was observed."
      explanation: Loss of one axonemal dynein disorganizes the whole axoneme.
- name: Defective Cargo Delivery to the Growing Flagellum
  description: >-
    During spermiogenesis the flagellum is built by intraflagellar transport
    (IFT), and the spermatid manchette carries cargo by the related
    intra-manchette transport (IMT). IFT is required to form, but not to
    maintain, the mammalian sperm flagellum, and some MMAF proteins act in or
    depend on this delivery. Shown mainly in mouse models.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: spermatid
    term:
      id: CL:0000018
      label: spermatid
  biological_processes:
  - preferred_term: intraciliary transport
    modifier: DECREASED
    term:
      id: GO:0042073
      label: intraciliary transport
  - preferred_term: intramanchette transport
    modifier: DECREASED
    term:
      id: GO:1990953
      label: intramanchette transport
  cellular_components:
  - preferred_term: manchette
    term:
      id: GO:0002177
      label: manchette
  examples:
  - IFT88
  - WDR19
  - IFT74
  - CFAP43
  - ARMC2
  - SPEF2
  evidence:
  - reference: PMID:26424803
    reference_title: "Intraflagellar transport is essential for mammalian spermiogenesis but is absent in mature sperm."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus IFT is essential for the formation but not the maintenance of mammalian sperm flagella."
    explanation: IFT is required to build the sperm flagellum.
  - reference: PMID:39457439
    reference_title: "The Molecular Basis of Multiple Morphological Abnormalities of Sperm Flagella and Its Impact on Clinical Practice."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Flagellar assembly processes including the intra-flagellar transport (IFT) and the intra-manchette transport (IMT) are also significant components of the sperm tail."
    explanation: IFT and IMT are recognized as MMAF mechanisms.
  - reference: PMID:33046149
    reference_title: "CFAP43-mediated intra-manchette transport is required for sperm head shaping and flagella formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, our findings demonstrated that, in mice, CFAP43-mediated IMT is essential for sperm head shaping and sperm flagellum formation."
    explanation: An MMAF gene acts through intra-manchette transport in mice.
  downstream:
  - target: Sperm Axonemal Disorganization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26424803
      reference_title: "Intraflagellar transport is essential for mammalian spermiogenesis but is absent in mature sperm."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The short flagella rarely have axonemes but assemble ectopic microtubules and outer dense fibers and accumulate improperly assembled fibrous sheath proteins."
      explanation: Without IFT, spermatids fail to assemble an organized axoneme.
- name: Sperm Axonemal Disorganization
  description: >-
    The key conformance target. The 9+2 axoneme of the sperm flagellum, nine
    outer doublets around a central pair linked by radial spokes and nexin,
    is not assembled or not kept in order: doublets are mislocalized, the
    central pair is often missing, and outer dense fibres, the fibrous sheath
    and the mitochondrial sheath are disordered. Which substructure fails first
    varies by gene, but the disorganized axoneme is the shared lesion.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: sperm
    term:
      id: CL:0000019
      label: sperm
  cellular_components:
  - preferred_term: axoneme
    term:
      id: GO:0005930
      label: axoneme
  - preferred_term: sperm fibrous sheath
    term:
      id: GO:0035686
      label: sperm fibrous sheath
  biological_processes:
  - preferred_term: sperm axoneme assembly
    modifier: DECREASED
    term:
      id: GO:0007288
      label: sperm axoneme assembly
  examples:
  - DNAH1
  - CFAP43
  - CFAP44
  - CFAP69
  - DNAH17
  - CFAP251
  evidence:
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A general axonemal disorganization including mislocalization of the microtubule doublets and loss of the inner dynein arms was observed."
    explanation: Axonemal disorganization in DNAH1 patient sperm.
  - reference: PMID:29606301
    reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ultrastructural analysis of testicular sperm from the knockout mice showed severe disruption of flagellum structure, but histological analysis of testes from these mice revealed the presence of all stages of the seminiferous epithelium, indicating that the overall progression of spermatogenesis is preserved and that the sperm defects likely arise during spermiogenesis."
    explanation: Flagellar structure fails during spermiogenesis while earlier spermatogenesis proceeds.
  - reference: PMID:39457439
    reference_title: "The Molecular Basis of Multiple Morphological Abnormalities of Sperm Flagella and Its Impact on Clinical Practice."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The typical structure of the axoneme is the “9 + 2” structure based on the microtubules and other structures attached to the outer doublet microtubules, including the ODA, the IDA, the N-DRC, and the RS."
    explanation: The axonemal substructures whose loss defines the lesion.
  downstream:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    causal_link_type: DIRECT
- name: Multiple Morphological Abnormalities of the Sperm Flagella
  description: >-
    The disorganized axoneme yields flagella that are absent, short, coiled,
    bent or of irregular caliber, with near-immotile sperm. Sperm counts are
    usually preserved in patients.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: sperm
    term:
      id: CL:0000019
      label: sperm
  biological_processes:
  - preferred_term: sperm flagellum assembly
    modifier: DECREASED
    term:
      id: GO:0120316
      label: sperm flagellum assembly
  evidence:
  - reference: PMID:31950240
    reference_title: "The genetic architecture of morphological abnormalities of the sperm tail."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Multiple morphological abnormalities of the flagella (MMAF), also called short tails, is among the most severe forms of sperm flagellum defects responsible for male infertility and is characterized by the presence in the ejaculate of spermatozoa being short, coiled, absent and of irregular caliber."
    explanation: Defines the MMAF morphology.
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping was carried out on a cohort of 20 North African individuals, including 18 index cases, presenting with primary infertility resulting from impaired sperm motility caused by a mosaic of multiple morphological abnormalities of the flagella (MMAF) including absent, short, coiled, bent, and irregular flagella."
    explanation: The morphology in the founding cohort.
  downstream:
  - target: Asthenozoospermia and Male Infertility
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31950240
      reference_title: "The genetic architecture of morphological abnormalities of the sperm tail."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The flagellum integrity is, therefore, critical for normal sperm function and flagellum defects consistently lead to male infertility due to reduced or absent sperm motility defined as asthenozoospermia."
      explanation: Flagellar defects cause asthenozoospermia and infertility.
- name: Asthenozoospermia and Male Infertility
  description: >-
    Sperm that cannot swim do not reach the oocyte, so affected men have
    primary infertility. Fertilization by direct injection is still possible.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: flagellated sperm motility
    modifier: DECREASED
    term:
      id: GO:0030317
      label: flagellated sperm motility
  evidence:
  - reference: PMID:36425067
    reference_title: "Clinical detection, diagnosis and treatment of morphological abnormalities of sperm flagella: A review of literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "When the ultrastructure of the flagella is abnormal, the sperm is unable to reach the oocyte and achieve insemination."
    explanation: Why flagellar failure causes infertility.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI injects a single sperm into the oocyte, so the motility defect no
    longer prevents fertilization. It is the only assisted reproduction
    option for MMAF and succeeds for most patients, though outcomes vary by
    gene and some cases fail. This is the module's bypass pattern: conforming
    entries record ICSI against their infertility node and add gene-specific
    outcome data.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Asthenozoospermia and Male Infertility
    treatment_effect: BYPASSES
    description: Direct injection makes sperm motility irrelevant to fertilization.
    evidence:
    - reference: PMID:36425067
      reference_title: "Clinical detection, diagnosis and treatment of morphological abnormalities of sperm flagella: A review of literature."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Due to severely reduced sperm motility, the most appropriate and only assisted reproductive technology for MMAF patients is intracytoplasmic sperm injection (ICSI)."
      explanation: ICSI is used because it bypasses motility.
  evidence:
  - reference: PMID:39457439
    reference_title: "The Molecular Basis of Multiple Morphological Abnormalities of Sperm Flagella and Its Impact on Clinical Practice."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intracytoplasmic sperm injection (ICSI) remains the most widely applied assisted reproductive technology (ART) and is effective in treating the majority of MMAF patients"
    explanation: ICSI works for most MMAF patients.
  - reference: PMID:30251428
    reference_title: "Patients with multiple morphological abnormalities of the sperm flagella harbouring CFAP44 or CFAP43 mutations have a good pregnancy outcome following intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results support a good ICSI prognosis for MMAF patients carrying CFAP44 or CFAP43 mutations."
    explanation: Gene-stratified ICSI outcomes are good.
  - reference: PMID:36425067
    reference_title: "Clinical detection, diagnosis and treatment of morphological abnormalities of sperm flagella: A review of literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most MMAF patients obtain a favorable ICSI outcome, but failed cases still occur, which may be attributed to various protein functional defects caused by different gene variants, some of which may affect embryonic development."
    explanation: Outcomes depend on the gene, and some cases fail.

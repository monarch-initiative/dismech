name: Addiction Cycle Module
description: >-
  A conserved neurocircuit module for addiction, the shared mechanism behind
  substance use disorders and behavioural addictions such as gambling disorder.
  It follows the three-stage cycle of Koob and Volkow (PMID:27475769). Rewards
  that produce large, fast mesolimbic dopamine release drive incentive salience
  and a ventral-to-dorsal striatal shift from goal-directed to habitual seeking
  (binge/intoxication stage). Repeated exposure then lowers dopamine
  function and recruits the extended-amygdala stress systems,
  corticotropin-releasing factor and dynorphin, so that negative affect during withdrawal
  drives negative reinforcement (withdrawal/negative affect stage).
  Prefrontal control over the basal ganglia and extended amygdala is degraded
  (preoccupation/anticipation stage). The three stages converge on compulsive
  seeking with loss of control over intake.
  Key conformance target: Reward Deficit and Stress-System Recruitment, the
  opponent-process adaptation that turns repeated reward into a chronic,
  relapsing disorder. Drug-target pattern: opioid-receptor antagonists
  (naltrexone, nalmefene) blunt the reinforcing dopamine response across
  alcohol use disorder and gambling disorder. Conformers substitute the
  agent-specific molecular trigger, for example mu-opioid receptor agonism
  disinhibiting VTA dopamine neurons, or ethanol-evoked endogenous opioid
  release. The substance-specific pharmacology upstream of dopamine release,
  withdrawal physiology outside the reward circuit (opioid noradrenergic
  hyperactivity, alcohol GABA-A/NMDA hyperexcitability), and organ toxicity
  stay on the disorder entries and are not part of this module.
category: Module
module_categories:
- NEUROSCIENCE
- PHARMACOLOGY
creation_date: "2026-09-25T00:00:00Z"
notes: >-
  This is a mechanism module, not a disease. Do not create a generic
  "Substance Use Disorder" or "Addiction" Disease entry from it. The
  agent-specific use disorders (alcohol, opioid, nicotine, cocaine,
  methamphetamine, cannabis) and gambling disorder are the disease entries, and
  they declare conforms_to on their own nodes.

  The trigger node is named for dopamine reinforcement rather than for a drug so
  that a behavioural addiction can conform. In gambling disorder the reinforcer
  is non-drug reward, modulated by endogenous opioid signalling in the striatum.

  The module deliberately carries no pathway that belongs to only one drug
  class: the monoamine-transporter pharmacology of stimulants, CB1 receptor
  downregulation, nicotinic receptor upregulation, and the locus coeruleus
  cAMP superactivation of opioid withdrawal all live on the disorder entries.
  The dynorphin/kappa-opioid arm of the central node is bound to the generic GO
  opioid-receptor signalling process; GO has no kappa-specific signalling term.

  Worked conformers: Alcohol_Use_Disorder, Opioid_Use_Disorder,
  Gambling_Disorder.
pathophysiology:
- name: Acute Mesolimbic Dopamine Reinforcement
  description: >-
    Addictive drugs, and in behavioural addictions the reward itself, produce
    large, fast increases in extracellular dopamine released from ventral
    tegmental area neurons into the nucleus accumbens. The increase exceeds that
    produced by natural rewards and is the proximate reinforcing signal. Drug
    classes reach this step by different routes (transporter blockade or
    reversal, disinhibition of dopamine neurons, nicotinic excitation), which
    conforming entries record upstream of this node.
  role: trigger
  biological_processes:
  - preferred_term: mesolimbic dopamine release
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  locations:
  - preferred_term: ventral tegmental area
    term:
      id: UBERON:0002691
      label: ventral tegmental area
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  evidence:
  - reference: PMID:2899326
    reference_title: Drugs abused by humans preferentially increase synaptic dopamine concentrations in the mesolimbic system of freely moving rats.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drugs abused by humans (e.g., opiates, ethanol, nicotine, amphetamine, and
      cocaine) increased extracellular dopamine concentrations in both areas, but
      especially in the accumbens
    explanation: >-
      Rat microdialysis shows that pharmacologically unrelated drugs of abuse
      converge on increased accumbens dopamine, which is what makes this node
      shared across drug classes.
  - reference: PMID:18617195
    reference_title: Imaging dopamine's role in drug abuse and addiction.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans the reinforcing effects of drugs are associated with large and
      fast increases in extracellular dopamine, which mimic those induced by
      physiological dopamine cell firing but are more intense and protracted.
    explanation: >-
      Summarizes human PET studies linking drug reinforcement to supraphysiological
      dopamine increases.
  downstream:
  - target: Incentive Salience and Habit Formation
  - target: Reward Deficit and Stress-System Recruitment

- name: Incentive Salience and Habit Formation
  description: >-
    Repeated supraphysiological dopamine signalling attaches excessive salience
    to the reward and to the cues that predict it. Cue exposure alone then
    evokes striatal dopamine release and craving. With continued use, control
    over seeking moves from the ventral to the dorsal striatum and from
    goal-directed action to stimulus-driven habit.
  role: amplifier
  biological_processes:
  - preferred_term: drug-cue conditioning and habit learning
    term:
      id: GO:0008306
      label: associative learning
  locations:
  - preferred_term: ventral striatum
    term:
      id: UBERON:0005403
      label: ventral striatum
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The rewarding effects of drugs of abuse, development of incentive salience,
      and development of drug-seeking habits in the binge/intoxication stage
      involve changes in dopamine and opioid peptides in the basal ganglia.
    explanation: >-
      Places incentive salience and habit formation in the binge/intoxication
      stage and ties them to basal ganglia dopamine and opioid peptides. The
      review draws on both animal and human work, so evidence_source is OTHER.
  - reference: PMID:16251991
    reference_title: "Neural systems of reinforcement for drug addiction: from actions to habits to compulsion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We hypothesize that the change from voluntary drug use to more habitual and
      compulsive drug use represents a transition at the neural level from
      prefrontal cortical to striatal control over drug seeking and drug taking
      behavior as well as a progression from ventral to more dorsal domains of
      the striatum
    explanation: >-
      States the ventral-to-dorsal striatal transition that underlies habitual
      seeking. The hypothesis rests on rodent self-administration work.
  - reference: PMID:18617195
    reference_title: Imaging dopamine's role in drug abuse and addiction.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In parallel, conditioning triggered by drugs leads to enhanced dopamine
      signaling when exposed to conditioned cues, which then drives the
      motivation to procure the drug in part by activation of prefrontal and
      striatal regions.
    explanation: >-
      Human imaging shows that drug-paired cues come to evoke dopamine signalling
      and drive drug-seeking motivation.
  downstream:
  - target: Compulsive Seeking and Loss of Control

- name: Reward Deficit and Stress-System Recruitment
  description: >-
    Repeated exposure provokes opponent-process adaptations. Within the reward
    system, dopamine release and D2 receptor availability fall, so natural and
    drug rewards produce less effect. Between systems, corticotropin-releasing
    factor and dynorphin signalling are recruited in the extended amygdala, and
    dynorphin acting at kappa-opioid receptors further suppresses accumbens
    dopamine. The result is hyperkatifeia, an intensified negative emotional
    state during withdrawal that persists into protracted abstinence. Relief of
    that state drives seeking through negative reinforcement. This is the key
    conformance target: the adaptation that turns repeated reward into a
    chronic, relapsing disorder.
  role: central_effector
  biological_processes:
  - preferred_term: reduced mesolimbic dopamine release
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  - preferred_term: corticotropin-releasing factor signalling in the extended amygdala
    term:
      id: GO:0071376
      label: cellular response to corticotropin-releasing hormone stimulus
    modifier: INCREASED
  - preferred_term: dynorphin/kappa-opioid receptor signalling
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
    modifier: INCREASED
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: central amygdala
    term:
      id: UBERON:0002883
      label: central amygdaloid nucleus
  - preferred_term: bed nucleus of the stria terminalis
    term:
      id: UBERON:0001880
      label: bed nucleus of stria terminalis
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The increases in negative emotional states and dysphoric and stress-like
      responses in the withdrawal/negative affect stage involve decreases in the
      function of the dopamine component of the reward system and recruitment of
      brain stress neurotransmitters, such as corticotropin-releasing factor and
      dynorphin, in the neurocircuitry of the extended amygdala.
    explanation: >-
      States both arms of this node, the within-system dopamine deficit and the
      between-system recruitment of CRF and dynorphin in the extended amygdala.
  - reference: PMID:18617195
    reference_title: Imaging dopamine's role in drug abuse and addiction.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indeed, imaging studies show that drug abusers have marked decreases in
      dopamine D2 receptors and in dopamine release.
    explanation: >-
      Human PET evidence for the within-system reward deficit in addicted
      individuals.
  - reference: PMID:2899326
    reference_title: Drugs abused by humans preferentially increase synaptic dopamine concentrations in the mesolimbic system of freely moving rats.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      drugs with aversive properties (e.g., agonists of kappa opioid receptors,
      U-50,488, tifluadom, and bremazocine) reduced dopamine release in the
      accumbens
    explanation: >-
      Kappa-opioid agonism lowers accumbens dopamine and is aversive in rats.
      This supports the dynorphin arm of the node as a cause of the dopamine
      deficit. It is indirect because exogenous agonists stand in for
      endogenous dynorphin.
  - reference: PMID:33318153
    reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Hyperkatifeia provides an additional source of motivation for compulsive
      drug seeking via negative reinforcement.
    explanation: >-
      Links the negative-affect state produced by this node to compulsive
      seeking, which supports the edge to the consequence node.
  downstream:
  - target: Compulsive Seeking and Loss of Control
  - target: Prefrontal Executive Control Deficit

- name: Prefrontal Executive Control Deficit
  description: >-
    Prefrontal and insular control over the basal ganglia and extended amygdala
    is dysregulated, including their glutamatergic projections. Response
    inhibition fails, salience is attributed excessively to the reward, and
    craving dominates the preoccupation/anticipation stage. Reduced striatal
    dopamine function is associated with lower activity in orbitofrontal,
    cingulate and dorsolateral prefrontal cortex.
  role: effector
  biological_processes:
  - preferred_term: prefrontal glutamatergic projection signalling
    term:
      id: GO:0014047
      label: glutamate secretion
  locations:
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The craving and deficits in executive function in the so-called
      preoccupation/anticipation stage involve the dysregulation of key afferent
      projections from the prefrontal cortex and insula, including glutamate, to
      the basal ganglia and extended amygdala.
    explanation: >-
      Defines this node: dysregulated prefrontal and insular glutamatergic
      output underlying craving and executive dysfunction.
  - reference: PMID:22011681
    reference_title: "Dysfunction of the prefrontal cortex in addiction: neuroimaging findings and clinical implications."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disruption of the PFC in addiction underlies not only compulsive drug
      taking but also accounts for the disadvantageous behaviours that are
      associated with addiction and the erosion of free will.
    explanation: >-
      A review of human functional neuroimaging that places prefrontal disruption
      upstream of compulsive drug taking.
  - reference: PMID:18617195
    reference_title: Imaging dopamine's role in drug abuse and addiction.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This decrease in dopamine function is associated with reduced regional
      activity in orbitofrontal cortex (involved in salience attribution; its
      disruption results in compulsive behaviors), cingulate gyrus (involved in
      inhibitory control; its disruption results in impulsivity) and
      dorsolateral prefrontal cortex (involved in executive function; its
      disruption results in impaired regulation of intentional actions).
    explanation: >-
      Supports the edge from the reward deficit to prefrontal dysfunction: in
      human imaging, reduced dopamine function goes with lower orbitofrontal,
      cingulate and dorsolateral prefrontal activity. The association is
      correlational.
  downstream:
  - target: Compulsive Seeking and Loss of Control

- name: Compulsive Seeking and Loss of Control
  description: >-
    The clinical endpoint shared by addictive disorders: compulsive seeking and
    taking, loss of control over intake, persistence despite harm, and a
    negative emotional state when the reward is unavailable. The course is
    chronic and relapsing. Conformers substitute the substance or behaviour and
    wire this node to their clinical phenotypes.
  role: consequence
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Drug addiction can be defined as a chronically relapsing disorder,
      characterised by compulsion to seek and take the drug, loss of control in
      limiting intake, and emergence of a negative emotional state (eg,
      dysphoria, anxiety, irritability) when access to the drug is prevented.
    explanation: >-
      The standard definition of the addicted state that this node represents.
  - reference: PMID:22011681
    reference_title: "Dysfunction of the prefrontal cortex in addiction: neuroimaging findings and clinical implications."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Drug addiction encompasses a relapsing cycle of intoxication, bingeing,
      withdrawal and craving that results in excessive drug use despite adverse
      consequences
    explanation: >-
      Frames the endpoint as the product of a relapsing cycle, matching the
      three upstream stages of this module.
treatments:
- name: Opioid Receptor Antagonists
  description: >-
    Naltrexone and nalmefene block opioid receptors and so reduce the
    reinforcing dopamine response that endogenous opioid peptides mediate. They
    are approved or recommended for alcohol use disorder and have the strongest
    drug evidence in gambling disorder. This is the module's drug-target
    pattern. In opioid use disorder, extended-release naltrexone instead blocks
    the exogenous opioid directly at the mu-opioid receptor, which that entry
    records against its own receptor-agonism node.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
    - preferred_term: nalmefene
      term:
        id: CHEBI:7457
        label: Nalmefene
  target_mechanisms:
  - target: Acute Mesolimbic Dopamine Reinforcement
    treatment_effect: INHIBITS
    description: >-
      Opioid-receptor blockade reduces the opioid-peptide contribution to reward
      signalling in the basal ganglia, blunting reinforcement by alcohol or
      gambling.
  evidence:
  - reference: PMID:21154349
    reference_title: Opioid antagonists for alcohol dependence.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on a total of 50 RCTs with 7793 patients, naltrexone reduced the risk
      of heavy drinking to 83% of the risk in the placebo group RR 0.83 (95% CI
      0.76 to 0.90)
    explanation: >-
      A Cochrane meta-analysis of randomized trials shows naltrexone reduces heavy
      drinking in alcohol dependence.
  - reference: PMID:16449486
    reference_title: Multicenter investigation of the opioid antagonist nalmefene in the treatment of pathological gambling.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects who received nalmefene had a statistically significant reduction
      in severity of pathological gambling.
    explanation: >-
      A multicenter randomized placebo-controlled trial shows the same drug class
      works in a behavioural addiction with no exogenous drug, which supports
      acting on the shared reinforcement node rather than on a drug-specific
      target.

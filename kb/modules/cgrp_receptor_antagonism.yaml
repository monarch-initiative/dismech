name: CGRP Receptor Antagonism Module
description: "Pharmacological blockade of the calcitonin gene-related peptide receptor, by the small-molecule gepants and by the receptor-directed monoclonal antibody erenumab. The trigger is antagonist occupancy of the receptor; the key conformance target is the central effector, \"Blockade of CGRP Receptor Signalling\", which both the acute and the preventive consequence run through. A disease entry that models the drug rather than the mechanism should instead conform at the trigger, \"CGRP Receptor Antagonist Occupancy\", which represents the drug's receptor occupancy rather than the signalling state it produces; both current conformers do this. Scope: this module covers antagonism at the receptor, which is where the cited pharmacology review draws the line -- it separates the drugs that bind the CGRP peptide itself from the receptor antagonists, and divides the latter into small molecules and one antibody antagonist. The ligand-binding antibodies are therefore not modelled here, although they reduce signalling through the same receptor one step upstream; a separate module for ligand sequestration would share this one's effector chain and is worth considering rather than folding in. 5-HT1B/1D agonism is a separate module already, by the project rule that one receptor family plus one direction of pharmacological action makes one module. Unlike that module this one has no vasoconstrictor arm, which is a statement about what is modelled here and not a claim that these drugs produce no vasoconstriction: see the notes."
category: Module
module_categories:
- PHARMACOLOGY
- NEUROSCIENCE
creation_date: '2026-10-25T21:10:00Z'
notes: "Scope and sourcing decisions recorded for the next curator. No node asserts that this class lacks the cranial and coronary vasoconstriction the triptans carry, although that is the usual clinical reason for choosing it. Four PubMed searches were run for a citable statement of it -- for gepant cardiovascular safety against the triptan contraindication, for the class reviews of 2023, for the receptor pharmacology, and for the gepants by name against a lack of vasoconstrictive properties -- and the abstracts returned either did not make the claim or made it about the 5-HT-acting drugs in the same sentence. Module snippets are matched against the abstract, so a full text that carries it cannot be quoted here. The claim is left unmade rather than stretched out of an adjacent sentence. The hepatic node is scoped to a first-generation agent on twice-daily dosing, which is what the cited trial tested, and the authors' own conclusion separating the mechanism from the molecule is quoted beside the finding; it is not a class claim about the gepants now in use. The acute and preventive consequences are kept as two nodes rather than one because the trials measure different things, a single attack against monthly migraine days, and collapsing them would imply a comparability the evidence does not support."
pathophysiology:
- name: "CGRP Receptor Antagonist Occupancy"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    An antagonist binds the calcitonin gene-related peptide receptor, the heterodimer of calcitonin
    receptor-like receptor and receptor activity-modifying protein 1, and prevents CGRP from
    activating it. Two kinds of molecule do this: the small-molecule gepants, and one antibody
    directed at the receptor rather than at the peptide.

- name: "Blockade of CGRP Receptor Signalling"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Occupancy translates into loss of signalling through the receptor, and so into loss of the
    CGRP-dependent vasodilator and nociceptive responses that sustain an attack. This is the step
    both the acute and the preventive endpoint run through, and it is the key conformance target.

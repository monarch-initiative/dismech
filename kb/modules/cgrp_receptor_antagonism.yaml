discussions:
- discussion_id: cgrp_amy1_off_target_clinical_significance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does antagonism of the AMY1 receptor contribute to the clinical effect, or to the adverse
    effects, of the drugs that block the CGRP receptor?
  attaches_to:
  - "pathophysiology#CGRP Receptor Antagonist Occupancy"
  rationale: >-
    This module's trigger asserts that these drugs act by occupying the CGRP receptor, and binds
    CALCRL and RAMP1 accordingly. The pharmacology review it cites reports that the same
    antagonists also antagonise the closely related AMY1 receptor, that selectivity parameters
    cannot be given for all of them because the data are missing, and that the clinical
    implications are unknown. If AMY1 antagonism contributes, then the trigger as written names
    only part of what the drugs do, and an adverse effect attributed to CGRP blockade may belong
    to a different receptor. This is a genuine unknown rather than an uncurated fact: the
    selectivity measurements have not been made for every agent, and the clinical question has not
    been asked.
  proposed_experiments:
  - experiment_id: cgrp_antagonist_amy1_selectivity_panel
    name: "Matched CGRP and AMY1 receptor selectivity panel across the marketed antagonists"
    description: >-
      Measure antagonist affinity and functional potency for each marketed gepant and for erenumab
      at the CGRP receptor and at the AMY1 receptor in one assay system, so the selectivity ratios
      are comparable between agents, and test whether the agents' rank order on AMY1 tracks any
      difference in their clinical efficacy or adverse-effect profile.

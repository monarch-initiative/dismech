  - reference: PMID:27465216
    reference_title: "The Role of 5-Hydroxytryptamine in the Pathophysiology of Migraine and its Relevance to the Design of Novel Treatments."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "It also touches upon the recent development of antagonists and antibodies at calcitonin gene-related peptide (CGRP) and its receptors, which produce a direct blockade of the CGRPergic vasodilator mechanisms involved in migraine."
    explanation: "States that these drugs block the CGRP-dependent vasodilator mechanism of migraine, which is this node."
  - reference: PMID:25107879
    reference_title: "Randomized controlled trial of the CGRP receptor antagonist telcagepant for migraine prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "CONCLUSIONS: These data suggest a potential role for CGRP receptor antagonism in migraine prophylaxis."
    explanation: "Attributes a therapeutic role to receptor antagonism as a mechanism rather than to any one agent, which is the level this node sits at."
  downstream:
  - target: "Acute Termination of a Migraine Attack"
  - target: "Reduction in Monthly Migraine Days on Receptor-Directed Prevention"
- name: "Acute Termination of a Migraine Attack"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Taken during an attack, a gepant raises the chance of being pain free at two hours and of losing
    the symptom the patient minds most. The absolute size is modest and the placebo rate is high, so
    the therapeutic gain over placebo is of the order of seven to eleven percentage points; both the
    treated rate and the placebo rate belong on this node, because the treated rate alone would
    overstate the class.
  evidence:
  - reference: PMID:31742631
    reference_title: "Effect of Ubrogepant vs Placebo on Pain and the Most Bothersome Associated Symptom in the Acute Treatment of Migraine: The ACHIEVE II Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Pain freedom at 2 hours was reported by 101 of 464 participants (21.8%) in the ubrogepant 50-mg group, 90 of 435 (20.7%) in the ubrogepant 25-mg group, and 65 of 456 (14.3%) in the placebo group"
    explanation: "The co-primary pain endpoint with its placebo comparator, from the phase 3 single-attack trial."
  - reference: PMID:31742631
    reference_title: "Effect of Ubrogepant vs Placebo on Pain and the Most Bothersome Associated Symptom in the Acute Treatment of Migraine: The ACHIEVE II Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Absence of the most bothersome associated symptom at 2 hours was reported by 180 of 463 participants (38.9%) in the ubrogepant 50-mg group, 148 of 434 (34.1%) in the ubrogepant 25-mg group, and 125 of 456 (27.4%) in the placebo group"
    explanation: "The second co-primary endpoint, which is the non-pain half of what an acute treatment is asked to do."
- name: "Reduction in Monthly Migraine Days on Receptor-Directed Prevention"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Given continuously rather than during an attack, receptor blockade reduces how many days a month
    a patient has migraine. The effect is real and partial: against a baseline of about eight
    migraine days, the antibody removed three to four and placebo removed nearly two. The
    first-generation small molecule reduced monthly headache days by a similar margin before its
    trial was stopped, which is a broader endpoint than the migraine days this node is named for,
    since every migraine day is a headache day but not the converse. The two figures are therefore
    not interchangeable, and what their agreement supports is only that the preventive effect
    belongs to the mechanism rather than to one molecule.
  evidence:
  - reference: PMID:29171821
    reference_title: "A Controlled Trial of Erenumab for Episodic Migraine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "The mean number of migraine days per month at baseline was 8.3 in the overall population; by months 4 through 6, the number of days was reduced by 3.2 in the 70-mg erenumab group and by 3.7 in the 140-mg erenumab group, as compared with 1.8 days in the placebo group"
    explanation: "The preventive endpoint with its baseline and its placebo comparator, from the receptor-directed antibody trial."
  - reference: PMID:25107879
    reference_title: "Randomized controlled trial of the CGRP receptor antagonist telcagepant for migraine prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "there was evidence that telcagepant resulted in a larger reduction from baseline than placebo for mean monthly headache days (month 1: 140 mg = -2.9, 280 mg = -3.1, placebo = -1.7; p < 0.05)"
    explanation: "A second, structurally unrelated receptor antagonist reaching a similar preventive effect, which is what supports reading the effect as mechanism-level; graded INDIRECT because the trial was stopped early and the planned analysis was never run."
- name: "Hepatic Aminotransferase Elevation on Daily First-Generation Gepant Dosing"
  role: adverse_effect
  biological_scale: ORGANISM
  description: >-
    A first-generation gepant given twice daily for prevention produced aminotransferase elevations
    that stopped its trial: all the affected patients were on drug, and two had symptomatic rises
    that resolved on withdrawal. The finding is recorded against that molecule and that schedule,
    which is what was tested, and the trial's own conclusion separated the liability from the
    mechanism. It is not a class claim about the agents now in use.
  evidence:
  - reference: PMID:25107879
    reference_title: "Randomized controlled trial of the CGRP receptor antagonist telcagepant for migraine prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "RESULTS: The trial was terminated following a recommendation from the Safety Monitoring Board due to hepatotoxicity concerns."
    explanation: "The outcome that makes this a node rather than a footnote: the liability was serious enough to stop the trial."
  - reference: PMID:25107879
    reference_title: "Randomized controlled trial of the CGRP receptor antagonist telcagepant for migraine prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Thirteen patients, all in the telcagepant groups, had an alanine aminotransferase (ALT) elevation ≥ 3 × the upper limit of normal"
    explanation: "Quantifies the signal and records that every affected patient was on drug rather than placebo."
  - reference: PMID:25107879
    reference_title: "Randomized controlled trial of the CGRP receptor antagonist telcagepant for migraine prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "However, the observed aminotransferase elevations do not support the use of telcagepant for daily administration."
    explanation: "The authors' own scoping of the finding to the molecule and its schedule, which is why this node does not generalise it to the class."

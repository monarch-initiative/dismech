      label: "RAMP1"
  evidence:
  - reference: PMID:34076887
    reference_title: "CGRP receptor antagonists for migraine. Are they also AMY(1) receptor antagonists?"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "These are divided into two major classes, antibodies which bind to the CGRP peptide, preventing it from activating CGRP receptors and receptor antagonists."
    explanation: "Draws the line this module's scope follows: the ligand-binding antibodies are a different class from the receptor antagonists."
  - reference: PMID:34076887
    reference_title: "CGRP receptor antagonists for migraine. Are they also AMY(1) receptor antagonists?"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Within the receptor antagonist class, there are two mechanisms of action, small molecule receptor antagonists and an antibody antagonist."
    explanation: "Establishes that both molecule kinds modelled on this node are receptor antagonists, which is why they share one trigger."
  - reference: PMID:29171821
    reference_title: "A Controlled Trial of Erenumab for Episodic Migraine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: "We tested erenumab, a fully human monoclonal antibody that inhibits the calcitonin gene-related peptide receptor, for the prevention of episodic migraine."
    explanation: "Confirms that the antibody in this module acts on the receptor rather than on the peptide, which is what admits it here."
  downstream:

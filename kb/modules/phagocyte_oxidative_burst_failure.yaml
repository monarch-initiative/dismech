name: Phagocyte Oxidative Burst Failure Module
description: >-
  A conserved pathophysiology module representing failure of the phagocyte
  NADPH oxidase (NOX2) respiratory burst and the consequences of losing
  phagosomal reactive oxygen species. Several structurally distinct lesions
  converge on one rate-limiting step: the oxidase complex cannot be built, cannot
  be matured, cannot be switched on, or cannot be supplied with reducing
  equivalents, and in each case the stimulated phagocyte fails to generate
  superoxide inside the phagosome. Downstream, the module branches. The
  killing arm is obligate - oxidant-dependent microbial killing fails, and
  recurrent bacterial and fungal infection follows. The immunoregulatory arm is
  conditional: reactive oxygen species also act as signals that restrain and
  resolve inflammation, and losing that signal can produce sterile inflammatory
  disease, but conformers vary in whether this arm is present at all. Conformance
  is node-qualified. A disorder entry maps only the stages its evidence directly
  represents, and matching a downstream node does not imply the whole chain. The
  key conformance target is the rate-limiting node, "Failed Respiratory Burst and
  Phagosomal ROS Deficiency".
category: Module
creation_date: "2026-08-26T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is a functional-failure
  module rather than a pathological structure-formation ("Xogenesis") module: its
  terminal outputs are a failure of microbial killing and a loss of an
  immunoregulatory signal, not the formation of a pathological anatomical entity.
  Where a conformer goes on to form granulomas, that structure-formation process
  belongs to the granuloma_formation module, which carries the Xogenesis anchor;
  this module's conditional immunoregulatory branch hands off to it rather than
  duplicating it.
  Disorder entries reference individual nodes via conforms_to (for example,
  "phagocyte_oxidative_burst_failure#Failed Respiratory Burst and Phagosomal ROS
  Deficiency").
  Operational conformance boundary: a branch is in scope when a stimulated
  phagocyte demonstrably fails to generate superoxide or downstream reactive
  oxygen species through the NOX2 oxidase. That failure is necessary and
  sufficient for branch-level qualification, but each conforms_to assertion
  remains local to the stage actually modeled. This is a curation boundary, not a
  formal Grouping criteria assertion.
  Key disorder-specific substitutions at the trigger node, which is where the
  distinct lesion classes differ: the catalytic complex cannot be assembled
  (chronic granulomatous disease, from variants in CYBB, CYBA, NCF1, NCF2, NCF4
  or CYBC1); the catalytic subunit is mis-matured rather than absent (G6PC3
  deficiency, through hypoglycosylation of gp91phox); an intact complex cannot be
  switched on because its GTPase activator is missing (RAC2 dominant-negative
  neutrophil immunodeficiency syndrome). A fourth class, failure to supply the
  NADPH the oxidase consumes, is mechanistically predicted for severe class I
  G6PD deficiency, but the dismech G6PD entry currently curates only the
  haemolysis arm and has no burst node, so it is named here as a candidate rather
  than asserted as a conformer.
  Because conformers were curated before this module existed, their process
  placement is not uniform, and conformance should be read node-by-node rather
  than assumed term-for-term. Chronic_Granulomatous_Disease and
  Neutrophil_Immunodeficiency_Syndrome carry GO:0042554 superoxide anion
  generation on the lesion-level node that conforms to the trigger, whereas this
  module places the enzyme-level claim as the molecular function GO:0016175 on
  the trigger and keeps the process view on the rate-limiting node. G6PC3
  deficiency and RAC2 disease each carry an additional neutrophil chemotaxis or
  actin-assembly defect on a conforming node; that migration arm is outside this
  module and is not claimed by conformance.
  Out of scope. (1) Entries in which a respiratory burst is INCREASED rather than
  decreased - Microscopic_Polyangiitis (GO:0045730 INCREASED),
  Paraquat_Poisoning and Heart_Failure (GO:0042554 INCREASED). Excess oxidant
  production is a different mechanism, not a direction of this one. (2) Non-NOX2
  members of the NADPH oxidase family. NOX1, NOX3, NOX4, NOX5, DUOX1 and DUOX2
  are not the phagocyte oxidase, and DUOX2-related thyroid dyshormonogenesis is
  explicitly not a conformer despite involving the same enzyme family. (3)
  Neutropenia. A defect of phagocyte number is not a defect of phagocyte
  oxidative function; G6PC3 deficiency is both, and conforms on its function arm
  only. Its severe-congenital-neutropenia arm must not be claimed as conforming.
  Deferred, not excluded: myeloperoxidase deficiency. MPO acts downstream of
  superoxide, consuming hydrogen peroxide to generate hypochlorous acid, and
  MPO-deficient neutrophils are generally reported to have a normal or increased
  respiratory burst precisely because that peroxide is no longer consumed. If
  that holds, MPO deficiency fails a different node than the one this module is
  built around and would be NOT_SATISFIED against the rate-limiting node.
  Settling it needs a fetched primary source and its own scoped task;
  stubs/Myeloperoxidase_Deficiency.yaml is already in the curation queue.
  The module's treatment is a mechanistic target pattern, not an inherited
  treatment recommendation; agent selection, conditioning regimen, and
  contraindications remain disease-specific. Pathophysiology nodes bind GO
  processes, molecular functions, cellular components and protein complexes, plus
  CL cell types; they do not bind CHEBI chemicals or MONDO diseases. The
  treatments block may bind a therapeutic agent per the treatment schema.
pathophysiology:
- name: Phagocyte NADPH Oxidase Assembly or Activation Failure
  description: >-
    The phagocyte NADPH oxidase cannot deliver electrons from cytosolic NADPH to
    molecular oxygen. This is the lesion-class node, and it is where conforming
    disorders differ from one another: the complex may be unbuildable because a
    structural subunit is absent, mis-matured because a subunit is
    hypoglycosylated, or unactivatable because its small-GTPase activator is
    missing while every catalytic component is present and quantitatively normal.
    The node asserts loss of oxidase activity, not a particular lesion; the
    specific defect is substituted by the conforming entry.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  molecular_functions:
  - preferred_term: superoxide-generating NAD(P)H oxidase activity
    term:
      id: GO:0016175
      label: superoxide-generating NAD(P)H oxidase activity
    modifier: DECREASED
  protein_complexes:
  - preferred_term: NADPH oxidase complex
    term:
      id: GO:0043020
      label: NADPH oxidase complex
  evidence:
  - reference: PMID:39836849
    reference_title: "Standardization of the use of opsonized zymosan as stimulus in the 1,2,3-dihydrorhodamine technique for the assessment of neutrophil respiratory burst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic granulomatous disease is a defect in phagocytosis due to
      deficiency of gp91phox, p22phox, p47phox, p40phox, and p67phox (classic
      form of the disease).
    explanation: >-
      Enumerates the subunit-deficiency lesion class - the oxidase complex cannot
      be assembled - which is the substitution chronic granulomatous disease
      makes at this node.
  - reference: PMID:10758162
    reference_title: "Human neutrophil immunodeficiency syndrome is associated with an inhibitory Rac2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rac2(D57N) binds GDP but not GTP and inhibits oxidase activation and
      O(2)(-) production in vitro.
    explanation: >-
      Establishes the second, distinct lesion class asserted by this node: an
      activation failure rather than an assembly failure. The reconstitution
      result in the same study - adding recombinant Rac to patient neutrophil
      extracts restores superoxide production - is what shows the catalytic
      machinery itself is intact.
  - reference: PMID:21385794
    reference_title: "G6PC3 mutations are associated with a major defect of glycosylation: a novel mechanism for neutrophil dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypo-glycosylation of gp91(phox), the electron-transporting component of
      the NADPH oxidase, in all of these patients
    explanation: >-
      Establishes a third lesion class - the catalytic subunit is present but
      mis-matured - measured directly in patient neutrophils in G6PC3 and G6PT
      deficiency.
  downstream:
  - target: Failed Respiratory Burst and Phagosomal ROS Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of oxidase activity is, by definition of the enzyme's function, loss
      of the stimulated superoxide burst.
- name: Failed Respiratory Burst and Phagosomal ROS Deficiency
  description: >-
    The rate-limiting node and the key conformance target. On stimulation the
    phagocyte fails to mount a respiratory burst, so superoxide and the reactive
    oxygen species derived from it do not accumulate in the phagosome. This step
    is disorder-agnostic: every conforming entry funnels through it regardless of
    which upstream lesion it carries, and it is the step clinical diagnostics
    actually measure. Operationally it is read out by dihydrorhodamine oxidation
    or ferricytochrome c reduction in stimulated neutrophils, which is why a
    conformer can be checked against this node rather than argued about.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: respiratory burst
    term:
      id: GO:0045730
      label: respiratory burst
    modifier: DECREASED
  - preferred_term: superoxide anion generation
    term:
      id: GO:0042554
      label: superoxide anion generation
    modifier: DECREASED
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: phagocytic vesicle
    term:
      id: GO:0045335
      label: phagocytic vesicle
  evidence:
  - reference: PMID:33259599
    reference_title: "Metabolic abnormalities in G6PC3-deficient human neutrophils result in severe functional defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Superoxide anion generation was <25% of control values, but phox proteins
      appeared quantitatively normal.
    explanation: >-
      Measures the burst deficit directly in patient neutrophils and, because the
      oxidase subunits were quantitatively normal, shows this node is separable
      from the assembly lesion upstream of it. That separability is what makes it
      usable as a shared conformance target rather than a restatement of the
      trigger.
  - reference: PMID:39836849
    reference_title: "Standardization of the use of opsonized zymosan as stimulus in the 1,2,3-dihydrorhodamine technique for the assessment of neutrophil respiratory burst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To optimize the 1,2,3-dihydrorhodamine technique using zymosan to assess
      neutrophil respiratory burst and detect the non-classical chronic
      granulomatous disease.
    explanation: >-
      Identifies the dihydrorhodamine oxidation assay as the operational readout
      of this node, and notes that stimulus choice determines which lesion
      classes it detects - relevant because a conformer's burst defect may be
      stimulus-dependent.
  downstream:
  - target: Impaired Oxidant-Dependent Microbial Killing
    causal_link_type: DIRECT
    description: >-
      The obligate arm. Oxidant-dependent killing has no substrate once the burst
      fails.
  - target: Loss of ROS-Dependent Immunoregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The conditional arm. Reactive oxygen species also serve as signals that
      restrain and terminate inflammatory responses; losing them dysregulates
      inflammation through intermediates that are not the killing pathway.
      Conformers opt into this arm rather than inheriting it.
- name: Impaired Oxidant-Dependent Microbial Killing
  description: >-
    Ingested bacteria and fungi are not killed. Phagocytosis and ingestion may be
    intact or only partly reduced; what fails is the oxidative killing step that
    follows. The organisms that survive are characteristically those a phagocyte
    would otherwise need the oxidative burst to clear.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
    modifier: DECREASED
  - preferred_term: neutrophil mediated immunity
    term:
      id: GO:0002446
      label: neutrophil mediated immunity
    modifier: DECREASED
  evidence:
  - reference: PMID:33259599
    reference_title: "Metabolic abnormalities in G6PC3-deficient human neutrophils result in severe functional defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bactericidal activity at bacteria/neutrophil ratios >1:1 was also
      diminished and was associated with attenuated ingestion.
    explanation: >-
      Measures the killing defect itself, in patient neutrophils, as a step
      distinct from the superoxide measurement in the same study. The attenuated
      ingestion noted alongside it is why this node states that phagocytosis may
      be partly reduced rather than asserting it is intact.
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic granulomatous disease (CGD) is a primary immunodeficiency disorder
      of phagocytes (neutrophils, monocytes, macrophages, and eosinophils)
      resulting from impaired killing of bacteria and fungi.
    explanation: >-
      States impaired killing of bacteria and fungi as the defining functional
      consequence, and names the four phagocyte lineages the module binds.
      Evidence source is OTHER because this is a GeneReviews chapter, not a
      primary study.
  downstream:
  - target: Recurrent Bacterial and Fungal Infection
    causal_link_type: DIRECT
    description: >-
      Uncleared organisms establish deep and recurrent infection at sites of
      phagocyte-dependent defense.
- name: Recurrent Bacterial and Fungal Infection
  description: >-
    Recurrent, deep-seated bacterial and fungal infection at the organism level,
    with a pathogen spectrum characteristic of oxidative killing failure rather
    than of immunodeficiency in general. The specific organisms and the organ
    distribution are disorder- and cohort-specific and should be evidenced
    locally rather than inherited from this node.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:10844935
    reference_title: "Chronic granulomatous disease. Report on a national registry of 368 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pneumonia was the most prevalent infection (79% of patients; Aspergillus
      most prevalent cause), followed by suppurative adenitis (53% of patients;
      Staphylococcus most prevalent cause)
    explanation: >-
      A 368-patient national registry quantifying the infection burden and its
      pathogen spectrum, which is the organism-level consequence this node
      represents.
  - reference: PMID:31988463
    reference_title: "Lentiviral gene therapy for X-linked chronic granulomatous disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surviving patients have had no new CGD-related infections, and six have
      been able to discontinue CGD-related antibiotic prophylaxis.
    explanation: >-
      Reversal evidence: restoring oxidase-positive neutrophils removed the
      infection phenotype, which supports the causal direction from burst failure
      to recurrent infection rather than mere association.
- name: Loss of ROS-Dependent Immunoregulation
  description: >-
    A conditional branch, not part of the obligate chain. Beyond killing
    microbes, phagocyte-derived reactive oxygen species act as signals that
    restrain and terminate inflammatory responses. Losing that signal permits
    dysregulated, often sterile inflammation - granulomatous obstruction of the
    gastrointestinal and genitourinary tracts, colitis, and other inflammatory
    disease occurring independently of active infection. Conformers vary: this arm
    is prominent in chronic granulomatous disease and absent in RAC2
    dominant-negative neutrophil immunodeficiency syndrome, so a conforming entry
    must opt into it with its own evidence rather than inherit it. Where the
    branch does proceed to organised granuloma assembly, that structure-formation
    process is handed off to the granuloma_formation module and is not duplicated
    here.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: negative regulation of inflammatory response
    term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    modifier: DECREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CGD is characterized by severe recurrent bacterial and fungal infections
      and dysregulated inflammatory responses resulting in granuloma formation
      and other inflammatory disorders such as colitis.
    explanation: >-
      Separates the inflammatory arm from the infection arm as two distinct
      consequences of the same oxidase defect, which is the branching this node
      represents. Evidence source is OTHER because this is a GeneReviews chapter.
  - reference: PMID:10844935
    reference_title: "Chronic granulomatous disease. Report on a national registry of 368 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifteen percent of patients had gastric outlet obstruction, 10% urinary
      tract obstruction, and 17% colitis/enteritis.
    explanation: >-
      Quantifies the inflammatory and obstructive burden in a 368-patient
      registry, showing this arm affects a substantial minority rather than all
      patients - which is the empirical basis for treating it as conditional.
      Support is PARTIAL because the registry counts the manifestations without
      establishing the ROS-signalling mechanism.
treatments:
- name: Autologous Lentiviral Gene Therapy Restoring Phagocyte Oxidase Activity
  description: >-
    A mechanistic target pattern rather than an inherited recommendation.
    Restoring a functional oxidase subunit in haematopoietic stem and progenitor
    cells regenerates oxidase-positive phagocytes and reverses the burst defect at
    the trigger node. The pattern generalises to allogeneic haematopoietic stem
    cell transplantation, which replaces the defective haematopoietic
    compartment outright. Which lesion class is correctable this way, the vector
    or conditioning regimen, and the risk-benefit balance are disease-specific
    and must be evidenced locally; the trial evidence cited here is specific to
    CYBB-related X-linked chronic granulomatous disease.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Phagocyte NADPH Oxidase Assembly or Activation Failure
    treatment_effect: RESTORES
    description: >-
      Transducing haematopoietic stem and progenitor cells with a functional
      gp91phox transgene yields circulating neutrophils that assemble a working
      oxidase, restoring the activity this node reports as lost.
  evidence:
  - reference: PMID:31988463
    reference_title: "Lentiviral gene therapy for X-linked chronic granulomatous disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 12 months, six of the seven surviving patients demonstrated stable
      vector copy numbers (0.4-1.8 copies per neutrophil) and the persistence of
      16-46% oxidase-positive neutrophils.
    explanation: >-
      A first-in-human trial in nine X-linked CGD patients demonstrating durable
      restoration of oxidase-positive neutrophils, which is the target-node
      effect this treatment pattern asserts. Two of nine patients died of
      pre-existing comorbidities, so the pattern is not a safety claim.
discussions:
- discussion_id: ifn_gamma_mechanism_not_burst_restoration
  prompt: >-
    Interferon gamma prophylaxis is standard care in many chronic granulomatous
    disease centres, but does it act by restoring the respiratory burst? If not,
    which node does it act on, and can it be given a target_mechanisms edge at
    all?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failed Respiratory Burst and Phagosomal ROS Deficiency
  rationale: >-
    This gap is recorded deliberately rather than resolved, because the tempting
    shortcut is wrong. Interferon gamma is widely used prophylactically and its
    clinical benefit is well attested, so it is easy to curate it as an agent
    acting on the oxidase - but in most patients the burst is not measurably
    restored, and the mechanism of benefit is not established. Curating it as a
    burst-restoring agent would attach a mechanism claim to this module that the
    evidence does not support, and would then propagate to every conformer. Until
    the mechanism is pinned down, interferon gamma belongs here as an open
    question and not in the treatments block.
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lifelong daily antibacterial and antifungal prophylaxis is recommended;
      immunomodulatory therapy with interferon gamma (IFN-gamma) is part of the
      prophylactic regimen in many centers.
    explanation: >-
      Establishes that interferon gamma is standard prophylaxis and describes it
      as immunomodulatory, without asserting that it restores oxidase activity -
      which is precisely the gap this discussion records. Evidence source is
      OTHER because this is a GeneReviews chapter.
- discussion_id: mpo_deficiency_conformance_undecided
  prompt: >-
    Does myeloperoxidase deficiency conform to this module, or does it fail a
    different node? MPO consumes hydrogen peroxide downstream of superoxide, so
    the respiratory burst itself is generally reported as normal or increased in
    MPO-deficient neutrophils.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Failed Respiratory Burst and Phagosomal ROS Deficiency
  - pathophysiology#Impaired Oxidant-Dependent Microbial Killing
  rationale: >-
    Myeloperoxidase deficiency is the other classic failure of neutrophil
    oxidative killing, so it will be proposed as a conformer. But it sits
    downstream of the rate-limiting node: MPO consumes the hydrogen peroxide the
    burst produces, and the expectation is a normal-to-increased burst rather than
    a failed one. If that holds, MPO deficiency is NOT_SATISFIED against the
    rate-limiting node while arguably satisfying the killing node - which would
    make it a useful test of whether node-qualified conformance is being applied
    properly, and a bad candidate for whole-chain conformance. Deciding it
    requires a fetched primary source on burst measurements in MPO-deficient
    patients; no such source is cited in this module, so the question is left
    open rather than answered by reasoning. stubs/Myeloperoxidase_Deficiency.yaml
    is already in the curation queue.
  notes: >-
    Raised in monarch-initiative/dismech#9315 as one of the scoping questions
    this module should not silently settle.

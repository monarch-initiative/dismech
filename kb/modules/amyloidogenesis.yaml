name: Amyloidogenesis Module
description: >-
  A conserved pathophysiology module representing the formation of an amyloid
  deposit - the extracellular, highly ordered cross-beta-sheet fibrillar
  aggregate that recurs across systemic and localized amyloidoses and
  protein-misfolding diseases: light-chain (AL) amyloidosis, transthyretin
  (ATTR) amyloidosis, serum amyloid A (AA) amyloidosis, and the amyloid deposits
  of Alzheimer disease and type 2 diabetes. An amyloidogenic precursor protein,
  destabilized by mutation, overproduction, aging, or proteolysis, misfolds and
  converts from its native conformation into beta-sheet-rich oligomers. These
  nucleate and elongate into insoluble cross-beta amyloid fibrils that deposit in
  the extracellular space of tissues. Progressive fibril accumulation, together
  with proteotoxic soluble oligomers, disrupts tissue architecture and causes
  organ dysfunction. The module captures the shared core across the amyloidoses.
  Conforming disorder nodes substitute the disease-specific precursor protein
  (immunoglobulin light chain in AL, transthyretin in ATTR, serum amyloid A in
  AA, amyloid-beta in Alzheimer disease, islet amyloid polypeptide in type 2
  diabetes) while preserving the precursor -> misfolding/oligomerization ->
  fibril formation/deposition -> tissue accumulation -> organ dysfunction causal
  chain.
category: Module
creation_date: "2026-07-16T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. It is a pathological
  structure-formation ("Xogenesis") module. Xogenesis anchor: the terminal
  output is an amyloid deposit, an OGMS:0000079 portion of pathological body
  substance produced by an OGMS:0000081 pathological derivation (a new
  extracellular fibrillar deposit); process genus OGMS:0000061 pathological
  bodily process. Amyloid deposits are extracellular and systemic/multi-organ, so
  no single UBERON site is bound. MPATH has no "amyloid" class, a noted OBO gap;
  SNOMED "Morphologically abnormal structure" (49755003) is used only as an
  external census/gap guide and is not bound here. Disorder entries reference
  individual nodes via conforms_to (for example, "amyloidogenesis#Amyloid Fibril
  Formation and Extracellular Deposition"). The module defines the expected
  pathophysiology structure; conforming nodes in disorder files should include
  the corresponding cell types, biological processes, and causal edges,
  specialized to their disease context. Key disease-specific substitutions: AL
  amyloidosis substitutes a clonal immunoglobulin light chain; ATTR substitutes
  wild-type or variant transthyretin; AA substitutes serum amyloid A driven by
  chronic inflammation; Alzheimer disease substitutes amyloid-beta. Modules bind
  GO and CL terms only and do not use chemical (CHEBI) or disease (MONDO) term
  bindings, except in the treatments block where the therapeutic agent carries an
  ontology identifier per the treatment schema.
pathophysiology:
- name: Amyloidogenic Precursor Protein
  description: >-
    The proximal trigger of amyloidogenesis is an amyloidogenic precursor protein
    whose native fold is destabilized - by a point mutation, by overproduction, by
    aging, or by proteolytic processing - so that it is prone to misfold. The
    identity of the precursor defines the amyloidosis type (transthyretin,
    immunoglobulin light chain, serum amyloid A, amyloid-beta), but the shared
    feature is a metastable precursor poised to depart its native conformation.
  role: trigger
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39775625
    reference_title: "Advancing treatments for transthyretin amyloid cardiomyopathy: Innovations in RNA silencing, gene editing, TTR stabilization, and degradation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      deposition of misfolded transthyretin (TTR) protein in the myocardial
      interstitium
    explanation: >-
      Identifies a destabilized precursor protein (transthyretin) whose misfolding
      underlies amyloid deposition, the trigger of this module. Evidence source is
      OTHER because this is a review.
  - reference: PMID:38960850
    reference_title: "Radionuclide Imaging of Cardiac Amyloidosis: An Update and Future Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The major forms are transthyretin (ATTR) CA and light-chain (AL) CA, based
      on the respective precursor protein.
    explanation: >-
      Establishes that the amyloidosis type is defined by its precursor protein
      (transthyretin or immunoglobulin light chain), the substituted trigger of
      this module. Evidence source is OTHER because this is a review.
  downstream:
  - target: Protein Misfolding and Beta-Sheet Oligomerization
- name: Protein Misfolding and Beta-Sheet Oligomerization
  description: >-
    The destabilized precursor undergoes a conformational change from its native
    fold into beta-sheet-rich, aggregation-prone species. These misfolded
    monomers self-associate into soluble oligomers that both seed further
    aggregation (nucleation) and are themselves proteotoxic. This misfolding and
    oligomerization is the amplifying step that commits the precursor to the
    amyloid pathway.
  role: amplifier
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35471949
    reference_title: "Second Sphere Interactions in Amyloidogenic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Such protein aggregation may be brought about by conformational changes
    explanation: >-
      Attributes amyloid protein aggregation to conformational (misfolding)
      changes, the amplifier step that commits the precursor to aggregation.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Amyloid Fibril Formation and Extracellular Deposition
- name: Amyloid Fibril Formation and Extracellular Deposition
  description: >-
    The rate-limiting central effector of amyloidogenesis. Beta-sheet oligomers
    nucleate and elongate into insoluble amyloid fibrils bearing the
    characteristic highly ordered cross-beta structural motif, which deposit in
    the extracellular space of affected tissues. Fibril formation and tissue
    deposition are the disorder-agnostic convergence step - the central event
    common to all amyloidoses - and the key conformance target of the module.
  role: central_effector
  biological_processes:
  - preferred_term: amyloid fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  evidence:
  - reference: PMID:35471949
    reference_title: "Second Sphere Interactions in Amyloidogenic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Amyloids are protein aggregates bearing a highly ordered cross β structural
      motif, which may be functional but are mostly pathogenic. Their formation,
      deposition in tissues and consequent organ dysfunction is the central event
      in amyloidogenic diseases.
    explanation: >-
      Defines the cross-beta amyloid fibril and names its formation and tissue
      deposition as the central event in amyloidogenic diseases, the central
      effector of this module. Evidence source is OTHER because this is a review.
  - reference: PMID:38960850
    reference_title: "Radionuclide Imaging of Cardiac Amyloidosis: An Update and Future Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      misfolding, accumulation and aggregation of proteins into large fibrils in
      the extracellular compartment
    explanation: >-
      Documents aggregation of misfolded proteins into fibrils in the
      extracellular compartment, the fibril-formation-and-deposition central
      effector. Evidence source is OTHER because this is a review.
  downstream:
  - target: Progressive Tissue Amyloid Accumulation
- name: Progressive Tissue Amyloid Accumulation
  description: >-
    Continued fibril deposition accumulates as amyloid within the extracellular
    matrix of affected organs, progressively expanding the interstitium and
    physically disrupting normal tissue architecture. This accumulation - the
    growing amyloid burden - is the effector step that converts molecular fibril
    formation into an organ-level structural lesion.
  role: effector
  evidence:
  - reference: PMID:38960850
    reference_title: "Radionuclide Imaging of Cardiac Amyloidosis: An Update and Future Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac amyloidosis (CA) is caused by the misfolding, accumulation and
      aggregation of proteins into large fibrils in the extracellular compartment
      of the myocardium, leading to restrictive cardiomyopathy, heart failure and
      death.
    explanation: >-
      Documents progressive amyloid fibril accumulation in the extracellular
      compartment of the myocardium, the tissue-accumulation effector of this
      module. Evidence source is OTHER because this is a review.
  - reference: PMID:38753231
    reference_title: "Amyloid β accelerates age-related proteome-wide protein insolubility."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that the CIP is enriched with proteins that modify Aβ toxicity in
      vivo, suggesting the possibility of a vicious feedforward cycle in the
      context of AD.
    explanation: >-
      Evidence that accumulating amyloid is not only a passive deposit: the
      amyloid-driven core insoluble proteome is itself enriched for modifiers of
      amyloid toxicity, implying a self-reinforcing loop in which deposition
      destabilizes the wider proteome and the destabilized proteome aggravates
      amyloid toxicity. Links this module to loss_of_proteostasis, where the
      same study supports the aggregation node. The feedforward cycle is
      proposed by the authors as a possibility, not demonstrated, and the
      evidence is from an amyloid-beta model rather than the AL/ATTR/AA
      precursors this module otherwise covers. Evidence source is
      MODEL_ORGANISM (transgenic C. elegans).
  downstream:
  - target: Organ Dysfunction
- name: Organ Dysfunction
  description: >-
    The clinical end state of the module. Amyloid infiltration and proteotoxic
    soluble oligomers impair the function of the affected organs - producing
    restrictive cardiomyopathy and heart failure (cardiac amyloidosis),
    peripheral and autonomic neuropathy, nephrotic-range proteinuria and renal
    failure, or neurodegeneration - the consequence of the conserved
    amyloidogenesis chain.
  role: consequence
  evidence:
  - reference: PMID:38960850
    reference_title: "Radionuclide Imaging of Cardiac Amyloidosis: An Update and Future Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      leading to restrictive cardiomyopathy, heart failure and death.
    explanation: >-
      Establishes restrictive cardiomyopathy and heart failure as the organ
      dysfunction resulting from amyloid deposition, the consequence of this
      module. Evidence source is OTHER because this is a review.
  - reference: PMID:35471949
    reference_title: "Second Sphere Interactions in Amyloidogenic Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their formation, deposition in tissues and consequent organ dysfunction is
      the central event in amyloidogenic diseases.
    explanation: >-
      Names consequent organ dysfunction as the outcome of amyloid formation and
      tissue deposition, the consequence node of this module. Evidence source is
      OTHER because this is a review.
treatments:
- name: Transthyretin Stabilizer (Tafamidis)
  description: >-
    Tafamidis is a small-molecule transthyretin (TTR) stabilizer that binds the
    TTR tetramer at its thyroxine-binding sites, kinetically stabilizing it and
    preventing dissociation into the misfolding-prone monomers that form amyloid
    fibrils. By acting on the amyloidogenic precursor, it slows amyloid formation
    and progression of transthyretin amyloidosis. Represents the amyloidogenesis
    drug-target design pattern for conforming disorders, acting on the precursor
    node rather than on established deposits (complementary approaches silence TTR
    synthesis or promote amyloid clearance).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tafamidis
      term:
        id: CHEBI:78538
        label: tafamidis
  target_mechanisms:
  - target: Amyloidogenic Precursor Protein
    treatment_effect: INHIBITS
    description: >-
      TTR tetramer stabilization prevents dissociation of the precursor into
      misfolding-prone monomers, blocking the trigger of fibril formation.
  evidence:
  - reference: PMID:39775625
    reference_title: "Advancing treatments for transthyretin amyloid cardiomyopathy: Innovations in RNA silencing, gene editing, TTR stabilization, and degradation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      tafamidis emerging as the primary therapeutic agent targeting the
      stabilization of TTR tetramers to prevent amyloid fibril formation.
    explanation: >-
      Establishes tafamidis as a TTR-tetramer stabilizer that prevents amyloid
      fibril formation, validating the precursor node as the drug target.
      Evidence source is OTHER because this is a review.

name: Enabling Replicative Immortality Module
description: >-
  A conserved mechanism module for the fourth hallmark of cancer (Hanahan &
  Weinberg): the acquisition of unlimited replicative potential. Normal
  somatic cells can complete only a finite number of divisions because
  telomeres - the protective repeat caps on chromosome ends - shorten with
  each round of DNA replication, eventually triggering replicative
  senescence or crisis. This telomere clock is a powerful tumor-suppressive
  barrier. The conserved causal chain runs from progressive telomere
  attrition during clonal expansion through a proliferative crisis, to
  reactivation of a telomere-maintenance mechanism - in the great majority
  of cancers, transcriptional reactivation of the telomerase reverse
  transcriptase (TERT; via TERT promoter mutation, amplification, or
  rearrangement), and in a minority the recombination-based alternative
  lengthening of telomeres (ALT) - which stabilizes telomere length and
  confers unlimited proliferative capacity (replicative immortality). The two
  routes are separate nodes rather than one node with two labels, because they
  select different drugs: telomerase is silent in normal differentiated tissue
  and reactivated in most cancers, which makes it close to a universal target
  and gives this hallmark an approved agent, while a tumour on the
  recombination route is indifferent to that agent and offers its
  recombination machinery instead. Telomere-maintenance route is therefore a
  predictive marker here, not a descriptive detail.
  Individual disorder entries declare conformance via conforms_to,
  substituting the tumor-type-specific telomere-maintenance route (e.g.,
  TERT promoter mutations in melanoma and glioblastoma, ALT in
  ATRX/DAXX-mutant tumors). This module is the immortality-enabling counterpart of the
  tumor-suppressive senescence captured in cellular_senescence and
  senescence_tumor_suppression.
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "enabling_replicative_immortality#Telomere Maintenance Reactivation"). The
  module defines the expected pathophysiology structure; conforming nodes in
  disorder files should include the corresponding biological processes and
  causal edges, specialized to their tumor context. Key tumor-specific
  substitutions: melanoma and glioblastoma use TERT promoter mutations;
  pediatric/ATRX-DAXX-mutant tumors use ALT. The opposing tumor-suppressive
  reading of telomere attrition / senescence as a barrier is captured in
  cellular_senescence and senescence_tumor_suppression. Key conformance
  target: "enabling_replicative_immortality#Telomere Maintenance
  Reactivation" - but an ALT tumour should conform to
  "enabling_replicative_immortality#Telomere Maintenance via Recombination"
  instead, since the reactivation node binds telomere maintenance via
  telomerase and conforming to it would assert a mechanism an ALT tumour does
  not use. A telomerase-directed agent belongs on
  "enabling_replicative_immortality#Telomerase as a Near-Universal Target",
  and the entry should have established that its tumour is telomerase-positive
  rather than inferring it from the hallmark.
pathophysiology:
- name: Progressive Telomere Attrition
  description: >-
    Because conventional DNA polymerases cannot fully replicate chromosome
    ends (the end-replication problem), telomeres shorten with each cell
    division in cells lacking active telomerase. As a premalignant clone
    expands, telomeres erode toward a critically short length, which
    normally signals a DNA-damage response and engages the
    replicative-senescence or crisis barrier.
  role: trigger
  biological_processes:
  - preferred_term: Telomere Maintenance via Telomere Lengthening
    term:
      id: GO:0010833
      label: telomere maintenance via telomere lengthening
    modifier: DECREASED
  evidence:
  - reference: PMID:27029895
    reference_title: "Role of Telomeres and Telomerase in Aging and Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The repression of telomerase and shorter telomeres in humans may have
      evolved, in part, as an anticancer protection mechanism.
    explanation: >-
      Establishes telomere shortening and telomerase repression as a
      tumor-suppressive barrier, the trigger condition this module
      addresses. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Replicative Senescence and Crisis Barrier
    description: >-
      Critically short telomeres engage the senescence/crisis barrier that
      limits replicative potential.

- name: Replicative Senescence and Crisis Barrier
  description: >-
    Critically short, uncapped telomeres are recognized as DNA double-strand
    breaks, activating p53/RB-dependent replicative senescence (the Hayflick
    limit) or, if those checkpoints are bypassed, a crisis state marked by
    chromosome end-to-end fusions and massive cell death. This barrier
    limits the number of divisions a lineage can complete and must be
    overcome for a clone to become immortal.
  role: effector
  biological_processes:
  - preferred_term: Replicative Senescence
    term:
      id: GO:0090399
      label: replicative senescence
    modifier: INCREASED
  evidence:
  - reference: PMID:15471900
    reference_title: "Senescence and immortalization: role of telomeres and telomerase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the absence of cell-cycle checkpoint pathways (e.g. p53 and or p16/Rb), cells bypass M1 senescence and telomeres continue to shorten eventually resulting in crisis (also called the M2 stage)."
    explanation: "States both tiers of the barrier this node describes, senescence and then crisis."
  - reference: PMID:10618707
    reference_title: "Alternative pathways for the extension of cellular life span: inactivation of p53/pRb and expression of telomerase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cells that overcome senescence and have an extended life span continue to lose telomeric DNA and subsequently enter a second phase of growth arrest termed 'crisis'."
    explanation: "Independent statement of the crisis barrier after senescence bypass."
  downstream:
  - target: Telomere Maintenance Reactivation
    description: >-
      Rare clones that reactivate a telomere-maintenance mechanism escape
      the senescence/crisis barrier.

- name: Telomere Maintenance Reactivation
  description: >-
    A rare clone reactivates a telomere-maintenance mechanism, stabilizing
    telomere length and escaping the senescence/crisis barrier. In the great
    majority of human cancers this occurs through reactivation of telomerase
    (TERT) - via TERT promoter mutations, amplification, or rearrangement -
    while a minority use the recombination-based alternative lengthening of
    telomeres (ALT) pathway, frequently associated with ATRX/DAXX loss. This
    is the conserved central node disorder-specific lesions converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: Telomere Maintenance via Telomerase
    term:
      id: GO:0007004
      label: telomere maintenance via telomerase
    modifier: INCREASED
  evidence:
  - reference: PMID:27029895
    reference_title: "Role of Telomeres and Telomerase in Aging and Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A hallmark of advanced malignancies is the ability for continuous cell
      divisions that almost universally correlates with the stabilization of
      telomere length by the reactivation of telomerase.
    explanation: >-
      Directly states that telomerase reactivation stabilizing telomere
      length underlies the continuous cell division of advanced
      malignancies, the central effector of this module. Evidence source is
      OTHER because this is a review article.
  downstream:
  - target: Replicative Immortality
  - target: Telomerase as a Near-Universal Target
    description: >-
      A maintenance mechanism that normal differentiated tissue does not run is
      a therapeutic target by construction, which is unusual among the
      hallmarks.

- name: Telomere Maintenance via Recombination
  description: >-
    The module's central node names the recombination route and binds only the
    telomerase one, so an ALT tumour conforming there asserts a mechanism it
    does not use. This node carries that minority route on its own terms.
    Between 4 and 11% of cancers maintain telomeres through a homologous
    recombination-based pathway instead of telomerase, concentrated in tumours
    of mesenchymal origin and associated with poorer outcome; mutations of the
    ATRX/DAXX complex and the histone variant H3.3 are prevalent in them. The
    consequence that matters for this module is not statistical. Because the
    route is telomerase-independent, an ALT tumour is indifferent to a
    telomerase inhibitor however universal that target otherwise is, so the
    vulnerability node here is not available to it - and the recombination
    machinery it depends on instead is its own candidate target. A conforming
    entry should state which of the two routes its tumour uses rather than
    conforming to the central node generically, since the two select different
    drugs.
  role: central_effector
  biological_processes:
  - preferred_term: Telomere maintenance via recombination
    term:
      id: GO:0000722
      label: telomere maintenance via recombination
    modifier: INCREASED
  evidence:
  - reference: PMID:32175073
    reference_title: "Alternative lengthening of telomeres: from molecular mechanisms to therapeutic outlooks."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most of cancers rely on telomerase to extend and maintain telomeres, but
      4-11% of cancers use a homologous recombination-based pathway called
      alternative lengthening of telomeres
    explanation: >-
      Establishes the route and its share, and that it is an alternative to
      telomerase rather than an addition - which is what makes this a separate
      node rather than a qualifier on the central one. Graded OTHER as the
      source is a review.
  - reference: PMID:32175073
    reference_title: "Alternative lengthening of telomeres: from molecular mechanisms to therapeutic outlooks."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ALT is prevalent in cancers from the mesenchymal origin and usually
      associates with poor clinical outcome.
    explanation: >-
      Supplies the tumour-type distribution a conforming entry needs in order
      to decide whether this node or the telomerase node applies to it.
  - reference: PMID:32175073
    reference_title: "Alternative lengthening of telomeres: from molecular mechanisms to therapeutic outlooks."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sequencing of cancer genomes discovered that mutations of the ATRX/DAXX
      complex and the histone variant H3.3 are prevalent in ALT+ cancers
    explanation: >-
      The genetic marker set that identifies this route in practice, which the
      module previously mentioned only in its notes.
  - reference: PMID:32175073
    reference_title: "Alternative lengthening of telomeres: from molecular mechanisms to therapeutic outlooks."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Given its critical role in protecting telomeres and genomic integrity in
      tumor cells, ALT is an Achilles heel of tumors and an attractive target
      for cancer therapy.
    explanation: >-
      Supports this node carrying its own therapeutic reading rather than
      inheriting the telomerase one, which does not apply to it.
  downstream:
  - target: Replicative Immortality

- name: Telomerase as a Near-Universal Target
  description: >-
    This hallmark is unusual in offering a target that is a property of the
    mechanism rather than of any one tumour. Telomerase is silent in normal
    differentiated human tissue and reactivated in most human cancers, so
    inhibiting it is close to a universal oncology strategy on paper, and
    imetelstat has now been approved. The qualification is the one the module
    was missing: the target is near-universal and not universal. A tumour
    using the recombination route maintains its telomeres without telomerase
    and is indifferent to the inhibitor, so telomere-maintenance route is a
    predictive marker here in the same way repair-pathway status is in
    genome_instability_mutation. A conforming entry proposing a
    telomerase-directed agent should therefore have established that its
    tumour is telomerase-positive rather than inferring it from the hallmark.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Telomere Maintenance via Telomerase
    term:
      id: GO:0007004
      label: telomere maintenance via telomerase
  evidence:
  - reference: PMID:39349313
    reference_title: "Telomerase in Cancer Therapeutics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While silent in normal differentiated human tissues, telomerase is
      reactivated in most human cancers.
    explanation: >-
      The selectivity argument this node rests on: the target is absent from
      the normal tissue the drug would otherwise damage. Graded OTHER as the
      source is a review.
  - reference: PMID:39349313
    reference_title: "Telomerase in Cancer Therapeutics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Thus, telomerase is an almost universal oncology target.
    explanation: >-
      States the node, including the hedge - almost universal, which is the ALT
      route this module now carries as its own node.
  - reference: PMID:39349313
    reference_title: "Telomerase in Cancer Therapeutics."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While imetelstat has been recently approved by the Food and Drug
      Administration
    explanation: >-
      Establishes that the strategy has produced an approved agent, which is
      what distinguishes this node from a proposal.
  downstream:
  - target: Replicative Immortality
    description: >-
      Blocking maintenance returns the lineage to the telomere clock, so the
      consequence node is what the drug is trying to undo.

- name: Replicative Immortality
  description: >-
    With telomeres stabilized, the cancer cell lineage acquires unlimited
    proliferative capacity - replicative immortality - decoupling division
    number from the telomere clock. This sustains the extensive clonal
    expansion required for macroscopic tumor growth and progression.
  role: consequence
  biological_processes:
  - preferred_term: Cell Population Proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include sustaining proliferative signaling, evading growth
      suppressors, resisting cell death, enabling replicative immortality,
      inducing angiogenesis, and activating invasion and metastasis.
    explanation: >-
      Hanahan & Weinberg list enabling replicative immortality as a core
      hallmark capability, the consequence modeled here. Evidence source is
      OTHER because this is a review article.

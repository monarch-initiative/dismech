    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:21282636
    reference_title: "Normal gut microbiota modulates brain development and behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GF mice exposed to gut microbiota early in life display similar
      characteristics as SPF mice, including reduced expression of PSD-95 and
      synaptophysin in the striatum.
    explanation: >-
      Ties colonization status to synaptic protein expression, giving this node
      a molecular readout rather than only a network-level one.
  - reference: PMID:41168153
    reference_title: "Childhood gut microbiome is linked to internalizing symptoms at school age via the functional connectome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microbial Profile 3 was indirectly positively associated with
      caregiver-reported internalizing symptoms at age 7.5 years through higher
      scores on the SOFA Between Network Connectivity Brain Signature,
      controlling for covariates
    explanation: >-
      The human counterpart of this node - early microbial composition tracking a
      later network-connectivity signature. Graded INDIRECT because the exposure
      is a cohort-specific latent component and the effect is statistical
      mediation in an observational sample, not a measured synaptic change.
  downstream:
  - target: Altered Affective and Stress-Responsive Behavior
    description: >-
      Refinement of emotion-related circuits sets the behavioural output.
    hypothesis_groups:
    - mgba_neuroimmune_metabolite_route
    - mgba_developmental_connectome_programming

- name: Altered Affective and Stress-Responsive Behavior
  description: >-
    The terminal consequence: anxiety-like and depression-like behaviour in
    rodents, and elevated internalizing symptoms and reduced mental quality of
    life in humans. This node is where conforming disorder entries attach their
    disease-specific affective phenotype.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:21282636
    reference_title: "Normal gut microbiota modulates brain development and behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using measures of motor activity and anxiety-like behavior, we demonstrate
      that germ free (GF) mice display increased motor activity and reduced
      anxiety, compared with specific pathogen free (SPF) mice with a normal gut
      microbiota.
    explanation: >-
      Establishes a behavioural consequence of colonization status. Note the
      direction: absence of a microbiota reduces anxiety-like behaviour, so this
      node is "altered", not uniformly "increased".
  - reference: PMID:15133062
    reference_title: "Postnatal microbial colonization programs the hypothalamic-pituitary-adrenal system for stress response in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that commensal microbiota can affect the postnatal
      development of the HPA stress response in mice.
    explanation: >-
      Supplies the stress-responsive half of this node and is the terminal
      evidence for the neuroendocrine hypothesis group.
  - reference: PMID:41168153
    reference_title: "Childhood gut microbiome is linked to internalizing symptoms at school age via the functional connectome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find that microbes in the Clostridiales order and Lachnospiraceae family
      are associated with internalizing symptoms in middle childhood through
      connectivity alterations within emotion-related brain networks.
    explanation: >-
      Human developmental evidence for the affective endpoint, reached through
      the circuit node rather than directly.
treatments:
- name: Microbiota-Targeted Dietary Intervention
  description: >-
    Probiotic or fermented-milk supplementation aimed at shifting community
    composition and its metabolite output. Included because it is the
    intervention that acts on this module's upstream node in humans, not because
    it is an established treatment for any disease curated against this module -
    the supporting trial measured brain activity in healthy volunteers, with no
    clinical endpoint.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: probiotic dietary supplementation
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Altered Microbial Neuroactive Metabolite Output
    treatment_effect: MODULATES
    description: >-
      Supplementation changes which organisms are present and therefore the
      neuroactive metabolite repertoire, upstream of the microglial effector.
    evidence:
    - reference: PMID:23474283
      reference_title: "Consumption of fermented milk product with probiotic modulates brain activity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        FMPP intake was associated with reduced task-related response of a
        distributed functional network (49% cross-block covariance; P = .004)
        containing affective, viscerosensory, and somatosensory cortices.
      explanation: >-
        A randomized human intervention showing a microbiota-targeted dietary
        change alters affective-network brain response. Graded INDIRECT because
        the trial measured the brain endpoint, not the metabolite node this link
        targets.
  evidence:
  - reference: PMID:31123355
    reference_title: "The role of short-chain fatty acids in microbiota-gut-brain communication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The effects of microbiota-targeted interventions such as prebiotics,
      probiotics and diet on psychological functioning and the putative mediating
      role of SCFA signalling will also be discussed
    explanation: >-
      Places prebiotic/probiotic/dietary intervention as the recognised
      microbiota-targeted lever on this axis, and identifies SCFA signalling as
      the proposed mediator - which is the node this treatment targets.
discussions:
- discussion_id: mgba_germfree_microglia_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the germ-free rodent microglial phenotype correspond to anything that
    occurs in human dysbiosis, or is it an artefact of total lifelong microbial
    absence?
  attaches_to:
  - pathophysiology#Microglial Maturation and Reactivity Alteration
  rationale: >-
    The central effector of this module rests almost entirely on germ-free and
    gnotobiotic mice. Germ-free rearing removes the microbiota completely from
    birth - an exposure with no human counterpart, since even severe human
    dysbiosis is a compositional shift within a colonised gut. It is therefore
    unresolved whether the immature microglial phenotype is on the same
    continuum as anything produced by human dysbiosis, or whether it is a
    threshold effect visible only at total absence. This matters directly for
    conformance: a human disease entry that conforms to this node inherits a
    claim whose only direct evidence comes from that model. No human study has
    measured microglial maturation state as a function of gut microbial
    composition.
  status: OPEN
- discussion_id: mgba_connectome_path_replication
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the microbiota-to-connectome-to-symptom path in children reproducible
    outside a single cohort, and does it survive a design that can detect a
    total effect?
  attaches_to:
  - pathophysiology#Altered Synaptic and Circuit Refinement
  - mechanistic_hypotheses#mgba_developmental_connectome_programming
  rationale: >-
    The only human developmental evidence for the circuit node is one
    observational cohort in which the microbiota-symptom association was
    indirect-only, with no total effect, at N = 55 (N = 43 adjusted). Both the
    microbial and the brain predictors are sparse-PLS latent components fitted in
    that sample, so neither can be measured in another cohort without refitting -
    which means the finding as stated is not directly replicable, only its
    analytic strategy is. Until an independent cohort reproduces it, this path
    should not be treated as an established step in the module chain.

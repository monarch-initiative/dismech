name: Microbiota-Gut-Brain Neuroimmune Signaling Module
description: >-
  A conserved microbiota-gut-brain axis (MGBA) mechanism module for the
  neuroimmune route by which the intestinal microbial community shapes central
  nervous system circuit function. The chain is: a shift in gut microbial
  community composition alters the output of neuroactive microbial metabolites
  (short-chain fatty acids, microbial tryptophan/serotonin and monoamine
  precursors); reduced metabolite signalling both weakens blood-brain barrier
  integrity and reaches the brain parenchyma directly; microglia - whose
  maturation and reactivity are microbiota-dependent - are the rate-limiting
  convergence point; altered microglial state perturbs synaptic and circuit
  refinement; and the terminal consequence is altered affective and
  stress-responsive behaviour. Drug-target pattern: microbiota-targeted dietary
  intervention (probiotic/fermented-milk supplementation) MODULATES the
  microbial-metabolite node upstream of the microglial effector. Key conformance
  target - "microbiota_gut_brain_neuroimmune_signaling#Microglial Maturation and
  Reactivity Alteration". Complementarity with siblings - gut_dysbiosis models
  the SAME upstream microbial shift but as a hallmark of AGING terminating in
  inflammaging and systemic age-related decline, and routes its systemic
  inflammatory consequences to the inflammaging module; this module instead
  terminates in CNS circuit and affective outcomes and is scoped to
  neurodevelopment and psychiatric disease. intestinal_barrier_dysfunction
  models gut-luminal barrier failure with a diarrheal endpoint and shares no
  node with this module. A disorder whose microbial shift drives both systemic
  ageing and CNS phenotypes should conform to both gut_dysbiosis and this
  module on separate nodes rather than folding them together.
category: Module
module_categories:
- NEUROSCIENCE
- IMMUNOLOGY
- DEVELOPMENTAL_BIOLOGY
creation_date: "2026-09-04T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a
  "Microbiota-Gut-Brain Axis", "Gut-Brain Axis", or "Dysbiosis" Disease entry -
  none of these is a disorder, and a population-level microbiome-behaviour
  association is a facet of an existing disease entry rather than an entry of
  its own. Disorder entries reference individual nodes via conforms_to (for
  example, "microbiota_gut_brain_neuroimmune_signaling#Microglial Maturation and
  Reactivity Alteration").

  Scope, stated deliberately. The MGBA as a whole is mechanistically
  heterogeneous - the microbiota reach the brain by immune, neuroendocrine
  (HPA), vagal/enteric-neural, and humoral routes in parallel - and so does not
  by itself clear the one-conserved-chain module bar. This module curates the
  neuroimmune (metabolite -> barrier -> microglia -> circuit) route as its node
  chain because that is the branch with a single rate-limiting and
  disorder-agnostic step. The neuroendocrine/HPA route is real and well evidenced but is
  represented here as an ALTERNATIVE hypothesis group on the causal edges rather
  than as a duplicated node chain; the vagal and enteric-neural routes are not
  curated here at all. If the vagal route acquires enough disorder-level
  conformers to need consistency checking, it should become its own module, not
  a second chain bolted onto this one.

  Species caveat. Four of the six nodes rest on germ-free and gnotobiotic rodent
  experiments (Erny 2015, Braniste 2014, Sudo 2004, Diaz Heijtz 2011). Germ-free
  rearing is not a model of human dysbiosis - it is total absence of a
  microbiota from birth, an exposure with no human counterpart - so a conforming
  human disease entry should not silently inherit those links at
  fidelity HIGH. Human evidence in this module is observational and
  population-scale (Valles-Colomer 2019, Querdasi 2025) or a small
  interventional fMRI trial (Tillisch 2013); none of it establishes direction of
  effect in humans. Grade conforming evidence accordingly.

  Wired conformers, and what was deliberately left unwired. Two disorder entries
  declare conformance, both at the trigger node only: Autism_Spectrum_Disorder
  ("Gut microbiome associations in studied groups", which already chains onward
  to that entry's neuroinflammatory node, matching this module's shape) and
  Irritable_Bowel_Syndrome ("Microbiome Dysbiosis", a disorder of gut-brain
  interaction by definition). Conformance at the trigger is safe for both
  because this module's trigger node carries no biological_processes of its own,
  so declaring it imports no claim the disorder entry does not already make.
  Three further candidates were considered and left unwired on purpose:
  Parkinsons_Disease already conforms its dysbiosis and barrier nodes to
  gut_dysbiosis and conforms_to is single-valued, so retargeting them would
  trade one true statement for another; the Autism_Spectrum_Disorder
  neuroinflammatory node is glial and cytokine-level but not microglia-specific,
  so conforming it to this module's central effector would assert a specificity
  that entry's own evidence disclaims; and Major_Depressive_Disorder has a
  Neuroinflammation node but no microbiome node at all, so there is nothing to
  attach the trigger to without first curating one.

  Not an Xogenesis module - the terminal output is an altered behavioural and
  circuit state, not a pathological material anatomical entity, so no
  OGMS/MPATH/UBERON anchor stanza applies.
mechanistic_hypotheses:
- hypothesis_group_id: mgba_neuroimmune_metabolite_route
  hypothesis_label: Microbial Metabolite-Neuroimmune Route
  status: CANONICAL
  description: >-
    Microbiota-derived metabolites, principally short-chain fatty acids, are the
    signal; microglia are the CNS receiver. Loss of the normal metabolite supply
    leaves microglia immature and abnormally reactive, and this altered
    microglial state is what perturbs synaptic refinement and circuit function.
    This is the default model curated as this module's node chain.
  evidence:
  - reference: PMID:26030851
    reference_title: "Host microbiota constantly control maturation and function of microglia in the CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We determined that short-chain fatty acids (SCFA), microbiota-derived
      bacterial fermentation products, regulated microglia homeostasis.
    explanation: >-
      Identifies SCFA as the specific microbial signal controlling the microglial
      node, which is what makes the metabolite-to-microglia step the spine of this
      model rather than one correlate among many.
- hypothesis_group_id: mgba_neuroendocrine_hpa_route
  hypothesis_label: Neuroendocrine HPA Programming Route
  status: ALTERNATIVE
  description: >-
    A parallel, superimposed route in which early postnatal colonization
    programs hypothalamic-pituitary-adrenal stress reactivity directly, so that
    affective consequences arise from an exaggerated corticosterone/ACTH stress
    response rather than from microglial and synaptic changes. The two routes are
    not exclusive and may act on the same terminal node. Curated as a hypothesis
    group rather than a node chain because it has no rate-limiting step
    distinct from the HPA axis itself.
  evidence:
  - reference: PMID:15133062
    reference_title: "Postnatal microbial colonization programs the hypothalamic-pituitary-adrenal system for stress response in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Plasma ACTH and corticosterone elevation in response to restraint stress
      was substantially higher in GF mice than in SPF mice, but not in response
      to stimulation with ether.
    explanation: >-
      Shows the endocrine stress axis itself is altered by colonization status,
      which is the claim that distinguishes this route from the neuroimmune one.
- hypothesis_group_id: mgba_developmental_connectome_programming
  hypothesis_label: Developmental Connectome Programming Hypothesis
  status: EMERGING
  description: >-
    That early-childhood gut microbial composition programs the large-scale
    functional connectome, and that the resulting network architecture - not a
    direct microbe-to-behaviour effect - is what carries risk forward to
    internalizing symptoms at school age. The distinguishing prediction is an
    indirect (mediated) effect in the absence of a total effect. Human evidence
    is currently one small prospective cohort; treat as a lead, not as an
    established step.
  evidence:
  - reference: PMID:41168153
    reference_title: "Childhood gut microbiome is linked to internalizing symptoms at school age via the functional connectome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find that microbes in the Clostridiales order and Lachnospiraceae family
      are associated with internalizing symptoms in middle childhood through
      connectivity alterations within emotion-related brain networks.
    explanation: >-
      States the mediated microbiota-to-connectome-to-symptom claim that defines
      this hypothesis group.
  notes: >-
    Held at EMERGING deliberately. The mediating effect was indirect-only: there
    was no total effect of the microbial profile on internalizing symptoms, the
    analytic sample was N = 55 (N = 43 with all covariates), the microbial and
    brain predictors are cohort-specific sparse-PLS latent components with no
    identity outside that dataset, and functional potential was inferred from 16S
    amplicon data rather than shotgun metagenomics. The authors themselves call
    for replication. Do not promote this group without an independent cohort.
pathophysiology:
- name: Gut Microbial Community Composition Shift
  description: >-
    The composition of the intestinal microbial community departs from the
    typical age-appropriate configuration - in early life through delivery mode,
    feeding, antibiotic exposure and infection, and in established disease
    through depletion of specific commensal taxa. This is the initiating state of
    the module and is deliberately defined by community composition rather than
    by any single organism.
  role: trigger
  biological_scale: ORGANISM
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  evidence:
  - reference: PMID:31460832
    reference_title: "The Microbiota-Gut-Brain Axis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Many factors can influence microbiota composition in early life, including
      infection, mode of birth delivery, use of antibiotic medications, the
      nature of nutritional provision, environmental stressors, and host
      genetics.
    explanation: >-
      Establishes that the initiating community shift is produced by ordinary
      early-life exposures, which is why this node is the trigger rather than a
      downstream consequence.
  - reference: PMID:30718848
    reference_title: "The neuroactive potential of the human gut microbiota in quality of life and depression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Butyrate-producing Faecalibacterium and Coprococcus bacteria were
      consistently associated with higher quality of life indicators. Together
      with Dialister, Coprococcus spp. were also depleted in depression, even
      after correcting for the confounding effects of antidepressants.
    explanation: >-
      Population-scale human evidence that specific commensal depletion tracks
      affective outcomes, grounding the trigger node in human data rather than
      germ-free rodents alone.
  - reference: PMID:27067014
    reference_title: "Gut microbiome remodeling induces depressive-like behaviors through a pathway mediated by the host's metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fecal microbiota transplantation of GF mice with 'depression microbiota'
      derived from MDD patients resulted in depression-like behaviors compared
      with colonization with 'healthy microbiota' derived from healthy control
      individuals.
    explanation: >-
      Transfer of a human disease-associated community into germ-free recipients
      shows the community shift is sufficient rather than merely correlated,
      which is the claim that licenses this node as a trigger.
  downstream:
  - target: Altered Microbial Neuroactive Metabolite Output
    description: >-
      A shift in which taxa are present changes which fermentation and
      tryptophan-catabolism products are made.
    hypothesis_groups:
    - mgba_neuroimmune_metabolite_route
    - mgba_developmental_connectome_programming
  - target: Altered Affective and Stress-Responsive Behavior
    description: >-
      Direct edge for the neuroendocrine route, in which colonization status
      programs HPA stress reactivity without passing through the microglial
      effector.
    hypothesis_groups:
    - mgba_neuroendocrine_hpa_route

- name: Altered Microbial Neuroactive Metabolite Output
  description: >-
    The shifted community produces a different repertoire of neuroactive
    metabolites. The best-characterised are the short-chain fatty acids from
    bacterial fermentation of dietary fibre, which fall when butyrate producers
    are depleted; the microbiota also drive enterochromaffin-cell serotonin
    biosynthesis and carry the genomic potential for monoamine and GABA
    metabolism. This node is the molecular signal the rest of the chain
    transmits.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: enterochromaffin cell
    term:
      id: CL:0000577
      label: type EC enteroendocrine cell
  biological_processes:
  - preferred_term: short-chain fatty acid metabolic process
    term:
      id: GO:0046459
      label: short-chain fatty acid metabolic process
    modifier: DECREASED
  - preferred_term: serotonin biosynthetic process
    term:
      id: GO:0042427
      label: serotonin biosynthetic process
    modifier: DECREASED
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  evidence:
  - reference: PMID:31123355
    reference_title: "The role of short-chain fatty acids in microbiota-gut-brain communication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Short-chain fatty acids (SCFAs), the main metabolites produced by bacterial
      fermentation of dietary fibre in the gastrointestinal tract, are speculated
      to have a key role in microbiota-gut-brain crosstalk.
    explanation: >-
      Identifies SCFA as the metabolite class this node tracks and states its
      proposed role as the gut-to-brain signal.
  - reference: PMID:25860609
    reference_title: "Indigenous bacteria from the gut microbiota regulate host serotonin biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Indigenous spore-forming bacteria (Sp) from the mouse and human microbiota
      promote 5-HT biosynthesis from colonic enterochromaffin cells (ECs), which
      supply 5-HT to the mucosa, lumen, and circulating platelets.
    explanation: >-
      Grounds the serotonin-biosynthesis process and the enterochromaffin cell
      type on this node, and shows the microbial community is what sets that
      output.
  - reference: PMID:30718848
    reference_title: "The neuroactive potential of the human gut microbiota in quality of life and depression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gut-brain module analysis of faecal metagenomes identified the microbial
      synthesis potential of the dopamine metabolite
      3,4-dihydroxyphenylacetic acid as correlating positively with mental
      quality of life
    explanation: >-
      Human metagenomic evidence that the neuroactive synthesis potential of the
      community, not just its taxonomy, is what tracks mental-health outcomes.
  downstream:
  - target: Blood-Brain Barrier Permeability Increase
    description: >-
      Loss of the normal metabolite supply is associated with weaker
      tight-junction expression at the cerebrovascular endothelium.
    hypothesis_groups:
    - mgba_neuroimmune_metabolite_route
  - target: Microglial Maturation and Reactivity Alteration
    description: >-
      SCFA act directly on microglia; this is the rate-limiting step of the
      canonical route.
    hypothesis_groups:
    - mgba_neuroimmune_metabolite_route
    - mgba_developmental_connectome_programming

- name: Blood-Brain Barrier Permeability Increase
  description: >-
    Absent or reduced microbial signalling is accompanied by reduced expression
    of endothelial tight-junction proteins and increased blood-brain barrier
    permeability, widening the access of circulating microbial and immune
    mediators to the brain parenchyma. The change is reversible on
    recolonization, which is what marks it as a signalling-dependent state
    rather than fixed damage.
  role: amplifier
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cerebral cortex endothelial cell
    term:
      id: CL:1001602
      label: cerebral cortex endothelial cell
  biological_processes:
  - preferred_term: establishment of blood-brain barrier
    term:
      id: GO:0060856
      label: establishment of blood-brain barrier
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:25411471
    reference_title: "The gut microbiota influences blood-brain barrier permeability in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The increased BBB permeability was maintained in germ-free mice after birth
      and during adulthood and was associated with reduced expression of the
      tight junction proteins occludin and claudin-5, which are known to regulate
      barrier function in endothelial tissues.
    explanation: >-
      Supplies the molecular content of this node - tight-junction loss at the
      cerebrovascular endothelium - under absent microbial signalling.
  - reference: PMID:25411471
    reference_title: "The gut microbiota influences blood-brain barrier permeability in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Exposure of germ-free adult mice to a pathogen-free gut microbiota
      decreased BBB permeability and up-regulated the expression of tight
      junction proteins.
    explanation: >-
      Reversal on recolonization is what establishes the barrier state as
      microbiota-dependent rather than a fixed developmental defect.
  downstream:
  - target: Microglial Maturation and Reactivity Alteration
    description: >-
      A more permeable barrier increases parenchymal exposure to circulating
      microbial and immune mediators acting on microglia.
    hypothesis_groups:
    - mgba_neuroimmune_metabolite_route

- name: Microglial Maturation and Reactivity Alteration
  description: >-
    Microglia fail to reach or maintain a mature homeostatic phenotype and
    respond abnormally to challenge. This is the rate-limiting, disorder-agnostic
    convergence point of the module - the step every conforming disorder funnels
    through - and it is where the module's key conformance target sits. The state
    is continuously microbiota-dependent rather than fixed at a developmental
    checkpoint, and is partially reversible on recolonization.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglia differentiation
    term:
      id: GO:0014004
      label: microglia differentiation
    modifier: DECREASED
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: regulation of neuroinflammatory response
    term:
      id: GO:0150077
      label: regulation of neuroinflammatory response
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:26030851
    reference_title: "Host microbiota constantly control maturation and function of microglia in the CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed substantial contributions of the host microbiota to microglia
      homeostasis, as germ-free (GF) mice displayed global defects in microglia
      with altered cell proportions and an immature phenotype, leading to
      impaired innate immune responses.
    explanation: >-
      Direct evidence for the node itself - the microglial compartment is
      immature and functionally impaired when the microbial signal is absent.
  - reference: PMID:26030851
    reference_title: "Host microbiota constantly control maturation and function of microglia in the CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, recolonization with a complex microbiota partially restored
      microglia features.
    explanation: >-
      Partial reversibility on recolonization supports treating this as an
      ongoing microbiota-dependent state, which is what makes it a tractable
      conformance target rather than a developmental endpoint.
  downstream:
  - target: Altered Synaptic and Circuit Refinement
    description: >-
      Microglia prune synapses and shape circuit wiring; an altered microglial
      state changes that refinement.
    hypothesis_groups:
    - mgba_neuroimmune_metabolite_route
    - mgba_developmental_connectome_programming

- name: Altered Synaptic and Circuit Refinement
  description: >-
    Synaptic density, synaptic protein expression and plasticity-related
    signalling deviate from the typical developmental trajectory, and the
    large-scale functional network architecture that emerges from that
    refinement differs. In humans this is observed as altered resting-state
    connectivity within and between emotion-related networks rather than at the
    synapse directly.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:

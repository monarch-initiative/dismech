name: Genomic Instability (Aging) Module
description: >-
  A conserved mechanism module for the hallmark of aging (Lopez-Otin et al.)
  termed genomic instability, framed for the AGING process (distinct from the
  cancer-facing genome_instability_mutation module). Somatic cells are
  continuously exposed to endogenous and environmental sources of DNA damage -
  reactive oxygen species, replication errors, radiation, and mutagens -
  introducing tens of thousands of lesions per cell per day. A complex network
  of genome-maintenance systems removes this damage, but its capacity declines
  with age while damage continues to accrue; repair is sometimes erroneous and
  replication occasionally fails. The result is progressive accumulation of
  somatic mutations, epimutations, and persistent DNA damage across organs and
  tissues. Rather than (as in cancer) fueling a mutator phenotype and clonal
  selection, in the aging frame this damage load drives cellular dysfunction,
  senescence, and cell loss - a potentially unifying cause of the aging
  phenotype. Individual disorder entries declare conformance via conforms_to on
  their pathophysiology nodes, substituting the disease-specific
  genome-maintenance defect (e.g. the DNA-repair-deficiency segmental progeroid
  syndromes) while preserving the conserved damage -> failing-repair ->
  mutation-accumulation -> cellular-dysfunction chain.
category: Module
creation_date: "2026-07-01T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "genomic_instability_aging#Declining Genome Maintenance and Erroneous
  Repair"). This is the deliberate aging-facing counterpart of the
  cancer-facing genome_instability_mutation module: they share the upstream
  DNA-damage/repair-failure chain but diverge at the outcome -
  genome_instability_mutation ends in a mutator phenotype and clonal evolution
  toward malignancy, whereas this module ends in DNA-damage-driven cellular
  dysfunction, senescence, and tissue aging. Do not duplicate the cancer arm
  here; conforming neoplastic disorders should use genome_instability_mutation
  instead. This module feeds cellular_senescence and telomere_attrition, and its
  natural conformers are the DNA-repair-deficiency progeroid syndromes (Werner,
  Cockayne, xeroderma pigmentosum, Rothmund-Thomson). Key conformance target:
  "genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair".
pathophysiology:
- name: Accumulating DNA Damage
  description: >-
    Somatic cells are continuously exposed to endogenous and environmental
    sources of DNA damage - reactive oxygen species, spontaneous replication
    errors, UV and ionizing radiation, and environmental mutagens - that
    introduce a very large number of chemical lesions into the genome each day.
    This continuous genotoxic burden is the initiating input of the hallmark.
  role: trigger
  biological_processes:
  - preferred_term: DNA Damage Response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:23398157
    reference_title: "Genome instability and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Somatic cells are continuously exposed to various sources of DNA damage,
      from reactive oxygen species to UV radiation to environmental mutagens.
    explanation: >-
      Enumerates the continuous endogenous and environmental sources of DNA
      damage that constitute the genotoxic input modeled here. Evidence source is
      OTHER because this is a review.
  - reference: PMID:23398157
    reference_title: "Genome instability and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To cope with the tens of thousands of chemical lesions introduced into the
      genome of a typical cell each day, a complex network of genome maintenance
      systems acts to remove damage and restore the correct base pair sequence.
    explanation: >-
      Quantifies the daily lesion burden and introduces the genome-maintenance
      network that normally counters it, framing the trigger and the next node.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Declining Genome Maintenance and Erroneous Repair
- name: Declining Genome Maintenance and Erroneous Repair
  description: >-
    Genome-maintenance and DNA-repair capacity is normally sufficient to remove
    damage and restore the correct sequence, but with age this capacity declines
    while damage continues to accrue, and repair is sometimes erroneous (as is
    replication during division). The failure to fully and faithfully repair
    accumulating damage is the central effector that disease-specific
    genome-maintenance defects converge upon.
  role: central_effector
  biological_processes:
  - preferred_term: DNA Repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:23398157
    reference_title: "Genome instability and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Occasionally, however, repair is erroneous, and such errors, as well as
      the occasional failure to correctly replicate the genome during cell
      division, are the basis for mutations and epimutations.
    explanation: >-
      Establishes erroneous repair and replication failure as the source of
      mutations and epimutations, the failing-maintenance effector modeled here.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Accumulation of Somatic Mutations and Genomic Damage
- name: Accumulation of Somatic Mutations and Genomic Damage
  description: >-
    Unrepaired and misrepaired lesions leave a rising burden of somatic
    mutations, epimutations, and persistent DNA damage that accumulates in
    various organs and tissues over the lifespan. This is the conserved measure
    of genomic instability in the aging frame, upstream of its cellular
    consequences.
  role: effector
  evidence:
  - reference: PMID:23398157
    reference_title: "Genome instability and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is now ample evidence that mutations accumulate in various organs
      and tissues of higher animals, including humans, mice, and flies.
    explanation: >-
      Documents accumulation of somatic mutations across organs and tissues with
      age, the genomic-damage burden modeled in this node. Evidence source is
      OTHER because this is a review.
  - reference: PMID:23746838
    reference_title: "The hallmarks of aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These hallmarks are: genomic instability, telomere attrition, epigenetic
      alterations, loss of proteostasis, deregulated nutrient sensing,
      mitochondrial dysfunction, cellular senescence, stem cell exhaustion, and
      altered intercellular communication.
    explanation: >-
      Enumerates genomic instability as a hallmark of aging, framing this module.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: DNA-Damage-Driven Cellular Dysfunction and Aging
- name: DNA-Damage-Driven Cellular Dysfunction and Aging
  description: >-
    In the aging frame, the accumulated DNA damage and mutation burden drives
    cellular dysfunction, senescence, and cell loss - affecting most aspects of
    the aging phenotype and acting as a potentially unifying cause of aging. This
    is the conserved consequence that distinguishes the aging arm from the
    cancer arm (mutator phenotype and clonal evolution); the specific organ or
    disease phenotype is supplied by the conforming disorder, and targeting DNA
    damage is a rationale for anti-aging intervention.
  role: consequence
  evidence:
  - reference: PMID:33911272
    reference_title: "The central role of DNA damage in the ageing process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Here we synthesize accumulating evidence that DNA damage affects most, if
      not all, aspects of the ageing phenotype, making it a potentially unifying
      cause of ageing.
    explanation: >-
      Establishes DNA damage as affecting most aspects of the aging phenotype and
      a potentially unifying cause of aging, the consequence modeled here.
      Evidence source is OTHER because this is a review.
  - reference: PMID:33911272
    reference_title: "The central role of DNA damage in the ageing process."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Targeting DNA damage and its mechanistic links with the ageing phenotype
      will provide a logical rationale for developing unified interventions to
      counteract age-related dysfunction and disease.
    explanation: >-
      Frames DNA-damage targeting as a rationale for anti-aging intervention, the
      intervention angle of this outcome node. Evidence source is OTHER because
      this is a review.
animal_models:
- name: Aging turquoise killifish kidney marrow (Nothobranchius furzeri)
  species: Turquoise killifish (Nothobranchius furzeri)
  genotype: Wild type
  background: >-
    Young-adult versus old fish, sampling kidney marrow as the principal
    hematopoietic organ, profiled by single-cell RNA sequencing, cytometry,
    functional in vitro assays, and proteomics of marrow-derived cells and plasma.
  category: Naturally short-lived vertebrate aging model
  publication: PMID:41862756
  description: >-
    Morabito and colleagues asked whether the killifish immune compartment ages the
    way the mammalian one does. Immune progenitor populations in old fish carry
    increased DNA damage markers, while progenitors from younger adults show active
    proliferation and replication-independent repair. Because the whole transition
    occurs in under ten weeks, the model compresses progenitor genome-maintenance
    decline into a timescale where interventions can be tested directly.
  modeled_mechanisms:
  - target: Accumulating DNA Damage
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Immune cell progenitors from old killifish carry increased DNA damage markers
      relative to those from young adults, reproducing the module's upstream node in
      a stem and progenitor compartment where the consequences are systemic.
    limitations: >-
      Damage is inferred from marker expression in single-cell and proteomic data
      rather than from direct lesion quantification such as comet assay or mutation
      calling, so the size and type of the lesion burden are not established. The
      analysis is confined to the hematopoietic compartment. Killifish kidney marrow
      is the teleost equivalent of bone marrow, not a homologous tissue, so
      compartment-level inferences to human hematopoiesis need corroboration.
    readouts:
    - name: DNA damage markers in immune cell progenitors
      target: Accumulating DNA Damage
      description: >-
        Single-cell transcriptomic and proteomic markers of DNA damage in kidney
        marrow immune progenitor populations, old versus young adult.
      direction: INCREASED
      interpretation: >-
        Rising damage markers specifically in the progenitor compartment is the
        direct measurement supporting this node.
      evidence:
      - reference: PMID:41862756
        reference_title: Spontaneous aging-associated inflammation and genome instability in the immune system of turquoise killifish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "while immune progenitor-like cell clusters from adult killifish display markers of active proliferation and replication-independent DNA repair, immune cell progenitors from old killifish display increased markers of DNA damage"
        explanation: Reports the damage-marker comparison between age groups underlying this readout.
    evidence:
    - reference: PMID:41862756
      reference_title: Spontaneous aging-associated inflammation and genome instability in the immune system of turquoise killifish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "while immune progenitor-like cell clusters from adult killifish display markers of active proliferation and replication-independent DNA repair, immune cell progenitors from old killifish display increased markers of DNA damage"
      explanation: >-
        Supports treating this model as informative for the accumulating-damage node
        in a spontaneously aging, non-irradiated vertebrate.
  - target: Declining Genome Maintenance and Erroneous Repair
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Proteins involved in DNA repair are among those whose expression falls with
      age in the killifish hematopoietic compartment, alongside the loss of the
      replication-independent repair signature that characterizes adult but not old
      progenitors. Both are consistent with the module's claim that maintenance
      capacity declines, and the transition is spontaneous and occurs within weeks.
    limitations: >-
      Repair capacity is read from proteomic and transcriptomic signatures rather
      than measured functionally, and no repair-fidelity assay or mutation spectrum
      was reported, so erroneous repair specifically is not established by this
      model - only a decline in repair-associated expression. The proteomic
      signature also falls for proliferation and detoxification, so it is not
      specific to genome maintenance. The contrast between age groups is
      cross-sectional.
    readouts:
    - name: Expression of proliferation- and DNA-repair-associated proteins with age
      target: Declining Genome Maintenance and Erroneous Repair
      description: >-
        Proteomic comparison of biological processes differing most with age in
        kidney marrow, aged versus young-adult fish.
      direction: DECREASED
      interpretation: >-
        DNA repair is among the processes whose protein-level expression falls with
        age, which is the measured decline this node rests on; it is a proteomic
        signature, not a functional repair assay.
      evidence:
      - reference: PMID:41862756
        reference_title: Spontaneous aging-associated inflammation and genome instability in the immune system of turquoise killifish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "aged individuals had lower expression of proteins involved in cellular proliferation, ‘DNA repair’, ‘cellular detoxification from toxic substances’ and ‘negative regulation of chemotaxis’"
        explanation: Reports the age-dependent decrease in DNA-repair protein expression underlying this readout.
    evidence:
    - reference: PMID:41862756
      reference_title: Spontaneous aging-associated inflammation and genome instability in the immune system of turquoise killifish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "aged individuals had lower expression of proteins involved in cellular proliferation, ‘DNA repair’, ‘cellular detoxification from toxic substances’ and ‘negative regulation of chemotaxis’"
      explanation: >-
        Supports treating this model as informative for declining genome maintenance,
        on a measured drop in repair-associated protein expression rather than on the
        study's framing.
  notes: >-
    Curated as part of a tranche adding turquoise killifish models across the
    hallmarks-of-aging modules. The same study underpins the killifish model on the
    inflammaging module; the two entries deliberately cite different findings from
    it rather than duplicating one claim.

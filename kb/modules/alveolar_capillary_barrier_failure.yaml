  downstream:
  - target: Trans-Barrier Injury Propagation and Increased Permeability
    causal_link_type: DIRECT
    description: >-
      Loss of junctional integrity is what makes the barrier permeable, and the
      shared basement membrane is what allows the loss to spread from the
      injured layer to the uninjured one.
    evidence:
    - reference: PMID:41442163
      reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In contrast, endothelial junction disruption emerged at 72 h, supporting secondary endothelial
        dysfunction following epithelial oxidative injury.
      explanation: The delayed endothelial junctional loss after an exclusively epithelial exposure is direct
        evidence that junctional disruption propagates across the barrier.
  evidence:
  - reference: PMID:41477823
    reference_title: Autologous human iPSC-derived alveolus-on-chip reveals early pathological events of Mycobacterium
      tuberculosis infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, we observed areas of cell death aggregation and Mtb replication that progressed to a
      severe disruption of both the epithelial and endothelial barrier.
    explanation: Shows a pathogen insult converging on simultaneous epithelial and endothelial barrier
      disruption, supporting this as the shared central step.
  - reference: PMID:42204607
    reference_title: Evaluation of 2-methyl-4-isothiazolin-3-one-induced human pulmonary toxicity using integrated
      air-liquid-interface and a lung-on-chip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using this approach, significant barrier disruption and cytotoxicity were observed when MIT was
      introduced into the alveolar lung-on-chip.
    explanation: A chemically distinct insult reaching the same barrier-disruption endpoint, supporting the
      node's disorder-agnostic character.

- name: Trans-Barrier Injury Propagation and Increased Permeability
  description: >-
    Permeability of the blood-gas barrier rises, and injury crosses it. Exposure
    confined to the alveolar epithelial surface produces measurable injury in the
    capillary endothelium that was never directly exposed, and the reverse
    coupling holds for insults delivered to the vascular side. Propagation is
    mediated by soluble mediators, oxidative signaling, and adhesion-molecule
    shedding acting over short distances across the fused basement membrane
    rather than by direct contact of the agent with the second layer. The
    functional consequence is a barrier that passes protein and fluid.
  role: effector
  biological_scale: TISSUE
  locations:
  - preferred_term: Alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:

name: Alveolar-Capillary Barrier Failure Module
description: >-
  A conserved pulmonary pathophysiology module representing the final common
  pathway by which chemically, infectiously, mechanically, and hypoxically
  initiated lung injuries all converge on failure of the blood-gas barrier. The
  alveolar-capillary barrier is a two-cell-layer structure — a squamous type 1 /
  cuboidal type 2 alveolar epithelium and an apposed pulmonary capillary
  endothelium sharing a fused basement membrane — whose selectivity depends on
  intact tight and adherens junctions on both sides. An interface insult
  (inhaled toxicant or particulate, alveolar pathogen, alveolar hypoxia,
  ischemia-reperfusion) initiates oxidative and inflammatory injury; cyclic
  breathing-associated strain amplifies it; junctional complexes are lost on the
  epithelial and then the endothelial side; permeability rises and injury
  propagates across the barrier from the exposed layer to the unexposed one; and
  protein-rich fluid floods the interstitium and airspace, collapsing gas
  exchange. The distinguishing claim of this module, and the reason it is
  separable from the disease entries that use it, is that the two cell layers are
  not independently injured targets but a coupled unit: injury delivered to one
  side is transmitted to the other. Conforming disorder entries substitute their
  own insult at the trigger node while preserving the junctional-disruption
  chain. Key conformance target:
  `alveolar_capillary_barrier_failure#Alveolar Epithelial and Endothelial
  Junctional Disruption`.
category: Module
creation_date: "2026-08-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g.,
  "alveolar_capillary_barrier_failure#Alveolar Epithelial and Endothelial
  Junctional Disruption"). Disorder-specific substitutions at the trigger node:
  ARDS substitutes a direct pulmonary or indirect systemic insult; high-altitude
  pulmonary edema substitutes sustained alveolar hypoxia with HIF-1-alpha
  signaling; influenza and tuberculosis substitute alveolar pathogen replication
  and the ensuing immune response; COPD substitutes repeated whole cigarette
  smoke exposure; inhalational injury substitutes an oxidant gas or particulate;
  and lung transplantation substitutes cold-storage ischemia-reperfusion. The
  conserved central cell types are the pulmonary alveolar type 1 and type 2 cell
  and the pulmonary capillary endothelial cell.

  Much of the direct human evidence for the trans-barrier propagation step comes
  from microphysiological alveolus-on-chip systems rather than from patients,
  because separating the epithelial from the endothelial compartment while
  exposing only one of them is not achievable in vivo. That is a strength for
  establishing the coupling and a limitation for establishing its magnitude in
  human disease; conforming entries should keep the evidence_source distinction
  visible rather than presenting chip results as clinical observations.

  This module is deliberately narrower than `epithelial_barrier_dysfunction`,
  which models the allergic / type-2 "epithelial barrier hypothesis" across skin,
  airway, gut, and esophagus and terminates in IgE sensitization and the atopic
  march. That module is about allergen penetration driving sensitization; this
  one is about blood-gas barrier mechanics driving edema and gas-exchange
  failure. A disorder may legitimately conform to both.
pathophysiology:
- name: Alveolar-Capillary Interface Insult
  description: >-
    An insult is delivered to the alveolar surface or to the capillary side of
    the blood-gas barrier. The initiating agents are heterogeneous — oxidant
    gases, airborne particulates, whole cigarette smoke, replicating pathogens,
    sustained alveolar hypoxia, and cold-storage ischemia-reperfusion — but each
    converges on oxidative stress and innate inflammatory signaling at the
    interface. This node is the disorder-specific entry point; conforming
    entries substitute their own agent here and inherit the chain below.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: Alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:
  - preferred_term: Pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  - preferred_term: Pulmonary capillary endothelial cell
    term:
      id: CL:4028001
      label: pulmonary capillary endothelial cell
  biological_processes:
  - preferred_term: Cellular response to reactive oxygen species
    term:
      id: GO:0034614
      label: cellular response to reactive oxygen species
    modifier: INCREASED
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Alveolar Epithelial and Endothelial Junctional Disruption
    causal_link_type: DIRECT
    description: >-
      Oxidative and inflammatory injury at the exposed surface directly
      destabilizes the junctional complexes that give the barrier its
      selectivity.
    evidence:
    - reference: PMID:41442163
      reference_title: A human airway-on-a-chip microphysiological system for modeling chlorine gas toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Epithelial barrier disruption, characterized by gap formation, was evident immediately post-Cl2
        exposure and persisted through 24 h
      explanation: Shows a defined oxidant-gas exposure producing immediate junctional gap formation in the
        exposed epithelial layer.
  - target: Cyclic Mechanical Strain Amplification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      An injured barrier is subjected to the same continuous breathing-associated
      deformation as a healthy one, so the insult is delivered into a
      mechanically loaded tissue rather than a static one.
    evidence:
    - reference: PMID:41252215
      reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
        model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Notably, increased cellular stretch intensified Pseudomonas infection, leading to greater barrier
        disruption and bacterial translocation
      explanation: Establishes that the level of mechanical strain modifies the severity of an infectious
        insult at the alveolar barrier.
  evidence:
  - reference: PMID:42546767
    reference_title: Degradable porous PLGA/PCL membrane enable a lung alveoli-on-a-chip for modeling particulate-induced
      alveolar injury.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Apical exposure to DPM induced dose-dependent cytotoxicity, increased barrier permeability, elevated
      reactive oxygen species, and DNA damage in both epithelial and endothelial layers, demonstrating trans-barrier
      propagation of particulate-induced injury.
    explanation: Supports a particulate insult at the alveolar surface producing oxidative injury and barrier
      compromise as the initiating step.

- name: Cyclic Mechanical Strain Amplification
  description: >-
    Breathing subjects the alveolar wall to continuous cyclic deformation. Within
    the physiological range this strain maintains barrier and surfactant
    function, but supraphysiological strain — from mechanical ventilation,
    hyperinflation, or vigorous spontaneous effort — amplifies an established
    insult rather than initiating one on its own. Strain increases apparent
    permeability, potentiates pathogen translocation, and augments profibrotic
    signaling in the injured alveolar wall. This node is a modifier of severity
    and is why the same insult produces different barrier outcomes in a
    spontaneously breathing and a mechanically ventilated lung.
  role: amplifier
  biological_scale: TISSUE
  locations:
  - preferred_term: Alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  cell_types:

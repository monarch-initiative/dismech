      label: leukocyte migration
    modifier: INCREASED
  downstream:
  - target: Protein-Rich Alveolar Flooding and Gas-Exchange Failure
    causal_link_type: DIRECT
    description: >-
      Once the barrier passes protein, oncotic restraint on fluid movement is
      lost and the interstitial and alveolar compartments flood.
    evidence:
    - reference: PMID:39866839
      reference_title: "Acute respiratory distress syndrome (ARDS): from mechanistic insights to therapeutic
        strategies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: During ARDS, fluid and protein pass through the alveolar epithelium due to increased permeability,
        leading to pulmonary interstitial edema.
      explanation: Ties the permeability step to protein-rich edema formation in the human disease this module
        abstracts from.
  evidence:
  - reference: PMID:42473541
    reference_title: Modelling cigarette smoke-induced lung vascular dysfunction using an alveolus-on-chip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This enabled us to establish that repeated WCS exposure of the AEC2 monolayer leads to complete
      disintegration of the vascularized endothelial networks, a process likely mediated by AEC2 cells as vascular
      networks remained intact in response to WCS in absence of AEC2.
    explanation: The AEC2-dependence controls for direct smoke contact and is the strongest available evidence
      that epithelial injury is transmitted to the endothelium; the authors' own hedge on mediation is preserved.
  - reference: PMID:42083145
    reference_title: "Alveolus-on-a-chip: A Novel Tool for Modeling Lung Transplant Cold Storage Ischemia/Reperfusion
      Injury."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In alveolar lavage, soluble intercellular adhesion molecule (ICAM)-1, activated leukocyte cell
      adhesion molecule (ALCAM), and epithelial cell adhesion molecule (EpCAM) were significantly increased after
      CS-IRI
    explanation: Documents compartment-specific adhesion-molecule shedding as a mediator available to carry
      injury signals across the barrier.

- name: Protein-Rich Alveolar Flooding and Gas-Exchange Failure
  description: >-
    Protein-rich fluid accumulates in the interstitium and airspace. Flooded and
    collapsed alveoli continue to be perfused but no longer ventilated, producing
    shunt physiology, hypoxemia, and reduced compliance. Surfactant is diluted and
    inactivated by the exuded protein, lowering the surface-tension threshold for
    further collapse and closing a positive-feedback loop back onto the barrier.
    Whether the process resolves through epithelial repair and active fluid
    clearance or progresses to fibroproliferative remodeling is determined
    downstream and is disorder-specific.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  - preferred_term: Lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: Respiratory gaseous exchange by respiratory system
    term:
      id: GO:0007585
      label: respiratory gaseous exchange by respiratory system
    modifier: DECREASED
  evidence:
  - reference: PMID:41786071
    reference_title: Perfluorocarbon ameliorates high-altitude pulmonary edema and blood-gas barrier dysfunction
      in a canine model and a lung-on-chip model by suppressing the HIF-1α/HO-1 pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: As expected, hypoxia caused an increase in lung water content, lung injury scores, and inflammatory
      cytokine release, as well as a decrease in blood-gas barrier-related proteins.
    explanation: Couples loss of blood-gas barrier proteins to measured lung water accumulation in the canine
      high-altitude model, linking the barrier lesion to the flooding endpoint.
  - reference: PMID:42083145
    reference_title: "Alveolus-on-a-chip: A Novel Tool for Modeling Lung Transplant Cold Storage Ischemia/Reperfusion
      Injury."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our findings show that this model reliably recapitulates key elements of IRI pathophysiology observed
      in the clinical scenario, including edema formation, barrier dysfunction, cytokine release, soluble adhesion
      molecule expression, and transcriptional reprogramming.
    explanation: Reports edema formation and barrier dysfunction together as the recapitulated endpoint,
      supporting flooding as the terminal consequence of the chain.

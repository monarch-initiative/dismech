      label: pulmonary alveolar type 1 cell
  - preferred_term: Pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: Cell-cell junction organization
    term:
      id: GO:0045216
      label: cell-cell junction organization
    modifier: DECREASED
  downstream:
  - target: Alveolar Epithelial and Endothelial Junctional Disruption
    causal_link_type: DIRECT
    description: >-
      Supraphysiological cyclic deformation of an already injured alveolar wall
      accelerates junctional loss and raises measured barrier permeability.
    evidence:
    - reference: PMID:41252215
      reference_title: Mechanical strain exacerbates Pseudomonas infection in an organoid-based pneumonia-on-a-chip
        model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Yet, Papp was slightly increased in 10% stretched ODAECs, suggesting barrier impairment by hyperphysiological
        stretch.
      explanation: Directly links hyperphysiological strain to increased apparent permeability of the alveolar
        barrier; the authors' own hedge is preserved.
  evidence:
  - reference: PMID:41406599
    reference_title: Microengineered alveolar array lung-on-chip with hydrogel membrane and simulated breathing
      mechanics for anti-fibrotic testing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We demonstrate that cyclic stretching significantly amplifies fibrotic signaling in the presence
      of transforming growth factor-beta 1 (TGF-β1), evidenced by increased expression of extracellular matrix
      (ECM) components such as collagen I, collagen III, and fibronectin.
    explanation: Supports cyclic strain acting as an amplifier of an existing injury signal rather than an
      independent trigger, since amplification is reported in the presence of TGF-beta 1.

- name: Alveolar Epithelial and Endothelial Junctional Disruption
  description: >-
    Tight and adherens junction complexes are lost on both faces of the barrier —
    ZO-1 and occludin between alveolar epithelial cells, VE-cadherin and PECAM-1
    between capillary endothelial cells — with visible intercellular gap
    formation, falling transepithelial electrical resistance, and shedding of
    soluble adhesion molecules into the alveolar and vascular compartments. This
    is the rate-limiting, disorder-agnostic step: whatever the initiating insult,
    the barrier fails here, and this is the node conforming disorder entries
    should target.
  role: central_effector
  biological_scale: CELLULAR
  locations:
  - preferred_term: Alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung

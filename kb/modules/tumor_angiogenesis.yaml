name: Tumor Angiogenesis Module
description: >-
  A conserved mechanism module for the fifth hallmark of cancer (Hanahan &
  Weinberg): the induction of angiogenesis. Tumors larger than ~1-2 mm
  outgrow the diffusion limit for oxygen and nutrients and must recruit new
  blood vessels to survive and grow. The conserved causal chain runs from
  intratumoral hypoxia and oncogenic signaling that stabilize
  hypoxia-inducible factor (HIF), through an "angiogenic switch" in which the balance
  of pro- and anti-angiogenic factors tips toward pro-angiogenic signals -
  chiefly VEGF-A acting on endothelial VEGFR2, with contributions from FGF,
  PDGF, and angiopoietins - to endothelial proliferation and sprouting that
  produce a structurally abnormal, leaky, tortuous tumor vasculature. This
  neovasculature sustains tumor growth and provides a route for metastatic
  dissemination, and is the target of anti-angiogenic therapy (anti-VEGF
  antibodies, VEGFR tyrosine kinase inhibitors). The chain now carries what
  that therapy actually achieves, which is a transitory benefit followed by
  regrowth, and why: resistance here is not mutation of the drug's target but
  a re-routing around a target that stays inhibited - alternative
  pro-angiogenic ligands, recruited pro-angiogenic cells, pericyte coverage
  that removes the VEGF dependence, or invasion along existing vasculature
  that dispenses with neovascularisation. A separate population is indifferent
  from the outset. Individual disorder entries
  declare conformance via conforms_to, substituting tumor-type-specific
  drivers (e.g., VHL loss constitutively stabilizing HIF in clear cell renal
  cell carcinoma; VEGF-driven angiogenesis in glioblastoma). The
  anti-angiogenic drug-mechanism view can be captured with target_mechanisms
  on conforming treatments.
category: Module
module_categories:
- ONCOLOGY
creation_date: "2026-06-27T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries
  reference individual nodes via conforms_to (e.g.,
  "tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization").
  The module defines the expected pathophysiology structure; conforming nodes
  in disorder files should include the corresponding cell types, biological
  processes, and causal edges, specialized to their tumor context. Key
  tumor-specific substitutions: clear cell renal cell carcinoma uses VHL loss
  that constitutively stabilizes HIF-2alpha and drives VEGF independent of
  hypoxia; glioblastoma and colorectal cancer use VEGF-A-driven angiogenesis
  treated with bevacizumab/VEGFR TKIs. Key conformance / treatment target:
  "tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization".
  A conforming entry's anti-angiogenic agent should also reach
  "tumor_angiogenesis#VEGF Pathway Blockade and Evasive Resistance", and
  should record a treatment failure as which route replaced the blocked one
  rather than as loss of the hallmark; the invasion route is where this module
  meets invasion_and_metastasis.
pathophysiology:
- name: Intratumoral Hypoxia and HIF Stabilization
  description: >-
    As a tumor expands beyond the oxygen diffusion limit, regions become
    hypoxic. Hypoxia (and, in some tumors, oncogenic signaling or loss of
    the VHL E3 ubiquitin ligase) stabilizes hypoxia-inducible factor (HIF-1
    and HIF-2), a transcription factor that activates a pro-angiogenic gene
    program including VEGFA. This establishes the demand signal for new
    vasculature.
  role: trigger
  biological_processes:
  - preferred_term: Response to Hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  evidence:
  - reference: PMID:11191064
    reference_title: "HIF-1: using two hands to flip the angiogenic switch."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "First, decreased intratumoral O2 concentrations provide a physiological stimulus."
    explanation: "Intratumoral hypoxia as the trigger for HIF-1alpha accumulation."
  - reference: PMID:11191064
    reference_title: "HIF-1: using two hands to flip the angiogenic switch."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Second, genetic alterations that activate oncogene products or inactivate tumor suppressor gene products increase HIF- 1alpha expression and/or HIF-1 transcriptional activity independent of the O2 concentration."
    explanation: "The oncogenic, oxygen-independent route to HIF stabilization that the node also names."
  downstream:
  - target: Angiogenic Switch and VEGF-Driven Neovascularization
    description: >-
      HIF-driven VEGF expression tips the angiogenic balance toward new
      vessel formation.

- name: Angiogenic Switch and VEGF-Driven Neovascularization
  description: >-
    The angiogenic switch is thrown when pro-angiogenic factors (VEGF-A,
    FGF2, PDGF, angiopoietin-2) outweigh endogenous inhibitors
    (thrombospondin-1, angiostatin). Secreted VEGF-A binds VEGFR2 on
    quiescent endothelial cells, triggering their proliferation, migration,
    and sprouting from existing vessels (and recruitment of endothelial
    progenitors). This is the conserved central node and the target of
    anti-angiogenic therapy.
  role: central_effector
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Positive Regulation of Angiogenesis
    term:
      id: GO:0045766
      label: positive regulation of angiogenesis
    modifier: INCREASED
  - preferred_term: VEGF Receptor Signaling Pathway
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:16355214
    reference_title: "Angiogenesis as a therapeutic target."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inhibiting angiogenesis is a promising strategy for treatment of
      cancer and several other disorders, including age-related macular
      degeneration.
    explanation: >-
      Establishes tumor angiogenesis as a validated therapeutic target,
      supporting the VEGF-driven angiogenic switch as the central effector
      of this module. Evidence source is OTHER because this is a review
      article.
  - reference: PMID:21376230
    reference_title: "Hallmarks of cancer: the next generation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include sustaining proliferative signaling, evading growth
      suppressors, resisting cell death, enabling replicative immortality,
      inducing angiogenesis, and activating invasion and metastasis.
    explanation: >-
      Hanahan & Weinberg list inducing angiogenesis as a core hallmark
      capability modeled here. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: Abnormal Tumor Vasculature Sustaining Growth
  - target: VEGF Pathway Blockade and Evasive Resistance
    description: >-
      A tumour dependent on one pro-angiogenic ligand is targetable at that
      ligand, and the dependence turns out to be re-routable rather than
      absolute.

- name: Abnormal Tumor Vasculature Sustaining Growth
  description: >-
    Sustained, unbalanced pro-angiogenic signaling produces a chaotic,
    structurally abnormal vasculature: vessels are tortuous, dilated, leaky,
    and irregularly perfused, with an incomplete pericyte coat and basement
    membrane. This neovasculature supplies oxygen and nutrients that sustain
    tumor growth, yet its abnormal architecture creates regions of persistent
    hypoxia and elevated interstitial pressure, and the leaky walls provide
    a portal for tumor-cell intravasation and metastatic spread.
  role: consequence
  biological_processes:
  - preferred_term: Angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: INCREASED
  evidence:
  - reference: PMID:15637262
    reference_title: "Normalization of tumor vasculature: an emerging concept in antiangiogenic therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Solid tumors require blood vessels for growth, and many new cancer therapies are directed against the tumor vasculature."
    explanation: "The dependence of tumor growth on its vasculature."
  - reference: PMID:15637262
    reference_title: "Normalization of tumor vasculature: an emerging concept in antiangiogenic therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'certain antiangiogenic agents can also transiently "normalize" the abnormal structure and function of tumor vasculature to make it more efficient for oxygen and drug delivery'
    explanation: "Records that tumor vasculature is structurally and functionally abnormal, which is the state this node describes."

- name: VEGF Pathway Blockade and Evasive Resistance
  description: >-
    The angiogenic switch is druggable and the module says so in prose; what
    it does not say is how the drugs behave, which is the part that matters
    for a conforming entry. Bevacizumab, sorafenib and sunitinib do produce
    survival benefit in several aggressive tumours, and the benefit is
    transitory: tumour stasis or shrinkage for a period typically measured in
    months, then regrowth and progression. That outcome sits oddly with
    angiogenesis being an essential capability, and the resolution is that
    resistance here is unlike resistance to a targeted kinase inhibitor.
    It is not acquired by mutating the drug's target. The target stays
    inhibited and the tumour finds another way to be perfused - upregulating
    alternative pro-angiogenic ligands, recruiting bone-marrow-derived
    pro-angiogenic cells, increasing pericyte coverage so the vessels no
    longer need VEGF to survive, or invading along existing normal vasculature
    and dispensing with neovascularisation altogether, which is where this
    module meets invasion_and_metastasis. A separate population is indifferent
    from the outset rather than adapting. So a conforming entry should record
    its anti-angiogenic agent against this node and record a failure as which
    route replaced the blocked one, not as loss of the hallmark.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: INCREASED
  - preferred_term: Vascular endothelial growth factor receptor signaling pathway
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:18650835
    reference_title: "Modes of resistance to anti-angiogenic therapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, in both preclinical and clinical settings, the benefits are at
      best transitory and are followed by a restoration of tumour growth and
      progression.
    explanation: >-
      States the outcome this node exists to record, which the module's prose
      mention of anti-angiogenic therapy left out. Graded OTHER as the source
      is a review.
  - reference: PMID:18650835
    reference_title: "Modes of resistance to anti-angiogenic therapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Emerging data support a proposition that two modes of unconventional
      resistance underlie such results: evasive resistance, an adaptation to
      circumvent the specific angiogenic blockade; and intrinsic or
      pre-existing indifference.
    explanation: >-
      Supplies the two-mode structure of this node and the distinction between
      a tumour that adapts and one that never responded.
  - reference: PMID:18650835
    reference_title: "Modes of resistance to anti-angiogenic therapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      evasive resistance is largely indirect: alternative ways to sustain
      tumour growth are activated but the specific therapeutic target of the
      anti-angiogenic drug remains inhibited
    explanation: >-
      The claim that makes this node different from the resistance nodes in the
      sibling hallmark modules: the drug keeps working on its target, so the
      failure is a re-routing rather than a loss of inhibition.
  - reference: PMID:18650835
    reference_title: "Modes of resistance to anti-angiogenic therapy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rather, the introduction of anti-angiogenic therapy results in transitory
      improvements, in the form of tumour stasis or shrinkage and in some cases
      increased survival.
    explanation: >-
      Characterises the size and shape of the benefit, which is what a
      conforming entry's treatment description should match rather than
      implying durable control.

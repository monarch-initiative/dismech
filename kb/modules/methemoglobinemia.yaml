notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a generic
  "Methemoglobinemia" Disease entry — methemoglobinemia as a label is a
  measurement of the blood, and the diseases that produce it are curated
  separately. Disorder entries reference individual nodes via conforms_to, for
  example "methemoglobinemia#Methemoglobin Accumulation in the Erythrocyte".
  Scope. The module opens at the oxidation of heme iron that is already
  assembled into circulating hemoglobin and stops at the organism-level
  shortfall in tissue oxygen delivery. What raised the oxidation rate or removed
  the reduction capacity belongs to the conforming entry, as does any feature
  that is not downstream of the methemoglobin itself. The four conformers and
  the arm each uses. Hereditary_Methemoglobinemia loses the reduction arm
  (biallelic CYB5R3, or CYB5A removing the reductase cofactor), and its type II
  neurological involvement is pan-tissue CYB5R3 loss, not a consequence of the
  methemoglobin, so it does not belong to this module.
  Drug-Induced_Methemoglobinemia keeps an intact reductase and outruns it, by
  direct oxidation, by co-oxidation, or by biotransformation of a protoxin to an
  oxidizing intermediate; its haemolytic anemia is drawn from the exposure
  rather than from the methemoglobin on purpose, and that edge should not be
  rerouted through this module. Hemoglobin_M_Disease, which is curated as the
  beta type, substitutes a heme-contact residue of beta-globin (HBB) so that
  ferric iron is structurally stabilized and resists both the physiological
  reductase and methylene blue, which is why the antidote pattern on this
  module is the one thing an Hb M conformer must not inherit; the alpha-globin
  M hemoglobins (Hb M-Boston, Hb M-Iwate) carry the same lesion in HBA and are
  not yet curated as entries. Cyanosis_Transient_Neonatal carries the same lesion in fetal
  gamma-globin (HBG2) and is self-limiting as gamma gives way to beta; only its
  M-hemoglobin arm belongs here, since its low-oxygen-affinity variants (Hb
  F-Toms River, Hb F-SickKids) impair oxygen uptake without oxidizing the iron
  and reach cyanosis by a different route. Not an Xogenesis module: no
  pathological material anatomical entity is formed, so there is no OGMS/MPATH
  anchor stanza. Ontology bindings. Module nodes bind GO and CL terms only, per
  the create-module convention; methemoglobin, heme and the oxidant chemicals
  are described in prose rather than bound to CHEBI, and only the treatments
  carry chemical identifiers on their therapeutic_agent. The oxidation node is
  bound to GO:0006788 heme oxidation with modifier INCREASED as the nearest
  available class for the Fe2+ to Fe3+ transition of hemoglobin iron; GO has no
  class for hemoglobin autoxidation specifically, and GO:0006788 is more often
  used of heme oxygenase-mediated degradation, which is a different reaction
  from the one modelled here. The allosteric arm is bound to GO:0019825 oxygen
  binding with modifier INCREASED, which states the raised affinity of the
  remaining ferrous hemes rather than asserting a dissociation-curve term that
  does not exist in GO. The left shift is curated as its own node rather than
  folded into the accumulation node, because it is a separately evidenced claim
  and is the reason supplemental oxygen does not correct the cyanosis;
  Drug-Induced_Methemoglobinemia records this as an open discussion
  (darling_roughton_affinity_shift) because none of the four references that
  entry cites states the effect. Conformance content. Most of the links from
  the four conformers return process_absent and cell_type_absent from
  `just check-conformance-content`, and the cause is the conformers rather than
  the anchoring: a disorder entry is free to describe the methemoglobin pool
  with CHEBI:17423, as Hereditary_Methemoglobinemia does, where this module
  must use a GO molecular function instead, and several of the conforming nodes
  bind no term at all. The balance node therefore binds both arms of the
  equilibrium it names, GO:0006788 for the oxidation and GO:0004128 for the
  reduction, which is what it asserts and which is also where the overlap with
  the conformers is real.
pathophysiology:
- name: Oxidation of Ferrous Heme Iron to the Ferric State
  description: >-
    The single mechanistic claim of this node is that the iron atom of a heme
    group already assembled into circulating hemoglobin loses an electron and
    passes from the ferrous (Fe2+) to the ferric (Fe3+) state. This happens
    continuously and physiologically, because ferrous heme sits in a high
    oxygen environment and autoxidizes, and it happens faster when an oxidizing
    chemical is present, whether that chemical takes the electron directly, acts
    by co-oxidation through hemoglobin-bound oxygen, or must first be
    biotransformed to an oxidizing intermediate. The node holds the oxidation
    event alone. It does not assert that any methemoglobin accumulates, which
    depends on the balance curated in the next node, and it does not name the
    oxidant, which is the conforming entry's business.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  cellular_components:
  - preferred_term: hemoglobin complex
    term:
      id: GO:0005833
      label: hemoglobin complex
  biological_processes:
  - preferred_term: heme iron oxidation to the ferric state
    modifier: INCREASED
    term:
      id: GO:0006788
      label: heme oxidation
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ferrous iron of hemoglobin is exposed continuously to high
      concentrations of oxygen and, thereby, is oxidized slowly to methemoglobin,
      a protein unable to carry oxygen.
    explanation: >-
      States that the oxidation is continuous and physiological rather than an
      abnormal event, which is why this module opens with a standing process
      rather than with a lesion. Evidence source is OTHER because this is a
      review.
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Methaemoglobin is haemoglobin in which the sixth coordination position of
      heme iron is in the ferric state, having lost an unpaired electron.
    explanation: >-
      Defines methemoglobin at the level of the iron atom, which is the claim
      this node makes and the reason the node is bound at MOLECULAR scale.
      Evidence source is OTHER and quote_role BACKGROUND because the sentence is
      the case report's opening statement of established chemistry rather than
      its own measurement.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Firstly, direct oxidation of ferrohaemoglobin, which involves the transfer
      of electrons from ferrous haem to the oxidising compound.
    explanation: >-
      Gives the electron transfer that defines the oxidation when a xenobiotic
      drives it, establishing that the chemical route and the autoxidation route
      produce the same event at the iron. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Heme Iron Oxidation Exceeding Reductase Capacity
    causal_link_type: DIRECT
    description: >-
      The rate of oxidation is one of the two terms of the balance in the next
      node. On its own it produces no accumulation, because the reduction arm
      normally keeps pace with it.
- name: Heme Iron Oxidation Exceeding Reductase Capacity
  description: >-
    The amplifier, and the step where the three mechanistically distinct routes
    to this disease become one. Circulating methemoglobin is held near one
    percent by an equilibrium between the rate at which ferric heme forms and
    the rate at which the erythrocyte reduces it back, a reduction carried out
    mainly by NADH-cytochrome b5 reductase using cytochrome b5 as its electron
    carrier. The disease is that equilibrium losing. It can lose on the
    production side, when an oxidant raises formation past what an intact
    reductase can recover; on the reduction side, when the reductase or its
    cofactor is deficient; or because the ferric heme that forms is
    structurally resistant to reduction, so that the reduction arm is present
    but cannot act on its substrate. This node makes the balance claim and
    nothing more; which term of it moved is the conforming entry's
    substitution. The reductase activity is bound with modifier ABNORMAL rather
    than DECREASED because the module has to cover conformers in which the
    enzyme is intact and merely outpaced, and conformers in which it is intact
    but its substrate resists it, as well as the hereditary conformers in which
    the activity itself is reduced.
  role: amplifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: balance of heme oxidation against enzymatic reduction
    modifier: ABNORMAL
    term:
      id: GO:0006788
      label: heme oxidation
  molecular_functions:
  - preferred_term: NADH-cytochrome b5 reductase activity
    modifier: ABNORMAL
    term:
      id: GO:0004128
      label: cytochrome-b5 reductase activity, acting on NAD(P)H
  evidence:
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This stable level results from an equilibrium between the rate at which
      ferric heme is formed and the rate at which it is reduced back to the
      ferrous state.
    explanation: >-
      States the equilibrium in exactly the two terms this node is built on,
      which is what makes the balance, rather than either arm alone, the
      amplifier. Evidence source is OTHER because the sentence states
      established physiology in a case report rather than reporting a
      measurement.
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Under physiological conditions, methemoglobin reduction is accomplished
      mainly by red cell NADH-cytochrome b5 reductase (NADH-methemoglobin
      reductase) so efficiently that there is insignificant amounts of
      methemoglobin in the circulating blood.
    explanation: >-
      Names the enzyme that constitutes the reduction arm and states that its
      efficiency is the reason the baseline pool stays negligible, which is the
      capacity this node asserts can be exceeded. Evidence source is OTHER
      because this is a review.
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, should methemoglobin formation be increased--e.g., due to the
      presence of oxidant drugs, or an abnormal methemoglobin not amenable to
      reduction (hemoglobin M), or a deficiency in red cell cytochrome b5
      reductase--methemoglobinemia will result.
    explanation: >-
      The sentence that justifies this module existing: it names three
      mechanistically distinct ways the balance can be lost and states that all
      three end in the same place, which is the conformance structure the module
      encodes. Evidence source is OTHER because this is a review.
  downstream:
  - target: Methemoglobin Accumulation in the Erythrocyte
    causal_link_type: DIRECT
    description: >-
      Once formation outruns effective reduction, ferric heme stops being a
      transient species and becomes a standing pool. This is the step at which
      the three routes become indistinguishable.
- name: Methemoglobin Accumulation in the Erythrocyte
  description: >-
    The key conformance target: a standing pool of ferric methemoglobin inside
    the circulating red cell, at a fraction high enough to matter. This is the
    rate-limiting, disorder-agnostic hub of the module, the one step every
    conformer passes through whatever moved the balance, and the node a
    conforming entry should declare first. The single claim here is that the
    pool exists and that the hemes in it have lost the ability to bind oxygen
    reversibly. The node deliberately stops short of two things curated
    separately below: what the oxidized tetramer does to the oxygen affinity of
    its remaining ferrous hemes, and what the organism experiences. Most
    accumulation is clinically unimportant, which is why accumulation and
    illness are not the same node.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  cellular_components:
  - preferred_term: hemoglobin complex
    term:
      id: GO:0005833
      label: hemoglobin complex
  molecular_functions:
  - preferred_term: reversible oxygen carrier activity of hemoglobin
    modifier: DECREASED
    term:
      id: GO:0005344
      label: oxygen carrier activity
  evidence:
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A chronically elevated level of oxidized haemoglobin results.
      Methaemoglobin is incapable of binding oxygen.
    explanation: >-
      Gives both halves of this node in consecutive sentences: a standing
      elevated pool of oxidized hemoglobin, and the loss of oxygen binding that
      makes the pool consequential. Evidence source is HUMAN_CLINICAL because
      the chronically elevated pool is what the report documents in its patient,
      and the same value is used for this snippet in
      Hereditary_Methemoglobinemia.
  - reference: PMID:21954509
    reference_title: "Methemoglobinemia: a systematic review of the pathophysiology, detection, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methemoglobin is the oxidized form of hemoglobin which does not bind to
      oxygen efficiently.
    explanation: >-
      An independent statement of the same functional loss, which is what the
      oxygen carrier activity binding on this node asserts. Evidence source is
      OTHER because this is a systematic review.
  - reference: PMID:21954509
    reference_title: "Methemoglobinemia: a systematic review of the pathophysiology, detection, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An increased level of methemoglobin can be attributed to congenital
      enzymatic defects, alterations in the hemoglobin molecule, or as a result
      of medications and toxins.
    explanation: >-
      The conformance statement for this node: the three mechanistically
      distinct routes named here are the arms the four conformers of this module
      use, and all three are said to raise the same quantity, which is what
      makes this the key conformance target. Evidence source is OTHER because
      this is a systematic review.
  downstream:
  - target: Raised Oxygen Affinity of the Remaining Ferrous Hemes
    causal_link_type: DIRECT
    description: >-
      Oxidation of part of a tetramer acts allosterically on the subunits that
      remain ferrous, so the accumulated pool changes the behaviour of the
      functional hemoglobin as well as subtracting from it.
  - target: Impaired Tissue Oxygen Delivery and Functional Anemia
    causal_link_type: DIRECT
    description: >-
      The first and simpler arm of the delivery defect: ferric heme does not
      carry oxygen, so carrying capacity falls roughly in proportion to the
      fraction converted, with no loss of red cell mass.
- name: Raised Oxygen Affinity of the Remaining Ferrous Hemes
  description: >-
    The second, separately evidenced arm of the delivery defect, and the reason
    supplemental oxygen does not fix the cyanosis. Within a tetramer that has
    been partly oxidized, the oxygen affinity of the subunits still in the
    ferrous state is raised, an allosteric effect of the oxidized subunits on
    their neighbours that the secondary literature calls the Darling-Roughton
    effect. The sources cited here state the raised affinity and its
    consequence for tissue release; they do not resolve the structural basis,
    so this node asserts the affinity change and not a particular quaternary
    mechanism. The dissociation curve shifts to the left, so the oxygen
    that is still carried is surrendered less readily at the tissue. The
    patient therefore loses delivery twice over, once by subtraction of
    functional hemes and once by impaired unloading of the hemes that remain,
    and the shortfall is worse than the methemoglobin fraction alone would
    predict. This is curated as its own node, and not folded into the
    accumulation node, because it is a distinct claim about allostery with its
    own evidence, and because it carries the therapeutic implication the
    accumulation node does not.
  role: effector
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: hemoglobin complex
    term:
      id: GO:0005833
      label: hemoglobin complex
  molecular_functions:
  - preferred_term: oxygen affinity of the residual ferrous hemes
    modifier: INCREASED
    term:
      id: GO:0019825
      label: oxygen binding
  evidence:
  - reference: PMID:16634439
    reference_title: "[Effect of nitrite-induced methemoglobinemia on the kinetics of blood deoxygenation]."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The nitrite-induced deceleration of oxyhemoglobin deoxygenation was due to
      the inactivation of a fraction of hemoglobin as well as to the increased
      hemoglobin oxygen affinity and possible changes in the oxygen permeability
      of erythrocyte membranes during acute methemoglobinemia.
    explanation: >-
      The strongest evidence on this node, and the only measurement among its
      sources: polarographic kinetics of blood deoxygenation in nitrite-treated
      Wistar rats separate the two arms explicitly, attributing slowed oxygen
      release both to loss of a functional hemoglobin fraction and to raised
      oxygen affinity of what remains. Evidence source is MODEL_ORGANISM because
      the methemoglobinemia was induced in rats, and directness is INDIRECT for
      the same reason: the measurement is in rat blood, so applying it to the
      human tetramer takes the inference that hemoglobin allostery is conserved.
  - reference: PMID:36412668
    reference_title: "A Case of Severe Hypoxia Caused by Phenazopyridine-Induced Methemoglobinemia: A near Fatal Event from Over-the-Counter Medication Use."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      which increases oxygen affinity and impairs oxygen release to the tissue
      causing hypoxia
    explanation: >-
      Ties the ferrous to ferric oxidation directly to raised oxygen affinity and
      impaired tissue release, which is the causal statement this node and its
      downstream edge make. Evidence source is OTHER with quote_role BACKGROUND
      because the sentence is the case report's framing of established
      biochemistry, not its own result.
  - reference: PMID:30788079
    reference_title: "'Acute leukemia in congenital methehemoglobinemia - an enigma to explore'."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Congenital methemoglobinemia is a rare disease, resulting in increased
      oxygen affinity and impaired oxygen delivery to the tissues.
    explanation: >-
      An independent statement of the same two-step claim, and one made of the
      congenital rather than the acquired forms, which is what establishes the
      affinity shift as a property of the methemoglobin itself rather than of any
      one route to it. Evidence source is OTHER with quote_role BACKGROUND
      because the sentence is the case report's framing of established
      biochemistry.
  - reference: PMID:33274100
    reference_title: Altered Mental Status and Cyanosis in a Pediatric Patient with Methemoglobinemia.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Methemoglobinemia results from increased amounts of oxidized hemoglobin in
      the blood with an ensuing change in oxygen dissociation curve and lack of
      oxygen delivery to tissue.
    explanation: >-
      Names the oxygen dissociation curve explicitly as the thing the oxidized
      hemoglobin changes, which is the allosteric claim of this node stated at the
      level of the curve rather than the molecule. Evidence source is OTHER with
      quote_role BACKGROUND because the sentence is the case report's framing of
      established physiology.
  downstream:
  - target: Impaired Tissue Oxygen Delivery and Functional Anemia
    causal_link_type: DIRECT
    description: >-
      The left shifted curve means the oxygen that is still bound is released
      less readily at the tissue, so unloading fails on top of the loss of
      carrying capacity. This is the arm that explains why raising the inspired
      oxygen does not correct the picture.
- name: Impaired Tissue Oxygen Delivery and Functional Anemia
  description: >-
    The organism-level consequence, and the clinical signature of the whole
    chain. Oxygen reaches the lung and dissolves in plasma normally, so the
    arterial oxygen tension is normal; what fails is the carriage and release of
    that oxygen by hemoglobin. The result is a functional anemia, in which the
    red cell mass is intact and it is the oxygen carrying function of the
    hemoglobin inside it that is lost. Clinically this presents as cyanosis with
    chocolate brown blood, a pulse oximetry saturation gap, and hypoxia that
    does not respond to supplemental oxygen, which is the finding that separates
    this chain from cardiac and pulmonary causes of cyanosis. Severity scales
    with the methemoglobin fraction, but the threshold at which a given fraction
    becomes symptomatic depends on whatever oxygen transport reserve the patient
    had to begin with.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: oxygen transport
    modifier: DECREASED
    term:
      id: GO:0015671
      label: oxygen transport
  evidence:
  - reference: PMID:38707259
    reference_title: Refractory hypoxia and saturation gap in a COVID-19 patient.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Acquired methemoglobinemia, predominantly due to oxidizing medications
      occurs when heme iron in hemoglobin is oxidized from ferrous to ferric ion
      and binds oxygen irreversibly leading to functional anemia, cyanosis, and
      tissue hypoxia.
    explanation: >-
      The sentence that names this node: it runs the whole module chain from the
      ferrous to ferric oxidation through to functional anemia, cyanosis and
      tissue hypoxia, which is the term this node uses for an anemia with an
      intact red cell mass. Evidence source is OTHER with quote_role BACKGROUND
      because the sentence is the case report's framing of established
      physiology rather than its own measurement.
  - reference: PMID:21954509
    reference_title: "Methemoglobinemia: a systematic review of the pathophysiology, detection, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main clinical characteristic of the disease include cyanosis which is
      unresponsive to oxygen therapy and blood that is chocolate color when
      drawn.
    explanation: >-
      Establishes the clinical signature this node rests on, and in particular
      that the cyanosis is unresponsive to oxygen therapy, which is the
      observation the raised affinity node upstream explains. Evidence source is
      OTHER because this is a systematic review.
  - reference: PMID:3752898
    reference_title: Congenital enzymopenic methaemoglobinaemia.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A concentration exceeding 1.5 g/d1 gives rise to cyanosis.
    explanation: >-
      Gives the blood methemoglobin concentration above which cyanosis appears,
      which is the quantitative threshold this consequence node turns on. The
      unit is rendered g/d1 in the cached text, an optical character recognition
      artefact for g/dL, and the snippet is quoted as cached. Evidence source is
      HUMAN_CLINICAL with quote_role BACKGROUND because the threshold is stated
      as established clinical fact in a case report.
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the presence of comorbid conditions that impair oxygen transport,
      however, low-grade methemoglobinemia can become symptomatic and may
      warrant treatment.
    explanation: >-
      States that the oxygen transport reserve the patient brings sets the
      threshold at which a given methemoglobin fraction becomes illness, which
      is why this node describes severity as scaling with the fraction rather
      than being determined by it. Evidence source is OTHER because this is a
      review.
treatments:
- name: Methylene Blue
  description: >-
    The antidote, and the drug-target pattern this module carries. Methylene
    blue is reduced inside the red cell at the expense of NADPH, by NADPH
    methemoglobin reductase, and the resulting leucomethylene blue hands that
    reducing power to ferric heme non-enzymatically. It therefore does not
    repair whichever term of the balance the disease broke; it adds a second,
    NADPH dependent reduction arm alongside the physiological NADH one, and
    accelerates clearance of the accumulated pool by roughly six fold. Two
    consequences follow from that mechanism and both are curated here rather
    than described loosely. First, the antidote depends on a cofactor the
    patient may not be able to regenerate, so it is less effective or
    ineffective in glucose-6-phosphate dehydrogenase deficiency, and at high
    dose in the presence of haemolysis the same oxidizing chemistry can generate
    methemoglobin instead of clearing it. Second, it acts on the pool and not on
    the oxidant, so it does not stop ongoing formation while an exposure
    continues. A conforming entry whose ferric heme is structurally stabilized,
    as in the M hemoglobins, should record that this pattern does not transfer.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylene blue
      term:
        id: CHEBI:6872
        label: methylene blue
  target_mechanisms:
  - target: Heme Iron Oxidation Exceeding Reductase Capacity
    treatment_effect: ACTIVATES
    description: >-
      Supplies an additional, NADPH dependent route for reducing ferric heme, so
      the reduction arm of the balance is strengthened rather than the oxidation
      arm being blocked. This is why the antidote works whichever term of the
      balance the underlying disease moved, and why it fails when NADPH cannot
      be regenerated.
  - target: Methemoglobin Accumulation in the Erythrocyte
    treatment_effect: INHIBITS
    description: >-
      Accelerates conversion of the accumulated ferric heme back to the ferrous
      state, draining the pool that is the key conformance target of this
      module. It acts on the pool rather than on the oxidant, so formation
      continues while an exposure does.
    evidence:
    - reference: PMID:14579544
      reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        clinical experience suggests that methylene blue can increase the rate of
        methaemoglobin conversion to haemoglobin some 6-fold
      explanation: >-
        Gives the magnitude of the effect on the accumulated pool. The source's
        own hedge is worth preserving: this is clinical experience, and the same
        review states that no controlled trial of efficacy has been performed.
        Evidence source is OTHER because this is a review.
  evidence:
  - reference: PMID:34463662
    reference_title: "Methylene Blue: An Antidote for Methemoglobinemia and Beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methylene blue has been in medicinal use for centuries and is best known as
      an antidotal treatment for acquired methemoglobinemia (MetHB).
    explanation: >-
      Establishes the antidotal indication that this treatment block records.
      Evidence source is OTHER because this is a review.
  - reference: PMID:34463662
    reference_title: "Methylene Blue: An Antidote for Methemoglobinemia and Beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methylene blue's mechanism of action is somewhat complex and based partly
      on its oxidizing capabilities, ironically the same mechanism that causes
      MetHB.
    explanation: >-
      Supports the point that antidote and poison share chemistry, which is what
      makes the high dose reversal described above possible. Evidence source is
      OTHER because this is a review.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with features and/or methaemoglobin concentrations of 30-50%,
      should be administered methylene blue 1-2 mg/kg/bodyweight intravenously
    explanation: >-
      Gives the treatment threshold and dose, which is the clinical form the
      drug-target pattern takes. Evidence source is OTHER because this is a
      review.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Methylene blue is less effective or ineffective in the presence of
      glucose-6-phosphate dehydrogenase deficiency since its antidotal action is
      dependent on nicotinamide-adenine dinucleotide phosphate (NADP+).
    explanation: >-
      Curated as REFUTE against the proposition that this treatment works in a
      glucose-6-phosphate dehydrogenase deficient patient, with the cofactor
      dependence given as the reason. Evidence source is OTHER because this is a
      review.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in the presence of haemolysis, high dose methylene blue (20-30 mg/kg) can
      itself initiate methaemoglobin formation
    explanation: >-
      Establishes the dose dependent reversal, which is why the failure in
      glucose-6-phosphate dehydrogenase deficiency is a hazard rather than
      merely an absence of benefit. Evidence source is OTHER because this is a
      review.
  notes: >-
    Two caveats a conforming entry must carry rather than inherit silently. The
    glucose-6-phosphate dehydrogenase caveat is a property of the antidote's
    NADPH dependence, not of any node in this module, and the cited source
    states the dependence as one on NADP+ without tracing it to the pentose
    phosphate pathway, so the module does not assert that step either. The M
    hemoglobin caveat is mechanistic: where the ferric state is held by a
    globin substitution rather than by a redox imbalance, methylene blue does
    not resolve the cyanosis, and Hemoglobin_M_Disease curates that resistance
    on its own node.
- name: Ascorbic Acid
  description: >-
    The non-enzymatic reducing alternative, recorded because it is used and
    because what is known about it is largely negative. Ascorbic acid reduces
    ferric heme directly, without needing the NADPH that methylene blue
    depends on, which is why it is reached for where methylene blue is
    contraindicated or unavailable. It has been reported to control the cyanosis
    of the hereditary enzyme deficient form at daily oral doses. Set against
    that, the occupational review that covers the acquired forms groups it with
    the other supplemental antioxidants and states plainly that the benefit is
    unconfirmed. Both statements are curated here rather than one being
    suppressed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ascorbic acid
      term:
        id: CHEBI:22652
        label: ascorbic acid
  target_mechanisms:
  - target: Methemoglobin Accumulation in the Erythrocyte
    treatment_effect: INHIBITS
    description: >-
      Reduces the accumulated ferric heme directly and non-enzymatically, acting
      on the same pool as methylene blue but without the NADPH dependence that
      makes methylene blue fail in glucose-6-phosphate dehydrogenase deficiency.
      The claimed mechanism is recorded here; the evidence that it changes
      outcome is weak, as the evidence items on this treatment state.
  evidence:
  - reference: PMID:19480335
    reference_title: "A rare cause of mental motor retardation: recessive congenital methemoglobinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cyanosis can be well treated by 200-500 mg of ascorbic acid daily
    explanation: >-
      A clinical report of ascorbic acid controlling the cyanosis in the
      hereditary reductase deficient form, which is the positive evidence for
      this treatment and the reason it is recorded at all.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Supplemental antioxidants such as ascorbic acid (vitamin C),
      N-acetylcysteine and tocopherol (vitamin E) have been used as adjuvants or
      alternatives to methylene blue with no confirmed benefit.
    explanation: >-
      Curated as REFUTE against the claim that ascorbic acid has established
      benefit in the acquired forms, which is the counterweight to the case
      report above. Evidence source is OTHER because this is a review.

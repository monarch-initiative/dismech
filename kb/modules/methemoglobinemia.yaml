name: Methemoglobinemia Module
description: >-
  A conserved final-common-pathway module for methemoglobinemia: heme iron in
  circulating hemoglobin is oxidized from ferrous (Fe2+) to ferric (Fe3+), the
  net balance between that oxidation rate and the erythrocyte's NAD(P)H
  dependent reduction capacity tips toward oxidation, ferric methemoglobin
  accumulates in the red cell and cannot reversibly bind oxygen, the remaining
  ferrous hemes of the same partly oxidized tetramer are held at higher oxygen
  affinity so that the dissociation curve shifts left and unloading is impaired,
  and tissue oxygen delivery falls — a functional anemia with cyanosis and a
  normal arterial oxygen tension that supplemental oxygen does not correct. The
  key conformance target is `Methemoglobin Accumulation in the Erythrocyte`,
  the rate-limiting, disorder-agnostic hub every conformer funnels through
  whatever lesion put it there. The module carries a drug-target pattern for the
  antidote: methylene blue is reduced inside the red cell at the expense of
  NADPH and hands that reducing power to ferric heme, so it ACTIVATES the
  reduction arm of the balance node and INHIBITS the accumulated pool, with the
  glucose-6-phosphate dehydrogenase caveat that the antidote fails, and at high
  dose reverses, where NADPH cannot be regenerated; ascorbic acid is recorded as
  the non-enzymatic reducing alternative whose benefit is unconfirmed.
  Conforming disorder nodes substitute their own arm of the balance: loss of the
  reduction arm (CYB5R3 or CYB5A deficiency), an excess oxidation rate from an
  oxidant exposure, or a heme-pocket globin substitution that both stabilizes
  ferric iron and resists reduction. The module is complementary to, and does
  not overlap, four near neighbours. `hemolytic_anemia_erythrocyte_destruction`
  models red cells being destroyed; here the red cells survive and it is their
  hemoglobin that cannot carry oxygen, which is why the anemia is functional
  rather than a fall in red cell mass — an oxidant can cause both, but the
  haemolysis is a separate consequence of the exposure and not of the
  methemoglobin. `heme_biosynthesis_porphyria` concerns the eight enzymatic
  steps that build heme; this module begins with heme already built and
  assembled into hemoglobin and concerns only the redox state of its iron.
  `keap1_nrf2_are_signaling` is the transcriptional antioxidant response to
  electrophiles and oxidants; this module has no transcriptional arm, because
  the oxidant attacks heme iron directly and the defence is a reductase, not a
  gene programme. `xenobiotic_oxidative_phosphorylation_blockade` is histotoxic
  hypoxia, in which oxygen arrives and the tissue cannot use it; here the tissue
  could use the oxygen but the carrier does not deliver it.
category: Module
creation_date: "2026-11-10T00:00:00Z"

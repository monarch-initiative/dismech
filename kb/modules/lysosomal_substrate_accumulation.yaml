name: Lysosomal Substrate Accumulation Module
description: >-
  A conserved pathological module representing the shared core of the lysosomal
  storage diseases (LSDs): an inherited deficiency of a specific lysosomal
  hydrolase (or of a non-enzymatic protein/transporter essential for normal
  lysosomal function) blocks catabolism of a macromolecular substrate, which
  then accumulates undegraded within the lysosome. Progressive intralysosomal
  storage distends the organelle and impairs lysosome function, triggering a
  secondary cascade of autophagic-flux block, disturbed signalling, mitochondrial
  and calcium dysregulation. The affected cell type — often only a subset of
  cells determined by where the substrate is normally turned over — undergoes
  storage-cell transformation, cytotoxicity, and (in the CNS) neuroinflammation
  and neurodegeneration, producing progressive multi-organ disease. This
  conserved core is shared across sphingolipidoses, mucopolysaccharidoses,
  glycoproteinoses, glycogenoses (Pompe), and free-substrate transport defects.
  Individual disorder entries declare conformance via conforms_to on their
  pathophysiology nodes, substituting the disorder-specific deficient enzyme,
  stored substrate, and storage cell type while preserving the conserved
  deficiency -> accumulation -> lysosomal dysfunction -> cytotoxicity ->
  multisystem disease chain.
category: Module
module_categories:
- METABOLISM
creation_date: "2026-05-30T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g., "lysosomal_substrate_accumulation#
  Lysosomal Substrate Accumulation"). The module defines the expected
  pathophysiology structure; conforming nodes in disorder files should substitute
  the disorder-specific deficient gene/enzyme and stored substrate while
  preserving the conserved cascade. Key disorder-specific substitutions:
  Gaucher uses glucocerebrosidase (GBA1) deficiency and glucocerebroside storage
  in macrophage-derived Gaucher cells (CL:0000235); Tay-Sachs/Sandhoff use
  hexosaminidase deficiency and GM2 ganglioside storage in neurons (CL:0000540);
  Fabry uses alpha-galactosidase A deficiency and Gb3 storage in endothelium,
  podocytes, and cardiomyocytes; the mucopolysaccharidoses use specific
  glycosaminoglycan-degrading enzyme deficiencies and GAG storage; Pompe uses
  acid alpha-glucosidase deficiency and lysosomal glycogen storage in myofibers.
  Evidence here is drawn from cross-LSD reviews documenting the conserved
  cascade rather than any single disease; evidence_source is OTHER because these
  are reviews synthesizing data across multiple study types. The key conformance
  target is the central effector node "Lysosomal Substrate Accumulation".
pathophysiology:
- name: Lysosomal Hydrolase or Cofactor Deficiency
  description: >-
    A monogenic loss-of-function defect reduces the activity of a specific acid
    hydrolase that degrades a macromolecular substrate within the lysosome, or
    of a non-enzymatic protein (activator, membrane transporter, or trafficking
    factor) required for normal lysosomal catabolism. The identity of the
    deficient enzyme/protein varies by disorder, but the consequence — loss of
    the catabolic step for a particular substrate — is the conserved trigger of
    the module.
  role: trigger
  biological_processes:
  - preferred_term: macromolecule catabolic process
    term:
      id: GO:0009057
      label: macromolecule catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:36285443
    reference_title: "Lysosomal positioning diseases: beyond substrate storage."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "They are caused by a deficiency in specific lysosomal hydrolases involved in cellular catabolism, or non-enzymatic proteins essential for normal lysosomal functions."
    explanation: >-
      Establishes the conserved trigger of the module: deficiency of a specific
      lysosomal hydrolase or of a non-enzymatic protein required for lysosomal
      function. Evidence source is OTHER because this is a review synthesizing
      data across many lysosomal storage diseases.
  downstream:
  - target: Lysosomal Substrate Accumulation
    description: >-
      Loss of the catabolic step leaves the substrate undegraded, so it
      accumulates within the lysosome.

- name: Lysosomal Substrate Accumulation
  description: >-
    The substrate that can no longer be degraded accumulates undegraded within
    the lysosomal lumen. Storage is frequently restricted to the cell types in
    which that substrate is normally turned over in greatest quantity (e.g.,
    macrophages for glucocerebroside, neurons for gangliosides), which patterns
    the organ-specific clinical picture. This intralysosomal accumulation is the
    central, defining effector event of every lysosomal storage disease and the
    key conformance target for disorder entries.
  role: central_effector
  evidence:
  - reference: PMID:36285443
    reference_title: "Lysosomal positioning diseases: beyond substrate storage."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lysosomal storage diseases (LSDs) comprise a group of inherited monogenic disorders characterized by lysosomal dysfunctions due to undegraded substrate accumulation."
    explanation: >-
      Defines undegraded substrate accumulation as the characterizing event of
      the lysosomal storage diseases, the central effector of this module.
      Evidence source is OTHER because this is a cross-LSD review.
  - reference: PMID:30651381
    reference_title: "Lysosomal storage disorders - challenges, concepts and avenues for therapy: beyond rare diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lysosomal storage diseases (LSDs) are characterized by disturbances in this network and by intralysosomal accumulation of substrates, often only in certain cell types."
    explanation: >-
      Confirms intralysosomal substrate accumulation as the defining feature and
      documents the conserved cell-type restriction of storage, which underlies
      the organ-specific substitutions made by conforming disorder nodes.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Autophagic-Lysosomal Dysfunction and Secondary Cascade
    description: >-
      Progressive storage distends the lysosome and impairs its function,
      initiating a secondary cellular cascade.

- name: Autophagic-Lysosomal Dysfunction and Secondary Cascade
  description: >-
    Progressive lysosomal storage impairs core lysosome functions, blocking
    autophagic flux and disturbing membrane repair, exocytosis, lipid
    homeostasis, and signalling. Substrate accumulation is only the first event
    of a cascade that includes accumulation of secondary metabolites and
    impairment of cellular trafficking, cell signalling, mitochondrial function,
    and calcium homeostasis. This amplifying step converts a single catabolic
    block into broad cellular dysfunction.
  role: amplifier
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DYSREGULATED
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36285443
    reference_title: "Lysosomal positioning diseases: beyond substrate storage."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A substantial number of studies on the pathogenesis of LSDs has highlighted how the accumulation of lysosomal substrates is only the first event of a cascade of processes including the accumulation of secondary metabolites and the impairment of cellular trafficking, cell signalling, autophagic flux, mitochondria functionality and calcium homeostasis, that significantly contribute to the onset and progression of these diseases."
    explanation: >-
      Documents the conserved secondary cascade (impaired autophagic flux,
      trafficking, signalling, mitochondrial and calcium homeostasis) that
      amplifies primary substrate storage into broad cellular dysfunction.
      Evidence source is OTHER because this is a cross-LSD review.
  - reference: PMID:30651381
    reference_title: "Lysosomal storage disorders - challenges, concepts and avenues for therapy: beyond rare diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This Review aims to discuss how lysosomal storage affects functions linked to lysosomes, such as membrane repair, autophagy, exocytosis, lipid homeostasis, signalling cascades and cell viability."
    explanation: >-
      Enumerates the lysosome-linked functions (autophagy, membrane repair,
      exocytosis, lipid homeostasis, signalling, cell viability) disrupted by
      storage, supporting this amplifier node. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: Storage-Cell Cytotoxicity and Neuroinflammation
    description: >-
      Sustained lysosomal and autophagic dysfunction drives storage-cell
      transformation, cytotoxicity, and, in the CNS, neuroinflammation.

- name: Storage-Cell Cytotoxicity and Neuroinflammation
  description: >-
    The affected cell becomes an engorged storage cell whose impaired autophagy
    and lysosomal dysfunction compromise viability, driving apoptotic death. In
    the central nervous system, impaired neuronal autophagy initiates neuronal
    damage and activates microglia and astrocytes, producing a
    neuroinflammatory response that amplifies neurodegeneration. The specific
    storage cell varies by disorder (lipid-laden macrophage, ganglioside-laden
    neuron, GAG-laden mesenchymal and neural cells), but the progression from
    storage to cytotoxicity and inflammation is conserved.
  role: effector
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:30451936
    reference_title: "Recent trends in mucopolysaccharidosis research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathophysiological mechanism of these diseases has been investigated, indicating impaired autophagy in neuronal damage initiation, association of activated microglia and astrocytes with the neuroinflammatory processes, and involvement of tauopathy."
    explanation: >-
      Establishes the conserved neuronopathic effector mechanism: impaired
      autophagy initiating neuronal damage and microglial/astrocyte activation
      driving neuroinflammation. Evidence source is OTHER because this is a
      review of the mucopolysaccharidoses synthesizing multiple study types.
  - reference: PMID:30651381
    reference_title: "Lysosomal storage disorders - challenges, concepts and avenues for therapy: beyond rare diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This Review aims to discuss how lysosomal storage affects functions linked to lysosomes, such as membrane repair, autophagy, exocytosis, lipid homeostasis, signalling cascades and cell viability."
    explanation: >-
      Supports the link from lysosomal storage to compromised cell viability;
      partial because the quote names cell viability as an affected function
      without detailing the apoptotic and neuroinflammatory effectors.
  downstream:
  - target: Progressive Multisystem and Neurodegenerative Disease
    description: >-
      Accumulated cytotoxicity across affected cell types produces progressive
      organ and nervous-system disease.

- name: Progressive Multisystem and Neurodegenerative Disease
  description: >-
    The lack of degradation and lysosomal storage perturbs cellular homeostasis
    and, in turn, damages multiple organ systems. The specific clinical pattern
    (hepatosplenomegaly, skeletal dysplasia, cardiomyopathy, renal disease,
    psychomotor regression) depends on which cell types store substrate, but the
    final common outcome of progressive, multisystem, often neurodegenerative
    disease is conserved across the lysosomal storage diseases.
  role: consequence
  evidence:
  - reference: PMID:36285443
    reference_title: "Lysosomal positioning diseases: beyond substrate storage."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In LSDs, the lack of degradation of the accumulated substrate and its lysosomal storage impairs lysosome functions resulting in the perturbation of cellular homeostasis and, in turn, the damage of multiple organ systems."
    explanation: >-
      Directly states the conserved terminal consequence: impaired lysosome
      function from storage perturbs cellular homeostasis and damages multiple
      organ systems. Evidence source is OTHER because this is a cross-LSD review.

discussions:
- discussion_id: gap_cns_delivery_biomarker_versus_clinical_benefit
  prompt: >-
    Does receptor-mediated CNS delivery of a replacement lysosomal enzyme
    convert a corrected central storage biomarker into durable neurologic
    benefit, and at what point in the disease course does that conversion stop
    being possible?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lysosomal Substrate Accumulation
  - pathophysiology#Progressive Multisystem and Neurodegenerative Disease
  rationale: >-
    Conventional intravenous enzyme replacement corrects visceral storage but is
    excluded from the CNS, which is why the neuronopathic forms of most members
    of this module have remained untreatable while their visceral disease
    responds. Brain-penetrant, transferrin-receptor-targeted fusion enzymes
    break that barrier: in March 2026 tividenofusp alfa became the first such
    agent approved (US accelerated approval) for the neurologic manifestations
    of MPS II. The gap is that the approval rests on reduction of CSF heparan
    sulphate — a storage biomarker sitting at this module's central effector
    node — and not on a measured neurocognitive outcome, with clinical benefit
    still to be verified in a confirmatory trial. Curators of conforming
    disorders must therefore record the biomarker claim and the clinical-benefit
    claim as separate assertions, and must not curate CSF substrate correction
    as evidence of neurologic efficacy. The same caution applies to the
    intrathecal and intracerebroventricular delivery routes and to CNS-directed
    gene therapy, which are evaluated against the same surrogate.
  evidence:
  - reference: PMID:42313339
    reference_title: "Tividenofusp Alfa: First Approval."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on a reduction in cerebrospinal fluid heparan sulphate levels in
      patients with MPS II treated with tividenofusp alfa in a phase I/II trial,
      in March 2026 tividenofusp alfa was approved in the USA, under accelerated
      approval, for the treatment of neurologic manifestations of MPS II
    explanation: >-
      States both halves of the gap: a central storage biomarker was the basis
      for approval of the first brain-penetrant ERT in this disease group.
  - reference: PMID:42313339
    reference_title: "Tividenofusp Alfa: First Approval."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Continued approval for tividenofusp alfa may be contingent upon
      verification of clinical benefit in a confirmatory trial.
    explanation: >-
      The regulator itself treats clinical benefit as unverified, which is what
      makes this an open knowledge gap rather than a settled result.
  - reference: PMID:42525369
    reference_title: >-
      Regulatory Alignment on Surrogate Endpoints for Slowly Progressive
      Ultra-Rare Neurological Diseases: Bridging the Gap Between Biomarker
      Science and Global Regulatory Acceptance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Case studies from neurology (spinal muscular atrophy) and metabolic
      disorders (lysosomal storage diseases) illustrate the context-of-use
      dependency of these surrogates.
    explanation: >-
      Generalizes the gap beyond a single agent: surrogate validity in the
      lysosomal storage diseases is context-of-use dependent rather than
      established.
- discussion_id: gap_heterozygous_lsd_carrier_neurodegeneration_risk
  prompt: >-
    Do heterozygous loss-of-function carriers of lysosomal storage disease genes
    other than GBA1 carry an increased risk of adult-onset neurodegeneration,
    and is partial lysosomal dysfunction sufficient to drive it without
    detectable substrate storage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Autophagic-Lysosomal Dysfunction and Secondary Cascade
  - pathophysiology#Storage-Cell Cytotoxicity and Neuroinflammation
  rationale: >-
    This module is written for biallelic disease, where storage is the
    proximate cause of cytotoxicity. GBA1 established that a single
    loss-of-function allele — carrier status for a member of this group — is
    among the strongest genetic risk factors for Parkinson disease, without
    causing Gaucher disease. Whether that is a GBA1 peculiarity or a general
    property of partial lysosomal dysfunction is unresolved, and it determines
    whether carrier status in the other members belongs in their entries at all.
    Recent MCOLN1 findings extend the question to the mucolipidosis IV gene.
    Curators should treat a heterozygous-carrier neurodegeneration claim as a
    separate, weaker assertion than the biallelic storage disease, and should
    not model it as this module's storage-driven chain: the proposed lesion is
    reduced lysosomal function without demonstrable substrate accumulation.
  evidence:
  - reference: PMID:42557761
    reference_title: >-
      Rare Heterozygous Loss-of-Function Variants in MCOLN1 Identified in Two
      Sporadic Patients with α-Synucleinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic loss-of-function variants in MCOLN1 cause mucolipidosis type IV.
      However, the role of heterozygous MCOLN1 variants remains unclear.
    explanation: >-
      States the gap directly for a member gene of this module.
  - reference: PMID:42557761
    reference_title: >-
      Rare Heterozygous Loss-of-Function Variants in MCOLN1 Identified in Two
      Sporadic Patients with α-Synucleinopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings demonstrate that both variants impair TRPML1 function in
      vitro, identifying MCOLN1 as a candidate gene for α-synucleinopathies
      that warrants further investigation in larger cohorts.
    explanation: >-
      Partial: functional loss is shown in vitro in two patients, and the
      authors themselves frame the disease association as a candidate requiring
      cohort-level confirmation.
- discussion_id: gap_tfeb_direction_of_dysregulation_in_storage
  prompt: >-
    Is TFEB activity suppressed or pathologically over-activated in cells that
    are actively storing lysosomal substrate, and does therapeutic benefit come
    from raising it or from normalizing it in either direction?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Autophagic-Lysosomal Dysfunction and Secondary Cascade
  rationale: >-
    TFEB is the master transcriptional regulator of lysosomal biogenesis and
    autophagy, and TFEB activation has been pursued as a substrate-clearing
    strategy across this disease group on the assumption that storage suppresses
    it. Work in a Niemann-Pick type C cell model reports the opposite baseline —
    TFEB already over-activated and nuclear because of chronic lysosomal stress
    — with levacetylleucine, an approved NPC therapy, acting by reducing nuclear
    TFEB rather than raising it. If the baseline direction differs by disorder,
    cell type, or stage, then "TFEB activation" is not a coherent shared
    therapeutic rationale for this module, and a conforming disorder entry
    should curate the measured direction in its own cells rather than inheriting
    a directional assumption. Note the finding is from a HeLa cell model and has
    not been shown in patient neurons.
  evidence:
  - reference: PMID:42467639
    reference_title: >-
      N-acetyl-L-leucine normalizes Transcription Factor EB activity by
      stereospecific bidirectional modulation in a HeLa cell model of
      Niemann-Pick disease type C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that TFEB is over-activated and enriched in the nucleus due to
      lysosomal stress, levacetylleucine reduces nuclear TFEB and restores a
      more normal cytoplasmic-to-nuclear balance.
    explanation: >-
      Reports the direction of TFEB dysregulation under storage as elevated, and
      the therapeutic action as lowering it — the inverse of the
      TFEB-activation rationale.
- discussion_id: controversy_tpc2_direction_of_modulation
  prompt: >-
    Does therapeutic benefit at this node come from activating the endolysosomal
    two-pore channel TPC2 or from inhibiting it — and is "TPC2 agonism" even one
    pharmacology, given that the channel's ion selectivity is set by which
    ligand opens it?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Lysosomal Substrate Accumulation
  - pathophysiology#Autophagic-Lysosomal Dysfunction and Secondary Cascade
  rationale: >-
    TPC2 is the most developed pharmacological handle on this module's
    autophagic-lysosomal node, and the published direction of benefit points
    both ways. Activating it with a small molecule cleared cholesterol,
    lipofuscin and Gb3 storage in MLIV, NPC1 and Batten patient fibroblasts and
    iPSC-derived neurons, and rescued rotarod performance, P62 aggregates and
    cerebellar astrogliosis in the MLIV mouse. Inhibiting it with trans-Ned-19
    reduced infarct volume in rats after middle cerebral artery occlusion, on
    the argument that excitotoxic over-activation of the same channel drives a
    hyperfunctional autophagy. In LRRK2 Parkinson's models TPC2 is the
    pathogenic element: human TPC2 expression phenocopied the G2019S mutation in
    Drosophila, and the authors conclude that both inhibition and select
    activation are beneficial.

    Those results are not simply contradictory, and the reconciling fact is a
    pharmacological one rather than a disease-specific one. TPC2's ion
    selectivity depends on which agonist opens it: a NAADP-mimetic evokes robust
    Ca2+ signals and non-selective cation currents, while a PI(3,5)P2-mimetic
    evokes weaker Ca2+ signals and Na+-selective currents, and the two are
    coupled to opposing changes in lysosomal pH and exocytosis. So "a TPC2
    agonist" names two different interventions. This matters for reading the
    storage-rescue result correctly: every experiment in it, including the MLIV
    mouse, used the PI(3,5)P2-mimetic TPC2-A1-P, not the NAADP-mimetic
    TPC2-A1-N. In the LRRK2 work the beneficial agonist was likewise one biased
    to reduce Ca2+ permeability. As of this writing no in vivo efficacy result
    for a TPC2 agonist rests on the Ca2+-permeable NAADP-like mode.

    Two things this discussion does not claim. It does not claim the rescue is
    Ca2+-independent — chelating Ca2+ with BAPTA-AM blunted TPC2-A1-P's effect,
    and that paper describes A1-P as releasing both Ca2+ and Na+, so the
    distinction is one of degree and kinetics rather than a clean ion swap. And
    it does not settle the direction for this module: the storage evidence is
    the only arm with an in vivo disease model, but TPC2-A1-P was undetectable
    in plasma and brain by 240 minutes and its dose was picked to sit above
    threshold for barely 20 minutes, so it is a tool compound and not yet a
    demonstration that sustained TPC2 activation is safe or sufficient.

    This complements rather than duplicates gap_tfeb_direction_of_dysregulation_in_storage,
    which asks the same raise-or-normalize question one step downstream at TFEB.
    Read together they say the direction is unsettled at both the transcription
    factor and the channel that mobilizes the Ca2+ reaching it — and the channel
    adds a dimension TFEB does not have, because a biased agonist can move it in
    two pharmacologically distinct directions rather than just up or down.
  proposed_experiments:
  - experiment_id: exp_tpc2_biased_agonist_versus_antagonist_head_to_head_in_storage
    name: Head-to-head TPC2-A1-N, TPC2-A1-P and trans-Ned-19 in one storage model
    description: >-
      Run the NAADP-mimetic agonist, the PI(3,5)P2-mimetic agonist and the
      antagonist side by side in a single LSD model — the MLIV iPSC-derived
      neurons and the MLIV mouse already used for TPC2-A1-P — with substrate
      clearance, autophagic flux, lysosomal pH and exocytosis as shared
      endpoints, and ML-SA1 on TRPML1 as the external comparator. The published
      results compare different compounds in different diseases in different
      laboratories, so the direction of benefit and the disease are currently
      confounded with each other.
    experiment_type:
      preferred_term: head-to-head pharmacological comparison in a lysosomal storage model
    decision_criterion: >-
      If substrate clearance tracks the PI(3,5)P2-mimetic mode and not the
      NAADP-mimetic mode within one model, the therapeutic claim for this node
      is specifically Na+-biased TPC2 activation and should be curated that way.
      If both agonists clear substrate and only the antagonist fails, the
      direction is activation per se and the stroke result is
      excitotoxicity-specific rather than a general property of the channel.
    would_support:
    - pathophysiology#Autophagic-Lysosomal Dysfunction and Secondary Cascade
    would_refute:
    - pathophysiology#Autophagic-Lysosomal Dysfunction and Secondary Cascade
    supporting_outcome:
    - >-
      Substrate clearance and restored autophagic flux segregating by agonist
      mode within one model and one laboratory.
    refuting_outcome:
    - >-
      No separation between agonist modes, or clearance achieved equally by the
      antagonist, either of which would mean the published direction of benefit
      is not a property of TPC2 modulation as such.
  evidence:
  - reference: PMID:35929194
    reference_title: "TPC2 rescues lysosomal storage in mucolipidosis type IV, Niemann-Pick type C1, and Batten disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show here that small molecule activation of the Ca2+ -permeable endolysosomal two-pore channel 2 (TPC2) results in an amelioration of cellular phenotypes associated with LSDs such as cholesterol or lipofuscin accumulation, or the formation of abnormal vacuoles seen by electron microscopy."
    explanation: >-
      The activation side of the controversy, and the only arm with an in vivo
      disease model. Note the abstract describes the channel as Ca2+-permeable,
      which is a statement about TPC2 and not about which mode the agonist used
      here engages.
  - reference: PMID:35929194
    reference_title: "TPC2 rescues lysosomal storage in mucolipidosis type IV, Niemann-Pick type C1, and Batten disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show here that treatment with a PI(3,5)P2‐mimetic small molecule agonist of the endolysosomal cation channel TPC2, TPC2‐A1‐P, ameliorates cellular disease phenotypes in patient fibroblasts and iPSC‐derived neuronal models of MLIV, NPC1, and JNCL"
    explanation: >-
      Names the compound, and it is the whole reason the direction question
      needs the selectivity question attached to it. Every experiment in this
      study, cells through MLIV mouse, used the PI(3,5)P2-mimetic TPC2-A1-P, so
      the strongest evidence for activating TPC2 is evidence for activating it
      in one specific mode.
  - reference: PMID:32167471
    reference_title: Agonist-mediated switching of ion selectivity in TPC2 differentially promotes lysosomal function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "One of these evoked robust Ca2+-signals and non-selective cation currents, the other weaker Ca2+-signals and Na+-selective currents."
    explanation: >-
      The mechanism that makes the controversy tractable rather than merely
      unresolved. Ion selectivity is set by the activating ligand, so two
      compounds that are both called TPC2 agonists are not interchangeable.
  - reference: PMID:32167471
    reference_title: Agonist-mediated switching of ion selectivity in TPC2 differentially promotes lysosomal function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Agonist action was differentially inhibited by mutation of a single TPC2 residue and coupled to opposing changes in lysosomal pH and exocytosis."
    explanation: >-
      Establishes that the two modes drive lysosomal pH and exocytosis in
      opposite directions — the two functions this module's autophagic-lysosomal
      node depends on — so the mode is not a pharmacological footnote at this
      node but a determinant of the outcome.
  - reference: PMID:36708960
    reference_title: Pharmacological inhibition of lysosomal two-pore channel 2 (TPC2) confers neuroprotection in stroke via autophagy regulation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Collectively, the pharmacological inhibition of TPC2 lysosomal channel by Ned-19 protects from focal ischemia by hampering a hyperfunctional autophagy."
    explanation: >-
      The inhibition side. It is a different disease and a different insult, so
      it does not refute the storage result directly — but it is an in vivo
      neuroprotection claim for blocking the same channel, which is why the
      direction cannot be inherited from this module by a conforming entry.
  - reference: PMID:36708960
    reference_title: Pharmacological inhibition of lysosomal two-pore channel 2 (TPC2) confers neuroprotection in stroke via autophagy regulation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the role of autophagy in Stroke is controversial since excessive or prolonged autophagy activation exacerbates ischemic brain injury."
    explanation: >-
      States the premise that reconciles the two sides without either being
      wrong: if too much autophagic flux is as harmful as too little, then the
      therapeutic direction depends on which side of the optimum the cell
      started, and this module's node does not record that.
  - reference: PMID:40279672
    reference_title: "Lysosomal TPC2 channels disrupt Ca2+ entry and dopaminergic function in models of LRRK2-Parkinson's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, both inhibition and select activation of TPC2 are beneficial."
    explanation: >-
      The clearest statement in the literature that the direction is not a
      property of the channel. From a study where TPC2 is the pathogenic
      element — human TPC2 expression phenocopied LRRK2 G2019S in Drosophila —
      and where the useful agonist was one biased to reduce Ca2+ permeability.
  - reference: PMID:40279672
    reference_title: "Lysosomal TPC2 channels disrupt Ca2+ entry and dopaminergic function in models of LRRK2-Parkinson's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Reducing Ca2+ permeability with a novel biased TPC2 agonist corrected deviant Ca2+ entry and behavioral defects."
    explanation: >-
      The second independent case in which the beneficial agonist is the one
      that moves selectivity away from Ca2+, which is what makes the
      NAADP-versus-PI(3,5)P2 distinction a therapeutic variable rather than a
      biophysical curiosity.
  - reference: PMID:39978661
    reference_title: "TPC2 in drug development: Emerging target for cancer, viral infections, cardiovascular diseases, and neurological disorders."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The major challenges include achieving high target specificity without inducing unintended effects on other endolysosomal channels and on the crosstalk between TPC2 and other intracellular and extracellular Ca2+ channels."
    explanation: >-
      Records the field's own assessment of the selectivity problem, which is
      the reason ML-SA1 on TRPML1 belongs in the proposed head-to-head as a
      comparator rather than being assumed distinct.

name: Oncometabolite Dioxygenase Inhibition Module
description: >-
  A conserved mechanism module for the oncometabolite route to cancer: a lesion
  in a metabolic enzyme causes a small-molecule metabolite to accumulate to
  concentrations at which it competitively inhibits the 2-oxoglutarate-dependent
  dioxygenase superfamily, and the resulting loss of dioxygenase activity — not
  any energetic deficit — is what drives tumorigenesis. Two mechanistically
  opposite genetic routes converge on the same chemistry. Biallelic loss of a
  tricarboxylic-acid-cycle tumor suppressor (fumarate hydratase in hereditary
  leiomyomatosis and renal cell cancer; succinate dehydrogenase subunits in
  hereditary paraganglioma-pheochromocytoma and SDH-deficient gastrointestinal
  stromal tumor) causes its substrate to accumulate — fumarate or succinate
  respectively. A heterozygous neomorphic gain-of-function mutation in IDH1 or
  IDH2 instead creates a metabolite the cell does not normally make,
  R-2-hydroxyglutarate. All three are structural analogues of 2-oxoglutarate and
  all three act as competitive inhibitors at the shared 2-oxoglutarate site. The
  consequences split into two evidenced effector branches: stabilization of
  hypoxia-inducible factor through inhibition of the HIF prolyl hydroxylases,
  producing a pseudohypoxic, hypervascular tumor phenotype in normoxia; and
  inhibition of the TET 5-methylcytosine hydroxylases and the Jumonji-family
  histone demethylases, producing genome-wide DNA and histone hypermethylation
  with a differentiation block. A third, FH-specific branch is chemically
  distinct: fumarate covalently succinates cysteine residues on KEAP1, which is
  a modification rather than a competitive inhibition and activates NRF2
  antioxidant signalling independently of HIF. This module is deliberately NOT a
  duplicate of deregulated_cellular_energetics, which models Warburg-type
  glycolytic reprogramming as a biosynthetic supply strategy; here the metabolic
  change is a signalling lesion whose targets are chromatin and the hypoxia
  response.
category: Module
creation_date: "2026-08-23T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Disorder entries reference
  individual nodes via conforms_to (e.g. "oncometabolite_dioxygenase_
  inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases").
  Substitutions a conforming entry makes at the trigger and accumulation nodes:
  FH loss / fumarate (hereditary leiomyomatosis and renal cell cancer); SDHA,
  SDHB, SDHC, SDHD or SDHAF2 loss / succinate in hereditary
  paraganglioma-pheochromocytoma, SDH-deficient GIST and Carney-Stratakis; IDH1 or IDH2
  neomorphic mutation / R-2-hydroxyglutarate (glioma, acute myeloid leukaemia,
  chondrosarcoma, cholangiocarcinoma). Three things a conformer must not blur.
  (1) The genetic architecture differs between routes and only the TCA-enzyme
  route is a two-hit tumor suppressor mechanism — an FH or SDHx disorder should
  ALSO conform to germline_two_hit_tumor_predisposition, whereas the IDH route
  is a heterozygous neomorphic gain in which the wild-type allele is retained
  and must not be curated as needing a second hit. (2) The two effector branches
  are separately evidenced and a conformer should attach to the one it actually
  demonstrates; the relative contribution of the HIF branch is contested and is
  curated as competing mechanistic_hypotheses rather than settled. (3) The
  KEAP1-succination branch is chemically specific to fumarate — succinate and
  2-hydroxyglutarate do not succinate cysteines — so an SDHx or IDH conformer
  must not attach there. Key conformance target (rate-limiting node):
  "oncometabolite_dioxygenase_inhibition#Competitive Inhibition of
  2-Oxoglutarate-Dependent Dioxygenases".
pathophysiology:
- name: Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)
  description: >-
    The initiating lesion, reached by two opposite genetic routes. In the tumor
    suppressor route, both alleles of a TCA-cycle enzyme gene are inactivated —
    fumarate hydratase in hereditary leiomyomatosis and renal cell cancer, or a
    succinate dehydrogenase subunit in hereditary paraganglioma-pheochromocytoma
    — typically a germline first hit plus somatic loss of the wild-type allele.
    In the oncogene route, a heterozygous missense mutation at IDH1 R132 or IDH2
    R140/R172 confers a neomorphic activity while the wild-type allele is
    retained, so there is simultaneous partial loss of normal 2-oxoglutarate
    production and gain of a new product.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: fumarate hydratase activity
    term:
      id: GO:0004333
      label: fumarate hydratase activity
    modifier: DECREASED
  - preferred_term: succinate dehydrogenase (quinone) activity
    term:
      id: GO:0008177
      label: succinate dehydrogenase (quinone) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This enzyme acts as a tumor suppressor in familial leiomyomata, and its
      measured activity is very low or absent in tumors from individuals with
      leiomyomatosis.
    explanation: >-
      Establishes fumarate hydratase, a TCA-cycle enzyme, as a bona fide tumor
      suppressor whose activity is lost in the tumors themselves — the
      TCA-tumor-suppressor arm of this trigger node.
  - reference: PMID:11404820
    reference_title: Gene mutations in the succinate dehydrogenase subunit SDHB cause susceptibility to familial pheochromocytoma and to familial paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings extend the link between mitochondrial dysfunction and
      tumorigenesis and suggest that germline SDHB mutations are an important
      cause of pheochromocytoma susceptibility.
    explanation: >-
      Extends the same trigger to the succinate dehydrogenase subunits,
      establishing the second TCA enzyme family this module is built on.
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IDH1 and IDH2 mutations occur frequently in gliomas and acute myeloid
      leukemia, leading to simultaneous loss and gain of activities in the
      production of α-ketoglutarate (α-KG) and 2-hydroxyglutarate (2-HG),
      respectively.
    explanation: >-
      States the second, opposite genetic route — a simultaneous loss and
      neomorphic gain at IDH1/IDH2 — which converges on the same downstream
      chemistry.
  downstream:
  - target: Oncometabolite Accumulation
    description: >-
      Loss of the enzyme that consumes the metabolite, or gain of an enzyme that
      makes a new one, raises intracellular concentration by orders of
      magnitude.

- name: Oncometabolite Accumulation
  description: >-
    The metabolite immediately upstream of the disabled enzyme, or the neomorphic
    product, accumulates to concentrations far above physiological. Succinate
    accumulates when succinate dehydrogenase is inhibited; fumarate accumulates
    when fumarate hydratase is lost; R-2-hydroxyglutarate is produced de novo by
    mutant IDH. What unites them is structural: each is a close analogue of
    2-oxoglutarate, the obligatory co-substrate of an entire dioxygenase
    superfamily, and each is present at concentrations sufficient to compete with
    it.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:15652751
    reference_title: Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we describe a mitochondrion-to-cytosol signaling pathway that links
      mitochondrial dysfunction to oncogenic events: succinate, which
      accumulates as a result of SDH inhibition, inhibits HIF-alpha prolyl
      hydroxylases in the cytosol, leading to stabilization and activation of
      HIF-1alpha.
    explanation: >-
      Names the accumulation step explicitly and identifies it as a signalling
      rather than an energetic event — the founding observation for this module.
  downstream:
  - target: Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases
    description: >-
      At the concentrations reached, the accumulated analogue occupies the
      2-oxoglutarate site of dioxygenases and blocks catalysis.
  - target: KEAP1 Succination and NRF2 Antioxidant Pathway Activation
    description: >-
      Fumarate alone additionally reacts covalently with cysteine thiols, a
      chemically distinct route not shared by succinate or 2-hydroxyglutarate.

- name: Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases
  description: >-
    The rate-limiting, disorder-agnostic node this module exists to name. The
    accumulated oncometabolite occupies the same active-site space as
    2-oxoglutarate and competitively inhibits the superfamily of enzymes that
    require it — the HIF prolyl hydroxylases, the TET family of
    5-methylcytosine hydroxylases, and the Jumonji-domain histone demethylases,
    among others. Inhibition is not selective for one target, which is why a
    single metabolic lesion produces simultaneous hypoxia-response and chromatin
    phenotypes, and why the tumor phenotype cannot be explained by ATP
    deficiency.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
    term:
      id: GO:0016706
      label: 2-oxoglutarate-dependent dioxygenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we demonstrate that 2-HG is a competitive inhibitor of multiple
      α-KG-dependent dioxygenases, including histone demethylases and the TET
      family of 5-methlycytosine (5mC) hydroxylases.
    explanation: >-
      Demonstrates the defining biochemistry of this node — competitive
      inhibition at the shared 2-oxoglutarate site across multiple dioxygenase
      families — for the 2-hydroxyglutarate arm.
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, we show that fumarate acts as a competitive inhibitor of HPH.
    explanation: >-
      Establishes the same competitive-inhibition mechanism for the fumarate
      arm, confirming the node is shared across oncometabolites rather than
      specific to one.
  downstream:
  - target: Pseudohypoxic HIF Stabilization
    description: >-
      Inhibition of the HIF prolyl hydroxylases prevents hydroxylation-dependent
      VHL recognition, so HIF escapes degradation under normal oxygen tension.
    hypothesis_groups:
    - hif_pseudohypoxia_driver
  - target: Impaired Demethylation and Genome-Wide Hypermethylation
    description: >-
      Inhibition of the TET hydroxylases and Jumonji histone demethylases blocks
      the removal of methyl marks from DNA and histones.
    hypothesis_groups:
    - epigenetic_hypermethylation_driver

- name: Pseudohypoxic HIF Stabilization
  description: >-
    With the prolyl hydroxylases inhibited, HIF-alpha subunits are not
    hydroxylated, are not recognized by the VHL E3 ligase, and accumulate in
    normoxia. The cell therefore transcribes the hypoxia programme — angiogenic,
    glycolytic and invasion-associated target genes — while oxygen is adequate.
    This is the mechanistic explanation for why highly vascular tumors arise in
    these syndromes without any VHL mutation, and it is the point of convergence
    with von Hippel-Lindau disease, which reaches the same state from the
    opposite direction by losing the ligase instead of inhibiting the hydroxylase.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cellular response to decreased oxygen levels
    term:
      id: GO:0036294
      label: cellular response to decreased oxygen levels
    modifier: INCREASED
  evidence:
  - reference: PMID:15652751
    reference_title: Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest a mechanistic link between SDH mutations and
      HIF-1alpha induction, providing an explanation for the highly vascular
      tumors that develop in the absence of VHL mutations.
    explanation: >-
      Ties the stabilization of HIF directly to the metabolic lesion and to the
      vascular tumor phenotype, which is what this effector node asserts.
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that FH inhibition, together with elevated intracellular
      fumarate, coincides with HIF upregulation.
    explanation: >-
      Confirms the same effector state in FH-deficient human renal cancer,
      establishing the branch as shared rather than SDH-specific.
  downstream:
  - target: Oncometabolite-Driven Tumorigenesis with Differentiation Block
    description: >-
      Constitutive hypoxia-response transcription supports angiogenesis,
      glycolytic metabolism and invasive behaviour in the developing tumor.

- name: Impaired Demethylation and Genome-Wide Hypermethylation
  description: >-
    Inhibition of the TET 5-methylcytosine hydroxylases and the Jumonji-family
    histone demethylases blocks the removal of methyl marks, so DNA and histone
    methylation accumulate genome-wide. In SDHx-mutated paraganglioma this
    produces a distinct hypermethylator cluster with downregulation of the genes
    that specify neuroendocrine differentiation; in IDH-mutant acute myeloid
    leukaemia the same chemistry produces a global hypermethylation signature
    with impaired haematopoietic differentiation. The severity tracks the
    genotype — epigenetic silencing is most marked in SDHB-mutated tumors, which
    are also the most malignant.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: chromosomal 5-methylcytosine DNA demethylation pathway
    term:
      id: GO:0141166
      label: chromosomal 5-methylcytosine DNA demethylation pathway
    modifier: DECREASED
  - preferred_term: demethylation
    term:
      id: GO:0070988
      label: demethylation
    modifier: DECREASED
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SDHx-related tumors displayed a hypermethylator phenotype, associated with
      downregulation of key genes involved in neuroendocrine differentiation.
    explanation: >-
      Establishes the hypermethylation branch and its differentiation
      consequence in human SDHx paraganglioma.
  - reference: PMID:21130701
    reference_title: "Leukemic IDH1 and IDH2 mutations result in a hypermethylation phenotype, disrupt TET2 function, and impair hematopoietic differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutational and epigenetic profiling of a large acute myeloid leukemia
      (AML) patient cohort revealed that IDH1/2-mutant AMLs display global DNA
      hypermethylation and a specific hypermethylation signature.
    explanation: >-
      Confirms the same effector branch for the IDH route in a human cohort,
      showing that the branch is a property of the shared chemistry rather than
      of one gene.
  downstream:
  - target: Oncometabolite-Driven Tumorigenesis with Differentiation Block
    description: >-
      Hypermethylation silences differentiation programmes, locking cells in a
      progenitor-like, migration-competent state.

- name: KEAP1 Succination and NRF2 Antioxidant Pathway Activation
  description: >-
    A branch specific to fumarate and chemically distinct from the rest of the
    module: fumarate reacts covalently with cysteine thiols to form
    S-(2-succinyl)cysteine, and succination of KEAP1 abrogates its ability to
    repress NRF2. The NRF2 antioxidant transcriptional programme is then
    constitutively active. Mouse genetics places this branch outside the HIF
    axis — Fh1-associated renal cyst formation proceeds independently of HIF —
    which is the principal reason the HIF branch cannot be assumed to be the
    sole oncogenic driver in FH-deficient disease.
  role: adaptive_escape
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:22014577
    reference_title: "Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistic analysis revealed that fumarate modifies cysteine residues
      within the Kelch-like ECH-associated protein 1 (KEAP1), abrogating its
      ability to repress the Nuclear factor (erythroid-derived 2)-like 2
      (Nrf2)-mediated antioxidant response pathway, suggesting a role for Nrf2
      dysregulation in FH-associated cysts and tumors.
    explanation: >-
      Establishes the covalent succination branch and its NRF2 output in an
      Fh1-deficient mouse model. Evidence source is MODEL_ORGANISM.
  downstream:
  - target: Oncometabolite-Driven Tumorigenesis with Differentiation Block
    description: >-
      Constitutive antioxidant signalling supports survival of cells carrying
      the metabolic lesion.
    hypothesis_groups:
    - nrf2_succination_driver

- name: Oncometabolite-Driven Tumorigenesis with Differentiation Block
  description: >-
    The convergent output: tumors that are characteristically hypervascular,
    metabolically reprogrammed, and blocked in differentiation, arising in the
    specific lineages each genotype affects — smooth muscle and renal tubular
    epithelium for FH, chromaffin and paraganglionic tissue for SDHx, glial and
    haematopoietic progenitors for IDH. Reversibility is part of the evidence
    for the mechanism: the migratory phenotype induced by succinate accumulation
    in SDH-deficient cells is reversed by a DNA hypomethylating agent, which
    would not be expected if the hypermethylation were a bystander mark.
  role: consequence
  biological_scale: TISSUE
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Succinate accumulation in SDH-deficient mouse chromaffin cells led to DNA
      hypermethylation by inhibition of 2-OG-dependent histone and DNA
      demethylases and established a migratory phenotype reversed by decitabine
      treatment.
    explanation: >-
      Traces the whole chain in one experiment — accumulation, dioxygenase
      inhibition, hypermethylation, phenotype — and shows the phenotype is
      pharmacologically reversible. Evidence source is IN_VITRO (cultured mouse
      chromaffin cells).
treatments:
- name: DNA Hypomethylating Agent (Decitabine) Reversal of the Epigenetic Branch
  description: >-
    The module's drug-target design pattern, and a mechanistic proof rather than
    a standard of care: because the oncogenic signal at the epigenetic branch is
    an excess of methyl marks that the cell can no longer remove, a
    hypomethylating agent addresses it downstream of the untreatable metabolic
    lesion. CRITICAL scope caveat — the evidence here is a cell-based
    demonstration in SDH-deficient mouse chromaffin cells, not clinical efficacy
    in hereditary paraganglioma; conforming disorders do not inherit this as a
    treatment recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: decitabine
      term:
        id: CHEBI:749378
        label: decitabine
  target_mechanisms:
  - target: Impaired Demethylation and Genome-Wide Hypermethylation
    treatment_effect: INHIBITS
    description: >-
      Decitabine depletes DNA methyltransferase activity and lowers 5mC,
      relieving the hypermethylated state that the inhibited TET enzymes can no
      longer reverse — acting on the consequence of dioxygenase inhibition
      rather than restoring the dioxygenases.
    evidence:
    - reference: PMID:23707781
      reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Succinate accumulation in SDH-deficient mouse chromaffin cells led to
        DNA hypermethylation by inhibition of 2-OG-dependent histone and DNA
        demethylases and established a migratory phenotype reversed by
        decitabine treatment.
      explanation: >-
        The reversal experiment that makes the hypermethylation node a
        legitimate drug target rather than a correlate.
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epigenetic silencing was particularly severe in SDHB-mutated tumors,
      potentially explaining their malignancy.
    explanation: >-
      Provides the rationale for targeting the epigenetic branch specifically in
      the genotype where it is most severe and the clinical course worst.
mechanistic_hypotheses:
- hypothesis_group_id: hif_pseudohypoxia_driver
  hypothesis_label: Pseudohypoxic HIF Activation as the Oncogenic Driver
  status: CANONICAL
  description: >-
    The long-standing reading: inhibition of the HIF prolyl hydroxylases and the
    resulting constitutive HIF transcriptional programme is what transforms the
    cell, which is why these tumors are hypervascular and why HIF-directed
    therapy was proposed for FH- and SDH-associated neoplasia.
  evidence:
  - reference: PMID:15652751
    reference_title: Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest a mechanistic link between SDH mutations and
      HIF-1alpha induction, providing an explanation for the highly vascular
      tumors that develop in the absence of VHL mutations.
    explanation: >-
      The observation on which the HIF-driver reading rests.
- hypothesis_group_id: epigenetic_hypermethylation_driver
  hypothesis_label: Epigenetic Hypermethylation and Differentiation Block as the Oncogenic Driver
  status: ALTERNATIVE
  description: >-
    The competing reading: the transforming event is inhibition of the TET and
    Jumonji demethylases, producing a hypermethylator phenotype that silences
    differentiation programmes. Support includes the correlation between
    severity of silencing and malignancy across SDHx genotypes, the same
    signature in IDH-mutant leukaemia where there is no TCA lesion at all, and
    pharmacological reversal by a hypomethylating agent.
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epigenetic silencing was particularly severe in SDHB-mutated tumors,
      potentially explaining their malignancy.
    explanation: >-
      Ties the epigenetic branch, not the HIF branch, to the clinical severity
      gradient across SDHx genotypes.
- hypothesis_group_id: nrf2_succination_driver
  hypothesis_label: KEAP1 Succination and NRF2 Dysregulation as the Oncogenic Driver (FH-Specific)
  status: ALTERNATIVE
  description: >-
    An FH-specific alternative in which the transforming event is covalent
    succination of KEAP1 and consequent constitutive NRF2 antioxidant
    signalling, not HIF stabilization. Mouse genetics is the strongest evidence:
    Fh1-associated renal cyst formation proceeds without HIF, and deleting
    Hif-1a makes cysts worse rather than better.
  evidence:
  - reference: PMID:22014577
    reference_title: "Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a mouse model, we provide genetic evidence that Fh1-associated cyst
      formation is Hif independent, as is striking upregulation of antioxidant
      signaling pathways revealed by gene expression profiling.
    explanation: >-
      Genetic evidence that removes HIF from the causal path for the FH lesion,
      which is what makes this an alternative rather than a complement.
discussions:
- discussion_id: controversy_hif_versus_epigenetic_driver
  prompt: >-
    Which branch downstream of dioxygenase inhibition actually drives
    tumorigenesis — pseudohypoxic HIF stabilization, epigenetic hypermethylation,
    or (for fumarate) KEAP1 succination and NRF2 activation?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Pseudohypoxic HIF Stabilization
  - pathophysiology#Impaired Demethylation and Genome-Wide Hypermethylation
  - pathophysiology#KEAP1 Succination and NRF2 Antioxidant Pathway Activation
  rationale: >-
    This is not cosmetic: it decides what a conforming disorder should curate as
    its therapeutic rationale. If HIF is the driver, HIF-directed therapy is
    indicated and the hypervascularity is causal; if the epigenetic branch is
    the driver, hypomethylating agents are the rationale and HIF activation is a
    marker; if succination and NRF2 dominate in FH-deficient disease, then both
    of the other rationales are misdirected for that genotype specifically. The
    mouse genetics is the sharpest evidence against a simple HIF-driver model,
    because deleting Hif-1a in Fh1-deficient kidney exacerbated rather than
    prevented cyst formation. Curators should keep the branches separated as
    hypothesis groups on the relevant edges rather than asserting a single
    causal chain.
  proposed_experiments:
  - experiment_id: branch_selective_rescue_in_conformer_tissue
    name: Branch-selective genetic rescue in each conforming genotype
    description: >-
      Independently disable the HIF, TET/Jumonji, and NRF2 branches in
      genetically matched FH-deficient, SDHx-deficient and IDH-mutant models of
      the same lineage, and measure tumor initiation rather than a surrogate
      marker, to establish whether the dominant branch is a property of the
      oncometabolite, of the tissue, or of both.
- discussion_id: gap_human_model_fidelity_of_branch_evidence
  prompt: >-
    Do the branch-assignment results obtained in mouse models and cultured cells
    hold in the human tumors of the corresponding hereditary syndromes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#KEAP1 Succination and NRF2 Antioxidant Pathway Activation
  - pathophysiology#Oncometabolite-Driven Tumorigenesis with Differentiation Block
  rationale: >-
    The two claims that most constrain therapeutic reasoning rest on non-human
    systems: HIF-independence of cyst formation comes from Fh1-deficient mice,
    and the decitabine reversal comes from cultured mouse chromaffin cells. The
    human evidence in this module is observational — hypermethylation clusters
    and HIF overexpression correlate with genotype in human tumors, but no human
    experiment separates the branches. A conforming human disorder entry should
    therefore not curate the branch assignment as established human mechanism,
    and should mark model-derived claims with evidence_source MODEL_ORGANISM or
    IN_VITRO rather than presenting them as human clinical findings.

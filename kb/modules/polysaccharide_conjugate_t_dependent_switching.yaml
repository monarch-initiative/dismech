name: polysaccharide_conjugate_t_dependent_switching
description: >-
  Conserved mechanism by which covalent conjugation of a bacterial capsular
  polysaccharide (a T-cell-independent antigen that poorly immunizes infants
  and fails to induce immunological memory) to an immunogenic carrier protein
  (such as CRM197, tetanus toxoid, diphtheria toxoid, or meningococcal outer
  membrane protein) converts the antipolysaccharide humoral response into a
  CD4+ T follicular helper cell-dependent germinal center reaction. Polysaccharide-specific
  B cells internalize the glycoconjugate via their B-cell receptor, process the
  carrier protein, and present carrier-derived peptides on MHC class II to
  cognate CD4+ T helper cells, driving class-switch recombination to high-affinity
  opsonophagocytic and bactericidal IgG, memory B-cell differentiation, and
  reduction of nasopharyngeal mucosal carriage (herd immunity) across encapsulated
  bacterial pathogens including Haemophilus influenzae type b, Neisseria
  meningitidis, and Streptococcus pneumoniae.
category: Pathophysiology
pathophysiology:
- name: Carrier Protein MHC Class II Presentation and Cognate T-B Cell Help
  role: trigger
  description: >-
    Unconjugated bacterial capsular polysaccharides behave as T-cell-independent
    antigens that crosslink B-cell receptors without MHC class II peptide
    presentation, yielding predominantly low-affinity IgM responses with poor
    immunogenicity in infants and no immunological memory. Covalent linkage of
    the capsular polysaccharide to a carrier protein enables polysaccharide-specific
    B cells to bind the carbohydrate epitope, internalize the entire glycoconjugate,
    and present carrier-derived peptides on MHC class II molecules to cognate
    CD4+ T helper cells.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: INCREASED
    term:
      id: GO:0002250
      label: adaptive immune response
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    modifier: INCREASED
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
  evidence:
  - reference: PMID:34076491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polysaccharides are T-cell-independent antigens which lead primarily to IgM responses with little isotype switching to IgG antibody"
    explanation: Establishes that unconjugated bacterial capsular polysaccharides act as T-cell-independent antigens that elicit predominantly IgM without class switching to IgG.
  - reference: PMID:34076491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To address the reduced immunogenicity of polysaccharide vaccines in infants, conjugated protein-polysaccharide (glycoconjugate) vaccines were developed"
    explanation: Demonstrates the rationale for covalent protein-polysaccharide conjugation to overcome infant hyporesponsiveness to plain polysaccharide antigens.
  downstream:
  - target: Germinal Center Isotype Switching, Affinity Maturation, and B-Cell Memory
    description: Cognate CD4+ T helper cells drive germinal center class-switch recombination from IgM to high-affinity IgG and differentiation of long-lived memory B cells
- name: Germinal Center Isotype Switching, Affinity Maturation, and B-Cell Memory
  description: >-
    Activated carrier-specific CD4+ T helper cells provide costimulatory and
    cytokine signals to polysaccharide-specific B cells, driving germinal center
    isotype switching to IgG, somatic hypermutation with affinity maturation,
    and generation of polysaccharide-specific memory B cells capable of mounting
    rapid anamnestic booster responses upon subsequent exposure from early infancy.
  cell_types:
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: isotype switching
    modifier: INCREASED
    term:
      id: GO:0045190
      label: isotype switching
  - preferred_term: somatic diversification of immunoglobulins
    modifier: INCREASED
    term:
      id: GO:0016447
      label: somatic recombination of immunoglobulin gene segments
  evidence:
  - reference: PMID:34076491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plain polysaccharide vaccines fail to induce immunologic memory and also fail to elicit a booster response on repeated exposure"
    explanation: Contrasts unconjugated polysaccharide vaccines, which fail to generate memory or booster responses, with glycoconjugate vaccines.
  - reference: PMID:34076491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibody responses to proteins are T cell dependent and can be elicited from a very young age, resulting in high-affinity antibodies with isotype switching, affinity maturation, and the generation of immunologic memory. Subsequent exposure to the antigen results in a significant booster response."
    explanation: Details the T-cell-dependent germinal center cascade of isotype switching, affinity maturation, and immunologic memory elicited by protein-conjugated vaccines from infancy.
  downstream:
  - target: Anti-Capsular IgG Mucosal Carriage Reduction and Invasive Bacteremia Blockade
    description: High-affinity anti-capsular IgG transudates onto the nasopharyngeal mucosa and circulates systemically to opsonize encapsulated bacteria, reducing mucosal carriage and blocking bloodstream invasion
- name: Anti-Capsular IgG Mucosal Carriage Reduction and Invasive Bacteremia Blockade
  role: consequence
  description: >-
    High-titer anti-capsular IgG antibodies neutralize the immune-evasive
    polysaccharide capsule of colonized bacteria via complement-mediated
    opsonophagocytosis and serum bactericidal activity, clearing or preventing
    nasopharyngeal colonization (generating population-level herd protection)
    and blocking mucosal invasion into the bloodstream and central nervous system.
  locations:
  - preferred_term: nasopharynx
    term:
      id: UBERON:0001728
      label: nasopharynx
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
  - preferred_term: complement activation, classical pathway
    modifier: INCREASED
    term:
      id: GO:0006958
      label: complement activation, classical pathway
  evidence:
  - reference: PMID:42071803
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both are encapsulated bacteria with high nasopharyngeal carriage rates in children and adolescents, and their polysaccharide capsules facilitate immune evasion, promoting colonization, bloodstream invasion, and entry into the central nervous system by crossing the blood-brain barrier."
    explanation: Establishes the conserved role of the polysaccharide capsule in nasopharyngeal colonization, immune evasion, bacteremia, and CNS invasion across Streptococcus pneumoniae and Neisseria meningitidis.
  - reference: PMID:34076491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hib nasopharyngeal carriage is reduced in those who are vaccinated, thereby interrupting transmission of Hib to susceptible unvaccinated children and adults (i.e., herd protection)"
    explanation: Demonstrates that glycoconjugate vaccination reduces nasopharyngeal carriage of encapsulated bacteria and interrupts community transmission.

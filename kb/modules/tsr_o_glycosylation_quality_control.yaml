name: Thrombospondin Type-1 Repeat O-Glycosylation Quality Control
description: >-
  A conserved endoplasmic-reticulum quality-control pathway for secreted and
  cell-surface proteins that contain thrombospondin type-1 repeats (TSRs).
  POFUT2 recognizes a correctly folded TSR and adds O-fucose; B3GLCT can then
  extend that sugar with glucose. The modifications stabilize the folded TSR
  and promote efficient ER exit. Loss of the O-fucose step, loss of the glucose
  extension, or a disease-causing change at a substrate O-fucosylation site can
  therefore reduce secretion or extracellular function of a selective subset
  of TSR-containing proteins, especially extracellular-matrix ADAMTS and
  ADAMTS-like proteins, with downstream matrix-remodeling and growth-factor
  signaling abnormalities. Conforming disorders substitute the affected
  enzyme or substrate and must preserve the experimentally demonstrated step:
  the POFUT2/O-fucose arm and the B3GLCT/glucose-extension arm are related but
  are not interchangeable.
category: Module
creation_date: "2026-08-08T00:00:00Z"
notes: >-
  The key conformance target is "Impaired ER Quality Control and Secretion of
  TSR-Containing Proteins". Peters plus syndrome enters through the
  B3GLCT-specific "Absent Glucose-beta-1,3-Fucose Disaccharide" node. Geleophysic
  dysplasia caused by the ADAMTSL2 p.Ser641Leu TSR3 variant enters through the
  "Absent O-Fucose" node because that variant eliminates O-fucosylation of the
  substrate itself; ADAMTSL2 secretion is POFUT2-dependent but was not reduced
  in B3GLCT-null cells. This asymmetry is why the module spans O-glycosylation
  broadly rather than treating POFUT2 and B3GLCT deficiency as equivalent.
  C-mannosylation and cell-specific chaperones can partly compensate, so
  conformance requires substrate- and tissue-relevant evidence rather than the
  mere presence of a TSR. Weill-Marchesani syndrome is intentionally not wired:
  ADAMTS17 secretion falls in POFUT2-null HEK293T cells but was minimally
  affected in Pofut2-deficient developing bone, so its human disease dependence
  remains unresolved. This module is distinct from
  congenital_disorder_of_glycosylation, whose shared hub is broad N-glycan
  hypoglycosylation, and from loss_of_proteostasis and
  er_protein_storage_disease, which model canonical recognition or retention of
  unfolded/misfolded proteins. Here POFUT2 recognizes the correctly folded TSR
  and glycosylation stabilizes that fold.
pathophysiology:
- name: Absent O-Fucose on Folded Thrombospondin Type-1 Repeats
  biological_scale: MOLECULAR
  description: >-
    The first arm loses O-fucose from a correctly folded TSR, either because
    POFUT2 activity is absent or because a substrate variant disrupts its
    O-fucosylation site. This removes the glycan that stabilizes the folded
    domain and also prevents the downstream B3GLCT glucose extension. In the
    worked human substrate example, ADAMTSL2 p.Ser641Leu eliminates
    O-fucosylation of TSR3 and reduces secretion.
  role: trigger
  biological_processes:
  - preferred_term: protein O-linked glycosylation via fucose
    term:
      id: GO:0036066
      label: protein O-linked glycosylation via fucose
    modifier: DECREASED
  evidence:
  - reference: PMID:32913123
    reference_title: "O-Fucosylation of ADAMTSL2 is required for secretion and is impacted by geleophysic dysplasia-causing mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, secretion was significantly reduced for ADAMTSL2 carrying
      GPHYSD1 mutations (S641L in TSR3 and G817R in TSR6), and S641L eliminated
      O-fucosylation of TSR3.
    explanation: >-
      A disease-causing human ADAMTSL2 substrate variant directly removes the
      O-fucose modification and reduces secretion, establishing the
      substrate-level entry into this arm.
  - reference: PMID:35597280
    reference_title: "O-fucosylation stabilizes the TSR3 motif in thrombospondin-1 by interacting with nearby amino acids and protecting a disulfide bond."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, POFUT2 is localized to the endoplasmic reticulum (ER) and
      only modifies folded TSRs, stabilizing their structures.
    explanation: >-
      Establishes that the first glycosylation step recognizes and stabilizes
      the folded TSR rather than tagging an unfolded domain.
  downstream:
  - target: Impaired ER Quality Control and Secretion of TSR-Containing Proteins
    causal_link_type: DIRECT
    description: >-
      Without O-fucose, the folded TSR loses its stabilizing quality-control
      mark and cannot receive the glucose extension, reducing efficient folding
      and ER exit for susceptible substrates.
- name: Absent Glucose-beta-1,3-Fucose Disaccharide on Thrombospondin Type-1 Repeats
  biological_scale: MOLECULAR
  description: >-
    The second arm retains the POFUT2-added O-fucose but loses B3GLCT-dependent
    glucose extension, leaving a fucose monosaccharide in place of the mature
    glucose-beta-1,3-fucose disaccharide. The added glucose supplies further
    fold stabilization, but this step is required by only a subset of POFUT2
    substrates.
  role: trigger
  biological_processes:
  - preferred_term: protein O-linked glycosylation via glucose
    term:
      id: GO:0180059
      label: protein O-linked glycosylation via glucose
    modifier: DECREASED
  evidence:
  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      O-fucose is added to cysteine-rich domains called thrombospondin type 1
      repeats (TSRs) by protein O-fucosyltransferase 2 (POFUT2) and is elongated
      with glucose by β3-glucosyltransferase (B3GLCT).
    explanation: >-
      Establishes the sequential reaction and the B3GLCT-dependent
      glucose-extension step interrupted in Peters plus syndrome.
  - reference: PMID:34058199
    reference_title: "Peters plus syndrome mutations affect the function and stability of human beta1,3-glucosyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, our data supports the hypothesis that loss of glucose from B3GLCT
      substrate proteins is responsible for the defects observed in PTRPLS
      patients, but not for those observed in PTRPLS-like patients.
    explanation: >-
      Ties the glucose-extension lesion specifically to disease-causing B3GLCT
      loss rather than to any variant in the enzyme.
  downstream:
  - target: Impaired ER Quality Control and Secretion of TSR-Containing Proteins
    causal_link_type: DIRECT
    description: >-
      Loss of the terminal glucose removes additional fold stabilization and
      reduces ER exit for the B3GLCT-dependent subset of TSR proteins.
- name: Impaired ER Quality Control and Secretion of TSR-Containing Proteins
  biological_scale: CELLULAR
  description: >-
    POFUT2 and B3GLCT form a noncanonical ER quality-control pathway: POFUT2
    recognizes a correctly folded TSR, and sequential glycosylation stabilizes
    that fold and favors efficient secretion. Loss of the relevant sugar makes
    susceptible TSR domains less stable and delays or prevents ER exit. The
    effect is selective rather than universal because dependence varies by TSR,
    substrate, cell type, and compensating modifications such as
    C-mannosylation.
  role: central_effector
  biological_processes:
  - preferred_term: protein folding in endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
    modifier: ABNORMAL
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While known ER quality-control machinery rely on identifying and tagging
      unfolded proteins, we find that POFUT2 and B3GLCT mediate a noncanonical
      ER quality-control mechanism that recognizes folded TSRs and stabilizes
      them by glycosylation.
    explanation: >-
      Defines the conserved folded-state-recognizing quality-control hub and
      distinguishes it from canonical unfolded-protein quality control.
  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that while POFUT2 is required for secretion of all targets
      tested, B3GLCT only affects the secretion of a subset, consistent with the
      observation that B3GLCT mutant phenotypes in PPS patients are less severe
      than embryonic lethal phenotypes of Pofut2-null mice.
    explanation: >-
      Demonstrates the experimentally important asymmetry between the O-fucose
      and glucose-extension steps and the selective effect of B3GLCT loss.
  - reference: PMID:35597280
    reference_title: "O-fucosylation stabilizes the TSR3 motif in thrombospondin-1 by interacting with nearby amino acids and protecting a disulfide bond."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we conducted molecular dynamics (MD) simulations and provide
      crystallographic and NMR evidence that the Glucose-Fucose disaccharide
      interacts with specific amino acids in the TSR3 domain in thrombospondin-1
      that are within proximity to the O-fucosylation modification site
      resulting in protection of a nearby disulfide bond.
    explanation: >-
      Supplies a structural mechanism for glycan-mediated TSR stabilization at
      the central quality-control step.
  downstream:
  - target: Selective Depletion or Dysfunction of TSR-Containing Extracellular Proteins
    causal_link_type: DIRECT
    description: >-
      Susceptible client proteins are secreted less efficiently or reach the
      extracellular space with altered glycan-dependent function.
- name: Selective Depletion or Dysfunction of TSR-Containing Extracellular Proteins
  biological_scale: TISSUE
  description: >-
    The affected extracellular client set is enriched for ADAMTS and
    ADAMTS-like proteins but is not limited to that family. Which clients fall
    below a functional threshold depends on the lost glycosylation step, individual TSR
    folding energetics, compensating C-mannosylation, and the tissue context.
    Disease-specific conformers name the demonstrated client, such as ADAMTSL2
    in geleophysic dysplasia or ADAMTS9/ADAMTS20 in the Peters plus mouse model.
  role: effector
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:31600785
    reference_title: "ADAMTS9 and ADAMTS20 are differentially affected by loss of B3GLCT in mouse model of Peters plus syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Forty-nine proteins are predicted to be modified by POFUT2, and nearly
      half are members of the ADAMTS superfamily.
    explanation: >-
      Establishes the size and ADAMTS enrichment of the candidate TSR-client
      set while leaving the actual disease-relevant subset to each conformer.
  - reference: PMID:32913123
    reference_title: "O-Fucosylation of ADAMTSL2 is required for secretion and is impacted by geleophysic dysplasia-causing mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of ADAMTSL2 secretion in POFUT2-/- but not in B3GLCT-/- cells
      suggested that impaired ADAMTSL2 secretion is not responsible for
      skeletal defects in PTRPLS patients.
    explanation: >-
      Directly demonstrates that client dependence differs between the POFUT2
      and B3GLCT arms, preventing an indiscriminate all-TSR-protein claim.
  downstream:
  - target: Extracellular Matrix Remodeling and Growth-Factor Signaling Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered abundance or function of ADAMTS and ADAMTS-like matrix regulators
    - disturbed fibrillin microfibril composition and extracellular-matrix turnover
    description: >-
      Loss or dysfunction of tissue-relevant TSR clients perturbs
      extracellular-matrix assembly and the growth-factor signals controlled by
      that matrix.
- name: Extracellular Matrix Remodeling and Growth-Factor Signaling Dysregulation
  biological_scale: TISSUE
  description: >-
    Altered abundance or extracellular function of ADAMTS/ADAMTSL proteins
    changes fibrillin microfibril composition, matrix remodeling, and the
    availability of matrix-regulated BMP, IHH, and TGF-beta signals. The
    resulting anatomical phenotype is disorder- and tissue-specific; this
    module stops at the conserved matrix/signaling consequence rather than
    treating eye, skeletal, cardiac, or CNS malformations as interchangeable.
  role: consequence
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DYSREGULATED
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35167946
    reference_title: "O-fucosylation of thrombospondin type 1 repeats is essential for ECM remodeling and signaling during bone development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Limb shortening was evident at embryonic day 14.5 where loss of
      O-fucosylation led to an accumulation of fibrillin 2 (FBN2), decreased BMP
      and IHH signaling, and increased TGF-β signaling.
    explanation: >-
      Connects loss of TSR O-fucosylation to fibrillin-matrix and opposing
      growth-factor-signaling changes in developing tissue.
discussions:
- discussion_id: gap_tsr_o_glycosylation_substrate_and_tissue_specificity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired ER Quality Control and Secretion of TSR-Containing Proteins
  - pathophysiology#Selective Depletion or Dysfunction of TSR-Containing Extracellular Proteins
  prompt: >-
    Which TSR-containing proteins actually require POFUT2- and B3GLCT-dependent
    glycosylation for secretion or extracellular function in the human tissues
    affected by disease, and when do C-mannosylation or tissue-specific
    chaperones compensate?
  rationale: >-
    Evidence for glycosylation-dependent secretion exists, but the model system
    changes the answer. POFUT2-null HEK293T assays reduce secretion of multiple
    ADAMTS clients, whereas conditional loss in developing mouse bone had
    minimal effects on ADAMTS17 and CCN2 secretion despite a strong skeletal
    phenotype. Endogenous platelet THBS1 trafficking is preserved in both
    Pofut2- and B3glct-null mice and its TSRs are highly C-mannosylated. These
    findings make direct extrapolation from a generic cell line or one mouse
    tissue to human disease unsafe and are the reason Weill-Marchesani syndrome
    is not yet declared a conformer.
  evidence:
  - reference: PMID:35167946
    reference_title: "O-fucosylation of thrombospondin type 1 repeats is essential for ECM remodeling and signaling during bone development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, we observed minimal effects of the Pofut2 knockout on
      secretion of two POFUT2 substrates, CCN2 or ADAMTS17, in the developing
      bone.
    explanation: >-
      Shows that the in-vivo tissue result does not reproduce the secretion
      defect seen for the same substrate class in generic cultured cells.
  - reference: PMID:36721988
    reference_title: "O-fucosylation of thrombospondin type I repeats is dispensable for trafficking thrombospondin 1 to platelet secretory granules."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, we demonstrated that all three TSRs from platelet THBS1 were
      highly C-mannosylated, which has been shown to stabilize TSRs in vitro.
    explanation: >-
      Identifies a compensating modification in a substrate whose endogenous
      trafficking remains intact after loss of either O-glycosylation enzyme.
  proposed_experiments:
  - experiment_id: exp_tsr_qc_human_tissue_secretome_matrix
    name: Human tissue-specific TSR glycosylation and secretion matrix
    description: >-
      Generate isogenic human chondrocyte, cranial-neural-crest, and
      ocular-mesenchyme models carrying POFUT2 loss, B3GLCT loss, or the ADAMTSL2
      p.Ser641Leu substrate variant. Quantify site-resolved O-fucose,
      glucose-fucose, and C-mannose occupancy together with intracellular and
      secreted TSR-protein abundance, then rescue each perturbation with the
      corresponding wild-type gene or substrate.
    decision_criterion: >-
      A substrate is considered a human-tissue-relevant module client only when
      loss of the relevant glycan reproducibly reduces secretion or extracellular
      function in a disease-relevant lineage and the defect is restored by
      genetic rescue.
    would_support:
    - >-
      Reproducible, rescue-reversible loss of specific TSR clients would define
      which conforming disorders can traverse the selective-depletion node and
      whether their dependence is on POFUT2, B3GLCT, or both.
    would_refute:
    - >-
      Preserved secretion and extracellular function despite verified glycan
      loss would show that the client is compensated in the relevant human
      tissue and should not be used to assert module conformance there.

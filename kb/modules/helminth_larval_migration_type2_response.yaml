name: Helminth Larval Migration and Type 2 Tissue Response Module
category: Module
creation_date: "2026-11-25T00:00:00Z"
module_categories:
- IMMUNOLOGY
- INFECTIOUS_DISEASE
description: >-
  The conserved host response to a tissue-migrating helminth larva. Larvae that
  penetrate and migrate through host tissue injure the epithelial/barrier
  surface, which releases the epithelial alarmins IL-33, TSLP and IL-25 (tuft
  cells are the gut IL-25 source) and activates group 2 innate lymphoid cells
  (ILC2s); ILC2s and recruited Th2 cells then mount a type 2 immune response
  (IL-4, IL-5, IL-13) — the disorder-agnostic, rate-limiting central effector
  and key conformance target — which drives eosinophilia, IgE class-switching
  and mast-cell/basophil expansion, producing eosinophil-rich inflammation
  around the migrating or encysted larvae. The chain is
  trigger (larval tissue migration and epithelial injury) ->
  amplifier (epithelial alarmin release and ILC2 activation) ->
  central_effector (type 2 immune response) ->
  effector (eosinophilia, IgE and mastocytosis) ->
  consequence (eosinophilic tissue inflammation around larvae). A conforming
  disorder substitutes its own migrating larva, its own invaded tissue, and the
  organ-specific eosinophilic lesion (Trichinella nurse-cell myositis;
  Toxocara visceral/ocular larva migrans granulomas). It is complementary to
  granuloma_formation (macrophage/Th1 epithelioid granuloma) and to
  chemical_respiratory_allergy (hapten-driven airway type 2 sensitization):
  this module is the systemic type-2/eosinophilic response specifically to a
  migrating metazoan larva. No pathological-structure (Xogenesis) anchor
  applies; the terminal lesion is eosinophilic inflammation, not a discrete
  named structure.
notes: >-
  Do NOT create a "helminthiasis" or "eosinophilic inflammation" Disease entry
  for this module; it is a shared mechanism, not a disease. Conforming entries
  are specific helminthiases (trichinellosis, toxocariasis, strongyloidiasis,
  ascariasis, hookworm, acute schistosomiasis, loiasis). The type 2 response is
  double-edged: it mediates both host resistance (larval killing) and
  disease-tolerance/tissue-repair, and many helminths actively bias it toward
  regulatory (IL-10/Treg) tolerance to persist — that immunomodulatory arm is
  disorder-specific and is curated on the entry, not here. Evidence here is
  drawn from reviews and from mouse circuit studies (the tuft-cell/ILC2/IL-25
  circuit of PMID:26675736 was defined in mice and humans); a conforming human
  disease must carry its own human evidence for the phenotypes it claims.
pathophysiology:
- name: Helminth Larval Tissue Migration and Epithelial Injury
  role: trigger
  biological_scale: TISSUE
  description: >-
    A helminth larva penetrates and migrates through a host barrier or tissue
    (gut epithelium, and in many species onward through liver, lung, muscle or
    eye), and the mechanical trauma of that passage injures the epithelial and
    stromal surface. This tissue trauma is the initiating signal of the type 2
    response.
  biological_processes:
  - preferred_term: response to wounding
    modifier: INCREASED
    term:
      id: GO:0009611
      label: response to wounding
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  downstream:
  - target: Epithelial Alarmin Release and ILC2 Activation
    description: Barrier injury releases epithelial alarmins that activate ILC2s.
  evidence:
  - reference: PMID:27262918
    reference_title: "Eosinophils in Helminth Infection: Defenders and Dupes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the size and motility of worms is such that tissue trauma is a common feature of infection"
    explanation: Establishes larval tissue trauma as a general feature of helminth infection.
- name: Epithelial Alarmin Release and ILC2 Activation
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    The injured epithelium releases the alarmin cytokines IL-33, TSLP and IL-25
    (in the gut, tuft cells are the constitutive IL-25 source), which activate
    tissue-resident group 2 innate lymphoid cells (ILC2s) to secrete type 2
    cytokines, amplifying the response before and alongside the adaptive Th2
    arm.
  biological_processes:
  - preferred_term: interleukin-25 production
    modifier: INCREASED
    term:
      id: GO:0032629
      label: interleukin-25 production
  cell_types:
  - preferred_term: intestinal tuft cell
    term:
      id: CL:0019046
      label: intestinal tuft cell
  - preferred_term: group 2 innate lymphoid cell
    term:
      id: CL:0001069
      label: group 2 innate lymphoid cell
  downstream:
  - target: Type 2 Immune Response
    description: ILC2 activation drives the type 2 cytokine response.
  evidence:
  - reference: PMID:26675736
    reference_title: Tuft-cell-derived IL-25 regulates an intestinal ILC2-epithelial response circuit.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Experiments in mice and humans have demonstrated requirements for the epithelial cytokines IL-33, thymic stromal lymphopoietin (TSLP) and IL-25 in the activation of ILC2s"
    explanation: Epithelial alarmins IL-33/TSLP/IL-25 activate ILC2s.
  - reference: PMID:26675736
    reference_title: Tuft-cell-derived IL-25 regulates an intestinal ILC2-epithelial response circuit.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "After helminth infection, tuft-cell-derived IL-25 further activates ILC2s to secrete IL-13"
    explanation: Tuft-cell IL-25 activates ILC2s to secrete the type 2 cytokine IL-13 after helminth infection.
- name: Type 2 Immune Response
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Activated ILC2s and recruited CD4+ Th2 cells produce the type 2 cytokines
    IL-4, IL-5 and IL-13. This is the conserved, rate-limiting central effector
    of the module and the key conformance target: every helminthiasis that
    conforms funnels through a type 2 immune response, whatever larva and tissue
    it starts from.
  biological_processes:
  - preferred_term: type 2 immune response
    modifier: INCREASED
    term:
      id: GO:0042092
      label: type 2 immune response
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  - preferred_term: group 2 innate lymphoid cell
    term:
      id: CL:0001069
      label: group 2 innate lymphoid cell
  downstream:
  - target: Eosinophil Expansion and Recruitment
    description: Type 2 cytokines (IL-5) drive eosinophil production and recruitment.
  evidence:
  - reference: PMID:29262347
    reference_title: "Recent Advances in Type-2-Cell-Mediated Immunity: Insights from Helminth Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Type-2-cell-mediated immune responses play a critical role in mediating both host-resistance and disease-tolerance mechanisms during helminth infections."
    explanation: Type 2 immunity is the central host response to helminth infection.
- name: Eosinophil Expansion and Recruitment
  role: effector
  biological_scale: ORGANISM
  description: >-
    IL-5 drives eosinophil production and recruitment, producing the blood and
    tissue eosinophilia that is the central laboratory hallmark of the host
    response to helminth infection. IgE class-switching (IL-4/IL-13) and
    mast-cell/basophil expansion occur in parallel through the same type 2
    cytokines; they are described here in prose rather than bound as node terms,
    because the cited evidence supports the eosinophil arm specifically.
  biological_processes:
  - preferred_term: eosinophil activation
    modifier: INCREASED
    term:
      id: GO:0043307
      label: eosinophil activation
  - preferred_term: eosinophil chemotaxis
    modifier: INCREASED
    term:
      id: GO:0048245
      label: eosinophil chemotaxis
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  downstream:
  - target: Eosinophilic Tissue Inflammation Around Larvae
    description: Recruited eosinophils accumulate around the larvae in tissue.
  evidence:
  - reference: PMID:27262918
    reference_title: "Eosinophils in Helminth Infection: Defenders and Dupes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eosinophilia is a central feature of the host response to helminth infection."
    explanation: Eosinophilia is the hallmark effector of the anti-helminth type 2 response.
- name: Eosinophilic Tissue Inflammation Around Larvae
  role: consequence
  biological_scale: TISSUE
  description: >-
    Eosinophils, mast cells and type 2 effectors accumulate around migrating or
    encysted larvae, producing the eosinophil-rich inflammation seen on
    histology at sites of worm infection. The same infiltrate produces the
    organ-specific pathology (myositis, granuloma, chorioretinitis) in a
    conforming disease.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  evidence:
  - reference: PMID:27262918
    reference_title: "Eosinophils in Helminth Infection: Defenders and Dupes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Early in the study of parasitic disease, histological examination revealed that large numbers of eosinophils infiltrated sites of worm infection"
    explanation: Eosinophils infiltrate the tissue sites of worm infection.

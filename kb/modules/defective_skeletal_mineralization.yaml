name: Defective Skeletal Mineralization Module
description: >-
  A conserved final-common-pathway module for rickets and osteomalacia. Rickets
  is a phenotype, not a mechanism: it is dual-coded in the ontologies (HP:0002748
  and MONDO:0005520) and is reached by at least three mechanistically
  incompatible routes that converge on a single rate-limiting step, failure to
  deposit hydroxyapatite at the mineralization front. The calciopenic arm
  (nutritional vitamin D or dietary calcium deficiency, and the hereditary
  vitamin D-dependent rickets series) lowers calcitriol signalling and intestinal
  calcium absorption, provoking secondary hyperparathyroidism and renal phosphate
  wasting. The phosphopenic arm (FGF23-driven renal phosphate wasting in XLH and
  the other hereditary hypophosphatemic rickets, or proximal tubular phosphate
  loss) removes the phosphate substrate directly, with parathyroid hormone
  normal. The inhibitor-excess arm (hypophosphatasia) leaves substrate supply
  intact but fails to clear inorganic pyrophosphate, a mineralization inhibitor.
  Downstream, the shared consequence is age-dependent: in growing bone the
  hypertrophic chondrocyte layer of the growth plate expands because terminal
  chondrocyte apoptosis is impaired, producing rickets; in the mature skeleton
  the same mineralization failure produces osteomalacia alone.
category: Module
creation_date: "2026-08-19T00:00:00Z"
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a `Rickets`
  Disease entry: MONDO:0005520 is flagged `MONDO:ambiguous` in MONDO itself, is
  axiomatized around decreased circulating vitamin D (RO:0004029 HP:0100512)
  while subsuming the hypophosphatemic branch that is explicitly vitamin
  D-resistant, and is simultaneously the only human MONDO term available for
  common nutritional rickets. Disorder entries reference individual nodes via
  conforms_to (e.g. "defective_skeletal_mineralization#Impaired Hydroxyapatite
  Deposition at the Mineralization Front").

  Conforming nodes substitute the disorder-specific route to mineralization
  failure: absent 1-alpha-hydroxylation (CYP27B1) or 25-hydroxylation (CYP2R1),
  vitamin D receptor resistance (VDR), accelerated calcitriol catabolism
  (CYP3A4), PHEX-FGF23-driven renal phosphate wasting (X-linked
  hypophosphatemia), tubular phosphate loss (hereditary hypophosphatemic rickets
  with hypercalciuria, Fanconi syndrome), impaired TNSALP clearance of inorganic
  pyrophosphate (hypophosphatasia), or the combined phosphate/calcitriol/PTH
  disturbance of chronic kidney disease.

  Scope. This module is deliberately NOT an Xogenesis (pathological
  structure-formation) module: its terminal output is the FAILURE of a normal
  mineralization process, not the formation of a pathological material entity, so
  it carries no OGMS/MPATH anchor stanza. It is also distinct from
  `osteoporosis_bone_resorption`, which models loss of normally mineralized bone
  through a resorption/formation imbalance; here bone matrix is produced in
  normal or increased quantity but is not mineralized. A disorder may conform to
  both.

  Two arms deliberately kept separate. The calciopenic and phosphopenic arms
  differ diagnostically as well as mechanistically: parathyroid hormone is
  elevated in the calciopenic arm and normal in the phosphopenic arm, and
  25-hydroxyvitamin D is low in nutritional and CYP2R1 disease but normal in the
  hypophosphatemic rickets. Do not collapse them into one trigger node in a
  conforming entry.
pathophysiology:
- name: Calciopenic Substrate Deficiency
  description: >-
    Insufficient calcitriol signalling or insufficient dietary calcium reduces
    active intestinal calcium absorption. The resulting fall in serum calcium
    drives secondary hyperparathyroidism, and parathyroid hormone in turn
    increases renal phosphate excretion, so the calciopenic arm ends in a
    combined calcium and phosphate deficit at the mineralization front. This
    single node covers nutritional vitamin D deficiency, dietary calcium
    deficiency, and the hereditary vitamin D-dependent rickets series, which
    differ only in where the calcitriol axis is interrupted.
  role: trigger
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: Vitamin D Receptor Signaling
    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: DECREASED
  - preferred_term: Intestinal Calcium Absorption
    term:
      id: GO:0070509
      label: calcium ion import
    modifier: DECREASED
  evidence:
  - reference: PMID:26745253
    reference_title: Global Consensus Recommendations on Prevention and Management of Nutritional Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vitamin D and calcium deficiencies are common worldwide, causing
      nutritional rickets and osteomalacia, which have a major impact on health,
      growth, and development of infants, children, and adolescents
    explanation: >-
      Establishes vitamin D and calcium deficiency as the calciopenic entry arm
      producing both rickets and osteomalacia. Evidence source is OTHER because
      this is an evidence-based consensus document rather than a primary study.
  downstream:
  - target: Impaired Hydroxyapatite Deposition at the Mineralization Front
    causal_link_type: DIRECT
    description: >-
      Reduced calcium and phosphate availability lowers the calcium-phosphate
      product at the mineralization front below the threshold for hydroxyapatite
      deposition.
- name: Phosphopenic Substrate Deficiency
  description: >-
    Renal phosphate wasting removes the phosphate substrate directly, without an
    antecedent fall in serum calcium. In the hereditary hypophosphatemic rickets
    the wasting is FGF23-driven (PHEX loss of function in X-linked
    hypophosphatemia, FGF23 gain of function in the autosomal dominant form,
    DMP1 and ENPP1 loss in the autosomal recessive forms) and is compounded by
    FGF23 suppression of calcitriol synthesis; in tubular disorders the loss is a
    direct transport defect. Parathyroid hormone is characteristically normal,
    which is what distinguishes this arm from the calciopenic one at the bedside.
  role: trigger
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Kidney Proximal Tubule Epithelial Cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: Phosphate Ion Homeostasis
    term:
      id: GO:0055062
      label: phosphate ion homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:38066669
    reference_title: Impaired Growth Plate Maturation in XLH Is due to Both Excess FGF23 and Decreased 1,25-Dihydroxyvitamin D Signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This increase in FGF23 impairs activation of vitamin D and attenuates renal
      phosphate reabsorption, leading to rickets.
    explanation: >-
      States the FGF23-driven route from renal phosphate wasting to rickets that
      this trigger node represents.
  - reference: PMID:15976027
    reference_title: Hypophosphatemia leads to rickets by impairing caspase-mediated apoptosis of hypertrophic chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The latter model demonstrates normal calcium and parathyroid hormone
      levels, but 1,25-dihydroxyvitamin D levels that are inappropriately low for
      the degree of hypophosphatemia.
    explanation: >-
      Documents the normal calcium and parathyroid hormone that distinguish the
      phosphopenic arm from the calciopenic arm, in the Phex-mutant model of
      X-linked hypophosphatemia.
  downstream:
  - target: Impaired Hydroxyapatite Deposition at the Mineralization Front
    causal_link_type: DIRECT
    description: >-
      Hypophosphatemia lowers the calcium-phosphate product at the mineralization
      front independently of calcium supply.
  - target: Growth Plate Hypertrophic Zone Expansion
    causal_link_type: DIRECT
    description: >-
      Phosphate additionally acts directly on the growth plate, where it is
      required for apoptosis of terminal hypertrophic chondrocytes; this arm does
      not run through matrix mineralization.
- name: Mineralization Inhibitor Excess
  description: >-
    Mineralization can fail with an entirely adequate supply of calcium and
    phosphate if the local inhibitor is not cleared. Tissue-nonspecific alkaline
    phosphatase hydrolyses extracellular inorganic pyrophosphate, a potent
    inhibitor of hydroxyapatite crystal growth; when its activity is deficient,
    pyrophosphate accumulates and blocks mineral deposition. This arm is
    biochemically the mirror image of the other two, since minerals are excluded
    from the skeleton and serum calcium may be high rather than low.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Tissue-Nonspecific Alkaline Phosphatase Activity
    term:
      id: GO:0004035
      label: alkaline phosphatase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:28238808
    reference_title: 'Hypophosphatasia: An overview For 2017.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among them is inorganic pyrophosphate (PPi), a potent inhibitor of
      mineralization.
    explanation: >-
      Identifies the accumulating inhibitor that defines this arm. Evidence
      source is OTHER because this is a review article.
  - reference: PMID:26893260
    reference_title: Hypophosphatasia - aetiology, nosology, pathogenesis, diagnosis and treatment.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In hypophosphatasia, extracellular accumulation of TNSALP natural
      substrates includes inorganic pyrophosphate, an inhibitor of
      mineralization, which explains the dento-osseous and arthritic
      complications featuring tooth loss, rickets or osteomalacia, and calcific
      arthopathies.
    explanation: >-
      Links inhibitor accumulation directly to rickets and osteomalacia, the
      module's shared output. Evidence source is OTHER because this is a review
      article.
  downstream:
  - target: Impaired Hydroxyapatite Deposition at the Mineralization Front
    causal_link_type: DIRECT
    description: >-
      Excess extracellular pyrophosphate blocks hydroxyapatite crystal growth
      despite adequate mineral substrate.
- name: Impaired Hydroxyapatite Deposition at the Mineralization Front
  description: >-
    The rate-limiting, disorder-agnostic step of the module and its key
    conformance target. Osteoid is laid down normally, or in excess, but
    hydroxyapatite is not deposited into it, either because the local
    calcium-phosphate product is too low or because the pyrophosphate inhibitor
    is not cleared. Every conforming disorder funnels through this node
    regardless of which trigger arm it enters by, and it is the step that unifies
    rickets in the growing skeleton with osteomalacia in the mature one.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:

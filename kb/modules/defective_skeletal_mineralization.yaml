    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED
  - preferred_term: Biomineral Tissue Development
    term:
      id: GO:0031214
      label: biomineral tissue development
    modifier: DECREASED
  locations:
  - preferred_term: Bone
    term:
      id: UBERON:0001474
      label: bone element
  evidence:
  - reference: PMID:15976027
    reference_title: Hypophosphatemia leads to rickets by impairing caspase-mediated apoptosis of hypertrophic chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rickets is seen in association with vitamin D deficiency and in several
      genetic disorders associated with abnormal mineral ion homeostasis.
    explanation: >-
      States the convergence this node models: unrelated nutritional and genetic
      lesions produce the same mineralization phenotype.
  - reference: PMID:28238808
    reference_title: 'Hypophosphatasia: An overview For 2017.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Superabundance of extracellular PPi explains the hard tissue complications
      of HPP that feature premature loss of deciduous teeth and often rickets or
      osteomalacia as well as calcific arthropathies in some affected adults.
    explanation: >-
      Shows the inhibitor-excess arm reaching the same mineralization endpoint,
      with the age-dependent split into rickets and osteomalacia. Evidence source
      is OTHER because this is a review article.
  downstream:
  - target: Growth Plate Hypertrophic Zone Expansion
    causal_link_type: DIRECT
    description: >-
      In the growing skeleton the mineralization defect is expressed at the
      growth plate.
  - target: Rickets and Osteomalacia
    causal_link_type: DIRECT
    description: >-
      Undermineralized osteoid accumulates throughout the skeleton, producing
      osteomalacia at any age.
- name: Growth Plate Hypertrophic Zone Expansion
  description: >-
    The growth-plate lesion that makes rickets a disease of growing bone. Terminal
    hypertrophic chondrocytes normally undergo apoptosis before vascular invasion
    and ossification of the cartilage template. Phosphate is required for that
    apoptotic step, so when it is deficient the late hypertrophic layer fails to
    involute and expands, giving the widened, irregular, cupped and frayed
    metaphysis that defines rickets radiographically. An adult with an identical
    mineralization defect and closed growth plates develops osteomalacia without
    this lesion.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Hypertrophic Chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: Hypertrophic Chondrocyte Apoptosis
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: DECREASED
  - preferred_term: Growth Plate Cartilage Development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: ABNORMAL
  locations:
  - preferred_term: Growth Plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  evidence:
  - reference: PMID:15976027
    reference_title: Hypophosphatemia leads to rickets by impairing caspase-mediated apoptosis of hypertrophic chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our studies demonstrate that normal phosphorus levels are required for
      growth plate maturation and implicate a critical role for
      phosphate-regulated apoptosis of hypertrophic chondrocytes via activation
      of the caspase-9-mediated mitochondrial pathway.
    explanation: >-
      Establishes impaired phosphate-dependent hypertrophic chondrocyte apoptosis
      as the cellular basis of the rachitic growth plate.
  - reference: PMID:15976027
    reference_title: Hypophosphatemia leads to rickets by impairing caspase-mediated apoptosis of hypertrophic chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The observation that normalization of mineral ion homeostasis in the
      VDR-null mice prevents rachitic changes suggests that rickets is secondary
      to hypocalcemia, hypophosphatemia, or hyperparathyroidism, rather than
      impaired VDR action.
    explanation: >-
      Shows the growth-plate lesion is downstream of the mineral-ion disturbance
      itself rather than of any one upstream receptor defect, which is what makes
      this node shared across the module's trigger arms.
  downstream:
  - target: Rickets and Osteomalacia
    causal_link_type: DIRECT
    description: >-
      Expansion and disorganization of the hypertrophic zone is the growth-plate
      substrate of clinical rickets.
- name: Rickets and Osteomalacia
  description: >-
    The shared clinical output: soft, undermineralized bone presenting as rickets
    where growth plates are open and as osteomalacia where they are closed, with
    bone pain, deformity of the weight-bearing long bones, fracture and
    pseudofracture, growth failure and myopathy. Individual conforming disorders
    add their own disorder-specific features (alopecia in vitamin D-dependent
    rickets type 2A, premature deciduous tooth loss in hypophosphatasia, dental
    abscess in X-linked hypophosphatemia); this node carries only the
    mineralization phenotype the arms share.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26745253
    reference_title: Global Consensus Recommendations on Prevention and Management of Nutritional Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickets, osteomalacia, and vitamin D and calcium deficiencies are
      preventable global public health problems in infants, children, and
      adolescents.
    explanation: >-
      Records that the module's terminal phenotype is a common global problem in
      its nutritional form, not a rare-disease endpoint. Evidence source is OTHER
      because this is an evidence-based consensus document.
  - reference: PMID:26893260
    reference_title: Hypophosphatasia - aetiology, nosology, pathogenesis, diagnosis and treatment.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypophosphatasia was the last type of rickets or osteomalacia to await a
      medical treatment.
    explanation: >-
      Treats rickets/osteomalacia as a class of which the individual disorders are
      types, which is the relationship this module formalizes. Evidence source is
      OTHER because this is a review article.
treatments:
- name: Asfotase Alfa Enzyme Replacement
  description: >-
    Bone-targeted recombinant tissue-nonspecific alkaline phosphatase. It acts on
    the inhibitor-excess arm specifically, restoring hydrolysis of extracellular
    inorganic pyrophosphate so that mineralization can proceed. Included here as
    the module's worked drug-target pattern; it is arm-specific and is NOT
    inherited as a treatment recommendation by disorders conforming through the
    calciopenic or phosphopenic arms, where pyrophosphate is not the problem.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: asfotase alfa
      term:
        id: NCIT:C169788
        label: Asfotase Alfa
  target_mechanisms:
  - target: Mineralization Inhibitor Excess
    treatment_effect: INHIBITS
    description: >-
      Replacing tissue-nonspecific alkaline phosphatase activity clears the
      accumulated pyrophosphate that blocks hydroxyapatite crystal growth.
    evidence:
    - reference: PMID:26893260
      reference_title: Hypophosphatasia - aetiology, nosology, pathogenesis, diagnosis and treatment.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Now, significant successes for severely affected paediatric patients are
        recognized using asfotase alfa, a bone-targeted recombinant TNSALP.
      explanation: >-
        Documents enzyme replacement acting on the deficient enzyme that defines
        the inhibitor-excess trigger node. Evidence source is OTHER because this
        is a review article.
discussions:
- discussion_id: human_model_mismatch_caspase9_growth_plate_apoptosis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Growth Plate Hypertrophic Zone Expansion
  prompt: >-
    Does the caspase-9-dependent, phosphate-regulated apoptosis of terminal
    hypertrophic chondrocytes that produces the rachitic growth plate in mice
    also operate in human rickets?
  rationale: >-
    The cellular mechanism of this node rests on murine genetics: VDR-null,
    Phex-mutant and diet-induced hypophosphatemic mice, with pharmacological
    caspase-9 inhibition used to confirm the pathway in vivo. Human evidence for
    rickets is radiographic and histological rather than mechanistic, and no
    human study demonstrates the caspase-9 step. The direction of the finding
    matters for the module because it is what licenses the direct
    phosphate-to-growth-plate edge that bypasses matrix mineralization; if the
    human growth plate depended only on the mineralization front, that edge would
    not be warranted.
  proposed_experiments:
  - experiment_id: exp_human_rachitic_growth_plate_chondrocyte_apoptosis
    name: Terminal hypertrophic chondrocyte apoptosis in human rachitic growth plate
    description: >-
      Assess apoptotic index and caspase-9 activation in hypertrophic chondrocytes
      of growth-plate tissue from children with rickets of defined calciopenic and
      phosphopenic aetiology, against age-matched controls.
- discussion_id: knowledge_gap_local_calcium_phosphate_product_threshold
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Hydroxyapatite Deposition at the Mineralization Front
  prompt: >-
    Is there a quantitative threshold of the local calcium-phosphate product below
    which mineralization fails, and is it the same across the calciopenic and
    phosphopenic arms?
  rationale: >-
    The module asserts that both substrate-deficiency arms converge by lowering
    the calcium-phosphate product at the mineralization front, but the convergence
    is stated qualitatively. Neither arm's clinical literature reports a local
    threshold, and serum measurements are an imperfect proxy for the concentration
    at the mineralization front. Without it, the module cannot predict which
    combinations of calcium and phosphate deficit produce rickets.

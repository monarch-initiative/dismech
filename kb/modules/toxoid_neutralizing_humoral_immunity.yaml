name: toxoid_neutralizing_humoral_immunity
description: >-
  Conserved mechanism by which vaccination with chemically or genetically
  detoxified bacterial exotoxins (toxoids, such as formaldehyde-inactivated
  diphtheria toxoid, tetanus toxoid, or pertussis toxoid) elicits systemic
  high-affinity neutralizing IgG antibodies (antitoxins) that bind the
  receptor-binding or translocation domains of secreted AB-type bacterial
  toxins. By sterically blocking toxin engagement of host cell-surface receptors
  and subsequent endocytosis, circulating antitoxin IgG prevents toxin-mediated
  organ pathology (such as diphtheria myocarditis, tetanus spastic paralysis,
  and pertussis leukocytosis) even when mucosal colonization by the toxigenic
  bacterium is only partially reduced.
category: Pathophysiology
pathophysiology:
- name: Toxoid Antigen Presentation and Germinal Center Antitoxin IgG Maturation
  role: trigger
  description: >-
    Chemical detoxification (classically with formalin and heat) or genetic
    inactivation abolishes the enzymatic and cytopathic toxicity of secreted
    bacterial exotoxins while preserving native conformational epitopes.
    Intramuscular immunization with adjuvanted toxoid primes CD4+ T-cell-dependent
    germinal center reactions that generate long-lived plasma cells and memory
    B cells secreting high-affinity toxin-specific IgG antibodies.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: INCREASED
    term:
      id: GO:0002250
      label: adaptive immune response
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:39841756
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1923 began the era of human toxoid vaccination, after Gaston Ramon demonstrated that formalin combined with heat eliminated the toxicity of the diphtheria toxin without altering its antigenicity or immunogenicity, thus introducing the anatoxin (generally called toxoid) principle."
    explanation: Establishes the foundational toxoid principle whereby formalin inactivation eliminates exotoxin toxicity while preserving immunogenicity.
  - reference: PMID:39841756
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the 1940s, diphtheria toxoid, tetanus toxoid and pertussis antigens were combined in the diphtheria-tetanus-pertussis vaccine, still used widely throughout the world."
    explanation: Documents the conserved clinical deployment of combined diphtheria, tetanus, and pertussis toxoid antigens to elicit systemic antitoxin immunity.
  downstream:
  - target: Neutralizing Antitoxin IgG Blockade of Exotoxin Receptor Binding
    description: Circulating antitoxin IgG binds secreted bacterial exotoxins in interstitial fluid and blood, sterically blocking host receptor engagement
- name: Neutralizing Antitoxin IgG Blockade of Exotoxin Receptor Binding
  role: consequence
  description: >-
    Circulating neutralizing IgG antitoxin antibodies bind the receptor-binding
    (B) or translocation domains of secreted bacterial exotoxins in interstitial
    tissues and blood, sterically preventing toxin attachment to host cell-surface
    receptors (such as proHB-EGF for diphtheria toxin or neuronal gangliosides
    and synaptic receptors for tetanus neurotoxin) and arresting systemic
    toxin-driven disease while permitting asymptomatic mucosal carriage unless
    antibacterial immunity is also present.
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
  evidence:
  - reference: PMID:23940209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further established that our lead candidate hMAb binds to the receptor-binding domain of diphtheria toxin and physically blocks the toxin from binding to the putative receptor, heparin-binding epidermal growth factor-like growth factor."
    explanation: Demonstrates the molecular mechanism of antitoxin IgG neutralization via steric blockade of the exotoxin receptor-binding domain.
  - reference: PMID:35333944
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most toxin neutralizing humAbs bind the HC receptor binding part of TeNT thus preventing binding (step 1), but one of them recognized domain HN preventing step 3)"
    explanation: Shows that neutralizing human antibodies against tetanus neurotoxin similarly target the heavy-chain receptor-binding and translocation domains to prevent host cell entry.
  - reference: PMID:39841756
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large meta-analysis of clinical studies of diphtheria estimated that the receipt of three doses of diphtheria toxoid vaccine was 87% effective against symptomatic disease and reduced transmission by 60%."
    explanation: Quantifies clinical protection against symptomatic toxin-mediated disease conferred by three-dose toxoid immunization.
  - reference: PMID:39841756
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, vaccinated individuals can become colonised and transmit; vaccination alone was estimated to interrupt transmission in only 28% of outbreak settings analysed in this meta-analysis, making isolation and antibiotics essential."
    explanation: Highlights the characteristic decoupling of antitoxin protection against systemic toxin pathology from complete sterilization of mucosal bacterial colonization.

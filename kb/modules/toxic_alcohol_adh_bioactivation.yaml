name: Toxic Alcohol Alcohol-Dehydrogenase Bioactivation Module
category: Module
creation_date: "2026-10-08T00:00:00Z"
module_categories:
- TOXICOLOGY
- PHARMACOLOGY
- METABOLISM
description: >-
  A conserved metabolic-bioactivation module for the toxic alcohols and glycols,
  in which the ingested compound is comparatively inert and the poisoning is
  caused by what the body makes of it. Alcohol dehydrogenase oxidizes the parent
  alcohol, a second oxidation by an aldehyde dehydrogenase yields a toxic organic
  acid, and that acid produces both a shared high anion gap metabolic acidosis
  and an organ injury whose site is decided by which acid was generated: formate
  from methanol injures the retina, optic nerve, and putamen; oxalate from
  ethylene glycol crystallizes in the renal proximal tubule; diglycolic acid from
  diethylene glycol is concentrated into the same tubule by a dicarboxylate
  transporter. The key conformance target is `Alcohol Dehydrogenase Bioactivation
  of the Parent Alcohol`, the disorder-agnostic rate-limiting step every
  conformer funnels through whichever parent compound was taken. Uniquely among
  dismech toxicology modules, the drug-target pattern is the module's defining
  feature rather than an addition to it: fomepizole and ethanol both act by
  competitive inhibition at exactly that node, so three chemically distinct
  poisonings share one antidote, and hemodialysis is modelled one step
  downstream because it clears the parent and the acid together. This module and
  `xenobiotic_oxidative_phosphorylation_blockade` are complementary halves of
  the same story for two of its conformers: this one explains how the
  respiratory-chain inhibitor comes to exist, and that one explains what the
  inhibitor then does, which is why `Methanol_Poisoning` and
  `Diethylene_Glycol_Poisoning` legitimately conform to both while
  `Ethylene_Glycol_Poisoning` conforms only to this one. It is distinct from
  `metabolic_intoxication_decompensation`, where a germline enzyme defect causes
  an endogenous metabolite to accumulate; here the enzyme is working normally
  and the substrate is exogenous, which inverts the therapeutic logic from
  replacing enzyme function to blocking it.
notes: >-
  This is a mechanism module, not a specific disease. Do NOT create a "Toxic
  Alcohol Poisoning" Disease entry. Disorder entries reference individual nodes
  via conforms_to, for example
  "toxic_alcohol_adh_bioactivation#Alcohol Dehydrogenase Bioactivation of the
  Parent Alcohol". Conforming nodes substitute the parent compound, the acid it
  is oxidized to, and the organ that acid injures.

  Scope: the agent must require oxidation by alcohol dehydrogenase before it is
  toxic. This excludes ethanol itself, whose acute toxicity is largely the
  parent compound acting on the central nervous system, and it excludes
  isopropanol, whose metabolite acetone is a depressant rather than an acid. The
  general review cited at the trigger node draws exactly that line, excluding
  isopropanol from the metabolite-driven mechanism, so the exclusion is sourced
  rather than assumed. Formaldehyde is likewise out of scope as a parent: it
  enters as the aldehyde, so it bypasses the alcohol dehydrogenase step and is
  oxidized to formate by a glutathione-dependent route instead. It is a
  near-conformer that shares everything downstream of this module's central
  effector while skipping the node the module is named for, and it is
  deliberately not wired here.

  The parent compound is described as having latent rather than absent
  toxicity. Methanol does produce early central nervous system depression before
  any metabolite accumulates, and the glycols raise the serum osmolal gap while
  still unmetabolized. The claim of the trigger node is that the
  organ-destroying toxicity requires metabolism, not that the parent is inert in
  every respect.

  Why the aldehyde step is one node with the acid accumulation rather than its
  own: the three conformers model it inconsistently. Methanol separates alcohol
  dehydrogenase oxidation to formaldehyde from the subsequent oxidation to
  formate; ethylene glycol bundles bioactivation into a single node; diethylene
  glycol separates 2-hydroxyethoxyacetic acid from diglycolic acid formation. A
  module node per sub-step would therefore conform cleanly to only one of them.
  The second oxidation is bound here through its aldehyde dehydrogenase molecular
  function so the step remains queryable without forcing a node granularity the
  conformers do not share.

  The acidosis node carries no ontology binding. There is no GO process term for
  a high anion gap metabolic acidosis, and GO:0030641 regulation of cellular pH
  is both the wrong scale, being cellular where this is systemic, and absent
  from the committed term cache. Following the ontology term contract, no term
  is better than a bad one, and the claim is carried in prose. If a suitable
  term is identified later this node is the place to add it.
pathophysiology:
- name: Exposure to a Toxic Alcohol or Glycol with Latent Toxicity
  description: >-
    A toxic alcohol or glycol is ingested, usually as an adulterated beverage,
    an automotive or industrial fluid, or a contaminated medicine. The parent
    compound is rapidly absorbed and distributed but is comparatively inert: it
    raises the serum osmolal gap and may depress the central nervous system,
    while the organ-destroying toxicity is still latent and requires
    metabolism. This latency is why these poisonings present late, why an
    antidote given early works at all, and why the osmolal gap precedes the
    anion gap.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The effects of these substances, except for isopropanol and possibly
      alcoholic ketoacidosis, are due to their metabolites, which can cause
      metabolic acidosis and cellular dysfunction.
    explanation: >-
      Review covering the toxic alcohols as a class; no primary experimental
      system. States the premise of this node and of the module, that harm comes
      from the metabolites rather than the ingested compound, and draws the
      scope line this module adopts by excluding isopropanol from that pattern.
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that the mechanism for the target organ toxicity
      results from metabolites of DEG, and not DEG itself nor formation of EG
      from DEG
    explanation: >-
      Rat dosing study comparing the parent compound against its metabolites
      with and without metabolic inhibition. Establishes experimentally that the
      parent compound is not the toxic species, which is the specific claim this
      node makes and which a clinical review can only assert.
  - reference: PMID:12216995
    reference_title: American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      The absorption of methanol following oral administration is rapid and peak
      methanol concentrations occur within 30-60minutes.
    explanation: >-
      Practice guideline; no primary experimental system. Graded INDIRECT
      because it establishes only that the parent compound is absorbed fast,
      which supports the latency claim by contrast with the delayed clinical
      presentation rather than by asserting latency directly.
  downstream:
  - target: Alcohol Dehydrogenase Bioactivation of the Parent Alcohol
    causal_link_type: DIRECT
    description: >-
      The absorbed parent alcohol becomes a substrate for alcohol dehydrogenase,
      which begins the oxidation that creates the toxic species.
- name: Alcohol Dehydrogenase Bioactivation of the Parent Alcohol
  description: >-
    Alcohol dehydrogenase oxidizes the parent alcohol to its corresponding
    aldehyde. This is the rate-limiting, disorder-agnostic step of the module and
    the key conformance target: methanol to formaldehyde, ethylene glycol to
    glycolaldehyde, diethylene glycol to its aldehyde, all by the same enzyme.
    It is also the only node in the chain at which the poisoning can be
    prevented rather than managed, which is why both antidotes act here and
    why one enzyme inhibitor serves three chemically unrelated ingestions.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: alcohol dehydrogenase (NAD+) activity
    term:
      id: GO:0004022
      label: alcohol dehydrogenase (NAD+) activity
    modifier: INCREASED
  evidence:
  - reference: PMID:12216995
    reference_title: American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Methanol is oxidized by alcohol dehydrogenase to formaldehyde.
    explanation: >-
      Practice guideline; no primary experimental system. States the enzymatic
      step this node represents, naming both the enzyme and the aldehyde
      product, for the exemplar parent alcohol.
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Administration of fomepizole or ethanol to inhibit alcohol dehydrogenase,
      a critical enzyme in metabolism of the alcohols, is beneficial in
      treatment of ethylene glycol and methanol intoxication
    explanation: >-
      Review covering the toxic alcohols as a class; no primary experimental
      system. Graded INDIRECT because it is a therapeutic response cited as
      validation of the mechanism it targets: benefit from inhibiting the enzyme
      implies the enzyme is on the causal path, which is the inference this node
      rests on. It is the evidence that the step is shared across more than one
      parent compound, which a single-agent paper cannot establish.
  downstream:
  - target: Sequential Oxidation to the Toxic Organic Acid Metabolite
    causal_link_type: DIRECT
    description: >-
      The aldehyde produced here is oxidized onward to the organic acid that
      carries the toxicity.
- name: Sequential Oxidation to the Toxic Organic Acid Metabolite
  description: >-
    An aldehyde dehydrogenase oxidizes the aldehyde to the corresponding organic
    acid, which accumulates because it is generated faster than it is cleared.
    This acid is the toxic species: formate from methanol, glycolate and then
    oxalate from ethylene glycol, 2-hydroxyethoxyacetic acid and then diglycolic
    acid from diethylene glycol. Both the shared acidosis and the
    organ-specific injury follow from it, so the identity of the acid is what
    decides which organ is destroyed while the acidosis stays common to all.
  role: amplifier
  biological_scale: ORGANISM
  molecular_functions:
  - preferred_term: aldehyde dehydrogenase (NAD+) activity
    term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: organic acid metabolic process
    term:
      id: GO:0006082
      label: organic acid metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:12216995
    reference_title: American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      In cases of methanol poisoning, formic acid accumulates and there is a
      direct correlation between the formic acid concentration and increased
      morbidity and mortality.
    explanation: >-
      Practice guideline; no primary experimental system. Supports both halves of
      this node for the exemplar agent: that the acid accumulates, and that its
      concentration tracks clinical harm, which is what identifies it as the
      toxic species rather than an incidental product.
  - reference: PMID:12216995
    reference_title: American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The oxidation of formaldehyde to formic acid is facilitated by
      formaldehyde dehydrogenase.
    explanation: >-
      Same guideline. Names the second oxidation step itself, which is the
      enzymatic transition this node represents and the reason an aldehyde
      dehydrogenase molecular function is bound here.
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After low and high doses of DEG, 2-hydroxyethoxyacetic acid (HEAA) was the
      primary metabolite in the urine, with only minor amounts of urinary
      diglycolic acid (DGA).
    explanation: >-
      Rat dosing study with urinary metabolite quantification. Documents the
      sequential acid metabolites for a second parent compound, and shows the
      quantitatively dominant metabolite need not be the toxic one, which is why
      this node is written around the acid's identity rather than its amount.
  - reference: PMID:18696123
    reference_title: Hyperoxaluria after ethylene glycol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The plasma oxalate level, however, rose to a maximum of 89 micromol/l
      (normal <6.3 +/- 1.1) on day 3 and only normalized on day 7 after
      ingestion.
    explanation: >-
      Serial plasma oxalate measurement in a poisoned patient. Quantifies the
      accumulation of a third acid metabolite in a human, and its slow
      normalization over days supports accumulation outpacing clearance, which
      is the mechanism this node asserts.
  downstream:
  - target: High Anion Gap Metabolic Acidosis
    causal_link_type: DIRECT
    description: >-
      The accumulating organic acid dissociates, consuming bicarbonate and
      adding an unmeasured anion.
  - target: Metabolite-Specific Target Organ Injury
    causal_link_type: DIRECT
    description: >-
      The same acid acts on the tissue that concentrates or is sensitive to it,
      which is what makes the injury site specific to the parent compound.
- name: High Anion Gap Metabolic Acidosis
  description: >-
    The accumulating organic acid dissociates, consuming bicarbonate and leaving
    an unmeasured anion, so serum bicarbonate falls and the anion gap widens.
    This is the shared systemic consequence of the module and the finding that
    brings these patients to attention. Its diagnostic value lies in the
    sequence: while the parent alcohol is unmetabolized the osmolal gap is
    raised and the anion gap is not, and the two cross over as bioactivation
    proceeds, so the pair of gaps reports how far along this chain a patient
    is. The acidosis also worsens the injury it accompanies, since a lower pH
    increases the diffusion of the undissociated acid into cells.
  role: effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Accumulation of the alcohols in the blood can cause an increment in the
      osmolality, and accumulation of their metabolites can cause an increase in
      the anion gap and a decrease in serum bicarbonate concentration.
    explanation: >-
      Review covering the toxic alcohols as a class; no primary experimental
      system. Supports this node and the osmolal-to-anion-gap sequence in one
      sentence, attributing the osmolal gap to the parent compound and the anion
      gap specifically to the metabolites.
  - reference: PMID:12216995
    reference_title: American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The acidosis observed in methanol poisoning appears to be caused directly
      or indirectly by formic acid production.
    explanation: >-
      Practice guideline; no primary experimental system. Attributes the acidosis
      to the acid metabolite rather than to the ingested alcohol, which is the
      causal direction of the edge into this node.
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rats treated with high-dose DEG had metabolic acidosis, increased BUN and
      creatinine, and marked kidney necrosis, noted by histopathology.
    explanation: >-
      Rat dosing study with biochemistry and histopathology. Shows the acidosis
      and the organ injury arising together in a controlled experiment for a
      second parent compound, which supports both this node and the edge onward
      to organ injury.
  downstream:
  - target: Metabolite-Specific Target Organ Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic acidosis increases the intracellular delivery of the
      undissociated acid and potentiates its cytotoxicity, worsening the organ
      injury the same metabolite is causing directly.
- name: Metabolite-Specific Target Organ Injury
  description: >-
    The outcome of the module, and the point at which a single shared mechanism
    produces three different diseases. The acid decides the organ: formate
    inhibits cytochrome c oxidase and injures the retina, optic nerve, and
    putamen; oxalate precipitates as calcium oxalate monohydrate in the renal
    proximal tubule and kills the epithelium; diglycolic acid is carried into
    that same tubule by a dicarboxylate transporter and depletes its ATP. The
    strongest evidence that the divergence is downstream of a shared step is
    therapeutic, since one enzyme inhibitor given early prevents both the renal
    failure of one poisoning and the visual injury of another.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:27147840
    reference_title: "Treatment of patients with ethylene glycol or methanol poisoning: focus on fomepizole."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Administered early, fomepizole prevents EG-related renal failure and
      methanol-related visual and neurological injuries.
    explanation: >-
      Review of the antidote across both poisonings; no primary experimental
      system. Graded INDIRECT because it is a therapeutic response cited as
      validation of the mechanism. It is the key evidence for this node's
      structure: one inhibitor of one shared enzyme prevents two different
      organ injuries, which places the divergence downstream of that shared step
      rather than at separate mechanisms.
  - reference: PMID:21192754
    reference_title: Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Formic acid is implicated in the optic nerve damage associated with
      methanol.
    explanation: >-
      Review of delayed neurological outcomes across all three poisonings; no
      primary experimental system. Attributes the visual injury to the acid
      metabolite specifically, which is the metabolite-to-organ assignment this
      node makes for methanol.
  - reference: PMID:18696123
    reference_title: Hyperoxaluria after ethylene glycol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both lead to calcium-oxalate oversaturation and hence to the risk of local
      (renal) or systemic crystal deposition.
    explanation: >-
      Clinical report with plasma oxalate measurement. Gives the renal arm of
      this node, in which the acid metabolite reaches the organ as a
      precipitating crystal rather than as a diffusible inhibitor.
  - reference: PMID:15695020
    reference_title: The cytotoxicity of oxalate, metabolite of ethylene glycol, is due to calcium oxalate monohydrate formation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      These results demonstrate that COM crystals, and not the oxalate ion, are
      responsible for the membrane damage and cell death observed in normal
      human and rat PT cells
    explanation: >-
      Human and rat proximal tubule cells in culture, comparing the dissolved
      ion against the crystal. Identifies the injurious species precisely, and
      is the reason this node describes oxalate as acting by precipitation
      rather than as a soluble toxin.
treatments:
- name: Competitive Alcohol Dehydrogenase Inhibition (Fomepizole)
  description: >-
    Fomepizole competitively inhibits alcohol dehydrogenase, so the parent
    alcohol is not oxidized and the toxic acid is never generated. It is the
    worked example of this module's drug-target pattern, and the pattern is
    unusually clean: because the antidote acts at the shared central effector
    rather than on any agent-specific step, one drug treats methanol, ethylene
    glycol, and diethylene glycol poisoning alike. Given before the acid has
    accumulated it prevents the disease rather than treating it, which is why
    the therapeutic window is set by the bioactivation rate and not by the
    severity on arrival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fomepizole
      term:
        id: CHEBI:5141
        label: fomepizole
  target_mechanisms:
  - target: Alcohol Dehydrogenase Bioactivation of the Parent Alcohol
    treatment_effect: INHIBITS
    description: >-
      Blocking the enzyme at the central effector node prevents generation of the
      toxic acid, which is the only point in this chain at which the poisoning
      can be averted rather than managed.
    evidence:
    - reference: PMID:27147840
      reference_title: "Treatment of patients with ethylene glycol or methanol poisoning: focus on fomepizole."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        Fomepizole, a potent alcohol dehydrogenase (ADH) inhibitor, is an
        efficient and safe antidote that prevents or reduces toxic EG and
        methanol metabolism.
      explanation: >-
        Review of the antidote; no primary experimental system. Names the
        molecular target and states that the effect is prevention of the toxic
        metabolism itself, which is what makes this a central-effector
        intervention across more than one parent compound.
  evidence:
  - reference: PMID:11172179
    reference_title: Fomepizole for the treatment of methanol poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In response to fomepizole, plasma formic acid concentrations fell and
      metabolic abnormalities resolved in all patients.
    explanation: >-
      Clinical series with serial plasma acid measurement during treatment.
      Confirms in humans that inhibiting the enzyme lowers the acid metabolite
      and corrects the biochemistry, linking the intervention to the two nodes
      downstream of its target.
- name: Competitive Substrate Saturation of Alcohol Dehydrogenase (Ethanol)
  description: >-
    Ethanol occupies alcohol dehydrogenase as a competing substrate with higher
    affinity than the toxic alcohols, so it blocks the same node as fomepizole by
    a different route. It is retained in the module because it is the fallback
    where fomepizole is unavailable, which is the situation in many of the mass
    poisonings these agents cause, and because the pair makes the point that the
    module's target is the enzyme rather than any particular drug.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ethanol
      term:
        id: CHEBI:16236
        label: ethanol
  target_mechanisms:
  - target: Alcohol Dehydrogenase Bioactivation of the Parent Alcohol
    treatment_effect: INHIBITS
    description: >-
      Saturating the enzyme with a competing substrate slows oxidation of the
      parent alcohol, acting at the same node as the dedicated inhibitor.
    evidence:
    - reference: PMID:1469176
      reference_title: Methanol poisoning.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        administration of enteral or parenteral ethanol to competitively inhibit
        the metabolic breakdown of methanol to formic acid.
      explanation: >-
        Clinical review; no primary experimental system. States the mechanism as
        competitive inhibition of the oxidation step, which places this
        treatment at the same node as fomepizole.
- name: Extracorporeal Removal of the Parent Alcohol and Its Acid (Hemodialysis)
  description: >-
    Hemodialysis clears both the unmetabolized parent alcohol and the acid
    metabolite, and corrects the acidosis at the same time. It is modelled one
    step downstream of the antidotes because it removes the substrate and the
    product rather than blocking the enzyme, and it is the intervention that
    remains useful once bioactivation has already happened, which is the common
    situation given how late these poisonings present.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Sequential Oxidation to the Toxic Organic Acid Metabolite
    treatment_effect: INHIBITS
    description: >-
      Clearing both the parent alcohol and the accumulated acid removes the
      substrate for further oxidation and the toxic species already generated.
    evidence:
    - reference: PMID:1469176
      reference_title: Methanol poisoning.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        Hemodialysis accelerates the elimination of both methanol and formic
        acid and also assists in correction of the metabolic acidosis.
      explanation: >-
        Clinical review; no primary experimental system. States that the
        procedure removes the parent compound and the acid metabolite together,
        which is why it is modelled against the acid-generating node rather than
        against the enzyme.

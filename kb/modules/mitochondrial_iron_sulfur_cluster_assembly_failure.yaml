name: Mitochondrial Iron-Sulfur Cluster Assembly Failure
category: Module
creation_date: "2026-11-19T04:30:00Z"
module_categories:
- METABOLISM
- NEUROSCIENCE
description: >
  A conserved mechanism module for inherited failure of the mitochondrial iron-sulfur
  (ISC) cluster assembly machinery. The shared chain has three steps and no more: a
  lesion in an ISC assembly factor reduces the nascent cluster supply, that in turn
  reduces cluster delivery to client apoproteins (the key conformance target, the
  rate-limiting and disorder-agnostic step every conformer funnels through), and the
  client enzymes that depend on the cofactor lose activity. The module covers the
  machinery, not the client apoenzymes: a disease of lipoyl synthase, of a lipoyl
  transferase, or of a succinate dehydrogenase subunit is downstream of this chain and
  conforms to the client-deficiency node at most, never to the central effector.
  Which clients fail is gene-specific, so the module splits below the client node into
  three sibling effector branches, and a conforming entry declares the ones its disease
  shows rather than all of them: respiratory chain complexes (I, II and III in varying
  combinations), mitochondrial aconitase, and lipoyl synthase, whose failure strips the
  lipoyl cofactor from the 2-oxoacid dehydrogenases and the glycine cleavage system and
  so produces the lactic acidosis with hyperglycinemia that defines the multiple
  mitochondrial dysfunctions syndromes. A fourth, optional branch is erythroid: a
  cluster-free iron regulatory protein 1 represses ALAS2 translation and blocks heme
  synthesis, giving congenital sideroblastic anemia.
  Two boundaries are deliberate and load-bearing. Mitochondrial iron accumulation and
  iron regulatory protein 1 activation are **optional**, not core: iron accumulation is
  reported absent in FDX2 patient muscle, and the protein-level activation of iron
  regulatory protein 1 has been demonstrated directly for GLRX5 rather than across the
  pathway, so a conformer must not be assumed to show them. And the export step to the
  cytosolic assembly pathway, the ABCB7 lesion, is a sibling mechanism rather than part
  of this one: nothing in the mitochondrial machinery fails there, so an ABCB7 disease
  conforms to no node of this module.
notes: >-
  This is a mechanism module, not a disease. Disorder entries reference individual nodes
  through `conforms_to`, for example
  "mitochondrial_iron_sulfur_cluster_assembly_failure#Reduced Cluster Delivery to Client
  Apoproteins", which is the key conformance target.
  Do NOT create a disease entry for this module, and do not conform a disease to it on
  the strength of a shared label. Positive conformance to the central effector requires
  the lesion to be in the assembly machinery itself, and an entry that conforms should
  substitute its own gene's factor at the trigger node and declare only the client
  branches its disease demonstrates.
  What must NOT conform: a disease of a client apoenzyme (LIAS, LIPT1, LIPT2, a
  succinate dehydrogenase subunit), which is downstream of the whole chain; a
  complex-specific assembly factor disease, which does not touch cluster supply; and a
  cytosolic assembly or export disease (ABCB7, CIAO1, MMS19), whose mitochondrial
  machinery is intact. CIAO1 disease is the clearest case: the mitochondrial ISC
  proteins, cellular iron regulation and mitochondrial aconitase are all normal there,
  and the mitochondrial changes are secondary.
  The gene-to-branch mapping is uneven in the literature rather than in biology: for
  several genes a given branch has simply not been looked for. Absence of a reported
  finding is not evidence that a branch is spared, with the single exception of
  mitochondrial iron accumulation in FDX2, where absence was measured and reported.
pathophysiology:
- name: Iron-Sulfur Cluster Assembly Factor Lesion
  description: >
    Biallelic loss of function in a factor of the mitochondrial ISC machinery. Conforming
    entries substitute their own gene at this node. The machinery divides into an early
    group that builds the nascent [2Fe-2S] cluster and hands it on (the NFS1-ISD11-ACP
    desulfurase, the ISCU scaffold, frataxin, the FDX2 and FDXR electron supply, the
    HSPA9-HSCB chaperone pair, GLRX5) and a late group that fuses two [2Fe-2S] clusters
    into a [4Fe-4S] cluster and targets it (ISCA1, ISCA2, IBA57, NFU1, BOLA3). An early
    lesion can reach every client; a late lesion reaches the [4Fe-4S] clients only, and
    the [2Fe-2S] ones, ferrochelatase among them, are spared.
  role: trigger
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    modifier: DECREASED
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:21944046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "analysis of genes in this area identified mutations in two different genes, both of which are involved in"
    explanation: Two distinct assembly-factor genes produce the same syndrome, which is the observation this module is built on.
  - reference: PMID:28803783
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirm that NFU1, BOLA3, ISCA2 and IBA57 operate in the maturation of"
    explanation: Patient fibroblast profiling groups the late-acting factors together, which is the basis of the early and late division.
  downstream:
  - target: Reduced Nascent Cluster Supply
    causal_link_type: DIRECT
- name: Reduced Nascent Cluster Supply
  description: >
    The amount of assembled cluster available for transfer falls. For an early lesion
    this is a shortage of the nascent [2Fe-2S] cluster itself, from lost sulfur donation,
    a failed scaffold, or absent electron supply. For a late lesion the [2Fe-2S] clusters
    are made but cannot be fused and targeted, so the [4Fe-4S] supply alone falls. Either
    way the step after it is starved.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: "[4Fe-4S] cluster assembly"
    modifier: DECREASED
    term:
      id: GO:0044572
      label: "[4Fe-4S] cluster assembly"
  cellular_components:
  - preferred_term: iron-sulfur cluster assembly complex
    term:
      id: GO:1990229
      label: iron-sulfur cluster assembly complex
  evidence:
  - reference: PMID:20364084
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GLRX5 is essential for iron-sulfur cluster biosynthesis and the maintenance of normal mitochondrial and cytosolic iron homeostasis in human cells"
    explanation: Establishes that an early-group factor is required for cluster biosynthesis and for mitochondrial and cytosolic iron homeostasis.
  - reference: PMID:22323289
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our data suggest that ISCA1, ISCA2, and IBA57 are specifically involved in the maturation of mitochondrial"
    explanation: The late group acts on maturation specifically, which is why a late lesion restricts the shortfall to one cluster type.
  downstream:
  - target: Reduced Cluster Delivery to Client Apoproteins
    causal_link_type: DIRECT
- name: Reduced Cluster Delivery to Client Apoproteins
  description: >
    Client apoproteins do not receive their cofactor and remain immature. This is the key
    conformance target: the rate-limiting, disorder-agnostic step that every gene in the
    machinery funnels through, whatever its position in the pathway and whichever clients
    its disease happens to strike. A conforming node must place its disease's lesion
    inside the assembly machinery; a disease whose client enzymes fail for another reason
    conforms to the client-deficiency node below, not to this one.
  role: central_effector
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:22077971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that NFU1 functions as a late-acting maturation factor for a subset"
    explanation: Frames the lesion as a failure of client maturation, and notes that the affected set is a subset.
  - reference: PMID:29767723
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ISCA1 encodes a mitochondrial protein essential for the assembly of"
    explanation: States the delivery role whose failure this node represents.
  downstream:
  - target: Iron-Sulfur Dependent Enzyme Deficiency
    causal_link_type: DIRECT
  - target: Iron Regulatory Protein 1 Activation
    causal_link_type: DIRECT
- name: Iron-Sulfur Dependent Enzyme Deficiency
  description: >
    The umbrella consequence: enzymes that need an iron-sulfur cofactor lose activity.
    Which ones is gene-specific and tissue-specific, so this node is satisfied by at
    least one of the three branches below it and never by assumption. A conforming entry
    declares the branches its disease demonstrates.
  role: effector
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:23814038
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several other Fe-S proteins were also affected in both patients, including the aconitases and ferrochelatase."
    explanation: Several cofactor-dependent enzymes fail together in one patient, which is what this umbrella node records.
  - reference: PMID:23179554
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, subunits of other respiratory chain complexes were normal."
    explanation: The deficit is selective rather than global, which is why the branches below are declared individually.
  downstream:
  - target: Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
  - target: Mitochondrial Aconitase Deficiency
    causal_link_type: DIRECT
  - target: Lipoyl Synthase Failure
    causal_link_type: DIRECT
- name: Respiratory Chain Complex Deficiency
  description: >
    Complexes I, II and III carry iron-sulfur clusters and lose activity when delivery
    fails. The combination is gene-specific: complex I and II together for IBA57, mainly
    complex II for NFU1, mainly complex I for ISCA2, complexes I, II and III for FDX2 and
    LYRM4. Complex IV has no cluster, so its deficiency where reported is secondary. A
    conforming entry should state its own pattern rather than copying this list.
  role: consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  cellular_components:
  - preferred_term: respiratory chain complex
    term:
      id: GO:0098803
      label: respiratory chain complex
  evidence:
  - reference: PMID:24281368
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of enzyme activities of the five respiratory chain complexes in our patients' skeletal muscle showed severely impaired activities of iron sulfur (Fe-S)-dependent complexes I, II and III and mitochondrial aconitase."
    explanation: The cluster-dependent complexes and aconitase fail together in patient muscle, and the cluster-free complexes do not.
  - reference: PMID:23179554
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed complete absence of protein-bound lipoic acid and decreased SDHA and SDHB subunits of complex II"
    explanation: A gene-specific pattern, here complex II with the lipoylation branch, which is why the pattern is declared per conformer.
- name: Mitochondrial Aconitase Deficiency
  description: >
    Mitochondrial aconitase holds a [4Fe-4S] cluster, so it fails with the other clients
    and blocks the citric acid cycle. It is a useful branch to test in a conformer
    because its activity is restored when the assembly defect is corrected.
  role: consequence
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: aconitate hydratase activity
    modifier: DECREASED
    term:
      id: GO:0003994
      label: aconitate hydratase activity
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    modifier: DECREASED
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
  evidence:
  - reference: PMID:20364084
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reversed the mitochondrial iron overload, and increased aconitase activity"
    explanation: Restoring the assembly factor restores aconitase activity, which places the deficiency downstream of cluster delivery.
  - reference: PMID:22323289
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "including aconitase, respiratory complex I, and lipoic acid synthase, were diminished following depletion of the three proteins"
    explanation: Aconitase falls alongside the other cluster-dependent enzymes on depletion of late-group factors.
- name: Lipoyl Synthase Failure
  description: >
    Lipoyl synthase is a radical SAM enzyme whose [4Fe-4S] cluster is consumed to build
    the lipoyl cofactor, so it is among the most sensitive clients. Its failure is the
    branch that defines the multiple mitochondrial dysfunctions syndromes, and it has
    been shown for the late-acting factors and for GLRX5. It has not been demonstrated
    for the early-acting factors in the sources read here, which is a gap in the
    literature rather than evidence that they spare it.
  role: consequence
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: lipoate synthase activity
    modifier: DECREASED
    term:
      id: GO:0016992
      label: lipoate synthase activity
  evidence:
  - reference: PMID:22077971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical phenotype suggested an impaired activity of the Fe-S enzyme lipoic acid synthase (LAS)."
    explanation: Identifies lipoyl synthase as the affected client behind this branch.
  - reference: PMID:22077971
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon depletion of NFU1 by RNA interference in human cell culture, LAS and, in turn, PDHC activities were largely diminished."
    explanation: Depleting the assembly factor reproduces the lipoyl synthase and downstream dehydrogenase loss.
  downstream:
  - target: Loss of Protein Lipoylation
    causal_link_type: DIRECT
- name: Loss of Protein Lipoylation
  description: >
    Without lipoyl synthase the lipoyl arm is not attached, so the E2 subunits of
    pyruvate dehydrogenase, 2-oxoglutarate dehydrogenase and branched-chain ketoacid
    dehydrogenase, and the H protein of the glycine cleavage system, are all inactive.
    Protein-bound lipoic acid is measurable, which makes this the branch's diagnostic
    readout. It is tissue-selective: absent in fibroblasts, muscle and liver in one NFU1
    cohort while preserved in brain, kidney and lung.
  role: consequence
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein lipoylation
    modifier: DECREASED
    term:
      id: GO:0009249
      label: protein lipoylation
  evidence:
  - reference: PMID:24334290
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were deficient in lipoylation of mitochondrial proteins."
    explanation: Protein lipoylation is lost in patients across several genes of this pathway.
  - reference: PMID:23179554
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein lipoylation was also decreased in muscle and liver but not in other tissues available (brain, kidney, lung) from NFU1 patients."
    explanation: Establishes the tissue selectivity a conformer should expect rather than assume.
  downstream:
  - target: Combined 2-Oxoacid Dehydrogenase and Glycine Cleavage Failure
    causal_link_type: DIRECT
- name: Combined 2-Oxoacid Dehydrogenase and Glycine Cleavage Failure
  description: >
    Pyruvate dehydrogenase and 2-oxoglutarate dehydrogenase lose activity, blocking entry
    into and flux through the citric acid cycle, and the glycine cleavage system stops,
    so glycine accumulates. The paired result, lactic acidosis with hyperglycinemia, is
    what makes this branch recognisable at the bedside and is the basis of the variant
    nonketotic hyperglycinemia label.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: glycine decarboxylation via glycine cleavage system
    modifier: DECREASED
    term:
      id: GO:0019464
      label: glycine decarboxylation via glycine cleavage system
  cellular_components:
  - preferred_term: glycine cleavage complex
    term:
      id: GO:0005960
      label: glycine cleavage complex
  evidence:
  - reference: PMID:22077971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glycine cleavage system and pyruvate dehydrogenase complex (PDHC) activities were low."
    explanation: Both lipoate-dependent systems fail together in patients.
  - reference: PMID:22077971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperglycinemia and lactic acidosis were common findings."
    explanation: The paired biochemical signature of this branch.
- name: Iron Regulatory Protein 1 Activation
  description: >
    Cytosolic aconitase without its cluster becomes iron regulatory protein 1 and binds
    iron-responsive elements, so the cell misreads its iron status. This branch is
    OPTIONAL and must not be assumed: the protein-level activation was demonstrated for
    GLRX5 deficiency, and mitochondrial iron accumulation, which often travels with it,
    is reported absent in FDX2 patient muscle. A conformer declares this node only with
    its own evidence.
  role: compensation
  biological_scale: CELLULAR
  molecular_functions:
  - preferred_term: iron-responsive element binding
    modifier: INCREASED
    term:
      id: GO:0030350
      label: iron-responsive element binding
  biological_processes:
  - preferred_term: intracellular iron ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
  evidence:
  - reference: PMID:20364084
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the iron-responsive element-binding (IRE-binding) activity of iron regulatory protein 1 (IRP1) was activated, and increased IRP2 levels, indicative of relative cytosolic iron depletion, were observed together with mitochondrial iron overload"
    explanation: The direct demonstration of this branch, in GLRX5-deficient human cells.
  downstream:
  - target: Erythroid Heme Synthesis Block
    causal_link_type: DIRECT
- name: Erythroid Heme Synthesis Block
  description: >
    Iron regulatory protein 1 binds the iron-responsive element in the erythroid ALAS2
    message and represses its translation, so heme synthesis fails while iron keeps
    arriving at the erythroblast mitochondrion. The result is congenital sideroblastic
    anemia with ring sideroblasts. This branch is OPTIONAL and erythroid-specific; it is
    reported for GLRX5, HSPA9 and HSCB disease and is not part of the core chain.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: heme biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006783
      label: heme biosynthetic process
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:16110529
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that loss of Fe-S cluster assembly in sir animals activated IRP1 and blocked haem biosynthesis catalysed by aminolaevulinate synthase 2 (ALAS2)."
    explanation: The causal demonstration in zebrafish, where the step from cluster loss to the heme block runs through IRP1 and ALAS2.
  - reference: PMID:16110529
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of ALAS2 RNA without the 5' iron response element that binds IRP1 rescued sir embryos, whereas overexpression of ALAS2 including the iron response element did not."
    explanation: The element-free rescue is what establishes that the block is translational repression of ALAS2 rather than another effect.
  - reference: PMID:20364084
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Decreased aminolevulinate delta, synthase 2 (ALAS2) levels attributable to IRP-mediated translational repression were observed in erythroid cells"
    explanation: The same mechanism in human erythroid cells.
discussions:
- discussion_id: isc_module_branch_coverage_is_literature_not_biology
  prompt: >-
    For how many genes in this machinery is a client branch genuinely spared, as opposed
    to never having been measured?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Iron-Sulfur Dependent Enzyme Deficiency
  - pathophysiology#Lipoyl Synthase Failure
  rationale: >-
    The gene-to-branch table behind this module is mostly empty, and the emptiness is
    uninformative. Lipoylation loss is documented for the late-acting factors and for
    GLRX5 and has not been looked for in most of the early-acting ones; aconitase is
    measured for some genes and not others. A conformance check that treats an
    unmeasured branch as a spared one would report false disagreement between a module
    node and a conforming disease, and a curator reading the table backwards could
    conclude that the early and late groups differ in a way no one has tested. The
    module therefore requires a conformer to declare the branches its disease
    demonstrates, rather than inheriting the full set, and this gap is why.
  evidence:
  - reference: PMID:28803783
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we present the biochemical profiles of several key mitochondrial"
    explanation: The one study that profiles the same marker enzymes across several genes of this pathway on one platform, which is the design the gap calls for at larger scale.
  proposed_experiments:
  - experiment_id: isc_uniform_client_panel
    name: One-platform client enzyme panel across the assembly machinery
    experiment_design: DESCRIPTIVE_PROFILING
    executability: SPECIFIED
    description: >-
      In isogenic human cells carrying a knockout or patient allele for each factor of the
      machinery in turn, measure the same panel in every line: complex I, II and III
      activity and subunit levels, mitochondrial and cytosolic aconitase activity,
      protein-bound lipoic acid, lipoyl synthase level, iron regulatory protein 1
      RNA-binding activity and mitochondrial iron, with an erythroid differentiation arm
      for the heme readouts.
    would_support:
    - pathophysiology#Iron-Sulfur Dependent Enzyme Deficiency
    supporting_outcome:
    - A filled gene-by-branch matrix in which the branches track position in the pathway, early versus late, rather than varying gene by gene
    refuting_outcome:
    - Branch involvement that does not follow pathway position, which would mean each factor has client preferences of its own and that the early and late division is the wrong organising axis for this module
- discussion_id: isc_module_iron_accumulation_optionality
  prompt: >-
    Why does mitochondrial iron accumulate in some assembly defects and not others, when
    the upstream lesion is the same kind of failure?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Iron Regulatory Protein 1 Activation
  rationale: >-
    Mitochondrial iron overload is a prominent feature of frataxin, ISCU and GLRX5
    disease and is reported absent in FDX2 patient muscle, which is why this module marks
    the node optional rather than core. Three explanations compete and none is excluded:
    the position of the lesion in the pathway determines whether iron is imported and
    then stranded or never requested; the degree of residual function matters, with
    accumulation needing a deeper deficit than the enzyme loss does; or the readout is
    tissue-specific and the negative result reflects the tissue sampled rather than the
    gene. Settling it would turn an optional node into a predictable one, which matters
    because iron accumulation is the feature most likely to be treatable.
  evidence:
  - reference: PMID:20364084
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rescue of patient fibroblasts with the WT GLRX5 gene by transfection or viral transduction reversed a slow growth phenotype, reversed the mitochondrial iron overload"
    explanation: Iron overload is a reversible consequence of the assembly defect in one gene, which makes its absence in another the thing needing explanation.
  - reference: PMID:24281368
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed severely impaired activities of iron sulfur (Fe-S)-dependent complexes I, II and III and mitochondrial aconitase"
    explanation: The FDX2 patient has the full enzyme deficit, so an absent iron accumulation in that disease cannot be attributed to a mild lesion.
  proposed_experiments:
  - experiment_id: isc_iron_timecourse
    name: Matched iron and enzyme time course across early and late lesions
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      Using inducible knockdown of an early factor and a late factor in the same cell
      background, follow mitochondrial iron, iron regulatory protein 1 RNA-binding
      activity and client enzyme activity together over time at graded knockdown depths,
      in both a glycolytic and an oxidative growth condition.
    would_support:
    - pathophysiology#Iron Regulatory Protein 1 Activation
    supporting_outcome:
    - Iron accumulation appearing only below a knockdown depth at which the enzyme deficit is already complete, which would make it a threshold phenomenon rather than a gene-specific one
    refuting_outcome:
    - Iron accumulation tracking the lesion's position in the pathway at every depth, which would make it predictable from the gene and allow the node to be made core for one group
- discussion_id: isc_module_boundary_with_cytosolic_assembly
  prompt: >-
    Should the cytosolic assembly and export diseases be a sibling module, and where does
    the boundary lie when a mitochondrial lesion starves the cytosol too?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Cluster Delivery to Client Apoproteins
  - pathophysiology#Iron Regulatory Protein 1 Activation
  rationale: >-
    This module excludes ABCB7, CIAO1 and MMS19 disease on the ground that the
    mitochondrial machinery is intact in them. The exclusion is clean for CIAO1, where
    the mitochondrial ISC proteins, mitochondrial aconitase and cellular iron regulation
    are all explicitly normal. It is less clean conceptually for ABCB7, which is a
    mitochondrial inner-membrane protein whose failure is nevertheless a cytosolic supply
    problem, and it is genuinely blurred in the other direction: an early mitochondrial
    lesion starves the cytosolic pathway as well, so a conformer may show cytosolic
    client loss without that being a second disease. The practical question for curation
    is whether to write a sibling module for the cytosolic pathway, with the export step
    as its trigger, and have the two modules share the iron regulatory protein 1 node, or
    to leave the cytosolic diseases unconformed. Three dismech entries are affected:
    X-Linked Sideroblastic Anemia With Ataxia and Multiple Mitochondrial Dysfunctions
    Syndrome 10 conform to no module today, and the latter's own notes record why.
  evidence:
  - reference: PMID:11050011
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the expression of mutated ABC7 (E433K) or Atm1p (D398K) proteins in Deltaatm1 cells led to a low efficiency of cytosolic Fe/S protein maturation"
    explanation: The ABCB7 lesion is specifically a cytosolic maturation defect, which is the basis of its exclusion from this module.
  - reference: PMID:38950322
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cytosolic aconitase 1 (ACO1, also known as IRP1) activity was unaltered in P1-derived lysates compared with parental cell lysates"
    explanation: In cytosolic-pathway disease even the iron-sensing node of this module is spared, which makes the exclusion a mechanistic judgement rather than a filing convention.

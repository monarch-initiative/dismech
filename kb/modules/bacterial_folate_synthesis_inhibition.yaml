name: Bacterial Folate Synthesis Inhibition Module
description: >-
  A conserved antibacterial drug-mechanism module representing the bacterial
  de novo tetrahydrofolate (THF) biosynthesis pathway, which bacteria must build
  themselves because — unlike humans — they cannot take up preformed folate from
  the diet. Two sequential enzymes are antibacterial targets: dihydropteroate
  synthase (DHPS), inhibited by the sulfonamides (sulfamethoxazole, dapsone), and
  dihydrofolate reductase (DHFR), inhibited by trimethoprim. Blocking THF
  synthesis starves the cell of the one-carbon donors needed for nucleotide and
  amino-acid synthesis. Combining a DHPS inhibitor with a DHFR inhibitor
  (co-trimoxazole = trimethoprim-sulfamethoxazole) produces sequential blockade
  with synergistic, bactericidal activity. DHPS is unique to prokaryotes, giving
  selectivity. This module defines the mechanism-of-action design pattern for
  antifolate treatments: conforming entries link a treatment to the DHPS/DHFR
  target via target_mechanisms. Of the one-carbon deficits the blockade creates,
  the consequence node scopes the module to the thymidylate arm, because that is
  the one shown to be lethal rather than growth-limiting — and it records that
  how thymine starvation kills is still an open question, so a conforming entry
  should not assert a mechanism for it.
category: Module
module_categories:
- PHARMACOLOGY
- INFECTIOUS_DISEASE
creation_date: "2026-06-20T00:00:00Z"
notes: >-
  Antibacterial drug-mechanism module, not a specific disease. Disorder entries
  reference nodes via conforms_to (e.g.,
  "bacterial_folate_synthesis_inhibition#Bacterial Tetrahydrofolate Synthesis
  (Antifolate Target)"), and their sulfonamide/trimethoprim/dapsone treatments
  point at that node via target_mechanisms. Key conformance / treatment target:
  "Bacterial Tetrahydrofolate Synthesis (Antifolate Target)". Dapsone is a DHPS
  inhibitor and conforms here (e.g. leprosy). Nodes are druggable steps, not
  individual drugs.
pathophysiology:
- name: Bacterial Tetrahydrofolate Synthesis (Antifolate Target)
  description: >-
    Bacteria synthesize tetrahydrofolate (THF) de novo because they cannot import
    preformed folate. Two sequential enzymes are drug targets: dihydropteroate
    synthase (DHPS), the target of the sulfonamides (sulfamethoxazole) and the
    sulfone dapsone, and dihydrofolate reductase (DHFR), the target of
    trimethoprim. THF supplies the one-carbon units required for thymidine, purine,
    and methionine synthesis, so blocking the pathway halts nucleic-acid and
    protein synthesis. DHPS is unique to prokaryotes, which gives sulfonamides
    their selectivity; co-trimoxazole combines DHPS and DHFR inhibition for
    synergistic sequential blockade.
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: Tetrahydrofolate Biosynthetic Process
    term:
      id: GO:0046654
      label: tetrahydrofolate biosynthetic process
  evidence:
  - reference: PMID:23627736
    reference_title: "Sulfa and trimethoprim-like drugs - antimetabolites acting as carbonic anhydrase, dihydropteroate synthase and dihydrofolate reductase inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The other two enzyme families are involved in the synthesis of
      tetrahydrofolate (THF), i.e. dihydropteroate synthase (DHPS) and
      dihydrofolate reductase.
    explanation: >-
      Review establishing DHPS and DHFR in tetrahydrofolate synthesis as the
      sulfonamide and trimethoprim targets this node represents. Evidence source
      is OTHER as this is a review article.
  - reference: PMID:27025730
    reference_title: "Utility of the Biosynthetic Folate Pathway for Targets in Antimicrobial Discovery."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An additional anti-folate target is dihyropteroate synthase (DHPS), which
      is unique to prokaryotes as they cannot acquire folate through dietary
      means.
    explanation: >-
      Supports the prokaryote-specific DHPS target and the selectivity basis noted
      in this node. Evidence source is OTHER as this is a review article.
  downstream:
  - target: Thymidylate Starvation and Thymineless Death
    description: >-
      Of the one-carbon products this pathway supplies, it is the loss of dTTP
      that is lethal rather than merely growth-limiting, so thymidylate
      starvation is the arm that makes the blockade bactericidal.
  - target: Antifolate Target Resistance
    description: >-
      Drug-insensitive DHPS/DHFR variants protect the pathway, escaping antifolate
      therapy.

- name: Thymidylate Starvation and Thymineless Death
  description: >-
    Blocking tetrahydrofolate supply starves thymidylate synthase of its
    one-carbon donor, so the cell replicates without dTTP. The consequence is
    not simple arrest: a thymine-starved bacterium loses viability, and the same
    outcome is produced genetically by denying a thyA mutant thymidine or
    pharmacologically by treating a wild-type cell with trimethoprim. That
    equivalence is what licenses treating this node as the antifolates' killing
    step rather than as one of several interchangeable one-carbon deficits. The
    mechanism connecting thymine starvation to death is, after seven decades,
    still not settled — stalled replication forks, uracil misincorporation from
    a skewed nucleotide pool, and origin-proximal chromosome degradation are all
    documented, and the oxidative-damage explanation proposed most recently has
    been tested and rejected. This node therefore records a well-measured
    phenomenon with an open mechanism, which is the honest state of the field
    and not a gap in this module's curation.
  role: consequence
  biological_processes:
  - preferred_term: dTMP biosynthetic process
    term:
      id: GO:0006231
      label: dTMP biosynthetic process
    modifier: DECREASED
  - preferred_term: Chromosomal DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: DECREASED
  evidence:
  - reference: PMID:34633866
    reference_title: "Oxidative Damage Blocks Thymineless Death and Trimethoprim Poisoning in Escherichia coli."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      In Escherichia coli, thymineless death is caused either by denying thyA
      mutants thymidine supplementation or by treating wild-type cells with
      trimethoprim.
    explanation: >-
      States the pharmacological-genetic equivalence this node rests on: the
      antifolate reproduces the thyA-mutant phenotype, so thymidylate starvation
      is the operative deficit. Taken from the paper's framing of established
      fact rather than from its own result, hence BACKGROUND; graded IN_VITRO as
      the system is bacterial culture.
  - reference: PMID:26253395
    reference_title: "Thymineless Death Lives On: New Insights into a Classic Phenomenon."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early research focused on stalled replication forks and the deleterious
      effects of uracil incorporation into DNA from thymidine-deficient
      nucleotide pools.
    explanation: >-
      Names two of the candidate mechanisms this node lists. Graded OTHER as the
      source is a review synthesising work it did not perform.
  - reference: PMID:26253395
    reference_title: "Thymineless Death Lives On: New Insights into a Classic Phenomenon."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The initiation of the replication cycle and origin-proximal DNA
      degradation during thymine starvation have now been quantified via
      whole-genome microarrays and other approaches.
    explanation: >-
      Supports the third documented candidate, origin-proximal chromosome
      degradation, and establishes that it has been measured rather than
      inferred.
  - reference: PMID:34633866
    reference_title: "Oxidative Damage Blocks Thymineless Death and Trimethoprim Poisoning in Escherichia coli."
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thus, oxidative damage does not contribute to thymineless death, while the
      latter remains enigmatic.
    explanation: >-
      Refutes the oxidative-damage mechanism for this node, which matters because
      the sibling quinolone module does invoke reactive oxygen downstream of DNA
      breakage. Recorded as REFUTE against that specific mechanistic account, not
      against the node itself.
  downstream:
  - target: Antifolate Target Resistance
    description: >-
      A drug-insensitive target keeps tetrahydrofolate flowing, so thymidylate
      pools never fall and this node is not reached.

- name: Antifolate Target Resistance
  description: >-
    Resistance to antifolates is mainly due to horizontal acquisition of genes
    encoding drug-insensitive variants of the target enzymes — alternative
    dihydropteroate synthase (sul genes) and dihydrofolate reductase (dfr genes) —
    and to chromosomal target mutations. This is a common cause of co-trimoxazole
    failure and shapes its use in susceptibility-guided therapy.
  role: adaptive_escape
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:25435309
    reference_title: "Molecular mechanisms of antibiotic resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      changes in the structure and protection of antibiotic targets and the
      direct modification or inactivation of antibiotics.
    explanation: >-
      General review of resistance mechanisms including target alteration —
      here drug-insensitive DHPS/DHFR variants. Evidence source is OTHER as this
      is a review article.

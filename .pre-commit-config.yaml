---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      # Generated schema docs and checksum-addressed hypothesis artifacts are
      # excluded from whitespace fixers. Both are verified byte-for-byte, so a
      # hook rewrite invalidates the generated output or its manifest. Fix the
      # generator/provider output at its source, not the committed copy.
      - id: end-of-file-fixer
        exclude: &generated_or_immutable ^(docs/schema|elements|kb/hypotheses/.+_artifacts)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated_or_immutable

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        name: yamlfix (curation yaml)
        args: [-c, .yamlfix.toml]
        files: ^kb/(disorders|modules)/.+\.ya?ml$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words=.codespell-ignore-words.txt]
        exclude: ^kb/hypotheses/.+_artifacts/
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: &immutable_hypothesis_artifacts ^kb/hypotheses/.+_artifacts/
      # Run the formatter.
      - id: ruff-format
        exclude: *immutable_hypothesis_artifacts

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock

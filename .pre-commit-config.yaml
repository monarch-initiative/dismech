---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      # Generated schema docs are excluded from the whitespace fixers. They are
      # committed AND verified byte-for-byte against a fresh `just
      # gen-schema-docs` by the deploy-docs workflow, so a hook that rewrites
      # them on commit guarantees that check can never pass: LinkML's docgen
      # emits trailing whitespace ("# Class: Foo "), the fixer strips it, and
      # the committed copy then differs from anything the generator produces.
      # Fix the generator, not its output.
      - id: end-of-file-fixer
        exclude: &generated_docs ^(docs/schema|elements)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated_docs

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        name: yamlfix (curation yaml)
        args: [-c, .yamlfix.toml]
        files: ^kb/(disorders|modules)/.+\.ya?ml$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words=.codespell-ignore-words.txt]
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock

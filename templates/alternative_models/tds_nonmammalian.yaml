# Use case 1: non-mammalian models of androgen signalling for Testicular Dysgenesis Syndrome.
#
# This reproduces the run behind
# research/Testicular_Dysgenesis_Syndrome-nonmammalian-androgen-models-deep-research-openscientist.md,
# which used the earlier one-off template
# templates/disease_nonmammalian_models_research.md. That file is kept unchanged
# because the committed report pins it by template_sha; this is its reusable form.
entry: Testicular_Dysgenesis_Syndrome
disease_name: Testicular Dysgenesis Syndrome
mondo_id: MONDO:0005437

model_scope: >-
  Non-mammalian animals only: teleost fish, elasmobranchs, amphibians, reptiles, birds, and
  invertebrates with an androgen-receptor-like system. Mammalian models (rodent, lagomorph,
  ungulate, primate, marsupial) are out of scope, including ones not yet curated.

nodes_of_interest: |-
  - Common Early Disruption of Testis Lineage Specification
  - Deficient Androgen Action in the Masculinization Programming Window
  - Incomplete Reproductive Tract Masculinization

substitution_constraint: |-
  Several of these nodes are defined in mammal-specific terms. The gubernaculum, prostate,
  seminal vesicle, penile urethra, anogenital distance and trans-abdominal testicular descent
  have no counterpart outside mammals. The masculinization programming window is a window of
  androgen action on reproductive-tract target tissues *after* gonadal sex is already fixed, so
  it may have no analogue in a taxon whose gonadal sex is set by temperature, by a different
  genetic switch, or is environmentally labile.

  Sex determination is not androgen-dependent in most non-mammalian taxa. State, for each
  candidate, what determines sex in that taxon and whether androgen acts upstream or downstream
  of that decision, because a taxon in which androgen *determines* sex has the opposite
  architecture to the mammalian case and cannot stand in for it.

  A report that proposes a fish model for "Incomplete Reproductive Tract Masculinization" without
  stating that fish have no prostate, seminal vesicle or penile urethra has failed this brief.

systems_to_cover: |-
  - **Teleost androgen receptor genetics.** Zebrafish `ar` mutants; medaka `ar` ohnolog mutants;
    tilapia; cichlid AR paralogs. Critically: does loss of AR prevent testis formation at all, or
    only later androgen-dependent features? That distinction decides whether such a model touches
    the lineage-specification node or only the androgen-action node.
  - **Teleost somatic gonad lineage specification.** `gsdf`, `dmrt1` (and medaka `dmy`/`dmrt1bY`),
    `amh`, `amhrII`, `sox9`, `nr5a1`/`ff1`, `wt1`, `foxl2`, `cyp17a1`, `cyp11c1`. Which mutants
    produce a disorganised or mixed-lineage gonad rather than clean sex reversal? A mixed-lineage
    lesion is the closest non-mammalian analogue of focal dysgenesis.
  - **Androgen-dependent structures used as regulatory assays.** Three-spined stickleback spiggin;
    medaka anal-fin papillary processes; fathead minnow nuptial tubercles; poeciliid gonopodium.
    Give the OECD test guideline or guidance document number where one exists.
  - **Elasmobranch claspers.** Androgen dependence of clasper development, if primary literature
    exists.
  - **Amphibian.** Xenopus laevis and tropicalis androgen receptor function; any AR knockout or
    knockdown in any anuran; nuptial pads; larynx; OECD LAGDA (TG 241).
  - **Reptilian.** American alligator — the Lake Apopka work on phallus size, plasma testosterone
    and gonad morphology, and any controlled in-ovo exposure study. Distinguish controlled models
    from correlational contaminated-population studies.
  - **Avian.** Androgen dependence, or independence, of phallus development, including the
    chicken-versus-duck phallus reduction work; in-ovo exposure models in quail and chicken.
  - **Endocrine-disrupting chemical exposure in non-mammals.** Where testis-ova or intersex gonads
    are reported, state whether the mechanism was traced to somatic lineage specification or only
    to circulating steroid levels.
  - **Conserved developmental windows.** Does any non-mammalian taxon have a described discrete
    window of androgen-dependent or gonadal-sex lability, and how does it compare to the
    mammalian masculinization programming window?

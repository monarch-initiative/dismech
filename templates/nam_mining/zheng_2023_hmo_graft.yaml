# Use case 1: the hiPSC midbrain organoid grafted into a 6-OHDA-lesioned mouse
# striatum (dismech#17532). Extracted from the hand-written prompt of the
# committed run (job b8325c9a-3d33-46bb-92c7-c4e694364103), so re-running this
# slug reproduces it. That run produced
# research/Parkinsons_Disease_hMO_Graft_PMID37215566-deep-research-openscientist.md,
# PR #17536, and nams-registry#91.
entry: Parkinsons_Disease

reference: >-
  PMID:37215566; DOI 10.7150/thno.80271; PMC10196819; Theranostics
  2023;13(8):2673-2692.

access: >-
  Open access, with PMC full text. The full text is quotable, so a claim
  supported only by the full text is still usable — say which.

paper_summary: >-
  The paper transplants human induced pluripotent stem cell (hiPSC)-derived
  midbrain organoids (hMOs) into a unilateral 6-OHDA-lesioned mouse striatum,
  as a cell therapy. The organoids are from healthy hiPSC lines and carry no
  Parkinson's disease (PD) genotype; the dopaminergic insult is in the host,
  from 6-OHDA.

systems: |-
  1. **hMO** — the hiPSC-derived human midbrain organoid, on its own, in vitro.
  2. **6-OHDA mouse** — the unilateral 6-OHDA-lesioned mouse, before or without
     a graft.
  3. **Grafted chimera** — the hMO transplanted into the 6-OHDA mouse striatum
     (graft and host together).

candidate_nodes: |-
  - **Dopaminergic Neuron Loss** — the A9 nigral dopaminergic population whose
    loss defines PD.
  - **Striatal Dopamine Deficiency** — striatal dopamine content and release.
  - **Basal Ganglia Circuit Dysfunction** — nigrostriatal and basal-ganglia
    circuit function, and motor output.
  - **Neuroinflammation** — striatal inflammatory state (e.g. IL-1beta, IL-6).
  - **Oxidative Stress** — striatal oxidative and antioxidant state (e.g. Nrf2,
    Hmox1/HO-1).

  These are nodes in the PD entry. A module also carries "Nigrostriatal
  Dopaminergic Neurodegeneration" and "Striatal Dopamine Deficiency and Basal
  Ganglia Circuit Dysfunction", which may fit the 6-OHDA lesion better. Note
  where that is so.

anchors_to_avoid: >-
  None identified for this paper. The risk here is the opposite one: attributing
  a host readout to the organoid. The neuroinflammation and oxidative-stress
  measurements are made in the host striatum after grafting, so they belong to
  the grafted chimera, not to the hMO.

claims_to_verify: |-
  - Day 15 is the optimal transplantation stage; day 10 organoids survive but
    yield few TH+ cells, and day 25 grafts largely die.
  - At 12 weeks post-graft, 14.11% of surviving human (hNA+) cells are TH+, and
    over 90% of GIRK2+ cells are TH+ (read by the authors as A9 midbrain
    dopaminergic identity).
  - Grafted mice improve on apomorphine-induced rotation, open field and
    rotarod; the vehicle group does not.
  - No teratoma or graft overgrowth (teratoma assay with a neuroblastoma
    positive control).
  - Striatal IL-1beta and IL-6 mRNA fall ~7.85-fold and ~36.66-fold in grafted
    versus control mice; Nrf2 and Hmox1 rise ~1.2-fold and ~3.6-fold.
  - The hMOs express dopamine (HPLC after high-K+), show network-wide
    synchronous bursts (MED64, day 60), contain neuromelanin (Fontana-Masson,
    day 45), and carry **no** serotonergic, GABAergic, glutamatergic or
    cholinergic markers (the authors tie the absence to a lower graft-induced
    dyskinesia risk).
  - Quercetin removes >99.99% of residual undifferentiated hiPSCs at >=40 uM for
    >=16 h.
  - Whole-cell patch clamp shows graft neurons fire; G-deleted rabies tracing
    shows host-to-graft presynaptic input.

does_not_model: |-
  - The hMO and graft carry **no PD genotype** and show **no alpha-synuclein
    pathology** and **no progressive degeneration within the organoid itself**
    — so neither models PD aetiology or the degenerative process. They model
    the *dopaminergic cell population and its functions*, and the *restoration*
    of host deficits.
  - The 6-OHDA lesion is an acute neurotoxin insult, not the slow
    synucleinopathy of idiopathic PD — a construct-validity caveat for the
    "Dopaminergic Neuron Loss" link.
  - Neuroinflammation and Oxidative Stress changes are in the **host striatum
    after grafting**, not properties of the organoid — attribute them to the
    grafted-chimera and 6-OHDA-host system, not to the hMO.

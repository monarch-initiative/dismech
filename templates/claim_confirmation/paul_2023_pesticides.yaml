# Use case 1: the 288-pesticide screen behind the Parkinson's golf-course
# exposures (dismech#15601). Extracted verbatim from the template_variables
# frontmatter of the committed run, so re-running this slug reproduces it.
entry: Parkinsons_Disease
source_citation: Paul et al. 2023, Nature Communications 14:2803 (PMID:37193692, doi:10.1038/s41467-023-38215-z)
context: The source pairs a 288-pesticide record-based epidemiological screen in the Parkinson's
  Environment and Genes (PEG) case-control study (829 PD cases, 824 controls, central California)
  with a toxicity screen of 39 of those pesticides in human iPSC-derived midbrain dopaminergic
  neurons, then follows one hit, the herbicide trifluralin, to a measured mitochondrial lesion.
  The claims below were recomputed from the paper's deposited source data, so the numbers
  may differ slightly from the published text. Independence excludes the same authors' companion
  analyses of the same PEG cohort.
claims: "1. Record-based pesticide exposure assessment (California Pesticide Use Report\n\
  \   application records + land-use maps in a GIS model, average pounds per acre per\n  \
  \ year within a 500 m buffer of residential and workplace addresses) identifies many\n \
  \  individual pesticides associated with Parkinson's disease: of 288 pesticides tested,\n\
  \   25 at FDR <= 0.01 and 53 at FDR <= 0.05. Cholinesterase inhibitors are enriched as\n\
  \   a class (OR 3.62, 95% CI 1.73-7.50), 19 of 50 associated.\n\n2. The strongest individual\
  \ associations are sodium chlorate (OR 1.236, 1.143-1.338),\n   dicofol (1.233, 1.138-1.336),\
  \ prometryn (1.236, 1.137-1.344), methomyl (1.204,\n   1.112-1.305) and xylene-range aromatic\
  \ solvent (1.199, 1.104-1.301). Note: the\n   exposure unit behind these odds ratios is\
  \ not established; report what unit the\n   independent literature uses for comparable pesticide-PD\
  \ odds ratios.\n\n3. The herbicide trifluralin is associated with Parkinson's disease risk\
  \ (OR 1.152,\n   95% CI 1.065-1.247) in record-based exposure assessment.\n\n4. Nine pesticides\
  \ are toxic to human iPSC-derived midbrain dopaminergic neurons at\n   6-30 uM, measured\
  \ as live TH+ neuron count at day 11: propargite, copper sulfate,\n   dicofol, folpet, naled,\
  \ endothall, trifluralin, endosulfan and diquat dibromide.\n   Propargite is the most potent.\n\
  \n5. This dopaminergic toxicity is selective rather than general cytotoxicity: five of\n\
  \   the ten toxic entries showed no substantial toxicity in a cardiomyocyte\n   counter-screen,\
  \ and the hits reproduce in an isogenic line with SNCA corrected to\n   two wild-type copies,\
  \ so toxicity does not depend on an alpha-synuclein background.\n\n6. Trifluralin at 30\
  \ uM for 24 h preferentially depletes respiratory chain subunits of\n   complex I (NDUFB8,\
  \ to 49% of control) and complex IV (COX II, to 58% of control) in\n   human iPSC-derived\
  \ dopaminergic neurons. Subunits of complexes II, III and V also\n   fall, by 12-35%, so\
  \ the preferential claim is about degree, not sparing.\n\n7. Trifluralin causes a dose-dependent\
  \ loss of spare (reserve) respiratory capacity in\n   human iPSC-derived dopaminergic neurons\
  \ - to 74%, 26% and 9% of DMSO control at 30,\n   60 and 90 uM over 6 h - while ATP production\
  \ is maintained at or slightly above\n   control at every dose.\n\n8. Trifluralin at 6 uM\
  \ for 14 days does not change phospho-S129 alpha-synuclein in\n   human iPSC-derived dopaminergic\
  \ neurons, although trifluralin has been reported to\n   promote alpha-synuclein fibril\
  \ formation in a cell-free system.\n\n9. Trifluralin and tribufos together at 10 uM are\
  \ supra-additive for dopaminergic\n   neuron loss: 65% decrease for the pair against 32%\
  \ for trifluralin alone and 8% for\n   tribufos alone.\n\n10. Ziram at 300 nM does not alter\
  \ oxygen consumption rate in dopaminergic neurons,\n    consistent with it acting on proteasome\
  \ E1 ligase rather than on respiration.\n\n11. Disruption of mitochondrial complex I is\
  \ by itself sufficient to cause progressive\n    parkinsonism (asserted on the basis of\
  \ mouse work, PMID:34732887). This claim is\n    the proposed anchor for a complex I mechanism\
  \ node, so it needs the most scrutiny:\n    confirm or contradict it independently, and\
  \ state whether the evidence is human."

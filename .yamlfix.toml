# Preserve the current disorder/module YAML layout to avoid large reflow-only diffs.
# `yamllint` still carries the stricter 80-column warning for human review.
line_length = 1200
explicit_start = false
preserve_quotes = true
sequence_style = "keep_style"
indent_mapping = 2
indent_sequence = 2
indent_offset = 0
whitelines = 1
# yamlfix 1.19.1 applies comment regexes to block-scalar prose (#12101).
# These disable both spacing rewrites globally; yamllint still checks comments.
# Boolean rewriting has no config switch: the hook also checks parsed data
# before writing (scripts/yamlfix_safe.py).
comments_min_spaces_from_content = 0
comments_require_starting_space = false
